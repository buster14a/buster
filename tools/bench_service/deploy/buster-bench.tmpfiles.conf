# Fixed installation layout. The privileged installer verifies every existing
# path before invoking tmpfiles, so this file never silently repairs drift.
d /var/lib/buster-bench 0710 root buster-bench-candidate -
d /var/lib/buster-bench/queue 0700 buster-bench buster-bench -
d /var/lib/buster-bench/lease 0710 root buster-bench -
d /var/lib/buster-bench/workspaces 2710 buster-bench buster-bench-candidate -
d /var/lib/buster-bench/verification 0700 buster-bench buster-bench -
d /opt/buster-bench 0755 root root -
d /opt/buster-bench/installed 0550 root buster-bench -
d /opt/buster-bench/installed/recipes 0550 root buster-bench -
d /etc/buster-bench 0755 root root -
# host.lock is deliberately absent: install_9700x.py creates it exactly once
# with O_EXCL, records its device/inode, and never unlinks or replaces it.
