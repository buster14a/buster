# Type Name ID GECOS Home Shell
g buster-bench -
g buster-bench-candidate -
g buster-bench-dispatch -
g buster-bench-admin -
u buster-bench - "Buster benchmark service" /var/lib/buster-bench /usr/sbin/nologin
u buster-bench-candidate - "Buster benchmark candidate" /var/empty /usr/sbin/nologin
# The trusted service needs read/execute traversal of candidate-owned staging.
m buster-bench buster-bench-candidate
