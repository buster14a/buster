name: CI UNIX pipeline
description: CI UNIX pipeline to be run on Linux and MacOS

BUSTER_CI: ON

inputs:
runs:
  using: composite
  steps:
    - name: Test
      shell: bash
      env:
        BUSTER_CC: clang
        BUSTER_FUZZ: OFF
        BUSTER_UNITY_BUILD: OFF
        BUSTER_OPTIMIZE: OFF
        BUSTER_SANITIZE: OFF
      run: |
        ci/unix.sh
