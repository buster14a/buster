name: CI Windows pipeline

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute the Windows pipeline on
        required: true
        type: string
      os:
        description: Operating system
        required: true
        type: string

jobs:
  test:
    name: ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache Visual Studio environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPath = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $VsPath) { throw 'Visual Studio with VC tools was not found' }

          $BeforeEnvironment = @{}
          Get-ChildItem Env: | ForEach-Object { $BeforeEnvironment[$_.Name] = $_.Value }

          $VsDevShell = Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1'
          & $VsDevShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          where.exe cl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $EnvironmentNames = [System.Collections.Generic.SortedSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($Item in Get-ChildItem Env:) {
            if (-not $BeforeEnvironment.ContainsKey($Item.Name) -or $BeforeEnvironment[$Item.Name] -ne $Item.Value) {
              [void]$EnvironmentNames.Add($Item.Name)
            }
          }

          foreach ($Name in @(
            'Path',
            'INCLUDE',
            'LIB',
            'LIBPATH',
            'UCRTVersion',
            'UniversalCRTSdkDir',
            'VCINSTALLDIR',
            'VCToolsInstallDir',
            'VCToolsRedistDir',
            'VCToolsVersion',
            'VSINSTALLDIR',
            'VisualStudioVersion',
            'WindowsLibPath',
            'WindowsSdkBinPath',
            'WindowsSdkDir',
            'WindowsSDKLibVersion',
            'WindowsSDKVersion'
          )) {
            if (Test-Path "Env:$Name") {
              [void]$EnvironmentNames.Add($Name)
            }
          }

          foreach ($Name in $EnvironmentNames) {
            $Value = (Get-Item "Env:$Name").Value
            "$Name=$Value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            if ($Name -ieq 'Path') {
              "BUSTER_VISUAL_STUDIO_PATH=$Value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

          Write-Host $env:PATH
      - name: Generations
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $GenerateConfigurations = [System.Collections.Generic.List[object]]::new()
          $BuildPrefix = if ($env:BUSTER_BUILD_DIRECTORY_PREFIX) { $env:BUSTER_BUILD_DIRECTORY_PREFIX } else { 'build_ci-' }
          $VisualStudioPath = $env:PATH
          $ClangRuntimeDirectory = $null

          function Use-ClangRuntimePath {
            if (-not $script:ClangRuntimeDirectory) {
              $ClangResourceDirectory = & clang -print-resource-dir
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $script:ClangRuntimeDirectory = Join-Path $ClangResourceDirectory 'lib\windows'
              if (-not (Test-Path $script:ClangRuntimeDirectory)) {
                throw "Clang Windows runtime directory was not found: $script:ClangRuntimeDirectory"
              }
            }

            $env:PATH = "$script:ClangRuntimeDirectory;$VisualStudioPath"
          }

          function Add-Generation {
            param(
              [string]$BusterCc,
              [string]$BusterFuzz,
              [string]$BusterSanitize
            )

            $BusterCcDirectory = $BusterCc -replace '[^A-Za-z0-9_.-]', '_'
            [void]$GenerateConfigurations.Add([pscustomobject]@{
              Cc = $BusterCc
              Fuzz = $BusterFuzz
              Sanitize = $BusterSanitize
              Directory = "${BuildPrefix}cc_${BusterCcDirectory}-sanitize_${BusterSanitize}-fuzz_${BusterFuzz}"
            })
          }

          #               COMPILER    FUZZ        SANITIZE
          Add-Generation  cl          OFF         OFF
          Add-Generation  cl          OFF         ON
          Add-Generation  cl          ON          OFF
          Add-Generation  cl          ON          ON
          Add-Generation  clang       OFF         OFF
          Add-Generation  clang       OFF         ON
          Add-Generation  clang       ON          OFF
          Add-Generation  clang       ON          ON
          Add-Generation  gcc         OFF         OFF
          Add-Generation  tcc         OFF         OFF
          Add-Generation  zig         OFF         OFF
          Add-Generation  zig         OFF         ON

          foreach ($Configuration in $GenerateConfigurations) {
            if ($Configuration.Cc -match 'clang' -and $Configuration.Sanitize -eq 'ON') {
              Use-ClangRuntimePath
            }
            else {
              $env:PATH = $VisualStudioPath
            }

            Write-Host "Generate (compiler=$($Configuration.Cc) fuzz=$($Configuration.Fuzz.ToLowerInvariant()) sanitize=$($Configuration.Sanitize.ToLowerInvariant()))"
            $GenerateArguments = @(
              '.\generate.py',
              '--build-directory', $Configuration.Directory,
              '--ci', 'ON',
              '--cc', $Configuration.Cc,
              '--fuzz', $Configuration.Fuzz,
              '--sanitize', $Configuration.Sanitize,
              '--cmake-profile',
              '--cmake-profile-summary',
              '--cmake-profile-summary-limit', '15'
            )
            if ($Configuration.Cc -eq 'clang') {
              $GenerateArguments += '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON'
            }
            python @GenerateArguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
# =======================================================================================================================================
# ================================================================== CL =================================================================
# =======================================================================================================================================
      - name: Build (compiler=cl fuzz=off sanitize=off optimize=off)
        shell: powershell
        env:
          BUSTER_CC: cl
          BUSTER_FUZZ: OFF
          BUSTER_SANITIZE: OFF
          BUSTER_CONFIG: Debug
        run: |
          $ErrorActionPreference = 'Stop'
          $BuildPrefix = if ($env:BUSTER_BUILD_DIRECTORY_PREFIX) { $env:BUSTER_BUILD_DIRECTORY_PREFIX } else { 'build_ci-' }
          $BusterCcDirectory = $env:BUSTER_CC -replace '[^A-Za-z0-9_.-]', '_'
          $BusterBuildDirectory = "${BuildPrefix}cc_${BusterCcDirectory}-sanitize_$($env:BUSTER_SANITIZE)-fuzz_$($env:BUSTER_FUZZ)"
          python .\build.py --build-directory $BusterBuildDirectory --config $env:BUSTER_CONFIG --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
