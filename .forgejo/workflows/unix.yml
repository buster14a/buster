      - name: Analyze (compiler=clang sanitize=off fuzz=off optimize={off,on})
        shell: bash
        run: |
          set -euox pipefail
          BUILD_PREFIX=${BUSTER_BUILD_DIRECTORY_PREFIX:-build_ci-}
          BUSTER_CC=clang
          BUSTER_SANITIZE=OFF
          BUSTER_FUZZ=OFF

