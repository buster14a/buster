name: CI UNIX pipeline

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute the UNIX pipeline on
        required: true
        type: string

jobs:
  test:
    name: Test [${{ matrix.runner }}, cc=${{ matrix.cc }}, fuzz=${{ matrix.fuzz }}, optimize=${{ matrix.optimize }}, sanitize=${{ matrix.sanitize }}]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ['${{ inputs.runner }}']
        fuzz: [OFF, ON]
        optimize: [OFF, ON]
        sanitize: [OFF, ON]
        cc: [cl, zig, gcc, clang, tcc]
        exclude:
          - cc: gcc
            fuzz: ON
          - cc: tcc
            fuzz: ON
          - cc: tcc
            sanitize: ON
          - cc: tcc
            optimize: ON
          - cc: zig
            fuzz: ON
          - runner: aarch64-macos-m1
            fuzz: ON
          - runner: x86_64-windows-znver5
            cc: gcc
            sanitize: ON
          - runner: zen5-linux
            cc: cl
          - runner: x86_64-linux-sapphirerapids
            cc: cl
          - runner: aarch64-macos-m1
            cc: cl
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test
        shell: bash
        if: ${{ !contains(matrix.runner, 'windows') }}
        run: |
          set -euox pipefail
          BUSTER_CC='${{ matrix.cc }}'
          BUSTER_CC_DIRECTORY=${BUSTER_CC//[^A-Za-z0-9_.-]/_}
          BUSTER_BUILD_DIRECTORY="build_ci-cc_${BUSTER_CC_DIRECTORY}-optimize_${{ matrix.optimize }}-sanitize_${{ matrix.sanitize }}-fuzz_${{ matrix.fuzz }}"
          ./generate.py --build-directory "$BUSTER_BUILD_DIRECTORY" --ci ON --cc ${{ matrix.cc }} --fuzz ${{ matrix.fuzz }} --optimize ${{ matrix.optimize }} --sanitize ${{ matrix.sanitize }}
          ./build.py --build-directory "$BUSTER_BUILD_DIRECTORY" --verbose test_all
      - name: Test
        if: ${{ contains(matrix.runner, 'windows') }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPath = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $VsDevShell = Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1'
          & $VsDevShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          where.exe cl

          if ('${{ matrix.cc }}' -match 'clang' -and '${{ matrix.sanitize }}' -eq 'ON') {
            $ClangResourceDirectory = & clang -print-resource-dir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $ClangRuntimeDirectory = Join-Path $ClangResourceDirectory 'lib\windows'
            if (Test-Path $ClangRuntimeDirectory) {
              $env:PATH = "$ClangRuntimeDirectory;$env:PATH"
            }
          }

          echo $env:PATH

          $BusterCcDirectory = '${{ matrix.cc }}' -replace '[^A-Za-z0-9_.-]', '_'
          $BusterBuildDirectory = "build_ci-cc_$BusterCcDirectory-optimize_${{matrix.optimize}}-sanitize_${{matrix.sanitize}}-fuzz_${{matrix.fuzz}}"

          $generateArguments = @(
            '.\generate.py',
            '--build-directory', $BusterBuildDirectory,
            '--ci', 'ON',
            '--cc', '${{ matrix.cc }}',
            '--fuzz', '${{ matrix.fuzz }}',
            '--optimize', '${{ matrix.optimize }}',
            '--sanitize', '${{ matrix.sanitize }}'
          )
          & python @generateArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $buildArguments = @(
            '.\build.py',
            '--build-directory', $BusterBuildDirectory,
            '--verbose',
            'test_all'
          )
          & python @buildArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
