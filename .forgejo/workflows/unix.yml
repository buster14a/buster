name: CI UNIX pipeline

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute the UNIX pipeline on
        required: true
        type: string

env:
  BUSTER_CI: 'ON'

jobs:
  test:
    name: Test [${{ inputs.runner }}, cc=${{ matrix.cc }}, fuzz=${{ matrix.fuzz }}, optimize=${{ matrix.optimize }}, sanitize=${{ matrix.sanitize }}]
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        fuzz: [OFF, ON]
        optimize: [OFF, ON]
        sanitize: [OFF, ON]
        cc: [clang, gcc, tcc]
        exclude:
          - cc: gcc
            fuzz: ON
          - cc: tcc
            fuzz: ON
          - cc: tcc
            sanitize: ON
          - cc: tcc
            optimize: ON
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test
        shell: bash
        env:
          BUSTER_CC: ${{ matrix.cc }}
          BUSTER_FUZZ: ${{ matrix.fuzz }}
          BUSTER_OPTIMIZE: ${{ matrix.optimize }}
          BUSTER_SANITIZE: ${{ matrix.sanitize }}
        run: |
          ci/unix.sh
