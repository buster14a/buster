name: CI UNIX pipeline

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute the UNIX pipeline on
        required: true
        type: string

env:
  BUSTER_CI: 'ON'

jobs:
  test:
    name: Test [${{ matrix.runner }}, cc=${{ matrix.cc }}, fuzz=${{ matrix.fuzz }}, optimize=${{ matrix.optimize }}, sanitize=${{ matrix.sanitize }}]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ['${{ inputs.runner }}']
        fuzz: [OFF, ON]
        optimize: [OFF, ON]
        sanitize: [OFF, ON]
        cc: [clang, gcc, tcc, zig]
        exclude:
          - cc: gcc
            fuzz: ON
          - cc: tcc
            fuzz: ON
          - cc: tcc
            sanitize: ON
          - cc: tcc
            optimize: ON
          - cc: zig
            fuzz: ON
          - runner: aarch64-macos-m1
            fuzz: ON
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test
        shell: bash
        env:
          BUSTER_CC: ${{ matrix.cc }}
          BUSTER_FUZZ: ${{ matrix.fuzz }}
          BUSTER_OPTIMIZE: ${{ matrix.optimize }}
          BUSTER_SANITIZE: ${{ matrix.sanitize }}
        run: |
          ci/unix.sh
