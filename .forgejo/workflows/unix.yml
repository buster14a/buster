name: CI UNIX pipeline

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute the UNIX pipeline on
        required: true
        type: string
      os:
        description: Operating system
        required: true
        type: string

jobs:
  test:
    name: ${{ matrix.runner }}, cc=${{ matrix.cc }}, fuzz=${{ matrix.fuzz }}, sanitize=${{ matrix.sanitize }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ['${{ inputs.runner }}']
        fuzz: [OFF, ON]
        sanitize: [OFF, ON]
        cc: [clang, gcc, tcc, zig]
        os: ['${{ inputs.os }}']
        exclude:
          - cc: gcc
            fuzz: ON
          - cc: tcc
            fuzz: ON
          - cc: tcc
            sanitize: ON
          - cc: zig
            fuzz: ON
          - os: macos
            fuzz: ON
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test
        shell: bash
        run: |
          set -euox pipefail
          if command -v python3 >/dev/null 2>&1; then
            BUSTER_TIMER_PYTHON=python3
          elif command -v python >/dev/null 2>&1; then
            BUSTER_TIMER_PYTHON=python
          else
            BUSTER_TIMER_PYTHON=
          fi
          BUSTER_TIMING_RESULTS=()

          now_nanoseconds() {
            if [ -n "${BUSTER_TIMER_PYTHON:-}" ]; then
              "$BUSTER_TIMER_PYTHON" -c 'import time; print(time.perf_counter_ns())'
            else
              printf '%s000000000\n' "$SECONDS"
            fi
          }

          run_timed() {
            local label="$1"
            shift
            local start_ns
            local end_ns
            local elapsed_ns
            local elapsed_seconds
            local elapsed_milliseconds
            local rc=0

            start_ns="$(now_nanoseconds)"
            "$@" || rc=$?
            end_ns="$(now_nanoseconds)"
            elapsed_ns=$((end_ns - start_ns))
            elapsed_seconds=$((elapsed_ns / 1000000000))
            elapsed_milliseconds=$(((elapsed_ns / 1000000) % 1000))

            BUSTER_TIMING_RESULTS+=("${label} completed in ${elapsed_seconds}.${elapsed_milliseconds}s")
            return "$rc"
          }

          print_timing_summary() {
            echo '>>> Timing summary'
            printf '>>> %s\n' "${BUSTER_TIMING_RESULTS[@]}"
          }

          BUSTER_CC='${{ matrix.cc }}'
          BUSTER_CC_DIRECTORY=${BUSTER_CC//[^A-Za-z0-9_.-]/_}
          BUSTER_BUILD_DIRECTORY="build_ci-cc_${BUSTER_CC_DIRECTORY}-sanitize_${{ matrix.sanitize }}-fuzz_${{ matrix.fuzz }}"
          run_timed "Generate" ./generate.py --build-directory "$BUSTER_BUILD_DIRECTORY" --ci ON --cc "$BUSTER_CC" --fuzz ${{ matrix.fuzz }} --sanitize ${{ matrix.sanitize }}

          BUSTER_CONFIGS=(Debug Release)
          if [ "$BUSTER_CC" = tcc ]; then
            BUSTER_CONFIGS=(Debug)
          fi

          for BUSTER_CONFIG in "${BUSTER_CONFIGS[@]}"; do
            run_timed "Build ${BUSTER_CONFIG}" ./build.py --build-directory "$BUSTER_BUILD_DIRECTORY" --config "$BUSTER_CONFIG" --verbose
            run_timed "Test ${BUSTER_CONFIG}" ./build.py --build-directory "$BUSTER_BUILD_DIRECTORY" --config "$BUSTER_CONFIG" --verbose test_all
          done
          print_timing_summary
