            time ./build.py --build-directory "${BUILD_PREFIX}cc_${BUSTER_CC}-sanitize_${BUSTER_SANITIZE}-fuzz_${BUSTER_FUZZ}" --config "$BUSTER_CONFIG" --verbose clang_analyze
