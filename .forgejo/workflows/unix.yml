name: CI UNIX pipeline

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute the UNIX pipeline on
        required: true
        type: string

jobs:
  test:
    name: Test [${{ matrix.runner }}, cc=${{ matrix.cc }}, fuzz=${{ matrix.fuzz }}, optimize=${{ matrix.optimize }}, sanitize=${{ matrix.sanitize }}]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ['${{ inputs.runner }}']
        fuzz: [OFF, ON]
        optimize: [OFF, ON]
        sanitize: [OFF, ON]
        cc: [clang, gcc, tcc, zig]
        exclude:
          - cc: gcc
            fuzz: ON
          - cc: tcc
            fuzz: ON
          - cc: tcc
            sanitize: ON
          - cc: tcc
            optimize: ON
          - cc: zig
            fuzz: ON
          - runner: aarch64-macos-m1
            fuzz: ON
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test
        shell: bash
        env:
          BUSTER_CC: ${{ matrix.cc }}
          BUSTER_FUZZ: ${{ matrix.fuzz }}
          BUSTER_OPTIMIZE: ${{ matrix.optimize }}
          BUSTER_SANITIZE: ${{ matrix.sanitize }}
        run: |
          set -euox pipefail

          BUSTER_CC_DIRECTORY=${BUSTER_CC//[^A-Za-z0-9_.-]/_}
          BUSTER_BUILD_DIRECTORY="build_ci-cc_${BUSTER_CC_DIRECTORY}-optimize_${BUSTER_OPTIMIZE}-sanitize_${BUSTER_SANITIZE}-fuzz_${BUSTER_FUZZ}"
          ./generate.py --build-directory "$BUSTER_BUILD_DIRECTORY" --ci ON --cc ${{ matrix.cc }} --fuzz ${{ matrix.fuzz }} --optimize ${{ matrix.optimize }} --sanitize ${{ matrix.sanitize }}
          ./build.py --build-directory "$BUSTER_BUILD_DIRECTORY" --verbose test_all
