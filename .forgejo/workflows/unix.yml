name: CI UNIX pipeline

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute the UNIX pipeline on
        required: true
        type: string
      os:
        description: Operating system
        required: true
        type: string
jobs:
  test:
    name: ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generations
        shell: bash
        run: |
          set -euox pipefail
          declare -A generate_configurations
          generation_configuration_count=0

          BUILD_PREFIX=${BUSTER_BUILD_DIRECTORY_PREFIX:-build_ci-}

          add_generation() {
            local i=$generation_configuration_count

            local BUSTER_CC=$1
            local BUSTER_FUZZ=$2
            local BUSTER_SANITIZE=$3

            generate_configurations[$i.cc]=$BUSTER_CC
            generate_configurations[$i.sanitize]=$BUSTER_SANITIZE
            generate_configurations[$i.fuzz]=$BUSTER_FUZZ

            BUSTER_CC_DIRECTORY=${BUSTER_CC//[^A-Za-z0-9_.-]/_}
            generate_configurations[$i.directory]="${BUILD_PREFIX}cc_${BUSTER_CC_DIRECTORY}-sanitize_${BUSTER_SANITIZE}-fuzz_${BUSTER_FUZZ}"

            generation_configuration_count=$((generation_configuration_count + 1))
          }

          #               COMPILER    FUZZ        SANITIZE
          add_generation  clang       OFF         OFF
          add_generation  clang       OFF         ON

          if [[ "${{ inputs.runner }}" != "macos" ]]; then
            add_generation  clang       ON          OFF
            add_generation  clang       ON          ON
          fi

          add_generation  tcc         OFF         OFF
          add_generation  gcc         OFF         OFF
          add_generation  gcc         OFF         ON
          add_generation  zig         OFF         OFF
          add_generation  zig         OFF         ON

          for ((i = 0; i < generation_configuration_count; i++)); do
            BUSTER_CC=${generate_configurations[$i.cc]}
            BUSTER_SANITIZE=${generate_configurations[$i.sanitize]}
            BUSTER_FUZZ=${generate_configurations[$i.fuzz]}
            BUSTER_BUILD_DIRECTORY=${generate_configurations[$i.directory]}
            generate_extra_arguments=()
            if [[ "$BUSTER_CC" == clang ]]; then
              generate_extra_arguments+=(-DCMAKE_EXPORT_COMPILE_COMMANDS=ON)
            fi
            ./generate.py --build-directory "$BUSTER_BUILD_DIRECTORY" --ci ON --cc "$BUSTER_CC" --fuzz $BUSTER_FUZZ --sanitize $BUSTER_SANITIZE --cmake-profile --cmake-profile-summary --cmake-profile-summary-limit 15 "${generate_extra_arguments[@]}"
          done
# =======================================================================================================================================
# ================================================================ CLANG ================================================================
# =======================================================================================================================================
      - name: Build (compiler=clang fuzz=off sanitize=off optimize=off)
        shell: bash
        env:
          BUSTER_CC: clang
          BUSTER_FUZZ: OFF
          BUSTER_SANITIZE: OFF
          BUSTER_CONFIG: Debug
        run: |
          set -euox pipefail
          ./build.py --build-directory "${BUSTER_BUILD_DIRECTORY_PREFIX:-build_ci-}cc_${BUSTER_CC}-sanitize_${BUSTER_SANITIZE}-fuzz_${BUSTER_FUZZ}" --config "$BUSTER_CONFIG" --verbose
      - name: Test (compiler=clang fuzz=off sanitize=off optimize=off)
        shell: bash
        env:
          BUSTER_CC: clang
          BUSTER_FUZZ: OFF
          BUSTER_SANITIZE: OFF
          BUSTER_CONFIG: Debug
        run: |
          set -euox pipefail
          time ./build.py --build-directory "${BUSTER_BUILD_DIRECTORY_PREFIX:-build_ci-}cc_${BUSTER_CC}-sanitize_${BUSTER_SANITIZE}-fuzz_${BUSTER_FUZZ}" --config "$BUSTER_CONFIG" --verbose test_all
      - name: Build (compiler=clang fuzz=off sanitize=off optimize=on)
        shell: bash
        env:
          BUSTER_CC: clang
          BUSTER_FUZZ: OFF
          BUSTER_SANITIZE: OFF
          BUSTER_CONFIG: Release
        run: |
          set -euox pipefail
          time ./build.py --build-directory "${BUSTER_BUILD_DIRECTORY_PREFIX:-build_ci-}cc_${BUSTER_CC}-sanitize_${BUSTER_SANITIZE}-fuzz_${BUSTER_FUZZ}" --config "$BUSTER_CONFIG" --verbose
