on: [push]

# Main runs use a commit-specific group so different commits can dispatch their
# complete matrices independently. Non-main pushes share a ref-specific group,
# so the newest push supersedes an in-progress older run.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    timeout-minutes: 30
    strategy:
      # A failing runner stops its own job, while the other matrix runners
      # continue independently and report their own result.
      fail-fast: false
      matrix:
        runner: [x86_64-linux-dedicated, x86_64-linux, aarch64-macos-mini, x86_64-windows-znver5]
    name: ${{matrix.runner}}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test (Android)
        shell: bash
        if: ${{ contains(matrix.runner, 'x86_64-linux-dedicated') }}
        env:
          BUSTER_ANDROID_AVD: buster-ci
          BUSTER_ANDROID_SYSTEM_IMAGE: "system-images;android-35;google_apis;x86_64"
          BUSTER_ANDROID_DEVICE: pixel_6
          BUSTER_ANDROID_EMULATOR_GPU: swiftshader_indirect
          BUSTER_ANDROID_EMULATOR_HEADLESS: "1"
          BUSTER_ANDROID_EMULATOR_LOG: build/android-emulator.log
          BUSTER_ANDROID_EMULATOR_STARTED_MARKER: build/android-emulator.started
        run: |
          set -euo pipefail

          cleanup_android_emulator() {
            status=$?
            trap - EXIT INT TERM
            if [[ $status -ne 0 && -f "${BUSTER_ANDROID_EMULATOR_LOG:-}" ]]; then
              echo "Last Android emulator log lines:"
              tail -n 200 "$BUSTER_ANDROID_EMULATOR_LOG" || true
            fi
            if [[ -f "$BUSTER_ANDROID_EMULATOR_STARTED_MARKER" ]]; then
              cleanup_timeout_seconds=${BUSTER_ANDROID_CLEANUP_TIMEOUT_SECONDS:-${BUSTER_ANDROID_COMMAND_TIMEOUT_SECONDS:-30}}
              if BUSTER_ANDROID_EMULATOR_STARTED_MARKER="$BUSTER_ANDROID_EMULATOR_STARTED_MARKER" \
                BUSTER_ANDROID_CLEANUP_TIMEOUT_SECONDS="$cleanup_timeout_seconds" \
                bash ./android/start_emulator_ci.sh stop; then
                :
              else
                cleanup_status=$?
                echo "warning: Android emulator lifecycle cleanup failed with exit status $cleanup_status" >&2
                if [[ $status -eq 0 ]]; then
                  status=1
                  if [[ -f "${BUSTER_ANDROID_EMULATOR_LOG:-}" ]]; then
                    echo "Last Android emulator log lines:"
                    tail -n 200 "$BUSTER_ANDROID_EMULATOR_LOG" || true
                  fi
                fi
              fi
            fi
            exit "$status"
          }
          trap cleanup_android_emulator EXIT

          bash ./android/start_emulator_ci.sh start
          ./android/test_ci.sh --all
      - name: Test (Linux)
        shell: bash
        if: ${{ matrix.runner == 'x86_64-linux' }}
        run: |
          set -euo pipefail
          ./build.sh test_all_combinations_ci --verbose=1
      - name: Test (macOS)
        shell: bash
        if: ${{ contains(matrix.runner, 'macos') }}
        run: |
          set -euo pipefail
          ./build.sh test_all_combinations_ci --verbose=1
      - name: Test (iOS simulator)
        shell: bash
        if: ${{ contains(matrix.runner, 'macos') }}
        run: |
          set -euo pipefail
          ./ios/test_ci.sh --all
      - name: Test (Windows)
        shell: powershell
        if: ${{ contains(matrix.runner, 'windows') }}
        run: |
          $ErrorActionPreference = 'Stop'

          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $VsWhere)) {
            throw "vswhere was not found at $VsWhere"
          }

          $VsPath = (& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $VsPath) {
            throw 'Visual Studio with VC tools was not found'
          }

          $VsDevShell = Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1'
          if (-not (Test-Path -LiteralPath $VsDevShell)) {
            throw "Launch-VsDevShell.ps1 was not found at $VsDevShell"
          }

          & $VsDevShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          where.exe cl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          ./build.ps1 test_all_combinations_ci --verbose=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
