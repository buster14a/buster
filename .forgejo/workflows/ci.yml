on: [push]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [x86_64-linux-dedicated, x86_64-linux, aarch64-macos-mini, x86_64-windows-znver5]
    name: ${{matrix.runner}}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test (Android)
        shell: bash
        if: ${{ contains(matrix.runner, 'x86_64-linux-dedicated') }}
        timeout-minutes: 10
        env:
          BUSTER_ANDROID_AVD: buster-ci
          BUSTER_ANDROID_SYSTEM_IMAGE: "system-images;android-35;google_apis;x86_64"
          BUSTER_ANDROID_DEVICE: pixel_6
          BUSTER_ANDROID_EMULATOR_GPU: swiftshader_indirect
          BUSTER_ANDROID_EMULATOR_HEADLESS: "1"
          BUSTER_ANDROID_EMULATOR_LOG: build/android-emulator.log
          BUSTER_ANDROID_EMULATOR_STARTED_MARKER: build/android-emulator.started
        run: |
          cleanup_android_emulator() {
            status=$?
            if [[ $status -ne 0 && -f "${BUSTER_ANDROID_EMULATOR_LOG:-}" ]]; then
              echo "Last Android emulator log lines:"
              tail -n 200 "$BUSTER_ANDROID_EMULATOR_LOG" || true
            fi
            if [[ -f "$BUSTER_ANDROID_EMULATOR_STARTED_MARKER" ]]; then
              android_sdk=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}
              export PATH="$android_sdk/platform-tools:$PATH"
              adb emu kill || true
              rm -f "$BUSTER_ANDROID_EMULATOR_STARTED_MARKER"
            fi
            exit "$status"
          }
          trap cleanup_android_emulator EXIT

          bash ./android/start_emulator_ci.sh
          for build_config in Debug Release; do
            echo "Running Android ${build_config} tests"
            BUSTER_ANDROID_BUILD_CONFIG="$build_config" ./android/test_ci.sh
          done
      - name: Test (Linux)
        shell: bash
        if: ${{ matrix.runner == 'x86_64-linux' }}
        run: |
          ./build.sh test_all_combinations_ci --verbose=1
      - name: Perf (Linux)
        shell: bash
        if: ${{ matrix.runner == 'x86_64-linux' || contains(matrix.runner, 'x86_64-linux-dedicated') }}
        env:
          PERF_HISTORY_TOKEN: ${{ secrets.PERF_HISTORY_TOKEN }}
          RUNNER_NAME: ${{ matrix.runner }}
          COMMIT_SHA: ${{ github.sha }}
          PUSH_HISTORY: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: |
          source /opt/vulkan-sdk/current/setup-env.sh
          ./.forgejo/scripts/perf_step.sh
      - name: Test (iOS simulator)
        shell: bash
        if: ${{ contains(matrix.runner, 'macos') }}
        timeout-minutes: 40
        run: |
          for build_config in Debug Release; do
            echo "Running iOS ${build_config} tests"
            BUSTER_IOS_BUILD_CONFIG="$build_config" ./ios/test_ci.sh
          done
      - name: Test (macOS)
        shell: bash
        if: ${{ contains(matrix.runner, 'macos') }}
        run: |
          ./build.sh test_all_combinations_ci --verbose=1
      - name: Perf (macOS)
        shell: bash
        if: ${{ contains(matrix.runner, 'macos') }}
        env:
          PERF_HISTORY_TOKEN: ${{ secrets.PERF_HISTORY_TOKEN }}
          RUNNER_NAME: ${{ matrix.runner }}
          COMMIT_SHA: ${{ github.sha }}
          PUSH_HISTORY: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: |
          source /opt/vulkan-sdk/current/setup-env.sh
          ./.forgejo/scripts/perf_step.sh
      - name: Test (Windows)
        shell: powershell
        if: ${{ contains(matrix.runner, 'windows') }}
        env:
          PERF_HISTORY_TOKEN: ${{ secrets.PERF_HISTORY_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $VsWhere)) {
            throw "vswhere was not found at $VsWhere"
          }

          $VsPath = (& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $VsPath) {
            throw 'Visual Studio with VC tools was not found'
          }

          $VsDevShell = Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1'
          if (-not (Test-Path -LiteralPath $VsDevShell)) {
            throw "Launch-VsDevShell.ps1 was not found at $VsDevShell"
          }

          & $VsDevShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          where.exe cl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          ./build.ps1 test_all_combinations_ci --verbose=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # --- Perf: compile-time + parse-bench tracking ---------------------
          # Appended to this same step (rather than a separate one) so it
          # inherits the VsDevShell environment (INCLUDE/LIB/PATH) set up
          # above -- a fresh step would start a new process without it.
          # Unlike the Linux/macOS Perf steps, this doesn't also run
          # ninja_log_summary/time_trace_summary: those are diagnostics
          # only and there's no safe way to ignore-and-continue past a
          # build.ps1 failure here (its internal error handling calls
          # `exit`, which would kill this whole process, not just the call).
          $overallExitCode = 0

          foreach ($config in @('Debug', 'Release')) {
            $buildDir = "build/perf-$config"
            Remove-Item -Recurse -Force $buildDir -ErrorAction SilentlyContinue

            $genStart = Get-Date
            ./build.ps1 generate --build-dir $buildDir --config $config --no-sanitize --no-fuzz --instrument --time-trace
            $genEnd = Get-Date

            $buildStart = Get-Date
            ./build.ps1 build --build-dir $buildDir --config $config -t ide
            $buildEnd = Get-Date

            # Keep benchmark execution outside the compile timer. bench_all
            # depends on the already up-to-date ide target, so corpus growth
            # cannot be misreported as a compile-time regression.
            $benchOutput = ./build.ps1 build --build-dir $buildDir --config $config -t bench_all
            $benchOutput | ForEach-Object { Write-Output $_ }

            $benchLine = ($benchOutput | Select-String '^BENCH ' | Select-Object -Last 1).Line
            if (-not $benchLine) {
              throw "Perf: no BENCH line found in bench_all output for $config"
            }
            $benchPhaseLines = ($benchOutput | Select-String '^BENCH_PHASE ' | ForEach-Object { $_.Line }) -join "`n"
            $benchFileLines = ($benchOutput | Select-String '^BENCH_FILE ' | ForEach-Object { $_.Line }) -join "`n"

            $compileMilliseconds = [int](($genEnd - $genStart).TotalMilliseconds + ($buildEnd - $buildStart).TotalMilliseconds)

            $env:RUNNER_NAME = "${{ matrix.runner }}"
            $env:CONFIG = $config
            $env:COMPILE_MILLISECONDS = "$compileMilliseconds"
            $env:BENCH_LINE = $benchLine
            $env:BENCH_PHASE_LINES = $benchPhaseLines
            $env:BENCH_FILE_LINES = $benchFileLines
            $env:COMMIT_SHA = "${{ github.sha }}"
            $env:PUSH_HISTORY = "${{ github.ref == 'refs/heads/main' && '1' || '0' }}"

            $serverHost = "${{ github.server_url }}" -replace '^https?://', ''
            $env:REPO_PUSH_URL = "https://x-access-token:$($env:PERF_HISTORY_TOKEN)@$serverHost/${{ github.repository }}.git"

            bash ./.forgejo/scripts/record_perf.sh
            if ($LASTEXITCODE -ne 0) { $overallExitCode = $LASTEXITCODE }
          }

          if ($overallExitCode -ne 0) { exit $overallExitCode }
