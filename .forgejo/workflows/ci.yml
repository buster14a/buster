on: [push]

jobs:
  main_gate:
    name: Main tested-SHA gate
    runs-on: x86_64-linux
    outputs:
      tested: ${{ steps.gate.outputs.tested }}
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check merged SHA statuses
        id: gate
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: bash .forgejo/scripts/ci_main_gate.sh
  test:
    # Main accepts only current, green PR head SHAs via fast-forward-only merge.
    # The gate verifies the exact pushed SHA already carries all required
    # success statuses; otherwise the full matrix runs on the main push.
    # always() keeps a gate job that failed outright from skipping the matrix:
    # without it an unmet `needs` skips this job, which would fail open.
    needs: main_gate
    if: ${{ always() && (forgejo.ref != 'refs/heads/main' || needs.main_gate.outputs.tested != 'true') }}
    # Forgejo 12.7 counts this timeout from scheduling, including time waiting for a runner.
    # 120 minutes covers three queued Windows jobs at the observed 22-29 minute runtime
    # (87 minutes) plus the existing <=30 minute execution target.
    # This remains a finite bound and cannot guarantee completion under an unbounded backlog.
    timeout-minutes: 120
    strategy:
      # Once any required runner fails, cancel the remaining matrix jobs for
      # this SHA because exact-SHA policy requires a fully green replacement.
      fail-fast: true
      matrix:
        runner: [x86_64-linux-dedicated, x86_64-linux, aarch64-macos-mini, x86_64-windows-znver5]
    name: ${{matrix.runner}}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test (Android)
        shell: bash
        if: ${{ contains(matrix.runner, 'x86_64-linux-dedicated') }}
        env:
          BUSTER_ANDROID_AVD: buster-ci
          BUSTER_ANDROID_SYSTEM_IMAGE: "system-images;android-35;google_apis;x86_64"
          BUSTER_ANDROID_DEVICE: pixel_6
          BUSTER_ANDROID_EMULATOR_GPU: swiftshader_indirect
          BUSTER_ANDROID_EMULATOR_HEADLESS: "1"
          BUSTER_ANDROID_EMULATOR_LOG: build/android-emulator.log
          BUSTER_ANDROID_EMULATOR_STARTED_MARKER: build/android-emulator.started
        run: |
          set -euo pipefail

          cleanup_android_emulator() {
            status=$?
            trap - EXIT INT TERM
            if [[ $status -ne 0 && -f "${BUSTER_ANDROID_EMULATOR_LOG:-}" ]]; then
              echo "Last Android emulator log lines:"
              tail -n 200 "$BUSTER_ANDROID_EMULATOR_LOG" || true
            fi
            if [[ -f "$BUSTER_ANDROID_EMULATOR_STARTED_MARKER" ]]; then
              cleanup_timeout_seconds=${BUSTER_ANDROID_CLEANUP_TIMEOUT_SECONDS:-${BUSTER_ANDROID_COMMAND_TIMEOUT_SECONDS:-30}}
              if BUSTER_ANDROID_EMULATOR_STARTED_MARKER="$BUSTER_ANDROID_EMULATOR_STARTED_MARKER" \
                BUSTER_ANDROID_CLEANUP_TIMEOUT_SECONDS="$cleanup_timeout_seconds" \
                bash ./android/start_emulator_ci.sh stop; then
                :
              else
                cleanup_status=$?
                echo "warning: Android emulator lifecycle cleanup failed with exit status $cleanup_status" >&2
                if [[ $status -eq 0 ]]; then
                  status=1
                  if [[ -f "${BUSTER_ANDROID_EMULATOR_LOG:-}" ]]; then
                    echo "Last Android emulator log lines:"
                    tail -n 200 "$BUSTER_ANDROID_EMULATOR_LOG" || true
                  fi
                fi
              fi
            fi
            exit "$status"
          }
          trap cleanup_android_emulator EXIT

          bash ./android/start_emulator_ci.sh start
          ./android/test_ci.sh --all
      - name: Test (Linux)
        shell: bash
        if: ${{ matrix.runner == 'x86_64-linux' }}
        run: |
          set -euo pipefail
          ./build.sh test_all_combinations_ci --verbose=1
      # The execution-mode matrix cross-products every register-allocator
      # mode with every linkable target (x86-64/AArch64 x ELF/PE/Mach-O),
      # runs each leg natively or under qemu-aarch64/wine where the host
      # allows, and oracle-checks the rest. It lives on the dedicated Linux
      # box beside the Android job because that job is the runner's short
      # leg, and on macOS where the Mach-O rows execute natively. Windows is
      # excluded on purpose: that runner is the CI wall-time gate and its PE
      # rows already run under wine here.
      - name: Execution-mode matrix (Linux)
        shell: bash
        if: ${{ contains(matrix.runner, 'x86_64-linux-dedicated') }}
        run: |
          set -euo pipefail
          ./build.sh test_mode_matrix --config Release
      - name: Test (macOS)
        shell: bash
        if: ${{ contains(matrix.runner, 'macos') }}
        run: |
          set -euo pipefail
          ./build.sh test_all_combinations_ci --verbose=1
      - name: Test (iOS simulator)
        shell: bash
        if: ${{ contains(matrix.runner, 'macos') }}
        run: |
          set -euo pipefail
          ./ios/test_ci.sh --all
      - name: Execution-mode matrix (macOS)
        shell: bash
        if: ${{ contains(matrix.runner, 'macos') }}
        run: |
          set -euo pipefail
          ./build.sh test_mode_matrix --config Release
      - name: Test (Windows)
        shell: powershell
        if: ${{ contains(matrix.runner, 'windows') }}
        run: |
          $ErrorActionPreference = 'Stop'

          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $VsWhere)) {
            throw "vswhere was not found at $VsWhere"
          }

          $VsPath = (& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $VsPath) {
            throw 'Visual Studio with VC tools was not found'
          }

          $VsDevShell = Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1'
          if (-not (Test-Path -LiteralPath $VsDevShell)) {
            throw "Launch-VsDevShell.ps1 was not found at $VsDevShell"
          }

          & $VsDevShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          where.exe cl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          ./build.ps1 test_all_combinations_ci --verbose=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
