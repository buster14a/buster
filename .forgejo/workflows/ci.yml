on: [push]

jobs:
  test_linux:
    strategy:
      matrix:
        runner: [x86_64-linux-znver5, x86_64-linux-sapphirerapids, x86_64-linux-alpine, x86_64-linux-ubuntu, x86_64-linux-debian, aarch64-linux-fedora]
    name: ${{matrix.runner}} - wrapper
    uses: ./.forgejo/workflows/unix.yml
    with:
      runner: ${{ matrix.runner }}
      os: linux
  test_macos:
    strategy:
      matrix:
        runner: [aarch64-macos-m1]
    name: ${{matrix.runner}} - wrapper
    uses: ./.forgejo/workflows/unix.yml
    with:
      runner: ${{ matrix.runner }}
      os: macos
  test_windows:
    strategy:
      matrix:
        runner: [x86_64-windows-znver5]
    name: ${{matrix.runner}} - wrapper
    uses: ./.forgejo/workflows/windows.yml
    with:
      runner: ${{ matrix.runner }}
      os: windows
