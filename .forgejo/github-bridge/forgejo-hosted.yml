# Install this file as .github/workflows/forgejo-hosted.yml in a dedicated,
# private GitHub repository that contains no Buster source or artifacts.
#
# Privacy properties this file must keep (see docs/ci-github-hosted-runners.md
# in the Buster repository):
#   - no checkout of the broker repository and no third-party actions;
#   - the deploy key arrives as a per-run secret, enters ssh-agent through a
#     pipe, and is never written to any filesystem;
#   - on Linux and macOS the source, the build tree, temporary files, and all
#     build logs live only on a memory-backed filesystem that is destroyed at
#     the end of the job (Linux additionally disables swap so those pages can
#     never reach persistent media);
#   - no caches, no artifacts, no package installation, and no verbose logs:
#     the retained job log carries only fixed status lines and exit codes.
name: Forgejo hosted-runner broker
run-name: forgejo-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Opaque correlation nonce generated by Forgejo
        required: true
        type: string
      forgejo_sha:
        description: Exact trusted Forgejo commit to test
        required: true
        type: string

# The workflow does not use the broker repository or its GITHUB_TOKEN.
permissions: {}

jobs:
  desktop:
    name: ${{ matrix.name }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            platform: unix
          - name: macOS
            runner: macos-15
            platform: unix
          - name: Windows
            runner: windows-2022
            platform: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Validate broker inputs
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          FORGEJO_SHA: ${{ inputs.forgejo_sha }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$FORGEJO_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]

      - name: Prepare a memory-backed workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          case "$RUNNER_OS" in
            Linux)
              # Remove swap first so no page of the workspace or of any build
              # process can ever be written to persistent storage, then mount
              # a private tmpfs. The noswap mount option is belt and braces on
              # kernels that support it.
              sudo swapoff -a
              mount_root="$RUNNER_TEMP/buster-ram"
              mkdir -p "$mount_root"
              options="size=10g,mode=0700,uid=$(id -u),gid=$(id -g)"
              sudo mount -t tmpfs -o "$options,noswap" tmpfs "$mount_root" ||
                sudo mount -t tmpfs -o "$options" tmpfs "$mount_root"
              mountpoint -q "$mount_root"
              ;;
            macOS)
              # 5 GiB RAM disk (2048 sectors per MiB). Spotlight indexing is
              # disabled so the volume's contents are not written into any
              # search store.
              device=$(hdiutil attach -nomount ram://10485760 | awk '{print $1}')
              [[ -n "$device" ]]
              diskutil erasevolume HFS+ buster-ram "$device" >/dev/null
              mount_root="/Volumes/buster-ram"
              mdutil -i off "$mount_root" >/dev/null || true
              printf 'BUSTER_RAM_DEVICE=%s\n' "$device" >>"$GITHUB_ENV"
              ;;
            Windows)
              # Windows has no in-box RAM filesystem and installing a driver
              # would defeat the no-unpinned-downloads rule. The workspace is
              # a plain directory on the ephemeral VM disk; the cleanup step
              # deletes it. This platform exception is documented.
              mount_root="$RUNNER_TEMP/buster-ram"
              mkdir -p "$mount_root"
              ;;
          esac
          mkdir -p "$mount_root/source" "$mount_root/tmp" "$mount_root/ssh"
          native_root="$mount_root"
          if command -v cygpath >/dev/null 2>&1; then
            native_root=$(cygpath -w "$mount_root")
          fi
          printf 'BUSTER_RAM_ROOT=%s\n' "$native_root" >>"$GITHUB_ENV"

      - name: Fetch the exact commit into the memory workspace
        shell: bash
        env:
          FORGEJO_CLONE_URL: ${{ vars.FORGEJO_CLONE_URL }}
          FORGEJO_KNOWN_HOSTS: ${{ vars.FORGEJO_KNOWN_HOSTS }}
          FORGEJO_DEPLOY_KEY: ${{ secrets.FORGEJO_DEPLOY_KEY }}
          FORGEJO_SHA: ${{ inputs.forgejo_sha }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          [[ -n "$FORGEJO_CLONE_URL" && -n "$FORGEJO_KNOWN_HOSTS" && -n "$FORGEJO_DEPLOY_KEY" ]]
          ram_root="$BUSTER_RAM_ROOT"
          if command -v cygpath >/dev/null 2>&1; then
            ram_root=$(cygpath -u "$ram_root")
          fi
          source_dir="$ram_root/source"
          ssh_dir="$ram_root/ssh"
          printf '%s\n' "$FORGEJO_KNOWN_HOSTS" >"$ssh_dir/known_hosts"

          eval "$(ssh-agent -s)" >/dev/null
          cleanup_credentials() {
            trap - EXIT INT TERM
            ssh-add -D >/dev/null 2>&1 || true
            ssh-agent -k >/dev/null 2>&1 || true
            rm -rf "$ssh_dir"
          }
          trap cleanup_credentials EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          # The private key reaches ssh-agent through a pipe: unlike a
          # heredoc or herestring it never becomes a shell temporary file,
          # so the only copies are process memory on both ends.
          printf '%s\n' "$FORGEJO_DEPLOY_KEY" | ssh-add - >/dev/null 2>&1
          unset FORGEJO_DEPLOY_KEY

          object_format=sha1
          if [[ ${#FORGEJO_SHA} -eq 64 ]]; then
            object_format=sha256
          fi
          export GIT_TERMINAL_PROMPT=0
          export GIT_SSH_COMMAND="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"
          git -C "$source_dir" init -q --object-format="$object_format"
          git -C "$source_dir" remote add origin "$FORGEJO_CLONE_URL"
          if ! git -C "$source_dir" fetch -q --no-tags --depth=1 origin "$FORGEJO_SHA" >"$ram_root/tmp/buster-fetch.log" 2>&1; then
            echo "error: the exact Forgejo commit could not be fetched" >&2
            exit 1
          fi
          git -C "$source_dir" checkout -q --detach FETCH_HEAD
          actual_sha=$(git -C "$source_dir" rev-parse HEAD)
          if [[ "$actual_sha" != "$FORGEJO_SHA" ]]; then
            echo "error: Forgejo returned a different commit" >&2
            exit 1
          fi

          git -C "$source_dir" remote remove origin
          rm -rf "$source_dir/.git"
          cleanup_credentials

      - name: Test on Linux or macOS without retaining logs
        if: ${{ matrix.platform == 'unix' }}
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          export TMPDIR="$BUSTER_RAM_ROOT/tmp"
          # Keep unit/driver-test fixtures off the host disk as well.
          export BUSTER_TEST_TEMPORARY_BASE="$TMPDIR/"
          log="$TMPDIR/buster-ci.log"
          # generate wipes build/, so the bootstrap driver must live outside
          # it. The hosted images have no mold, so pin the default linker.
          driver="$BUSTER_RAM_ROOT/bootstrap-driver"
          set +e
          (
            cd "$BUSTER_RAM_ROOT/source" &&
            clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver" &&
            "$driver" generate --cc clang --ci --linker DEFAULT &&
            "$driver" build --config Release -t test_all --verbose
          ) >"$log" 2>&1
          status=$?
          set -e
          printf 'BUSTER_GITHUB_CI platform=%s exit_code=%d\n' '${{ matrix.name }}' "$status"
          exit "$status"

      - name: Test on Windows without retaining logs
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Log = Join-Path $env:BUSTER_RAM_ROOT 'tmp\buster-ci.log'
          # generate wipes build/ (and Windows cannot delete a running exe),
          # so the bootstrap driver must live outside the build directory.
          $Driver = Join-Path $env:BUSTER_RAM_ROOT 'bootstrap-driver.exe'
          $Status = 1
          try {
            $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $VsPath = (& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1).Trim()
            if (-not $VsPath) { throw 'Visual Studio with VC tools was not found' }
            & (Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation *> $null
            Push-Location (Join-Path $env:BUSTER_RAM_ROOT 'source')
            try {
              # Native toolchain output goes through cmd so stderr progress
              # cannot become a terminating PowerShell error record.
              cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`" >> `"$Log`" 2>&1"
              if ($LASTEXITCODE -eq 0) {
                cmd /c "`"$Driver`" generate --cc clang --ci >> `"$Log`" 2>&1"
                if ($LASTEXITCODE -eq 0) {
                  cmd /c "`"$Driver`" build --config Release -t test_all --verbose >> `"$Log`" 2>&1"
                }
              }
              $Status = $LASTEXITCODE
            } finally {
              Pop-Location
            }
          } catch {
            Write-Output "BUSTER_GITHUB_CI setup_error=$($_.Exception.Message)"
            $Status = 1
          }
          Write-Output "BUSTER_GITHUB_CI platform=Windows exit_code=$Status"
          exit $Status

      - name: Destroy the memory workspace
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ram_root="${BUSTER_RAM_ROOT:-}"
          if command -v cygpath >/dev/null 2>&1 && [[ -n "$ram_root" ]]; then
            ram_root=$(cygpath -u "$ram_root")
          fi
          case "$RUNNER_OS" in
            Linux)
              if [[ -n "$ram_root" ]] && mountpoint -q "$ram_root"; then
                sudo umount -f "$ram_root" || sudo umount -l "$ram_root" || true
              fi
              ;;
            macOS)
              if [[ -n "${BUSTER_RAM_DEVICE:-}" ]]; then
                hdiutil detach -force "$BUSTER_RAM_DEVICE" >/dev/null 2>&1 || true
              fi
              ;;
          esac
          if [[ -n "$ram_root" ]]; then
            rm -rf "$ram_root" || true
          fi
