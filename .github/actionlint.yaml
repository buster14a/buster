# actionlint validates `runs-on` against a list of runner labels compiled into
# the binary, so a release older than a runner image reports a label it has
# never heard of. These are all standard GitHub-hosted labels; actionlint uses
# the self-hosted-runner configuration as its extension point for newer labels.
# Keep this list synchronized exactly with the matrix in .github/workflows/ci.yml.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
    - macos-26
    - macos-26-intel
    - windows-11-arm
