# actionlint validates `runs-on` against a list of runner labels compiled into
# the binary, so a release older than a runner image reports a label it has
# never heard of. These are all standard GitHub-hosted labels; actionlint uses
# the self-hosted-runner configuration as its extension point for newer labels.
# Keep hosted labels synchronized with .github/workflows/ci.yml and the
# custom benchmark labels with .github/workflows/9700x-service-dispatch.yml.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
    - macos-26
    - macos-26-intel
    - windows-11-arm
    # Custom labels of the dedicated self-hosted Ryzen 9700X runner used
    # only by the fixed service dispatch workflow.
    - buster-zen5
    - ryzen-9700x
