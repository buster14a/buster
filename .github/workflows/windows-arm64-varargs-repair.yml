name: Windows ARM64 varargs repair

on:
  push:
    branches:
      - claude/unruffled-bhabha-f5d28a

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: claude/unruffled-bhabha-f5d28a

      - name: Apply and commit repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-windows-arm64-varargs-fix.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/buster/lib/string.c
          git rm .github/scripts/apply-windows-arm64-varargs-fix.py .github/workflows/windows-arm64-varargs-repair.yml
          git commit -m "fix(ci): track Windows ARM64 variadic argument slots"
          git push origin HEAD:claude/unruffled-bhabha-f5d28a
