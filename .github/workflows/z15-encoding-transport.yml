name: Z15 source transport
on:
  push:
    branches: [astra/z15-encoding-transport-20260910]
    paths: [.github/workflows/z15-encoding-transport.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          persist-credentials: false
      - name: Retain pinned source for inspection, without building
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/z15-source"
          git rev-parse HEAD | tee "$RUNNER_TEMP/z15-source/source-sha.txt"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/z15-source/source.tar.gz"
          sha256sum "$RUNNER_TEMP/z15-source/source.tar.gz"
          lscpu
          uname -a
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: z15-pinned-source
          path: ${{ runner.temp }}/z15-source/
          if-no-files-found: error
          retention-days: 1
