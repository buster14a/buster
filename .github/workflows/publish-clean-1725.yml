name: Publish clean issue 1725 branch

on:
  push:
    branches: [codex/1725-source-diagnostics]
    paths: ['.github/workflows/publish-clean-1725.yml']

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Rebase the validated patch onto current main
        shell: bash
        run: |
          set -euo pipefail
          base=35771aba8565022f75250ad297218459b395450d
          final_branch=codex/1725-source-facing-diagnostics
          patch="$RUNNER_TEMP/issue-1725.patch"
          git diff --binary "$base" -- \
            src/buster/lib/compiler/frontend/c/c_gen.c \
            src/buster/tests/compiler/diagnostic_test.c > "$patch"
          test -s "$patch"

          git fetch origin main
          git switch --create "$final_branch" origin/main
          git apply --3way --index "$patch"
          git diff --cached --check
          expected=$(printf '%s\n%s' \
            src/buster/lib/compiler/frontend/c/c_gen.c \
            src/buster/tests/compiler/diagnostic_test.c)
          actual=$(git diff --cached --name-only)
          test "$actual" = "$expected"

          driver="$RUNNER_TEMP/buster-build"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable \
            -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$driver"
          "$driver" generate --cc clang --config Debug --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
          "$driver" build --config Debug -t ide
          ide=$(find build -type f -name ide -perm -111 -print -quit)
          test -n "$ide"
          "$ide" test --module=compiler_diagnostic_tests,c_frontend_tests --verbose=1 --ci=1

          cat > "$RUNNER_TEMP/issue-1725.c" <<'EOF'
          int main(void) { return (1, 2); }
          EOF
          "$ide" cc -fsyntax-only -target x86_64-unknown-linux "$RUNNER_TEMP/issue-1725.c"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: render source-facing C IR diagnostics'
          git push --set-upstream origin "$final_branch"
