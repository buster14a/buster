name: ABI whole-compiler evidence (temporary)
on:
  push:
    branches:
      - 'codex/279-abi-warm-query'
    paths:
      - 'tools/research/abi_warm_query/**'
      - '.github/workflows/issue-279-evidence.yml'
permissions:
  contents: read
concurrency:
  group: issue-279-evidence
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: af6b2b100acfdd9c970e35e33d4468cd35883812
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
          persist-credentials: false
      - name: Environment
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mold
          clang --version | tee evidence/clang.txt
          lscpu > evidence/lscpu.txt
          uname -a > evidence/uname.txt
          git -C baseline rev-parse HEAD HEAD^{tree} > evidence/baseline.txt
          git -C candidate rev-parse HEAD HEAD^{tree} > evidence/candidate.txt
      - name: Build both trusted Clang compilers
        run: |
          set -euo pipefail
          for version in baseline candidate; do
            (cd "$version"
              clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o "$RUNNER_TEMP/build-$version"
              "$RUNNER_TEMP/build-$version" generate --cc clang --ci
              "$RUNNER_TEMP/build-$version" build --config Release -t ide -- -j2
            ) 2>&1 | tee "evidence/build-$version.log"
            sha256sum "$version/build/Release/ide" > "evidence/compiler-$version.sha256"
          done
      - name: Confirm existing baseline-target refusal on unchanged baseline
        run: |
          set -euo pipefail
          cd baseline
          set +e
          build/Release/ide cc -Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -g0 -march=baseline -fregister-allocator=fast -c src/buster/apps/ide/ide.c -o build/issue-1487.o > ../evidence/baseline-refusal.stdout 2> ../evidence/baseline-refusal.stderr
          result=$?
          set -e
          printf '%s\n' "$result" > ../evidence/baseline-refusal.status
          test "$result" -ne 0
          grep -F "function='xgetbv'" ../evidence/baseline-refusal.stderr
      - name: Same-source whole compiler time and peak RSS
        run: |
          set -euo pipefail
          python3 candidate/tools/research/abi_warm_query/compare_compiler.py "$PWD/baseline/build/Release/ide" "$PWD/candidate/build/Release/ide" "$PWD/baseline" "$PWD/evidence/compiler-samples.json" | tee evidence/compiler-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-279-compiler-evidence
          path: evidence
          retention-days: 30
