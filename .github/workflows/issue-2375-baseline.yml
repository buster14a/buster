name: Issue 2375 baseline proof
on:
  push:
    branches: [codex/2375-hosted-baseline-proof]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      BUSTER_TEST_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7afde682de1beb595c779192c9519b7524afb412
          persist-credentials: false
      - name: Baseline identity and compiler build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          { git rev-parse HEAD; git rev-parse 'HEAD^{tree}'; uname -a; clang --version; gcc --version; } | tee "$RUNNER_TEMP/evidence/identity.txt"
          clang -Isrc -I. -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/buster-driver"
          "$RUNNER_TEMP/buster-driver" generate --ci --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
          "$RUNNER_TEMP/buster-driver" build --config Release -t ide
          sha256sum build/Release/ide >> "$RUNNER_TEMP/evidence/identity.txt"
      - name: Baseline self-host fixed point
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-driver" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/evidence/baseline-self-host.txt"
      - name: Reproduce supported C address-initializer defect
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/evidence/witness.c" <<'C'
          enum { thread_local = 7 };
          int x = thread_local;
          int *p = &x;
          int main(void) { if (x != 7 || *p != 7 || p != &x) return 1; *p = 9; return x != 9; }
          C
          for compiler in gcc clang; do
            for dialect in c17 gnu17; do
              "$compiler" -std="$dialect" -pedantic-errors -nostdinc "$RUNNER_TEMP/evidence/witness.c" -o "$RUNNER_TEMP/evidence/$compiler-$dialect"
              "$RUNNER_TEMP/evidence/$compiler-$dialect"
            done
          done
          failures=0
          for dialect in c17 gnu17; do
            for form in -ffrontend-ssa -fno-frontend-ssa; do
              set +e
              build/Release/ide cc -std="$dialect" "$form" -nostdinc -c "$RUNNER_TEMP/evidence/witness.c" -o "$RUNNER_TEMP/evidence/subject.o" > "$RUNNER_TEMP/evidence/$dialect-$form.txt" 2>&1
              status=$?
              set -e
              cat "$RUNNER_TEMP/evidence/$dialect-$form.txt"
              test "$status" -ne 0
              grep -F 'a static initializer may not take the address of a thread-local object' "$RUNNER_TEMP/evidence/$dialect-$form.txt"
              failures=$((failures + 1))
            done
          done
          test "$failures" -eq 4
          printf 'Expected baseline rejections: %s; independent GCC/Clang executions: 4\n' "$failures" | tee "$RUNNER_TEMP/evidence/result.txt"
      - name: Retain baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-2375-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
