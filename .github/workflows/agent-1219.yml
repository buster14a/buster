# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Temporary transport for the directed #1219 session; removed from the final tree.
name: Issue 1219 source transport
on:
  push:
    branches: [chatgpt/1219-known-bits]
    paths: [.github/workflows/agent-1219.yml, .agent/1219.patch]
permissions:
  contents: write
jobs:
  transport:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
      - name: Apply the directed source patch when present
        shell: bash
        run: |
          set -euo pipefail
          if test -f .agent/1219.patch; then
            git apply --check .agent/1219.patch
            git apply --index .agent/1219.patch
            git rm .agent/1219.patch .github/workflows/agent-1219.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            sh .githooks/enable-sign-off.sh --maintainer-session
            git commit -m 'Tier 1: use proven upper bits to eliminate redundant extensions'
            git push origin HEAD:refs/heads/chatgpt/1219-known-bits
          fi
      - name: Export only tracked source, without Git credentials
        shell: bash
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1219-source
          path: ${{ runner.temp }}/source.tar
          retention-days: 1
