# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Temporary issue-1107 workbench; not part of the implementation PR.
name: Issue 1107 workbench
on:
  push:
    branches: [agent/1107-diagnostic-workbench]
    paths: [.issue-1107-trigger]
permissions:
  contents: write
concurrency:
  group: issue-1107-workbench
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Install repository-qualified tools
        run: bash tools/ci/setup-hosted.sh
      - name: Prepare clean implementation worktree
        run: |
          base=$(git rev-parse b205a3c2ea9f1179569e4b2516f2f7b6d39e93ea^)
          git worktree add --detach "$RUNNER_TEMP/solution" "$base"
          cp src/buster/compiler/c_check_semantic_diagnostic.c "$RUNNER_TEMP/solution/src/buster/compiler/"
          python3 .issue-1107-edit.py "$RUNNER_TEMP/solution"
          cd "$RUNNER_TEMP/solution"
          git diff --check
          git add src/buster/compiler docs/commands/checker.md
          git diff --cached --stat
          git diff --cached > "$RUNNER_TEMP/issue-1107.patch"
      - name: Build diagnostic debug executable
        working-directory: ${{ runner.temp }}/solution
        env:
          BUSTER_HOST_ARCH: x86-64
          BUSTER_DEBUG_INFO: '0'
        run: |
          sed 's/^optimization=-O3$/optimization=-O0/' build.sh > "$RUNNER_TEMP/build-1107-debug.sh"
          bash "$RUNNER_TEMP/build-1107-debug.sh"
      - name: Exact semantic diagnostics and valid twins
        working-directory: ${{ runner.temp }}/solution
        run: ./build/compiler test-checker --semantic-diagnostics
      - name: Publish clean implementation branch
        working-directory: ${{ runner.temp }}/solution
        run: |
          git config user.name 'David Gonzalez Martin'
          git config user.email davidgmbb@gmail.com
          .githooks/enable-sign-off.sh --maintainer-session
          git commit -m 'fix(checker): render contextual semantic errors and exact source columns' -m 'Preserve static-assert messages, retain duplicate-case details, and add exact text/column constraint fixtures with valid twins. Fixes #1107.' -m 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>'
          git log -1 --format=full
          git push origin HEAD:refs/heads/agent/1107-semantic-diagnostics
      - name: Retain patch for inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1107-patch
          path: ${{ runner.temp }}/issue-1107.patch
          retention-days: 1
          if-no-files-found: ignore
