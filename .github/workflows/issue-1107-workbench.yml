# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Temporary issue-1107 workbench; not part of the implementation PR.
name: Issue 1107 workbench
on:
  push:
    branches: [agent/1107-diagnostic-workbench]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install repository-qualified tools
        run: bash tools/ci/setup-hosted.sh
      - name: Archive diagnostic toolchain
        run: tar -czf "$RUNNER_TEMP/issue-1107-llvm.tar.gz" -C "$RUNNER_TEMP" llvm-23.1.4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1107-llvm
          path: ${{ runner.temp }}/issue-1107-llvm.tar.gz
          retention-days: 1
          if-no-files-found: error
