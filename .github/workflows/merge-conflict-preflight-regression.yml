name: Merge conflict preflight regression

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: merge-conflict-preflight-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Preflight regression tests
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ubuntu-latest
      - name: Check out candidate for unprivileged tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Exercise merge-tree fixtures and workflow policy
        run: |
          python3 -B tools/merge_conflict_preflight_test.py -v
          python3 -B tools/merge_conflict_preflight_refresh_test.py -v
          python3 -B tools/merge_conflict_preflight_attestation_test.py -v
          python3 -B tools/main_push_maintenance_test.py -v
          python3 -B tools/ci_workflow_concurrency_test.py -v
