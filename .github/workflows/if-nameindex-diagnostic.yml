name: if_nameindex type-name diagnostics
on:
  push:
    branches:
      - codex/3444-if-nameindex-probe
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: if-nameindex-${{ github.ref }}
  cancel-in-progress: false
jobs:
  correctness:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      BUSTER_TEST_JOBS: '2'
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ubuntu-26.04
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Bootstrap and build trusted compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aggregate-evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/aggregate-evidence/identity.txt"
          clang --version > "$RUNNER_TEMP/aggregate-evidence/clang.txt"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/aggregate-build"
          "$RUNNER_TEMP/aggregate-build" generate --ci --cc clang --no-sanitize --no-fuzz --no-lto --linker DEFAULT
          "$RUNNER_TEMP/aggregate-build" build --config Release -t ide
      - name: Type-name probes
        shell: bash
        run: |
          set +e
          set -uo pipefail
          failures=0
          for case_id in $(seq 0 31); do
            clang -E -P -DCASE="$case_id" .github/diagnostics/if-nameindex-probe.c -o "$RUNNER_TEMP/probe-$case_id.c"
            clang -std=c99 -O0 "$RUNNER_TEMP/probe-$case_id.c" -o "$RUNNER_TEMP/reference-$case_id"
            "$RUNNER_TEMP/reference-$case_id"
            reference_result=$?
            for allocator in fast quality; do
              build/Release/ide cc -std=c99 -g0 -fcompile-jobs=1 -fregister-allocator="$allocator" -fverify-codegen "$RUNNER_TEMP/probe-$case_id.c" -o "$RUNNER_TEMP/buster-$case_id-$allocator" > "$RUNNER_TEMP/aggregate-evidence/probe-$case_id-$allocator.log" 2>&1
              compile_result=$?
              runtime_result=999
              if [ "$compile_result" -eq 0 ]; then
                "$RUNNER_TEMP/buster-$case_id-$allocator"
                runtime_result=$?
              fi
              echo "PROBE case=$case_id allocator=$allocator reference=$reference_result compile=$compile_result runtime=$runtime_result" | tee -a "$RUNNER_TEMP/aggregate-evidence/probe-summary.log"
              cat "$RUNNER_TEMP/aggregate-evidence/probe-$case_id-$allocator.log"
              if [ "$reference_result" -ne 0 ] || [ "$compile_result" -ne 0 ] || [ "$runtime_result" -ne 0 ]; then failures=$((failures+1)); fi
            done
          done
          echo "PROBE failures=$failures"
          test "$failures" -eq 0
      - name: Retain machine records
        if: ${{ !cancelled() }}
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: retain
          retention-directory: ${{ runner.temp }}/aggregate-evidence
      - name: Retain diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aggregate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aggregate-evidence/
            build/CMakeCache.txt
            build/musl*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
