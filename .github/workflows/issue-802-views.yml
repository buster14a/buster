name: Issue 802 scratch and command qualification
on:
  push:
    branches: [codex/issue-802-views-transfer]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 2
      - name: Apply source-only follow-up at the published PR head
        run: |
          set -euo pipefail
          echo '' | base64 --decode | xz --decompress > "$RUNNER_TEMP/followup.patch"
          printf '%s  %s\n' 3cd52401767ab5926793595cdeb9bcbcf21430aa6819e69a990a30eb47051897 "$RUNNER_TEMP/followup.patch" | sha256sum --check
          git checkout --detach 6a5e8e28559ebf906dbc42e80313a1baf0d1ec83
          git apply "$RUNNER_TEMP/followup.patch"
          git diff --check
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep scratch views commit-aware and inject exact resource refusals (#802)'
          git rev-parse HEAD
          git push origin HEAD:refs/heads/codex/issue-802-views-result
      - run: bash tools/ci/setup-hosted.sh
      - name: Build the compiler
        run: |
          mkdir -p "$RUNNER_TEMP/memory-limited" "$RUNNER_TEMP/memory-valgrind" "$RUNNER_TEMP/memory-strict" "$RUNNER_TEMP/qualification"
          ./build.sh 2>&1 | tee "$RUNNER_TEMP/qualification/build.log"
          clang -std=c17 -march=x86-64 -O2 -Isrc -fwrapv -funsigned-char -fno-strict-aliasing -Wall -Wextra -Werror -Wno-unused-function tests/arena/resources.c -o "$RUNNER_TEMP/memory-resources" -pthread
      - name: Limited address space and deterministic failures
        run: '"$RUNNER_TEMP/memory-resources" "$PWD/build/compiler" "$RUNNER_TEMP/memory-limited"'
      - name: Callgrind
        if: ${{ !cancelled() && hashFiles('build/compiler') != '' }}
        run: '"$RUNNER_TEMP/memory-resources" "$PWD/build/compiler" "$RUNNER_TEMP/memory-valgrind" --valgrind'
      - name: Strict overcommit with four GiB headroom
        if: ${{ !cancelled() && hashFiles('build/compiler') != '' }}
        run: |
          old_mode=$(cat /proc/sys/vm/overcommit_memory)
          old_kbytes=$(cat /proc/sys/vm/overcommit_kbytes)
          old_ratio=$(cat /proc/sys/vm/overcommit_ratio)
          trap 'sudo sysctl -q -w vm.overcommit_memory="$old_mode"; if [ "$old_kbytes" = 0 ]; then sudo sysctl -q -w vm.overcommit_ratio="$old_ratio"; else sudo sysctl -q -w vm.overcommit_kbytes="$old_kbytes"; fi' EXIT
          budget=$(awk '/^Committed_AS:/ {used=$2} /^SwapTotal:/ {swap=$2} END {printf "%.0f\n", used + 4*1024*1024 - swap}' /proc/meminfo)
          sudo sysctl -q -w vm.overcommit_kbytes="$budget" vm.overcommit_memory=2
          "$RUNNER_TEMP/memory-resources" "$PWD/build/compiler" "$RUNNER_TEMP/memory-strict" --strict
      - name: Check scratch consumers
        if: ${{ !cancelled() && hashFiles('build/compiler') != '' }}
        run: |
          status=0
          for command in test-ssa test-ir test-ir-metamorphic test-ir-reduce; do
            timeout 120 ./build/compiler "$command" > "$RUNNER_TEMP/qualification/$command.log" 2>&1 || status=1
            tail -n 20 "$RUNNER_TEMP/qualification/$command.log"
          done
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-802-followup-qualification
          path: |
            ${{ runner.temp }}/qualification/
            ${{ runner.temp }}/memory-*/
            build/compiler
            LICENSE
            LICENSES/
            THIRD_PARTY_NOTICES.md
          retention-days: 7
