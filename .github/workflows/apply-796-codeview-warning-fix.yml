name: Apply PR 796 CodeView warning fix

on:
  push:
    branches:
      - fix/786-native-retirement-closure
    paths:
      - .github/workflows/apply-796-codeview-warning-fix.yml

permissions:
  contents: read

concurrency:
  group: apply-796-codeview-warning-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repair revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fix warning, build, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/buster/lib/compiler/codeview/codeview.c')
          text = path.read_text()
          old = '                        u32 kind = range->location.pieces[piece_index].kind;'
          new = '                        DebugLocationKind kind = range->location.pieces[piece_index].kind;'
          if text.count(old) != 1:
              raise SystemExit(f'expected one signedness site, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -lm -o "$RUNNER_TEMP/strict-build"
          "$RUNNER_TEMP/strict-build" generate --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/strict-build" build --config Release -t ide
          python3 tests/ci_tools_test.py -v
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/buster/lib/compiler/codeview/codeview.c
          git rm .github/workflows/apply-796-codeview-warning-fix.yml
          git commit -m "fix(codeview): preserve location-kind type"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
