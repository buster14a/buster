name: Probe issue 513 cutover replay
on:
  push:
    branches: [codex/513-reconcile-probe]
    paths: [.github/workflows/issue513-merge-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Replay the exact recovered cutover without publishing
        shell: bash
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main recovery/6aa84ae5/522-514-cutover-review
          git checkout --detach origin/main
          set +e
          git cherry-pick --no-commit 0f7676b27def833143727947fa0e20682007a73f >merge.log 2>&1
          replay_status=$?
          set -e
          cat merge.log
          printf '\nREPLAY_STATUS=%s\n' "$replay_status"
          printf '\nUNMERGED_PATHS\n'
          git diff --name-only --diff-filter=U || true
          printf '\nSTATUS\n'
          git status --short
          exit 0
