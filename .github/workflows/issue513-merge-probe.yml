name: Split issue 513 cutover conflicts
on:
  push:
    branches: [codex/513-reconcile-probe]
    paths: [.github/workflows/issue513-merge-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Replay and split conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main recovery/6aa84ae5/522-514-cutover-review
          git checkout --detach origin/main
          git cherry-pick --no-commit 0f7676b27def833143727947fa0e20682007a73f >/tmp/replay.log 2>&1 || true
          rm -rf /tmp/issue513-conflicts
          mkdir -p /tmp/issue513-conflicts
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              'src/buster/lib/compiler/codegen/codegen.c',
              'src/buster/lib/compiler/codegen/codegen_internal.h',
              'src/buster/tests/compiler/driver/driver_test.c',
          ]
          out = Path('/tmp/issue513-conflicts')
          for name in paths:
              lines = Path(name).read_text(errors='replace').splitlines()
              starts = [i for i, line in enumerate(lines) if line.startswith('<<<<<<<')]
              stem = name.replace('/', '__')
              for n, start in enumerate(starts, 1):
                  sep = next(i for i in range(start + 1, len(lines)) if lines[i] == '=======')
                  end = next(i for i in range(sep + 1, len(lines)) if lines[i].startswith('>>>>>>>'))
                  lo = max(0, start - 20)
                  hi = min(len(lines), end + 21)
                  body = [f'path={name}', f'conflict={n}', f'start={start + 1}', f'separator={sep + 1}', f'end={end + 1}', '']
                  body.extend(f'{i + 1:07d}: {lines[i]}' for i in range(lo, hi))
                  (out / f'{stem}.{n}.txt').write_text('\n'.join(body) + '\n')
          PY
          git reset --hard origin/main
          git checkout -B codex/513-reconcile-probe origin/codex/513-reconcile-probe
          rm -rf issue513-conflict-blocks
          cp -R /tmp/issue513-conflicts issue513-conflict-blocks
          git add issue513-conflict-blocks
          git commit -m 'ci: split issue 513 merge conflicts [skip ci]'
          git push origin HEAD:codex/513-reconcile-probe
