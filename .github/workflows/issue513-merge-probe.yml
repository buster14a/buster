name: Validate issue 513 reconciled candidate
on:
  push:
    branches: [codex/513-reconcile-probe]
    paths: [.github/workflows/issue513-merge-probe.yml]
permissions:
  contents: read
jobs:
  test-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/513-reconciled-candidate
          fetch-depth: 0
      - name: Static cutover guards
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- '*.c' '*.h' '*.md' '*.py'
          test "$(git rev-list --count origin/main..HEAD)" = 1
      - name: Release test suite
        run: ./build.sh test_all --config Release
  self-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/513-reconciled-candidate
          fetch-depth: 0
      - name: Release fixed point
        run: ./build.sh test_self_host --config Release
