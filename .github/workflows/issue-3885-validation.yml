name: Issue 3885 hosted read-only validation
on:
  push:
    branches: [codex/3885-neutral-pending-supersession]
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: ubuntu-24.04
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Read the native incident annotation through existing gh transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --hostname github.com https://github.com/buster14a/buster/actions/runs/38297977458/attempts/1 -X GET -H 'Accept: text/html' > "$RUNNER_TEMP/3885-native-page.html"
          test -s "$RUNNER_TEMP/3885-native-page.html"
          grep -o 'Canceling since a higher priority waiting request for buster-9700x-direct-bench-main-compare exists' "$RUNNER_TEMP/3885-native-page.html"
      - name: Compile and exercise the native lifecycle
        run: |
          set -euo pipefail
          clang -std=c11 -Isrc -O2 -Wall -Wextra -Werror -Wno-unused-function -fwrapv -fno-strict-aliasing -funsigned-char tools/bench_direct/lifecycle.c -lm -o "$RUNNER_TEMP/lifecycle"
          "$RUNNER_TEMP/lifecycle" --self-test
          gcc -std=c11 -Isrc -O1 -g -Wall -Wextra -Werror -Wno-unused-function -fwrapv -fno-strict-aliasing -funsigned-char -fsanitize=address,undefined -fno-sanitize-recover=all tools/bench_direct/lifecycle.c -lm -o "$RUNNER_TEMP/lifecycle-sanitized"
          "$RUNNER_TEMP/lifecycle-sanitized" --self-test
          git diff --check b7354cef71648dd842c7c25d2f436d97ac4ccd32..HEAD
