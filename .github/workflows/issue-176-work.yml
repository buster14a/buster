name: Issue 176 focused hosted validation
on:
  push:
    branches: [chatgpt/176-typed-oracle-continuation]
    paths: [.github/workflows/issue-176-work.yml]
permissions:
  contents: read
jobs:
  patch:
    if: github.repository_id == '1421805693' && github.ref == 'refs/heads/chatgpt/176-typed-oracle-continuation'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.apply.outputs.revision }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
      - name: Apply checked typed indirect-call support on the session branch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/issue-176-v6.patch.b64; then
              base64 --decode .github/issue-176-v6.patch.b64 | gzip --decompress > "$RUNNER_TEMP/issue-176-v6.patch"
              printf '%s  %s\n' 95eb0d78bcb7fce0fab903b028bbb39e8a2156b8002ebd93a404363ac13ce6dd "$RUNNER_TEMP/issue-176-v6.patch" | sha256sum --check
              git apply --check "$RUNNER_TEMP/issue-176-v6.patch"
              git apply "$RUNNER_TEMP/issue-176-v6.patch"
              git diff --check
              git add docs/ir-tools.md src/buster/compiler/interpreter.c src/buster/compiler/interpreter_wide_test.c
              git rm .github/issue-176-v6.patch.b64
              git config user.name 'David Gonzalez Martin'
              git config user.email 'davidgmbb@gmail.com'
              sh .githooks/enable-sign-off.sh --maintainer-session
              git commit -m 'feat(interpreter): resolve checked typed indirect calls' -m 'Consume the callee below its arguments and resolve only stable interpreted-function tokens or explicitly registered native addresses. Add wide interpreted/native, unknown-target, class/stack-shape and zero-argument void regressions. This lets the original generated x87 programs run without rewriting their call inputs.' -m 'Original project code authored for the maintainer by OpenAI / GPT-6 Astra Pro. This ChatGPT environment exposes neither a private session URL nor a session identifier.' -m 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>'
              test "$(git ls-remote origin refs/heads/chatgpt/176-typed-oracle-continuation | cut -f1)" = "$GITHUB_SHA"
              git push origin HEAD:refs/heads/chatgpt/176-typed-oracle-continuation
          fi
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  test:
    needs: patch
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        sanitizer: [none, address]
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_SANITIZER: ${{ matrix.sanitizer }}
      BUSTER_SANITIZER_OPTIMIZATION: '1'
      BUSTER_LINKER: lld
      BUSTER_DEBUG_INFO: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.patch.outputs.revision }}
          persist-credentials: false
      - name: Install pinned hosted toolchain
        run: bash tools/ci/setup-hosted.sh
      - name: Configure fatal sanitizer checks
        if: matrix.sanitizer != 'none'
        run: bash tools/ci/sanitizers.sh configure "$RUNNER_TEMP/sanitizer-reports"
      - name: Build Release compiler
        run: ./build.sh --config Release
      - name: Focused correctness suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-176-results"
          git rev-parse HEAD | tee "$RUNNER_TEMP/issue-176-results/revision"
          for suite in test-interpreter test-interpreter-native test-interpreter-link test-ir-interpreter test-ir-lowering; do
              ./build/compiler "$suite" 2>&1 | tee "$RUNNER_TEMP/issue-176-results/$suite.txt"
          done
      - name: Expanded random diagnostic campaign (known baseline failures)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-176-results"
          ./build/compiler test-interpreter --count 256 --seed 176 2>&1 | tee "$RUNNER_TEMP/issue-176-results/expanded.txt"
      - name: Audit all sanitizer reports
        if: always() && matrix.sanitizer != 'none'
        run: bash tools/ci/sanitizers.sh audit "$RUNNER_TEMP/sanitizer-reports"
      - name: Retain focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-176-results-${{ matrix.sanitizer }}
          path: |
            ${{ runner.temp }}/issue-176-results
            ${{ runner.temp }}/sanitizer-reports
          if-no-files-found: ignore
          retention-days: 3
