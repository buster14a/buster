name: Issue 176 focused hosted validation
on:
  push:
    branches: [chatgpt/176-typed-oracle-continuation]
    paths: [.github/workflows/issue-176-work.yml]
permissions:
  contents: read
jobs:
  patch:
    if: github.repository_id == '1421805693' && github.ref == 'refs/heads/chatgpt/176-typed-oracle-continuation'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.apply.outputs.revision }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
      - name: Apply the checked original patch on the session branch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/issue-176-v2.patch.b64; then
              { cat .github/issue-176-v2.patch.b64 .github/issue-176-v2.patch.b64.2 .github/issue-176-v2.patch.b64.3; sed -e 's/BUyr7BUyrZ/BUyrZ/' -e 's/Cu4Nyy6/Cu4Ny6/' .github/issue-176-v2.patch.b64.4; } | base64 --decode | gzip --decompress > "$RUNNER_TEMP/issue-176-v2.patch"
              printf '%s  %s\n' 60e6a15d09962b3b0a5b524fe64f422bfb8cb72e014454b61fbc0d58dd6bbad3 "$RUNNER_TEMP/issue-176-v2.patch" | sha256sum --check
              git apply --check "$RUNNER_TEMP/issue-176-v2.patch"
              git apply "$RUNNER_TEMP/issue-176-v2.patch"
              git diff --check
              git add src/buster/compiler/interpreter.c src/buster/compiler/interpreter_object_test.c src/buster/compiler/interpreter_test.c src/buster/compiler/interpreter_typed_value.c src/buster/compiler/interpreter_value.c src/buster/compiler/interpreter_wide_test.c src/buster/compiler/ir_interpreter.c
              git rm .github/issue-176-v2.patch.b64 .github/issue-176-v2.patch.b64.2 .github/issue-176-v2.patch.b64.3 .github/issue-176-v2.patch.b64.4
              git config user.name 'David Gonzalez Martin'
              git config user.email 'davidgmbb@gmail.com'
              git -c core.hooksPath=/dev/null commit -m 'feat(interpreter): execute two-word typed scalar values' -m 'Support i128, u128 and f80 across typed storage, arithmetic, conversions and call boundaries. Share value helpers with the IR executor, independently of lowering. Correct the object reuse fixture to copy a bounded prefix.' -m 'Original project code authored for the maintainer by OpenAI / GPT-6 Astra Pro; this ChatGPT environment exposes neither a private session URL nor a session identifier.' -m 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>'
              test "$(git ls-remote origin refs/heads/chatgpt/176-typed-oracle-continuation | cut -f1)" = "$GITHUB_SHA"
              git push origin HEAD:refs/heads/chatgpt/176-typed-oracle-continuation
          fi
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  test:
    needs: patch
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [none, address]
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_SANITIZER: ${{ matrix.sanitizer }}
      BUSTER_SANITIZER_OPTIMIZATION: '1'
      BUSTER_LINKER: lld
      BUSTER_DEBUG_INFO: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.patch.outputs.revision }}
          persist-credentials: false
      - name: Install pinned hosted toolchain
        run: bash tools/ci/setup-hosted.sh
      - name: Configure fatal sanitizer checks
        if: matrix.sanitizer != 'none'
        run: bash tools/ci/sanitizers.sh configure "$RUNNER_TEMP/sanitizer-reports"
      - name: Build Release compiler
        run: ./build.sh --config Release
      - name: Focused correctness suites
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          git rev-parse HEAD
          for suite in test-interpreter test-interpreter-native test-interpreter-link test-ir-interpreter test-ir-lowering; do
              ./build/compiler "$suite" || failed=1
          done
          exit "$failed"
      - name: Expanded random diagnostic campaign
        if: always()
        continue-on-error: true
        run: ./build/compiler test-interpreter --count 256 --seed 176
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-176-diagnostics-${{ matrix.sanitizer }}
          path: ${{ runner.temp }}/sanitizer-reports
          if-no-files-found: ignore
          retention-days: 3
  baseline:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_SANITIZER: none
      BUSTER_LINKER: lld
      BUSTER_DEBUG_INFO: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 184e1c48b2caa41fabfd43a478d2d06215fa3d43
          persist-credentials: false
      - name: Install pinned hosted toolchain
        run: bash tools/ci/setup-hosted.sh
      - name: Build untouched source baseline
        run: ./build.sh --config Release
      - name: Baseline default interpreter campaign
        run: ./build/compiler test-interpreter
      - name: Baseline expanded random diagnostic campaign
        continue-on-error: true
        run: ./build/compiler test-interpreter --count 256 --seed 176
