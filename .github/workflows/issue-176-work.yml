name: Issue 176 focused hosted validation
on:
  push:
    branches: [chatgpt/176-typed-oracle-continuation]
    paths: [.github/workflows/issue-176-work.yml]
permissions:
  contents: read
jobs:
  patch:
    if: github.repository_id == '1421805693' && github.ref == 'refs/heads/chatgpt/176-typed-oracle-continuation'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.apply.outputs.revision }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
      - name: Apply checked final regressions on the session branch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/issue-176-v3.patch.b64.1; then
              { cat .github/issue-176-v3.patch.b64.1 .github/issue-176-v3.patch.b64.2; sed -e 's/Qi249wy8/Qi249w8/' -e 's/VanxusFDEG/VanxusDAEG/' -e 's/F61OK/F+OK/' -e 's/VKzFyh/VKzFh/' .github/issue-176-v3.patch.b64.3; } | base64 --decode | gzip --decompress > "$RUNNER_TEMP/issue-176-v3.patch"
              printf '%s  %s\n' 21d42fc6f71bce3b75c098802fbf7d75fb080a40fe72a9967e3cbf2544c6d2e4 "$RUNNER_TEMP/issue-176-v3.patch" | sha256sum --check
              git apply --check "$RUNNER_TEMP/issue-176-v3.patch"
              git apply "$RUNNER_TEMP/issue-176-v3.patch"
              git diff --check
              git add docs/ir-tools.md src/buster/compiler/interpreter.c src/buster/compiler/interpreter_test.c src/buster/compiler/interpreter_typed_value.c src/buster/compiler/interpreter_value.c src/buster/compiler/interpreter_wide_test.c src/buster/compiler/ir_interpreter.c src/buster/compiler/ir_lower_test.c src/buster/compiler/ir_stack_test.c
              git rm .github/issue-176-v3.patch.b64.1 .github/issue-176-v3.patch.b64.2 .github/issue-176-v3.patch.b64.3
              git config user.name 'David Gonzalez Martin'
              git config user.email 'davidgmbb@gmail.com'
              sh .githooks/enable-sign-off.sh --maintainer-session
              git commit -m 'test(interpreter): exercise wide payloads and exact storage boundaries' -m 'Run generated wide typed programs against the independent fixture machines. Cover f80 exact memory accesses and padding, native two-word returns, conversion pairs and dynamic cleanup. Reject a high-word shift count before narrowing it. Document the remaining issue 176 acceptance boundary.' -m 'Original project code authored for the maintainer by OpenAI / GPT-6 Astra Pro. This ChatGPT environment exposes neither a private session URL nor a session identifier.' -m 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>'
              test "$(git ls-remote origin refs/heads/chatgpt/176-typed-oracle-continuation | cut -f1)" = "$GITHUB_SHA"
              git push origin HEAD:refs/heads/chatgpt/176-typed-oracle-continuation
          fi
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  test:
    needs: patch
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        sanitizer: [none, address]
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_SANITIZER: ${{ matrix.sanitizer }}
      BUSTER_SANITIZER_OPTIMIZATION: '1'
      BUSTER_LINKER: lld
      BUSTER_DEBUG_INFO: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.patch.outputs.revision }}
          persist-credentials: false
      - name: Install pinned hosted toolchain
        run: bash tools/ci/setup-hosted.sh
      - name: Configure fatal sanitizer checks
        if: matrix.sanitizer != 'none'
        run: bash tools/ci/sanitizers.sh configure "$RUNNER_TEMP/sanitizer-reports"
      - name: Build Release compiler
        run: ./build.sh --config Release
      - name: Focused correctness suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-176-results"
          git rev-parse HEAD | tee "$RUNNER_TEMP/issue-176-results/revision"
          for suite in test-interpreter test-interpreter-native test-interpreter-link test-ir-interpreter test-ir-lowering; do
              ./build/compiler "$suite" 2>&1 | tee "$RUNNER_TEMP/issue-176-results/$suite.txt"
          done
      - name: Expanded random diagnostic campaign (known baseline failures)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-176-results"
          ./build/compiler test-interpreter --count 256 --seed 176 2>&1 | tee "$RUNNER_TEMP/issue-176-results/expanded.txt"
      - name: Audit all sanitizer reports
        if: always() && matrix.sanitizer != 'none'
        run: bash tools/ci/sanitizers.sh audit "$RUNNER_TEMP/sanitizer-reports"
      - name: Retain focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-176-results-${{ matrix.sanitizer }}
          path: |
            ${{ runner.temp }}/issue-176-results
            ${{ runner.temp }}/sanitizer-reports
          if-no-files-found: ignore
          retention-days: 3
