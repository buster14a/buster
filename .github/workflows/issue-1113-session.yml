# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Temporary, branch-scoped validation transport; the resulting implementation tree deletes this file.
name: Issue 1113 implementation validation
on:
  pull_request:
    paths: [.github/workflows/issue-1113-session.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.head_ref == 'chatgpt/issue-1113-driver-compat' && github.event.pull_request.head.repo.full_name == github.repository && github.repository_id == '1421805693'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: '0'
      BUSTER_ORACLE_CACHE: check
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Apply the exact session patch and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-1113"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          : > "$RUNNER_TEMP/implementation.patch.bz2"
          for sha in 7cfdd08f5f522d1a55086a147129f979adbaee12 3955698aa05dc0891cd953c5a60a58a24b3b2d99; do
              curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" "$api/git/blobs/$sha" | jq -er .content | base64 --decode >> "$RUNNER_TEMP/implementation.patch.bz2"
          done
          bzip2 -dc "$RUNNER_TEMP/implementation.patch.bz2" > "$RUNNER_TEMP/implementation.patch"
          printf '%s  %s\n' 01db795fc137db7a33f9361df258f6b99cf5a10544004d7077ac3d371545bf40 "$RUNNER_TEMP/implementation.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/implementation.patch"
          git apply "$RUNNER_TEMP/implementation.patch"
          rm .github/workflows/issue-1113-session.yml
          git add -A
          git diff --cached --check
          git diff --cached --stat | tee "$RUNNER_TEMP/issue-1113/diff-stat.txt"
      - name: Install the repository's official Clang 23.1.4 toolchain
        run: bash tools/ci/setup-hosted.sh
      - name: Build the complete compiler
        run: |
          set -euo pipefail
          ./build.sh 2>&1 | tee "$RUNNER_TEMP/issue-1113/build.log"
      - name: Validate real compiler invocations and dependency serialization
        run: |
          set -euo pipefail
          clang -std=c17 -O1 -Wall -Wextra -Werror -DBUSTER_DRIVER_COMPAT_STANDALONE src/buster/compiler/c_driver_compatibility_test.c -o "$RUNNER_TEMP/cc-compat"
          "$RUNNER_TEMP/cc-compat" "$PWD/build/compiler" 2>&1 | tee "$RUNNER_TEMP/issue-1113/compatibility.log"
          for arch in x86-64 native; do
              clang -std=c17 -O2 -march="$arch" -fwrapv -funsigned-char -fno-strict-aliasing -Wall -Wextra -Werror tests/driver/dependency_rule.c -o "$RUNNER_TEMP/dependency-$arch"
              "$RUNNER_TEMP/dependency-$arch" --oracle 2>&1 | tee "$RUNNER_TEMP/issue-1113/dependency-$arch.log"
          done
          git diff --exit-code
      - name: Create the validated Git tree and commit without updating any ref
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          request() { curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$@"; }
          base_tree=$(request "$api/git/commits/$PARENT_SHA" | jq -er .tree.sha)
          entries="$RUNNER_TEMP/entries.jsonl"
          : > "$entries"
          while IFS=$'\t' read -r status path; do
              if [ "$status" = D ]; then
                  jq -cn --arg path "$path" '{path:$path,mode:"100644",type:"blob",sha:null}' >> "$entries"
              else
                  git show ":$path" > "$RUNNER_TEMP/source-file"
                  jq -n --rawfile content "$RUNNER_TEMP/source-file" '{content:$content,encoding:"utf-8"}' > "$RUNNER_TEMP/blob.json"
                  sha=$(request -X POST --data-binary @"$RUNNER_TEMP/blob.json" "$api/git/blobs" | jq -er .sha)
                  expected=$(git hash-object "$RUNNER_TEMP/source-file")
                  test "$sha" = "$expected"
                  jq -cn --arg path "$path" --arg sha "$sha" '{path:$path,mode:"100644",type:"blob",sha:$sha}' >> "$entries"
              fi
          done < <(git diff --cached --name-status --no-renames)
          jq -s --arg base "$base_tree" '{base_tree:$base,tree:.}' "$entries" > "$RUNNER_TEMP/tree.json"
          tree=$(request -X POST --data-binary @"$RUNNER_TEMP/tree.json" "$api/git/trees" | jq -er .sha)
          jq -n --arg tree "$tree" --arg parent "$PARENT_SHA" '{tree:$tree,parents:[$parent],message:"Driver: integrate dependency files, stdin, static modes and identification probes (#1113)\n\nOriginal implementation and regression fixtures. Maintainer DCO certification pending: BUSTER_DCO_SIGN_OFF was unset in the authoring session.\n\nAgent session: ChatGPT conversation; no session identifier or private permalink exposed.\nModel: OpenAI / GPT-6 Astra Pro"}' > "$RUNNER_TEMP/commit.json"
          request -X POST --data-binary @"$RUNNER_TEMP/commit.json" "$api/git/commits" > "$RUNNER_TEMP/issue-1113/commit.json"
          jq -er .sha "$RUNNER_TEMP/issue-1113/commit.json" | tee "$RUNNER_TEMP/issue-1113/commit-sha.txt"
          printf 'Validated commit (no ref was changed): `%s`\n' "$(cat "$RUNNER_TEMP/issue-1113/commit-sha.txt")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-1113-validation
          path: ${{ runner.temp }}/issue-1113/
          retention-days: 7
          if-no-files-found: error
