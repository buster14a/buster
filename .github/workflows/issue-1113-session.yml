# Temporary issue-1113 session transport. Remove before the implementation is ready for review.
name: Issue 1113 source snapshot
on:
  pull_request:
    paths: [.github/workflows/issue-1113-session.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.head_ref == 'chatgpt/issue-1113-driver-compat' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/buster-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1113-source
          path: ${{ runner.temp }}/buster-source.tar.gz
          retention-days: 1
          if-no-files-found: error
