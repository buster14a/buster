name: Issue 793 validation workbench

on:
  push:
    branches: ['perf/793-debug-recorder-residue']
    paths: ['.github/workflows/issue-793-workbench.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LC_ALL: C
      BUSTER_TEST_JOBS: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Apply candidate patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > "$RUNNER_TEMP/issue-793.patch"
          git apply --check "$RUNNER_TEMP/issue-793.patch"
          git apply "$RUNNER_TEMP/issue-793.patch"
          git diff --check
          git diff --stat

      - name: Bootstrap build driver
        shell: bash
        run: |
          set -euo pipefail
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --config Release --cc clang --linker DEFAULT

      - name: Release test suite
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" build --config Release -t test_all 2>&1 | tee "$RUNNER_TEMP/release-test-all.log"

      - name: Release self-host fixed point
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/test-self-host.log"

      - name: Release allocator mode matrix
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" test_mode_matrix --config Release 2>&1 | tee "$RUNNER_TEMP/test-mode-matrix.log"

      - name: Debug test suite
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" generate --config Debug --cc clang --linker DEFAULT
          "$RUNNER_TEMP/buster-build" build --config Debug -t test_all 2>&1 | tee "$RUNNER_TEMP/debug-test-all.log"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-793-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/issue-793.patch
          retention-days: 7
          if-no-files-found: warn
