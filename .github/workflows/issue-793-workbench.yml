name: Issue 793 source workbench

on:
  push:
    branches: ['perf/793-debug-recorder-residue']
    paths: ['.github/workflows/issue-793-workbench.yml']

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Collect repository source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD 'HEAD^{tree}' > revision.txt
          tar --exclude=.git -czf "$RUNNER_TEMP/issue-793-repository.tar.gz" .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-793-repository-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-793-repository.tar.gz
          retention-days: 3
          if-no-files-found: error
