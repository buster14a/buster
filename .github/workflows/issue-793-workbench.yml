name: Issue 793 source workbench

on:
  push:
    branches: ['perf/793-debug-recorder-residue']
    paths: ['.github/workflows/issue-793-workbench.yml']

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Collect issue 793 source
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/issue-793-source"
          mkdir -p "$out/src/buster/lib/compiler/codegen" "$out/src/buster/tests/compiler/codegen" "$out/docs/agents" "$out/.github/workflows"
          cp AGENTS.md "$out/"
          cp src/buster/lib/compiler/codegen/codegen.c "$out/src/buster/lib/compiler/codegen/"
          cp src/buster/lib/compiler/codegen/codegen_internal.h "$out/src/buster/lib/compiler/codegen/"
          cp src/buster/lib/compiler/codegen/machine.c "$out/src/buster/lib/compiler/codegen/"
          cp src/buster/lib/compiler/codegen/machine.h "$out/src/buster/lib/compiler/codegen/"
          cp src/buster/tests/compiler/codegen/codegen_test.c "$out/src/buster/tests/compiler/codegen/"
          cp src/buster/tests/compiler/codegen/machine_test.c "$out/src/buster/tests/compiler/codegen/"
          cp docs/agents/machine.md docs/agents/benchmarking.md docs/agents/testing.md docs/agents/style.md "$out/docs/agents/"
          cp .github/workflows/zen5-audit.yml "$out/.github/workflows/"
          git rev-parse HEAD 'HEAD^{tree}' > "$out/revision.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-793-source-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-793-source
          retention-days: 3
          if-no-files-found: error
