name: Correct PR 800 inline publisher

on:
  push:
    branches:
      - fix/72-aarch64-binary128
    paths:
      - .github/workflows/pr800-fix-inline-workflow.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Anchor the function-tail rewrite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pr800-inline-fixture.yml')
          text = path.read_text()
          old_tail = '''          tail = """    return result;
          }

          // Keep the complete conversion fixture strict on all desktop AArch64 targets.
          """
'''
          new_tail = '''          tail = """    return result;
          }

          // Keep the complete conversion fixture strict on all desktop AArch64 targets.
          // Foreign object success is not execution evidence; native hosts run it too.
          BUSTER_GLOBAL_LOCAL UnitTestResult compiler_driver_test_aarch64_i128_to_float(UnitTestArguments* arguments)
          """
'''
          old_replacement = '''          driver = driver.replace(tail, """    BUSTER_TEST(arguments, os_file_delete(source_path));
              return result;
          }

          // Keep the complete conversion fixture strict on all desktop AArch64 targets.
          """)
'''
          new_replacement = '''          driver = driver.replace(tail, """    BUSTER_TEST(arguments, os_file_delete(source_path));
              return result;
          }

          // Keep the complete conversion fixture strict on all desktop AArch64 targets.
          // Foreign object success is not execution evidence; native hosts run it too.
          BUSTER_GLOBAL_LOCAL UnitTestResult compiler_driver_test_aarch64_i128_to_float(UnitTestArguments* arguments)
          """)
'''
          if text.count(old_tail) != 1 or text.count(old_replacement) != 1:
              raise SystemExit('unexpected inline-workflow source')
          path.write_text(text.replace(old_tail, new_tail).replace(old_replacement, new_replacement))
          PY
          git diff --check
          git config user.name David
          git config user.email davidgmbb@gmail.com
          git add .github/workflows/pr800-inline-fixture.yml
          git commit -m 'ci: anchor PR 800 fixture rewrite'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
