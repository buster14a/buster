name: Research 1125 work removal

on:
  push:
    branches:
      - research/1125-work-removal-d9e736e2-20260925

permissions:
  contents: read

concurrency:
  group: research-1125-work-removal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      BUSTER_TEST_JOBS: '2'
      BUSTER_MATRIX_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: d9e736e2cf08804a2c603d153e9fb608f18c5c49
          persist-credentials: false
          path: source
      - name: Frozen-source correctness and work-count experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 control/tools/research_1125/run.py "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/evidence" 2>&1 | tee "$RUNNER_TEMP/controller.log"
      - name: Retain every attempt and partial result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/controller.log" "$RUNNER_TEMP/evidence/controller.log"
          cp -R control/tools/research_1125 "$RUNNER_TEMP/evidence/experiment-tools"
          git -C control rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/control-identity.txt"
          git -C source diff --binary > "$RUNNER_TEMP/evidence/final-source-diff.patch"
          mkdir -p "$RUNNER_TEMP/evidence/experimental-headers"
          find source/src/buster/lib/compiler/codegen -maxdepth 1 -name 'research_1125_*.h' -exec cp {} "$RUNNER_TEMP/evidence/experimental-headers/" \;
          cd "$RUNNER_TEMP/evidence"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: research-1125-experiment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
