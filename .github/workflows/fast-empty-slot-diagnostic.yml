name: FAST empty slot diagnostic

# Bounded #1912 research continuation on cloud hardware only.
on:
  push:
    branches:
      - codex/1912-skip-empty-slot-coloring
    paths:
      - src/buster/lib/compiler/codegen/register_allocator_fast.c
      - src/buster/tests/compiler/codegen/machine_test.c
      - tools/fast_empty_slot_diagnostic.py
      - tools/inject_slot_census.py

permissions:
  contents: read

concurrency:
  group: fast-empty-slot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      BUSTER_TEST_JOBS: 2
      DIAGNOSTIC_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install diagnostic cache simulator
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
      - name: Matched builds and integrated census
        shell: bash
        run: |
          set -euo pipefail
          cp tools/fast_empty_slot_diagnostic.py "$RUNNER_TEMP/fast-empty-slot.py"
          cp tools/inject_slot_census.py "$RUNNER_TEMP/inject-slot-census.py"
          python3 "$RUNNER_TEMP/fast-empty-slot.py" \
            --baseline 33b73bb9562ddf2756575e7e453e59fb96b4c48f \
            --head "$DIAGNOSTIC_HEAD" \
            --injector "$RUNNER_TEMP/inject-slot-census.py" \
            --output "$RUNNER_TEMP/fast-empty-slot-evidence"
      - name: Retain diagnostic evidence including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-empty-slot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fast-empty-slot-evidence
          if-no-files-found: error
          retention-days: 14
