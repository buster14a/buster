name: PR 821 native retirement rebind

on:
  push:
    branches:
      - fix/84-transactional-hermetic-spawn
    paths:
      - '.github/workflows/pr821-native-retirement-rebind.yml'

permissions:
  contents: write

concurrency:
  group: pr821-native-retirement-rebind
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event.head_commit.message == 'ci: stage PR 821 native retirement rebind' && github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/84-transactional-hermetic-spawn
          fetch-depth: 0
          persist-credentials: true

      - name: Check out pinned cJSON closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DaveGamble/cJSON
          ref: c859b25da02955fef659d658b8f324b5cde87be3
          path: external/cjson
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned DoomGeneric closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ozkl/doomgeneric
          ref: dcb7a8dbc7a16ce3dda29382ac9aae9d77d21284
          path: external/doom
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned LZ4 closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lz4/lz4
          ref: ebb370ca83af193212df4dcbadcc5d87bc0de2f0
          path: external/lz4
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned yyjson closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ibireme/yyjson
          ref: 8b4a38dc994a110abaec8a400615567bd996105f
          path: external/yyjson
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned stb closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nothings/stb
          ref: 2c980bb59875b0d32144a71867fbdebb2f77cd20
          path: external/stb
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned zlib closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: madler/zlib
          ref: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          path: external/zlib
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned musl closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ifduyue/musl
          ref: 9fa28ece75d8a2191de7c5bb53bed224c5947417
          path: external/musl
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned inputs and refresh bindings
        run: |
          set -euxo pipefail
          python3 tools/native_retirement_sdks.py --source-root "$(pwd)"
          python3 tools/native_retirement_external.py prepare \
            --manifest docs/native-retirement-dependencies-v1.json \
            --source-root "$(pwd)"
          python3 tools/native_retirement_rebind.py refresh --repo-root "$(pwd)"
          python3 tools/native_retirement_rebind.py check --repo-root "$(pwd)"
          python3 tools/native_retirement_contract.py self-test
          python3 tools/native_retirement_contract_test.py -v
          git diff --check

      - name: Publish generated binding update
        run: |
          set -euxo pipefail
          git add \
            docs/native-retirement-dependencies-v1.json \
            docs/native-retirement-census.md \
            tools/native_retirement_census.c \
            tools/native_retirement_contract.py
          git diff --cached --exit-code && {
            echo 'native-retirement refresh produced no change' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: rebind native retirement closure for PR 821'
          git push origin "HEAD:${GITHUB_REF_NAME}"
