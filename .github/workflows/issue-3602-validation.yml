name: Issue 3602 cloud validation
on:
  push:
    branches: [codex/3602-x86-label-branch-relaxation]
permissions:
  contents: read
jobs:
  baseline:
    if: ${{ github.event.before == '866343905137af01330b9aad6468b891cc297944' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 866343905137af01330b9aad6468b891cc297944
          persist-credentials: false
      - name: Bootstrap baseline driver
        run: clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
      - name: Baseline fixed point
        run: |
          "$RUNNER_TEMP/buster-build" generate --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/buster-build" test_self_host --config Release
  candidate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap candidate driver
        run: clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
      - name: Configure and build candidate
        id: build
        run: |
          "$RUNNER_TEMP/buster-build" generate --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/buster-build" build --config Release -t ide -- -j2
      - name: Focused regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          build/Release/ide test --module=executable_padding_tests
          build/Release/ide test --module=object_tests
      - name: GNU assembler differential
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          printf '.intel_syntax noprefix\n.text\nf:\njmp .L1\nret\n.L1:\nret\njmp .L1\njmp .L2\n.set .L2, . - 1\njne .L3\n.zero 127\n.L3: ret\njmp .L4\n.zero 128\n.L4: ret\n' > "$RUNNER_TEMP/3602.s"
          build/Release/ide cc -c "$RUNNER_TEMP/3602.s" -o "$RUNNER_TEMP/buster.o"
          as "$RUNNER_TEMP/3602.s" -o "$RUNNER_TEMP/gnu.o"
          objcopy -O binary -j .text "$RUNNER_TEMP/buster.o" "$RUNNER_TEMP/buster.bin"
          objcopy -O binary -j .text "$RUNNER_TEMP/gnu.o" "$RUNNER_TEMP/gnu.bin"
          cmp "$RUNNER_TEMP/buster.bin" "$RUNNER_TEMP/gnu.bin"
          od -tx1 -N 12 "$RUNNER_TEMP/buster.bin"
      - name: Full regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: '"$RUNNER_TEMP/buster-build" build --config Release -t test_all -- -j2'
      - name: Candidate fixed point
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: '"$RUNNER_TEMP/buster-build" test_self_host --config Release'
      - name: Source and whitespace checks
        if: ${{ !cancelled() }}
        run: |
          git diff --check 866343905137af01330b9aad6468b891cc297944
          "$RUNNER_TEMP/buster-build" source_size --base 866343905137af01330b9aad6468b891cc297944
