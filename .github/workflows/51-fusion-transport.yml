name: 51 fusion source transport
on:
  push:
    branches: [astra/51-fusion-20260924-transport]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d1c314a8ee3c5f9fb713f6afb85ab1e795f44a0
      - name: Archive immutable source
        run: |
          git rev-parse HEAD HEAD^{tree}
          git archive --format=tar.gz -o /tmp/buster-51-base.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: buster-51-base
          path: /tmp/buster-51-base.tar.gz
          retention-days: 3
