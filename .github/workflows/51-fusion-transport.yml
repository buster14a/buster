name: Macro fusion source transport
on:
  push:
    branches: [astra/51-fusion-transport-20260924]
    paths: [.github/workflows/51-fusion-transport.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2e942e80a87666409cf29d3e24a68d322b9e71fd
          persist-credentials: false
      - name: Archive immutable tracked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fusion-source"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/fusion-source/revisions.txt"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/fusion-source/source.tar.gz"
          sha256sum "$RUNNER_TEMP/fusion-source/source.tar.gz" > "$RUNNER_TEMP/fusion-source/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fusion-source-${{ github.run_id }}
          path: ${{ runner.temp }}/fusion-source
          retention-days: 7
          if-no-files-found: error
