name: Issue batch validation

on:
  push:
    branches: [work/2026-09-06-issue-batch-validation]
    paths: [.github/workflows/issue-batch-validation.yml]

permissions:
  contents: read

jobs:
  baseline:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3b7eefbc2048e8751e5d097dc3d52271b38385c0
          persist-credentials: false
      - name: Archive exact unmodified baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3b7eefbc2048e8751e5d097dc3d52271b38385c0
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/buster-source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/buster-source-identity.txt"
          sha256sum "$RUNNER_TEMP/buster-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-batch-baseline-source
          path: |
            ${{ runner.temp }}/buster-source.tar.gz
            ${{ runner.temp }}/buster-source-identity.txt
          retention-days: 3
          if-no-files-found: error
      - name: Install platform prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y tcc mold
          bash .github/scripts/install-vulkan-sdk.sh
      - name: Baseline full suite and Release fixed point
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh generate --cc clang --config Release --linker DEFAULT
          ./build.sh build --config Release -t test_all 2>&1 | tee "$RUNNER_TEMP/baseline-test-all.log"
          ./build.sh test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/baseline-self-host.log"
      - name: Retain baseline logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-batch-baseline-results
          path: ${{ runner.temp }}/baseline-*.log
          retention-days: 7
          if-no-files-found: warn
