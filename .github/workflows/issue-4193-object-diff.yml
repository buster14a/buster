name: Issue 4193 object differential

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/issue-4193-object-diff.yml'
      - 'tools/research/ir-inline-storage-4193/qualify.c'

permissions:
  contents: read

concurrency:
  group: issue-4193-object-diff-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    if: ${{ github.server_url == 'https://github.com' && github.event.pull_request.head.ref == 'codex/4193-inline-storage-qualification' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: ubuntu-26.04
      - name: Check out exact qualifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: qualifier
          persist-credentials: false
      - name: Check out fixed baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: c14841ae8e286447cf126de59119a887c13c9e36
          path: baseline
          persist-credentials: false
      - name: Check out fixed production candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 78ab5060819d7b76123ebc278e6e0e38cbde2029
          path: candidate
          persist-credentials: false
      - name: Record qualifier source identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: qualifier
          source-repository: ${{ github.repository }}
      - name: Bootstrap the bounded C qualifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/inline-storage-4193-proof"
          clang -std=c11 -O2 -Wall -Wextra -Werror -fwrapv -fno-strict-aliasing -funsigned-char \
            qualifier/tools/research/ir-inline-storage-4193/qualify.c -o "$RUNNER_TEMP/inline-storage-4193-qualifier"
          cp qualifier/tools/research/ir-inline-storage-4193/qualify.c "$RUNNER_TEMP/inline-storage-4193-proof/qualify.c"
      - name: Build fixed native compilers and qualify all object cells
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/inline-storage-4193-qualifier" "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/candidate" \
            "$RUNNER_TEMP/inline-storage-4193-proof" 2>&1 | tee "$RUNNER_TEMP/inline-storage-4193-proof/run.log"
      - name: Retain machine records
        if: ${{ !cancelled() }}
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: retain
          retention-directory: ${{ runner.temp }}/inline-storage-4193-proof
      - name: Retain exact qualifier and evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-4193-object-diff-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/inline-storage-4193-proof
            ${{ runner.temp }}/inline-storage-4193-qualifier
          retention-days: 14
          if-no-files-found: error
