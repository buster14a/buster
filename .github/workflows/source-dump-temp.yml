name: Temporary frontend source dump

on:
  push:
    branches:
      - claude/unruffled-bhabha-f5d28a

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: claude/unruffled-bhabha-f5d28a
      - name: Dump aggregate helper call sites
        shell: bash
        run: |
          set -euo pipefail
          file=src/buster/lib/compiler/frontend/c/c_gen.c
          grep -nE 'c_ir_constant_truth\(|c_ir_constant_cast\(|c_ir_constant_apply_binary\(|c_ir_constant_integer_to_float\(|c_ir_wide_(negate|less|subtract|shift_left_one|divide|multiply)\(' "$file"
          exit 1
