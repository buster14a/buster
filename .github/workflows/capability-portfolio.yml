name: curl qualification diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: curl-3181-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      BUSTER_TEST_JOBS: '2'
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: ubuntu-26.04
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: curl/curl
          ref: 11b991232fbcaa88e2b1faecac224416b0001e35
          path: external/curl
          persist-credentials: false
      - name: Build native driver and trusted compiler
        shell: bash
        run: |
          mkdir -p .ci-tools evidence
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o .ci-tools/build
          .ci-tools/build generate --ci --cc clang --no-sanitize --no-fuzz --no-lto --linker DEFAULT
          .ci-tools/build build --config Release -t ide
      - name: Provenance negative controls
        run: .ci-tools/build test_curl --self-test
      - name: Run pristine configure and build census
        shell: bash
        run: |
          .ci-tools/build test_curl --census "$PWD/external/curl" "$PWD/evidence/curl" "$PWD/build/Release/ide"
      - name: Retain source and host dependency identity
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          git diff --check > evidence/whitespace.txt
          cp external/curl/COPYING evidence/curl-COPYING
          cp /usr/share/doc/libssl-dev/copyright evidence/openssl-copyright
          dpkg-query -W libssl-dev libssl3t64 libc6 libc6-dev > evidence/packages.txt
          openssl version -a > evidence/openssl.txt
          find /usr/include/openssl -type f -print0 | sort -z | xargs -0 sha256sum > evidence/openssl-headers.sha256
          sha256sum /usr/lib/x86_64-linux-gnu/libssl.so /usr/lib/x86_64-linux-gnu/libcrypto.so > evidence/openssl-libraries.sha256
      - name: Retain machine records
        if: always()
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: retain
          retention-directory: evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: curl-3181-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 30
          path: evidence
          if-no-files-found: error
