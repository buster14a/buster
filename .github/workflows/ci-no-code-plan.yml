name: Trusted no-code planning

on:
  workflow_call:
    outputs:
      no_code:
        description: Exact-source trusted prose-only classification
        value: ${{ jobs.classify.outputs.no_code }}
      receipt:
        description: Native classification receipt, never execution evidence
        value: ${{ jobs.classify.outputs.receipt }}

permissions:
  contents: read

concurrency:
  group: no-code-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify no-code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      no_code: ${{ steps.plan.outputs.no_code }}
      receipt: ${{ steps.plan.outputs.receipt }}
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ubuntu-24.04
      - name: Require CI admission to be enabled
        env:
          CI_ENABLED: ${{ vars.GH_ACTIONS_CI_ENABLED }}
        run: test "$CI_ENABLED" = true
      - name: Check out independently trusted policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: trusted
          source-repository: ${{ github.repository }}
      # The classifier reads only commits and trees (raw diff modes/OIDs,
      # merge-base, parents), so the candidate is a bare blobless repository
      # holding just the tested and policy histories: no working tree, no
      # other branches or tags, and no credentials left behind.
      - name: Fetch exact tested source as data
        shell: bash
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          SOURCE_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          policy=$(git -C trusted rev-parse --verify 'HEAD^{commit}')
          git init --quiet --bare candidate
          authorization=$(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)
          echo "::add-mask::$authorization"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$SOURCE_URL/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization" \
            git -C candidate fetch --quiet --no-tags --no-write-fetch-head --filter=blob:none \
            "$SOURCE_URL" "$TESTED_SHA" "$policy"
          git -C candidate update-ref --no-deref HEAD "$TESTED_SHA"
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: candidate
          source-repository: ${{ github.repository }}
      - name: Classify complete immutable change
        id: plan
        shell: bash
        env:
          NO_CODE_ENABLED: ${{ vars.GH_ACTIONS_NO_CODE_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          TESTED_SHA: ${{ github.sha }}
          # A missing commit or tree must fail the bounded Git capture and
          # select full validation, never be fetched lazily mid-classification.
          GIT_NO_LAZY_FETCH: '1'
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request && "$EVENT_NAME" != merge_group ]] ||
             [[ "$NO_CODE_ENABLED" == false ]] ||
             [[ ! -f trusted/tools/ci_no_code.c ]]; then
            echo 'no_code=false' >> "$GITHUB_OUTPUT"
            echo 'Full validation: explicit full route, trusted rollout pending, or trusted rollback.' >> "$GITHUB_STEP_SUMMARY"
          else
            policy=$(git -C trusted rev-parse HEAD)
            (
              cd trusted
              clang -Isrc -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/no-code-driver"
            )
            "$RUNNER_TEMP/no-code-driver" ci_no_code --repo "$GITHUB_WORKSPACE/candidate" \
              --base "$BASE_SHA" --head "$HEAD_SHA" --tested "$TESTED_SHA" \
              --policy "$policy" --event "$EVENT_NAME" | tee "$RUNNER_TEMP/no-code-plan.json"
            echo "receipt=$(cat "$RUNNER_TEMP/no-code-plan.json")" >> "$GITHUB_OUTPUT"
            {
              echo '### Trusted change classification'
              echo
              cat "$RUNNER_TEMP/no-code-plan.json"
              echo
              echo 'A no-code receipt means not applicable — no execution-affecting changes. It proves no workload execution.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
