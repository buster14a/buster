name: Session GCC 13 byte-store validation

on:
  push:
    branches: [astra/gcc13-byte-store-validation-20260912]
    paths: [.github/workflows/session-gcc13-byte-store.yml]

permissions:
  contents: write

jobs:
  publish-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUSTER_GCC: /usr/bin/gcc-13
      BUSTER_TEST_JOBS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 72b336f3485f3d337b6a9280b79b8f611d381825
      - name: Publish only the two guarded production edits
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gcc13-byte-store"
          test "$(git rev-parse HEAD)" = 72b336f3485f3d337b6a9280b79b8f611d381825
          test "$(git hash-object src/buster/lib/compiler/frontend/c/c_gen.c)" = 15899cf8917d60c1fad97b1e8b5635c543291da8
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/buster/lib/compiler/frontend/c/c_gen.c')
          text = path.read_text()
          changes = (
              ('bytes[offset + byte_index] = source_index < sizeof(value) ? (u8)(value >> (u32)(source_index * 8)) : 0;',
               'bytes[offset + byte_index] = (u8)(source_index < sizeof(value) ? value >> (u32)(source_index * 8) : 0);'),
              ('u8 byte = source_index < sizeof(bits) ? (u8)(bits >> (u32)(source_index * 8)) : (sign_extend ? 0xff : 0);',
               'u8 byte = (u8)(source_index < sizeof(bits) ? bits >> (u32)(source_index * 8) : (sign_extend ? 0xff : 0));'),
          )
          for before, after in changes:
              assert text.count(before) == 1, before
              text = text.replace(before, after)
          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = src/buster/lib/compiler/frontend/c/c_gen.c
          git diff --binary > "$RUNNER_TEMP/gcc13-byte-store/candidate.patch"
          git switch -c astra/gcc13-byte-store-narrowing-20260912
          git config user.name 'Codex'
          git config user.email 'codex@openai.com'
          git add src/buster/lib/compiler/frontend/c/c_gen.c
          git commit -m 'c: make byte-store narrowing explicit for GCC 13'
          candidate=$(git rev-parse HEAD)
          git push origin HEAD:refs/heads/astra/gcc13-byte-store-narrowing-20260912
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          git show --stat --oneline HEAD
          { git rev-parse HEAD HEAD^{tree}; git hash-object src/buster/lib/compiler/frontend/c/c_gen.c; } | tee "$RUNNER_TEMP/gcc13-byte-store/source-identities.txt"
          python3 - <<'PY' | tee "$RUNNER_TEMP/gcc13-byte-store/registered-coverage.txt"
          from pathlib import Path
          path = Path('src/buster/tests/compiler/frontend/c/c_test.c')
          lines = path.read_text().splitlines()
          first, last = 13453, 13577
          for index in range(first - 1, last):
              print(f'{index + 1}: {lines[index]}')
          PY
      - name: Freeze toolchain and generated configuration
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gcc13-byte-store"
          { uname -a; lscpu; free -h; "$BUSTER_GCC" --version; clang --version; cmake --version; ninja --version; } > "$evidence/environment.txt"
          git checkout --detach 72b336f3485f3d337b6a9280b79b8f611d381825
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-driver"
          "$RUNNER_TEMP/buster-driver" generate --sanitize --cc gcc --ci --linker DEFAULT -- -DBUSTER_UNITY_BUILD=OFF 2>&1 | tee "$evidence/configure.log"
          cp build/CMakeCache.txt "$evidence/CMakeCache.txt"
          cp build/compile_commands.json "$evidence/compile_commands.json"
          find build/generated -type f -print0 | sort -z | xargs -0 sha256sum > "$evidence/generated-before.sha256"
      - name: Require both baseline conversion diagnostics
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gcc13-byte-store"
          set +e
          cmake --build build --config Debug --target CMakeFiles/ide.dir/Debug/src/buster/lib/compiler/frontend/c/c_gen.c.o -- -j1 -v > "$evidence/baseline-c-gen.log" 2>&1
          status=$?
          set -e
          cat "$evidence/baseline-c-gen.log"
          printf '%s\n' "$status" > "$evidence/baseline.exit"
          test "$status" -ne 0
          grep -F 'c_ir_store_pointer_bits' "$evidence/baseline-c-gen.log"
          grep -F 'c_ir_constant_store_unit_bits' "$evidence/baseline-c-gen.log"
          test "$(grep -c '\[-Werror=conversion\]' "$evidence/baseline-c-gen.log")" -eq 2
      - name: Require candidate compilation with identical configuration
        env:
          CANDIDATE: ${{ steps.source.outputs.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gcc13-byte-store"
          git checkout --detach "$CANDIDATE"
          cmake --build build --config Debug --target CMakeFiles/ide.dir/Debug/src/buster/lib/compiler/frontend/c/c_gen.c.o -- -j1 -v 2>&1 | tee "$evidence/candidate-c-gen.log"
          find build/generated -type f -print0 | sort -z | xargs -0 sha256sum > "$evidence/generated-after.sha256"
          cmp "$evidence/generated-before.sha256" "$evidence/generated-after.sha256"
          printf '0\n' > "$evidence/candidate.exit"
          printf 'Exact candidate %s: both baseline GCC 13 conversion failures reproduced; candidate c_gen object passed. Full registered suite NOT RUN by this job.\n' "$CANDIDATE" | tee "$evidence/result.txt"
          cat "$evidence/result.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve all successful and failed evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcc13-byte-store-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gcc13-byte-store
          retention-days: 14
          if-no-files-found: error
