name: Session GCC 13 byte-store validation

on:
  push:
    branches: [astra/gcc13-byte-store-validation-20260912]
    paths: [.github/workflows/session-gcc13-byte-store.yml]

permissions:
  contents: write

jobs:
  publish-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BUSTER_GCC: /usr/bin/gcc-13
      BUSTER_TEST_JOBS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: b86878ccca28edbe90bdc747ca4c4e5df533c5e4
          fetch-depth: 2
      - name: Extend the existing registered byte-payload fixture
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gcc13-byte-store"
          test "$(git rev-parse HEAD)" = b86878ccca28edbe90bdc747ca4c4e5df533c5e4
          test "$(git hash-object src/buster/tests/compiler/frontend/c/c_test.c)" = 18d363a8c0694e7022e34b543d0ad81ff0232ab9
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/buster/tests/compiler/frontend/c/c_test.c')
          text = path.read_text()
          changes = (
              ('" U unsigned_wide[] = {((U)1<<100),(U)0xffffffffffffffffULL,(U)-1,(U)1<<127};");',
               '" U unsigned_wide[] = {((U)1<<100),(U)0xffffffffffffffffULL,(U)-1,(U)1<<127};"\n'
               '                        " unsigned long long byte_words[] = {0,0x0123456789abcdefULL,0xfedcba9876543210ULL};"\n'
               '                        " void *byte_pointers[] = {0,(void *)0x0123456789abcdefULL,(void *)0xfedcba9876543210ULL};");'),
              ('    u8 expected_bool[] = {1, 1, 1, 1, 1, 1, 1, 0};',
               '    // Pin every byte, including an embedded null and bytes with the high bit set.\n'
               '    // Integer and integer-cast pointer arrays take distinct byte-store paths.\n'
               '    u8 expected_byte_words[] = {\n'
               '        0, 0, 0, 0, 0, 0, 0, 0,\n'
               '        0xef, 0xcd, 0xab, 0x89, 0x67, 0x45, 0x23, 0x01,\n'
               '        0x10, 0x32, 0x54, 0x76, 0x98, 0xba, 0xdc, 0xfe,\n'
               '    };\n'
               '    u8 expected_bool[] = {1, 1, 1, 1, 1, 1, 1, 0};'),
              ('        {S8("booleans"), BUSTER_ARRAY_TO_SLICE(expected_bool)},',
               '        {S8("byte_words"), BUSTER_ARRAY_TO_SLICE(expected_byte_words)},\n'
               '        {S8("byte_pointers"), BUSTER_ARRAY_TO_SLICE(expected_byte_words)},\n'
               '        {S8("booleans"), BUSTER_ARRAY_TO_SLICE(expected_bool)},'),
          )
          for before, after in changes:
              assert text.count(before) == 1, before
              text = text.replace(before, after)
          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = src/buster/tests/compiler/frontend/c/c_test.c
          git switch -c astra/gcc13-byte-store-narrowing-20260912
          git config user.name 'Codex'
          git config user.email 'codex@openai.com'
          git add src/buster/tests/compiler/frontend/c/c_test.c
          git commit -m 'test(c): pin integer and pointer initializer byte payloads'
          candidate=$(git rev-parse HEAD)
          git push origin HEAD:refs/heads/astra/gcc13-byte-store-narrowing-20260912
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          git diff --binary 72b336f3485f3d337b6a9280b79b8f611d381825 HEAD > "$RUNNER_TEMP/gcc13-byte-store/candidate.patch"
          { git rev-parse HEAD HEAD^{tree}; git hash-object src/buster/lib/compiler/frontend/c/c_gen.c src/buster/tests/compiler/frontend/c/c_test.c; } | tee "$RUNNER_TEMP/gcc13-byte-store/source-identities.txt"
          git show --stat --oneline HEAD
      - name: Freeze toolchain and generated configuration
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gcc13-byte-store"
          { uname -a; lscpu; free -h; "$BUSTER_GCC" --version; clang --version; cmake --version; ninja --version; } > "$evidence/environment.txt"
          git checkout --detach 72b336f3485f3d337b6a9280b79b8f611d381825
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-driver"
          "$RUNNER_TEMP/buster-driver" generate --sanitize --cc gcc --ci --linker DEFAULT -- -DBUSTER_UNITY_BUILD=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee "$evidence/configure.log"
          cp build/CMakeCache.txt build/compile_commands.json "$evidence/"
          find build -type f \( -name '*.h' -o -name '*.ninja' -o -name CMakeCache.txt -o -name compile_commands.json \) -print0 | sort -z | xargs -0 sha256sum > "$evidence/configuration-before.sha256"
      - name: Require both baseline conversion diagnostics
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gcc13-byte-store"
          set +e
          cmake --build build --config Debug --target CMakeFiles/ide.dir/Debug/src/buster/lib/compiler/frontend/c/c_gen.c.o -- -j1 -v > "$evidence/baseline-c-gen.log" 2>&1
          status=$?
          set -e
          cat "$evidence/baseline-c-gen.log"
          printf '%s\n' "$status" > "$evidence/baseline.exit"
          test "$status" -ne 0
          grep -F 'c_ir_store_pointer_bits' "$evidence/baseline-c-gen.log"
          grep -F 'c_ir_constant_store_unit_bits' "$evidence/baseline-c-gen.log"
          test "$(grep -c '\[-Werror=conversion\]' "$evidence/baseline-c-gen.log")" -eq 2
      - name: Require exact candidate compilation with identical configuration
        env:
          CANDIDATE: ${{ steps.source.outputs.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gcc13-byte-store"
          git checkout --detach "$CANDIDATE"
          cmake --build build --config Debug --target CMakeFiles/ide.dir/Debug/src/buster/lib/compiler/frontend/c/c_gen.c.o -- -j1 -v 2>&1 | tee "$evidence/candidate-c-gen.log"
          find build -type f \( -name '*.h' -o -name '*.ninja' -o -name CMakeCache.txt -o -name compile_commands.json \) -print0 | sort -z | xargs -0 sha256sum > "$evidence/configuration-after.sha256"
          cmp "$evidence/configuration-before.sha256" "$evidence/configuration-after.sha256"
          printf '0\n' > "$evidence/candidate.exit"
          printf 'Exact candidate %s: both baseline GCC 13 conversion failures reproduced; candidate c_gen object passed with byte-identical configuration.\n' "$CANDIDATE" | tee "$evidence/object-result.txt"
          cat "$evidence/object-result.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve a separate integration of the pinned fixture prerequisite
        id: integration
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gcc13-byte-store"
          git fetch --no-tags --depth=1 origin 15b19813ca51cf993d3526acb6f66c1f51f7c377 0e1d1a436367631aa6475c17c73130b932faf0de
          git diff --binary 15b19813ca51cf993d3526acb6f66c1f51f7c377 0e1d1a436367631aa6475c17c73130b932faf0de -- src/buster/tests/compiler/assembly/x86_64_metadata_test.c src/buster/tests/compiler/codegen/machine_test.c > "$evidence/pr547-prerequisite.patch"
          test -s "$evidence/pr547-prerequisite.patch"
          cat "$evidence/pr547-prerequisite.patch"
          git apply --check "$evidence/pr547-prerequisite.patch"
          git apply "$evidence/pr547-prerequisite.patch"
          git diff --check
          git switch -c astra/gcc13-byte-store-integration-20260912
          git add src/buster/tests/compiler/assembly/x86_64_metadata_test.c src/buster/tests/compiler/codegen/machine_test.c
          git commit -m 'validation: compose PR 547 pinned fixtures with PR 558 byte-store repair' -m 'Fixture prerequisite: 0e1d1a436367631aa6475c17c73130b932faf0de against 15b19813ca51cf993d3526acb6f66c1f51f7c377. Validation-only integration; neither prerequisite nor transport is added to PR 558.'
          integration=$(git rev-parse HEAD)
          git push origin HEAD:refs/heads/astra/gcc13-byte-store-integration-20260912
          printf 'integration=%s\n' "$integration" >> "$GITHUB_OUTPUT"
          { git rev-parse HEAD HEAD^{tree}; git show --stat --oneline HEAD; } | tee "$evidence/integration-identities.txt"
      - name: Run the full registered GCC sanitized suite on the explicit integration
        env:
          INTEGRATION: ${{ steps.integration.outputs.integration }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/gcc13-byte-store"
          test "$(git rev-parse HEAD)" = "$INTEGRATION"
          mkdir -p "$RUNNER_TEMP/buster-test-files"
          export BUSTER_TEST_TEMPORARY_BASE="$RUNNER_TEMP/buster-test-files"
          "$RUNNER_TEMP/buster-driver" build --config Debug -t test_all -- -j1 2>&1 | tee "$evidence/integration-test-all.log"
          printf 'Integration %s: full registered GCC Debug ASan/UBSan/LSan suite passed using the unchanged generated fatal policy.\n' "$INTEGRATION" | tee "$evidence/integration-result.txt"
          cat "$evidence/integration-result.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve all successful and failed evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcc13-byte-store-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gcc13-byte-store
          retention-days: 14
          if-no-files-found: error
