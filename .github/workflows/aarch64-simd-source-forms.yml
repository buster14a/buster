name: AArch64 SIMD source forms

on:
  pull_request:
    paths:
      - '.github/workflows/aarch64-simd-source-forms.yml'
      - 'build.c'
      - 'src/buster/tests/compiler/assembly/**'
      - 'src/buster/apps/ide/ide.c'
      - 'src/buster/lib/compiler/assembly/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aarch64-simd-source-forms-${{ github.event_name }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  census:
    name: Hosted SIMD structure and lane assembly
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      BUSTER_TEST_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record source, authority and host identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a64-simd-evidence"
          git rev-parse HEAD 'HEAD^{tree}' | tee "$RUNNER_TEMP/a64-simd-evidence/source.txt"
          git rev-parse 'HEAD:src/buster/lib/compiler/assembly/generated/arm-a64-canonical-manifest.json' > "$RUNNER_TEMP/a64-simd-evidence/authority.txt"
          clang --version | tee "$RUNNER_TEMP/a64-simd-evidence/toolchain.txt"
          llvm-mc-21 --version | tee -a "$RUNNER_TEMP/a64-simd-evidence/toolchain.txt"
          llvm-objdump-21 --version | tee -a "$RUNNER_TEMP/a64-simd-evidence/toolchain.txt"
          uname -a > "$RUNNER_TEMP/a64-simd-evidence/host.txt"
          lscpu >> "$RUNNER_TEMP/a64-simd-evidence/host.txt"
          free -b >> "$RUNNER_TEMP/a64-simd-evidence/host.txt"
      - name: Bootstrap native driver
        id: driver
        shell: bash
        run: |
          set -euo pipefail
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char -g build.c -o "$RUNNER_TEMP/a64-simd-build" 2>&1 | tee "$RUNNER_TEMP/a64-simd-evidence/bootstrap.log"
      - name: Build exact candidate compiler
        id: compiler
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/a64-simd-build" generate --cc clang --ci --linker DEFAULT 2>&1 | tee "$RUNNER_TEMP/a64-simd-evidence/configure.log"
          "$RUNNER_TEMP/a64-simd-build" build --config Release -t ide -- -j2 2>&1 | tee "$RUNNER_TEMP/a64-simd-evidence/build.log"
          sha256sum "$RUNNER_TEMP/a64-simd-build" build/Release/ide > "$RUNNER_TEMP/a64-simd-evidence/binaries.txt"
      - name: Verify public modifier and relocation regressions
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          build/Release/ide test --module=assembly_tests --ci=1 --verbose=1 2>&1 | tee "$RUNNER_TEMP/a64-simd-evidence/tests.log"
          build/Release/ide test --module=aarch64_base_assembly_tests --ci=1 --verbose=1 2>&1 | tee "$RUNNER_TEMP/a64-simd-evidence/base-tests.log"
          build/Release/ide test --module=aarch64_complex_simd_tests --ci=1 --verbose=1 2>&1 | tee "$RUNNER_TEMP/a64-simd-evidence/complex-tests.log"
          build/Release/ide test --module=aarch64_memory_semantics_tests --ci=1 --verbose=1 2>&1 | tee "$RUNNER_TEMP/a64-simd-evidence/memory-tests.log"
      - name: Record independent by-element reference
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          fixture=src/buster/tests/compiler/assembly/fixtures/aarch64_simd_lane_reference.s
          llvm-mc-21 -triple=aarch64-linux-gnu -mattr=+neon,+fullfp16 -show-encoding "$fixture" | tee "$RUNNER_TEMP/a64-simd-evidence/lane-reference.txt"
      - name: Compare independent ELF and COFF reference words
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/a64-simd-evidence"
          exec > >(tee "$evidence/oracle.log") 2>&1
          fixture=src/buster/tests/compiler/assembly/fixtures/aarch64_simd_structure_oracle.s
          for format in elf coff; do
            if test "$format" = elf; then
              reference_target=aarch64-linux-gnu
              candidate_target=aarch64-linux
            else
              reference_target=aarch64-windows-msvc
              candidate_target=aarch64-windows
            fi
            clang --target="$reference_target" -c "$fixture" -o "$evidence/reference-$format.o"
            build/Release/ide cc -target "$candidate_target" -mcpu=apple-m1 -c "$fixture" -o "$evidence/candidate-$format.o"
            llvm-objdump-21 -r -s --section=.text "$evidence/reference-$format.o" > "$evidence/reference-$format.txt"
            llvm-objdump-21 -r -s --section=.text "$evidence/candidate-$format.o" > "$evidence/candidate-$format.txt"
            llvm-objcopy-21 --dump-section ".text=$evidence/reference-$format.text" "$evidence/reference-$format.o"
            llvm-objcopy-21 --dump-section ".text=$evidence/candidate-$format.text" "$evidence/candidate-$format.o"
            test "$(wc -c < "$evidence/reference-$format.text")" -eq 32
            test "$(wc -c < "$evidence/candidate-$format.text")" -eq 32
            cmp "$evidence/reference-$format.text" "$evidence/candidate-$format.text"
          done
      - name: Compare by-element ELF and COFF reference words
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/a64-simd-evidence"
          exec > >(tee "$evidence/lane-oracle.log") 2>&1
          fixture=src/buster/tests/compiler/assembly/fixtures/aarch64_simd_lane_reference.s
          for format in elf coff; do
            if test "$format" = elf; then
              reference_target=aarch64-linux-gnu
              candidate_target=aarch64-linux
            else
              reference_target=aarch64-windows-msvc
              candidate_target=aarch64-windows
            fi
            clang --target="$reference_target" -march=armv8.2-a+fp16 -c "$fixture" -o "$evidence/lane-reference-$format.o"
            build/Release/ide cc -target "$candidate_target" -mcpu=apple-m1 -c "$fixture" -o "$evidence/lane-candidate-$format.o"
            llvm-objcopy-21 --dump-section ".text=$evidence/lane-reference-$format.text" "$evidence/lane-reference-$format.o"
            llvm-objcopy-21 --dump-section ".text=$evidence/lane-candidate-$format.text" "$evidence/lane-candidate-$format.o"
            test "$(wc -c < "$evidence/lane-reference-$format.text")" -eq 16
            test "$(wc -c < "$evidence/lane-candidate-$format.text")" -eq 16
            cmp "$evidence/lane-reference-$format.text" "$evidence/lane-candidate-$format.text"
          done
      - name: Generate native source-size acknowledgment
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/a64-simd-build" source_size --write-baseline 2>&1 | tee "$RUNNER_TEMP/a64-simd-evidence/source-size.log"
          cat docs/source-size-baseline.txt | tee "$RUNNER_TEMP/a64-simd-evidence/source-size-baseline.txt"
      - name: Retain exact source form evidence on success or failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aarch64-simd-source-forms-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a64-simd-evidence/
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
