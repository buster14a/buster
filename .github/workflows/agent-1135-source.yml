# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Temporary branch-only validation for #1135; excluded from the final PR tree.
name: Issue 1135 source snapshot
on:
  push:
    branches: [work/1135-semantic-pragmas]
    paths: [.github/workflows/agent-1135-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Apply the byte-verified implementation
        shell: bash
        run: |
          set -euo pipefail
          sed 's/qnSvqn7Svqn7prXy/qnSvqn7prXy/' .github/agent-1135.patch.gz.b64 | base64 -d | gzip -d > "$RUNNER_TEMP/1135.patch"
          printf '%s  %s\n' '8c18785f7db7e4f8df0462766ff126b2cd2a14ccb4d0415f2e9e07da3ce77105' "$RUNNER_TEMP/1135.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/1135.patch"
          git apply "$RUNNER_TEMP/1135.patch"
          git diff --check
      - name: Install pinned build and oracle tools
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/setup-hosted.sh
          bash tools/ci/setup-build-tools.sh "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build baseline x86-64
        shell: bash
        run: |
          set -euo pipefail
          BUSTER_HOST_ARCH=x86-64 BUSTER_DEBUG_INFO=0 ./build.sh --jobs 2 2>&1 | tee "$RUNNER_TEMP/1135-build.log"
      - name: Checker semantic and arena regressions
        shell: bash
        run: |
          set -euo pipefail
          ./build/compiler test-checker --part 1/128 2>&1 | tee "$RUNNER_TEMP/1135-checker.log"
      - name: Driver and object regressions
        shell: bash
        run: |
          set -euo pipefail
          ./build/compiler test-checker-driver --executable ./build/compiler 2>&1 | tee "$RUNNER_TEMP/1135-driver.log"
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buster-1135-validation
          path: |
            ${{ runner.temp }}/1135.patch
            ${{ runner.temp }}/1135-*.log
          retention-days: 3
          if-no-files-found: error
