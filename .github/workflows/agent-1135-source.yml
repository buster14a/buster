# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Temporary branch-only source transfer for #1135; removed before the final PR.
name: Issue 1135 source snapshot
on:
  push:
    branches: [work/1135-semantic-pragmas]
    paths: [.github/workflows/agent-1135-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Archive tracked sources, without credentials or Git state
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/buster-1135-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buster-1135-source
          path: ${{ runner.temp }}/buster-1135-source.tar.gz
          retention-days: 1
          if-no-files-found: error
