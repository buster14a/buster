name: Initializer root census

# Temporary diagnostic route for #1403. No production behavior is changed.
on:
  pull_request:
    paths:
      - .github/workflows/initializer-root-census.yml
      - tools/research/initializer-roots/**

permissions:
  contents: read

concurrency:
  group: initializer-root-census-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  census:
    if: ${{ github.server_url == 'https://github.com' && github.head_ref == 'codex/1403-initializer-root-census' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      BUSTER_TEST_JOBS: '1'
      BUSTER_MATRIX_THREADS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare pinned cJSON
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DaveGamble/cJSON
          ref: c859b25da02955fef659d658b8f324b5cde87be3
          path: external/initializer-roots-cjson
          persist-credentials: false
      - name: Prepare pinned SQLite amalgamation
        run: |
          set -euo pipefail
          mkdir -p external/initializer-roots-sqlite
          curl --fail --location --retry 2 https://www.sqlite.org/2026/sqlite-amalgamation-3530400.zip -o external/initializer-roots-sqlite/input.zip
          printf '%s  %s\n' 1e71ddf93849c6a6ecf58b827c0692073d2dd7ee40196158068f7b29f422e87d external/initializer-roots-sqlite/input.zip | sha256sum --check
          unzip -q external/initializer-roots-sqlite/input.zip -d external/initializer-roots-sqlite
      - name: Bootstrap hosted native build driver
        run: |
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
      - name: Configure baseline
        run: '"$RUNNER_TEMP/buster-build" generate --cc clang --ci --linker DEFAULT'
      - name: Preserve baseline fixed point
        run: '"$RUNNER_TEMP/buster-build" test_self_host --config Release'
      - name: Compare baseline and observational probe
        run: >-
          python3 tools/research/initializer-roots/run_probe.py
          --driver "${{ runner.temp }}/buster-build"
          --out "${{ runner.temp }}/initializer-root-evidence"
          --sqlite external/initializer-roots-sqlite/sqlite-amalgamation-3530400
          --cjson external/initializer-roots-cjson
      - name: Retain diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: initializer-roots-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/initializer-root-evidence/results.json
            ${{ runner.temp }}/initializer-root-evidence/probe.log
            ${{ runner.temp }}/initializer-root-evidence/command-logs/
            ${{ runner.temp }}/initializer-root-evidence/fixtures/
          retention-days: 14
          if-no-files-found: warn
      - name: Retain compared compiler binaries and outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: initializer-root-outputs-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/initializer-root-evidence/binaries/
            ${{ runner.temp }}/initializer-root-evidence/cases/
          retention-days: 14
          if-no-files-found: warn
