name: Issue 1192 Tier 1 execution validation
on:
  push:
    branches: [agent/issue-1192-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install pinned hosted compiler toolchain
        run: bash tools/ci/setup-hosted.sh
      - name: Build baseline compiler
        run: ./build.sh --jobs 4
      - name: Execute every switch fixture through Tier 1 in both modes
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/switches"
          clang -std=c17 -O2 -Wall -Wextra -Werror -I. tools/ci/issue-1192-export.c -o "$RUNNER_TEMP/export"
          "$RUNNER_TEMP/export" "$RUNNER_TEMP/switches"
          passed=0
          for source in "$RUNNER_TEMP/switches/"*.c; do
            clang -std=gnu17 -O0 -march=x86-64 -w "$source" -o "$RUNNER_TEMP/oracle"
            "$RUNNER_TEMP/oracle" > "$RUNNER_TEMP/expected"
            for mode in default scalar; do
              options=()
              if [[ "$mode" == scalar ]]; then options+=(--scalar); fi
              ./build/compiler --tier1 --verify -march=x86-64 "${options[@]}" "$source" -o "$RUNNER_TEMP/subject"
              "$RUNNER_TEMP/subject" > "$RUNNER_TEMP/actual"
              diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
              passed=$((passed + 1))
              printf 'PASS %s %s\n' "$mode" "$(basename "$source")"
            done
          done
          test "$passed" = 58
          printf 'Tier 1: %d driver executions matched Clang, 17 inputs each\n' "$passed"
