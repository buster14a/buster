name: Analyzer worker budget qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analyzer-worker-budget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Hosted worker budget trial ${{ matrix.trial }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@6f2ab3357f1e0f359fbf9f40621906171c026283
        with:
          requested-runner: >-
            ubuntu-26.04
          matrix-index: ${{ strategy.job-index }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@6f2ab3357f1e0f359fbf9f40621906171c026283
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Record source and bootstrap the native build driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build "$RUNNER_TEMP/analyzer-budget"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/analyzer-budget/revision.txt"
          clang --version > "$RUNNER_TEMP/analyzer-budget/clang.txt"
          clang -Isrc -I. -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char \
            -MMD -MF "$RUNNER_TEMP/analyzer-budget/driver.d" build.c -o build/analyzer-driver
          sha256sum build/analyzer-driver > "$RUNNER_TEMP/analyzer-budget/driver.sha256"
          python3 tools/analyzer_worker_budget.py host "$RUNNER_TEMP/analyzer-budget/host-before.json"
      - name: Exercise ordinary fail-closed analyzer controls
        shell: bash
        run: |
          set -euo pipefail
          build/analyzer-driver clang_analyze --self-test 2>&1 | tee "$RUNNER_TEMP/analyzer-budget/self-test.log"
          python3 tools/analyzer_worker_budget_test.py -v 2>&1 | tee "$RUNNER_TEMP/analyzer-budget/reader-test.log"
      - name: Configure one authoritative complete split database
        run: build/analyzer-driver generate --build-directory build/analyzer-tree --ci --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_UNITY_BUILD=OFF
      - name: Run sequential counterbalanced candidate-only inventories
        shell: bash
        run: |
          set -euo pipefail
          build/analyzer-driver clang_analyze build/analyzer-tree --config Release --shards 8 --timeout 600 --quiet \
            --qualify-workers --results "$RUNNER_TEMP/analyzer-budget/campaign" 2>&1 | tee "$RUNNER_TEMP/analyzer-budget/campaign.log"
      - name: Independently verify inventories, diagnostics and worker samples
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/analyzer_worker_budget.py host "$RUNNER_TEMP/analyzer-budget/host-after.json"
          python3 tools/analyzer_worker_budget.py verify "$RUNNER_TEMP/analyzer-budget" | tee "$RUNNER_TEMP/analyzer-budget/verification.json"
          git diff --exit-code
      - name: Retain machine records in existing evidence
        if: ${{ always() }}
        uses: buster14a/buster/.github/actions/machine-specifications@6f2ab3357f1e0f359fbf9f40621906171c026283
        with:
          mode: retain
          retention-directory: ${{ runner.temp }}/analyzer-budget
      - name: Retain complete qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: analyzer-worker-budget-${{ github.run_id }}-${{ github.run_attempt }}-trial-${{ matrix.trial }}
          path: |
            ${{ runner.temp }}/analyzer-budget/
            build/analyzer-tree/compile_commands.json
            build/analyzer-tree/CMakeCache.txt
          if-no-files-found: error
          retention-days: 30
