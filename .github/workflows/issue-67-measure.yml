name: Issue 67 implementation measurement

on:
  push:
    branches: [fix/67-x86-metadata-memory]

permissions:
  contents: write

jobs:
  measure-validate-and-commit:
    name: Measure, validate, and commit repair
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply repair, measure, validate, and commit
        shell: bash
        env:
          BASE_SHA: e68315eae6d737167acbc9be36ddd27b7334affd
        run: |
          set -euo pipefail

          branch=${GITHUB_REF_NAME}
          raw="$RUNNER_TEMP/issue-67-raw"
          baseline_source="$RUNNER_TEMP/issue-67-baseline-source"
          baseline_build="$RUNNER_TEMP/issue-67-baseline-build"
          candidate_measure_build="$RUNNER_TEMP/issue-67-candidate-measure"
          candidate_split_build="$RUNNER_TEMP/issue-67-candidate-split"
          candidate_unity_build="$RUNNER_TEMP/issue-67-candidate-unity"
          candidate_gcc_build="$RUNNER_TEMP/issue-67-candidate-gcc"
          stamp=$(date -u +%Y-%m-%dT%H%M%SZ)
          evidence="docs/performance-audits/evidence/$stamp"
          audit="docs/performance-audits/$stamp.md"
          mkdir -p "$raw" "$evidence"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git worktree add --detach "$baseline_source" "$BASE_SHA"

          python3 - <<'PY_PATCH'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          header_path = Path("src/buster/tests/compiler/assembly/x86_64_metadata_test.h")
          header = header_path.read_text()
          old_header = """#if !BUSTER_UNITY_BUILD && BUSTER_COMPILER_CLANG
          /*
              The unity test aggregate receives optnone in apps/ide/ide.c. Mirror that
              policy for this suite's standalone non-unity object: optimizing its large
              test body otherwise requires several GiB of compiler memory.
          */
          #define BUSTER_X86_64_METADATA_TEST_DECL __attribute__((optnone))
          #else
          #define BUSTER_X86_64_METADATA_TEST_DECL
          #endif

          BUSTER_F_DECL BUSTER_X86_64_METADATA_TEST_DECL UnitTestResult x86_64_metadata_tests(UnitTestArguments* arguments);
          #undef BUSTER_X86_64_METADATA_TEST_DECL
          """
          new_header = "BUSTER_F_DECL UnitTestResult x86_64_metadata_tests(UnitTestArguments* arguments);\n"
          header_path.write_text(replace_once(header, old_header, new_header, "temporary header repair"))

          cmake_path = Path("CMakeLists.txt")
          cmake = cmake_path.read_text()
          marker = "set_source_files_properties(${BUSTER_TEST_HEADERS} PROPERTIES HEADER_FILE_ONLY TRUE)\n"
          block = marker + """

          # This assertion-heavy translation unit is intentionally not optimized. Its
          # runtime coverage does not depend on optimizer output, while optimizing it has
          # historically required several GiB of compiler RSS. Keep debug records only
          # for sanitizer configurations where they are diagnostically useful.
          set(BUSTER_X86_METADATA_TEST_SOURCE
              "${CMAKE_CURRENT_SOURCE_DIR}/src/buster/tests/compiler/assembly/x86_64_metadata_test.c"
          )
          if (C_COMPILER_GNU_FAMILY AND NOT C_COMPILER_TCC)
              set_property(SOURCE "${BUSTER_X86_METADATA_TEST_SOURCE}" APPEND PROPERTY COMPILE_OPTIONS
                  "$<${BUSTER_OPTIMIZE_CONDITION}:-O0>"
                  "$<$<AND:${BUSTER_OPTIMIZE_CONDITION},$<NOT:$<BOOL:${BUSTER_SANITIZE}>>>:-g0>"
              )
          elseif (C_COMPILER_MSVC_FAMILIY)
              set_property(SOURCE "${BUSTER_X86_METADATA_TEST_SOURCE}" APPEND PROPERTY COMPILE_OPTIONS
                  "$<${BUSTER_OPTIMIZE_CONDITION}:/Od>"
              )
          endif()
          """
          if "BUSTER_X86_METADATA_TEST_SOURCE" in cmake:
              raise SystemExit("per-source metadata policy already exists")
          cmake_path.write_text(replace_once(cmake, marker, block, "metadata source policy insertion"))
          PY_PATCH

          git diff --check

          configure_measurement() {
              local source=$1
              local directory=$2
              cmake -S "$source" -B "$directory" -G Ninja \
                  -DCMAKE_C_COMPILER=clang \
                  -DCMAKE_BUILD_TYPE=Release \
                  "-DCMAKE_C_FLAGS_RELEASE=-O1 -g" \
                  -DBUSTER_CI=OFF \
                  -DBUSTER_UNITY_BUILD=OFF \
                  -DBUSTER_DEBUG_INFO=OFF \
                  -DBUSTER_FRAME_POINTERS=OFF \
                  -DBUSTER_CHECK_OPTIONAL_WARNINGS=OFF \
                  -DBUSTER_REQUIRE_VULKAN_SDK=OFF \
                  > "$raw/$(basename "$directory")-configure.log" 2>&1
          }

          configure_release() {
              local compiler=$1
              local unity=$2
              local directory=$3
              cmake -S . -B "$directory" -G Ninja \
                  -DCMAKE_C_COMPILER="$compiler" \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DBUSTER_CI=OFF \
                  -DBUSTER_UNITY_BUILD="$unity" \
                  -DBUSTER_DEBUG_INFO=OFF \
                  -DBUSTER_FRAME_POINTERS=OFF \
                  -DBUSTER_CHECK_OPTIONAL_WARNINGS=OFF \
                  -DBUSTER_REQUIRE_VULKAN_SDK=OFF \
                  > "$raw/$(basename "$directory")-configure.log" 2>&1
          }

          metadata_target() {
              local directory=$1
              ninja -C "$directory" -t targets all | \
                  sed -n '/x86_64_metadata_test\.c\.o:/ {s/:.*//; p; q;}'
          }

          run_timed() {
              local label=$1
              shift
              /usr/bin/time -v -o "$evidence/$label.time" \
                  "$@" > "$raw/$label.log" 2>&1
          }

          {
              printf 'base_sha=%s\n' "$BASE_SHA"
              printf 'measurement_parent=%s\n' "$GITHUB_SHA"
              printf 'workflow_run=https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
              uname -a
              clang --version
              gcc --version | head -n 1
              cmake --version | head -n 1
              ninja --version
              grep '^MemTotal:' /proc/meminfo
          } > "$evidence/environment.txt"

          configure_measurement "$baseline_source" "$baseline_build"
          baseline_target=$(metadata_target "$baseline_build")
          test -n "$baseline_target"
          ninja -C "$baseline_build" -t commands "$baseline_target" > "$evidence/baseline-command.txt"
          run_timed baseline-object ninja -C "$baseline_build" -j1 "$baseline_target"
          stat -c '%s' "$baseline_build/$baseline_target" > "$evidence/baseline-object.bytes"

          configure_measurement . "$candidate_measure_build"
          candidate_target=$(metadata_target "$candidate_measure_build")
          test -n "$candidate_target"
          ninja -C "$candidate_measure_build" -t commands "$candidate_target" > "$evidence/candidate-command.txt"
          grep -q -- '-O0' "$evidence/candidate-command.txt"
          grep -q -- '-g0' "$evidence/candidate-command.txt"
          run_timed candidate-object ninja -C "$candidate_measure_build" -j1 "$candidate_target"
          stat -c '%s' "$candidate_measure_build/$candidate_target" > "$evidence/candidate-object.bytes"

          configure_release clang OFF "$candidate_split_build"
          split_target=$(metadata_target "$candidate_split_build")
          test -n "$split_target"
          ninja -C "$candidate_split_build" -t commands "$split_target" > "$evidence/candidate-release-command.txt"
          grep -q -- '-O0' "$evidence/candidate-release-command.txt"
          grep -q -- '-g0' "$evidence/candidate-release-command.txt"
          run_timed candidate-split-build ninja -C "$candidate_split_build" -j1 ide
          run_timed candidate-split-test timeout 2400s env \
              BUSTER_TEST_JOBS=1 BUSTER_TEST_TABLE_AUDITS=1 \
              "$candidate_split_build/ide" test --verbose=1 --ci=1
          grep -E 'TEST_MODULE_TIMING .*module=(x86_64_metadata_tests|x86_64_completion_census_tests) ' \
              "$raw/candidate-split-test.log" > "$evidence/candidate-split-modules.txt"

          configure_release clang ON "$candidate_unity_build"
          run_timed candidate-unity-build ninja -C "$candidate_unity_build" -j1 ide
          run_timed candidate-unity-test timeout 2400s env \
              BUSTER_TEST_JOBS=1 BUSTER_TEST_TABLE_AUDITS=1 \
              "$candidate_unity_build/ide" test --verbose=1 --ci=1
          grep -E 'TEST_MODULE_TIMING .*module=(x86_64_metadata_tests|x86_64_completion_census_tests) ' \
              "$raw/candidate-unity-test.log" > "$evidence/candidate-unity-modules.txt"

          configure_release gcc OFF "$candidate_gcc_build"
          gcc_target=$(metadata_target "$candidate_gcc_build")
          test -n "$gcc_target"
          ninja -C "$candidate_gcc_build" -t commands "$gcc_target" > "$evidence/candidate-gcc-command.txt"
          grep -q -- '-O0' "$evidence/candidate-gcc-command.txt"
          grep -q -- '-g0' "$evidence/candidate-gcc-command.txt"
          run_timed candidate-gcc-object ninja -C "$candidate_gcc_build" -j1 "$gcc_target"

          python3 - "$evidence" <<'PY_VALIDATE'
          from pathlib import Path
          import re
          import sys

          evidence = Path(sys.argv[1])

          def maximum_rss(label: str) -> int:
              body = (evidence / f"{label}.time").read_text()
              match = re.search(r"Maximum resident set size \(kbytes\): (\d+)", body)
              if not match:
                  raise SystemExit(f"missing RSS for {label}")
              return int(match.group(1))

          def modules(name: str) -> dict[str, dict[str, str]]:
              result: dict[str, dict[str, str]] = {}
              for line in (evidence / name).read_text().splitlines():
                  fields = dict(re.findall(r"([a-z_]+)=([^ ]+)", line))
                  module = fields.get("module")
                  if module:
                      result[module] = fields
              return result

          baseline_rss = maximum_rss("baseline-object")
          candidate_rss = maximum_rss("candidate-object")
          if candidate_rss >= 1_048_576:
              raise SystemExit(f"candidate object exceeded 1 GiB RSS: {candidate_rss} KiB")
          if candidate_rss * 4 >= baseline_rss:
              raise SystemExit(
                  f"candidate object did not reduce RSS by at least 75%: "
                  f"baseline={baseline_rss}, candidate={candidate_rss}"
              )

          split = modules("candidate-split-modules.txt")
          unity = modules("candidate-unity-modules.txt")
          required = {"x86_64_metadata_tests", "x86_64_completion_census_tests"}
          if required - split.keys() or required - unity.keys():
              raise SystemExit("missing required x86 module summaries")
          for module in required:
              for field in ("passed", "failed", "assertions", "status"):
                  if split[module].get(field) != unity[module].get(field):
                      raise SystemExit(f"split/unity mismatch: {module} {field}")
              if split[module].get("failed") != "0" or split[module].get("status") != "pass":
                  raise SystemExit(f"module failed: {module}")
          PY_VALIDATE

          git add CMakeLists.txt src/buster/tests/compiler/assembly/x86_64_metadata_test.h
          git commit -m "tests: bound x86 metadata compile memory"
          implementation_sha=$(git rev-parse HEAD)

          python3 - "$evidence" "$audit" "$implementation_sha" "$BASE_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" <<'PY_AUDIT'
          from pathlib import Path
          import re
          import sys

          evidence = Path(sys.argv[1])
          audit = Path(sys.argv[2])
          implementation_sha = sys.argv[3]
          base_sha = sys.argv[4]
          repository = sys.argv[5]
          run_id = sys.argv[6]

          def metrics(label: str) -> tuple[str, int]:
              body = (evidence / f"{label}.time").read_text()
              elapsed_match = re.search(r"Elapsed \(wall clock\) time .*: (.+)", body)
              rss_match = re.search(r"Maximum resident set size \(kbytes\): (\d+)", body)
              if not elapsed_match or not rss_match:
                  raise SystemExit(f"missing timing metrics for {label}")
              return elapsed_match.group(1).strip(), int(rss_match.group(1))

          def object_bytes(label: str) -> int:
              return int((evidence / f"{label}-object.bytes").read_text().strip())

          def module_rows(name: str) -> dict[str, dict[str, str]]:
              rows: dict[str, dict[str, str]] = {}
              for line in (evidence / name).read_text().splitlines():
                  fields = dict(re.findall(r"([a-z_]+)=([^ ]+)", line))
                  if "module" in fields:
                      rows[fields["module"]] = fields
              return rows

          baseline_elapsed, baseline_rss = metrics("baseline-object")
          candidate_elapsed, candidate_rss = metrics("candidate-object")
          split_build_elapsed, split_build_rss = metrics("candidate-split-build")
          split_test_elapsed, split_test_rss = metrics("candidate-split-test")
          unity_build_elapsed, unity_build_rss = metrics("candidate-unity-build")
          unity_test_elapsed, unity_test_rss = metrics("candidate-unity-test")
          gcc_elapsed, gcc_rss = metrics("candidate-gcc-object")
          split = module_rows("candidate-split-modules.txt")
          unity = module_rows("candidate-unity-modules.txt")
          drop = (1.0 - candidate_rss / baseline_rss) * 100.0

          def mib(kib: int) -> str:
              return f"{kib / 1024:.1f} MiB"

          metadata_assertions = split["x86_64_metadata_tests"]["assertions"]
          census_assertions = split["x86_64_completion_census_tests"]["assertions"]
          environment = (evidence / "environment.txt").read_text().strip()

          audit.write_text(f"""# X86 metadata test compile-memory audit — {audit.stem}

          ## Scope

          Issue #67 tracks the compiler-memory peak caused by optimizing the assertion-heavy
          `x86_64_metadata_test.c` translation unit. The repair leaves the full test and
          completion-census source intact, preserves unity inclusion and linkage, and applies
          a source-local low-optimization policy only in optimized configurations.

          - baseline source: `{base_sha}`
          - measured implementation: `{implementation_sha}`
          - workflow run: `https://github.com/{repository}/actions/runs/{run_id}`
          - method: same hosted runner, serial Ninja object builds, Clang `-O1 -g`
            baseline/candidate comparison; fresh default Release split and unity builds
          - canonical table audits were forced at runtime with
            `BUSTER_TEST_TABLE_AUDITS=1`

          ## Object result

          | tree | wall time | peak RSS | object bytes |
          | --- | ---: | ---: | ---: |
          | baseline | {baseline_elapsed} | {baseline_rss:,} KiB ({mib(baseline_rss)}) | {object_bytes('baseline'):,} |
          | candidate | {candidate_elapsed} | {candidate_rss:,} KiB ({mib(candidate_rss)}) | {object_bytes('candidate'):,} |

          Peak RSS fell by **{drop:.1f}%**. The candidate command ends in `-O0 -g0`,
          while all other sources retain the requested optimized configuration.

          ## Correctness and build coverage

          | gate | wall time | peak RSS | result |
          | --- | ---: | ---: | --- |
          | Clang Release non-unity build | {split_build_elapsed} | {mib(split_build_rss)} | pass |
          | Clang Release non-unity tests | {split_test_elapsed} | {mib(split_test_rss)} | pass |
          | Clang Release unity build | {unity_build_elapsed} | {mib(unity_build_rss)} | pass |
          | Clang Release unity tests | {unity_test_elapsed} | {mib(unity_test_rss)} | pass |
          | GCC Release non-unity metadata object | {gcc_elapsed} | {mib(gcc_rss)} | pass |

          Both split and unity runs reported `{metadata_assertions}` passing metadata assertions
          and `{census_assertions}` passing completion-census assertions, with zero failures.
          The source inventory and test bodies were not split, reduced, or generated differently.

          ## Environment

          ```text
          {environment}
          ```

          Compact command, timing, environment, and module-summary evidence is stored in
          `docs/performance-audits/evidence/{audit.stem}/`.
          """)
          PY_AUDIT

          python3 tools/new_audit.py --check
          git add "$audit" "$evidence"
          git commit -m "docs: record x86 metadata memory audit"
          git push origin "HEAD:$branch"

      - name: Retain raw validation logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-67-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/issue-67-raw
            docs/performance-audits/evidence
          if-no-files-found: warn
          retention-days: 14
