name: IR oracle focused diagnostic
on:
  push:
    branches: [codex/2229-canonical-ir-oracle]
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Hosted bootstrap
        run: |
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o /tmp/ir-oracle-build
      - name: Configure through native driver
        run: /tmp/ir-oracle-build generate --cc clang --config Release --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
      - name: Build through native driver
        run: /tmp/ir-oracle-build build --config Release -t ide
      - name: Independent IR/native boundary and fault controls
        env:
          BUSTER_TEST_JOBS: '1'
        run: build/Release/ide test --ci=1 --verbose=1 --module=ir_oracle_tests
