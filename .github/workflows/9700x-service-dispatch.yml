name: 9700X benchmark service dispatch

# This workflow deliberately does not check out repository content. The runner
# may invoke only the operator-installed, hash-verified gateway. Keep the
# repository variable disabled until the ruleset, main-only environment and
# runner group in GITHUB_ADMISSION.md have been verified by an administrator.
# Only davidgmbb (user 39247043) may reach the self-hosted runner; there is no
# manual environment approval. The authorize and submit job gates enforce it.
# It is stricter than checkout's credential policy because no checkout step
# exists; keep the repository-wide static policy marker: persist-credentials: false
on:
  workflow_dispatch:
    inputs:
      idempotency_key:
        description: Stable retry key (letters, digits, dot, underscore or dash)
        required: true
        type: string
      base_commit:
        description: Full lowercase hexadecimal base commit
        required: true
        type: string
      candidate_commit:
        description: Full lowercase hexadecimal candidate commit
        required: true
        type: string
      # The reviewed recipe allowlist. The submit job re-checks the value
      # against the same list and its reviewed budget, and the installed
      # service admits only recipes its compiled registry serves.
      recipe:
        description: Installed service recipe from the reviewed allowlist
        required: true
        type: choice
        default: validate-buster-v1
        options:
          - validate-buster-v1
          - zen5-calibration-v1

# Zero token capabilities are stricter than the repository-wide static
# read-only policy marker retained for common workflow tooling: contents: read
permissions: {}

concurrency:
  group: buster-9700x-service-dispatch
  cancel-in-progress: false

jobs:
  # Fail closed unless GitHub's own record of this exact run attempt names
  # davidgmbb by login and numeric ID as both actor and triggering actor of a
  # workflow_dispatch on main. Context values reach the script only via env.
  authorize:
    if: ${{ github.ref == 'refs/heads/main' && vars.BENCH_SERVICE_DISPATCH_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.actor == 'davidgmbb' && github.actor_id == '39247043' && github.triggering_actor == 'davidgmbb' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    timeout-minutes: 5
    outputs:
      attempt: ${{ steps.verify.outputs.attempt }}
    steps:
      - name: Verify the requester of this run attempt
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BQ_REPOSITORY: ${{ github.repository }}
          BQ_RUN_ID: ${{ github.run_id }}
          BQ_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$BQ_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$BQ_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BQ_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          record="$RUNNER_TEMP/run-attempt.json"
          # The token header is read from stdin, never placed on a command line.
          printf 'Authorization: Bearer %s\n' "$GH_TOKEN" |
            curl --fail --silent --show-error --proto '=https' --max-time 30 --retry 3 \
              --header @- --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' --output "$record" \
              "https://api.github.com/repos/$BQ_REPOSITORY/actions/runs/$BQ_RUN_ID/attempts/$BQ_RUN_ATTEMPT"
          python3 - "$record" "$BQ_RUN_ID" "$BQ_RUN_ATTEMPT" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              run = json.load(source)
          run_id, run_attempt = int(sys.argv[2]), int(sys.argv[3])
          maintainer = {"login": "davidgmbb", "id": 39247043}


          def identity(key):
              actor = run.get(key)
              if not isinstance(actor, dict) or type(actor.get("id")) is not int:
                  return None
              return {"login": actor.get("login"), "id": actor.get("id")}


          failures = [name for name, holds in (
              ("run id", type(run.get("id")) is int and run.get("id") == run_id),
              ("event", run.get("event") == "workflow_dispatch"),
              ("head branch", run.get("head_branch") == "main"),
              ("actor", identity("actor") == maintainer),
              ("triggering actor", identity("triggering_actor") == maintainer),
              ("run attempt", type(run.get("run_attempt")) is int and
               run.get("run_attempt") == run_attempt),
          ) if not holds]
          if failures:
              sys.exit("BENCH_DISPATCH_UNAUTHORIZED " + ", ".join(failures))
          PY
          printf 'attempt=%s\n' "$BQ_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  # "Re-run failed jobs" and single-job re-runs reuse the outputs of jobs that
  # succeeded in an earlier attempt, so an old authorize result must not
  # release a later attempt that anyone re-runs. submit therefore requires
  # authorize to have run and passed in this same attempt; a maintainer
  # re-run must use "Re-run all jobs".
  submit:
    needs: authorize
    if: ${{ github.ref == 'refs/heads/main' && vars.BENCH_SERVICE_DISPATCH_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.actor == 'davidgmbb' && github.actor_id == '39247043' && github.triggering_actor == 'davidgmbb' && needs.authorize.outputs.attempt == format('{0}', github.run_attempt) }}
    environment: benchmark-9700x
    runs-on:
      group: buster-9700x-service-dispatch
      labels: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
    # BQ_JOB_TIMEOUT_SECONDS must equal timeout-minutes; the policy test
    # enforces it. The result wait is derived from the recipe budget and never
    # outlives this job.
    timeout-minutes: 120
    env:
      BQ_IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
      BQ_BASE_COMMIT: ${{ inputs.base_commit }}
      BQ_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      BQ_RECIPE: ${{ inputs.recipe }}
      BQ_JOB_TIMEOUT_SECONDS: 7200
    steps:
      # Reviewed allowlist: recipe -> service runtime budget in seconds. Both
      # recipes wait for the broker's fixed RuntimeMaxSec, which bounds the
      # outer unit from its start. zen5-calibration-v1 also enforces its own
      # profile budget-seconds (2700), but that clock starts inside the unit,
      # after materialization, so waiting only that long could give up on a
      # job the service still runs. The service finalization allowance covers
      # materialization, the TERM/KILL escalation, stage cleanup, workspace
      # removal, bundle publication and one bounded client poll. The wait
      # starts at admission, so a job queued behind another can still outlive
      # it; the result stays retrievable. Admission must end early enough that
      # the full wait fits in the job.
      - name: Select the reviewed recipe and its result-wait budget
        id: budget
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          case "$BQ_RECIPE" in
            validate-buster-v1) runtime_budget=3600 ;;
            zen5-calibration-v1) runtime_budget=3600 ;;
            *)
              echo 'BENCH_DISPATCH_RECIPE_REFUSED recipe is not in the reviewed allowlist' >&2
              exit 1
              ;;
          esac
          finalization_allowance=600
          job_margin=300
          [[ "$BQ_JOB_TIMEOUT_SECONDS" =~ ^[1-9][0-9]{0,5}$ ]]
          wait_seconds=$((runtime_budget + finalization_allowance))
          job_deadline=$((started + BQ_JOB_TIMEOUT_SECONDS - job_margin))
          admission_deadline=$((job_deadline - wait_seconds))
          if ((admission_deadline <= started)); then
            echo 'BENCH_DISPATCH_BUDGET_REFUSED recipe budget does not fit in the job timeout' >&2
            exit 1
          fi
          {
            printf 'recipe=%s\n' "$BQ_RECIPE"
            printf 'runtime-budget=%s\n' "$runtime_budget"
            printf 'wait-seconds=%s\n' "$wait_seconds"
            printf 'admission-deadline=%s\n' "$admission_deadline"
            printf 'job-deadline=%s\n' "$job_deadline"
          } >> "$GITHUB_OUTPUT"

      - name: Validate immutable request fields and installed gateway
        shell: bash
        env:
          BQ_SELECTED_RECIPE: ${{ steps.budget.outputs.recipe }}
        run: |
          set -euo pipefail
          [[ "$BQ_IDEMPOTENCY_KEY" =~ ^[A-Za-z0-9._-]{1,64}$ ]]
          [[ "$BQ_BASE_COMMIT" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          [[ "$BQ_CANDIDATE_COMMIT" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          [[ ${#BQ_BASE_COMMIT} -eq ${#BQ_CANDIDATE_COMMIT} ]]
          [[ "$BQ_SELECTED_RECIPE" == "$BQ_RECIPE" ]]
          [[ "$BQ_RECIPE" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
          test -x /usr/local/libexec/buster-bench-service
          capabilities="$(/usr/bin/sudo -n -u buster-bench -- \
            /usr/local/libexec/buster-bench-service gateway capabilities)"
          # The installed service must list the selected recipe as one exact
          # comma-separated member of its service-recipes field.
          if ! grep -Eq "(^|[[:space:]])service-recipes=([^[:space:]]*,)?${BQ_RECIPE}(,[^[:space:]]*)?([[:space:]]|\$)" \
            <<<"$capabilities"; then
            echo 'BENCH_DISPATCH_RECIPE_NOT_INSTALLED the installed service does not serve this recipe' >&2
            exit 1
          fi
          grep -Fq 'admission=idle-only-atomic' <<<"$capabilities"

      - name: Drain and submit through the fixed gateway
        id: admission
        shell: bash
        env:
          BQ_ADMISSION_DEADLINE: ${{ steps.budget.outputs.admission-deadline }}
          BQ_RUNTIME_BUDGET: ${{ steps.budget.outputs.runtime-budget }}
          BQ_WAIT_SECONDS: ${{ steps.budget.outputs.wait-seconds }}
        run: |
          set -euo pipefail
          [[ "$BQ_ADMISSION_DEADLINE" =~ ^[1-9][0-9]*$ ]]
          receipt=
          admitted=0
          for ((attempt = 0; attempt < 180; attempt += 1)); do
            if (($(date +%s) >= BQ_ADMISSION_DEADLINE)); then
              break
            fi
            set +e
            receipt="$(/usr/bin/sudo -n -u buster-bench -- /usr/local/libexec/buster-bench-service gateway submit-recipe \
              "$BQ_RECIPE" "$BQ_IDEMPOTENCY_KEY" "$BQ_BASE_COMMIT" "$BQ_CANDIDATE_COMMIT" 2>&1)"
            status=$?
            set -e
            if [[ $status -eq 0 ]]; then
              admitted=1
              break
            fi
            if [[ "$receipt" == "bench_service: busy" ]]; then
              sleep 10
            else
              printf '%s\n' "$receipt" >&2
              exit "$status"
            fi
          done
          if [[ $admitted -ne 1 ]]; then
            echo 'BENCH_DISPATCH_NOT_ADMITTED the service stayed busy for the whole admission window' >&2
            exit 1
          fi
          printf '%s\n' "$receipt"
          job="$(printf '%s\n' "$receipt" | sed -n 's/^job=\([1-9][0-9]*\) .*/\1/p')"
          [[ "$job" =~ ^[1-9][0-9]*$ ]]
          printf 'job=%s\n' "$job" >> "$GITHUB_OUTPUT"
          {
            printf '## 9700X admission receipt\n\n'
            # Backticks delimit literal Markdown code in the summary.
            # shellcheck disable=SC2016
            printf 'recipe `%s`, runtime budget %s s, result wait %s s\n\n' \
              "$BQ_RECIPE" "$BQ_RUNTIME_BUDGET" "$BQ_WAIT_SECONDS"
            printf '```text\n'
            printf '%s\n' "$receipt"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # Poll until the recipe's reviewed wait has elapsed after admission,
      # capped by the job deadline; the budget step guarantees that cap
      # leaves the full wait.
      - name: Wait for the complete service receipt
        shell: bash
        env:
          BQ_JOB: ${{ steps.admission.outputs.job }}
          BQ_WAIT_SECONDS: ${{ steps.budget.outputs.wait-seconds }}
          BQ_JOB_DEADLINE: ${{ steps.budget.outputs.job-deadline }}
        run: |
          set -euo pipefail
          [[ "$BQ_WAIT_SECONDS" =~ ^[1-9][0-9]*$ ]]
          [[ "$BQ_JOB_DEADLINE" =~ ^[1-9][0-9]*$ ]]
          deadline=$(($(date +%s) + BQ_WAIT_SECONDS))
          if ((deadline > BQ_JOB_DEADLINE)); then
            deadline=$BQ_JOB_DEADLINE
          fi
          complete=0
          result=
          while (($(date +%s) < deadline)); do
            set +e
            result="$(/usr/bin/sudo -n -u buster-bench -- /usr/local/libexec/buster-bench-service gateway result "$BQ_JOB" 2>&1)"
            status=$?
            set -e
            if [[ $status -eq 0 && "$result" == *"phase=finished"* ]]; then
              printf '%s\n' "$result"
              [[ "$result" == *"outcome=succeeded"* ]]
              [[ "$result" == *"result-bound=1"* ]]
              complete=1
              break
            fi
            if [[ $status -ne 0 && "$result" != "bench_service: io-uncertain" && "$result" != "bench_service: busy" ]]; then
              printf '%s\n' "$result" >&2
              exit "$status"
            fi
            sleep 10
          done
          if [[ $complete -ne 1 ]]; then
            echo 'BENCH_DISPATCH_RESULT_WAIT_EXPIRED the reviewed result wait elapsed before the job finished' >&2
            exit 1
          fi
          {
            printf '\n## Complete result receipt\n\n```text\n'
            printf '%s\n' "$result"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
