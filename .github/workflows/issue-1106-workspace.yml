# Temporary investigation workflow on agent/1106-workspace only.
name: Issue 1106 workspace
on:
  push:
    branches: [agent/1106-workspace]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository_id == '1421805693'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 96b6cbcd122ffdc45700cf01d6e8adb40a81243c
          persist-credentials: false
      - name: Archive the exact investigation base
        shell: bash
        run: git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/issue-1106-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1106-source
          path: ${{ runner.temp }}/issue-1106-source.tar.gz
          retention-days: 1
          if-no-files-found: error
