# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Temporary qualification branch only; neither this workflow nor its patch enters the implementation PR.
name: Issue 1106 focused qualification
on:
  push:
    branches: [agent/1106-workspace]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository_id == '1421805693'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: payload
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 838da61f73d24e6ce11a00b5972c4e11680e4c1d
          path: implementation
      - name: Pass target options into the lane test's program preparation
        id: publish
        working-directory: implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 838da61f73d24e6ce11a00b5972c4e11680e4c1d
          git apply --check ../payload/.issue-1106-followup.patch
          git apply ../payload/.issue-1106-followup.patch
          git diff --check
          git switch -c agent/1106-target-fixture
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sh .githooks/enable-sign-off.sh --maintainer-session
          git add src/buster/compiler/c_check_lanes_test.c
          git commit -m 'tests: honor function target attributes in lane fixtures' -m 'Pass the parsed baseline target and predefines to check_program, as the public driver does. Without predefines, the explicit target attribute is ignored and the mask-depth fixture fails during builtin lowering rather than Tier 0 emission.' -m 'Agent model: OpenAI / GPT-6 Astra Pro' -m 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>'
          test "$(git log -1 --format=%B | sed '/^$/d' | tail -n 1)" = 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>'
          git push origin HEAD:refs/heads/agent/1106-target-fixture
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline HEAD
  validate:
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BUSTER_HOST_ARCH: native
      BUSTER_DEBUG_INFO: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - name: Install the project's verified Clang 23.1.4 toolchain
        run: bash tools/ci/setup-hosted.sh
      - name: Build the unchanged public compiler entry point
        shell: bash
        run: set -o pipefail; ./build.sh 2>&1 | tee "$RUNNER_TEMP/issue-1106-build.log"
      - name: Tier 0 native and Clang cross-checks
        shell: bash
        run: set -o pipefail; ./build/compiler test-tier0 --count 30 --cross-check --cross-count 5 2>&1 | tee "$RUNNER_TEMP/issue-1106-tier0.log"
      - name: Public driver shard containing the deep regression
        if: ${{ !cancelled() }}
        shell: bash
        run: set -o pipefail; ./build/compiler test-checker-driver --part 2/64 --executable "$PWD/build/compiler" 2>&1 | tee "$RUNNER_TEMP/issue-1106-driver.log"
      - name: Lane failure and retry semantics with the default program inventory
        if: ${{ !cancelled() }}
        shell: bash
        run: set -o pipefail; ./build/compiler test-check-lanes --executable "$PWD/build/compiler" 2>&1 | tee "$RUNNER_TEMP/issue-1106-lanes.log"
      - name: Check module ownership
        if: ${{ !cancelled() }}
        shell: bash
        run: set -o pipefail; ./build.sh check-call-graph 2>&1 | tee "$RUNNER_TEMP/issue-1106-call-graph.log"
      - name: Preserve qualification output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1106-qualification
          path: ${{ runner.temp }}/issue-1106-*.log
          retention-days: 1
          if-no-files-found: ignore
