name: Campaign evidence readback

# Scratch helper for the #880 campaign. It copies a retained Actions artifact
# of this public repository onto an orphan scratch branch so the coordinating
# session (which cannot reach the artifact blob host) can fetch it with git.
on:
  push:
    branches: [codex/880-evidence-readback]

permissions:
  actions: read
  contents: write

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue1162-exact-systemd-slice
          run-id: 36373171892
          github-token: ${{ github.token }}
          path: a23
      - name: Publish to orphan scratch branch
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd a23
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Attempt 24 artifact 10950445985 (run 36373171892), sha256 a2a3515fa995d83266d992b04d0484174646d9f3f00dcd7cb4a5c63722095466"
          git push -q "https://x-access-token:${TOKEN}@github.com/${REPO}.git" data:refs/heads/codex/880-evidence-a24-data
          git rev-parse HEAD
