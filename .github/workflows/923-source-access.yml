name: PR 923 isolated exact-tree publication
on:
  push:
    branches: [work/923-source-access]
    paths: [.github/workflows/923-source-access.yml]
permissions:
  contents: read
concurrency:
  group: pr-923-source-access-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Decode exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          data = lzma.decompress(base64.b64decode(Path('.github/923-samples.patch.xz.b64').read_bytes(), validate=False))
          assert len(data) == 59120
          assert hashlib.sha256(data).hexdigest() == '79cdd663b047c9530520606b8c8cae19fe5f8afe221c55690ea9adac2d4d138f'
          (Path(os.environ['RUNNER_TEMP']) / '923-samples.patch').write_bytes(data)
          PY
      - name: Commit only the independently verified implementation tree
        shell: bash
        run: |
          set -euo pipefail
          base=ea49afe045444918121d441431d07f6520ad90ae
          git fetch --no-tags --depth=1 origin "$base"
          git checkout --detach "$base"
          test "$(git rev-parse HEAD^{tree})" = ea6fc61ce6b6fedd97d27066b333d2500ab8a6f7
          git apply --check "$RUNNER_TEMP/923-samples.patch"
          git apply --index "$RUNNER_TEMP/923-samples.patch"
          test "$(git write-tree)" = 6f72218a5b30d8577dcb16266fb122b3baca0926
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --no-gpg-sign -m 'bench: produce bounded native retirement paired samples'
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git rev-parse HEAD^{tree})" = 6f72218a5b30d8577dcb16266fb122b3baca0926
          git push origin HEAD:refs/heads/work/923-native-sample-producer
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/923-published-identities.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr923-native-sample-producer-identities
          path: ${{ runner.temp }}/923-published-identities.txt
          retention-days: 1
          if-no-files-found: error
