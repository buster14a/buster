name: Phase order offline evidence analysis

# Reuses the frozen diagnostic run; never builds or samples a compiler.
on:
  push:
    branches: [codex/49-phase-order-census]
    paths:
      - .github/workflows/research-phase-order-analysis.yml

permissions:
  contents: read
  actions: read

jobs:
  analysis:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download exact frozen original evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36644293743 --repo buster14a/buster --name phase-order-c9a6d233f3da1b647309b248325f37b2bfd6e0e1-36644293743-1 --dir original
      - name: Analyze and retain compact evidence
        run: |
          mkdir compact
          python3 tools/research/phase_order_summarize.py original/results/summary.json --output compact/comparison
          python3 tools/research/phase_order_worklist.py original/results/*/direct-ssa/fast/FADP/compile.stdout.log --assume-trace --fifo --output compact/worklist.json
          python3 - <<'PY'
          from pathlib import Path
          import gzip,shutil,tarfile,json
          root=Path('original')
          for name in ('revision.txt','source-identities.json','binary.sha256','compiler.txt','environment.txt','cjson-LICENSE.txt','instrument.patch','pristine-input-git-blobs.txt'):
              shutil.copyfile(root/name,Path('compact')/name)
          shutil.copyfile(root/'results/commands.jsonl',Path('compact')/'commands.jsonl')
          with gzip.open('compact/summary.json.gz','wb',compresslevel=9) as f:
              f.write((root/'results/summary.json').read_bytes())
          with gzip.open('compact/worklist.json.gz','wb',compresslevel=9) as f:
              f.write(Path('compact/worklist.json').read_bytes())
          Path('compact/worklist.json').unlink()
          with tarfile.open('compact/raw-compile-evidence.tar.gz','w:gz',compresslevel=9) as archive:
              for p in sorted((root/'results').rglob('*')):
                  if p.is_file() and (p.name in ('compile.stdout.log','compile.stderr.log') or 'inputs' in p.parts):
                      archive.add(p,arcname=str(p.relative_to(root)))
          print(json.dumps({str(p):p.stat().st_size for p in Path('compact').rglob('*') if p.is_file()},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-order-report-${{ github.sha }}
          path: |
            compact/comparison
            compact/*.txt
            compact/commands.jsonl
            compact/source-identities.json
            compact/instrument.patch
            compact/binary.sha256
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-order-raw-${{ github.sha }}
          path: |
            compact/raw-compile-evidence.tar.gz
            compact/summary.json.gz
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-order-worklist-${{ github.sha }}
          path: compact/worklist.json.gz
          retention-days: 14
          if-no-files-found: error
