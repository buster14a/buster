name: Issue 1149 branch authoring
on:
  push:
    branches: [astra/1149-wide-cfa]
    paths: [.github/workflows/issue-1149-author.yml, .github/issue-1149.patch]
permissions:
  contents: write
jobs:
  author:
    if: github.repository_id == '1421805693'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Inspect frame layout and apply the exact reviewed patch when present
        shell: bash
        run: |
          set -euo pipefail
          awk '/^static .*tier0_layout_frame\(/ { printing = 1 } printing { print } printing && /^}/ { printing = 0 }' src/buster/compiler/tier0.c
          if test -f .github/issue-1149.patch; then
            git apply --check --recount .github/issue-1149.patch
            git apply --recount .github/issue-1149.patch
            git diff --check
            git diff --stat
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- src/buster/compiler docs
            git -c core.hooksPath=/dev/null commit -m 'fix: carry emission CFA offsets beyond signed 32 bits' -m 'Restore the fixed imm32 frame range through events, rows and verification, with compile-only boundary regressions for #1149.' -m 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>'
            git push origin HEAD:refs/heads/astra/1149-wide-cfa
          fi
          git archive --format=tar HEAD > "$RUNNER_TEMP/issue-1149-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1149-source
          path: ${{ runner.temp }}/issue-1149-source.tar
          retention-days: 1
