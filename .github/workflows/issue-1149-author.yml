name: Issue 1149 branch authoring
on:
  push:
    branches: [astra/1149-wide-cfa]
    paths: [.github/workflows/issue-1149-author.yml]
permissions:
  contents: write
jobs:
  author:
    if: github.repository_id == '1421805693'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ef732908efd1cf730e39c0452a93d49bf34941ee
          fetch-depth: 6
      - name: Finish whitespace and audit every PR commit
        shell: bash
        run: |
          set -euo pipefail
          file=src/buster/compiler/emitted_code_limits_test.c
          test "$(git hash-object "$file")" = 29836659b74cc6c762ac74e005b7132e70398fcd
          sed -i '${/^$/d;}' "$file"
          test "$(git hash-object "$file")" = 3127e65c93c472c893182c1c5168993758a20515
          git diff --ignore-blank-lines --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sh .githooks/enable-sign-off.sh --maintainer-session
          git add -- "$file"
          git commit -m 'style: remove the trailing empty line from the frame regression'
          git diff --check 441db2428d2bd8d28503037b28c1b3740fe4b25a HEAD
          mkdir -p build
          cc -std=c17 -O2 -Wall -Wextra -Werror -o build/dco tools/dco/dco.c
          build/dco audit --base 441db2428d2bd8d28503037b28c1b3740fe4b25a --head HEAD
          git log -1 --format=fuller
          git push origin HEAD:refs/heads/fix/1149-wide-cfa
      - name: Retire temporary authoring files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin refs/heads/astra/1149-wide-cfa
          git checkout --detach FETCH_HEAD
          git rm -- .github/workflows/issue-1149-author.yml .github/issue-1149.patch .github/issue-1149-core.diff .github/issue-1149-tests.diff .github/issue-1149-docs.diff
          git commit -m 'chore: retire the completed issue 1149 authoring transport'
          git push origin HEAD:refs/heads/astra/1149-wide-cfa
