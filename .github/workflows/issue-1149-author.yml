name: Issue 1149 branch authoring
on:
  push:
    branches: [astra/1149-wide-cfa]
    paths: [.github/workflows/issue-1149-author.yml]
permissions:
  contents: write
jobs:
  author:
    if: github.repository_id == '1421805693'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Apply the reviewed patches and verify every resulting blob
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --index --unidiff-zero .github/issue-1149-core.diff .github/issue-1149-tests.diff .github/issue-1149-docs.diff
          git apply --index --unidiff-zero .github/issue-1149-core.diff .github/issue-1149-tests.diff .github/issue-1149-docs.diff
          while read -r expected path; do
            actual=$(git hash-object "$path")
            test "$actual" = "$expected" || { printf 'Source mismatch: %s expected %s actual %s\n' "$path" "$expected" "$actual"; exit 1; }
          done <<'BLOBS'
          597f4df5261768685e192d65198bf5bda1e54f06 docs/commands/emission.md
          b680939a4cda5f1ce029fc1a1c13b3361e358feb docs/emission-metadata.md
          debe9072a3f5222eb03b7ad66fe662539ffefe71 docs/unwind.md
          ac1997d130e57290fd9913dd1af83d13d12fbd1d src/buster/compiler/c_check_program_emit.c
          a3623e9b6cf45fe55c2103e2e1e68a8e8c30d72c src/buster/compiler/emission_metadata.c
          168f0c3dc4675157ebbe3f2ec61be086d4cccb5e src/buster/compiler/emission_metadata_test.c
          026d493f15f4b039ac1ad569a0b942df3a9ef898 src/buster/compiler/emitted_code.c
          24d1f3ab3a7610312f5142a89392447b08bf1586 src/buster/compiler/emitted_code_test.c
          4390e349a160c2510d3d40c407c66d782c7b3e60 src/buster/compiler/tier1_frame_emit.c
          f90414090fdfc8a1d183f57d8fb8b694c7414a5f src/buster/compiler/unwind.c
          6e35d60b6f151a7cafd023ea40dc3176b8e10a24 src/buster/compiler/emitted_code_limits_test.c
          BLOBS
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sh .githooks/enable-sign-off.sh --maintainer-session
          git commit -m 'fix: carry emission CFA offsets beyond signed 32 bits' -m 'Restore the fixed imm32 frame range through events, rows and verification, with compile-only boundary regressions for #1149.'
          git log -1 --format=fuller
          git push origin HEAD:refs/heads/astra/1149-wide-cfa
      - name: Install the existing hosted test toolchain
        run: bash tools/ci/setup-hosted.sh
      - name: Build and run focused correctness tests
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh --config Release
          compiler=$(./build.sh print-output --config Release)
          "$compiler" test-emission-metadata
          "$compiler" test-emitted-code --count 8 --cross-check
          "$compiler" test-unwind --cross-check
          "$compiler" test-tier1-frame
          "$compiler" test-tier1-frame-execution
          clang -std=c17 -O1 -g -march=x86-64 -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc tests/emission-metadata/test.c -o "$RUNNER_TEMP/emission-metadata-sanitized"
          "$RUNNER_TEMP/emission-metadata-sanitized"
      - name: Export the exact resulting source
        if: always()
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/issue-1149-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-1149-source
          path: ${{ runner.temp }}/issue-1149-source.tar
          retention-days: 1
