name: Issue 1149 branch authoring
on:
  push:
    branches: [astra/1149-wide-cfa]
    paths: [.github/workflows/issue-1149-author.yml]
permissions:
  contents: write
jobs:
  author:
    if: github.repository_id == '1421805693'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 944f83cc167452c54caeeafc6e2a7a7e58e085ab
          fetch-depth: 1
      - name: Correct the new test's byte-pointer type
        shell: bash
        run: |
          set -euo pipefail
          file=src/buster/compiler/emitted_code_limits_test.c
          test "$(git hash-object "$file")" = 6e35d60b6f151a7cafd023ea40dc3176b8e10a24
          sed -i 's/x86_elf_section(bytes.pointer, bytes.length/x86_elf_section((const uint8_t*)bytes.pointer, bytes.length/' "$file"
          test "$(git hash-object "$file")" = 64dda668e4609df61787442d2e9834b3c9367450
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sh .githooks/enable-sign-off.sh --maintainer-session
          git add -- "$file"
          git commit -m 'test: pass an unsigned byte pointer to the ELF section reader'
          git log -1 --format=fuller
          git push origin HEAD:refs/heads/fix/1149-wide-cfa
      - name: Install the existing hosted test toolchain
        run: bash tools/ci/setup-hosted.sh
      - name: Build
        run: ./build.sh --config Release
      - name: Emission metadata including standalone sanitizers
        shell: bash
        run: |
          set -euo pipefail
          compiler=$(./build.sh print-output --config Release)
          "$compiler" test-emission-metadata
          clang -std=c17 -O1 -g -march=x86-64 -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc tests/emission-metadata/test.c -o "$RUNNER_TEMP/emission-metadata-sanitized"
          "$RUNNER_TEMP/emission-metadata-sanitized"
      - name: Emitted-code boundary and cross-check suite
        shell: bash
        run: |
          set -euo pipefail
          compiler=$(./build.sh print-output --config Release)
          "$compiler" test-emitted-code --count 8 --cross-check
      - name: Unwind and Tier 1 frame suites
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          compiler=$(./build.sh print-output --config Release)
          "$compiler" test-unwind --cross-check
          "$compiler" test-tier1-frame
          "$compiler" test-tier1-frame-execution
      - name: Export the exact resulting source
        if: always()
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/issue-1149-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-1149-source
          path: ${{ runner.temp }}/issue-1149-source.tar
          retention-days: 1
