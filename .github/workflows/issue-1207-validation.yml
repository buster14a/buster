name: Issue 1207 read-only timing integration

on:
  push:
    branches: [agent/1207-ci-validation]

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 1d8fda04678b84255fd5d781ad35c1f82b3f661a
          persist-credentials: false
      - name: Recheck regression fixtures on the implementation commit
        run: bash tests/ci/timings.sh
      - name: Exercise the timing collector against actual workflow data
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/timings.sh "$RUNNER_TEMP/ci-timings"
      - name: Publish read-only baseline
        run: cat "$RUNNER_TEMP/ci-timings/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-1207-latency-baseline
          path: |
            ${{ runner.temp }}/ci-timings/*.json
            ${{ runner.temp }}/ci-timings/*.tsv
            ${{ runner.temp }}/ci-timings/*.md
          if-no-files-found: warn
          retention-days: 7
