name: Issue 274 snapshot

on:
  push:
    branches:
      - fix/274-static-assert-ice

concurrency:
  group: issue-274-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pack tracked source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/buster-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-274-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/buster-source.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
