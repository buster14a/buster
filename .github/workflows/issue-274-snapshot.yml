name: Apply and validate issue 274

on:
  push:
    branches:
      - fix/274-static-assert-ice

concurrency:
  group: issue-274-implementation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tools/issue_274_patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/issue-274.patch"
          printf '%s  %s\n' '47d42d12e80dbe77dc7d77c9368d340d2bbadd2189c5d5bde2b8724b3756eae1' "$RUNNER_TEMP/issue-274.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/issue-274.patch"
          git apply "$RUNNER_TEMP/issue-274.patch"
          rm .github/workflows/issue-274-snapshot.yml tools/issue_274_snapshot_trigger.txt tools/issue_274_patch.gz.b64
          git diff --check

      - name: Build and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o build/build
          ./build/build generate --cc clang --config Release --linker DEFAULT -DBUSTER_UNITY_BUILD=OFF -DBUSTER_DEBUG_INFO=OFF -DBUSTER_FRAME_POINTERS=ON
          cmake --build build --config Release --target test_units --parallel 4

      - name: Publish implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'c: enforce integer static assertion expressions'
          git push origin HEAD:fix/274-static-assert-ice
