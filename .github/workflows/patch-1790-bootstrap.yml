name: Patch issue 1790 support bootstrap

on:
  push:
    branches:
      - bootstrap/1790-support-digest

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply trusted-reader bootstrap
        shell: bash
        run: python3 .github/scripts/patch_1790_bootstrap.py

      - name: Run focused retirement gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native_retirement_contract_test.py -v
          python3 tools/native_retirement_materializer_test.py -v
          python3 tools/native_retirement_performance_identity_test.py -v
          python3 tools/native_retirement_performance_eligibility_test.py -v
          python3 tools/native_retirement_performance_binding_test.py -v
          python3 tools/native_retirement_integration_test.py -v
          python3 tools/merge_conflict_preflight_test.py -v
          git diff --check

      - name: Publish bootstrap commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs tools .github
          git diff --cached --check
          git commit -m 'ci: bootstrap #1790 support declaration identity'
          git push origin HEAD:${GITHUB_REF_NAME}
