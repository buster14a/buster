name: Semantic facts experiment (temporary)
on:
  push:
    branches: [astra/1028-semantic-facts-2e942e80]
permissions:
  contents: read
concurrency:
  group: semantic-facts-1028-comparison
  cancel-in-progress: true
jobs:
  comparison:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      BUSTER_TEST_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 12
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mold
      - name: Matched trusted subjects and frozen source
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence subjects frozen/src frozen/generated
          exec > >(tee evidence/matched-builds.log) 2>&1
          git rev-parse HEAD 'HEAD^{tree}'
          clang --version
          cmake --version
          ninja --version
          uname -a
          lscpu
          free -b
          git diff --exit-code 2e942e80a87666409cf29d3e24a68d322b9e71fd -- src build.c CMakeLists.txt cmake tools/throughput/throughput.c tools/throughput/tests.c
          git archive 2e942e80a87666409cf29d3e24a68d322b9e71fd:src | tar -xf - -C frozen/src
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --config Release --cc clang --ci -DBUSTER_UNITY_BUILD=OFF -DBUSTER_INCLUDE_TESTS=OFF
          "$RUNNER_TEMP/buster-build" build --config Release -t ide -- -j2
          cp build/Release/ide subjects/baseline
          cp -a build/generated/. frozen/generated/
          cp build/compile_commands.json evidence/compile-commands-baseline.json
          touch src/buster/lib/compiler/frontend/c/c_parse.c
          "$RUNNER_TEMP/buster-build" build --config Release -t ide -- -j2
          cp build/Release/ide subjects/rebuilt-baseline
          git apply --check tools/throughput/experiments/1028-hoist.patch
          git apply tools/throughput/experiments/1028-hoist.patch
          git diff > evidence/hoist.diff
          git hash-object src/buster/lib/compiler/frontend/c/c_parse.c > evidence/candidate-source-blob.txt
          "$RUNNER_TEMP/buster-build" build --config Release -t ide -- -j2
          cp build/Release/ide subjects/hoist
          cp build/compile_commands.json evidence/compile-commands-candidate.json
          sha256sum subjects/* > evidence/compilers.sha256
          find frozen -type f -print0 | sort -z | xargs -0 sha256sum > evidence/frozen-inputs.sha256
          "$RUNNER_TEMP/buster-build" bench_throughput self-test
          git apply --check tools/throughput/experiments/1028-trusted-only.patch
          git apply tools/throughput/experiments/1028-trusted-only.patch
          git diff -- tools/throughput/throughput.c tools/throughput/tests.c > evidence/harness-selection.diff
          "$RUNNER_TEMP/buster-build" bench_throughput self-test
          "$RUNNER_TEMP/buster-build" bench_throughput help
          sha256sum build/throughput-tools/throughput > evidence/harness.sha256
      - name: Separate exact-range census before timing
        if: ${{ !cancelled() && steps.subjects.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee evidence/census-build.log) 2>&1
          git checkout -- src/buster/lib/compiler/frontend/c/c_parse.c src/buster/lib/compiler/frontend/c/c_gen.c
          git apply tools/throughput/experiments/1028-census.patch
          "$RUNNER_TEMP/buster-build" build --config Release -t ide -- -j2
          cp build/Release/ide subjects/census-baseline
          git apply tools/throughput/experiments/1028-hoist.patch
          "$RUNNER_TEMP/buster-build" build --config Release -t ide -- -j2
          cp build/Release/ide subjects/census-hoist
          sha256sum subjects/census-* > evidence/census-compilers.sha256
          for variant in baseline hoist; do
            for form in frontend-ssa no-frontend-ssa; do
              (cd frozen && ../subjects/census-$variant cc -Isrc -Igenerated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -g -c -f$form -fsource-metrics=../evidence/census-$variant-$form.metrics src/buster/apps/ide/ide.c -o ../evidence/census-$variant-$form.o) > evidence/census-$variant-$form.stdout 2> evidence/census-$variant-$form.stderr
            done
          done
          sha256sum evidence/census-*.o > evidence/census-outputs.sha256
          cmp evidence/census-baseline-frontend-ssa.o evidence/census-hoist-frontend-ssa.o
          cmp evidence/census-baseline-no-frontend-ssa.o evidence/census-hoist-no-frontend-ssa.o
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: semantic-facts-census-${{ github.run_id }}
          path: evidence
          retention-days: 14
          if-no-files-found: error
      - name: Trusted-only total compilation, fixed A-A and A-B rounds
        if: ${{ !cancelled() && steps.subjects.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee evidence/comparison.log) 2>&1
          harness="$PWD/build/throughput-tools/throughput"
          common=(--workload tiny_startup --profile ci --mode fast --warmups 1 --no-guard --self-host-root "$PWD/frozen" --self-host-generated "$PWD/frozen/generated" --require-identical-output)
          "$harness" run --baseline "$PWD/subjects/baseline" --candidate "$PWD/subjects/rebuilt-baseline" --baseline-id 2e942e80 --candidate-id same-root-rebuild --output "$PWD/evidence/aa" --pairs 4 "${common[@]}"
          failed=0
          for form in frontend-ssa no-frontend-ssa; do
            "$harness" run --baseline "$PWD/subjects/baseline" --candidate "$PWD/subjects/hoist" --baseline-id 2e942e80 --candidate-id hoist-56db7b6 --output "$PWD/evidence/$form" --pairs 20 --flag "-f$form" "${common[@]}" || failed=1
          done
          find frozen -type f -print0 | sort -z | xargs -0 sha256sum > evidence/frozen-inputs-after.sha256
          cmp evidence/frozen-inputs.sha256 evidence/frozen-inputs-after.sha256
          sha256sum -c evidence/compilers.sha256
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: semantic-facts-comparison-${{ github.run_id }}
          path: |
            evidence
            build/CMakeCache.txt
          retention-days: 14
          if-no-files-found: error
