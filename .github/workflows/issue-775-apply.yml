name: Apply issue 775 patch
on:
  push:
    branches: [codex/775-baseline-vectors]
    paths: [.github/workflows/issue-775-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'buster14a/buster'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/775-baseline-vectors
      - name: Apply reviewed source diff
        shell: bash
        env:
          PATCH: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 9c6e959d60f448648acfd544c9b5cef6803188b7
          printf '%s' "$PATCH" | base64 -d | gzip -d > "$RUNNER_TEMP/issue775.patch"
          git apply --check "$RUNNER_TEMP/issue775.patch"
          git apply "$RUNNER_TEMP/issue775.patch"
          git diff --check
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add src/buster/compiler
          env -u BUSTER_DCO_SIGN_OFF git commit -m 'feat(tier0): lower baseline SSE2 and AVX vector values and operations'
          git push origin HEAD:refs/heads/codex/775-baseline-vectors
