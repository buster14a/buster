name: Apply issue 891 patch

on:
  push:
    branches: [recovery/891-native-observation-payload]

permissions:
  contents: read

jobs:
  apply:
    name: Apply, validate, and export
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Apply final patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/.issue891-patch-* > "$RUNNER_TEMP/issue891.zb64"
          python3 - "$RUNNER_TEMP/issue891.zb64" <<'PYTHON'
          import base64
          import sys
          import zlib
          from pathlib import Path

          encoded = Path(sys.argv[1]).read_bytes()
          Path('/tmp/apply_issue_891_patch.py').write_bytes(
              zlib.decompress(base64.b64decode(encoded))
          )
          PYTHON
          python3 /tmp/apply_issue_891_patch.py
          python3 - <<'PYTHON'
          from pathlib import Path

          path = Path("tools/ci_native_observation_test.py")
          text = path.read_text(encoding="utf-8")
          old = '        self.assertNotIn("continue-on-error:", workflow[workflow.index("  native:"):workflow.index("  mobile:")])'
          new = (
              '        native = workflow[workflow.index("  native:"):workflow.index("  mobile:")]\n'
              '        self.assertNotRegex(native, r"(?m)^\\s*continue-on-error:")'
          )
          if old not in text:
              raise SystemExit("expected workflow assertion was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")

          workflow_path = Path(".github/workflows/ci.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          expression = "$" + "{{"
          old_root = (
              "      BUSTER_CI_OBSERVATION_ROOT: "
              + expression
              + " runner.temp }}/buster-ci/native-observation"
          )
          new_root = (
              "      BUSTER_CI_OBSERVATION_ROOT: "
              + expression
              + " github.workspace }}/.ci-native-observation"
          )
          if old_root not in workflow:
              raise SystemExit("expected native observation root was not found")
          workflow_path.write_text(workflow.replace(old_root, new_root), encoding="utf-8")
          PYTHON
          rm -f tools/.issue891-patch-* .github/workflows/issue-891-apply.yml

      - name: Validate final tree
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ci_native_observation.py tools/ci_native_observation_test.py
          python3 tools/ci_native_observation_test.py -v
          python3 tools/check_action_pins.py
          python3 tests/action_pins_test.py
          go run github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 -color .github/workflows/*.yml
          git diff --check

      - name: Bundle validated final tree
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/workflows/ci.yml
            docs/ci-github-actions.md
            docs/ci-suite-partition.md
            docs/native-runner-observations.md
            tools/ci_native_observation.py
            tools/ci_native_observation_test.py
          )
          printf '%s\n' "${files[@]}" > "$RUNNER_TEMP/issue891-files.txt"
          tar -czf "$RUNNER_TEMP/issue891-final-files.tar.gz" "${files[@]}"
          sha256sum "${files[@]}" > "$RUNNER_TEMP/issue891-SHA256SUMS"

      - name: Export validated final tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-891-validated-tree-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/issue891-files.txt
            ${{ runner.temp }}/issue891-final-files.tar.gz
            ${{ runner.temp }}/issue891-SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
