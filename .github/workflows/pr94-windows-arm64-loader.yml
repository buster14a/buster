name: PR 94 Windows ARM64 loader diagnostic

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  loader:
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Build and diagnose
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPath = (& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath | Select-Object -First 1).Trim()
          & (Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1') -Arch arm64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cmd /c 'clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o build\build.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c 'build\build.exe generate --cc clang --config Release --linker DEFAULT'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c 'build\build.exe build --config Release -t ide'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmd /c 'build\Release\ide.exe cc -g0 -o build\buster-arm64.exe tests\basic_c_compile.c'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c 'build\Release\ide.exe cc -c -g0 -o build\buster-arm64.obj tests\basic_c_compile.c'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c 'lld-link /entry:main /subsystem:console /nodefaultlib /out:build\lld-arm64.exe build\buster-arm64.obj'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          llvm-readobj --file-headers --sections --coff-imports --unwind build\buster-arm64.exe
          llvm-readobj --file-headers --sections --unwind build\lld-arm64.exe

          Copy-Item build\buster-arm64.exe build\buster-arm64-no-exceptions.exe
          $Image = [IO.File]::ReadAllBytes((Resolve-Path build\buster-arm64-no-exceptions.exe))
          $Pe = [BitConverter]::ToUInt32($Image, 0x3c)
          $Optional = $Pe + 24
          [Array]::Clear($Image, $Optional + 136, 8)
          [IO.File]::WriteAllBytes((Resolve-Path build\buster-arm64-no-exceptions.exe), $Image)

          Copy-Item build\buster-arm64.exe build\buster-arm64-direct-main.exe
          $Image = [IO.File]::ReadAllBytes((Resolve-Path build\buster-arm64-direct-main.exe))
          $Pe = [BitConverter]::ToUInt32($Image, 0x3c)
          $Optional = $Pe + 24
          $MainLine = (llvm-nm build\buster-arm64.obj | Select-String ' T main$').Line
          $MainOffset = [Convert]::ToUInt32(($MainLine -split '\s+')[0], 16)
          [BitConverter]::GetBytes([uint32](0x1000 + $MainOffset)).CopyTo($Image, $Optional + 16)
          [Array]::Clear($Image, $Optional + 120, 8)
          [Array]::Clear($Image, $Optional + 208, 8)
          [IO.File]::WriteAllBytes((Resolve-Path build\buster-arm64-direct-main.exe), $Image)

          foreach ($Program in @('build\buster-arm64.exe', 'build\buster-arm64-no-exceptions.exe', 'build\buster-arm64-direct-main.exe', 'build\lld-arm64.exe')) {
            Write-Output "RUN $Program"
            try {
              & $Program
              Write-Output "EXIT $LASTEXITCODE"
            } catch {
              Write-Output "ERROR $($_.Exception.GetType().FullName) native=$($_.Exception.NativeErrorCode) message=$($_.Exception.Message)"
            }
          }
