name: Temporary patch codegen issue 194

on:
  push:
    branches:
      - agent/inspect-190-195
    paths:
      - .github/agent_patch_codegen_194.py
      - .github/workflows/agent-patch-codegen-194.yml

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Prepare clean main worktree and apply fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          worktree="$RUNNER_TEMP/codegen-194"
          rm -rf "$worktree"
          git worktree add --detach "$worktree" origin/main
          python3 .github/agent_patch_codegen_194.py "$worktree"
          git -C "$worktree" diff --check
          git -C "$worktree" diff --stat
      - name: Install Vulkan SDK
        shell: bash
        run: bash "$RUNNER_TEMP/codegen-194/.github/scripts/install-vulkan-sdk.sh"
      - name: Build compiler
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/codegen-194"
          driver="$RUNNER_TEMP/buster-build-194"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver"
          "$driver" generate --cc clang --ci --linker DEFAULT
          "$driver" build --config Release -t ide --verbose
      - name: Run focused i128 floating conversion regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/codegen-194"
          build/Release/ide cc tests/basic_c_i128_float.c -o "$RUNNER_TEMP/basic_c_i128_float"
          "$RUNNER_TEMP/basic_c_i128_float"
      - name: Run full Release suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/codegen-194"
          "$RUNNER_TEMP/buster-build-194" build --config Release -t test_all --verbose
      - name: Publish clean fix branch
        shell: bash
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/codegen-194"
          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add src/buster/lib/compiler/codegen/codegen.c tests/basic_c_i128_float.c
          git -C "$worktree" commit -m 'codegen: support x86-64 i128 floating conversions'
          git -C "$worktree" push --force origin HEAD:agent/fix-codegen-194
