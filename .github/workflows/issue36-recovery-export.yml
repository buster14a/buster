name: Issue 36 recovery source export
on:
  push:
    branches: [work/36-recovered-integration-20260915]
    paths: [.github/workflows/issue36-recovery-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch immutable integration snapshots
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            +refs/heads/main:refs/heads/export/main \
            +refs/heads/codex/569-canonical-landing-20260914:refs/heads/export/correctness \
            +refs/heads/recovery/6aa9d3a7/cutover-883b:refs/heads/export/cutover \
            +refs/heads/recovery/6aa9d3a7/performance-service-c289:refs/heads/export/performance-service \
            +refs/heads/recovery/6aa9d3a7/service-f5ab:refs/heads/export/service \
            +refs/heads/codex/513-mir-only-native:refs/heads/export/original-cutover
          git show-ref | grep 'refs/heads/export/' > source-identities.txt
          mkdir source.git
          cp -a .git/objects .git/refs source.git/
          for f in shallow packed-refs; do
            if test -f ".git/$f"; then cp ".git/$f" source.git/; fi
          done
          printf 'ref: refs/heads/export/cutover\n' > source.git/HEAD
          printf '[core]\nrepositoryformatversion = 0\nbare = true\n' > source.git/config
          git --git-dir=source.git fsck --connectivity-only
          tar -czf issue36-source-objects.tar.gz source.git source-identities.txt
      - uses: actions/upload-artifact@v4
        with:
          name: issue36-source-objects-${{ github.run_id }}
          path: issue36-source-objects.tar.gz
          retention-days: 7
          if-no-files-found: error
