name: Read retained hosted fixture failure
on:
  push:
    branches: [codex/3204-evidence-transfer]
    paths: [.github/workflows/compiler-evidence-transfer.yml]
permissions:
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact retained fixed-40 fixture data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 120 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/buster14a/buster/actions/artifacts/11640784198/zip" \
            --output "$RUNNER_TEMP/retained-main40.zip"
          printf '%s  %s\n' '442cc046e082fe063e9802f2d3e87313dd85e887f79c87b1ba4496ef2d200acc' "$RUNNER_TEMP/retained-main40.zip" | sha256sum --check
          python3 - "$RUNNER_TEMP/retained-main40.zip" <<'PY'
          import json, sys, zipfile
          wanted = ("main40/ordinary/owned-phases/0025.json", "main40/ordinary/receipt.json", "main40/lab/summary.json", "manager.json")
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for name in wanted:
                  info = archive.getinfo(name)
                  if info.file_size > 65536:
                      raise ValueError("retained JSON exceeds fixed data bound")
                  value = json.loads(archive.read(info))
                  if name.endswith("/receipt.json"):
                      value = {key: item for key, item in value.items() if key != "phase_ownership"}
                  print("RETAINED_JSON_BEGIN", name)
                  print(json.dumps(value, sort_keys=True, indent=2))
                  print("RETAINED_JSON_END", name)
          PY
