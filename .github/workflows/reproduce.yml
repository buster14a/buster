name: Hosted reproduction (not qualification)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Inventory profile (advisory; never a merge qualification)
        type: choice
        options: [smoke, affected, frontend, checker, object, link, diagnostics, full]
        default: smoke
      sanitizer:
        description: Same pinned tools and fatal detector policy as the full hosted lanes
        type: choice
        options: [none, address, thread, memory]
        default: none
      files:
        description: Newline-separated changed paths for affected (empty expands to full coverage)
        type: string
        default: ''

permissions:
  contents: read

# Each requested reproduction is independent, including requests for the same branch. No hardware or qualification
# context is created. The selected branch's exact github.sha is the revision every reusable workflow checks out.
concurrency:
  group: hosted-reproduction-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare-hosted-tools:
    uses: ./.github/workflows/prepare-hosted-tools.yml
  reproduce:
    needs: prepare-hosted-tools
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/hosted-correctness.yml
    with:
      host_arch: x86-64
      sanitizer: ${{ inputs.sanitizer }}
      optimization: 3
      shards: ${{ inputs.profile == 'full' && 4 || 1 }}
      hosted-tools: ${{ needs.prepare-hosted-tools.outputs.artifact-name }}
      performance: 'false'
      feedback-profile: ${{ inputs.profile }}
      feedback-files: ${{ inputs.files }}
