name: Issue 775 hosted correctness
on:
  push:
    branches: [codex/775-baseline-vectors]
    paths: [.github/workflows/issue-775-hosted.yml]
permissions:
  contents: read
jobs:
  vectors:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: 0
      BUSTER_ORACLE_CACHE: check
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - run: bash tools/ci/setup-hosted.sh
      - name: Build and check target legality and execution
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/issue775"
          ./build.sh > "$RUNNER_TEMP/issue775/build.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/issue775/build.log"
          if [ "$result" -eq 0 ]; then
            ./build/compiler test-tier0 > "$RUNNER_TEMP/issue775/tier0.log" 2>&1
            a=$?
            ./build/compiler test-checker --program-vectors > "$RUNNER_TEMP/issue775/vectors.log" 2>&1
            b=$?
            ./build/compiler test-x86-target > "$RUNNER_TEMP/issue775/target.log" 2>&1
            c=$?
            cat "$RUNNER_TEMP/issue775/tier0.log" "$RUNNER_TEMP/issue775/vectors.log" "$RUNNER_TEMP/issue775/target.log"
            result=$((a | b | c))
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/issue775/commit.txt"
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue775-hosted
          path: ${{ runner.temp }}/issue775
          retention-days: 7
