name: PR 767 external closure repin

on:
  push:
    branches:
      - claude/clever-cori-qh0b15

permissions:
  contents: write

concurrency:
  group: pr-767-external-closure-repin
  cancel-in-progress: false

jobs:
  repin:
    if: github.repository == 'buster14a/buster'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Repin the reviewed repository-owned closure
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          descriptor_path = Path('docs/native-retirement-dependencies-v1.json')
          descriptor = json.loads(descriptor_path.read_text(encoding='utf-8'))
          projects = descriptor.get('projects')
          if not isinstance(projects, list):
              raise SystemExit('refusing repin: descriptor has no projects list')

          expected_drift = {
              'src/buster/lib/compiler/ir/ir.h',
              'src/buster/lib/compiler/ir/ir_construction.h',
              'src/buster/lib/compiler/ir/ir_promote.c',
          }
          changed = set()
          by_source = {}
          for record in projects:
              source = record.get('source')
              if not isinstance(source, str) or source in by_source:
                  raise SystemExit(f'refusing repin: invalid or duplicate project source {source!r}')
              by_source[source] = record
              if not source.startswith('src/'):
                  continue
              path = Path(source)
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f'refusing repin: project source is not a regular repository file: {source}')
              data = path.read_bytes()
              size = len(data)
              digest = hashlib.sha256(data).hexdigest()
              if record.get('bytes') != size or record.get('sha256') != digest:
                  changed.add(source)
                  record['bytes'] = size
                  record['sha256'] = digest
                  print(f'repinned {source}: bytes={size} sha256={digest}')

          if changed != expected_drift:
              raise SystemExit(f'refusing repin: expected drift {sorted(expected_drift)}, found {sorted(changed)}')

          append_source = 'src/buster/lib/compiler/ir/ir_append.h'
          if append_source in by_source:
              raise SystemExit('refusing repin: ir_append.h is already present unexpectedly')
          append_path = Path(append_source)
          if not append_path.is_file() or append_path.is_symlink():
              raise SystemExit('refusing repin: merged main does not contain ir_append.h')
          append_data = append_path.read_bytes()
          append_record = {
              'source': append_source,
              'provenance': f'repo:{append_source}',
              'destination': 'dependencies/project-include/buster/lib/compiler/ir/ir_append.h',
              'bytes': len(append_data),
              'sha256': hashlib.sha256(append_data).hexdigest(),
          }
          projects.append(append_record)
          projects.sort(key=lambda record: record['source'])
          print(f"added {append_source}: bytes={append_record['bytes']} sha256={append_record['sha256']}")

          descriptor_path.write_text(json.dumps(descriptor, indent=2) + '\n', encoding='utf-8')
          helper = Path('.github/workflows/pr767-external-closure-repin.yml')
          if not helper.is_file():
              raise SystemExit('refusing cleanup: missing one-shot workflow')
          helper.unlink()
          PY
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Repin native retirement project closure after main merge'
          test -z "$(git status --porcelain)"
      - name: Validate the repaired descriptor and contract
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python3 tools/native_retirement_materializer.py self-test
          python3 tools/native_retirement_materializer_test.py -v
          python3 tools/native_retirement_external_test.py -v
          python3 tools/native_retirement_contract.py self-test
          python3 tools/native_retirement_contract_test.py -v
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          descriptor = json.loads(Path('docs/native-retirement-dependencies-v1.json').read_text(encoding='utf-8'))
          checked = 0
          for record in descriptor['projects']:
              if not record['source'].startswith('src/'):
                  continue
              data = Path(record['source']).read_bytes()
              assert len(data) == record['bytes'], record['source']
              assert hashlib.sha256(data).hexdigest() == record['sha256'], record['source']
              checked += 1
          print(f'validated repository project closure: {checked} files')
          PY
          git show --check --format=fuller --stat HEAD
          test -z "$(git status --porcelain)"
      - name: Push validated repair without overwriting concurrent work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "branch advanced during validation: expected $GITHUB_SHA, found $remote_head" >&2
            exit 1
          fi
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
