name: A04 exact-SHA self-host evidence

# Temporary validation transport, not included in the implementation PR.
on:
  push:
    branches: [astra/20260909-a04-transport]
    paths: ['.github/workflows/a04-self-host.yml']
permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      BUSTER_TEST_JOBS: '1'
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      SOURCE_SHA: f41866e0659ca5198314bbadfe2f1fd7aa780f9d
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: f41866e0659ca5198314bbadfe2f1fd7aa780f9d
          persist-credentials: false
      - name: Bootstrap native build driver
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > source-sha.txt
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
      - name: Test the bootstrap checker
        run: '"$RUNNER_TEMP/buster-build" self_host_audit_self_test'
      - name: Configure production compiler
        run: '"$RUNNER_TEMP/buster-build" generate --cc clang --ci --linker DEFAULT'
      - name: Preserve ordinary bootstrap and alternate-backend gates
        run: '"$RUNNER_TEMP/buster-build" test_self_host --config Release'
      - name: Verify each generation and repeat
        run: '"$RUNNER_TEMP/buster-build" test_self_host_audit --config Release'
      - name: Run compiler regressions
        run: '"$RUNNER_TEMP/buster-build" build --config Release -t test_all'
      - name: Retain stage evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a04-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source-sha.txt
            build/self-host-audit/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
