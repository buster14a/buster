name: Repair PR 796 CI

on:
  push:
    branches:
      - fix/786-native-retirement-closure

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Repair CodeView capacity and parser coverage
        run: |
          python3 -c "import base64; exec(compile(base64.b64decode(''), '<repair>', 'exec'))"
          git diff --check
          git diff -- src/buster/lib/compiler/codeview/codeview.c src/buster/tests/compiler/codegen/codegen_test.c

      - name: Commit the repair
        run: |
          git rm .github/workflows/ci-repair-pr796.yml
          git add src/buster/lib/compiler/codeview/codeview.c src/buster/tests/compiler/codegen/codegen_test.c
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(codeview): count shared-scope relocations"
          git push origin "HEAD:${GITHUB_REF_NAME}"
