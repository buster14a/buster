name: PR 821 closure rebind

on:
  push:
    branches:
      - fix/84-transactional-hermetic-spawn

permissions:
  contents: write

jobs:
  rebind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/84-transactional-hermetic-spawn
          fetch-depth: 0

      - name: Rebind changed project closure sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          manifest_path = Path("docs/native-retirement-dependencies-v1.json")
          original = manifest_path.read_text()
          data = json.loads(original)
          canonical = json.dumps(data, indent=2) + "\n"
          if original != canonical:
              raise SystemExit("dependency manifest is not in canonical two-space JSON form")

          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
          ).splitlines())
          rebound = []

          def visit(value):
              if isinstance(value, dict):
                  source = value.get("source")
                  if (
                      isinstance(source, str)
                      and source in changed
                      and "bytes" in value
                      and "sha256" in value
                  ):
                      path = Path(source)
                      if not path.is_file():
                          raise SystemExit(f"changed bound source is missing: {source}")
                      payload = path.read_bytes()
                      size = len(payload)
                      digest = hashlib.sha256(payload).hexdigest()
                      if value["bytes"] != size or value["sha256"] != digest:
                          old_size = value["bytes"]
                          old_digest = value["sha256"]
                          value["bytes"] = size
                          value["sha256"] = digest
                          rebound.append((source, old_size, size, old_digest, digest))
                  for child in value.values():
                      visit(child)
              elif isinstance(value, list):
                  for child in value:
                      visit(child)

          visit(data)
          if not rebound:
              raise SystemExit("no changed project closure identities required rebinding")
          manifest_path.write_text(json.dumps(data, indent=2) + "\n")
          for source, old_size, size, old_digest, digest in rebound:
              print(f"PR821_REBOUND {source} bytes={old_size}->{size} sha256={old_digest}->{digest}")
          PY
          python3 -m json.tool docs/native-retirement-dependencies-v1.json >/dev/null
          git diff --check
          git diff -- docs/native-retirement-dependencies-v1.json

      - name: Commit reviewed closure identity
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr821-rebind.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/native-retirement-dependencies-v1.json .github/workflows/pr821-rebind.yml
          git commit -m "ci: rebind transactional spawn closure identity"
          git push origin HEAD:fix/84-transactional-hermetic-spawn
