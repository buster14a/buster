name: Self-host fixed point

# As with the platform matrix, pushes are sufficient for same-repository PRs.
# Iteration, process execution and comparisons belong to the native build driver.
on: [push]

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Linux x86-64 bootstrap evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bootstrap native build driver
        run: clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
      - name: Test the bootstrap checker
        run: '"$RUNNER_TEMP/buster-build" self_host_audit_self_test'
      - name: Configure production compiler
        run: '"$RUNNER_TEMP/buster-build" generate --cc clang --ci --linker DEFAULT'
      - name: Preserve ordinary bootstrap and alternate-backend gates
        run: '"$RUNNER_TEMP/buster-build" test_self_host --config Release'
      - name: Verify each generation and repeat
        run: '"$RUNNER_TEMP/buster-build" test_self_host_audit --config Release'
      - name: Run compiler regressions
        run: '"$RUNNER_TEMP/buster-build" build --config Release -t test_all'
      - name: Retain stage evidence even on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: bootstrap-evidence-${{ github.sha }}
          path: build/self-host-audit/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
