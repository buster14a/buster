name: Self-host fixed point

# Match the platform matrix: PRs (including forks) validate the merge revision,
# without a second expensive feature-push run. Build policy stays in build.c.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['**']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Supersede only the same PR/merge-group. Unique main/tag/manual groups also
# prevent a newer pending run from displacing an earlier pending measurement.
concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'merge_group' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

jobs:
  bootstrap:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Linux x86-64 bootstrap evidence
    # Match the maintained Linux CI image: older Clang can reject native
    # AVX10 feature detection on newer hosted CPUs before self-hosting starts.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bootstrap native build driver
        run: |
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
      - name: Verify the TrueType dependency boundary
        run: >-
          python3 tests/truetype_dependency_test.py
          --driver "$RUNNER_TEMP/buster-build"
          --output-directory "$RUNNER_TEMP/truetype-dependency"
      - name: Test the bootstrap checker
        run: '"$RUNNER_TEMP/buster-build" self_host_audit_self_test'
      - name: Configure production compiler
        run: '"$RUNNER_TEMP/buster-build" generate --cc clang --ci --linker DEFAULT'
      - name: Preserve ordinary bootstrap and alternate-backend gates
        id: ordinary_bootstrap
        run: '"$RUNNER_TEMP/buster-build" test_self_host --config Release'
      - name: Check out pinned LLVM 18 resource headers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: llvm/llvm-project
          ref: c13b7485b87909fcf739f62cfa382b55407433c0
          path: .ci-llvm18
          sparse-checkout: clang/lib/Headers
          persist-credentials: false
      - name: Record issue 671 baseline and independent controls
        env:
          BUSTER_TEST_JOBS: '1'
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/671-baseline"
          mkdir -p "$evidence"
          git rev-parse HEAD HEAD^{tree}
          git -C .ci-llvm18 rev-parse HEAD HEAD^{tree}
          clang --version
          sha256sum "$(command -v clang)" build/Release/ide .ci-llvm18/clang/lib/Headers/avx512bf16intrin.h
          printf '%s\n' 'static __inline__ float f(__bf16 a) { return (float)a; }' > "$evidence/scalar.c"
          printf '%s\n' 'typedef __bf16 lanes __attribute__((vector_size(64), aligned(64)));' 'static __inline__ float f(lanes a) { return (float)a[0]; }' > "$evidence/vector.c"
          printf '%s\n' '_Float16 scalar = 1.5;' > "$evidence/half-global.c"
          printf '%s\n' '#include <immintrin.h>' 'int header_control(void) { return 0; }' > "$evidence/header.c"
          printf '%s\n' '__bf16 values[] = {0.0,-0.0,1.0,-1.0,0x1p-133,0x1p-134,0x1.0000000000001p-134,0x1.fcp-127,0x1.fep-127,0x1p-126,0x1.fep127,0x1.fefffffffffffp127,0x1.ffp127,0x1.01p0,0x1.03p0,0x1.0100000000001p0};' '__bf16 integers[] = {((unsigned __int128)257 << 100), (((unsigned __int128)257 << 100) + 1)};' '__bf16 wide[] = {0x1.0100000000000002p0L, 0x1.00fffffffffffffep0L};' > "$evidence/constants.c"
          printf '%s\n' '__bf16 a; _Float16 b;' 'char mixed[sizeof(a+b)];' '__bf16 cast_bf = (__bf16)(_Float16)1.5;' '_Float16 cast_half = (_Float16)(__bf16)1.5;' > "$evidence/mixed.c"
          printf '%s\n' '__bf16 _Complex value;' > "$evidence/complex.c"
          printf '%s\n' 'static inline float f(float a) { return __builtin_ia32_cvtsbf162ss_32(a, a); }' > "$evidence/unused-builtin.c"
          for source in scalar vector half-global header; do
            for form in direct memory; do
              options=()
              if [[ "$form" == memory ]]; then options+=(-fno-frontend-ssa); fi
              set +e
              build/Release/ide cc -target x86_64-unknown-linux-gnu "${options[@]}" -I.ci-llvm18/clang/lib/Headers -D__SCHAR_MAX__=127 -D__SHRT_MAX__=32767 -D__INT_MAX__=2147483647 -D__LONG_MAX__=9223372036854775807L -D__LONG_LONG_MAX__=9223372036854775807LL -c "$evidence/$source.c" -o "$evidence/$source-$form.o" > "$evidence/$source-$form.log" 2>&1
              status=$?
              set -e
              printf 'BASELINE source=%s form=%s exit=%s\n' "$source" "$form" "$status"
              cat "$evidence/$source-$form.log"
            done
          done
          for source in scalar vector constants mixed complex unused-builtin; do
            for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-pc-windows-msvc x86_64-apple-macos aarch64-apple-macos; do
              set +e
              clang --target="$target" -S -emit-llvm -Xclang -fbfloat16-excess-precision=none "$evidence/$source.c" -o "$evidence/$source-$target.ll" > "$evidence/$source-$target.log" 2>&1
              status=$?
              set -e
              printf 'ORACLE source=%s target=%s exit=%s\n' "$source" "$target" "$status"
              cat "$evidence/$source-$target.log"
            done
          done
          git -C .ci-llvm18 diff --exit-code
      - name: Retain issue 671 diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-671-baseline-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/671-baseline/
          retention-days: 7
          if-no-files-found: error
      - name: Verify each generation and repeat
        run: '"$RUNNER_TEMP/buster-build" test_self_host_audit --config Release'
      - name: Run compiler regressions
        if: ${{ !cancelled() && steps.ordinary_bootstrap.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p build/self-host-audit
          {
            "$RUNNER_TEMP/buster-build" build --config Release -t test_all
          } 2>&1 | tee build/self-host-audit/truetype-tests.log
          grep -F 'module=truetype_tests ' build/self-host-audit/truetype-tests.log
      - name: Check the bootstrap probe against independent compiler oracles
        # A failed audit must not suppress its independent semantic evidence.
        # These steps remain required failures; no continue-on-error is used.
        if: ${{ !cancelled() && steps.ordinary_bootstrap.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/buster-build" test_differential --self-test
          "$RUNNER_TEMP/buster-build" test_differential --ide build/Release/ide --cc clang --source tests/self_host_bootstrap_probe.c --sanitize-oracle --out build/self-host-audit/probe-oracle
      - name: Retain stage evidence even on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: bootstrap-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/self-host-audit/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
