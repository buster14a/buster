name: Windows environment case controls

# Temporary branch-scoped evidence for #2014. Normal platform correctness and
# self-host gates remain in Buster CI; this compares native shell launch paths.
on:
  pull_request:
    paths:
      - '.github/workflows/windows-environment-case.yml'
      - 'src/buster/lib/os.c'
      - 'src/buster/lib/os.h'
      - 'src/buster/tests/os_test.c'

permissions:
  contents: read

concurrency:
  group: windows-environment-case-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  controls:
    if: >-
      ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' &&
          github.head_ref == 'codex/2014-windows-environment-case' }}
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      BUSTER_TEST_JOBS: '2'
      BUSTER_OS_ENVIRONMENT_EVIDENCE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install stable LLVM using the normal CI policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/ci_llvm.py --target x86_64-windows --work-directory "$RUNNER_TEMP/llvm" \
            --github-path "$GITHUB_PATH" --github-env "$GITHUB_ENV"

      - name: Build one trusted Release test executable
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\ci_vs_dev_shell.ps1 -Arch amd64 `
            -Component Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -LlvmBin $env:BUSTER_CI_LLVM_BIN -Require cl, clang -ClangArch x86_64
          $MsvcLink = (Get-Command link.exe -ErrorAction Stop).Source
          if (-not $MsvcLink.StartsWith($env:VCToolsInstallDir, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Expected the VS toolchain linker, received $MsvcLink"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "BUSTER_ENVIRONMENT_CASE_MSVC_LINK=$MsvcLink"
          # Retain SDK/CRT/tool selection for both later native shell controls.
          # Export only the variables needed by tools; never print their values.
          foreach ($Name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'WindowsSdkDir', 'WindowsSDKVersion', 'VCToolsInstallDir', 'VSCMD_ARG_TGT_ARCH')) {
            $Value = [Environment]::GetEnvironmentVariable($Name, 'Process')
            if ($null -ne $Value) {
              $Delimiter = "BUSTER_ENVIRONMENT_CASE_$Name"
              Add-Content -LiteralPath $env:GITHUB_ENV -Value "$Name<<$Delimiter"
              Add-Content -LiteralPath $env:GITHUB_ENV -Value $Value
              Add-Content -LiteralPath $env:GITHUB_ENV -Value $Delimiter
            }
          }
          $Logs = Join-Path $env:RUNNER_TEMP 'windows-environment-case'
          New-Item -ItemType Directory -Force -Path $Logs | Out-Null
          git rev-parse HEAD | Set-Content (Join-Path $Logs 'source-sha.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion RUNNER_ARCH=$env:RUNNER_ARCH" | Set-Content (Join-Path $Logs 'runner.txt')
          $Driver = Join-Path $env:RUNNER_TEMP 'buster-environment-build.exe'
          & clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable `
            -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o $Driver
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Driver generate --ci --cc clang --config Release --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Driver build --config Release -t ide
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash -Algorithm SHA256 'build/Release/ide.exe').Hash.ToLowerInvariant() | Set-Content (Join-Path $Logs 'ide-sha256.txt')

      - name: Native PowerShell CRT and import controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Logs = Join-Path $env:RUNNER_TEMP 'windows-environment-case'
          foreach ($Tool in @('clang', 'cl', 'link.exe', 'lld-link.exe')) {
            where.exe $Tool | Tee-Object -FilePath (Join-Path $Logs "powershell-$Tool.txt")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # Log only the name spelling, never environment values.
          Get-ChildItem Env: | Where-Object { $_.Name -in @('SystemRoot', 'PATH', 'INCLUDE', 'LIB', 'LIBPATH') } |
            Select-Object -ExpandProperty Name | Set-Content (Join-Path $Logs 'powershell-environment-names.txt')
          cmd /d /s /c 'build\Release\ide.exe test --module=os_tests --verbose=1 --ci=1 2>&1' |
            Tee-Object -FilePath (Join-Path $Logs 'powershell-tests.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($Allocator in @('none', 'mir-stack', 'fast', 'quality')) {
            $Output = Join-Path $Logs "powershell-destructor-$Allocator.exe"
            & .\build\Release\ide.exe cc -target x86_64-pc-windows-msvc "-fregister-allocator=$Allocator" -o $Output tests/basic_c_destructor_exit.c
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $Output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $Source = Join-Path $Logs 'powershell-import-control.c'
          $Object = Join-Path $Logs 'powershell-import-control.obj'
          $Library = Join-Path $Logs 'powershell-import-control.dll'
          'int environment_case_probe = 7;' | Set-Content -Encoding ascii $Source
          & .\build\Release\ide.exe cc -target x86_64-pc-windows-msvc -c -o $Object $Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:BUSTER_ENVIRONMENT_CASE_MSVC_LINK /nologo /dll /noentry /nodefaultlib /incremental:no '/export:environment_case_probe,DATA' "/out:$Library" $Object
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'CRT_IMPORT_CONTROL shell=powershell allocators=4 exit=0' | Set-Content (Join-Path $Logs 'powershell-crt-result.txt')

      - name: Native Git Bash CRT and import controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/windows-environment-case"
          for tool in clang cl link.exe lld-link.exe; do
            command -v "$tool" | tee "$logs/bash-$tool.txt"
            where.exe "$tool" | tee -a "$logs/bash-$tool.txt"
          done
          # A native Python process observes the environment passed by MSYS.
          # Retain only allowlisted names, with their actual captured spelling.
          python -c 'import os; print("\n".join(sorted(k for k in os.environ if k.casefold() in {"systemroot", "path", "include", "lib", "libpath"})))' \
            > "$logs/bash-environment-names.txt"
          build/Release/ide.exe test --module=os_tests --verbose=1 --ci=1 2>&1 | tee "$logs/bash-tests.log"
          for allocator in none mir-stack fast quality; do
            output="$logs/bash-destructor-$allocator.exe"
            build/Release/ide.exe cc -target x86_64-pc-windows-msvc "-fregister-allocator=$allocator" -o "$output" tests/basic_c_destructor_exit.c
            "$output"
          done
          printf '%s\n' 'int environment_case_probe = 7;' > "$logs/bash-import-control.c"
          build/Release/ide.exe cc -target x86_64-pc-windows-msvc -c -o "$logs/bash-import-control.obj" "$logs/bash-import-control.c"
          object=$(cygpath -w "$logs/bash-import-control.obj")
          library=$(cygpath -w "$logs/bash-import-control.dll")
          msvc_link=$(cygpath -u "$BUSTER_ENVIRONMENT_CASE_MSVC_LINK")
          printf '%s\n' "$msvc_link" > "$logs/bash-selected-msvc-link.txt"
          MSYS2_ARG_CONV_EXCL='*' "$msvc_link" /nologo /dll /noentry /nodefaultlib /incremental:no \
            /export:environment_case_probe,DATA "/out:$library" "$object"
          printf '%s\n' 'CRT_IMPORT_CONTROL shell=bash allocators=4 exit=0' > "$logs/bash-crt-result.txt"

      - name: Retain exact-source diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-environment-case-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-environment-case/*.txt
            ${{ runner.temp }}/windows-environment-case/*.log
          if-no-files-found: warn
          retention-days: 14
