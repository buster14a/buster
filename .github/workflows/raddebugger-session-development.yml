name: Temporary Clang Win64 SEH ABI baseline
on:
  push:
    branches: [codex/2279-debugger-qualification]
permissions:
  contents: read
concurrency:
  group: raddebugger-seh-baseline-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  windows-seh-clang-x64-baseline:
    name: Clang x64 SEH ABI baseline (diagnostic only)
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: windows-2025
      - name: Check out exact Buster source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record actual Buster checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Install pinned Clang and LLVM inspection tools
        shell: bash
        env:
          BUSTER_CI_LLVM_VERSION: 23.1.3
          BUSTER_CI_PYTHON: python
          GH_TOKEN: ${{ github.token }}
          LLVM_TARGET: x86_64-windows
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/raddebugger-seh-clang-baseline"
          python tools/ci_llvm.py --target "$LLVM_TARGET" --work-directory "$RUNNER_TEMP/llvm" \
            --github-path "$GITHUB_PATH" --github-env "$GITHUB_ENV" \
            2>&1 | tee "$RUNNER_TEMP/raddebugger-seh-clang-baseline/llvm-install.log"
      - name: Compile and inspect both Clang SEH variants before runtime
        id: compile
        shell: pwsh
        env:
          VS_ARCH: amd64
          VS_COMPONENT: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          CLANG_ARCH: x86_64
        run: |
          $ErrorActionPreference = 'Stop'
          $Logs = Join-Path $env:RUNNER_TEMP 'raddebugger-seh-clang-baseline'
          New-Item -ItemType Directory -Force -Path $Logs | Out-Null
          $Sources = @(
            (Join-Path $env:GITHUB_WORKSPACE 'tools\raddebugger_seh_clang_baseline.c')
          )
          foreach ($Source in $Sources) { Copy-Item $Source $Logs }

          & .\tools\ci_vs_dev_shell.ps1 -Arch $env:VS_ARCH -Component $env:VS_COMPONENT -LlvmBin $env:BUSTER_CI_LLVM_BIN -GithubEnv $env:GITHUB_ENV -Require cl, clang, llvm-readobj, llvm-objdump -ClangArch $env:CLANG_ARCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & clang --version 2>&1 | Tee-Object -FilePath (Join-Path $Logs 'clang-version.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Common = @('-target','x86_64-pc-windows-msvc','-std=gnu11','-fms-extensions','-fverbose-asm','-g','-gcodeview','-O2','-Wall','-Wextra','-Werror','-D_CRT_SECURE_NO_WARNINGS')
          foreach ($Variant in @('default','async')) {
            $Flags = @($Common)
            if ($Variant -eq 'async') { $Flags += '-fasync-exceptions' }
            foreach ($Source in $Sources) {
              $Stem = [System.IO.Path]::GetFileNameWithoutExtension($Source)
              $Assembly = Join-Path $Logs "$Variant-$Stem.s"
              $Object = Join-Path $Logs "$Variant-$Stem.obj"
              & clang @Flags -S $Source -o $Assembly 2>&1 | Tee-Object -FilePath (Join-Path $Logs "$Variant-$Stem-assembly-build.log")
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & clang @Flags -c $Source -o $Object 2>&1 | Tee-Object -FilePath (Join-Path $Logs "$Variant-$Stem-object-build.log")
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

          foreach ($Variant in @('default','async')) {
            foreach ($Source in $Sources) {
              $Stem = [System.IO.Path]::GetFileNameWithoutExtension($Source)
              $Object = Join-Path $Logs "$Variant-$Stem.obj"
              $ReadPath = Join-Path $Logs "$Variant-$Stem.readobj.txt"
              & llvm-readobj --unwind --symbols --relocations $Object 2>&1 | Tee-Object -FilePath $ReadPath
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $Assembly = Join-Path $Logs "$Variant-$Stem.s"
              Select-String -Path $Assembly -Pattern '\.seh_proc|\.seh_handler|\.seh_handlerdata|CatchAll|LabelStart|LabelEnd|\.long\s+1' -Context 1,1 |
                Out-String -Width 240 | Tee-Object -FilePath (Join-Path $Logs "$Variant-$Stem-scope-boundaries.txt")
              & llvm-objdump -d $Object 2>&1 | Tee-Object -FilePath (Join-Path $Logs "$Variant-$Stem-disassembly-postcall-pcs.txt")
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & llvm-objdump -s -j .xdata $Object 2>&1 | Tee-Object -FilePath (Join-Path $Logs "$Variant-$Stem-xdata-scope-bytes.txt")
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

          $BaseReadObj = Join-Path $Logs 'default-raddebugger_seh_clang_baseline.readobj.txt'
          $ReadObj = Get-Content -Raw $BaseReadObj
          $FlagBlocks = [regex]::Matches($ReadObj, '(?is)Flags\s*(?:\[([^\]]{0,400})\]|:\s*([^\r\n]{0,160}))')
          $HasBothFlags = $false
          foreach ($FlagMatch in $FlagBlocks) {
            $FlagText = $FlagMatch.Groups[1].Value + $FlagMatch.Groups[2].Value
            if ($FlagText -match '(?i)\(0x0?3\)' -or
                ($FlagText -match '(?i)(ExceptionHandler|EHANDLER)' -and $FlagText -match '(?i)(TerminateHandler|UHANDLER)')) {
              $HasBothFlags = $true
            }
          }
          if (-not $HasBothFlags) { throw 'Default x64 unwind output did not show both exception and termination handler flags in one flags record.' }
          if ($ReadObj -notmatch '(?im)ADDR32NB.*__C_specific_handler|__C_specific_handler.*ADDR32NB') {
            throw 'Default object lacks the x64 personality relocation evidence.'
          }
          $AsmPath = Join-Path $Logs 'default-raddebugger_seh_clang_baseline.s'
          $AssemblyText = Get-Content -Raw $AsmPath
          if ($AssemblyText -notmatch '(?s)\.seh_handlerdata.*?\.long\s+(?:1|0x1)\b[^\r\n]*CatchAll') {
            throw 'Default assembly lacks a catch-all scope table record with literal filter value 1.'
          }

          foreach ($Variant in @('default','async')) {
            $Objects = @()
            foreach ($Source in $Sources) {
              $Stem = [System.IO.Path]::GetFileNameWithoutExtension($Source)
              $Objects += Join-Path $Logs "$Variant-$Stem.obj"
            }
            $Exe = Join-Path $Logs "$Variant-baseline.exe"
            & clang -target x86_64-pc-windows-msvc -fuse-ld=lld $Objects '-Wl,/DEBUG' -o $Exe 2>&1 |
              Tee-Object -FilePath (Join-Path $Logs "$Variant-link.log")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path (Join-Path $Logs "$Variant-baseline.pdb"))) {
              throw "Clang did not produce the $Variant debug PDB."
            }
          }
      - name: Run default Clang callback and unwind controls (no async fault-load claim)
        if: ${{ always() && steps.compile.outcome == 'success' }}
        shell: pwsh
        run: |
          $Logs = Join-Path $env:RUNNER_TEMP 'raddebugger-seh-clang-baseline'
          $Exe = Join-Path $Logs 'default-baseline.exe'
          & $Exe default 2>&1 | Tee-Object -FilePath (Join-Path $Logs 'default-runtime.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content -Raw (Join-Path $Logs 'default-runtime.log')) -notmatch 'RADDBG_SEH_RESULT checks=10 failures=0') {
            throw 'Default Clang callback controls did not pass all 10 expected checks.'
          }
      - name: Run explicit Clang async-exceptions fault-load control
        if: ${{ always() && steps.compile.outcome == 'success' }}
        shell: pwsh
        run: |
          $Logs = Join-Path $env:RUNNER_TEMP 'raddebugger-seh-clang-baseline'
          $Exe = Join-Path $Logs 'async-baseline.exe'
          & $Exe async 2>&1 | Tee-Object -FilePath (Join-Path $Logs 'async-runtime.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content -Raw (Join-Path $Logs 'async-runtime.log')) -notmatch 'RADDBG_SEH_RESULT checks=12 failures=0') {
            throw 'Explicit async-exceptions Clang controls did not pass all 12 expected checks.'
          }
      - name: Retain machine specifications
        if: always()
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: retain
          retention-directory: ${{ runner.temp }}/raddebugger-seh-clang-baseline
      - name: Retain baseline sources and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: raddebugger-seh-clang-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raddebugger-seh-clang-baseline
          if-no-files-found: warn
          retention-days: 14
