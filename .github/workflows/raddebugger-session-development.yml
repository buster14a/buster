name: RAD Debugger session development

# Temporary hosted development checkpoint for #2279; removed before integration.
# The routine RAD compatibility workflow remains main-only.
on:
  push:
    branches: [codex/2279-debugger-qualification]
permissions:
  contents: read
concurrency:
  group: raddebugger-development-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  linux-x86-64:
    # Windows-only repair checkpoints skip the unchanged Linux platform.
    if: "!startsWith(github.event.head_commit.message, 'test: Windows-only ')"
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: EpicGames/raddebugger
          ref: f6b4a38134652886239b91f940cd7a67fedf689d
          path: external/raddebugger
          persist-credentials: false
      - name: Install upstream platform libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfreetype6-dev libx11-dev libxext-dev libxfixes-dev libxrandr-dev libgl1-mesa-dev libegl1-mesa-dev xvfb xauth libgl1-mesa-dri
      - name: Verify generated intrinsic metadata
        run: python3 tools/generate_c_vendor_builtins.py --check
      - name: Hosted bootstrap
        run: |
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/raddebugger-driver"
      - name: Retain generated source-size acknowledgement for review
        run: |
          "$RUNNER_TEMP/raddebugger-driver" source_size --write-baseline
          cat docs/source-size-baseline.txt
      - name: Build and check the independent session controller
        run: |
          clang -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror tools/raddebugger_session_test.c -lX11 -o "$RUNNER_TEMP/raddebugger-session-controller"
          "$RUNNER_TEMP/raddebugger-session-controller" --self-test
      - name: Configure compiler
        run: |
          "$RUNNER_TEMP/raddebugger-driver" generate --ci --cc clang --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF -DBUSTER_BENCH_ALLOCATIONS=ON
      - name: Build trusted compiler
        id: compiler
        run: |
          "$RUNNER_TEMP/raddebugger-driver" build --config Release -t ide
      - name: Compiler tests
        run: |
          set -o pipefail
          "$RUNNER_TEMP/raddebugger-driver" build --config Release -t test_all 2>&1 | tee build/raddebugger-tests.log
      - name: Candidate self-host fixed point
        if: always() && steps.compiler.outcome == 'success'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/raddebugger-driver" test_self_host --config Release 2>&1 | tee build/raddebugger-self-host.log
      - name: Pristine input negative controls
        if: always() && steps.compiler.outcome == 'success'
        run: |
          "$RUNNER_TEMP/raddebugger-driver" test_raddebugger --self-test
      - name: Qualify pristine graphical RAD Debugger and independent reference
        if: always() && steps.compiler.outcome == 'success'
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x800x24" "$RUNNER_TEMP/raddebugger-driver" test_raddebugger --config Release --debugger "$GITHUB_WORKSPACE/external/raddebugger" 2>&1 | tee build/raddebugger-harness.log
      - name: Retain exact-source diagnostics including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raddebugger-session-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/raddebugger-*
            docs/source-size-baseline.txt
          if-no-files-found: warn
          retention-days: 14
  # Job fragment for a temporary qualification workflow or the existing CI jobs map.
  # Keep the established RAD Debugger compatibility workflow's main-only trigger unchanged.
  raddebugger-windows-x64:
    name: RAD Debugger Windows x86-64
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out Buster
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out pinned RAD Debugger
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: EpicGames/raddebugger
          ref: f6b4a38134652886239b91f940cd7a67fedf689d
          path: external/raddebugger
          lfs: true
          persist-credentials: false
      - name: Install pinned LLVM
        shell: bash
        env:
          BUSTER_CI_PYTHON: python
          GH_TOKEN: ${{ github.token }}
          LLVM_TARGET: x86_64-windows
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/raddebugger-windows-job"
          python tools/ci_llvm.py --target "$LLVM_TARGET" --work-directory "$RUNNER_TEMP/llvm" \
            --github-path "$GITHUB_PATH" --github-env "$GITHUB_ENV" \
            2>&1 | tee "$RUNNER_TEMP/raddebugger-windows-job/llvm.log"
      - name: Bootstrap Buster and qualify RAD Debugger
        shell: pwsh
        env:
          VS_ARCH: amd64
          VS_COMPONENT: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          CLANG_ARCH: x86_64
        run: |
          $ErrorActionPreference = 'Stop'
          $Logs = Join-Path $env:RUNNER_TEMP 'raddebugger-windows-job'
          New-Item -ItemType Directory -Force -Path $Logs | Out-Null
          & .\tools\ci_vs_dev_shell.ps1 -Arch $env:VS_ARCH -Component $env:VS_COMPONENT -LlvmBin $env:BUSTER_CI_LLVM_BIN -Require cl, clang, llvm-rc, llvm-ml, llvm-lib, llvm-readobj -ClangArch $env:CLANG_ARCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # generate recreates build/, so keep the native driver and setup logs in RUNNER_TEMP.
          $Driver = Join-Path $env:RUNNER_TEMP 'buster-build.exe'
          $Bootstrap = 'clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o "' + $Driver + '" 2>&1'
          cmd /d /s /c $Bootstrap | Tee-Object -FilePath (Join-Path $Logs 'bootstrap.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Compile and self-test the trusted controller before the slow generate/build steps.
          $Controller = Join-Path $env:RUNNER_TEMP 'raddebugger-session-test.exe'
          $ControllerSource = Join-Path $env:GITHUB_WORKSPACE 'tools\raddebugger_session_test.c'
          $ControllerBuild = 'clang -target x86_64-pc-windows-msvc -fuse-ld=lld -std=c11 -Wall -Wextra -Werror -D_CRT_SECURE_NO_WARNINGS "' + $ControllerSource + '" -lws2_32 -liphlpapi -luser32 -o "' + $Controller + '" 2>&1'
          cmd /d /s /c $ControllerBuild | Tee-Object -FilePath (Join-Path $Logs 'controller-build.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ControllerSelfTest = '"' + $Controller + '" --self-test 2>&1'
          cmd /d /s /c $ControllerSelfTest | Tee-Object -FilePath (Join-Path $Logs 'controller-self-test.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Generate = '"' + $Driver + '" generate --ci --cc clang --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF -DBUSTER_BENCH_ALLOCATIONS=ON 2>&1'
          cmd /d /s /c $Generate | Tee-Object -FilePath (Join-Path $Logs 'generate.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Build = '"' + $Driver + '" build --config Release -t ide 2>&1'
          cmd /d /s /c $Build | Tee-Object -FilePath (Join-Path $Logs 'build-ide.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $SelfTest = '"' + $Driver + '" test_raddebugger --self-test 2>&1'
          cmd /d /s /c $SelfTest | Tee-Object -FilePath (Join-Path $Logs 'self-test.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Source = Join-Path $env:GITHUB_WORKSPACE 'external\raddebugger'
          $Qualification = '"' + $Driver + '" test_raddebugger --config Release --debugger "' + $Source + '" 2>&1'
          cmd /d /s /c $Qualification | Tee-Object -FilePath (Join-Path $Logs 'qualification.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain Windows qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: raddebugger-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/raddebugger-windows-*
            ${{ runner.temp }}/raddebugger-windows-job
          if-no-files-found: warn
          retention-days: 14


  windows-compiler-candidate:
    name: Windows compiler candidate fixed point
    if: "!startsWith(github.event.head_commit.message, 'test: Windows-only ')"
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out Buster
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned LLVM
        shell: bash
        env:
          BUSTER_CI_PYTHON: python
          GH_TOKEN: ${{ github.token }}
          LLVM_TARGET: x86_64-windows
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/raddebugger-windows-candidate"
          python tools/ci_llvm.py --target "$LLVM_TARGET" --work-directory "$RUNNER_TEMP/llvm" \
            --github-path "$GITHUB_PATH" --github-env "$GITHUB_ENV" \
            2>&1 | tee "$RUNNER_TEMP/raddebugger-windows-candidate/llvm.log"
      - name: Preserve the candidate native self-host fixed point
        shell: pwsh
        env:
          VS_ARCH: amd64
          VS_COMPONENT: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          CLANG_ARCH: x86_64
        run: |
          $ErrorActionPreference = 'Stop'
          $Logs = Join-Path $env:RUNNER_TEMP 'raddebugger-windows-candidate'
          New-Item -ItemType Directory -Force -Path $Logs | Out-Null
          & .\tools\ci_vs_dev_shell.ps1 -Arch $env:VS_ARCH -Component $env:VS_COMPONENT -LlvmBin $env:BUSTER_CI_LLVM_BIN -Require cl, clang, llvm-rc, llvm-ml, llvm-lib, llvm-readobj -ClangArch $env:CLANG_ARCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # generate recreates build/, so keep the native driver and setup logs in RUNNER_TEMP.
          $Driver = Join-Path $env:RUNNER_TEMP 'buster-build.exe'
          $Bootstrap = 'clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o "' + $Driver + '" 2>&1'
          cmd /d /s /c $Bootstrap | Tee-Object -FilePath (Join-Path $Logs 'bootstrap.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Generate = '"' + $Driver + '" generate --ci --cc clang --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF -DBUSTER_BENCH_ALLOCATIONS=ON 2>&1'
          cmd /d /s /c $Generate | Tee-Object -FilePath (Join-Path $Logs 'generate.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Build = '"' + $Driver + '" build --config Release -t ide 2>&1'
          cmd /d /s /c $Build | Tee-Object -FilePath (Join-Path $Logs 'build-ide.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $FixedPoint = '"' + $Driver + '" test_self_host --config Release 2>&1'
          cmd /d /s /c $FixedPoint | Tee-Object -FilePath (Join-Path $Logs 'self-host.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain candidate Windows compiler evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: raddebugger-windows-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/self-host
            ${{ runner.temp }}/raddebugger-windows-candidate
          if-no-files-found: warn
          retention-days: 14

