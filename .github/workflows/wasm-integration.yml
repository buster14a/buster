name: Wasm integration
on:
  push:
    branches: [work/2026-09-06-integration-gates]
    paths: [.github/workflows/wasm-integration.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 70450cfe3737d9a1f934a4e0f630206614eacb7c
      - name: Apply authenticated regression patch
        id: publish
        shell: bash
        env:
          PATCH_DATA: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,base64,gzip,hashlib,pathlib
          patch=gzip.decompress(base64.b64decode(os.environ['PATCH_DATA']))
          assert hashlib.sha256(patch).hexdigest() == '2a0fba83c407cbe63166116e9af66ff0a327242701444159fe73b2a251981c4a'
          pathlib.Path('/tmp/integration.patch').write_bytes(patch)
          PY
          git apply --check /tmp/integration.patch
          git apply --index /tmp/integration.patch
          git diff --cached --check
          test "$(git write-tree)" = 524b66ab93e8ad5c9affa55358d30815fe8acdf2
          git config user.name 'David'
          git config user.email 'davidgmbb@gmail.com'
          git commit -m 'tests: execute frontend-produced over-aligned Wasm scalars'
          git push --force-with-lease=refs/heads/work/2026-09-06-wasm-integration: origin HEAD:refs/heads/work/2026-09-06-wasm-integration
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Install platform prerequisites
        run: bash .github/scripts/install-vulkan-sdk.sh
      - name: Full Release suite and self-host fixed point
        shell: bash
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/buster-build"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver"
          "$driver" generate --cc clang --config Release --linker DEFAULT
          "$driver" build --config Release -t test_all 2>&1 | tee "$RUNNER_TEMP/wasm-suite.log"
          "$driver" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/wasm-self-host.log"
      - name: Mandatory independent-engine execution and sanitizer probe
        shell: bash
        run: |
          set -euo pipefail
          build/Release/ide cc -target wasm64-unknown-freestanding -nostdinc tests/basic_c_wasm64_alignment.c -o "$RUNNER_TEMP/alignment.wasm"
          node --experimental-wasm-memory64 tests/wasm_memory_alignment_execution.js "$RUNNER_TEMP/alignment.wasm" | tee "$RUNNER_TEMP/wasm-engine.log"
          CC=clang AUDIT_OPT=-O2 AUDIT_SANITIZE=1 ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 python3 tests/wasm_memory_alignment_regression.py 2>&1 | tee "$RUNNER_TEMP/wasm-sanitizers.log"
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasm-integration-results
          path: ${{ runner.temp }}/wasm-*.log
          retention-days: 7
          if-no-files-found: error
