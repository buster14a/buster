name: 9700X admission policy fixtures

on:
  pull_request:
    paths:
      - 'tools/ci/admission*'
      - '.github/workflows/9700x*.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ci/admission*'
      - '.github/workflows/9700x*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Deterministic metadata, authorization, parser, scheduler and recovery fixtures
        run: |
          set -euo pipefail
          cc -std=c17 -O2 -Wall -Wextra -Werror tools/ci/admission.c -o "$RUNNER_TEMP/admission"
          "$RUNNER_TEMP/admission" --self-test
          cc -std=c17 -O2 -Wall -Wextra -Werror tools/ci/changes.c -o "$RUNNER_TEMP/changes"
          "$RUNNER_TEMP/changes" --self-test
