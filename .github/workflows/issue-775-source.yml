name: Issue 775 source snapshot
on:
  push:
    branches: [codex/775-baseline-vectors]
    paths: [.github/workflows/issue-775-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'buster14a/buster'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar --output=source-775.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: issue-775-source
          path: source-775.tar
          retention-days: 1
