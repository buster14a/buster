name: FDE header scratch experiment
on:
  push:
    branches: [scratch/3039-hosted-proof]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      BUSTER_HOST_ARCH: vector
      BUSTER_SANITIZER: none
      BUSTER_SANITIZER_OPTIMIZATION: '3'
      BUSTER_DEBUG_INFO: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Check the hosted vector CPU
        run: |
          lscpu | sed -n '/^Model name:/p'
          cc -std=c17 -O2 -march=x86-64-v4 -maes -mgfni -mvaes -mavx512vbmi -mavx512vbmi2 -mavx512vpopcntdq -mavx512bitalg -mavx512vnni tools/ci/vector-probe.c -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"
      - uses: ./.github/actions/hosted-tools
        with:
          artifact-name: ''
      - run: bash tools/ci/setup-hosted.sh
      - name: Pin both compiler revisions and prepare identical objects
        id: inputs
        run: |
          set -euo pipefail
          cp -R .proof-3039 "$RUNNER_TEMP/record"
          git fetch --no-tags --depth=2 origin 0c27d6f47e79d34ea255505f89785241ea898f8f
          test "$(git rev-parse 0c27d6f47e79d34ea255505f89785241ea898f8f^)" = 6427879e1143026a12fb0388a20bdea1fe4b2bc5
          git switch --detach 6427879e1143026a12fb0388a20bdea1fe4b2bc5
          mkdir -p "$RUNNER_TEMP/results"
          { uname -sr; lscpu | sed -n '/^Model name:/p'; clang --version; readelf --version | head -1; llvm-readobj --version | sed -n '1p'; } | tee "$RUNNER_TEMP/results/environment.txt"
          bash "$RUNNER_TEMP/record/measure.sh" prepare "$RUNNER_TEMP/objects" | tee "$RUNNER_TEMP/results/inputs.txt"
      - name: Build measured baseline
        id: buildbase
        run: |
          bash "$RUNNER_TEMP/record/instrument.sh"
          ./build.sh --config Release > "$RUNNER_TEMP/results/base-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/results/base-build.log"; exit 1; }
      - name: Link and decode baseline images
        id: baseimages
        continue-on-error: true
        run: bash "$RUNNER_TEMP/record/measure.sh" link "$RUNNER_TEMP/objects" ./build/compiler "$RUNNER_TEMP/results/base"
      - name: Run baseline executable and unwind suites
        id: basetests
        continue-on-error: true
        run: bash "$RUNNER_TEMP/record/measure.sh" test "$RUNNER_TEMP/objects" ./build/compiler "$RUNNER_TEMP/results/base-tests"
      - name: Build measured head with the same flags
        id: buildhead
        run: |
          git restore src/buster/compiler/executable_impl.c
          git switch --detach 0c27d6f47e79d34ea255505f89785241ea898f8f
          bash "$RUNNER_TEMP/record/instrument.sh"
          ./build.sh --config Release > "$RUNNER_TEMP/results/head-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/results/head-build.log"; exit 1; }
      - name: Link and decode head images
        id: headimages
        continue-on-error: true
        run: bash "$RUNNER_TEMP/record/measure.sh" link "$RUNNER_TEMP/objects" ./build/compiler "$RUNNER_TEMP/results/head"
      - name: Compare executable images, headers and frame decodes
        id: compare
        continue-on-error: true
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/results"
          count=0
          : > hashes.txt
          for f in base/*.hdr; do
            name=${f#base/}; name=${name%.hdr}
            cmp "base/$name" "head/$name"
            cmp "base/$name.hdr" "head/$name.hdr"
            cmp "base/$name.frames" "head/$name.frames"
            (cd head; sha256sum "$name" "$name.hdr") >> hashes.txt
            count=$((count+1))
          done
          test "$count" = 20
          cmp base/runtime.stdout head/runtime.stdout
          cmp base/dco.stdout head/dco.stdout
          echo "Compared all $count complete ELF images, headers and GNU readelf frame decodes"
          cat hashes.txt
      - name: Build the published head without counters
        id: plain
        run: |
          git restore src/buster/compiler/executable_impl.c
          git diff --exit-code 0c27d6f47e79d34ea255505f89785241ea898f8f -- src
          ./build.sh --config Release > "$RUNNER_TEMP/results/plain-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/results/plain-build.log"; exit 1; }
      - name: Run executable and unwind suites on the published head
        id: headtests
        continue-on-error: true
        run: bash "$RUNNER_TEMP/record/measure.sh" test "$RUNNER_TEMP/objects" ./build/compiler "$RUNNER_TEMP/results/head-tests"
      - name: Record all outcomes
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
        env:
          OUTCOMES: ${{ format('{0} {1} {2} {3} {4} {5} {6} {7}', steps.buildbase.outcome, steps.baseimages.outcome, steps.basetests.outcome, steps.buildhead.outcome, steps.headimages.outcome, steps.compare.outcome, steps.plain.outcome, steps.headtests.outcome) }}
        run: |
          echo "$OUTCOMES"
          test "$OUTCOMES" = 'success success success success success success success success'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fde-3039-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results
          retention-days: 7
