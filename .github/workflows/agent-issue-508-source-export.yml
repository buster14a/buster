name: Agent issue 508 source export

on:
  push:
    branches:
      - agent/issue-508-census-closure

permissions:
  contents: read

jobs:
  source:
    if: ${{ github.repository == 'buster14a/buster' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Archive tracked source
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/buster-source.tar.gz" HEAD
      - name: Retain source briefly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-508-source-${{ github.sha }}
          path: ${{ runner.temp }}/buster-source.tar.gz
          if-no-files-found: error
          retention-days: 1
