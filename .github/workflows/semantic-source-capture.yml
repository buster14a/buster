name: Temporary semantic source capture
on:
  push:
    branches: [codex/semantic-unevaluated-source-20260924-astra]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Capture immutable source without building
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/semantic-source"
          cp src/buster/lib/compiler/frontend/c/c_gen.c src/buster/lib/compiler/frontend/c/c_parse.c src/buster/tests/compiler/frontend/c/c_test.c "$RUNNER_TEMP/semantic-source/"
          git rev-parse HEAD HEAD^{tree}
          git hash-object src/buster/lib/compiler/frontend/c/c_gen.c src/buster/lib/compiler/frontend/c/c_parse.c src/buster/tests/compiler/frontend/c/c_test.c
          grep -nE 'sizeof.*vla|vla.*sizeof|c_ir_sizeof_operand_type_attempt|c_ir_prepare_control_expressions_step' src/buster/lib/compiler/frontend/c/c_gen.c
          python3 - <<'PY'
          from pathlib import Path
          import os
          lines = Path('src/buster/lib/compiler/frontend/c/c_gen.c').read_text().splitlines()
          for number in range(0, len(lines), 500):
              path = Path(os.environ['RUNNER_TEMP']) / 'semantic-source' / ('c_gen-%05d.txt' % (number + 1))
              path.write_text('\n'.join('%d: %s' % (i + 1, lines[i]) for i in range(number, min(number + 500, len(lines)))) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-source-pinned
          path: ${{ runner.temp }}/semantic-source
          retention-days: 30
          if-no-files-found: error
