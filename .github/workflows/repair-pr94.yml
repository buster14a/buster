name: Repair PR 94

on:
  push:
    branches:
      - claude/unruffled-bhabha-f5d28a
    paths:
      - .github/workflows/repair-pr94.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: claude/unruffled-bhabha-f5d28a
          fetch-depth: 0

      - name: Apply portability and CI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64; exec(base64.b64decode(''))"
          git diff --check
          git status --short

      - name: Commit repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: repair six-platform GitHub matrix"
          git push origin HEAD:claude/unruffled-bhabha-f5d28a
