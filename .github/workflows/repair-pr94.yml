name: Repair PR 94

on:
  push:
    branches:
      - claude/unruffled-bhabha-f5d28a
    paths:
      - .github/workflows/repair-pr94.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: claude/unruffled-bhabha-f5d28a
          fetch-depth: 0

      - name: Apply macOS Intel matrix capability fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.c")
          text = path.read_text()
          old = '    bool direct_matrix = environment_flag_is_on(S8("BUSTER_MATRIX_DIRECT"));'
          new = (
              '    // Intel macOS cannot yet self-host the compiler image; direct mode still\n'
              '    // executes every compiler/configuration test tree and omits only fan-out.\n'
              '    bool direct_matrix = environment_flag_is_on(S8("BUSTER_MATRIX_DIRECT")) ||\n'
              '                         (BUSTER_MACOS && BUSTER_CPU_ARCH_X86_64);'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"build.c: expected one direct-matrix definition, found {count}")
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git status --short

      - name: Commit repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build.c
          git commit -m "ci: use direct matrix on Intel macOS"
          git push origin HEAD:claude/unruffled-bhabha-f5d28a
