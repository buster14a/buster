name: Repair PR 94 Windows ARM64

on:
  push:
    branches:
      - claude/unruffled-bhabha-f5d28a
    paths:
      - .github/workflows/repair-pr94.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: claude/unruffled-bhabha-f5d28a
          fetch-depth: 0

      - name: Keep only native Windows ARM64 compilers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.c")
          text = path.read_text()
          old = """    for (BuildCompiler compiler = !BUSTER_WINDOWS; compiler < BUILD_COMPILER_COUNT; compiler += 1)
    {
        bool is_clang = compiler == BUILD_COMPILER_CLANG;
"""
          new = """    for (BuildCompiler compiler = !BUSTER_WINDOWS; compiler < BUILD_COMPILER_COUNT; compiler += 1)
    {
        // The Windows ARM64 image exposes x86-64 MinGW as `gcc`, while Zig
        // 0.16's native ARM64 frontend currently crashes before producing an
        // object. Neither row tests this target. Keep the two genuine native
        // toolchains: MSVC and standalone LLVM Clang.
        if (BUSTER_WINDOWS && BUSTER_CPU_ARCH_AARCH64 && compiler > BUILD_COMPILER_CLANG)
        {
            continue;
        }
        bool is_clang = compiler == BUILD_COMPILER_CLANG;
"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"build.c: expected one compiler loop, found {count}")
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git status --short

      - name: Commit repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build.c
          git commit -m "ci: restrict Windows ARM64 to native toolchains"
          git push origin HEAD:claude/unruffled-bhabha-f5d28a
