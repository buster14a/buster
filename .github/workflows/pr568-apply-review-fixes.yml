name: Apply PR 568 review fixes

on:
  push:
    branches:
      - docs/511-retirement-performance-contract
    paths:
      - .github/workflows/pr568-apply-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: pr568-apply-review-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.repository == 'buster14a/buster' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply, validate, and publish the preserved repair
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pr568-patch/part* | base64 --decode > "$RUNNER_TEMP/pr568.patch"
          printf '%s  %s\n' \
            'd9a6380e6f5a04a70419a8b80e09b2536ddf827e587a0880e1170b000f47269d' \
            "$RUNNER_TEMP/pr568.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/pr568.patch"
          git apply "$RUNNER_TEMP/pr568.patch"
          rm -rf .github/pr568-patch

          python3 -m py_compile \
            tools/native_retirement_performance_binding.py \
            tools/native_retirement_performance_binding_test.py \
            tools/native_retirement_performance_identity_test.py
          python3 -W error::ResourceWarning tools/native_retirement_performance_identity_test.py -v
          python3 -W error::ResourceWarning tools/native_retirement_result_input_test.py -v
          python3 -W error::ResourceWarning tools/native_retirement_performance_binding_test.py -v
          git diff --check

          git config user.name 'David'
          git config user.email 'davidgmbb@gmail.com'
          git add -A
          git commit \
            -m 'bench: close execution-evidence review gaps (#568)' \
            -m 'Authenticate the exact receipt bytes being parsed, bind the admitted logical CPU and fresh process instances, derive native runtime applicability from frozen row obligations, and document the mandatory receipt digest. Add adversarial regression coverage. No performance acceptance is claimed.'
          git push origin HEAD:refs/heads/docs/511-retirement-performance-contract
