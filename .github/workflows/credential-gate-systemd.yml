name: Credential gate disposable systemd

on:
  pull_request:
    paths:
      - 'tools/bench_service/**'
      - '.github/scripts/credential_gate_systemd_test.sh'
      - '.github/workflows/credential-gate-systemd.yml'
  push:
    branches: [main]
    paths:
      - 'tools/bench_service/**'
      - '.github/scripts/credential_gate_systemd_test.sh'
      - '.github/workflows/credential-gate-systemd.yml'

permissions:
  contents: read

concurrency:
  # Keep every main invocation, including pending runs during merge bursts.
  group: credential-gate-systemd-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'merge_group' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  credentials:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check account drift before payload in fresh PID1 systemd guest
        shell: bash
        run: bash .github/scripts/credential_gate_systemd_test.sh
      - name: Ensure disposable guest removal
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          guest="bqcg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if sudo docker ps -a --format '{{.Names}}' | grep -Fxq "$guest"; then
            sudo timeout 30 docker rm --force "$guest"
          fi
      - name: Retain successes, failures and cleanup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: credential-gate-systemd-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/credential-gate-systemd-proof
          if-no-files-found: error
          retention-days: 7
