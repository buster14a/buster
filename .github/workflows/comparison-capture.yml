name: Bounded compiler debug comparison
on:
  push:
    branches: [codex/2334-debug-comparison-capture]
    paths: [.github/workflows/comparison-capture.yml, tools/research/debug-comparison-capture.c]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: comparison-capture-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile standalone C observer
        run: clang -std=c11 -O2 -g -Wall -Wextra -Werror tools/research/debug-comparison-capture.c -o capture
      - name: Run fixed-count cloud diagnostic
        run: ./capture
      - name: Preserve successful and failed observations
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-debug-comparison-${{ github.run_id }}
          path: |
            evidence
            tools/research/debug-comparison-capture.c
            .github/workflows/comparison-capture.yml
          retention-days: 30
          if-no-files-found: error
