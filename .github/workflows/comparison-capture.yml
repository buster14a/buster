name: Bounded compiler debug comparison
on:
  push:
    branches: [codex/2334-debug-comparison-capture]
    paths: [.github/workflows/comparison-capture.yml, tools/research/debug-comparison-capture.c, tools/research/cproc-study.c]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: comparison-capture-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retain earlier failure receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37198781376 --repo buster14a/buster -n compiler-debug-comparison-37198781376 -D prior-evidence
          gh run download 37200061341 --repo buster14a/buster -n compiler-debug-comparison-37200061341 -D prior-cproc-evidence
          cat prior-cproc-evidence/secondary-evidence/cproc-build.log prior-cproc-evidence/secondary-evidence/qbe-license.log
          cat prior-evidence/evidence/clang-debug-debug-build.log prior-evidence/evidence/tcc-debug-link.log prior-evidence/evidence/buster-debug-gdb.log
      - name: Install debugger from Ubuntu
        run: sudo apt-get update -qq && sudo apt-get install -y gdb
      - name: Compile standalone C observer
        run: clang -std=c11 -O2 -g -Wall -Wextra -Werror tools/research/debug-comparison-capture.c -o capture
      - name: Run fixed-count cloud diagnostic
        run: ./capture
      - name: Separate cproc QBE g0 study
        if: ${{ always() }}
        run: |
          clang -std=c11 -O2 -g -Wall -Wextra -Werror tools/research/cproc-study.c -o cproc-study
          ./cproc-study
      - name: Qualification and host receipts
        if: ${{ always() }}
        run: |
          for f in evidence/host.log evidence/toolchains.log evidence/source-pin.txt evidence/tcc-pin.txt evidence/compiler-sha256.txt evidence/*preflight.log evidence/*link.log evidence/*debug-build.log evidence/*gdb.log; do echo "FILE $f"; cat "$f"; done
          cat evidence/CMakeCache.txt evidence/compile_commands.json
      - name: Raw compilation observations
        if: ${{ always() }}
        run: cat evidence/samples.csv
      - name: Raw runtime observations
        if: ${{ always() }}
        run: |
          for f in evidence/*runtime-*.log; do echo "FILE $f"; cat "$f"; done
      - name: Code and debug sizes and disassembly
        if: ${{ always() }}
        run: |
          for a in buster-debug clang-debug gcc-debug tcc-debug clang-O2-g gcc-O2-g; do
            echo "ARM $a"
            size -A evidence/$a-kernels.o evidence/$a-tiny.o evidence/$a-functions256.o evidence/$a-functions2048.o
            objdump -drwC -Mintel evidence/$a-kernels.o
          done
          cat evidence/artifacts-sha256.txt evidence/sample-artifact-hashes.txt
      - name: Preserve successful and failed observations
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-debug-comparison-${{ github.run_id }}
          path: |
            evidence
            prior-evidence
            prior-cproc-evidence
            secondary-evidence
            tools/research/debug-comparison-capture.c
            tools/research/cproc-study.c
            .github/workflows/comparison-capture.yml
          retention-days: 30
          if-no-files-found: error
