name: Materialize issue 1112 patch

# Temporary source-editing job only: no compiler build, test, or measurement on this runner.
# The resulting branch starts at the pinned base and does not contain this workflow or its patch input.
on:
  push:
    branches: [chatgpt/1112-materialize-20261102]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out patch input
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Apply patch to pinned base and publish a clean review branch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/issue-1112.patch "$RUNNER_TEMP/issue-1112.patch"
          git checkout --detach df007cd52c074223cfa6deddb14b058714c0ed53
          git apply --recount --check "$RUNNER_TEMP/issue-1112.patch"
          git apply --recount --index "$RUNNER_TEMP/issue-1112.patch"
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'driver: refuse unsupported sanitizer and OpenMP code generation (#1112)' -m 'Resolve instrumentation after option parsing, retain non-emitting predefines, honor syntax-only precedence, and exercise output preservation and cancellation in the driver suite.'
          git push --force-with-lease=refs/heads/chatgpt/1112-instrumentation-refusal: origin HEAD:refs/heads/chatgpt/1112-instrumentation-refusal
          git rev-parse HEAD
