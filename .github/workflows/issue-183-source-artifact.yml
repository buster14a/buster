name: Package issue 183 source

on:
  push:
    branches:
      - scratch/183-current-progress
    paths:
      - .github/workflows/issue-183-source-artifact.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Package focused source tree
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/issue-183-source"
          mkdir -p "$destination"
          cp --parents \
            AGENTS.md \
            docs/agents/frontend.md \
            docs/agents/frontend/foundations.md \
            src/buster/lib/compiler/frontend/c/c.h \
            src/buster/lib/compiler/frontend/c/c_internal.h \
            src/buster/lib/compiler/frontend/c/c_source.c \
            src/buster/lib/compiler/frontend/c/c_parse.c \
            src/buster/lib/compiler/frontend/c/c_gen.c \
            src/buster/tests/compiler/driver/driver_test.c \
            tests/basic_c_fixed_enum.c \
            "$destination"
          while IFS= read -r test_source; do
            cp --parents "$test_source" "$destination"
          done < <(find tests -maxdepth 1 -type f \( -iname '*enum*' -o -iname '*bit*field*' -o -iname '*bitfield*' \) -print | sort)
          git rev-parse HEAD > "$destination/HEAD"
      - name: Upload focused source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-183-source-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-183-source
          if-no-files-found: error
          retention-days: 1
