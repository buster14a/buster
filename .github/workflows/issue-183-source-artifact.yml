name: Issue 183 source artifact
on:
  push:
    branches: [scratch/183-typed-ice-analysis]
    paths:
      - .github/workflows/issue-183-source-artifact.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | tar --null -T - -czf issue-183-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: issue-183-source
          path: issue-183-source.tgz
          retention-days: 1
