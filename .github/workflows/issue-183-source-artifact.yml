name: Issue 183 source artifact
on:
  push:
    branches: [scratch/183-typed-ice-analysis]
    paths:
      - .github/workflows/issue-183-source-artifact.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir issue-183-source
          cp --parents \
            src/buster/lib/compiler/frontend/c/c.h \
            src/buster/lib/compiler/frontend/c/c_parse.c \
            src/buster/lib/compiler/frontend/c/c_gen.c \
            src/buster/lib/compiler/frontend/c/c_source.c \
            src/buster/lib/compiler/frontend/c/c_parse.h \
            src/buster/lib/compiler/frontend/c/c_gen.h \
            tests/c/c.c tests/c/c-gnu.c \
            build.sh build.c AGENTS.md \
            issue-183-source/
          find docs/agents/frontend -maxdepth 2 -type f -exec cp --parents {} issue-183-source/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: issue-183-source
          path: issue-183-source
          retention-days: 1
