name: A02 frozen source and coordination evidence
on:
  push:
    branches: [astra/a02-20260909-transport]
    paths: [.github/workflows/a02-source.yml]
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: a02-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          persist-credentials: false
      - name: Export exact tracked source and bounded repository evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a02-source/evidence"
          test "$(git rev-parse HEAD)" = ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          git archive --format=tar.gz --output="$RUNNER_TEMP/a02-source/source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/a02-source/source.sha"
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'a02-source' / 'evidence'
          base = 'https://api.github.com/repos/buster14a/buster/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base + path, headers=headers), timeout=60) as response:
                  return json.load(response)
          def pages(path, name):
              rows = []
              for page in range(1, 51):
                  batch = get(path + ('&' if '?' in path else '?') + 'per_page=100&page=' + str(page))
                  if not isinstance(batch, list):
                      raise RuntimeError('Expected list: ' + path)
                  rows.extend(batch)
                  if len(batch) < 100:
                      break
              else:
                  raise RuntimeError('Pagination bound exceeded: ' + path)
              (root / (name + '.json')).write_text(json.dumps(rows, indent=2))
              print(name, len(rows), 'pages', page)
              return rows
          issues = pages('issues?state=all', 'issues-all')
          prs = pages('pulls?state=all', 'pulls-all')
          for number in (147, 148, 183, 258, 271, 274, 341):
              pages('issues/' + str(number) + '/comments', 'issue-' + str(number) + '-comments')
          for pr in prs:
              if pr['state'] == 'open':
                  number = str(pr['number'])
                  pages('pulls/' + number + '/files', 'pr-' + number + '-files')
                  pages('pulls/' + number + '/reviews', 'pr-' + number + '-reviews')
                  pages('pulls/' + number + '/comments', 'pr-' + number + '-reviews-comments')
                  pages('issues/' + number + '/comments', 'pr-' + number + '-comments')
          for path, name in [('src/buster/lib/compiler/frontend/c/c_source.c', 'source'), ('src/buster/lib/compiler/frontend/c/c_parse.c', 'parse'), ('src/buster/lib/compiler/frontend/c/c_gen.c', 'gen')]:
              rows = get('commits?sha=ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae&per_page=30&path=' + path)
              (root / ('recent-' + name + '-commits.json')).write_text(json.dumps(rows, indent=2))
          PY
          printf 'Frozen source and paginated issue/PR evidence only; no build/test claim.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a02-source-${{ github.run_id }}
          path: ${{ runner.temp }}/a02-source
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
