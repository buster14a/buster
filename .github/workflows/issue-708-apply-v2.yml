name: Apply issue 708 candidate v2

on:
  pull_request:
    paths:
      - '.github/workflows/issue-708-apply-v2.yml'
      - 'tools/issue_708_patch.py'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/708-native-frame-link-cache' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Apply and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/issue_708_patch.py
          git diff --check
          if git diff --quiet -- src/buster/tests/compiler/driver/driver_test.c; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/buster/tests/compiler/driver/driver_test.c
          git commit -m 'test: reuse byte-identical native frame links'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
