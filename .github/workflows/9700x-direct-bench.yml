name: 9700X direct workload benchmark

# Runs the owner's pull-request workloads directly on the 9700X runner (#2704).
# workflow_run executes this definition from main, so a pull request cannot
# edit the gate and the runner group stays pinned to this file at
# refs/heads/main. It starts when 9700x-direct-request.yml completes for a
# pull request; only requests started by davidgmbb (user 39247043) from a
# branch of this repository, for a pull request davidgmbb authored, reach the
# self-hosted runner. There is no manual dispatch or approval. Trusted main
# supplies the gate and the harness; the pull request supplies only workload
# sources under benchmarks/9700x/. The host job receives no token capability
# or secret, and no checkout persists credentials: persist-credentials: false
on:
  workflow_run:
    workflows: [9700X direct workload request]
    types: [completed]

# Zero token capabilities are stricter than the repository-wide static
# read-only policy marker retained for common workflow tooling: contents: read
permissions: {}

concurrency:
  group: buster-9700x-direct-bench-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  # Fail closed unless GitHub's own records name davidgmbb, by login and
  # numeric ID, as actor and triggering actor of the request run and as the
  # author of the one open same-repository pull request for its head commit.
  authorize:
    if: ${{ vars.BENCH_DIRECT_ENABLED == 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'davidgmbb' && github.event.workflow_run.actor.id == 39247043 && github.event.workflow_run.triggering_actor.login == 'davidgmbb' && github.event.workflow_run.triggering_actor.id == 39247043 && (github.run_attempt == 1 || github.triggering_actor == 'davidgmbb') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      attempt: ${{ steps.verify.outputs.attempt }}
      base: ${{ steps.verify.outputs.base }}
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@da8f2b576b595160b3f811c7ae49e9719d61b1ed
        with:
          requested-runner: >-
            ubuntu-24.04
      - name: Check out the trusted authorization rules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/bench_direct
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@da8f2b576b595160b3f811c7ae49e9719d61b1ed
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Verify the request run and its pull request
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BQ_REPOSITORY: ${{ github.repository }}
          BQ_REQUEST_RUN_ID: ${{ github.event.workflow_run.id }}
          BQ_HEAD_COMMIT: ${{ github.event.workflow_run.head_sha }}
          BQ_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 -B tools/bench_direct/authorize.py

  # "Re-run failed jobs" reuses the outputs of jobs that succeeded in an
  # earlier attempt, so bench requires authorize to have passed in this same
  # attempt; a maintainer re-run must use "Re-run all jobs".
  bench:
    needs: authorize
    if: ${{ vars.BENCH_DIRECT_ENABLED == 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'davidgmbb' && github.event.workflow_run.actor.id == 39247043 && github.event.workflow_run.triggering_actor.login == 'davidgmbb' && github.event.workflow_run.triggering_actor.id == 39247043 && (github.run_attempt == 1 || github.triggering_actor == 'davidgmbb') && needs.authorize.outputs.attempt == format('{0}', github.run_attempt) }}
    runs-on:
      group: buster-9700x-service-dispatch
      labels: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
    timeout-minutes: 15
    env:
      BQ_BASE_COMMIT: ${{ needs.authorize.outputs.base }}
      BQ_HEAD_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@da8f2b576b595160b3f811c7ae49e9719d61b1ed
        with:
          requested-runner: >-
            group: buster-9700x-service-dispatch labels: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
      # The harness, compile command and sample plan come from main.
      - name: Check out the trusted harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: tools/bench_direct
          persist-credentials: false
      # Full commit history without file contents, so the harness can list
      # what the pull request changed; only the workload directory is
      # materialized.
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@da8f2b576b595160b3f811c7ae49e9719d61b1ed
        with:
          mode: source
          source-directory: trusted
          source-repository: ${{ github.repository }}
      - name: Check out the pull request workloads
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: benchmarks/9700x
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@da8f2b576b595160b3f811c7ae49e9719d61b1ed
        with:
          mode: source
          source-directory: candidate
          source-repository: ${{ github.repository }}
      - name: Compile and run the changed workloads
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BQ_BASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BQ_HEAD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C candidate rev-parse HEAD)" == "$BQ_HEAD_COMMIT" ]]
          python3 -B trusted/tools/bench_direct/run_workloads.py \
            --candidate candidate --base "$BQ_BASE_COMMIT" --head "$BQ_HEAD_COMMIT" \
            --work "$RUNNER_TEMP/direct-bench" --summary "$GITHUB_STEP_SUMMARY"
