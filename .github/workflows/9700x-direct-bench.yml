name: 9700X direct workload benchmark

# Runs the owner's pull-request workloads directly on the 9700X runner (#2704).
# pull_request_target executes this definition from main, so a pull request
# cannot edit the gate and the runner group stays pinned to this file at
# refs/heads/main. Only pull requests authored and pushed by davidgmbb
# (user 39247043) from a branch of this repository reach the self-hosted
# runner; there is no manual dispatch or approval. Trusted main supplies the
# harness; the pull request supplies only workload sources under
# benchmarks/9700x/. No job receives a token capability or a secret, and no
# checkout persists credentials: persist-credentials: false
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'benchmarks/9700x/*.c'

# Zero token capabilities are stricter than the repository-wide static
# read-only policy marker retained for common workflow tooling: contents: read
permissions: {}

concurrency:
  group: buster-9700x-direct-bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Fail closed unless GitHub's own record of this exact run attempt names
  # davidgmbb by login and numeric ID as both actor and triggering actor, and
  # the event payload names the same account as the pull request author.
  authorize:
    if: ${{ vars.BENCH_DIRECT_ENABLED == 'true' && github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'davidgmbb' && github.event.pull_request.user.id == 39247043 && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'davidgmbb' && github.actor_id == '39247043' && github.triggering_actor == 'davidgmbb' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    timeout-minutes: 5
    outputs:
      attempt: ${{ steps.verify.outputs.attempt }}
    steps:
      - name: Verify the requester of this run attempt
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BQ_REPOSITORY: ${{ github.repository }}
          BQ_RUN_ID: ${{ github.run_id }}
          BQ_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$BQ_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$BQ_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BQ_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          record="$RUNNER_TEMP/run-attempt.json"
          # The token header is read from stdin, never placed on a command line.
          printf 'Authorization: Bearer %s\n' "$GH_TOKEN" |
            curl --fail --silent --show-error --proto '=https' --max-time 30 --retry 3 \
              --header @- --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' --output "$record" \
              "https://api.github.com/repos/$BQ_REPOSITORY/actions/runs/$BQ_RUN_ID/attempts/$BQ_RUN_ATTEMPT"
          python3 - "$record" "$BQ_RUN_ID" "$BQ_RUN_ATTEMPT" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              run = json.load(source)
          run_id, run_attempt = int(sys.argv[2]), int(sys.argv[3])
          maintainer = {"login": "davidgmbb", "id": 39247043}


          def identity(key):
              actor = run.get(key)
              if not isinstance(actor, dict) or type(actor.get("id")) is not int:
                  return None
              return {"login": actor.get("login"), "id": actor.get("id")}


          failures = [name for name, holds in (
              ("run id", type(run.get("id")) is int and run.get("id") == run_id),
              ("event", run.get("event") == "pull_request_target"),
              ("actor", identity("actor") == maintainer),
              ("triggering actor", identity("triggering_actor") == maintainer),
              ("run attempt", type(run.get("run_attempt")) is int and
               run.get("run_attempt") == run_attempt),
          ) if not holds]
          if failures:
              sys.exit("BENCH_DIRECT_UNAUTHORIZED " + ", ".join(failures))
          PY
          printf 'attempt=%s\n' "$BQ_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  # "Re-run failed jobs" reuses the outputs of jobs that succeeded in an
  # earlier attempt, so bench requires authorize to have passed in this same
  # attempt; a maintainer re-run must use "Re-run all jobs".
  bench:
    needs: authorize
    if: ${{ vars.BENCH_DIRECT_ENABLED == 'true' && github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'davidgmbb' && github.event.pull_request.user.id == 39247043 && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'davidgmbb' && github.actor_id == '39247043' && github.triggering_actor == 'davidgmbb' && needs.authorize.outputs.attempt == format('{0}', github.run_attempt) }}
    runs-on:
      group: buster-9700x-service-dispatch
      labels: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
    timeout-minutes: 15
    env:
      BQ_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
      BQ_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      # The harness, compile command and sample plan come from main.
      - name: Check out the trusted harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: tools/bench_direct
          persist-credentials: false
      # Full commit history without file contents, so the harness can list
      # what the pull request changed; only the workload directory is
      # materialized.
      - name: Check out the pull request workloads
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: benchmarks/9700x
          persist-credentials: false
      - name: Compile and run the changed workloads
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BQ_BASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BQ_HEAD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C candidate rev-parse HEAD)" == "$BQ_HEAD_COMMIT" ]]
          python3 -B trusted/tools/bench_direct/run_workloads.py \
            --candidate candidate --base "$BQ_BASE_COMMIT" --head "$BQ_HEAD_COMMIT" \
            --work "$RUNNER_TEMP/direct-bench" --summary "$GITHUB_STEP_SUMMARY"
