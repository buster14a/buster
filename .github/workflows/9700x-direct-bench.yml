name: 9700X direct workload benchmark
run-name: '9700X request ${{ github.event.workflow_run.id }}.${{ github.event.workflow_run.run_attempt }} head ${{ github.event.workflow_run.head_sha }}'

# Runs the owner's pull-request workloads directly on the 9700X runner (#2704),
# and compares each commit that lands on main with its first parent, or with
# the nearest measured first-parent ancestor when that has no valid
# measurement, so a merge burst's unmeasured commits sit in a range (#2752).
# workflow_run executes this definition from main, so a pull request cannot
# edit the gate, and the runner group stays pinned to this one file at
# refs/heads/main.
#
# Pull requests: starts when 9700x-direct-request.yml completes for a pull
# request; only requests started by davidgmbb (user 39247043) from a branch of
# this repository, for a pull request davidgmbb authored, reach the self-hosted
# runner. There is no manual dispatch or approval. authorize says what the pull
# request asked for: only a fresh request change at this exact head, relative
# to every parent, starts host work (#3087); ordinary updates and main merges
# do not replay an earlier request. bench times its changed workloads, and compare-pull with
# the hosted publish-pull compares its compiler with its merge base (#2769).
#
# Main compiler comparison: starts when 9700x-compiler-request.yml completes for
# a push to main and BENCH_COMPILER_ENABLED is also true. authorize-compiler
# re-reads the commit, its first-parent chain, the chosen baseline and main
# (checks: read finds the nearest measured ancestor); main is trusted code, so
# no author gate applies. compare builds and times both compilers; the hosted
# publish-compiler job validates the evidence as data and completes the check.
# Merging never waits for it, and the verdict is report-only.
#
# Visibility (#2803, #2804): 9700x-compiler-request.yml creates the queued
# "9700X compiler benchmark" check before this run exists; the hosted
# start-compiler / start-pull jobs reconcile orphans, adopt or create the
# attempt's check in one short pass; native Actions job state remains the
# authoritative live execution indicator. The publish jobs complete that check. comment-compiler, the only job with
# contents: write (for the commit-comment API), upserts one report comment on
# the main commit from publish-compiler's validated output, downloading
# nothing. compiler_github.py, compiler_publish.py and compiler_comment.py say
# how ownership, ordering and retries are bounded.
#
# Trusted main supplies the gates and harnesses. The host jobs receive no token
# capability or secret, and no checkout persists credentials: persist-credentials: false
on:
  workflow_run:
    workflows: [9700X direct workload request, 9700X compiler benchmark request]
    types: [completed]

# Zero token capabilities are stricter than the repository-wide static
# read-only policy marker retained for common workflow tooling: contents: read
permissions: {}

# Pull requests: one run per branch, a new push cancels the old one. Main: one
# shared group that never cancels a measurement in progress; GitHub keeps only
# the newest pending main commit, so a burst of merges measures the latest and
# leaves the commits in between unmeasured (bounded host time, visible gaps).
concurrency:
  group: buster-9700x-direct-bench-${{ github.event.workflow_run.event == 'push' && 'main-compare' || github.event.workflow_run.head_branch }}
  cancel-in-progress: ${{ github.event.workflow_run.event != 'push' }}

jobs:
  # Fail closed unless GitHub's own records name davidgmbb, by login and
  # numeric ID, as actor and triggering actor of the request run and as the
  # author of the one open same-repository pull request for its head commit.
  authorize:
    if: ${{ vars.BENCH_DIRECT_ENABLED == 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.path == '.github/workflows/9700x-direct-request.yml' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'davidgmbb' && github.event.workflow_run.actor.id == 39247043 && github.event.workflow_run.triggering_actor.login == 'davidgmbb' && github.event.workflow_run.triggering_actor.id == 39247043 && (github.run_attempt == 1 || github.triggering_actor == 'davidgmbb') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      attempt: ${{ steps.verify.outputs.attempt }}
      base: ${{ steps.verify.outputs.base }}
      pull: ${{ steps.verify.outputs.pull }}
      request_head: ${{ steps.verify.outputs.request_head }}
      workloads: ${{ steps.verify.outputs.workloads }}
      compare: ${{ steps.verify.outputs.compare }}
      merge_base: ${{ steps.verify.outputs.merge_base }}
      merge_base_tree: ${{ steps.verify.outputs.merge_base_tree }}
      head_tree: ${{ steps.verify.outputs.head_tree }}
      utility_request_data: ${{ steps.verify.outputs.utility_request_data }}
      utility_plan_data: ${{ steps.verify.outputs.utility_plan_data }}
      utility_allowlist_data: ${{ steps.verify.outputs.utility_allowlist_data }}
      utility_facts_data: ${{ steps.verify.outputs.utility_facts_data }}
      utility_history_data: ${{ steps.verify.outputs.utility_history_data }}
      utility_admitted: ${{ steps.utility.outputs.utility_admitted }}
      utility_phase: ${{ steps.utility.outputs.utility_phase }}
      utility_packet: ${{ steps.utility.outputs.utility_packet }}
      utility_family: ${{ steps.utility.outputs.utility_family }}
      utility_reservation_seconds: ${{ steps.utility.outputs.utility_reservation_seconds }}
      utility_worker_seconds: ${{ steps.utility.outputs.utility_worker_seconds }}
      utility_timeout_minutes: ${{ steps.utility.outputs.utility_timeout_minutes }}
      utility_plan_revision: ${{ steps.utility.outputs.utility_plan_revision }}
      utility_plan_sha256: ${{ steps.utility.outputs.utility_plan_sha256 }}
      utility_protocol_sha256: ${{ steps.utility.outputs.utility_protocol_sha256 }}
      utility_base: ${{ steps.utility.outputs.utility_base }}
      utility_base_tree: ${{ steps.utility.outputs.utility_base_tree }}
      utility_pull_head: ${{ steps.utility.outputs.utility_pull_head }}
      utility_candidate_revision: ${{ steps.utility.outputs.utility_candidate_revision }}
      utility_candidate_tree: ${{ steps.utility.outputs.utility_candidate_tree }}
      utility_trusted_revision: ${{ steps.utility.outputs.utility_trusted_revision }}
      preparation_request_data: ${{ steps.verify.outputs.preparation_request_data }}
      preparation_plan_data: ${{ steps.verify.outputs.preparation_plan_data }}
      preparation_allowlist_data: ${{ steps.verify.outputs.preparation_allowlist_data }}
      preparation_facts_data: ${{ steps.verify.outputs.preparation_facts_data }}
      preparation_history_data: ${{ steps.verify.outputs.preparation_history_data }}
      preparation_admitted: ${{ steps.preparation.outputs.preparation_admitted }}
      preparation_phase: ${{ steps.preparation.outputs.preparation_phase }}
      preparation_packet: ${{ steps.preparation.outputs.preparation_packet }}
      preparation_family: ${{ steps.preparation.outputs.preparation_family }}
      preparation_reservation_seconds: ${{ steps.preparation.outputs.preparation_reservation_seconds }}
      preparation_worker_seconds: ${{ steps.preparation.outputs.preparation_worker_seconds }}
      preparation_timeout_minutes: ${{ steps.preparation.outputs.preparation_timeout_minutes }}
      preparation_plan_revision: ${{ steps.preparation.outputs.preparation_plan_revision }}
      preparation_plan_sha256: ${{ steps.preparation.outputs.preparation_plan_sha256 }}
      preparation_protocol_sha256: ${{ steps.preparation.outputs.preparation_protocol_sha256 }}
      preparation_base: ${{ steps.preparation.outputs.preparation_base }}
      preparation_base_tree: ${{ steps.preparation.outputs.preparation_base_tree }}
      preparation_candidate_revision: ${{ steps.preparation.outputs.preparation_candidate_revision }}
      preparation_candidate_tree: ${{ steps.preparation.outputs.preparation_candidate_tree }}
      preparation_trusted_revision: ${{ steps.preparation.outputs.preparation_trusted_revision }}
      sampling_request_data: ${{ steps.verify.outputs.sampling_request_data }}
      sampling_freeze_data: ${{ steps.verify.outputs.sampling_freeze_data }}
      sampling_parent_freeze_data: ${{ steps.verify.outputs.sampling_parent_freeze_data }}
      sampling_acquisition_plan_data: ${{ steps.verify.outputs.sampling_acquisition_plan_data }}
      sampling_allowlist_data: ${{ steps.verify.outputs.sampling_allowlist_data }}
      sampling_facts_data: ${{ steps.verify.outputs.sampling_facts_data }}
      sampling_history_data: ${{ steps.verify.outputs.sampling_history_data }}
      sampling_admitted: ${{ steps.native.outputs.sampling_admitted }}
      sampling_phase: ${{ steps.native.outputs.sampling_phase }}
      sampling_packet: ${{ steps.native.outputs.sampling_packet }}
      sampling_family: ${{ steps.native.outputs.sampling_family }}
      sampling_reservation_seconds: ${{ steps.native.outputs.sampling_reservation_seconds }}
      sampling_timeout_minutes: ${{ steps.native.outputs.sampling_timeout_minutes }}
      sampling_freeze_revision: ${{ steps.native.outputs.sampling_freeze_revision }}
      sampling_freeze_sha256: ${{ steps.native.outputs.sampling_freeze_sha256 }}
      sampling_campaign_parent: ${{ steps.native.outputs.sampling_campaign_parent }}
      sampling_parent_freeze_revision: ${{ steps.native.outputs.sampling_parent_freeze_revision }}
      sampling_protocol_sha256: ${{ steps.native.outputs.sampling_protocol_sha256 }}
      sampling_base: ${{ steps.native.outputs.sampling_base }}
      sampling_base_tree: ${{ steps.native.outputs.sampling_base_tree }}
      sampling_candidate_revision: ${{ steps.native.outputs.sampling_candidate_revision }}
      sampling_trusted_revision: ${{ steps.native.outputs.sampling_trusted_revision }}
    steps:
      - name: Check out the trusted authorization rules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the request run and its pull request
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BQ_REPOSITORY: ${{ github.repository }}
          BQ_REQUEST_RUN_ID: ${{ github.event.workflow_run.id }}
          BQ_HEAD_COMMIT: ${{ github.event.workflow_run.head_sha }}
          BQ_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 -B tools/bench_direct/authorize.py

      - name: Fetch the pinned admission bootstrap compiler
        if: ${{ steps.verify.outputs.sampling_requested == 'true' || steps.verify.outputs.preparation_requested == 'true' || steps.verify.outputs.utility_requested == 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TinyCC/tinycc
          ref: 0fb54300b56512754221d80adda85ddb9815bceb
          path: .tools/tinycc
          persist-credentials: false
      - name: Install the pinned admission bootstrap compiler
        if: ${{ steps.verify.outputs.sampling_requested == 'true' || steps.verify.outputs.preparation_requested == 'true' || steps.verify.outputs.utility_requested == 'true' }}
        working-directory: .tools/tinycc
        shell: bash
        run: |
          set -euo pipefail
          ./configure --prefix="$RUNNER_TEMP/sampling-tcc" --cc=gcc
          make -j2
          make install
          echo "$RUNNER_TEMP/sampling-tcc/bin" >> "$GITHUB_PATH"
      - name: Admit only the frozen bounded sampling packet
        if: ${{ steps.verify.outputs.sampling_requested == 'true' }}
        id: native
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh compiler_profile_qualification --admit \
            --allowlist "$RUNNER_TEMP/compiler-sampling-admission/allowlist.tsv" \
            --request "$RUNNER_TEMP/compiler-sampling-admission/request.txt" \
            --facts "$RUNNER_TEMP/compiler-sampling-admission/facts.tsv" \
            --history "$RUNNER_TEMP/compiler-sampling-admission/history.tsv" \
            --freeze "$RUNNER_TEMP/compiler-sampling-admission/freeze.tsv" \
            --parent-freeze "$RUNNER_TEMP/compiler-sampling-admission/parent-freeze.tsv" --output "$GITHUB_OUTPUT"

      - name: Admit only the separately frozen preparation experiment
        if: ${{ steps.verify.outputs.preparation_requested == 'true' }}
        id: preparation
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh compiler_profile_qualification --admit-preparation \
            "$RUNNER_TEMP/compiler-preparation-admission/allowlist.tsv" \
            "$RUNNER_TEMP/compiler-preparation-admission/request.txt" \
            "$RUNNER_TEMP/compiler-preparation-admission/facts.tsv" \
            "$RUNNER_TEMP/compiler-preparation-admission/history.tsv" \
            "$RUNNER_TEMP/compiler-preparation-admission/plan.tsv" \
            "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$GITHUB_OUTPUT"

      - name: Admit only the separately frozen closure utility experiment
        if: ${{ steps.verify.outputs.utility_requested == 'true' }}
        id: utility
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh compiler_profile_qualification --admit-utility \
            "$RUNNER_TEMP/compiler-utility-admission/allowlist.tsv" \
            "$RUNNER_TEMP/compiler-utility-admission/request.txt" \
            "$RUNNER_TEMP/compiler-utility-admission/facts.tsv" \
            "$RUNNER_TEMP/compiler-utility-admission/history.tsv" \
            "$RUNNER_TEMP/compiler-utility-admission/plan.tsv" \
            "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$GITHUB_OUTPUT"

  # "Re-run failed jobs" reuses the outputs of jobs that succeeded in an
  # earlier attempt, so bench requires authorize to have passed in this same
  # attempt; a maintainer re-run must use "Re-run all jobs".
  utility-queue:
    name: Queue compiler closure utility
    needs: authorize
    if: ${{ vars.BENCH_DIRECT_ENABLED == 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.path == '.github/workflows/9700x-direct-request.yml' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'davidgmbb' && github.event.workflow_run.actor.id == 39247043 && github.event.workflow_run.triggering_actor.login == 'davidgmbb' && github.event.workflow_run.triggering_actor.id == 39247043 && (github.run_attempt == 1 || github.triggering_actor == 'davidgmbb') && needs.authorize.outputs.attempt == format('{0}', github.run_attempt) && needs.authorize.outputs.request_head == github.event.workflow_run.head_sha && github.run_attempt == 1 && github.event.workflow_run.run_attempt == 1 && needs.authorize.outputs.utility_admitted == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    timeout-minutes: 5
    concurrency:
      group: buster-9700x-check-writer
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out the frozen utility implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.utility_trusted_revision }}
          persist-credentials: false
      - name: Fetch the pinned utility bootstrap compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TinyCC/tinycc
          ref: 0fb54300b56512754221d80adda85ddb9815bceb
          path: .tools/tinycc
          persist-credentials: false
      - name: Install the pinned utility bootstrap compiler
        working-directory: .tools/tinycc
        shell: bash
        run: |
          set -euo pipefail
          ./configure --prefix="$RUNNER_TEMP/qualification-tcc" --cc=gcc
          make -j2
          make install
          echo "$RUNNER_TEMP/qualification-tcc/bin" >> "$GITHUB_PATH"
      - name: Queue the exact unqualified research attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BQ_REPOSITORY: ${{ github.repository }}
          BQ_HEAD_COMMIT: ${{ github.event.workflow_run.head_sha }}
          BQ_REQUEST_RUN_ID: ${{ github.event.workflow_run.id }}
          BQ_REQUEST_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          BQ_RUN_ID: ${{ github.run_id }}
          BQ_RUN_ATTEMPT: ${{ github.run_attempt }}
          BQ_TRUSTED_REVISION: ${{ github.sha }}
          BQ_AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          BQ_AUTHORIZED_ATTEMPT: ${{ needs.authorize.outputs.attempt }}
          BQ_UTILITY_PHASE: ${{ needs.authorize.outputs.utility_phase }}
          BQ_UTILITY_PACKET: ${{ needs.authorize.outputs.utility_packet }}
          BQ_UTILITY_FAMILY: ${{ needs.authorize.outputs.utility_family }}
          BQ_UTILITY_CANDIDATE_TREE: ${{ needs.authorize.outputs.utility_candidate_tree }}
          BQ_UTILITY_WORKER_SECONDS: ${{ needs.authorize.outputs.utility_worker_seconds }}
          BQ_UTILITY_RESERVATION_SECONDS: ${{ needs.authorize.outputs.utility_reservation_seconds }}
          BQ_UTILITY_TIMEOUT_MINUTES: ${{ needs.authorize.outputs.utility_timeout_minutes }}
          BQ_UTILITY_PLAN_REVISION: ${{ needs.authorize.outputs.utility_plan_revision }}
          BQ_UTILITY_PLAN_SHA256: ${{ needs.authorize.outputs.utility_plan_sha256 }}
          BQ_UTILITY_PROTOCOL_SHA256: ${{ needs.authorize.outputs.utility_protocol_sha256 }}
          BQ_UTILITY_BASE: ${{ needs.authorize.outputs.utility_base }}
          BQ_UTILITY_BASE_TREE: ${{ needs.authorize.outputs.utility_base_tree }}
          BQ_UTILITY_PULL_HEAD: ${{ needs.authorize.outputs.utility_pull_head }}
          BQ_UTILITY_CANDIDATE_REVISION: ${{ needs.authorize.outputs.utility_candidate_revision }}
          BQ_UTILITY_TRUSTED_REVISION: ${{ needs.authorize.outputs.utility_trusted_revision }}
        run: python3 -B tools/bench_direct/compiler_publish.py utility-queue

  utility:
    name: Compiler closure utility
    needs: [authorize, utility-queue]
    if: ${{ vars.BENCH_DIRECT_ENABLED == 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.path == '.github/workflows/9700x-direct-request.yml' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'davidgmbb' && github.event.workflow_run.actor.id == 39247043 && github.event.workflow_run.triggering_actor.login == 'davidgmbb' && github.event.workflow_run.triggering_actor.id == 39247043 && (github.run_attempt == 1 || github.triggering_actor == 'davidgmbb') && needs.authorize.outputs.attempt == format('{0}', github.run_attempt) && needs.authorize.outputs.request_head == github.event.workflow_run.head_sha && github.run_attempt == 1 && github.event.workflow_run.run_attempt == 1 && needs.authorize.outputs.utility_admitted == 'true' && needs.utility-queue.result == 'success' }}
    runs-on:
      group: buster-9700x-service-dispatch
      labels: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
    timeout-minutes: ${{ fromJSON(needs.authorize.outputs.utility_timeout_minutes) }}
    env:
      BQ_PULL: ${{ needs.authorize.outputs.pull }}
      BQ_REPOSITORY: ${{ github.repository }}
      BQ_HEAD_COMMIT: ${{ github.event.workflow_run.head_sha }}
      BQ_REQUEST_RUN_ID: ${{ github.event.workflow_run.id }}
      BQ_REQUEST_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      BQ_RUN_ID: ${{ github.run_id }}
      BQ_RUN_ATTEMPT: ${{ github.run_attempt }}
      BQ_TRUSTED_REVISION: ${{ github.sha }}
      BQ_AUTHORIZE_RESULT: ${{ needs.authorize.result }}
      BQ_AUTHORIZED_ATTEMPT: ${{ needs.authorize.outputs.attempt }}
      BQ_UTILITY_PHASE: ${{ needs.authorize.outputs.utility_phase }}
      BQ_UTILITY_PACKET: ${{ needs.authorize.outputs.utility_packet }}
      BQ_UTILITY_FAMILY: ${{ needs.authorize.outputs.utility_family }}
      BQ_UTILITY_CANDIDATE_TREE: ${{ needs.authorize.outputs.utility_candidate_tree }}
      BQ_UTILITY_WORKER_SECONDS: ${{ needs.authorize.outputs.utility_worker_seconds }}
      BQ_UTILITY_RESERVATION_SECONDS: ${{ needs.authorize.outputs.utility_reservation_seconds }}
      BQ_UTILITY_TIMEOUT_MINUTES: ${{ needs.authorize.outputs.utility_timeout_minutes }}
      BQ_UTILITY_PLAN_REVISION: ${{ needs.authorize.outputs.utility_plan_revision }}
      BQ_UTILITY_PLAN_SHA256: ${{ needs.authorize.outputs.utility_plan_sha256 }}
      BQ_UTILITY_PROTOCOL_SHA256: ${{ needs.authorize.outputs.utility_protocol_sha256 }}
      BQ_UTILITY_BASE: ${{ needs.authorize.outputs.utility_base }}
      BQ_UTILITY_BASE_TREE: ${{ needs.authorize.outputs.utility_base_tree }}
      BQ_UTILITY_PULL_HEAD: ${{ needs.authorize.outputs.utility_pull_head }}
      BQ_UTILITY_CANDIDATE_REVISION: ${{ needs.authorize.outputs.utility_candidate_revision }}
      BQ_UTILITY_TRUSTED_REVISION: ${{ needs.authorize.outputs.utility_trusted_revision }}
      BQ_UTILITY_PLAN_DATA: ${{ needs.authorize.outputs.utility_plan_data }}
      BQ_UTILITY_REQUEST_DATA: ${{ needs.authorize.outputs.utility_request_data }}
      BQ_UTILITY_ALLOWLIST_DATA: ${{ needs.authorize.outputs.utility_allowlist_data }}
      BQ_UTILITY_FACTS_DATA: ${{ needs.authorize.outputs.utility_facts_data }}
      BQ_UTILITY_HISTORY_DATA: ${{ needs.authorize.outputs.utility_history_data }}
    steps:
      - name: Refuse retained native cleanup uncertainty
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /tmp/buster-9700x-cleanup-unknown-v1 || -L /tmp/buster-9700x-cleanup-unknown-v1 ||
                -e /tmp/buster-9700x-cleanup-active-v1 || -L /tmp/buster-9700x-cleanup-active-v1 ]]; then
            echo '::error::Native cleanup ownership is retained; manual review is required before host admission.'
            exit 1
          fi
      - name: Check out the frozen measurement harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.utility_trusted_revision }}
          path: trusted
          persist-credentials: false
      - name: Observe the actual physical job start
        shell: bash
        env:
          BQ_PHYSICAL_CLOCK_KIND: utility
        run: |
          set -euo pipefail
          python3 -B trusted/tools/bench_direct/compiler_publish.py physical-clock
      - name: Run only the admitted native utility packet
        shell: bash
        run: |
          set -euo pipefail
          trusted/build.sh compiler_profile_qualification --execute-utility \
            --trusted-root "$PWD/trusted" --cleanup-root "$RUNNER_TEMP" \
            --evidence "$RUNNER_TEMP/compiler-utility-evidence"
      - name: Retain every utility attempt as data
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buster-9700x-utility-${{ github.event.workflow_run.head_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compiler-utility-evidence
          if-no-files-found: warn
          retention-days: 90

  utility-publish:
    name: Validate compiler closure utility evidence
    needs: [authorize, utility-queue, utility]
    if: ${{ always() && vars.BENCH_DIRECT_ENABLED == 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.path == '.github/workflows/9700x-direct-request.yml' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login == 'davidgmbb' && github.event.workflow_run.actor.id == 39247043 && github.event.workflow_run.triggering_actor.login == 'davidgmbb' && github.event.workflow_run.triggering_actor.id == 39247043 && (github.run_attempt == 1 || github.triggering_actor == 'davidgmbb') && needs.authorize.outputs.attempt == format('{0}', github.run_attempt) && needs.authorize.outputs.request_head == github.event.workflow_run.head_sha && github.run_attempt == 1 && github.event.workflow_run.run_attempt == 1 && needs.authorize.outputs.utility_admitted == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
    timeout-minutes: 10
    concurrency:
      group: buster-9700x-check-writer
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out the frozen utility implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.utility_trusted_revision }}
          persist-credentials: false
      - name: Fetch the pinned utility bootstrap compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TinyCC/tinycc
          ref: 0fb54300b56512754221d80adda85ddb9815bceb
          path: .tools/tinycc
          persist-credentials: false
      - name: Install the pinned utility bootstrap compiler
        working-directory: .tools/tinycc
        shell: bash
        run: |
