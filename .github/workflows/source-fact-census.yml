# Disposable hosted measurement for the source-fact-flow redesign. It lives
# only on an isolated measurement branch and is removed after its run; it is
# not proposed for main. Every variant is checked out by exact commit.
#
# Every binary is built for x86-64-v3 so callgrind runs on any hosted CPU, and
# every stage-1 compile targets -march=znver3 so artifacts compare across
# runners. Every job compiles the same stage-1 input (the main tree, configured
# at the same path), so callgrind and census counts measure one workload.
# Each census variant also builds the census baseline in the same job,
# so its corpus comparison and census deltas are same-runner. Results are
# printed to the job log (and uploaded) between REPORT markers.
name: Source-fact census (disposable)

on:
  push:
    branches: ['claude/fervent-cray-zlsgsj-census-run']

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: main, sha: 'ade6ac4b6ecb21f30b61b656439bac476c145e2f', census: false}
          - {variant: census, sha: '398ad5788701531e36dc53671a5cba9c27a39592', census: true}
          - {variant: string-counts, sha: '42866ace3cf380ffaf5d5c1f1ef8dc1953d879bd', census: true}
          - {variant: integer-facts, sha: '02096ca3993ce5a5e0ba15f54d96dbc20cd58d37', census: true}
          - {variant: decode-once, sha: 'f1cac5523adc0d162622e4f4b76b6db6f86fd840', census: true}
          - {variant: combined, sha: 'db88d935dee8ae505e908067da58167d34bcad4d', census: true}
    env:
      BASELINE_SHA: '398ad5788701531e36dc53671a5cba9c27a39592'
      INPUT_SHA: 'ade6ac4b6ecb21f30b61b656439bac476c145e2f'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Toolchain and variant
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind ninja-build > /dev/null
          git checkout --quiet --detach '${{ matrix.sha }}'
          git worktree add --quiet --detach "$RUNNER_TEMP/baseline" "$BASELINE_SHA"
          git worktree add --quiet --detach "$RUNNER_TEMP/input" "$INPUT_SHA"
          for tree in . "$RUNNER_TEMP/baseline"; do
            sed -i 's/^set(GNU_FAMILY_NATIVE_TARGET -march=native)$/set(GNU_FAMILY_NATIVE_TARGET -march=x86-64-v3)/' "$tree/CMakeLists.txt"
            grep -q '^set(GNU_FAMILY_NATIVE_TARGET -march=x86-64-v3)$' "$tree/CMakeLists.txt"
          done
          mkdir -p "$RUNNER_TEMP/out"
          {
            echo "variant=${{ matrix.variant }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "baseline=$(git -C "$RUNNER_TEMP/baseline" rev-parse HEAD)"
            echo "input=$(git -C "$RUNNER_TEMP/input" rev-parse HEAD)"
            echo "cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
            echo "avx512f=$(grep -m1 -c avx512f /proc/cpuinfo || true)"
            echo "nproc=$(nproc)"
            clang --version | head -1
            cmake --version | head -1
            valgrind --version
          } | tee "$RUNNER_TEMP/out/identity.txt"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/build-driver"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver"
          (cd "$RUNNER_TEMP/input" && "$driver" generate --build-directory build/input --cc clang --config Release --linker DEFAULT -- -DBUSTER_INCLUDE_TESTS=OFF > /dev/null)
          "$driver" generate --build-directory build/plain --cc clang --config Release --linker DEFAULT -- -DBUSTER_DEBUG_INFO=ON -DBUSTER_INCLUDE_TESTS=OFF
          "$driver" build --build-directory build/plain --config Release -t ide
          sha256sum build/plain/Release/ide | tee -a "$RUNNER_TEMP/out/identity.txt"
          if [ '${{ matrix.census }}' = 'true' ]; then
            "$driver" generate --build-directory build/census --cc clang --config Release --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF -DBUSTER_BENCH_ALLOCATIONS=ON -DBUSTER_INCLUDE_TESTS=OFF
            "$driver" build --build-directory build/census --config Release -t ide
            sha256sum build/census/Release/ide | tee -a "$RUNNER_TEMP/out/identity.txt"
            cd "$RUNNER_TEMP/baseline"
            "$driver" generate --build-directory build/census --cc clang --config Release --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF -DBUSTER_BENCH_ALLOCATIONS=ON -DBUSTER_INCLUDE_TESTS=OFF
            "$driver" build --build-directory build/census --config Release -t ide
            sha256sum build/census/Release/ide | tee -a "$RUNNER_TEMP/out/identity.txt"
          fi

      - name: Stage-1 census and artifact identity
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          in="$RUNNER_TEMP/input"
          stage1=(-I"$in/src" -I"$in/build/input/generated" -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -march=znver3 "$in/src/buster/apps/ide/ide.c")
          build/plain/Release/ide cc "${stage1[@]}" -g0 -c -o "$out/stage1-plain.o"
          sha256sum "$out/stage1-plain.o" | tee "$out/stage1-hashes.txt"
          if [ '${{ matrix.census }}' = 'true' ]; then
            build/census/Release/ide cc "${stage1[@]}" -g0 -c -fsource-metrics="$out/stage1.metrics" -o "$out/stage1-census.o"
            "$RUNNER_TEMP/baseline/build/census/Release/ide" cc "${stage1[@]}" -g0 -c -fsource-metrics="$out/stage1-baseline.metrics" -o "$out/stage1-baseline.o"
            sha256sum "$out/stage1-census.o" "$out/stage1-baseline.o" | tee -a "$out/stage1-hashes.txt"
            cmp "$out/stage1-plain.o" "$out/stage1-census.o"
            cmp "$out/stage1-plain.o" "$out/stage1-baseline.o"
            python3 tools/source_fact_census.py run --baseline "$RUNNER_TEMP/baseline/build/census/Release/ide" --candidate build/census/Release/ide --out "$out/corpus"
          fi

      - name: Callgrind instruction count (stage-1, -g0 -c)
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          in="$RUNNER_TEMP/input"
          valgrind --tool=callgrind --callgrind-out-file="$out/stage1.callgrind" \
            build/plain/Release/ide cc -I"$in/src" -I"$in/build/input/generated" -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -march=znver3 \
            "$in/src/buster/apps/ide/ide.c" -g0 -c -o "$out/stage1-callgrind.o" 2> "$out/callgrind.log" || { tail -40 "$out/callgrind.log"; exit 1; }
          cmp "$out/stage1-plain.o" "$out/stage1-callgrind.o"
          callgrind_annotate --inclusive=no "$out/stage1.callgrind" > "$out/callgrind-annotate.txt"
          sed -n '1,60p' "$out/callgrind-annotate.txt" > "$out/callgrind-top.txt"
          grep "PROGRAM TOTALS" "$out/callgrind-annotate.txt" | tee "$out/callgrind-total.txt"

      - name: Hosted timing (supporting only)
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          in="$RUNNER_TEMP/input"
          : > "$out/timing.txt"
          for run in 1 2 3 4 5 6 7; do
            /usr/bin/time -a -o "$out/timing.txt" -f "run=$run wall=%e user=%U sys=%S maxrss_kb=%M" \
              build/plain/Release/ide cc -I"$in/src" -I"$in/build/input/generated" -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -march=znver3 \
              "$in/src/buster/apps/ide/ide.c" -g0 -c -o "$out/stage1-timed.o"
          done
          cmp "$out/stage1-plain.o" "$out/stage1-timed.o"
          cat "$out/timing.txt"

      - name: Report
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/out"
          echo "=====REPORT-BEGIN ${{ matrix.variant }}"
          for f in identity.txt stage1-hashes.txt callgrind-total.txt timing.txt; do
            echo "---- $f"; cat "$out/$f" 2>/dev/null
          done
          if [ -f "$out/stage1.metrics" ]; then
            echo "---- stage1 census (baseline candidate)"
            python3 - "$out/stage1-baseline.metrics" "$out/stage1.metrics" <<'PYTHON'
          import sys
          def load(path):
              facts = {}
              for line in open(path):
                  if line.startswith('c_census.'):
                      key, _, value = line.strip().partition('=')
                      facts[key] = value
              return facts
          baseline, candidate = load(sys.argv[1]), load(sys.argv[2])
          for key in sorted(set(baseline) | set(candidate)):
              print(f"{key}={baseline.get(key, 'absent')}={candidate.get(key, 'absent')}")
          PYTHON
            echo "---- stage1 other metrics (candidate)"
            grep -E '^(unique|lexed|preprocessed)\.' "$out/stage1.metrics" | sed -n '1,40p'
          fi
          if [ -f "$out/corpus/census.md" ]; then
            echo "---- corpus census.md"; cat "$out/corpus/census.md"
          fi
          echo "---- callgrind top"; cat "$out/callgrind-top.txt" 2>/dev/null
          echo "=====REPORT-END ${{ matrix.variant }}"
          {
            echo "### ${{ matrix.variant }}"
            echo '```'
            cat "$out/identity.txt" "$out/stage1-hashes.txt" "$out/callgrind-total.txt" "$out/timing.txt" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: source-fact-census-${{ matrix.variant }}
          path: ${{ runner.temp }}/out
          retention-days: 30
