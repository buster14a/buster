name: Patch issue 55 clean tree

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-issue-55-clean-tree.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Make clean-tree validation include untracked sources
        shell: python
        run: |
          from pathlib import Path

          def replace_region(source: str, start: str, end: str, replacement: str, description: str) -> str:
              if source.count(start) != 1 or source.count(end) != 1:
                  raise SystemExit(f"could not identify exactly one {description} region")
              prefix, tail = source.split(start, 1)
              _, suffix = tail.split(end, 1)
              return prefix + replacement + end + suffix

          c_path = Path("tools/production_profile.c")
          c_source = c_path.read_text(encoding="utf-8")
          c_start = '    String8 diff[] = {git, S8("diff"), S8("--quiet"), S8("--")};\n'
          c_end = '    String8 revision_command[] = {git, S8("rev-parse"), S8("--verify"), S8("HEAD")};\n'
          c_new = "\n".join((
              '    String8 status_command[] = {',
              '        git, S8("status"), S8("--porcelain=v1"), S8("--untracked-files=all"), S8("--"), S8("."),',
              '        S8(":(exclude)build"), S8(":(exclude)build/**"),',
              '    };',
              '    ProductionProfileCommandResult status = production_profile_capture(',
              '        arena, (SliceString8)BUSTER_ARRAY_TO_SLICE(status_command));',
              '    if (!status.success || production_profile_trim(status.output).length)',
              '    {',
              '        if (status.output.length)',
              '        {',
              '            os_file_write(os_get_standard_stream(STANDARD_STREAM_ERROR), BUSTER_SLICE_TO_BYTE_SLICE(status.output));',
              '        }',
              '        string_print(S8("error: production_profile requires a clean source tree outside build/\\n"));',
              '        return PROCESS_RESULT_FAILED;',
              '    }',
              '',
          ))
          c_path.write_text(replace_region(c_source, c_start, c_end, c_new, "native clean-tree"), encoding="utf-8")

          cmake_path = Path("CMakeLists.txt")
          cmake_source = cmake_path.read_text(encoding="utf-8")
          cmake_start = "\n".join((
              '    execute_process(',
              '        COMMAND "${BUSTER_PGO_GIT_EXECUTABLE}" diff --quiet --',
          )) + "\n"
          cmake_end = '    if (NOT BUSTER_PGO_MANIFEST_SOURCE_REVISION STREQUAL BUSTER_PGO_CURRENT_SOURCE_REVISION)\n'
          cmake_new = "\n".join((
              '    execute_process(',
              '        COMMAND "${BUSTER_PGO_GIT_EXECUTABLE}" status --porcelain=v1 --untracked-files=all -- . ":(exclude)build" ":(exclude)build/**"',
              '        WORKING_DIRECTORY "${CMAKE_SOURCE_DIR}"',
              '        OUTPUT_VARIABLE BUSTER_PGO_SOURCE_STATUS',
              '        OUTPUT_STRIP_TRAILING_WHITESPACE',
              '        RESULT_VARIABLE BUSTER_PGO_SOURCE_STATUS_RESULT',
              '    )',
              '    if (NOT BUSTER_PGO_CURRENT_SOURCE_REVISION_RESULT EQUAL 0 OR',
              '        NOT BUSTER_PGO_CURRENT_SOURCE_TREE_RESULT EQUAL 0 OR',
              '        NOT BUSTER_PGO_SOURCE_STATUS_RESULT EQUAL 0 OR',
              '        NOT BUSTER_PGO_SOURCE_STATUS STREQUAL "")',
              '        message(FATAL_ERROR "PGO use requires a clean Git checkout outside build/ with a readable HEAD and tree")',
              '    endif()',
              '',
          ))
          cmake_path.write_text(replace_region(cmake_source, cmake_start, cmake_end, cmake_new, "CMake clean-tree"), encoding="utf-8")

      - name: Compile and exercise the patched driver
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'S8("--untracked-files=all")' tools/production_profile.c
          grep -Fq 'status --porcelain=v1 --untracked-files=all' CMakeLists.txt
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable \
            build.c -o "$RUNNER_TEMP/build-issue-55"
          "$RUNNER_TEMP/build-issue-55" production_profile_self_test

      - name: Commit the repair to the pull-request branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CMakeLists.txt tools/production_profile.c
          git commit -m "build: reject untracked production-profile inputs"
          git push origin "HEAD:${{ github.head_ref }}"
