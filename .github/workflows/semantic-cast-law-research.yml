name: Semantic cast law research
on:
  push:
    branches: [research/semantic-cast-law-20260925-astra]
permissions:
  contents: read
concurrency:
  group: semantic-cast-law-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  probe:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build isolated baseline and prototype; run independent probes
        shell: bash
        run: bash tools/investigations/semantic-cast-law-20260925/followup.sh
      - name: Retain complete research evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-cast-law-${{ github.run_id }}
          path: evidence
          retention-days: 30
          if-no-files-found: error
