name: Issue 84 final hardening v6

on:
  push:
    branches: [fix/84-transactional-hermetic-spawn]
    paths:
      - '.github/workflows/issue84-follow-up-v6.yml'

permissions:
  contents: write

concurrency:
  group: issue84-final-hardening-v6
  cancel-in-progress: true

jobs:
  apply-test-publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Check out issue branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/84-transactional-hermetic-spawn
          fetch-depth: 0

      - name: Recover and apply reviewed transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          workflow = Path('.github/workflows/issue84-follow-up-v4.yml').read_text(encoding='utf-8')
          marker = 'cat > "$RUNNER_TEMP/issue84-transform.py.gz.b64" <<\'PYTHON\'\n'
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n          PYTHON', start)
          payload = ''.join(line.strip() for line in workflow[start:end].splitlines())
          Path('/tmp/issue84-transform.py').write_bytes(gzip.decompress(base64.b64decode(payload, validate=True)))
          PY
          printf '%s  %s\n' d18d60bd7da5346620885c82aa27e48eaee5c3eb631657f9d9ad073861dafad4 /tmp/issue84-transform.py | sha256sum --check --strict
          python3 -m py_compile /tmp/issue84-transform.py
          python3 /tmp/issue84-transform.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/buster/lib/os.c')
          text = path.read_text(encoding='utf-8')
          old = '''BUSTER_GLOBAL_LOCAL int os_process_spawn_set_cloexec(int descriptor)
          {
              int result = 0;
              int flags;
              do
              {
                  flags = fcntl(descriptor, F_GETFD);
              } while (flags < 0 && errno == EINTR);
              if (flags < 0)
              {
                  result = errno;
              }
              else
              {
                  int status;
                  do
                  {
                      status = fcntl(descriptor, F_SETFD, flags | FD_CLOEXEC);
                  } while (status < 0 && errno == EINTR);
                  if (status < 0)
                  {
                      result = errno;
                  }
              }
              return result;
          }
          '''
          new = '''#if !defined(__linux__) || !defined(F_DUPFD_CLOEXEC)
          BUSTER_GLOBAL_LOCAL int os_process_spawn_set_cloexec(int descriptor)
          {
              int result = 0;
              int flags;
              do
              {
                  flags = fcntl(descriptor, F_GETFD);
              } while (flags < 0 && errno == EINTR);
              if (flags < 0)
              {
                  result = errno;
              }
              else
              {
                  int status;
                  do
                  {
                      status = fcntl(descriptor, F_SETFD, flags | FD_CLOEXEC);
                  } while (status < 0 && errno == EINTR);
                  if (status < 0)
                  {
                      result = errno;
                  }
              }
              return result;
          }
          #endif
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one cloexec helper, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Build and run registered Linux tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o build/build
          build/build generate --cc clang --ci --linker DEFAULT
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o build/build
          BUSTER_TEST_JOBS=1 CMAKE_BUILD_PARALLEL_LEVEL=2 build/build build --config Debug -t ide
          BUSTER_TEST_JOBS=1 build/Debug/ide test --ci=1

      - name: Commit hardened implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue84-follow-up.yml \
             .github/workflows/issue84-follow-up-v2.yml \
             .github/workflows/issue84-follow-up-v3.yml \
             .github/workflows/issue84-follow-up-v4.yml \
             .github/workflows/issue84-follow-up-v5.yml \
             .github/workflows/issue84-follow-up-v6.yml
          git add \
            .github/workflows/issue84-follow-up.yml \
            .github/workflows/issue84-follow-up-v2.yml \
            .github/workflows/issue84-follow-up-v3.yml \
            .github/workflows/issue84-follow-up-v4.yml \
            .github/workflows/issue84-follow-up-v5.yml \
            .github/workflows/issue84-follow-up-v6.yml \
            src/buster/lib/os.c \
            src/buster/apps/ide/ide.c \
            src/buster/tests/os_test.c
          cat > "$RUNNER_TEMP/expected-paths" <<'PATHS'
          .github/workflows/issue84-follow-up-v2.yml
          .github/workflows/issue84-follow-up-v3.yml
          .github/workflows/issue84-follow-up-v4.yml
          .github/workflows/issue84-follow-up-v5.yml
          .github/workflows/issue84-follow-up-v6.yml
          .github/workflows/issue84-follow-up.yml
          src/buster/apps/ide/ide.c
          src/buster/lib/os.c
          src/buster/tests/os_test.c
          PATHS
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-paths"
          sort "$RUNNER_TEMP/expected-paths" -o "$RUNNER_TEMP/expected-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(os): complete transactional spawn hardening'
          git push origin HEAD:fix/84-transactional-hermetic-spawn
