name: Z09 audit verification and coordination
on:
  push:
    branches: [astra/z09-pass-census-transport-20260909]
    paths: [.github/workflows/z09-audit-publish.yml]
permissions:
  contents: write
  issues: read
  pull-requests: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d60fd28ae58e8a2af18e0d37f659d51ea2ef6aa8
          persist-credentials: false
      - name: Compare audit checks and publish unreferenced documentation tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/z09-audit"
          python3 - <<'PY'
          import base64, importlib.util, json, os, pathlib, subprocess, urllib.request
          root = 'https://api.github.com/repos/buster14a/buster'
          parent = 'd60fd28ae58e8a2af18e0d37f659d51ea2ef6aa8'
          baseline = 'ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae'
          audit_id = '2026-09-10T011947Z'
          audit_blob = 'cbbda3e8cc582b6ff4fd0c04188f644e8f329c93'
          expected_tree = '9241711c7879c88059c5fba4ebf75e595ac27b85'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'z09-audit'
          def request(endpoint, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(root + endpoint, data=body, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def pages(endpoint):
              rows = []
              page = 1
              while True:
                  batch = request(endpoint + ('&' if '?' in endpoint else '?') + 'per_page=100&page=' + str(page))
                  rows.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return rows
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def audit_check(label):
              result = subprocess.run(['python3', 'tools/new_audit.py', '--check'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              (out / (label + '.log')).write_text(result.stdout)
              print(label, 'exit=', result.returncode, result.stdout)
              return result
          assert git('rev-parse', 'HEAD') == parent
          before = audit_check('audit-before')
          spec = importlib.util.spec_from_file_location('audit_tool', 'tools/new_audit.py')
          tool = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(tool)
          path = pathlib.Path(tool.create(str(pathlib.Path.cwd()), audit_id, 'Linux x86-64 hosted Xeon Platinum 8370C VM, Clang 21.1.8', 'Z09 shared parameter-cleanup census; no optimization accepted'))
          blob = request('/git/blobs/' + audit_blob)
          assert blob['encoding'] == 'base64'
          path.write_bytes(base64.b64decode(blob['content']))
          assert git('hash-object', str(path)) == audit_blob
          assert git('hash-object', 'PERFORMANCE_AUDITS.md') == '6f3af6993173b8e2dcf71ff5c7c12b711c302431'
          after = audit_check('audit-after')
          (out / 'audit-checks.json').write_text(json.dumps({'before_exit': before.returncode, 'after_exit': after.returncode, 'before': before.stdout, 'after': after.stdout}, indent=2))
          assert (before.returncode, before.stdout) == (after.returncode, after.stdout), 'New audit-check failure'
          subprocess.run(['git', 'add', 'PERFORMANCE_AUDITS.md', str(path)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          assert git('write-tree') == expected_tree
          evidence = {'main': request('/branches/main')['commit']['sha'], 'candidate': request('/pulls/371')['head']['sha'], 'open_prs': [], 'issue40_comments': pages('/issues/40/comments')}
          owned = {'src/buster/lib/compiler/ir/ir.h', 'src/buster/lib/compiler/ir/ir_promote.c', 'src/buster/lib/compiler/driver/driver.c', 'src/buster/apps/ide/ide.c', 'src/buster/tests/compiler/ir/ir_promotion_test.c', 'docs/agents/driver.md', 'docs/middle-end-pass-map.md', 'PERFORMANCE_AUDITS.md', str(path.relative_to(pathlib.Path.cwd()))}
          for pr in pages('/pulls?state=open&sort=created&direction=asc'):
              if pr['number'] == 371:
                  continue
              files = pages('/pulls/' + str(pr['number']) + '/files')
              overlap = sorted(owned.intersection(row['filename'] for row in files))
              evidence['open_prs'].append({'number': pr['number'], 'head': pr['head']['sha'], 'files': files, 'overlap': overlap})
              print('PR', pr['number'], 'overlap', overlap)
          (out / 'coordination.json').write_text(json.dumps(evidence, indent=2))
          assert evidence['main'] == baseline, ('Main moved', evidence['main'])
          assert evidence['candidate'] == parent, ('PR head moved', evidence['candidate'])
          assert not any(set(pr['overlap']) - {'PERFORMANCE_AUDITS.md'} for pr in evidence['open_prs']), 'Shared production overlap requires review'
          index = request('/git/blobs', {'content': pathlib.Path('PERFORMANCE_AUDITS.md').read_text(), 'encoding': 'utf-8'})
          assert index['sha'] == '6f3af6993173b8e2dcf71ff5c7c12b711c302431'
          tree = request('/git/trees', {'base_tree': 'c6afd57f05e4acee8f9b49f73cdad4a194ee1a89', 'tree': [
              {'path': 'PERFORMANCE_AUDITS.md', 'mode': '100644', 'type': 'blob', 'sha': index['sha']},
              {'path': 'docs/performance-audits/' + audit_id + '.md', 'mode': '100644', 'type': 'blob', 'sha': audit_blob}]})
          assert tree['sha'] == expected_tree
          (out / 'manifest.json').write_text(json.dumps({'parent': parent, 'tree': tree['sha'], 'main': evidence['main'], 'audit_check_exit': after.returncode}, indent=2))
          print('VERIFIED_TREE', tree['sha'])
          print('No branch refs or pull requests were changed by this job.')
          # Preserve the full check's failure: matching a pre-existing problem
          # is provenance evidence, not permission to turn a failing check green.
          raise SystemExit(after.returncode)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: z09-audit-coordination
          path: ${{ runner.temp }}/z09-audit
          if-no-files-found: error
          retention-days: 7
