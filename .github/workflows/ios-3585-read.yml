name: Read retained iOS attribution 3585
on:
  push:
    branches: [codex/3585-read-ios-attribution]
permissions:
  actions: read
jobs:
  read:
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - name: Read exact retained simulator evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          timeout 30s gh api /repos/buster14a/buster/actions/artifacts/11710528798/zip > "$RUNNER_TEMP/ios-3585.zip"
          for configuration in Release Debug; do
            echo "IOS_RETAINED_CONFIGURATION=$configuration artifact=11710528798 subject=e87fbc30c32aa352de1c6e28a844da3b86870ed4"
            timeout 10s unzip -p "$RUNNER_TEMP/ios-3585.zip" "ios-console.$configuration.log" | grep -aE '^BUSTER_IOS_(LAUNCH_V1|RESULT:)|^TEST_MODULE_TIMING |^TEST_FIXTURE_TIMING_V1 .*module=c_frontend_tests |^\[.*(Unit|Module) tests'
          done
