name: Arena ownership evidence (branch-only)

# Isolated investigation for #53. No benchmark host, deployment, or production changes.
on:
  push:
    branches: [astra/53-arena-ownership-evidence-20260925]
    paths:
      - .github/workflows/arena-owner-evidence.yml
      - tools/experiments/arena-owner/**

permissions:
  contents: read

jobs:
  source:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Retain exact investigation source
        shell: bash
        run: |
          set -euo pipefail
          source=ade6ac4b6ecb21f30b61b656439bac476c145e2f
          expected_tree=4c5306221fdb22fccc929b55e333163742de17d0
          test "$(git rev-parse "$source^{tree}")" = "$expected_tree"
          mkdir -p "$RUNNER_TEMP/arena-owner-evidence"
          git archive --format=tar.gz "$source" > "$RUNNER_TEMP/arena-owner-evidence/source.tar.gz"
          {
            printf 'source_commit=%s\nsource_tree=%s\nworkflow_commit=%s\n' "$source" "$expected_tree" "$GITHUB_SHA"
            printf 'run_id=%s\nattempt=%s\nclassification=source-only; no correctness or performance result\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            sha256sum "$RUNNER_TEMP/arena-owner-evidence/source.tar.gz"
          } > "$RUNNER_TEMP/arena-owner-evidence/identity.txt"
      - name: Retain source evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arena-owner-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arena-owner-evidence/
          if-no-files-found: error
          retention-days: 7
