name: Logical-chain work probe
on:
  push:
    branches: ['codex/3621-linear-logical-chain-work']
permissions:
  contents: read
concurrency:
  group: logical-chain-probe-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      BUSTER_TEST_JOBS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap hosted driver
        run: |
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/buster-3621"
          git rev-parse HEAD
          lscpu
      - name: Same-machine Release baseline then candidate
        run: |
          git checkout --detach b6536b670b43715bb5a6e2dfaadbd8ea42707713
          "$RUNNER_TEMP/buster-3621" generate --cc clang --ci --config Release --linker DEFAULT
          "$RUNNER_TEMP/buster-3621" build --config Release -t ide -- -j2
          build/Release/ide test --module=c_frontend_tests --ci=1 --verbose=1
          git checkout --detach "$GITHUB_SHA"
          "$RUNNER_TEMP/buster-3621" build --config Release -t ide -- -j2
          build/Release/ide test --module=c_frontend_tests --ci=1 --verbose=1
      - name: Same-machine sanitized baseline then candidate
        run: |
          git checkout --detach b6536b670b43715bb5a6e2dfaadbd8ea42707713
          "$RUNNER_TEMP/buster-3621" generate --cc clang --ci --sanitize --fuzz --config Release --linker DEFAULT
          "$RUNNER_TEMP/buster-3621" build --config Release -t ide -- -j2
          build/Release/ide test --module=c_frontend_tests --ci=1 --verbose=1
          git checkout --detach "$GITHUB_SHA"
          "$RUNNER_TEMP/buster-3621" build --config Release -t ide -- -j2
          build/Release/ide test --module=c_frontend_tests --ci=1 --verbose=1
