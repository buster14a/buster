name: Native retirement durable archive

on:
  push:
    branches: [codex/issue510-durable-evidence]
  workflow_dispatch:

concurrency:
  group: native-retirement-archive-eb1bef2
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVIDENCE_TAG: native-retirement-evidence-eb1bef2
  CONTRACT: docs/performance-audits/evidence/2026-09-12-retirement/archive-contract.json

jobs:
  census_replay:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Download and replay census archive
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check out replay implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download published census and source assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/release-assets"
          gh release download "$EVIDENCE_TAG" --dir "$RUNNER_TEMP/release-assets" \
            --pattern archive-manifest.json --pattern SHA256SUMS \
            --pattern native-retirement-eb1bef2-34714527496.zip \
            --pattern buster-validation-source-38f150f.tar.gz \
            --pattern buster-candidate-source-eb1bef2.tar.gz \
            --pattern buster-direct-oracle-source-3e912a3.tar.gz
      - name: Verify destination bytes and extract census
        run: >-
          python3 tools/native_retirement_archive.py verify-census
          --assets "$RUNNER_TEMP/release-assets"
          --output "$RUNNER_TEMP/census"
          --cleanup
      - name: Restore pinned source snapshots
        run: |
          mkdir "$RUNNER_TEMP/source"
          tar -xzf "$RUNNER_TEMP/release-assets/buster-validation-source-38f150f.tar.gz" -C "$RUNNER_TEMP/source"
          tar -xzf "$RUNNER_TEMP/release-assets/buster-candidate-source-eb1bef2.tar.gz" -C "$RUNNER_TEMP/source"
          tar -xzf "$RUNNER_TEMP/release-assets/buster-direct-oracle-source-3e912a3.tar.gz" -C "$RUNNER_TEMP/source"
      - name: Restore tracked input omitted by Actions hidden-file packaging
        run: >-
          python3 tools/native_retirement_archive.py restore-census-inputs
          --evidence "$RUNNER_TEMP/census/candidate/evidence"
          --source "$RUNNER_TEMP/source/buster-candidate-eb1bef2"
      - name: Rebuild the direct oracle from its archived source
        working-directory: ${{ runner.temp }}/source/buster-direct-oracle-3e912a3
        run: |
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/direct-build"
          "$RUNNER_TEMP/direct-build" generate --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/direct-build" build --config Release -t ide
      - name: Replay census join and byte validator
        working-directory: ${{ runner.temp }}/census/candidate/evidence
        run: |
          mv census-integrated-joined-v3 census-integrated-joined-recorded-v3
          cp "$RUNNER_TEMP/source/buster-validation-38f150f/docs/performance-audits/evidence/2026-09-12-retirement/join-census.py" .
          cp "$RUNNER_TEMP/source/buster-validation-38f150f/docs/performance-audits/evidence/2026-09-12-retirement/validate-census-v2.py" .
          clang -O2 -fPIC -shared -I"$RUNNER_TEMP/source/buster-candidate-eb1bef2/src" \
            "$RUNNER_TEMP/source/buster-candidate-eb1bef2/src/buster/lib/hash.c" -o libcensus_hash.so
          python3 "$PWD/join-census.py" census-integrated 4
          python3 "$PWD/validate-census-v2.py" census-integrated 4
      - name: Record successful census round trip
        run: >-
          python3 tools/native_retirement_archive.py census-receipt
          --manifest "$RUNNER_TEMP/release-assets/archive-manifest.json"
          --report "$RUNNER_TEMP/census/candidate/evidence/census-integrated-validated-v2.json"
          --recorded "$RUNNER_TEMP/census/candidate/evidence/census-integrated-joined-recorded-v3"
          --replayed "$RUNNER_TEMP/census/candidate/evidence/census-integrated-joined-v3"
          --archived-reference "$RUNNER_TEMP/census/candidate/evidence/census-integrated-0/baseline-ide.exe"
          --rebuilt-reference "$RUNNER_TEMP/source/buster-direct-oracle-3e912a3/build/Release/ide"
          --run-id "${{ github.run_id }}"
          --output "$RUNNER_TEMP/census-replay-${{ github.run_id }}.json"
      - name: Publish census replay receipt
        env:
          GH_TOKEN: ${{ secrets.BUSTER_NATIVE_ARCHIVE_TOKEN }}
        run: gh release upload "$EVIDENCE_TAG" "$RUNNER_TEMP/census-replay-${{ github.run_id }}.json"
      - name: Retain census replay receipt with the CI run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: census-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/census-replay-${{ github.run_id }}.json
          retention-days: 7
          if-no-files-found: error

  strict_replay:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Download and replay strict archive
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check out replay implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download published strict and source assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/release-assets"
          gh release download "$EVIDENCE_TAG" --dir "$RUNNER_TEMP/release-assets" \
            --pattern archive-manifest.json --pattern SHA256SUMS \
            --pattern 'strict-retirement-eb1bef2-34714527496.zip.part-*' \
            --pattern buster-candidate-source-eb1bef2.tar.gz
      - name: Reconstruct and verify strict destination bytes
        run: >-
          python3 tools/native_retirement_archive.py verify-strict
          --assets "$RUNNER_TEMP/release-assets"
          --output "$RUNNER_TEMP/strict"
          --cleanup
      - name: Restore pinned candidate source
        run: |
          mkdir "$RUNNER_TEMP/source"
          tar -xzf "$RUNNER_TEMP/release-assets/buster-candidate-source-eb1bef2.tar.gz" -C "$RUNNER_TEMP/source"
      - name: Replay every strict configuration with sanitizer enabled
        working-directory: ${{ runner.temp }}/source/buster-candidate-eb1bef2
        run: |
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/strict-build"
          "$RUNNER_TEMP/strict-build" test_differential \
            --ide "$RUNNER_TEMP/strict/archived-ide" --cc clang \
            --strict-mir --sanitize-oracle --out "$RUNNER_TEMP/strict-replay"
      - name: Record successful strict round trip
        run: >-
          python3 tools/native_retirement_archive.py strict-receipt
          --manifest "$RUNNER_TEMP/release-assets/archive-manifest.json"
          --preflight "$RUNNER_TEMP/strict/strict-preflight.json"
          --replay "$RUNNER_TEMP/strict-replay"
          --run-id "${{ github.run_id }}"
          --output "$RUNNER_TEMP/strict-replay-${{ github.run_id }}.json"
      - name: Publish strict replay receipt
        env:
          GH_TOKEN: ${{ secrets.BUSTER_NATIVE_ARCHIVE_TOKEN }}
        run: gh release upload "$EVIDENCE_TAG" "$RUNNER_TEMP/strict-replay-${{ github.run_id }}.json"
      - name: Retain strict replay receipt with the CI run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strict-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/strict-replay-${{ github.run_id }}.json
          retention-days: 7
          if-no-files-found: error
