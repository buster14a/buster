name: Native retirement durable archive

on:
  push:
    branches: [codex/issue510-durable-evidence]
  workflow_dispatch:

concurrency:
  group: native-retirement-durable-replay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish_history:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Publish complete historical evidence bytes
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out archival contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Transfer and verify every remaining archive
        env:
          GH_TOKEN: ${{ secrets.BUSTER_NATIVE_ARCHIVE_TOKEN }}
          HISTORY_TAG: native-retirement-evidence-history-20260912
          CATALOG: docs/performance-audits/evidence/2026-09-12-retirement/history-catalog.json
        run: |
          if ! gh release view "$HISTORY_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$HISTORY_TAG" --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "Native-retirement evidence history from September 12, 2026" \
              --notes-file docs/performance-audits/evidence/2026-09-12-retirement/HISTORY-RELEASE.md \
              --prerelease
          fi
          for id in 10304875115 10304761452 10304213369 10308181383 10307414648 10305327992 10305232400 10304147437 10303853373 10303967670 10303806553 10303946160 10303052559; do
            item=$(jq -c --argjson id "$id" '.artifacts[] | select(.id == $id)' "$CATALOG")
            name=$(jq -r .name <<< "$item")
            size=$(jq -r .size <<< "$item")
            sha256=$(jq -r .sha256 <<< "$item")
            archive="$RUNNER_TEMP/$name.zip"
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "$archive"
            test "$(stat -c %s "$archive")" = "$size"
            test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$sha256"
            assets=("$archive")
            if (( size > 1900000000 )); then
              split -b 1000000000 -d -a 2 "$archive" "$archive.part-"
              rm "$archive"
              assets=("$archive".part-*)
            fi
            for asset in "${assets[@]}"; do
              asset_name=$(basename "$asset")
              local_size=$(stat -c %s "$asset")
              local_digest="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
              remote=$(gh api "repos/${{ github.repository }}/releases/tags/$HISTORY_TAG" \
                --jq ".assets[] | select(.name == \"$asset_name\") | [.size,.digest] | @tsv")
              if [[ -n "$remote" ]]; then
                read -r remote_size remote_digest <<< "$remote"
                test "$remote_size" = "$local_size"
                test "$remote_digest" = "$local_digest"
              else
                gh release upload "$HISTORY_TAG" "$asset" --repo "${{ github.repository }}"
              fi
              rm "$asset"
            done
          done

  census_replay:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Replay census archive (${{ matrix.label }})
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: eb1bef2
            tag: native-retirement-evidence-eb1bef2
            validation_ref: 38f150f7affdf458a9b394961709d659cc738bf3
            candidate_ref: eb1bef2f124c6a778a435ae1eda18ae489c489c5
            validation_asset: buster-validation-source-38f150f.tar.gz
            candidate_asset: buster-candidate-source-eb1bef2.tar.gz
            census_asset: native-retirement-eb1bef2-34714527496.zip
          - label: 2bb4ce9
            tag: native-retirement-evidence-2bb4ce9
            validation_ref: cfa63d6dd4ec60b32b7de29ba52b241181065dc5
            candidate_ref: 2bb4ce939d99c3956848ca7bc9c347f3ae8db231
            validation_asset: buster-validation-source-cfa63d6.tar.gz
            candidate_asset: buster-candidate-source-2bb4ce9.tar.gz
            census_asset: native-retirement-2bb4ce9-34718946098.zip
    steps:
      - name: Check out replay implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: validation
          persist-credentials: false
      - name: Check out pinned validation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.validation_ref }}
          path: replay-validation
          persist-credentials: false
      - name: Check out pinned candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.candidate_ref }}
          path: candidate
          persist-credentials: false
      - name: Check out pinned direct-oracle source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3e912a3c5ce9b3e905f3096ff0a0d3e68d80e46e
          path: reference
          persist-credentials: false
      - name: Download published census and source assets
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_TAG: ${{ matrix.tag }}
          CENSUS_ASSET: ${{ matrix.census_asset }}
          VALIDATION_ASSET: ${{ matrix.validation_asset }}
          CANDIDATE_ASSET: ${{ matrix.candidate_asset }}
        run: |
          mkdir "$RUNNER_TEMP/release-assets"
          gh release download "$EVIDENCE_TAG" --repo "${{ github.repository }}" --dir "$RUNNER_TEMP/release-assets" \
            --pattern archive-manifest.json --pattern SHA256SUMS \
            --pattern "$CENSUS_ASSET" --pattern "$VALIDATION_ASSET" \
            --pattern "$CANDIDATE_ASSET" --pattern buster-direct-oracle-source-3e912a3.tar.gz
      - name: Verify destination bytes and extract census
        run: |
          python3 validation/tools/native_retirement_archive.py verify-census \
            --assets "$RUNNER_TEMP/release-assets" \
            --output "$RUNNER_TEMP/census" \
            --cleanup
          test ! -e candidate/evidence
          mv "$RUNNER_TEMP/census/candidate/evidence" candidate/evidence
      - name: Restore tracked input omitted by Actions hidden-file packaging
        run: >-
          python3 validation/tools/native_retirement_archive.py restore-census-inputs
          --evidence candidate/evidence
          --source candidate
      - name: Rebuild the direct oracle from its pinned source
        working-directory: reference
        run: |
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/reference-build"
          "$RUNNER_TEMP/reference-build" generate --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/reference-build" build --config Release -t ide
      - name: Replay census join and byte validator
        working-directory: candidate/evidence
        run: |
          mv census-integrated-joined-v3 census-integrated-joined-recorded-v3
          cp "$GITHUB_WORKSPACE/replay-validation/docs/performance-audits/evidence/2026-09-12-retirement/join-census.py" .
          cp "$GITHUB_WORKSPACE/replay-validation/docs/performance-audits/evidence/2026-09-12-retirement/validate-census-v2.py" .
          clang -O2 -fPIC -shared -I"$GITHUB_WORKSPACE/candidate/src" \
            "$GITHUB_WORKSPACE/candidate/src/buster/lib/hash.c" -o libcensus_hash.so
          python3 "$PWD/join-census.py" census-integrated 4
          python3 "$PWD/validate-census-v2.py" census-integrated 4
      - name: Record successful census round trip
        run: >-
          python3 validation/tools/native_retirement_archive.py census-receipt
          --manifest "$RUNNER_TEMP/release-assets/archive-manifest.json"
          --report "$GITHUB_WORKSPACE/candidate/evidence/census-integrated-validated-v2.json"
          --recorded "$GITHUB_WORKSPACE/candidate/evidence/census-integrated-joined-recorded-v3"
          --replayed "$GITHUB_WORKSPACE/candidate/evidence/census-integrated-joined-v3"
          --archived-reference "$GITHUB_WORKSPACE/candidate/evidence/census-integrated-0/baseline-ide.exe"
          --rebuilt-reference "$GITHUB_WORKSPACE/reference/build/Release/ide"
          --run-id "${{ github.run_id }}"
          --output "$RUNNER_TEMP/census-replay-${{ matrix.label }}-${{ github.run_id }}.json"
      - name: Publish census replay receipt
        env:
          GH_TOKEN: ${{ secrets.BUSTER_NATIVE_ARCHIVE_TOKEN }}
          EVIDENCE_TAG: ${{ matrix.tag }}
        run: >-
          gh release upload "$EVIDENCE_TAG"
          "$RUNNER_TEMP/census-replay-${{ matrix.label }}-${{ github.run_id }}.json"
          --repo "${{ github.repository }}"
      - name: Retain census replay receipt with the CI run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: census-replay-${{ matrix.label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/census-replay-${{ matrix.label }}-${{ github.run_id }}.json
          retention-days: 7
          if-no-files-found: error

  strict_replay:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Replay strict archive (${{ matrix.label }})
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: eb1bef2
            tag: native-retirement-evidence-eb1bef2
            candidate_ref: eb1bef2f124c6a778a435ae1eda18ae489c489c5
            candidate_asset: buster-candidate-source-eb1bef2.tar.gz
            strict_pattern: strict-retirement-eb1bef2-34714527496.zip.part-*
          - label: 2bb4ce9
            tag: native-retirement-evidence-2bb4ce9
            candidate_ref: 2bb4ce939d99c3956848ca7bc9c347f3ae8db231
            candidate_asset: buster-candidate-source-2bb4ce9.tar.gz
            strict_pattern: strict-retirement-2bb4ce9-34718946098.zip.part-*
    steps:
      - name: Check out pinned candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.candidate_ref }}
          persist-credentials: false
      - name: Check out replay implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: validation
          persist-credentials: false
      - name: Download published strict and source assets
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_TAG: ${{ matrix.tag }}
          CANDIDATE_ASSET: ${{ matrix.candidate_asset }}
          STRICT_PATTERN: ${{ matrix.strict_pattern }}
        run: |
          mkdir "$RUNNER_TEMP/release-assets"
          gh release download "$EVIDENCE_TAG" --repo "${{ github.repository }}" --dir "$RUNNER_TEMP/release-assets" \
            --pattern archive-manifest.json --pattern SHA256SUMS \
            --pattern "$STRICT_PATTERN" --pattern "$CANDIDATE_ASSET"
      - name: Reconstruct and verify strict destination bytes
        run: >-
          python3 validation/tools/native_retirement_archive.py verify-strict
          --assets "$RUNNER_TEMP/release-assets"
          --output "$RUNNER_TEMP/strict"
          --cleanup
      - name: Restore archived compiler at its original workspace path
        run: |
          mkdir -p evidence/strict-binary
          cp "$RUNNER_TEMP/strict/archived-ide" evidence/strict-binary/ide
          chmod 555 evidence/strict-binary/ide
      - name: Replay every strict configuration with sanitizer enabled
        run: |
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/strict-build"
          "$RUNNER_TEMP/strict-build" test_differential \
            --ide "$GITHUB_WORKSPACE/evidence/strict-binary/ide" --cc clang \
            --strict-mir --sanitize-oracle --out "$GITHUB_WORKSPACE/evidence/strict-differential"
      - name: Report first strict replay diagnostic after failure
        if: ${{ failure() }}
        run: |
          diagnostic=$(find evidence/strict-differential -name '*.stderr' -type f -size +0c -print -quit 2>/dev/null || true)
          if [[ -n "$diagnostic" ]]; then
            sed -n '1,120p' "$diagnostic"
          fi
      - name: Record successful strict round trip
        run: >-
          python3 validation/tools/native_retirement_archive.py strict-receipt
          --manifest "$RUNNER_TEMP/release-assets/archive-manifest.json"
          --preflight "$RUNNER_TEMP/strict/strict-preflight.json"
          --replay "$GITHUB_WORKSPACE/evidence/strict-differential"
          --run-id "${{ github.run_id }}"
          --output "$RUNNER_TEMP/strict-replay-${{ matrix.label }}-${{ github.run_id }}.json"
      - name: Publish strict replay receipt
        env:
          GH_TOKEN: ${{ secrets.BUSTER_NATIVE_ARCHIVE_TOKEN }}
          EVIDENCE_TAG: ${{ matrix.tag }}
        run: >-
          gh release upload "$EVIDENCE_TAG"
          "$RUNNER_TEMP/strict-replay-${{ matrix.label }}-${{ github.run_id }}.json"
          --repo "${{ github.repository }}"
      - name: Retain strict replay receipt with the CI run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strict-replay-${{ matrix.label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/strict-replay-${{ matrix.label }}-${{ github.run_id }}.json
          retention-days: 7
          if-no-files-found: error
