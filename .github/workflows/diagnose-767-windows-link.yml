name: Diagnose PR 767 CodeView short range

on:
  push:
    branches:
      - diagnose/767-windows-link
    paths:
      - .github/workflows/diagnose-767-windows-link.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Download retained failing object
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35282867175 --repo buster14a/buster --name issue-786-windows-abi-link-35282867175 --dir diag

      - name: Build exact range-preserving variants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import pathlib
          import struct

          source = pathlib.Path("diag/subject-fast-p2.o")
          original = source.read_bytes()

          def parse(data):
              machine, count, timestamp, symbols, symbol_count, optional_size, characteristics = struct.unpack_from("<HHLLLHH", data, 0)
              strings = b""
              if symbols and symbol_count:
                  string_offset = symbols + symbol_count * 18
                  string_size = struct.unpack_from("<L", data, string_offset)[0]
                  strings = data[string_offset:string_offset + string_size]
              sections = []
              table = 20 + optional_size
              for index in range(count):
                  header = table + index * 40
                  raw_name = data[header:header + 8]
                  if raw_name.startswith(b"/"):
                      name_offset = int(raw_name[1:].split(b"\0", 1)[0])
                      name = strings[name_offset:].split(b"\0", 1)[0].decode("ascii")
                  else:
                      name = raw_name.split(b"\0", 1)[0].decode("ascii")
                  values = struct.unpack_from("<LLLLLLHHL", data, header + 8)
                  sections.append({
                      "header": header,
                      "name": name,
                      "size": values[2],
                      "raw": values[3],
                      "reloc": values[4],
                      "line": values[5],
                      "nreloc": values[6],
                  })
              return symbols, symbol_count, sections

          def symbol_name(data, symbols, index, strings):
              offset = symbols + index * 18
              raw = data[offset:offset + 8]
              zeroes, string_offset = struct.unpack_from("<LL", raw)
              if zeroes == 0:
                  return strings[string_offset:].split(b"\0", 1)[0].decode("ascii", "replace")
              return raw.split(b"\0", 1)[0].decode("ascii", "replace")

          def insert_into_section(data, section_name, insertion, payload, subsection_length):
              old = bytes(data)
              symbols, symbol_count, sections = parse(old)
              section = next(item for item in sections if item["name"] == section_name)
              delta = len(payload)
              result = bytearray(old[:insertion] + payload + old[insertion:])

              if symbols >= insertion:
                  struct.pack_into("<L", result, 8, symbols + delta)

              for item in sections:
                  header = item["header"]
                  if item["name"] == section_name:
                      struct.pack_into("<L", result, header + 16, item["size"] + delta)
                  for field, key in ((20, "raw"), (24, "reloc"), (28, "line")):
                      pointer = item[key]
                      if pointer and pointer >= insertion:
                          struct.pack_into("<L", result, header + field, pointer + delta)

              old_length = struct.unpack_from("<L", old, subsection_length)[0]
              struct.pack_into("<L", result, subsection_length, old_length + delta)

              _, _, new_sections = parse(result)
              new_section = next(item for item in new_sections if item["name"] == section_name)
              relative_insertion = insertion - section["raw"]
              for index in range(section["nreloc"]):
                  relocation = new_section["reloc"] + index * 10
                  address = struct.unpack_from("<L", result, relocation)[0]
                  if address >= relative_insertion:
                      struct.pack_into("<L", result, relocation, address + delta)

              new_symbols, new_symbol_count, _ = parse(result)
              string_table = new_symbols + new_symbol_count * 18
              string_size = struct.unpack_from("<L", result, string_table)[0]
              strings = result[string_table:string_table + string_size]
              index = 0
              while index < new_symbol_count:
                  symbol = new_symbols + index * 18
                  auxiliary_count = result[symbol + 17]
                  if symbol_name(result, new_symbols, index, strings) == section_name and auxiliary_count:
                      auxiliary = symbol + 18
                      length = struct.unpack_from("<L", result, auxiliary)[0]
                      struct.pack_into("<L", result, auxiliary, length + delta)
                  index += 1 + auxiliary_count
              return result

          symbols, symbol_count, sections = parse(original)
          debug = next(item for item in sections if item["name"] == ".debug$S")
          target = 4032
          record_length, record_kind = struct.unpack_from("<HH", original, target)
          frame_offset, range_start, section_index, range_length = struct.unpack_from("<lLHH", original, target + 4)
          if (record_length, record_kind, frame_offset, range_start, section_index, range_length) != (14, 0x1142, -16, 203, 1, 4):
              raise SystemExit("retained object no longer has the measured four-byte frame range")

          cursor = debug["raw"] + 4
          debug_end = debug["raw"] + debug["size"]
          subsection_length = None
          while cursor + 8 <= debug_end:
              cursor = (cursor + 3) & ~3
              kind, length = struct.unpack_from("<LL", original, cursor)
              payload = cursor + 8
              if payload <= target < payload + length:
                  subsection_length = cursor + 4
                  break
              cursor = (payload + length + 3) & ~3
          if subsection_length is None:
              raise SystemExit("target symbol subsection was not found")

          pathlib.Path("diag/original.o").write_bytes(original)

          floor = bytearray(original)
          struct.pack_into("<H", floor, target + 14, 5)
          pathlib.Path("diag/floor-five.o").write_bytes(floor)

          for name, new_start, gap_start in (
              ("trailing-gap", 203, 4),
              ("leading-gap", 202, 0),
          ):
              candidate = bytearray(original)
              struct.pack_into("<H", candidate, target, 18)
              struct.pack_into("<L", candidate, target + 8, new_start)
              struct.pack_into("<H", candidate, target + 14, 5)
              candidate = insert_into_section(candidate, ".debug$S", target + 16, struct.pack("<HH", gap_start, 1), subsection_length)
              pathlib.Path(f"diag/{name}.o").write_bytes(candidate)
          '@ | python -

      - name: Link every candidate with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPaths = @(& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw 'Visual Studio x86-64 tools were not found' }
          & (Join-Path $VsPaths[0].Trim() 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          $Sanitizer = @('-fsanitize=address,undefined', '-fno-sanitize-recover=all')
          $LibraryArgs = @()
          foreach ($LibraryPath in @($env:LIB -split ';' | Where-Object { $_.Length -ne 0 })) { $LibraryArgs += "-L$LibraryPath" }
          $Results = @{}
          foreach ($Name in @('original', 'floor-five', 'trailing-gap', 'leading-gap')) {
            & clang.exe @Sanitizer @LibraryArgs diag\caller.o "diag\$Name.o" -o "diag\$Name.exe" *> "diag\link-$Name.log"
            $Results[$Name] = $LASTEXITCODE
            Write-Host "LINK_RESULT candidate=$Name code=$LASTEXITCODE"
          }
          @(
            "original=$($Results['original'])",
            "floor-five=$($Results['floor-five'])",
            "trailing-gap=$($Results['trailing-gap'])",
            "leading-gap=$($Results['leading-gap'])"
          ) | Set-Content -Encoding ascii diag\candidate-summary.txt
          Get-Content diag\candidate-summary.txt
          if ($Results['original'] -eq 0) { throw 'Original corrupt object unexpectedly linked' }
          if ($Results['floor-five'] -ne 0) { throw 'Measured five-byte control did not link' }
          if ($Results['trailing-gap'] -ne 0) { Get-Content diag\link-trailing-gap.log; throw 'Exact trailing-gap candidate did not link' }
          if ($Results['leading-gap'] -ne 0) { Get-Content diag\link-leading-gap.log; throw 'Exact leading-gap candidate did not link' }

      - name: Retain candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-767-codeview-short-range-${{ github.run_id }}
          path: |
            diag/candidate-summary.txt
            diag/link-*.log
          retention-days: 3
          if-no-files-found: warn
