name: Diagnose PR 767 Windows ABI link

on:
  push:
    branches:
      - diagnose/767-windows-link
    paths:
      - .github/workflows/diagnose-767-windows-link.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out exact diagnostic revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Compare baseline and target-promotion CodeView
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPaths = @(& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw 'Visual Studio x86-64 tools were not found' }
          & (Join-Path $VsPaths[0].Trim() 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"

          $Driver = Join-Path $env:RUNNER_TEMP 'diagnostic-build.exe'
          cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Driver generate --cc clang --ci --linker DEFAULT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Driver build --config Release -t ide
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $LibraryPaths = @($env:LIB -split ';' | Where-Object { $_.Length -ne 0 })
          if ($LibraryPaths.Count -eq 0) { throw 'Visual Studio developer shell supplied no LIB search paths' }
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $Include = "$PWD\tests\differential"
          $Caller = "$PWD\evidence\caller.o"
          $CommonHost = @('-O0', '-fwrapv', '-fno-strict-aliasing', '-funsigned-char', "-I$Include")
          & clang.exe @CommonHost tests\differential\abi_host.c -c -o $Caller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          function Build-Subject([string]$Name, [string]$TargetPromotion) {
            $Subject = "$PWD\evidence\$Name.o"
            $Candidate = @(
              'cc'
              '-fregister-allocator=fast'
              '-fno-machine-fallback'
              '-fno-canonical-local-promotion'
              $TargetPromotion
              '-fno-frontend-ssa'
              '-fverify-codegen'
              '-fwrapv'
              '-fno-strict-aliasing'
              '-funsigned-char'
              "-I$Include"
            )
            foreach ($LibraryPath in $LibraryPaths) { $Candidate += "-L$LibraryPath" }
            $Candidate += @('tests\differential\abi.c', '-c', '-o', $Subject)
            & build\Release\ide.exe @Candidate
            if ($LASTEXITCODE -ne 0) { throw "$Name candidate compile failed: $LASTEXITCODE" }
            return $Subject
          }

          $P0 = Build-Subject 'p0' '-fno-target-local-promotion'
          $P2 = Build-Subject 'p2' '-ftarget-local-promotion'

          foreach ($Pair in @(@('p0', $P0), @('p2', $P2))) {
            $Name = $Pair[0]
            $Subject = $Pair[1]
            Write-Output "===== $Name CodeView ====="
            & llvm-readobj.exe --codeview $Subject 2>&1
            Write-Output "LLVM_READOBJ_EXIT=$LASTEXITCODE"
            Write-Output "===== $Name section hex ====="
            & llvm-objdump.exe -s -j '.debug$S' $Subject 2>&1
            Write-Output "LLVM_OBJDUMP_EXIT=$LASTEXITCODE"
            $Program = "$PWD\evidence\$Name.exe"
            $Link = @()
            foreach ($LibraryPath in $LibraryPaths) { $Link += "-L$LibraryPath" }
            $Link += @($Caller, $Subject, '-o', $Program)
            Write-Output "===== $Name MSVC link ====="
            & clang.exe @Link 2>&1
            Write-Output "MSVC_LINK_EXIT=$LASTEXITCODE"
            Write-Output "===== $Name LLD link ====="
            & clang.exe -fuse-ld=lld @Link -o "$PWD\evidence\$Name-lld.exe" 2>&1
            Write-Output "LLD_LINK_EXIT=$LASTEXITCODE"
          }

          $P2Stripped = "$PWD\evidence\p2-stripped.o"
          & llvm-objcopy.exe --remove-section='.debug$S' --remove-section='.debug$T' $P2 $P2Stripped
          Write-Output "OBJCOPY_EXIT=$LASTEXITCODE"
          $StrippedLink = @()
          foreach ($LibraryPath in $LibraryPaths) { $StrippedLink += "-L$LibraryPath" }
          $StrippedLink += @($Caller, $P2Stripped, '-o', "$PWD\evidence\p2-stripped.exe")
          Write-Output '===== p2 stripped MSVC link ====='
          & clang.exe @StrippedLink 2>&1
          Write-Output "P2_STRIPPED_LINK_EXIT=$LASTEXITCODE"
          exit 0
