name: Diagnose PR 767 Windows ABI link

on:
  push:
    branches:
      - diagnose/767-windows-link
    paths:
      - .github/workflows/diagnose-767-windows-link.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out exact diagnostic revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Reproduce one target-promotion ABI link
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPaths = @(& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw 'Visual Studio x86-64 tools were not found' }
          & (Join-Path $VsPaths[0].Trim() 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"

          $Driver = Join-Path $env:RUNNER_TEMP 'diagnostic-build.exe'
          cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Driver generate --cc clang --ci --linker DEFAULT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Driver build --config Release -t ide
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $LibraryPaths = @($env:LIB -split ';' | Where-Object { $_.Length -ne 0 })
          if ($LibraryPaths.Count -eq 0) { throw 'Visual Studio developer shell supplied no LIB search paths' }
          $ResourceDir = (& clang.exe -print-resource-dir).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $RuntimeDlls = @(
            Get-ChildItem -Path $ResourceDir -Filter 'clang_rt.asan_dynamic-x86_64.dll' -File -Recurse |
              Sort-Object FullName
          )
          if ($RuntimeDlls.Count -ne 1) { throw "Expected one x86-64 ASan runtime; found $($RuntimeDlls.Count)" }
          $env:PATH = "$(Split-Path -Parent $RuntimeDlls[0].FullName);$env:PATH"

          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $Include = "$PWD\tests\differential"
          $Caller = "$PWD\evidence\caller.o"
          $Subject = "$PWD\evidence\subject.o"
          $Program = "$PWD\evidence\program.exe"
          $CommonHost = @('-O0', '-fwrapv', '-fno-strict-aliasing', '-funsigned-char', '-fsanitize=address,undefined', '-fno-sanitize-recover=all', "-I$Include")
          & clang.exe @CommonHost tests\differential\abi_host.c -c -o $Caller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Candidate = @(
            'cc'
            '-fregister-allocator=fast'
            '-fno-machine-fallback'
            '-fno-canonical-local-promotion'
            '-ftarget-local-promotion'
            '-fno-frontend-ssa'
            '-fverify-codegen'
            '-fwrapv'
            '-fno-strict-aliasing'
            '-funsigned-char'
            "-I$Include"
          )
          foreach ($LibraryPath in $LibraryPaths) { $Candidate += "-L$LibraryPath" }
          $Candidate += @('tests\differential\abi.c', '-c', '-o', $Subject)
          Write-Output '===== candidate command ====='
          Write-Output ((@('build\Release\ide.exe') + $Candidate) -join "`n")
          & build\Release\ide.exe @Candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Output '===== object headers, symbols, relocations, unwind ====='
          & llvm-readobj.exe --file-headers --sections --symbols --relocations --unwind $Subject
          Write-Output '===== undefined symbols ====='
          & llvm-nm.exe --undefined-only $Subject

          $Link = @('-fsanitize=address,undefined', '-fno-sanitize-recover=all')
          foreach ($LibraryPath in $LibraryPaths) { $Link += "-L$LibraryPath" }
          $Link += @($Caller, $Subject, '-o', $Program)
          Write-Output '===== link command ====='
          Write-Output ((@('clang.exe') + $Link) -join "`n")
          & clang.exe @Link 2>&1 | Tee-Object -FilePath evidence\link.txt
          $LinkExit = $LASTEXITCODE
          Write-Output "LINK_EXIT=$LinkExit"
          if (Test-Path $Program) {
            Write-Output '===== program execution ====='
            & $Program
            Write-Output "PROGRAM_EXIT=$LASTEXITCODE"
          }
          exit $LinkExit
