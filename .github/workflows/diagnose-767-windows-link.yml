name: Publish PR 767 CodeView short-range repair

on:
  push:
    branches:
      - diagnose/767-windows-link
    paths:
      - .github/workflows/diagnose-767-windows-link.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - name: Check out owned PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: claude/clever-cori-qh0b15
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and apply exact CodeView repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Expected = '814fa99a8d026404371d299463ef4a56076ca5c0'
          $Actual = (git rev-parse HEAD).Trim()
          if ($Actual -ne $Expected) { throw "PR head moved: expected $Expected, found $Actual" }

          git config user.name 'ChatGPT Codex Connector'
          git config user.email 'noreply@openai.com'
          git fetch origin main
          git merge --no-edit origin/main

          @'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new))

          replace_once(
              "src/buster/lib/compiler/codeview/codeview.c",
              """BUSTER_GLOBAL_LOCAL u32 codeview_model_register_target(u16 machine)
          {
              return machine == CODEVIEW_MACHINE_ARM64 ? CPU_ARCH_AARCH64 : CPU_ARCH_X86_64;
          }

          BUSTER_GLOBAL_LOCAL void codeview_emit_location_range(ByteWriter* symbols, DebugLocationRange* range, u32 function_offset, u16 machine)
          """,
              """BUSTER_GLOBAL_LOCAL u32 codeview_model_register_target(u16 machine)
          {
              return machine == CODEVIEW_MACHINE_ARM64 ? CPU_ARCH_AARCH64 : CPU_ARCH_X86_64;
          }

          enum
          {
              // MSVC link.exe rejects otherwise valid CodeView defranges whose
              // envelope is shorter than five bytes. Preserve the exact live
              // interval by extending the envelope and excluding only the
              // extension through a LocalVariableAddrGap.
              CODEVIEW_MIN_DEFRANGE_LENGTH = 5,
          };

          typedef struct CodeviewDefrange CodeviewDefrange;
          struct CodeviewDefrange
          {
              u32 start;
              u16 length;
              u16 gap_start;
              u16 gap_length;
          };

          BUSTER_GLOBAL_LOCAL CodeviewDefrange codeview_defrange_make(u32 start, u32 length)
          {
              CodeviewDefrange result = {
                  .start = start,
                  .length = (u16)BUSTER_MIN(length, UINT16_MAX),
              };
              if (result.length && result.length < CODEVIEW_MIN_DEFRANGE_LENGTH)
              {
                  u16 extension = CODEVIEW_MIN_DEFRANGE_LENGTH - result.length;
                  if (start >= extension)
                  {
                      // Prefer a leading gap so the encoded envelope retains the
                      // original end and cannot run past the function boundary.
                      result.start -= extension;
                      result.gap_length = extension;
                  }
                  else
                  {
                      // A range beginning at offset zero cannot move backwards.
                      result.gap_start = result.length;
                      result.gap_length = extension;
                  }
                  result.length = CODEVIEW_MIN_DEFRANGE_LENGTH;
              }
              return result;
          }

          BUSTER_GLOBAL_LOCAL void codeview_emit_defrange(ByteWriter* symbols, u32 start, u32 length)
          {
              CodeviewDefrange range = codeview_defrange_make(start, length);
              byte_writer_emit_u32_le(symbols, range.start);
              byte_writer_emit_u16_le(symbols, 1);
              byte_writer_emit_u16_le(symbols, range.length);
              if (range.gap_length)
              {
                  byte_writer_emit_u16_le(symbols, range.gap_start);
                  byte_writer_emit_u16_le(symbols, range.gap_length);
              }
          }

          BUSTER_GLOBAL_LOCAL void codeview_emit_location_range(ByteWriter* symbols, DebugLocationRange* range, u32 function_offset, u16 machine)
          """,
          )

          old = """        byte_writer_emit_u32_le(symbols, start);
                  byte_writer_emit_u16_le(symbols, 1);
                  byte_writer_emit_u16_le(symbols, (u16)BUSTER_MIN(length, UINT16_MAX));
          """
          new = """        codeview_emit_defrange(symbols, start, length);
          """
          source = Path("src/buster/lib/compiler/codeview/codeview.c")
          text = source.read_text()
          if text.count(old) != 2:
              raise SystemExit(f"codeview.c: expected two whole-value ranges, found {text.count(old)}")
          text = text.replace(old, new)

          old = """                byte_writer_emit_u32_le(symbols, piece_start);
                          byte_writer_emit_u16_le(symbols, 1);
                          byte_writer_emit_u16_le(symbols, (u16)BUSTER_MIN(piece_length, UINT16_MAX));
          """
          new = """                codeview_emit_defrange(symbols, piece_start, piece_length);
          """
          if text.count(old) != 2:
              raise SystemExit(f"codeview.c: expected two piece ranges, found {text.count(old)}")
          source.write_text(text.replace(old, new))

          replace_once(
              "src/buster/tests/compiler/codeview/codeview_test.c",
              """    // The format backend also accepts the neutral model directly.  Keep a
              // register-to-frame transition, a parameter, and a synthetic inline site
              // here so the C13 records cannot silently regress to line-only output.
          """,
              """    // The format backend also accepts the neutral model directly. Keep
              // short register/frame intervals, a piecewise transition, a parameter,
              // and a synthetic inline site so C13 records cannot regress silently.
          """,
          )
          replace_once(
              "src/buster/tests/compiler/codeview/codeview_test.c",
              """    DebugLocationRange model_locations[] = {
                  {.start = 0, .end = 12, .location = {.kind = DEBUG_LOCATION_REGISTER, .reg = DEBUG_REGISTER_X86_RAX}},
                  {.start = 12, .end = 24, .location = {.kind = DEBUG_LOCATION_PIECEWISE, .pieces = model_pieces, .piece_count = BUSTER_ARRAY_LENGTH(model_pieces)}},
                  {.start = 24, .end = 32, .location = {.kind = DEBUG_LOCATION_FRAME, .frame_offset = -16}},
              };
          """,
              """    DebugLocationRange model_locations[] = {
                  // The four-byte intervals exercise both exact-preserving forms:
                  // a trailing gap at function offset zero and a leading gap at
                  // the end of the function.
                  {.start = 0, .end = 4, .location = {.kind = DEBUG_LOCATION_REGISTER, .reg = DEBUG_REGISTER_X86_RAX}},
                  {.start = 12, .end = 24, .location = {.kind = DEBUG_LOCATION_PIECEWISE, .pieces = model_pieces, .piece_count = BUSTER_ARRAY_LENGTH(model_pieces)}},
                  {.start = 28, .end = 32, .location = {.kind = DEBUG_LOCATION_FRAME, .frame_offset = -16}},
              };
          """,
          )
          replace_once(
              "src/buster/tests/compiler/codeview/codeview_test.c",
              """    bool found_register = false;
              bool found_frame = false;
              bool found_subfield = false;
          """,
              """    bool found_register = false;
              bool found_frame = false;
              bool found_short_register = false;
              bool found_short_frame = false;
              bool found_subfield = false;
          """,
          )
          replace_once(
              "src/buster/tests/compiler/codeview/codeview_test.c",
              """                found_register |= record_kind == CODEVIEW_TEST_S_DEFRANGE_REGISTER;
                          found_frame |= record_kind == CODEVIEW_TEST_S_DEFRANGE_FRAMEPOINTER_REL;
                          found_subfield |= record_kind == CODEVIEW_TEST_S_DEFRANGE_SUBFIELD || record_kind == CODEVIEW_TEST_S_DEFRANGE_SUBFIELD_REGISTER;
          """,
              """                found_register |= record_kind == CODEVIEW_TEST_S_DEFRANGE_REGISTER;
                          found_frame |= record_kind == CODEVIEW_TEST_S_DEFRANGE_FRAMEPOINTER_REL;
                          if ((record_kind == CODEVIEW_TEST_S_DEFRANGE_REGISTER ||
                               record_kind == CODEVIEW_TEST_S_DEFRANGE_FRAMEPOINTER_REL) &&
                              record_length >= 18)
                          {
                              u32 range_start = 0;
                              u16 section = 0;
                              u16 range_length = 0;
                              u16 gap_start = 0;
                              u16 gap_length = 0;
                              memcpy(&range_start, model_built.symbols.pointer + record_offset + 8, sizeof(range_start));
                              memcpy(&section, model_built.symbols.pointer + record_offset + 12, sizeof(section));
                              memcpy(&range_length, model_built.symbols.pointer + record_offset + 14, sizeof(range_length));
                              memcpy(&gap_start, model_built.symbols.pointer + record_offset + 16, sizeof(gap_start));
                              memcpy(&gap_length, model_built.symbols.pointer + record_offset + 18, sizeof(gap_length));
                              found_short_register |= record_kind == CODEVIEW_TEST_S_DEFRANGE_REGISTER && section == 1 &&
                                                      range_start == 0 && range_length == 5 && gap_start == 4 && gap_length == 1;
                              found_short_frame |= record_kind == CODEVIEW_TEST_S_DEFRANGE_FRAMEPOINTER_REL && section == 1 &&
                                                   range_start == 27 && range_length == 5 && gap_start == 0 && gap_length == 1;
                          }
                          found_subfield |= record_kind == CODEVIEW_TEST_S_DEFRANGE_SUBFIELD || record_kind == CODEVIEW_TEST_S_DEFRANGE_SUBFIELD_REGISTER;
          """,
          )
          replace_once(
              "src/buster/tests/compiler/codeview/codeview_test.c",
              """    BUSTER_TEST(arguments, found_procedure_type && found_local && found_register && found_frame && found_subfield && found_inline);
          """,
              """    BUSTER_TEST(arguments, found_procedure_type && found_local && found_register && found_frame &&
                                         found_short_register && found_short_frame && found_subfield && found_inline);
          """,
          )
          '@ | python -

          git diff --check
          git add src/buster/lib/compiler/codeview/codeview.c src/buster/tests/compiler/codeview/codeview_test.c
          git commit -m 'codeview: preserve short defranges with gaps'

      - name: Build and run Release tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPaths = @(& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw 'Visual Studio x86-64 tools were not found' }
          & (Join-Path $VsPaths[0].Trim() 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          $Driver = Join-Path $env:RUNNER_TEMP 'publish-build.exe'
          cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Driver generate --cc clang --ci --linker DEFAULT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Driver build --config Release -t test_all
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Release tests failed once; rerunning to distinguish a transient runner timeout.'
            & $Driver build --config Release -t test_all
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Prove exact target-promotion object links with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPaths = @(& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw 'Visual Studio x86-64 tools were not found' }
          & (Join-Path $VsPaths[0].Trim() 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"

          $ResourceDir = (& clang.exe -print-resource-dir).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $RuntimeDlls = @(Get-ChildItem -Path $ResourceDir -Filter 'clang_rt.asan_dynamic-x86_64.dll' -File -Recurse | Sort-Object FullName)
          if ($RuntimeDlls.Count -ne 1) { throw "Expected one x86-64 ASan runtime; found $($RuntimeDlls.Count)" }
          $env:PATH = "$(Split-Path -Parent $RuntimeDlls[0].FullName);$env:PATH"

          $LibraryPaths = @($env:LIB -split ';' | Where-Object { $_.Length -ne 0 })
          if ($LibraryPaths.Count -eq 0) { throw 'Visual Studio developer shell supplied no LIB search paths' }
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $Include = "$PWD\tests\differential"
          $Caller = "$PWD\evidence\caller.o"
          $Subject = "$PWD\evidence\subject.o"
          $Program = "$PWD\evidence\program.exe"
          $Sanitizer = @('-fsanitize=address,undefined', '-fno-sanitize-recover=all')

          & clang.exe -O0 -fwrapv -fno-strict-aliasing -funsigned-char @Sanitizer "-I$Include" tests\differential\abi_host.c -c -o $Caller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Candidate = @(
            'cc',
            '-fregister-allocator=fast',
            '-fno-machine-fallback',
            '-fno-canonical-local-promotion',
            '-ftarget-local-promotion',
            '-fno-frontend-ssa',
            '-fverify-codegen',
            '-fwrapv',
            '-fno-strict-aliasing',
            '-funsigned-char',
            "-I$Include"
          )
          foreach ($LibraryPath in $LibraryPaths) { $Candidate += "-L$LibraryPath" }
          $Candidate += @('tests\differential\abi.c', '-c', '-o', $Subject)
          & build\Release\ide.exe @Candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & llvm-readobj.exe --codeview $Subject | Tee-Object -FilePath evidence\codeview.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Link = $Sanitizer
          foreach ($LibraryPath in $LibraryPaths) { $Link += "-L$LibraryPath" }
          $Link += @($Caller, $Subject, '-o', $Program)
          & clang.exe @Link
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Program
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Select-String -Path evidence\codeview.txt -Pattern 'GapStartOffset: 0x0' -Quiet)) {
            throw 'The exact object contains no leading CodeView gap evidence'
          }

      - name: Publish validated commits
        shell: pwsh
        run: |
          git status --short
          git diff --exit-code
          git push origin HEAD:claude/clever-cori-qh0b15
