name: Apply issue 183 fix v5

on:
  push:
    branches:
      - fix/183-gnu17-enum-types
    paths:
      - .github/workflows/issue-183-apply-v5.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Prepare guarded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/issue-183-apply.py')
          text = path.read_text()
          start = text.index('def replace_once(')
          end = text.index('\n\n# Preserve', start)
          helper = '''def replace_once(path: str, old: str, new: str) -> None:
              import re

              source_path = Path(path)
              text = source_path.read_text()
              count = text.count(old)
              if count == 1:
                  source_path.write_text(text.replace(old, new, 1))
                  return
              if count != 0:
                  raise SystemExit(f"{path}: expected exactly one exact match, found {count}: {old[:120]!r}")
              parts = re.split(r"(\\s+)", old)
              pattern = "".join(r"\\s+" if part.isspace() else re.escape(part) for part in parts if part)
              matches = list(re.finditer(pattern, text))
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected exactly one whitespace-normalized match, found {len(matches)}: {old[:120]!r}")
              match = matches[0]
              source_path.write_text(text[:match.start()] + new + text[match.end():])'''
          text = text[:start] + helper + text[end:]
          old_layout = '''    u32 symbol;
              // The declaration-point type for C23, or the completed compatible type
              // selected for a GNU enum. This fills the former alignment hole.
              CTypeId type;
              u64 value;
              bool is_negative;
              bool is_unsigned;
              u8 reserved[6];
          '''
          new_layout = '''    u32 symbol;
              u64 value;
              bool is_negative;
              bool is_unsigned;
              u8 reserved[2];
              // The declaration-point type for C23, or the completed compatible type
              // selected for a GNU enum. Stored in the previous tail padding.
              CTypeId type;
          '''
          if text.count(old_layout) != 1:
              raise SystemExit('could not locate staged CEnumMember replacement')
          path.write_text(text.replace(old_layout, new_layout, 1))
          PY
      - name: Apply production patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/issue-183-apply.py
          rm -rf .github/issue-183-context.txt .github/issue-183-context .github/issue-183-deep
          rm -f .github/issue-183-apply.py \
            .github/workflows/issue-183-apply.yml \
            .github/workflows/issue-183-apply-v2.yml \
            .github/workflows/issue-183-apply-v3.yml \
            .github/workflows/issue-183-apply-v4.yml \
            .github/workflows/issue-183-apply-v5.yml
          git diff --check
          git status --short
          git diff --stat
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUSTER_STDOUT_ASSERTS=TRUE \
            -DBUILD_TESTING=ON
      - name: Build
        shell: bash
        run: cmake --build build --parallel 2
      - name: Compile and run enum regression
        shell: bash
        run: |
          set -euo pipefail
          build/ide cc tests/basic_c_enum_underlying_type.c -o /tmp/basic_c_enum_underlying_type
          /tmp/basic_c_enum_underlying_type
      - name: Run native full test suite
        shell: bash
        env:
          BUSTER_TEST_JOBS: '2'
        run: build/ide test --ci=1 --verbose=1
      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(c): select GNU17 enum compatible types'
          git push origin HEAD:${GITHUB_REF_NAME}
