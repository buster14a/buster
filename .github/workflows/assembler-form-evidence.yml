name: Assembler form evidence

# Correctness evidence for the existing public assemblers. This is a report
# workflow, not a replacement for required CI or a claim of full ISA coverage.
on:
  pull_request:
    paths:
      - '.github/workflows/assembler-form-evidence.yml'
      - 'build.c'
      - 'CMakeLists.txt'
      - 'src/buster/tests/test.c'
      - 'tools/aarch64_assembly_census.c'
      - 'src/buster/apps/ide/ide.c'
      - 'src/buster/lib/compiler/assembly/**'
      - 'src/buster/tests/compiler/assembly/**'
      - 'docs/assembler-form-coverage.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assembler-form-evidence-${{ github.event_name }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Hosted assembler form observations
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      BUSTER_TEST_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record immutable source and executor identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assembler-form-evidence"
          git rev-parse HEAD 'HEAD^{tree}' | tee "$RUNNER_TEMP/assembler-form-evidence/source.txt"
          git rev-parse 'HEAD:src/buster/lib/compiler/assembly/generated/x86_64-assembly.generated.h' > "$RUNNER_TEMP/assembler-form-evidence/x86-snapshot.txt"
          clang --version | tee "$RUNNER_TEMP/assembler-form-evidence/toolchain.txt"
          uname -a | tee "$RUNNER_TEMP/assembler-form-evidence/host.txt"
          lscpu | tee -a "$RUNNER_TEMP/assembler-form-evidence/host.txt"
          free -b | tee -a "$RUNNER_TEMP/assembler-form-evidence/host.txt"
          nproc | tee -a "$RUNNER_TEMP/assembler-form-evidence/host.txt"
      - name: Locate independent reference assembler and linker
        shell: bash
        run: |
          set -euo pipefail
          oracle_linker=$(command -v ld.lld-21)
          printf 'BUSTER_A64_ORACLE_LINKER=%s\n' "$oracle_linker" >> "$GITHUB_ENV"
          "$oracle_linker" --version | tee -a "$RUNNER_TEMP/assembler-form-evidence/toolchain.txt"
          readelf --version | tee -a "$RUNNER_TEMP/assembler-form-evidence/toolchain.txt"
      - name: Bootstrap the native build driver
        id: driver
        shell: bash
        run: |
          set -euo pipefail
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char -g build.c -o "$RUNNER_TEMP/assembler-form-build" 2>&1 | tee "$RUNNER_TEMP/assembler-form-evidence/bootstrap.log"
      - name: Configure and build the exact compiler
        id: compiler
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/assembler-form-build" generate --cc clang --ci --linker DEFAULT 2>&1 | tee "$RUNNER_TEMP/assembler-form-evidence/configure.log"
          "$RUNNER_TEMP/assembler-form-build" build --config Release -t ide -- -j2 2>&1 | tee "$RUNNER_TEMP/assembler-form-evidence/build.log"
          sha256sum "$RUNNER_TEMP/assembler-form-build" build/Release/ide > "$RUNNER_TEMP/assembler-form-evidence/binaries.txt"
      - name: Capture both x86 public dialects
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          build/Release/ide x86_64_completion_census --output="$RUNNER_TEMP/assembler-form-evidence/x86-census.txt" 2>&1 | tee "$RUNNER_TEMP/assembler-form-evidence/x86-census.log"
      - name: Validate complete row reporting and strict source admission
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/assembler-form-evidence"
          report="$evidence/x86-census.txt"
          grep -Fx 'schema=4' "$report"
          grep -Fx 'records_integrity_complete=1' "$report"
          grep -Fx 'source_partition_complete=1' "$report"
          grep -Fx 'diagnostics_integrity_complete=1' "$report"
          grep -Fx 'direct_witnesses_complete=1' "$report"
          grep -Fx 'source_witnesses_complete=1' "$report"
          grep -Fx 'evidence_integrity_complete=1' "$report"
          grep -Fx 'diagnostic_dropped_count=0' "$report"
          direct_count=$(sed -n 's/^direct_witness_count=//p' "$report")
          source_count=$(sed -n 's/^source_witness_count=//p' "$report")
          test "$direct_count" -gt 0
          test "$source_count" -gt 0
          test "$(grep -Ec '^direct_witness_[0-9]+=' "$report")" -eq "$direct_count"
          test "$(grep -Ec '^source_witness_[0-9]+=' "$report")" -eq "$source_count"
          row_count=$(sed -n 's/^row_count=//p' "$report")
          test "$row_count" -gt 0
          test "$(grep -Ec '^row_[0-9]+=' "$report")" -eq "$row_count"
          if build/Release/ide x86_64_completion_census --require-source-complete --output="$evidence/x86-strict.txt" > "$evidence/x86-strict.log" 2>&1; then
            grep -Fx 'source_complete=1' "$evidence/x86-strict.txt"
          else
            status=$?
            test "$status" -eq 1
            grep -Fx 'source_complete=0' "$evidence/x86-strict.txt"
            grep -Fx 'records_integrity_complete=1' "$evidence/x86-strict.txt"
            grep -Fx 'source_partition_complete=1' "$evidence/x86-strict.txt"
            grep -Fx 'diagnostics_integrity_complete=1' "$evidence/x86-strict.txt"
            grep -Fx 'direct_witnesses_complete=1' "$evidence/x86-strict.txt"
            grep -Fx 'source_witnesses_complete=1' "$evidence/x86-strict.txt"
            grep -Fx 'evidence_integrity_complete=1' "$evidence/x86-strict.txt"
          fi
          if build/Release/ide x86_64_completion_census --require-source-complete > "$evidence/x86-missing-output.log" 2>&1; then
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi
          if build/Release/ide x86_64_completion_census --require-source-complete --require-source-complete --output="$evidence/x86-duplicate.txt" > "$evidence/x86-duplicate.log" 2>&1; then
            exit 1
          else
            status=$?
            test "$status" -eq 1
            test ! -e "$evidence/x86-duplicate.txt"
          fi
      - name: Verify the registered x86 census
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          build/Release/ide test --module=x86_64_completion_census_tests --ci=1 --verbose=1 2>&1 | tee "$RUNNER_TEMP/assembler-form-evidence/x86-tests.log"
      - name: Verify public single-instruction assembly
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          build/Release/ide test --module=assembly_tests --ci=1 --verbose=1 2>&1 | tee "$RUNNER_TEMP/assembler-form-evidence/assembly-tests.log"
      - name: Verify AArch64 base operand forms
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          build/Release/ide test --module=aarch64_base_assembly_tests --ci=1 --verbose=1 2>&1 | tee "$RUNNER_TEMP/assembler-form-evidence/aarch64-tests.log"
      - name: Independently link AArch64 symbolic page operands
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/assembler-form-evidence"
          exec > >(tee "$evidence/a64-oracle.log") 2>&1
          fixture=src/buster/tests/compiler/assembly/fixtures/aarch64_symbolic_page_oracle
          clang --target=aarch64-linux-gnu -c "$fixture.s" -o "$evidence/a64-reference.o"
          clang --target=aarch64-linux-gnu -c "$fixture-definition.s" -o "$evidence/a64-definition.o"
          build/Release/ide cc -target aarch64-linux -c "$fixture.s" -o "$evidence/a64-candidate.o"
          readelf -rW "$evidence/a64-reference.o" > "$evidence/a64-reference-relocations.txt"
          readelf -rW "$evidence/a64-candidate.o" > "$evidence/a64-candidate-relocations.txt"
          for placement in 0x101ff8 0x102000 0x102008; do
            printf 'SECTIONS { . = 0x100000; .text : { *(.text) } . = %s - 8; .data : { *(.data) } }\n' "$placement" > "$evidence/a64-$placement.ld"
            "$BUSTER_A64_ORACLE_LINKER" --entry=_start -T "$evidence/a64-$placement.ld" "$evidence/a64-reference.o" "$evidence/a64-definition.o" -o "$evidence/a64-reference-$placement"
            "$BUSTER_A64_ORACLE_LINKER" --entry=_start -T "$evidence/a64-$placement.ld" "$evidence/a64-candidate.o" "$evidence/a64-definition.o" -o "$evidence/a64-candidate-$placement"
            readelf -x .text "$evidence/a64-reference-$placement" > "$evidence/a64-reference-$placement.txt"
            readelf -x .text "$evidence/a64-candidate-$placement" > "$evidence/a64-candidate-$placement.txt"
            grep -Eq '^[[:space:]]+0x[[:xdigit:]]+[[:space:]]+[[:xdigit:]]{8}([[:space:]]|$)' "$evidence/a64-reference-$placement.txt"
            grep -Eq '^[[:space:]]+0x[[:xdigit:]]+[[:space:]]+[[:xdigit:]]{8}([[:space:]]|$)' "$evidence/a64-candidate-$placement.txt"
            cmp "$evidence/a64-reference-$placement.txt" "$evidence/a64-candidate-$placement.txt"
          done
      - name: Probe optional-extension source boundaries
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/assembler-form-evidence"
          exec > >(tee "$evidence/optional-extension-probes.log") 2>&1
          for seed in ptrue addha; do
            fixture="src/buster/tests/compiler/assembly/fixtures/aarch64_optional_$seed.s"
            llvm-mc-21 -triple=aarch64-linux-gnu -mattr=+sve,+sme -show-encoding "$fixture" | tee "$evidence/optional-$seed-reference.txt"
            for features in baseline sme; do
              extra=()
              if test "$features" = sme; then extra=(-mattr=+sme); fi
              output="$evidence/optional-$seed-$features.o"
              if build/Release/ide cc -target aarch64-linux "${extra[@]}" -c "$fixture" -o "$output" > "$evidence/optional-$seed-$features.log" 2>&1; then
                echo "unexpected source acceptance: $seed $features"
                exit 1
              else
                status=$?
                test "$status" -ne 0
                test ! -s "$output"
                test -s "$evidence/optional-$seed-$features.log"
                cat "$evidence/optional-$seed-$features.log"
              fi
            done
          done
      - name: Generate native source-size acknowledgment
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/assembler-form-build" source_size --write-baseline 2>&1 | tee "$RUNNER_TEMP/assembler-form-evidence/source-size.log"
          cat docs/source-size-baseline.txt | tee "$RUNNER_TEMP/assembler-form-evidence/source-size-baseline.txt"
      - name: Retain observations on success or failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assembler-form-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/assembler-form-evidence/
            build/CMakeCache.txt
            build/compile_commands.json
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
