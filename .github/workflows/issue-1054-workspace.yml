# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Temporary focused validation for #1054; removed from the implementation PR.
name: Issue 1054 workspace
on:
  push:
    branches: [chatgpt/1054-tier1-outcomes]
    paths: [.github/workflows/issue-1054-workspace.yml]
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: native
            sanitizer: none
          - arch: x86-64
            sanitizer: address
    env:
      BUSTER_HOST_ARCH: ${{ matrix.arch }}
      BUSTER_SANITIZER: ${{ matrix.sanitizer }}
      BUSTER_SANITIZER_OPTIMIZATION: 1
      BUSTER_DEBUG_INFO: 0
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install pinned Clang and test dependencies
        run: bash tools/ci/setup-hosted.sh
      - name: Build production sources
        run: ./build.sh
      - name: Explicit outcomes, strict coverage and rollback
        run: ./build/compiler test-check-lanes --tier1-outcomes --keep
      - name: Existing emitter regressions
        if: success() || failure()
        run: test -x build/compiler && ./build/compiler test-tier1-emit
      - name: Existing pipeline regressions
        if: success() || failure()
        run: test -x build/compiler && ./build/compiler test-tier1-pipeline
      - name: Preserve exact tested source and logs
        if: always()
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/buster-1054-tested.tar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1054-${{ matrix.arch }}-${{ matrix.sanitizer }}
          path: |
            ${{ runner.temp }}/buster-1054-tested.tar
            /tmp/buster-check-lanes-*
          retention-days: 3
