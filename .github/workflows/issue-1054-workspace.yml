# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Isolated validation branch only; not part of PR #1094.
name: Issue 1054 workspace
on:
  push:
    branches: [chatgpt/1054-validation]
    paths: [.github/workflows/issue-1054-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 890627cbf958fa9bf1cb19930e1211e0ac91cbe3
          persist-credentials: false
      - name: Archive current main without credentials or build products
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/buster-main-890627.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: issue-1054-main-890627
          path: ${{ runner.temp }}/buster-main-890627.tar
          retention-days: 1
