# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Temporary transport/validation for #1054; removed from the implementation PR.
name: Issue 1054 workspace
on:
  push:
    branches: [chatgpt/1054-tier1-outcomes]
    paths: [.github/workflows/issue-1054-workspace.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: chatgpt/1054-tier1-outcomes
          fetch-depth: 1
      - name: Apply the exact reviewed patch and the already-merged main build fix
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/1054-0.b64; then
              cat .github/1054-{0,1,2,3}.b64 | base64 -d | gzip -d > "$RUNNER_TEMP/1054.patch"
              printf 'e6c051bd5f8252e6c799e03f3526a35960b7ec7c17ce17ff1fd2294adc6bf7db  %s\n' "$RUNNER_TEMP/1054.patch" | sha256sum --check
              git apply --check "$RUNNER_TEMP/1054.patch"
              git apply "$RUNNER_TEMP/1054.patch"
              git fetch origin f04ca03e8789aa9bc2fc34e4e222eda85a225a8e
              git restore --source=f04ca03e8789aa9bc2fc34e4e222eda85a225a8e -- src/buster/compiler/tier1_emit_test.c
              git rm .github/1054-code.patch.gz.b64 .github/1054-{0,1,2,3}.b64
              git diff --check
              git add src/buster/compiler
              git -c user.name='ChatGPT' -c user.email='noreply@openai.com' commit -m 'fix: preserve Tier 1 failures and make fallback explicit (#1054)'
              git push origin HEAD:refs/heads/chatgpt/1054-tier1-outcomes
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  correctness:
    needs: apply
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: native
            sanitizer: none
          - arch: x86-64
            sanitizer: address
    env:
      BUSTER_HOST_ARCH: ${{ matrix.arch }}
      BUSTER_SANITIZER: ${{ matrix.sanitizer }}
      BUSTER_SANITIZER_OPTIMIZATION: 1
      BUSTER_DEBUG_INFO: 0
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - name: Install pinned Clang and test dependencies
        run: tools/ci/setup-hosted.sh
      - name: Build production sources
        run: ./build.sh
      - name: Explicit outcomes, strict coverage and rollback
        run: ./build/compiler test-check-lanes --tier1-outcomes --keep
      - name: Existing emitter regressions
        run: ./build/compiler test-tier1-emit
      - name: Existing pipeline regressions
        run: ./build/compiler test-tier1-pipeline
      - name: Preserve exact tested source and logs
        if: always()
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/buster-1054-tested.tar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1054-${{ matrix.arch }}-${{ matrix.sanitizer }}
          path: |
            ${{ runner.temp }}/buster-1054-tested.tar
            /tmp/buster-check-lanes-*
          retention-days: 3
