name: PR 687 integration source
on:
  push:
    branches: [codex/pr687-integration-source]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a8caf4496f2ed4f039fcd56a6bb4f317029af1c8
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact candidate and main histories for conflict review
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr687-integration-source"
          git branch review-candidate a8caf4496f2ed4f039fcd56a6bb4f317029af1c8
          git branch review-main a8791cd4634a543844caba21f884209cb40f97b4
          git bundle create "$RUNNER_TEMP/pr687-integration-source/buster.bundle" review-candidate review-main
          git bundle verify "$RUNNER_TEMP/pr687-integration-source/buster.bundle"
          sha256sum "$RUNNER_TEMP/pr687-integration-source/buster.bundle" > "$RUNNER_TEMP/pr687-integration-source/sha256.txt"
          git merge-base --all review-candidate review-main > "$RUNNER_TEMP/pr687-integration-source/merge-bases.txt"
          git diff --stat a8caf4496f2ed4f039fcd56a6bb4f317029af1c8 a8791cd4634a543844caba21f884209cb40f97b4 > "$RUNNER_TEMP/pr687-integration-source/diff-stat.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr687-integration-source-${{ github.run_id }}
          path: ${{ runner.temp }}/pr687-integration-source
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
