name: Patch issue 1790 candidate

on:
  push:
    branches:
      - fix/1790-desktop-artifact-resolution

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[1790 patched]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply candidate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('.github/scripts/patch_1790.py')
          text = path.read_text(encoding='utf-8')
          old = 'updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)'
          new = 'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)'
          if text.count(old) != 1:
              raise SystemExit('literal regex replacement seam not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PYTHON
          python3 .github/scripts/patch_1790.py

      - name: Run focused workflow regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci_native_observation_test.py -v
          python3 tools/matrix_shard_test.py -v
          python3 tests/action_pins_test.py -v
          python3 tools/check_action_pins.py
          python3 tests/ci_tools_test.py -v
          git diff --check

      - name: Publish candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github tools docs
          git diff --cached --check
          git commit -m 'ci: contain desktop artifact resolution failures (#1790) [1790 patched]'
          git push origin HEAD:${GITHUB_REF_NAME}
