name: Patch issue 1790 candidate

on:
  push:
    branches:
      - fix/1790-desktop-artifact-resolution

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply candidate and compute reviewed identities
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_patch_1790.py
          python3 .github/scripts/patch_1790.py
          python3 .github/scripts/compute_1790_policy_identity.py
          python3 tests/ci_tools_test.py WorkflowPolicyTests.test_all_six_platforms_and_commands_remain -v
          git diff --check
          printf 'Identity-only run complete; refusing publication before trusted-reader bootstrap.\n'
          exit 1
