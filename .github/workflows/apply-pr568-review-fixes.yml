name: Reconcile PR 568 with current main

on:
  push:
    branches:
      - automation/pr568-review-fix-20260917-001

permissions:
  contents: write

concurrency:
  group: reconcile-pr568-current-main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/511-retirement-performance-contract
          path: target
          fetch-depth: 0
          persist-credentials: true
      - name: Merge the reviewed main checkpoint and update the immutable support pin
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e91a92ee5d14b03160342413e97902ab25eeab59
          git fetch --no-tags origin f5ed0ec53b06b62ea457d4cc77173c77f96c064c
          git merge --no-commit --no-ff f5ed0ec53b06b62ea457d4cc77173c77f96c064c

          test "$(git hash-object docs/native-retirement-support-v1.tsv)" = 81cb632afade253c5d841d6bd55f6149cc30ea08
          printf '%s  %s\n' \
            '4dc9203fca4672a2cb51910f7ab340b8ad3060bc6793af28e6fd25c3ed444ab6' \
            docs/native-retirement-support-v1.tsv | sha256sum --check

          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/native_retirement_performance_binding.py")
          text = path.read_text()
          old = 'SUPPORT_DECLARATION_SHA256 = "7a035eb922b9b26c8c5fdfb50008240612aa1ad69ac2bc3dbcb11eca514e18f4"'
          new = 'SUPPORT_DECLARATION_SHA256 = "4dc9203fca4672a2cb51910f7ab340b8ad3060bc6793af28e6fd25c3ed444ab6"'
          if text.count(old) != 1:
              raise SystemExit("reviewed support pin changed unexpectedly")
          path.write_text(text.replace(old, new))
          PY

          git add tools/native_retirement_performance_binding.py docs/native-retirement-support-v1.tsv
          git diff --cached --check
          git config user.name 'David'
          git config user.email 'davidgmbb@gmail.com'
          git commit -m 'Merge current main into PR #568 and repin support census' \
            -m 'Integrate main f5ed0ec53b06b62ea457d4cc77173c77f96c064c, retain every additive support row, and bind the validator to the exact merged declaration SHA-256. Do not change thresholds, eligibility policy, dispatch, service qualification, or performance claims.'
      - name: Validate the reconciled clean merge commit
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = e91a92ee5d14b03160342413e97902ab25eeab59
          test "$(git rev-parse HEAD^2)" = f5ed0ec53b06b62ea457d4cc77173c77f96c064c
          test -z "$(git status --porcelain)"

          python3 -m py_compile \
            tools/native_retirement_performance_binding.py \
            tools/native_retirement_performance_binding_test.py \
            tools/native_retirement_performance_identity_test.py
          python3 -W error::ResourceWarning tools/native_retirement_performance_identity_test.py -v
          python3 -W error::ResourceWarning tools/native_retirement_result_input_test.py -v
          python3 -W error::ResourceWarning tools/native_retirement_performance_binding_test.py -v

          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/retirement-build"
          "$RUNNER_TEMP/retirement-build" native_retirement_census --self-test
          python3 tools/native_retirement_contract.py self-test
          python3 tools/native_retirement_contract_test.py -v
          python3 tools/native_retirement_evidence_upload_test.py -v
          "$RUNNER_TEMP/retirement-build" native_retirement_census --manifest-only --out "$RUNNER_TEMP/contract"

          clang -std=c11 -O2 -Wall -Wextra -Werror -fwrapv \
            -fno-strict-aliasing -funsigned-char -Isrc -DBUSTER_SINGLE_THREADED=1 \
            tools/throughput/throughput.c tools/throughput/shared.c -lm \
            -o "$RUNNER_TEMP/bench-throughput-retirement"
          "$RUNNER_TEMP/bench-throughput-retirement" self-test

          git diff --check
          test -z "$(git status --porcelain)"
      - name: Push the validated merge commit
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = e91a92ee5d14b03160342413e97902ab25eeab59
          test "$(git rev-parse HEAD^2)" = f5ed0ec53b06b62ea457d4cc77173c77f96c064c
          git push origin HEAD:refs/heads/docs/511-retirement-performance-contract
