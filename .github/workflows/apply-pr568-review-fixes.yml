name: Apply PR 568 review fixes

on:
  push:
    branches:
      - automation/pr568-review-fix-20260917-001

permissions:
  contents: write

concurrency:
  group: apply-pr568-review-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out immutable helper payload
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: helper
          persist-credentials: false
      - name: Check out the exact PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/511-retirement-performance-contract
          path: target
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct and commit the reviewed patch locally
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = d70fd4b46a3537e844403f0015caf20e275f891b
          cp helper/.github/pr568-review-fix/patch-v2.gz "$RUNNER_TEMP/pr568-review.patch.gz"
          echo '0bca71190ea22116956d476454e947ab2ca82ed66b46538b43ba3040207049c4  '"$RUNNER_TEMP/pr568-review.patch.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/pr568-review.patch.gz" > "$RUNNER_TEMP/pr568-review.patch"
          echo 'b9c421338b75ba825bdac88a8f9b9cdf0b8f467636e9c71e53713cb810a7d82e  '"$RUNNER_TEMP/pr568-review.patch" | sha256sum --check
          git -C target apply --check "$RUNNER_TEMP/pr568-review.patch"
          git -C target apply --index "$RUNNER_TEMP/pr568-review.patch"
          python3 - <<'PY'
          from pathlib import Path

          guide = Path("target/docs/agents/benchmarking.md")
          text = guide.read_text()
          old = """  `python3 tools/native_retirement_performance_binding.py <record.json>
            --evidence-root <bundle> --repository-root <immutable-checkout>`; the
          """
          new = """  `python3 tools/native_retirement_performance_binding.py <record.json>
            --evidence-root <bundle> --repository-root <immutable-checkout>
            --trusted-execution-receipt-sha256 <independently-obtained-sha256>`; the
          """
          if text.count(old) != 1:
              raise SystemExit("primary benchmarking command changed unexpectedly")
          text = text.replace(old, new)
          anchor = """  relations. This validation does not itself accept a performance result.
          """
          addition = """  relations. The trusted execution-receipt digest must come out of band
            from the authenticated admitted control service for the exact job and attempt;
            never derive it from the result bundle being validated. This validation does
            not itself accept a performance result.
          """
          if text.count(anchor) != 1:
              raise SystemExit("primary benchmarking trust-boundary text changed unexpectedly")
          guide.write_text(text.replace(anchor, addition))

          tests = Path("target/tools/native_retirement_performance_binding_test.py")
          text = tests.read_text()
          old = """        row = copy.deepcopy(rows_record[\"rows\"][0])
                  row[\"row\"] = 0
                  row[\"eligibility\"] = {
          """
          new = """        row = copy.deepcopy(rows_record[\"rows\"][0])
                  row[\"row\"] = 0
                  row[\"identity\"].update({
                      \"target\": \"x86_64-unknown-linux-gnu\",
                      \"target_abi\": \"systemv-x86_64\",
                      \"artifact_stage\": \"link\",
                      \"execution_obligation\": \"semantic-gate-509\",
                  })
                  row[\"eligibility\"] = {
          """
          if text.count(old) != 1:
              raise SystemExit("bounded evidence fixture row changed unexpectedly")
          text = text.replace(old, new)
          old = """        admission[\"records\"][0].update({\"row\": 0, \"census_row\": 0,
                                                   \"identity\": parsed[0][\"identity\"],
                                                   \"artifact_stage\": \"object\"})
          """
          new = """        admission[\"records\"][0].update({\"row\": 0, \"census_row\": 0,
                                                   \"identity\": parsed[0][\"identity\"],
                                                   \"artifact_stage\": parsed[0][\"identity\"][\"artifact_stage\"]})
          """
          if text.count(old) != 1:
              raise SystemExit("bounded evidence fixture admission changed unexpectedly")
          tests.write_text(text.replace(old, new))
          PY
          rm -rf target/.github/pr568-patch
          git -C target rm .github/workflows/pr568-apply-review-fixes.yml
          git -C target add -A
          git -C target diff --cached --check
          git -C target config user.name 'David'
          git -C target config user.email 'davidgmbb@gmail.com'
          git -C target commit -m 'bench: resolve native-retirement binding review findings (#568)' \
            -m 'Authenticate the exact receipt bytes before parsing, require one supervisor-observed process instance per invocation, bind the schedule CPU and native target to admitted receipts, and derive runtime applicability from frozen row obligations. Update both performance-contract entry points and retain adversarial regressions.'
      - name: Validate the repaired binding from a clean commit
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d70fd4b46a3537e844403f0015caf20e275f891b
          test -z "$(git status --porcelain)"
          python3 -m py_compile \
            tools/native_retirement_performance_binding.py \
            tools/native_retirement_performance_binding_test.py \
            tools/native_retirement_performance_identity_test.py
          python3 -W error::ResourceWarning tools/native_retirement_performance_identity_test.py -v
          python3 -W error::ResourceWarning tools/native_retirement_result_input_test.py -v
          python3 -W error::ResourceWarning tools/native_retirement_performance_binding_test.py -v
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Push the validated fast-forward repair
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d70fd4b46a3537e844403f0015caf20e275f891b
          git push origin HEAD:refs/heads/docs/511-retirement-performance-contract
