name: Queue 437 exact-revision software validation
on:
  push:
    branches: [astra/437-durable-fake-queue-20260913]
    paths: [.github/workflows/queue437-transport.yml]
permissions:
  contents: read
concurrency:
  group: queue437-owned-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      BUSTER_TEST_JOBS: 1
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: cdad7b080eb972f0cdda589846de9a8f3cabf943
          persist-credentials: false
      - name: Bootstrap existing native build driver with hosted CI flags
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/queue437-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/queue437-evidence/revision.txt"
          clang --version | tee "$RUNNER_TEMP/queue437-evidence/toolchain.txt"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build" 2>&1 | tee "$RUNNER_TEMP/queue437-evidence/bootstrap.log"
      - name: Native queue regressions
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" bench_service self-test 2>&1 | tee "$RUNNER_TEMP/queue437-evidence/queue-normal.log"
      - name: Native queue address and undefined behavior sanitizers
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" bench_service self-test --sanitize 2>&1 | tee "$RUNNER_TEMP/queue437-evidence/queue-sanitized.log"
      - name: Existing throughput harness regressions
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" bench_throughput self-test 2>&1 | tee "$RUNNER_TEMP/queue437-evidence/throughput-normal.log"
      - name: Retain exact revision and all validation results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: queue437-software-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/queue437-evidence
          if-no-files-found: error
          retention-days: 14
