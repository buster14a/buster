name: Checker warning development probes
run-name: Checker warning probes 1393 and 1394
on:
  push:
    branches: [workbench/checker-warnings-1393-1394]
permissions:
  contents: read
jobs:
  oracle:
    name: Pinned Clang diagnostic oracle
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Restore verified hosted release inputs
        uses: ./.github/actions/hosted-tools
        with:
          artifact-name: ''
      - name: Install pinned Clang
        run: bash tools/ci/setup-hosted.sh
      - name: Run independent diagnostic probes
        shell: bash
        run: |
          set -uo pipefail
          clang --version
          for source in tests/checker-warning-probes/*.c; do
              echo "SOURCE $source"
              cat "$source"
              for mode in default wall nobuiltin freestanding gnu23; do
                  options=(-std=gnu17 -fsyntax-only -fno-caret-diagnostics -fno-color-diagnostics)
                  case "$mode" in
                      wall) options+=(-Wall);;
                      nobuiltin) options+=(-fno-builtin);;
                      freestanding) options+=(-ffreestanding);;
                      gnu23) options+=(-std=gnu23);;
                  esac
                  echo "PROBE $source $mode"
                  timeout -k 5 30 clang "${options[@]}" "$source" 2>&1
                  echo "STATUS $?"
              done
          done
