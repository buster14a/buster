name: Mission 10 capability diagnostic

on:
  push:
    branches: ['diagnostics/mission10-capability-bb96b5d']
    paths: ['.github/workflows/mission10-capability-diagnostic.yml']

permissions:
  contents: write
  actions: read

jobs:
  prototype:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage temporary transport outside the source checkout
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/mission10-validation"
          cp .github/mission10-validation.py "$RUNNER_TEMP/mission10-validation.py"
          cp .github/mission10-assume-aligned.patch.zlib.b64 "$RUNNER_TEMP/mission10-validation/transport.zlib.b64"
      - uses: actions/checkout@v4
        with:
          ref: bb96b5d08e570aff3cbd473441d71ab0dc691d67
          path: work
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mission10-baseline-a0ef63e3e867ab825d8aea5484efe14cd85a7fbf
          run-id: 35818031844
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/mission10-prior
      - name: Verify source transport and execute independent compiler oracles
        working-directory: work
        run: python3 "$RUNNER_TEMP/mission10-validation.py" prepare "$RUNNER_TEMP/mission10-validation/transport.zlib.b64"
      - name: Build and execute the unchanged baseline with valid mode options
        working-directory: work
        run: python3 "$RUNNER_TEMP/mission10-validation.py" baseline
      - name: Apply prototype one without regenerating the build tree
        id: apply
        working-directory: work
        run: python3 "$RUNNER_TEMP/mission10-validation.py" apply
      - name: Build and execute prototype one
        id: candidate
        working-directory: work
        run: python3 "$RUNNER_TEMP/mission10-validation.py" candidate
      - name: Run the registered Release suite
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        working-directory: work
        run: python3 "$RUNNER_TEMP/mission10-validation.py" suite
      - name: Preserve candidate self-host evidence
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        working-directory: work
        run: |
          test -f "$RUNNER_TEMP/mission10-validation/candidate-base-with-staged-patch-compiler.sha256"
          python3 "$RUNNER_TEMP/mission10-validation.py" self-host
      - name: Publish immutable source objects for integration review without writing refs
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        working-directory: work
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 "$RUNNER_TEMP/mission10-validation.py" publish-objects
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission10-prototype1-${{ github.sha }}
          path: ${{ runner.temp }}/mission10-validation
          if-no-files-found: error
          retention-days: 30
