name: Issue 1166 focused validation
on:
  push:
    branches: [astra/1166-mobile-checkout-validation]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6f1f7ce32ba63e3c480b3f1cce4571e2444d46e4
          persist-credentials: false
      - name: Prepare regression and prove the original failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-1166"
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'issue-1166'
          base = '6f1f7ce32ba63e3c480b3f1cce4571e2444d46e4'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == base
          workflow = Path('.github/workflows/ci.yml')
          test = Path('tools/ci_native_observation_test.py')
          expected = {str(workflow): 'ffc5c29e81b3a4269b7eb151e3b18eb0183850ce', str(test): '34bc34c6e1596ae056080bde14aab4832a235401'}
          for path, sha in expected.items():
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha
          opening = '$' + '{{ '
          closing = ' }}'
          old_condition = opening + '!cancelled()' + closing
          new_condition = opening + "!cancelled() && steps.checkout.outcome == 'success'" + closing
          old_assertion = '        self.assertIn("if: ' + old_condition + '", upload)\n'
          new_assertion = '        self.assertIn("if: ' + new_condition + '", upload)\n'
          regression = r'''
                  # Exercise the actual caller condition, not the composite's internal
                  # retry guards. Only this small conjunction vocabulary is supported;
                  # Actions adds success() implicitly when no status function appears.
                  condition = re.search(r"(?m)^        if: \$\{\{ (.+) \}\}$", upload)
                  self.assertIsNotNone(condition)
                  terms = condition.group(1).split(" && ")
                  scenarios = (
                      ("success", False, None, True),
                      ("success", False, "setup", True),
                      ("success", False, "build", True),
                      ("success", False, "test", True),
                      ("success", False, "summary", True),
                      ("failure", False, "checkout", False),
                      ("skipped", False, "checkout", False),
                      ("cancelled", False, "checkout", False),
                      ("", False, "checkout", False),
                      ("success", True, None, False),
                      ("success", True, "test", False),
                      ("failure", True, "checkout", False),
                  )
                  for lane, _, _, _ in entries:
                      for checkout, cancelled, earlier_failure, expected in scenarios:
                          with self.subTest(lane=lane, checkout=checkout, cancelled=cancelled,
                                            earlier_failure=earlier_failure):
                              values = {
                                  "!cancelled()": not cancelled,
                                  "success()": checkout == "success" and earlier_failure is None and not cancelled,
                                  "always()": True,
                                  "steps.checkout.outcome == 'success'": checkout == "success",
                              }
                              self.assertTrue(set(terms) <= values.keys())
                              explicit_status = any(term in terms for term in ("!cancelled()", "success()", "always()"))
                              enabled = all(values[term] for term in terms)
                              if not explicit_status:
                                  enabled = enabled and values["success()"]
                              self.assertEqual(expected, enabled)
                  self.assertIn("id: checkout", steps["Checkout"])
                  self.assertLess(mobile.index("      - name: Checkout"), mobile.index("      - name: Retain mobile logs"))
                  # Retaining evidence must never forgive a checkout or payload failure.
                  self.assertNotRegex(mobile, r"(?m)^\s*continue-on-error:")
          '''
          import textwrap
          regression = textwrap.indent(textwrap.dedent(regression).strip() + '\n', '        ')
          source = test.read_text(encoding='utf-8')
          assert source.count(old_assertion) == 1
          test.write_text(source.replace(old_assertion, regression + new_assertion), encoding='utf-8')
          command = ['python3', '-B', str(test), 'NativeObservationTest.test_mobile_log_upload_reuses_bounded_action_for_all_matrix_entries', '-v']
          result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          (root / 'baseline-negative.log').write_text(result.stdout, encoding='utf-8')
          print(result.stdout)
          assert result.returncode == 1 and 'FAILED (failures=' in result.stdout
          assert "checkout='failure'" in result.stdout and 'False != True' in result.stdout
          assert 'ERROR:' not in result.stdout
          print('BASELINE_NEGATIVE_CONTROL expected_failure=confirmed')
          original = '      - name: Retain mobile logs\n        if: ' + old_condition + '\n'
          replacement = '      - name: Retain mobile logs\n        if: ' + new_condition + '\n'
          replacement += '        # Loading a local action requires checkout, not successful build/test steps.\n'
          source = workflow.read_text(encoding='utf-8')
          assert source.count(original) == 1
          workflow.write_text(source.replace(original, replacement), encoding='utf-8')
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert sorted(changed) == sorted(expected)
          subprocess.run(['git', 'diff', '--check'], check=True)
          (root / 'candidate.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary']))
          for path in expected:
              target = root / 'candidate' / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(Path(path).read_bytes())
          PY
      - name: Focused regression suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/ci_native_observation_test.py -v 2>&1 | tee "$RUNNER_TEMP/issue-1166/native-observation.log"
          python3 -B tests/action_pins_test.py -v 2>&1 | tee "$RUNNER_TEMP/issue-1166/action-pins.log"
          python3 -B tools/check_action_pins.py 2>&1 | tee "$RUNNER_TEMP/issue-1166/action-pin-scan.log"
          python3 -B tests/ci_tools_test.py -v 2>&1 | tee "$RUNNER_TEMP/issue-1166/ci-tools.log"
      - name: Pinned workflow lint
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 -color .github/workflows/*.yml 2>&1 | tee "$RUNNER_TEMP/issue-1166/actionlint.log"
      - name: Publish verified blobs without updating any refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          paths = ['.github/workflows/ci.yml', 'tools/ci_native_observation_test.py']
          assert os.environ['GITHUB_REPOSITORY'] == 'buster14a/buster'
          assert os.environ['GITHUB_REF'] == 'refs/heads/astra/1166-mobile-checkout-validation'
          assert sorted(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()) == paths
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          packet = {
              'base_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'base_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'candidate_tree': subprocess.check_output(['git', 'write-tree'], text=True).strip(),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'files': [],
          }
          for path in paths:
              content = Path(path).read_bytes()
              expected_sha = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              request = urllib.request.Request(
                  'https://api.github.com/repos/buster14a/buster/git/blobs',
                  data=json.dumps({'content': base64.b64encode(content).decode('ascii'), 'encoding': 'base64'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'},
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  sha = json.load(response)['sha']
              assert sha == expected_sha
              packet['files'].append({'path': path, 'sha': sha, 'bytes': len(content), 'sha256': hashlib.sha256(content).hexdigest()})
          encoded = json.dumps(packet, indent=2) + '\n'
          (Path(os.environ['RUNNER_TEMP']) / 'issue-1166' / 'candidate-blobs.json').write_text(encoded, encoding='utf-8')
          print(encoded)
          PY
      - name: Retain validation packet
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-1166-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-1166/
          if-no-files-found: error
          retention-days: 7
