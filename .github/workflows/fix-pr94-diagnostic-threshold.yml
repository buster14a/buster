name: Fix PR 94 formatter diagnostic threshold

on:
  push:
    branches:
      - claude/unruffled-bhabha-f5d28a
    paths:
      - .github/workflows/fix-pr94-diagnostic-threshold.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: claude/unruffled-bhabha-f5d28a
          fetch-depth: 0
      - name: Tighten malformed-string threshold
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/buster/lib/string.c')
          text = path.read_text()
          old = 'if (BUSTER_UNLIKELY(string.length > ARENA_MAX_RESERVATION))'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two diagnostic guards, found {count}')
          new = 'if (BUSTER_UNLIKELY(string.length > arena->reserved_size - arena->position))'
          path.write_text(text.replace(old, new))
          PY
      - name: Commit diagnostics and remove this workflow
        shell: bash
        run: |
          git config user.name David
          git config user.email davidgmbb@gmail.com
          git rm .github/workflows/fix-pr94-diagnostic-threshold.yml
          git add src/buster/lib/string.c
          git commit -m "ci: diagnose strings exceeding arena capacity"
          git push origin HEAD:claude/unruffled-bhabha-f5d28a
