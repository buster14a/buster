name: Issue 267 verified publication
on:
  push:
    branches: [work/issue-267-encoding-snapshot]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish exact tested trees
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .issue267/publish.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-267-published
          path: ${{ runner.temp }}/published.json
          retention-days: 7
          if-no-files-found: error
