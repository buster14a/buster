name: Issue 267 source
on:
  push:
    branches: [work/issue-267-encoding-snapshot]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Capture baseline
        run: |
          git archive --format=tar.gz cfe58e298fcfc13781b7b3f2ae50d2e1e2556bc2 -o "$RUNNER_TEMP/issue-267-source.tar.gz"
          git bundle create "$RUNNER_TEMP/issue-267-history.bundle" --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-267-source
          path: |
            ${{ runner.temp }}/issue-267-source.tar.gz
            ${{ runner.temp }}/issue-267-history.bundle
          retention-days: 1
          if-no-files-found: error
