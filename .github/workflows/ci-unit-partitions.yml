name: Unit process partition experiment

# Same-binary diagnostic only. Normal CI already enables the partition runner
# for sanitized Clang trees; this workflow retains independent A/B evidence.
on:
  pull_request:
    paths:
      - '.github/workflows/ci-unit-partitions.yml'
      - 'build.c'
      - 'CMakeLists.txt'
      - 'tools/ci_unit_tests*'
      - 'src/buster/tests/test.c'
  workflow_dispatch:
    inputs:
      pairs:
        description: One screening pair or three alternating pairs
        required: true
        default: '1'
        type: choice
        options: ['1', '3']
      baseline_jobs:
        description: Baseline workers; 4 matches the candidate's total budget
        required: false
        default: '2'
        type: choice
        options: ['2', '4']

permissions:
  contents: read

concurrency:
  group: unit-partitions-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  experiment:
    if: >-
      ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/1826-isolated-test-partitions') }}
    name: Unit partition experiment (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
            python: python
            driver: build/build.exe
            binary: build/ci-unit-tree/Debug/ide.exe
          - platform: linux
            runner: ubuntu-26.04
            python: python3
            driver: build/build
            binary: build/ci-unit-tree/Debug/ide
    env:
      BUSTER_TEST_JOBS: '2'
      BUSTER_TEST_TABLE_AUDITS: '0'
      BUSTER_UNIT_PAIRS: ${{ github.event_name == 'workflow_dispatch' && inputs.pairs || '1' }}
      BUSTER_UNIT_BASELINE_JOBS: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_jobs || '2' }}
      BUSTER_CI_PYTHON: ${{ matrix.python }}
      BUSTER_UNIT_DRIVER: ${{ matrix.driver }}
      BUSTER_UNIT_BINARY: ${{ matrix.binary }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Linux linker
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mold

      - name: Install latest stable LLVM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_TARGET: x86_64-${{ matrix.platform }}
        run: |
          set -euo pipefail
          "$BUSTER_CI_PYTHON" tools/ci_llvm.py --target "$LLVM_TARGET" --work-directory "$RUNNER_TEMP/llvm" \
            --github-path "$GITHUB_PATH" --github-env "$GITHUB_ENV"

      - name: Bootstrap Linux driver
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o build/build

      - name: Bootstrap Windows driver
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPaths = @(& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw 'Visual Studio x86-64 tools were not found' }
          & (Join-Path $VsPaths[0].Trim() 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:BUSTER_CI_LLVM_BIN;$env:PATH"
          # Every later native fixture needs the same SDK and CRT discovery as
          # this bootstrap. A new Actions step does not inherit this shell.
          foreach ($Name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'VCINSTALLDIR',
                              'VSINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion', 'UniversalCRTSdkDir',
                              'UCRTVersion', 'VSCMD_ARG_TGT_ARCH', 'VSCMD_ARG_HOST_ARCH', 'VSCMD_VER', 'SystemRoot')) {
            $Value = [Environment]::GetEnvironmentVariable($Name)
            if ([string]::IsNullOrWhiteSpace($Value)) {
              if ($Name -in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VSCMD_ARG_TGT_ARCH')) {
                throw "Visual Studio did not initialize $Name"
              }
              continue
            }
            $Delimiter = 'BUSTER_UNIT_ENV_' + [guid]::NewGuid().ToString('N')
            Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "$Name<<$Delimiter"
            Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value $Value
            Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value $Delimiter
          }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cmd /d /s /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o build\build.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify persisted Windows compiler environment
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($Name in @('INCLUDE', 'LIB', 'LIBPATH')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($Name))) {
              throw "Missing persisted Visual Studio $Name"
            }
          }
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw 'Expected the x64 Visual Studio target' }
          $LinkPath = (Get-Command link.exe -ErrorAction Stop).Source
          if (-not $LinkPath.StartsWith($env:VCINSTALLDIR, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Expected the Visual Studio linker, found $LinkPath"
          }
          Write-Output "Native linker: $LinkPath"
          if (-not (Test-Path -LiteralPath (Join-Path $env:SystemRoot 'System32\ucrtbase.dll'))) {
            throw 'The native Windows UCRT DLL could not be found'
          }
          $ProbeSource = Join-Path $env:RUNNER_TEMP 'buster-unit-crt-probe.c'
          $ProbeBinary = Join-Path $env:RUNNER_TEMP 'buster-unit-crt-probe.exe'
          Set-Content -LiteralPath $ProbeSource -Value '#include <stdlib.h>\nint main(void) { _exit(0); }'.Replace('\n', "`n")
          cmd /d /s /c "clang `"$ProbeSource`" -o `"$ProbeBinary`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $ProbeBinary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Linux controls and build one shared binary
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unit-partitions/phases"
          # The standalone observer needs a marker; this is not a desktop
          # matrix plan and is never submitted to CI-complete admission.
          printf '{}\n' > "$RUNNER_TEMP/unit-partitions/phases/plan.json"
          source_revision=$(git rev-parse HEAD)
          echo "BUSTER_TEST_SOURCE_REVISION=$source_revision" >> "$GITHUB_ENV"
          clang --version > "$RUNNER_TEMP/unit-partitions/toolchain.txt"
          "$BUSTER_CI_PYTHON" tools/ci_unit_tests_measure_test.py -v
          "$BUSTER_CI_PYTHON" tools/ci_unit_tests_campaign_test.py -v
          "$BUSTER_UNIT_DRIVER" test_units_partitioned --self-test
          "$BUSTER_UNIT_DRIVER" generate --build-directory build/ci-unit-tree --cc clang --ci --sanitize --fuzz --config Debug
          "$BUSTER_UNIT_DRIVER" build --build-directory build/ci-unit-tree --config Debug -t ide
          "$BUSTER_UNIT_DRIVER" build --build-directory build/ci-unit-tree --config Debug -t test_unit_inventory > "$RUNNER_TEMP/unit-partitions/inventory.log" 2>&1

      - name: Validate Windows controls and build one shared binary
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = Join-Path $env:RUNNER_TEMP 'unit-partitions'
          New-Item -ItemType Directory -Force -Path (Join-Path $Root 'phases') | Out-Null
          [IO.File]::WriteAllText((Join-Path $Root 'phases\plan.json'), "{}`n", (New-Object Text.UTF8Encoding($false)))
          $Revision = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "BUSTER_TEST_SOURCE_REVISION=$Revision"
          cmd /d /s /c "clang --version > `"$Root\toolchain.txt`" 2>&1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:BUSTER_CI_PYTHON tools/ci_unit_tests_measure_test.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:BUSTER_CI_PYTHON tools/ci_unit_tests_campaign_test.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:BUSTER_UNIT_DRIVER test_units_partitioned --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /d /s /c "`"$env:BUSTER_UNIT_DRIVER`" generate --build-directory build/ci-unit-tree --cc clang --ci --sanitize --fuzz --config Debug 2>&1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /d /s /c "`"$env:BUSTER_UNIT_DRIVER`" build --build-directory build/ci-unit-tree --config Debug -t ide 2>&1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /d /s /c "`"$env:BUSTER_UNIT_DRIVER`" build --build-directory build/ci-unit-tree --config Debug -t test_unit_inventory > `"$Root\inventory.log`" 2>&1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Leave ten minutes beyond the native child deadline for startup,
      # cleanup, replay and failure proof before the observer terminates it.
      - name: Serial baseline 1
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        env:
          BUSTER_TEST_JOBS: ${{ env.BUSTER_UNIT_BASELINE_JOBS }}
        run: |
          set -euo pipefail
          "$BUSTER_UNIT_DRIVER" matrix_phase_run "$RUNNER_TEMP/unit-partitions/phases" sample-1-baseline 1 6000 -- \
            "$BUSTER_UNIT_DRIVER" build --build-directory build/ci-unit-tree --config Debug -t test_units \
            2>&1 | tee "$RUNNER_TEMP/unit-partitions/sample-1-baseline.log"

      - name: Partitioned candidate 1
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        env:
          BUSTER_TEST_JOBS: '4'
        run: |
          set -euo pipefail
          "$BUSTER_UNIT_DRIVER" matrix_phase_run "$RUNNER_TEMP/unit-partitions/phases" sample-2-candidate 1 6000 -- \
            "$BUSTER_UNIT_DRIVER" build --build-directory build/ci-unit-tree --config Debug -t test_units_partitioned \
            2>&1 | tee "$RUNNER_TEMP/unit-partitions/sample-2-candidate.log"

      - name: Additional alternating pairs
        if: ${{ matrix.platform == 'linux' && env.BUSTER_UNIT_PAIRS == '3' }}
        shell: bash
        run: |
          set -euo pipefail
          # Identical native invocations on the same binary; no reconfiguration
          # or cross-runner artifact transfer between measurements.
          BUSTER_TEST_JOBS="$BUSTER_UNIT_BASELINE_JOBS" "$BUSTER_UNIT_DRIVER" matrix_phase_run "$RUNNER_TEMP/unit-partitions/phases" sample-3-baseline 1 6000 -- \
            "$BUSTER_UNIT_DRIVER" build --build-directory build/ci-unit-tree --config Debug -t test_units \
            2>&1 | tee "$RUNNER_TEMP/unit-partitions/sample-3-baseline.log"
          BUSTER_TEST_JOBS=4 "$BUSTER_UNIT_DRIVER" matrix_phase_run "$RUNNER_TEMP/unit-partitions/phases" sample-4-candidate 1 6000 -- \
            "$BUSTER_UNIT_DRIVER" build --build-directory build/ci-unit-tree --config Debug -t test_units_partitioned \
            2>&1 | tee "$RUNNER_TEMP/unit-partitions/sample-4-candidate.log"
          BUSTER_TEST_JOBS="$BUSTER_UNIT_BASELINE_JOBS" "$BUSTER_UNIT_DRIVER" matrix_phase_run "$RUNNER_TEMP/unit-partitions/phases" sample-5-baseline 1 6000 -- \
            "$BUSTER_UNIT_DRIVER" build --build-directory build/ci-unit-tree --config Debug -t test_units \
            2>&1 | tee "$RUNNER_TEMP/unit-partitions/sample-5-baseline.log"
          BUSTER_TEST_JOBS=4 "$BUSTER_UNIT_DRIVER" matrix_phase_run "$RUNNER_TEMP/unit-partitions/phases" sample-6-candidate 1 6000 -- \
            "$BUSTER_UNIT_DRIVER" build --build-directory build/ci-unit-tree --config Debug -t test_units_partitioned \
            2>&1 | tee "$RUNNER_TEMP/unit-partitions/sample-6-candidate.log"

      - name: Windows paired measurements
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = Join-Path $env:RUNNER_TEMP 'unit-partitions'
          # Keep native Windows environment names and paths out of MSYS
          # translation, just like the ordinary Windows combination step.
          $env:BUSTER_TEST_JOBS = $env:BUSTER_UNIT_BASELINE_JOBS
          cmd /d /s /c "`"$env:BUSTER_UNIT_DRIVER`" matrix_phase_run `"$Root\phases`" sample-1-baseline 1 6000 -- `"$env:BUSTER_UNIT_DRIVER`" build --build-directory build/ci-unit-tree --config Debug -t test_units 2>&1" | Tee-Object -FilePath (Join-Path $Root 'sample-1-baseline.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BUSTER_TEST_JOBS = '4'
          cmd /d /s /c "`"$env:BUSTER_UNIT_DRIVER`" matrix_phase_run `"$Root\phases`" sample-2-candidate 1 6000 -- `"$env:BUSTER_UNIT_DRIVER`" build --build-directory build/ci-unit-tree --config Debug -t test_units_partitioned 2>&1" | Tee-Object -FilePath (Join-Path $Root 'sample-2-candidate.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:BUSTER_UNIT_PAIRS -eq '3') {
            $env:BUSTER_TEST_JOBS = $env:BUSTER_UNIT_BASELINE_JOBS
            cmd /d /s /c "`"$env:BUSTER_UNIT_DRIVER`" matrix_phase_run `"$Root\phases`" sample-3-baseline 1 6000 -- `"$env:BUSTER_UNIT_DRIVER`" build --build-directory build/ci-unit-tree --config Debug -t test_units 2>&1" | Tee-Object -FilePath (Join-Path $Root 'sample-3-baseline.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:BUSTER_TEST_JOBS = '4'
            cmd /d /s /c "`"$env:BUSTER_UNIT_DRIVER`" matrix_phase_run `"$Root\phases`" sample-4-candidate 1 6000 -- `"$env:BUSTER_UNIT_DRIVER`" build --build-directory build/ci-unit-tree --config Debug -t test_units_partitioned 2>&1" | Tee-Object -FilePath (Join-Path $Root 'sample-4-candidate.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:BUSTER_TEST_JOBS = $env:BUSTER_UNIT_BASELINE_JOBS
            cmd /d /s /c "`"$env:BUSTER_UNIT_DRIVER`" matrix_phase_run `"$Root\phases`" sample-5-baseline 1 6000 -- `"$env:BUSTER_UNIT_DRIVER`" build --build-directory build/ci-unit-tree --config Debug -t test_units 2>&1" | Tee-Object -FilePath (Join-Path $Root 'sample-5-baseline.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:BUSTER_TEST_JOBS = '4'
            cmd /d /s /c "`"$env:BUSTER_UNIT_DRIVER`" matrix_phase_run `"$Root\phases`" sample-6-candidate 1 6000 -- `"$env:BUSTER_UNIT_DRIVER`" build --build-directory build/ci-unit-tree --config Debug -t test_units_partitioned 2>&1" | Tee-Object -FilePath (Join-Path $Root 'sample-6-candidate.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Review exact evidence
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BUSTER_UNIT_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          "$BUSTER_CI_PYTHON" tools/ci_unit_tests_campaign.py --directory "$RUNNER_TEMP/unit-partitions" \
            --binary "$BUSTER_UNIT_BINARY" --platform "$BUSTER_UNIT_PLATFORM" --pairs "$BUSTER_UNIT_PAIRS"

      - name: Retain experiment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-partitions-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit-partitions/
          if-no-files-found: warn
          retention-days: 14
