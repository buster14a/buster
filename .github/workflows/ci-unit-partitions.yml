name: Unit process partition experiment

# Diagnostic only. Normal Buster CI retains its original test invocation until
# same-binary measurements justify enabling the opt-in native command.
on:
  pull_request:
    paths:
      - '.github/workflows/ci-unit-partitions.yml'
      - 'build.c'
      - 'CMakeLists.txt'
      - 'tools/ci_unit_tests*'
      - 'src/buster/tests/test.c'
  workflow_dispatch:
    inputs:
      pairs:
        description: One screening pair or three alternating pairs
        required: true
        default: '1'
        type: choice
        options: ['1', '3']

permissions:
  contents: read

concurrency:
  group: unit-partitions-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  experiment:
    if: >-
      ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/1826-isolated-test-partitions') }}
    name: Unit partition experiment (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
            python: python
            driver: build/build.exe
            binary: build/ci-unit-tree/Debug/ide.exe
          - platform: linux
            runner: ubuntu-26.04
            python: python3
            driver: build/build
            binary: build/ci-unit-tree/Debug/ide
    env:
      BUSTER_TEST_JOBS: '2'
      BUSTER_TEST_TABLE_AUDITS: '0'
      BUSTER_UNIT_PAIRS: ${{ github.event_name == 'workflow_dispatch' && inputs.pairs || '1' }}
      BUSTER_CI_PYTHON: ${{ matrix.python }}
      BUSTER_UNIT_DRIVER: ${{ matrix.driver }}
      BUSTER_UNIT_BINARY: ${{ matrix.binary }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Linux linker
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mold

      - name: Install latest stable LLVM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_TARGET: x86_64-${{ matrix.platform }}
        run: |
          set -euo pipefail
          "$BUSTER_CI_PYTHON" tools/ci_llvm.py --target "$LLVM_TARGET" --work-directory "$RUNNER_TEMP/llvm" \
            --github-path "$GITHUB_PATH" --github-env "$GITHUB_ENV"

      - name: Bootstrap Linux driver
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o build/build

      - name: Bootstrap Windows driver
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPaths = @(& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw 'Visual Studio x86-64 tools were not found' }
          & (Join-Path $VsPaths[0].Trim() 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:BUSTER_CI_LLVM_BIN;$env:PATH"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'PATH<<BUSTER_UNIT_COMPILER_PATH'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value $env:PATH
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'BUSTER_UNIT_COMPILER_PATH'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VSCMD_ARG_TGT_ARCH=$env:VSCMD_ARG_TGT_ARCH"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o build\build.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate controls and build one shared binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unit-partitions/phases"
          # The standalone observer needs a marker; this is not a desktop
          # matrix plan and is never submitted to CI-complete admission.
          printf '{}\n' > "$RUNNER_TEMP/unit-partitions/phases/plan.json"
          source_revision=$(git rev-parse HEAD)
          echo "BUSTER_TEST_SOURCE_REVISION=$source_revision" >> "$GITHUB_ENV"
          clang --version > "$RUNNER_TEMP/unit-partitions/toolchain.txt"
          "$BUSTER_CI_PYTHON" tools/ci_unit_tests_measure_test.py -v
          "$BUSTER_CI_PYTHON" tools/ci_unit_tests_campaign_test.py -v
          "$BUSTER_UNIT_DRIVER" test_units_partitioned --self-test
          "$BUSTER_UNIT_DRIVER" generate --build-directory build/ci-unit-tree --cc clang --ci --sanitize --fuzz --config Debug
          "$BUSTER_UNIT_DRIVER" build --build-directory build/ci-unit-tree --config Debug -t ide
          "$BUSTER_UNIT_DRIVER" build --build-directory build/ci-unit-tree --config Debug -t test_unit_inventory > "$RUNNER_TEMP/unit-partitions/inventory.log" 2>&1

      - name: Serial baseline 1
        shell: bash
        run: |
          set -euo pipefail
          "$BUSTER_UNIT_DRIVER" matrix_phase_run "$RUNNER_TEMP/unit-partitions/phases" sample-1-baseline 1 5400 -- \
            "$BUSTER_UNIT_DRIVER" build --build-directory build/ci-unit-tree --config Debug -t test_units \
            2>&1 | tee "$RUNNER_TEMP/unit-partitions/sample-1-baseline.log"

      - name: Partitioned candidate 1
        shell: bash
        env:
          BUSTER_TEST_JOBS: '4'
        run: |
          set -euo pipefail
          "$BUSTER_UNIT_DRIVER" matrix_phase_run "$RUNNER_TEMP/unit-partitions/phases" sample-2-candidate 1 5400 -- \
            "$BUSTER_UNIT_DRIVER" build --build-directory build/ci-unit-tree --config Debug -t test_units_partitioned \
            2>&1 | tee "$RUNNER_TEMP/unit-partitions/sample-2-candidate.log"

      - name: Additional alternating pairs
        if: ${{ env.BUSTER_UNIT_PAIRS == '3' }}
        shell: bash
        run: |
          set -euo pipefail
          # Identical native invocations on the same binary; no reconfiguration
          # or cross-runner artifact transfer between measurements.
          "$BUSTER_UNIT_DRIVER" matrix_phase_run "$RUNNER_TEMP/unit-partitions/phases" sample-3-baseline 1 5400 -- \
            "$BUSTER_UNIT_DRIVER" build --build-directory build/ci-unit-tree --config Debug -t test_units \
            2>&1 | tee "$RUNNER_TEMP/unit-partitions/sample-3-baseline.log"
          BUSTER_TEST_JOBS=4 "$BUSTER_UNIT_DRIVER" matrix_phase_run "$RUNNER_TEMP/unit-partitions/phases" sample-4-candidate 1 5400 -- \
            "$BUSTER_UNIT_DRIVER" build --build-directory build/ci-unit-tree --config Debug -t test_units_partitioned \
            2>&1 | tee "$RUNNER_TEMP/unit-partitions/sample-4-candidate.log"
          "$BUSTER_UNIT_DRIVER" matrix_phase_run "$RUNNER_TEMP/unit-partitions/phases" sample-5-baseline 1 5400 -- \
            "$BUSTER_UNIT_DRIVER" build --build-directory build/ci-unit-tree --config Debug -t test_units \
            2>&1 | tee "$RUNNER_TEMP/unit-partitions/sample-5-baseline.log"
          BUSTER_TEST_JOBS=4 "$BUSTER_UNIT_DRIVER" matrix_phase_run "$RUNNER_TEMP/unit-partitions/phases" sample-6-candidate 1 5400 -- \
            "$BUSTER_UNIT_DRIVER" build --build-directory build/ci-unit-tree --config Debug -t test_units_partitioned \
            2>&1 | tee "$RUNNER_TEMP/unit-partitions/sample-6-candidate.log"

      - name: Review exact evidence
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BUSTER_UNIT_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          "$BUSTER_CI_PYTHON" tools/ci_unit_tests_campaign.py --directory "$RUNNER_TEMP/unit-partitions" \
            --binary "$BUSTER_UNIT_BINARY" --platform "$BUSTER_UNIT_PLATFORM" --pairs "$BUSTER_UNIT_PAIRS"

      - name: Retain experiment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-partitions-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit-partitions/
          if-no-files-found: warn
          retention-days: 14
