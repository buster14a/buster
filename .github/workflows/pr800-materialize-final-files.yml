name: Materialize PR 800 final files

on:
  push:
    branches:
      - fix/72-aarch64-binary128
    paths:
      - .github/workflows/pr800-materialize-final-files.yml

permissions:
  contents: write

concurrency:
  group: pr800-materialize-final-files
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Inline the regression source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          fixture_path = Path("tests/basic_c_aarch64_binary128_transport.c")
          driver_path = Path("src/buster/tests/compiler/driver/driver_test.c")
          docs_path = Path("docs/agents/frontend/wide-floats-assembly.md")

          fixture = fixture_path.read_text()
          driver = driver_path.read_text()
          start_marker = (
              "BUSTER_GLOBAL_LOCAL UnitTestResult "
              "compiler_driver_test_aarch64_binary128_transport(UnitTestArguments* arguments)\n"
              "{\n"
              "    UnitTestResult result = {0};\n"
          )
          next_marker = (
              "BUSTER_GLOBAL_LOCAL UnitTestResult "
              "compiler_driver_test_aarch64_float_to_i128(UnitTestArguments* arguments)"
          )
          start = driver.find(start_marker)
          if start < 0 or driver.find(start_marker, start + 1) >= 0:
              raise SystemExit("binary128 function marker is not unique")
          end = driver.find(next_marker, start)
          if end < 0:
              raise SystemExit("next function marker is missing")

          function = driver[start:end]
          old_path = 'S8("tests/basic_c_aarch64_binary128_transport.c")'
          if function.count(old_path) != 4:
              raise SystemExit(f"unexpected fixture path count: {function.count(old_path)}")

          literal = "".join("        " + json.dumps(line) + "\n" for line in fixture.splitlines(keepends=True))
          prologue = start_marker + """    String8 source_path = buster_test_temporary_path(
              arguments->arena, S8("buster-a64-f128-transport-source"), S8(".c"));
              String8 source = S8(
          """ + literal + """    );
              if (!BUSTER_REQUIRE(arguments, file_write(source_path, BUSTER_SLICE_TO_BYTE_SLICE(source))))
              {
                  return result;
              }
          """
          function = function.replace(start_marker, prologue, 1).replace(old_path, "source_path")

          return_marker = """    return result;
          }

          // Keep the complete conversion fixture strict on all desktop AArch64 targets.
          // Foreign object success is not execution evidence; native hosts run it too.
          """
          if function.count(return_marker) != 1:
              raise SystemExit(f"unexpected anchored return count: {function.count(return_marker)}")
          function = function.replace(
              return_marker,
              """    BUSTER_TEST(arguments, os_file_delete(source_path));
              return result;
          }

          // Keep the complete conversion fixture strict on all desktop AArch64 targets.
          // Foreign object success is not execution evidence; native hosts run it too.
          """,
              1,
          )
          driver_path.write_text(driver[:start] + function + driver[end:])

          docs = docs_path.read_text()
          old_docs = "`basic_c_aarch64_binary128_transport.c` covers Q0/Q1, ninth-argument stack"
          new_docs = "`compiler_driver_test_aarch64_binary128_transport` covers Q0/Q1, ninth-argument stack"
          if docs.count(old_docs) != 1:
              raise SystemExit(f"unexpected documentation reference count: {docs.count(old_docs)}")
          docs_path.write_text(docs.replace(old_docs, new_docs, 1))
          fixture_path.unlink()
          PY

          git diff --check
          test ! -e tests/basic_c_aarch64_binary128_transport.c
          test "$(git hash-object docs/agents/frontend/wide-floats-assembly.md)" = 147ab80172921ca0576ee105250c60ee2f6fb4f9
          test "$(git hash-object src/buster/tests/compiler/driver/driver_test.c)" = 4121e3b1166a0af0949b9ce918c85e5fa5c665a9
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/pr800-build"

          git config user.name David
          git config user.email davidgmbb@gmail.com
          git add -A docs/agents/frontend/wide-floats-assembly.md \
            src/buster/tests/compiler/driver/driver_test.c \
            tests/basic_c_aarch64_binary128_transport.c
          git commit -m 'tests: keep binary128 transport outside frozen corpus'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
