name: Issue 1249 isolated workspace

# Temporary, task-branch-only workspace. Remove before the implementation PR.
on:
  push:
    branches: [work/1249-semantic-before-syntax]
    paths: [.github/workflows/issue-1249-work.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Retain exact source for this investigation
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/buster-1249-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-1249-source
          path: ${{ runner.temp }}/buster-1249-source.tar.gz
          retention-days: 1
      - name: Install the approved hosted toolchain
        run: bash tools/ci/setup-hosted.sh
      - name: Build the baseline compiler
        run: BUSTER_HOST_ARCH=x86-64 ./build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-1249-baseline
          path: build/compiler
          retention-days: 1
