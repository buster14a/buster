name: Native investigation

# A focused hosted demonstration. Ordinary CI and self-hosting remain separate.
on:
  pull_request:
    paths:
      - '.github/workflows/native-investigation.yml'
      - 'CMakeLists.txt'
      - 'src/buster/apps/ide/ide.c'
      - 'src/buster/lib/compiler/codegen/**'
      - 'src/buster/lib/compiler/driver/**'
      - 'src/buster/lib/compiler/ir/**'
      - 'src/buster/tests/compiler/codegen/investigation_test.*'
      - 'src/buster/tests/compiler/driver/fixtures/investigation.c'
      - 'src/buster/tests/test.c'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-investigation-${{ github.event_name }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pinned-baseline:
    name: Pinned baseline self-host fixed point
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ubuntu-26.04
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 6fc08ec475694aeb3b1062c1d390483a69668508
          persist-credentials: false
      - name: Record actual baseline checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Reproduce the inspected baseline fixed point
        shell: bash
        run: |
          set -euo pipefail
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char -g build.c -o "$RUNNER_TEMP/buster-investigation-baseline"
          "$RUNNER_TEMP/buster-investigation-baseline" generate --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/buster-investigation-baseline" test_self_host --config Release
  smoke:
    name: Linux x86-64 investigation evidence
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      BUSTER_TEST_JOBS: '2'
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ubuntu-26.04
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Bootstrap the native build driver
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-investigation-logs"
          clang --version | tee "$RUNNER_TEMP/native-investigation-logs/toolchain.txt"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char -g build.c -o "$RUNNER_TEMP/buster-investigation-build" 2>&1 | tee "$RUNNER_TEMP/native-investigation-logs/bootstrap.log"
      - name: Configure the exact compiler revision
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-investigation-build" generate --cc clang --ci --linker DEFAULT -- -DBUSTER_INVESTIGATION_REVISION="$GITHUB_SHA" 2>&1 | tee "$RUNNER_TEMP/native-investigation-logs/configure.log"
      - name: Build the compiler
        id: compiler
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-investigation-build" build --config Release -t ide -- -j2 2>&1 | tee "$RUNNER_TEMP/native-investigation-logs/build.log"
          sha256sum "$RUNNER_TEMP/buster-investigation-build" build/Release/ide | tee "$RUNNER_TEMP/native-investigation-logs/binary-identities.txt"
          git rev-parse HEAD 'HEAD^{tree}' | tee "$RUNNER_TEMP/native-investigation-logs/source-identities.txt"
          uname -a | tee "$RUNNER_TEMP/native-investigation-logs/host.txt"
          lscpu | tee -a "$RUNNER_TEMP/native-investigation-logs/host.txt"
      - name: Run focused capture and consumer regressions
        shell: bash
        run: |
          set -euo pipefail
          build/Release/ide test --module=investigation_tests --ci=1 --verbose=1 2>&1 | tee "$RUNNER_TEMP/native-investigation-logs/tests.log"
      - name: Capture and answer the unsigned conversion investigation
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          build/Release/ide cc -target x86_64-linux -march=baseline -nostdinc -g0 -fregister-allocator=fast -fno-machine-fallback -fverify-codegen -finvestigation=build/native-investigation.bcap -finvestigation-function=cast_unsigned -c src/buster/tests/compiler/driver/fixtures/investigation.c -o build/native-investigation.o 2>&1 | tee "$RUNNER_TEMP/native-investigation-logs/capture.log"
          build/Release/ide investigate build/native-investigation.bcap build/native-investigation.o --expect-revision="$GITHUB_SHA" 2>&1 | tee build/native-investigation.txt
      - name: Report the source-size ratchet
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        shell: bash
        env:
          SOURCE_SIZE_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-investigation-build" source_size --base "$SOURCE_SIZE_BASE_REVISION" 2>&1 | tee "$RUNNER_TEMP/native-investigation-logs/source-size.log"
      - name: Retain the native generated acknowledgment candidate
        # Generate after capture; this changes metadata in the working tree.
        # A failed ratchet remains failed. Maintainers review before publication.
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-investigation-build" source_size --write-baseline 2>&1 | tee "$RUNNER_TEMP/native-investigation-logs/source-size-baseline.log"
          cp docs/source-size-baseline.txt "$RUNNER_TEMP/native-investigation-logs/source-size-baseline.txt"
          printf 'SOURCE_SIZE_BASELINE_GENERATED_BEGIN revision=%s\n' "$GITHUB_SHA"
          cat "$RUNNER_TEMP/native-investigation-logs/source-size-baseline.txt"
          printf 'SOURCE_SIZE_BASELINE_GENERATED_END\n'
      - name: Retain machine records in existing evidence
        if: ${{ !cancelled() }}
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: retain
          retention-directory: ${{ runner.temp }}/native-investigation-logs
      - name: Retain investigation evidence even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-investigation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/native-investigation.bcap
            build/native-investigation.o
            build/native-investigation.txt
            build/CMakeCache.txt
            build/compile_commands.json
            ${{ runner.temp }}/native-investigation-logs/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6
