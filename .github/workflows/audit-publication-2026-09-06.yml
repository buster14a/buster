name: Publish September 6 audit

on:
  push:
    branches:
      - audit/2026-09-06-publication

permissions:
  contents: write

concurrency:
  group: audit-publication-2026-09-06
  cancel-in-progress: false

jobs:
  publish:
    if: github.server_url == 'https://github.com' && github.repository == 'buster14a/buster' && github.ref == 'refs/heads/audit/2026-09-06-publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify audit package, test patches, and publish separate branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/audit-publication-checkout"
          cd "$RUNNER_TEMP/audit-publication-checkout"
          git init -q
          git remote add origin https://github.com/buster14a/buster.git
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          python3 -u .audit-publication/publish_ci.py
