name: Repair PR 796 iOS shutdown

on:
  push:
    branches:
      - fix/786-native-retirement-closure

concurrency:
  group: repair-pr796-ios-shutdown-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Extend hosted Apple Silicon shutdown budget
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path

          path = Path("ios/launch_simulator.sh")
          text = path.read_text(encoding="utf-8")
          old = '''shutdown_timeout_seconds=${BUSTER_IOS_SHUTDOWN_TIMEOUT_SECONDS:-30}
          monitor_command_timeout_seconds=${BUSTER_IOS_MONITOR_COMMAND_TIMEOUT_SECONDS:-10}
          '''
          new = '''shutdown_timeout_seconds=${BUSTER_IOS_SHUTDOWN_TIMEOUT_SECONDS:-30}
          # GitHub's macOS 26 Apple-Silicon CoreSimulator can need substantially
          # longer than 30 seconds to quiesce after the full Debug+Release batch.
          # Preserve the tighter local/self-hosted budget and every explicit caller
          # override, but give the hosted arm64 lane enough time to complete an
          # orderly shutdown before the postcondition recovery path is needed.
          if [[ -z ${BUSTER_IOS_SHUTDOWN_TIMEOUT_SECONDS:-} \\
              && ${GITHUB_ACTIONS:-false} == true \\
              && ${RUNNER_ENVIRONMENT:-} == github-hosted \\
              && ${RUNNER_OS:-} == macOS \\
              && ${RUNNER_ARCH:-} == ARM64 \\
              && ${BUSTER_IOS_ARCH:-arm64} == arm64 ]]; then
              shutdown_timeout_seconds=90
          fi
          monitor_command_timeout_seconds=${BUSTER_IOS_MONITOR_COMMAND_TIMEOUT_SECONDS:-10}
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one shutdown-budget anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PYTHON

      - name: Validate iOS lifecycle policy
        run: |
          set -euo pipefail
          bash -n ios/launch_simulator.sh
          python3 ios/hosted_signing_budget_test.py

      - name: Commit the repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/launch_simulator.sh
          git commit -m 'fix(ci): allow hosted iOS shutdown to quiesce'
          git push origin HEAD:"${GITHUB_REF_NAME}"
