name: Compiler throughput

on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline commit or ref (PRs always use their immutable base SHA)
        default: main
        required: true
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: throughput-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Native harness tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o build/build
          ./build/build bench_throughput self-test
          python3 -W error::ResourceWarning tools/throughput/retirement_execution_test.py build/throughput-tool-tests
          # Compile the optional reporter without rebuilding the full compiler.
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char -DBUSTER_BENCH_ALLOCATIONS=1 build.c -o build/build-census
          BUSTER_ALLOCATION_CENSUS=1 ./build/build-census self_host_audit_self_test 2> build/allocation-census.log
          python3 tools/allocation_census.py --input build/allocation-census.log --output build/allocation-census-report --label 'build-driver CI smoke'
      - name: Native harness tests (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPath = (& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1).Trim()
          if (-not $VsPath) { throw 'Visual Studio C++ toolchain not found' }
          & (Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          New-Item -ItemType Directory -Force build | Out-Null
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference build.c -lws2_32 -o build/build.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/build.exe bench_throughput self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -W error::ResourceWarning tools/throughput/retirement_execution_test.py build/throughput-tool-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -fwrapv -fno-strict-aliasing -funsigned-char -DBUSTER_BENCH_ALLOCATIONS=1 build.c -lws2_32 -o build/build-census.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BUSTER_ALLOCATION_CENSUS = '1'
          # Native redirection preserves the UTF-8 report bytes in Windows PowerShell.
          cmd /d /c 'build\build-census.exe self_host_audit_self_test 2> build\allocation-census.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:BUSTER_ALLOCATION_CENSUS
          python tools/allocation_census.py --input build/allocation-census.log --output build/allocation-census-report --label 'build-driver CI smoke'
          exit $LASTEXITCODE
      - name: Native harness sanitizers (Linux)
        if: ${{ cancelled() == false && runner.os == 'Linux' }}
        shell: bash
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          mkdir -p build
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o build/build
          ./build/build bench_throughput self-test --sanitize
          python3 -W error::ResourceWarning tools/throughput/retirement_execution_test.py build/throughput-tool-tests-sanitized
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: throughput-harness-${{ matrix.os }}
          path: |
            build/throughput-tool-tests
            build/throughput-tool-tests-sanitized
            build/allocation-census.log
            build/allocation-census-report
          retention-days: 7
          if-no-files-found: warn

  regression-guard:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    needs: harness
    timeout-minutes: 35
    steps:
      # Neither fork code nor compiler output receives credentials or a shared
      # cache. Both compilers are built sequentially, before any measurement.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline_ref || github.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - name: Record checked-out revisions
        shell: bash
        run: |
          set -euo pipefail
          printf 'BUSTER_THROUGHPUT_BASE_SHA=%s\n' "$(git -C baseline rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'BUSTER_THROUGHPUT_HEAD_SHA=%s\n' "$(git -C candidate rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build and compare on this runner
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o build/build
          ./build/build bench_throughput_ci ../baseline
      - name: Publish comparison
        if: always()
        shell: bash
        run: |
          if test -f candidate/build/throughput-ci-results/summary.md; then
            cat candidate/build/throughput-ci-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Benchmark incomplete. Inspect the build and compiler logs; no performance verdict was produced.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compiler-throughput-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/build/throughput-ci-results
            candidate/build/throughput-ci-compiler/CMakeCache.txt
            candidate/build/throughput-ci-compiler/compile_commands.json
            baseline/build/throughput-ci-compiler/CMakeCache.txt
            baseline/build/throughput-ci-compiler/compile_commands.json
          retention-days: 14
          if-no-files-found: warn

  direct-ssa-census:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    needs: harness
    timeout-minutes: 35
    env:
      BUSTER_TEST_JOBS: '2'
    steps:
      # Diagnostic-only compiler, isolated from the uninstrumented timing job.
      # #497's registered geometric work budgets are compiled out otherwise.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install existing Linux linker dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mold
      - name: Build diagnostic compiler with bounded parallelism
        id: compiler
        shell: bash
        run: |
          set -euo pipefail
          # generate replaces build/, so keep the driver and evidence outside it.
          mkdir -p direct-ssa-census-evidence
          exec > >(tee direct-ssa-census-evidence/build.log) 2>&1
          set -x
          git rev-parse HEAD 'HEAD^{tree}'
          clang --version
          cmake --version
          ninja --version
          uname -a
          lscpu
          free -b
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o "$RUNNER_TEMP/buster-census-build"
          "$RUNNER_TEMP/buster-census-build" generate --config Release --cc clang --ci -DBUSTER_UNITY_BUILD=OFF -DBUSTER_INCLUDE_TESTS=ON -DBUSTER_BENCH_ALLOCATIONS=ON
          "$RUNNER_TEMP/buster-census-build" build --config Release -t ide -- -j2
          grep -Fx 'BUSTER_BENCH_ALLOCATIONS:BOOL=ON' build/CMakeCache.txt
          grep -Fx 'BUSTER_UNITY_BUILD:BOOL=OFF' build/CMakeCache.txt
          sha256sum build/Release/ide src/buster/apps/ide/ide.c > direct-ssa-census-evidence/inputs.sha256
          find build/generated -type f -print0 | sort -z | xargs -0 sha256sum > direct-ssa-census-evidence/generated.sha256
          git diff --exit-code
      - name: Run registered compiler tests including geometric SSA work budgets
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-census-build" build --config Release -t test_all -- -j2 2>&1 | tee direct-ssa-census-evidence/tests.log
      - name: Census current unity input with direct SSA
        id: direct
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          BUSTER_ALLOCATION_CENSUS=1 ./build/Release/ide cc -Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -g -c -fsource-metrics=direct-ssa-census-evidence/direct.metrics src/buster/apps/ide/ide.c -o build/unity-direct.o > direct-ssa-census-evidence/direct.stdout.log 2> direct-ssa-census-evidence/direct.stderr.log
          test -s direct-ssa-census-evidence/direct.metrics
          sha256sum build/unity-direct.o > direct-ssa-census-evidence/direct-output.sha256
          python3 tools/allocation_census.py --input direct-ssa-census-evidence/direct.stderr.log --output direct-ssa-census-evidence/direct-allocation --label 'current-head direct SSA; diagnostic only'
      - name: Census the same unity input with shared local promotion
        id: reference
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          BUSTER_ALLOCATION_CENSUS=1 ./build/Release/ide cc -Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -g -c -fno-frontend-ssa -fsource-metrics=direct-ssa-census-evidence/reference.metrics src/buster/apps/ide/ide.c -o build/unity-reference.o > direct-ssa-census-evidence/reference.stdout.log 2> direct-ssa-census-evidence/reference.stderr.log
          test -s direct-ssa-census-evidence/reference.metrics
          sha256sum build/unity-reference.o > direct-ssa-census-evidence/reference-output.sha256
          python3 tools/allocation_census.py --input direct-ssa-census-evidence/reference.stderr.log --output direct-ssa-census-evidence/reference-allocation --label 'current-head shared local promotion; diagnostic only'
      - name: Report census scope without a performance verdict
        if: always()
        shell: bash
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          DIRECT_RESULT: ${{ steps.direct.outcome }}
          REFERENCE_RESULT: ${{ steps.reference.outcome }}
        run: |
          printf '## Direct-SSA diagnostic census\n\nRegistered tests: **%s**. Direct SSA: **%s**. Shared local promotion: **%s**.\n\nArtifacts retain source metrics, raw allocation reports, compiler/input identities and failures. This instrumented job is not a timing comparison, a sanitizer or self-host gate, or dedicated Ryzen 9700X performance acceptance for #447.\n' "$TEST_RESULT" "$DIRECT_RESULT" "$REFERENCE_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: direct-ssa-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            direct-ssa-census-evidence
            build/CMakeCache.txt
            build/compile_commands.json
          retention-days: 14
          if-no-files-found: warn
