name: Compiler throughput

on:
  push:
    branches: [bench/compiler-throughput-suite]

permissions:
  contents: read

concurrency:
  group: compiler-throughput-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-workspace:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Export frozen source for local benchmark validation
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: throughput-source-workspace
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
          if-no-files-found: error
