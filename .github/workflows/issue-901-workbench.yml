name: Issue 901 workbench
on:
  push:
    branches: [codex/901-source-workbench]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: f09ea4859875c7836e2a61b64242d2ede09d0d2d
      - name: Export exact source
        run: git archive --format=tar.gz --output=source-901.tar.gz HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-901
          path: source-901.tar.gz
          if-no-files-found: error
          retention-days: 1
