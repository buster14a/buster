name: Temporary QUALITY scheduler source snapshot

on:
  push:
    branches: [diagnostics/133-event-equivalence-2e942e8]
    paths: [.github/workflows/diagnostic-133-source.yml]

permissions:
  contents: read

jobs:
  source:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2e942e80a87666409cf29d3e24a68d322b9e71fd
          persist-credentials: false
      - name: Retain immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quality-133-source"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/quality-133-source/identity.txt"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/quality-133-source/source.tar.gz"
          sha256sum "$RUNNER_TEMP/quality-133-source/source.tar.gz" > "$RUNNER_TEMP/quality-133-source/sha256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-133-pinned-source
          path: ${{ runner.temp }}/quality-133-source
          retention-days: 7
          if-no-files-found: error
