name: Issue 732 workspace
on:
  push:
    branches: [chatgpt/issue-732-vector-integration]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: 0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Apply and publish checked source transport
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/issue732-fix.b64; then
            base64 -d .github/issue732-fix.b64 | gzip -d > "$RUNNER_TEMP/implementation.patch"
            echo "f639d8c68eb094da4ddca2e4ea1bdabd2d420a90f6e807c616b4faa92bbafc37  $RUNNER_TEMP/implementation.patch" | sha256sum --check
            git apply --check "$RUNNER_TEMP/implementation.patch"
            git apply "$RUNNER_TEMP/implementation.patch"
            git rm .github/issue732-fix.b64
            git add src/buster/compiler
            git -c user.name=ChatGPT -c user.email=noreply@openai.com commit -m 'fix(ir): preserve scalar lowering clients and sparse interpreter admission'
            git push origin HEAD:chatgpt/issue-732-vector-integration
          fi
          git diff --check
          git archive --format=tar.gz --output="$RUNNER_TEMP/issue-732-source.tar.gz" HEAD
      - name: Install qualified hosted toolchain
        run: bash tools/ci/setup-hosted.sh
      - name: Build
        shell: bash
        run: set -o pipefail; ./build.sh 2>&1 | tee "$RUNNER_TEMP/issue-732-build.log"
      - name: Focused regression tests
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for test in test-ir test-ir-parse test-ir-simd test-ir-lowering test-ir-interpreter; do
            build/compiler "$test" 2>&1 | tee "$RUNNER_TEMP/issue-732-$test.log" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-732-validation
          path: |
            ${{ runner.temp }}/issue-732-*.log
            ${{ runner.temp }}/issue-732-source.tar.gz
          retention-days: 2
