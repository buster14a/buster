# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
name: Issue 732 workspace
on:
  push:
    branches: [chatgpt/issue-732-vector-integration]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Export exact source for isolated editing
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: issue-732-source
          path: source.tar.gz
          retention-days: 1
