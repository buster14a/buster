name: A03 inspection
on:
  push:
    branches: [astra/a03-20260909-ci-inspection]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          persist-credentials: false
          fetch-depth: 80
      - name: Snapshot source and paginated discussions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a03"
          git archive HEAD | gzip > "$RUNNER_TEMP/a03/source.tar.gz"
          git log -80 --format=fuller --stat > "$RUNNER_TEMP/a03/recent-commits.txt"
          gh api --paginate 'repos/buster14a/buster/issues?state=all&per_page=100' --slurp > "$RUNNER_TEMP/a03/issues.json"
          gh api --paginate 'repos/buster14a/buster/pulls?state=all&per_page=100' --slurp > "$RUNNER_TEMP/a03/pulls.json"
          gh api --paginate 'repos/buster14a/buster/issues/comments?per_page=100' --slurp > "$RUNNER_TEMP/a03/issue-comments.json"
          gh api --paginate 'repos/buster14a/buster/pulls/comments?per_page=100' --slurp > "$RUNNER_TEMP/a03/review-comments.json"
          gh api 'repos/buster14a/buster/branches/main' > "$RUNNER_TEMP/a03/main.json"
          sha256sum "$RUNNER_TEMP/a03/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a03-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/a03/
          retention-days: 7
          if-no-files-found: error
