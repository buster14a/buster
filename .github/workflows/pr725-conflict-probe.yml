name: PR 725 integrate current main

on:
  push:
    branches:
      - fix/665-builtin-capabilities
    paths:
      - .github/workflows/pr725-conflict-probe.yml

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out topic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current main, preserve #665, and retire helper
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/665-builtin-capabilities
          helper=.github/workflows/pr725-conflict-probe.yml
          source_path=src/buster/lib/compiler/frontend/c/c_source.c
          driver_path=src/buster/tests/compiler/driver/driver_test.c
          c_test_path=src/buster/tests/compiler/frontend/c/c_test.c
          manifest_path=docs/native-retirement-support-v1.tsv
          ours_driver=$(mktemp)
          ours_c_test=$(mktemp)
          ours_manifest_row=$(mktemp)
          trap 'rm -f "$ours_driver" "$ours_c_test" "$ours_manifest_row"' EXIT

          git config user.name 'PR 725 integration'
          git config user.email 'pr725-integration@users.noreply.github.com'
          cp "$driver_path" "$ours_driver"
          cp "$c_test_path" "$ours_c_test"
          grep '^tests/basic_c_has_builtin\.c[[:space:]]' "$manifest_path" >"$ours_manifest_row"
          test -s "$ours_manifest_row"

          git fetch --no-tags origin main
          printf 'PR725_TOPIC_SHA=%s\n' "$(git rev-parse HEAD)"
          printf 'PR725_MAIN_SHA=%s\n' "$(git rev-parse origin/main)"

          if git merge-base --is-ancestor origin/main HEAD; then
              git rm "$helper"
              git commit -m 'ci: retire PR 725 integration helper'
              git push origin HEAD:"$branch"
              exit 0
          fi

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 && $merge_status -ne 1 ]]; then
              printf 'error: git merge exited with unexpected status %s\n' "$merge_status" >&2
              exit 1
          fi

          if [[ $merge_status -eq 1 ]]; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
              printf 'PR725_CONFLICT_COUNT=%s\n' "${#conflicts[@]}"
              printf 'PR725_CONFLICT_FILE=%s\n' "${conflicts[@]}"
              for path in "${conflicts[@]}"; do
                  case "$path" in
                      "$driver_path")
                          git checkout --theirs -- "$driver_path"
                          python3 - "$ours_driver" "$driver_path" <<'PY'
          from pathlib import Path
          import sys

          ours = Path(sys.argv[1]).read_text()
          path = Path(sys.argv[2])
          merged = path.read_text()
          marker = "// #665: a positive query must reach the selected non-native backend too.\n"
          next_marker = "// #666: inspect the bytes the selected object writer actually emitted, not\n"
          start = ours.index(marker)
          end = ours.index(next_marker, start)
          fixture = ours[start:end].rstrip() + "\n\n"
          assert merged.count(next_marker) == 1
          assert "UnitTestResult compiler_driver_test_has_builtin_targets" not in merged
          merged = merged.replace(next_marker, fixture + next_marker, 1)
          registration = "    BUSTER_TEST_FIXTURE(arguments, compiler_driver_test_has_builtin_targets);\n"
          anchor = "    BUSTER_TEST_FIXTURE(arguments, compiler_driver_test_attribute_queries);\n"
          assert merged.count(anchor) == 1
          assert registration not in merged
          merged = merged.replace(anchor, anchor + registration, 1)
          assert merged.count("UnitTestResult compiler_driver_test_has_builtin_targets") == 1
          assert merged.count(registration) == 1
          path.write_text(merged)
          PY
                          git add "$driver_path"
                          ;;
                      "$c_test_path")
                          git checkout --theirs -- "$c_test_path"
                          python3 - "$ours_c_test" "$c_test_path" <<'PY'
          from pathlib import Path
          import sys

          ours = Path(sys.argv[1]).read_text()
          path = Path(sys.argv[2])
          merged = path.read_text()
          marker = "// #665: query the real preprocessor with an independent exact-name census.\n"
          next_marker = "BUSTER_GLOBAL_LOCAL UnitTestResult c_test_preprocessor_short_circuit(UnitTestArguments* arguments)\n"
          start = ours.index(marker)
          end = ours.index(next_marker, start)
          fixture = ours[start:end].rstrip() + "\n\n"
          assert merged.count(next_marker) == 1
          assert "UnitTestResult c_test_has_builtin" not in merged
          merged = merged.replace(next_marker, fixture + next_marker, 1)
          registration = "    BUSTER_TEST_FIXTURE(arguments, c_test_has_builtin);\n"
          anchor = "    BUSTER_TEST_FIXTURE(arguments, c_test_preprocessor_short_circuit);\n"
          assert merged.count(anchor) == 1
          assert registration not in merged
          merged = merged.replace(anchor, registration + anchor, 1)
          assert merged.count("UnitTestResult c_test_has_builtin") == 1
          assert merged.count(registration) == 1
          path.write_text(merged)
          PY
                          git add "$c_test_path"
                          ;;
                      "$manifest_path")
                          git checkout --theirs -- "$manifest_path"
                          python3 - "$ours_manifest_row" "$manifest_path" <<'PY'
          from pathlib import Path
          import sys

          row = Path(sys.argv[1]).read_text().strip()
          path = Path(sys.argv[2])
          lines = path.read_text().splitlines()
          assert lines and lines[0].startswith("path\trole\t")
          if row not in lines:
              lines.append(row)
              lines[1:] = sorted(lines[1:], key=lambda line: line.split("\t", 1)[0])
          assert lines.count(row) == 1
          path.write_text("\n".join(lines) + "\n")
          PY
                          git add "$manifest_path"
                          ;;
                      "$source_path")
                          echo 'error: c_source.c unexpectedly conflicted after its reviewed integration' >&2
                          git checkout --conflict=merge -- "$source_path" || true
                          grep -n -B 30 -A 30 -E '^(<<<<<<<|=======|>>>>>>>)' "$source_path" || true
                          exit 1
                          ;;
                      *)
                          printf 'error: unreviewed merge conflict: %s\n' "$path" >&2
                          git checkout --conflict=merge -- "$path" || true
                          grep -n -B 30 -A 30 -E '^(<<<<<<<|=======|>>>>>>>)' "$path" || true
                          exit 1
                          ;;
                  esac
              done
          fi

          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
              echo 'error: unresolved merge conflicts remain' >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
          fi
          if grep -n -E '^(<<<<<<<|=======|>>>>>>>)' "$source_path" "$driver_path" "$c_test_path"; then
              echo 'error: conflict markers remain' >&2
              exit 1
          fi

          git rm "$helper"
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Merge current main into fix/665-builtin-capabilities'
          git push origin HEAD:"$branch"
