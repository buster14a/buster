name: Issue 775 remaining row checks
on:
  push:
    branches: [codex/775-baseline-vectors]
    paths: [.github/workflows/issue-775-check-rows.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/775-baseline-vectors
      - id: source
        shell: bash
        env:
          PATCH: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,base64,gzip,hashlib,pathlib
          s=os.environ['PATCH'].replace('npqqVac','npqVac').replace('YZkkkFys','YZkkFys')
          p=gzip.decompress(base64.b64decode(s))
          assert hashlib.sha256(p).hexdigest()=='96cde7e2e11daae0462959a9338edad7df751eea7b56961d2be439a46b62123c'
          pathlib.Path('/tmp/775.patch').write_bytes(p)
          PY
          git apply --check /tmp/775.patch
          git apply /tmp/775.patch
          git diff --check
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git add src/buster/compiler
          env -u BUSTER_DCO_SIGN_OFF git commit -m 'fix(x86): classify legacy shuffle and conversion effects'
          git push origin HEAD:refs/heads/codex/775-baseline-vectors
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: apply
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: 0
      BUSTER_ORACLE_CACHE: check
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - run: bash tools/ci/setup-hosted.sh
      - name: Build and test
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/issue775"
          ./build.sh > "$RUNNER_TEMP/issue775/build.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/issue775/build.log"
          if [ "$result" -eq 0 ]; then
            for suite in test-tier0 'test-checker --program-vectors' test-x86-target test-x86-semantics; do
              name=${suite%% *}
              ./build/compiler $suite > "$RUNNER_TEMP/issue775/$name.log" 2>&1
              result=$((result | $?))
              cat "$RUNNER_TEMP/issue775/$name.log"
            done
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/issue775/commit.txt"
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue775-rows
          path: ${{ runner.temp }}/issue775
          retention-days: 7
