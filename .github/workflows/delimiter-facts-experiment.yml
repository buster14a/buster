name: Delimiter fact experiment
on:
  push:
    branches: [codex/2183-publish-delimiter-pairs]
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      BUSTER_TEST_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the frozen baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/research/delimiter-facts/run.py --baseline c5a073139691e9111986c4fca6f6b03d2a6dfcf1 --candidate "${{ github.sha }}" --out "$RUNNER_TEMP/delimiter-evidence"
      - name: Publish raw evidence including failures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: delimiter-facts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delimiter-evidence
          retention-days: 30
          if-no-files-found: error
