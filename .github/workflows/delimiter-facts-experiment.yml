name: Delimiter fact experiment
on:
  push:
    branches: [codex/2183-publish-delimiter-pairs]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      BUSTER_TEST_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reproduce anchored baseline fixed point
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delimiter-evidence
          exec > >(tee delimiter-evidence/baseline.log) 2>&1
          git rev-parse HEAD 'HEAD^{tree}'
          clang --version
          uname -a
          lscpu
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/buster-delimiter-build"
          "$RUNNER_TEMP/buster-delimiter-build" generate --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/buster-delimiter-build" build --config Release -t ide -- -j2
          "$RUNNER_TEMP/buster-delimiter-build" test_self_host --config Release
          sha256sum build/Release/ide > delimiter-evidence/compiler.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: delimiter-baseline-${{ github.sha }}-${{ github.run_id }}
          path: delimiter-evidence
          retention-days: 14
          if-no-files-found: error
