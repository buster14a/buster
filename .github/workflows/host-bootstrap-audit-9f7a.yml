name: Host bootstrap research 9f7a

# Isolated correctness research. No benchmark, deployment or admission gate.
on:
  push:
    branches: [codex/host-bootstrap-audit-ade6ac4b-9f7a]
    paths: [.github/workflows/host-bootstrap-audit-9f7a.yml]

permissions:
  contents: read

jobs:
  full-compiler:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: research
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ade6ac4b6ecb21f30b61b656439bac476c145e2f
          fetch-depth: 1
          persist-credentials: false
          path: pinned
      - name: Compare supported host build, contraction diagnostic and bootstrap generations
        shell: bash
        env:
          LC_ALL: C
          TZ: UTC
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/host-audit-full"
          python3 research/tools/investigations/host-bootstrap-9f7a/full_probe.py "$GITHUB_WORKSPACE/pinned" "$RUNNER_TEMP/host-audit-full" 2>&1 | tee "$RUNNER_TEMP/host-audit-full/driver.log"
      - name: Retain named parser code and identities
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          for variant in default contract-off; do
            compiler="$RUNNER_TEMP/host-bootstrap-work-$variant/build/Release/ide"
            if test -f "$compiler"; then
              sha256sum "$compiler" >> "$RUNNER_TEMP/host-audit-full/built-compiler-hashes.txt"
              objdump -d --disassemble=c_ir_float_parse "$compiler" > "$RUNNER_TEMP/host-audit-full/$variant-parser-disassembly.txt"
            fi
          done
      - name: Retain all results including failed or unavailable legs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: host-bootstrap-full-9f7a-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-audit-full
          if-no-files-found: error
          retention-days: 14
