name: Benchmark service MCP lifecycle

on:
  pull_request:
    paths:
      - 'tools/bench_service/**'
      - '.github/workflows/bench-service-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-service-mcp-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Replay service and shared-stdio MCP regressions
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable \
            -fwrapv -fno-strict-aliasing -funsigned-char -g \
            build.c -o "$RUNNER_TEMP/bench-service-mcp-build"
          "$RUNNER_TEMP/bench-service-mcp-build" bench_service self-test
      - name: Check source growth and whitespace
        shell: bash
        env:
          MCP_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_revision=${MCP_BASE_REVISION:-$(git merge-base origin/main HEAD)}
          "$RUNNER_TEMP/bench-service-mcp-build" source_size --base "$base_revision"
          git diff --check "$base_revision" HEAD
