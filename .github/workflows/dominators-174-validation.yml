name: Dominator qualification snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/dominators-174-validation.yml'

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/174-source-dominance'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive the exact public source for isolated validation
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/dominators-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dominators-source
          path: ${{ runner.temp }}/dominators-source.tar.gz
          retention-days: 1
