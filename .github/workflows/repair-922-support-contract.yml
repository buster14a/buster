name: Repair PR 922 support contract

on:
  push:
    branches:
      - codex/869-merge-conflict-preflight

permissions:
  contents: write

concurrency:
  group: repair-pr-922-support-contract
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.repository == 'buster14a/buster' && github.ref == 'refs/heads/codex/869-merge-conflict-preflight' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact repair commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Refresh the registered support-file identity and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import csv
          import hashlib
          from pathlib import Path

          ledger = Path("docs/native-retirement-support-v1.tsv")
          target = Path("tests/ci_tools_test.py")
          fields = ("path", "role", "compile_obligation", "bytes", "sha256")

          with ledger.open("r", encoding="utf-8", newline="") as stream:
              reader = csv.DictReader(stream, delimiter="\t")
              if tuple(reader.fieldnames or ()) != fields:
                  raise SystemExit(f"unexpected support-contract fields: {reader.fieldnames!r}")
              rows = list(reader)

          data = target.read_bytes()
          expected_bytes = str(len(data))
          expected_sha256 = hashlib.sha256(data).hexdigest()
          matched = [row for row in rows if row["path"] == target.as_posix()]
          if len(matched) != 1:
              raise SystemExit(f"expected exactly one {target} row, found {len(matched)}")
          row = matched[0]
          if row["role"] != "support-file" or row["compile_obligation"] != "dependency-only":
              raise SystemExit(f"unexpected {target} contract: {row!r}")
          previous = (row["bytes"], row["sha256"])
          row["bytes"] = expected_bytes
          row["sha256"] = expected_sha256
          if previous == (row["bytes"], row["sha256"]):
              raise SystemExit(f"{target} identity was already current")

          temporary = ledger.with_suffix(ledger.suffix + ".tmp")
          with temporary.open("w", encoding="utf-8", newline="") as stream:
              writer = csv.DictWriter(stream, fieldnames=fields, delimiter="\t", lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          temporary.replace(ledger)
          print(f"refreshed {target}: bytes={expected_bytes} sha256={expected_sha256}")
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/native-retirement-support-v1.tsv
          git rm -- .github/workflows/repair-922-support-contract.yml
          expected_paths=$'.github/workflows/repair-922-support-contract.yml\ndocs/native-retirement-support-v1.tsv'
          test "$(git diff --cached --name-only)" = "$expected_paths"
          git commit -m 'ci: refresh native-retirement support contract'
          git push --force-with-lease="$GITHUB_REF:$GITHUB_SHA" origin "HEAD:$GITHUB_REF"
