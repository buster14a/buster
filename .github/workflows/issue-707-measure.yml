name: Issue 707 experiment (candidate)

# Temporary, issue-scoped measurement harness. The native build driver still
# owns compiler discovery, configuration, probes, scheduling, coverage, builds,
# and tests. This workflow is removed after the retained #707 evidence exists.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  measure:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' && github.event.pull_request.number == 749 }}
    name: Issue 707 candidate ${{ matrix.os }} ${{ matrix.case }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2025
            zig_target: x86_64-windows
            python: python
            case: timed-1
            shard: all
            profile: '0'
            warm: '0'
          - os: windows
            runner: windows-2025
            zig_target: x86_64-windows
            python: python
            case: timed-2
            shard: all
            profile: '0'
            warm: '0'
          - os: windows
            runner: windows-2025
            zig_target: x86_64-windows
            python: python
            case: timed-3
            shard: all
            profile: '0'
            warm: '0'
          - os: windows
            runner: windows-2025
            zig_target: x86_64-windows
            python: python
            case: profile-cold
            shard: checks
            profile: '1'
            warm: '0'
          - os: windows
            runner: windows-2025
            zig_target: x86_64-windows
            python: python
            case: profile-warm
            shard: checks
            profile: '1'
            warm: '1'
          - os: macos
            runner: macos-26-intel
            zig_target: x86_64-macos
            python: python3
            case: timed-1
            shard: all
            profile: '0'
            warm: '0'
          - os: macos
            runner: macos-26-intel
            zig_target: x86_64-macos
            python: python3
            case: timed-2
            shard: all
            profile: '0'
            warm: '0'
          - os: macos
            runner: macos-26-intel
            zig_target: x86_64-macos
            python: python3
            case: timed-3
            shard: all
            profile: '0'
            warm: '0'
          - os: macos
            runner: macos-26-intel
            zig_target: x86_64-macos
            python: python3
            case: profile-cold
            shard: checks
            profile: '1'
            warm: '0'
          - os: macos
            runner: macos-26-intel
            zig_target: x86_64-macos
            python: python3
            case: profile-warm
            shard: checks
            profile: '1'
            warm: '1'
    env:
      ISSUE707_ARM: candidate
      BUSTER_MATRIX_SHARD: ${{ matrix.shard }}
      BUSTER_CMAKE_PROFILE: ${{ matrix.profile }}
      BUSTER_MATRIX_THREADS: '4'
      BUSTER_CI_PYTHON: ${{ matrix.python }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set measurement paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'BUSTER_CI_COVERAGE_OUTPUT=%s/issue707/coverage.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'ZIG_GLOBAL_CACHE_DIR=%s/issue707-zig-global-%s\n' "$RUNNER_TEMP" '${{ matrix.case }}' >> "$GITHUB_ENV"

      - name: Restore verified Zig archive
        id: zig_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/zig-archive/archive
          key: zig-archive-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.zig_target }}-${{ hashFiles('.github/zig.json') }}

      - name: Install verified Zig
        shell: bash
        env:
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue707"
          "$BUSTER_CI_PYTHON" tools/ci_zig.py --target "$ZIG_TARGET" --cache-directory "$RUNNER_TEMP/zig-archive" --install-directory "$RUNNER_TEMP/zig" 2>&1 | tee "$RUNNER_TEMP/issue707/zig-install.log"

      - name: Select Windows compilers
        if: ${{ matrix.os == 'windows' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $VsWhere)) { throw "vswhere was not found at $VsWhere" }
          $VsPaths = @(& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw 'Visual Studio x64 tools were not found' }
          $VsPath = $VsPaths[0].Trim()
          & (Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          $Delimiter = 'ISSUE707_WINDOWS_PATH'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PATH<<$Delimiter"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value $env:PATH
          Add-Content -LiteralPath $env:GITHUB_ENV -Value $Delimiter
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VSCMD_ARG_TGT_ARCH=$env:VSCMD_ARG_TGT_ARCH"
          foreach ($Compiler in @('cl', 'clang', 'gcc', 'zig')) {
            where.exe $Compiler
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Reset runtime caches and record identity
        shell: bash
        env:
          ISSUE707_CASE: ${{ matrix.case }}
          ISSUE707_RUNNER: ${{ matrix.runner }}
          ISSUE707_ZIG_ARCHIVE_HIT: ${{ steps.zig_cache.outputs.cache-hit }}
          ISSUE707_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -rf "$ZIG_GLOBAL_CACHE_DIR"
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR" "$RUNNER_TEMP/issue707"
          {
            echo "arm=$ISSUE707_ARM"
            echo "case=$ISSUE707_CASE"
            echo "runner=$ISSUE707_RUNNER"
            echo "archive_cache_hit=$ISSUE707_ZIG_ARCHIVE_HIT"
            echo "github_sha=$GITHUB_SHA"
            echo "head_sha=$ISSUE707_HEAD_SHA"
            echo "matrix_shard=$BUSTER_MATRIX_SHARD"
            echo "cmake_profile=$BUSTER_CMAKE_PROFILE"
            echo "matrix_threads=$BUSTER_MATRIX_THREADS"
            echo "zig_global_cache_dir=$ZIG_GLOBAL_CACHE_DIR"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "image_os=${ImageOS-unknown}"
            echo "image_version=${ImageVersion-unknown}"
            git rev-parse HEAD 'HEAD^{tree}'
            cmake --version
            ninja --version
            clang --version
            gcc --version
            zig version
            zig env
          } > "$RUNNER_TEMP/issue707/identity.txt" 2>&1
          cat "$RUNNER_TEMP/issue707/identity.txt"

      - name: Prepare warm Zig runtime cache
        if: ${{ matrix.warm == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/issue707/warm.c" <<'EOF'
          #include <stddef.h>
          int main(void) { return (int)sizeof(size_t) == 0; }
          EOF
          "$BUSTER_CI_PYTHON" - "$RUNNER_TEMP/issue707/warm.c" "$RUNNER_TEMP/issue707/warm-output" "$RUNNER_TEMP/issue707/cache-prep.json" <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          import time

          source, output, report = map(Path, sys.argv[1:])
          samples = []
          for index in range(2):
              target = output.with_name(output.name + str(index))
              started = time.perf_counter()
              completed = subprocess.run(
                  ['zig', 'cc', str(source), '-o', str(target)],
                  capture_output=True,
                  text=True,
              )
              elapsed = time.perf_counter() - started
              samples.append({
                  'index': index,
                  'seconds': elapsed,
                  'returncode': completed.returncode,
                  'stdout': completed.stdout,
                  'stderr': completed.stderr,
              })
              if completed.returncode != 0:
                  raise SystemExit(completed.returncode)
          report.write_text(json.dumps({'samples': samples}, indent=2) + '\n', encoding='utf-8')
          PY
          cat "$RUNNER_TEMP/issue707/cache-prep.json"

      - name: Run complete native matrix on macOS
        if: ${{ matrix.os == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build "$RUNNER_TEMP/issue707"
          exec > >(tee "$RUNNER_TEMP/issue707/combinations.log") 2>&1
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o build/build
          ./build/build test_all_combinations_ci --verbose=1

      - name: Run complete native matrix on Windows
        if: ${{ matrix.os == 'windows' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Logs = Join-Path $env:RUNNER_TEMP 'issue707'
          New-Item -ItemType Directory -Force -Path $Logs | Out-Null
          New-Item -ItemType Directory -Force -Path 'build' | Out-Null
          $Driver = Join-Path (Get-Location) 'build\build.exe'
          cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$Driver`" test_all_combinations_ci --verbose=1 2>&1" | Tee-Object -FilePath (Join-Path $Logs 'combinations.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect CMake configure evidence
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          "$BUSTER_CI_PYTHON" tools/ci_configure_evidence.py --build-root build --output "$RUNNER_TEMP/issue707/configure" --profile-requested "$BUSTER_CMAKE_PROFILE"

      - name: Retain issue 707 evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-707-candidate-${{ matrix.os }}-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue707/
          if-no-files-found: error
          retention-days: 7
