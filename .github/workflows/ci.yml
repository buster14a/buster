name: Buster CI

# Build/test policy remains in build.c. Six desktop combination lanes, four
# independent Unix mode/differential lanes and three mobile lanes retain full
# coverage. See docs/ci-suite-partition.md for suite ownership and measurement;
# docs/ci-workflow-audit.md documents cache boundaries and reproduction.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['**']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Supersede only the same PR/merge-group. Main, tags and deliberate manual
# measurements get unique groups, so neither active nor pending runs are lost.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'merge_group' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

env:
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  BUSTER_ANDROID_SYSTEM_IMAGE: "system-images;android-35;google_apis;x86_64"

jobs:
  lint:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Workflow lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate approved action references
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_action_pins.py
          python3 tests/action_pins_test.py
      - name: Validate the performance audit index
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/new_audit.py --self-test
          python3 tools/new_audit.py --check
      - name: Validate every GitHub workflow
        id: lint
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color .github/workflows/*.yml 2>&1 | tee "$RUNNER_TEMP/actionlint.log"
      - name: Lint result and reproduction
        if: ${{ always() }}
        shell: bash
        env:
          CI_RESULT: ${{ steps.lint.outcome }}
        run: |
          # Backticks delimit literal Markdown code in the summary.
          # shellcheck disable=SC2016
          printf '## Workflow lint\n\nResult: **%s**\n\nReproduce: `go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml`.\n' "$CI_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain lint log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workflow-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actionlint.log
          if-no-files-found: ignore
          retention-days: 7

  test:
    env:
      BUSTER_CI_PYTHON: ${{ matrix.os == 'windows' && 'python' || 'python3' }}
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: ${{ matrix.name }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-26.04
            platform: unix
            os: linux
            arch: x86_64
            zig_target: x86_64-linux
          - name: Linux AArch64
            runner: ubuntu-26.04-arm
            platform: unix
            os: linux
            arch: aarch64
            zig_target: aarch64-linux
          - name: macOS x86-64
            runner: macos-26-intel
            platform: unix
            os: macos
            arch: x86_64
            zig_target: x86_64-macos
          - name: macOS AArch64
            runner: macos-26
            platform: unix
            os: macos
            arch: aarch64
            zig_target: aarch64-macos
          - name: Windows x86-64
            runner: windows-2025
            platform: windows
            os: windows
            arch: x86_64
            zig_target: x86_64-windows
            vs_arch: amd64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
            clang_arch: x86_64
          - name: Windows AArch64
            runner: windows-11-arm
            platform: windows
            os: windows
            arch: aarch64
            zig_target: aarch64-windows
            vs_arch: arm64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
            clang_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Workflow tool regression tests
        id: workflow_tools
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          "$BUSTER_CI_PYTHON" tests/ci_tools_test.py -v 2>&1 | tee "$RUNNER_TEMP/buster-ci/workflow-tools.log"

      - name: Install mold
        id: mold
        if: ${{ !cancelled() && matrix.os == 'linux' && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mold

      # Exact-key archive cache only: no restore prefixes, CMake state, object
      # files, extracted compilers, credentials, or previous test verdicts.
      - name: Restore Zig archive
        id: zig_cache
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/zig-archive/archive
          key: zig-archive-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.zig_target }}-${{ hashFiles('.github/zig.json') }}

      - name: Install verified Zig
        id: zig
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        env:
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          set -euo pipefail
          "$BUSTER_CI_PYTHON" tools/ci_zig.py --target "$ZIG_TARGET" --cache-directory "$RUNNER_TEMP/zig-archive" --install-directory "$RUNNER_TEMP/zig" 2>&1 | tee "$RUNNER_TEMP/buster-ci/zig.log"

      # Publish immediately after verification, before compiler build/tests.
      # A corrupt hit is a hard failure and is never silently republished.
      - name: Save verified Zig archive
        if: ${{ !cancelled() && steps.zig.outcome == 'success' && steps.zig_cache.outputs.cache-hit != 'true' && steps.zig_cache.outputs.cache-primary-key != '' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/zig-archive/archive
          key: ${{ steps.zig_cache.outputs.cache-primary-key }}

      - name: Application compilers
        id: tools_unix
        if: ${{ !cancelled() && matrix.platform == 'unix' && steps.zig.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          clang --version
          # build.c selects and reports the actual GCC row before configuration.
          zig version

      - name: Combination matrix (Linux, macOS)
        id: combinations_unix
        if: ${{ !cancelled() && matrix.platform == 'unix' && steps.tools_unix.outcome == 'success' && (matrix.os != 'linux' || steps.mold.outcome == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build "$RUNNER_TEMP/buster-ci"
          exec > >(tee "$RUNNER_TEMP/buster-ci/combinations.log") 2>&1
          # The superbuild manifest names this exact bootstrap-driver path.
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o build/build
          ./build/build test_all_combinations_ci --verbose=1

      - name: Combination matrix (Windows)
        id: combinations_windows
        if: ${{ !cancelled() && matrix.platform == 'windows' && steps.zig.outcome == 'success' }}
        shell: powershell
        env:
          VS_ARCH: ${{ matrix.vs_arch }}
          VS_COMPONENT: ${{ matrix.vs_component }}
          CLANG_ARCH: ${{ matrix.clang_arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Logs = Join-Path $env:RUNNER_TEMP 'buster-ci'
          New-Item -ItemType Directory -Force -Path $Logs | Out-Null
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $VsWhere)) { throw "vswhere was not found at $VsWhere" }
          $VsPaths = @(& $VsWhere -latest -products * -requires $env:VS_COMPONENT -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw "Visual Studio with ${env:VS_COMPONENT} was not found" }
          $VsPath = $VsPaths[0].Trim()
          if (-not $VsPath) { throw "Visual Studio with ${env:VS_COMPONENT} was not found" }
          # ARM64 uses an emulated amd64 VS host but native standalone LLVM.
          & (Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1') -Arch $env:VS_ARCH -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          foreach ($Compiler in @('cl', 'clang', 'gcc', 'zig')) {
            where.exe $Compiler
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $ClangVersion = (& clang --version) -join "`n"
          Write-Output $ClangVersion
          if ($ClangVersion -notmatch "Target:\s*${env:CLANG_ARCH}-") {
            throw "clang does not default to a ${env:CLANG_ARCH} target"
          }
          New-Item -ItemType Directory -Force -Path 'build' | Out-Null
          $Driver = Join-Path (Get-Location) 'build\build.exe'
          cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Redirect inside cmd, so native stderr is not a terminating PS error.
          cmd /c "`"$Driver`" test_differential --self-test 2>&1" | Tee-Object -FilePath (Join-Path $Logs 'differential-self-test.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$Driver`" test_all_combinations_ci --verbose=1 2>&1" | Tee-Object -FilePath (Join-Path $Logs 'combinations.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Desktop result and reproduction
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          BUSTER_CI_STEPS: ${{ toJSON(steps) }}
          BUSTER_CI_RUNNER: ${{ matrix.runner }}
          BUSTER_CI_REQUIRED: ${{ matrix.platform == 'unix' && 'workflow_tools zig combinations_unix' || 'workflow_tools zig combinations_windows' }}
          BUSTER_CI_REPRO: See docs/ci-github-actions.md for the matching hosted bootstrap and full matrix commands.
        run: '"$BUSTER_CI_PYTHON" tools/ci_summary.py'

      - name: Retain desktop logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/buster-ci/
          if-no-files-found: ignore
          retention-days: 7

  # These suites already generated a fresh compiler after the combination
  # matrix. Run that independent producer in parallel, not a second copy of
  # the combination build. Keep modes and differential together for reuse.
  native:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64 native
            runner: ubuntu-26.04
            platform: unix
            os: linux
            arch: x86_64
          - name: Linux AArch64 native
            runner: ubuntu-26.04-arm
            platform: unix
            os: linux
            arch: aarch64
          - name: macOS x86-64 native
            runner: macos-26-intel
            platform: unix
            os: macos
            arch: x86_64
          - name: macOS AArch64 native
            runner: macos-26
            platform: unix
            os: macos
            arch: aarch64
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # A failed mode suite must not hide the independent differential result.
      # No continue-on-error: either failure still fails this native lane.
      - name: Execution-mode matrix
        id: modes
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && matrix.platform == 'unix' }}
        shell: bash
        env:
          CFLAGS: -Wno-invalid-feature-combination
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          exec > >(tee "$RUNNER_TEMP/buster-ci/modes.log") 2>&1
          # generate recreates build/, so the driver and logs must live outside it.
          driver="$RUNNER_TEMP/buster-build"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver"
          "$driver" generate --cc clang --config Release --linker DEFAULT
          "$driver" test_mode_matrix --config Release

      - name: Native configuration differential matrix
        id: differential
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && matrix.platform == 'unix' }}
        shell: bash
        env:
          CFLAGS: -Wno-invalid-feature-combination
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          exec > >(tee "$RUNNER_TEMP/buster-ci/differential.log") 2>&1
          driver="$RUNNER_TEMP/buster-build"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver"
          "$driver" test_differential --self-test
          # The preceding mode step normally configured this tree. Recover a
          # missing graph too, so an earlier failure cannot skip this gate.
          if [[ ! -f build/CMakeCache.txt ]]; then
            "$driver" generate --cc clang --config Release --linker DEFAULT
          fi
          "$driver" build --config Release -t ide
          "$driver" test_differential --ide build/Release/ide --out "$RUNNER_TEMP/buster-ci/differential" --sanitize-oracle

      - name: Native result and reproduction
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          BUSTER_CI_STEPS: ${{ toJSON(steps) }}
          BUSTER_CI_RUNNER: ${{ matrix.runner }}
          BUSTER_CI_REQUIRED: modes differential
          BUSTER_CI_REPRO: See docs/ci-suite-partition.md for the native suite commands and coverage contract.
        run: python3 tools/ci_summary.py

      # The differential runner writes tens of thousands of tiny evidence files;
      # uploading each as an artifact entry was a measured tail (#409). Pack
      # them once and verify the archive; verdicts stay readable beside it.
      - name: Pack native logs
        id: pack
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 tools/ci_pack_evidence.py --source "$RUNNER_TEMP/buster-ci" --output "$RUNNER_TEMP/native-ci-upload"

      - name: Retain native logs
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-ci-upload/
          # The archive is already gzip-compressed.
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Record native packaging failure
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.pack.outcome != 'success' }}
        shell: bash
        env:
          BUSTER_CI_STEPS: ${{ toJSON(steps) }}
          BUSTER_CI_RUNNER: ${{ matrix.runner }}
          BUSTER_CI_REQUIRED: modes differential pack
          BUSTER_CI_REPRO: See docs/ci-suite-partition.md for native evidence packaging and fallback.
        run: python3 tools/ci_summary.py

      # A packing failure already fails this lane; still retain the original tree.
      - name: Retain unpacked native logs
        if: ${{ !cancelled() && steps.pack.outcome != 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/buster-ci/
            !${{ runner.temp }}/buster-ci/differential/**/program
            !${{ runner.temp }}/buster-ci/differential/**/subject.o
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: ${{ matrix.name }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android x86-64
            runner: ubuntu-26.04
            os: android
            arch: x86_64
          - name: iOS x86-64
            runner: macos-26-intel
            os: ios
            arch: x86_64
          - name: iOS AArch64
            runner: macos-26
            os: ios
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install coreutils
        if: ${{ matrix.os == 'ios' }}
        shell: bash
        run: brew install --quiet coreutils

      - name: Grant the runner access to KVM
        if: ${{ matrix.os == 'android' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator system image
        if: ${{ matrix.os == 'android' }}
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager=$(command -v sdkmanager || true)
          if [[ -z $sdkmanager ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n 1)
          fi
          if [[ -z $sdkmanager ]]; then
            echo "error: sdkmanager was not found under $ANDROID_HOME" >&2
            exit 1
          fi
          printf '%s\n' "$(dirname "$sdkmanager")" >>"$GITHUB_PATH"
          accept="$RUNNER_TEMP/sdkmanager-accept"
          printf 'y\n%.0s' {1..100} >"$accept"
          "$sdkmanager" --install emulator "platforms;android-35" "$BUSTER_ANDROID_SYSTEM_IMAGE" <"$accept" >/dev/null
          printf '%s\n' "$ANDROID_HOME/emulator" "$ANDROID_HOME/platform-tools" >>"$GITHUB_PATH"

      - name: Test (Android)
        id: android
        if: ${{ matrix.os == 'android' }}
        shell: bash
        env:
          BUSTER_ANDROID_AVD: buster-ci
          BUSTER_ANDROID_DEVICE: pixel_6
          BUSTER_ANDROID_EMULATOR_GPU: swiftshader_indirect
          BUSTER_ANDROID_EMULATOR_HEADLESS: "1"
          BUSTER_ANDROID_EMULATOR_LOG: ${{ runner.temp }}/buster-ci/android-emulator.log
          BUSTER_ANDROID_EMULATOR_STARTED_MARKER: ${{ runner.temp }}/buster-ci/android-emulator.started
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          exec > >(tee "$RUNNER_TEMP/buster-ci/android.log") 2>&1
          cleanup_android_emulator() {
            status=$?
            trap - EXIT INT TERM
            if [[ $status -ne 0 && -f "${BUSTER_ANDROID_EMULATOR_LOG:-}" ]]; then
              tail -n 200 "$BUSTER_ANDROID_EMULATOR_LOG" || true
            fi
            if [[ -f "$BUSTER_ANDROID_EMULATOR_STARTED_MARKER" ]]; then
              cleanup_timeout_seconds=${BUSTER_ANDROID_CLEANUP_TIMEOUT_SECONDS:-${BUSTER_ANDROID_COMMAND_TIMEOUT_SECONDS:-30}}
              if BUSTER_ANDROID_CLEANUP_TIMEOUT_SECONDS="$cleanup_timeout_seconds" bash ./android/start_emulator_ci.sh stop; then
                :
              else
                cleanup_status=$?
                echo "warning: Android emulator cleanup failed with exit status $cleanup_status" >&2
                if [[ $status -eq 0 ]]; then status=1; fi
              fi
            fi
            exit "$status"
          }
          trap cleanup_android_emulator EXIT
          # Preserve cancellation's nonzero status while the EXIT trap cleans up.
          trap 'exit 130' INT
          trap 'exit 143' TERM
          bash ./android/start_emulator_ci.sh start
          ./android/test_ci.sh --all

      - name: Test (iOS simulator)
        id: ios
        if: ${{ matrix.os == 'ios' }}
        shell: bash
        env:
          BUSTER_IOS_ARCH: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }}
          BUSTER_IOS_CONSOLE_LOG: ${{ runner.temp }}/buster-ci/ios-console.log
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          exec > >(tee "$RUNNER_TEMP/buster-ci/ios.log") 2>&1
          ./ios/test_ci.sh --all

      - name: Mobile result and reproduction
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          BUSTER_CI_STEPS: ${{ toJSON(steps) }}
          BUSTER_CI_RUNNER: ${{ matrix.runner }}
          BUSTER_CI_REQUIRED: ${{ matrix.os == 'ios' && 'ios' || 'android' }}
          BUSTER_CI_REPRO: See docs/ci-github-actions.md for the matching mobile SDK and lifecycle commands.
        run: python3 tools/ci_summary.py

      - name: Retain mobile logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/buster-ci/
          if-no-files-found: ignore
          retention-days: 7

  uefi:
    name: UEFI firmware boot
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned QEMU and reference firmware
        shell: bash
        run: |
          set -euo pipefail
          # The immutable snapshot keeps the exact packages available after updates.
          cat > "$RUNNER_TEMP/uefi-sources.list" <<'SOURCES'
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20260828T000000Z noble main universe
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20260828T000000Z noble-updates main universe
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20260828T000000Z noble-security main universe
          SOURCES
          apt_options=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/uefi-sources.list" -o 'Dir::Etc::sourceparts=-' -o 'APT::Get::List-Cleanup=0')
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            qemu-system-x86=1:8.2.2+ds-0ubuntu1.18 qemu-system-arm=1:8.2.2+ds-0ubuntu1.18 \
            qemu-system-common=1:8.2.2+ds-0ubuntu1.18 qemu-system-data=1:8.2.2+ds-0ubuntu1.18 \
            ovmf=2024.02-2ubuntu0.9 qemu-efi-aarch64=2024.02-2ubuntu0.9
      - name: Build driver and validate the boot oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o build/uefi-driver
          build/uefi-driver test_uefi --self-test build/uefi-self-test
      - name: Build compiler and boot both architectures in all allocators
        shell: bash
        run: |
          set -euo pipefail
          build/uefi-driver generate --build-directory build/uefi-compiler --ci --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_INCLUDE_TESTS=OFF -DBUSTER_UNITY_BUILD=OFF
          build/uefi-driver build --build-directory build/uefi-compiler --config Release -t ide -- -j2
          build/uefi-driver test_uefi build/uefi-compiler/Release/ide build/uefi
      - name: Retain firmware execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uefi-boot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/uefi
            !build/uefi/**/VARS.fd
            build/uefi-self-test
            build/uefi-compiler/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14

  complete:
    name: CI complete
    needs: [lint, test, native, mobile, uefi]
    if: ${{ always() && github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every shard
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          DESKTOP_RESULT: ${{ needs.test.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          UEFI_RESULT: ${{ needs.uefi.result }}
        run: |
          {
            printf '| Shards | Result |\n| --- | --- |\n| All six desktop lanes | %s |\n| All three mobile lanes | %s |\n' "$DESKTOP_RESULT" "$MOBILE_RESULT"
            printf '| All four native lanes | %s |\n' "$NATIVE_RESULT"
            printf '| UEFI firmware boot | %s |\n' "$UEFI_RESULT"
            printf '| Workflow lint | %s |\n' "$LINT_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$LINT_RESULT" != success || "$DESKTOP_RESULT" != success || "$NATIVE_RESULT" != success || "$MOBILE_RESULT" != success || "$UEFI_RESULT" != success ]]; then
            echo '::error::All desktop, native, mobile and UEFI shards must succeed; failure, cancellation and skips do not pass.'
            exit 1
          fi
