name: Buster CI

# Build/test policy remains in build.c. The six desktop platform/architecture
# lanes retain their complete compiler/configuration and execution-mode matrices.
# Mobile suites are independent shards, not duplicate desktop builds. See
# docs/ci-workflow-audit.md for coverage, cache boundaries and reproduction.
on:
  push:
  workflow_dispatch:

# Coalesce development pushes, but keep every main/explicit measurement run.
# Merely setting cancel-in-progress:false would still replace pending main runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch') && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0
  BUSTER_ANDROID_SYSTEM_IMAGE: "system-images;android-35;google_apis;x86_64"

jobs:
  lint:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate every GitHub workflow
        id: lint
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color .github/workflows/*.yml 2>&1 | tee "$RUNNER_TEMP/actionlint.log"
      - name: Lint result and reproduction
        if: ${{ always() }}
        shell: bash
        env:
          CI_RESULT: ${{ steps.lint.outcome }}
        run: |
          # Backticks delimit literal Markdown code in the summary.
          # shellcheck disable=SC2016
          printf '## Workflow lint\n\nResult: **%s**\n\nReproduce: `go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml`.\n' "$CI_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain lint log
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workflow-lint-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actionlint.log
          if-no-files-found: ignore
          retention-days: 7

  test:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: ${{ matrix.name }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-26.04
            platform: unix
            os: linux
            arch: x86_64
            zig_target: x86_64-linux
            zig_sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          - name: Linux AArch64
            runner: ubuntu-26.04-arm
            platform: unix
            os: linux
            arch: aarch64
            zig_target: aarch64-linux
            zig_sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
          - name: macOS x86-64
            runner: macos-26-intel
            platform: unix
            os: macos
            arch: x86_64
            zig_target: x86_64-macos
            zig_sha256: 0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7
          - name: macOS AArch64
            runner: macos-26
            platform: unix
            os: macos
            arch: aarch64
            zig_target: aarch64-macos
            zig_sha256: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
          - name: Windows x86-64
            runner: windows-2025
            platform: windows
            os: windows
            arch: x86_64
            zig_target: x86_64-windows
            zig_sha256: 68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e
            vs_arch: amd64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
            clang_arch: x86_64
          - name: Windows AArch64
            runner: windows-11-arm
            platform: windows
            os: windows
            arch: aarch64
            zig_target: aarch64-windows
            zig_sha256: aee38316ee4111717900f45dd3130145c39289e105541d737eb8c5ed653c78ef
            vs_arch: arm64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
            clang_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Vulkan SDK
        if: ${{ matrix.platform == 'unix' }}
        shell: bash
        run: bash .github/scripts/install-vulkan-sdk.sh

      - name: Install Vulkan SDK (Windows)
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        run: . .github/scripts/install-vulkan-sdk.ps1

      - name: Install mold
        if: ${{ matrix.os == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mold

      # Cache only the upstream archive. Never cache build/, generated code,
      # mutable SDK installations, credentials or an extracted executable.
      # Every hit is authenticated again before extraction/execution.
      - name: Restore Zig archive
        id: zig_cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/zig-download
          key: zig-archive-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ matrix.zig_target }}-${{ matrix.zig_sha256 }}

      - name: Install Zig (Unix)
        if: ${{ matrix.platform == 'unix' }}
        shell: bash
        env:
          ZIG_TARGET: ${{ matrix.zig_target }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zig-download" "$RUNNER_TEMP/zig"
          archive="$RUNNER_TEMP/zig-download/zig.tar.xz"
          if [[ ! -f "$archive" ]]; then
            curl --fail --silent --show-error --location --retry 3 --output "$archive" \
              "https://ziglang.org/download/$ZIG_VERSION/zig-$ZIG_TARGET-$ZIG_VERSION.tar.xz"
          fi
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | shasum --algorithm 256 --check -
          tar -xJf "$archive" -C "$RUNNER_TEMP/zig" --strip-components=1
          printf '%s\n' "$RUNNER_TEMP/zig" >>"$GITHUB_PATH"

      - name: Install Zig (Windows)
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        env:
          ZIG_TARGET: ${{ matrix.zig_target }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Download = Join-Path $env:RUNNER_TEMP 'zig-download'
          New-Item -ItemType Directory -Force -Path $Download | Out-Null
          $Archive = Join-Path $Download 'zig.zip'
          if (-not (Test-Path -LiteralPath $Archive)) {
            $Url = "https://ziglang.org/download/${env:ZIG_VERSION}/zig-${env:ZIG_TARGET}-${env:ZIG_VERSION}.zip"
            curl.exe --fail --silent --show-error --location --retry 3 --output $Archive $Url
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $Actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Archive).Hash.ToLower()
          if ($Actual -ne $env:ZIG_SHA256) { throw "Zig archive checksum is $Actual, expected ${env:ZIG_SHA256}" }
          $Root = Join-Path $env:RUNNER_TEMP 'zig'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          tar.exe -x -f $Archive -C $Root --strip-components=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value $Root

      # Save verified bytes before repository tests can modify them. Only the
      # default branch writes reusable caches; branch builds only restore.
      - name: Save Zig archive
        if: ${{ success() && steps.zig_cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/zig-download
          key: ${{ steps.zig_cache.outputs.cache-primary-key }}

      - name: Application compilers
        if: ${{ matrix.platform == 'unix' }}
        shell: bash
        run: |
          set -euo pipefail
          clang --version
          gcc --version
          zig version

      - name: Combination matrix (Linux, macOS)
        id: combinations_unix
        if: ${{ matrix.platform == 'unix' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build "$RUNNER_TEMP/buster-ci"
          exec > >(tee "$RUNNER_TEMP/buster-ci/combinations.log") 2>&1
          # The superbuild manifest names this exact bootstrap-driver path.
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o build/build
          ./build/build test_all_combinations_ci --verbose=1

      - name: Combination matrix (Windows)
        id: combinations_windows
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        env:
          VS_ARCH: ${{ matrix.vs_arch }}
          VS_COMPONENT: ${{ matrix.vs_component }}
          CLANG_ARCH: ${{ matrix.clang_arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Logs = Join-Path $env:RUNNER_TEMP 'buster-ci'
          New-Item -ItemType Directory -Force -Path $Logs | Out-Null
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $VsWhere)) { throw "vswhere was not found at $VsWhere" }
          $VsPaths = @(& $VsWhere -latest -products * -requires $env:VS_COMPONENT -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw "Visual Studio with ${env:VS_COMPONENT} was not found" }
          $VsPath = $VsPaths[0].Trim()
          if (-not $VsPath) { throw "Visual Studio with ${env:VS_COMPONENT} was not found" }
          # ARM64 uses an emulated amd64 VS host but native standalone LLVM.
          & (Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1') -Arch $env:VS_ARCH -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          foreach ($Compiler in @('cl', 'clang', 'gcc', 'zig')) {
            where.exe $Compiler
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $ClangVersion = (& clang --version) -join "`n"
          Write-Output $ClangVersion
          if ($ClangVersion -notmatch "Target:\s*${env:CLANG_ARCH}-") {
            throw "clang does not default to a ${env:CLANG_ARCH} target"
          }
          New-Item -ItemType Directory -Force -Path 'build' | Out-Null
          $Driver = Join-Path (Get-Location) 'build\build.exe'
          cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Redirect inside cmd, so native stderr is not a terminating PS error.
          cmd /c "`"$Driver`" test_all_combinations_ci --verbose=1 2>&1" | Tee-Object -FilePath (Join-Path $Logs 'combinations.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A failed combination must not hide an independent allocator-mode result.
      # No continue-on-error: an earlier failure still fails this desktop lane.
      - name: Execution-mode matrix
        id: modes
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && matrix.platform == 'unix' }}
        shell: bash
        env:
          CFLAGS: -Wno-invalid-feature-combination
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          exec > >(tee "$RUNNER_TEMP/buster-ci/modes.log") 2>&1
          # generate recreates build/, so the driver and logs must live outside it.
          driver="$RUNNER_TEMP/buster-build"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver"
          "$driver" generate --cc clang --config Release --linker DEFAULT
          "$driver" test_mode_matrix --config Release

      - name: Desktop result and reproduction
        if: ${{ always() }}
        shell: bash
        env:
          CI_NAME: ${{ matrix.name }}
          CI_COMBINATIONS: ${{ matrix.platform == 'unix' && steps.combinations_unix.outcome || steps.combinations_windows.outcome }}
          CI_MODES: ${{ steps.modes.outcome }}
          CI_RESULT: ${{ job.status }}
          CI_CACHE_HIT: ${{ steps.zig_cache.outputs.cache-hit }}
        run: |
          # Backticks delimit literal Markdown code in these summary formats.
          # shellcheck disable=SC2016
          {
            printf '## %s\n\nCommit: `%s`\n\n' "$CI_NAME" "$GITHUB_SHA"
            printf '| Check | Outcome |\n| --- | --- |\n| Desktop lane | %s |\n| Compiler/configuration matrix | %s |\n| Execution-mode matrix (Unix only) | %s |\n| Zig archive cache hit | %s |\n\n' "$CI_RESULT" "$CI_COMBINATIONS" "$CI_MODES" "$CI_CACHE_HIT"
            printf 'No failing suite is allowed to pass. Mobile results are separate shards; require **CI complete**.\n\n'
            printf 'Reproduce with the matching host/toolchains: `./build.sh test_all_combinations_ci --verbose=1` (Windows: `./build.ps1 test_all_combinations_ci --verbose=1`).\n\n'
            printf 'Unix allocator modes: `./build.sh generate --cc clang --config Release --linker DEFAULT` then `./build.sh test_mode_matrix --config Release`. Do not regenerate an in-use build tree.\n\n'
            printf 'Hosted Clang bootstrap, prerequisites, and exact CI commands: `docs/ci-workflow-audit.md` and this workflow.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain desktop logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/buster-ci/
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: ${{ matrix.name }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android x86-64
            runner: ubuntu-26.04
            os: android
            arch: x86_64
          - name: iOS x86-64
            runner: macos-26-intel
            os: ios
            arch: x86_64
          - name: iOS AArch64
            runner: macos-26
            os: ios
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Vulkan SDK
        shell: bash
        run: bash .github/scripts/install-vulkan-sdk.sh

      - name: Install coreutils
        if: ${{ matrix.os == 'ios' }}
        shell: bash
        run: brew install --quiet coreutils

      - name: Grant the runner access to KVM
        if: ${{ matrix.os == 'android' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator system image
        if: ${{ matrix.os == 'android' }}
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager=$(command -v sdkmanager || true)
          if [[ -z $sdkmanager ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n 1)
          fi
          if [[ -z $sdkmanager ]]; then
            echo "error: sdkmanager was not found under $ANDROID_HOME" >&2
            exit 1
          fi
          printf '%s\n' "$(dirname "$sdkmanager")" >>"$GITHUB_PATH"
          accept="$RUNNER_TEMP/sdkmanager-accept"
          printf 'y\n%.0s' {1..100} >"$accept"
          "$sdkmanager" --install emulator "platforms;android-35" "$BUSTER_ANDROID_SYSTEM_IMAGE" <"$accept" >/dev/null
          printf '%s\n' "$ANDROID_HOME/emulator" "$ANDROID_HOME/platform-tools" >>"$GITHUB_PATH"

      - name: Test (Android)
        id: android
        if: ${{ matrix.os == 'android' }}
        shell: bash
        env:
          BUSTER_ANDROID_AVD: buster-ci
          BUSTER_ANDROID_DEVICE: pixel_6
          BUSTER_ANDROID_EMULATOR_GPU: swiftshader_indirect
          BUSTER_ANDROID_EMULATOR_HEADLESS: "1"
          BUSTER_ANDROID_EMULATOR_LOG: ${{ runner.temp }}/buster-ci/android-emulator.log
          BUSTER_ANDROID_EMULATOR_STARTED_MARKER: ${{ runner.temp }}/buster-ci/android-emulator.started
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          exec > >(tee "$RUNNER_TEMP/buster-ci/android.log") 2>&1
          cleanup_android_emulator() {
            status=$?
            trap - EXIT INT TERM
            if [[ $status -ne 0 && -f "${BUSTER_ANDROID_EMULATOR_LOG:-}" ]]; then
              tail -n 200 "$BUSTER_ANDROID_EMULATOR_LOG" || true
            fi
            if [[ -f "$BUSTER_ANDROID_EMULATOR_STARTED_MARKER" ]]; then
              cleanup_timeout_seconds=${BUSTER_ANDROID_CLEANUP_TIMEOUT_SECONDS:-${BUSTER_ANDROID_COMMAND_TIMEOUT_SECONDS:-30}}
              if BUSTER_ANDROID_CLEANUP_TIMEOUT_SECONDS="$cleanup_timeout_seconds" bash ./android/start_emulator_ci.sh stop; then
                :
              else
                cleanup_status=$?
                echo "warning: Android emulator cleanup failed with exit status $cleanup_status" >&2
                if [[ $status -eq 0 ]]; then status=1; fi
              fi
            fi
            exit "$status"
          }
          trap cleanup_android_emulator EXIT
          # Preserve cancellation's nonzero status while the EXIT trap cleans up.
          trap 'exit 130' INT
          trap 'exit 143' TERM
          bash ./android/start_emulator_ci.sh start
          ./android/test_ci.sh --all

      - name: Test (iOS simulator)
        id: ios
        if: ${{ matrix.os == 'ios' }}
        shell: bash
        env:
          BUSTER_IOS_ARCH: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          exec > >(tee "$RUNNER_TEMP/buster-ci/ios.log") 2>&1
          ./ios/test_ci.sh --all

      - name: Mobile result and reproduction
        if: ${{ always() }}
        shell: bash
        env:
          CI_NAME: ${{ matrix.name }}
          CI_RESULT: ${{ job.status }}
          CI_SUITE: ${{ matrix.os == 'ios' && steps.ios.outcome || steps.android.outcome }}
          CI_ARCH: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }}
        run: |
          # Backticks delimit literal Markdown code in these summary formats.
          # shellcheck disable=SC2016
          {
            printf '## %s\n\nCommit: `%s`\n\nJob: **%s**; suite: **%s**.\n\n' "$CI_NAME" "$GITHUB_SHA" "$CI_RESULT" "$CI_SUITE"
            printf 'iOS reproduction: `BUSTER_IOS_ARCH=%s ./ios/test_ci.sh --all`.\n\n' "$CI_ARCH"
            printf 'Android reproduction: `bash ./android/start_emulator_ci.sh start` then `./android/test_ci.sh --all`; always finish with `bash ./android/start_emulator_ci.sh stop`, preserving any earlier failure.\n\n'
            printf 'Use the matching SDK/system image and environment from this workflow. All configurations remain enabled through `--all`.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain mobile logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/buster-ci/*.log
          if-no-files-found: ignore
          retention-days: 7

  complete:
    name: CI complete
    needs: [lint, test, mobile]
    if: ${{ always() && github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every shard
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          DESKTOP_RESULT: ${{ needs.test.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
        run: |
          printf '| Shards | Result |\n| --- | --- |\n| All six desktop lanes | %s |\n| All three mobile lanes | %s |\n' "$DESKTOP_RESULT" "$MOBILE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          printf '| Workflow lint | %s |\n' "$LINT_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$LINT_RESULT" != success || "$DESKTOP_RESULT" != success || "$MOBILE_RESULT" != success ]]; then
            echo '::error::All desktop and mobile shards must succeed; failure, cancellation and skips do not pass.'
            exit 1
          fi
