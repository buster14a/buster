name: Buster CI
on: [push]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-transfer-only:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Auxiliary source-transfer branch only; product CI is unchanged.'
