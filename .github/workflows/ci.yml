name: Buster CI

# Build/test policy remains in build.c. Two shards per desktop lane, six
# independent native mode lanes, four Unix differential lanes and three mobile
# lanes retain full coverage. See docs/ci-suite-partition.md for suite ownership
# and measurement; docs/ci-combination-shards.md describes the internal
# combination partition; docs/ci-workflow-audit.md documents cache boundaries
# and reproduction.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['**']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      cmake_profile:
        description: Retain native per-tree CMake command profiles
        required: false
        default: false
        type: boolean
      analyzer_comparison:
        description: Run an explicit reference/candidate Clang analyzer comparison
        required: false
        default: false
        type: boolean

# Supersede only the same PR/merge-group. Main, tags and deliberate manual
# measurements get unique groups, so neither active nor pending runs are lost.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'merge_group' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

env:
  # Sanitizer correctness policy belongs to generated test commands; keeping a
  # second workflow default would conceal precedence regressions.
  BUSTER_ANDROID_SYSTEM_IMAGE: "system-images;android-35;google_apis;x86_64"

jobs:
  lint:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Workflow lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate approved action references
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_action_pins.py
          python3 tests/action_pins_test.py
      - name: Validate retired Vulkan installer boundary
        shell: bash
        run: |
          set -euo pipefail
          retired="install-vulkan""-sdk"
          for suffix in sh ps1; do
            test ! -e ".github/scripts/$retired.$suffix"
          done
          if git grep --line-number "$retired" -- \
            .github/workflows .github/scripts tools AGENTS.md \
            docs/agents/build.md docs/agents/testing.md \
            docs/ci-github-actions.md docs/ci-workflow-audit.md \
            docs/gpu-toolchain-validation.md build.c build.sh build.ps1 CMakeLists.txt; then
            exit 1
          fi
          grep --fixed-strings --quiet 'option(BUSTER_USE_VULKAN "Build optional Vulkan renderer support" OFF)' CMakeLists.txt
          grep --fixed-strings --quiet 'if (DEFINED ENV{VULKAN_SDK})' CMakeLists.txt
          grep --fixed-strings --quiet 'test_gpu_toolchains --self-test' .github/workflows/gpu-toolchains.yml
          grep --fixed-strings --quiet -- '--profile spirv-dxc-2025.07' .github/workflows/gpu-toolchains.yml
      - name: Validate the performance audit index
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/new_audit.py --self-test
          python3 tools/new_audit.py --check
      - name: Validate every GitHub workflow
        id: lint
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 -color .github/workflows/*.yml 2>&1 | tee "$RUNNER_TEMP/actionlint.log"
      - name: Lint result and reproduction
        if: ${{ always() }}
        shell: bash
        env:
          CI_RESULT: ${{ steps.lint.outcome }}
        run: |
          # Backticks delimit literal Markdown code in the summary.
          # shellcheck disable=SC2016
          printf '## Workflow lint\n\nResult: **%s**\n\nReproduce: `go run github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 .github/workflows/*.yml`.\n' "$CI_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain lint log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actionlint.log
          if-no-files-found: ignore
          retention-days: 7

  test:
    # Queue desktop shards wait for cheap workflow lint. Ordinary runs still
    # execute for diagnostics even when lint fails.
    needs: lint
    env:
      BUSTER_MATRIX_SHARD: ${{ matrix.shard }}
      BUSTER_CI_PYTHON: ${{ matrix.os == 'windows' && 'python' || 'python3' }}
      # Profiling is diagnostic and opt-in. The manual dispatch input is
      # captured in the event payload, so delayed and retried jobs use one value.
      # Every non-dispatch event and the default manual run stay uninstrumented.
      BUSTER_CMAKE_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.cmake_profile && '1' || '0' }}
    if: ${{ !cancelled() && github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' && (github.event_name != 'merge_group' || needs.lint.result == 'success') }}
    name: ${{ matrix.name }} ${{ matrix.shard }}
    timeout-minutes: 300
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        lane: [linux-x86_64, linux-aarch64, macos-x86_64, macos-aarch64, windows-x86_64, windows-aarch64]
        shard: [release, checks]
        include:
          - name: Linux x86-64
            lane: linux-x86_64
            runner: ubuntu-26.04
            platform: unix
            os: linux
            arch: x86_64
            zig_target: x86_64-linux
          - name: Linux AArch64
            lane: linux-aarch64
            runner: ubuntu-26.04-arm
            platform: unix
            os: linux
            arch: aarch64
            zig_target: aarch64-linux
          - name: macOS x86-64
            lane: macos-x86_64
            runner: macos-26-intel
            platform: unix
            os: macos
            arch: x86_64
            zig_target: x86_64-macos
          - name: macOS AArch64
            lane: macos-aarch64
            runner: macos-26
            platform: unix
            os: macos
            arch: aarch64
            zig_target: aarch64-macos
          - name: Windows x86-64
            lane: windows-x86_64
            runner: windows-2025
            platform: windows
            os: windows
            arch: x86_64
            zig_target: x86_64-windows
            vs_arch: amd64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
            clang_arch: x86_64
          - name: Windows AArch64
            lane: windows-aarch64
            runner: windows-11-arm
            platform: windows
            os: windows
            arch: aarch64
            zig_target: aarch64-windows
            vs_arch: arm64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
            clang_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve exact Zig cache policy
        id: zig_cache_policy
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          ZIG_CACHE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ZIG_CACHE_MANIFEST_HASH: ${{ hashFiles('.github/zig.json') }}
          ZIG_CACHE_RUNNER_ARCH: ${{ runner.arch }}
          ZIG_CACHE_RUNNER_OS: ${{ runner.os }}
          ZIG_CACHE_TARGET: ${{ matrix.zig_target }}
        run: |
          set -euo pipefail
          mode='ordinary'
          namespace=''
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            case "$GITHUB_REF" in
              refs/heads/ci-cohort-prime-*)
                mode='prime'
                namespace=${GITHUB_REF#refs/heads/ci-cohort-prime-}
                ;;
              refs/heads/ci-cohort-read-*)
                mode='read'
                namespace=${GITHUB_REF#refs/heads/ci-cohort-read-}
                ;;
            esac
          fi
          mkdir -p "$RUNNER_TEMP/buster-ci"
          "$BUSTER_CI_PYTHON" tools/ci_zig_cache.py resolve \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --default-branch "$ZIG_CACHE_DEFAULT_BRANCH" \
            --mode "$mode" \
            --namespace "$namespace" \
            --runner-label "${{ matrix.runner }}" \
            --runner-os "$ZIG_CACHE_RUNNER_OS" \
            --runner-arch "$ZIG_CACHE_RUNNER_ARCH" \
            --target "$ZIG_CACHE_TARGET" \
            --manifest .github/zig.json \
            --manifest-hash "$ZIG_CACHE_MANIFEST_HASH" \
            --shard "$BUSTER_MATRIX_SHARD" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$GITHUB_OUTPUT" \
            --evidence "$RUNNER_TEMP/buster-ci/zig-cache.json"

      - name: Workflow tool regression tests
        id: workflow_tools
        if: ${{ matrix.shard == 'release' && steps.zig_cache_policy.outcome == 'success' }}
        # Thirteen suites include native fixture builds and process launches.
        # Windows ARM64 exceeded 120s in run 35733354799; Intel macOS
        # exhausted 120s in run 35934837738 despite passing suite summaries.
        timeout-minutes: ${{ (matrix.os == 'windows' || matrix.os == 'macos') && 5 || 2 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          workflow_tools_started=$SECONDS
          run_suite() {
            local suite=$1 log=$2 started=$SECONDS status
            printf 'SUITE_START path=%s at=%s\n' "$suite" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if "$BUSTER_CI_PYTHON" "$suite" -v 2>&1 | tee "$RUNNER_TEMP/buster-ci/$log"; then
              printf 'SUITE_END path=%s result=success elapsed_seconds=%s at=%s\n' \
                "$suite" "$((SECONDS - started))" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            else
              status=$?
              printf 'SUITE_END path=%s result=failure status=%s elapsed_seconds=%s at=%s\n' \
                "$suite" "$status" "$((SECONDS - started))" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              return "$status"
            fi
          }
          run_suite tests/ci_tools_test.py workflow-tools.log
          run_suite tools/ci_admission_test.py ci-admission.log
          run_suite tools/ci_zig_test.py zig-installer-test.log
          run_suite tools/ci_zig_cache_test.py zig-cache-policy-test.log
          run_suite tools/ci_android_sdk_test.py android-sdk-installer-test.log
          run_suite tools/analyzer_selection_test.py analyzer-selection.log
          run_suite tools/coverage_manifest_test.py coverage-manifest.log
          run_suite tools/matrix_shard_test.py matrix-shard.log
          run_suite tools/differential_ci_policy_test.py differential-ci-policy.log
          run_suite tools/native_producer_profile_test.py native-producer-profile.log
          run_suite tools/ci_configure_evidence_test.py configure-evidence-test.log
          run_suite tools/ci_matrix_phases_test.py matrix-phases-test.log
          run_suite tools/ci_native_observation_test.py native-observation-test.log
          printf 'WORKFLOW_TOOLS_END result=success elapsed_seconds=%s at=%s\n' \
            "$((SECONDS - workflow_tools_started))" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # Wrapper integration starts many real shells. It must not consume the
      # policy suites' shared budget; see docs/ci-bootstrap-wrapper.md.
      - name: Bootstrap wrapper regression tests
        id: bootstrap_wrappers
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.zig_cache_policy.outcome == 'success' }}
        timeout-minutes: ${{ matrix.platform == 'windows' && 20 || 2 }}
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the wrapper lifecycle guard on every shard, but run its
          # expensive regression suite only in its canonical Release owner.
          if [[ "$BUSTER_MATRIX_SHARD" == checks ]]; then
            printf 'BOOTSTRAP_WRAPPERS owned-by-release-shard\n'
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/buster-ci"
          "$BUSTER_CI_PYTHON" tests/bootstrap_wrapper_test.py BootstrapWrapperTests -v 2>&1 | tee "$RUNNER_TEMP/buster-ci/bootstrap-wrapper.log"

      - name: Install mold
        id: mold
        if: ${{ !cancelled() && matrix.os == 'linux' && steps.checkout.outcome == 'success' && steps.zig_cache_policy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mold

      # Exact-key archive cache only: no restore prefixes, CMake state, object
      # files, extracted compilers, credentials, or previous test verdicts.
      - name: Restore Zig archive
        id: zig_cache
        if: ${{ !cancelled() && steps.zig_cache_policy.outcome == 'success' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/zig-archive/archive
          key: ${{ steps.zig_cache_policy.outputs.key }}

      - name: Validate exact Zig cache restore
        id: zig_cache_gate
        if: ${{ !cancelled() && steps.zig_cache_policy.outcome == 'success' && steps.zig_cache.outcome == 'success' }}
        shell: bash
        env:
          ZIG_CACHE_HIT: ${{ steps.zig_cache.outputs.cache-hit }}
          ZIG_CACHE_MATCHED_KEY: ${{ steps.zig_cache.outputs.cache-matched-key }}
          ZIG_CACHE_PRIMARY_KEY: ${{ steps.zig_cache.outputs.cache-primary-key }}
        run: |
          set -euo pipefail
          "$BUSTER_CI_PYTHON" tools/ci_zig_cache.py check-restore \
            --mode "${{ steps.zig_cache_policy.outputs.mode }}" \
            --expected-key "${{ steps.zig_cache_policy.outputs.key }}" \
            --cache-hit "$ZIG_CACHE_HIT" \
            --primary-key "$ZIG_CACHE_PRIMARY_KEY" \
            --matched-key "$ZIG_CACHE_MATCHED_KEY"

      - name: Install verified Zig
        id: zig
        if: ${{ !cancelled() && steps.zig_cache_gate.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        env:
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          set -euo pipefail
          # This step also runs without the Release-only preflight steps.
          mkdir -p "$RUNNER_TEMP/buster-ci"
          "$BUSTER_CI_PYTHON" tools/ci_zig.py --target "$ZIG_TARGET" --cache-directory "$RUNNER_TEMP/zig-archive" --install-directory "$RUNNER_TEMP/zig" 2>&1 | tee "$RUNNER_TEMP/buster-ci/zig.log"

      # Ordinary mode retains the previous main-push write policy. Prime mode
      # grants the Release shard the sole write attempt for its lane's shared
      # exact key. Read mode never authorizes this step.
      - name: Save verified Zig archive
        id: zig_cache_save
        if: ${{ !cancelled() && steps.zig.outcome == 'success' && steps.zig_cache.outputs.cache-hit != 'true' && steps.zig_cache_policy.outputs.save == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/zig-archive/archive
          key: ${{ steps.zig_cache_policy.outputs.key }}

      # actions/cache/save reports upload failures as warnings. A prime miss is
      # therefore usable only after deleting the local copy and restoring the
      # immutable exact key again. The evidence step rechecks the pinned digest.
      - name: Prepare Zig cache publication proof
        id: zig_cache_proof_prepare
        if: ${{ !cancelled() && steps.zig.outcome == 'success' && steps.zig_cache.outputs.cache-hit != 'true' && steps.zig_cache_policy.outputs.publication_proof_required == 'true' && steps.zig_cache_save.outcome == 'success' }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/zig-archive/archive"

      - name: Restore published Zig archive for proof
        id: zig_cache_publication
        if: ${{ !cancelled() && steps.zig_cache_proof_prepare.outcome == 'success' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/zig-archive/archive
          key: ${{ steps.zig_cache_policy.outputs.key }}

      - name: Retain exact Zig cache evidence
        id: zig_cache_evidence
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.zig_cache_policy.outcome == 'success' }}
        shell: bash
        env:
          ZIG_CACHE_HIT: ${{ steps.zig_cache.outputs.cache-hit }}
          ZIG_CACHE_MATCHED_KEY: ${{ steps.zig_cache.outputs.cache-matched-key }}
          ZIG_CACHE_PRIMARY_KEY: ${{ steps.zig_cache.outputs.cache-primary-key }}
          ZIG_CACHE_PROOF_HIT: ${{ steps.zig_cache_publication.outputs.cache-hit }}
          ZIG_CACHE_PROOF_MATCHED_KEY: ${{ steps.zig_cache_publication.outputs.cache-matched-key }}
          ZIG_CACHE_PROOF_PRIMARY_KEY: ${{ steps.zig_cache_publication.outputs.cache-primary-key }}
        run: |
          set -euo pipefail
          "$BUSTER_CI_PYTHON" tools/ci_zig_cache.py record \
            --evidence "$RUNNER_TEMP/buster-ci/zig-cache.json" \
            --manifest .github/zig.json \
            --cache-directory "$RUNNER_TEMP/zig-archive" \
            --restore-outcome "${{ steps.zig_cache.outcome }}" \
            --cache-hit "$ZIG_CACHE_HIT" \
            --primary-key "$ZIG_CACHE_PRIMARY_KEY" \
            --matched-key "$ZIG_CACHE_MATCHED_KEY" \
            --install-outcome "${{ steps.zig.outcome }}" \
            --save-outcome "${{ steps.zig_cache_save.outcome }}" \
            --proof-restore-outcome "${{ steps.zig_cache_publication.outcome }}" \
            --proof-cache-hit "$ZIG_CACHE_PROOF_HIT" \
            --proof-primary-key "$ZIG_CACHE_PROOF_PRIMARY_KEY" \
            --proof-matched-key "$ZIG_CACHE_PROOF_MATCHED_KEY" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Application compilers
        id: tools_unix
        if: ${{ !cancelled() && matrix.platform == 'unix' && steps.zig_cache_evidence.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          clang --version
          # build.c selects and reports the actual GCC row before configuration.
          zig version

      - name: Combination matrix (Linux, macOS)
        id: combinations_unix
        env:
          BUSTER_MATRIX_PHASE_OUTPUT: ${{ runner.temp }}/buster-ci/matrix-phases
        if: ${{ !cancelled() && matrix.platform == 'unix' && steps.tools_unix.outcome == 'success' && (matrix.os != 'linux' || steps.mold.outcome == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build "$RUNNER_TEMP/buster-ci"
          exec > >(tee "$RUNNER_TEMP/buster-ci/combinations.log") 2>&1
          # The superbuild manifest names this exact bootstrap-driver path.
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o build/build
          ./build/build test_all_combinations_ci --verbose=1

      - name: Combination matrix (Windows)
        id: combinations_windows
        if: ${{ !cancelled() && matrix.platform == 'windows' && steps.zig_cache_evidence.outcome == 'success' }}
        shell: powershell
        env:
          BUSTER_MATRIX_PHASE_OUTPUT: ${{ runner.temp }}/buster-ci/matrix-phases
          VS_ARCH: ${{ matrix.vs_arch }}
          VS_COMPONENT: ${{ matrix.vs_component }}
          CLANG_ARCH: ${{ matrix.clang_arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Logs = Join-Path $env:RUNNER_TEMP 'buster-ci'
          New-Item -ItemType Directory -Force -Path $Logs | Out-Null
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $VsWhere)) { throw "vswhere was not found at $VsWhere" }
          $VsPaths = @(& $VsWhere -latest -products * -requires $env:VS_COMPONENT -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw "Visual Studio with ${env:VS_COMPONENT} was not found" }
          $VsPath = $VsPaths[0].Trim()
          if (-not $VsPath) { throw "Visual Studio with ${env:VS_COMPONENT} was not found" }
          # ARM64 uses an emulated amd64 VS host but native standalone LLVM.
          & (Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1') -Arch $env:VS_ARCH -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          # The result step independently re-probes the exact compiler
          # executables recorded by the driver. Preserve this step's selected
          # Visual Studio/LLVM search path and target architecture for it.
          $PathDelimiter = 'BUSTER_CI_WINDOWS_COMPILER_PATH'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PATH<<$PathDelimiter"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value $env:PATH
          Add-Content -LiteralPath $env:GITHUB_ENV -Value $PathDelimiter
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VSCMD_ARG_TGT_ARCH=$env:VSCMD_ARG_TGT_ARCH"
          foreach ($Compiler in @('cl', 'clang', 'gcc', 'zig')) {
            where.exe $Compiler
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $ClangVersion = (& clang --version) -join "`n"
          Write-Output $ClangVersion
          if ($ClangVersion -notmatch "Target:\s*${env:CLANG_ARCH}-") {
            throw "clang does not default to a ${env:CLANG_ARCH} target"
          }
          New-Item -ItemType Directory -Force -Path 'build' | Out-Null
          $Driver = Join-Path (Get-Location) 'build\build.exe'
          cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Redirect inside cmd, so native stderr is not a terminating PS error.
          if ($env:BUSTER_MATRIX_SHARD -eq 'release') {
            cmd /c "`"$Driver`" test_differential --self-test 2>&1" | Tee-Object -FilePath (Join-Path $Logs 'differential-self-test.log')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cmd /c "`"$Driver`" test_all_combinations_ci --verbose=1 2>&1" | Tee-Object -FilePath (Join-Path $Logs 'combinations.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Postprocess only: build.c still owns every configure, probe and build.
      # Keep raw diagnostics outside build/ so failed attempts survive cleanup.
      - name: Collect CMake configure evidence
        id: configure_evidence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          "$BUSTER_CI_PYTHON" tools/ci_configure_evidence.py --build-root build --output "$RUNNER_TEMP/buster-ci/configure" --profile-requested "$BUSTER_CMAKE_PROFILE"

      - name: Desktop result and reproduction
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          BUSTER_CI_STEPS: ${{ toJSON(steps) }}
          BUSTER_CI_RUNNER: ${{ matrix.runner }}
          BUSTER_CI_REQUIRED: ${{ matrix.shard == 'release' && (matrix.platform == 'unix' && 'zig_cache_policy workflow_tools bootstrap_wrappers zig_cache_gate zig zig_cache_evidence combinations_unix' || 'zig_cache_policy workflow_tools bootstrap_wrappers zig_cache_gate zig zig_cache_evidence combinations_windows') || (matrix.platform == 'unix' && 'zig_cache_policy zig_cache_gate zig zig_cache_evidence combinations_unix' || 'zig_cache_policy zig_cache_gate zig zig_cache_evidence combinations_windows') }}
          BUSTER_CI_REPRO: Set BUSTER_MATRIX_SHARD=${{ matrix.shard }} and run the matching hosted bootstrap plus test_all_combinations_ci in docs/ci-combination-shards.md. Use BUSTER_MATRIX_SHARD=all for the full local matrix.
          BUSTER_CI_ZIG_CACHE_HIT: ${{ steps.zig_cache.outputs.cache-hit }}
          BUSTER_MATRIX_PHASE_OUTPUT: ${{ runner.temp }}/buster-ci/matrix-phases
          BUSTER_CI_COVERAGE_OUTPUT: ${{ runner.temp }}/buster-ci/coverage.json
          BUSTER_CI_COVERAGE_REQUIRED: "1"
          BUSTER_CI_COVERAGE_PLATFORM: ${{ matrix.os }}
          BUSTER_CI_COVERAGE_ARCH: ${{ matrix.arch }}
        run: '"$BUSTER_CI_PYTHON" tools/ci_summary.py'

      # Logs may contain symlinks into build/.buster-cache. upload-artifact
      # follows those links and can fail on intentionally unreadable cache entries.
      # Rebuild the upload root from readable regular files only, without
      # preserving links or source permissions.
      - name: Sanitize desktop logs
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          "$BUSTER_CI_PYTHON" - <<'PYTHON'
          import os
          import shutil
          import stat
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "buster-ci"
          source = root.with_name("buster-ci-unsanitized")
          if source.is_symlink() or source.is_file():
              source.unlink()
          elif source.is_dir():
              shutil.rmtree(source, ignore_errors=True)
          if root.is_symlink() or root.is_file():
              root.unlink()
          elif root.is_dir():
              root.rename(source)
          root.mkdir(parents=True, exist_ok=True)

          skipped = []
          if source.is_dir():
              for directory, dirnames, filenames in os.walk(source, topdown=True, followlinks=False):
                  current = Path(directory)
                  relative = current.relative_to(source)
                  retained_directories = []
                  for name in dirnames:
                      entry = current / name
                      try:
                          mode = entry.lstat().st_mode
                      except OSError as error:
                          skipped.append(f"{relative / name}: {error}")
                          continue
                      if stat.S_ISDIR(mode) and not stat.S_ISLNK(mode):
                          retained_directories.append(name)
                          (root / relative / name).mkdir(parents=True, exist_ok=True)
                      else:
                          skipped.append(f"{relative / name}: non-directory or symbolic link")
                  dirnames[:] = retained_directories
                  for name in filenames:
                      entry = current / name
                      destination = root / relative / name
                      try:
                          mode = entry.lstat().st_mode
                          if not stat.S_ISREG(mode):
                              skipped.append(f"{relative / name}: non-regular file")
                              continue
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          with entry.open("rb") as input_file, destination.open("wb") as output_file:
                              shutil.copyfileobj(input_file, output_file, length=1024 * 1024)
                      except OSError as error:
                          destination.unlink(missing_ok=True)
                          skipped.append(f"{relative / name}: {error}")

          report = root / "artifact-sanitization.txt"
          report.write_text("\n".join(skipped) + ("\n" if skipped else ""), encoding="utf-8")
          shutil.rmtree(source, ignore_errors=True)
          PYTHON

      - name: Retain desktop logs
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/buster-ci/
          if-no-files-found: ignore
          retention-days: 7

  # The mode matrix is independent from the combination matrix on all six
  # desktop platforms. Unix additionally reuses that fresh compiler for the
  # native differential corpus; Windows reports the mode gate independently.
  native:
    env:
      BUSTER_CI_PYTHON: ${{ matrix.os == 'windows' && 'python' || 'python3' }}
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64 native
            runner: ubuntu-26.04
            platform: unix
            os: linux
            arch: x86_64
          - name: Linux AArch64 native
            runner: ubuntu-26.04-arm
            platform: unix
            os: linux
            arch: aarch64
          - name: macOS x86-64 native
            runner: macos-26-intel
            platform: unix
            os: macos
            arch: x86_64
          - name: macOS AArch64 native
            runner: macos-26
            platform: unix
            os: macos
            arch: aarch64
          - name: Windows x86-64 native
            platform: windows
            runner: windows-2025
            os: windows
            arch: x86_64
            vs_arch: amd64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
            clang_arch: x86_64
          - name: Windows AArch64 native
            platform: windows
            runner: windows-11-arm
            os: windows
            arch: aarch64
            vs_arch: arm64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
            clang_arch: aarch64
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize native observation
        id: native_observation
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          observation_root="$RUNNER_TEMP/buster-ci/native-observation"
          mkdir -p "$observation_root"
          printf 'BUSTER_CI_OBSERVATION_ROOT=%s\n' "$observation_root" >> "$GITHUB_ENV"
          "$BUSTER_CI_PYTHON" tools/ci_native_observation.py init \
            --root "$observation_root" \
            --job-name '${{ matrix.name }}' \
            --runner-label '${{ matrix.runner }}' \
            --platform '${{ matrix.platform }}' \
            --os '${{ matrix.os }}' \
            --arch '${{ matrix.arch }}' \
            --configuration Release \
            --compiler clang \
            --linker DEFAULT \
            --debug-info OFF \
            --differential-workers '${{ matrix.platform == 'unix' && '4' || '0' }}'

      # A failed mode suite must not hide the independent differential result.
      # No continue-on-error: either failure still fails this Unix native lane.
      - name: Execution-mode matrix
        id: modes
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.native_observation.outcome == 'success' && matrix.platform == 'unix' }}
        shell: bash
        env:
          CFLAGS: -Wno-invalid-feature-combination
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          exec > >(tee "$RUNNER_TEMP/buster-ci/modes.log") 2>&1
          # generate recreates build/, so the driver and logs must live outside it.
          driver="$RUNNER_TEMP/buster-build"
          "$BUSTER_CI_PYTHON" tools/ci_native_observation.py toolchain             --root "$BUSTER_CI_OBSERVATION_ROOT" --compiler clang --cmake cmake --ninja ninja
          "$BUSTER_CI_PYTHON" tools/ci_native_observation.py run             --root "$BUSTER_CI_OBSERVATION_ROOT" --phase bootstrap_driver --sequence 10 --             clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver"
          "$BUSTER_CI_PYTHON" tools/ci_native_observation.py run             --root "$BUSTER_CI_OBSERVATION_ROOT" --phase configuration --sequence 20 --             "$driver" generate --cc clang --config Release --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
          # test_mode_matrix already requires this producer. Build it explicitly
          # so the following interval contains payload work instead of hidden build work.
          "$BUSTER_CI_PYTHON" tools/ci_native_observation.py run             --root "$BUSTER_CI_OBSERVATION_ROOT" --phase producer_build --sequence 30 --             "$driver" build --config Release -t ide
          "$BUSTER_CI_PYTHON" tools/ci_native_observation.py run             --root "$BUSTER_CI_OBSERVATION_ROOT" --phase mode_payload --sequence 40 --             "$driver" test_mode_matrix --config Release

      - name: Execution-mode matrix (Windows)
        id: modes_windows
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.native_observation.outcome == 'success' && matrix.platform == 'windows' }}
        shell: powershell
        env:
          VS_ARCH: ${{ matrix.vs_arch }}
          VS_COMPONENT: ${{ matrix.vs_component }}
          CLANG_ARCH: ${{ matrix.clang_arch }}
          CFLAGS: -Wno-invalid-feature-combination
        run: |
          $ErrorActionPreference = 'Stop'
          $Logs = Join-Path $env:RUNNER_TEMP 'buster-ci'
          New-Item -ItemType Directory -Force -Path $Logs | Out-Null
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $VsWhere)) { throw "vswhere was not found at $VsWhere" }
          $VsPaths = @(& $VsWhere -latest -products * -requires $env:VS_COMPONENT -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw "Visual Studio with ${env:VS_COMPONENT} was not found" }
          $VsPath = $VsPaths[0].Trim()
          if (-not $VsPath) { throw "Visual Studio with ${env:VS_COMPONENT} was not found" }
          # ARM64 uses an emulated amd64 VS host but native standalone LLVM.
          & (Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1') -Arch $env:VS_ARCH -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          foreach ($Compiler in @('cl', 'clang')) {
            where.exe $Compiler
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $ClangVersion = (& clang --version) -join "`n"
          Write-Output $ClangVersion
          if ($ClangVersion -notmatch "Target:\s*${env:CLANG_ARCH}-") {
            throw "clang does not default to a ${env:CLANG_ARCH} target"
          }
          & $env:BUSTER_CI_PYTHON tools/ci_native_observation.py toolchain `
            --root $env:BUSTER_CI_OBSERVATION_ROOT --compiler clang --cmake cmake --ninja ninja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Driver = Join-Path $env:RUNNER_TEMP 'buster-build.exe'
          & $env:BUSTER_CI_PYTHON tools/ci_native_observation.py run `
            --root $env:BUSTER_CI_OBSERVATION_ROOT --phase bootstrap_driver --sequence 10 -- `
            clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable `
            -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o $Driver
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Redirect inside cmd, so native stderr is not a terminating PS error.
          $Generate = "`"$Driver`" generate --cc clang --config Release --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF 2>&1"
          & $env:BUSTER_CI_PYTHON tools/ci_native_observation.py run `
            --root $env:BUSTER_CI_OBSERVATION_ROOT --phase configuration --sequence 20 -- `
            cmd /d /s /c $Generate | Tee-Object -FilePath (Join-Path $Logs 'modes-generate.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Build = "`"$Driver`" build --config Release -t ide 2>&1"
          & $env:BUSTER_CI_PYTHON tools/ci_native_observation.py run `
            --root $env:BUSTER_CI_OBSERVATION_ROOT --phase producer_build --sequence 30 -- `
            cmd /d /s /c $Build | Tee-Object -FilePath (Join-Path $Logs 'modes-build.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Modes = "`"$Driver`" test_mode_matrix --config Release 2>&1"
          & $env:BUSTER_CI_PYTHON tools/ci_native_observation.py run `
            --root $env:BUSTER_CI_OBSERVATION_ROOT --phase mode_payload --sequence 40 -- `
            cmd /d /s /c $Modes | Tee-Object -FilePath (Join-Path $Logs 'modes.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native MSVC reference differential
        id: msvc_reference
        if: ${{ !cancelled() && steps.modes_windows.outcome == 'success' && matrix.platform == 'windows' }}
        shell: powershell
        env:
          VS_ARCH: ${{ matrix.vs_arch }}
          VS_COMPONENT: ${{ matrix.vs_component }}
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPaths = @(& $VsWhere -latest -products * -requires $env:VS_COMPONENT -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw 'MSVC toolchain missing' }
          & (Join-Path $VsPaths[0].Trim() 'Common7\Tools\Launch-VsDevShell.ps1') -Arch $env:VS_ARCH -HostArch amd64 -SkipAutomaticLocation
          $Driver = Join-Path $env:RUNNER_TEMP 'buster-build.exe'
          $Root = Join-Path $env:RUNNER_TEMP 'buster-ci'
          $Sources = Join-Path $Root 'msvc source with spaces'
          $Include = Join-Path $Root 'msvc include with spaces'
          $Libraries = Join-Path $Root 'msvc library with spaces'
          New-Item -ItemType Directory -Force -Path $Sources, $Include, $Libraries | Out-Null
          $Subject = Join-Path $Sources 'subject.c'
          $Caller = Join-Path $Sources 'caller.c'
          Copy-Item 'tools/fixtures/msvc_reference_subject.c' $Subject
          Copy-Item 'tools/fixtures/msvc_reference_caller.c' $Caller
          $Output = Join-Path $Root 'msvc reference with spaces'
          $MsvcArgs = @('test_differential', '--ide', 'build/Release/ide.exe', '--cc', 'cl.exe',
            '--reference-dialect', 'msvc', '--source', $Subject, '--host', $Caller,
            '--include', $Include, '--library-path', $Libraries, '--minimize', '0',
            '--strict-mir', '--out', $Output)
          $ErrorActionPreference = 'Continue'
          & $Driver @MsvcArgs 2>&1 | Tee-Object -FilePath (Join-Path $Root 'msvc-reference.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Manifest = Join-Path $Output 'manifest.txt'
          if (-not (Test-Path -LiteralPath $Manifest)) { throw 'MSVC manifest missing' }
          $ManifestHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Manifest).Hash
          & $Driver @MsvcArgs 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0 -or (Get-FileHash -Algorithm SHA256 -LiteralPath $Manifest).Hash -ne $ManifestHash) {
            throw 'Existing MSVC output was reused or changed'
          }
          $Controls = @(
            @{ Name = 'sanitizer'; Extra = @('--sanitize-oracle'); Compiler = 'cl.exe' },
            @{ Name = 'reduction'; Extra = @('--minimize', '1'); Compiler = 'cl.exe' },
            @{ Name = 'missing'; Extra = @(); Compiler = 'buster-missing-cl.exe' }
          )
          foreach ($Control in $Controls) {
            $RejectedOutput = Join-Path $Root "msvc-rejected-$($Control.Name)"
            $RejectedArgs = @('test_differential', '--ide', 'build/Release/ide.exe',
              '--cc', $Control.Compiler, '--reference-dialect', 'msvc', '--source', $Subject,
              '--minimize', '0', '--out', $RejectedOutput) + $Control.Extra
            & $Driver @RejectedArgs 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0 -or (Test-Path -LiteralPath $RejectedOutput)) {
              throw "MSVC $($Control.Name) control did not fail before execution"
            }
          }
          $BadOutput = Join-Path $Root 'msvc-rejected-dialect'
          & $Driver test_differential --ide build/Release/ide.exe --cc cl.exe `
            --reference-dialect unknown --source $Subject --minimize 0 --out $BadOutput 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0 -or (Test-Path -LiteralPath $BadOutput)) {
            throw 'Unknown reference dialect was accepted'
          }
          $RejectOutput = Join-Path $Root 'msvc-invalid-source'
          & $Driver test_differential --ide build/Release/ide.exe --cc cl.exe --reference-dialect msvc `
            --source tools/fixtures/msvc_reference_invalid.c --reject --minimize 0 --out $RejectOutput 2>&1 |
            Tee-Object -FilePath (Join-Path $Root 'msvc-invalid.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native configuration differential matrix
        id: differential
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.native_observation.outcome == 'success' && matrix.platform == 'unix' }}
        shell: bash
        env:
          CFLAGS: -Wno-invalid-feature-combination
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          exec > >(tee "$RUNNER_TEMP/buster-ci/differential.log") 2>&1
          driver="$RUNNER_TEMP/buster-build"
          if [[ ! -f "$BUSTER_CI_OBSERVATION_ROOT/toolchain.json" ]]; then
            "$BUSTER_CI_PYTHON" tools/ci_native_observation.py toolchain               --root "$BUSTER_CI_OBSERVATION_ROOT" --compiler clang --cmake cmake --ninja ninja
          fi
          "$BUSTER_CI_PYTHON" tools/ci_native_observation.py run             --root "$BUSTER_CI_OBSERVATION_ROOT" --phase differential_driver_refresh --sequence 50 --             clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver"
          "$BUSTER_CI_PYTHON" tools/ci_native_observation.py run             --root "$BUSTER_CI_OBSERVATION_ROOT" --phase differential_preparation --sequence 60 --             "$driver" test_differential --self-test
          # The preceding mode step normally configured this tree. Recover a
          # missing graph too, so an earlier failure cannot skip this gate.
          if [[ ! -f build/CMakeCache.txt ]]; then
            "$BUSTER_CI_PYTHON" tools/ci_native_observation.py run               --root "$BUSTER_CI_OBSERVATION_ROOT" --phase recovery_configuration --sequence 65 --               "$driver" generate --cc clang --config Release --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
          fi
          "$BUSTER_CI_PYTHON" tools/ci_native_observation.py run             --root "$BUSTER_CI_OBSERVATION_ROOT" --phase differential_producer_check --sequence 70 --             "$driver" build --config Release -t ide
          "$BUSTER_CI_PYTHON" tools/ci_native_observation.py run --root "$BUSTER_CI_OBSERVATION_ROOT" --phase differential_corpus --sequence 80 -- "$driver" test_differential --ide build/Release/ide --out "$RUNNER_TEMP/buster-ci/differential" --sanitize-oracle --jobs 4

      - name: Native result and reproduction
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          BUSTER_CI_STEPS: ${{ toJSON(steps) }}
          BUSTER_CI_RUNNER: ${{ matrix.runner }}
          # Unix equivalent: BUSTER_CI_REQUIRED: modes differential
          BUSTER_CI_REQUIRED: ${{ matrix.platform == 'windows' && 'modes_windows msvc_reference' || 'modes differential' }}
          BUSTER_CI_REPRO: See docs/windows-ci-coverage.md and docs/ci-suite-partition.md for the matching native commands and coverage contract.
        # Unix equivalent: run: python3 tools/ci_summary.py
        run: if command -v "$BUSTER_CI_PYTHON" >/dev/null 2>&1; then "$BUSTER_CI_PYTHON" tools/ci_summary.py; else python3 tools/ci_summary.py; fi

      # The differential runner writes tens of thousands of tiny evidence files;
      # uploading each as an artifact entry was a measured tail (#409). Pack
      # every platform's native evidence once and keep verdicts readable beside it.
      - name: Pack native logs
        id: pack
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          BUSTER_CI_NATIVE_PLATFORM: ${{ matrix.platform }}
          BUSTER_CI_NATIVE_COMPLETE: ${{ matrix.platform == 'windows' && steps.modes_windows.outcome == 'success' && steps.msvc_reference.outcome == 'success' && '1' || matrix.platform == 'unix' && steps.modes.outcome == 'success' && steps.differential.outcome == 'success' && '1' || '0' }}
        run: if test -n "$BUSTER_CI_OBSERVATION_ROOT"; then python_command="$BUSTER_CI_PYTHON"; if test -z "$python_command" || ! command -v "$python_command" >/dev/null 2>&1; then python_command=python3; fi; mkdir -p "$RUNNER_TEMP/native-ci-upload"; pack_status=0; "$python_command" tools/ci_native_observation.py run --root "$BUSTER_CI_OBSERVATION_ROOT" --phase evidence_packing --sequence 85 -- "$python_command" tools/ci_pack_evidence.py --source "$RUNNER_TEMP/buster-ci" --output "$RUNNER_TEMP/native-ci-upload" || pack_status=$?; expect_complete="$BUSTER_CI_NATIVE_COMPLETE"; if test "$pack_status" -ne 0; then expect_complete=0; fi; finalize_status=0; if test "$BUSTER_CI_NATIVE_PLATFORM" = unix; then "$python_command" tools/ci_native_observation.py finalize --root "$BUSTER_CI_OBSERVATION_ROOT" --artifact-directory "$RUNNER_TEMP/native-ci-upload" --expect-complete "$expect_complete" --required-phase calibration_cpu --required-phase calibration_filesystem --required-phase bootstrap_driver --required-phase configuration --required-phase producer_build --required-phase mode_payload --required-phase differential_driver_refresh --required-phase differential_preparation --required-phase differential_producer_check --required-phase differential_corpus --required-phase evidence_packing --required-phase upload_handoff || finalize_status=$?; else "$python_command" tools/ci_native_observation.py finalize --root "$BUSTER_CI_OBSERVATION_ROOT" --artifact-directory "$RUNNER_TEMP/native-ci-upload" --expect-complete "$expect_complete" --required-phase calibration_cpu --required-phase calibration_filesystem --required-phase bootstrap_driver --required-phase configuration --required-phase producer_build --required-phase mode_payload --required-phase evidence_packing --required-phase upload_handoff || finalize_status=$?; fi; if test "$pack_status" -ne 0; then exit "$pack_status"; fi; exit "$finalize_status"; elif test -n "$BUSTER_CI_PYTHON" && command -v "$BUSTER_CI_PYTHON" >/dev/null 2>&1; then "$BUSTER_CI_PYTHON" tools/ci_pack_evidence.py --source "$RUNNER_TEMP/buster-ci" --output "$RUNNER_TEMP/native-ci-upload"; else python3 tools/ci_pack_evidence.py --source "$RUNNER_TEMP/buster-ci" --output "$RUNNER_TEMP/native-ci-upload"; fi

      - name: Retain native logs
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        # The same-commit action uses actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a for both attempts.
        uses: ./.github/actions/native-artifact-upload
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-ci-upload/
          # The archive is already gzip-compressed.
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Record native packaging failure
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.pack.outcome != 'success' }}
        shell: bash
        env:
          BUSTER_CI_STEPS: ${{ toJSON(steps) }}
          BUSTER_CI_RUNNER: ${{ matrix.runner }}
          # Unix equivalent: BUSTER_CI_REQUIRED: modes differential pack
          BUSTER_CI_REQUIRED: ${{ matrix.platform == 'windows' && 'modes_windows msvc_reference pack' || 'modes differential pack' }}
          BUSTER_CI_REPRO: See docs/windows-ci-coverage.md and docs/ci-suite-partition.md for native evidence packaging and fallback.
        # Unix equivalent: run: python3 tools/ci_summary.py
        run: if command -v "$BUSTER_CI_PYTHON" >/dev/null 2>&1; then "$BUSTER_CI_PYTHON" tools/ci_summary.py; else python3 tools/ci_summary.py; fi

      # A packing failure already fails this lane; still retain the original tree.
      - name: Retain unpacked native logs
        if: ${{ !cancelled() && steps.pack.outcome != 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/buster-ci/
            ${{ runner.temp }}/native-ci-upload/
            !${{ runner.temp }}/buster-ci/differential/**/program
            !${{ runner.temp }}/buster-ci/differential/**/subject.o
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: ${{ matrix.name }}
    timeout-minutes: 300
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        include:
          - name: Android x86-64
            runner: ubuntu-26.04
            os: android
            arch: x86_64
          - name: iOS x86-64
            runner: macos-26-intel
            os: ios
            arch: x86_64
          - name: iOS AArch64
            runner: macos-26
            os: ios
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install coreutils
        if: ${{ matrix.os == 'ios' }}
        shell: bash
        run: brew install --quiet coreutils

      - name: Grant the runner access to KVM
        if: ${{ matrix.os == 'android' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator system image
        id: android_sdk
        if: ${{ matrix.os == 'android' }}
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          sdkmanager=$(command -v sdkmanager || true)
          if [[ -z $sdkmanager ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n 1)
          fi
          if [[ -z $sdkmanager ]]; then
            echo "error: sdkmanager was not found under $ANDROID_HOME" >&2
            exit 1
          fi
          printf '%s\n' "$(dirname "$sdkmanager")" >>"$GITHUB_PATH"
          python3 tools/ci_android_sdk.py \
            --sdkmanager "$sdkmanager" \
            --sdk-root "$ANDROID_HOME" \
            --log-directory "$RUNNER_TEMP/buster-ci" \
            --attempts 3 \
            --attempt-timeout-seconds 300 \
            --backoff-seconds 5 \
            --package emulator \
            --package "platforms;android-35" \
            --package "$BUSTER_ANDROID_SYSTEM_IMAGE"
          printf '%s\n' "$ANDROID_HOME/emulator" "$ANDROID_HOME/platform-tools" >>"$GITHUB_PATH"

      - name: Test (Android)
        id: android
        if: ${{ matrix.os == 'android' }}
        shell: bash
        env:
          BUSTER_ANDROID_AVD: buster-ci
          BUSTER_ANDROID_DEVICE: pixel_6
          BUSTER_ANDROID_EMULATOR_GPU: swiftshader_indirect
          BUSTER_ANDROID_EMULATOR_HEADLESS: "1"
          BUSTER_ANDROID_EMULATOR_LOG: ${{ runner.temp }}/buster-ci/android-emulator.log
          BUSTER_ANDROID_EMULATOR_STARTED_MARKER: ${{ runner.temp }}/buster-ci/android-emulator.started
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          exec > >(tee "$RUNNER_TEMP/buster-ci/android.log") 2>&1
          android_phase=start
          cleanup_android_emulator() {
            status=$?
            payload_status=$status
            cleanup_status=not-run
            trap - EXIT INT TERM
            if [[ $status -ne 0 && -f "${BUSTER_ANDROID_EMULATOR_LOG:-}" ]]; then
              printf 'Android emulator log follows an already-failed phase=%s status=%s\n' "$android_phase" "$payload_status" >&2
              tail -n 200 "$BUSTER_ANDROID_EMULATOR_LOG" || true
            fi
            if [[ -f "$BUSTER_ANDROID_EMULATOR_STARTED_MARKER" ]]; then
              cleanup_timeout_seconds=${BUSTER_ANDROID_CLEANUP_TIMEOUT_SECONDS:-${BUSTER_ANDROID_COMMAND_TIMEOUT_SECONDS:-30}}
              if BUSTER_ANDROID_CLEANUP_TIMEOUT_SECONDS="$cleanup_timeout_seconds" bash ./android/start_emulator_ci.sh stop; then
                cleanup_status=0
              else
                cleanup_status=$?
                echo "warning: Android emulator cleanup failed with exit status $cleanup_status" >&2
                if [[ $status -eq 0 ]]; then status=1; fi
              fi
            fi
            printf 'ANDROID_CI_RESULT phase=%s payload_status=%s cleanup_status=%s status=%s\n' "$android_phase" "$payload_status" "$cleanup_status" "$status"
            if [[ $payload_status -ne 0 ]]; then
              printf 'error: Android CI failed before final emulator cleanup (phase=%s status=%s)\n' "$android_phase" "$payload_status" >&2
            elif [[ $status -ne 0 ]]; then
              printf 'error: Android CI required emulator cleanup failed (status=%s)\n' "$cleanup_status" >&2
            fi
            exit "$status"
          }
          trap cleanup_android_emulator EXIT
          # Preserve cancellation's nonzero status while the EXIT trap cleans up.
          trap 'exit 130' INT
          trap 'exit 143' TERM
          bash ./android/start_emulator_ci.sh start
          android_phase=tests
          ./android/test_ci.sh --all

      - name: Test (iOS simulator)
        id: ios
        if: ${{ matrix.os == 'ios' }}
        shell: bash
        env:
          BUSTER_IOS_ARCH: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }}
          BUSTER_IOS_CONSOLE_LOG: ${{ runner.temp }}/buster-ci/ios-console.log
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          exec > >(tee "$RUNNER_TEMP/buster-ci/ios.log") 2>&1
          ./ios/test_ci.sh --all

      - name: Mobile result and reproduction
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          BUSTER_CI_STEPS: ${{ toJSON(steps) }}
          BUSTER_CI_RUNNER: ${{ matrix.runner }}
          BUSTER_CI_REQUIRED: ${{ matrix.os == 'ios' && 'ios' || (steps.android_sdk.outcome == 'success' && 'android_sdk android' || 'android_sdk') }}
          BUSTER_CI_REPRO: See docs/ci-github-actions.md for the matching mobile SDK and lifecycle commands.
        run: python3 tools/ci_summary.py

      - name: Retain mobile logs
        if: ${{ !cancelled() }}
        uses: ./.github/actions/native-artifact-upload
        with:
          label: mobile
          label_title: Mobile
          name: mobile-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/buster-ci/
          compression-level: 6
          if-no-files-found: ignore
          retention-days: 7

  uefi:
    name: UEFI firmware boot
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned QEMU and reference firmware
        shell: bash
        run: |
          set -euo pipefail
          # The immutable snapshot keeps the exact packages available after updates.
          cat > "$RUNNER_TEMP/uefi-sources.list" <<'SOURCES'
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20260828T000000Z noble main universe
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20260828T000000Z noble-updates main universe
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20260828T000000Z noble-security main universe
          SOURCES
          apt_options=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/uefi-sources.list" -o 'Dir::Etc::sourceparts=-' -o 'APT::Get::List-Cleanup=0')
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            qemu-system-x86=1:8.2.2+ds-0ubuntu1.18 qemu-system-arm=1:8.2.2+ds-0ubuntu1.18 \
            qemu-system-common=1:8.2.2+ds-0ubuntu1.18 qemu-system-data=1:8.2.2+ds-0ubuntu1.18 \
            ovmf=2024.02-2ubuntu0.9 qemu-efi-aarch64=2024.02-2ubuntu0.9
      - name: Build driver and validate the boot oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o build/uefi-driver
          build/uefi-driver test_uefi --self-test build/uefi-self-test
      - name: Build compiler and boot both architectures in all allocators
        shell: bash
        run: |
          set -euo pipefail
          build/uefi-driver generate --build-directory build/uefi-compiler --ci --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_INCLUDE_TESTS=OFF -DBUSTER_UNITY_BUILD=OFF
          build/uefi-driver build --build-directory build/uefi-compiler --config Release -t ide -- -j2
          build/uefi-driver test_uefi build/uefi-compiler/Release/ide build/uefi
      - name: Retain firmware execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uefi-boot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/uefi
            !build/uefi/**/VARS.fd
            build/uefi-self-test
            build/uefi-compiler/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14

  analyzer:
    name: Clang analyzer shards
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bootstrap candidate and select reference build driver
        shell: bash
        env:
          BASELINE_REVISION: ${{ github.event.pull_request.base.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          COMPARISON_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.analyzer_comparison && 'true' || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p build "$RUNNER_TEMP/buster-analyzer"
          candidate_revision="$(git rev-parse --verify 'HEAD^{commit}')"
          reference_revision="$(git rev-parse --verify "$BASELINE_REVISION^{commit}")"
          candidate_depfile="$RUNNER_TEMP/buster-analyzer/candidate-driver.d"
          reference_depfile="$RUNNER_TEMP/buster-analyzer/reference-driver.d"
          candidate_manifest="$RUNNER_TEMP/buster-analyzer/candidate-driver-provenance.json"
          reference_manifest="$RUNNER_TEMP/buster-analyzer/reference-driver-provenance.json"
          selection_path="$RUNNER_TEMP/buster-analyzer/comparison-selection.txt"
          reference_root="$RUNNER_TEMP/buster-analyzer/reference-tree"
          printf '%s\n' "$candidate_revision" | tee "$RUNNER_TEMP/buster-analyzer/revision.txt"
          printf '%s\n' "$reference_revision" > "$RUNNER_TEMP/buster-analyzer/baseline-revision.txt"
          clang --version | tee "$RUNNER_TEMP/buster-analyzer/clang.txt"
          rm -f "$candidate_depfile" "$reference_depfile" build/analyzer-baseline
          rm -rf "$reference_root"
          clang -Isrc -I. -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char \
            -MMD -MF "$candidate_depfile" build.c -o build/analyzer-driver
          python3 tools/analyzer_reference.py manifest \
            --repository "$GITHUB_WORKSPACE" --revision "$candidate_revision" \
            --root "$GITHUB_WORKSPACE" --depfile "$candidate_depfile" \
            --output "$candidate_manifest"

          reference_materialized=true
          if [[ "$candidate_revision" == "$reference_revision" && \
                ("$EVENT_NAME" == push || "$EVENT_NAME" == workflow_dispatch) && \
                "$COMPARISON_REQUESTED" == false ]]; then
            reference_materialized=false
          fi
          if [[ "$reference_materialized" == true ]]; then
            mkdir -p "$reference_root"
            trap 'rm -rf "$reference_root"' EXIT
            git archive --format=tar "$reference_revision" | tar -xf - -C "$reference_root"
            if find "$reference_root" -type l -print -quit | grep -q .; then
              echo '::error::Historical analyzer reference contains a symlink.'
              exit 1
            fi
            (
              cd "$reference_root"
              clang -Isrc -I. -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char \
                -MMD -MF "$reference_depfile" build.c -o "$GITHUB_WORKSPACE/build/analyzer-baseline"
            )
            python3 tools/analyzer_reference.py manifest \
              --repository "$GITHUB_WORKSPACE" --revision "$reference_revision" \
              --root "$reference_root" --depfile "$reference_depfile" \
              --output "$reference_manifest"
          else
            cp "$candidate_manifest" "$reference_manifest"
          fi
          python3 tools/analyzer_reference.py select \
            --repository "$GITHUB_WORKSPACE" --event "$EVENT_NAME" \
            --requested "$COMPARISON_REQUESTED" \
            --candidate-revision "$candidate_revision" \
            --reference-revision "$reference_revision" \
            --candidate-manifest "$candidate_manifest" \
            --reference-manifest "$reference_manifest" \
            --output "$selection_path"
          selection="$(python3 tools/analyzer_reference.py field --record "$selection_path" --field selection)"
          reason="$(python3 tools/analyzer_reference.py field --record "$selection_path" --field reason)"
          if [[ "$selection" == skip ]]; then
            rm -f build/analyzer-baseline
          fi
          {
            printf 'ANALYZER_COMPARISON_SELECTION=%s\n' "$selection"
            printf 'ANALYZER_COMPARISON_REASON=%s\n' "$reason"
            printf 'ANALYZER_REFERENCE_MATERIALIZED=%s\n' "$reference_materialized"
          } >> "$GITHUB_ENV"
          {
            printf '## Clang analyzer comparison selection\n\n'
            printf '| Event | Candidate | Reference | Selection | Reason |\n| --- | --- | --- | --- | --- |\n'
            printf '| %s | %s | %s | %s | %s |\n' "$EVENT_NAME" "$candidate_revision" "$reference_revision" "$selection" "$reason"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$reference_materialized" == true ]]; then
            trap - EXIT
          fi
      - name: Exercise analyzer failure and coverage controls
        shell: bash
        run: |
          set -euo pipefail
          build/analyzer-driver clang_analyze --self-test 2>&1 | tee "$RUNNER_TEMP/buster-analyzer/self-test.log"
      - name: Configure the authoritative split-source database
        shell: bash
        run: |
          set -euo pipefail
          build/analyzer-driver generate --build-directory build/analyzer-tree --ci --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_UNITY_BUILD=OFF
      - name: Compare reference analysis and aggregate all module shards
        shell: bash
        env:
          BASELINE_REVISION: ${{ github.event.pull_request.base.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          COMPARISON_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.analyzer_comparison && 'true' || 'false' }}
        run: |
          set -euo pipefail
          candidate_revision="$(git rev-parse --verify 'HEAD^{commit}')"
          reference_revision="$(git rev-parse --verify "$BASELINE_REVISION^{commit}")"
          candidate_depfile="$RUNNER_TEMP/buster-analyzer/candidate-driver.d"
          reference_depfile="$RUNNER_TEMP/buster-analyzer/reference-driver.d"
          candidate_manifest="$RUNNER_TEMP/buster-analyzer/candidate-driver-provenance.json"
          reference_manifest="$RUNNER_TEMP/buster-analyzer/reference-driver-provenance.json"
          selection_path="$RUNNER_TEMP/buster-analyzer/comparison-selection.txt"
          reference_root="$RUNNER_TEMP/buster-analyzer/reference-tree"
          expected_directory="$(mktemp -d "$RUNNER_TEMP/buster-analyzer/.comparison-expected.XXXXXX")"
          trap 'rm -rf "$expected_directory" "$reference_root"' EXIT
          for evidence in "$candidate_depfile" "$candidate_manifest" "$reference_manifest" "$selection_path"; do
            if [[ ! -f "$evidence" || -L "$evidence" ]]; then
              echo '::error::Missing analyzer comparison provenance evidence.'
              exit 1
            fi
          done
          expected_materialized=true
          if [[ "$candidate_revision" == "$reference_revision" && \
                ("$EVENT_NAME" == push || "$EVENT_NAME" == workflow_dispatch) && \
                "$COMPARISON_REQUESTED" == false ]]; then
            expected_materialized=false
          fi
          if [[ "${ANALYZER_REFERENCE_MATERIALIZED-}" != "$expected_materialized" ]]; then
            echo '::error::Analyzer reference materialization evidence is missing or stale.'
            exit 1
          fi
          python3 tools/analyzer_reference.py manifest \
            --repository "$GITHUB_WORKSPACE" --revision "$candidate_revision" \
            --root "$GITHUB_WORKSPACE" --depfile "$candidate_depfile" \
            --output "$expected_directory/candidate.json"
          if [[ "$expected_materialized" == true ]]; then
            if [[ ! -d "$reference_root" || -L "$reference_root" || \
                  ! -f "$reference_depfile" || -L "$reference_depfile" ]]; then
              echo '::error::Historical analyzer reference evidence is missing or unsafe.'
              exit 1
            fi
            python3 tools/analyzer_reference.py manifest \
              --repository "$GITHUB_WORKSPACE" --revision "$reference_revision" \
              --root "$reference_root" --depfile "$reference_depfile" \
              --output "$expected_directory/reference.json"
          else
            if [[ -e "$reference_root" || -L "$reference_root" || \
                  -e "$reference_depfile" || -L "$reference_depfile" ]]; then
              echo '::error::Same-revision skip retained unexpected historical reference state.'
              exit 1
            fi
            cp "$expected_directory/candidate.json" "$expected_directory/reference.json"
          fi
          if ! cmp -s "$expected_directory/candidate.json" "$candidate_manifest" || \
             ! cmp -s "$expected_directory/reference.json" "$reference_manifest"; then
            echo '::error::Missing, malformed, stale or inconsistent analyzer provenance evidence.'
            exit 1
          fi
          python3 tools/analyzer_reference.py select \
            --repository "$GITHUB_WORKSPACE" --event "$EVENT_NAME" \
            --requested "$COMPARISON_REQUESTED" \
            --candidate-revision "$candidate_revision" \
            --reference-revision "$reference_revision" \
            --candidate-manifest "$expected_directory/candidate.json" \
            --reference-manifest "$expected_directory/reference.json" \
            --output "$expected_directory/selection.txt"
          if ! cmp -s "$expected_directory/selection.txt" "$selection_path"; then
            echo '::error::Missing, malformed, stale or inconsistent analyzer comparison selection evidence.'
            exit 1
          fi
          selection="$(python3 tools/analyzer_reference.py field --record "$selection_path" --field selection)"
          reason="$(python3 tools/analyzer_reference.py field --record "$selection_path" --field reason)"
          if [[ "${ANALYZER_COMPARISON_SELECTION-}" != "$selection" || \
                "${ANALYZER_COMPARISON_REASON-}" != "$reason" ]]; then
            echo '::error::Analyzer comparison selection exports do not match retained evidence.'
            exit 1
          fi
          rm -rf "$expected_directory" "$reference_root"
          trap - EXIT
          case "$selection" in
            compare)
              if [[ ! -f build/analyzer-baseline || -L build/analyzer-baseline || ! -x build/analyzer-baseline ]]; then
                echo '::error::Analyzer comparison requires a regular, non-symlink executable baseline driver.'
                exit 1
              fi
              build/analyzer-driver clang_analyze build/analyzer-tree --config Release --shards 8 --jobs 2 --quiet --results "$RUNNER_TEMP/buster-analyzer/full" --baseline-driver build/analyzer-baseline 2>&1 | tee "$RUNNER_TEMP/buster-analyzer/full.log"
              ;;
            skip)
              if [[ -e build/analyzer-baseline || -L build/analyzer-baseline ]]; then
                echo '::error::Analyzer skip requires the baseline driver path to be absent.'
                exit 1
              fi
              build/analyzer-driver clang_analyze build/analyzer-tree --config Release --shards 8 --jobs 2 --quiet --results "$RUNNER_TEMP/buster-analyzer/full" 2>&1 | tee "$RUNNER_TEMP/buster-analyzer/full.log"
              ;;
            *)
              echo '::error::Missing or invalid analyzer comparison selection.'
              exit 1
              ;;
          esac
          build/analyzer-driver clang_analyze build/analyzer-tree --config Release --shards 8 --aggregate --results "$RUNNER_TEMP/buster-analyzer/full" 2>&1 | tee "$RUNNER_TEMP/buster-analyzer/aggregate.log"
      - name: Retain analyzer inventory, results and measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clang-analyzer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/buster-analyzer/
            build/analyzer-tree/compile_commands.json
            build/analyzer-tree/CMakeCache.txt
            build/analyzer-self-test-*/
          if-no-files-found: warn
          retention-days: 14

  complete:
    name: CI complete
    permissions:
      contents: read
      actions: read
    needs: [lint, test, native, mobile, uefi, analyzer]
    if: ${{ always() && github.server_url == 'https://github.com' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify every desktop partition exists
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: 'python3 tools/github_ci_time.py require-jobs --output "$RUNNER_TEMP/desktop-partitions.json"'
      - name: Retain desktop partition inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-partitions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-partitions.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Require every shard
        if: ${{ always() }}
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          DESKTOP_RESULT: ${{ needs.test.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          UEFI_RESULT: ${{ needs.uefi.result }}
          ANALYZER_RESULT: ${{ needs.analyzer.result }}
        run: |
          {
            printf '| Shards | Result |\n| --- | --- |\n| All twelve desktop shards | %s |\n| All three mobile lanes | %s |\n' "$DESKTOP_RESULT" "$MOBILE_RESULT"
            printf '| All six native lanes | %s |\n' "$NATIVE_RESULT"
            printf '| UEFI firmware boot | %s |\n' "$UEFI_RESULT"
            printf '| Clang analyzer shards | %s |\n' "$ANALYZER_RESULT"
            printf '| Workflow lint | %s |\n' "$LINT_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$LINT_RESULT" != success || "$DESKTOP_RESULT" != success || "$NATIVE_RESULT" != success || "$MOBILE_RESULT" != success || "$UEFI_RESULT" != success || "$ANALYZER_RESULT" != success ]]; then
            echo '::error::All desktop, native, mobile, UEFI and analyzer shards must succeed; failure, cancellation and skips do not pass.'
            exit 1
          fi
