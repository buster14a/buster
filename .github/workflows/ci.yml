name: Buster CI

# This branch only transports source for the audit. Real compilation and all
# platform checks run unchanged on PR #273's implementation branch.
on:
  push:
    branches: [work/self-host-audit-20260907]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  transport-only:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'
