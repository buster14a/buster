name: Buster CI

# GitHub-hosted CI for the migration to GitHub, on standard runners.
#
# It carries the same coverage as .forgejo/workflows/ci.yml — the
# multi-compiler combination matrix, the execution-mode matrix, the Android
# emulator suite and the iOS simulator suite — and spreads it over one runner
# per platform and architecture, so x86-64 and AArch64 are first-class on
# Linux, macOS and Windows alike. Forgejo remains the source of truth; this
# runs beside it.
#
# Preserve the six platform check names and their complete coverage. The
# build.c-owned compiler trees remain resource-bounded shards on each runner;
# independent execution-mode/mobile suites still run after a combination fails.
# A failed prerequisite skips only its dependants, never turns the job green.
#
# Forgejo also reads .github/workflows, so the job is gated on actually
# running at github.com. On Forgejo that condition is false and the job skips,
# instead of queueing forever against a runner label no Forgejo runner
# carries. The second half of the gate keeps the workflow inert until
# GH_ACTIONS_CI_ENABLED is set, so a private repository spends none of its
# included minutes before the migration is finished.
#
# Bootstrapping uses the Clang already present on the hosted images rather
# than TCC: the images ship no TCC, and modern macOS cannot run it. It still
# lands in build/, where build.sh and build.ps1 put it, because the superbuild
# names that exact path in the manifest it hands CMake. The combination matrix
# itself needs Clang, GCC, Zig and — on Windows — MSVC as application
# compilers; the images carry every one of those but Zig, which each runner
# installs from a pinned, checksummed upstream archive.

# One full run per PR revision, plus post-merge/main, tags and merge queues.
# Feature-branch pushes are tested through their PR, not a duplicate push run.
# No path filters: documentation-only PRs must not strand required checks.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['**']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Supersede only the same PR/merge-group. Main, tags and deliberate manual
# measurements get unique groups, so neither active nor pending runs are lost.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'merge_group' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

env:
  # Sanitizer diagnostics must fail the existing Debug/Release sanitizer
  # shards, not recover to an apparently green test process. Keep leak checks.
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  BUSTER_ANDROID_SYSTEM_IMAGE: "system-images;android-35;google_apis;x86_64"

jobs:
  test:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: ${{ matrix.name }}
    # One runner now carries the combination matrix, the execution-mode
    # matrix and its platform's mobile suite end to end, and hosted runners
    # have a fraction of the cores of the native boxes. The bound is
    # generous; it stays inside GitHub's own six-hour job limit.
    timeout-minutes: 300
    strategy:
      # Report every platform's result: a failure on one is not a reason to
      # hide the others when the whole point is cross-platform coverage.
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-26.04
            platform: unix
            os: linux
            arch: x86_64
            zig_target: x86_64-linux
          - name: Linux AArch64
            runner: ubuntu-26.04-arm
            platform: unix
            os: linux
            arch: aarch64
            zig_target: aarch64-linux
          - name: macOS x86-64
            runner: macos-26-intel
            platform: unix
            os: macos
            arch: x86_64
            zig_target: x86_64-macos
          - name: macOS AArch64
            runner: macos-26
            platform: unix
            os: macos
            arch: aarch64
            zig_target: aarch64-macos
          - name: Windows x86-64
            runner: windows-2025
            platform: windows
            os: windows
            arch: x86_64
            zig_target: x86_64-windows
            vs_arch: amd64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
            clang_arch: x86_64
          - name: Windows AArch64
            runner: windows-11-arm
            platform: windows
            os: windows
            arch: aarch64
            zig_target: aarch64-windows
            vs_arch: arm64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
            clang_arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      BUSTER_CI_RUNNER: ${{ matrix.runner }}
      BUSTER_CI_PYTHON: ${{ matrix.platform == 'windows' && 'python' || 'python3' }}
      BUSTER_CI_REQUIRED: ${{ matrix.platform == 'windows' && 'workflow_tools combination_windows' || matrix.os == 'macos' && 'workflow_tools combination_unix mode_matrix ios' || matrix.arch == 'x86_64' && 'workflow_tools combination_unix mode_matrix android' || 'workflow_tools combination_unix mode_matrix' }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # These CI configurations leave rendering/shader compilation disabled.
      # Do not execute a mutable SDK release's setup scripts for unused tools.
      - name: Workflow tool regression tests
        id: workflow_tools
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          "$BUSTER_CI_PYTHON" --version
          "$BUSTER_CI_PYTHON" tests/ci_tools_test.py -v 2>&1 | tee "$RUNNER_TEMP/buster-ci/workflow-tools.log"

      # Linux defaults to mold for every non-Zig compiler, and the images do
      # not carry it. This is the distribution's own package, so the version
      # is the one that image already pins.
      - name: Install mold
        id: mold
        if: ${{ !cancelled() && matrix.os == 'linux' && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mold

      # The iOS simulator launcher bounds every step with timeout(1), which
      # macOS has under neither name until coreutils provides gtimeout.
      - name: Install coreutils
        id: coreutils
        if: ${{ !cancelled() && matrix.os == 'macos' && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          brew install --quiet coreutils

      # Exact-key archive cache only: no restore prefixes, CMake state, object
      # files, extracted compilers, credentials, or previous test verdicts.
      - name: Restore Zig archive
        id: zig_cache
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/zig-archive/archive
          key: zig-archive-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.zig_target }}-${{ hashFiles('.github/zig.json') }}

      - name: Install verified Zig
        id: zig
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        env:
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          set -euo pipefail
          "$BUSTER_CI_PYTHON" tools/ci_zig.py --target "$ZIG_TARGET" --cache-directory "$RUNNER_TEMP/zig-archive" --install-directory "$RUNNER_TEMP/zig" 2>&1 | tee "$RUNNER_TEMP/buster-ci/zig.log"

      # Publish immediately after verification, before compiler build/tests.
      # A corrupt hit is a hard failure and is never silently republished.
      - name: Save verified Zig archive
        if: ${{ !cancelled() && steps.zig.outcome == 'success' && steps.zig_cache.outputs.cache-hit != 'true' && steps.zig_cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/zig-archive/archive
          key: ${{ steps.zig_cache.outputs.cache-primary-key }}

      # Name the application compilers before the matrix runs, because a
      # missing one fails deep inside a CMake configure with a far less
      # obvious message than an absent command here.
      - name: Application compilers
        id: tools_unix
        if: ${{ !cancelled() && matrix.platform == 'unix' && steps.zig.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          clang --version
          cmake --version
          ninja --version
          # macOS answers /usr/bin/gcc with an Apple Clang shim; the matrix's
          # GCC row is a real GCC only where the platform provides one.
          gcc --version
          zig version

      - name: Combination matrix (Linux, macOS)
        id: combination_unix
        if: ${{ !cancelled() && matrix.platform == 'unix' && steps.tools_unix.outcome == 'success' && (matrix.os != 'linux' || steps.mold.outcome == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          # build/build is where build.sh puts the driver and where the
          # superbuild's manifest expects to find it; anywhere else and CMake
          # rejects BUSTER_SUPERBUILD_BUILD_DRIVER. The matrix only removes
          # the build/build-* trees it generates, so the driver survives.
          mkdir -p build
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o build/build
          ./build/build test_all_combinations_ci --verbose=1 2>&1 | tee "$RUNNER_TEMP/buster-ci/combinations.log"

      - name: Combination matrix (Windows)
        id: combination_windows
        if: ${{ !cancelled() && matrix.platform == 'windows' && steps.zig.outcome == 'success' }}
        shell: powershell
        env:
          VS_ARCH: ${{ matrix.vs_arch }}
          VS_COMPONENT: ${{ matrix.vs_component }}
          CLANG_ARCH: ${{ matrix.clang_arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $VsWhere)) { throw "vswhere was not found at $VsWhere" }
          $VsPath = & $VsWhere -latest -products * -requires $env:VS_COMPONENT -property installationPath | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $VsPath) { throw "Visual Studio with ${env:VS_COMPONENT} was not found" }
          # -HostArch takes only x86 or amd64, so the AArch64 runner drives an
          # emulated x64 toolchain host at an arm64 target. Launch-VsDevShell
          # is a script, not a native command, so it leaves $LASTEXITCODE to
          # whatever it last ran internally; `where.exe cl` is the check that
          # the shell actually arrived.
          & (Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1') -Arch $env:VS_ARCH -HostArch amd64 -SkipAutomaticLocation
          # The dev shell puts Visual Studio's own x64 clang ahead of the
          # image's standalone LLVM. On the AArch64 runner that clang emits
          # x86-64 objects while the shell's LIB holds arm64 import
          # libraries, and every link fails on strlen and
          # __imp_GetCommandLineW. The standalone LLVM matches the host, so
          # it goes first -- for the matrix's clang row as much as for the
          # bootstrap below.
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          where.exe cl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          where.exe clang
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          where.exe gcc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          where.exe zig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Name the mismatch here rather than leaving it to a wall of
          # unresolved externals a minute later.
          $ClangVersion = (& clang --version) -join "`n"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "gcc --version && zig version && cmake --version && ninja --version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output $ClangVersion
          if ($ClangVersion -notmatch "Target:\s*${env:CLANG_ARCH}-") {
            throw "clang does not default to a ${env:CLANG_ARCH} target"
          }
          # The native toolchain runs through cmd so its progress on stderr
          # cannot become a terminating PowerShell error record. Clang on the
          # MSVC triple also warns on build.c's forward-declared enums.
          # build/build.exe is where build.ps1 puts the driver and the path
          # the superbuild's manifest names.
          New-Item -ItemType Directory -Force -Path 'build' | Out-Null
          $Driver = Join-Path (Get-Location) 'build\build.exe'
          cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Redirect stderr inside cmd, not PowerShell: native diagnostics
          # must not become terminating NativeCommandError records.
          cmd /c "`"$Driver`" test_all_combinations_ci --verbose=1 2>&1" | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'buster-ci/combinations.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The matrix cross-products every register-allocator mode with every
      # linkable target, running each leg natively or under an emulator the
      # host provides and oracle-checking the rest. Running it on both
      # architectures of both Unix platforms is what makes the ELF and Mach-O
      # legs execute natively on x86-64 and on AArch64. Windows is excluded
      # here as it is on Forgejo, where that runner is the wall-time gate.
      - name: Execution-mode matrix
        id: mode_matrix
        if: ${{ !cancelled() && matrix.platform == 'unix' && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          # Ubuntu's hosted Granite Rapids CPUs report an AVX10 feature
          # combination that Clang warns about when -march=native is used.
          # The matrix validates execution modes, not host-specific tuning.
          CFLAGS: ${{ runner.os == 'Linux' && '-Wno-error=invalid-feature-combination' || '' }}
        run: |
          set -euo pipefail
          # This driver deliberately lives outside build/: the generate below
          # targets the default tree, which is build/ itself, and removes it.
          # A driver inside would be deleted between the two invocations.
          driver="$RUNNER_TEMP/buster-build"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver"
          # The matrix generates a tree only when none exists, and the
          # combination matrix leaves none at the default path. Preparing it
          # here pins the configuration and the linker rather than inheriting
          # whatever generate would default to, which on Linux is mold;
          # --linker is accepted by the generate command alone.
          "$driver" generate --cc clang --config Release --linker DEFAULT 2>&1 | tee "$RUNNER_TEMP/buster-ci/mode-generate.log"
          "$driver" test_mode_matrix --config Release 2>&1 | tee "$RUNNER_TEMP/buster-ci/modes.log"

      # The image loads the kvm module but leaves the node owned by root, so
      # the unprivileged runner user cannot accelerate the emulator without
      # this rule. Without acceleration an x86-64 system image boots far
      # beyond the emulator's own boot timeout. Only the x86-64 Linux image
      # carries an Android SDK and that nested virtualisation.
      - name: Grant the runner access to KVM
        id: kvm
        if: ${{ !cancelled() && matrix.os == 'linux' && matrix.arch == 'x86_64' && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The image ships the SDK, the platform and the NDK, but no emulator
      # system image; the AVD cannot be created without one.
      - name: Install the emulator system image
        id: android_sdk
        if: ${{ !cancelled() && matrix.os == 'linux' && matrix.arch == 'x86_64' && steps.kvm.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager=$(command -v sdkmanager || true)
          if [[ -z $sdkmanager ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n 1)
          fi
          if [[ -z $sdkmanager ]]; then
            echo "error: sdkmanager was not found under $ANDROID_HOME" >&2
            exit 1
          fi
          # The lifecycle script looks for avdmanager beside sdkmanager under
          # cmdline-tools/latest; publish the directory it was actually found
          # in so an image that names the directory by version still works.
          printf '%s\n' "$(dirname "$sdkmanager")" >>"$GITHUB_PATH"
          # The image accepts the SDK licences already, but sdkmanager still
          # prompts on some packages. The acceptances come from a file rather
          # than from `yes |`, whose SIGPIPE would fail the step under
          # pipefail once sdkmanager stops reading.
          accept="$RUNNER_TEMP/sdkmanager-accept"
          printf 'y\n%.0s' {1..100} >"$accept"
          "$sdkmanager" --install emulator "platforms;android-35" "$BUSTER_ANDROID_SYSTEM_IMAGE" <"$accept" 2>&1 | tee "$RUNNER_TEMP/buster-ci/android-sdk.log"
          printf '%s\n' "$ANDROID_HOME/emulator" "$ANDROID_HOME/platform-tools" >>"$GITHUB_PATH"

      - name: Test (Android)
        id: android
        if: ${{ !cancelled() && matrix.os == 'linux' && matrix.arch == 'x86_64' && steps.android_sdk.outcome == 'success' }}
        shell: bash
        env:
          BUSTER_ANDROID_AVD: buster-ci
          BUSTER_ANDROID_DEVICE: pixel_6
          BUSTER_ANDROID_EMULATOR_GPU: swiftshader_indirect
          BUSTER_ANDROID_EMULATOR_HEADLESS: "1"
          BUSTER_ANDROID_EMULATOR_LOG: ${{ runner.temp }}/buster-ci/android-emulator.log
          BUSTER_ANDROID_EMULATOR_STARTED_MARKER: ${{ runner.temp }}/buster-ci/android-emulator.started
        run: |
          set -euo pipefail

          cleanup_android_emulator() {
            status=$?
            trap - EXIT INT TERM
            if [[ $status -ne 0 && -f "${BUSTER_ANDROID_EMULATOR_LOG:-}" ]]; then
              echo "Last Android emulator log lines:"
              tail -n 200 "$BUSTER_ANDROID_EMULATOR_LOG" || true
            fi
            if [[ -f "$BUSTER_ANDROID_EMULATOR_STARTED_MARKER" ]]; then
              cleanup_timeout_seconds=${BUSTER_ANDROID_CLEANUP_TIMEOUT_SECONDS:-${BUSTER_ANDROID_COMMAND_TIMEOUT_SECONDS:-30}}
              if BUSTER_ANDROID_EMULATOR_STARTED_MARKER="$BUSTER_ANDROID_EMULATOR_STARTED_MARKER" \
                BUSTER_ANDROID_CLEANUP_TIMEOUT_SECONDS="$cleanup_timeout_seconds" \
                bash ./android/start_emulator_ci.sh stop; then
                :
              else
                cleanup_status=$?
                echo "warning: Android emulator lifecycle cleanup failed with exit status $cleanup_status" >&2
                if [[ $status -eq 0 ]]; then
                  status=1
                  if [[ -f "${BUSTER_ANDROID_EMULATOR_LOG:-}" ]]; then
                    echo "Last Android emulator log lines:"
                    tail -n 200 "$BUSTER_ANDROID_EMULATOR_LOG" || true
                  fi
                fi
              fi
            fi
            exit "$status"
          }
          trap cleanup_android_emulator EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          bash ./android/start_emulator_ci.sh start 2>&1 | tee "$RUNNER_TEMP/buster-ci/android-start.log"
          ./android/test_ci.sh --all 2>&1 | tee "$RUNNER_TEMP/buster-ci/android.log"

      # The simulator runs the host's own architecture, so the two macOS
      # runners cover the x86-64 and AArch64 simulator runtimes between them.
      - name: Test (iOS simulator)
        id: ios
        if: ${{ !cancelled() && matrix.os == 'macos' && steps.coreutils.outcome == 'success' && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          BUSTER_IOS_ARCH: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }}
        run: |
          set -euo pipefail
          ./ios/test_ci.sh --all 2>&1 | tee "$RUNNER_TEMP/buster-ci/ios.log"

      - name: Failure summary and reproduction commands
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        env:
          BUSTER_CI_STEPS: ${{ toJSON(steps) }}
          BUSTER_CI_REPRO: |
            Bootstrap build/build (build/build.exe on Windows) with the hosted Clang command in docs/ci-github-actions.md, not TCC.
            build/build test_all_combinations_ci --verbose=1
            Unix execution modes: bootstrap a driver outside build/, then run:
            "$RUNNER_TEMP/buster-build" generate --cc clang --config Release --linker DEFAULT
            "$RUNNER_TEMP/buster-build" test_mode_matrix --config Release
            Android (Linux x86-64): use the start/stop lifecycle wrapper in this workflow; ./android/test_ci.sh --all
            iOS (macOS): BUSTER_IOS_ARCH=<arm64|x86_64> ./ios/test_ci.sh --all
            Sanitizers: UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 (no disabled leak checks)
        run: '"$BUSTER_CI_PYTHON" tools/ci_summary.py'

      - name: Retain CI diagnostics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/buster-ci/*.log
            ${{ runner.temp }}/buster-ci/*.json
            ${{ runner.temp }}/buster-ci/*.md
          if-no-files-found: error
          retention-days: 7
