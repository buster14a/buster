name: Frontend declaration and union override proof
on:
  push:
    branches: [codex/2392-derived-tags-hosted-proof]
permissions:
  contents: read
concurrency:
  group: frontend-2392-derived-tags-hosted-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Record exact inputs and bootstrap driver
        run: |
          mkdir -p proof
          git rev-parse HEAD | tee proof/transport-head.txt
          clang --version | tee proof/clang.txt
          gcc --version | tee proof/gcc.txt
          sha256sum src/buster/lib/compiler/frontend/c/c_parse.c src/buster/lib/compiler/frontend/c/c_gen.c src/buster/tests/compiler/frontend/c/c_test.c > proof/candidate-sources.sha256
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-frontend-build"
          git fetch --depth=1 origin d88c1e1d4e39fb08525d4d96ef8f1e547cc1a011
      - name: Preserve baseline production self-host fixed point
        run: |
          set -o pipefail
          git checkout d88c1e1d4e39fb08525d4d96ef8f1e547cc1a011 -- src/buster/lib/compiler/frontend/c/c_parse.c src/buster/lib/compiler/frontend/c/c_gen.c
          "$RUNNER_TEMP/buster-frontend-build" generate --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/buster-frontend-build" test_self_host --config Release 2>&1 | tee proof/baseline-self-host.log
      - name: Require new regressions to fail on baseline
        run: |
          set -o pipefail
          "$RUNNER_TEMP/buster-frontend-build" build --config Release -t ide
          set +e
          build/Release/ide test --module=c_frontend_tests --verbose=1 --ci=1 > proof/baseline-frontend.log 2>&1
          baseline_status=$?
          set -e
          cat proof/baseline-frontend.log
          test "$baseline_status" -eq 1
          grep -F 'c_test_for_declaration_constraints' proof/baseline-frontend.log
          grep -F 'c_test_member_array_declarators' proof/baseline-frontend.log
          grep -F 'c_test_promoted_union_initializer_overrides' proof/baseline-frontend.log
          grep -F 'Unit tests' proof/baseline-frontend.log
      - name: Restore source-identical candidate and run frontend regressions
        run: |
          set -o pipefail
          git checkout HEAD -- src/buster/lib/compiler/frontend/c/c_parse.c src/buster/lib/compiler/frontend/c/c_gen.c
          sha256sum --check proof/candidate-sources.sha256
          "$RUNNER_TEMP/buster-frontend-build" build --config Release -t ide
          build/Release/ide test --module=c_frontend_tests --verbose=1 --ci=1 2>&1 | tee proof/candidate-frontend.log
          "$RUNNER_TEMP/buster-frontend-build" test_self_host --config Release 2>&1 | tee proof/candidate-self-host.log
      - name: Independent reference contracts
        run: |
          set -o pipefail
          cat > proof/loop-aggregate.c <<'SOURCE'
          int main(void) {
              int total = 0;
              for (struct { int x; int y; } s = {0, 3}; s.x < 2; s.x++) total += s.y;
              for (union { int x; int y; } u = {0}; u.x < 2; u.x++) total += u.x;
              return total != 7;
          }
          SOURCE
          cat > proof/loop-restricted.c <<'SOURCE'
          int main(void) {
              for (static int x = 0; x < 1; ) return x;
              return 0;
          }
          SOURCE
          cat > proof/initializer-overrides.c <<'SOURCE'
          int a, b, c, d;
          int *p[2] = {[1]=&a,[0]=&b,&c};
          int *z[2] = {[1]=&a,[0]=&b,0};
          struct Pair {int *x,*y;};
          struct Pair s = {.y=&a,.x=&b,&c};
          int *n[2][2] = {[1]={&a,&b},[0]={&c,&d},0};
          struct Whole {int h;struct Pair i;};
          struct Whole w = {.i={&a,&b},.h=0,{0}};
          int main(void) {
              return p[0]!=&b || p[1]!=&c || z[0]!=&b || z[1]!=0 ||
                     s.x!=&b || s.y!=&c || n[0][0]!=&c || n[0][1]!=&d ||
                     n[1][0]!=0 || n[1][1]!=&b || w.i.x!=0 || w.i.y!=0;
          }
          SOURCE
          cat > proof/member-array.c <<'SOURCE'
          int main(void) {
              int c = 7;
              struct T { char c[8]; };
              struct T t = {{0}};
              union { char c[8]; unsigned wc[2]; } tmp = {0};
              t.c[3] = (char)c;
              tmp.c[1] = t.c[3];
              return tmp.c[1] != 7;
          }
          SOURCE
          cat > proof/union-overrides.c <<'SOURCE'
          int a, b, c;
          struct O {
              union {
                  struct { int x, y; } pair;
                  struct { int x; short y; } other;
              };
          };
          struct O switched = {.pair = {7, 9}, .other.x = 3};
          struct O preserved = {.pair.x = 7, .pair.y = 9};
          struct P {
              union {
                  struct { int *p, *q; } pair;
                  struct { int *p, *q; } other;
              };
          };
          struct P pointers = {.pair = {&a, &b}, .other.p = &c};
          struct P kept = {.pair.p = &a, .pair.q = &b};
          int main(void) {
              return switched.other.x != 3 || switched.other.y != 0 ||
                     preserved.pair.x != 7 || preserved.pair.y != 9 ||
                     pointers.other.p != &c || pointers.other.q != 0 ||
                     kept.pair.p != &a || kept.pair.q != &b;
          }
          SOURCE
          cat > proof/registered-member-cases.c <<'SOURCE'
          int member_tag(void) { int c = 7; struct T { char c[8]; }; return c || member_qualified_bound() != 4; }
          int member_object(void) { int c = 4; struct T { char c[3]; } t = {{1, 2, 3}}; return c + t.c[1]; }
          int member_union(void) { unsigned c = 5; union { char c[8]; unsigned wc[2]; } t = {{1, 2, 3}}; return c + t.c[2]; }
          int c = 9; int member_file_name(void) { struct T { char c[8]; }; return c; }
          int member_pointer(void) { int value = 3; int *c = &value; struct T { char c[2]; } t = {{4, 5}}; return *c + t.c[1]; }
          int member_shadow(void) { int c = 2; { int c = 6; struct T { char c[8]; }; if (c != 6) return 1; } return c; }
          int member_nested(void) { int c = 4; struct Outer { struct { union { char c[3]; int other; } u; } inner; } t = {{{{1, 2, 3}}}}; return c + t.inner.u.c[2]; }
          #define MEMBER_ARRAY(name) char name[4]
          int member_macro(void) { int c = 5; struct T { MEMBER_ARRAY(c); } t = {{1, 2, 3, 4}}; return c + t.c[3]; }
          #undef MEMBER_ARRAY
          int member_multidimensional(void) { int c = 2; struct T { char c[2][3]; } t = {{{1, 2, 3}, {4, 5, 6}}}; return c + t.c[1][2]; }
          static int member_add_one(int x) { return x + 1; }
          int member_derived(void) { int c = 4; struct T { int (*c[2])(int); } t = {{member_add_one, member_add_one}}; return t.c[1](c); }
          int member_typedef(void) { typedef char C[3]; int c = 5; struct T { C c; } t = {{1, 2, 3}}; return c + t.c[1]; }
          int member_conditional(void) { int c = 2; struct T { char c[1 ? 3 : 2]; } t = {{1, 2, 3}}; return c + t.c[2]; }
          int member_incomplete(void) { int c = 8; struct T { int n; char c[]; }; return c; }
          int member_qualified_sizeof(void) { int c = 2; return c + sizeof(const struct { char c[8]; }); }
          int member_qualified_union(void) { int c = 3; return c + sizeof(const volatile union { char c[5]; char other[2]; }); }
          int member_scalar(void) { int c = 4; struct T { char c; } t = {3}; return c + t.c; }
          int member_qualified_bound(void) { int c[2] = {1, 2}; return sizeof(const struct { char a[sizeof(c[0])]; }); }
          int main(void) { return member_tag() != 7 || member_object() != 6 || member_union() != 8 || member_file_name() != 9 || member_pointer() != 8 || member_shadow() != 2 || member_nested() != 7 || member_macro() != 9 || member_multidimensional() != 8 || member_derived() != 5 || member_typedef() != 7 || member_conditional() != 5 || member_incomplete() != 8 || member_qualified_sizeof() != 10 || member_qualified_union() != 8 || member_scalar() != 7; }
          SOURCE
          cat > proof/registered-union-cases.c <<'SOURCE'
          int a, b, c;
          struct UnionNumbers { union { struct { int x, y; } pair; struct { int x; short y; } other; }; };
          struct UnionPointers { union { struct { int *p, *q; } pair; struct { int *p; int q; } other; }; };
          struct NestedNumbers { struct { union { struct { int x, y; } pair; struct { int x; short y; } other; }; }; };
          union NamedNumbers { struct { int x, y; } pair; struct { int x; short y; } other; };
          union DistinctNumbers { struct UnionNumbers promoted; union NamedNumbers named; };
          union PromotedNumbers { struct { int x,y; }; struct { int z; short w; } other; };
          struct UnionNumbers numbers_switch = {.pair = {7, 9}, .other.x = 3};
          struct UnionPointers pointers_switch = {.pair = {&a, &b}, .other.p = &c};
          struct UnionNumbers numbers_preserve = {.pair.x = 7, .pair.y = 9};
          struct UnionPointers pointers_preserve = {.pair.p = &a, .pair.q = &b};
          struct NestedNumbers nested_switch = {.pair = {7, 9}, .other.x = 3};
          union NamedNumbers named_switch = {.pair = {7, 9}, .other.x = 3};
          struct UnionNumbers regions_preserve[2] = {[0].pair = {7, 9}, [1].pair.x = 3, [1].pair.y = 5};
          union DistinctNumbers distinct_switch = {.promoted.pair = {7, 9}, .named.pair.x = 3};
          union PromotedNumbers anonymous_member_preserve = {.x = 7, .y = 9};
          union PromotedNumbers anonymous_member_switch = {.x = 7, .y = 9, .other.z = 3};
          int main(void) { return !(numbers_switch.other.x == 3 && numbers_switch.other.y == 0) || !(pointers_switch.other.p == &c && pointers_switch.other.q == 0) || !(numbers_preserve.pair.x == 7 && numbers_preserve.pair.y == 9) || !(pointers_preserve.pair.p == &a && pointers_preserve.pair.q == &b) || !(nested_switch.other.x == 3 && nested_switch.other.y == 0) || !(named_switch.other.x == 3 && named_switch.other.y == 0) || !(regions_preserve[0].pair.x == 7 && regions_preserve[0].pair.y == 9 && regions_preserve[1].pair.x == 3 && regions_preserve[1].pair.y == 5) || !(distinct_switch.named.pair.x == 3 && distinct_switch.named.pair.y == 0) || !(anonymous_member_preserve.x == 7 && anonymous_member_preserve.y == 9) || !(anonymous_member_switch.other.z == 3 && anonymous_member_switch.other.w == 0); }
          SOURCE
          cat > proof/member-refusal-0.c <<'SOURCE'
          int f(void) { int c = 0; return c[8]; }
          SOURCE
          cat > proof/member-refusal-1.c <<'SOURCE'
          int f(void) { int c = 0; struct T { char a[c[0]]; }; return 0; }
          SOURCE
          cat > proof/member-refusal-2.c <<'SOURCE'
          int f(void) { int c = 0; struct T { char a[sizeof(c[0])]; }; return 0; }
          SOURCE
          cat > proof/member-refusal-3.c <<'SOURCE'
          int f(void) { struct T { int c; } t = {0}; return t.c[0]; }
          SOURCE
          cat > proof/member-refusal-4.c <<'SOURCE'
          int f(void) { struct S { int c; } s = {0}; struct T { char a[sizeof(s.c[0])]; }; return 0; }
          SOURCE
          cat > proof/member-refusal-5.c <<'SOURCE'
          int f(void) { int c = 0; return sizeof(const struct { char a[sizeof(c[0])]; }); }
          SOURCE
          cat > proof/member-refusal-6.c <<'SOURCE'
          int f(void) { int c = 0; int a[sizeof(c[0])]; return 0; }
          SOURCE
          for cc in clang gcc; do
              for std in c17 c23; do
                  "$cc" -std="$std" -pedantic-errors proof/loop-aggregate.c -o proof/reference-loop
                  proof/reference-loop
                  "$cc" -std="$std" proof/initializer-overrides.c -o proof/reference-initializers
                  proof/reference-initializers
                  "$cc" -std="$std" -pedantic-errors proof/member-array.c -o proof/reference-member-array
                  proof/reference-member-array
                  "$cc" -std="$std" -pedantic-errors proof/union-overrides.c -o proof/reference-union
                  proof/reference-union
                  "$cc" -std="$std" -pedantic-errors proof/registered-member-cases.c -o proof/reference-member-cases
                  proof/reference-member-cases
                  "$cc" -std="$std" -pedantic-errors proof/registered-union-cases.c -o proof/reference-union-cases
                  proof/reference-union-cases
                  for refused in proof/member-refusal-*.c; do
                      if "$cc" -std="$std" -pedantic-errors -fsyntax-only "$refused" >> proof/"$cc"-member-refusals.log 2>&1; then
                          echo "Expected independent refusal for $refused"
                          exit 1
                      fi
                  done
              done
              if "$cc" -std=c17 -pedantic-errors -fsyntax-only proof/loop-restricted.c > proof/"$cc"-c17-refusal.txt 2>&1; then
                  echo 'Expected the independent strict C17 reference to refuse static storage in the for declaration.'
                  exit 1
              fi
              "$cc" -std=c23 -pedantic-errors proof/loop-restricted.c -o proof/reference-c23
              proof/reference-c23
          done
          for mode in none mir-stack fast quality; do
              for form in -ffrontend-ssa -fno-frontend-ssa; do
                  for source in loop-aggregate initializer-overrides member-array union-overrides; do
                      build/Release/ide cc -std=c23 -g0 -fverify-codegen -fregister-allocator="$mode" "$form" proof/"$source".c -o proof/buster-witness
                      proof/buster-witness
                  done
              done
          done
      - name: Observe pristine musl iconv unit
        run: |
          set -o pipefail
          musl_root="$RUNNER_TEMP/musl-1416"
          musl_headers="$RUNNER_TEMP/musl-1416-headers"
          if ! git clone --depth=1 --branch=v1.2.6 https://github.com/ifduyue/musl.git "$musl_root" > proof/musl-fetch.log 2>&1; then
              echo 'external source unavailable' | tee proof/musl-status.txt
              exit 0
          fi
          test "$(git -C "$musl_root" rev-parse HEAD)" = 9fa28ece75d8a2191de7c5bb53bed224c5947417
          test "$(git -C "$musl_root" describe --tags --exact-match HEAD)" = v1.2.6
          git -C "$musl_root" status --porcelain --untracked-files=all > proof/musl-pristine.txt
          test ! -s proof/musl-pristine.txt
          git -C "$musl_root" rev-parse HEAD | tee proof/musl-pin.txt
          cp "$musl_root/COPYRIGHT" proof/musl-COPYRIGHT.txt
          sha256sum "$musl_root/src/locale/iconv.c" "$musl_root/COPYRIGHT" > proof/musl-inputs.sha256
          mkdir -p "$musl_headers/include/bits" "$musl_headers/src/internal"
          sed -f "$musl_root/tools/mkalltypes.sed" "$musl_root/arch/x86_64/bits/alltypes.h.in" "$musl_root/include/alltypes.h.in" > "$musl_headers/include/bits/alltypes.h"
          cat "$musl_root/arch/x86_64/bits/syscall.h.in" > "$musl_headers/include/bits/syscall.h"
          sed -n -e 's/__NR_/SYS_/p' "$musl_root/arch/x86_64/bits/syscall.h.in" >> "$musl_headers/include/bits/syscall.h"
          printf '#define VERSION "1.2.6"\n' > "$musl_headers/src/internal/version.h"
          musl_flags=(-std=c99 -nostdinc -fno-builtin -fno-strict-aliasing -fno-stack-protector -D_XOPEN_SOURCE=700 -O2 -g0
                      "-I$musl_root/arch/x86_64" "-I$musl_root/arch/generic" "-I$musl_headers/src/internal"
                      "-I$musl_root/src/include" "-I$musl_root/src/internal" "-I$musl_headers/include" "-I$musl_root/include")
          if ! clang "${musl_flags[@]}" -c "$musl_root/src/locale/iconv.c" -o proof/iconv-clang.o > proof/iconv-clang.log 2>&1; then
              echo 'reference unit compile failed' | tee proof/musl-status.txt
              exit 0
          fi
          failures=0
          for mode in none mir-stack fast quality; do
              for form in -ffrontend-ssa -fno-frontend-ssa; do
                  if build/Release/ide cc "${musl_flags[@]}" -fverify-codegen -fregister-allocator="$mode" "$form" -c "$musl_root/src/locale/iconv.c" -o proof/iconv-buster.o > proof/iconv-"$mode"-"$form".log 2>&1; then
                      echo "$mode $form pass" >> proof/musl-status.txt
                  else
                      echo "$mode $form failed" >> proof/musl-status.txt
                      failures=$((failures + 1))
                  fi
              done
          done
          echo "candidate iconv failed profiles=$failures" | tee -a proof/musl-status.txt
          git -C "$musl_root" status --porcelain --untracked-files=all > proof/musl-pristine-after.txt
          test ! -s proof/musl-pristine-after.txt
      - name: Retain proof evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: derived-tag-proof-${{ github.sha }}
          path: proof/
          retention-days: 14
          if-no-files-found: error
