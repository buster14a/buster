name: Native retirement contract

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/native-retirement-contract.yml
      - .github/workflows/native-retirement-integration-security.yml
      - .github/workflows/native-retirement-integration.yml
      - .github/workflows/native-retirement-rebind.yml
      # Android status tests reuse frozen mobile support inputs. Keep their
      # contract validation scheduled even when tests/** itself is unchanged.
      - .github/workflows/ci.yml
      - .github/workflows/ios-monitor-tests.yml
      - android/**
      - .github/workflows/native-retirement-evidence.yml
      - AGENTS.md
      - build.c
      - docs/agents/build.md
      - docs/agents/benchmarking.md
      - docs/agents/workflow.md
      - docs/native-retirement-census.md
      - docs/native-retirement-performance-contract.md
      - docs/native-retirement-support-v1.tsv
      - docs/native-retirement-supported-gaps-v1.tsv
      - docs/native-retirement-applicability-v1.tsv
      - docs/native-retirement-dependencies-v1.json
      - docs/native-retirement-rebinding.md
      - tools/differential.c
      - tools/native_retirement_census.c
      - tools/native_retirement_contract.py
      - tools/native_retirement_contract_test.py
      - tools/native_retirement_archive.py
      - tools/native_retirement_evidence_upload_test.py
      - tools/native_retirement_materializer.py
      - tools/native_retirement_materializer_test.py
      - tools/native_retirement_external.py
      - tools/native_retirement_sdks.py
      - tools/native_retirement_sdks_test.py
      - tools/native_retirement_reference.py
      - tools/native_retirement_integration.py
      - tools/native_retirement_integration_security_test.py
      - tools/native_retirement_integration_test.py
      - tools/native-retirement-mingw/**
      - docs/native-retirement-sdks-v1.json
      - tools/native_retirement_external_test.py
      - tools/native_retirement_result_input.py
      - tools/native_retirement_result_input_test.py
      - tools/native_retirement_performance_binding.py
      - tools/native_retirement_performance_schema.py
      - tools/native_retirement_performance_eligibility_test.py
      - tools/native_retirement_performance_binding_test.py
      - tools/native_retirement_performance_identity_test.py
      - tools/throughput/**
      - src/buster/lib/arena.c
      - src/buster/lib/arena.h
      - src/buster/lib/base.h
      - src/buster/lib/file.c
      - src/buster/lib/file.h
      - src/buster/lib/hash.c
      - src/buster/lib/hash.h
      - src/buster/lib/integer.c
      - src/buster/lib/integer.h
      - src/buster/lib/os.c
      - src/buster/lib/os.h
      - src/buster/lib/os_internal.h
      - src/buster/lib/string.c
      - src/buster/lib/string.h
      - src/buster/lib/system_headers.h
      - src/buster/lib/time.c
      - src/buster/lib/time.h
      - tests/**
  workflow_dispatch:

concurrency:
  group: native-retirement-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Frozen support and environment contract
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: candidate
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the previously trusted rebinder revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Reject candidate-controlled checkout destinations
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for relative in external .native-retirement-trusted; do
            path="$GITHUB_WORKSPACE/candidate/$relative"
            if [[ -e "$path" || -L "$path" ]]; then
              echo "error: candidate controls reserved materialization root '$relative'" >&2
              exit 1
            fi
          done
          if [[ -f "$GITHUB_WORKSPACE/trusted/tools/native_retirement_integration.py" ]]; then
            python3 - "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/trusted/tools/native_retirement_integration.py" <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          candidate = Path(sys.argv[1])
          tool = Path(sys.argv[2])
          spec = importlib.util.spec_from_file_location("trusted_native_retirement_integration", tool)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          module.reject_reserved_materialization_roots(candidate)
          PY
          fi
      - name: Check out pinned cJSON closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DaveGamble/cJSON
          ref: c859b25da02955fef659d658b8f324b5cde87be3
          path: candidate/external/cjson
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned DoomGeneric closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ozkl/doomgeneric
          ref: dcb7a8dbc7a16ce3dda29382ac9aae9d77d21284
          path: candidate/external/doom
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned LZ4 closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lz4/lz4
          ref: ebb370ca83af193212df4dcbadcc5d87bc0de2f0
          path: candidate/external/lz4
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned yyjson closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ibireme/yyjson
          ref: 8b4a38dc994a110abaec8a400615567bd996105f
          path: candidate/external/yyjson
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned stb closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nothings/stb
          ref: 2c980bb59875b0d32144a71867fbdebb2f77cd20
          path: candidate/external/stb
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned zlib closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: madler/zlib
          ref: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          path: candidate/external/zlib
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned musl closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ifduyue/musl
          ref: 9fa28ece75d8a2191de7c5bb53bed224c5947417
          path: candidate/external/musl
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize pinned target SDK headers with trusted code
        run: python3 "$GITHUB_WORKSPACE/trusted/tools/native_retirement_sdks.py" --source-root "$(pwd)"
      - name: Prepare the pinned external closure
        run: >-
          python3 "$GITHUB_WORKSPACE/trusted/tools/native_retirement_external.py" prepare
          --manifest docs/native-retirement-dependencies-v1.json
          --source-root "$(pwd)"
      # Never regress to `.native-retirement-trusted/tools/native_retirement_rebind.py refresh`:
      # that former path lived under the untrusted candidate checkout. The executable
      # command below uses the separately checked-out sibling trusted revision.
      - name: Reconstruct exact candidate binding ephemerally
        run: |
          mkdir -p evidence/native-retirement-rebind
          python3 "$GITHUB_WORKSPACE/trusted/tools/native_retirement_rebind.py" refresh \
            --repo-root "$(pwd)" \
            | tee evidence/native-retirement-rebind/refresh.json
          python3 "$GITHUB_WORKSPACE/trusted/tools/native_retirement_rebind.py" check \
            --repo-root "$(pwd)" \
            | tee evidence/native-retirement-rebind/check.json
          python3 tools/native_retirement_rebind.py check --repo-root "$(pwd)" \
            | tee evidence/native-retirement-rebind/candidate-check.json
      - name: Build and validate the manifest producer
        run: |
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/retirement-build"
          "$RUNNER_TEMP/retirement-build" native_retirement_census --self-test
          python3 tools/native_retirement_contract.py self-test
          python3 tools/native_retirement_contract_test.py -v
          python3 tools/native_retirement_evidence_upload_test.py -v
          python3 tools/native_retirement_materializer.py self-test
          python3 tools/native_retirement_materializer_test.py -v
          python3 tools/native_retirement_external.py self-test
          python3 tools/native_retirement_external_test.py -v
          python3 tools/native_retirement_sdks_test.py -v
          mkdir -p evidence
          "$RUNNER_TEMP/retirement-build" native_retirement_census --manifest-only --out evidence/contract
      - name: Validate streamed result input under strict resource warnings
        run: python3 -W error::ResourceWarning tools/native_retirement_result_input_test.py -v
      - name: Validate checked-in support identity and partition capacity
        run: python3 -W error::ResourceWarning tools/native_retirement_performance_identity_test.py -v
      - name: 'Build and self-test the #619 retirement adapter'
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror -fwrapv \
            -fno-strict-aliasing -funsigned-char -Isrc -DBUSTER_SINGLE_THREADED=1 \
            tools/throughput/throughput.c tools/throughput/shared.c -lm \
            -o "$RUNNER_TEMP/bench-throughput-retirement"
          "$RUNNER_TEMP/bench-throughput-retirement" self-test
      - name: Validate immutable performance binding schema
        run: |
          python3 -W error::ResourceWarning tools/native_retirement_performance_binding_test.py -v
          python3 -W error::ResourceWarning tools/native_retirement_performance_eligibility_test.py -v
      - name: Prove unreviewed input drift fails closed
        run: |
          printf '\n' >> tests/basic_c_operations.c
          if "$RUNNER_TEMP/retirement-build" native_retirement_census --manifest-only --out evidence/drift; then
            echo 'error: changed input was admitted without a contract update' >&2
            exit 1
          fi
          test -f evidence/drift/summary.txt
          grep -Fx 'io_failed=1' evidence/drift/summary.txt
          git restore -- tests/basic_c_operations.c
      - name: Exercise frozen resource and replacement environment
        run: |
          python3 tools/native_retirement_materializer.py materialize \
            --manifest docs/native-retirement-dependencies-v1.json \
            --source-root "$(pwd)" \
            --output "$(pwd)/evidence/dependency-materialized"
          resource_include="$(clang -print-resource-dir)/include"
          if "$RUNNER_TEMP/retirement-build" native_retirement_census \
            --ide /bin/false \
            --compiler-revision "${{ github.event.pull_request.head.sha || github.sha }}" \
            --baseline-ide /bin/false \
            --baseline-revision "${{ github.event.pull_request.head.sha || github.sha }}" \
            --fixture basic_c_operations.c \
            --target x86_64-unknown-linux-gnu \
            --resource-include "$resource_include" \
            --project-include "$(pwd)/evidence/dependency-materialized/dependencies/project-include" \
            --dependency-manifest "$(pwd)/docs/native-retirement-dependencies-v1.json" \
            --dependency-receipt "$(pwd)/evidence/dependency-materialized/dependency-manifest.json" \
            --out evidence/resource-smoke; then
            echo 'error: the deliberately failing compiler was accepted' >&2
            exit 1
          fi
          test -s evidence/resource-smoke/dependencies.tsv
          test -s evidence/resource-smoke/environment.tsv
          grep -Fx 'unfrozen_dependencies=none-for-object-census' evidence/resource-smoke/manifest.txt
          grep -q -F $'resource-header\t' evidence/resource-smoke/dependencies.tsv
          python3 tools/native_retirement_contract.py validate evidence/resource-smoke
      - name: Retain exact binding sources for diagnostic replay
        if: ${{ !cancelled() }}
        run: |
          mkdir -p evidence/binding-source/tools evidence/binding-source/docs
          git rev-parse HEAD 'HEAD^{tree}' > evidence/binding-source/revision.txt
          cp tools/native_retirement_performance_schema.py tools/native_retirement_performance_eligibility_test.py tools/native_retirement_performance_binding.py tools/native_retirement_performance_binding_test.py tools/native_retirement_performance_identity_test.py tools/native_retirement_result_input.py tools/native_retirement_result_input_test.py tools/native_retirement_contract.py evidence/binding-source/tools/
          cp docs/native-retirement-support-v1.tsv docs/native-retirement-performance-contract.md evidence/binding-source/docs/
      - name: Retain seven-day contract diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-retirement-contract-${{ github.run_id }}
          path: candidate/evidence/
          retention-days: 7
          if-no-files-found: error
      - name: State durable evidence boundary
        if: ${{ !cancelled() }}
        run: |
          echo 'The seven-day workflow artifact is diagnostic only.'
          echo 'Final acceptance evidence must be published, downloaded, and independently replayed through #510.'
