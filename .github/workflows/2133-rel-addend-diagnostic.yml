name: Temporary AArch64 REL addend reference diagnostic

on:
  push:
    branches:
      - codex/2133-aarch64-rel-addends
    paths:
      - .github/workflows/2133-rel-addend-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      BUSTER_CI_LLVM_VERSION: 23.1.2
    steps:
      - name: Checkout exact candidate event
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record and verify candidate source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/relocation-2133"
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/relocation-2133/source.txt"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/relocation-2133/worktree-before.txt"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          expected = {
              "src/buster/lib/compiler/object/object.c": "406723fb7cb7bf28f8015dd392237412bc4ca327",
              "src/buster/tests/compiler/object/object_test.c": "57c3b54c82f728b55f374a6b54d5be8d6d98f180",
              "src/buster/tests/compiler/link/link_test.c": "5d6710c90577176b647c17f8d8860856795b53a5",
              "docs/agents/frontend/linkage.md": "d320ea849bfeb2b909a240c75d327fb9bff19f5e",
          }
          actual = {path: subprocess.check_output(["git", "hash-object", path], text=True).strip()
                    for path in expected}
          root = Path(os.environ["RUNNER_TEMP"]) / "relocation-2133"
          (root / "source-blobs.json").write_text(json.dumps(actual, indent=2) + "\n")
          if actual != expected:
              raise SystemExit("diagnostic source differs from frozen reviewed candidate")
          (root / "contracts.json").write_text(json.dumps({
              "Buster": {"first_party_license": "UNSELECTED", "source": "LICENSES/README.md in candidate"},
              "AAELF64": {"revision": "a5e86d3fec7342719f3bd1f939ec1b8ac6438c4f",
                           "license": "CC-BY-SA-4.0 AND Apache-Patent-License",
                           "sections": ["5.7.2", "5.7.3.2", "5.7.6"]},
              "LLVM": {"release": "23.1.2", "source_revision": "85ac560262434c9ccfc0c183ec22d4138ed647fb",
                       "license": "Apache-2.0 WITH LLVM-exception", "source": "llvm/LICENSE.TXT"},
              "upstream_implementation_imported": False,
              "measurement_kind": "hosted correctness diagnostic; no qualified performance claim"
          }, indent=2) + "\n")
          PY

      - name: Install pinned reference tools
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/ci_llvm.py --target x86_64-linux --work-directory "$RUNNER_TEMP/llvm" \
            --github-path "$GITHUB_PATH" --github-env "$GITHUB_ENV" \
            2>&1 | tee "$RUNNER_TEMP/relocation-2133/llvm-install.log"

      - name: Build existing compiler through hosted bootstrap
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/relocation-2133/build.log") 2>&1
          driver="$RUNNER_TEMP/relocation-2133/buster-build"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable \
            -fwrapv -fno-strict-aliasing -funsigned-char -g build.c -o "$driver"
          "$driver" generate --cc clang --config Release --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
          "$driver" build --config Release -t ide

      - name: Check registered contracts and reference linked images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/relocation-2133/diagnostic.log"
          #!/usr/bin/env python3
          """Hosted-only diagnostic; original fixtures and independent ELF arithmetic."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import struct
          import subprocess
          
          ROOT = Path(os.environ["RUNNER_TEMP"]) / "relocation-2133"
          ROOT.mkdir(parents=True, exist_ok=True)
          RECORDS = []
          GOLDENS = [(0, 0), (1, 1), (2047, 2047), (2048, -2048), (4095, -1)]
          
          
          def require(condition, message):
              if not condition:
                  raise AssertionError(message)
          
          
          def run(label, arguments, timeout=120):
              stdout_path = ROOT / (label + ".stdout")
              stderr_path = ROOT / (label + ".stderr")
              with stdout_path.open("wb") as stdout, stderr_path.open("wb") as stderr:
                  try:
                      completed = subprocess.run(arguments, stdout=stdout, stderr=stderr, timeout=timeout)
                      exit_code = completed.returncode
                      timed_out = False
                  except subprocess.TimeoutExpired:
                      exit_code = None
                      timed_out = True
              record = {"label": label, "arguments": [str(x) for x in arguments],
                        "exit_code": exit_code, "timed_out": timed_out, "timeout_seconds": timeout}
              RECORDS.append(record)
              (ROOT / "commands.json").write_text(json.dumps(RECORDS, indent=2) + "\n")
              print("REL2133_COMMAND " + json.dumps(record), flush=True)
              require(not timed_out, label + " timed out")
              return exit_code
          
          
          def checked_run(label, arguments, timeout=120):
              require(run(label, arguments, timeout) == 0, label + " failed")
          
          
          class Elf:
              def __init__(self, path):
                  self.path = Path(path)
                  self.bytes = self.path.read_bytes()
                  require(self.bytes[:6] == b"\x7fELF\x02\x01", "not ELF64 little endian")
                  require(self.number("<H", 18) == 183, "not AArch64")
                  self.section_offset = self.number("<Q", 40)
                  self.section_size = self.number("<H", 58)
                  count = self.number("<H", 60)
                  strings = self.number("<H", 62)
                  require(self.section_size == 64 and 0 < count < 0xff00 and strings < count,
                          "unsupported diagnostic ELF section numbering")
                  self.sections = []
                  for index in range(count):
                      header = self.section_offset + index * self.section_size
                      self.slice(header, 64)
                      section = {"index": index, "header": header, "name_offset": self.number("<I", header),
                                 "type": self.number("<I", header + 4), "flags": self.number("<Q", header + 8),
                                 "address": self.number("<Q", header + 16), "offset": self.number("<Q", header + 24),
                                 "size": self.number("<Q", header + 32), "link": self.number("<I", header + 40),
                                 "info": self.number("<I", header + 44), "entry_size": self.number("<Q", header + 56)}
                      if section["type"] != 8:
                          self.slice(section["offset"], section["size"])
                      self.sections.append(section)
                  string_section = self.sections[strings]
                  names = self.slice(string_section["offset"], string_section["size"])
                  for section in self.sections:
                      section["name"] = self.string(names, section["name_offset"])
                  self.symbols = []
                  for section in self.sections:
                      if section["type"] in (2, 11):
                          require(section["entry_size"] == 24 and section["size"] % 24 == 0,
                                  "unsupported diagnostic ELF symbols")
                          require(section["link"] < count, "invalid symbol string table")
                          strings = self.sections[section["link"]]
                          names = self.slice(strings["offset"], strings["size"])
                          for offset in range(section["offset"], section["offset"] + section["size"], 24):
                              self.symbols.append({"name": self.string(names, self.number("<I", offset)),
                                                   "information": self.number("<B", offset + 4),
                                                   "section": self.number("<H", offset + 6),
                                                   "value": self.number("<Q", offset + 8),
                                                   "size": self.number("<Q", offset + 16)})
          
              def slice(self, offset, count):
                  require(0 <= offset <= len(self.bytes) and 0 <= count <= len(self.bytes) - offset,
                          "ELF file span outside bytes")
                  return self.bytes[offset:offset + count]
          
              def number(self, form, offset):
                  return struct.unpack(form, self.slice(offset, struct.calcsize(form)))[0]
          
              @staticmethod
              def string(data, offset):
                  require(0 <= offset < len(data), "ELF string outside bytes")
                  end = data.find(b"\0", offset)
                  require(end >= offset, "unterminated ELF string")
                  return data[offset:end].decode("ascii")
          
              def section(self, name):
                  matches = [x for x in self.sections if x["name"] == name]
                  require(len(matches) == 1, "missing or duplicate ELF section " + name)
                  return matches[0]
          
              def symbol(self, name):
                  matches = [x for x in self.symbols if x["name"] == name and x["section"] != 0]
                  require(matches, "missing defined ELF symbol " + name)
                  require(all(x["value"] == matches[0]["value"] for x in matches), "ambiguous ELF symbol " + name)
                  return matches[0]
          
              def address_bytes(self, address, count):
                  matches = [x for x in self.sections if x["flags"] & 2 and x["type"] != 8 and
                             x["address"] <= address and count <= x["size"] and
                             address - x["address"] <= x["size"] - count]
                  require(len(matches) == 1, "ELF virtual address does not map uniquely")
                  section = matches[0]
                  return self.slice(section["offset"] + address - section["address"], count)
          
          
          def adrp(word, addend):
              raw = addend & 0x1fffff
              return (word & ~((3 << 29) | (0x7ffff << 5))) | ((raw & 3) << 29) | ((raw >> 2) << 5)
          
          
          def mutate(pristine, output, form, encoded=None, got_site=None, got_addend=0, weak=False):
              elf = Elf(pristine)
              section = elf.section(".rela.text")
              text = elf.section(".text")
              require(section["type"] == 4 and section["entry_size"] == 24 and section["size"] == 48,
                      "fixture needs exactly two independently produced RELA relocations")
              require(section["info"] == text["index"], "fixture relocation target section mismatch")
              data = bytearray(elf.bytes)
              entries = []
              for index in range(2):
                  offset = section["offset"] + index * 24
                  place, information, explicit = struct.unpack("<QQq", elf.slice(offset, 24))
                  kind = information & 0xffffffff
                  require(place == index * 4, "unexpected fixture relocation site")
                  require(explicit == 0, "pristine fixture addend is not zero")
                  word_offset = text["offset"] + place
                  word = struct.unpack_from("<I", data, word_offset)[0]
                  if encoded is not None:
                      require(kind == (275 if index == 0 else 277), "unexpected direct relocation kind")
                      if kind == 275:
                          signed = next(golden for raw, golden in GOLDENS if raw == encoded)
                          word = adrp(word, 0 if weak else signed)
                      else:
                          word = (word & ~(0xfff << 10)) | (encoded << 10)
                  else:
                      require(kind == (311 if index == 0 else 312), "unexpected GOT relocation kind")
                      if form == "REL" and kind == got_site:
                          word = adrp(word, got_addend) if kind == 311 else (
                              (word & ~(0xfff << 10)) | (got_addend << 10))
                      elif form == "RELA" and kind == got_site:
                          explicit = got_addend
                  struct.pack_into("<I", data, word_offset, word)
                  entries.append((place, information, explicit))
              if form == "REL":
                  packed = b"".join(struct.pack("<QQ", place, information) for place, information, _ in entries)
                  data[section["offset"]:section["offset"] + len(packed)] = packed
                  struct.pack_into("<I", data, section["header"] + 4, 9)
                  struct.pack_into("<Q", data, section["header"] + 32, len(packed))
                  struct.pack_into("<Q", data, section["header"] + 56, 16)
              else:
                  require(form == "RELA", "unknown fixture relocation form")
                  for index, entry in enumerate(entries):
                      struct.pack_into("<QQq", data, section["offset"] + index * 24, *entry)
              Path(output).write_bytes(data)
              return output
          
          
          def decode_pair(path, form, addend=0):
              elf = Elf(path)
              main = elf.symbol("main")["value"]
              target = elf.symbol("target")["value"]
              page, low = struct.unpack("<II", elf.address_bytes(main, 8))
              require(page & ~((3 << 29) | (0x7ffff << 5)) == 0x90000008,
                      "relocated ADRP changed operation or register")
              page_raw = ((page >> 29) & 3) | (((page >> 5) & 0x7ffff) << 2)
              page_signed = page_raw if page_raw < 0x100000 else page_raw - 0x200000
              if form == "GOT":
                  require(low & ~(0xfff << 10) == 0xf9400108, "reference GOT load changed operation or registers")
                  address = (main & ~0xfff) + page_signed * 4096 + ((low >> 10) & 0xfff) * 8
                  slot = struct.unpack("<Q", elf.address_bytes(address, 8))[0]
                  require(slot == target, "reference GOT slot is not target S")
                  result = {"main": main, "target": target, "got_slot": address, "got_contents": slot}
              else:
                  require(low & ~(0xfff << 10) == 0x91000108, "relocated ADD changed operation or registers")
                  immediate = (low >> 10) & 0xfff
                  expected = target + addend
                  address = (main & ~0xfff) + page_signed * 4096 + immediate
                  require(immediate == expected & 0xfff and address == expected, "paired relocated address differs from independent S+A")
                  result = {"main": main, "target": target, "golden_addend": addend,
                            "low12": immediate, "effective_address": address}
              print("REL2133_IMAGE " + json.dumps({"path": str(path), "form": form, **result}), flush=True)
              return result
          
          
          def image_evidence(label, path):
              checked_run(label + "-readobj", ["llvm-readobj", "--file-headers", "--sections", "--symbols", "--relocations", str(path)])
              checked_run(label + "-objdump", ["llvm-objdump", "-d", "--syms", str(path)])
          
          
          def buster_link(label, input_path, output_path, success, error_kind="object"):
              if not success:
                  Path(output_path).write_bytes(b"REL2133_FAILED_LINK_SENTINEL\n")
              code = run(label, ["build/Release/ide", "cc", "-target", "aarch64-unknown-linux-gnu",
                                "--entry=main", str(input_path), "-o", str(output_path)])
              require((code == 0) == success, label + " unexpected link exit")
              if not success:
                  require(code == 1, label + " failed by signal or unexpected status")
                  diagnostic = (ROOT / (label + ".stdout")).read_text(errors="replace") + (ROOT / (label + ".stderr")).read_text(errors="replace")
                  if error_kind == "object":
                      require("could not read object " + str(input_path) in diagnostic and ": error 2" in diagnostic,
                              label + " did not report unsupported-target object refusal")
                  else:
                      require("native C link failed with relocation" in diagnostic,
                              label + " did not report checked relocation refusal")
                  require(Path(output_path).read_bytes() == b"REL2133_FAILED_LINK_SENTINEL\n",
                          label + " published a failed image over sentinel")
          
          
          DIRECT = """.text
          .globl main
          .type main,%function
          main:
              adrp x8, target
              add x8, x8, :lo12:target
              ret
          .size main, .-main
          .data
          .p2align 3
          .globl target
          .hidden target
          .type target,%object
          target:
              .quad 0x1122334455667788
          .size target, .-target
          """
          GOT = DIRECT.replace("adrp x8, target\n    add x8, x8, :lo12:target",
                               "adrp x8, :got:target\n    ldr x8, [x8, :got_lo12:target]")
          WEAK = """.text
          .globl main
          .type main,%function
          main:
              adrp x8, target
              add x8, x8, :lo12:target
              ret
          .size main, .-main
          .weak target
          .hidden target
          .type target,%object
          """
          
          for tool in ("clang", "ld.lld", "llvm-readobj", "llvm-objdump"):
              checked_run("version-" + tool.replace(".", "-"), [tool, "--version"])
          for name, contents in (("direct", DIRECT), ("got", GOT), ("weak", WEAK)):
              source = ROOT / (name + ".s")
              source.write_text(contents)
              checked_run("assemble-" + name, ["clang", "-target", "aarch64-unknown-linux-gnu",
                                               "-c", str(source), "-o", str(ROOT / (name + ".o"))])
              image_evidence("pristine-" + name, ROOT / (name + ".o"))
          
          checked_run("registered-object-link-tests", ["build/Release/ide", "test",
                                                     "--module=object_tests,link_tests", "--verbose=1", "--ci=1"], timeout=900)
          
          for raw, golden in GOLDENS:
              label = "direct-rel-" + str(raw)
              input_path = mutate(ROOT / "direct.o", ROOT / (label + ".o"), "REL", encoded=raw)
              image_evidence(label + "-input", input_path)
              reference = ROOT / (label + "-reference.elf")
              candidate = ROOT / (label + "-candidate.elf")
              code = run(label + "-reference-link", ["ld.lld", "-m", "aarch64elf", "--no-relax",
                                                    "-e", "main", str(input_path), "-o", str(reference)])
              if raw == 0:
                  print("REL2133_CAPABILITY " + json.dumps({"reference_rel_add": code == 0,
                                                          "reference_rel_got": "pending"}), flush=True)
              require(code == 0, "reference REL ADD capability unavailable or row failed")
              buster_link(label + "-candidate-link", input_path, candidate, True)
              reference_result = decode_pair(reference, "DIRECT", golden)
              candidate_result = decode_pair(candidate, "DIRECT", golden)
              require(reference_result["effective_address"] - reference_result["target"] ==
                      candidate_result["effective_address"] - candidate_result["target"] == golden,
                      "reference/candidate paired-addend semantics mismatch")
              image_evidence(label + "-reference", reference)
              image_evidence(label + "-candidate", candidate)
          
          for form in ("RELA", "REL"):
              label = "got-" + form.lower() + "-zero"
              input_path = mutate(ROOT / "got.o", ROOT / (label + ".o"), form)
              candidate = ROOT / (label + "-candidate.elf")
              reference = ROOT / (label + "-reference.elf")
              buster_link(label + "-candidate-link", input_path, candidate, True)
              decode_pair(candidate, "DIRECT", 0)
              code = run(label + "-reference-link", ["ld.lld", "-m", "aarch64elf", "--no-relax",
                                                    "-e", "main", str(input_path), "-o", str(reference)])
              if form == "RELA":
                  require(code == 0, "reference RELA GOT positive failed")
                  decode_pair(reference, "GOT")
                  image_evidence(label + "-reference", reference)
              elif code == 0:
                  decode_pair(reference, "GOT")
                  image_evidence(label + "-reference", reference)
                  print('REL2133_CAPABILITY {"reference_rel_got": true}', flush=True)
              else:
                  diagnostic = (ROOT / (label + "-reference-link.stdout")).read_text(errors="replace") + (ROOT / (label + "-reference-link.stderr")).read_text(errors="replace")
                  require(code == 1 and "cannot read addend for relocation" in diagnostic and
                          any(kind in diagnostic for kind in ("311", "312", "R_AARCH64_ADR_GOT_PAGE", "R_AARCH64_LD64_GOT_LO12_NC")),
                          "reference REL GOT failed for an unexpected reason")
                  print('REL2133_CAPABILITY {"reference_rel_got": false, "rel_got_differential": "UNRUN"}', flush=True)
              image_evidence(label + "-input", input_path)
              image_evidence(label + "-candidate", candidate)
          
          for kind in (311, 312):
              for addend in (-17, -1, 1, 8, 32760):
                  label = "got-rela-" + str(kind) + "-nonzero-" + str(addend)
                  input_path = mutate(ROOT / "got.o", ROOT / (label + ".o"), "RELA", got_site=kind, got_addend=addend)
                  buster_link(label + "-candidate-link", input_path, ROOT / (label + "-candidate.elf"), False)
                  # LLD's acceptance is recorded, never used to authorize nonzero GDAT.
                  run(label + "-reference-observation", ["ld.lld", "-m", "aarch64elf", "--no-relax",
                                                         "-e", "main", str(input_path), "-o", str(ROOT / (label + "-reference.elf"))])
                  image_evidence(label + "-input", input_path)
              for raw in ((1, -1) if kind == 311 else (1, 4095)):
                  label = "got-rel-" + str(kind) + "-nonzero-" + str(raw)
                  input_path = mutate(ROOT / "got.o", ROOT / (label + ".o"), "REL", got_site=kind, got_addend=raw)
                  buster_link(label + "-candidate-link", input_path, ROOT / (label + "-candidate.elf"), False)
                  image_evidence(label + "-input", input_path)
          
          label = "direct-rel-add-negative-underflow"
          input_path = mutate(ROOT / "weak.o", ROOT / (label + ".o"), "REL", encoded=4095, weak=True)
          buster_link(label + "-candidate-link", input_path, ROOT / (label + "-candidate.elf"), False, error_kind="relocation")
          run(label + "-reference-observation", ["ld.lld", "-m", "aarch64elf", "--no-relax",
                                                 "-e", "main", str(input_path), "-o", str(ROOT / (label + "-reference.elf"))])
          image_evidence(label + "-input", input_path)
          files = {str(path.relative_to(ROOT)): {"bytes": path.stat().st_size,
                                                "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
                   for path in sorted(ROOT.rglob("*")) if path.is_file()}
          (ROOT / "files.json").write_text(json.dumps(files, indent=2) + "\n")
          print("REL2133_RESULT direct_REL_rows=5 GOT_zero_rows=2 GOT_RELA_refusals=10 GOT_REL_refusals=4 ADD_underflow_refusals=1 all_candidate_assertions=passed", flush=True)
          PY

      - name: Hash all retained evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "relocation-2133"
          root.mkdir(parents=True, exist_ok=True)
          files = {str(path.relative_to(root)): {"bytes": path.stat().st_size,
                    "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
                    for path in sorted(root.rglob("*")) if path.is_file()}
          (root / "retained-file-hashes.json").write_text(json.dumps(files, indent=2) + "\n")
          PY

      - name: Retain exact-run diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relocation-2133-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/relocation-2133/
          if-no-files-found: error
          retention-days: 7

