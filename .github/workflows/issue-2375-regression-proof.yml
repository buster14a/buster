name: Issue 2375 regression proof
on:
  push:
    branches: [codex/2375-hosted-regression-proof]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      BUSTER_TEST_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 074281d6c1e937818c418c75ea398ea925cb0e9e
          fetch-depth: 0
          persist-credentials: false
      - name: Record candidate and substitute baseline producers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          { git rev-parse HEAD; git rev-parse 'HEAD^{tree}'; clang --version; } | tee "$RUNNER_TEMP/evidence/identity.txt"
          git show 7afde682de1beb595c779192c9519b7524afb412:src/buster/lib/compiler/frontend/c/c_parse.c > src/buster/lib/compiler/frontend/c/c_parse.c
          git show 7afde682de1beb595c779192c9519b7524afb412:src/buster/lib/compiler/frontend/c/c_gen.c > src/buster/lib/compiler/frontend/c/c_gen.c
          git diff --stat | tee "$RUNNER_TEMP/evidence/baseline-substitution.txt"
          clang -Isrc -I. -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/buster-driver"
          "$RUNNER_TEMP/buster-driver" generate --ci --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
          "$RUNNER_TEMP/buster-driver" build --config Release -t ide
      - name: Permanent regressions must fail on baseline producers
        run: |
          set -euo pipefail
          set +e
          build/Release/ide test --module=c_frontend_tests --verbose=1 --ci=1 > "$RUNNER_TEMP/evidence/baseline-regression.txt" 2>&1
          status=$?
          set -e
          tail -60 "$RUNNER_TEMP/evidence/baseline-regression.txt"
          test "$status" -ne 0
          grep -F 'c_test_file_tls_dialect' "$RUNNER_TEMP/evidence/baseline-regression.txt"
          grep -F 'a static initializer may not take the address of a thread-local object' "$RUNNER_TEMP/evidence/baseline-regression.txt"
          printf 'Baseline regression exit: %s\n' "$status" > "$RUNNER_TEMP/evidence/baseline-status.txt"
      - name: Restore and test exact candidate
        run: |
          set -euo pipefail
          git restore src/buster/lib/compiler/frontend/c/c_parse.c src/buster/lib/compiler/frontend/c/c_gen.c
          test -z "$(git status --porcelain --untracked-files=no)"
          "$RUNNER_TEMP/buster-driver" build --config Release -t ide
          sha256sum build/Release/ide >> "$RUNNER_TEMP/evidence/identity.txt"
          build/Release/ide test --module=c_frontend_tests --verbose=1 --ci=1 2>&1 | tee "$RUNNER_TEMP/evidence/candidate-regression.txt"
          "$RUNNER_TEMP/buster-driver" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/evidence/candidate-self-host.txt"
      - name: Sanitized Debug frontend contract
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-driver" generate --ci --sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
          "$RUNNER_TEMP/buster-driver" build --config Debug -t ide
          build/Debug/ide test --module=c_frontend_tests --verbose=1 --ci=1 2>&1 | tee "$RUNNER_TEMP/evidence/candidate-sanitized.txt"
      - name: Retain proof including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-2375-regression-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
