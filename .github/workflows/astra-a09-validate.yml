name: A09 exact-source correctness and scaling
on:
  push:
    branches: [astra/a09-memory-transport-20260909]
    paths: [.github/workflows/astra-a09-validate.yml]
permissions:
  contents: read
concurrency:
  group: a09-validation-${{ github.ref }}
  cancel-in-progress: false
env:
  CMAKE_BUILD_PARALLEL_LEVEL: '1'
  BUSTER_TEST_JOBS: '1'
  BUSTER_MATRIX_THREADS: '1'
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  A09_SOURCE: cce9e0393696c34a483c01d61997556d5b249d75
jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cce9e0393696c34a483c01d61997556d5b249d75
          path: candidate
          persist-credentials: false
      - name: Sequential uninstrumented trusted builds
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a09-comparison"
          clang --version > "$RUNNER_TEMP/a09-comparison/compiler.txt"
          lscpu > "$RUNNER_TEMP/a09-comparison/cpu.txt"
          free -b > "$RUNNER_TEMP/a09-comparison/memory.txt"
          uname -a > "$RUNNER_TEMP/a09-comparison/uname.txt"
          for variant in baseline candidate; do
            (
              cd "$variant"
              git rev-parse HEAD > "$RUNNER_TEMP/a09-comparison/$variant.sha"
              clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g0 build.c -o "$RUNNER_TEMP/build-$variant"
              "$RUNNER_TEMP/build-$variant" generate --cc clang --ci --linker DEFAULT -DBUSTER_UNITY_BUILD=OFF -DBUSTER_INCLUDE_TESTS=OFF
              "$RUNNER_TEMP/build-$variant" build --config Release -t ide -- -j1
            ) 2>&1 | tee "$RUNNER_TEMP/a09-comparison/$variant-build.log"
          done
          test "$(git -C candidate rev-parse HEAD)" = "$A09_SOURCE"
      - name: Independent C17 runtime controls
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          for compiler in clang gcc; do
            "$compiler" --version >> "$RUNNER_TEMP/a09-comparison/oracles.txt"
            for opt in 0 2; do
              "$compiler" -std=c17 -Wall -Wextra -Werror -O"$opt" tests/basic_c_fresh_binding_publication.c -o "$RUNNER_TEMP/binding-$compiler-$opt"
              "$RUNNER_TEMP/binding-$compiler-$opt"
            done
          done
      - name: Frozen geometric timing and exact object identity
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          echo "$cpu" > "$RUNNER_TEMP/a09-comparison/affinity.txt"
          taskset -c "$cpu" python3 tools/benchmark_frontend_scaling.py --baseline ../baseline/build/Release/ide --candidate build/Release/ide --suite bindings --warmups 2 --repetitions 9 --out "$RUNNER_TEMP/a09-comparison/bindings" 2>&1 | tee "$RUNNER_TEMP/a09-comparison/bindings.log"
      - name: Existing all-mode native throughput and child peak-RSS diagnostics
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/build-candidate" bench_throughput run --baseline "$GITHUB_WORKSPACE/baseline/build/Release/ide" --candidate "$GITHUB_WORKSPACE/candidate/build/Release/ide" --baseline-id ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae --candidate-id "$A09_SOURCE" --output "$RUNNER_TEMP/a09-comparison/native" --profile smoke --mode all --pairs 3 --warmups 1 --require-identical-output --no-guard 2>&1 | tee "$RUNNER_TEMP/a09-comparison/native.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: a09-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a09-comparison/
          if-no-files-found: error
          retention-days: 14

  observer:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cce9e0393696c34a483c01d61997556d5b249d75
          persist-credentials: false
      - name: Separate diagnostic-only operation and allocation observer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a09-observer"
          git rev-parse HEAD > "$RUNNER_TEMP/a09-observer/source.sha"
          python3 - <<'PY'
          import pathlib
          path = pathlib.Path('src/buster/lib/compiler/frontend/c/c_parse.c')
          text = '#include <stdio.h>\nstatic unsigned long long a09_binding_calls;\nstatic unsigned long long a09_binding_visits;\n' + path.read_text()
          start = text.index('BUSTER_C_INTERNAL u32 c_parse_binding_bind(')
          end = text.index('// Restores every binding', start)
          body = text[start:end]
          assert body.count('    u32 scan_count = 0;') == 1
          body = body.replace('    u32 scan_count = 0;', '    a09_binding_calls += 1;\n    u32 scan_count = 0;')
          body = body.replace('    return scan_count;', '    a09_binding_visits += scan_count;\n    return scan_count;')
          text = text[:start] + body + text[end:]
          start = text.index('BUSTER_C_INTERNAL CAnalysisResult c_analyze_semantics(')
          end = text.index('\nCParseResult c_parse(', start)
          body = text[start:end]
          position = body.rfind('    return result;')
          assert position >= 0
          body = body[:position] + '    fprintf(stderr, "A09_BIND calls=%llu visits=%llu\\n", a09_binding_calls, a09_binding_visits);\n' + body[position:]
          path.write_text(text[:start] + body + text[end:])
          PY
          git diff > "$RUNNER_TEMP/a09-observer/diagnostic-only.patch"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g0 build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --cc clang --ci --linker DEFAULT -DBUSTER_UNITY_BUILD=OFF -DBUSTER_INCLUDE_TESTS=OFF -DBUSTER_BENCH_ALLOCATIONS=ON 2>&1 | tee "$RUNNER_TEMP/a09-observer/configure.log"
          "$RUNNER_TEMP/buster-build" build --config Release -t ide -- -j1 2>&1 | tee "$RUNNER_TEMP/a09-observer/build.log"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'a09-observer'
          rows = []
          for count in [0, 1, 4, 16, 64, 256, 1024, 4096, 16384]:
              source = 'int main(void) {\n' + ''.join(f'extern int fresh_{i}(void);\n' for i in range(count)) + 'return 0;\n}\n'
              path = out / f'fresh-{count}.c'
              path.write_text(source)
              command = ['build/Release/ide', 'cc', '-std=c17', '-g0', '-fsyntax-only', str(path)]
              environment = dict(os.environ)
              if count in [0, 4096]:
                  environment['BUSTER_ALLOCATION_CENSUS'] = '1'
              result = subprocess.run(command, text=True, capture_output=True, timeout=120, env=environment)
              (out / f'fresh-{count}.log').write_text(result.stdout + result.stderr)
              assert result.returncode == 0, (count, result.stderr)
              match = re.findall(r'A09_BIND calls=(\d+) visits=(\d+)', result.stderr)
              assert len(match) == 1, match
              calls, visits = map(int, match[0])
              rows.append(dict(count=count, calls=calls, visits=visits, source_sha256=hashlib.sha256(source.encode()).hexdigest(), command=command))
              (out / 'operation-counts.json').write_text(json.dumps(rows, indent=2) + '\n')
              assert calls == 2 * count + 1 and visits == 0, rows[-1]
          PY
          python3 tools/allocation_census.py --input "$RUNNER_TEMP/a09-observer/fresh-0.log" --output "$RUNNER_TEMP/a09-observer/small-census"
          python3 tools/allocation_census.py --input "$RUNNER_TEMP/a09-observer/fresh-4096.log" --output "$RUNNER_TEMP/a09-observer/large-census"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: a09-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a09-observer/
          if-no-files-found: error
          retention-days: 14

  correctness:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.variant == 'baseline' && 'ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae' || 'cce9e0393696c34a483c01d61997556d5b249d75' }}
          persist-credentials: false
      - name: Exact-source Release build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a09-correctness"
          git rev-parse HEAD > "$RUNNER_TEMP/a09-correctness/tested.sha"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g0 build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --cc clang --ci --linker DEFAULT -DBUSTER_UNITY_BUILD=OFF 2>&1 | tee "$RUNNER_TEMP/a09-correctness/configure.log"
          "$RUNNER_TEMP/buster-build" build --config Release -t ide -- -j1 2>&1 | tee "$RUNNER_TEMP/a09-correctness/build.log"
      - name: Full registered Release suite
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" build --config Release -t test_all -- -j1 2>&1 | tee "$RUNNER_TEMP/a09-correctness/test-all.log"
      - name: Supported target and allocator mode matrix
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" test_mode_matrix --config Release 2>&1 | tee "$RUNNER_TEMP/a09-correctness/modes.log"
      - name: Canonical self-host gate
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/a09-correctness/self-host.log"
      - name: Repeated three-generation self-host audit
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" self_host_audit_self_test 2>&1 | tee "$RUNNER_TEMP/a09-correctness/audit-self-test.log"
          "$RUNNER_TEMP/buster-build" test_self_host_audit --config Release 2>&1 | tee "$RUNNER_TEMP/a09-correctness/self-host-audit.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: a09-correctness-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/a09-correctness/
            build/self-host-audit/
          if-no-files-found: error
          retention-days: 14

  sanitizer:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cce9e0393696c34a483c01d61997556d5b249d75
          persist-credentials: false
      - name: Exact-source ASan and UBSan Debug full suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a09-sanitizer"
          git rev-parse HEAD > "$RUNNER_TEMP/a09-sanitizer/tested.sha"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g0 build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --cc clang --ci --linker DEFAULT --sanitize -DBUSTER_UNITY_BUILD=OFF 2>&1 | tee "$RUNNER_TEMP/a09-sanitizer/configure.log"
          "$RUNNER_TEMP/buster-build" build --config Debug -t test_all -- -j1 2>&1 | tee "$RUNNER_TEMP/a09-sanitizer/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: a09-sanitizer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a09-sanitizer/
          if-no-files-found: error
          retention-days: 14
