name: Issue 792 phase-order price

on:
  push:
    branches: ['audit/792-function-order-price']
    paths: ['.github/workflows/issue-792-audit.yml']

permissions:
  contents: read

concurrency:
  group: issue-792-zen5-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [buster-zen5, ryzen-9700x]
    timeout-minutes: 120
    env:
      LC_ALL: C
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Host and revision
        shell: bash
        run: |
          set -euo pipefail
          AUDIT="$RUNNER_TEMP/issue-792-audit"
          printf 'AUDIT=%s\n' "$AUDIT" >> "$GITHUB_ENV"
          rm -rf "$AUDIT"
          mkdir -p "$AUDIT"
          exec > >(tee "$AUDIT/host.log") 2>&1
          git rev-parse HEAD 'HEAD^{tree}'
          uname -a
          lscpu
          grep -m1 microcode /proc/cpuinfo || true
          clang --version
          cmake --version
          ninja --version
          perf --version

      - name: Build trusted Release compiler
        id: build
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$AUDIT/build.log") 2>&1
          if command -v tcc >/dev/null 2>&1; then
            driver=./build.sh
          else
            clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
            driver="$RUNNER_TEMP/buster-build"
          fi
          printf 'driver=%s\n' "$driver" >> "$GITHUB_OUTPUT"
          if command -v mold >/dev/null 2>&1; then linker=MOLD; else linker=DEFAULT; fi
          "$driver" generate --config Release --cc clang --linker "$linker"
          "$driver" build --config Release -t ide
          sha256sum build/Release/ide
          cp build/compile_commands.json "$AUDIT/" || true

      - name: Self-host fixed point
        id: self_host
        continue-on-error: true
        shell: bash
        env:
          DRIVER: ${{ steps.build.outputs.driver }}
        run: |
          set -o pipefail
          "$DRIVER" test_self_host --config Release 2>&1 | tee "$AUDIT/test_self_host.log"

      - name: Stage-1 wall and counters
        id: counters
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee "$AUDIT/counters.log") 2>&1
          mkdir -p "$AUDIT/stage1"
          IDE=build/Release/ide
          COMMON=(-Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0)
          SRC=src/buster/apps/ide/ide.c
          taskset -c 2 "$IDE" cc "${COMMON[@]}" -g -fsource-metrics="$AUDIT/stage1/warm.metrics" "$SRC" -lm -o "$AUDIT/stage1/warm"
          sha256sum "$AUDIT/stage1/warm"
          for i in 1 2 3 4 5; do
            python3 - "$i" <<'PY'
          import os, resource, subprocess, sys, time
          run = sys.argv[1]
          audit = os.environ["AUDIT"]
          output = f"{audit}/stage1/default-{run}"
          cmd = ["taskset", "-c", "2", "build/Release/ide", "cc", "-Isrc", "-Ibuild/generated",
                 "-DBUSTER_UNITY_BUILD=1", "-DBUSTER_INCLUDE_TESTS=0", "-g",
                 f"-fsource-metrics={audit}/stage1/default-{run}.metrics",
                 "src/buster/apps/ide/ide.c", "-lm", "-o", output]
          before = resource.getrusage(resource.RUSAGE_CHILDREN)
          start = time.perf_counter()
          completed = subprocess.run(cmd)
          wall = time.perf_counter() - start
          after = resource.getrusage(resource.RUSAGE_CHILDREN)
          print(f"STAGE1_TIMING run={run} rc={completed.returncode} wall_s={wall:.6f} "
                f"user_s={after.ru_utime-before.ru_utime:.6f} sys_s={after.ru_stime-before.ru_stime:.6f} "
                f"maxrss_kib={after.ru_maxrss}")
          PY
          done
          sha256sum "$AUDIT/stage1"/default-?
          perf stat -r 5 -e '{cycles,instructions,branches,branch-misses}:u' -e task-clock -e page-faults -e context-switches -- \
            taskset -c 2 "$IDE" cc "${COMMON[@]}" -g "$SRC" -lm -o "$AUDIT/stage1/stat" 2>&1
          rm -f "$AUDIT/stage1"/warm "$AUDIT/stage1"/default-? "$AUDIT/stage1/stat"

      - name: Cache-miss survey and phase-order bound
        id: cache
        continue-on-error: true
        timeout-minutes: 35
        shell: bash
        run: |
          set -uo pipefail
          python3 tools/cache_miss_survey.py --self-test 2>&1 | tail -3
          python3 tools/cache_miss_survey.py --dwarf --repeat 3 --cpu 2 --limit 100 --lines 20 \
            --out "$AUDIT/cache-miss-survey" 2>&1 | tee "$AUDIT/cache-miss-survey.log"
          rm -f "$AUDIT"/cache-miss-survey/*.data || true
          python3 - "$AUDIT/cache-miss-survey/report.txt" "$AUDIT/phase-order-bound.txt" <<'PY'
          import re, sys
          report_path, output_path = sys.argv[1:]
          rows = {}
          pattern = re.compile(r"^\s*(\S+)\s+([0-9.]+)%\s+([0-9.]+)%\s+([0-9.]+)%\s+([0-9.]+)%\s+([0-9.]+)\s*$")
          for line in open(report_path, encoding="utf-8"):
              match = pattern.match(line)
              if match:
                  rows.setdefault(match.group(1), tuple(float(value) for value in match.groups()[1:]))
          phases = [
              "ir_validate_canonical_module",
              "ir_fast_function",
              "machine_select_canonical_function_x86_64",
              "ir_cfg_publish_instruction_rows",
              "ir_promote_function",
              "ir_function_publish_cfg",
          ]
          movable = phases[1:]
          missing = [name for name in phases if name not in rows]
          with open(output_path, "w", encoding="utf-8") as output:
              print("issue=792", file=output)
              print("missing=" + ",".join(missing), file=output)
              for name in phases:
                  if name in rows:
                      cycles, l1d, l2miss, dram, ratio = rows[name]
                      print(f"phase={name} cycles_pct={cycles:.2f} dram_pct={dram:.2f} x_cycles={ratio:.2f}", file=output)
              print(f"all_six_cycles_upper_bound_pct={sum(rows[name][0] for name in phases if name in rows):.2f}", file=output)
              print(f"all_six_dram_share_pct={sum(rows[name][3] for name in phases if name in rows):.2f}", file=output)
              print(f"post_guard_movable_cycles_upper_bound_pct={sum(rows[name][0] for name in movable if name in rows):.2f}", file=output)
              print(f"post_guard_movable_dram_share_pct={sum(rows[name][3] for name in movable if name in rows):.2f}", file=output)
          PY
          cat "$AUDIT/phase-order-bound.txt"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            printf '## Issue 792 Zen 5 audit\n\n'
            printf '```text\n'
            grep -E 'SELF_HOST|STEP_INSTRUCTIONS|STAGE1_TIMING' "$AUDIT"/*.log 2>/dev/null | head -80 || true
            cat "$AUDIT/phase-order-bound.txt" 2>/dev/null || true
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          du -sh "$AUDIT" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-792-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-792-audit
          retention-days: 14
