name: Buster CI recovery review
run-name: >-
  Recovery review ${{ github.event.workflow_run.event }} ${{ github.event.workflow_run.head_branch }}@${{ github.event.workflow_run.head_sha }}
  (Buster CI ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }}; handler ${{ github.sha }})

on:
  workflow_run:
    workflows: [Buster CI]
    types: [completed]
    # The trusted helper rejects main and queue runs. Exclude them before a
    # handler run is created, but retain all PR branches and completion outcomes.
    branches-ignore:
      - main
      - 'gh-readonly-queue/main/**'

permissions: {}

# Preserve serialization by upstream run ID across both lifecycle workflows.
concurrency:
  group: ci-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      ${{ github.server_url == 'https://github.com' &&
          vars.GH_ACTIONS_CI_ENABLED == 'true' &&
          vars.GH_ACTIONS_CI_RECOVERY_ENABLED != 'false' &&
          github.event.workflow_run.event != 'merge_group' &&
          github.event.workflow_run.run_attempt == 1 &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.conclusion == 'cancelled' ||
           github.event.workflow_run.conclusion == 'failure') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      # workflow_run's github.sha is the trusted default-branch revision.
      # Never check out the completed run's head, read its artifacts, or run it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retry an interrupted current PR once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/recover-ci.py
