name: PR 807 contract digest repair

on:
  push:
    branches:
      - codex/807-ci-fix-staging-20260918

permissions:
  contents: write

concurrency:
  group: pr807-contract-digest-repair-${{ github.sha }}
  cancel-in-progress: false

jobs:
  repair:
    name: Refresh archived support contract digest
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Rewrite, validate, and stage the clean commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          materializer = Path("tools/native_retirement_materializer.py")
          old = 'SUPPORT_CONTRACT_SHA256 = "1f94d76fa80c80462fbc39d13c7f05288d6447d7439d366b10df2e793c270204"'
          new = 'SUPPORT_CONTRACT_SHA256 = "42149a58107e46d05a3ef6d6b6f63df5923de2260b7b28be6325708e7a3d80ab"'
          text = materializer.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit("expected exactly one stale support-contract digest pin")
          materializer.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/pr807-contract-digest-repair.yml").unlink()
          PY
          python3 -m py_compile tools/native_retirement_materializer.py
          python3 tools/native_retirement_materializer_test.py -v
          python3 tools/native_retirement_contract_test.py -v
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/native_retirement_materializer.py .github/workflows/pr807-contract-digest-repair.yml
          git commit -m "ci: refresh archived support contract digest"
          git push origin HEAD:refs/heads/codex/807-ci-fix-staging2-20260918
          printf 'STAGED_COMMIT=%s\n' "$(git rev-parse HEAD)"
