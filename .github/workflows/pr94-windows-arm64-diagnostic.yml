name: PR 94 Windows ARM64 frontend diagnostic

on:
  push:
    branches:
      - claude/unruffled-bhabha-f5d28a
    paths:
      - .github/workflows/pr94-windows-arm64-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Vulkan SDK
        shell: powershell
        run: . .github/scripts/install-vulkan-sdk.ps1

      - name: Instrument the first failing frontend test
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import re

          test_path = Path("src/buster/tests/compiler/frontend/c/c_test.c")
          test_text = test_path.read_text(encoding="utf-8")
          test_text = '#include <stdio.h>\n#include <stdlib.h>\n' + test_text
          anchor = '    CIRLowerResult ir = c_lower_to_ir(temporary.arena, S8("sizeof-constant-expression.c"), tokens, parse, target_native);\n'
          diagnostic = r'''    if (ir.diagnostic_count)
              {
                  fprintf(stderr, "PR94_FIRST_LOWER_FAILURE count=%u program=%p diagnostics=%p canonical=%u\n", ir.diagnostic_count,
                          (void*)ir.program, (void*)ir.diagnostics, (u32)ir.canonical_ir_certified);
                  for (u32 diagnostic_index = 0; diagnostic_index < ir.diagnostic_count; diagnostic_index += 1)
                  {
                      CDiagnostic* diagnostic_value = ir.diagnostics + diagnostic_index;
                      fprintf(stderr, "PR94_DIAGNOSTIC index=%u kind=%u length=%llu message=", diagnostic_index,
                              (u32)diagnostic_value->kind, (unsigned long long)diagnostic_value->message.length);
                      if (diagnostic_value->message.pointer && diagnostic_value->message.length)
                      {
                          fwrite(diagnostic_value->message.pointer, 1, diagnostic_value->message.length, stderr);
                      }
                      fputc('\n', stderr);
                  }
                  fflush(stderr);
                  exit(213);
              }
          '''
          if test_text.count(anchor) != 1:
              raise SystemExit("sizeof lower-result anchor not found")
          test_text = test_text.replace(anchor, anchor + diagnostic, 1)
          call_pattern = re.compile(r'^(\s*)c_test_result_add\(&result, (c_test_[A-Za-z0-9_]+)\(arguments\)\);$', re.MULTILINE)
          def trace_test_call(match):
              indent, function = match.groups()
              return (f'{indent}fprintf(stderr, "PR94_TEST begin {function}\\n"); fflush(stderr);\n'
                      f'{match.group(0)}\n'
                      f'{indent}fprintf(stderr, "PR94_TEST end {function}\\n"); fflush(stderr);')
          test_text, traced_call_count = call_pattern.subn(trace_test_call, test_text)
          if traced_call_count < 20:
              raise SystemExit(f"only found {traced_call_count} frontend test calls")
          frontend_open = "UnitTestResult c_frontend_tests(UnitTestArguments* arguments)\n{"
          if test_text.count(frontend_open) != 1:
              raise SystemExit("frontend test entry anchor not found")
          test_text = test_text.replace(frontend_open, frontend_open + r'''
              fprintf(stderr, "PR94_ISOLATED nested conditional only\n"); fflush(stderr);
              return c_test_then_nested_conditionals(arguments);''', 1)
          nested_arena = "    TemporalArena nested_conditional_temporary = scratch_begin(0, 0);"
          if test_text.count(nested_arena) != 1:
              raise SystemExit("nested conditional arena anchor not found")
          test_text = test_text.replace(nested_arena, r'''    fprintf(stderr, "PR94_NESTED scratch_begin\n"); fflush(stderr);
              ''' + nested_arena + r'''
              fprintf(stderr, "PR94_NESTED preprocessing\n"); fflush(stderr);''', 1)
          nested_parse = "    CParseResult nested_conditional_parse = c_parse(nested_conditional_temporary.arena, nested_conditional_tokens);"
          if test_text.count(nested_parse) != 1:
              raise SystemExit("nested conditional parse anchor not found")
          test_text = test_text.replace(nested_parse, r'''    fprintf(stderr, "PR94_NESTED preprocessing_complete\n"); fflush(stderr);
              fprintf(stderr, "PR94_NESTED parsing\n"); fflush(stderr);
              ''' + nested_parse + r'''
              fprintf(stderr, "PR94_NESTED parsed token_diagnostics=%llu parse_diagnostics=%llu\n",
                      (unsigned long long)nested_conditional_tokens.diagnostic_count,
                      (unsigned long long)nested_conditional_parse.diagnostic_count);
              fflush(stderr);''', 1)
          nested_lower = "    CIRLowerResult nested_conditional_ir = c_lower_to_ir(nested_conditional_temporary.arena, S8(\"nested-conditional.c\"), nested_conditional_tokens,"
          if test_text.count(nested_lower) != 1:
              raise SystemExit("nested conditional lower anchor not found")
          test_text = test_text.replace(nested_lower, r'''    fprintf(stderr, "PR94_NESTED lowering\n"); fflush(stderr);
              ''' + nested_lower, 1)
          nested_lower_end = "                                                         nested_conditional_parse, target_native);"
          if test_text.count(nested_lower_end) != 1:
              raise SystemExit("nested conditional lower-end anchor not found")
          test_text = test_text.replace(nested_lower_end, nested_lower_end + r'''
              fprintf(stderr, "PR94_NESTED lowered diagnostics=%u program=%p\n", nested_conditional_ir.diagnostic_count,
                      (void*)nested_conditional_ir.program);
              fflush(stderr);''', 1)
          test_path.write_text(test_text, encoding="utf-8")

          parse_path = Path("src/buster/lib/compiler/frontend/c/c_parse.c")
          parse_text = '#include <stdio.h>\n' + parse_path.read_text(encoding="utf-8")
          parse_entry = "CParseResult c_parse(Arena* arena, CPreprocessResult preprocess)\n{"
          parse_body = "    CParserResult syntax = c_parse_ast(arena, preprocess);\n    return c_analyze_semantics(arena, preprocess, syntax);"
          if parse_text.count(parse_entry) != 1 or parse_text.count(parse_body) != 1:
              raise SystemExit("c_parse stage anchors not found")
          parse_text = parse_text.replace(parse_entry, parse_entry + r'''
              fprintf(stderr, "PR94_PARSE entry tokens=%llu\n", (unsigned long long)preprocess.token_count); fflush(stderr);''', 1)
          parse_text = parse_text.replace(parse_body, r'''    fprintf(stderr, "PR94_PARSE ast\n"); fflush(stderr);
              CParserResult syntax = c_parse_ast(arena, preprocess);
              fprintf(stderr, "PR94_PARSE ast_complete diagnostics=%llu\n", (unsigned long long)syntax.diagnostic_count); fflush(stderr);
              fprintf(stderr, "PR94_PARSE semantics\n"); fflush(stderr);
              CParseResult result = c_analyze_semantics(arena, preprocess, syntax);
              fprintf(stderr, "PR94_PARSE semantics_complete diagnostics=%llu\n", (unsigned long long)result.diagnostic_count); fflush(stderr);
              return result;''', 1)
          semantics_entry = "BUSTER_C_INTERNAL CAnalysisResult c_analyze_semantics(Arena* arena, CPreprocessResult preprocess, CParserResult syntax)\n{"
          if parse_text.count(semantics_entry) != 1:
              raise SystemExit("semantic-analysis entry anchor not found")
          parse_text = parse_text.replace(semantics_entry, semantics_entry + r'''
              fprintf(stderr, "PR94_SEMANTICS entry tokens=%llu syntax_diagnostics=%u\n",
                      (unsigned long long)preprocess.token_count, syntax.diagnostic_count); fflush(stderr);''', 1)
          census_call = "    c_parse_token_census(preprocess, token_count, &census, declaration_range_words);"
          if parse_text.count(census_call) != 1:
              raise SystemExit("semantic-analysis census anchor not found")
          parse_text = parse_text.replace(census_call, r'''    fprintf(stderr, "PR94_SEMANTICS census tokens=%u\n", token_count); fflush(stderr);
              ''' + census_call + r'''
              fprintf(stderr, "PR94_SEMANTICS census_complete declarations=%u\n", census.identifier_count); fflush(stderr);''', 1)
          semantic_stage_anchors = [
              ("    TemporalArena machine_temporary = scratch_begin(machine_conflicts, BUSTER_ARRAY_LENGTH(machine_conflicts));",
               "PR94_SEMANTICS machine_ready"),
              ("    CTypeId declarator_list_base = C_TYPE_ID_INVALID;",
               "PR94_SEMANTICS storage_ready"),
              ("    if (result.enum_member_count)",
               "PR94_SEMANTICS declarations_complete"),
              ("    c_parse_infer_file_array_bounds(&machine, arena, preprocess, &result);",
               "PR94_SEMANTICS initializers_complete"),
          ]
          for stage_anchor, stage_message in semantic_stage_anchors:
              if parse_text.count(stage_anchor) != 1:
                  raise SystemExit(f"semantic-analysis stage anchor not unique: {stage_anchor}")
              parse_text = parse_text.replace(stage_anchor,
                  f'    fprintf(stderr, "{stage_message}\\n"); fflush(stderr);\n' + stage_anchor, 1)
          bind_call = "        c_parse_bind_function_body(&machine, arena, &result, preprocess, declaration_index);"
          if parse_text.count(bind_call) != 1:
              raise SystemExit("semantic-analysis body-bind anchor not found")
          parse_text = parse_text.replace(bind_call, r'''        fprintf(stderr, "PR94_SEMANTICS bind_body index=%u body_start=%u body_count=%u\n",
                      declaration_index, declaration->body_start, declaration->body_token_count); fflush(stderr);
              ''' + bind_call + r'''
              fprintf(stderr, "PR94_SEMANTICS bind_body_complete index=%u diagnostics=%llu\n",
                      declaration_index, (unsigned long long)result.diagnostic_count); fflush(stderr);''', 1)
          block_loop = "    u32 asm_operand_range_end = UINT32_MAX;\n    while (index < body_end)\n    {"
          if parse_text.count(block_loop) != 1:
              raise SystemExit("block-binding loop anchor not found")
          parse_text = parse_text.replace(block_loop, block_loop + r'''
              fprintf(stderr, "PR94_BIND token index=%u shape=%u punctuator=%u statement_start=%u\n", index,
                      (u32)c_preprocess_token_shape_at(token_shapes, &preprocess, index),
                      (u32)c_token_shape_punctuator(c_preprocess_token_shape_at(token_shapes, &preprocess, index)),
                      (u32)statement_start); fflush(stderr);''', 1)
          function_block_call = "        c_parse_bind_block_statements(machine, result_arena, result, preprocess, declaration_index, declaration->scope, declaration->body_start,\n                                      declaration->body_token_count);"
          if parse_text.count(function_block_call) != 1:
              raise SystemExit("function block call anchor not found")
          parse_text = parse_text.replace(function_block_call, r'''        fprintf(stderr, "PR94_BIND block\n"); fflush(stderr);
              ''' + function_block_call + r'''
              fprintf(stderr, "PR94_BIND block_complete\n"); fflush(stderr);''', 1)
          static_assert_call = "        c_parse_bind_function_static_asserts(machine, result_arena, result, preprocess, declaration);"
          if parse_text.count(static_assert_call) != 1:
              raise SystemExit("function static-assert call anchor not found")
          parse_text = parse_text.replace(static_assert_call, static_assert_call + r'''
              fprintf(stderr, "PR94_BIND static_asserts_complete\n"); fflush(stderr);''', 1)
          aggregate_call = "        c_parse_bind_expression_aggregates(machine, result, preprocess, declaration->scope, declaration->body_start,\n                                           declaration->body_start + declaration->body_token_count);"
          if parse_text.count(aggregate_call) != 1:
              raise SystemExit("function aggregate call anchor not found")
          parse_text = parse_text.replace(aggregate_call, aggregate_call + r'''
              fprintf(stderr, "PR94_BIND aggregates_complete\n"); fflush(stderr);''', 1)
          parse_path.write_text(parse_text, encoding="utf-8")

          gen_path = Path("src/buster/lib/compiler/frontend/c/c_gen.c")
          gen_text = gen_path.read_text(encoding="utf-8")
          gen_text = '#include <stdio.h>\n' + gen_text
          switch_line = 'if (first.kind == C_TOKEN_IDENTIFIER && c_token_is_well_known(builder->preprocess.spelling_base, first, C_SYMBOL_WELL_KNOWN_SWITCH))'
          if gen_text.count(switch_line) != 1:
              raise SystemExit(f"switch classifier anchor count is {gen_text.count(switch_line)}")
          probe = r'''{
                  String8 pr94_spelling = c_token_spelling(builder->preprocess.spelling_base, first);
                  if (string_equal(pr94_spelling, S8("switch")))
                  {
                      String8 pr94_expected = c_symbol_well_known_spellings[C_SYMBOL_WELL_KNOWN_SWITCH];
                      fprintf(stderr,
                              "PR94_SWITCH_TOKEN kind=%u symbol=%u expected_symbol=%u offset=%u raw_length=%u punctuator=%u well_known=%u spelling_length=%llu expected_length=%llu spelling=",
                              (u32)first.kind, first.symbol, (u32)C_SYMBOL_WELL_KNOWN_SWITCH, first.offset, (u32)first.length,
                              (u32)first.punctuator,
                              (u32)c_token_is_well_known(builder->preprocess.spelling_base, first, C_SYMBOL_WELL_KNOWN_SWITCH),
                              (unsigned long long)pr94_spelling.length, (unsigned long long)pr94_expected.length);
                      fwrite(pr94_spelling.pointer, 1, pr94_spelling.length, stderr);
                      fputs(" expected=", stderr);
                      fwrite(pr94_expected.pointer, 1, pr94_expected.length, stderr);
                      fputc('\n', stderr);
                      fflush(stderr);
                  }
              }
              '''
          switch_enter = switch_line + "\n" + " " * 12 + "{"
          switch_enter_probe = switch_enter + "\n" + " " * 16 + r'''fprintf(stderr, "PR94_SWITCH_STAGE entered index=%u end=%u next_punctuator=%u\n", index, task.end,
                          index + 1 < task.end ? (u32)builder->preprocess.tokens[index + 1].punctuator : UINT32_MAX);
                  fflush(stderr);'''
          if gen_text.count(switch_enter) != 1:
              raise SystemExit(f"switch entry anchor count is {gen_text.count(switch_enter)}")
          gen_text = gen_text.replace(switch_enter, switch_enter_probe, 1)

          condition_gate = " " * 16 + "if (expression_close == UINT32_MAX || expression_close == index + 2 || expression_close + 1 >= task.end ||"
          condition_probe = " " * 16 + r'''fprintf(stderr, "PR94_SWITCH_STAGE condition_close=%u after_kind=%u after_punctuator=%u\n", expression_close,
                          expression_close + 1 < task.end ? (u32)builder->preprocess.tokens[expression_close + 1].kind : UINT32_MAX,
                          expression_close + 1 < task.end ? (u32)builder->preprocess.tokens[expression_close + 1].punctuator : UINT32_MAX);
                  fflush(stderr);
                  if (expression_close == UINT32_MAX || expression_close == index + 2 || expression_close + 1 >= task.end ||'''
          if gen_text.count(condition_gate) != 1:
              raise SystemExit(f"switch condition anchor count is {gen_text.count(condition_gate)}")
          gen_text = gen_text.replace(condition_gate, condition_probe, 1)

          body_gate = " " * 16 + "CIrSwitchCase* cases = switch_cases;"
          body_probe = " " * 16 + r'''fprintf(stderr, "PR94_SWITCH_STAGE body_open=%u body_close=%u\n", body_open, body_close);
                  fflush(stderr);
                  CIrSwitchCase* cases = switch_cases;'''
          if gen_text.count(body_gate) != 1:
              raise SystemExit(f"switch body anchor count is {gen_text.count(body_gate)}")
          gen_text = gen_text.replace(body_gate, body_probe, 1)

          colon_state = " " * 20 + "u32 nested = 0;"
          colon_state_probe = colon_state + "\n" + " " * 20 + r'''fprintf(stderr, "PR94_SWITCH_STAGE label scan=%u initial_range=%u\n", scan, range_operator);
                      fflush(stderr);'''
          if gen_text.count(colon_state) != 1:
              raise SystemExit(f"switch label-state anchor count is {gen_text.count(colon_state)}")
          gen_text = gen_text.replace(colon_state, colon_state_probe, 1)

          colon_token = " " * 24 + "CToken colon_token = builder->preprocess.tokens[colon];"
          colon_token_probe = colon_token + "\n" + " " * 24 + r'''fprintf(stderr, "PR94_SWITCH_STAGE label_token colon=%u kind=%u punctuator=%u nested=%u range=%u ellipsis=%u\n", colon,
                              (u32)colon_token.kind, (u32)colon_token.punctuator, nested, range_operator,
                              (u32)c_token_is_punctuator(&colon_token, C_PUNCTUATOR_ELLIPSIS));
                          fflush(stderr);'''
          if gen_text.count(colon_token) != 1:
              raise SystemExit(f"switch label-token anchor count is {gen_text.count(colon_token)}")
          gen_text = gen_text.replace(colon_token, colon_token_probe, 1)

          case_constant_gate = " " * 28 + "if (!c_ir_constant_evaluate(builder, scan + 1, colon, &switch_case.low_constant) ||"
          case_constant_probe = " " * 28 + r'''bool pr94_constant_success = c_ir_constant_evaluate(builder, scan + 1, colon, &switch_case.low_constant);
                              fprintf(stderr, "PR94_SWITCH_STAGE case scan=%u colon=%u constant_success=%u constant_kind=%u\n", scan, colon,
                                      (u32)pr94_constant_success, (u32)switch_case.low_constant.kind);
                              fflush(stderr);
                              if (!pr94_constant_success ||'''
          if gen_text.count(case_constant_gate) != 1:
              raise SystemExit(f"switch case constant anchor count is {gen_text.count(case_constant_gate)}")
          gen_text = gen_text.replace(case_constant_gate, case_constant_probe, 1)

          switch_yield = " " * 16 + "state->switch_case_count = case_count;"
          switch_yield_probe = " " * 16 + r'''fprintf(stderr, "PR94_SWITCH_STAGE cases_complete count=%u\n", case_count);
                  fflush(stderr);
                  state->switch_case_count = case_count;'''
          if gen_text.count(switch_yield) != 1:
              raise SystemExit(f"switch yield anchor count is {gen_text.count(switch_yield)}")
          gen_text = gen_text.replace(switch_yield, switch_yield_probe, 1)
          gen_text = gen_text.replace(switch_line, probe + switch_line, 1)
          gen_path.write_text(gen_text, encoding="utf-8")
          '@ | python -

      - name: Configure and run the reproducer
        shell: powershell
        env:
          VS_ARCH: arm64
          VS_COMPONENT: Microsoft.VisualStudio.Component.VC.Tools.ARM64
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPath = (& $VsWhere -latest -products * -requires $env:VS_COMPONENT -property installationPath | Select-Object -First 1).Trim()
          if (-not $VsPath) { throw "Visual Studio ARM64 tools were not found" }
          & (Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1') -Arch $env:VS_ARCH -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          cmake -B build/pr94-diag -DBUSTER_CI=ON -DCMAKE_C_COMPILER=clang -DBUSTER_FUZZ_AVAILABLE=OFF -DBUSTER_SANITIZE=OFF -DCMAKE_LINKER_TYPE=DEFAULT -DBUSTER_LTO=OFF -DBUSTER_TIME_TRACE=OFF -DBUSTER_INSTRUMENT=OFF -DBUSTER_INCLUDE_TESTS=ON -DBUSTER_LINK_LIBC=ON -DBUSTER_CHECK_OPTIONAL_WARNINGS=OFF -DBUSTER_DEVELOPER_TARGETS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -G "Ninja Multi-Config" -DCMAKE_DEFAULT_BUILD_TYPE=Release -DCMAKE_CONFIGURATION_TYPES=Release -DCMAKE_CROSS_CONFIGS=all -DBUSTER_SINGLE_THREADED=OFF -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/pr94-diag --config Release --target ide:Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BUSTER_TEST_JOBS = '1'
          $env:BUSTER_TEST_TABLE_AUDITS = '1'
          & build/pr94-diag/Release/ide.exe test --verbose=1 --ci=1
          exit $LASTEXITCODE
