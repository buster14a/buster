name: PR 94 Windows ARM64 frontend diagnostic

on:
  push:
    branches:
      - claude/unruffled-bhabha-f5d28a
    paths:
      - .github/workflows/pr94-windows-arm64-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Vulkan SDK
        shell: powershell
        run: . .github/scripts/install-vulkan-sdk.ps1

      - name: Instrument the first failing frontend test
        shell: powershell
        run: |
          @'
          from pathlib import Path

          test_path = Path("src/buster/tests/compiler/frontend/c/c_test.c")
          test_text = test_path.read_text(encoding="utf-8")
          test_text = '#include <stdio.h>\n#include <stdlib.h>\n' + test_text
          anchor = '    CIRLowerResult ir = c_lower_to_ir(temporary.arena, S8("sizeof-constant-expression.c"), tokens, parse, target_native);\n'
          diagnostic = r'''    if (ir.diagnostic_count)
              {
                  fprintf(stderr, "PR94_FIRST_LOWER_FAILURE count=%u program=%p diagnostics=%p canonical=%u\n", ir.diagnostic_count,
                          (void*)ir.program, (void*)ir.diagnostics, (u32)ir.canonical_ir_certified);
                  for (u32 diagnostic_index = 0; diagnostic_index < ir.diagnostic_count; diagnostic_index += 1)
                  {
                      CDiagnostic* diagnostic_value = ir.diagnostics + diagnostic_index;
                      fprintf(stderr, "PR94_DIAGNOSTIC index=%u kind=%u length=%llu message=", diagnostic_index,
                              (u32)diagnostic_value->kind, (unsigned long long)diagnostic_value->message.length);
                      if (diagnostic_value->message.pointer && diagnostic_value->message.length)
                      {
                          fwrite(diagnostic_value->message.pointer, 1, diagnostic_value->message.length, stderr);
                      }
                      fputc('\n', stderr);
                  }
                  fflush(stderr);
                  exit(213);
              }
          '''
          if test_text.count(anchor) != 1:
              raise SystemExit("sizeof lower-result anchor not found")
          test_path.write_text(test_text.replace(anchor, anchor + diagnostic, 1), encoding="utf-8")

          gen_path = Path("src/buster/lib/compiler/frontend/c/c_gen.c")
          gen_text = gen_path.read_text(encoding="utf-8")
          gen_text = '#include <stdio.h>\n' + gen_text
          switch_line = 'if (first.kind == C_TOKEN_IDENTIFIER && c_token_is_well_known(builder->preprocess.spelling_base, first, C_SYMBOL_WELL_KNOWN_SWITCH))'
          if gen_text.count(switch_line) != 1:
              raise SystemExit(f"switch classifier anchor count is {gen_text.count(switch_line)}")
          probe = r'''{
                  String8 pr94_spelling = c_token_spelling(builder->preprocess.spelling_base, first);
                  if (string_equal(pr94_spelling, S8("switch")))
                  {
                      String8 pr94_expected = c_symbol_well_known_spellings[C_SYMBOL_WELL_KNOWN_SWITCH];
                      fprintf(stderr,
                              "PR94_SWITCH_TOKEN kind=%u symbol=%u expected_symbol=%u offset=%u raw_length=%u punctuator=%u well_known=%u spelling_length=%llu expected_length=%llu spelling=",
                              (u32)first.kind, first.symbol, (u32)C_SYMBOL_WELL_KNOWN_SWITCH, first.offset, (u32)first.length,
                              (u32)first.punctuator,
                              (u32)c_token_is_well_known(builder->preprocess.spelling_base, first, C_SYMBOL_WELL_KNOWN_SWITCH),
                              (unsigned long long)pr94_spelling.length, (unsigned long long)pr94_expected.length);
                      fwrite(pr94_spelling.pointer, 1, pr94_spelling.length, stderr);
                      fputs(" expected=", stderr);
                      fwrite(pr94_expected.pointer, 1, pr94_expected.length, stderr);
                      fputc('\n', stderr);
                      fflush(stderr);
                  }
              }
              '''
          switch_enter = switch_line + "\n" + " " * 12 + "{"
          switch_enter_probe = switch_enter + "\n" + " " * 16 + r'''fprintf(stderr, "PR94_SWITCH_STAGE entered index=%u end=%u next_punctuator=%u\n", index, task.end,
                          index + 1 < task.end ? (u32)builder->preprocess.tokens[index + 1].punctuator : UINT32_MAX);
                  fflush(stderr);'''
          if gen_text.count(switch_enter) != 1:
              raise SystemExit(f"switch entry anchor count is {gen_text.count(switch_enter)}")
          gen_text = gen_text.replace(switch_enter, switch_enter_probe, 1)

          condition_gate = " " * 16 + "if (expression_close == UINT32_MAX || expression_close == index + 2 || expression_close + 1 >= task.end ||"
          condition_probe = " " * 16 + r'''fprintf(stderr, "PR94_SWITCH_STAGE condition_close=%u after_kind=%u after_punctuator=%u\n", expression_close,
                          expression_close + 1 < task.end ? (u32)builder->preprocess.tokens[expression_close + 1].kind : UINT32_MAX,
                          expression_close + 1 < task.end ? (u32)builder->preprocess.tokens[expression_close + 1].punctuator : UINT32_MAX);
                  fflush(stderr);
                  if (expression_close == UINT32_MAX || expression_close == index + 2 || expression_close + 1 >= task.end ||'''
          if gen_text.count(condition_gate) != 1:
              raise SystemExit(f"switch condition anchor count is {gen_text.count(condition_gate)}")
          gen_text = gen_text.replace(condition_gate, condition_probe, 1)

          body_gate = " " * 16 + "CIrSwitchCase* cases = switch_cases;"
          body_probe = " " * 16 + r'''fprintf(stderr, "PR94_SWITCH_STAGE body_open=%u body_close=%u\n", body_open, body_close);
                  fflush(stderr);
                  CIrSwitchCase* cases = switch_cases;'''
          if gen_text.count(body_gate) != 1:
              raise SystemExit(f"switch body anchor count is {gen_text.count(body_gate)}")
          gen_text = gen_text.replace(body_gate, body_probe, 1)

          colon_state = " " * 20 + "u32 nested = 0;"
          colon_state_probe = colon_state + "\n" + " " * 20 + r'''fprintf(stderr, "PR94_SWITCH_STAGE label scan=%u initial_range=%u\n", scan, range_operator);
                      fflush(stderr);'''
          if gen_text.count(colon_state) != 1:
              raise SystemExit(f"switch label-state anchor count is {gen_text.count(colon_state)}")
          gen_text = gen_text.replace(colon_state, colon_state_probe, 1)

          colon_token = " " * 24 + "CToken colon_token = builder->preprocess.tokens[colon];"
          colon_token_probe = colon_token + "\n" + " " * 24 + r'''fprintf(stderr, "PR94_SWITCH_STAGE label_token colon=%u kind=%u punctuator=%u nested=%u range=%u ellipsis=%u\n", colon,
                              (u32)colon_token.kind, (u32)colon_token.punctuator, nested, range_operator,
                              (u32)c_token_is_punctuator(&colon_token, C_PUNCTUATOR_ELLIPSIS));
                          fflush(stderr);'''
          if gen_text.count(colon_token) != 1:
              raise SystemExit(f"switch label-token anchor count is {gen_text.count(colon_token)}")
          gen_text = gen_text.replace(colon_token, colon_token_probe, 1)

          case_constant_gate = " " * 28 + "if (!c_ir_constant_evaluate(builder, scan + 1, colon, &switch_case.low_constant) ||"
          case_constant_probe = " " * 28 + r'''bool pr94_constant_success = c_ir_constant_evaluate(builder, scan + 1, colon, &switch_case.low_constant);
                              fprintf(stderr, "PR94_SWITCH_STAGE case scan=%u colon=%u constant_success=%u constant_kind=%u\n", scan, colon,
                                      (u32)pr94_constant_success, (u32)switch_case.low_constant.kind);
                              fflush(stderr);
                              if (!pr94_constant_success ||'''
          if gen_text.count(case_constant_gate) != 1:
              raise SystemExit(f"switch case constant anchor count is {gen_text.count(case_constant_gate)}")
          gen_text = gen_text.replace(case_constant_gate, case_constant_probe, 1)

          switch_yield = " " * 16 + "state->switch_case_count = case_count;"
          switch_yield_probe = " " * 16 + r'''fprintf(stderr, "PR94_SWITCH_STAGE cases_complete count=%u\n", case_count);
                  fflush(stderr);
                  state->switch_case_count = case_count;'''
          if gen_text.count(switch_yield) != 1:
              raise SystemExit(f"switch yield anchor count is {gen_text.count(switch_yield)}")
          gen_text = gen_text.replace(switch_yield, switch_yield_probe, 1)
          gen_text = gen_text.replace(switch_line, probe + switch_line, 1)
          gen_path.write_text(gen_text, encoding="utf-8")
          '@ | python -

      - name: Configure and run the reproducer
        shell: powershell
        env:
          VS_ARCH: arm64
          VS_COMPONENT: Microsoft.VisualStudio.Component.VC.Tools.ARM64
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPath = (& $VsWhere -latest -products * -requires $env:VS_COMPONENT -property installationPath | Select-Object -First 1).Trim()
          if (-not $VsPath) { throw "Visual Studio ARM64 tools were not found" }
          & (Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1') -Arch $env:VS_ARCH -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          cmake -B build/pr94-diag -DBUSTER_CI=ON -DCMAKE_C_COMPILER=clang -DBUSTER_FUZZ_AVAILABLE=OFF -DBUSTER_SANITIZE=OFF -DCMAKE_LINKER_TYPE=DEFAULT -DBUSTER_LTO=OFF -DBUSTER_TIME_TRACE=OFF -DBUSTER_INSTRUMENT=OFF -DBUSTER_INCLUDE_TESTS=ON -DBUSTER_LINK_LIBC=ON -DBUSTER_CHECK_OPTIONAL_WARNINGS=OFF -DBUSTER_DEVELOPER_TARGETS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -G "Ninja Multi-Config" -DCMAKE_DEFAULT_BUILD_TYPE=Release -DCMAKE_CONFIGURATION_TYPES=Release -DCMAKE_CROSS_CONFIGS=all -DBUSTER_SINGLE_THREADED=OFF -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/pr94-diag --config Release --target ide:Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BUSTER_TEST_JOBS = '1'
          $env:BUSTER_TEST_TABLE_AUDITS = '1'
          & build/pr94-diag/Release/ide.exe test --verbose=1 --ci=1
          exit $LASTEXITCODE
