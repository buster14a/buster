name: Issue 1125 patch publication
on:
  push:
    branches: [work/1125-option-audit-snapshot]
    paths: [issue-1125.patch.gz.b64]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch to its pinned main revision
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode issue-1125.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/issue-1125.patch"
          echo '893dad0428b49723a598a1a607f74dcdac321fb2772f9a53aedcae0fb00b0664  '"$RUNNER_TEMP/issue-1125.patch" | sha256sum --check
          git checkout -b fix/1125-explicit-codegen-options 441db2428d2bd8d28503037b28c1b3740fe4b25a
          git apply --check "$RUNNER_TEMP/issue-1125.patch"
          git apply "$RUNNER_TEMP/issue-1125.patch"
          git diff --check
          git add src/buster/compiler/c_check_options.c src/buster/compiler/c_check_options_driver_test.c src/buster/compiler/c_check_request.c src/buster/compiler/c_check_request_test.c src/buster/compiler/c_check_hardening_driver_test.c docs/commands/checker.md
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'fix(driver): require explicit semantic ownership for -f/-m options' -m 'Reject unclassified code-generation options before input or output IO. Preserve resolved sanitizer, coverage, layout and frontend families, enumerate exact compatibility controls, and add CLI/shared-request regressions and documentation.' -m 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>'
          git log -1 --format=fuller
          git push origin HEAD:refs/heads/fix/1125-explicit-codegen-options
