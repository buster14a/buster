name: 9700X review signal
run-name: 9700X review PR ${{ github.event.pull_request.number }}

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

# Review workflows may be selected from untrusted PR code. This workflow has no write token, checkout or secrets.
# Its completion only wakes the default-branch controller, which queries current reviews and verifies permissions.
permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Wake metadata reconciliation
        run: echo 'The default-branch controller will verify current review metadata.'
