name: publish issue 845 shadowing fix

on:
  push:
    branches:
      - codex/845-849-source-snapshot-20260919
  workflow_dispatch:

concurrency:
  group: publish-issue-845
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Publish exact warning repair
        shell: bash
        run: |
          set -euo pipefail
          target=codex/845-mir-padded-vectors
          expected=6a2e428d1f8500c35e26152a82efd876fb6045ba
          remote_sha="$(git ls-remote origin "refs/heads/$target" | cut -f1)"
          test "$remote_sha" = "$expected"
          git fetch --no-tags --depth=1 origin "$target"
          git checkout -B "$target" FETCH_HEAD

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/buster/lib/compiler/codegen/machine_x86_64.c")
          text = path.read_text()
          old = '''        bool f64 = instruction->payload == 8 || instruction->payload == 24;
                  offsets[0] += (s32)(instruction->payload & ~8u);
                  machine_x64_emit_x87_memory(encoder, load ? S8("FLD") : S8("FSTP"), offsets[0], (u16)(f64 ? 64 : 80));
                  if (!load && !f64)
          '''
          new = '''        bool is_f64_result = instruction->payload == 8 || instruction->payload == 24;
                  offsets[0] += (s32)(instruction->payload & ~8u);
                  machine_x64_emit_x87_memory(encoder, load ? S8("FLD") : S8("FSTP"), offsets[0], (u16)(is_f64_result ? 64 : 80));
                  if (!load && !is_f64_result)
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one exact block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "src/buster/lib/compiler/codegen/machine_x86_64.c"
          ! grep -n 'bool f64 =' src/buster/lib/compiler/codegen/machine_x86_64.c
          grep -n 'bool is_f64_result =' src/buster/lib/compiler/codegen/machine_x86_64.c

          git config user.name David
          git config user.email davidgmbb@gmail.com
          git add src/buster/lib/compiler/codegen/machine_x86_64.c
          git commit -m 'codegen: avoid shadowing the f64 typedef'
          git push origin HEAD:"refs/heads/$target"
