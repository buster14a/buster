name: 845-849 source snapshot

on:
  push:
    branches:
      - codex/845-849-source-snapshot-20260919
  workflow_dispatch:

concurrency:
  group: codex-845-849-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: 460c48e9c9bcbd292e10b2b4627ee281718479aa
      - name: Pack tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "460c48e9c9bcbd292e10b2b4627ee281718479aa"
          test "$(git rev-parse HEAD^{tree})" = "f0fbc2fd0c0967070a83a13a578ed712d0f7fd73"
          git archive --format=tar.gz --output="$RUNNER_TEMP/buster-source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/revision.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/tree.txt"
          sha256sum "$RUNNER_TEMP/buster-source.tar.gz" > "$RUNNER_TEMP/buster-source.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-pr522-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/buster-source.tar.gz
            ${{ runner.temp }}/buster-source.tar.gz.sha256
            ${{ runner.temp }}/revision.txt
            ${{ runner.temp }}/tree.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
