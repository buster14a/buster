name: publish issue 848

on:
  push:
    branches:
      - codex/845-849-source-snapshot-20260919
  workflow_dispatch:

concurrency:
  group: publish-issue-848
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Apply and publish exact repair
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/issue848.patch.gz.b64"
          cp .github/payloads/issue848.patch.gz.b64 "$payload"
          test "$(wc -c < "$payload")" -eq 6763
          base64 -d "$payload" > "$RUNNER_TEMP/issue848.patch.gz"
          test "$(sha256sum "$RUNNER_TEMP/issue848.patch.gz" | cut -d' ' -f1)" = "aa39e336bddc6c2d10d0f9ccba690830fb113839763bf94d2983c510b6aceddb"
          gzip -d -c "$RUNNER_TEMP/issue848.patch.gz" > "$RUNNER_TEMP/issue848.patch"
          test "$(sha256sum "$RUNNER_TEMP/issue848.patch" | cut -d' ' -f1)" = "ff6189ec6112e50ef3287475e7472f1db5029dfaed7c9a3737daac0bdf8a787e"
          git fetch --no-tags --depth=1 origin 4dff1d020c16a7599e74a7e2cc305715eb908553
          git checkout --detach 4dff1d020c16a7599e74a7e2cc305715eb908553
          test "$(git rev-parse HEAD^{tree})" = "6698cdffa0f143c476e55d0fb04acaa42bb69a6a"
          if git ls-remote --exit-code origin refs/heads/codex/848-unreachable-local-20260919 >/dev/null 2>&1; then
            echo 'feature branch already exists' >&2
            exit 1
          fi
          git checkout -b codex/848-unreachable-local-20260919
          git apply --check "$RUNNER_TEMP/issue848.patch"
          git apply --index "$RUNNER_TEMP/issue848.patch"
          git diff --cached --check
          git config user.name David
          git config user.email davidgmbb@gmail.com
          git commit -m 'c: materialize skipped automatic locals at labeled reentry (#848)'
          test "$(git rev-parse HEAD^{tree})" = "e8f422324b57b77d2fe2e1bb9952e9b5f9f76ed7"
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 7
          git push origin HEAD:refs/heads/codex/848-unreachable-local-20260919
