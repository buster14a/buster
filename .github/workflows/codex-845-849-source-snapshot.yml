name: publish issue 845

on:
  push:
    branches:
      - codex/845-849-source-snapshot-20260919
  workflow_dispatch:

concurrency:
  group: publish-issue-845
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Apply and publish exact repair
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/issue845.patch.gz.b64"
          cp .github/payloads/issue845.patch.gz.b64 "$payload"
          test "$(wc -c < "$payload")" -eq 16637
          test "$(sha256sum "$payload" | cut -d' ' -f1)" = "34aa0a750c7de1477dea830b5d788ef8cff8a3878e94c5e70023554973369394"
          base64 -d "$payload" > "$RUNNER_TEMP/issue845.patch.gz"
          test "$(sha256sum "$RUNNER_TEMP/issue845.patch.gz" | cut -d' ' -f1)" = "ac12fe59e7cc72d47db040f151e746d5d3153c33e53ad803fa0677c3b59b25cc"
          gzip -d -c "$RUNNER_TEMP/issue845.patch.gz" > "$RUNNER_TEMP/issue845.patch"
          test "$(wc -c < "$RUNNER_TEMP/issue845.patch")" -eq 66418
          test "$(sha256sum "$RUNNER_TEMP/issue845.patch" | cut -d' ' -f1)" = "2d86166fdbe89fd5f9d88e7ef0becaf2841939947f0940bfb12d51e473eb06ec"

          base=bfd14ad8788513eef6df5c216ce7fd6ce29c8248
          target=codex/845-mir-padded-vectors
          git fetch --no-tags --depth=1 origin "$base"
          git checkout --detach "$base"
          test "$(git rev-parse HEAD^{tree})" = "4fcbe32a2eb9363d016270bcd6821258e7c73902"
          remote_sha="$(git ls-remote origin "refs/heads/$target" | cut -f1)"
          test "$remote_sha" = "$base"
          git checkout -b "$target"

          git apply --3way --index "$RUNNER_TEMP/issue845.patch"
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          test "$(git diff --cached --name-only | sort | sha256sum | cut -d' ' -f1)" = "c43104af9772542dc69fc25024766884765330e0f3c25df949618a9f54b4f8cf" || {
            git diff --cached --name-only >&2
            exit 1
          }

          git config user.name David
          git config user.email davidgmbb@gmail.com
          git commit -m 'codegen: support padded vectors throughout MIR (#845)'
          git push origin HEAD:"refs/heads/$target"
