name: RAD Debugger compatibility

# Correctness diagnostics only; no physical performance runner.
on:
  push:
    branches: [codex/2279-raddebugger-compatibility]
  pull_request:
    paths:
      - build.c
      - src/buster/lib/compiler/**
      - docs/agents/compatibility/raddebugger.md
      - .github/workflows/raddebugger-compatibility.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raddebugger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  baseline-self-host:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Hosted bootstrap
        run: |
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/raddebugger-driver"
      - name: Configure compiler
        run: |
          "$RUNNER_TEMP/raddebugger-driver" generate --ci --cc clang --no-sanitize --no-fuzz --no-lto --no-include-tests --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
      - name: Build trusted compiler
        run: |
          "$RUNNER_TEMP/raddebugger-driver" build --config Release -t ide
      - name: Baseline self-host fixed point
        run: |
          set -o pipefail
          "$RUNNER_TEMP/raddebugger-driver" test_self_host --config Release 2>&1 | tee build/raddebugger-self-host.log
      - name: Retain baseline evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raddebugger-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/raddebugger-self-host.log
          if-no-files-found: warn
          retention-days: 14
