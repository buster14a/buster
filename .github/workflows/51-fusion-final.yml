name: 51 fusion final correctness
on:
  push:
    branches: [astra/51-fusion-final-20260924]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      head: ${{ steps.patch.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: patch
        name: Restore frozen fixture and register identical runtime case inline
        shell: bash
        run: |
          set -euo pipefail
          cat <<'PATCH' | base64 -d | gzip -d > /tmp/51-fixture.patch
          
          PATCH
          echo 'a6b030cf0e98c2a883377960dbb2e1c051595efda4dc84e02f00302cb59e161f  /tmp/51-fixture.patch' | sha256sum -c -
          expected=2b1be719eb6df68a43f6649aef064f3df9cfdf5d
          test "$(git ls-remote --heads origin refs/heads/astra/51-fusion-20260924 | cut -f1)" = "$expected"
          git switch --detach "$expected"
          git apply --check /tmp/51-fixture.patch
          git apply /tmp/51-fixture.patch
          git diff --check
          echo 'ab7c10f28f105c012f3624b624193c5e37da51b59350d71f355b48f565fb62e0  tests/basic_c_macro_task_batches.c' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/basic_c_macro_task_batches.c src/buster/tests/compiler/driver/driver_test.c
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'test: register fusion runtime coverage without changing frozen fixture (#51)'
          git rev-parse HEAD HEAD^{tree}
          git push origin HEAD:refs/heads/astra/51-fusion-20260924
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  correctness:
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      BUSTER_TEST_JOBS: '2'
      BASE: 5d1c314a8ee3c5f9fb713f6afb85ab1e795f44a0
      HEAD: ${{ needs.publish.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install existing Linux link dependency
        run: sudo apt-get update -qq && sudo apt-get install -y mold
      - name: Check frozen fixture and inline regression identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/oracles
          git rev-parse HEAD HEAD^{tree} > evidence/final-source.txt
          git diff "$BASE" -- tests/basic_c_macro_task_batches.c > evidence/frozen-fixture.diff
          test ! -s evidence/frozen-fixture.diff
          python3 - <<'PY'
          from pathlib import Path
          import ast, hashlib
          source = Path('src/buster/tests/compiler/driver/driver_test.c').read_text()
          block = source.split('String8 macro_fusion_source = S8(\n',1)[1].split('    );',1)[0]
          text = ''.join(ast.literal_eval(line.strip()) for line in block.splitlines())
          data = text.encode()
          assert hashlib.sha256(data).hexdigest() == '76d12b5b4b3d17d5393f4e8b600ae43fb70fdf0584d7a0e58fb8894ef3953353'
          Path('evidence/oracles/fusion-runtime.c').write_bytes(data)
          PY
          sha256sum evidence/oracles/fusion-runtime.c tests/basic_c_macro_task_batches.c > evidence/fixture-identities.txt
      - name: Matched serial baseline and final-head builds
        shell: bash
        run: |
          set -euo pipefail
          clang --version | tee evidence/clang.txt
          git checkout --detach "$BASE"
          git rev-parse HEAD HEAD^{tree} > evidence/base-source.txt
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o "$RUNNER_TEMP/51-final-build"
          "$RUNNER_TEMP/51-final-build" generate --config Release --cc clang --ci -DBUSTER_UNITY_BUILD=OFF -DBUSTER_INCLUDE_TESTS=ON 2>&1 | tee evidence/configure.log
          "$RUNNER_TEMP/51-final-build" build --config Release -t ide -- -j2 2>&1 | tee evidence/base-build.log
          cp build/Release/ide evidence/base-ide
          git checkout --detach "$HEAD"
          "$RUNNER_TEMP/51-final-build" build --config Release -t ide -- -j2 2>&1 | tee evidence/final-build.log
          cp build/Release/ide evidence/final-ide
          cp build/compile_commands.json evidence/compile-commands.json
          cp build/CMakeCache.txt evidence/CMakeCache.txt
          sha256sum evidence/*-ide > evidence/compiler-identities.txt
          git diff --check
      - name: Complete preprocessing and independent runtime equivalence
        shell: bash
        run: |
          set -euo pipefail
          for source in tests/basic_c_macro*.c evidence/oracles/fusion-runtime.c; do
            stem=$(basename "$source" .c)
            evidence/base-ide cc -E "$source" -o "evidence/oracles/$stem.base.i"
            evidence/final-ide cc -E "$source" -o "evidence/oracles/$stem.final.i"
            cmp "evidence/oracles/$stem.base.i" "evidence/oracles/$stem.final.i"
          done
          source=evidence/oracles/fusion-runtime.c
          clang -std=c17 "$source" -o evidence/oracles/clang-oracle
          evidence/oracles/clang-oracle
          for compiler in base final; do
            for mode in none mir-stack fast quality; do
              for ssa in -ffrontend-ssa -fno-frontend-ssa; do
                out="evidence/oracles/$compiler-$mode$ssa"
                "evidence/$compiler-ide" cc -g0 "$ssa" -fregister-allocator="$mode" "$source" -o "$out"
                "$out"
              done
            done
          done
          sha256sum evidence/oracles/* > evidence/oracle-identities.txt
          echo 'PASS: six complete preprocessing comparisons, Clang oracle, and sixteen Buster compile/run cells' | tee evidence/oracles-result.txt
      - name: Registered full final-head suite including inline fusion case
        shell: bash
        run: |
          set -euo pipefail
          evidence/final-ide test --verbose=1 --ci=1 2>&1 | tee evidence/final-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 51-fusion-final-${{ github.run_id }}
          path: evidence
          retention-days: 14
          if-no-files-found: error
