name: Native retirement rebinding

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-retirement-rebind.yml'
      - 'docs/native-retirement-rebinding.md'
      - 'docs/native-retirement-census.md'
      - 'docs/native-retirement-dependencies-v1.json'
      - 'docs/native-retirement-sdks-v1.json'
      - 'tools/native_retirement_rebind.py'
      - 'tools/native_retirement_rebind_contract.py'
      - 'tools/native_retirement_rebind_test.py'
      - 'tools/native_retirement_materializer.py'
      - 'tools/native_retirement_materializer_test.py'
      - 'tools/native_retirement_external.py'
      - 'tools/native_retirement_sdks.py'
      - 'tools/native_retirement_census.c'
      - 'tools/native_retirement_contract.py'
      - 'tools/native_retirement_contract_test.py'
      - 'tools/native-retirement-mingw/**'
      - 'src/buster/lib/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-retirement-rebind.yml'
      - 'docs/native-retirement-rebinding.md'
      - 'docs/native-retirement-census.md'
      - 'docs/native-retirement-dependencies-v1.json'
      - 'docs/native-retirement-sdks-v1.json'
      - 'tools/native_retirement_rebind.py'
      - 'tools/native_retirement_rebind_contract.py'
      - 'tools/native_retirement_rebind_test.py'
      - 'tools/native_retirement_materializer.py'
      - 'tools/native_retirement_materializer_test.py'
      - 'tools/native_retirement_external.py'
      - 'tools/native_retirement_sdks.py'
      - 'tools/native_retirement_census.c'
      - 'tools/native_retirement_contract.py'
      - 'tools/native_retirement_contract_test.py'
      - 'tools/native-retirement-mingw/**'
      - 'src/buster/lib/**'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: native-retirement-rebind-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'merge_group' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: write

jobs:
  unit:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Rebind unit (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exercise deterministic reconstruction and failure controls
        run: |
          python3 --version
          python3 tools/native_retirement_rebind_test.py -v
          python3 tools/native_retirement_materializer.py self-test
          python3 tools/native_retirement_materializer_test.py -v

  repository:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Rebind complete pinned closure
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check out pinned cJSON closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DaveGamble/cJSON
          ref: c859b25da02955fef659d658b8f324b5cde87be3
          path: external/cjson
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned DoomGeneric closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ozkl/doomgeneric
          ref: dcb7a8dbc7a16ce3dda29382ac9aae9d77d21284
          path: external/doom
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned LZ4 closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lz4/lz4
          ref: ebb370ca83af193212df4dcbadcc5d87bc0de2f0
          path: external/lz4
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned yyjson closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ibireme/yyjson
          ref: 8b4a38dc994a110abaec8a400615567bd996105f
          path: external/yyjson
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned stb closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nothings/stb
          ref: 2c980bb59875b0d32144a71867fbdebb2f77cd20
          path: external/stb
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned zlib closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: madler/zlib
          ref: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          path: external/zlib
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned musl closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ifduyue/musl
          ref: 9fa28ece75d8a2191de7c5bb53bed224c5947417
          path: external/musl
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare pinned SDK and external inputs
        run: |
          python3 tools/native_retirement_sdks.py --source-root "$(pwd)"
          set +e
          python3 tools/native_retirement_external.py prepare \
            --manifest docs/native-retirement-dependencies-v1.json \
            --source-root "$(pwd)" \
            2>"$RUNNER_TEMP/native-retirement-external-preflight.err"
          status=$?
          set -e
          if test "$status" -ne 0; then
            if ! grep -q '^native-retirement external closure failure: external closure source identity mismatch: src/buster/lib/' \
              "$RUNNER_TEMP/native-retirement-external-preflight.err"; then
              cat "$RUNNER_TEMP/native-retirement-external-preflight.err" >&2
              exit "$status"
            fi
          fi
      - name: Refresh exact combined repository bindings
        run: |
          mkdir -p "$RUNNER_TEMP/native-retirement-rebind"
          python3 tools/native_retirement_rebind.py refresh --repo-root "$(pwd)" \
            | tee "$RUNNER_TEMP/native-retirement-rebind/refresh.json"
          python3 tools/native_retirement_external.py prepare \
            --manifest docs/native-retirement-dependencies-v1.json \
            --source-root "$(pwd)"
          python3 tools/native_retirement_rebind.py check --repo-root "$(pwd)" \
            | tee "$RUNNER_TEMP/native-retirement-rebind/check.json"
      - name: Commit refreshed bindings to PR branch
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/native-retirement-dependencies-v1.json \
            docs/native-retirement-census.md \
            tools/native_retirement_census.c \
            tools/native_retirement_contract.py
          if ! git diff --cached --quiet; then
            git commit -m "ci: refresh native retirement bindings for #791"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"${GITHUB_HEAD_REF}"
          fi
      - name: Run independent contract suite
        run: |
          python3 tools/native_retirement_contract.py self-test
          python3 tools/native_retirement_contract_test.py -v
      - name: Retain rebind diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-retirement-rebind-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-retirement-rebind
          if-no-files-found: error
          retention-days: 7
