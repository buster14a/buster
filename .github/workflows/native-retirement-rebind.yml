name: Native retirement rebinding

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-retirement-contract.yml'
      - '.github/workflows/native-retirement-integration.yml'
      - '.github/workflows/native-retirement-rebind.yml'
      - 'AGENTS.md'
      - 'docs/agents/workflow.md'
      - 'docs/native-retirement-rebinding.md'
      - 'docs/native-retirement-census.md'
      - 'docs/native-retirement-materializer.md'
      - 'docs/native-retirement-dependencies-v1.json'
      - 'docs/native-retirement-dependencies-legacy-v1.json'
      - 'docs/native-retirement-repository-sources-v1.json'
      - 'docs/native-retirement-sdks-v1.json'
      - 'tests/ci_tools_test.py'
      - 'tools/native_retirement_dependency_binding.py'
      - 'tools/native_retirement_dependency_binding.generated.h'
      - 'tools/native_retirement_dependency_binding_test.py'
      - 'tools/native_retirement_integration.py'
      - 'tools/native_retirement_integration_test.py'
      - 'tools/native_retirement_rebind.py'
      - 'tools/native_retirement_rebind_contract.py'
      - 'tools/native_retirement_rebind_test.py'
      - 'tools/native_retirement_materializer.py'
      - 'tools/native_retirement_materializer_test.py'
      - 'tools/native_retirement_external.py'
      - 'tools/native_retirement_sdks.py'
      - 'tools/native_retirement_census.c'
      - 'tools/native_retirement_contract.py'
      - 'tools/native_retirement_contract_test.py'
      - 'tools/native-retirement-mingw/**'
      - 'tools/native-retirement-darwin/**'
      - 'src/buster/lib/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-retirement-contract.yml'
      - '.github/workflows/native-retirement-integration.yml'
      - '.github/workflows/native-retirement-rebind.yml'
      - 'docs/native-retirement-rebinding.md'
      - 'docs/native-retirement-dependencies-v1.json'
      - 'docs/native-retirement-dependencies-legacy-v1.json'
      - 'docs/native-retirement-repository-sources-v1.json'
      - 'docs/native-retirement-sdks-v1.json'
      - 'tools/native_retirement_dependency_binding.py'
      - 'tools/native_retirement_dependency_binding.generated.h'
      - 'tools/native_retirement_integration.py'
      - 'tools/native_retirement_integration_test.py'
      - 'tools/native_retirement_rebind.py'
      - 'tools/native_retirement_rebind_contract.py'
      - 'tools/native_retirement_materializer.py'
      - 'tools/native_retirement_external.py'
      - 'tools/native_retirement_sdks.py'
      - 'tools/native_retirement_census.c'
      - 'tools/native_retirement_contract.py'
      - 'tools/native-retirement-mingw/**'
      - 'tools/native-retirement-darwin/**'
      - 'src/buster/lib/**'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: native-retirement-rebind-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'merge_group' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: read

jobs:
  unit:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Rebind unit (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise deterministic reconstruction and ownership controls
        run: |
          python3 --version
          python3 tools/native_retirement_dependency_binding_test.py -v
          python3 tools/native_retirement_integration_test.py -v
          python3 tools/native_retirement_merge_gate_test.py -v
          python3 tools/native_retirement_rebind_test.py -v
          python3 tools/native_retirement_materializer.py self-test
          python3 tools/native_retirement_materializer_test.py -v

  repository:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Reconstruct candidate closure ephemerally
    runs-on: ubuntu-26.04
    timeout-minutes: 310
    env:
      TRUSTED_REF: ${{ github.event.merge_group.base_sha || github.sha }}
      CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - name: Check out exact candidate or merge revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the previously trusted rebinder revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'main' || env.TRUSTED_REF }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      # Pinned closures are checked out into candidate/external before a merge
      # group is admitted, so the reserved-root check must run here, on the
      # pristine candidate checkout, for every event.
      - name: Reject candidate-controlled checkout destinations
        run: |
          set -euo pipefail
          for relative in external .native-retirement-trusted; do
            path="$GITHUB_WORKSPACE/candidate/$relative"
            if [[ -e "$path" || -L "$path" ]]; then
              echo "error: candidate controls reserved materialization root '$relative'" >&2
              exit 1
            fi
          done
      - name: Reject feature-owned generated state and classify trust transitions
        id: admission
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          classifier="$GITHUB_WORKSPACE/trusted/tools/native_retirement_integration.py"
          if [[ ! -f "$classifier" ]]; then
            classifier="$GITHUB_WORKSPACE/candidate/tools/native_retirement_integration.py"
          fi
          gate="$GITHUB_WORKSPACE/trusted/tools/native_retirement_merge_gate.py"
          if [[ ! -f "$gate" ]]; then
            gate="$GITHUB_WORKSPACE/candidate/tools/native_retirement_merge_gate.py"
          fi
          # Bind PR admission to the independently checked-out live policy. The
          # queue lands PRs every few minutes, so main can advance after the
          # trusted checkout; re-resolve against the new main a bounded number
          # of times instead of failing the candidate (#1971).
          current_main=$(git -C candidate ls-remote --refs origin refs/heads/main | cut -f1)
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          base=$(git -C trusted rev-parse HEAD)
          attempts=1
          while [[ "$base" != "$current_main" ]]; do
            if (( attempts >= 3 )); then
              echo '::error::Main kept advancing after trusted PR policy checkout.' >&2
              exit 1
            fi
            attempts=$((attempts + 1))
            echo "::notice::Main advanced from $base to $current_main; re-resolving trusted PR policy."
            git -C trusted fetch --quiet --no-tags --depth 1 origin "$current_main"
            git -C trusted checkout --quiet --force --detach "$current_main"
            base=$(git -C trusted rev-parse HEAD)
            current_main=$(git -C candidate ls-remote --refs origin refs/heads/main | cut -f1)
            [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          done
          # candidate/ was fetched before trusted/ resolved main, so a push
          # landing between the two checkouts leaves that main missing from
          # candidate/ even when the loop above never runs (#2010).
          if ! git -C candidate cat-file -e "$base^{commit}" 2>/dev/null; then
            git -C candidate fetch --quiet --no-tags origin "$base"
          fi
          rows="$RUNNER_TEMP/native-retirement-status-rows.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_HEAD?per_page=100" > "$rows"
          python3 - "$CANDIDATE_HEAD" "$rows" "$RUNNER_TEMP/native-retirement-status.json" <<'PY_STATUS'
          import json, pathlib, sys
          head, rows_path, output_path = sys.argv[1:]
          pages = json.loads(pathlib.Path(rows_path).read_text())
          if not isinstance(pages, list) or not all(isinstance(page, list) for page in pages):
              raise SystemExit("commit status pages are not arrays")
          rows = [row for page in pages for row in page]
          pathlib.Path(output_path).write_text(json.dumps({"sha": head, "statuses": rows}))
          PY_STATUS
          python3 "$gate" check \
            --repo-root "$GITHUB_WORKSPACE/candidate" \
            --base "$base" \
            --head "$CANDIDATE_HEAD" \
            --current-main "$current_main" \
            --event "$EVENT_NAME" \
            --allow-pending \
            --status-json "$RUNNER_TEMP/native-retirement-status.json" \
            | tee "$RUNNER_TEMP/native-retirement-admission.json"
          mode=$(python3 - "$RUNNER_TEMP/native-retirement-admission.json" <<'PY'
          import json, pathlib, sys
          print(json.loads(pathlib.Path(sys.argv[1]).read_text())["mode"])
          PY
          )
          catch_up=$(python3 - "$RUNNER_TEMP/native-retirement-admission.json" <<'PY'
          import json, pathlib, sys
          print("true" if json.loads(pathlib.Path(sys.argv[1]).read_text()).get("catch_up") is True else "false")
          PY
          )
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "catch_up=$catch_up" >> "$GITHUB_OUTPUT"
          if [[ "$mode" != trusted-integration ]]; then
            python3 "$classifier" classify \
              --repo-root "$GITHUB_WORKSPACE/candidate" \
              --base "$base" \
              --head "$CANDIDATE_HEAD" \
              | tee "$RUNNER_TEMP/native-retirement-classification.json"
          fi
      - name: Check out pinned cJSON closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DaveGamble/cJSON
          ref: c859b25da02955fef659d658b8f324b5cde87be3
          path: candidate/external/cjson
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned DoomGeneric closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ozkl/doomgeneric
          ref: dcb7a8dbc7a16ce3dda29382ac9aae9d77d21284
          path: candidate/external/doom
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned LZ4 closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lz4/lz4
          ref: ebb370ca83af193212df4dcbadcc5d87bc0de2f0
          path: candidate/external/lz4
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned yyjson closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ibireme/yyjson
          ref: 8b4a38dc994a110abaec8a400615567bd996105f
          path: candidate/external/yyjson
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned stb closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nothings/stb
          ref: 2c980bb59875b0d32144a71867fbdebb2f77cd20
          path: candidate/external/stb
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned zlib closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: madler/zlib
          ref: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          path: candidate/external/zlib
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned musl closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ifduyue/musl
          ref: 9fa28ece75d8a2191de7c5bb53bed224c5947417
          path: candidate/external/musl
          fetch-depth: 1
          persist-credentials: false
      # Archives are content-addressed and re-verified against the pinned
      # sha256 before use, so a cache entry can only skip the download.
      - name: Restore pinned SDK archives
        id: sdk_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/native-retirement-sdk-archives
          key: native-retirement-sdk-archives-v1-${{ hashFiles('candidate/docs/native-retirement-sdks-v1.json') }}
      - name: Prepare pinned SDK and external inputs with trusted code
        run: |
          python3 trusted/tools/native_retirement_sdks.py \
            --source-root "$GITHUB_WORKSPACE/candidate" \
            --cache-directory "$RUNNER_TEMP/native-retirement-sdk-archives"
          python3 trusted/tools/native_retirement_external.py prepare \
            --manifest "$GITHUB_WORKSPACE/candidate/docs/native-retirement-dependencies-v1.json" \
            --source-root "$GITHUB_WORKSPACE/candidate"
      - name: Save pinned SDK archives
        if: ${{ steps.sdk_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/native-retirement-sdk-archives
          key: native-retirement-sdk-archives-v1-${{ hashFiles('candidate/docs/native-retirement-sdks-v1.json') }}
      # Reconstruction is read-only, so it runs on the speculative group as
      # soon as the group exists (#1893). Only the cheap identity/policy wait
      # and the admission gate below run after the predecessor lands.
      - name: Reconstruct the exact candidate or group state ephemerally
        id: reconstruction
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/native-retirement-rebind"
          mkdir -p "$out"
          committed=0
          python3 trusted/tools/native_retirement_rebind.py check \
            --repo-root "$GITHUB_WORKSPACE/candidate" \
            > "$out/committed-check.json" || committed=$?
          if [[ "$committed" -ne 0 && "$committed" -ne 2 ]]; then
            cat "$out/committed-check.json"
            exit "$committed"
          fi
          if [[ "$committed" -eq 0 ]]; then
            echo "committed_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed_current=false" >> "$GITHUB_OUTPUT"
          fi
          python3 trusted/tools/native_retirement_rebind.py refresh \
            --repo-root "$GITHUB_WORKSPACE/candidate" \
            | tee "$out/refresh.json"
          python3 trusted/tools/native_retirement_rebind.py check \
            --repo-root "$GITHUB_WORKSPACE/candidate" \
            | tee "$out/check.json"
          python3 candidate/tools/native_retirement_rebind.py check \
            --repo-root "$GITHUB_WORKSPACE/candidate" \
            | tee "$out/candidate-check.json"
          unexpected=$(git -C candidate diff --name-only -- . \
            ':(exclude)docs/native-retirement-repository-sources-v1.json' \
            ':(exclude)tools/native_retirement_dependency_binding.generated.h')
          test -z "$unexpected"
          if [[ "$committed" -eq 2 && ( '${{ github.event_name }}' == push || '${{ github.event_name }}' == workflow_dispatch ) ]]; then
            # Ordinary-bound merges land before their catch-up (#1893). The
            # committed pair is behind but was reconstructed above.
            echo '::warning::Committed native-retirement generated state is behind main; a trusted catch-up is pending.'
          fi
      - name: Run independent contract suite against the ephemeral binding
        working-directory: candidate
        run: |
          python3 tools/native_retirement_contract.py self-test
          python3 tools/native_retirement_contract_test.py -v
      - name: Wait for the queued predecessor to land
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B trusted/tools/merge_queue_admission.py wait-base \
            --repo-root "$GITHUB_WORKSPACE/candidate" \
            --trusted-root "$GITHUB_WORKSPACE/trusted" \
            --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" --wait-seconds 18000
      - name: Admit the landed merge group with trusted tools
        id: group_admission
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          classifier="$GITHUB_WORKSPACE/trusted/tools/native_retirement_integration.py"
          gate="$GITHUB_WORKSPACE/trusted/tools/native_retirement_merge_gate.py"
          current_main=$(git -C candidate ls-remote --refs origin refs/heads/main | cut -f1)
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          # The queued base has landed (previous step); the gate checks it is live main.
          base="$TRUSTED_REF"
          python3 "$gate" check \
            --repo-root "$GITHUB_WORKSPACE/candidate" \
            --base "$base" \
            --head "$CANDIDATE_HEAD" \
            --current-main "$current_main" \
            --event "$EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            | tee "$RUNNER_TEMP/native-retirement-admission.json"
          mode=$(python3 - "$RUNNER_TEMP/native-retirement-admission.json" <<'PY'
          import json, pathlib, sys
          print(json.loads(pathlib.Path(sys.argv[1]).read_text())["mode"])
          PY
          )
          catch_up=$(python3 - "$RUNNER_TEMP/native-retirement-admission.json" <<'PY'
          import json, pathlib, sys
          print("true" if json.loads(pathlib.Path(sys.argv[1]).read_text()).get("catch_up") is True else "false")
          PY
          )
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "catch_up=$catch_up" >> "$GITHUB_OUTPUT"
          if [[ "$mode" != trusted-integration-merge-group ]]; then
            # candidate/external now holds the pinned closures, which the
            # classifier's reserved-root check would reject. Classify a
            # pristine worktree of the same head instead; the candidate's own
            # reserved roots were rejected before materialization.
            pristine="$RUNNER_TEMP/native-retirement-classify"
            git -C candidate worktree add --detach "$pristine" "$CANDIDATE_HEAD"
            python3 "$classifier" classify \
              --repo-root "$pristine" \
              --base "$base" \
              --head "$CANDIDATE_HEAD" \
              | tee "$RUNNER_TEMP/native-retirement-classification.json"
            git -C candidate worktree remove --force "$pristine"
          fi
      - name: Require exact current generated state for attested non-catch-up heads
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          MODE: ${{ steps.admission.outputs.mode || steps.group_admission.outputs.mode }}
          CATCH_UP: ${{ steps.admission.outputs.catch_up || steps.group_admission.outputs.catch_up }}
          COMMITTED_CURRENT: ${{ steps.reconstruction.outputs.committed_current }}
        run: |
          set -euo pipefail
          if [[ ( "$MODE" == trusted-integration || "$MODE" == trusted-integration-merge-group ) && "$CATCH_UP" != true ]]; then
            if [[ "$COMMITTED_CURRENT" != true ]]; then
              echo '::error::An attested integration head must carry exactly current generated state.' >&2
              exit 1
            fi
          fi
      - name: Retain read-only reconstruction diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-retirement-rebind-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-retirement-classification.json
            ${{ runner.temp }}/native-retirement-rebind
          if-no-files-found: warn
          retention-days: 7
