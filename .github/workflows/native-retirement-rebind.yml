name: Native retirement rebinding

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-retirement-contract.yml'
      - '.github/workflows/native-retirement-integration.yml'
      - '.github/workflows/native-retirement-rebind.yml'
      - 'AGENTS.md'
      - 'docs/agents/workflow.md'
      - 'docs/native-retirement-rebinding.md'
      - 'docs/native-retirement-census.md'
      - 'docs/native-retirement-materializer.md'
      - 'docs/native-retirement-dependencies-v1.json'
      - 'docs/native-retirement-dependencies-legacy-v1.json'
      - 'docs/native-retirement-repository-sources-v1.json'
      - 'docs/native-retirement-sdks-v1.json'
      - 'tests/ci_tools_test.py'
      - 'tools/native_retirement_dependency_binding.py'
      - 'tools/native_retirement_dependency_binding.generated.h'
      - 'tools/native_retirement_dependency_binding_test.py'
      - 'tools/native_retirement_integration.py'
      - 'tools/native_retirement_integration_test.py'
      - 'tools/native_retirement_rebind.py'
      - 'tools/native_retirement_rebind_contract.py'
      - 'tools/native_retirement_rebind_test.py'
      - 'tools/native_retirement_materializer.py'
      - 'tools/native_retirement_materializer_test.py'
      - 'tools/native_retirement_external.py'
      - 'tools/native_retirement_sdks.py'
      - 'tools/native_retirement_census.c'
      - 'tools/native_retirement_contract.py'
      - 'tools/native_retirement_contract_test.py'
      - 'tools/native-retirement-mingw/**'
      - 'src/buster/lib/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-retirement-contract.yml'
      - '.github/workflows/native-retirement-integration.yml'
      - '.github/workflows/native-retirement-rebind.yml'
      - 'docs/native-retirement-rebinding.md'
      - 'docs/native-retirement-dependencies-v1.json'
      - 'docs/native-retirement-dependencies-legacy-v1.json'
      - 'docs/native-retirement-repository-sources-v1.json'
      - 'docs/native-retirement-sdks-v1.json'
      - 'tools/native_retirement_dependency_binding.py'
      - 'tools/native_retirement_dependency_binding.generated.h'
      - 'tools/native_retirement_integration.py'
      - 'tools/native_retirement_integration_test.py'
      - 'tools/native_retirement_rebind.py'
      - 'tools/native_retirement_rebind_contract.py'
      - 'tools/native_retirement_materializer.py'
      - 'tools/native_retirement_external.py'
      - 'tools/native_retirement_sdks.py'
      - 'tools/native_retirement_census.c'
      - 'tools/native_retirement_contract.py'
      - 'tools/native-retirement-mingw/**'
      - 'src/buster/lib/**'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: native-retirement-rebind-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'merge_group' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: read

jobs:
  unit:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Rebind unit (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise deterministic reconstruction and ownership controls
        run: |
          python3 --version
          python3 tools/native_retirement_dependency_binding_test.py -v
          python3 tools/native_retirement_integration_test.py -v
          python3 tools/native_retirement_merge_gate_test.py -v
          python3 tools/native_retirement_rebind_test.py -v
          python3 tools/native_retirement_materializer.py self-test
          python3 tools/native_retirement_materializer_test.py -v

  repository:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Reconstruct candidate closure ephemerally
    runs-on: ubuntu-26.04
    timeout-minutes: 310
    env:
      TRUSTED_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
      CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - name: Check out exact candidate or merge revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the previously trusted rebinder revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'merge_group' && 'main' || env.TRUSTED_REF }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Wait for the queued predecessor to land
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B trusted/tools/merge_queue_admission.py wait-base \
            --repo-root "$GITHUB_WORKSPACE/candidate" \
            --trusted-root "$GITHUB_WORKSPACE/trusted" \
            --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" --wait-seconds 18000
      - name: Reject feature-owned generated state and classify trust transitions
        id: admission
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          classifier="$GITHUB_WORKSPACE/trusted/tools/native_retirement_integration.py"
          if [[ ! -f "$classifier" ]]; then
            classifier="$GITHUB_WORKSPACE/candidate/tools/native_retirement_integration.py"
          fi
          gate="$GITHUB_WORKSPACE/trusted/tools/native_retirement_merge_gate.py"
          if [[ ! -f "$gate" ]]; then
            gate="$GITHUB_WORKSPACE/candidate/tools/native_retirement_merge_gate.py"
          fi
          current_main=$(git -C candidate ls-remote --refs origin refs/heads/main | cut -f1)
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          status_args=()
          if [[ "$EVENT_NAME" == pull_request ]]; then
            rows="$RUNNER_TEMP/native-retirement-status-rows.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_HEAD?per_page=100" > "$rows"
            python3 - "$CANDIDATE_HEAD" "$rows" "$RUNNER_TEMP/native-retirement-status.json" <<'PY_STATUS'
          import json, pathlib, sys
          head, rows_path, output_path = sys.argv[1:]
          pages = json.loads(pathlib.Path(rows_path).read_text())
          if not isinstance(pages, list) or not all(isinstance(page, list) for page in pages):
              raise SystemExit("commit status pages are not arrays")
          rows = [row for page in pages for row in page]
          pathlib.Path(output_path).write_text(json.dumps({"sha": head, "statuses": rows}))
          PY_STATUS
            status_args=(--status-json "$RUNNER_TEMP/native-retirement-status.json")
          elif [[ "$EVENT_NAME" == merge_group ]]; then
            status_args=(--repository "$GITHUB_REPOSITORY")
          fi
          python3 "$gate" check \
            --repo-root "$GITHUB_WORKSPACE/candidate" \
            --base "$TRUSTED_REF" \
            --head "$CANDIDATE_HEAD" \
            --current-main "$current_main" \
            --event "$EVENT_NAME" \
            --allow-pending \
            "${status_args[@]}" \
            | tee "$RUNNER_TEMP/native-retirement-admission.json"
          mode=$(python3 - "$RUNNER_TEMP/native-retirement-admission.json" <<'PY'
          import json, pathlib, sys
          print(json.loads(pathlib.Path(sys.argv[1]).read_text())["mode"])
          PY
          )
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [[ "$mode" != trusted-integration && "$mode" != trusted-integration-merge-group ]]; then
            python3 "$classifier" classify \
              --repo-root "$GITHUB_WORKSPACE/candidate" \
              --base "$TRUSTED_REF" \
              --head "$CANDIDATE_HEAD" \
              | tee "$RUNNER_TEMP/native-retirement-classification.json"
          fi
      - name: Check out pinned cJSON closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DaveGamble/cJSON
          ref: c859b25da02955fef659d658b8f324b5cde87be3
          path: candidate/external/cjson
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned DoomGeneric closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ozkl/doomgeneric
          ref: dcb7a8dbc7a16ce3dda29382ac9aae9d77d21284
          path: candidate/external/doom
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned LZ4 closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lz4/lz4
          ref: ebb370ca83af193212df4dcbadcc5d87bc0de2f0
          path: candidate/external/lz4
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned yyjson closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ibireme/yyjson
          ref: 8b4a38dc994a110abaec8a400615567bd996105f
          path: candidate/external/yyjson
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned stb closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nothings/stb
          ref: 2c980bb59875b0d32144a71867fbdebb2f77cd20
          path: candidate/external/stb
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned zlib closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: madler/zlib
          ref: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          path: candidate/external/zlib
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned musl closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ifduyue/musl
          ref: 9fa28ece75d8a2191de7c5bb53bed224c5947417
          path: candidate/external/musl
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare pinned SDK and external inputs with trusted code
        run: |
          python3 trusted/tools/native_retirement_sdks.py \
            --source-root "$GITHUB_WORKSPACE/candidate"
          python3 trusted/tools/native_retirement_external.py prepare \
            --manifest "$GITHUB_WORKSPACE/candidate/docs/native-retirement-dependencies-v1.json" \
            --source-root "$GITHUB_WORKSPACE/candidate"
      - name: Reconstruct feature state ephemerally or check published main
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-retirement-rebind"
          if [[ '${{ github.event_name }}' == push || '${{ github.event_name }}' == workflow_dispatch || '${{ steps.admission.outputs.mode }}' == trusted-integration || '${{ steps.admission.outputs.mode }}' == trusted-integration-merge-group ]]; then
            python3 trusted/tools/native_retirement_rebind.py check \
              --repo-root "$GITHUB_WORKSPACE/candidate" \
              | tee "$RUNNER_TEMP/native-retirement-rebind/check.json"
            git -C candidate diff --exit-code -- \
              docs/native-retirement-repository-sources-v1.json \
              tools/native_retirement_dependency_binding.generated.h
          else
            python3 trusted/tools/native_retirement_rebind.py refresh \
              --repo-root "$GITHUB_WORKSPACE/candidate" \
              | tee "$RUNNER_TEMP/native-retirement-rebind/refresh.json"
            python3 trusted/tools/native_retirement_rebind.py check \
              --repo-root "$GITHUB_WORKSPACE/candidate" \
              | tee "$RUNNER_TEMP/native-retirement-rebind/check.json"
            python3 candidate/tools/native_retirement_rebind.py check \
              --repo-root "$GITHUB_WORKSPACE/candidate" \
              | tee "$RUNNER_TEMP/native-retirement-rebind/candidate-check.json"
            unexpected=$(git -C candidate diff --name-only -- . \
              ':(exclude)docs/native-retirement-repository-sources-v1.json' \
              ':(exclude)tools/native_retirement_dependency_binding.generated.h')
            test -z "$unexpected"
          fi
      - name: Run independent contract suite against the ephemeral binding
        working-directory: candidate
        run: |
          python3 tools/native_retirement_contract.py self-test
          python3 tools/native_retirement_contract_test.py -v
      - name: Retain read-only reconstruction diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-retirement-rebind-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-retirement-classification.json
            ${{ runner.temp }}/native-retirement-rebind
          if-no-files-found: warn
          retention-days: 7
