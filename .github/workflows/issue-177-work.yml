name: Issue 177 isolated workspace
on:
  push:
    branches: [chatgpt/177-frame-pointer-policy-work]
    paths: [.github/workflows/issue-177-work.yml, issue-177.patch]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Package tracked public source for this issue's implementation
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git archive --format=tar HEAD | gzip -1 > "$RUNNER_TEMP/issue-177-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-177-source
          path: ${{ runner.temp }}/issue-177-source.tar.gz
          retention-days: 1
          if-no-files-found: error
