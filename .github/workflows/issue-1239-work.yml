# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Temporary user-directed correctness validation; removed before final PR.
name: Issue 1239 workspace
on:
  push:
    branches: [fix/1239-fp-contract]
    paths: [.github/workflows/issue-1239-work.yml]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install the repository's official hosted toolchain
        run: bash tools/ci/setup-hosted.sh
      - name: Install audio fixture generator
        run: sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build compiler
        id: build
        shell: bash
        run: BUSTER_HOST_ARCH=x86-64 ./build.sh 2>&1 | tee "$RUNNER_TEMP/issue-1239-build.txt"
      - name: Focused contraction driver regression
        id: driver
        shell: bash
        run: ./build/compiler test-checker-driver --part 3/64 --executable ./build/compiler 2>&1 | tee "$RUNNER_TEMP/issue-1239-driver.txt"
      - name: Decode pinned corpora against Clang
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: bash .github/issue-1239-corpus.sh 2>&1 | tee "$RUNNER_TEMP/issue-1239-corpus.txt"
      - name: Full checker regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: ./build/compiler test-checker 2>&1 | tee "$RUNNER_TEMP/issue-1239-checker.txt"
      - name: Tier 0 differential regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: ./build/compiler test-tier0 --cross-check 2>&1 | tee "$RUNNER_TEMP/issue-1239-tier0.txt"
      - name: Retain validation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1239-acceptance
          path: |
            ${{ runner.temp }}/issue-1239-*.txt
            ${{ runner.temp }}/issue-1239-corpus/results.txt
            ${{ runner.temp }}/issue-1239-corpus/statuses.txt
            ${{ runner.temp }}/issue-1239-corpus/revisions.txt
            ${{ runner.temp }}/issue-1239-corpus/cpu.txt
          retention-days: 7
