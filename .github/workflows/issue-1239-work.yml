# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Temporary user-directed implementation workspace; removed before final PR.
name: Issue 1239 workspace
on:
  push:
    branches: [fix/1239-fp-contract]
    paths: [.github/workflows/issue-1239-work.yml]
permissions:
  contents: write
jobs:
  validation:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
      - name: Apply and publish the session's implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/1239-fp-contract
          git apply --check .github/issue-1239.patch
          git apply .github/issue-1239.patch
          git rm .github/issue-1239.patch
          git add src docs tests
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sh .githooks/enable-sign-off.sh --maintainer-session
          git commit -m 'fix: contract scalar floating expressions within their source boundaries' -m 'Implementation authored by OpenAI / GPT-6 Astra Pro in the user-directed #1239 session; published by this isolated validation job.'
          git log -1 --format=full
          git push origin HEAD:refs/heads/fix/1239-fp-contract
      - name: Install the repository's official hosted toolchain
        run: bash tools/ci/setup-hosted.sh
      - name: Build baseline host compiler
        run: BUSTER_HOST_ARCH=x86-64 ./build.sh 2>&1 | tee "$RUNNER_TEMP/issue-1239-build.txt"
      - name: Compare basic contractions with Clang
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/fp-check"
          mkdir "$work"
          cat > "$work/basic.c" <<'EOF'
          extern int printf(const char *, ...);
          float f(float a,float b,float c){return a*b+c;}
          float r(float a,float b,float c){return c-a*b;}
          double g(double a,double b,double c){return a*b+c;}
          double h(double a,double b,double c){c+=a*b;return c;}
          int main(void){union{float f;unsigned u;}a,b,c,x;union{double f;unsigned long u;}d,e,k,y;a.u=0x3f800001;b.u=0x3f7ffffe;c.u=0xbf800000;d.u=0x3ff0000000000001UL;e.u=0x3feffffffffffffeUL;k.u=0xbff0000000000000UL;x.f=f(a.f,b.f,c.f);printf("%08x\n",x.u);x.f=r(a.f,b.f,-c.f);printf("%08x\n",x.u);y.f=g(d.f,e.f,k.f);printf("%016lx\n",y.u);y.f=h(d.f,e.f,k.f);printf("%016lx\n",y.u);return 0;}
          EOF
          for mode in on off fast; do
            clang -O0 -march=x86-64-v3 -ffp-contract="$mode" "$work/basic.c" -o "$work/oracle"
            "$work/oracle" > "$work/oracle-$mode.txt"
            ./build/compiler -march=x86-64-v3 -ffp-contract="$mode" -c "$work/basic.c" -o "$work/buster.o"
            clang "$work/buster.o" -o "$work/object"
            "$work/object" > "$work/object-$mode.txt"
            ./build/compiler -march=x86-64-v3 -ffp-contract="$mode" "$work/basic.c" -o "$work/direct"
            "$work/direct" > "$work/direct-$mode.txt"
            diff -u "$work/oracle-$mode.txt" "$work/object-$mode.txt"
            diff -u "$work/oracle-$mode.txt" "$work/direct-$mode.txt"
          done
      - name: Retain validation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1239-validation
          path: |
            ${{ runner.temp }}/issue-1239-build.txt
            ${{ runner.temp }}/fp-check/
          retention-days: 1
