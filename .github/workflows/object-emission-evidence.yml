# Temporary research workflow for audit 2026-09-27T021030Z. It repeats the
# object-emission evidence on a GitHub-hosted runner and is removed before the
# pull request leaves draft. Exact counts decide; nothing here is timed.
name: Object emission evidence (research)

on:
  push:
    branches:
      - claude/object-emission-redesign-bw04a1
    paths:
      - .github/workflows/object-emission-evidence.yml

permissions:
  contents: read

concurrency:
  group: object-emission-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      BASE: ade6ac4b6ecb21f30b61b656439bac476c145e2f
      EVIDENCE: docs/performance-audits/evidence/2026-09-27T021030Z
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identities and tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          # The pinned LLVM 18 readers and linker stay off PATH so the
          # hosted Clang still builds the compiler.
          python3 tools/ci_apt.py gpu --out "$RUNNER_TEMP/gpu-apt"
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mold
          {
            echo "candidate $(git rev-parse HEAD) tree $(git rev-parse 'HEAD^{tree}')"
            echo "base $(git rev-parse "$BASE") tree $(git rev-parse "$BASE^{tree}")"
            uname -a; nproc; grep -m1 'model name' /proc/cpuinfo || true
            clang --version | head -1
            /usr/lib/llvm-18/bin/ld.lld --version; /usr/lib/llvm-18/bin/llvm-readelf --version | head -3
            readelf --version | head -1; ld --version | head -1; mold --version
          } | tee "$RUNNER_TEMP/out/identities.txt"
      - name: Build base, candidate and the reference probe
        shell: bash
        run: |
          set -euo pipefail
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          git worktree add "$RUNNER_TEMP/probe" HEAD
          python3 "$EVIDENCE/reference_probe.py" "$RUNNER_TEMP/probe"
          git worktree add "$RUNNER_TEMP/census" "$BASE"
          python3 "$EVIDENCE/census_probe.py" "$RUNNER_TEMP/census"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/driver"
          for tree in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/base" "$RUNNER_TEMP/probe" "$RUNNER_TEMP/census"; do
            (cd "$tree" && "$RUNNER_TEMP/driver" generate > /dev/null && "$RUNNER_TEMP/driver" build --config Release -t ide > /dev/null)
          done
      - name: Stage-1 identity and ledgers
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/base"
          for g in g0 g; do
            for label in base candidate probe census; do
              case $label in
                base) ide="$RUNNER_TEMP/base/build/Release/ide" ;;
                candidate) ide="$GITHUB_WORKSPACE/build/Release/ide" ;;
                probe) ide="$RUNNER_TEMP/probe/build/Release/ide" ;;
                census) ide="$RUNNER_TEMP/census/build/Release/ide" ;;
              esac
              "$ide" cc -Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 "-$g" -v -c src/buster/apps/ide/ide.c \
                -o "$RUNNER_TEMP/out/stage1-$label-$g.o" > "$RUNNER_TEMP/out/stage1-$label-$g.log" 2>&1
              grep -E '^(OBJECT_WRITE|OBJECT_PROBE|CODEGEN_EMIT|CODEGEN cpu)' "$RUNNER_TEMP/out/stage1-$label-$g.log" | sed "s/^/$label $g: /"
            done
            for label in candidate probe census; do cmp "$RUNNER_TEMP/out/stage1-base-$g.o" "$RUNNER_TEMP/out/stage1-$label-$g.o"; done
            sha256sum "$RUNNER_TEMP"/out/stage1-*-"$g".o
          done | tee "$RUNNER_TEMP/out/stage1.txt"
      - name: Corpus identity
        shell: bash
        run: |
          set -euo pipefail
          python3 "$EVIDENCE/object_emission_ab.py" generate --output "$RUNNER_TEMP/adversarial"
          python3 "$EVIDENCE/object_emission_ab.py" corpus --base "$RUNNER_TEMP/base/build/Release/ide" \
            --candidate build/Release/ide --output "$RUNNER_TEMP/out/corpus" --extra "$RUNNER_TEMP/adversarial"
      - name: Independent readers, disassembler and linkers
        shell: bash
        run: |
          set -euo pipefail
          python3 "$EVIDENCE/object_emission_ab.py" tools --candidate build/Release/ide --output "$RUNNER_TEMP/out/tools" \
            --extra "$RUNNER_TEMP/adversarial" --llvm-bin /usr/lib/llvm-18/bin
      - name: Adversarial ledgers
        shell: bash
        run: |
          set -euo pipefail
          python3 "$EVIDENCE/object_emission_ab.py" ledger --compilers "$RUNNER_TEMP/probe/build/Release/ide" build/Release/ide \
            --labels old new --inputs "$RUNNER_TEMP"/adversarial/*.c tests/basic_c_call_abi.c --flags=-g0 --flags=-g \
            --output "$RUNNER_TEMP/out/ledger"
      - name: Section-count limit reproduction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/limit"
          python3 "$EVIDENCE/object_emission_ab.py" generate --output "$RUNNER_TEMP/limit" --priorities 16400 --symbols 1 --duplicates 1 --functions 1
          cd "$RUNNER_TEMP/limit"
          set +e
          "$RUNNER_TEMP/base/build/Release/ide" cc -g0 -c adversarial_priority_sections.c -o base.o; echo "base exit $?"
          "$GITHUB_WORKSPACE/build/Release/ide" cc -g0 -c adversarial_priority_sections.c -o candidate.o; echo "candidate exit $?"
          set -e
          readelf -hW base.o | grep -E 'Number of section headers|string table index'
      - name: Candidate test suite
        shell: bash
        run: |
          set -uo pipefail
          build/Release/ide test --verbose=1 --ci=1 > "$RUNNER_TEMP/out/test.log" 2>&1; echo "test exit $?"
          grep -a 'TEST_MODULE_TIMING' "$RUNNER_TEMP/out/test.log" | grep -a -v 'failed=0' || true
          grep -a '^\[' "$RUNNER_TEMP/out/test.log" | tail -3
          grep -a 'failed at' "$RUNNER_TEMP/out/test.log" | sort | uniq -c || true
      - name: Candidate self-host fixed point
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/driver" test_self_host --config Release > "$RUNNER_TEMP/out/self-host.log" 2>&1
          grep -a 'SELF_HOST fixed_point' "$RUNNER_TEMP/out/self-host.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: object-emission-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/out/*.txt
            ${{ runner.temp }}/out/*.log
            ${{ runner.temp }}/out/corpus/corpus.json
            ${{ runner.temp }}/out/tools/tools.json
            ${{ runner.temp }}/out/ledger/ledger.json
          retention-days: 14
          if-no-files-found: warn
