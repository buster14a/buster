name: Issue 1270 isolated workspace
on:
  push:
    branches: [agent/1270-certified-call-save-carry]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Archive the pinned source for the isolated editing sandbox
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/issue-1270-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1270-source
          path: ${{ runner.temp }}/issue-1270-source.tar
          retention-days: 1
          if-no-files-found: error
