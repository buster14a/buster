name: Issue 1270 isolated workspace
on:
  push:
    branches: [agent/1270-certified-call-save-carry]
permissions:
  contents: write
concurrency:
  group: issue-1270-isolated
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: '0'
      BUSTER_LINKER: lld
      SOURCE_DATE_EPOCH: '1792454400'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply the reviewed source patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification"
          sed 's@/YNBjoQ0f@/YNjoQ0f@' .github/issue-1270.patch.gz.b64 | base64 -d | gzip -dc > "$RUNNER_TEMP/qualification/implementation.patch"
          printf '%s  %s\n' f356eb8ca44af8120d96ba4b4e35a521f186a15bd47137a25484388197b7e266 "$RUNNER_TEMP/qualification/implementation.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/qualification/implementation.patch"
          git apply "$RUNNER_TEMP/qualification/implementation.patch"
          git diff --check
          git diff --stat
      - name: Install the repository's pinned hosted toolchain
        run: bash tools/ci/setup-hosted.sh 2>&1 | tee "$RUNNER_TEMP/qualification/setup.log"
      - name: Check the certificate against its independent oracle with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c17 -D_GNU_SOURCE -DBUSTER_CERTIFICATE_STANDALONE -O2 -g -fno-strict-aliasing -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all src/buster/compiler/tier1_certificate_test.c -o "$RUNNER_TEMP/certificate"
          "$RUNNER_TEMP/certificate" 2>&1 | tee "$RUNNER_TEMP/qualification/certificate.log"
      - name: Build the baseline compiler
        id: build
        run: ./build.sh --config Release --jobs 4 2>&1 | tee "$RUNNER_TEMP/qualification/build.log"
      - name: Run focused allocation and emission regressions
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for command in test-tier1-allocation test-tier1-cfg test-tier1-select test-tier1-liveness test-tier1-emit; do ./build/compiler "$command" 2>&1 | tee "$RUNNER_TEMP/qualification/$command.log" || failed=1; done
          ./build/compiler test-tier1-pipeline --cross-check 2>&1 | tee "$RUNNER_TEMP/qualification/test-tier1-pipeline.log" || failed=1
          exit "$failed"
      - name: Verify all Lua sources and the frozen SQLite source
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          unset CPATH C_INCLUDE_PATH
          corpus="$RUNNER_TEMP/corpus"
          bash tools/ci/fetch-corpus.sh "$corpus"
          inputs="$RUNNER_TEMP/inputs"
          mkdir -p "$inputs" "$RUNNER_TEMP/qualification/objects"
          curl --fail --location --retry 3 --output "$inputs/lua.tar.gz" https://www.lua.org/ftp/lua-5.4.8.tar.gz
          printf '%s  %s\n' 4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae "$inputs/lua.tar.gz" | sha256sum --check
          tar -xzf "$inputs/lua.tar.gz" -C "$inputs"
          printf '%s  %s\n' 0a409f1633283fa31a9126b11fbfd64a1991c5d30defad07e5745d4667f5e23d "$corpus/sqlite/sqlite3.c" | sha256sum --check
          options=(--predefines "$corpus/provenance/gnu17-pinned-predefines.txt" --no-default-config --target=x86_64-linux-gnu -march=znver5 -std=gnu17 -nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include")
          count=0
          failed=0
          for source in "$inputs/lua-5.4.8/src/"*.c; do name=$(basename "$source" .c); ./build/compiler -c --tier1 --verify --tier1-report "${options[@]}" "$source" -o "$RUNNER_TEMP/qualification/objects/$name.o" > "$RUNNER_TEMP/qualification/lua-$name.log" 2>&1 || failed=1; count=$((count + 1)); done
          printf 'Lua translation units: %s; failures: %s\n' "$count" "$failed" | tee "$RUNNER_TEMP/qualification/corpus-summary.log"
          size -A "$RUNNER_TEMP/qualification/objects/"*.o > "$RUNNER_TEMP/qualification/lua-sizes.log"
          ./build/compiler -c --tier1 --verify --tier1-report "${options[@]}" "$corpus/sqlite/sqlite3.c" -o "$RUNNER_TEMP/sqlite3.o" 2>&1 | tee "$RUNNER_TEMP/qualification/sqlite.log" || failed=1
          ./build/compiler benchmark-tier1-code-certificate --only check "${options[@]}" "$corpus/sqlite/sqlite3.c" > "$RUNNER_TEMP/qualification/sqlite-certificate.log" 2>&1 || failed=1
          # This hosted run qualifies correctness only. Its timings are not performance evidence.
          rm -rf "$RUNNER_TEMP/qualification/objects"
          test "$count" -eq 34
          exit "$failed"
      - name: Publish only the validated implementation tree on the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = buster14a/buster
          test "$GITHUB_REF_NAME" = agent/1270-certified-call-save-carry
          git rm .github/workflows/agent-1270.yml .github/issue-1270.patch.gz.b64
          git add src/buster/compiler docs
          git config user.name 'OpenAI ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          sh .githooks/enable-sign-off.sh --maintainer-session
          git commit -m 'fix(tier1): certify multiple homes and restore forward call-save row carry' -m 'Implement #1270 with independently proved row facts, order-independent aliases, and positive and mutation regressions.' -m 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>'
          git show --format=full --no-patch HEAD | tee "$RUNNER_TEMP/qualification/commit.log"
          git push origin HEAD:refs/heads/agent/1270-certified-call-save-carry
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-1270-qualification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification
          retention-days: 7
          if-no-files-found: error
