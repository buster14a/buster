name: Scratch watermark research

on:
  push:
    branches: [research/scratch-watermark-20260925-astra]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scratch-watermark-research-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      BUSTER_LINKER: DEFAULT
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Pin an isolated production worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scratch-watermark-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/scratch-watermark-evidence/transport.txt"
          git fetch --no-tags --depth=1 origin ade6ac4b6ecb21f30b61b656439bac476c145e2f
          git worktree add --detach "$RUNNER_TEMP/scratch-watermark-source" ade6ac4b6ecb21f30b61b656439bac476c145e2f
      - name: Build and observe without benchmarks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/investigations/scratch-watermark-20260925/observe.py \
            "$RUNNER_TEMP/scratch-watermark-source" "$RUNNER_TEMP/scratch-watermark-evidence" \
            2>&1 | tee "$RUNNER_TEMP/scratch-watermark-evidence/observer.log"
          git -C "$RUNNER_TEMP/scratch-watermark-source" diff --exit-code > "$RUNNER_TEMP/scratch-watermark-evidence/source-restored.txt"
      - name: Seal complete evidence after observer output closes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/scratch-watermark-evidence"
          source="$RUNNER_TEMP/scratch-watermark-source"
          if [ -d "$source/build/generated" ]; then cp -a "$source/build/generated" "$evidence/generated"; fi
          if [ -f "$source/build/CMakeCache.txt" ]; then cp "$source/build/CMakeCache.txt" "$evidence/CMakeCache.txt"; fi
          git -C "$source" diff --stat > "$evidence/final-source-diff.txt"
          (cd "$evidence"; find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/scratch-watermark-manifest"
          cp "$RUNNER_TEMP/scratch-watermark-manifest" "$evidence/SHA256SUMS"
      - name: Retain raw outcomes including failed attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scratch-watermark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scratch-watermark-evidence
          retention-days: 30
          if-no-files-found: error
