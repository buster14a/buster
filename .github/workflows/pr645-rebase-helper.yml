name: PR645 isolated rebase helper
on:
  push:
    branches: [codex/pr645-rebase-helper-20260916]
    paths: [.github/workflows/pr645-rebase-helper.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'buster14a/buster' && github.ref == 'refs/heads/codex/pr645-rebase-helper-20260916'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      ORIGINAL: e6ed9e0a59a18566b9148a8fe1f8f6bbe844473b
      CANDIDATE: 64b19fcf55430bedefcb29bb4b375df0aacbb5a7
      CANDIDATE_TREE: af382bdd6641eb19b526d781a4639609ebe7593a
      REBASED_MAIN: 43a2299211a239c6eeaff5d4b5813e2acdce0c7d
      DESTINATION: refs/heads/codex/569-canonical-landing-20260914
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/pr645-rebased-validated-20260916
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact validated and authorized candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr645-publication"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git ls-remote origin refs/heads/codex/pr645-rebased-validated-20260916 | cut -f1)" = "$CANDIDATE"
          test "$(git ls-remote origin refs/heads/backup/pr645-before-rebase-e6ed9e0a-20260916 | cut -f1)" = "$ORIGINAL"
          test "$(git merge-base HEAD "$REBASED_MAIN")" = "$REBASED_MAIN"
          git diff --check "$REBASED_MAIN"
          git fetch origin refs/heads/main
          main="$(git rev-parse FETCH_HEAD)"
          git merge-base --is-ancestor "$REBASED_MAIN" "$main"
          git merge-tree --write-tree HEAD "$main" > "$RUNNER_TEMP/pr645-publication/main-merge-preview.txt"
          printf '%s\n' "$main" > "$RUNNER_TEMP/pr645-publication/main-at-publication.txt"
      - name: Publish existing candidate using expected-head lease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$DESTINATION" | cut -f1)" = "$ORIGINAL"
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" \
            push "--force-with-lease=$DESTINATION:$ORIGINAL" origin "HEAD:$DESTINATION"
          test "$(git ls-remote origin "$DESTINATION" | cut -f1)" = "$CANDIDATE"
          printf '%s\n' "$CANDIDATE" > "$RUNNER_TEMP/pr645-publication/published-head.txt"
          printf 'Published PR645 head: %s\n' "$CANDIDATE"
      - name: Retain publication evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr645-rebase-publication
          path: ${{ runner.temp }}/pr645-publication/
          retention-days: 7
          if-no-files-found: error
