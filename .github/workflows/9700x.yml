      - name: Compare check-expressions with the pull request's base over placements
        # #1050's measure: sqlite3.c's -c by the base and by this tree, each over four placements of its checker unit
        # (./build.sh shifts) from two fresh copies apiece, with the base's executables again as the comparison's floor
        # (main-again); then each build's stages, counters (with store-to-load forwarding's failures) and checker
        # functions' samples. Where this tree changes what -c writes, the step says so and gives both objects' sizes:
        # diagnostic-only changes to selected warning sources are expected to leave the object unchanged and fail if
        # it differs; other checker changes can legitimately alter output and warn with sizes instead (#1572).
        # The placements pad .text, so they move the backend's, the encoder's and Tier 0's code;
        # the checker's own code sits in the page-aligned .text.buster_checker, which wild places first, and every
        # shift is a multiple of 64, so the checker unit's own placement is not one of the samples (#1312).
        if: github.event_name == 'pull_request' && needs.changes.outputs.checker != 'false'
        timeout-minutes: 6
        env:
          AB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SQLITE_EXPECT_STABLE: ${{ needs.changes.outputs.sqlite_stable }}
        run: |
          set -euo pipefail
          [[ "$AB_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          sqlite=/var/lib/buster-9700x/corpora/preprocessor-391e729af658/sqlite
          printf '%s  %s\n' 0a409f1633283fa31a9126b11fbfd64a1991c5d30defad07e5745d4667f5e23d "$sqlite/sqlite3.c" | sha256sum --check
          options=(-c -DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_THREADSAFE=0 -DSQLITE_ENABLE_MEMSYS5 -DSQLITE_ENABLE_RTREE "-I$sqlite" "$sqlite/sqlite3.c")
          ab="${BUSTER_BENCHMARK_BUILDS:?}"
          test "$(git -C "$ab/base" rev-parse HEAD)" = "$AB_BASE_SHA"
          # The early build barrier prepared both revisions and every placement; do not compile during measurement.
          shifts=(0 1088 2112 3136)
          "$ab/main/compiler-0" "${options[@]}" -o "$ab/main.o"
          "$ab/head/compiler-0" "${options[@]}" -o "$ab/head.o"
          if ! cmp -s "$ab/main.o" "$ab/head.o"; then
              echo "== the objects differ: this tree changes sqlite3.c's code"
              size "$ab/main.o" "$ab/head.o"
              if [ "$SQLITE_EXPECT_STABLE" = true ]; then
                  echo "::error::sqlite3.c's object differs after a diagnostic-only change expected to preserve generated objects"
                  exit 1
              fi
              echo "== this change may legitimately affect generated objects; continuing"
          fi
          echo "== what the placements move: ./build.sh shifts pads .text, so the four shifts move the backend's, the"
          echo "== encoder's and Tier 0's code; the checker's own code sits in the page-aligned .text.buster_checker,"
          echo "== which wild places first, and every shift is a multiple of 64, so the checker unit's own placement is"
          echo "== not one of the samples (#1312)"
          builds=()
          for build in main:main head:head main-again:main; do
              for shift in "${shifts[@]}"; do
                  builds+=(--build "${build%%:*}" "$ab/${build#*:}/compiler-$shift")
              done
          done
          taskset -c 2 ./build/compiler time-runs --runs 5 --copies 2 "${builds[@]}" --list "${options[@]}" -o "$ab/runs.o"
          # Each placement's stages, the base's and this tree's in turn: placement 0's in full, and every placement's
          # graph run, lowering and program check, the stages' span and the default runs' wall time and peak.
          for shift in "${shifts[@]}"; do
              for build in main head; do
                  taskset -c 2 "$ab/$build/compiler-$shift" measure-compile --runs 11 -- "${options[@]}" > "$ab/$build-$shift-stages.txt"
                  if [ "$shift" = 0 ]; then
                      echo "== $build: --time-stages' stages, medians of 11"
                      cat "$ab/$build-$shift-stages.txt"
                  fi
              done
          done
          echo "== each placement's stages, medians of 11 (ms; the default runs' wall ms and wait4 peak KiB)"
          for shift in "${shifts[@]}"; do
              for build in main head; do
                  awk -v name="$build-$shift" '
                      $1 ~ /^(check-expressions|lower|check-program|span)$/ { line = line " " $1 " " $2 }
                      $1 == "default:" { wall = $5; peak = $17 }
                      END { printf "%-10s%s wall %s peak %s\n", name, line, wall, peak }
                  ' "$ab/$build-$shift-stages.txt"
              done
          done
          for build in main head; do
              echo "== $build: counters"
              taskset -c 2 perf stat -r 11 -e cycles:u,instructions:u,branch-misses:u,ls_bad_status2.stli_other:u \
                  -- "$ab/$build/compiler-0" "${options[@]}" -o "$ab/counted.o"
          done
          for build in main head; do
              echo "== $build: the checker's and the type table's functions in a profile of five compiles"
              taskset -c 2 perf record -q -F 20000 -o "$ab/$build.data" -- \
                  bash -c 'for run in 1 2 3 4 5; do "$@" > /dev/null 2>&1 || exit 1; done' compile "$ab/$build/compiler-0" "${options[@]}" -o "$ab/profiled.o"
              perf report -i "$ab/$build.data" --stdio --no-children --sort symbol --percent-limit 0.15 > "$ab/$build-symbols.txt"
              awk '/ (check|type)_/ && shown++ < 40' "$ab/$build-symbols.txt"
          done
          # Where this tree's loads fail to take a store's data (ls_bad_status2.stli_other), one sample in 500, by function.
          # awk reads all of perf's output, which no closed pipe may stop under pipefail.
          echo "== head: store-to-load forwarding's failures by function"
          taskset -c 2 perf record -q -e ls_bad_status2.stli_other:u -c 500 -o "$ab/forwarding.data" -- \
              "$ab/head/compiler-0" "${options[@]}" -o "$ab/forwarding.o"
          perf report -i "$ab/forwarding.data" --stdio --no-children --sort symbol --percent-limit 0.3 > "$ab/forwarding-symbols.txt"
          awk '/%/ && shown++ < 40' "$ab/forwarding-symbols.txt"

      - name: Benchmark the C driver's source rows
        # #395: each pass's vector path against its exact twin (raw rows, lines, kept rows and the unit), and what -g
        # adds to the emission, after both paths agree.
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',check-debug,')
        run: |
          taskset -c 2 ./build/compiler benchmark-check-debug

      - name: Benchmark the C driver's source rows in isolation and after scalar work
        # Where `changes` doesn't rule it out (c_check_debug*.c, the emission and the lowering, debug.c and tier0.c), each
        # path alone and after scalar work, in processes of their own: the passes the rows' producers reach, what the
        # rows add to the emission (the emit pass) and the unit built from the rows it makes (the build pass: their
        # lines, the rows kept and the sections), whose inputs a change to the emission, the lowering or Tier 0 changes.
        # Where the rows' own passes change (`check_debug_rows`: c_check_debug*.c and debug.c), and on the daily and
        # dispatched runs, every pass at once, whose 200 ms of scalar work before each sample is most of the step's 22 s.
        if: needs.changes.outputs.check_debug != 'false'
        env:
          ROWS: ${{ needs.changes.outputs.check_debug_rows != 'false' }}
        run: |
          passes=(emit build)
          if [ "$ROWS" = true ]; then
            passes=(every)
          fi
          for pass in "${passes[@]}"; do
            only=(--only "$pass")
            if [ "$pass" = every ]; then
              only=()
            fi
            taskset -c 2 ./build/compiler benchmark-check-debug "${only[@]}" --path scalar
            taskset -c 2 ./build/compiler benchmark-check-debug "${only[@]}" --path vector
            taskset -c 2 ./build/compiler benchmark-check-debug "${only[@]}" --path vector --after-scalar 200
          done

      - name: Benchmark the deferred bodies' reader on frozen SQLite
        # #113: source order's reader against the deferred one on one lane and on eight, with its position checks apart,
        # in twice the six orders of its readings (--passes is a multiple of six). The command and lane 0 run on CPU 2,
        # the other lanes on one CPU of each other core the job may use.
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',checker-deferred,')
        run: |
          unset CPATH C_INCLUDE_PATH
          export SOURCE_DATE_EPOCH=1792454400
          corpus=/var/lib/buster-9700x/corpora/preprocessor-391e729af658
          allowed="$(awk '/^Cpus_allowed_list:/ { print $2 }' /proc/self/status)"
          others="$(lscpu -p=CPU,CORE,SOCKET,ONLINE | awk -F, -v allowed="$allowed" '
              BEGIN {
                  n = split(allowed, ranges, ",")
                  for (r = 1; r <= n; r++) {
                      m = split(ranges[r], ends, "-")
                      last = m == 2 ? ends[2] : ends[1]
                      for (c = ends[1]; c <= last; c++) permitted[c] = 1
                  }
              }
              $0 !~ /^#/ && $4 == "Y" && permitted[$1] && !seen[$3 ":" $2]++ && $1 != 2 { print $1 }
          ' | head -n 7 | paste -sd, -)"
          test "$(tr ',' '\n' <<< "$others" | wc -l)" -eq 7
          source=(--predefines "$corpus/provenance/gnu17-pinned-predefines.txt" --clang-features --no-default-config --target=x86_64-linux-gnu -march=znver5 -std=gnu17 -nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include" "$corpus/sqlite/sqlite3.c")
          ./build/compiler benchmark-checker-deferred --passes 12 --lanes 8 --cpus "2,$others" "${source[@]}"

      - name: Benchmark the functions' lanes on frozen SQLite
        # #151: -c's emission of the frozen SQLite source on 1, 2, 3, 4, 6 and 8 lanes and on the rule's, every run one
        # lane's code and each lane count's object one lane's: the rows of docs/function-lanes.md's table (#1069). Lane 0
        # runs on CPU 2, the other lanes on one CPU of each other core the job may use. The driver's own feature answers,
        # not clang's (--clang-features), as -c takes them: with clang's, SQLite takes its atomics' path, which the
        # emission refuses.
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',check-lanes,')
        run: |
          unset CPATH C_INCLUDE_PATH
          export SOURCE_DATE_EPOCH=1792454400
          corpus=/var/lib/buster-9700x/corpora/preprocessor-391e729af658
          allowed="$(awk '/^Cpus_allowed_list:/ { print $2 }' /proc/self/status)"
          others="$(lscpu -p=CPU,CORE,SOCKET,ONLINE | awk -F, -v allowed="$allowed" '
              BEGIN {
                  n = split(allowed, ranges, ",")
                  for (r = 1; r <= n; r++) {
                      m = split(ranges[r], ends, "-")
                      last = m == 2 ? ends[2] : ends[1]
                      for (c = ends[1]; c <= last; c++) permitted[c] = 1
                  }
              }
              $0 !~ /^#/ && $4 == "Y" && permitted[$1] && !seen[$3 ":" $2]++ && $1 != 2 { print $1 }
          ' | head -n 7 | paste -sd, -)"
          test "$(tr ',' '\n' <<< "$others" | wc -l)" -eq 7
          source=(--predefines "$corpus/provenance/gnu17-pinned-predefines.txt" --no-default-config --target=x86_64-linux-gnu -march=znver5 -std=gnu17 -nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include" "$corpus/sqlite/sqlite3.c")
          ./build/compiler benchmark-check-lanes --passes 11 --lanes 1,2,3,4,6,8 --cpus "2,$others" "${source[@]}"

      - name: Benchmark the translation units' lanes
        # #1128: one command of synth's shape (64 units of 200 functions) by -c, with the frozen corpus's headers and
        # predefines, by --lanes 1, 2, 4 and 8, as processes: each count's wall time and system time against one lane's.
        # Lanes that serialize on the kernel (the address space's lock, which arena reservations, commits and discards
        # take) raise the system time, where the wall time may hide it.
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',check-units,')
        run: |
          unset CPATH C_INCLUDE_PATH
          export SOURCE_DATE_EPOCH=1792454400
          corpus=/var/lib/buster-9700x/corpora/preprocessor-391e729af658
          options=(--predefines "$corpus/provenance/gnu17-pinned-predefines.txt" --target=x86_64-linux-gnu -march=znver5 -std=gnu17 -nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include")
          ./build/compiler benchmark-check-units --lanes 1,2,4,8 --runs 5 -- "${options[@]}"

      - name: Attribute sqlite3.c's compile time to the compiler's stages, against tcc, clang -O0 and gcc -O0
        # #518 (docs/compile-time.md): `-c` of the frozen corpus's sqlite3.c with the options of #136's speedtest1
        # record, as whole processes in a Williams design's order with tcc's, clang -O0's and gcc -O0's (#146), with
        # --time-stages' report of where the time goes;
        # then perf's counters and a profile by function of the default compile. Where `changes` doesn't rule it out
        # (the stage clock and measure-compile: `compile_time`), and on the daily and dispatched runs.
        if: needs.changes.outputs.compile_time != 'false'
        run: |
          sqlite=/var/lib/buster-9700x/corpora/preprocessor-391e729af658/sqlite
          printf '%s  %s\n' 0a409f1633283fa31a9126b11fbfd64a1991c5d30defad07e5745d4667f5e23d "$sqlite/sqlite3.c" | sha256sum --check
          options=(-c -DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_THREADSAFE=0 -DSQLITE_ENABLE_MEMSYS5 -DSQLITE_ENABLE_RTREE "-I$sqlite" "$sqlite/sqlite3.c")
          # tcc is the comparison's reference: the step fails without it, or with another build of it. An upgrade
          # starts a new series of ratios: update this hash and docs/compile-time.md's together.
          tcc="$(command -v tcc)"
          "$tcc" -v
          printf '%s  %s\n' 49e2d1afd09cdab6593ca127b056ccc35fc5f3a2d0e08dae67f604db2751c082 "$tcc" | sha256sum --check
          # clang -O0 and gcc -O0 are references too, unpinned (the owner's decision on #146, 2026-11-11): each run
          # records their versions and hashes, and an upgrade of either changes their rows without failing the step.
          clang="$(command -v clang)"
          gcc="$(command -v gcc)"
          "$clang" --version
          "$gcc" --version
          sha256sum "$clang" "$(readlink -f "$clang")" "$gcc" "$(readlink -f "$gcc")"
          taskset -c 2 ./build/compiler measure-compile --runs 11 --reference "$tcc" --reference "$clang" --reference-option -O0 \
            --reference "$gcc" --reference-option -O0 -- "${options[@]}"
          # The counters of 11 compiles of each, user and kernel apart, and the functions the default's samples fall
          # in. They are the stage report's cross-check (#518), so the step fails when perf can't give them: when it
          # can't run, when a counter isn't counted, or when the profile is empty.
          out="$RUNNER_TEMP/compile-time"
          mkdir -p "$out"
          events=task-clock,page-faults,cycles:u,instructions:u,cycles:k,instructions:k,branch-misses:u
          taskset -c 2 perf stat -r 11 -e "$events" -o "$out/stat-compiler.txt" -- ./build/compiler "${options[@]}" -o "$out/sqlite3.o"
          cat "$out/stat-compiler.txt"
          taskset -c 2 perf stat -r 11 -e "$events" -o "$out/stat-tcc.txt" -- "$tcc" "${options[@]}" -o "$out/tcc.o"
          cat "$out/stat-tcc.txt"
          if grep -E '<not (supported|counted)>' "$out/stat-compiler.txt" "$out/stat-tcc.txt"; then
              echo "::error::perf counted only some of the events, so the stage report has no cross-check"
              exit 1
          fi
          taskset -c 2 perf record -q -F 20000 -o "$out/perf.data" -- \
              bash -c 'for run in 1 2 3 4 5; do "$@" > /dev/null 2>&1 || exit 1; done' compile ./build/compiler "${options[@]}" -o "$out/sqlite3.o"
          perf report -i "$out/perf.data" --stdio --no-children --sort dso --percent-limit 0.5 > "$out/dso.txt"
          perf report -i "$out/perf.data" --stdio --no-children --sort symbol --percent-limit 0.4 > "$out/symbol.txt"
          grep -v '^#' "$out/dso.txt" | sed '/^$/d'
          grep -v '^#' "$out/symbol.txt" | sed -n '/^$/d; 1,80p'

      - name: Gauge sqlite3.c's compile at one worker and at eight, by stage
        # #2536's step 0 (docs/all-core-path.md; docs/commands/all-core.md): -c --lanes 1 of the frozen sqlite3.c as
        # independent processes, one worker on CPU 2 and eight on CPUs 0 to 7 (one a physical core), each worker's
        # compiles one after another. Six rounds counted run by run (both modes' cycles, the peak, the faults), then six
        # rounds sampled on the workers' CPUs (both modes' cycles by stage, each run's stages from its own --time-stages
        # report): about 30 s. Every main state this job measures (a push, the nightly backlog and snapshot) and never
        # a pull request: the later steps' gates are this table's. It fails when a compile fails, a counter or a sample
        # is missing, or the objects of one worker and of eight differ; its figures don't gate.
        if: github.event_name != 'pull_request'
        run: |
          sqlite=/var/lib/buster-9700x/corpora/preprocessor-391e729af658/sqlite
          printf '%s  %s\n' 0a409f1633283fa31a9126b11fbfd64a1991c5d30defad07e5745d4667f5e23d "$sqlite/sqlite3.c" | sha256sum --check
          out="$RUNNER_TEMP/all-core"
          rm -rf "$out"
          mkdir -p "$out/objects"
          cc -std=c17 -O2 -Wall -Wextra -Werror -o "$out/allcore" tools/allcore/allcore.c
          "$out/allcore" self-test
          command=(./build/compiler --time-stages --lanes 1 -c -DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_THREADSAFE=0 -DSQLITE_ENABLE_MEMSYS5 -DSQLITE_ENABLE_RTREE "-I$sqlite" "$sqlite/sqlite3.c" -o "$out/objects/%l.w%w.o")
          "$out/allcore" counted --out "$out" -- "${command[@]}"
          "$out/allcore" sampled --out "$out" -- "${command[@]}"
          "$out/allcore" table --out "$out" --bytes "$(stat -c %s "$sqlite/sqlite3.c")"
          cmp "$out/objects/one.w0.o" "$out/objects/eight.w7.o"
          cat "$out"/counted/*.strays.txt "$out"/sampled/*.strays.txt
          {
              echo '### sqlite3.c at one worker and at eight (#2536, step 0)'
              for table in whole table; do
                  echo
                  awk -F'\t' 'NR == 1 { rule = "|"; for (i = 1; i <= NF; i += 1) rule = rule (i == 1 ? " --- |" : " ---: |") } { line = "|"; for (i = 1; i <= NF; i += 1) line = line " " $i " |"; print line } NR == 1 { print rule }' "$out/$table.tsv"
              done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmark the checker's binding handoff
        # #336: every handoff mode must publish the default's columns, reports and graph on each input before the
        # whole source reader is timed per mode, with the handoff's pieces alone and their memory.
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',checker-bindings,')
        run: |
          unset CPATH C_INCLUDE_PATH
          export SOURCE_DATE_EPOCH=1792454400
          corpus=/var/lib/buster-9700x/corpora/preprocessor-391e729af658
          system=(--predefines "$corpus/provenance/gnu17-pinned-predefines.txt" --clang-features --no-default-config --target=x86_64-linux-gnu -march=znver5 -std=gnu17 -nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include")
          taskset -c 2 ./build/compiler benchmark-checker-bindings "${system[@]}" --input small
          taskset -c 2 ./build/compiler benchmark-checker-bindings "${system[@]}" --input headers
          taskset -c 2 ./build/compiler benchmark-checker-bindings --passes 5 "${system[@]}" "$corpus/sqlite/sqlite3.c"

      - name: Benchmark the checker's binding handoff in repeated processes, in isolation and after scalar work
        # Where `changes` doesn't rule it out (the handoff's timed path: `checker_bindings`), the default (direct) alone
        # and after 100 ms of the scalar twin's reader. Where the handoffs themselves change (`checker_binding_modes`),
        # and on the daily and dispatched runs, also every mode on the large input and SQLite, and the old default
        # (parser-batch) alone and after the same scalar work: the comparison #336 chose direct by.
        if: needs.changes.outputs.checker_bindings != 'false'
        env:
          MODES: ${{ needs.changes.outputs.checker_binding_modes != 'false' }}
        run: |
          unset CPATH C_INCLUDE_PATH
          export SOURCE_DATE_EPOCH=1792454400
          corpus=/var/lib/buster-9700x/corpora/preprocessor-391e729af658
          system=(--predefines "$corpus/provenance/gnu17-pinned-predefines.txt" --clang-features --no-default-config --target=x86_64-linux-gnu -march=znver5 -std=gnu17 -nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include")
          modes=(direct)
          if [ "$MODES" = true ]; then
            modes+=(parser-batch)
          fi
          for sample in 1 2 3; do
            echo "Binding handoff process $sample"
            if [ "$MODES" = true ]; then
              taskset -c 2 ./build/compiler benchmark-checker-bindings "${system[@]}" --input large
              taskset -c 2 ./build/compiler benchmark-checker-bindings "${system[@]}" "$corpus/sqlite/sqlite3.c"
            fi
            for mode in "${modes[@]}"; do
              taskset -c 2 ./build/compiler benchmark-checker-bindings --only "$mode" "${system[@]}" "$corpus/sqlite/sqlite3.c"
              taskset -c 2 ./build/compiler benchmark-checker-bindings --only "$mode" --after-scalar 100 "${system[@]}" "$corpus/sqlite/sqlite3.c"
            done
          done

      - name: Benchmark binding handoffs through parsing, checking and cleanup
        # Where `changes` doesn't rule it out (the handoff's timed path: `checker_bindings`), the default (direct) after
        # 100 ms of the scalar twin's reader. Where the handoffs themselves change (`checker_binding_modes`), and on the
        # daily and dispatched runs, also every mode on each input, and the old default (parser-batch) after the same
        # scalar work.
        if: needs.changes.outputs.checker_bindings != 'false'
        env:
          MODES: ${{ needs.changes.outputs.checker_binding_modes != 'false' }}
        run: |
          unset CPATH C_INCLUDE_PATH
          export SOURCE_DATE_EPOCH=1792454400
          corpus=/var/lib/buster-9700x/corpora/preprocessor-391e729af658
          system=(--predefines "$corpus/provenance/gnu17-pinned-predefines.txt" --clang-features --no-default-config --target=x86_64-linux-gnu -march=znver5 -std=gnu17 -nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include")
          modes=(direct)
          if [ "$MODES" = true ]; then
            modes+=(parser-batch)
          fi
          for sample in 1 2 3; do
            echo "Binding pipeline process $sample"
            if [ "$MODES" = true ]; then
