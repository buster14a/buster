name: Tests and Zen 5 benchmarks

# This public repository must not execute unreviewed fork code on the host.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
  # Once a day, the measurements a push to main leaves out (`changes`).
  schedule:
    - cron: '23 7 * * *'
  # Every pull request runs the workflow, since its job is a required check: a pull request that changes only
  # documentation gets the job skipped by `changes`, which counts as passed, rather than no check at all, which blocks
  # the merge.
  pull_request:

permissions:
  contents: read

# Keep each PR/ref's pending runs separate: older branches using a single repository-wide pending slot otherwise
# cancel another PR's qualification. Each group keeps one pending run, GitHub's default: a newer push replaces its
# pending run, which would only qualify a commit already superseded. A newer push to a PR also cancels the PR's run in
# progress, which is mostly a job waiting for the 9700X (the slot is held from then on, so a run waiting hours would
# otherwise still run for its stale commit); a push to main lets main's run finish. The daily run has a group of its
# own, so that a push to main doesn't replace it while it waits. The runner's job hooks serialize all jobs with the
# shared host lock (AGENTS.md).
concurrency:
  group: buster-fast-9700x-${{ github.event.pull_request.number || (github.event_name == 'schedule' && 'schedule') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request changes anything but documentation (`docs/**` and `*.md`, as `push`'s paths-ignore), on a
  # GitHub-hosted runner so that it doesn't wait for the 9700X: the files the merge changes against its base. The selector must pass before tests or benchmarks run. And whether it changes the harnesses of the baselines, the linkers'
  # times and the floors (link_benchmark.c and floors_benchmark.c): they measure other programs and the machine, the same
  # for every pull request, so `benchmarks` measures them on the daily and dispatched runs and on pull requests that change
  # these harnesses, as when this job is skipped or fails. The same for benchmark-foreign's mold and wild
  # (foreign_benchmark.c's `--linkers`), apart, since its harness changes with the foreign path's phases, and for
  # benchmark-preprocessor's `clang -E` (`--clang`, `preprocessor_clang`: c_preprocessor_benchmark.c). And, per
  # module, whether it changes the sources of a benchmark whose isolated and after-scalar samples (`--only`,
  # `--after-scalar 200`, repeated in separate processes) cost far more than its plain run: about 200 ms before each of
  # 21 samples per case, 150 s of a pull request's job in all. Those samples run on the daily and dispatched runs and on
  # pull requests that change what they measure. The same for the first-party performance readers' qualification
  # (`performance`): tools/performance, docs/performance, web/perf, the evidence's pin or the qualification's steps.
  # A step gated on one of these outputs also runs on the pull request that changes it.
  # And which plain benchmarks, with their checks against the scalar twins, a pull request runs (`measure`): those whose
  # sources it changes, and those whose steps it changes (the branch-sizing qualification too: its steps or its
  # sources). A benchmark built as a translation unit of its own (build.sh's *_benchmark.c) measures what that unit
  # includes, which this job reads from the #include lines; one in main.c's units measures the files that define the
  # functions it calls, as its entry names them. The plain runs took about 105 s of a pull request's 230, most of them
  # measuring code the pull request doesn't change; a change to build.sh runs every one.
  # On a push to main, whose pull request's run measured what it changes, every output but `code` is `false`: the full
  # set used to exceed the 10-minute budget on every push, failing while keeping the 9700X from every pull
  # request's job meanwhile. A push runs every plain benchmark (`measure` is `all`), so that main has each one's numbers
  # at every commit. The daily and dispatched runs, which skip this job, have the full set.
  # The selector is tools/ci/changes.c: the modules' sources (`changes_modules`), the plain benchmarks'
  # (`changes_benchmarks`) and the decision, which its --self-test checks against this workflow and the sources before
  # it decides.
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      baselines: ${{ steps.files.outputs.baselines }}
      foreign: ${{ steps.files.outputs.foreign }}
      branch_sizing: ${{ steps.files.outputs.branch_sizing }}
      preprocessor_clang: ${{ steps.files.outputs.preprocessor_clang }}
      zen5: ${{ steps.files.outputs.zen5 }}
      ssa: ${{ steps.files.outputs.ssa }}
      parser_bindings: ${{ steps.files.outputs.parser_bindings }}
      environments: ${{ steps.files.outputs.environments }}
      ir: ${{ steps.files.outputs.ir }}
      ir_lowering: ${{ steps.files.outputs.ir_lowering }}
      ir_optimize: ${{ steps.files.outputs.ir_optimize }}
      checker: ${{ steps.files.outputs.checker }}
      checker_bindings: ${{ steps.files.outputs.checker_bindings }}
      checker_binding_modes: ${{ steps.files.outputs.checker_binding_modes }}
      check_debug: ${{ steps.files.outputs.check_debug }}
      check_debug_rows: ${{ steps.files.outputs.check_debug_rows }}
      files: ${{ steps.files.outputs.files }}
      compile_time: ${{ steps.files.outputs.compile_time }}
      performance: ${{ steps.files.outputs.performance }}
      measure: ${{ steps.files.outputs.measure }}
    steps:
      - name: Check out the triggering commit and its parents
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Build the selector and check it against this workflow and the sources
        # tools/ci/changes.c, built with the runner's cc in about a second: its self-test checks its tables against the
        # workflow (each output a step reads, each MEASURE name, each gated step changed alone) and the sources (each
        # pattern's alternatives and units), and its decisions on fixtures. When it fails, so does this job, and the remaining jobs do not run.
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c17 -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/changes" tools/ci/changes.c
          "$RUNNER_TEMP/changes" --self-test

      - id: files
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/9700x.yml
          if [ "$GITHUB_EVENT_NAME" = push ]; then
              "$RUNNER_TEMP/changes" --event push --workflow "$workflow" --output "$GITHUB_OUTPUT"
          else
              # The merge's changes against its base, both names of a file renamed, and the base's workflow, empty
              # where it has none.
              git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/files"
              if ! git show "HEAD^1:$workflow" > "$RUNNER_TEMP/base.yml" 2> /dev/null; then
                  : > "$RUNNER_TEMP/base.yml"
              fi
              "$RUNNER_TEMP/changes" --event pull_request --files "$RUNNER_TEMP/files" \
                  --base-workflow "$RUNNER_TEMP/base.yml" --workflow "$workflow" --output "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests on Ubuntu 26.04 (Clang 23, ${{ matrix.host_arch }})
    needs: changes
    if: ${{ !cancelled() && github.repository_id == '1421805693' && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.code != 'false')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        host_arch: [x86-64, native]
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: ${{ matrix.host_arch }}
      BUSTER_ORACLE_CACHE: check
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install official Clang 23.1.4 and test tools
        run: bash tools/ci/setup-hosted.sh

      - name: Fetch generic baseline startup objects and runtime for emulation
        if: matrix.host_arch == 'x86-64'
        run: bash tools/ci/setup-baseline-runtime.sh

      - name: Fetch and verify frozen corpus inputs
        run: |
          corpus="$RUNNER_TEMP/preprocessor-391e729af658"
          bash tools/ci/fetch-corpus.sh "$corpus"
          printf 'BUSTER_CORPUS=%s\n' "$corpus" >> "$GITHUB_ENV"

      - name: Report host CPU and selected compiler path
        run: |
          grep -m1 '^model name[[:space:]]*:' /proc/cpuinfo
          printf 'Available CPUs: %s\n' "$(nproc)"
          for arch in native "$BUSTER_HOST_ARCH"; do
            printf '\nClang target for -march=%s:\n' "$arch"
            clang -### -march="$arch" -c -x c /dev/null -o /dev/null 2>&1 |
              sed -n 's/.*"-target-cpu" "\([^"]*\)".*/  CPU: \1/p'
            clang -march="$arch" -dM -E -x c /dev/null |
              grep -E '^#define (__AVX512(F|BW|VL|DQ|CD|VBMI|VBMI2|VPOPCNTDQ|BITALG|VNNI)__|__(GFNI|VAES|AES|BMI|BMI2|LZCNT|POPCNT|AVX2|SSSE3|SSE4_1|XSAVE)__) ' || true
          done
          defines=$(clang -march="$BUSTER_HOST_ARCH" -Isrc -dM -E \
            -include src/buster/compiler/host_isa.h -x c /dev/null)
          if grep -q '^#define BUSTER_HOST_VECTOR 1$' <<< "$defines"; then
            path=vector
          else
            path=scalar
          fi
          printf '\nSelected host path: %s (%s)\n' "$path" "$BUSTER_HOST_ARCH"
          if [ "$BUSTER_HOST_ARCH" = x86-64 ]; then test "$path" = scalar; fi

      - name: Check baseline fallback memory and arithmetic boundaries
        run: |
          clang -std=c17 -O2 -g -march=x86-64 -Wall -Wextra -Werror -Wno-psabi \
            -fsanitize=undefined -fno-sanitize-recover=all -Isrc/buster/compiler \
            tests/host-fallback/edge_cases.c -o "$RUNNER_TEMP/host-fallback-edges"
          "$RUNNER_TEMP/host-fallback-edges"

      - name: Build the external Clang pragma oracle and the compiler
        run: |
          oracle="$RUNNER_TEMP/preprocessor-pragma-oracle"
          bash tools/build-preprocessor-pragma-oracle.sh "$oracle"
          BUSTER_DEBUG_INFO=0 ./build.sh
          test -x build/compiler
          test "$(find build -type f -executable | wc -l)" -eq 1
          printf 'BUSTER_PPF_PRAGMA_ORACLE=%s\n' "$oracle" >> "$GITHUB_ENV"
          clang --version
          llvm-config --version

      - name: Compile and run baseline code on an emulated x86-64 CPU
        if: matrix.host_arch == 'x86-64'
        run: |
          smoke="$RUNNER_TEMP/baseline-smoke"
          mkdir "$smoke"
          printf '\357\273\277#define A 7\nint buster_add(int x){return x+A;}\n' > "$smoke/input.c"
          printf '.text\n.globl buster_asm\nbuster_asm:\nmov $7, %%eax\nadd $3, %%eax\nret\n' > "$smoke/input.s"
          library="$BUSTER_HOST_RUNTIME/usr/lib/x86_64-linux-gnu"
          loader="$library/ld-linux-x86-64.so.2"
          qemu=(qemu-x86_64 -cpu qemu64 "$loader" --library-path "$library")
          timeout 60s "${qemu[@]}" ./build/compiler -E -P -o "$smoke/input.i" "$smoke/input.c"
          timeout 60s "${qemu[@]}" ./build/compiler -c -march=x86-64 -o "$smoke/input.o" "$smoke/input.c"
          timeout 60s "${qemu[@]}" ./build/compiler assemble -march=x86-64 -o "$smoke/asm.o" "$smoke/input.s"
          printf 'int buster_add(int); int buster_asm(void); int main(void){return buster_add(5)!=12 || buster_asm()!=10;}\n' > "$smoke/main.c"
          clang -c -march=x86-64 "$smoke/main.c" -o "$smoke/main.o"
          clang -no-pie -nostdlib "$library/crt1.o" "$library/crti.o" "$smoke/main.o" \
            "$smoke/input.o" "$smoke/asm.o" "$library/libc.so.6" \
            "$BUSTER_HOST_RUNTIME/usr/lib/gcc/x86_64-linux-gnu/15/libgcc.a" "$library/crtn.o" -o "$smoke/program"
          timeout 60s "${qemu[@]}" "$smoke/program"

      - name: Check out reviewed first-party performance fixtures and acceptance harnesses
        # With the qualification below, on the daily and dispatched runs and on pull requests that change the readers
        # (tools/performance, docs/performance, web/perf), this pin or these steps: about 11 s of building and checking that
        # every other pull request's job spent on code it doesn't change.
        if: needs.changes.outputs.performance != 'false'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: buster14a/buster-performance
          ref: 1c0523ac42bb2f33e212226cf94626ac942ee4d2 # Reviewed source/evidence from buster-performance PR #8.
          path: build/performance-reader-evidence
          sparse-checkout: |
            docs/measurements/performance-format-2026-10-24
            docs/measurements/performance-first-party-2026-10-25
            docs/measurements/performance-pages-2026-10-25
            docs/measurements/foreign-strings-2026-10-23/raw
          persist-credentials: false

      - name: Test first-party performance readers and frozen imports on Ubuntu 26.04
        if: needs.changes.outputs.performance != 'false'
        run: |
          set -euo pipefail
          reader_root=build/performance-reader-evidence
          reader_fixture="$reader_root/docs/measurements/performance-format-2026-10-24"
          reader_harness="$reader_root/docs/measurements/performance-first-party-2026-10-25"
          bash tools/performance/build.sh
          build/performance/bmf --self-test
          clang -std=c17 -D_GNU_SOURCE -O2 -g -Wall -Wextra -Werror \
            -I tools/performance "$reader_harness/validate.c" -o build/performance/test-first-party
          build/performance/test-first-party "$reader_fixture" "$reader_root" \
            docs/performance/buster-manifest-v1.schema.json
          clang -std=c17 -D_GNU_SOURCE -O2 -g -Wall -Wextra -Werror \
            -I tools/performance "$reader_harness/import-tests.c" -o build/performance/test-import-first-party
          build/performance/test-import-first-party
          build/performance/bmf validate "$reader_harness/history/census/manifest.bmf.json"
          build/performance/bmf validate "$reader_harness/history/foreign-strings/manifest.bmf.json" \
            --evidence-root "$reader_root"
          pages_harness="$reader_root/docs/measurements/performance-pages-2026-10-25"
          clang -std=c17 -D_GNU_SOURCE -O2 -g -Wall -Wextra -Werror \
            -I tools/performance "$pages_harness/profile-validation.c" -o build/performance/test-profile
          build/performance/test-profile "$reader_fixture/profile-example/capture.pftrace" \
            "$pages_harness/profile/capture.pftrace"
          build/performance/bmf validate "$pages_harness/profile/manifest.bmf.json"
          for manifest in "$pages_harness/history-partitioned/"*.bmf.json; do
            build/performance/bmf validate "$manifest"
          done
          build/performance/capture --no-sampling build/performance/qualification-launch 2 1000000 \
            -- /usr/bin/true
          pages_source=$(git rev-parse HEAD)
          pages_evidence=1c0523ac42bb2f33e212226cf94626ac942ee4d2
          pages_index=docs/measurements/performance-pages-2026-10-25/site-index.json
          build/performance/publish . "$pages_source" "$reader_root" "$pages_evidence" \
            "$pages_index" build/performance/pages-check-1 2026-10-25T13:19:28Z
          build/performance/publish . "$pages_source" "$reader_root" "$pages_evidence" \
            "$pages_index" build/performance/pages-check-2 2026-10-25T13:19:28Z
          diff -rq build/performance/pages-check-1 build/performance/pages-check-2

      - name: Write clang's predefines for the compiler's flags
        # For the steps that preprocess the compiler's own translation units: --predefines supplies the macro effects of
        # flags such as -funsigned-char.
        run: clang -dM -E -march="$BUSTER_HOST_ARCH" -fwrapv -funsigned-char -x c /dev/null > build/predefines.h

      - name: Parse the compiler source
        # Preserve this parser smoke test explicitly now that the default C command performs semantic checking.
        # Default C checking and object emission have their own external-oracle tests below.
        run: ./build/compiler parse -fsyntax-only -march="$BUSTER_HOST_ARCH" -Isrc -fwrapv -funsigned-char --predefines build/predefines.h src/buster/compiler/main.c

      - name: Fetch c-testsuite at its pinned commit
        # #145's programs, at the commit tests/c-testsuite/subset.txt was declared for: a shallow fetch of that one commit,
        # whose hash fixes the files, without git's sample hooks. The test list below compiles and runs them.
        run: |
          git init -q --template= build/c-testsuite
          git -C build/c-testsuite fetch -q --depth 1 https://github.com/c-testsuite/c-testsuite 5c7275656d751de0e68b2d340a95b5681858ed07
          git -C build/c-testsuite checkout -q FETCH_HEAD

      - name: Run correctness tests within the hosted CPU budget
        run: |
          ./build/compiler parallel --github --jobs "$(nproc)" --timeout 600 <<'TESTS'
          == Test the foreign inputs [8 CPUs]
          # Generated programs' objects split into archives and compiled C and C++ cases, resolved by both paths on 1,
          # 2, 3 and 8 lanes; --cross-check also links each with GNU ld and lld and compares the members they load, the
          # winners, the COMDAT groups and -y's lines with the resolution's.
          ./build/compiler test-foreign --cross-check
          == Check the no-recursion rule on the call graph [8 CPUs]
          # Writes the translation units' LLVM IR to a temporary directory and fails on any cycle not in the allowlist.
          ./build/compiler test-call-graph
          ./build.sh check-call-graph
          == Test the calling convention [8 CPUs]
          # --cross-check also links random signatures between our side, encoded and written as objects, and C that
          # clang and GCC compile, at 16-, 32- and 64-byte vectors, and checks every argument, result and va_arg both
          # ways; in its compiled runs (#137), our side is C that this compiler compiles, by both paths into one object.
          ./build/compiler test-calling-convention --cross-check
          == Test the static executables with libc [8 CPUs]
          # Each program bound against the system's static runtime and written as a static executable by 1, 2, 3 and 8
          # lanes and by the writer's exact twins must be the same file, run as cc -static's link of the same object
          # does, and with --cross-check as lld's does, with as many IRELATIVE relocations and the same TLS segment's
          # alignment and init and fini arrays' sizes.
          ./build/compiler test-static --cross-check
          == Test the functions' lanes [8 CPUs]
          # #151: generated programs and failing ones emitted on 1, 2, 3 and 8 lanes and with a slow lane, each one
          # lane's object or failure, with -g's rows and unwind tables and without; and the driver's objects and
          # executables by --lanes and by default, by both paths, each one lane's.
          ./build/compiler test-check-lanes
          == Test the dynamic PIEs [8 CPUs]
          # --cross-check also links each bound program's objects with ld.lld as a PIE and compares the two files'
          # dynamic symbols and relocations.
          ./build/compiler test-dynamic --cross-check
          == Test the foreign linker against lld and mold [8 CPUs]
          # Original C and C++ programs, each compiled by gcc and by clang, linked from one command line by
          # link-foreign, lld and mold: their runs, symbols and sizes, dynamic sections, versions and relocations must
          # agree but for each reference linker's documented choices.
          ./build/compiler test-foreign-corpus
          == Test the per-file jobs [8 CPUs]
          # The cache filled on 1, 2, 3 and 8 lanes must give the same tables, records and translation units' streams,
          # -E text and diagnostics, and each unit the spellings it gives alone; and again with the shared table's ids
          # in another order (#153's --id-order, 153 by default), the same records, -E text, diagnostics and
          # locations, each id spelled the same. Its forms with paths (the translation units, src flat) do the same.
          ./build/compiler test-files
          == Test the per-file jobs on the frozen C library corpus, flat [8 CPUs]
          unset CPATH C_INCLUDE_PATH
          ./build/compiler test-files --flat $BUSTER_CORPUS/libc
          == Test the runtime snapshot [8 CPUs]
          ./build/compiler test-snapshot
          == Test the per-file jobs on the frozen sqlite3.c [8 CPUs]
          unset CPATH C_INCLUDE_PATH
          ./build/compiler test-files $BUSTER_CORPUS/sqlite/sqlite3.c
          == Test the direct path's executables [8 CPUs]
          ./build/compiler test-executable
          == Test the lanes [8 CPUs]
          ./build/compiler test-lanes
          == Test the per-file jobs on the repository's sources, flat [8 CPUs]
          ./build/compiler test-files --flat src
          == Test the link representation [8 CPUs]
          ./build/compiler test-link
          == Test the preprocessor's cases against clang [4 CPUs]
          # --clang also preprocesses each case with clang -E and compares the tokens. A worker per CPU of the
          # heading's shares the fuzz batch's 3,000 cases (--jobs, which the cases don't depend on), about 9 s of threads
          # in all at the qualification runs' 3 ms per case; the cases and header sets run in parts, a process per CPU
          # of the heading's (#465).
          ./build/compiler test-preprocessor --clang --jobs "$BUSTER_PARALLEL_CPUS"
          == Test the preprocessor on the repository's translation units against clang [4 CPUs]
          # --clang also preprocesses each unit with clang -E, with clang's predefines for its options, and compares the
          # tokens. -target and its triple (clang's default) go to both.
          ./build/compiler test-preprocessor --clang -target x86_64-pc-linux-gnu -march="$BUSTER_HOST_ARCH" -Isrc -fwrapv -funsigned-char src/buster/compiler/main.c src/buster/compiler/*_benchmark.c
          == Test c-testsuite's programs end to end [4 CPUs]
          # #145: each program checked, lowered, compiled by Tier 0 and linked by the direct path, by the vector paths and
          # the scalar twins into the same bytes, then run; --cross-check also writes each as an object that cc links,
          # whose functions and objects must be clang -O0 -c's (#129). The declared subset must pass. A worker per CPU of
          # the heading's.
          ./build/compiler test-c-testsuite --cross-check --clang clang --jobs "$BUSTER_PARALLEL_CPUS" --subset tests/c-testsuite/subset.txt build/c-testsuite
          == Test the parser's snippets against clang
          # The snippets, each also checked against clang, the generated inputs and the driver's checks.
          ./build/compiler test-parser --clang
          ./build/compiler test-parser --clang tests/parser-handoff/pragma-heavy.c
          == Test Tier 0
          # Generated programs compiled by both paths, which must agree, run against an interpreter of the typed stream;
          # --cross-check also runs them beside clang -O0's builds of the same programs as C, and links those that pass
          # structs and unions by value with clang's functions, calls crossing both ways.
          ./build/compiler test-tier0 --cross-check
          == Test typed postorder checking and source fixtures [2 CPUs]
          ./build/compiler test-checker --seed 133
          == Compare -c's functions and objects with clang -O0 -c's on frozen musl sources
          # #129: each source the checker accepts is written as -c writes it, and must define what clang -O0 -c's object
          # does, but for the three documented reasons (docs/c-lowering.md); a file the backend refuses is counted with the
          # feature it names. Its acceptance against clang -fsyntax-only is compared too, as for any corpus. These eight
          # directories' 348 files that the backend lowers, with every explained difference of musl's (math's), must all
          # be compared: a backend that came to refuse them would otherwise pass by comparing none.
          unset CPATH C_INCLUDE_PATH
          export SOURCE_DATE_EPOCH=1792454400
          corpus=$BUSTER_CORPUS
          musl="$corpus/libc/musl"
          ./build/compiler test-checker-corpus --clang clang --symbols-minimum 354 --no-default-config --target=x86_64-linux-gnu -march=znver5 -std=c99 -ffreestanding -nostdinc -D_XOPEN_SOURCE=700 -Os -pipe \
            -I "$musl/arch/x86_64" -I "$musl/arch/generic" -I "$corpus/musl-generated/obj/src/internal" -I "$musl/src/include" -I "$musl/src/internal" -I "$corpus/musl-generated/obj/include" -I "$musl/include" \
            "$musl/src/math" "$musl/src/string" "$musl/src/stdlib" "$musl/src/fenv" "$musl/src/legacy" "$musl/src/process" "$musl/src/signal" "$musl/src/multibyte"
          == Test the C lexer as C++
          ./build/compiler test-lexer --cplusplus
          ./build/compiler test-lexer --raw-strings
          ./build/compiler test-lexer --raw-strings-c99
          == Test the per-file jobs on the repository's translation units
          # The predefines follow the options as clang's do (c_predefines.c).
          ./build/compiler test-files -target x86_64-pc-linux-gnu -march="$BUSTER_HOST_ARCH" -Isrc -fwrapv -funsigned-char src/buster/compiler/main.c src/buster/compiler/*_benchmark.c
          == Test the runner
          ./build/compiler test-parallel
          == Test c-testsuite's harness
          # The self-test checks the harness's timeouts, relative paths (as the programs' heading gives them) and
          # cross-check rules with a stand-in compiler, in a directory of its own: about 7 s, most of it waiting out
          # the timeouts, so it runs apart from the programs, on one CPU rather than their four.
          ./build/compiler test-c-testsuite --self-test
          == Check semantic mutants of the frozen SQLite and musl sources against Clang
          # #133: each mutant is one edit of a unit's -E text (a type changed, a declaration removed, operands swapped),
          # checked as a file is: acceptance and the first error's line against clang -fsyntax-only, and both paths
          # alike. The seed and counts are fixed; docs/c-checker.md has the wider campaigns.
          unset CPATH C_INCLUDE_PATH
          export SOURCE_DATE_EPOCH=1792454400
          corpus=$BUSTER_CORPUS
          system=(-nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include")
          musl="$corpus/libc/musl"
          ./build/compiler test-checker-corpus --clang clang --semantic-mutations 8 --seed 133 --minimize 0 --no-default-config --target=x86_64-linux-gnu -march=znver5 -std=gnu17 "${system[@]}" "$corpus/sqlite/sqlite3.c"
          ./build/compiler test-checker-corpus --clang clang --semantic-mutations 96 --seed 133 --minimize 0 --no-default-config --target=x86_64-linux-gnu -march=znver5 -std=c99 -ffreestanding -nostdinc -D_XOPEN_SOURCE=700 -Os -pipe \
            -I "$musl/arch/x86_64" -I "$musl/arch/generic" -I "$corpus/musl-generated/obj/src/internal" -I "$musl/src/include" -I "$musl/src/internal" -I "$corpus/musl-generated/obj/include" -I "$musl/include" \
            --files-from tests/preprocessor-oracle/musl-subset.txt --root "$musl"
          == Test the per-file jobs on the frozen musl units
          # #262's corpora: musl's 1,355 units with its build's options, the cache filled on 1, 2, 3 and 8 lanes and with
          # the ids in another order, as test-files does for the repository's units.
          unset CPATH C_INCLUDE_PATH
          corpus=$BUSTER_CORPUS
          musl="$corpus/libc/musl"
          ./build/compiler test-files -std=c99 -nostdinc -ffreestanding -D_XOPEN_SOURCE=700 -I "$musl/arch/x86_64" -I "$musl/arch/generic" \
            -I "$corpus/musl-generated/obj/src/internal" -I "$musl/src/include" -I "$musl/src/internal" -I "$corpus/musl-generated/obj/include" -I "$musl/include" \
            "$musl"/src/*/*.c "$musl"/src/*/x86_64/*.c
          == Test the parser on the repository's translation units
          # Both paths, which must agree kernel by kernel, and accept each unit build.sh compiles, but main_unit_*.c,
          # which are main.c again with another BUSTER_UNIT. clang has accepted each, with -Wall -Werror, in the build,
          # so asking clang -fsyntax-only again (--clang) only repeats that.
          ./build/compiler test-parser -march="$BUSTER_HOST_ARCH" -Isrc -fwrapv -funsigned-char --predefines build/predefines.h $(sed -n 's/^sources=(\(.*\))$/\1/p' build.sh | tr ' ' '\n' | grep -v main_unit_)
          == Test the object writer
          # --cross-check also lists every object with readelf and llvm-readobj, compares it with GNU as's object of the
          # same unit, and links the test programs with GNU ld, lld, mold and wild (through cc for those that call libc)
          # and runs them.
          ./build/compiler test-object-writer --cross-check
          == Test the IR and typed-stream lowering
          ./build/compiler test-ir
          ./build/compiler test-ir-lowering
          ./build/compiler test-ir-parse
          ./build/compiler test-interpreter
          ./build/compiler test-interpreter-native
          ./build/compiler test-interpreter-link
          ./build/compiler test-ir-interpreter
          == Test GNU inline assembly's semantic fixtures against clang
          ./build/compiler test-checker-asm
          == Test the C lexer
          ./build/compiler test-lexer
          == Test the C lexer without // comments, as C94
          ./build/compiler test-lexer --no-line-comments
          == Test the C lexer without digraphs and // comments, as c89
          ./build/compiler test-lexer --no-digraphs --no-line-comments
          == Test integer builtin actions against Clang
          ./build/compiler test-builtins
          ./build/compiler test-builtin-intrinsic-types
          ./build/compiler test-builtin-intrinsic-features
          ./build/compiler test-check-builtins-x86
          ./build/compiler test-check-builtins-vector
          ./build/compiler test-builtin-intrinsic-catalog
          ./build/compiler test-builtin-intrinsic-inventory
          ./build/compiler test-check-builtins
          ./build/compiler test-check-varargs
          ./build/compiler test-tier0-variadic-frame
          ./build/compiler test-check-builtins-misc
          ./build/compiler test-check-builtins-query
          ./build/compiler test-check-builtins-bit-cast
          ./build/compiler test-check-builtins-float
          ./build/compiler test-check-builtins-math
          ./build/compiler test-check-builtins-atomic
          ./build/compiler test-check-builtins-atomic-rmw
          ./build/compiler test-check-builtins-typed-overflow
          ./build/compiler test-check-builtins-rounds
          ./build/compiler test-builtin-lower
          ./build/compiler test-builtin-varargs-lower
          ./build/compiler test-builtin-misc-lower
          ./build/compiler test-builtin-float-lower
          ./build/compiler test-builtin-terminal-helpers
          ./build/compiler test-builtin-atomic-helpers
          ./build/compiler test-builtin-atomic-rmw-helpers
          ./build/compiler test-builtin-rounds-helper
          ./build/compiler test-builtin-math-helpers
          == Test branch sizing
          # --cross-check also prints generated functions as GNU as source with a label at every target, and GNU as's
          # relaxation of them must give the bytes of the sized records.
          ./build/compiler test-branch-sizing --cross-check
          == Test the C lexer without digraphs, as -fno-digraphs
          ./build/compiler test-lexer --no-digraphs
          == Test deferred function bodies against source order
          # #113's fixtures, each through the deferred reader on 1, 2, 3 and 8 lanes with every binding resolution.
          ./build/compiler test-checker-deferred
          == Test the scalar and AVX-512 assembly frontends
          ./build/compiler test-assembler --cross-check
          == Compare source binding columns on main.c
          ./build/compiler test-parser-bindings --clang -march="$BUSTER_HOST_ARCH" -Isrc -fwrapv -funsigned-char --predefines build/predefines.h src/buster/compiler/main.c
          == Check c-testsuite's programs with their bodies read apart on 8 lanes
          # #113: each program checked by the scalar path, the vector path and the deferred reader, whose result must be
          # the vector path's column for column, against clang -fsyntax-only.
          unset CPATH C_INCLUDE_PATH
          ./build/compiler test-checker-corpus --clang clang --deferred 8 build/c-testsuite/tests/single-exec
          == Test the x86-64 encoder
          ./build/compiler test-x86-encoder
          == Test the semantic driver's diagnostics and emission against clang
          ./build/compiler test-checker-driver --executable ./build/compiler
          == Test the semantic driver's diagnostics and emission against clang, with lazy system headers
          ./build/compiler test-checker-driver --executable ./build/compiler --lazy-system-headers
          == Test DWARF source lines and late address finalization
          # The original fixture's debug sections are consumed by readelf, gdb and perf; GNU as supplies its CFI.
          ./build/compiler test-debug --cross-check
          == Test zlib decompression of debug sections against gzip's streams
          ./build/compiler test-inflate
          == Test the C driver's source rows and DWARF
          # --cross-check: the fixture linked with -g, read by llvm-dwarfdump --verify and gdb; and the unwind tables,
          # through backtrace() and gdb at every instruction.
          ./build/compiler test-check-debug --cross-check
          == Test the x86-64 disassembler against GNU tools
          corpus="$(mktemp -d)"
          trap 'rm -rf "$corpus"' EXIT
          clang -O3 -march=znver5 -c examples/disassembler/corpus.c -o "$corpus/corpus.o"
          objcopy -O binary -j .text "$corpus/corpus.o" "$corpus/corpus.text"
          ./build/compiler test-x86-disassembler --objdump --file "$corpus/corpus.text"
          == Test binding
          # --cross-check also links the bound programs with ld.lld and ld.bfd and runs them, and compares what binding
          # found with lld's link of the programs' own objects.
          ./build/compiler test-bind --cross-check
          == Test token refinement
          ./build/compiler test-refinement src
          == Test differential harness accounting, subprocesses and failure preservation
          clang -std=c17 -O2 -Wall -Wextra -Werror tests/differential/lifecycle.c -o build/test-differential-lifecycle &&
          ./build/test-differential-lifecycle ./build/compiler "$(command -v clang)"
          == Test the independent preprocessor fuzz harness in C23
          ./build/compiler test-preprocessor-fuzz --std c23
          == Test Tier 1 selection, liveness and native fragments
          ./build/compiler test-tier1-select --manifest > build/tier1-plan-manifest.csv
          ./build/compiler test-tier1-liveness
          ./build/compiler test-tier1-emit
          ./build/compiler test-tier1-pipeline --cross-check
          ./build/compiler test-tier1-model
          ./build/compiler measure-tier1-model --manifest build/tier1-plan-manifest.csv --verify
          == Test shared IR local promotion and typed-stream semantics
          ./build/compiler test-ssa-ir
          == Check the frozen SQLite source against Clang
          # --deferred 8 also reads its bodies apart on 8 lanes (#113), whose result must be the vector path's. --symbols
          # compares -c's functions and objects with clang -O0 -c's where the backend lowers the file (#129), which it
          # does for sqlite3.c since #567 lowers its atomics: SQLITE_INLINE's allocateSpace is ours alone, "inlined".
          unset CPATH C_INCLUDE_PATH
          export SOURCE_DATE_EPOCH=1792454400
          corpus=$BUSTER_CORPUS
          ./build/compiler test-checker-corpus --clang clang --deferred 8 --symbols --report build/checker-sqlite.tsv --no-default-config --target=x86_64-linux-gnu -march=znver5 -std=gnu17 -nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include" "$corpus/sqlite/sqlite3.c"
          == Test the independent preprocessor fuzz harness in C17
          ./build/compiler test-preprocessor-fuzz --std c17
          == Compare a frozen preprocessor corpus subset with Clang
          # The runner hooks hold the shared host lock for this whole job. This copy is readable by the runner, unlike
          # the original bundle under /home/david. Verify the manifests and every input/header byte first.
          corpus=$BUSTER_CORPUS
          export SOURCE_DATE_EPOCH=1792454400
          printf '%s  %s\n' \
            391e729af6587355050881752558e790299cfe638c7dc7803bd028a8535ebcbd "$corpus/MANIFESTS.sha256" \
            8e6e646951cbd08c07bbc76ff46d6796a83a58e9b1c4959278b60193718cd10c "$corpus/manifests/headers.sha256" \
            e307b836448ef20e603a617a4b5023831c72ff5f307f614c50f4f8833088717c "$corpus/manifests/headers-bundle.sha256" \
            9179b7ad7db7366d12a214b562e478ac703e7ec0376f38f4516756bcf7ee0047 "$corpus/manifests/sqlite.sha256" \
            bf593a94954f3ed9431dd12e60233ec0229f7226a1fc270a701614a20f86baeb "$corpus/manifests/libc.sha256" \
            89dbe35f0324cf08d0cb9cf31ecf15092fc20783a9e470e80e5f41b1d48251d3 "$corpus/manifests/musl-generated.sha256" | sha256sum --check --status
          (cd "$corpus/headers/usr" && sha256sum --check --status "$corpus/manifests/headers.sha256")
          (cd "$corpus/headers" && sha256sum --check --status "$corpus/manifests/headers-bundle.sha256")
          (cd "$corpus/sqlite" && sha256sum --check --status "$corpus/manifests/sqlite.sha256")
          (cd "$corpus/libc" && sha256sum --check --status "$corpus/manifests/libc.sha256")
          (cd "$corpus/musl-generated" && sha256sum --check --status "$corpus/manifests/musl-generated.sha256")
          for entry in headers:headers-bundle libc:libc sqlite:sqlite musl-generated:musl-generated; do
            root="$corpus/${entry%:*}"
            manifest="$corpus/manifests/${entry#*:}.sha256"
            test "$(find "$root" -type f -printf '.\n' | wc -l)" -eq "$(wc -l < "$manifest")"
            test -z "$(find "$root" ! -type d ! -type f -print -quit)"
          done
          system=(-nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include")
          musl="$corpus/libc/musl"
          ./build/compiler test-preprocessor --compare-clang --clang clang -march=znver5 "${system[@]}" "$corpus/sqlite/sqlite3.c" --report build/oracle-sqlite.tsv
          awk -F '\t' 'NR > 1 { counts[$1]++ } END { exit !(counts["identical"] == 1 && NR == 2) }' build/oracle-sqlite.tsv
          ./build/compiler test-preprocessor --compare-clang --clang clang -march=znver5 "${system[@]}" --files-from tests/preprocessor-oracle/libc-subset.txt --root "$corpus/libc" --report build/oracle-libc.tsv
          awk -F '\t' 'NR > 1 { counts[$1]++ } END { exit !(counts["identical"] == 5 && counts["skipped"] == 2 && NR == 8) }' build/oracle-libc.tsv
          ./build/compiler test-preprocessor --compare-clang --clang clang -march=znver5 -std=c99 -ffreestanding -nostdinc -D_XOPEN_SOURCE=700 -Os -pipe \
            -I "$musl/arch/x86_64" -I "$musl/arch/generic" -I "$corpus/musl-generated/obj/src/internal" -I "$musl/src/include" -I "$musl/src/internal" -I "$corpus/musl-generated/obj/include" -I "$musl/include" \
            --files-from tests/preprocessor-oracle/musl-subset.txt --root "$musl" --report build/oracle-musl.tsv
          awk -F '\t' 'NR > 1 { counts[$1]++ } END { exit !(counts["identical"] == 4 && NR == 5) }' build/oracle-musl.tsv
          == Test the C type table
          # Also checks every size, alignment, member offset, bit-field, conversion, composite type and spelling of a
          # random world of types against clang's: clang -fsyntax-only on _Static_asserts, the same file compiled and
          # run, and clang's AST dump.
          ./build/compiler test-types
          == Test selective lowering against its independent oracle and Clang symbols
          ./build/compiler test-lowering --clang
          == Test local SSA construction and its memory interpreter
          ./build/compiler test-ssa
          == Test generated-code ISA policy
          ./build/compiler test-x86-target
          == Test native fixed-frame CFI and generated GDB/perf consumers [2 CPUs]
          ./build/compiler test-unwind --cross-check
          == Test C-source binding identities and scope semantics
          ./build/compiler test-parser-bindings --clang
          == Compare source binding columns on the frozen SQLite input
          corpus=$BUSTER_CORPUS
          ./build/compiler test-parser-bindings --clang -march=znver5 -nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include" "$corpus/sqlite/sqlite3.c"
          == Test the import path
          # --cross-check also compares libc.so.6's exports and references, and the relocations of the crt objects and
          # libc_nonshared.a's members, with readelf's.
          ./build/compiler test-import --cross-check
          == Test streaming the output against writing it at the end, with GDB, perf and llvm-dwarfdump on the data-first layout
          ./build/compiler test-streaming --cross-check
          == Test GNU syntax metadata against clang
          ./build/compiler test-gnu --clang
          == Test experimental Tier 1 scheduling and model coverage
          ./build/compiler test-tier1-schedule
          == Test the x86 semantics
          # The effects table is checked by executing every covered form; --cross-check also assembles the chosen forms
          # with GNU as and compares the bytes.
          ./build/compiler test-x86-semantics --cross-check
          == Test Tier 1 frame planning and slot coloring
          ./build/compiler test-tier1-frame
          ./build/compiler test-tier1-frame-execution
          == Test deferred-body source-position environments
          ./build/compiler test-environments
          == Test the preprocessor directive tables
          ./build/compiler test-preprocessor --tables src
          == Test the profiling tools
          ./build/compiler test-profile
          == Test the oracle cache
          ./build/compiler test-oracle-cache
          == Test deterministic diagnostic ordering
          ./build/compiler test-diagnostics
          == Test the corpus oracle's accounting and process failures
          ./build/compiler test-preprocessor --compare-clang --clang clang -nostdinc --files-from tests/preprocessor-oracle/inputs.txt --root tests/preprocessor-oracle --report build/oracle-accounting.tsv
          awk -F '\t' 'NR > 1 { counts[$1]++ } END { exit !(counts["identical"] == 1 && counts["skipped"] == 1 && NR == 3) }' build/oracle-accounting.tsv
          # Another vendor by -target and its triple, which both sides must get: accepted.input's other branch.
          ./build/compiler test-preprocessor --compare-clang --clang clang -nostdinc -target x86_64-pc-linux-gnu tests/preprocessor-oracle/accepted.input
          if ./build/compiler test-preprocessor --compare-clang --clang /no-such-buster-clang tests/preprocessor-oracle/accepted.input; then exit 1; fi
          if ./build/compiler test-preprocessor --compare-clang --clang /usr/bin/false tests/preprocessor-oracle/accepted.input; then exit 1; fi
          if ./build/compiler test-preprocessor --compare-clang tests/preprocessor-oracle/rejected.input; then exit 1; fi
          if ./build/compiler test-preprocessor --compare-clang tests/preprocessor-oracle/no-such-input.c; then exit 1; fi
          == Test dominators, frontiers and natural loops
          ./build/compiler test-dominators
          == Test scoped name-resolution kernels
          ./build/compiler test-bindings
          == Test verified Tier 1 optimization passes
          ./build/compiler test-ir-optimize
          ./build/compiler test-ir-gvn
          ./build/compiler test-ir-licm
          ./build/compiler test-ir-sroa
          ./build/compiler test-ir-inline
          == Test Tier 1 allocation, reload splitting and rematerialization
          ./build/compiler test-tier1-allocation
          == Test dataflow bitsets
          ./build/compiler test-dataflow
          == Test the partial Zen 5 model and instruction harness
          ./build/compiler test-x86-zen5
          TESTS
          oracle="${XDG_CACHE_HOME:-$HOME/.cache}/buster/oracle"
          if [ "$BUSTER_ORACLE_CACHE" = check ] && [ -d "$oracle" ]; then
              find "$oracle" -type f -mtime +2 -delete
              find "$oracle" -mindepth 1 -type d -empty -delete
          fi

  benchmarks:
    name: Benchmarks on Benchpress (Ryzen 7 9700X)
    needs: [changes, test]
    # An explicit successful test result also covers scheduled/manual runs, whose
    # selector is skipped. Failed, cancelled or skipped tests never queue hardware.
    if: ${{ !cancelled() && github.repository_id == '1421805693' && needs.test.result == 'success' }}
    runs-on:
      group: buster-9700x-service-dispatch
      labels: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 25 || 20 }}
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: znver5
      MEASURE: ${{ needs.changes.outputs.measure || 'all' }}
    steps:
      - name: Verify benchmark host
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          grep -m1 '^model name[[:space:]]*:' /proc/cpuinfo
          grep -Eq '^model name[[:space:]]*:[[:space:]]*AMD Ryzen 7 9700X([[:space:]]|$)' /proc/cpuinfo

      - name: Check out triggering commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Stage official Clang 23.1.4 in the private runner cache
        run: bash tools/ci/setup-benchpress.sh

      - name: Build the Zen 5 benchmark executable
        run: |
          BUSTER_DEBUG_INFO=0 taskset -c 0-7 ./build.sh
          clang -dM -E -march=znver5 -fwrapv -funsigned-char -x c /dev/null > build/predefines.h

      - name: Fetch c-testsuite at its pinned commit
        # #145's programs, at the commit tests/c-testsuite/subset.txt was declared for: a shallow fetch of that one commit,
        # whose hash fixes the files, without git's sample hooks. The test list below compiles and runs them.
        run: |
          git init -q --template= build/c-testsuite
          git -C build/c-testsuite fetch -q --depth 1 https://github.com/c-testsuite/c-testsuite 5c7275656d751de0e68b2d340a95b5681858ed07
          git -C build/c-testsuite checkout -q FETCH_HEAD

      - name: Benchmark the C lexer on the repository sources
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',lexer,')
        run: |
          # Pin to one permitted CPU to avoid migration noise in throughput measurements.
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-lexer src

      - name: Measure the Zen 5 instruction cases
        # The job hook holds the shared lock. Each process interleaves its experiments, in three separate processes
        # where `changes` doesn't rule out the next step. These observations are informational; counter/protocol
        # failures still fail the step.
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',x86-zen5,')
        run: |
          sha256sum build/compiler src/buster/compiler/x86_zen5.c src/buster/compiler/x86_zen5_measure.c
          echo "Zen 5 observation process 1"
          taskset -c 2 ./build/compiler measure-x86-zen5 --passes 11 --iterations 20000

      - name: Measure the Zen 5 instruction cases in two more processes
        # Where `changes` doesn't rule it out (the module's sources): with the process above, three.
        if: needs.changes.outputs.zen5 != 'false'
        run: |
          for sample in 2 3; do
            echo "Zen 5 observation process $sample"
            taskset -c 2 ./build/compiler measure-x86-zen5 --passes 11 --iterations 20000
          done

      - name: Benchmark Zen 5 cost lookup
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',x86-zen5,')
        run: taskset -c 2 ./build/compiler benchmark-x86-zen5

      - name: Benchmark Zen 5 cost lookup in isolation and after scalar work
        # Where `changes` doesn't rule it out (the module's sources): with the plain run above, three processes of each
        # mode.
        if: needs.changes.outputs.zen5 != 'false'
        run: |
          cpu=2
          for sample in 1 2 3; do
            echo "Zen 5 lookup sample $sample"
            if [ "$sample" != 1 ]; then
              taskset -c "$cpu" ./build/compiler benchmark-x86-zen5
            fi
            taskset -c "$cpu" ./build/compiler benchmark-x86-zen5 --only vector
            taskset -c "$cpu" ./build/compiler benchmark-x86-zen5 --only vector --after-scalar 200
          done

      - name: Benchmark x86-64 disassembly
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',x86-disassembler,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-x86-disassembler

      - name: Benchmark the x86-64 encoder
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',x86-encoder,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-x86-encoder

      - name: Benchmark assembly phases
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',assembler,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-assembler

      - name: Check out pinned branch-sizing measurement harnesses
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.branch_sizing != 'false' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: buster14a/buster-performance
          ref: a00d16e47b6f1090b8a0424ab0dd8cb4e6016713 # Initial byte-identical measurement import; see buster-performance/MIGRATION.md.
          path: build/performance-evidence
          sparse-checkout: docs/measurements/x86-lengths-2026-10-23
          persist-credentials: false

      - name: Benchmark branch sizing
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',branch-sizing,') || needs.changes.outputs.branch_sizing == 'true'
        timeout-minutes: 3
        env:
          AB_ENABLED: ${{ github.event_name == 'pull_request' && needs.changes.outputs.branch_sizing != 'false' }}
          AB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-branch-sizing

          if [[ "$AB_ENABLED" == true ]]; then
              [[ "$AB_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              ab_dir="$(mktemp -d "${RUNNER_TEMP}/branch-sizing-ab.XXXXXX")"
              trap 'rm -rf "$ab_dir"' EXIT
              fixture=build/performance-evidence/docs/measurements/x86-lengths-2026-10-23

              # The normal job lock covers this bounded qualification. Use one allowed logical CPU per physical
              # core for scaling, and record the mapping rather than inferring SMT placement from CPU numbers.
              allowed="$(awk '/^Cpus_allowed_list:/ { print $2 }' /proc/self/status)"
              lscpu -e=CPU,SOCKET,CORE,ONLINE
              core_cpus="$(lscpu -p=CPU,CORE,SOCKET,ONLINE | awk -F, -v allowed="$allowed" '
                  BEGIN {
                      n = split(allowed, ranges, ",")
                      for (r = 1; r <= n; r++) {
                          m = split(ranges[r], ends, "-")
                          last = m == 2 ? ends[2] : ends[1]
                          for (c = ends[1]; c <= last; c++) permitted[c] = 1
                      }
                  }
                  $0 !~ /^#/ && $4 == "Y" && permitted[$1] && !seen[$3 ":" $2]++ { print $1 }
              ' | paste -sd, -)"
              test "$(tr ',' '\n' <<< "$core_cpus" | wc -l)" -ge 8
              case ",$core_cpus," in
                  *,2,*) cpu=2 ;;
              esac
              printf 'Allowed CPUs=%s; distinct-core CPUs=%s; module CPU=%s\n' "$allowed" "$core_cpus" "$cpu"

              # The shallow checkout may lack the base object. Fetch only the public base commit, without tokens;
              # read its source files, but do not execute its build scripts or change the checkout.
              if ! git cat-file -e "${AB_BASE_SHA}^{commit}" 2>/dev/null; then
                  GIT_TERMINAL_PROMPT=0 timeout 30s git -c credential.helper= -c http.extraHeader= fetch \
                      --no-tags --no-recurse-submodules --depth=1 https://github.com/buster14a/buster.git "$AB_BASE_SHA"
              fi
              printf 'Matched base=%s checkout=%s cpu=%s\n' "$AB_BASE_SHA" "$(git rev-parse HEAD)" "$cpu"
              clang --version
              for side in before after; do
                  mkdir -p "$ab_dir/$side/src/buster/compiler"
                  for file in lane.c x86_64_encoder.c branch_sizing.c; do
                      dest="$ab_dir/$side/src/buster/compiler/$file"
                      if [[ "$side" == before ]]; then
                          git show "${AB_BASE_SHA}:src/buster/compiler/$file" > "$dest"
                      else
                          cp "src/buster/compiler/$file" "$dest"
                      fi
                  done
                  # Both modules, including the scaling fixture's include, use the same harness and generator.
                  cp src/buster/compiler/branch_sizing_benchmark.c src/buster/compiler/branch_sizing_generate.c \
                      "$ab_dir/$side/src/buster/compiler/"
              done
              before="$ab_dir/before/src/buster/compiler"
              new='branch_sizing_lengths(records, count, offsets, vector)'
              old='branch_sizing_lengths(records, count, offsets, columns.encoded, vector)'
              test "$(grep -Fo "$new" "$before/branch_sizing_benchmark.c" | wc -l)" -eq 1
              if grep -Fq "$old" "$before/branch_sizing.c"; then
                  sed -i "s/$new/$old/" "$before/branch_sizing_benchmark.c"
                  test "$(grep -Fo "$old" "$before/branch_sizing_benchmark.c" | wc -l)" -eq 1
                  echo 'Baseline harness adaptation: old lengths scratch argument only'
              elif ! grep -Fq "$new" "$before/branch_sizing.c"; then
                  echo 'Unsupported baseline branch_sizing_lengths interface' >&2
                  exit 1
              fi

              # Same compiler and production options. Compile all four binaries before serialized timing.
              flags=(-O3 -g -march=native -fwrapv -funsigned-char -fno-strict-aliasing -Wall -Werror -pthread)
              printf 'Standalone flags: %s\n' "${flags[*]}"
              sha256sum "$fixture/benchmark-main.c" "$fixture/scaling.c"
              for side in before after; do
                  tree="$ab_dir/$side/src"
                  sha256sum "$tree"/buster/compiler/*.c
                  timeout 60s clang "${flags[@]}" -I "$tree" "$tree/buster/compiler/branch_sizing_benchmark.c" \
                      "$fixture/benchmark-main.c" -o "$ab_dir/$side-module"
                  timeout 60s clang "${flags[@]}" -I "$tree" "$fixture/scaling.c" -o "$ab_dir/$side-scaling"
              done
              sha256sum "$ab_dir"/*-module "$ab_dir"/*-scaling

              run_module()
              {
                  local side="$1" row="$2" measure="$3" pair="$4"
                  local log="$ab_dir/module-$row-$measure-$pair-$side.log"
                  printf '\nMatched module pair=%s side=%s row=%s measure=%s\n' "$pair" "$side" "$row" "$measure"
                  timeout 20s taskset -c "$cpu" "$ab_dir/$side-module" \
                      --seed 1 --only "$row" --measure "$measure" --samples 11 2>&1 | tee "$log"
                  test "$(grep -c "^$row: " "$log")" -eq 1
                  test "$(grep -c ' ns per record ' "$log")" -eq 1
                  grep "^$row: " "$log" > "$log.identity"
              }
              run_scaling()
              {
                  local side="$1" workers="$2" pair="$3"
                  local log="$ab_dir/scaling-$workers-$pair-$side.log"
                  printf '\nMatched scaling pair=%s side=%s workers=%s passes=200\n' "$pair" "$side" "$workers"
                  # The fixture pins workers within this distinct-physical-core mask, never a one-CPU taskset.
                  timeout 30s taskset -c "$core_cpus" "$ab_dir/$side-scaling" "$workers" 200 tier0-mix 2>&1 | tee "$log"
                  test "$(grep -c '^row=' "$log")" -eq 1
                  grep '^row=' "$log" | tr ' ' '\n' |
                      grep -E '^(row|workers|passes|seed|warmup|functions_per_worker|records_per_worker|encoded_bytes_per_worker|checksum|reference|coordinator_cpu|worker_cpus)=' \
                      > "$log.identity"
                  test "$(wc -l < "$log.identity")" -eq 12
              }
              for pair in 1 2 3; do
                  order=(before after)
                  if [[ "$pair" == 2 ]]; then
                      order=(after before)
                  fi
                  for row in tier0-40 tier0-mix tier0-2000; do
                      measures=(vector-lengths size_branches size_encode)
                      if [[ "$row" == tier0-mix ]]; then
                          measures+=(x86_encode)
                      fi
                      for measure in "${measures[@]}"; do
                          for side in "${order[@]}"; do
                              run_module "$side" "$row" "$measure" "$pair"
                          done
                          diff -u "$ab_dir/module-$row-$measure-$pair-before.log.identity" \
                              "$ab_dir/module-$row-$measure-$pair-after.log.identity"
                      done
                  done
                  for workers in 1 8; do
                      for side in "${order[@]}"; do
                          run_scaling "$side" "$workers" "$pair"
                      done
                      diff -u "$ab_dir/scaling-$workers-$pair-before.log.identity" "$ab_dir/scaling-$workers-$pair-after.log.identity"
                  done
              done
              echo 'Matched branch-sizing qualification completed: 3 pairs per case'
          fi

      - name: Benchmark the x86 semantics
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',x86-semantics,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-x86-semantics

