name: 9700X test

# This public repository must not execute unreviewed fork code on the host.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
  # Once a day, the measurements a push to main leaves out (`changes`).
  schedule:
    - cron: '23 7 * * *'
  # Every pull request runs the workflow, since its job is a required check: a pull request that changes only
  # documentation gets the job skipped by `changes`, which counts as passed, rather than no check at all, which blocks
  # the merge.
  pull_request:

permissions:
  contents: read

# Keep each PR/ref's pending runs separate: older branches using a single repository-wide pending slot otherwise
# cancel another PR's qualification. Each group keeps one pending run, GitHub's default: a newer push replaces its
# pending run, which would only qualify a commit already superseded. A newer push to a PR also cancels the PR's run in
# progress, which is mostly a job waiting for the 9700X (the slot is held from then on, so a run waiting hours would
# otherwise still run for its stale commit); a push to main lets main's run finish. The daily run has a group of its
# own, so that a push to main doesn't replace it while it waits. The runner's job hooks serialize all jobs with the
# shared host lock (AGENTS.md).
concurrency:
  group: buster-fast-9700x-${{ github.event.pull_request.number || (github.event_name == 'schedule' && 'schedule') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request changes anything but documentation (`docs/**` and `*.md`, as `push`'s paths-ignore), on a
  # GitHub-hosted runner so that it doesn't wait for the 9700X: the files the merge changes against its base. When this
  # job fails, `test` runs, with every benchmark. And whether it changes the harnesses of the baselines, the linkers'
  # times and the floors (link_benchmark.c and floors_benchmark.c): they measure other programs and the machine, the same
  # for every pull request, so `test` measures them on the daily and dispatched runs and on pull requests that change
  # these harnesses, as when this job is skipped or fails. The same for benchmark-foreign's mold and wild
  # (foreign_benchmark.c's `--linkers`), apart, since its harness changes with the foreign path's phases. And, per
  # module, whether it changes the sources of a benchmark whose isolated and after-scalar samples (`--only`,
  # `--after-scalar 200`, repeated in separate processes) cost far more than its plain run: about 200 ms before each of
  # 21 samples per case, 150 s of a pull request's job in all. Those samples run on the daily and dispatched runs and on
  # pull requests that change what they measure.
  # And which plain benchmarks, with their checks against the scalar twins, a pull request runs (`measure`): those whose
  # sources it changes, and those whose steps it changes (the branch-sizing qualification too: its steps or its
  # sources). A benchmark built as a translation unit of its own (build.sh's *_benchmark.c) measures what that unit
  # includes, which this job reads from the #include lines; one in main.c's units measures the files that define the
  # functions it calls, as `benchmarks` names them. The plain runs took about 105 s of a pull request's 230, most of them
  # measuring code the pull request doesn't change; a change to build.sh runs every one.
  # On a push to main, whose pull request's run measured what it changes, every output but `code` is `false`: the full
  # set took the job past its 10 minutes on every push, which then failed, having kept the 9700X from every pull
  # request's job meanwhile. A push runs every plain benchmark (`measure` is `all`), so that main has each one's numbers
  # at every commit. The daily and dispatched runs, which skip this job, have the full set.
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      baselines: ${{ steps.files.outputs.baselines }}
      foreign: ${{ steps.files.outputs.foreign }}
      branch_sizing: ${{ steps.files.outputs.branch_sizing }}
      zen5: ${{ steps.files.outputs.zen5 }}
      ssa: ${{ steps.files.outputs.ssa }}
      parser_bindings: ${{ steps.files.outputs.parser_bindings }}
      environments: ${{ steps.files.outputs.environments }}
      ir: ${{ steps.files.outputs.ir }}
      ir_lowering: ${{ steps.files.outputs.ir_lowering }}
      ir_optimize: ${{ steps.files.outputs.ir_optimize }}
      checker: ${{ steps.files.outputs.checker }}
      files: ${{ steps.files.outputs.files }}
      measure: ${{ steps.files.outputs.measure }}
    steps:
      - name: Check out the triggering commit and its parents
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - id: files
        shell: bash
        run: |
          set -euo pipefail
          modules=(zen5 ssa parser_bindings environments ir ir_lowering ir_optimize checker files)
          # The sources each module's conditioned benchmark samples measure, under src/buster/compiler/.
          declare -A sources=(
              [zen5]='x86_zen5[a-z_]*'
              [ssa]='ssa|ssa_program|ssa_benchmark|dominators'
              [parser_bindings]='c_parser|c_parser_binding_trace|c_parser_bindings[a-z_]*|c_bindings[a-z_]*'
              [environments]='c_environment[a-z_]*'
              [ir]='ir|ir_validate|ir_benchmark'
              [ir_lowering]='ir|ir_validate|ir_lower|ir_lower_emit|ir_lower_benchmark'
              [ir_optimize]='ir|ir_validate|ir_optimize[a-z_]*'
              [checker]='c_check[a-z_]*'
              [files]='c_files[a-z_]*'
          )
          # The plain benchmarks, each by the name its commands take after benchmark- or measure-, and the sources it
          # measures: `unit:FILE`, the translation unit of its own whose includes it measures, or for one in main.c's
          # units a pattern of the files under src/buster/compiler/ that define the functions it calls, transitively.
          declare -A benchmarks=(
              [lexer]='unit:c_lexer_benchmark.c'
              [x86-zen5]='x86_64_encoder|x86_zen5[a-z_]*'
              [x86-disassembler]='unit:x86_64_disassembler_benchmark.c'
              [x86-encoder]='unit:x86_64_encoder_benchmark.c'
              [assembler]='assembler[a-z_]*|branch_sizing|c_intern|c_lexer|c_predefines|c_preprocessor|c_refine|lane|link|object_writer|x86_64_encoder|x86_match|x86_target[a-z_]*'
              [branch-sizing]='unit:branch_sizing_benchmark.c'
              [x86-semantics]='unit:x86_semantics_benchmark.c'
              [lanes]='unit:lane_benchmark.c'
              [dataflow]='unit:dataflow_benchmark.c'
              [ssa]='dataflow|dominators|lane|ssa|ssa_benchmark|ssa_program'
              [preprocessor-fuzz]='preprocessor_fuzz[a-z_]*|c_preprocessor[a-z_]*|c_predefines[a-z_]*|c_builtin_catalog|c_intern|c_lexer|c_refine|lane|x86_target'
              [object-writer]='unit:object_writer_benchmark.c'
              [debug]='debug[a-z_]*|lane'
              [import]='unit:import_benchmark.c'
              [bind]='unit:bind_benchmark.c'
              [executable]='unit:executable_benchmark.c'
              [snapshot]='unit:snapshot_benchmark.c'
              [foreign]='unit:foreign_benchmark.c'
              [foreign-strings]='foreign[a-z_]*|bind[a-z_]*|dynamic[a-z_]*|executable[a-z_]*|import[a-z_]*|link[a-z_]*|object_writer[a-z_]*|runtime|c_lexer[a-z_]*|lane|x86_64_encoder[a-z_]*'
              [link]='unit:link_benchmark.c'
              [refinement]='unit:c_refine_benchmark.c'
              [preprocessor]='unit:c_preprocessor_benchmark.c'
              [files]='unit:c_files_benchmark.c'
              [parser]='unit:c_parser_benchmark.c'
              [lowering]='c_lowering[a-z_]*|lane'
              [lowering-source]='c_check[a-z_]*|c_builtin[a-z_]*|c_bindings|c_environment|c_gnu|c_intern|c_lexer[a-z_]*|c_lowering[a-z_]*|c_parser[a-z_]*|c_predefines[a-z_]*|c_preprocessor[a-z_]*|c_refine|c_types|preprocessor_fuzz[a-z_]*|tier0[a-z_]*|calling_convention|branch_sizing|unwind[a-z_]*|debug|link|object_writer|import|lane|x86_64_encoder|x86_semantics|x86_target'
              [gnu]='c_bindings|c_gnu[a-z_]*|c_intern|c_lexer[a-z_]*|c_parser|c_parser_binding_trace|c_predefines|c_preprocessor|c_refine|lane|x86_target'
              [parser-bindings]='c_bindings[a-z_]*|c_gnu|c_intern|c_lexer[a-z_]*|c_parser[a-z_]*|c_predefines|c_preprocessor|c_refine|lane|x86_target'
              [types]='unit:c_types_benchmark.c'
              [environments]='c_bindings[a-z_]*|c_environment[a-z_]*|c_types[a-z_]*|lane'
              [calling-convention]='unit:calling_convention_benchmark.c'
              [checker]='unit:c_checker_benchmark.c'
              [checker-source]='c_check[a-z_]*|c_builtin[a-z_]*|c_bindings|c_environment|c_gnu|c_intern|c_lexer[a-z_]*|c_lowering|c_parser[a-z_]*|c_predefines[a-z_]*|c_preprocessor[a-z_]*|c_refine|c_types|preprocessor_fuzz[a-z_]*|bind|dynamic|executable|import|lane|link|object_writer|runtime|snapshot|x86_64_encoder|x86_target'
              [checker-bindings]='c_check[a-z_]*|c_builtin[a-z_]*|c_bindings|c_environment|c_gnu|c_intern|c_lexer[a-z_]*|c_lowering|c_parser[a-z_]*|c_predefines[a-z_]*|c_preprocessor[a-z_]*|c_refine|c_types|preprocessor_fuzz[a-z_]*|bind|dynamic|executable|import|lane|link|object_writer|runtime|snapshot|x86_64_encoder|x86_target'
              [backend]='unit:tier0_benchmark.c'
              [unwind]='unwind[a-z_]*|debug[a-z_]*|c_types|calling_convention|lane|tier0|tier0_generate|x86_64_encoder|x86_semantics'
              [streaming]='streaming[a-z_]*|unwind[a-z_]*|debug|executable|link[a-z_]*|object_writer[a-z_]*|c_types|calling_convention|lane|tier0|tier0_generate|x86_64_encoder|x86_semantics'
              [ir]='ir|ir_validate|ir_benchmark|lane'
              [ir-lowering]='ir|ir_validate|ir_benchmark|ir_lower[a-z_]*|ssa|ssa_ir|dataflow|dominators|tier0[a-z_]*|c_types|calling_convention|link|object_writer|lane|x86_64_encoder|x86_semantics'
              [ir-optimize]='ir|ir_validate|ir_optimize|ir_optimize_benchmark|ir_optimize_test|dominators|lane'
              [ir-optimize-passes]='ir|ir_validate|ir_optimize[a-z_]*|ssa|ssa_ir|dataflow|dominators|lane'
          )
          # Prints the repository's files that the translation unit $1 includes ("buster/..." under src/),
          # transitively, itself among them.
          includes()
          {
              local -A seen=()
              local queue=("$1")
              while [ "${#queue[@]}" -gt 0 ]; do
                  local file="${queue[0]}"
                  queue=("${queue[@]:1}")
                  if [ -z "${seen[$file]-}" ] && [ -f "$file" ]; then
                      seen[$file]=1
                      echo "$file"
                      while read -r included; do
                          queue+=("src/$included")
                      done < <(sed -n 's/^[[:space:]]*#[[:space:]]*include[[:space:]]*"\(buster\/[^"]*\)".*/\1/p' "$file")
                  fi
              done
          }
          # Writes each step of the workflow on standard input to a file of its own in the directory $1, named by the
          # step's name, so that a step a pull request changes is a file that differs.
          split_steps()
          {
              mkdir -p "$1"
              awk -v directory="$1" '
                  /^  [^ ]/ || /^      - / { if (file != "") close(file); file = "" }
                  /^      - name: / { name = substr($0, 15); gsub(/[^A-Za-z0-9]+/, "-", name); file = directory "/" name }
                  file != "" { print >> file }
              '
          }
          declare -A measure
          if [ "$GITHUB_EVENT_NAME" = push ]; then
              # push's paths-ignore leaves out documentation alone.
              code=true
              baselines=false
              foreign=false
              branch_sizing=false
              for module in "${modules[@]}"; do
                  measure[$module]=false
              done
              selected=all
          else
              # The merge's changes against its base, both names of a file renamed.
              git diff --no-renames --name-only HEAD^1 HEAD > files
              if grep -Ev '^docs/|\.md$' files > /dev/null; then
                  code=true
              else
                  code=false
              fi
              if grep -Ex 'src/buster/compiler/(link|floors)_benchmark\.c' files > /dev/null; then
                  baselines=true
              else
                  baselines=false
              fi
              if grep -Ex 'src/buster/compiler/foreign_benchmark\.c' files > /dev/null; then
                  foreign=true
              else
                  foreign=false
              fi
              if grep -Ex 'src/buster/compiler/(x86_64_encoder|branch_sizing(_benchmark|_generate)?)\.c' files > /dev/null; then
                  branch_sizing=true
              else
                  branch_sizing=false
              fi
              for module in "${modules[@]}"; do
                  if grep -Ex "src/buster/compiler/(${sources[$module]})\.c" files > /dev/null; then
                      measure[$module]=true
                  else
                      measure[$module]=false
                  fi
              done
              # The steps of this workflow that the merge changes or adds, and the commands they run.
              workflow=.github/workflows/9700x.yml
              if git cat-file -e "HEAD^1:$workflow" 2> /dev/null; then
                  git show "HEAD^1:$workflow" | split_steps steps/base
              else
                  mkdir -p steps/base
              fi
              split_steps steps/head < "$workflow"
              : > commands
              for step in steps/head/*; do
                  if ! cmp -s "$step" "steps/base/${step##*/}"; then
                      echo "Changes the step ${step##*/}"
                      grep -ohE '\./build/compiler (benchmark|measure)-[a-z0-9-]+' "$step" | sed 's/.* //' >> commands || true
                      case "${step##*/}" in
                          Check-out-pinned-branch-sizing-measurement-harnesses|Benchmark-branch-sizing) branch_sizing=true ;;
                      esac
                  fi
              done
              if grep -Fx build.sh files > /dev/null; then
                  selected=all
              else
                  selected=,
                  for name in $(printf '%s\n' "${!benchmarks[@]}" | sort); do
                      spec="${benchmarks[$name]}"
                      if [[ "$spec" == unit:* ]]; then
                          includes "src/buster/compiler/${spec#unit:}" > closure
                          changed=$(grep -Fxf closure files || true)
                      else
                          changed=$(grep -Ex "src/buster/compiler/($spec)\.c" files || true)
                      fi
                      if [ -n "$changed" ] || grep -Ex "(benchmark|measure)-$name" commands > /dev/null; then
                          selected="$selected$name,"
                      fi
                  done
              fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "baselines=$baselines" >> "$GITHUB_OUTPUT"
          echo "foreign=$foreign" >> "$GITHUB_OUTPUT"
          echo "branch_sizing=$branch_sizing" >> "$GITHUB_OUTPUT"
          for module in "${modules[@]}"; do
              echo "$module=${measure[$module]}" >> "$GITHUB_OUTPUT"
          done
          echo "measure=$selected" >> "$GITHUB_OUTPUT"
          echo "Changes code: $code"
          echo "Changes the baselines' harnesses: $baselines"
          echo "Changes the foreign inputs' benchmark: $foreign"
          echo "Changes the branch-sizing implementation or its qualification's steps: $branch_sizing"
          for module in "${modules[@]}"; do
              echo "Changes what $module's conditioned benchmark samples measure: ${measure[$module]}"
          done
          echo "Runs the plain benchmarks: $selected"

  test:
    name: Build and execute on Ryzen 7 9700X
    needs: changes
    # Runs after `changes` unless it found documentation alone; also when `changes` was skipped (the daily and
    # dispatched runs) or failed.
    if: ${{ !cancelled() && github.repository_id == '1421805693' && needs.changes.outputs.code != 'false' }}
    runs-on:
      group: buster-9700x-service-dispatch
      labels: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
    # The full set of measurements takes about 13 minutes; every other run, about 4 to 7.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 25 || 10 }}
    defaults:
      run:
        shell: bash
    # The plain benchmarks this run measures, by the names their commands take after benchmark- or measure-: `changes`'
    # list for a pull request (",lexer,parser,"), and on any other run, or when `changes` failed, all of them.
    env:
      MEASURE: ${{ needs.changes.outputs.measure || 'all' }}
    steps:
      - name: Verify host and bootstrap compiler
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          grep -m1 '^model name[[:space:]]*:' /proc/cpuinfo
          grep -Eq '^model name[[:space:]]*:[[:space:]]*AMD Ryzen 7 9700X([[:space:]]|$)' /proc/cpuinfo
          clang --version

      - name: Check out triggering commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build only the compiler executable, and beside it the external Clang pragma token oracle
        # Without debug information, which nothing here reads: it took a fifth of the build's time (BUSTER_DEBUG_INFO,
        # build.sh). The build waits for its longest unit with CPUs to spare, so the oracle builds meanwhile, outside
        # build/, which build.sh makes anew and which must hold the compiler alone.
        run: |
          oracle="$RUNNER_TEMP/preprocessor-pragma-oracle"
          bash tools/build-preprocessor-pragma-oracle.sh "$oracle" > "$RUNNER_TEMP/oracle.log" 2>&1 &
          building=$!
          BUSTER_DEBUG_INFO=0 ./build.sh
          test -x build/compiler
          test "$(find build -type f -executable | wc -l)" -eq 1
          status=0
          wait "$building" || status=$?
          cat "$RUNNER_TEMP/oracle.log"
          test "$status" -eq 0
          printf 'BUSTER_PPF_PRAGMA_ORACLE=%s\n' "$oracle" >> "$GITHUB_ENV"

      - name: Check out reviewed first-party performance fixtures and acceptance harnesses
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: buster14a/buster-performance
          ref: 1c0523ac42bb2f33e212226cf94626ac942ee4d2 # Reviewed source/evidence from buster-performance PR #8.
          path: build/performance-reader-evidence
          sparse-checkout: |
            docs/measurements/performance-format-2026-10-24
            docs/measurements/performance-first-party-2026-10-25
            docs/measurements/performance-pages-2026-10-25
            docs/measurements/foreign-strings-2026-10-23/raw
          persist-credentials: false

      - name: Qualify first-party performance readers and frozen import on the 9700X
        # The runner's job hook already holds the shared host lock. Use the
        # existing Clang/C runtime only; no dependency setup or downloader.
        run: |
          set -euo pipefail
          reader_root=build/performance-reader-evidence
          reader_fixture="$reader_root/docs/measurements/performance-format-2026-10-24"
          reader_harness="$reader_root/docs/measurements/performance-first-party-2026-10-25"
          bash tools/performance/build.sh
          build/performance/bmf --self-test
          clang -std=c17 -D_GNU_SOURCE -O2 -g -Wall -Wextra -Werror \
            -I tools/performance "$reader_harness/validate.c" -o build/performance/test-first-party
          build/performance/test-first-party "$reader_fixture" "$reader_root" \
            docs/performance/buster-manifest-v1.schema.json
          clang -std=c17 -D_GNU_SOURCE -O2 -g -Wall -Wextra -Werror \
            -I tools/performance "$reader_harness/import-tests.c" -o build/performance/test-import-first-party
          build/performance/test-import-first-party
          build/performance/bmf validate "$reader_harness/history/census/manifest.bmf.json"
          build/performance/bmf validate "$reader_harness/history/foreign-strings/manifest.bmf.json" \
            --evidence-root "$reader_root"
          pages_harness="$reader_root/docs/measurements/performance-pages-2026-10-25"
          clang -std=c17 -D_GNU_SOURCE -O2 -g -Wall -Wextra -Werror \
            -I tools/performance "$pages_harness/profile-validation.c" -o build/performance/test-profile
          build/performance/test-profile "$reader_fixture/profile-example/capture.pftrace" \
            "$pages_harness/profile/capture.pftrace"
          build/performance/bmf validate "$pages_harness/profile/manifest.bmf.json"
          for manifest in "$pages_harness/history-partitioned/"*.bmf.json; do
            build/performance/bmf validate "$manifest"
          done
          build/performance/capture --no-sampling build/performance/qualification-launch 2 1000000 \
            -- /usr/bin/true
          pages_source=$(git rev-parse HEAD)
          pages_evidence=1c0523ac42bb2f33e212226cf94626ac942ee4d2
          pages_index=docs/measurements/performance-pages-2026-10-25/site-index.json
          build/performance/publish . "$pages_source" "$reader_root" "$pages_evidence" \
            "$pages_index" build/performance/pages-check-1 2026-10-25T13:19:28Z
          build/performance/publish . "$pages_source" "$reader_root" "$pages_evidence" \
            "$pages_index" build/performance/pages-check-2 2026-10-25T13:19:28Z
          diff -rq build/performance/pages-check-1 build/performance/pages-check-2

      - name: Write clang's predefines for the compiler's flags
        # For the steps that preprocess the compiler's own translation units: --predefines supplies the macro effects of
        # flags such as -funsigned-char.
        run: clang -dM -E -march=native -fwrapv -funsigned-char -x c /dev/null > build/predefines.h

      - name: Parse the compiler source
        # Preserve this parser smoke test explicitly now that the default C command performs semantic checking.
        # Default C checking and object emission have their own external-oracle tests below.
        run: ./build/compiler parse -fsyntax-only -march=native -Isrc -fwrapv -funsigned-char --predefines build/predefines.h src/buster/compiler/main.c

      - name: Fetch c-testsuite at its pinned commit
        # #145's programs, at the commit tests/c-testsuite/subset.txt was declared for: a shallow fetch of that one commit,
        # whose hash fixes the files, without git's sample hooks. The test list below compiles and runs them.
        run: |
          git init -q --template= build/c-testsuite
          git -C build/c-testsuite fetch -q --depth 1 https://github.com/c-testsuite/c-testsuite 5c7275656d751de0e68b2d340a95b5681858ed07
          git -C build/c-testsuite checkout -q FETCH_HEAD

      - name: Run the tests at once
        # Tests don't need the machine to themselves, unlike the benchmarks after them, which run one at a time and
        # pinned. build/compiler parallel (AGENTS.md, "The parallel runner") runs each test below in a bash of its own,
        # as a step's `run` runs, one per core of the CPUs the job may use and unpinned (test-lanes and test-files run
        # lanes of their own), and prints each test's output in a group of its own in this order, then names the tests
        # that failed. A test still running after 180 s is killed and fails. They come in the order of their times
        # in the job, the longest first, so that they start first: in the order before, the longest started among
        # the last and the step took 64 s. Started together, the longest run slower (the checker's four commands took
        # 50 s as one entry, where they had taken 33 to 37 s), so a test is one command where it can be, and the
        # step's bound is its longest one and the tests' 310 s on 8 jobs, about 39 s. A new test goes where its time
        # puts it.
        run: |
          ./build/compiler parallel --github --timeout 180 <<'TESTS'
          == Test typed postorder checking and source fixtures
          ./build/compiler test-checker --seed 133
          == Test the preprocessor's cases against clang
          # --clang also preprocesses each case with clang -E and compares the tokens. Two workers share the fuzz
          # batch's 3,000 cases (--jobs, which the cases don't depend on), about 9 s of this, the longest test, at the
          # qualification runs' 3 ms of a thread per case.
          ./build/compiler test-preprocessor --clang --jobs 2
          == Test the parser's snippets against clang
          # The snippets, each also checked against clang, the generated inputs and the driver's checks.
          ./build/compiler test-parser --clang
          == Test the preprocessor on the repository's translation units against clang
          # --clang also preprocesses each unit with clang -E, with clang's predefines for its options, and compares the
          # tokens. -target and its triple (clang's default) go to both.
          ./build/compiler test-preprocessor --clang -target x86_64-pc-linux-gnu -march=native -Isrc -fwrapv -funsigned-char src/buster/compiler/main.c src/buster/compiler/*_benchmark.c
          == Test the per-file jobs on the repository's translation units
          # The predefines follow the options as clang's do (c_predefines.c).
