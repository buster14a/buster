          taskset -c "$cpu" ./build/compiler benchmark-checker --shape chain --nodes 4096

      - name: Benchmark typed checking on frozen SQLite bodies
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',checker-source,')
