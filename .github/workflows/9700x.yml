name: Measure preprocessor performance for PR 3663
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preprocessor-comparison:
    if: github.repository_id == '1421805693'
    runs-on:
      group: buster-9700x-service-dispatch
      labels: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: znver5
      BUSTER_DEBUG_INFO: '0'
      BASE_SHA: c9921c19dcb75d9af678530ee7045da4971d622c
      MERGE_SHA: 03439a5216404aac977ae0cb7845181c6614823d
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.MERGE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline
          persist-credentials: false
      - name: Verify Benchpress and stage the official build tools
        run: |
          grep -Em1 '^model name[[:space:]]*:[[:space:]]*AMD Ryzen 7 9700X([[:space:]]|$)' /proc/cpuinfo
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          bash tools/ci/setup-benchpress.sh
      - name: Build both revisions and run the caret oracle
        run: |
          ./build.sh --config Release --jobs 8
          (cd baseline && ./build.sh --config Release --jobs 8)
          ./build/compiler test-carets --clang "$(command -v clang)"
      - name: Measure paired preprocessor and printer timings
        run: |
          evidence="$RUNNER_TEMP/preprocessor-pr3663"
          mkdir -p "$evidence"
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          corpus=/var/lib/buster-9700x/corpora/preprocessor-391e729af658
          main=(-target x86_64-pc-linux-gnu -march=native -Isrc -fwrapv -funsigned-char -DBUSTER_COMPLETE_DRIVER=1 src/buster/compiler/main.c)
          sqlite=(--predefines "$corpus/provenance/gnu17-pinned-predefines.txt" --target=x86_64-linux-gnu -march=znver5 -std=gnu17 -nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include" "$corpus/sqlite/sqlite3.c")
          unset CPATH C_INCLUDE_PATH
          {
            printf 'base=%s\nmerge=%s\ncpu=%s\n' "$BASE_SHA" "$MERGE_SHA" "$cpu"
            clang --version
            sha256sum build/compiler baseline/build/compiler "$corpus/sqlite/sqlite3.c"
          } | tee "$evidence/identity.txt"
          snapshot_load() {
            ps -eo psr,pcpu,pid,etimes,user,comm --sort=-pcpu | sed -n '1,10p'
            cat /proc/loadavg
          }
          snapshot_load > "$evidence/load-before.txt"
          for pair in 1 2 3 4; do
            sides=(baseline candidate)
            if (( pair % 2 == 0 )); then
              sides=(candidate baseline)
            fi
            for workload in main sqlite; do
              flags=("${main[@]}")
              if [[ "$workload" == sqlite ]]; then
                flags=("${sqlite[@]}")
              fi
              for side in "${sides[@]}"; do
                compiler=./build/compiler
                if [[ "$side" == baseline ]]; then
                  compiler=./baseline/build/compiler
                fi
                printf '\nPair %s %s %s\n' "$pair" "$workload" "$side"
                taskset -c "$cpu" "$compiler" benchmark-preprocessor "${flags[@]}" |
                  tee "$evidence/$workload.$pair.$side.txt"
              done
            done
          done
          snapshot_load > "$evidence/load-after.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preprocessor-pr3663
          path: ${{ runner.temp }}/preprocessor-pr3663
