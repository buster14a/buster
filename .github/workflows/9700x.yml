name: Tests and Zen 5 benchmarks

# A nightly dispatch (.github/workflows/nightly-backfill.yml) runs on a nightly/SHA branch at one first-parent state of
# main, so that its run, its checks and its definition are that commit's own; its name says what it measures.
run-name: ${{ github.event_name == 'workflow_dispatch' && (inputs.purpose == 'backlog' || inputs.purpose == 'snapshot') && format('Nightly {0} ({1}) of {2} [{3}]', inputs.purpose, inputs.hardware, github.sha, inputs.request) || '' }}

# This public repository must not execute unreviewed fork code on the host.
on:
  # Every main update gets full hosted correctness, including documentation-only merges (#1271).
  push:
    branches: [main]
  # `full` is the on-demand run of everything on the dispatched branch's head, as before. `backlog` and `snapshot`
  # are the nightly coordinator's (docs/ci.md, "Nightly main measurements"): a first-parent state of main measured
  # against its first parent, or comprehensively, inside 02:00-08:00 Europe/Madrid unless `override` gives a reason.
  workflow_dispatch:
    inputs:
      purpose:
        description: 'full: every hosted row, fuzzing and every measurement of this branch''s head. backlog/snapshot: the nightly coordinator''s'
        type: choice
        options: [full, backlog, snapshot]
        default: full
      hardware:
        description: 'backlog/snapshot: admit (measure in the window) or defer (hosted qualification alone)'
        type: choice
        options: [admit, defer]
        default: admit
      snapshot:
        description: 'backlog/snapshot: the cycle''s pinned main commit, whose first-parent history must contain this one (empty: main)'
        type: string
        default: ''
      request:
        description: 'backlog/snapshot: the coordinator''s request token (YYYYMMDD.RUN.SEQUENCE.admit|defer)'
        type: string
        default: manual
      override:
        description: 'backlog/snapshot with admit: why to measure outside 02:00-08:00 Europe/Madrid (reported); empty enforces the window'
        type: string
        default: ''
  # No schedule: the daily `23 7 * * *` run is removed (the owner's choice on 2026-11-05). nightly-backfill.yml's
  # comprehensive snapshot run is the daily run now, every hosted row, the fuzz campaigns and the full measurements;
  # the `schedule` handling below stays for a run GitHub may still deliver, which the nightly mode retires.
  # Every pull request runs the workflow, since its job is a required check: a pull request that changes only
  # documentation gets the job skipped by `changes`, which counts as passed, rather than no check at all, which blocks
  # the merge.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  # A merge-queue candidate (#1430): GitHub's temporary merge of main, the queue's entries ahead of it and its pull
  # request, on a gh-readonly-queue/main/... branch. It runs the full hosted contract once (every row and sanitizer, the
  # vector pool and the fuzz campaigns; docs/ci.md, "The merge queue") and reports both required contexts, so that a
  # ruleset requiring the queue merges only what passed. Nothing triggers it until a ruleset turns the queue on. No
  # path filter: every candidate runs, documentation alone included. `checks_requested` is the event's only type,
  # named so that a type GitHub adds later doesn't start runs.
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

# Keep each PR's replaceable queue separate: a newer push cancels only that PR's superseded qualification.
# Every push to main gets its own run-id group. cancel-in-progress: false alone would still allow a later merge to
# replace an earlier pending main run in GitHub's default single pending slot; all main revisions need the full
# hosted matrix and fuzzing (#1271). So does every merge-queue candidate (#1430): the queue builds several at once,
# and one candidate's run must neither cancel nor replace another's. The daily run and manual refs retain their own
# groups. The runner's job hooks still serialize hardware jobs with the shared host lock (AGENTS.md), not the hosted
# correctness runs.
concurrency:
  group: buster-fast-9700x-${{ github.event.pull_request.number || (github.event_name == 'push' && format('push-{0}', github.run_id)) || (github.event_name == 'merge_group' && format('queue-{0}', github.run_id)) || (github.event_name == 'schedule' && 'schedule') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request changes anything but documentation (`docs/**` and `*.md`, docs/performance aside), on a
  # GitHub-hosted runner so that it doesn't wait for the 9700X: the files the merge changes against its base. The selector must pass before tests or benchmarks run. And whether it changes the harnesses of the baselines, the linkers'
  # times and the floors (link_benchmark.c and floors_benchmark.c): they measure other programs and the machine, the same
  # for every pull request, so `benchmarks` measures them on the daily and dispatched runs and on pull requests that change
  # these harnesses, as when this job is skipped or fails. The same for benchmark-foreign's mold and wild
  # (foreign_benchmark.c's `--linkers`), apart, since its harness changes with the foreign path's phases, and for
  # benchmark-preprocessor's `clang -E` (`--clang`, `preprocessor_clang`: c_preprocessor_benchmark.c). And, per
  # module, whether it changes the sources of a benchmark whose isolated and after-scalar samples (`--only`,
  # `--after-scalar 200`, repeated in separate processes) cost far more than its plain run: about 200 ms before each of
  # 21 samples per case, 150 s of a pull request's job in all. Those samples run on the daily and dispatched runs and on
  # pull requests that change what they measure. The same for the first-party performance readers' qualification
  # (`performance`): tools/performance, docs/performance, web/perf, the evidence's pin or the qualification's steps.
  # A step gated on one of these outputs also runs on the pull request that changes it.
  # And which plain benchmarks, with their checks against the scalar twins, a pull request runs (`measure`): those whose
  # sources it changes, and those whose steps it changes (the branch-sizing qualification too: its steps or its
  # sources). A benchmark built as a translation unit of its own (build.sh's *_benchmark.c) measures what that unit
  # includes, which this job reads from the #include lines; one in main.c's units measures the files that define the
  # functions it calls, as its entry names them. The plain runs took about 105 s of a pull request's 230, most of them
  # measuring code the pull request doesn't change; a change to build.sh runs every one.
  # On a push to main, whose pull request's run measured what it changes, every output but `code` is `false`: the full
  # set used to exceed the 10-minute budget on every push, failing while keeping the 9700X from every pull
  # request's job meanwhile. A push runs every plain benchmark (`measure` is `all`), so that main has each one's numbers
  # at every commit. The daily and dispatched runs, which skip this job, have the full set.
  # The selector is tools/ci/changes.c: the modules' sources (`changes_modules`), the plain benchmarks'
  # (`changes_benchmarks`) and the decision, which its --self-test checks against this workflow and the sources before
  # it decides.
  # A nightly backlog run decides as a pull request does, on its commit's change against its first parent; with the
  # nightly mode (vars.BUSTER_NIGHTLY: on), so does a push, whose `code` stays true (the selector's targeted push).
  # A merge-queue candidate (#1430) takes the selector's merge-group profile whatever it changes: code, every plain
  # benchmark and the performance readers' qualification; it runs the self-tests above all the same, so that a
  # candidate that breaks the selector, the costs, the aggregate, the nightly or the re-run policy fails here.
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.purpose == 'backlog')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      baselines: ${{ steps.files.outputs.baselines }}
      foreign: ${{ steps.files.outputs.foreign }}
      branch_sizing: ${{ steps.files.outputs.branch_sizing }}
      preprocessor_clang: ${{ steps.files.outputs.preprocessor_clang }}
      zen5: ${{ steps.files.outputs.zen5 }}
      ssa: ${{ steps.files.outputs.ssa }}
      parser_bindings: ${{ steps.files.outputs.parser_bindings }}
      environments: ${{ steps.files.outputs.environments }}
      ir: ${{ steps.files.outputs.ir }}
      ir_lowering: ${{ steps.files.outputs.ir_lowering }}
      ir_optimize: ${{ steps.files.outputs.ir_optimize }}
      checker: ${{ steps.files.outputs.checker }}
      checker_bindings: ${{ steps.files.outputs.checker_bindings }}
      checker_binding_modes: ${{ steps.files.outputs.checker_binding_modes }}
      check_debug: ${{ steps.files.outputs.check_debug }}
      sqlite_stable: ${{ steps.files.outputs.sqlite_stable }}
      check_debug_rows: ${{ steps.files.outputs.check_debug_rows }}
      files: ${{ steps.files.outputs.files }}
      compile_time: ${{ steps.files.outputs.compile_time }}
      tier1_programs: ${{ steps.files.outputs.tier1_programs }}
      helpers: ${{ steps.files.outputs.helpers }}
      performance: ${{ steps.files.outputs.performance }}
      measure: ${{ steps.files.outputs.measure }}
      auxiliary: ${{ steps.files.outputs.auxiliary }}
    steps:
      - name: Check out the triggering commit and its parents
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Build the selector and check it against this workflow and the sources
        # tools/ci/changes.c, built with the runner's cc in about a second: its self-test checks its tables against the
        # workflow (each output a step reads, each MEASURE name, each gated step changed alone) and the sources (each
        # pattern's alternatives and units), and its decisions on fixtures. When it fails, so does this job, and the remaining jobs do not run.
        # So do the hosted rows' shard costs (tools/ci/costs.c, #2031): its self-test, then every row's table in
        # tools/ci/costs/ against the inventory, which a new or renamed heading fails until `costs refresh` fits them.
        # And the setup re-run's allowlist (tools/ci/rerun.c, #2276), against this workflow and the row workflow: a
        # renamed setup step, test step or caller fails it.
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c17 -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/changes" tools/ci/changes.c
          "$RUNNER_TEMP/changes" --self-test
          cc -std=c17 -O2 -Wall -Wextra -Werror -fno-strict-aliasing tools/ci/costs.c -o "$RUNNER_TEMP/costs"
          "$RUNNER_TEMP/costs" --self-test --root .
          cc -std=c17 -O2 -Wall -Wextra -Werror -fno-strict-aliasing tools/ci/qualification.c -o "$RUNNER_TEMP/qualification"
          "$RUNNER_TEMP/qualification" --self-test
          cc -std=c17 -O2 -Wall -Wextra -Werror -fno-strict-aliasing tools/ci/nightly.c -o "$RUNNER_TEMP/nightly"
          "$RUNNER_TEMP/nightly" --self-test
          cc -std=c17 -O2 -Wall -Wextra -Werror -fno-strict-aliasing tools/ci/rerun.c -o "$RUNNER_TEMP/rerun"
          "$RUNNER_TEMP/rerun" --self-test --root .

      - id: files
        shell: bash
        env:
          NIGHTLY: ${{ vars.BUSTER_NIGHTLY }}
        run: |
          set -euo pipefail
          workflow=.github/workflows/9700x.yml
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
              # The candidate's own change, its merge against its base (main or the entry ahead), picks the auxiliary
              # workflows it calls, by each one's pull_request paths; everything else is the full profile.
              git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/files"
              "$RUNNER_TEMP/changes" --event merge_group --files "$RUNNER_TEMP/files" --workflow "$workflow" --output "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$NIGHTLY" != on ]; then
              "$RUNNER_TEMP/changes" --event push --workflow "$workflow" --output "$GITHUB_OUTPUT"
          else
              # The merge's changes against its base (a push's or a nightly run's commit's against its first parent),
              # both names of a file renamed, and the base's workflow, empty where it has none.
              git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/files"
              if ! git show "HEAD^1:$workflow" > "$RUNNER_TEMP/base.yml" 2> /dev/null; then
                  : > "$RUNNER_TEMP/base.yml"
              fi
              event=pull_request
              if [ "$GITHUB_EVENT_NAME" = push ]; then
                  event=push
              fi
              "$RUNNER_TEMP/changes" --event "$event" --files "$RUNNER_TEMP/files" \
                  --base-workflow "$RUNNER_TEMP/base.yml" --workflow "$workflow" --output "$GITHUB_OUTPUT"
          fi

  # What this run may reuse, and whether its 9700X job is admitted (tools/ci/nightly.c through tools/ci/nightly.sh; docs/ci.md,
  # "Nightly main measurements"). A pull request, draft or ready: never admitted (#2055); its plain hosted rows
  # qualify it, and its merged first-parent state gets native correctness and measurements in the nightly window. A
  # push: its own hosted rows, plain alone in the nightly mode (#2057), which defers its 9700X work to the window; before
  # the nightly mode, every row and its own native correctness and measurements on the landed commit. A nightly
  # dispatch: that its commit is on the pinned snapshot's first-parent history (else it fails, and nothing runs), the
  # plain hosted rows of the commit's own earlier run (a push's, a dispatch's or a merge-queue candidate's), and the
  # 02:00-08:00 Europe/Madrid window. A merge-queue candidate (#1430): the full hosted scope, its own, and never the
  # 9700X, whose native correctness and measurements its merged first-parent state gets in the window. Missing,
  # ambiguous or mismatched evidence runs the work; an API failure is missing evidence. Read-only API access.
  evidence:
    name: Reuse evidence and hardware admission
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      scope: ${{ steps.decide.outputs.scope }}
      hosted: ${{ steps.decide.outputs.hosted }}
      hosted_source: ${{ steps.decide.outputs.hosted_source }}
      native: ${{ steps.decide.outputs.native }}
      native_source: ${{ steps.decide.outputs.native_source }}
      measurement: ${{ steps.decide.outputs.measurement }}
      measurement_source: ${{ steps.decide.outputs.measurement_source }}
      hardware: ${{ steps.decide.outputs.hardware }}
      hardware_reason: ${{ steps.decide.outputs.hardware_reason }}
      retired: ${{ steps.decide.outputs.retired }}
      # A nightly dispatch's window as instants (the cycle's 02:00 and 08:00 Europe/Madrid), and whether an override
      # admits it anyway: the 9700X job compares them with its clock before any setup.
      window_start: ${{ steps.decide.outputs.window_start }}
      window_deadline: ${{ steps.decide.outputs.window_deadline }}
      window_override: ${{ steps.decide.outputs.window_override }}
    steps:
      - name: Check out the run's commit and its first parent
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Test the nightly glue and the 9700X's caches against fixtures
        # On pull requests and merge-queue candidates, before any hardware: the scripts this job, the record job and the
        # 9700X job run, the hosted vector row's draws (tools/ci/vector-draw.sh) and the setup re-run's decisions on
        # recorded runs (tools/ci/rerun.sh, .github/workflows/rerun.yml), without network access (tools/ci/nightly.c's
        # own self-test runs in `changes`). A candidate runs them on main and its pull request merged (#1430).
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        run: |
          bash tests/ci/nightly.sh
          bash tests/ci/caches.sh
          bash tests/ci/build-benchmarks.sh
          bash tests/ci/vector-draw.sh
          bash tests/ci/rerun.sh

      - name: Decide reuse and hardware admission
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_PURPOSE: ${{ inputs.purpose }}
          EVIDENCE_HARDWARE: ${{ inputs.hardware }}
          EVIDENCE_SNAPSHOT: ${{ inputs.snapshot }}
          EVIDENCE_OVERRIDE: ${{ inputs.override }}
          EVIDENCE_NIGHTLY: ${{ vars.BUSTER_NIGHTLY }}
        run: bash tools/ci/nightly.sh evidence "$RUNNER_TEMP/evidence"

  # One verified release-input acquisition before any hosted shard starts.
  prepare-hosted-tools:
    needs: [changes, evidence, policy]
    if: ${{ !cancelled() && github.repository_id == '1421805693' && needs.evidence.result == 'success' && needs.evidence.outputs.hosted == 'run' && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.code != 'false')) && ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.policy.result == 'success') }}
    uses: ./.github/workflows/prepare-hosted-tools.yml

  test:
    name: Tests on Ubuntu 26.04 (${{ matrix.host_arch }}, ${{ matrix.sanitizer }}, O${{ matrix.optimization }})
    # A pull request's run stops at its first failure, and so does a merge-queue candidate's (#1430, the owner's choice
    # on 2026-11-12: a failing candidate leaves the queue sooner and holds fewer runners). GitHub has no fail-fast across
    # jobs, so their tests wait for the policy job (`policy`, #2334), which finishes about when `changes` does, and don't
    # start when it fails: they wouldn't change a qualification that can't pass. Pushes to main, the daily run and
    # dispatched runs test regardless, so that every row reports.
    # A nightly dispatch whose commit's earlier run qualified its plain rows reuses them (`evidence`), and runs none.
    # Each row is hosted-correctness.yml: its shards, and for a portable row the job that builds its compiler once for
    # them (#2032; docs/ci.md, "Shared row products"). Their names are this one's, ` / ` and their own, which
    # tools/ci/nightly.c reads to find the plain rows' shards. The vector row (#2033) is the explicit vector target's
    # items on runners whose CPU qualifies, each configuration's 4 shards: a pull request's plain row, which replaces its
    # random `native` row, and on the runs that run the sanitizer rows, the plain and the three sanitizer
    # configurations' 16 items as one pool, beside the `native` rows, which every run but a pull request keeps
    # (docs/ci.md, "The vector row"). It is one call of the row workflow, which `include` adds: its `sanitizer` lists
    # the configurations.
    needs: [changes, evidence, policy, prepare-hosted-tools]
    if: ${{ !cancelled() && needs.prepare-hosted-tools.result == 'success' && github.repository_id == '1421805693' && needs.evidence.result == 'success' && needs.evidence.outputs.hosted == 'run' && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.code != 'false')) && ((github.event_name != 'pull_request' && github.event_name != 'merge_group') || needs.policy.result == 'success') }}
    strategy:
      # On a pull request or a merge-queue candidate, the first failing row cancels the others (and each row's own shards
      # and vector draws fail fast). Elsewhere every row runs to its end: these rows are main's sanitizer coverage, and
      # one detector's failure must not hide what the others find.
      fail-fast: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      matrix:
        host_arch: ${{ fromJSON(github.event_name == 'pull_request' && '["x86-64"]' || '["x86-64", "native"]') }}
        # The sanitizer rows take far longer than the plain ones: pull requests run the plain builds alone, as nightly
        # backlog runs and an admitted snapshot run do (the `plain` scope: the 9700X's gate), and so do pushes to main
        # in the nightly mode (#2057, until the merge queue carries the full suite). Merge-queue candidates (#1430),
        # the daily run, full dispatches, pushes before the nightly mode and the snapshot's deferred daily run run the
        # whole matrix.
        # `address` already combines ASan, UBSan, bounds and LSan; standalone UBSan remains
        # available for diagnosis but does not repeat the entire hosted suite.
        sanitizer: ${{ fromJSON((github.event_name == 'pull_request' || needs.evidence.outputs.scope == 'plain') && '["none"]' || '["none", "address", "thread", "memory"]') }}
        optimization: [3]
        # The vector row, one pool of its configurations' items: `none` on a pull request; the four where the sanitizer
        # rows run; none in the `plain` scope elsewhere, whose `native` rows stay until the vector row replaces them.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"host_arch":"vector","sanitizer":"none","optimization":3}]' || needs.evidence.outputs.scope == 'plain' && '[]' || '[{"host_arch":"vector","sanitizer":"none address thread memory","optimization":3}]') }}
    # The vector row's candidates and collectors read the run's artifacts and jobs (their claims and decisions); nothing
    # here writes but the artifacts.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/hosted-correctness.yml
    with:
      host_arch: ${{ matrix.host_arch }}
      sanitizer: ${{ matrix.sanitizer }}
      optimization: ${{ matrix.optimization }}
      # How many shards the row runs as (#2031), by its own costs (tools/ci/costs/, `costs plan`): the plain rows 4, both
      # host architectures alike (tools/ci/nightly.c counts their shards as one N). A portable row's shards share its one
      # build and a shard costs it about a minute of setup, so its TSan and MSan rows run as 6, near their longest
      # commands; a native row's shards each build their own compiler (5 to 10 minutes under a detector), so its MSan
      # row runs as 5 and the others as 4. The vector row's N is each configuration's items' count (4,
      # BUSTER_VECTOR_ITEMS), which its draws are sized for. tools/ci/changes.c's self-test checks each number against
      # the row workflow's lookup (changes_shard_policy).
      shards: ${{ matrix.host_arch == 'x86-64' && (matrix.sanitizer == 'thread' || matrix.sanitizer == 'memory') && 6 || matrix.sanitizer == 'memory' && 5 || 4 }}
      hosted-tools: ${{ needs.prepare-hosted-tools.outputs.artifact-name }}
      performance: ${{ needs.changes.outputs.performance }}

  fuzz:
    name: libFuzzer (ASan + UBSan + leaks, ${{ matrix.entry }})
    needs: [changes, evidence, prepare-hosted-tools]
    # Like the sanitizer rows, not on pull requests, nor in the `plain` scope.
    if: ${{ !cancelled() && needs.prepare-hosted-tools.result == 'success' && github.repository_id == '1421805693' && github.event_name != 'pull_request' && needs.evidence.result == 'success' && needs.evidence.outputs.hosted == 'run' && needs.evidence.outputs.scope == 'full' && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.code != 'false')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      # A merge-queue candidate's first failing campaign cancels the others, as its test rows fail fast (#1430). The
      # daily and dispatched runs, and pushes before the nightly mode, run every campaign to its end.
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        include:
          - entry: frontend
            host_arch: native
            source: src/buster/compiler/fuzz.c
          - entry: elf-override
            host_arch: x86-64
            source: tests/fuzz/entry_override.c
          - entry: crash-replay-proof
            host_arch: x86-64
            source: tests/fuzz/entry_probe.c
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: ${{ matrix.host_arch }}
      BUSTER_SANITIZER: address
      BUSTER_FUZZ_AVAILABLE: '1'
      BUSTER_FUZZ_ENTRY: ${{ matrix.source }}
      BUSTER_LINKER: lld
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Restore verified hosted release inputs
        uses: ./.github/actions/hosted-tools
        with:
          artifact-name: ${{ needs.prepare-hosted-tools.outputs.artifact-name }}

      - name: Install official Clang, sanitizer and libFuzzer runtimes
        run: bash tools/ci/setup-hosted.sh

      # Before the build, as in the sanitizer rows (#2060). It never fails the job.
      - name: Report sanitizer host kernel, CPU, seccomp and ptrace state
        continue-on-error: true
        run: bash tools/ci/sanitizers.sh host

      - name: Set fatal sanitizer policy and verify detectors
        run: |
          bash tools/ci/sanitizers.sh configure "$RUNNER_TEMP/sanitizer-reports"
          bash tools/ci/sanitizers.sh probe "$RUNNER_TEMP/sanitizer-probes"

      - name: Build the selected coverage-instrumented entry and check ordinary dispatch
        run: |
          ./build.sh --config Release
          compiler=$(./build.sh print-output --config Release)
          test build/compiler -ef "$compiler"
          printf 'BUSTER_COMPILER=%s\n' "$compiler" >> "$GITHUB_ENV"
          "$compiler" -fsyntax-only tests/fuzz/corpus/basic.c

      - name: Fuzz the compiler with retained seeds and deterministic mutation seed
        if: matrix.entry != 'crash-replay-proof'
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz-corpus" "$RUNNER_TEMP/fuzz-artifacts"
          cp tests/fuzz/corpus/* "$RUNNER_TEMP/fuzz-corpus/"
          clang -c -march=x86-64 tests/fuzz/corpus/basic.c -o "$RUNNER_TEMP/fuzz-corpus/object.elf"
          clang -shared -fPIC tests/fuzz/corpus/basic.c -o "$RUNNER_TEMP/fuzz-corpus/shared.elf"
          runs=10000
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then runs=100000; fi
          "$BUSTER_COMPILER" --fuzz -seed=133 -runs="$runs" -max_len=4096 -timeout=10 -rss_limit_mb=4096 \
            -dict=tests/fuzz/c.dict -artifact_prefix="$RUNNER_TEMP/fuzz-artifacts/" \
            "$RUNNER_TEMP/fuzz-corpus" 2>&1 | tee "$RUNNER_TEMP/fuzzer.log"
          if [ '${{ matrix.entry }}' = elf-override ]; then
            grep -Fq 'Buster fuzz entry: ELF import' "$RUNNER_TEMP/fuzzer.log"
          fi

      - name: Prove entry override, crash preservation and exact-input replay
        if: matrix.entry == 'crash-replay-proof'
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz-corpus" "$RUNNER_TEMP/fuzz-artifacts" "$RUNNER_TEMP/fuzz-replay" "$RUNNER_TEMP/fuzz-planted"
          printf %s BUSTER_FUZZ_ENTRY_PROBE > "$RUNNER_TEMP/fuzz-corpus/trigger"
          # The planted abort's stack traces go to reports of their own, each of which must be the probe's; the
          # audit below still rejects any other diagnostic. configure writes log_path last, and the combined runtime
          # takes it from whichever of these options it parses last.
          planted() { env "ASAN_OPTIONS=${ASAN_OPTIONS%log_path=*}log_path=$RUNNER_TEMP/fuzz-planted/report" \
              "UBSAN_OPTIONS=${UBSAN_OPTIONS%log_path=*}log_path=$RUNNER_TEMP/fuzz-planted/report" \
              "LSAN_OPTIONS=${LSAN_OPTIONS%log_path=*}log_path=$RUNNER_TEMP/fuzz-planted/report" "$@"; }
          status=0
          planted "$BUSTER_COMPILER" --fuzz -seed=133 -runs=2 -artifact_prefix="$RUNNER_TEMP/fuzz-artifacts/" \
            "$RUNNER_TEMP/fuzz-corpus" > "$RUNNER_TEMP/fuzzer.log" 2>&1 || status=$?
          test "$status" -eq 77
          grep -Fq 'libFuzzer: deadly signal' "$RUNNER_TEMP/fuzzer.log"
          artifacts=("$RUNNER_TEMP/fuzz-artifacts/"crash-*)
          test "${#artifacts[@]}" -eq 1
          cmp "$RUNNER_TEMP/fuzz-corpus/trigger" "${artifacts[0]}"
          status=0
          planted "$BUSTER_COMPILER" --fuzz -runs=1 -artifact_prefix="$RUNNER_TEMP/fuzz-replay/" \
            "${artifacts[0]}" > "$RUNNER_TEMP/fuzzer-replay.log" 2>&1 || status=$?
          test "$status" -eq 77
          grep -Fq 'libFuzzer: deadly signal' "$RUNNER_TEMP/fuzzer-replay.log"
          reports=("$RUNNER_TEMP/fuzz-planted/"report.*)
          test "${#reports[@]}" -eq 2
          for report in "${reports[@]}"; do
              grep -Fq 'in buster_fuzz_test_input' "$report"
              grep -Fq 'tests/fuzz/entry_probe.c:' "$report"
          done

      - name: Reject every unexpected sanitizer diagnostic
        if: ${{ !cancelled() }}
        run: bash tools/ci/sanitizers.sh audit "$RUNNER_TEMP/sanitizer-reports"

      - name: Preserve corpus, crash inputs, reports and the matching executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libfuzzer-${{ matrix.entry }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fuzz-corpus
            ${{ runner.temp }}/fuzz-artifacts
            ${{ runner.temp }}/fuzz-replay
            ${{ runner.temp }}/fuzz-planted
            ${{ runner.temp }}/fuzzer*.log
            ${{ runner.temp }}/sanitizer-reports
            ${{ runner.temp }}/sanitizer-probes
            build/compiler
            build/compile_commands.json
            LICENSE
            THIRD_PARTY_NOTICES.md
            LICENSES/
          if-no-files-found: error
          retention-days: 14

  benchmarks:
    name: Native tests and benchmarks on Benchpress (Ryzen 7 9700X)
    needs: [changes, evidence, test, fuzz]
    # Both hosted variants must pass before any hardware work. This also covers
    # scheduled/manual runs, whose selector is skipped. The `evidence` job must
    # admit it: a nightly run outside the window or deferred is not admitted,
    # and neither is any pull request, draft or ready (#2055, the owner's choice
    # on 2026-11-10). A pull request's run therefore skips this job as soon as
    # its tests finish, and nothing waits on it; the clauses below about pull
    # requests are inert until requested measurements (#1432) decide how they
    # run. A nightly run's plain rows (the `plain` scope, without fuzzing) gate
    # it, either run here or, by evidence, by its commit's earlier run.
    if: ${{ !cancelled() && github.repository_id == '1421805693' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.evidence.result == 'success' && needs.evidence.outputs.hardware == 'admit' && ((needs.test.result == 'success' && (needs.fuzz.result == 'success' || ((github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && needs.evidence.outputs.scope == 'plain')) && needs.fuzz.result == 'skipped'))) || (github.event_name == 'workflow_dispatch' && needs.evidence.outputs.hosted == 'reused' && needs.test.result == 'skipped' && needs.fuzz.result == 'skipped')) }}
    runs-on:
      group: buster-9700x-service-dispatch
      labels: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
    timeout-minutes: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.purpose != 'backlog')) && 25 || 20 }}
    # For the record job: whether the window closed while the job waited for the lock, whether native correctness
    # started and passed, and the host's fingerprint.
    outputs:
      window: ${{ steps.window.outputs.window }}
      native: ${{ steps.native.outputs.native }}
      host: ${{ steps.host.outputs.host }}
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: znver5
      # Nothing here reads the executable's debug information (docs/commands/build.md); the inventory's own build.sh
      # calls share the build's tree.
      BUSTER_DEBUG_INFO: '0'
      # Hosted correctness independently checks both variants of this exact revision before this job can start.
      # The persistent native cache reuses ordinary runs and nightly backlog runs; daily/manual runs and the nightly
      # snapshot's execute and check every oracle again.
      BUSTER_ORACLE_CACHE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.purpose != 'backlog')) && 'check' || 'use' }}
      MEASURE: ${{ needs.changes.outputs.measure || 'all' }}
    steps:
      - name: Verify benchmark host
        # The operating system, the architecture and the CPU model, and nothing more: in the 9700X job the window's
        # check follows at once, so that a job that took the lock too late refuses before any other work.
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          grep -m1 '^model name[[:space:]]*:' /proc/cpuinfo
          grep -Eq '^model name[[:space:]]*:[[:space:]]*AMD Ryzen 7 9700X([[:space:]]|$)' /proc/cpuinfo

      - name: Admit nightly work inside the Europe/Madrid window, holding the lock
        # The runner's hook took the shared lock before this job's first step, and a nightly run admitted while queued
        # may have waited past its window for it: right after the host's own check, before the host identity's package
        # queries and hashing and before any setup, the job's whole bound (its timeout and 5 minutes to clean up) must
        # still end by 08:00 Europe/Madrid, the evidence job's instants for the cycle, unless the dispatch gave an
        # override's reason. A refusal fails the job here, having done nothing else, which the record reads as a
        # deferral, not a failure; the job's timeout bounds the rest.
        id: window
        if: github.event_name == 'workflow_dispatch' && (inputs.purpose == 'backlog' || inputs.purpose == 'snapshot')
        env:
          WINDOW_START: ${{ needs.evidence.outputs.window_start }}
          WINDOW_DEADLINE: ${{ needs.evidence.outputs.window_deadline }}
          WINDOW_OVERRIDE: ${{ needs.evidence.outputs.window_override }}
          BOUND: ${{ inputs.purpose == 'backlog' && 25 || 30 }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          open=false
          if [ "$WINDOW_OVERRIDE" = true ]; then
              open=true
              printf 'Nightly window: overridden by the dispatch'"'"'s reason (reported in its evidence job)\n'
          elif [[ "$WINDOW_START" =~ ^[0-9]+$ && "$WINDOW_DEADLINE" =~ ^[0-9]+$ ]] && [ "$now" -ge "$WINDOW_START" ] && [ "$((now + BOUND * 60))" -le "$WINDOW_DEADLINE" ]; then
              open=true
              printf 'Nightly window: %s seconds left after this job'"'"'s %s-minute bound\n' "$((WINDOW_DEADLINE - now - BOUND * 60))" "$BOUND"
          fi
          if [ "$open" = true ]; then
              printf 'window=open\n' >> "$GITHUB_OUTPUT"
          else
              printf 'window=closed\n' >> "$GITHUB_OUTPUT"
              printf 'Nightly window: closed at %s for a %s-minute bound (window %s to %s)\n' "$now" "$BOUND" "${WINDOW_START:-unknown}" "${WINDOW_DEADLINE:-unknown}"
              printf '%s\n' '::notice title=Nightly window::The window closed while this job waited; deferred, not failed.'
              exit 1
          fi

      - name: Record the host identity
        id: host
        run: |
          # The coverage record's host identity: what the repository doesn't pin and the native inventory uses: the
          # kernel, the microcode, glibc, and a digest of the software. The digest covers the package database's every
          # package and version; each external tool the inventory calls (GCC and its cc1, cc1plus and collect2,
          # binutils, gdb, perf, valgrind, mold, wild, make, file, the shell) and every shared library it loads; the
          # runtime GCC links a static program with (test-static's cc -static); and every file of the packages that
          # own any of those, or of the C toolchain's (gcc, gcc-libs, glibc, binutils, linux-api-headers). Those files
          # are the headers, static libraries, startup objects, linker scripts and configuration, by content. A tool
          # or runtime file absent is recorded as absent. A component that can't be read (no package database, a
          # package query that fails or doesn't answer completely, a file that can't be hashed) leaves no identity at
          # all, never a placeholder that another unread one would match: no reuse holds. tests/ci/nightly.sh runs the
          # lines from here to the identity's end against stand-in tools.
          kernel=$(uname -r 2> /dev/null || true)
          microcode=$(sed -n 's/^microcode[[:space:]]*:[[:space:]]*//p' /proc/cpuinfo | head -n 1)
          gcc_version=$(gcc -dumpfullversion 2> /dev/null || true)
          glibc_version=$(getconf GNU_LIBC_VERSION 2> /dev/null || true)
          # Each package query must succeed and print nothing on stderr. The ownership query must account for every
          # file: an owner at the version -Q lists, or pacman's "No package owns" and no other message. The owners'
          # listing must then contain every file the ownership query attributed to them. Otherwise the database didn't
          # answer completely, which is not the same as an unowned file: there is no identity.
          errors=$(mktemp)
          software=''
          incomplete=''
          packages=$(LC_ALL=C pacman -Q 2> "$errors") && [ ! -s "$errors" ] || packages=''
          if [ -z "$packages" ]; then
              incomplete='no package database'
          else
              tools=(cc gcc g++ as ld ld.bfd readelf objdump objcopy nm ar gdb perf valgrind mold wild make file sh bash env)
              for program in cc1 cc1plus collect2; do
                  tools+=("$(gcc -print-prog-name="$program" 2> /dev/null || printf '%s' "$program")")
              done
              files=()
              listing=''
              for tool in "${tools[@]}"; do
                  path=$(command -v "$tool" 2> /dev/null || true)
                  if [ -n "$path" ] && [ -f "$path" ]; then
                      real=$(readlink -f "$path")
                      listing+="tool $tool $real"$'\n'
                      files+=("$real")
                      while IFS= read -r library; do
                          files+=("$(readlink -f "$library" 2> /dev/null || printf '%s' "$library")")
                      done < <(ldd "$real" 2> /dev/null | sed -n -e 's/^.*=> \(\/[^ ]*\) (0x[0-9a-f]*)$/\1/p' -e 's/^[[:space:]]*\(\/[^ ]*\) (0x[0-9a-f]*)$/\1/p')
                  else
                      listing+="tool $tool absent"$'\n'
                  fi
              done
              for runtime in libc.a libm.a libpthread.a crt1.o crti.o crtn.o crtbeginT.o crtend.o libgcc.a libgcc_eh.a; do
                  path=$(gcc -print-file-name="$runtime" 2> /dev/null || true)
                  if [ -n "$path" ] && [ -f "$path" ]; then
                      real=$(readlink -f "$path")
                      listing+="runtime $runtime $real"$'\n'
                      files+=("$real")
                  else
                      listing+="runtime $runtime absent"$'\n'
                  fi
              done
              ownership=$(LC_ALL=C pacman -Qo --color never "${files[@]}" 2> "$errors") && status=0 || status=$?
              claims=$(sed -n 's/^\(\/.*\) is owned by \([^ ]*\) [^ ]*$/\2 \1/p' <<< "$ownership" | LC_ALL=C sort -u)
              versions=$(sed -n 's/^\/.* is owned by \([^ ]*\) \([^ ]*\)$/\1 \2/p' <<< "$ownership" | LC_ALL=C sort -u)
              answered=$(grep -c . <<< "$ownership" || true)
              attributed=$(grep -c '^/.* is owned by [^ ]* [^ ]*$' <<< "$ownership" || true)
              unowned=$(grep -c '^error: No package owns /' "$errors" || true)
              if grep -qv '^error: No package owns /' "$errors" || [ "$attributed" -ne "$answered" ] || [ $((attributed + unowned)) -ne "${#files[@]}" ] || [ $((status == 0)) -ne $((unowned == 0)) ]; then
                  incomplete+='the ownership query did not account for every file; '
              fi
              if [ -n "$(LC_ALL=C comm -23 <(sed '/^$/d' <<< "$versions") <(LC_ALL=C sort -u <<< "$packages"))" ]; then
                  incomplete+='an owner at another version than -Q lists; '
              fi
              installed=$(cut -d ' ' -f 1 <<< "$packages")
              owners=$({ for package in gcc gcc-libs glibc binutils linux-api-headers; do
                      if grep -Fxq -- "$package" <<< "$installed"; then printf '%s\n' "$package"; fi
                  done
                  cut -d ' ' -f 1 <<< "$claims"; } | sed '/^$/d' | LC_ALL=C sort -u)
              listing+="packages $(printf '%s ' $owners)"$'\n'
              listed=''
              if [ -n "$owners" ]; then
                  listed=$(LC_ALL=C pacman -Ql --color never $owners 2> "$errors") && [ ! -s "$errors" ] || incomplete+='the owners file listing failed; '
              fi
              if [ -n "$(LC_ALL=C comm -23 <(sed '/^$/d' <<< "$claims") <(LC_ALL=C sort -u <<< "$listed"))" ]; then
                  incomplete+='the owners file listing omits files attributed to them; '
              fi
              while IFS= read -r owned; do
                  if [ -L "$owned" ]; then
                      listing+="link $owned $(readlink "$owned")"$'\n'
                  elif [ -f "$owned" ]; then
                      files+=("$owned")
                  fi
              done < <(sed -n 's/^[^ ]* //p' <<< "$listed")
              # A file that can't be hashed marks the hashes, whatever the shell's pipefail: then there is no identity.
              hashes=$(printf '%s\0' "${files[@]}" | LC_ALL=C sort -zu | { xargs -0 -r -n 256 -P 8 sha256sum 2> /dev/null || printf 'unhashable\n'; } | LC_ALL=C sort -k 2)
              if [[ "$hashes" == *unhashable* ]]; then
                  incomplete+="a file that can't be hashed; "
              fi
              if [ -z "$incomplete" ]; then
                  software=$(printf '%s\n%s%s\n' "$packages" "$listing" "$hashes" | sha256sum | cut -c 1-16)
              fi
          fi
          rm -f "$errors"
          if [ -n "$kernel" ] && [ -n "$microcode" ] && [ -n "$gcc_version" ] && [ -n "$glibc_version" ] && [ -n "$software" ]; then
              host=$(printf '9700X/%s/%s/gcc-%s/%s/sw-%s' "$kernel" "$microcode" "$gcc_version" "$glibc_version" "$software" | tr -c 'A-Za-z0-9._/+-' '_' | cut -c 1-120)
              printf 'Host identity: %s\n' "$host"
              printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
          else
              printf '::warning title=Host identity::kernel %s, microcode %s, GCC %s, glibc %s, software %s: incomplete, so none is recorded and no reuse can match it%s\n' "${kernel:-?}" "${microcode:-?}" "${gcc_version:-?}" "${glibc_version:-?}" "${software:-?}" "${incomplete:+ (software: ${incomplete%; })}"
          fi
          # The identity's end.

      - name: Use the runner's private cache for verified inputs
        # The frozen corpus's archive and c-testsuite's commit, each kept under what identifies it and verified on every
        # use (docs/ci.md, on the job's private cache). Measured on 2026-11-03 PR jobs, their fetches took 0 to 1 s each:
        # the cache spares the host their network dependence more than their time. The pragma oracle is built every
        # time: its 2.3 s finish beside the compiler build's longest unit, so no cache of it saves any. Hosted runners
        # keep none.
        run: printf 'BUSTER_CI_CACHE=%s\n' "${XDG_CACHE_HOME:-$HOME/.cache}/buster/ci" >> "$GITHUB_ENV"

      - name: Check out triggering commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Stage official Clang 23.1.4 in the private runner cache
        run: bash tools/ci/setup-benchpress.sh

      - name: Require the complete native vector feature set
        run: |
          defines=$(clang -march="$BUSTER_HOST_ARCH" -Isrc -dM -E \
            -include src/buster/compiler/host_isa.h -x c /dev/null)
          if ! grep -q '^#define BUSTER_HOST_VECTOR 1$' <<< "$defines"; then
            printf '%s\n' '::error::9700X correctness requires BUSTER_HOST_VECTOR=1; vector coverage cannot be qualified by scalar kernels.'
            exit 1
          fi
          printf 'Selected host path: vector (%s)\n' "$BUSTER_HOST_ARCH"

      - name: Build the external Clang pragma oracle and the Zen 5 executable
        id: compiler_builds
        # The required PR-base compiler and checker placements are prepared here too (#1662). One physical-core
        # budget covers both revisions and the oracle; every process finishes before measurements. See docs/ci-builds.md.
        env:
          AB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AB_CHECKER: ${{ github.event_name == 'pull_request' && needs.changes.outputs.checker != 'false' }}
          AB_TIER1: ${{ github.event_name == 'pull_request' && needs.changes.outputs.tier1_programs != 'false' }}
        run: bash tools/ci/build-benchmarks.sh

      - name: Fetch and verify frozen corpus inputs for native correctness
        run: |
          corpus="$RUNNER_TEMP/preprocessor-391e729af658"
          bash tools/ci/fetch-corpus.sh "$corpus"
          printf 'BUSTER_CORPUS=%s\n' "$corpus" >> "$GITHUB_ENV"

      - name: Fetch c-testsuite at its pinned commit
        # #145's programs, at the commit tests/c-testsuite/subset.txt was declared for: a shallow fetch of that one commit,
        # whose hash fixes the files, without git's sample hooks. The test list below compiles and runs them. The 9700X
        # fetches it from a mirror in its private cache, which Git's pack protocol checks again (fetch-c-testsuite.sh).
        run: bash tools/ci/fetch-c-testsuite.sh build/c-testsuite

      - name: Fetch SQLite's sources at their pinned commit
        # #146: SQLite 3.53.2's tree, whose amalgamation and shell are the frozen corpus's, for its tests (test-sqlite in
        # the test list): a shallow fetch of that one commit, whose hash fixes the files, as c-testsuite's above; the 9700X
        # fetches it from a mirror in its private cache (fetch-sqlite.sh).
        run: bash tools/ci/fetch-sqlite.sh build/sqlite

      - name: Parse the compiler source on the native vector build
        run: '"$BUSTER_COMPILER" parse -fsyntax-only -march="$BUSTER_HOST_ARCH" -Isrc -fwrapv -funsigned-char --predefines build/predefines.h -DBUSTER_COMPLETE_DRIVER=1 src/buster/compiler/main.c'

      - name: Run complete native vector correctness before benchmarks
        id: native
        # Not on pull requests (#1272): their hosted rows cover correctness, and native correctness runs after the
        # merge, on main's push and the scheduled and nightly runs, before their measurements.
        if: github.event_name != 'pull_request'
        run: |
          # The record tells a correctness failure here (started, never passed) from a measurement's after it.
          printf 'native=started\n' >> "$GITHUB_OUTPUT"
          taskset -c 0-7 "$BUSTER_COMPILER" parallel --github --jobs 8 --timeout 600 < tools/ci/correctness.tests
          printf 'native=passed\n' >> "$GITHUB_OUTPUT"
          oracle="${XDG_CACHE_HOME:-$HOME/.cache}/buster/oracle"
          if [ "$BUSTER_ORACLE_CACHE" = check ] && [ -d "$oracle" ]; then
              find "$oracle" -type f -mtime +2 -delete
              find "$oracle" -mindepth 1 -type d -empty -delete
          fi

      - name: Benchmark the C lexer on the repository sources
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',lexer,')
        run: |
          # Pin to one permitted CPU to avoid migration noise in throughput measurements.
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-lexer src

      - name: Reproduce a sample of the Zen 5 model's rows
        # #181: every eighth row of x86_zen5_rows.c measured again (--check), which fails where a row's columns don't
        # reproduce within the tolerances docs/x86-zen5.md gives; three separate processes, each a different eighth
        # (--offset), where `changes` doesn't rule out the next step. The job hook holds the shared lock.
        # Counter/protocol failures fail the step too.
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',x86-zen5,')
        run: |
          sha256sum build/compiler src/buster/compiler/x86_zen5.c src/buster/compiler/x86_zen5_rows.c src/buster/compiler/x86_zen5_measure.c
          echo "Zen 5 observation process 1"
          taskset -c 2 ./build/compiler measure-x86-zen5 --check --sample 8 --offset 0

      - name: Reproduce the Zen 5 sample in two more processes
        # Where `changes` doesn't rule it out (the module's sources): with the process above, three eighths.
        if: needs.changes.outputs.zen5 != 'false'
        run: |
          for sample in 2 3; do
            echo "Zen 5 observation process $sample"
            taskset -c 2 ./build/compiler measure-x86-zen5 --check --sample 8 --offset "$((sample - 1))"
          done

      - name: Benchmark Zen 5 cost lookup
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',x86-zen5,')
        run: taskset -c 2 ./build/compiler benchmark-x86-zen5

      - name: Measure mask spills to memory and to general registers
        # #179: kmov of each width to a stack slot and back, against to a general register and back, in chains of one
        # mask (a round trip's latency) and of seven (throughput), with and without vector work beside them.
        # Informational; counter and protocol failures fail the step.
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',mask-spills,')
        run: |
          sha256sum build/compiler src/buster/compiler/mask_spill_measure.c
          taskset -c 2 ./build/compiler measure-mask-spills --passes 21 --iterations 20000

      - name: Benchmark Zen 5 cost lookup in isolation and after scalar work
        # Where `changes` doesn't rule it out (the module's sources): with the plain run above, three processes of each
        # mode.
        if: needs.changes.outputs.zen5 != 'false'
        run: |
          cpu=2
          for sample in 1 2 3; do
            echo "Zen 5 lookup sample $sample"
            if [ "$sample" != 1 ]; then
              taskset -c "$cpu" ./build/compiler benchmark-x86-zen5
            fi
            taskset -c "$cpu" ./build/compiler benchmark-x86-zen5 --only vector
            taskset -c "$cpu" ./build/compiler benchmark-x86-zen5 --only vector --after-scalar 200
          done

      - name: Benchmark x86-64 disassembly
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',x86-disassembler,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-x86-disassembler

      - name: Benchmark the x86-64 encoder
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',x86-encoder,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-x86-encoder

      - name: Benchmark assembly phases
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',assembler,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-assembler

      - name: Check out pinned branch-sizing measurement harnesses
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.branch_sizing != 'false' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: buster14a/buster-performance
          ref: a00d16e47b6f1090b8a0424ab0dd8cb4e6016713 # Initial byte-identical measurement import; see buster-performance/MIGRATION.md.
          path: build/performance-evidence
          sparse-checkout: docs/measurements/x86-lengths-2026-10-23
          persist-credentials: false

      - name: Benchmark branch sizing
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',branch-sizing,') || needs.changes.outputs.branch_sizing == 'true'
        timeout-minutes: 3
        env:
          AB_ENABLED: ${{ github.event_name == 'pull_request' && needs.changes.outputs.branch_sizing != 'false' }}
          AB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-branch-sizing

          if [[ "$AB_ENABLED" == true ]]; then
              [[ "$AB_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              ab_dir="$(mktemp -d "${RUNNER_TEMP}/branch-sizing-ab.XXXXXX")"
              trap 'rm -rf "$ab_dir"' EXIT
              fixture=build/performance-evidence/docs/measurements/x86-lengths-2026-10-23

              # The normal job lock covers this bounded qualification. Use one allowed logical CPU per physical
              # core for scaling, and record the mapping rather than inferring SMT placement from CPU numbers.
              allowed="$(awk '/^Cpus_allowed_list:/ { print $2 }' /proc/self/status)"
              lscpu -e=CPU,SOCKET,CORE,ONLINE
              core_cpus="$(lscpu -p=CPU,CORE,SOCKET,ONLINE | awk -F, -v allowed="$allowed" '
                  BEGIN {
                      n = split(allowed, ranges, ",")
                      for (r = 1; r <= n; r++) {
                          m = split(ranges[r], ends, "-")
                          last = m == 2 ? ends[2] : ends[1]
                          for (c = ends[1]; c <= last; c++) permitted[c] = 1
                      }
                  }
                  $0 !~ /^#/ && $4 == "Y" && permitted[$1] && !seen[$3 ":" $2]++ { print $1 }
              ' | paste -sd, -)"
              test "$(tr ',' '\n' <<< "$core_cpus" | wc -l)" -ge 8
              case ",$core_cpus," in
                  *,2,*) cpu=2 ;;
              esac
              printf 'Allowed CPUs=%s; distinct-core CPUs=%s; module CPU=%s\n' "$allowed" "$core_cpus" "$cpu"

              # The shallow checkout may lack the base object. Fetch only the public base commit, without tokens;
              # read its source files, but do not execute its build scripts or change the checkout.
              if ! git cat-file -e "${AB_BASE_SHA}^{commit}" 2>/dev/null; then
                  GIT_TERMINAL_PROMPT=0 timeout 30s git -c credential.helper= -c http.extraHeader= fetch \
                      --no-tags --no-recurse-submodules --depth=1 https://github.com/buster14a/buster.git "$AB_BASE_SHA"
              fi
              printf 'Matched base=%s checkout=%s cpu=%s\n' "$AB_BASE_SHA" "$(git rev-parse HEAD)" "$cpu"
              clang --version
              for side in before after; do
                  mkdir -p "$ab_dir/$side/src/buster/compiler"
                  for file in lane.c x86_64_encoder.c branch_sizing.c; do
                      dest="$ab_dir/$side/src/buster/compiler/$file"
                      if [[ "$side" == before ]]; then
                          git show "${AB_BASE_SHA}:src/buster/compiler/$file" > "$dest"
                      else
                          cp "src/buster/compiler/$file" "$dest"
                      fi
                  done
                  # Both modules, including the scaling fixture's include, use the same harness and generator.
                  cp src/buster/compiler/branch_sizing_benchmark.c src/buster/compiler/branch_sizing_generate.c \
                      "$ab_dir/$side/src/buster/compiler/"
                  # The shared harness includes the host-ISA adapter and the encoder's baked-table header. Keep each
                  # revision's headers when present; a base predating one uses the current header on this host.
                  for header in host_isa.h host_scalar.h host_scalar_vectors.h baked.h; do
                      dest="$ab_dir/$side/src/buster/compiler/$header"
                      if [[ "$side" == before ]] && git cat-file -e "${AB_BASE_SHA}:src/buster/compiler/$header" 2>/dev/null; then
                          git show "${AB_BASE_SHA}:src/buster/compiler/$header" > "$dest"
                      else
                          cp "src/buster/compiler/$header" "$dest"
                      fi
                  done
              done
              before="$ab_dir/before/src/buster/compiler"
              new='branch_sizing_lengths(records, count, offsets, vector)'
              old='branch_sizing_lengths(records, count, offsets, columns.encoded, vector)'
              interface='branch_sizing_lengths(const X86Instruction* records, uint64_t count, uint32_t* offsets, bool vector)'
              test "$(grep -Fo "$new" "$before/branch_sizing_benchmark.c" | wc -l)" -eq 1
              if grep -Fq "$old" "$before/branch_sizing.c"; then
                  sed -i "s/$new/$old/" "$before/branch_sizing_benchmark.c"
                  test "$(grep -Fo "$old" "$before/branch_sizing_benchmark.c" | wc -l)" -eq 1
                  echo 'Baseline harness adaptation: old lengths scratch argument only'
              # Since the host-ISA adapter, the call reads BUSTER_VECTOR_PATH(vector), so check the definition instead.
              elif ! grep -Fq "$interface" "$before/branch_sizing.c"; then
                  echo 'Unsupported baseline branch_sizing_lengths interface' >&2
                  exit 1
              fi

              # Same compiler and production options. Compile all four binaries before serialized timing.
              flags=(-O3 -g -march=native -fwrapv -funsigned-char -fno-strict-aliasing -Wall -Werror -pthread)
              printf 'Standalone flags: %s\n' "${flags[*]}"
              sha256sum "$fixture/benchmark-main.c" "$fixture/scaling.c"
              for side in before after; do
                  tree="$ab_dir/$side/src"
                  sha256sum "$tree"/buster/compiler/*.[ch]
                  host_defines=$(clang "${flags[@]}" -I "$tree" -dM -E \
                      -include "$tree/buster/compiler/host_isa.h" -x c /dev/null)
                  grep -q '^#define BUSTER_HOST_VECTOR 1$' <<< "$host_defines"
                  timeout 60s clang "${flags[@]}" -I "$tree" "$tree/buster/compiler/branch_sizing_benchmark.c" \
                      "$fixture/benchmark-main.c" -o "$ab_dir/$side-module"
                  timeout 60s clang "${flags[@]}" -I "$tree" "$fixture/scaling.c" -o "$ab_dir/$side-scaling"
              done
              sha256sum "$ab_dir"/*-module "$ab_dir"/*-scaling

              run_module()
              {
                  local side="$1" row="$2" measure="$3" pair="$4"
                  local log="$ab_dir/module-$row-$measure-$pair-$side.log"
                  printf '\nMatched module pair=%s side=%s row=%s measure=%s\n' "$pair" "$side" "$row" "$measure"
                  timeout 20s taskset -c "$cpu" "$ab_dir/$side-module" \
                      --seed 1 --only "$row" --measure "$measure" --samples 11 2>&1 | tee "$log"
                  test "$(grep -c "^$row: " "$log")" -eq 1
                  test "$(grep -c ' ns per record ' "$log")" -eq 1
                  grep "^$row: " "$log" > "$log.identity"
              }
              run_scaling()
              {
                  local side="$1" workers="$2" pair="$3"
                  local log="$ab_dir/scaling-$workers-$pair-$side.log"
                  printf '\nMatched scaling pair=%s side=%s workers=%s passes=200\n' "$pair" "$side" "$workers"
                  # The fixture pins workers within this distinct-physical-core mask, never a one-CPU taskset.
                  timeout 30s taskset -c "$core_cpus" "$ab_dir/$side-scaling" "$workers" 200 tier0-mix 2>&1 | tee "$log"
                  test "$(grep -c '^row=' "$log")" -eq 1
                  grep '^row=' "$log" | tr ' ' '\n' |
                      grep -E '^(row|workers|passes|seed|warmup|functions_per_worker|records_per_worker|encoded_bytes_per_worker|checksum|reference|coordinator_cpu|worker_cpus)=' \
                      > "$log.identity"
                  test "$(wc -l < "$log.identity")" -eq 12
              }
              for pair in 1 2 3; do
                  order=(before after)
                  if [[ "$pair" == 2 ]]; then
                      order=(after before)
                  fi
                  for row in tier0-40 tier0-mix tier0-2000; do
                      measures=(vector-lengths size_branches size_encode)
                      if [[ "$row" == tier0-mix ]]; then
                          measures+=(x86_encode)
                      fi
                      for measure in "${measures[@]}"; do
                          for side in "${order[@]}"; do
                              run_module "$side" "$row" "$measure" "$pair"
                          done
                          diff -u "$ab_dir/module-$row-$measure-$pair-before.log.identity" \
                              "$ab_dir/module-$row-$measure-$pair-after.log.identity"
                      done
                  done
                  for workers in 1 8; do
                      for side in "${order[@]}"; do
                          run_scaling "$side" "$workers" "$pair"
                      done
                      diff -u "$ab_dir/scaling-$workers-$pair-before.log.identity" "$ab_dir/scaling-$workers-$pair-after.log.identity"
                  done
              done
              echo 'Matched branch-sizing qualification completed: 3 pairs per case'
          fi

      - name: Benchmark the x86 semantics
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',x86-semantics,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-x86-semantics

      - name: Benchmark the lanes
        # It pins each lane to an allowed CPU of its own.
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',lanes,')
        run: ./build/compiler benchmark-lanes

      - name: Benchmark dataflow bitsets
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',dataflow,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-dataflow

      - name: Benchmark local SSA construction on synthetic CFGs
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',ssa,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-ssa

      - name: Benchmark local SSA construction in isolation and after scalar work
        # Where `changes` doesn't rule it out (the module's sources). Compare isolated execution and vector samples
        # after warm scalar work across separate processes.
        if: needs.changes.outputs.ssa != 'false'
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          for repetition in 1 2 3; do
              echo "SSA repetition $repetition"
              taskset -c "$cpu" ./build/compiler benchmark-ssa --only scalar
              taskset -c "$cpu" ./build/compiler benchmark-ssa --only vector
              taskset -c "$cpu" ./build/compiler benchmark-ssa --only vector --after-scalar 200
          done

      - name: Benchmark dominator analysis on synthetic and exported source CFGs
        # The --cfg run is #174's real-function importer smoke: test-ir-source --dominators-cfg writes the
        # qualified CFGs of the focused fixture and benchmark-dominators --cfg reads them back, checks all three
        # paths' agreement and times the scalar, vector and AUTO selections by block-count bucket.
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',dominators,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler test-ir-source --dominators-cfg build/dominators-fixture.cfg tests/ir-source/dominators.c
          taskset -c "$cpu" ./build/compiler benchmark-dominators
          taskset -c "$cpu" ./build/compiler benchmark-dominators --cfg build/dominators-fixture.cfg

      - name: Benchmark the preprocessor fuzz harness
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',preprocessor-fuzz,')
        run: |
