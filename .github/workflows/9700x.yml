name: Measure 40 packed numeric forms for PR 3643
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packed-costs:
    if: github.repository_id == '1421805693' && github.ref == 'refs/heads/measure/pr3643-packed-9700x-6b0809fc'
    runs-on:
      group: buster-9700x-service-dispatch
      labels: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: znver5
      BUSTER_DEBUG_INFO: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify locked benchmark host and stage its official toolchain
        run: |
          test "$(git rev-parse HEAD^)" = 5ce76f08c3ce7ed298009437d699bbc9c90471a4
          grep -Em1 '^model name[[:space:]]*:[[:space:]]*AMD Ryzen 7 9700X([[:space:]]|$)' /proc/cpuinfo
          bash tools/ci/setup-benchpress.sh
      - name: Collect exact register costs using the PR measurement fixtures
        run: |
          evidence="$RUNNER_TEMP/packed-costs-$GITHUB_RUN_ID"
          mkdir -p "$evidence"
          printf '%s\n' "main=$(git rev-parse HEAD^)" "probe=$(git rev-parse HEAD)" "fixture_source=3f48dfb75fbe7f1fc1d7c7467553ea5e345126d7" > "$evidence/identity.txt"
          ps -eo psr,pcpu,pid,etimes,user,comm --sort=-pcpu | sed -n '1,10p' > "$evidence/busy-before.txt"
          cat /proc/loadavg >> "$evidence/busy-before.txt"
          forms="$evidence/forms.txt"
          rows=src/buster/compiler/x86_zen5_rows.c
          sed -nE 's/^ +BUSTER_X86_ZEN5_PACKED_TEST\(([A-Z0-9_]+)\),$/\1/p' src/buster/compiler/x86_zen5_test.c > "$forms"
          test "$(sort -u "$forms" | wc -l)" = 40
          while IFS= read -r form; do
              if grep -Fq "X($form, REGISTER," "$rows"; then
                  printf 'Selected form already has a row: %s\n' "$form" >&2
                  exit 1
              fi
          done < "$forms"
          awk 'NR == FNR { forms[++count] = $0; next }
               { print }
               /^#define BUSTER_X86_ZEN5_TABLE\(X\)/ {
                   for (i = 1; i <= count; i++)
                       printf "    X(%s, REGISTER, U, U, U, U, U, U, U, 0, 0, 0) %c\n", forms[i], 92
               }' "$forms" "$rows" > "$rows.new"
          mv "$rows.new" "$rows"
          taskset -c 0-7 ./build.sh --config Release --jobs 8
          compiler=$(./build.sh print-output --config Release)
          sha256sum "$compiler" "$rows" src/buster/compiler/x86_zen5_measure.c src/buster/compiler/x86_zen5_test.c >> "$evidence/identity.txt"
          clang --version >> "$evidence/identity.txt"
          taskset -c 2 "$compiler" measure-x86-zen5 --missing --table > "$evidence/measurement.txt" 2> "$evidence/errors.txt"
          awk 'NR == FNR { selected[$1] = 1; next }
               /^# table$/ { table = 1; next }
               table && /^ *X\(/ {
                   split($0, fields, /[(),]/)
                   if (fields[2] in selected && fields[3] == " REGISTER")
                       print
               }' "$forms" "$evidence/measurement.txt" > "$evidence/cost-rows.txt"
          test "$(wc -l < "$evidence/cost-rows.txt")" = 40
          awk -F ', *' '$4 == "U" || $5 == "U" || $9 == "U" { bad++ } END { exit bad != 0 }' "$evidence/cost-rows.txt"
          cat "$evidence/cost-rows.txt"
          ps -eo psr,pcpu,pid,etimes,user,comm --sort=-pcpu | sed -n '1,10p' > "$evidence/busy-after.txt"
          cat /proc/loadavg >> "$evidence/busy-after.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: packed-numeric-costs-pr3643
          path: ${{ runner.temp }}/packed-costs-${{ github.run_id }}
