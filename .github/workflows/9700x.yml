name: Hosted simplified stage 1 validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e7217fa16fa080bf8f849985c73575fda59836c2
          fetch-depth: 2
      - name: Validate simplified build script using the prior regression harness
        shell: bash
        run: |
          set -euo pipefail
          bash -n build.sh
          git diff --check 829fc6d16342920f678b27ad443db3d91737bfef HEAD
          git show 53685555a3310d9a2258f6264a242e8db5623899:tools/build_linker_test.c > "$RUNNER_TEMP/build_linker_test.c"
          clang -O2 -Wall -Wextra -Werror "$RUNNER_TEMP/build_linker_test.c" -o "$RUNNER_TEMP/build-linker-test"
          "$RUNNER_TEMP/build-linker-test" "$PWD/build.sh"
