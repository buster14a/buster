        if: env.MEASURE == 'all' || contains(env.MEASURE, ',executable,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-executable

      - name: Benchmark the runtime snapshot
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',snapshot,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-snapshot

      - name: Benchmark the foreign inputs against mold and wild
        # --linkers also times mold's and wild's reading and resolving on one thread on the same command lines, which no
        # pull request changes: it runs where `changes` doesn't rule it out (foreign_benchmark.c's harness).
        if: needs.changes.outputs.foreign != 'false'
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-foreign --linkers

      - name: Benchmark the foreign inputs
        # Every other pull request's: the resolution's times by the vector path and the exact one.
        if: needs.changes.outputs.foreign == 'false' && (env.MEASURE == 'all' || contains(env.MEASURE, ',foreign,'))
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-foreign

      - name: Benchmark foreign string pooling through executable output
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',foreign-strings,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-foreign-strings --counts 64,4096 --runs 3

      - name: Benchmark the whole link against GNU ld, lld, mold and wild
        # Without taskset: it pins its own lane and the linkers' runs on one thread, and the linkers' other runs need
        # every CPU. Its linkers' side, most of the step, times GNU ld, lld, mold and wild, which no pull request
        # changes, and link-foreign on the same command lines: it runs where `changes` doesn't rule it out (its
        # baselines).
        if: needs.changes.outputs.baselines != 'false'
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          ./build/compiler benchmark-link --cpus "$cpu"

      - name: Benchmark the whole link by the direct path
        # Every other pull request's: the direct path's times, and its programs must still run as their models predict.
        if: needs.changes.outputs.baselines == 'false' && (env.MEASURE == 'all' || contains(env.MEASURE, ',link,'))
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          ./build/compiler benchmark-link --cpus "$cpu" --only direct

      - name: Benchmark the floors
        # Without taskset too: it pins itself, and its writes from several threads take the first CPUs it may use. What
        # the machine and the kernel charge doesn't depend on a pull request either: it runs with the linkers'.
        if: needs.changes.outputs.baselines != 'false'
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          ./build/compiler benchmark-floors --cpu "$cpu"

      - name: Benchmark token refinement on the repository sources
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',refinement,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-refinement src

      - name: Benchmark the preprocessor on main.c against clang -E
        # The preprocessor's own predefines follow the options as clang's do (c_predefines.c): -march=native's and
        # -funsigned-char's among them. --clang also times `clang -E` on the same file after each timed pass, about
        # 6 s of the step's 12, which measures clang rather than this compiler: it runs where `changes` doesn't rule
        # it out (c_preprocessor_benchmark.c's harness).
        if: needs.changes.outputs.preprocessor_clang != 'false'
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-preprocessor --clang -target x86_64-pc-linux-gnu -march=native -Isrc -fwrapv -funsigned-char -DBUSTER_COMPLETE_DRIVER=1 src/buster/compiler/main.c

      - name: Benchmark the preprocessor on main.c
        # Every other pull request's and every push's: the preprocessor's times by the vectorized kernels and their
        # scalar twins, without clang's.
        if: needs.changes.outputs.preprocessor_clang == 'false' && (env.MEASURE == 'all' || contains(env.MEASURE, ',preprocessor,'))
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-preprocessor -target x86_64-pc-linux-gnu -march=native -Isrc -fwrapv -funsigned-char -DBUSTER_COMPLETE_DRIVER=1 src/buster/compiler/main.c

      - name: Benchmark the printer on main.c and the frozen sqlite3.c, with line markers and without
        # #649: -E -P's and -E's printing (--markers runs and prints as the -E driver does) by pp_print_spellings against
        # the printer's general loop for every chunk (--spelling-cost), with the printer's own copies either way: each
        # row's history is its before. About 13 s.
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',preprocessor,')
        run: |
          unset CPATH C_INCLUDE_PATH
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          corpus=/var/lib/buster-9700x/corpora/preprocessor-391e729af658
          sqlite=(--predefines "$corpus/provenance/gnu17-pinned-predefines.txt" --target=x86_64-linux-gnu -march=znver5 -std=gnu17 -nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include" "$corpus/sqlite/sqlite3.c")
          taskset -c "$cpu" ./build/compiler benchmark-preprocessor --spelling-cost -target x86_64-pc-linux-gnu -march=native -Isrc -fwrapv -funsigned-char -DBUSTER_COMPLETE_DRIVER=1 src/buster/compiler/main.c
          taskset -c "$cpu" ./build/compiler benchmark-preprocessor --markers --spelling-cost -target x86_64-pc-linux-gnu -march=native -Isrc -fwrapv -funsigned-char -DBUSTER_COMPLETE_DRIVER=1 src/buster/compiler/main.c
          taskset -c "$cpu" ./build/compiler benchmark-preprocessor --spelling-cost "${sqlite[@]}"
          taskset -c "$cpu" ./build/compiler benchmark-preprocessor --markers --spelling-cost "${sqlite[@]}"

