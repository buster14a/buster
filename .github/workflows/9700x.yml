name: Temporary microarchitecture diagnostic

# This public repository must not execute unreviewed fork code on the host.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
  # Once a day, the measurements a push to main leaves out (`changes`).
  schedule:
    - cron: '23 7 * * *'
  # Every pull request runs the workflow, since its job is a required check: a pull request that changes only
  # documentation gets the job skipped by `changes`, which counts as passed, rather than no check at all, which blocks
  # the merge.
  pull_request:

permissions:
  contents: read

# Keep each PR/ref's pending runs separate: older branches using a single repository-wide pending slot otherwise
# cancel another PR's qualification. Each group keeps one pending run, GitHub's default: a newer push replaces its
# pending run, which would only qualify a commit already superseded. A newer push to a PR also cancels the PR's run in
# progress, which is mostly a job waiting for the 9700X (the slot is held from then on, so a run waiting hours would
# otherwise still run for its stale commit); a push to main lets main's run finish. The daily run has a group of its
# own, so that a push to main doesn't replace it while it waits. The runner's job hooks serialize all jobs with the
# shared host lock (AGENTS.md).
concurrency:
  group: buster-fast-9700x-${{ github.event.pull_request.number || (github.event_name == 'schedule' && 'schedule') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request changes anything but documentation (`docs/**` and `*.md`, as `push`'s paths-ignore), on a
  # GitHub-hosted runner so that it doesn't wait for the 9700X: the files the merge changes against its base. The selector must pass before tests or benchmarks run. And whether it changes the harnesses of the baselines, the linkers'
  # times and the floors (link_benchmark.c and floors_benchmark.c): they measure other programs and the machine, the same
  # for every pull request, so `benchmarks` measures them on the daily and dispatched runs and on pull requests that change
  # these harnesses, as when this job is skipped or fails. The same for benchmark-foreign's mold and wild
  # (foreign_benchmark.c's `--linkers`), apart, since its harness changes with the foreign path's phases, and for
  # benchmark-preprocessor's `clang -E` (`--clang`, `preprocessor_clang`: c_preprocessor_benchmark.c). And, per
  # module, whether it changes the sources of a benchmark whose isolated and after-scalar samples (`--only`,
  # `--after-scalar 200`, repeated in separate processes) cost far more than its plain run: about 200 ms before each of
  # 21 samples per case, 150 s of a pull request's job in all. Those samples run on the daily and dispatched runs and on
  # pull requests that change what they measure. The same for the first-party performance readers' qualification
  # (`performance`): tools/performance, docs/performance, web/perf, the evidence's pin or the qualification's steps.
  # A step gated on one of these outputs also runs on the pull request that changes it.
  # And which plain benchmarks, with their checks against the scalar twins, a pull request runs (`measure`): those whose
  # sources it changes, and those whose steps it changes (the branch-sizing qualification too: its steps or its
  # sources). A benchmark built as a translation unit of its own (build.sh's *_benchmark.c) measures what that unit
  # includes, which this job reads from the #include lines; one in main.c's units measures the files that define the
  # functions it calls, as its entry names them. The plain runs took about 105 s of a pull request's 230, most of them
  # measuring code the pull request doesn't change; a change to build.sh runs every one.
  # On a push to main, whose pull request's run measured what it changes, every output but `code` is `false`: the full
  # set used to exceed the 10-minute budget on every push, failing while keeping the 9700X from every pull
  # request's job meanwhile. A push runs every plain benchmark (`measure` is `all`), so that main has each one's numbers
  # at every commit. The daily and dispatched runs, which skip this job, have the full set.
  # The selector is tools/ci/changes.c: the modules' sources (`changes_modules`), the plain benchmarks'
  # (`changes_benchmarks`) and the decision, which its --self-test checks against this workflow and the sources before
  # it decides.
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      baselines: ${{ steps.files.outputs.baselines }}
      foreign: ${{ steps.files.outputs.foreign }}
      branch_sizing: ${{ steps.files.outputs.branch_sizing }}
      preprocessor_clang: ${{ steps.files.outputs.preprocessor_clang }}
      zen5: ${{ steps.files.outputs.zen5 }}
      ssa: ${{ steps.files.outputs.ssa }}
      parser_bindings: ${{ steps.files.outputs.parser_bindings }}
      environments: ${{ steps.files.outputs.environments }}
      ir: ${{ steps.files.outputs.ir }}
      ir_lowering: ${{ steps.files.outputs.ir_lowering }}
      ir_optimize: ${{ steps.files.outputs.ir_optimize }}
      checker: ${{ steps.files.outputs.checker }}
      checker_bindings: ${{ steps.files.outputs.checker_bindings }}
      checker_binding_modes: ${{ steps.files.outputs.checker_binding_modes }}
      check_debug: ${{ steps.files.outputs.check_debug }}
      check_debug_rows: ${{ steps.files.outputs.check_debug_rows }}
      files: ${{ steps.files.outputs.files }}
      compile_time: ${{ steps.files.outputs.compile_time }}
      performance: ${{ steps.files.outputs.performance }}
      measure: ${{ steps.files.outputs.measure }}
    steps:
      - name: Check out the triggering commit and its parents
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Build the selector and check it against this workflow and the sources
        # tools/ci/changes.c, built with the runner's cc in about a second: its self-test checks its tables against the
        # workflow (each output a step reads, each MEASURE name, each gated step changed alone) and the sources (each
        # pattern's alternatives and units), and its decisions on fixtures. When it fails, so does this job, and the remaining jobs do not run.
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c17 -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/changes" tools/ci/changes.c
          "$RUNNER_TEMP/changes" --self-test

      - id: files
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/9700x.yml
          if [ "$GITHUB_EVENT_NAME" = push ]; then
              "$RUNNER_TEMP/changes" --event push --workflow "$workflow" --output "$GITHUB_OUTPUT"
          else
              # The merge's changes against its base, both names of a file renamed, and the base's workflow, empty
              # where it has none.
              git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/files"
              if ! git show "HEAD^1:$workflow" > "$RUNNER_TEMP/base.yml" 2> /dev/null; then
                  : > "$RUNNER_TEMP/base.yml"
              fi
              "$RUNNER_TEMP/changes" --event pull_request --files "$RUNNER_TEMP/files" \
                  --base-workflow "$RUNNER_TEMP/base.yml" --workflow "$workflow" --output "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests on Ubuntu 26.04 (Clang 23, ${{ matrix.host_arch }})
    needs: changes
    if: ${{ !cancelled() && github.repository_id == '1421805693' && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.code != 'false')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        host_arch: [x86-64, native]
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: ${{ matrix.host_arch }}
      BUSTER_ORACLE_CACHE: check
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install official Clang 23.1.4 and test tools
        run: bash tools/ci/setup-hosted.sh

      - name: Fetch generic baseline startup objects and runtime for emulation
        if: matrix.host_arch == 'x86-64'
        run: bash tools/ci/setup-baseline-runtime.sh

      - name: Fetch and verify frozen corpus inputs
        run: |
          corpus="$RUNNER_TEMP/preprocessor-391e729af658"
          bash tools/ci/fetch-corpus.sh "$corpus"
          printf 'BUSTER_CORPUS=%s\n' "$corpus" >> "$GITHUB_ENV"

      - name: Report host CPU and selected compiler path
        run: |
          grep -m1 '^model name[[:space:]]*:' /proc/cpuinfo
          printf 'Available CPUs: %s\n' "$(nproc)"
          for arch in native "$BUSTER_HOST_ARCH"; do
            printf '\nClang target for -march=%s:\n' "$arch"
            clang -### -march="$arch" -c -x c /dev/null -o /dev/null 2>&1 |
              sed -n 's/.*"-target-cpu" "\([^"]*\)".*/  CPU: \1/p'
            clang -march="$arch" -dM -E -x c /dev/null |
              grep -E '^#define (__AVX512(F|BW|VL|DQ|CD|VBMI|VBMI2|VPOPCNTDQ|BITALG|VNNI)__|__(GFNI|VAES|AES|BMI|BMI2|LZCNT|POPCNT|AVX2|SSSE3|SSE4_1|XSAVE)__) ' || true
          done
          defines=$(clang -march="$BUSTER_HOST_ARCH" -Isrc -dM -E \
            -include src/buster/compiler/host_isa.h -x c /dev/null)
          if grep -q '^#define BUSTER_HOST_VECTOR 1$' <<< "$defines"; then
            path=vector
          else
            path=scalar
          fi
          printf '\nSelected host path: %s (%s)\n' "$path" "$BUSTER_HOST_ARCH"
          if [ "$BUSTER_HOST_ARCH" = x86-64 ] && [ "$path" != scalar ]; then
            printf '%s\n' '::error::Baseline hosted correctness requires BUSTER_HOST_VECTOR=0; the compiler selected a vector path.'
            exit 1
          fi
          # Hosted CPU models vary. The native build exercises its actual host path;
          # the gated 9700X job below always qualifies the complete vector feature set.
          if [ "$BUSTER_HOST_ARCH" = native ] && [ "$path" = scalar ]; then
            printf '%s\n' 'Hosted native build uses scalar kernels; required vector correctness runs on the 9700X after hosted tests pass.'
          fi

      - name: Check baseline fallback memory and arithmetic boundaries
        run: |
          clang -std=c17 -O2 -g -march=x86-64 -Wall -Wextra -Werror -Wno-psabi \
            -fsanitize=undefined -fno-sanitize-recover=all -Isrc/buster/compiler \
            tests/host-fallback/edge_cases.c -o "$RUNNER_TEMP/host-fallback-edges"
          "$RUNNER_TEMP/host-fallback-edges"

      - name: Build the external Clang pragma oracle and the compiler
        run: |
          oracle="$RUNNER_TEMP/preprocessor-pragma-oracle"
          bash tools/build-preprocessor-pragma-oracle.sh "$oracle"
          BUSTER_DEBUG_INFO=0 ./build.sh
          test -x build/compiler
          test "$(find build -type f -executable | wc -l)" -eq 1
          printf 'BUSTER_PPF_PRAGMA_ORACLE=%s\n' "$oracle" >> "$GITHUB_ENV"
          clang --version
          llvm-config --version

      - name: Compile and run baseline code on an emulated x86-64 CPU
        if: matrix.host_arch == 'x86-64'
        run: |
          smoke="$RUNNER_TEMP/baseline-smoke"
          mkdir "$smoke"
          printf '\357\273\277#define A 7\nint buster_add(int x){return x+A;}\n' > "$smoke/input.c"
          printf '.text\n.globl buster_asm\nbuster_asm:\nmov $7, %%eax\nadd $3, %%eax\nret\n' > "$smoke/input.s"
          library="$BUSTER_HOST_RUNTIME/usr/lib/x86_64-linux-gnu"
          loader="$library/ld-linux-x86-64.so.2"
          qemu=(qemu-x86_64 -cpu qemu64 "$loader" --library-path "$library")
          timeout 60s "${qemu[@]}" ./build/compiler -E -P -o "$smoke/input.i" "$smoke/input.c"
          timeout 60s "${qemu[@]}" ./build/compiler -c -march=x86-64 -o "$smoke/input.o" "$smoke/input.c"
          timeout 60s "${qemu[@]}" ./build/compiler assemble -march=x86-64 -o "$smoke/asm.o" "$smoke/input.s"
          printf 'int buster_add(int); int buster_asm(void); int main(void){return buster_add(5)!=12 || buster_asm()!=10;}\n' > "$smoke/main.c"
          clang -c -march=x86-64 "$smoke/main.c" -o "$smoke/main.o"
          clang -no-pie -nostdlib "$library/crt1.o" "$library/crti.o" "$smoke/main.o" \
            "$smoke/input.o" "$smoke/asm.o" "$library/libc.so.6" \
            "$BUSTER_HOST_RUNTIME/usr/lib/gcc/x86_64-linux-gnu/15/libgcc.a" "$library/crtn.o" -o "$smoke/program"
          timeout 60s "${qemu[@]}" "$smoke/program"

      - name: Check out reviewed first-party performance fixtures and acceptance harnesses
        # With the qualification below, on the daily and dispatched runs and on pull requests that change the readers
        # (tools/performance, docs/performance, web/perf), this pin or these steps: about 11 s of building and checking that
        # every other pull request's job spent on code it doesn't change.
        if: needs.changes.outputs.performance != 'false'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: buster14a/buster-performance
          ref: 1c0523ac42bb2f33e212226cf94626ac942ee4d2 # Reviewed source/evidence from buster-performance PR #8.
          path: build/performance-reader-evidence
          sparse-checkout: |
            docs/measurements/performance-format-2026-10-24
            docs/measurements/performance-first-party-2026-10-25
            docs/measurements/performance-pages-2026-10-25
            docs/measurements/foreign-strings-2026-10-23/raw
          persist-credentials: false

      - name: Test first-party performance readers and frozen imports on Ubuntu 26.04
        if: needs.changes.outputs.performance != 'false'
        run: |
          set -euo pipefail
          reader_root=build/performance-reader-evidence
          reader_fixture="$reader_root/docs/measurements/performance-format-2026-10-24"
          reader_harness="$reader_root/docs/measurements/performance-first-party-2026-10-25"
          bash tools/performance/build.sh
          build/performance/bmf --self-test
          clang -std=c17 -D_GNU_SOURCE -O2 -g -Wall -Wextra -Werror \
            -I tools/performance "$reader_harness/validate.c" -o build/performance/test-first-party
          build/performance/test-first-party "$reader_fixture" "$reader_root" \
            docs/performance/buster-manifest-v1.schema.json
          clang -std=c17 -D_GNU_SOURCE -O2 -g -Wall -Wextra -Werror \
            -I tools/performance "$reader_harness/import-tests.c" -o build/performance/test-import-first-party
          build/performance/test-import-first-party
          build/performance/bmf validate "$reader_harness/history/census/manifest.bmf.json"
          build/performance/bmf validate "$reader_harness/history/foreign-strings/manifest.bmf.json" \
            --evidence-root "$reader_root"
          pages_harness="$reader_root/docs/measurements/performance-pages-2026-10-25"
          clang -std=c17 -D_GNU_SOURCE -O2 -g -Wall -Wextra -Werror \
            -I tools/performance "$pages_harness/profile-validation.c" -o build/performance/test-profile
          build/performance/test-profile "$reader_fixture/profile-example/capture.pftrace" \
            "$pages_harness/profile/capture.pftrace"
          build/performance/bmf validate "$pages_harness/profile/manifest.bmf.json"
          for manifest in "$pages_harness/history-partitioned/"*.bmf.json; do
            build/performance/bmf validate "$manifest"
          done
          build/performance/capture --no-sampling build/performance/qualification-launch 2 1000000 \
            -- /usr/bin/true
          pages_source=$(git rev-parse HEAD)
          pages_evidence=1c0523ac42bb2f33e212226cf94626ac942ee4d2
          pages_index=docs/measurements/performance-pages-2026-10-25/site-index.json
          build/performance/publish . "$pages_source" "$reader_root" "$pages_evidence" \
            "$pages_index" build/performance/pages-check-1 2026-10-25T13:19:28Z
          build/performance/publish . "$pages_source" "$reader_root" "$pages_evidence" \
            "$pages_index" build/performance/pages-check-2 2026-10-25T13:19:28Z
          diff -rq build/performance/pages-check-1 build/performance/pages-check-2

      - name: Write clang's predefines for the compiler's flags
        # For the steps that preprocess the compiler's own translation units: --predefines supplies the macro effects of
        # flags such as -funsigned-char.
        run: clang -dM -E -march="$BUSTER_HOST_ARCH" -fwrapv -funsigned-char -x c /dev/null > build/predefines.h

      - name: Parse the compiler source
        # Preserve this parser smoke test explicitly now that the default C command performs semantic checking.
        # Default C checking and object emission have their own external-oracle tests below.
        run: ./build/compiler parse -fsyntax-only -march="$BUSTER_HOST_ARCH" -Isrc -fwrapv -funsigned-char --predefines build/predefines.h src/buster/compiler/main.c

      - name: Fetch c-testsuite at its pinned commit
        # #145's programs, at the commit tests/c-testsuite/subset.txt was declared for: a shallow fetch of that one commit,
        # whose hash fixes the files, without git's sample hooks. The test list below compiles and runs them.
        run: |
          git init -q --template= build/c-testsuite
          git -C build/c-testsuite fetch -q --depth 1 https://github.com/c-testsuite/c-testsuite 5c7275656d751de0e68b2d340a95b5681858ed07
          git -C build/c-testsuite checkout -q FETCH_HEAD

      - name: Run correctness tests within the hosted CPU budget
        run: |
          ./build/compiler parallel --github --jobs "$(nproc)" --timeout 600 < tools/ci/correctness.tests
          oracle="${XDG_CACHE_HOME:-$HOME/.cache}/buster/oracle"
          if [ "$BUSTER_ORACLE_CACHE" = check ] && [ -d "$oracle" ]; then
              find "$oracle" -type f -mtime +2 -delete
              find "$oracle" -mindepth 1 -type d -empty -delete
          fi

  benchmarks:
    name: Native tests and benchmarks on Benchpress (Ryzen 7 9700X)
    needs: [changes, test]
    # Both hosted variants must pass before any hardware work, including native
    # correctness. This also covers scheduled/manual runs, whose selector is skipped.
    if: ${{ !cancelled() && github.repository_id == '1421805693' && needs.test.result == 'success' }}
    runs-on:
      group: buster-9700x-service-dispatch
      labels: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 25 || 20 }}
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: znver5
      # Hosted correctness independently checks both variants of this exact revision before this job can start.
      # The persistent native cache reuses ordinary runs; daily/manual runs execute and check every oracle again.
      BUSTER_ORACLE_CACHE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'check' || 'use' }}
      MEASURE: ${{ needs.changes.outputs.measure || 'all' }}
    steps:
      - name: Verify benchmark host
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          grep -m1 '^model name[[:space:]]*:' /proc/cpuinfo
          grep -Eq '^model name[[:space:]]*:[[:space:]]*AMD Ryzen 7 9700X([[:space:]]|$)' /proc/cpuinfo

      - name: Check out triggering commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Stage official Clang 23.1.4 in the private runner cache
        run: bash tools/ci/setup-benchpress.sh

      - name: Require the complete native vector feature set
        run: |
          defines=$(clang -march="$BUSTER_HOST_ARCH" -Isrc -dM -E \
            -include src/buster/compiler/host_isa.h -x c /dev/null)
          if ! grep -q '^#define BUSTER_HOST_VECTOR 1$' <<< "$defines"; then
            printf '%s\n' '::error::9700X correctness requires BUSTER_HOST_VECTOR=1; vector coverage cannot be qualified by scalar kernels.'
            exit 1
          fi
          printf 'Selected host path: vector (%s)\n' "$BUSTER_HOST_ARCH"

      - name: Build the external Clang pragma oracle and the Zen 5 executable
        run: |
          oracle="$RUNNER_TEMP/preprocessor-pragma-oracle"
          # The official libclang-cpp includes its LLVM dependencies. Link directly
          # to it, avoiding llvm-config's Ubuntu-specific static system-library paths.
          flags=$(llvm-config --cxxflags --ldflags)
          read -r -a flags_array <<< "${flags//$'\n'/ }"
          clang++ -O2 -Wall -Werror tools/preprocessor_pragma_oracle.cpp \
            "${flags_array[@]}" -lclang-cpp -o "$oracle"
          "$oracle" --version
          printf 'BUSTER_PPF_PRAGMA_ORACLE=%s\n' "$oracle" >> "$GITHUB_ENV"
          BUSTER_DEBUG_INFO=0 taskset -c 0-7 ./build.sh
          clang -dM -E -march="$BUSTER_HOST_ARCH" -fwrapv -funsigned-char -x c /dev/null > build/predefines.h

      - name: Fetch and verify frozen corpus inputs for native correctness
        run: |
          corpus="$RUNNER_TEMP/preprocessor-391e729af658"
          bash tools/ci/fetch-corpus.sh "$corpus"
          printf 'BUSTER_CORPUS=%s\n' "$corpus" >> "$GITHUB_ENV"

      - name: Fetch c-testsuite at its pinned commit
        # #145's programs, at the commit tests/c-testsuite/subset.txt was declared for: a shallow fetch of that one commit,
        # whose hash fixes the files, without git's sample hooks. The test list below compiles and runs them.
        run: |
          git init -q --template= build/c-testsuite
          git -C build/c-testsuite fetch -q --depth 1 https://github.com/c-testsuite/c-testsuite 5c7275656d751de0e68b2d340a95b5681858ed07
          git -C build/c-testsuite checkout -q FETCH_HEAD

      - name: Parse the compiler source on the native vector build
        run: ./build/compiler parse -fsyntax-only -march="$BUSTER_HOST_ARCH" -Isrc -fwrapv -funsigned-char --predefines build/predefines.h src/buster/compiler/main.c

      - name: Run complete native vector correctness before benchmarks
        run: |
          taskset -c 0-7 ./build/compiler parallel --github --jobs 8 --timeout 600 < tools/ci/correctness.tests
          oracle="${XDG_CACHE_HOME:-$HOME/.cache}/buster/oracle"
          if [ "$BUSTER_ORACLE_CACHE" = check ] && [ -d "$oracle" ]; then
              find "$oracle" -type f -mtime +2 -delete
              find "$oracle" -mindepth 1 -type d -empty -delete
          fi

      - name: Collect microarchitecture evidence on the locked 9700X
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-microarchitecture"
          cat > "$RUNNER_TEMP/buster-microarchitecture-campaign.py" <<'CAMPAIGN_PY'
          #!/usr/bin/env python3
          """Collect portable Buster/AMD perf evidence. See the accompanying README."""
          import argparse
          import hashlib
          import json
          import os
          from pathlib import Path
          import shlex
          import subprocess
          import tempfile
          import time

          p = argparse.ArgumentParser()
          p.add_argument('--compiler', required=True)
          p.add_argument('--corpus', required=True)
          p.add_argument('--out', required=True)
          p.add_argument('--local-cores', action='store_true')
          p.add_argument('--repetitions', type=int, default=2)
          p.add_argument('--stage-repetitions', type=int, default=5)
          p.add_argument('--profile-runs', type=int, default=20)
          p.add_argument('--max-events', type=int, default=0, help='smoke-test limit; 0 means all per-thread CPU events')
          p.add_argument('--max-metrics', type=int, default=0, help='smoke-test limit; 0 means all per-thread core metrics')
          p.add_argument('--no-profiles', action='store_true')
          a = p.parse_args()
          out = Path(a.out).resolve()
          out.mkdir(parents=True, exist_ok=True)
          compiler = str(Path(a.compiler).resolve())
          corpus = Path(a.corpus).resolve()
          os.environ['LC_ALL'] = 'C'
          os.environ['SOURCE_DATE_EPOCH'] = '1792454400'
          os.environ.pop('CPATH', None)
          os.environ.pop('C_INCLUDE_PATH', None)
          os.environ['CORES_TITLE'] = 'Buster microarchitecture counter sweep'
          os.environ['CORES_LINK'] = 'https://github.com/buster14a/buster'


          def output(command):
              r = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, check=False)
              return {'command': command, 'status': r.returncode, 'output': r.stdout}


          def sha256(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for b in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(b)
              return h.hexdigest()


          def wrapped(command, affinity_path):
              if a.local_cores:
                  # Each invocation acquires/releases the machine's shared core pool.
                  shell = 'printf "%s\\n" "$CORES_CPUS" > "$1"; shift; exec taskset -c "${CORES_CPUS%%,*}" "$@"'
                  return ['cores', '-n', '1', '--', 'bash', '-c', shell, 'pin', str(affinity_path), *command]
              affinity_path.write_text('2\n')
              return ['taskset', '-c', '2', *command]


          def execute(command, stat_path=None, stdout_path=None, stderr_path=None):
              affinity = out / '_affinity.txt'
              if stat_path is not None:
                  command = ['perf', 'stat', '--no-big-num', '-x', ';', '-o', str(stat_path), *command]
              start = time.monotonic_ns()
              with open(stdout_path or os.devnull, 'wb') as so, open(stderr_path or os.devnull, 'wb') as se:
                  r = subprocess.run(wrapped(command, affinity), stdout=so, stderr=se, check=False)
              return {'status': r.returncode, 'wall_ms': (time.monotonic_ns() - start) / 1e6,
                      'affinity': affinity.read_text().strip() if affinity.exists() else None}


          inventory_run = output(['perf', 'list', '--json'])
          if inventory_run['status']:
              raise SystemExit('perf list --json failed: ' + inventory_run['output'])
          inventory = json.loads(inventory_run['output'])
          (out / 'perf-list.json').write_text(json.dumps(inventory, indent=2) + '\n')
          (out / 'perf-list-details.txt').write_text(output(['perf', 'list', '--details'])['output'])
          metadata = {
              'cpu': output(['lscpu', '-J']), 'kernel': output(['uname', '-srmo']),
              'perf': output(['perf', '--version']), 'clang': output(['clang', '--version']),
              'compiler_sha256': sha256(compiler),
              'sqlite3_c_sha256': sha256(corpus / 'sqlite/sqlite3.c'),
              'corpus_manifest_sha256': sha256(corpus / 'MANIFESTS.sha256'),
              'predefines_sha256': sha256(corpus / 'provenance/gnu17-pinned-predefines.txt'),
              'perf_event_paranoid': Path('/proc/sys/kernel/perf_event_paranoid').read_text().strip(),
              'thp': Path('/sys/kernel/mm/transparent_hugepage/enabled').read_text().strip(),
              'profile_runs': a.profile_runs, 'counter_repetitions': a.repetitions,
              'stage_repetitions': a.stage_repetitions,
              'local_cores': a.local_cores,
          }
          (out / 'environment.json').write_text(json.dumps(metadata, indent=2) + '\n')

          base = ['--predefines', str(corpus / 'provenance/gnu17-pinned-predefines.txt'),
                  '--clang-features', '-march=znver5', '-std=gnu17', '-nostdinc',
                  '-isystem', str(corpus / 'headers/usr/lib/clang/23/include'),
                  '-isystem', str(corpus / 'headers/usr/local/include'),
                  '-isystem', str(corpus / 'headers/usr/include'), '-I' + str(corpus / 'sqlite')]
          source = str(corpus / 'sqlite/sqlite3.c')
          with tempfile.TemporaryDirectory(prefix='buster-microarch-') as scratch:
              scratch = Path(scratch)
              object_file = str(scratch / 'sqlite.o')
              workloads = {
                  'preprocess': [compiler, '-E', '-P', *base, '-o', '/dev/null', source],
                  'syntax': [compiler, '-fsyntax-only', *base, source],
                  'compile': [compiler, '-c', *base, '-o', object_file, source],
              }
              descriptions = {k: shlex.join(v).replace(compiler, '<COMPILER>').replace(str(corpus), '<CORPUS>').replace(str(scratch), '<SCRATCH>') for k, v in workloads.items()}
              (out / 'commands.json').write_text(json.dumps(descriptions, indent=2) + '\n')
              events = sorted({e['EventName'] for e in inventory if e.get('Unit') == 'cpu'
                               and e.get('EventName') and '/' not in e['EventName']})
              metrics = sorted({e['MetricName'] for e in inventory if e.get('Unit') == 'default_core' and e.get('MetricName')})
              if a.max_events:
                  events = events[:a.max_events]
              if a.max_metrics:
                  metrics = metrics[:a.max_metrics]
              supported, probes = [], []
              for event in events:
                  r = output(['perf', 'stat', '-x', ';', '-e', event + ':u', '--', 'true'])
                  ok = r['status'] == 0 and '<not supported>' not in r['output'] and '<not counted>' not in r['output']
                  probes.append({'event': event, 'available': ok, 'status': r['status'], 'output': r['output']})
                  if ok:
                      supported.append(event)
              (out / 'event-probes.json').write_text(json.dumps(probes, indent=2) + '\n')
              print('inventory:', len(events), 'thread CPU events,', len(supported), 'passed probe;', len(metrics), 'core metrics', flush=True)
              temp_stat = scratch / 'stat.csv'
              temp_stderr = scratch / 'stderr.txt'
              records = out / 'measurements.jsonl'
              with records.open('w') as log:
                  def record(kind, workload, variant, repetition, args, events_arg=None):
                      result = execute(args, temp_stat, stderr_path=temp_stderr)
                      row = {'kind': kind, 'workload': workload, 'variant': variant, 'repetition': repetition, **result,
                             'perf_stat': temp_stat.read_text() if temp_stat.exists() else '',
                             'workload_stderr': temp_stderr.read_text(errors='replace')}
                      log.write(json.dumps(row) + '\n')
                      log.flush()
                      if row['status']:
                          print('failed', kind, workload, variant, repetition, row['status'], flush=True)
                      return row
                  # Process-level anchors: include user and kernel for system time and faults.
                  for rep in range(a.stage_repetitions):
                      for workload, cmd in workloads.items():
                          record('baseline', workload, 'process', rep,
                                 ['-e', 'task-clock,cycles,instructions,branches,branch-misses,page-faults,minor-faults,major-faults,context-switches,cpu-migrations', '--', *cmd])
                          if workload != 'preprocess':
                              stage_cmd = cmd[:1] + ['--time-stages'] + cmd[1:]
                              record('stages', workload, 'time-stages', rep,
                                     ['-e', 'task-clock', '--', *stage_cmd])
                  # Independent small groups keep the six core PMCs from excessive multiplexing.
                  groups = [supported[i:i + 4] for i in range(0, len(supported), 4)]
                  for index, group in enumerate(groups):
                      for rep in range(a.repetitions):
                          for workload, cmd in workloads.items():
                              ev = ','.join(['cycles:u', 'instructions:u'] + [e + ':u' for e in group])
                              record('counter', workload, group, rep, ['-e', ev, '--', *cmd])
                      if index % 10 == 0:
                          print('counter group', index + 1, 'of', len(groups), flush=True)
                  # Each formula gets its own invocation. The output reports multiplexing or failures.
                  for index, metric in enumerate(metrics):
                      for workload, cmd in workloads.items():
                          record('metric', workload, metric, 0, ['--all-user', '-M', metric, '--', *cmd])
                      if index % 25 == 0:
                          print('metric', index + 1, 'of', len(metrics), flush=True)
              if not a.no_profiles:
                  profiles = out / 'profiles'
                  profiles.mkdir(exist_ok=True)
                  for workload, cmd in workloads.items():
                      # A fresh process per iteration; perf inherits children and covers the entire driver.
                      shell = 'for ((i=0;i<$1;i++)); do "${@:2}" >/dev/null 2>/dev/null || exit $?; done'
                      data = profiles / (workload + '.data')
                      run_cmd = ['perf', 'record', '-q', '-e', 'cycles:u', '-F', '997', '--call-graph', 'dwarf,8192',
                                 '-o', str(data), '--', 'bash', '-c', shell, 'repeat', str(a.profile_runs), *cmd]
                      status = execute(run_cmd, stderr_path=profiles / (workload + '-record.stderr'))
                      (profiles / (workload + '-record.json')).write_text(json.dumps(status, indent=2) + '\n')
                      if status['status'] == 0 and data.exists():
                          for child in ('no-children', 'children'):
                              report = output(['perf', 'report', '--stdio', '--' + child, '--sort', 'comm,dso,symbol',
                                               '--percent-limit', '0.25', '-i', str(data)])
                              (profiles / (workload + '-' + child + '.txt')).write_text(report['output'])
                          z = subprocess.run(['zstd', '-q', '-f', '--rm', str(data)], check=False)
                          if z.returncode:
                              print('zstd failed for', workload, flush=True)
                      else:
                          print('sampling failed for', workload, flush=True)
              if (out / '_affinity.txt').exists():
                  (out / '_affinity.txt').unlink()
          print('done:', out, flush=True)
          CAMPAIGN_PY
          sha256sum "$RUNNER_TEMP/buster-microarchitecture-campaign.py" > "$RUNNER_TEMP/buster-microarchitecture/campaign.sha256"
          python3 "$RUNNER_TEMP/buster-microarchitecture-campaign.py" --compiler build/compiler --corpus "$BUSTER_CORPUS" --out "$RUNNER_TEMP/buster-microarchitecture" --repetitions 2 --stage-repetitions 7 --profile-runs 30

      - name: Upload microarchitecture evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: buster-9700x-microarchitecture
          path: ${{ runner.temp }}/buster-microarchitecture/
          if-no-files-found: warn
          retention-days: 14
