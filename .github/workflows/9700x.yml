name: Controlled streaming profiler diagnosis

# Temporary review-branch scaffold only. This does not qualify a PR or use Benchpress.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  streaming:
    name: Streaming diagnosis (${{ matrix.label }}, baseline)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pr689
            revision: 212020861298ec5530a2ea608bc2c5f873f245ab
          - label: pr690
            revision: a090859377a9f83c5a713a88b9ecb1e4164aaa5c
    steps:
      - name: Check out this diagnostic scaffold
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          path: diagnostics
          persist-credentials: false
      - name: Check out the frozen PR source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ matrix.revision }}
          path: source
          persist-credentials: false
      - name: Record source and host identities
        working-directory: source
        run: |
          mkdir -p ../artifacts
          git rev-parse HEAD HEAD^{tree} > ../artifacts/source-git.txt
          git ls-files -z src | xargs -0 sha256sum > ../artifacts/original-source.sha256
          uname -a > ../artifacts/kernel.txt
          lscpu > ../artifacts/cpu.txt
          git -C ../diagnostics rev-parse HEAD > ../artifacts/diagnostic-git.txt
      - name: Install the same pinned hosted tools
        working-directory: source
        run: bash tools/ci/setup-hosted.sh
      - name: Apply only failure observability and build one fixture translation unit
        id: fixture
        working-directory: source
        run: |
          test "$(git hash-object src/buster/compiler/streaming_test.c)" = 9532153f68aa2b28bf6c1e724a0876116aa31ec0
          git apply --unidiff-zero ../diagnostics/tools/ci/streaming-diag/collection.patch
          git diff --check
          git diff --name-only > ../artifacts/changed-files.txt
          test "$(cat ../artifacts/changed-files.txt)" = src/buster/compiler/streaming_test.c
          git diff > ../artifacts/collection.patch
          printf '#define _GNU_SOURCE\n' > ../artifacts/fixture.c
          awk '
            $0 == "#define BUSTER_ELSEWHERE inline __attribute__((noinline))" {
              print "#define BUSTER_ELSEWHERE static"; next
            }
            $0 == "#define BUSTER_X86_TARGET_DATA_ELSEWHERE" {
              print "// Standalone fixture retains its own immutable target data."; next
            }
            { print }
            $0 == "#include \"buster/compiler/streaming_test.c\"" { exit }
          ' src/buster/compiler/main.c >> ../artifacts/fixture.c
          cat >> ../artifacts/fixture.c <<'C'
          _Static_assert(BUSTER_HOST_VECTOR == 0, "diagnostic requires baseline host code");
          int main(int argc, char** argv)
          {
              return run_streaming_tests(argc - 1, argv + 1);
          }
          C
          clang --version > ../artifacts/clang.txt
          perf --version > ../artifacts/perf.txt
          gdb --version > ../artifacts/gdb.txt
          llvm-dwarfdump --version > ../artifacts/dwarfdump.txt
          for tool in clang perf gdb llvm-dwarfdump; do
            executable=$(command -v "$tool")
            resolved=$(readlink -f "$executable")
            printf '%s\t%s\t%s\n' "$tool" "$executable" "$resolved" >> ../artifacts/tool-paths.tsv
            sha256sum "$resolved" >> ../artifacts/tool-sha256.txt
          done
          cat > ../artifacts/commands.txt <<'COMMANDS'
          clang -std=gnu17 -O1 -g0 -march=x86-64 -fwrapv -funsigned-char -fno-strict-aliasing -Wno-psabi -Wno-unused-function -Wno-unused-parameter -Wno-unused-variable -ffunction-sections -fdata-sections -Isrc -Isrc/buster/compiler -Wl,--gc-sections -pthread ../artifacts/fixture.c -o ../artifacts/fixture -lm
          TMPDIR=EACH_ATTEMPT_DIRECTORY ../artifacts/fixture --cross-check --keep
          COMMANDS
          if ! clang -std=gnu17 -O1 -g0 -march=x86-64 -fwrapv -funsigned-char \
            -fno-strict-aliasing -Wno-psabi -Wno-unused-function -Wno-unused-parameter \
            -Wno-unused-variable -ffunction-sections -fdata-sections -Isrc -Isrc/buster/compiler \
            -Wl,--gc-sections -pthread ../artifacts/fixture.c -o ../artifacts/fixture -lm \
            > ../artifacts/build.log 2>&1; then
            cat ../artifacts/build.log
            exit 1
          fi
          sha256sum ../artifacts/fixture ../artifacts/fixture.c \
            src/buster/compiler/streaming_test.c > ../artifacts/fixture.sha256
      - name: Run exactly three unchanged cross-check attempts and retain every outcome
        working-directory: source
        run: |
          failures=0
          for attempt in 1 2 3; do
            directory="$GITHUB_WORKSPACE/artifacts/attempt-$attempt"
            mkdir -p "$directory"
            set +e
            TMPDIR="$directory" ../artifacts/fixture --cross-check --keep > "$directory/run.log" 2>&1
            outcome=$?
            set -e
            printf '%s\t%s\n' "$attempt" "$outcome" >> ../artifacts/outcomes.tsv
            cat "$directory/run.log"
            if [ "$outcome" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          test "$failures" -eq 0
      - name: Prove profiler collection failure still fails the original assertions
        if: always() && steps.fixture.outcome == 'success'
        working-directory: source
        run: |
          mkdir -p ../artifacts/reject-perf ../artifacts/negative
          clang -std=gnu17 -O1 -march=x86-64 ../diagnostics/tools/ci/streaming-diag/reject-perf.c \
            -o ../artifacts/reject-perf/perf
          set +e
          PATH="$GITHUB_WORKSPACE/artifacts/reject-perf:$PATH" \
            TMPDIR="$GITHUB_WORKSPACE/artifacts/negative" \
            ../artifacts/fixture --cross-check --keep > ../artifacts/negative/run.log 2>&1
          outcome=$?
          set -e
          printf '%s\n' "$outcome" > ../artifacts/negative/outcome.txt
          cat ../artifacts/negative/run.log
          test "$outcome" -eq 1
          grep -q 'streaming: 172 checks, 2 failed' ../artifacts/negative/run.log
          grep -q 'streaming perf: record exit status 73, script exit status -1' ../artifacts/negative/run.log
          grep -q 'deliberate streaming diagnostic perf failure' ../artifacts/negative/run.log
      - name: Preserve all diagnostic objects, perf data and raw receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: streaming-${{ matrix.label }}-${{ matrix.revision }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
