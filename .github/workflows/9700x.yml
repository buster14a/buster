          taskset -c "$cpu" ./build/compiler benchmark-preprocessor-fuzz

      - name: Benchmark the object writer
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',object-writer,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
