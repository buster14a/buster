# Temporary evidence PR only. Do not merge: this workflow publishes no qualification context.
# The production PR keeps its ordinary CI. This branch builds only the instrumented corridor
# candidate; the immutable baseline product is referenced below. No native hardware job is present.
name: Issue 2553 corridor candidate compiler product

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/9700x.yml]

permissions:
  contents: read

concurrency:
  group: buster-2553-instrumented-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BUSTER_BASE_REVISION: 8e4d32879e17b7d9548cad54257a2f8461328366
  BUSTER_BASELINE_RUN: '45791795852'
  BUSTER_BASELINE_ATTEMPT: '1'
  BUSTER_BASELINE_ARTIFACT: tier1-kinds-2553-products-45791795852-1
  BUSTER_BASELINE_COMPILER_SHA256: 4c281f7892e112744b7a4f433db63b8cbba2ca379e5511025087684701f0fefa
  BUSTER_CANDIDATE_REVISION: d3d8ad3bc7373a58e62b3eb3ecb32a0001c61167
  BUSTER_MEASUREMENT_REVISION: 65c2948a7df73fd538405494ec841530c676a80a
  BUSTER_MEASUREMENT_PATCH: docs/measurements/tier1-dispatch-latch-2553-2026-11-26/scripts/kinds-main-8e4d3287.patch
  BUSTER_MEASUREMENT_SHA256: 6d6a015f4e0bb0a082d377d05c48bb1082604b3e8d6f8fb58ebd51d0461605c1
  BUSTER_SNAPSHOT_PATCH: docs/measurements/tier1-dispatch-latch-2553-2026-11-26/scripts/snapshot-after-tags.patch
  BUSTER_SNAPSHOT_SHA256: 3b452cf9c9040e3acf1aaa15889e43d8b26ae96b7687062b6fa367a79bd3fe24
  BUSTER_MODEL_REVISION: 65c2948a7df73fd538405494ec841530c676a80a
  BUSTER_MODEL_PATCH: docs/measurements/tier1-dispatch-latch-2553-2026-11-26/experiments/corridor/candidate-corridor.patch
  BUSTER_MODEL_SHA256: c7c0e010ce1d7bee2dca89d4a9bc4bbacac5af8f7278782365e0ed0f4f6e978c
  BUSTER_HOST_ARCH: vector
  BUSTER_SANITIZER: none
  BUSTER_DEBUG_INFO: '0'
  BUSTER_BUILD_DEFINES: -DBUSTER_TIER1_MEASURE_KINDS
  BUSTER_PARALLEL_CODEGEN: auto
  BUSTER_RELEASE_PARTS: '0'
  # The builder need not execute the vector product. Post-link copies it and checks its canary
  # with nm; the local AVX-512 host initializes tables when it runs the compiler for instruction counts.
  BUSTER_BAKE: '0'
  BUSTER_PGO: '0'
  BUSTER_SELF_BUILT: none

jobs:
  products:
    name: Build the corridor candidate Release compiler on a hosted runner
    if: >-
      github.repository_id == '1421805693' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/2553-instrumented-products'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the temporary evidence workflow
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Record the runner, baseline reference and candidate inputs
        run: |
          set -euo pipefail
          [[ "$BUSTER_MODEL_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUSTER_MODEL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          record="$RUNNER_TEMP/tier1-corridor-candidate-product"
          mkdir -p "$record"
          {
              printf 'workflow_revision\t%s\n' "$(git rev-parse HEAD)"
              printf 'workflow_event_revision\t%s\n' "$GITHUB_SHA"
              printf 'run\t%s\nattempt\t%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
              printf 'configuration\tRelease\nhost_target\tvector\ndebug_info\t0\n'
              printf 'bake\t0\ntarget_execution_on_builder\tnone\n'
              printf 'baseline_source_revision\t%s\n' "$BUSTER_BASE_REVISION"
              printf 'baseline_run\t%s\nbaseline_attempt\t%s\n' "$BUSTER_BASELINE_RUN" "$BUSTER_BASELINE_ATTEMPT"
              printf 'baseline_artifact\t%s\nbaseline_product\tbase/compiler\n' "$BUSTER_BASELINE_ARTIFACT"
              printf 'baseline_compiler_sha256\t%s\n' "$BUSTER_BASELINE_COMPILER_SHA256"
              printf 'candidate_source_revision\t%s\n' "$BUSTER_CANDIDATE_REVISION"
              printf 'measurement_revision\t%s\n' "$BUSTER_MEASUREMENT_REVISION"
              printf 'measurement_patch\t%s\nmeasurement_sha256\t%s\n' "$BUSTER_MEASUREMENT_PATCH" "$BUSTER_MEASUREMENT_SHA256"
              printf 'snapshot_patch\t%s\nsnapshot_sha256\t%s\n' "$BUSTER_SNAPSHOT_PATCH" "$BUSTER_SNAPSHOT_SHA256"
              printf 'model_revision\t%s\nmodel_patch\t%s\nmodel_sha256\t%s\n' "$BUSTER_MODEL_REVISION" "$BUSTER_MODEL_PATCH" "$BUSTER_MODEL_SHA256"
              printf 'hardware\tGitHub-hosted Ubuntu 26.04 only\nqualification\tnone\n'
          } > "$record/identity.tsv"
          uname -a > "$record/kernel.txt"
          lscpu > "$record/cpu.txt"
          cc -O0 -march=x86-64-v4 -maes -mgfni -mvaes -mavx512vbmi -mavx512vbmi2 \
              -mavx512vpopcntdq -mavx512bitalg -mavx512vnni tools/ci/vector-probe.c \
              -o "$RUNNER_TEMP/tier1-corridor-probe"
          # Diagnostic only: BUSTER_BAKE=0 keeps the target compiler from running on this builder.
          status=0
          "$RUNNER_TEMP/tier1-corridor-probe" | tee "$record/vector-probe.tsv" || status=$?
          printf 'vector_probe_exit\t%s\n' "$status" >> "$record/identity.tsv"

      - name: Restore and verify pinned inputs for this single hosted job
        uses: ./.github/actions/hosted-tools
        with:
          artifact-name: ''

      - name: Install the pinned Clang 23.1.4 toolchain
        run: |
          set -euo pipefail
          bash tools/ci/setup-hosted.sh 2>&1 | tee "$RUNNER_TEMP/tier1-corridor-candidate-product/setup.log"

      - name: Check out the exact candidate source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.BUSTER_CANDIDATE_REVISION }}
          path: measurement-candidate
          persist-credentials: false

      - name: Verify the three patches and record the toolchain
        run: |
          set -euo pipefail
          record="$RUNNER_TEMP/tier1-corridor-candidate-product"
          patch="$RUNNER_TEMP/tier1-kinds-2553.patch"
          capture_patch="$RUNNER_TEMP/tier1-cfg-snapshot-2553.patch"
          model_patch="$RUNNER_TEMP/tier1-corridor-model-2553.patch"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 \
              "https://raw.githubusercontent.com/buster14a/buster-performance/$BUSTER_MEASUREMENT_REVISION/$BUSTER_MEASUREMENT_PATCH" \
              -o "$patch"
          printf '%s  %s\n' "$BUSTER_MEASUREMENT_SHA256" "$patch" | sha256sum --check
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 \
              "https://raw.githubusercontent.com/buster14a/buster-performance/$BUSTER_MEASUREMENT_REVISION/$BUSTER_SNAPSHOT_PATCH" \
              -o "$capture_patch"
          printf '%s  %s\n' "$BUSTER_SNAPSHOT_SHA256" "$capture_patch" | sha256sum --check
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 \
              "https://raw.githubusercontent.com/buster14a/buster-performance/$BUSTER_MODEL_REVISION/$BUSTER_MODEL_PATCH" \
              -o "$model_patch"
          printf '%s  %s\n' "$BUSTER_MODEL_SHA256" "$model_patch" | sha256sum --check
          cp tools/ci/hosted-tools.lock "$record/hosted-tools.lock"
          clang --version > "$record/clang.txt"
          cmake --version > "$record/cmake.txt"
          ninja --version > "$record/ninja.txt"

      - name: Build the candidate with tags, snapshot and corridor model
        run: |
          set -euo pipefail
          record="$RUNNER_TEMP/tier1-corridor-candidate-product"
          patch="$RUNNER_TEMP/tier1-kinds-2553.patch"
          capture_patch="$RUNNER_TEMP/tier1-cfg-snapshot-2553.patch"
          model_patch="$RUNNER_TEMP/tier1-corridor-model-2553.patch"
          product="$record/candidate"
          mkdir -p "$product"
          cd "$GITHUB_WORKSPACE/measurement-candidate"
          test "$(git rev-parse HEAD)" = "$BUSTER_CANDIDATE_REVISION"
          test -z "$(git status --porcelain)"
          git apply --check "$patch"
          git apply --index "$patch"
          git apply --check "$capture_patch"
          git apply --index "$capture_patch"
          git apply --check "$model_patch"
          git apply --index "$model_patch"
          {
              printf 'source_revision\t%s\n' "$(git rev-parse HEAD)"
              printf 'source_tree\t%s\n' "$(git rev-parse HEAD^{tree})"
              printf 'applied_tree\t%s\n' "$(git write-tree)"
              printf 'measurement_sha256\t%s\n' "$BUSTER_MEASUREMENT_SHA256"
              printf 'snapshot_sha256\t%s\n' "$BUSTER_SNAPSHOT_SHA256"
              printf 'model_revision\t%s\nmodel_sha256\t%s\n' "$BUSTER_MODEL_REVISION" "$BUSTER_MODEL_SHA256"
              printf 'applied_diff_sha256\t%s\n' "$(git diff HEAD --binary | sha256sum | cut -d ' ' -f 1)"
              printf 'build_command\t./build.sh --config Release --jobs 4\n'
              printf 'parallel_codegen\t%s\nrelease_parts\t%s\n' "$BUSTER_PARALLEL_CODEGEN" "$BUSTER_RELEASE_PARTS"
              printf 'bake\t%s\n' "$BUSTER_BAKE"
          } > "$product/identity.tsv"
          git diff HEAD --stat > "$product/instrumentation-stat.txt"
          sha256sum src/buster/compiler/tier1_cfg.c > "$product/tier1-cfg.sha256"
          ./build.sh print-compile-flags --config Release | tr '\0' '\n' > "$product/compile-flags.txt"
          ./build.sh print-sources | tr '\0' '\n' > "$product/sources.txt"
          status=0
          ./build.sh --config Release --jobs 4 2>&1 | tee "$product/build.log" || status=$?
          printf 'build_exit\t%s\n' "$status" >> "$product/identity.tsv"
          test "$status" -eq 0
          compiler="$(./build.sh print-output --config Release)"
          test -x "$compiler"
          install -m 755 "$compiler" "$product/compiler"
          file "$product/compiler" > "$product/file.txt"
          readelf -l "$product/compiler" > "$product/program-headers.txt"
          cd "$product"
          sha256sum compiler > SHA256SUMS

      - name: Preserve the candidate product, identity and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tier1-corridor-2553-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tier1-corridor-candidate-product
          if-no-files-found: warn
          retention-days: 7
