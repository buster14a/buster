name: 9700X test

# This public repository must not execute unreviewed fork code on the host.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

# Repository-local serialization. The runner's job hooks also take the host's benchmark lock, which other
# repositories' jobs and interactive benchmark sessions share (see AGENTS.md).
concurrency:
  group: buster-fast-9700x
  cancel-in-progress: false

jobs:
  test:
    name: Build and execute on Ryzen 7 9700X
    if: github.repository_id == '1421805693'
    runs-on:
      group: buster-9700x-service-dispatch
      labels: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify host and bootstrap compiler
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          grep -m1 '^model name[[:space:]]*:' /proc/cpuinfo
          grep -Eq '^model name[[:space:]]*:[[:space:]]*AMD Ryzen 7 9700X([[:space:]]|$)' /proc/cpuinfo
          clang --version

      - name: Check out triggering commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build only the compiler executable
        run: |
          ./build.sh
          test -x build/compiler
          test "$(find build -type f -executable | wc -l)" -eq 1

      - name: Execute compiler
        run: ./build/compiler

      - name: Check the no-recursion rule on the call graph
        # Writes the translation units' LLVM IR to a temporary directory and fails on any cycle not in the allowlist.
        run: |
          ./build/compiler test-call-graph
          ./build.sh check-call-graph

      - name: Test the C lexer
        run: |
          ./build/compiler test-lexer
          ./build/compiler test-lexer --cplusplus

      - name: Benchmark the C lexer on the repository sources
        run: |
          # Pin to one permitted CPU to avoid migration noise in throughput measurements.
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-lexer src

      - name: Test the x86-64 encoder
        run: ./build/compiler test-x86-encoder

      - name: Benchmark the x86-64 encoder
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-x86-encoder

      - name: Test branch sizing
        # --cross-check also prints generated functions as GNU as source with a label at every target, and GNU as's
        # relaxation of them must give the bytes of the sized records.
        run: ./build/compiler test-branch-sizing --cross-check

      - name: Benchmark branch sizing
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-branch-sizing

      - name: Test the lanes
        run: ./build/compiler test-lanes

      - name: Benchmark the lanes
        # It pins each lane to an allowed CPU of its own.
        run: ./build/compiler benchmark-lanes

      - name: Test the link representation
        run: ./build/compiler test-link

      - name: Test dataflow bitsets
        run: ./build/compiler test-dataflow

      - name: Benchmark dataflow bitsets
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-dataflow

      - name: Test the independent preprocessor fuzz harness
        run: |
          ./build/compiler test-preprocessor-fuzz --std c17
          ./build/compiler test-preprocessor-fuzz --std c23

      - name: Benchmark the preprocessor fuzz harness
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-preprocessor-fuzz

      - name: Test the object writer
        # --cross-check also lists every object with readelf and llvm-readobj, compares it with GNU as's object of the
        # same unit, and links the test programs with GNU ld, lld, mold and wild (through cc for those that call libc)
        # and runs them.
        run: ./build/compiler test-object-writer --cross-check

      - name: Benchmark the object writer
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-object-writer

      - name: Test the import path
        # --cross-check also compares libc.so.6's exports and references, and the relocations of the crt objects and
        # libc_nonshared.a's members, with readelf's.
        run: ./build/compiler test-import --cross-check

      - name: Benchmark the import path
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-import

      - name: Test binding
        # --cross-check also links the bound programs with ld.lld and ld.bfd and runs them, and compares what binding
        # found with lld's link of the programs' own objects.
        run: ./build/compiler test-bind --cross-check

      - name: Benchmark binding
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-bind

      - name: Test the direct path's executables
        run: ./build/compiler test-executable

      - name: Test the dynamic PIEs
        # --cross-check also links each bound program's objects with ld.lld as a PIE and compares the two files' dynamic
        # symbols and relocations.
        run: ./build/compiler test-dynamic --cross-check

      - name: Test the static executables with libc
        # Each program bound against the system's static runtime and written as a static executable by 1, 2, 3 and 8
        # lanes and by the writer's exact twins must be the same file, run as cc -static's link of the same object does,
        # and with --cross-check as lld's does, with as many IRELATIVE relocations and the same TLS segment's alignment
        # and init and fini arrays' sizes.
        run: ./build/compiler test-static --cross-check

      - name: Benchmark the direct path's executables
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-executable

      - name: Test the runtime snapshot
        run: ./build/compiler test-snapshot

      - name: Benchmark the runtime snapshot
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-snapshot

      - name: Benchmark the whole link against GNU ld, lld, mold and wild
        # Without taskset: it pins its own lane and the linkers' runs on one thread, and the linkers' other runs need
        # every CPU.
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          ./build/compiler benchmark-link --cpus "$cpu"

      - name: Benchmark the floors
        # Without taskset too: it pins itself, and its writes from several threads take the first CPUs it may use.
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          ./build/compiler benchmark-floors --cpu "$cpu"

      - name: Test token refinement
        run: ./build/compiler test-refinement src

      - name: Benchmark token refinement on the repository sources
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-refinement src

      - name: Test the preprocessor
        # --clang also preprocesses each case, and the repository's own translation units (with clang's predefines for
        # their options), with clang -E and compares the tokens.
        run: |
          ./build/compiler test-preprocessor --clang
          ./build/compiler test-preprocessor --clang -march=native -Isrc -fwrapv -funsigned-char src/buster/compiler/main.c src/buster/compiler/*_benchmark.c

      - name: Benchmark the preprocessor on main.c
        # Target options don't change the preprocessor's own predefines yet: it reads clang's for them.
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          clang -dM -E -march=native -fwrapv -funsigned-char -x c /dev/null > build/predefines.h
          taskset -c "$cpu" ./build/compiler benchmark-preprocessor --clang -march=native -Isrc -fwrapv -funsigned-char --predefines build/predefines.h src/buster/compiler/main.c

      - name: Test the C type table
        # Also checks every size, alignment, member offset, bit-field, conversion, composite type and spelling of a
        # random world of types against clang's: clang -fsyntax-only on _Static_asserts, the same file compiled and
        # run, and clang's AST dump.
        run: ./build/compiler test-types

      - name: Benchmark the C type table
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-types
