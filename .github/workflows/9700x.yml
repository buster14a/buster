name: 9700X test

# This public repository must not execute unreviewed fork code on the host.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
  # Every pull request runs the workflow, since its job is a required check: a pull request that changes only
  # documentation gets the job skipped by `changes`, which counts as passed, rather than no check at all, which blocks
  # the merge.
  pull_request:

permissions:
  contents: read

# Keep each PR/ref's pending runs separate: older branches using a single repository-wide pending slot otherwise
# cancel another PR's qualification. Each group keeps one pending run, GitHub's default: a newer push replaces its
# pending run, which would only qualify a commit already superseded. A newer push to a PR also cancels the PR's run in
# progress, which is mostly a job waiting for the 9700X (the slot is held from then on, so a run waiting hours would
# otherwise still run for its stale commit); a push to main lets main's run finish. The runner's job hooks serialize all
# jobs with the shared host lock (AGENTS.md).
concurrency:
  group: buster-fast-9700x-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request changes anything but documentation (`docs/**` and `*.md`, as `push`'s paths-ignore), on a
  # GitHub-hosted runner so that it doesn't wait for the 9700X. When this job fails, `test` runs. And whether it changes
  # the harnesses of the baselines, the linkers' times and the floors (link_benchmark.c and floors_benchmark.c): they
  # measure other programs and the machine, the same for every pull request, so `test` measures them on pushes to main,
  # dispatched runs and pull requests that change these harnesses, as when this job is skipped or fails. The same for
  # benchmark-foreign's mold and wild (foreign_benchmark.c's `--linkers`), apart, since its harness changes with the
  # foreign path's phases.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      baselines: ${{ steps.files.outputs.baselines }}
      foreign: ${{ steps.files.outputs.foreign }}
      branch_sizing: ${{ steps.files.outputs.branch_sizing }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          COUNT: ${{ github.event.pull_request.changed_files }}
        shell: bash
        run: |
          set -euo pipefail
          # The API lists at most 3,000 files of a pull request: past that, take it as changing code and the harnesses.
          if [ "$COUNT" -ge 3000 ]; then
              code=true
              baselines=true
              foreign=true
              branch_sizing=true
          else
              gh api --paginate "repos/$REPOSITORY/pulls/$NUMBER/files" \
                  --jq '.[] | .filename, (.previous_filename // empty)' > files
              test "$(sort -u files | wc -l)" -ge 1
              if grep -Ev '^docs/|\.md$' files > /dev/null; then
                  code=true
              else
                  code=false
              fi
              if grep -Ex 'src/buster/compiler/(link|floors)_benchmark\.c' files > /dev/null; then
                  baselines=true
              else
                  baselines=false
              fi
              if grep -Ex 'src/buster/compiler/foreign_benchmark\.c' files > /dev/null; then
                  foreign=true
              else
                  foreign=false
              fi
              if grep -Ex 'src/buster/compiler/(x86_64_encoder|branch_sizing(_benchmark|_generate)?)\.c|docs/measurements/x86-lengths-2026-10-23/(benchmark-main|scaling)\.c' files > /dev/null; then
                  branch_sizing=true
                  # These retained C fixtures execute in qualification even though they live under docs/.
                  code=true
              else
                  branch_sizing=false
              fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "baselines=$baselines" >> "$GITHUB_OUTPUT"
          echo "foreign=$foreign" >> "$GITHUB_OUTPUT"
          echo "branch_sizing=$branch_sizing" >> "$GITHUB_OUTPUT"
          echo "Changes code: $code"
          echo "Changes the baselines' harnesses: $baselines"
          echo "Changes the foreign inputs' benchmark: $foreign"
          echo "Changes the branch-sizing implementation or measurement fixtures: $branch_sizing"

  test:
    name: Build and execute on Ryzen 7 9700X
    needs: changes
    # Runs after `changes` unless it found documentation alone; also when `changes` was skipped (not a pull request)
    # or failed.
    if: ${{ !cancelled() && github.repository_id == '1421805693' && needs.changes.outputs.code != 'false' }}
    runs-on:
      group: buster-9700x-service-dispatch
      labels: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify host and bootstrap compiler
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          grep -m1 '^model name[[:space:]]*:' /proc/cpuinfo
          grep -Eq '^model name[[:space:]]*:[[:space:]]*AMD Ryzen 7 9700X([[:space:]]|$)' /proc/cpuinfo
          clang --version

      - name: Check out triggering commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build only the compiler executable
        run: |
          ./build.sh
          test -x build/compiler
          test "$(find build -type f -executable | wc -l)" -eq 1

      - name: Qualify the draft refinement budget candidates
        # Temporary #116 experiment. The normal runner hooks hold the host lock for this whole CI job.
        # Remove this branch-only step before merging the selected implementation.
        if: github.head_ref == 'codex/116-refinement-budget'
        timeout-minutes: 6
        run: |
          set -euo pipefail
          evidence=docs/measurements/refinement-budget-2026-10-23
          inputs=/var/lib/buster-9700x/refine116-inputs.Ad1OBe
          mkdir -p build/refine116
          cat <<CHECKSUMS | sha256sum -c -
          b1dd5d74ec7f29055a6684fa06fb3c2f6821c87dd38f9a458dfd2e8a1db28189  $inputs/sqlite-3.53.4.c
          0a409f1633283fa31a9126b11fbfd64a1991c5d30defad07e5745d4667f5e23d  $inputs/sqlite-3.53.2.c
          d9bcc9e2c979d19eea5ed611e8fa971a2af357494c9526fd27d125751e3d9f95  src/buster/compiler/c_refine.c
          CHECKSUMS
          git rev-parse HEAD
          date -u
          uname -srvmo
          cat /sys/devices/system/cpu/cpu2/cpufreq/scaling_governor /sys/devices/system/cpu/cpu10/online
          executables=()
          for variant in base ahead2 prefetchloop1 prefetchloop2 block2k block4k block8k loop2block2k prefix28; do
              overlay="build/refine116/$variant"
              mkdir -p "$overlay/buster/compiler"
              cp src/buster/compiler/c_refine.c "$overlay/buster/compiler/c_refine.c"
              cp src/buster/compiler/c_intern.c "$overlay/buster/compiler/c_intern.c"
              if [ "$variant" = base ]; then
                  patch --fuzz=0 "$overlay/buster/compiler/c_intern.c" "$evidence/candidates/before-intern.patch"
              else
                  patch --fuzz=0 "$overlay/buster/compiler/c_refine.c" "$evidence/candidates/$variant.patch"
              fi
              if [ "$variant" = prefix28 ]; then
                  patch --fuzz=0 "$overlay/buster/compiler/c_intern.c" "$evidence/candidates/prefix28-intern.patch"
                  cp src/buster/compiler/c_refine_test.c "$overlay/buster/compiler/c_refine_test.c"
                  patch --fuzz=0 "$overlay/buster/compiler/c_refine_test.c" "$evidence/candidates/prefix28-test.patch"
              fi
              sha256sum "$overlay/buster/compiler/c_refine.c" "$overlay/buster/compiler/c_intern.c"
              clang -O3 -g -march=native -I"$overlay" -Isrc -fwrapv -funsigned-char -fno-strict-aliasing -Wall -Werror \
                  "$evidence/preprocessor-main.c" -o "build/refine116/pp-$variant"
              clang -O3 -g -march=native -I"$overlay" -Isrc -fwrapv -funsigned-char -fno-strict-aliasing -Wall -Werror \
                  "$evidence/refinement-main.c" -o "build/refine116/kernel-$variant"
              # The old hash has a known seed-116/fixed-fold failure, recorded in hash-regression.md.
              # It is a timing control, not a passing candidate. The first screen checked its semantics with seed 42.
              if [ "$variant" != base ]; then
                  clang -O3 -g -march=native -I"$overlay" -Isrc -fwrapv -funsigned-char -fno-strict-aliasing -Wall -Werror \
                      "$evidence/refinement-test-main.c" -o "build/refine116/test-$variant"
                  taskset -c 2 "build/refine116/test-$variant" --count 2000 --seed 116 src "$inputs/sqlite-3.53.4.c"
              fi
              executables+=("build/refine116/pp-$variant")
              if [ "$variant" = base ] || [ "$variant" = ahead2 ] || [ "$variant" = prefix28 ]; then
                  clang -O3 -g -march=native -I"$overlay" -Isrc -fwrapv -funsigned-char -fno-strict-aliasing -Wall -Werror \
                      "$evidence/setup-main.c" -o "build/refine116/setup-$variant"
              fi
          done
          clang -O3 -g -march=native -Ibuild/refine116/prefix28 -Isrc -fwrapv -funsigned-char -fno-strict-aliasing -Wall -Werror \
              "$evidence/files-test-main.c" -o build/refine116/files-prefix28
          taskset -c 2 build/refine116/files-prefix28 --seed 116 --id-order 19
          sha256sum build/refine116/pp-*
          ./build/compiler ab --rounds 3 --cpu 2 "${executables[@]}" \
              -- --only vectorized "$inputs/sqlite-3.53.4.c" \
              -- --only vectorized "$inputs/sqlite-3.53.2.c" \
              -- --only vectorized -march=native -Isrc -fwrapv -funsigned-char src/buster/compiler/main.c \
              | tee build/refine116/screen.txt
          ./build/compiler ab --rounds 3 --cpu 2 build/refine116/kernel-{base,ahead2,prefetchloop1,prefetchloop2,block2k,block4k,block8k,loop2block2k,prefix28} \
              -- --only refine_tokens_64 "$inputs/sqlite-3.53.4.c" \
              -- --only refine_tokens_64 --after-scalar 100 "$inputs/sqlite-3.53.4.c" \
              | tee build/refine116/kernels.txt
          ./build/compiler ab --rounds 3 --cpu 2 build/refine116/setup-{base,ahead2,prefix28} \
              -- "$inputs/sqlite-3.53.4.c" -- "$inputs/sqlite-3.53.2.c" | tee build/refine116/setup.txt
          for variant in ahead2 prefetchloop2 prefix28; do
              echo "Profile: $variant"
              perf record -q -e cycles:u -c 20000 -o "build/refine116/$variant.perf" -- \
                  taskset -c 2 "build/refine116/pp-$variant" --only vectorized "$inputs/sqlite-3.53.4.c"
              perf report --stdio --no-children --sort symbol --percent-limit 1 -i "build/refine116/$variant.perf"
              perf annotate --stdio --stdio-color never -s refine_pass_b_64_plain -i "build/refine116/$variant.perf" || true
          done

      - name: Write clang's predefines for the compiler's flags
        # For the steps that preprocess the compiler's own translation units: --predefines supplies the macro effects of
        # flags such as -funsigned-char.
        run: clang -dM -E -march=native -fwrapv -funsigned-char -x c /dev/null > build/predefines.h

      - name: Execute compiler
        # The driver, on the compiler's own main.c: preprocessed with clang's predefines for its options, and parsed.
        run: ./build/compiler -fsyntax-only -march=native -Isrc -fwrapv -funsigned-char --predefines build/predefines.h src/buster/compiler/main.c

      - name: Run the tests at once
        # Tests don't need the machine to themselves, unlike the benchmarks after them, which run one at a time and
        # pinned. build/compiler parallel (AGENTS.md, "The parallel runner") runs each test below in a bash of its own,
        # as a step's `run` runs, one per core of the CPUs the job may use and unpinned (test-lanes and test-files run
        # lanes of their own), and prints each test's output in a group of its own in this order, then names the tests
        # that failed. A test still running after 180 s is killed and fails. The longest come first, so that they
        # start first.
        run: |
          ./build/compiler parallel --github --timeout 180 <<'TESTS'
          == Test the calling convention
          # --cross-check also links random signatures between our side, encoded and written as objects, and C that
          # clang and GCC compile, at 16-, 32- and 64-byte vectors, and checks every argument, result and va_arg both
          # ways.
          ./build/compiler test-calling-convention --cross-check
          == Test the object writer
          # --cross-check also lists every object with readelf and llvm-readobj, compares it with GNU as's object of the
          # same unit, and links the test programs with GNU ld, lld, mold and wild (through cc for those that call libc)
          # and runs them.
          ./build/compiler test-object-writer --cross-check
          == Test DWARF source lines and late address finalization
          # The original fixture's debug sections are consumed by readelf, gdb and perf; GNU as supplies its CFI.
          ./build/compiler test-debug --cross-check
          == Test the preprocessor on the repository's translation units against clang
          # --clang also preprocesses each unit with clang -E, with clang's predefines for its options, and compares the
          # tokens. -target and its triple (clang's default) go to both.
          ./build/compiler test-preprocessor --clang -target x86_64-pc-linux-gnu -march=native -Isrc -fwrapv -funsigned-char src/buster/compiler/main.c src/buster/compiler/*_benchmark.c
          == Test the parser on the repository's translation units against clang
          # Both paths, which must agree kernel by kernel, and accept each unit build.sh compiles as clang -fsyntax-only
          # does, but main_unit_*.c, which are main.c again with another BUSTER_UNIT.
          ./build/compiler test-parser --clang -march=native -Isrc -fwrapv -funsigned-char --predefines build/predefines.h $(sed -n 's/^sources=(\(.*\))$/\1/p' build.sh | tr ' ' '\n' | grep -v main_unit_)
          == Test the parser's snippets against clang
          # The snippets, each also checked against clang, the generated inputs and the driver's checks.
          ./build/compiler test-parser --clang
          == Test GNU syntax metadata against clang
          ./build/compiler test-gnu --clang
          == Test scoped name-resolution kernels
          ./build/compiler test-bindings
          == Test C-source binding identities and scope semantics
          ./build/compiler test-parser-bindings --clang
          == Compare source binding columns on main.c
          ./build/compiler test-parser-bindings --clang -march=native -Isrc -fwrapv -funsigned-char --predefines build/predefines.h src/buster/compiler/main.c
          == Compare source binding columns on the frozen SQLite input
          corpus=/var/lib/buster-9700x/corpora/preprocessor-391e729af658
          ./build/compiler test-parser-bindings --clang -march=znver5 -nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include" "$corpus/sqlite/sqlite3.c"
          == Test the static executables with libc
          # Each program bound against the system's static runtime and written as a static executable by 1, 2, 3 and 8
          # lanes and by the writer's exact twins must be the same file, run as cc -static's link of the same object
          # does, and with --cross-check as lld's does, with as many IRELATIVE relocations and the same TLS segment's
          # alignment and init and fini arrays' sizes.
          ./build/compiler test-static --cross-check
          == Test the foreign inputs
          # Generated programs' objects split into archives and compiled C and C++ cases, resolved by both paths on 1,
          # 2, 3 and 8 lanes; --cross-check also links each with GNU ld and lld and compares the members they load, the
          # winners, the COMDAT groups and -y's lines with the resolution's.
          ./build/compiler test-foreign --cross-check
          == Test branch sizing
          # --cross-check also prints generated functions as GNU as source with a label at every target, and GNU as's
          # relaxation of them must give the bytes of the sized records.
          ./build/compiler test-branch-sizing --cross-check
          == Check the no-recursion rule on the call graph
          # Writes the translation units' LLVM IR to a temporary directory and fails on any cycle not in the allowlist.
          ./build/compiler test-call-graph
          ./build.sh check-call-graph
          == Test the runner
          ./build/compiler test-parallel
          == Test the preprocessor's cases against clang
          # --clang also preprocesses each case with clang -E and compares the tokens.
          ./build/compiler test-preprocessor --clang
          == Test the preprocessor directive tables
          ./build/compiler test-preprocessor --tables src
          == Test the C lexer as C++
          ./build/compiler test-lexer --cplusplus
          ./build/compiler test-lexer --raw-strings
          ./build/compiler test-lexer --raw-strings-c99
          == Test the C lexer
          ./build/compiler test-lexer
          == Test the C lexer without digraphs and // comments, as c89
          ./build/compiler test-lexer --no-digraphs --no-line-comments
          == Test the C lexer without // comments, as C94
          ./build/compiler test-lexer --no-line-comments
          == Test the C lexer without digraphs, as -fno-digraphs
          ./build/compiler test-lexer --no-digraphs
          == Test the x86-64 encoder
          ./build/compiler test-x86-encoder
          == Test the per-file jobs on the repository's translation units
          # The predefines follow the options as clang's do (c_predefines.c).
          ./build/compiler test-files -target x86_64-pc-linux-gnu -march=native -Isrc -fwrapv -funsigned-char src/buster/compiler/main.c src/buster/compiler/*_benchmark.c
          == Test the x86-64 disassembler against GNU tools
          corpus="$(mktemp -d)"
          trap 'rm -rf "$corpus"' EXIT
          clang -O3 -march=znver5 -c examples/disassembler/corpus.c -o "$corpus/corpus.o"
          objcopy -O binary -j .text "$corpus/corpus.o" "$corpus/corpus.text"
          ./build/compiler test-x86-disassembler --objdump --file "$corpus/corpus.text"
          == Test binding
          # --cross-check also links the bound programs with ld.lld and ld.bfd and runs them, and compares what binding
          # found with lld's link of the programs' own objects.
          ./build/compiler test-bind --cross-check
          == Test the independent preprocessor fuzz harness in C17
          ./build/compiler test-preprocessor-fuzz --std c17
          == Test the independent preprocessor fuzz harness in C23
          ./build/compiler test-preprocessor-fuzz --std c23
          == Test the dynamic PIEs
          # --cross-check also links each bound program's objects with ld.lld as a PIE and compares the two files'
          # dynamic symbols and relocations.
          ./build/compiler test-dynamic --cross-check
          == Test token refinement
          ./build/compiler test-refinement src
          == Compare a frozen preprocessor corpus subset with Clang
          # The runner hooks hold the shared host lock for this whole job. This copy is readable by the runner, unlike
          # the original bundle under /home/david. Verify the manifests and every input/header byte first.
          corpus=/var/lib/buster-9700x/corpora/preprocessor-391e729af658
          export SOURCE_DATE_EPOCH=1792454400
          printf '%s  %s\n' \
            939a882527432ec23b094c289e7f170bf2d6ec282e74dde75e31b08602fa3eae /usr/bin/clang \
            391e729af6587355050881752558e790299cfe638c7dc7803bd028a8535ebcbd "$corpus/MANIFESTS.sha256" \
            8e6e646951cbd08c07bbc76ff46d6796a83a58e9b1c4959278b60193718cd10c "$corpus/manifests/headers.sha256" \
            e307b836448ef20e603a617a4b5023831c72ff5f307f614c50f4f8833088717c "$corpus/manifests/headers-bundle.sha256" \
            9179b7ad7db7366d12a214b562e478ac703e7ec0376f38f4516756bcf7ee0047 "$corpus/manifests/sqlite.sha256" \
            bf593a94954f3ed9431dd12e60233ec0229f7226a1fc270a701614a20f86baeb "$corpus/manifests/libc.sha256" \
            89dbe35f0324cf08d0cb9cf31ecf15092fc20783a9e470e80e5f41b1d48251d3 "$corpus/manifests/musl-generated.sha256" | sha256sum --check --status
          (cd "$corpus/headers/usr" && sha256sum --check --status "$corpus/manifests/headers.sha256")
          (cd "$corpus/headers" && sha256sum --check --status "$corpus/manifests/headers-bundle.sha256")
          (cd "$corpus/sqlite" && sha256sum --check --status "$corpus/manifests/sqlite.sha256")
          (cd "$corpus/libc" && sha256sum --check --status "$corpus/manifests/libc.sha256")
          (cd "$corpus/musl-generated" && sha256sum --check --status "$corpus/manifests/musl-generated.sha256")
          for entry in headers:headers-bundle libc:libc sqlite:sqlite musl-generated:musl-generated; do
            root="$corpus/${entry%:*}"
            manifest="$corpus/manifests/${entry#*:}.sha256"
            test "$(find "$root" -type f -printf '.\n' | wc -l)" -eq "$(wc -l < "$manifest")"
            test -z "$(find "$root" ! -type d ! -type f -print -quit)"
          done
          system=(-nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include")
          musl="$corpus/libc/musl"
          ./build/compiler test-preprocessor --compare-clang --clang /usr/bin/clang -march=znver5 "${system[@]}" "$corpus/sqlite/sqlite3.c" --report build/oracle-sqlite.tsv
          awk -F '\t' 'NR > 1 { counts[$1]++ } END { exit !(counts["identical"] == 1 && NR == 2) }' build/oracle-sqlite.tsv
          ./build/compiler test-preprocessor --compare-clang --clang /usr/bin/clang -march=znver5 "${system[@]}" --files-from tests/preprocessor-oracle/libc-subset.txt --root "$corpus/libc" --report build/oracle-libc.tsv
          awk -F '\t' 'NR > 1 { counts[$1]++ } END { exit !(counts["identical"] == 5 && counts["skipped"] == 2 && NR == 8) }' build/oracle-libc.tsv
          ./build/compiler test-preprocessor --compare-clang --clang /usr/bin/clang -march=znver5 -std=c99 -ffreestanding -nostdinc -D_XOPEN_SOURCE=700 -Os -pipe \
            -I "$musl/arch/x86_64" -I "$musl/arch/generic" -I "$corpus/musl-generated/obj/src/internal" -I "$musl/src/include" -I "$musl/src/internal" -I "$corpus/musl-generated/obj/include" -I "$musl/include" \
            --files-from tests/preprocessor-oracle/musl-subset.txt --root "$musl" --report build/oracle-musl.tsv
          awk -F '\t' 'NR > 1 { counts[$1]++ } END { exit !(counts["identical"] == 4 && NR == 5) }' build/oracle-musl.tsv
          == Test the import path
          # --cross-check also compares libc.so.6's exports and references, and the relocations of the crt objects and
          # libc_nonshared.a's members, with readelf's.
          ./build/compiler test-import --cross-check
          == Test the runtime snapshot
          ./build/compiler test-snapshot
          == Test the scalar and AVX-512 assembly frontends
          ./build/compiler test-assembler --cross-check
          == Test generated-code ISA policy
          ./build/compiler test-x86-target
          == Test the C type table
          # Also checks every size, alignment, member offset, bit-field, conversion, composite type and spelling of a
          # random world of types against clang's: clang -fsyntax-only on _Static_asserts, the same file compiled and
          # run, and clang's AST dump.
          ./build/compiler test-types
          == Test the per-file jobs
          # The cache filled on 1, 2, 3 and 8 lanes must give the same tables, records and translation units' streams,
          # -E text and diagnostics, and each unit the spellings it gives alone; and again with the shared table's ids
          # in another order (#153's --id-order, 153 by default), the same records, -E text, diagnostics and
          # locations, each id spelled the same. Its forms with paths (the translation units, src flat) do the same.
          ./build/compiler test-files
          == Test the x86 semantics
          # The effects table is checked by executing every covered form; --cross-check also assembles the chosen forms
          # with GNU as and compares the bytes.
          ./build/compiler test-x86-semantics --cross-check
          == Test Tier 0
          # Generated programs compiled by both paths, which must agree, run against an interpreter of the typed stream;
          # --cross-check also runs them beside clang -O0's builds of the same programs as C.
          ./build/compiler test-tier0 --cross-check
          == Test differential harness accounting, subprocesses and failure preservation
          ./build/compiler test-differential-harness
          == Test Tier 1 allocation, reload splitting and rematerialization
          ./build/compiler test-tier1-allocation
          == Test Tier 1 frame planning and slot coloring
          ./build/compiler test-tier1-frame
          ./build/compiler test-tier1-frame-execution
          == Test experimental Tier 1 scheduling and model coverage
          ./build/compiler test-tier1-schedule
          # This bounded smoke also executes original and reordered machine code against its independent reference.
          ./build/compiler benchmark-tier1-schedule --blocks 4 --records 64
          == Test the lanes
          ./build/compiler test-lanes
          == Test the direct path's executables
          ./build/compiler test-executable
          == Test the profiling tools
          ./build/compiler test-profile
          == Test deterministic diagnostic ordering
          ./build/compiler test-diagnostics
          == Test the corpus oracle's accounting and process failures
          ./build/compiler test-preprocessor --compare-clang --clang /usr/bin/clang -nostdinc --files-from tests/preprocessor-oracle/inputs.txt --root tests/preprocessor-oracle --report build/oracle-accounting.tsv
          awk -F '\t' 'NR > 1 { counts[$1]++ } END { exit !(counts["identical"] == 1 && counts["skipped"] == 1 && NR == 3) }' build/oracle-accounting.tsv
          # Another vendor by -target and its triple, which both sides must get: accepted.input's other branch.
          ./build/compiler test-preprocessor --compare-clang --clang /usr/bin/clang -nostdinc -target x86_64-pc-linux-gnu tests/preprocessor-oracle/accepted.input
          if ./build/compiler test-preprocessor --compare-clang --clang /no-such-buster-clang tests/preprocessor-oracle/accepted.input; then exit 1; fi
          if ./build/compiler test-preprocessor --compare-clang --clang /usr/bin/false tests/preprocessor-oracle/accepted.input; then exit 1; fi
          if ./build/compiler test-preprocessor --compare-clang tests/preprocessor-oracle/rejected.input; then exit 1; fi
          if ./build/compiler test-preprocessor --compare-clang tests/preprocessor-oracle/no-such-input.c; then exit 1; fi
          == Test integer builtin actions against Clang
          ./build/compiler test-builtins
          == Test typed postorder checking and source fixtures
          ./build/compiler test-checker --seed 133
          == Test the per-file jobs on the repository's sources, flat
          ./build/compiler test-files --flat src
          == Test the link representation
          ./build/compiler test-link
          == Test dataflow bitsets
          ./build/compiler test-dataflow
          == Test dominators, frontiers and natural loops
          ./build/compiler test-dominators
          == Test the partial Zen 5 model and instruction harness
          ./build/compiler test-x86-zen5
          TESTS

      - name: Benchmark the C lexer on the repository sources
        run: |
          # Pin to one permitted CPU to avoid migration noise in throughput measurements.
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-lexer src

      - name: Measure the Zen 5 instruction cases
        # The job hook holds the shared lock. Preserve three separate processes, with each process interleaving
        # its experiments. These observations are informational; counter/protocol failures still fail the step.
        run: |
          cpu=2
          sha256sum build/compiler src/buster/compiler/x86_zen5.c src/buster/compiler/x86_zen5_measure.c
          for sample in 1 2 3; do
            echo "Zen 5 observation process $sample"
            taskset -c "$cpu" ./build/compiler measure-x86-zen5 --passes 11 --iterations 20000
          done

      - name: Benchmark Zen 5 cost lookup
        run: |
          cpu=2
          for sample in 1 2 3; do
            echo "Zen 5 lookup sample $sample"
            taskset -c "$cpu" ./build/compiler benchmark-x86-zen5
            taskset -c "$cpu" ./build/compiler benchmark-x86-zen5 --only vector
            taskset -c "$cpu" ./build/compiler benchmark-x86-zen5 --only vector --after-scalar 200
          done

      - name: Benchmark x86-64 disassembly
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-x86-disassembler

      - name: Benchmark the x86-64 encoder
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-x86-encoder

      - name: Benchmark assembly phases
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-assembler

      - name: Benchmark branch sizing
        timeout-minutes: 3
        env:
          AB_ENABLED: ${{ github.event_name == 'pull_request' && needs.changes.outputs.branch_sizing != 'false' }}
          AB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-branch-sizing

          if [[ "$AB_ENABLED" == true ]]; then
              [[ "$AB_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              ab_dir="$(mktemp -d "${RUNNER_TEMP}/branch-sizing-ab.XXXXXX")"
              trap 'rm -rf "$ab_dir"' EXIT
              fixture=docs/measurements/x86-lengths-2026-10-23

              # The normal job lock covers this bounded qualification. Use one allowed logical CPU per physical
              # core for scaling, and record the mapping rather than inferring SMT placement from CPU numbers.
              allowed="$(awk '/^Cpus_allowed_list:/ { print $2 }' /proc/self/status)"
              lscpu -e=CPU,SOCKET,CORE,ONLINE
              core_cpus="$(lscpu -p=CPU,CORE,SOCKET,ONLINE | awk -F, -v allowed="$allowed" '
                  BEGIN {
                      n = split(allowed, ranges, ",")
                      for (r = 1; r <= n; r++) {
                          m = split(ranges[r], ends, "-")
                          last = m == 2 ? ends[2] : ends[1]
                          for (c = ends[1]; c <= last; c++) permitted[c] = 1
                      }
                  }
                  $0 !~ /^#/ && $4 == "Y" && permitted[$1] && !seen[$3 ":" $2]++ { print $1 }
              ' | paste -sd, -)"
              test "$(tr ',' '\n' <<< "$core_cpus" | wc -l)" -ge 8
              case ",$core_cpus," in
                  *,2,*) cpu=2 ;;
              esac
              printf 'Allowed CPUs=%s; distinct-core CPUs=%s; module CPU=%s\n' "$allowed" "$core_cpus" "$cpu"

              # The shallow checkout may lack the base object. Fetch only the public base commit, without tokens;
              # read its source files, but do not execute its build scripts or change the checkout.
              if ! git cat-file -e "${AB_BASE_SHA}^{commit}" 2>/dev/null; then
                  GIT_TERMINAL_PROMPT=0 timeout 30s git -c credential.helper= -c http.extraHeader= fetch \
                      --no-tags --no-recurse-submodules --depth=1 https://github.com/buster14a/buster.git "$AB_BASE_SHA"
              fi
              printf 'Matched base=%s checkout=%s cpu=%s\n' "$AB_BASE_SHA" "$(git rev-parse HEAD)" "$cpu"
              clang --version
              for side in before after; do
                  mkdir -p "$ab_dir/$side/src/buster/compiler"
                  for file in lane.c x86_64_encoder.c branch_sizing.c; do
                      dest="$ab_dir/$side/src/buster/compiler/$file"
                      if [[ "$side" == before ]]; then
                          git show "${AB_BASE_SHA}:src/buster/compiler/$file" > "$dest"
                      else
                          cp "src/buster/compiler/$file" "$dest"
                      fi
                  done
                  # Both modules, including the scaling fixture's include, use the same harness and generator.
                  cp src/buster/compiler/branch_sizing_benchmark.c src/buster/compiler/branch_sizing_generate.c \
                      "$ab_dir/$side/src/buster/compiler/"
              done
              before="$ab_dir/before/src/buster/compiler"
              new='branch_sizing_lengths(records, count, offsets, vector)'
              old='branch_sizing_lengths(records, count, offsets, columns.encoded, vector)'
              test "$(grep -Fo "$new" "$before/branch_sizing_benchmark.c" | wc -l)" -eq 1
              if grep -Fq "$old" "$before/branch_sizing.c"; then
                  sed -i "s/$new/$old/" "$before/branch_sizing_benchmark.c"
                  test "$(grep -Fo "$old" "$before/branch_sizing_benchmark.c" | wc -l)" -eq 1
                  echo 'Baseline harness adaptation: old lengths scratch argument only'
              elif ! grep -Fq "$new" "$before/branch_sizing.c"; then
                  echo 'Unsupported baseline branch_sizing_lengths interface' >&2
                  exit 1
              fi

              # Same compiler and production options. Compile all four binaries before serialized timing.
              flags=(-O3 -g -march=native -fwrapv -funsigned-char -fno-strict-aliasing -Wall -Werror -pthread)
              printf 'Standalone flags: %s\n' "${flags[*]}"
              sha256sum "$fixture/benchmark-main.c" "$fixture/scaling.c"
              for side in before after; do
                  tree="$ab_dir/$side/src"
                  sha256sum "$tree"/buster/compiler/*.c
                  timeout 60s clang "${flags[@]}" -I "$tree" "$tree/buster/compiler/branch_sizing_benchmark.c" \
                      "$fixture/benchmark-main.c" -o "$ab_dir/$side-module"
                  timeout 60s clang "${flags[@]}" -I "$tree" "$fixture/scaling.c" -o "$ab_dir/$side-scaling"
              done
              sha256sum "$ab_dir"/*-module "$ab_dir"/*-scaling

              run_module()
              {
                  local side="$1" row="$2" measure="$3" pair="$4"
                  local log="$ab_dir/module-$row-$measure-$pair-$side.log"
                  printf '\nMatched module pair=%s side=%s row=%s measure=%s\n' "$pair" "$side" "$row" "$measure"
                  timeout 20s taskset -c "$cpu" "$ab_dir/$side-module" \
                      --seed 1 --only "$row" --measure "$measure" --samples 11 2>&1 | tee "$log"
                  test "$(grep -c "^$row: " "$log")" -eq 1
                  test "$(grep -c ' ns per record ' "$log")" -eq 1
                  grep "^$row: " "$log" > "$log.identity"
              }
              run_scaling()
              {
                  local side="$1" workers="$2" pair="$3"
                  local log="$ab_dir/scaling-$workers-$pair-$side.log"
                  printf '\nMatched scaling pair=%s side=%s workers=%s passes=200\n' "$pair" "$side" "$workers"
                  # The fixture pins workers within this distinct-physical-core mask, never a one-CPU taskset.
                  timeout 30s taskset -c "$core_cpus" "$ab_dir/$side-scaling" "$workers" 200 tier0-mix 2>&1 | tee "$log"
                  test "$(grep -c '^row=' "$log")" -eq 1
                  grep '^row=' "$log" | tr ' ' '\n' |
                      grep -E '^(row|workers|passes|seed|warmup|functions_per_worker|records_per_worker|encoded_bytes_per_worker|checksum|reference|coordinator_cpu|worker_cpus)=' \
                      > "$log.identity"
                  test "$(wc -l < "$log.identity")" -eq 12
              }
              for pair in 1 2 3; do
                  order=(before after)
                  if [[ "$pair" == 2 ]]; then
                      order=(after before)
                  fi
                  for row in tier0-40 tier0-mix tier0-2000; do
                      measures=(vector-lengths size_branches size_encode)
                      if [[ "$row" == tier0-mix ]]; then
                          measures+=(x86_encode)
                      fi
                      for measure in "${measures[@]}"; do
                          for side in "${order[@]}"; do
                              run_module "$side" "$row" "$measure" "$pair"
                          done
                          diff -u "$ab_dir/module-$row-$measure-$pair-before.log.identity" \
                              "$ab_dir/module-$row-$measure-$pair-after.log.identity"
                      done
                  done
                  for workers in 1 8; do
                      for side in "${order[@]}"; do
                          run_scaling "$side" "$workers" "$pair"
                      done
                      diff -u "$ab_dir/scaling-$workers-$pair-before.log.identity" "$ab_dir/scaling-$workers-$pair-after.log.identity"
                  done
              done
              echo 'Matched branch-sizing qualification completed: 3 pairs per case'
          fi

      - name: Benchmark the x86 semantics
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-x86-semantics

      - name: Benchmark the lanes
