name: Paired Benchpress loop benchmarks for PRs 3646 and 3633
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR to measure
        required: true
        type: choice
        options: ['3646', '3633']
permissions:
  contents: read
jobs:
  loops:
    if: github.repository_id == '1421805693'
    runs-on:
      group: buster-9700x-service-dispatch
      labels: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: znver5
      BUSTER_DEBUG_INFO: '0'
      BASE_SHA: 8e4d32879e17b7d9548cad54257a2f8461328366
      HEAD_SHA: ${{ inputs.pr == '3646' && '3bb1ff6b83667f6b26afc402605623c1191d3bd6' || 'e5826bec05a4be4b8e92e7ab903c05ce336bfa74' }}
      PASSES: ${{ inputs.pr == '3646' && '+vectorize' || '+vectorize,+unroll' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.HEAD_SHA }}
          path: candidate
          persist-credentials: false
      - name: Stage official toolchain and pinned 25-kernel workload
        run: |
          grep -Em1 '^model name[[:space:]]*:[[:space:]]*AMD Ryzen 7 9700X([[:space:]]|$)' /proc/cpuinfo
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$HEAD_SHA"
          bash tools/ci/setup-benchpress.sh
          export BUSTER_CI_CACHE="${XDG_CACHE_HOME:-$HOME/.cache}/buster/ci"
          bash tools/ci/fetch-performance.sh cc38ca9708f522fd26eacab3b5234dbfa71c131b docs/measurements/tier1-loop-vectorizer-2743-2026-11-14/src harness
      - name: Build both revisions and measure paired kernels
        run: |
          evidence="$RUNNER_TEMP/loop-evidence-$GITHUB_RUN_ID"
          mkdir -p "$evidence"
          printf '%s\n' "base=$BASE_SHA" "head=$HEAD_SHA" "passes=$PASSES" "workflow=$GITHUB_SHA" > "$evidence/identity.txt"
          clang --version >> "$evidence/identity.txt"
          for side in base candidate; do
              (cd "$side" && taskset -c 0-7 ./build.sh --config Release --jobs 8)
              sha256sum "$side/build/compiler" >> "$evidence/identity.txt"
          done
          src=harness/docs/measurements/tier1-loop-vectorizer-2743-2026-11-14/src
          sha256sum "$src"/{kernels.c,kernels.h,harness.c} >> "$evidence/identity.txt"
          clang -O2 -c "$src/harness.c" -o harness.o
          ref=reference
          printf '%s\n' 'march placement side kernel elements reps seconds ns_per_element digest cycles_per_element instructions_per_element' > "$evidence/kernels.txt"
          cat /proc/loadavg > "$evidence/load-before.txt"
          ps -eo psr,pcpu,pid,etimes,user,comm --sort=-pcpu | sed -n '1,10p' >> "$evidence/load-before.txt"
          for march in znver5 x86-64; do
              clang -O2 -ffp-contract=off -march="$march" -c "$src/kernels.c" -o ref.o
              clang harness.o ref.o -lm -o "$ref"
              for side in base candidate; do
                  "$side/build/compiler" --tier1 "--tier1-passes=$PASSES" --tier1-report -O2 -ffp-contract=off "-march=$march" -c "$src/kernels.c" -o "$side.o" 2> "$evidence/$march-$side-report.txt"
                  sha256sum "$side.o" >> "$evidence/identity.txt"
                  size "$side.o" >> "$evidence/$march-object-size.txt"
              done
              for pad in 0 16 32 48; do
                  printf '.text\n.p2align 4\n.skip %s, 0xcc\n.section .note.GNU-stack,"",@progbits\n' "$pad" > pad.S
                  clang -c pad.S -o pad.o
                  for side in base candidate; do
                      clang harness.o pad.o "$side.o" -lm -o "$side-program"
                  done
                  for kernel in $(./"$ref" list); do
                      read -r _ elements _ _ _ expected < <(taskset -c 2 ./"$ref" "$kernel" 1)
                      for side in base candidate; do
                          row=$(taskset -c 2 ./"$side-program" "$kernel" 0)
                          read -r _ _ reps _ _ digest <<< "$row"
                          test "$digest" = "$expected"
                          for count in 1 "$reps"; do
                              LC_ALL=C taskset -c 2 perf stat --no-big-num -x, -e cycles:u,instructions:u -o "$evidence/$march-$pad-$kernel-$side-$count.csv" -- ./"$side-program" "$kernel" "$count" > /dev/null
                          done
                          counters=$(awk -F, -v n="$(((reps - 1) * elements))" 'FNR == NR { if ($3 ~ /^(cycles|instructions):u$/) base[$3] = $1; next }
                              $3 ~ /^(cycles|instructions):u$/ && $1 ~ /^[0-9]+$/ && base[$3] ~ /^[0-9]+$/ {
                                  value[$3] = ($1 - base[$3]) / n
                              }
                              END {
                                  if (value["cycles:u"] <= 0 || value["instructions:u"] <= 0) exit 1
                                  printf "%.6f %.6f", value["cycles:u"], value["instructions:u"]
                              }' "$evidence/$march-$pad-$kernel-$side-1.csv" "$evidence/$march-$pad-$kernel-$side-$reps.csv")
                          printf '%s %s %s %s %s\n' "$march" "$pad" "$side" "$row" "$counters" >> "$evidence/kernels.txt"
                      done
                  done
              done
          done
          cat /proc/loadavg > "$evidence/load-after.txt"
          ps -eo psr,pcpu,pid,etimes,user,comm --sort=-pcpu | sed -n '1,10p' >> "$evidence/load-after.txt"
          cat "$evidence/kernels.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: loop-pairs-pr${{ inputs.pr }}
          path: ${{ runner.temp }}/loop-evidence-${{ github.run_id }}
