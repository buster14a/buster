name: Hosted linker evaluation (research branch only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up and record host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evaluation/tooling evaluation/results
          uname -a | tee evaluation/results/host.txt
          lscpu >> evaluation/results/host.txt
          cat /proc/meminfo | head -5 >> evaluation/results/host.txt
          clang --version | tee evaluation/results/clang.txt
          ld --version | head -1 | tee evaluation/results/system-linker.txt
          curl -fLsS 'https://github.com/rui314/mold/releases/download/v3.0.0/mold-3.0.0-x86_64-linux.tar.gz' -o evaluation/tooling/mold.tar.gz
          echo '6c90d4a474c7c0409dfb575be03a5345878ac14fdba18de8b40fa58c60121189  evaluation/tooling/mold.tar.gz' | sha256sum -c -
          tar xzf evaluation/tooling/mold.tar.gz -C evaluation/tooling
          curl -fLsS 'https://github.com/wild-linker/wild/releases/download/0.10.0/wild-linker-0.10.0-x86_64-unknown-linux-gnu.tar.gz' -o evaluation/tooling/wild.tar.gz
          echo '641265506a7c06cfb03181b8916ab663ec8407855db6d4db7f8450667d105283  evaluation/tooling/wild.tar.gz' | sha256sum -c -
          tar xzf evaluation/tooling/wild.tar.gz -C evaluation/tooling
          find evaluation/tooling -type f -executable
          
      - name: Compile frozen compiler objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evaluation/objects
          # Preserve exactly the objects of this frozen build for every candidate.
          sed 's@object_directory="$(mktemp -d)"@object_directory="$PWD/evaluation/objects"@; /temporary+=("$object_directory")/d' build.sh > evaluation/build-frozen.sh
          bash evaluation/build-frozen.sh
          find evaluation/objects -name '*.o' -print0 | sort -zV | xargs -0 sha256sum > evaluation/results/objects.sha256
          ls -l build/compiler | tee evaluation/results/compiler-size.txt
          build/compiler test-link
          
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linker-evaluation
          path: evaluation/results
