      - name: Check out the pinned Lua scripts of Tier 1's program measurement
        if: needs.changes.outputs.tier1_programs != 'false'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: buster14a/buster-performance
          ref: 818cfbbc0be238da287c16d8e2a91fd7275cf228 # Reviewed main, with the cc3387f record's five original scripts.
          path: build/tier1-programs-evidence
          sparse-checkout: docs/measurements/tier1-reciprocal-141-2026-11-01/9700x/lua
          persist-credentials: false

      - name: Time speedtest1 and Lua's scripts by both tiers, clang -O0 and -O2 and tcc
        # #138 and #1189: the programs Tier 1 is measured by against clang -O2, each built by this compiler's Tier 0 and
        # --tier1, clang -O0 and -O2 and tcc. Their outputs must agree (speedtest1's verification hash, each script's
        # output clang -O0's); then every build runs every program in each of 11 rounds, each round in a Williams design's order,
        # as whole processes on one CPU with their user cycles and instructions (docs/tier1.md has the results). Where
        # `changes` doesn't rule it out (Tier 1's pipeline and the measurement: `tier1_programs`), and on the daily and
        # dispatched runs. #1116 also gates all Tier 1 function bytes against matching clang -O0 bytes on sqlite3.c
        # and all 34 Lua sources (luac.c included), using paired objects rather than the linked executables' sizes.
        if: needs.changes.outputs.tier1_programs != 'false'
        timeout-minutes: 5
        run: |
          unset CPATH C_INCLUDE_PATH
          sqlite=/var/lib/buster-9700x/corpora/preprocessor-391e729af658/sqlite
          printf '%s  %s\n' 0a409f1633283fa31a9126b11fbfd64a1991c5d30defad07e5745d4667f5e23d "$sqlite/sqlite3.c" | sha256sum --check
          # SQLite 3.53.2's test/speedtest1.c (#136's) and Lua 5.4.8's release, by their hashes.
          inputs="$RUNNER_TEMP/tier1-programs"
          mkdir -p "$inputs"
          bash tools/ci/cached-download.sh \
            https://raw.githubusercontent.com/sqlite/sqlite/ccc132c5be20ab5c755c97a08d06b1b592fef330/test/speedtest1.c \
            b5eaf4bbcbb320fd8eb3f3e6c4cd5f51a64dd0cd70efe969634d1785e3419675 "$inputs/speedtest1.c"
          bash tools/ci/cached-download.sh https://www.lua.org/ftp/lua-5.4.8.tar.gz \
            4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae "$inputs/lua-5.4.8.tar.gz"
          tar -xzf "$inputs/lua-5.4.8.tar.gz" -C "$inputs"
          # tcc as measure-compile's step pins it.
          tcc="$(command -v tcc)"
          printf '%s  %s\n' 49e2d1afd09cdab6593ca127b056ccc35fc5f3a2d0e08dae67f604db2751c082 "$tcc" | sha256sum --check
          scripts="$PWD/build/tier1-programs-evidence/docs/measurements/tier1-reciprocal-141-2026-11-01/9700x/lua"
          clang --version | head -1
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler measure-tier1-programs --check-code-size --runs 11 --clang clang --tcc "$tcc" --sqlite "$sqlite" --speedtest "$inputs" --lua "$inputs/lua-5.4.8/src" --scripts "$scripts" --directory /tmp

      - name: Time vector code by both tiers and the base's Tier 1, with the moves around Tier 1's machine rows
        # #1283: test-checker-driver's machine rows' unit, a lexer's byte scan and the compiler's own lexer (on
        # c_lexer.c), each built by this compiler's Tier 0 and --tier1, clang -O2 and, on a pull request, its base's
        # --tier1, with each Tier 1 build's records, machine rows and moves around them. Their outputs must agree; then
        # every build runs every program in each of 11 rounds, each round in a Williams design's order, as whole processes on
        # one CPU with their user cycles and instructions (measure-tier1-rows). Where `changes` doesn't rule it out (Tier
        # 1's input and pipeline and the measurement: `tier1_programs`), and on the daily and dispatched runs.
        if: needs.changes.outputs.tier1_programs != 'false'
        timeout-minutes: 6
        env:
          AB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base=()
          if [ -n "$AB_BASE_SHA" ]; then
              [[ "$AB_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              ab="${BUSTER_BENCHMARK_BUILDS:?}"
              test "$(git -C "$ab/base" rev-parse HEAD)" = "$AB_BASE_SHA"
              test -x "$ab/base/build/compiler"
              # Reuse the same regular base executable that the early placement build also produces.
              base=(--base "$ab/base/build/compiler")
          fi
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler measure-tier1-rows --runs 11 --clang clang "${base[@]}" --march znver5 --lexer src/buster/compiler/c_lexer.c --directory /tmp

      - name: Time the direct forms against their helpers by both tiers
        # #1059's paired measurements: the primitives' kernels (reference counts, a spin lock, a sequence lock, flags, a
        # running maximum, inline asm) and speedtest1, each built by this compiler's Tier 0 and --tier1 as it lowers them
        # and with --helper-forms=all, which gives every operation of a direct form its helper's call. Every build's output
        # must be the first's; then each source's -c compile in each of 5 rounds and each program's run in each of 11, each
        # round in a Williams design's order, as whole processes on one CPU with their user cycles and instructions, beside each
        # object's helper calls, executable bytes and Tier 1's spill and call stores and loads
        # (docs/c-builtins-integration.md has the results). Where `changes` doesn't rule it out (the direct forms' and the
        # helpers' planning, and the measurement: `helpers`), and on the daily and dispatched runs.
        if: needs.changes.outputs.helpers != 'false'
        timeout-minutes: 5
        run: |
          unset CPATH C_INCLUDE_PATH
          sqlite=/var/lib/buster-9700x/corpora/preprocessor-391e729af658/sqlite
          printf '%s  %s\n' 0a409f1633283fa31a9126b11fbfd64a1991c5d30defad07e5745d4667f5e23d "$sqlite/sqlite3.c" | sha256sum --check
          # SQLite 3.53.2's test/speedtest1.c (#136's), by its hash, as measure-tier1-programs' step takes it.
          inputs="$RUNNER_TEMP/helpers-programs"
          mkdir -p "$inputs"
          curl --fail --location --retry 3 --output "$inputs/speedtest1.c" \
            https://raw.githubusercontent.com/sqlite/sqlite/ccc132c5be20ab5c755c97a08d06b1b592fef330/test/speedtest1.c
          printf '%s  %s\n' b5eaf4bbcbb320fd8eb3f3e6c4cd5f51a64dd0cd70efe969634d1785e3419675 "$inputs/speedtest1.c" | sha256sum --check
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler measure-helpers --runs 11 --compiles 5 --sqlite "$sqlite" --speedtest "$inputs" --directory /tmp

      - name: Benchmark the verified Tier 1 optimization passes
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',ir-optimize,') || contains(env.MEASURE, ',ir-optimize-passes,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-ir-optimize
          taskset -c "$cpu" ./build/compiler benchmark-ir-optimize-passes

      - name: Benchmark the verified Tier 1 optimization passes after scalar work
        # Where `changes` doesn't rule it out (the module's sources).
        if: needs.changes.outputs.ir_optimize != 'false'
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-ir-optimize --only vector --after-scalar 200
          taskset -c "$cpu" ./build/compiler benchmark-ir-optimize-passes --only vector --after-scalar 200

      - name: Remove the comparison build worktree
        if: ${{ always() && steps.compiler_builds.outputs.directory != '' }}
        env:
          BUILD_DIRECTORY: ${{ steps.compiler_builds.outputs.directory }}
        run: bash tools/ci/build-benchmarks.sh cleanup "$BUILD_DIRECTORY"

  policy:
    # The repository's policy checks, one job (#2334): every run of this workflow and every push used to start five small
    # jobs and a separate workflow for them, each taking a hosted runner and its setup, and at the hosted concurrency cap
    # each waited in the queue on its own. The job carries the name of the required context the separate Measurement
    # storage workflow had, so branch protection doesn't change; the 9700X context (`qualification`) needs it too. Each
    # check runs even when an earlier one failed, so that every failure reports. The tests wait for it on pull requests
    # alone, as they waited for the guide budget and the hook fixtures.
    name: Measurement storage policy
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The pull request's whole history, for the sign-off audit; the triggering commit alone elsewhere.
      - name: Check out triggering commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - name: Keep measurement evidence in buster-performance
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- docs/measurements > "$RUNNER_TEMP/measurement-paths"
          if test -s "$RUNNER_TEMP/measurement-paths"; then
              echo '::error::Store evidence in buster14a/buster-performance under docs/measurements/.'
              git ls-files -- docs/measurements
              exit 1
          fi

      # The guide budget, in the required contexts, so that no separate required check is needed.
      - name: Keep automatically loaded instructions bounded
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          check_size() {
              local path="$1" budget="$2" bytes
              if [[ ! -f "$path" || -L "$path" ]]; then
                  printf '%s must be a regular, non-symlink file.\n' "$path" >&2
                  return 1
              fi
              bytes=$(LC_ALL=C wc -c < "$path") || return 1
              if (( bytes == 0 || bytes > budget )); then
                  printf '%s: %s bytes; allowed range is 1..%s bytes. Move detail to docs/commands/.\n' "$path" "$bytes" "$budget" >&2
                  return 1
              fi
              printf '%s: %s / %s bytes\n' "$path" "$bytes" "$budget"
          }

          # Exercise the exact predicate used below, without expected-failure annotations.
          fixtures=$(mktemp -d "$RUNNER_TEMP/agent-guide-size.XXXXXX")
          trap 'rm -rf "$fixtures"' EXIT
          for bytes in 1 29999 30000; do
              truncate -s "$bytes" "$fixtures/guide"
              check_size "$fixtures/guide" 30000
          done
          for bytes in 0 30001; do
              truncate -s "$bytes" "$fixtures/guide"
              if check_size "$fixtures/guide" 30000 > /dev/null 2>&1; then
                  echo '::error::Agent-guide budget boundary self-test failed.'
                  exit 1
              fi
          done
          truncate -s 1024 "$fixtures/wrapper"
          check_size "$fixtures/wrapper" 1024
          truncate -s 1025 "$fixtures/wrapper"
          if check_size "$fixtures/wrapper" 1024 > /dev/null 2>&1; then
              echo '::error::Import-wrapper budget boundary self-test failed.'
              exit 1
          fi
          printf '\303\251%.0s' {1..15000} > "$fixtures/utf8"
          check_size "$fixtures/utf8" 30000
          printf '\303\251' >> "$fixtures/utf8"
          printf 'x' > "$fixtures/valid"
          ln -s valid "$fixtures/symlink"
          for path in "$fixtures/utf8" "$fixtures/missing" "$fixtures" "$fixtures/symlink"; do
              if check_size "$path" 30000 > /dev/null 2>&1; then
                  echo '::error::Agent-guide byte/file-kind self-test failed.'
                  exit 1
              fi
          done

          if ! check_size AGENTS.md 30000 || ! check_size CLAUDE.md 1024; then
              echo '::error::Keep shared rules and a compact index in AGENTS.md; move module and command detail to docs/commands/. Keep CLAUDE.md a small import wrapper.'
              exit 1
          fi
          if ! grep -qxF '@AGENTS.md' CLAUDE.md; then
              echo '::error::CLAUDE.md must import the shared AGENTS.md instructions.'
              exit 1
          fi

      # Informational: the pull request's own commits' sign-off trailers, pinned to its head, in the job summary
      # (tools/dco/dco.c audit, CONTRIBUTING.md's "Auditing sign-offs"). Missing trailers don't fail it; incomplete
      # history fails the step, which doesn't fail the job: no required check needs the audit.
      - name: Audit the head's commits that the base doesn't reach
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          cc -std=c17 -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/dco" tools/dco/dco.c
          status=0
          "$RUNNER_TEMP/dco" audit --base "$BASE" --head "$HEAD" > "$RUNNER_TEMP/audit" || status=$?
          cat "$RUNNER_TEMP/audit"
          { echo '```text'; cat "$RUNNER_TEMP/audit"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          test "$status" -le 1

      # The hook is part of the maintainer's certification path; its isolated fixtures run in this required context, so
      # that a separate workflow that branch protection need not require cannot silently regress it.
      - name: Exercise Git hooks in isolated repositories
        if: ${{ !cancelled() }}
        run: sh .githooks/test-sign-off.sh
      # The sessions' tailnet hook may stop a daemon: its fixtures check which ones, with stand-ins for the daemon.
      - name: Exercise the tailnet session hook with stand-in daemons
        if: ${{ !cancelled() }}
        run: bash .claude/hooks/test-join-tailnet.sh
      # The all-core gauge (#2536) measures on the 9700X on main's states alone; its reductions' fixtures run here, on
      # pull requests too.
      - name: Check the all-core gauge's reductions against fixtures
        if: ${{ !cancelled() }}
        run: |
          cc -std=c17 -O2 -Wall -Wextra -Werror -fno-strict-aliasing -o "$RUNNER_TEMP/allcore" tools/allcore/allcore.c
          "$RUNNER_TEMP/allcore" self-test

  # Invalidated merge-queue candidates (#1430). GitHub never cancels a candidate's run: when it drops a candidate (its
  # pull request is dequeued, or the entry ahead fails) or rebuilds it, it deletes the candidate's branch or points it
  # at the rebuild, and the old run would burn the whole contract. So each candidate, as it starts, cancels the
  # workflow's unfinished merge-queue runs whose branch no longer names their commit and whose commit isn't on main
  # (tools/ci/nightly.sh's `stale`; nightly.c decides). A rebuild is a new candidate, so the runs it replaces go as it
  # starts. A failed read cancels nothing, and this job never gates the candidate.
  stale:
    name: Cancel invalidated merge-queue candidates
    if: github.event_name == 'merge_group' && github.repository_id == '1421805693'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out the sweep
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/ci
      - name: Cancel the runs of candidates GitHub dropped or rebuilt
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/nightly.sh stale "$RUNNER_TEMP/stale"

  # A merge-queue candidate's auxiliary workflows (#1430), each called whole where the candidate's own change (its merge
  # against its base) touches a path the workflow's pull_request trigger lists: tools/ci/changes.c reads those lists
  # from the workflows themselves (changes_auxiliary_decide), so the rule is written once. A pull request runs them on
  # their own triggers. They start after the policy job, as the rows do; the aggregate's coverage step requires every
  # job of each one called to have succeeded, and each one not called to have run nothing.
  auxiliary-build:
    name: Auxiliary (build.yml)
    needs: [changes, policy]
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.policy.result == 'success' && needs.changes.result == 'success' && contains(needs.changes.outputs.auxiliary, ',build,') }}
    uses: ./.github/workflows/build.yml

  auxiliary-build-pgo:
    name: Auxiliary (build-pgo.yml)
    needs: [changes, policy]
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.policy.result == 'success' && needs.changes.result == 'success' && contains(needs.changes.outputs.auxiliary, ',build-pgo,') }}
    uses: ./.github/workflows/build-pgo.yml

  auxiliary-selfhost:
    name: Auxiliary (selfhost.yml)
    needs: [changes, policy]
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.policy.result == 'success' && needs.changes.result == 'success' && contains(needs.changes.outputs.auxiliary, ',selfhost,') }}
    uses: ./.github/workflows/selfhost.yml

  auxiliary-tier1-problem:
    name: Auxiliary (tier1-problem.yml)
    needs: [changes, policy]
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.policy.result == 'success' && needs.changes.result == 'success' && contains(needs.changes.outputs.auxiliary, ',tier1-problem,') }}
    uses: ./.github/workflows/tier1-problem.yml

  qualification:
    # The required context, `Integration qualification` (#1430; it replaces the
    # hardware-named `Build and execute on Ryzen 7 9700X`, which the
    # qualification-alias job below reports until the ruleset requires this
    # name): both hosted variants and the gated 9700X job must pass on the same
    # revision. A pull request, draft or ready,
    # never runs that job (#2055): the context passes on its hosted rows alone,
    # and says that native correctness and measurements run on its merged
    # first-parent state in the nightly window. A merge-queue candidate
    # (#1430) never runs it either: the context passes on the full hosted
    # contract, which its coverage step checks job by job from the run's own
    # jobs (every shard of every row and sanitizer, the vector verdict, each
    # fuzz campaign), and its merged state gets native correctness and
    # measurements in the window. On the daily and dispatched runs,
    # and on a push to main before the nightly mode, the 9700X job runs native
    # correctness before the measurements. A
    # nightly dispatch reports through its coverage record instead; a retired
    # scheduled run (the nightly mode's) runs nothing; and a push in the
    # nightly mode defers its 9700X work to the window. None of the three has
    # this context, so none can show a 9700X qualification that didn't run.
    name: Integration qualification
    needs: [changes, evidence, policy, test, fuzz, benchmarks, auxiliary-build, auxiliary-build-pgo, auxiliary-selfhost, auxiliary-tier1-problem]
    if: ${{ always() && needs.evidence.outputs.retired != 'true' && !(github.event_name == 'workflow_dispatch' && (inputs.purpose == 'backlog' || inputs.purpose == 'snapshot')) && !(github.event_name == 'push' && needs.evidence.outputs.hardware_reason == 'deferred') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # The coverage step reads this run's jobs; nothing here writes.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the qualification policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # A merge-queue candidate's expected coverage, from this run's own jobs (tools/ci/nightly.c's `coverage`): every
      # shard 1..N of every row (x86-64 and native, each sanitizer, one N per row), the vector pool's verdict, each
      # fuzz campaign and every job of each auxiliary workflow the selector named, all completed and successful, and no
      # job of an auxiliary workflow it didn't name. A job missing, skipped, cancelled, failed or timed out, or a row
      # whose shards disagree, fails it; so does an API failure. The predicate below reads its outcome, so that a test
      # job's result alone, which a skipped shard leaves green, can't pass a candidate.
      - name: Check a merge-queue candidate's coverage job by job
        id: coverage
        if: github.event_name == 'merge_group'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUXILIARY: ${{ needs.changes.outputs.auxiliary }}
        run: bash tools/ci/nightly.sh coverage "$RUNNER_TEMP/coverage"
      - name: Require hosted and native correctness before successful qualification
        if: ${{ !cancelled() }}
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          SIZE_RESULT: ${{ needs.policy.result }}
          DCO_RESULT: ${{ needs.policy.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          HARDWARE: ${{ needs.evidence.outputs.hardware }}
          HARDWARE_REASON: ${{ needs.evidence.outputs.hardware_reason }}
          TEST_RESULT: ${{ needs.test.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          BENCHMARK_RESULT: ${{ needs.benchmarks.result }}
          COVERAGE_RESULT: ${{ steps.coverage.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          PURPOSE: ${{ inputs.purpose }}
          PR_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
        shell: bash
        run: |
          cc -std=c17 -O2 -Wall -Wextra -Werror -fno-strict-aliasing tools/ci/qualification.c -o "$RUNNER_TEMP/qualification"
          "$RUNNER_TEMP/qualification"

  # The required context's old name (#1430), reported until main's ruleset requires `Integration qualification` in
  # its place: the replacement is installed and observed first, and the ruleset switches names in one edit, so no
  # interval is unprotected. It passes exactly when the aggregate passes, and runs wherever the aggregate does. The
  # change that removes main's push triggers removes this job.
  qualification-alias:
    name: Build and execute on Ryzen 7 9700X
    needs: [qualification]
    if: ${{ always() && needs.qualification.result != 'skipped' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Pass exactly when the aggregate passed
        env:
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
        shell: bash
        run: |
          echo "Integration qualification: $QUALIFICATION_RESULT"
          test "$QUALIFICATION_RESULT" = success

  record:
    # The run's coverage record (tools/ci/nightly.c's `record`, docs/ci.md): its commit, tree and first parent; the
    # files that pin its protocol, toolchain and corpus; what the selector chose; what it ran, reused, admitted and
    # deferred; the 9700X job's window, native correctness and host; and the outcome they add up to. It is the
    # coverage-record-ATTEMPT artifact, kept 90 days, that the nightly coordinator's ledger harvests. Hosted, after everything. It fails only a nightly run that correctness blocked or
    # a measurement failed, so that such a run shows red; every other run's status is the aggregate's.
    name: Coverage record
    needs: [changes, evidence, test, fuzz, benchmarks, qualification]
    if: ${{ always() && github.repository_id == '1421805693' && needs.evidence.outputs.retired != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the run's commit and its first parent
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Write the coverage record
        id: record
        shell: bash
        env:
          RECORD_REPOSITORY: ${{ github.repository_id }}
          RECORD_RUN: ${{ github.run_id }}
          RECORD_ATTEMPT: ${{ github.run_attempt }}
          RECORD_EVENT: ${{ github.event_name }}
          RECORD_DISPATCH_PURPOSE: ${{ inputs.purpose }}
          RECORD_REQUEST: ${{ inputs.request }}
          RECORD_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          RECORD_SNAPSHOT: ${{ inputs.snapshot }}
          RECORD_MODE: ${{ vars.BUSTER_NIGHTLY == 'on' && 'on' || 'off' }}
          RECORD_CODE: ${{ needs.changes.outputs.code }}
          RECORD_MEASURE: ${{ needs.changes.outputs.measure }}
          CHANGES_OUTPUTS: ${{ toJSON(needs.changes.outputs) }}
          RECORD_CHANGES_RESULT: ${{ needs.changes.result }}
          RECORD_EVIDENCE_RESULT: ${{ needs.evidence.result }}
          RECORD_SCOPE: ${{ needs.evidence.outputs.scope }}
          RECORD_HOSTED: ${{ needs.evidence.outputs.hosted }}
          RECORD_HOSTED_SOURCE: ${{ needs.evidence.outputs.hosted_source }}
          RECORD_NATIVE_EVIDENCE: ${{ needs.evidence.outputs.native }}
          RECORD_NATIVE_SOURCE: ${{ needs.evidence.outputs.native_source }}
          RECORD_MEASUREMENT_EVIDENCE: ${{ needs.evidence.outputs.measurement }}
          RECORD_MEASUREMENT_SOURCE: ${{ needs.evidence.outputs.measurement_source }}
          # What happened to the 9700X job: a push's reuse that its host didn't confirm ran it after all.
          RECORD_HARDWARE: ${{ needs.evidence.outputs.hardware }}
          RECORD_HARDWARE_REASON: ${{ needs.evidence.outputs.hardware_reason }}
          RECORD_TEST_RESULT: ${{ needs.test.result }}
          RECORD_FUZZ_RESULT: ${{ needs.fuzz.result }}
          RECORD_BENCHMARK_RESULT: ${{ needs.benchmarks.result }}
          RECORD_WINDOW: ${{ needs.benchmarks.outputs.window }}
          RECORD_NATIVE: ${{ needs.benchmarks.outputs.native }}
          RECORD_HOST: ${{ needs.benchmarks.outputs.host }}
          RECORD_QUALIFICATION_RESULT: ${{ needs.qualification.result }}
          RECORD_OVERRIDE: ${{ inputs.override }}
        run: bash tools/ci/nightly.sh record "$RUNNER_TEMP/coverage-record"

      - name: Keep the coverage record
        if: ${{ !cancelled() && steps.record.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-record-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-record/record.tsv
          if-no-files-found: error
          retention-days: 90

      - name: Fail a nightly run that correctness blocked or a measurement failed
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.purpose == 'backlog' || inputs.purpose == 'snapshot') }}
        env:
          OUTCOME: ${{ steps.record.outputs.outcome }}
        shell: bash
        run: |
          case "$OUTCOME" in
              complete|not-required|deferred|pending|interrupted) printf 'Nightly outcome: %s\n' "$OUTCOME" ;;
              *) printf '::error title=Nightly coverage::outcome %s\n' "${OUTCOME:-missing}"; exit 1 ;;
          esac
