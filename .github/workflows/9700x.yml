name: Measure floating memory folds for PR 3645
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fp-folds:
    if: github.repository_id == '1421805693'
    runs-on:
      group: buster-9700x-service-dispatch
      labels: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: znver5
      BUSTER_DEBUG_INFO: '0'
      HEAD_SHA: cfe7be82df3b300ff579bbd7c6f10e1d1882642c
      BASE_SHA: 8e4d32879e17b7d9548cad54257a2f8461328366
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.HEAD_SHA }}
          path: candidate
          persist-credentials: false
      - name: Stage official toolchain and pinned memory-fold harness
        run: |
          grep -Em1 '^model name[[:space:]]*:[[:space:]]*AMD Ryzen 7 9700X([[:space:]]|$)' /proc/cpuinfo
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$HEAD_SHA"
          bash tools/ci/setup-benchpress.sh
          export BUSTER_CI_CACHE="${XDG_CACHE_HOME:-$HOME/.cache}/buster/ci"
          bash tools/ci/fetch-performance.sh cc38ca9708f522fd26eacab3b5234dbfa71c131b docs/measurements/tier1-fma-memory-2829-2026-11-20 harness
      - name: Build both revisions and measure four floating kernels
        run: |
          evidence="$RUNNER_TEMP/fp-fold-evidence-$GITHUB_RUN_ID"
          mkdir -p "$evidence"
          printf '%s\n' "base=$BASE_SHA" "head=$HEAD_SHA" "workflow=$GITHUB_SHA" > "$evidence/identity.txt"
          clang --version >> "$evidence/identity.txt"
          for side in base candidate; do
              (cd "$side" && taskset -c 0-7 ./build.sh --config Release --jobs 8)
              sha256sum "$side/build/compiler" >> "$evidence/identity.txt"
          done
          root=harness/docs/measurements/tier1-fma-memory-2829-2026-11-20
          bash "$root/build-kernels.sh" base/build/compiler candidate/build/compiler
          taskset -c 2 bash "$root/verify-programs.sh" > "$evidence/digests.tsv"
          cd "$root"
          sha256sum kernels/* programs/*.o >> "$evidence/identity.txt"
          size programs/*.o > "$evidence/sizes.txt"
          cat /proc/loadavg > "$evidence/load-before.txt"
          ps -eo psr,pcpu,pid,etimes,user,comm --sort=-pcpu | sed -n '1,10p' >> "$evidence/load-before.txt"
          printf '%s\n' 'round target mode pad side kernel elements reps wall_ns_per_element cycles_per_element instructions_per_element' > "$evidence/kernels.txt"
          for round in 0 1 2; do
              order=(base head)
              if ((round % 2)); then order=(head base); fi
              for arch in x86-64 znver5; do
                  for mode in default unroll; do
                      for pad in 0 16 32 48; do
                          for kernel in saxpy_f32 dot_f32 matmul_f32 i32_to_f32; do
                              reps=65536
                              if [[ "$kernel" == matmul_f32 ]]; then reps=4096; fi
                              for side in "${order[@]}"; do
                                  row="$evidence/$round-$arch-$mode-$pad-$kernel-$side.csv"
                                  perf_log="$row.perf"
                                  LC_ALL=C taskset -c 2 perf stat --no-big-num -x, -e cycles:u,instructions:u -o "$perf_log" -- "./programs/$side-$arch-$mode-p$pad" "$kernel" "$reps" > "$row"
                                  read -r _ elements _ _ wall digest < "$row"
                                  expected=$(awk -v name="$kernel" '$1 == name { print $2 }' expected.tsv)
                                  test "$digest" = "$expected"
                                  counters=$(awk -F, -v n="$((reps * elements))" '
                                      $3 ~ /^(cycles|instructions):u$/ && $1 ~ /^[0-9]+$/ { v[$3] = $1 / n }
                                      END {
                                          if (v["cycles:u"] <= 0 || v["instructions:u"] <= 0) exit 1
                                          printf "%.6f %.6f", v["cycles:u"], v["instructions:u"]
                                      }' "$perf_log")
                                  printf '%s %s %s %s %s %s %s %s %s %s\n' "$round" "$arch" "$mode" "$pad" "$side" "$kernel" "$elements" "$reps" "$wall" "$counters" >> "$evidence/kernels.txt"
                              done
                          done
                      done
                  done
              done
          done
          cat /proc/loadavg > "$evidence/load-after.txt"
          ps -eo psr,pcpu,pid,etimes,user,comm --sort=-pcpu | sed -n '1,10p' >> "$evidence/load-after.txt"
          cat "$evidence/kernels.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fp-fold-pairs-pr3645
          path: ${{ runner.temp }}/fp-fold-evidence-${{ github.run_id }}
