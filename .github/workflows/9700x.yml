        # Includes independent result checks. These unconditioned single-operation samples are informational;
        # source-corpus lowering and conditioned multi-process measurements remain separate acceptance work.
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',lowering,')
        run: |
          cpu="$(awk '/Cpus_allowed_list/ {split($2,a,/[-,]/); print a[1]}' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-lowering

      - name: Benchmark GNU syntax metadata and parser handoff
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',gnu,')
        run: |
