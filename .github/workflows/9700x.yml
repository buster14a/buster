      - name: Benchmark typed-stream lowering through IR verification
        if: env.MEASURE == 'all' || contains(env.MEASURE, ',ir-lowering,')
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-ir-lowering

      - name: Benchmark typed-stream lowering after scalar work
