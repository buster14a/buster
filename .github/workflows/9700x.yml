        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-snapshot

      - name: Benchmark the foreign inputs against mold and wild
        # --linkers also times mold's and wild's reading and resolving on one thread on the same command lines, which no
        # pull request changes: it runs where `changes` doesn't rule it out (foreign_benchmark.c's harness).
        if: needs.changes.outputs.foreign != 'false'
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-foreign --linkers

      - name: Benchmark the foreign inputs
        # Every other pull request's: the resolution's times by the vector path and the exact one.
        if: needs.changes.outputs.foreign == 'false'
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-foreign

      - name: Benchmark the whole link against GNU ld, lld, mold and wild
        # Without taskset: it pins its own lane and the linkers' runs on one thread, and the linkers' other runs need
        # every CPU. Its linkers' side, about 121 s of the step's 122, times GNU ld, lld, mold and wild, which no pull
        # request changes: it runs where `changes` doesn't rule it out (its baselines).
        if: needs.changes.outputs.baselines != 'false'
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          ./build/compiler benchmark-link --cpus "$cpu"

      - name: Benchmark the whole link by the direct path
        # Every other pull request's: the direct path's times, and its programs must still run as their models predict.
        if: needs.changes.outputs.baselines == 'false'
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          ./build/compiler benchmark-link --cpus "$cpu" --only direct

      - name: Benchmark the floors
        # Without taskset too: it pins itself, and its writes from several threads take the first CPUs it may use. What
        # the machine and the kernel charge doesn't depend on a pull request either: it runs with the linkers'.
        if: needs.changes.outputs.baselines != 'false'
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          ./build/compiler benchmark-floors --cpu "$cpu"

      - name: Benchmark token refinement on the repository sources
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-refinement src

      - name: Benchmark the preprocessor on main.c
        # The preprocessor's own predefines follow the options as clang's do (c_predefines.c): -march=native's and
        # -funsigned-char's among them.
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-preprocessor --clang -target x86_64-pc-linux-gnu -march=native -Isrc -fwrapv -funsigned-char src/buster/compiler/main.c

      - name: Benchmark the directive tables on the repository sources
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-preprocessor --tables src

      - name: Benchmark the per-file jobs on the repository's translation units
        # Without taskset: it pins each lane to an allowed CPU of its own.
        run: ./build/compiler benchmark-files -target x86_64-pc-linux-gnu -march=native -Isrc -fwrapv -funsigned-char src/buster/compiler/main.c src/buster/compiler/*_benchmark.c

      - name: Benchmark the parser on main.c
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-parser -march=native -Isrc -fwrapv -funsigned-char --predefines build/predefines.h src/buster/compiler/main.c

      - name: Benchmark GNU syntax metadata and parser handoff
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-gnu -march=native -Isrc -fwrapv -funsigned-char --predefines build/predefines.h src/buster/compiler/main.c

      - name: Benchmark C-source binding production and resolution
        run: |
          cpu="$(awk '/^Cpus_allowed_list:/ { split($2, cpus, /[,-]/); print cpus[1] }' /proc/self/status)"
          taskset -c "$cpu" ./build/compiler benchmark-parser-bindings -march=native -Isrc -fwrapv -funsigned-char --predefines build/predefines.h src/buster/compiler/main.c
          corpus=/var/lib/buster-9700x/corpora/preprocessor-391e729af658
          system=(-march=znver5 -nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include")
          taskset -c "$cpu" ./build/compiler benchmark-parser-bindings "${system[@]}" "$corpus/sqlite/sqlite3.c"
          # Isolate both paths and the vector work after a lighter phase; do not infer a speedup from mixed passes.
          taskset -c "$cpu" ./build/compiler benchmark-parser-bindings --only scalar "${system[@]}" "$corpus/sqlite/sqlite3.c"
          taskset -c "$cpu" ./build/compiler benchmark-parser-bindings --only batch "${system[@]}" "$corpus/sqlite/sqlite3.c"
          taskset -c "$cpu" ./build/compiler benchmark-parser-bindings --only batch --after-scalar 200 "${system[@]}" "$corpus/sqlite/sqlite3.c"

      - name: Benchmark the C type table
        run: |
