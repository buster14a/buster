          # Where the graph run's gain goes in that compile: its stages with the transitions, and both compiles' counters.
          taskset -c 2 ./build/compiler measure-compile --runs 11 -- --check-transitions "${options[@]}"
          for transitions in "" --check-transitions; do
            taskset -c 2 perf stat -r 11 -e cycles:u,instructions:u,branch-misses:u,cache-references:u,cache-misses:u \
