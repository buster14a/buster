name: Mobile cancellation evidence
on:
  push:
    branches: [codex/2684-mobile-cancellation-evidence]
permissions:
  contents: read
  actions: read
jobs:
  read-evidence:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Download exact failed artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11716679917'
          path: ${{ runner.temp }}/evidence
          github-token: ${{ github.token }}
          run-id: '38179265215'
      - name: Print bounded replacement-cancellation evidence
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/evidence" -type f -path '*ios-boot-cancel-recovery-create/*' \( -name 'run.log' -o -name 'xcrun.log' -o -name '*recovery-create*log' -o -name '*shutdown*log' \) >"$RUNNER_TEMP/selected"
          while IFS= read -r path; do
            printf '\nEvidence file: %s\n' "$path"
            head -c 65536 "$path"
          done <"$RUNNER_TEMP/selected"
