name: issue72-current-source-export

on:
  push:
    branches:
      - codex/issue-72-current-source

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Export source tree
        run: git archive --format=tar.gz --output=issue72-current-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: issue72-current-source
          path: issue72-current-source.tar.gz
          if-no-files-found: error
          retention-days: 1
