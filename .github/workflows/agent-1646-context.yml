name: agent-1646-context

on:
  push:
    branches:
      - codex/1646-static-assert-message

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1646-static-assert-message

      - name: Apply guarded repair
        shell: bash
        run: |
          set +e
          : > .agent/apply-1646.log
          python3 -m py_compile .agent/apply_1646.py >> .agent/apply-1646.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python3 .agent/apply_1646.py >> .agent/apply-1646.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            grep -R -n 'static assertion expression is not a true integer constant expression' src/buster >> .agent/apply-1646.log 2>&1
            if [ "$?" -eq 0 ]; then
              echo 'obsolete deferred diagnostic remains' >> .agent/apply-1646.log
              status=1
            fi
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check >> .agent/apply-1646.log 2>&1
            status=$?
          fi
          printf '\nexit_status=%s\n' "$status" >> .agent/apply-1646.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -eq 0 ]; then
            git add src/buster/lib/compiler/frontend/c/c_internal.h \
                    src/buster/lib/compiler/frontend/c/c_parse.c \
                    src/buster/lib/compiler/frontend/c/c_gen.c \
                    src/buster/tests/compiler/frontend/c/c_test.c \
                    src/buster/tests/compiler/driver/driver_fast_test.c
            git commit -m 'c: preserve deferred static assertion diagnostics'
          else
            git restore src/buster/lib/compiler/frontend/c/c_internal.h \
                        src/buster/lib/compiler/frontend/c/c_parse.c \
                        src/buster/lib/compiler/frontend/c/c_gen.c \
                        src/buster/tests/compiler/frontend/c/c_test.c \
                        src/buster/tests/compiler/driver/driver_fast_test.c
            git add .agent/apply-1646.log
            git commit -m 'chore: publish issue 1646 repair diagnostic'
          fi
          git push origin HEAD:codex/1646-static-assert-message
