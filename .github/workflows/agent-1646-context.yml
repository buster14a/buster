name: agent-1646-context

on:
  push:
    branches:
      - codex/1646-static-assert-message

permissions:
  contents: write

jobs:
  extract-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1646-static-assert-message

      - name: Extract focused static-assert context
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')
          output = []

          def emit_range(path: Path, start: int, end: int) -> None:
              lines = path.read_text(encoding='utf-8').splitlines()
              start = max(0, start)
              end = min(len(lines), end)
              output.append(f'===== {path.as_posix()} lines {start + 1}-{end} =====')
              output.extend(f'{index + 1:6}: {lines[index]}' for index in range(start, end))
              output.append('')

          def emit_function(path: Path, needle: str) -> None:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              hit = next((i for i, line in enumerate(lines) if needle in line), None)
              if hit is None:
                  output.append(f'NOT FOUND: {path}: {needle}')
                  return
              start = hit
              while start > 0 and not lines[start].lstrip().startswith(('BUSTER_', 'static ', 'void ', 'bool ', 'String8 ', 'C')):
                  start -= 1
              depth = 0
              seen_open = False
              end = hit + 1
              for i in range(hit, len(lines)):
                  depth += lines[i].count('{') - lines[i].count('}')
                  seen_open = seen_open or '{' in lines[i]
                  if seen_open and depth == 0:
                      end = i + 1
                      break
              emit_range(path, max(0, start - 12), min(len(lines), end + 12))

          parse = root / 'src/buster/lib/compiler/frontend/c/c_parse.c'
          test = root / 'src/buster/tests/compiler/frontend/c/c_test.c'

          for needle in (
              'c_parse_static_assert_message(',
              'c_parse_static_assert_check(',
              'c_parse_static_assert_evaluate(',
              'c_parse_token_range_text(',
          ):
              emit_function(parse, needle)

          parse_lines = parse.read_text(encoding='utf-8').splitlines()
          for needle in (
              'deferred_static_assert',
              'C_DIAGNOSTIC_STATIC_ASSERT',
              'static assertion failed',
              'not a true integer constant expression',
          ):
              hits = [i for i, line in enumerate(parse_lines) if needle in line]
              output.append(f'===== c_parse.c matches: {needle} ({len(hits)}) =====')
              for hit in hits:
                  emit_range(parse, hit - 18, hit + 32)

          test_lines = test.read_text(encoding='utf-8').splitlines()
          hits = [i for i, line in enumerate(test_lines) if 'static_assert' in line.lower() or '_Static_assert' in line]
          output.append(f'===== c_test.c static-assert matches ({len(hits)}) =====')
          ranges = []
          for hit in hits:
              start = max(0, hit - 45)
              end = min(len(test_lines), hit + 70)
              if ranges and start <= ranges[-1][1]:
                  ranges[-1] = (ranges[-1][0], max(ranges[-1][1], end))
              else:
                  ranges.append((start, end))
          for start, end in ranges:
              emit_range(test, start, end)

          destination = root / '.agent/issue-1646-focused.txt'
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text('\n'.join(output) + '\n', encoding='utf-8')
          print(f'wrote {destination} ({destination.stat().st_size} bytes)')
          PY

      - name: Publish extracted context
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent/issue-1646-focused.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: publish focused issue 1646 context"
          git push origin HEAD:codex/1646-static-assert-message
