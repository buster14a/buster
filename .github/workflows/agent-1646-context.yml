name: agent-1646-context

on:
  push:
    branches:
      - codex/1646-static-assert-message

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1646-static-assert-message

      - name: Repair the widened token bound
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          path = Path('src/buster/lib/compiler/frontend/c/c_parse.c')
          text = path.read_text(encoding='utf-8')
          pattern = r'(BUSTER_C_SHARED String8 c_parse_static_assert_diagnostic_message\b.*?\n\{.*?\n\s*)u32(\s+declaration_end\s*=)'
          updated, count = re.subn(pattern, r'\1u64\2', text, count=1, flags=re.S)
          if count == 0 and re.search(r'BUSTER_C_SHARED String8 c_parse_static_assert_diagnostic_message\b.*?\n\{.*?\n\s*u64\s+declaration_end\s*=', text, flags=re.S):
              updated = text
              count = 1
          if count != 1:
              raise SystemExit(f'expected one declaration-end type match, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/buster/lib/compiler/frontend/c/c_parse.c
          if ! git diff --cached --quiet; then
            git commit -m 'c: widen deferred assertion token bound'
            git push origin HEAD:codex/1646-static-assert-message
          fi

      - name: Install compiler test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes tcc

      - name: Format and inspect the patch
        shell: bash
        run: |
          set -euo pipefail
          formatter=$(command -v clang-format-20 || command -v clang-format)
          "$formatter" --version
          "$formatter" -i \
            src/buster/lib/compiler/frontend/c/c_internal.h \
            src/buster/lib/compiler/frontend/c/c_parse.c \
            src/buster/lib/compiler/frontend/c/c_gen.c \
            src/buster/tests/compiler/frontend/c/c_test.c \
            src/buster/tests/compiler/driver/driver_fast_test.c
          git diff --check

      - name: Build the hosted validation driver
        shell: bash
        run: |
          set -euo pipefail
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable \
            -fwrapv -fno-strict-aliasing -funsigned-char -g build.c -o /tmp/buster-build

      - name: Generate the Release build graph
        id: generate
        shell: bash
        run: |
          set -o pipefail
          /tmp/buster-build generate --cc clang --config Release --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF \
            2>&1 | tee /tmp/issue-1646-generate.log

      - name: Build and run the full Release test suite
        id: test_all
        shell: bash
        run: |
          set -o pipefail
          /tmp/buster-build build --config Release -t test_all 2>&1 | tee /tmp/issue-1646-test-all.log

      - name: Verify the self-host fixed point
        id: self_host
        shell: bash
        run: |
          set -o pipefail
          /tmp/buster-build test_self_host --config Release 2>&1 | tee /tmp/issue-1646-self-host.log

      - name: Commit formatting
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/buster/lib/compiler/frontend/c/c_internal.h \
                  src/buster/lib/compiler/frontend/c/c_parse.c \
                  src/buster/lib/compiler/frontend/c/c_gen.c \
                  src/buster/tests/compiler/frontend/c/c_test.c \
                  src/buster/tests/compiler/driver/driver_fast_test.c
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format deferred static assertion repair'
          git push origin HEAD:codex/1646-static-assert-message

      - name: Publish failure evidence
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'generate_outcome=%s\n' '${{ steps.generate.outcome }}'
            printf 'test_all_outcome=%s\n' '${{ steps.test_all.outcome }}'
            printf 'self_host_outcome=%s\n' '${{ steps.self_host.outcome }}'
            printf '\n===== generate tail =====\n'
            tail -n 300 /tmp/issue-1646-generate.log 2>/dev/null || true
            printf '\n===== test_all tail =====\n'
            tail -n 700 /tmp/issue-1646-test-all.log 2>/dev/null || true
            printf '\n===== self_host tail =====\n'
            tail -n 500 /tmp/issue-1646-self-host.log 2>/dev/null || true
          } > .agent/test-1646.log
          git restore src/buster/lib/compiler/frontend/c/c_internal.h \
                      src/buster/lib/compiler/frontend/c/c_parse.c \
                      src/buster/lib/compiler/frontend/c/c_gen.c \
                      src/buster/tests/compiler/frontend/c/c_test.c \
                      src/buster/tests/compiler/driver/driver_fast_test.c
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent/test-1646.log
          git commit -m 'chore: publish issue 1646 validation failure'
          git push origin HEAD:codex/1646-static-assert-message
