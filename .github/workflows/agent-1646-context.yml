name: agent-1646-context

on:
  push:
    branches:
      - codex/1646-static-assert-message

permissions:
  contents: write

jobs:
  extract-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1646-static-assert-message

      - name: Extract lowering paths
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')
          output = []

          def emit(path: Path, start: int, end: int) -> None:
              lines = path.read_text(encoding='utf-8').splitlines()
              start = max(0, start)
              end = min(len(lines), end)
              output.append(f'===== {path.as_posix()} lines {start + 1}-{end} =====')
              output.extend(f'{i + 1:6}: {lines[i]}' for i in range(start, end))
              output.append('')

          gen = root / 'src/buster/lib/compiler/frontend/c/c_gen.c'
          test = root / 'src/buster/tests/compiler/frontend/c/c_test.c'

          for start, end in (
              (38070, 38225),
              (50370, 50515),
          ):
              emit(gen, start, end)

          gen_lines = gen.read_text(encoding='utf-8').splitlines()
          for needle in (
              'c_ir_static_assert_expression_range',
              'failure_message',
              'C_PARSER_DECLARATION_STATIC_ASSERT',
              'deferred_static_assert',
          ):
              hits = [i for i, line in enumerate(gen_lines) if needle in line]
              output.append(f'===== c_gen.c matches: {needle} ({len(hits)}) =====')
              for hit in hits:
                  emit(gen, hit - 30, hit + 55)

          for start, end in (
              (10390, 10520),
              (23520, 23670),
              (24020, 24150),
          ):
              emit(test, start, end)

          destination = root / '.agent/issue-1646-gen.txt'
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text('\n'.join(output) + '\n', encoding='utf-8')
          print(f'wrote {destination} ({destination.stat().st_size} bytes)')
          PY

      - name: Publish extracted context
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent/issue-1646-gen.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: publish issue 1646 lowering context"
          git push origin HEAD:codex/1646-static-assert-message
