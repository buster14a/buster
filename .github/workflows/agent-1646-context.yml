name: agent-1646-context

on:
  push:
    branches:
      - codex/1646-static-assert-message

permissions:
  contents: write

jobs:
  extract-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1646-static-assert-message

      - name: Extract exact functions and expectations
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')
          output = []

          def function(path: Path, name: str) -> None:
              lines = path.read_text(encoding='utf-8').splitlines()
              candidates = [i for i, line in enumerate(lines) if name in line and '(' in line]
              hit = next((i for i in candidates if not lines[i].lstrip().startswith('//')), None)
              if hit is None:
                  output.append(f'===== NOT FOUND {path}: {name} =====\n')
                  return
              start = hit
              while start > 0 and (';' in lines[start] or lines[start].strip() == '' or lines[start].lstrip().startswith('//')):
                  start -= 1
              while start > 0 and not any(marker in lines[start] for marker in ('BUSTER_', 'static ', 'bool ', 'void ', 'String8 ', 'UnitTestResult ')):
                  start -= 1
              depth = 0
              opened = False
              end = hit
              for i in range(hit, len(lines)):
                  depth += lines[i].count('{') - lines[i].count('}')
                  opened |= '{' in lines[i]
                  if opened and depth == 0:
                      end = i + 1
                      break
              output.append(f'===== {path.as_posix()}: {name} ({start + 1}-{end}) =====')
              output.extend(f'{i + 1:6}: {lines[i]}' for i in range(start, end))
              output.append('')

          parse = root / 'src/buster/lib/compiler/frontend/c/c_parse.c'
          c_test = root / 'src/buster/tests/compiler/frontend/c/c_test.c'
          driver_test = root / 'src/buster/tests/compiler/driver/driver_fast_test.c'

          for name in (
              'c_parse_static_assert_evaluate',
              'c_parse_static_assert_check',
              'c_parse_defer_static_assert',
              'c_parse_validate_deferred_assertions',
          ):
              function(parse, name)

          for name in (
              'c_test_deferred_assert_positive',
              'c_test_deferred_assert_false',
              'c_test_deferred_assert_nonconstant',
              'c_test_static_assert_nonconstant_quote',
          ):
              function(c_test, name)

          function(driver_test, 'compiler_driver_test_local_sizeof_static_asserts')

          for needle in (
              'not a true integer constant expression',
              'static assertion failed',
              'C_DIAGNOSTIC_STATIC_ASSERT_FAILED',
              'C_DIAGNOSTIC_STATIC_ASSERT_NOT_CONSTANT',
          ):
              output.append(f'===== repository matches: {needle} =====')
              for path in root.rglob('*'):
                  if not path.is_file() or '.git' in path.parts or '.agent' in path.parts:
                      continue
                  try:
                      lines = path.read_text(encoding='utf-8').splitlines()
                  except (UnicodeDecodeError, OSError):
                      continue
                  for index, line in enumerate(lines):
                      if needle in line:
                          output.append(f'{path.as_posix()}:{index + 1}: {line}')
              output.append('')

          destination = root / '.agent/issue-1646-exact.txt'
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text('\n'.join(output) + '\n', encoding='utf-8')
          print(f'wrote {destination} ({destination.stat().st_size} bytes)')
          PY

      - name: Publish extracted context
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent/issue-1646-exact.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: publish exact issue 1646 context"
          git push origin HEAD:codex/1646-static-assert-message
