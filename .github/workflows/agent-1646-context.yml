name: agent-1646-context

on:
  push:
    branches:
      - codex/1646-static-assert-message

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1646-static-assert-message

      - name: Apply guarded repair
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/apply-1646.0 .agent/apply-1646.1 .agent/apply-1646.2 .agent/apply-1646.3 .agent/apply-1646.4 \
            | base64 --decode > /tmp/apply-1646.py
          python3 -m py_compile /tmp/apply-1646.py
          python3 /tmp/apply-1646.py

      - name: Verify replacement coverage
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n 'static assertion expression is not a true integer constant expression' src/buster; then
            echo 'obsolete deferred diagnostic remains' >&2
            exit 1
          fi
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/buster/lib/compiler/frontend/c/c_internal.h \
                  src/buster/lib/compiler/frontend/c/c_parse.c \
                  src/buster/lib/compiler/frontend/c/c_gen.c \
                  src/buster/tests/compiler/frontend/c/c_test.c \
                  src/buster/tests/compiler/driver/driver_fast_test.c
          git diff --cached --check
          git commit -m 'c: preserve deferred static assertion diagnostics'
          git push origin HEAD:codex/1646-static-assert-message
