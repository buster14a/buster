name: agent-1646-context

on:
  push:
    branches:
      - codex/1646-static-assert-message

permissions:
  contents: write

jobs:
  extract-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/1646-static-assert-message

      - name: Extract lowering paths
        shell: bash
        run: |
          set -euo pipefail
          output=.agent/issue-1646-gen.txt
          mkdir -p .agent
          {
            echo '===== c_gen.c 38071-38225 ====='
            sed -n '38071,38225p' src/buster/lib/compiler/frontend/c/c_gen.c | nl -ba -v 38071
            echo '===== c_gen.c 50371-50515 ====='
            sed -n '50371,50515p' src/buster/lib/compiler/frontend/c/c_gen.c | nl -ba -v 50371
            echo '===== c_gen static-assert helpers ====='
            grep -n -B 30 -A 55 -E 'c_ir_static_assert_expression_range|failure_message|C_PARSER_DECLARATION_STATIC_ASSERT|deferred_static_assert' src/buster/lib/compiler/frontend/c/c_gen.c || true
            echo '===== c_test.c 10391-10520 ====='
            sed -n '10391,10520p' src/buster/tests/compiler/frontend/c/c_test.c | nl -ba -v 10391
            echo '===== c_test.c 23521-23670 ====='
            sed -n '23521,23670p' src/buster/tests/compiler/frontend/c/c_test.c | nl -ba -v 23521
            echo '===== c_test.c 24021-24150 ====='
            sed -n '24021,24150p' src/buster/tests/compiler/frontend/c/c_test.c | nl -ba -v 24021
          } > "$output"
          test -s "$output"
          wc -c "$output"

      - name: Publish extracted context
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent/issue-1646-gen.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: publish issue 1646 lowering context"
          git push origin HEAD:codex/1646-static-assert-message
