name: Format final issue 1725 hunks

on:
  push:
    branches: [codex/1725-source-diagnostics]
    paths: ['.github/workflows/format-final-1725.yml']

permissions: {}

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/1725-source-facing-diagnostics
          fetch-depth: 0
      - name: Format only changed hunks and revalidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          import re
          import subprocess

          paths = [
              'src/buster/lib/compiler/frontend/c/c_gen.c',
              'src/buster/tests/compiler/diagnostic_test.c',
          ]
          diff = subprocess.check_output(
              ['git', 'diff', '--unified=0', 'origin/main...HEAD', '--', *paths],
              text=True,
          )
          ranges = {path: [] for path in paths}
          current = None
          for line in diff.splitlines():
              if line.startswith('+++ b/'):
                  current = line[6:]
                  continue
              if current not in ranges or not line.startswith('@@'):
                  continue
              match = re.search(r'\+(\d+)(?:,(\d+))?', line)
              if not match:
                  continue
              start = int(match.group(1))
              count = int(match.group(2) or '1')
              if count:
                  ranges[current].append((start, start + count - 1))

          for path, path_ranges in ranges.items():
              if not path_ranges:
                  raise SystemExit(f'no changed ranges found for {path}')
              command = ['clang-format', '-i']
              command.extend(f'-lines={start}:{end}' for start, end in path_ranges)
              command.append(path)
              subprocess.run(command, check=True)
          PY
          git diff --check
          unexpected=$(git diff --name-only | grep -Fvx \
            -e src/buster/lib/compiler/frontend/c/c_gen.c \
            -e src/buster/tests/compiler/diagnostic_test.c || true)
          test -z "$unexpected"

          driver="$RUNNER_TEMP/buster-build"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable \
            -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$driver"
          "$driver" generate --cc clang --config Debug --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
          "$driver" build --config Debug -t ide
          ide=$(find build -type f -name ide -perm -111 -print -quit)
          test -n "$ide"
          "$ide" test --module=compiler_diagnostic_tests,c_frontend_tests --verbose=1 --ci=1

          cat > "$RUNNER_TEMP/issue-1725.c" <<'EOF'
          int main(void) { return (1, 2); }
          EOF
          "$ide" cc -fsyntax-only -target x86_64-unknown-linux "$RUNNER_TEMP/issue-1725.c"

          if ! git diff --quiet
          then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/buster/lib/compiler/frontend/c/c_gen.c src/buster/tests/compiler/diagnostic_test.c
            git commit -m 'style: format source-facing diagnostic changes'
            git push origin HEAD:codex/1725-source-facing-diagnostics
          fi
