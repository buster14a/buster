name: Collect issue 891 cohort logs

on:
  push:
    branches: [audit/891-cohort-35477228257]

permissions:
  actions: read
  contents: read

jobs:
  collect:
    name: Retain all three attempts
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Download job metadata and raw logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          declare -A jobs=(
            [1]=105988451934
            [2]=105994219641
            [3]=106012615074
          )
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs"
          for attempt in 1 2 3; do
            job="${jobs[$attempt]}"
            metadata="evidence/attempt-${attempt}-job.json"
            for poll in $(seq 1 180); do
              curl --fail --silent --show-error \
                --retry 3 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api}/${job}" > "${metadata}.tmp"
              mv "${metadata}.tmp" "$metadata"
              status="$(jq -r '.status' "$metadata")"
              if [[ "$status" == completed ]]; then
                break
              fi
              sleep 20
            done
            test "$(jq -r '.status' "$metadata")" = completed
            curl --fail --silent --show-error --location \
              --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/${job}/logs" > "evidence/attempt-${attempt}.log"
            test -s "evidence/attempt-${attempt}.log"
          done
          sha256sum evidence/* > evidence/SHA256SUMS

      - name: Retain immutable cohort input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-891-cohort-logs-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
