name: PR 1313 gated-walk audit
on:
  push:
    branches: [qualify/1313-codex]
permissions:
  contents: read
  actions: read
concurrency:
  group: buster-fast-9700x-1313-codex-audit
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - name: Require both unchanged candidate validations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/buster14a/buster/actions/runs/42370777091 --jq .head_sha)" = ae0a1db8e2302b82caf3c2f64afcd8fa9a67468a
          for attempt in $(seq 1 40); do
            gh api repos/buster14a/buster/actions/runs/42370777091/jobs?per_page=100 > proof.json
            if jq -e '[.jobs[] | select(.name == "validate (native)" or .name == "validate (x86-64)")] | length == 2 and all(.[]; .status == "completed" and .conclusion == "success")' proof.json; then
              printf '%s\n' 'Both pinned-candidate hosted validations passed'; exit 0
            fi
            if jq -e '[.jobs[] | select(.name == "validate (native)" or .name == "validate (x86-64)")] | any(.[]; .status == "completed" and .conclusion != "success")' proof.json; then exit 1; fi
            sleep 15
          done
          exit 1
  audit:
    needs: proof
    runs-on: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
    timeout-minutes: 15
    steps:
      - name: Verify zero new-walk execution and an active positive control
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          root="$HOME/buster-fast-bench/1313-codex-01a1b5d1"
          out="$RUNNER_TEMP/1313-audit-$GITHUB_RUN_ID"
          binary="$root/isolated/build/compiler"
          mkdir -p "$out"
          cat /var/lib/buster-9700x/owner
          printf '%s  %s\n' 28c93a9852941ab12e47c6b88cb896df77de80062ba86b1b1a419f4c924d226e "$binary" | sha256sum --check
          nm --defined-only "$binary" > "$out/symbols.txt"
          mapfile -t symbols < <(awk '$2 ~ /^[tT]$/ && $3 ~ /^check_target_feature_(columns|start|emission_prepare|label_roots|named_roots)$/ {print $3}' "$out/symbols.txt")
          test "${#symbols[@]}" -gt 0
          printf 'WALK_SYMBOL=%s\n' "${symbols[@]}"
          {
            printf 'set pagination off\nset confirm off\nset debuginfod enabled off\nset $walk_hits = 0\n'
            for symbol in "${symbols[@]}"; do
              printf 'break %s\ncommands\nsilent\nset $walk_hits = $walk_hits + 1\ncontinue\nend\n' "$symbol"
            done
            printf 'run\nprintf "WALK_HITS=%%u\\n", $walk_hits\nquit\n'
          } > "$out/audit.gdb"
          corpus=/var/lib/buster-9700x/corpora/preprocessor-391e729af658
          sqlite="$corpus/sqlite/sqlite3.c"
          options=(--predefines "$corpus/provenance/gnu17-pinned-predefines.txt" --clang-features --target=x86_64-linux-gnu -march=znver5 -std=gnu17 -nostdinc -isystem "$corpus/headers/usr/lib/clang/23/include" -isystem "$corpus/headers/usr/local/include" -isystem "$corpus/headers/usr/include" -DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_THREADSAFE=0 -DSQLITE_ENABLE_MEMSYS5 -DSQLITE_ENABLE_RTREE "-I$corpus/sqlite" "$sqlite")
          cd "$root/measure"
          gdb -q --batch -x "$out/audit.gdb" --args "$binary" -c "${options[@]}" -o proof-sqlite.o > "$out/sqlite-gdb.log" 2>&1
          cat "$out/sqlite-gdb.log"
          grep -qx 'WALK_HITS=0' "$out/sqlite-gdb.log"
          printf '%s  %s\n' 191eae04d79d452b48af6f49907eefb8dac4709f935f49fc2ae63a6a7fe4cb33 proof-sqlite.o | sha256sum --check
          cat > feature-proof.c <<'C'
          static inline __attribute__((always_inline, target("avx2"))) int h(int x) { return x + 1; }
          int f(int x) { switch (0) { if (h(1)) { case 0: x = h(2); break; } case 1: x = h(3); } return x; }
          C
          gdb -q --batch -x "$out/audit.gdb" --args "$binary" -std=gnu17 -march=x86-64 -c feature-proof.c -o feature-proof.o > "$out/positive-gdb.log" 2>&1
          cat "$out/positive-gdb.log"
          grep -Eq '^WALK_HITS=[1-9][0-9]*$' "$out/positive-gdb.log"
          sha256sum "$binary"
          printf 'COLD_WALK_ZERO_WITH_POSITIVE_CONTROL\n'
          
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr1313-gated-walk-audit
          path: ${{ runner.temp }}/1313-audit-${{ github.run_id }}/
          if-no-files-found: error
