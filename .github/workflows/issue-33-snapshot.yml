name: Issue 33 snapshot

on:
  push:
    branches:
      - compiler/issue-33-canonical-local-promotion

concurrency:
  group: issue-33-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ubuntu-26.04
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Pack tracked source
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/buster-source.tar.gz" HEAD
          # Backticks delimit literal Markdown code in the summary.
          # shellcheck disable=SC2016
          printf '## Issue 33 source snapshot\n\nCommit: `%s`\n\nSource only, tracked files only, excluding Git metadata; retained for one day. This is not a compiler validation result.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain machine records in existing evidence
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: retain
          retention-directory: ${{ runner.temp }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-33-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/buster-source.tar.gz
            ${{ runner.temp }}/machine-specifications/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
