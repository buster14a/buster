name: Differential harness source snapshot

on:
  push:
    branches:
      - test/differential-harness-source-20260907

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pack current main and history
        shell: bash
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/buster-source.bundle" refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: differential-harness-source
          path: ${{ runner.temp }}/buster-source.bundle
          if-no-files-found: error
          retention-days: 1
