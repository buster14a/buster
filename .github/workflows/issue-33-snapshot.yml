name: Issue 33 snapshot

on:
  push:
    branches:
      - compiler/issue-33-canonical-local-promotion

concurrency:
  group: issue-33-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pack source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.github/workflows/issue-33-snapshot.yml -czf "$RUNNER_TEMP/buster-source.tar.gz" .
          printf '## Issue 33 source snapshot\n\nCommit: `%s`\n\nSource only, excluding Git metadata and this recovery workflow; retained for one day. This is not a compiler validation result.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-33-source
          path: ${{ runner.temp }}/buster-source.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
