name: PR 645 binding repair

on:
  push:
    branches:
      - codex/569-canonical-landing-20260914
    paths:
      - .github/workflows/pr645-binding-repair.yml

concurrency:
  group: pr645-binding-repair
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out exact repair commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Repair the performance support pin and dispatch clean-head CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/native_retirement_performance_binding.py')
          text = path.read_text(encoding='utf-8')
          old = 'SUPPORT_DECLARATION_SHA256 = "4dc9203fca4672a2cb51910f7ab340b8ad3060bc6793af28e6fd25c3ed444ab6"'
          new = 'SUPPORT_DECLARATION_SHA256 = "de31038ba09300a7d734dda5a9e3441ae12114ee42d966778912937c2776fd18"'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stale performance support pin')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          python3 tools/native_retirement_performance_identity_test.py -v
          git diff --check

          git config user.name "ChatGPT Codex Connector"
          git config user.email "1144995+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git rm .github/workflows/pr645-binding-repair.yml
          git add tools/native_retirement_performance_binding.py
          git diff --cached --check
          git commit -m "ci: refresh native retirement performance support pin"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          clean_sha=$(git rev-parse HEAD)
          printf 'CLEAN_HEAD=%s\n' "$clean_sha"

          dispatch() {
            local workflow_id=$1
            local payload=$2
            curl --fail-with-body --silent --show-error --location \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" \
              --data "$payload"
          }

          ref_json=$(python3 -c 'import json, os; print(json.dumps({"ref": os.environ["GITHUB_REF_NAME"]}))')
          ci_json=$(python3 -c 'import json, os; print(json.dumps({"ref": os.environ["GITHUB_REF_NAME"], "inputs": {"cmake_profile": "false"}}))')
          throughput_json=$(python3 -c 'import json, os; print(json.dumps({"ref": os.environ["GITHUB_REF_NAME"], "inputs": {"baseline_ref": "main"}}))')

          dispatch 197051687 "$ci_json"
          dispatch 356670892 "$ref_json"
          dispatch 352660201 "$ref_json"
          dispatch 356534397 "$ref_json"
          dispatch 352618603 "$throughput_json"
          dispatch 360018516 "$ref_json"
          dispatch 357082151 "$ref_json"
