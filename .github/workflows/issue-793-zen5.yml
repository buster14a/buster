name: Issue 793 Zen 5 acceptance

on:
  push:
    branches: ['perf/793-debug-recorder-residue']
    paths: ['.github/workflows/issue-793-zen5.yml']

permissions:
  contents: read

concurrency:
  group: issue-793-zen5
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: [buster-zen5, ryzen-9700x]
    timeout-minutes: 120
    env:
      LC_ALL: C
      BUSTER_TEST_JOBS: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and measure exact candidate
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > "$RUNNER_TEMP/issue-793-zen5.sh"
          chmod +x "$RUNNER_TEMP/issue-793-zen5.sh"
          "$RUNNER_TEMP/issue-793-zen5.sh"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-793-zen5-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-793-zen5
          retention-days: 30
          if-no-files-found: error
