name: Research probe - removed validation pass output identity

# Branch-only research workflow. Answers whether removing the separate
# c_parse_validate_lowering_constraints pass changes generated code or only
# DWARF: compiles the stage-1 self-compile with -g and -g0 under base and
# probe compilers and records whole-file and per-ELF-section hashes on a
# GitHub-hosted runner. Not for main.

on:
  # push trigger on the probe branch only: workflow_dispatch cannot be
  # dispatched until the file exists on the default branch.
  push:
    branches:
      - devin/rederive-validation-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    # The maintained Linux CI image (self-host-audit.yml uses the same label).
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Record the source identity against the pinned revision
        shell: bash
        env:
          PINNED: 94976eccad9c31776cf264a33dcda960dd8ed51a
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          git rev-parse HEAD
          git rev-parse "HEAD^{tree}"
          # The compiler source and the workload must equal the pinned revision; only probe files are added.
          git diff --quiet "$PINNED" HEAD -- src CMakeLists.txt build.c tools/work_ledger
          git diff --stat "$PINNED" HEAD | tee "$RUNNER_TEMP/out/branch-vs-pinned.txt"

      - name: Prepare the probe checkout
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/probe-src" HEAD
          python3 docs/performance-audits/evidence/rederive-validation-probe/apply_probe.py "$RUNNER_TEMP/probe-src"
          git -C "$RUNNER_TEMP/probe-src" diff --stat

      - name: Run the identity probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          bash docs/performance-audits/evidence/rederive-validation-probe/identity_probe.sh \
            "$PWD" "$RUNNER_TEMP/probe-src" "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/out/run.log"

      - name: Drop compiler binaries from the artifact
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/out/base" "$RUNNER_TEMP/out/probe" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: rederive-validation-identity
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30
