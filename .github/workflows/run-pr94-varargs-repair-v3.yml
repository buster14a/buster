name: Run exhaustive PR 94 Windows ARM64 varargs repair

on:
  push:
    branches:
      - claude/unruffled-bhabha-f5d28a
    paths:
      - .github/workflows/run-pr94-varargs-repair-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: claude/unruffled-bhabha-f5d28a
          fetch-depth: 0

      - name: Execute corrected production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-pr94-windows-arm64-varargs.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate the repaired build driver"
          start = workflow.find(start_marker)
          end = workflow.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit('could not extract production patch from staged workflow')
          script = textwrap.dedent(workflow[start + len(start_marker):end])

          old = '''text = replace_in_text(
              text,
              forward_call,
              "String8 result = string_format_va(arena, format, variable_arguments, gp_register_slots_remaining);",
              3,
              "string.c forwarding calls",
          )
          text = replace_in_text(
              text,
              "void string_write_to_file_va(OsFileDescriptor* file_handle, String8 format, va_list variable_arguments)",'''
          new = '''text = replace_in_text(
              text,
              forward_call,
              "String8 result = string_format_va(arena, format, variable_arguments, gp_register_slots_remaining);",
              2,
              "string.c forwarding calls",
          )
          text = replace_in_text(
              text,
              "String8 string = string_format_va(scratch.arena, format, variable_arguments);",
              "String8 string = string_format_va(scratch.arena, format, variable_arguments, gp_register_slots_remaining);",
              label="string.c write-va forwarding call",
          )
          text = replace_in_text(
              text,
              "void string_write_to_file_va(OsFileDescriptor* file_handle, String8 format, va_list variable_arguments)",'''
          if script.count(old) != 1:
              raise SystemExit('string.c forwarding patch anchor not found')
          script = script.replace(old, new, 1)

          old = '''text = replace_in_text(
              text,
              "string_format_va(output->capture_arena, format, variable_arguments)",
              "string_format_va(output->capture_arena, format, variable_arguments, STRING_FORMAT_VA_GP_SLOTS(3))",
              label="build.c summary capture",
          )
          if "string_write_to_file_va(output->file, format, variable_arguments)" in text:'''
          new = '''text = replace_in_text(
              text,
              "string_format_va(output->capture_arena, format, variable_arguments)",
              "string_format_va(output->capture_arena, format, variable_arguments, STRING_FORMAT_VA_GP_SLOTS(3))",
              label="build.c summary capture",
          )
          text = replace_in_text(
              text,
              "String8 text = string_format_va(scratch.arena, format, variable_arguments);",
              "String8 text = string_format_va(scratch.arena, format, variable_arguments, STRING_FORMAT_VA_GP_SLOTS(3));",
              label="build.c summary file path",
          )
          if "string_write_to_file_va(output->file, format, variable_arguments)" in text:'''
          if script.count(old) != 1:
              raise SystemExit('build.c forwarding patch anchor not found')
          script = script.replace(old, new, 1)

          marker = '''# Make omissions obvious before committing.
          for path in ("build.c", "src/buster/lib/string.c", "src/buster/lib/os.c", "src/buster/lib/ui_core.c", "src/buster/tests/test.c"):'''
          insertion = '''# The two test-error wrappers have different named-argument windows:
          # buster_test_error leaves x7, while buster_test_error_arguments
          # consumes x0-x7 and starts unnamed arguments on the stack.
          test_file = Path("src/buster/tests/test.c")
          test_text = test_file.read_text()
          for function_name, named_gp_slots in (("buster_test_error", 7), ("buster_test_error_arguments", 8)):
              pattern = rf"(void {function_name}\\([^)]*\\)\\n\\{{.*?String8 message = )string_format_va\\(scratch\\.arena, format, variable_arguments\\);"
              replacement = lambda match, slots=named_gp_slots: match.group(1) + f"string_format_va(scratch.arena, format, variable_arguments, STRING_FORMAT_VA_GP_SLOTS({slots}));"
              test_text, count = re.subn(pattern, replacement, test_text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"src/buster/tests/test.c: failed to patch {function_name}")
          test_file.write_text(test_text)

          # Make omissions obvious before committing.
          for path in ("build.c", "src/buster/lib/string.c", "src/buster/lib/os.c", "src/buster/lib/ui_core.c", "src/buster/tests/test.c"):'''
          if script.count(marker) != 1:
              raise SystemExit('test wrapper insertion anchor not found')
          script = script.replace(marker, insertion, 1)

          exec(compile(script, '<pr94-varargs-repair>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate repaired build driver
        shell: bash
        run: |
          mkdir -p /tmp/buster-pr94
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o /tmp/buster-pr94/build
          /tmp/buster-pr94/build time_trace_summary_self_test
          /tmp/buster-pr94/build test_timing_summary_self_test

      - name: Commit repair and remove staging workflows
        shell: bash
        run: |
          git config user.name David
          git config user.email davidgmbb@gmail.com
          git rm .github/workflows/apply-pr94-windows-arm64-varargs.yml .github/workflows/run-pr94-varargs-repair-v3.yml
          git add build.c src/buster/lib/arena.c src/buster/lib/string.h src/buster/lib/string.c src/buster/lib/os.c src/buster/lib/ui_core.c src/buster/tests/test.c src/buster/tests/string_test.c
          git commit -m "fix: decode Windows ARM64 formatter varargs by ABI slots"
          git push origin HEAD:claude/unruffled-bhabha-f5d28a
