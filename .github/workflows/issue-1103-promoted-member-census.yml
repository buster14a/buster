name: Issue 1103 promoted-member census

on:
  push:
    branches:
      - research/issue-1103-promoted-member-census-20260924-7d8e

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      BUSTER_TEST_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record hosted toolchain and frozen source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p issue-1103-census-evidence
          {
            git rev-parse HEAD 'HEAD^{tree}'
            git hash-object src/buster/lib/compiler/frontend/c/c_gen.c
            git hash-object src/buster/apps/ide/ide.c
            clang --version
            cmake --version
            ninja --version
            uname -a
            lscpu
            free -b
          } > issue-1103-census-evidence/host-and-source.txt
      - name: Bootstrap build driver and build baseline compiler
        shell: bash
        run: |
          set -euo pipefail
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --config Release --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/buster-build" build --config Release -t ide
          cp build/Release/ide "$RUNNER_TEMP/ide-baseline"
          sha256sum "$RUNNER_TEMP/ide-baseline" > issue-1103-census-evidence/baseline-compiler.sha256
      - name: Apply disposable counters and build probe compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/frontend_promoted_member_census.py instrument --out issue-1103-census-evidence
          "$RUNNER_TEMP/buster-build" build --config Release -t ide
          sha256sum build/Release/ide > issue-1103-census-evidence/probe-compiler.sha256
      - name: Count self-host and ordinary C inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/frontend_promoted_member_census.py run \
            --out issue-1103-census-evidence \
            --base-compiler "$RUNNER_TEMP/ide-baseline" \
            --probe-compiler "$GITHUB_WORKSPACE/build/Release/ide" \
            --input tests/basic_c_operations.c \
            --input tests/basic_c_member_chain_place.c \
            --input tests/basic_c_sizeof_anonymous_aggregate.c \
            --input tests/basic_c_unnamed_initializer_members.c \
            --input tests/basic_c_union_designator_merge.c
      - name: Restore production source after disposable instrumentation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/buster/lib/compiler/frontend/c/c_gen.c
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-1103-promoted-member-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue-1103-census-evidence
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
