name: Issue 603 CI repair

on:
  push:
    branches:
      - sol/603-analyzer-reference-provenance-v2-20260918

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.repository == 'buster14a/buster' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/603-analyzer-reference-provenance-v3-20260918
          fetch-depth: 0
          persist-credentials: false

      - name: Patch, lint and publish workflow blob
        shell: bash
        env:
          EXPECTED_HEAD: d38b649d96a57dfbeaa6d8619d6dbb32349217e7
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          old = (
              "          printf 'ANALYZER_COMPARISON_SELECTION=%s\\n' \"$selection\" >> \"$GITHUB_ENV\"\n"
              "          printf 'ANALYZER_COMPARISON_REASON=%s\\n' \"$reason\" >> \"$GITHUB_ENV\"\n"
              "          printf 'ANALYZER_REFERENCE_MATERIALIZED=%s\\n' \"$reference_materialized\" >> \"$GITHUB_ENV\"\n"
          )
          new = (
              "          {\n"
              "            printf 'ANALYZER_COMPARISON_SELECTION=%s\\n' \"$selection\"\n"
              "            printf 'ANALYZER_COMPARISON_REASON=%s\\n' \"$reason\"\n"
              "            printf 'ANALYZER_REFERENCE_MATERIALIZED=%s\\n' \"$reference_materialized\"\n"
              "          } >> \"$GITHUB_ENV\"\n"
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one analyzer export block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          go run github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 -color .github/workflows/*.yml
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request

          raw = Path('.github/workflows/ci.yml').read_bytes()
          expected = hashlib.sha1(f'blob {len(raw)}\0'.encode('ascii') + raw).hexdigest()
          payload = json.dumps({
              'content': base64.b64encode(raw).decode('ascii'),
              'encoding': 'base64',
          }).encode('utf-8')
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
              data=payload,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Content-Type': 'application/json',
                  'User-Agent': 'buster-pr-807-ci-repair',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              actual = json.load(response)['sha']
          assert actual == expected, (actual, expected)
          print(f'FINAL_BLOB_SHA={actual}')
          print(f'PATCHED_SHA256={hashlib.sha256(raw).hexdigest()}')
          PY
