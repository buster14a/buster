name: Issue 603 CI slot release

on:
  push:
    branches:
      - sol/603-analyzer-reference-provenance-v2-20260918

permissions:
  actions: write
  contents: read

jobs:
  cancel-superseded:
    if: ${{ github.repository == 'buster14a/buster' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Cancel superseded Buster CI generation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPERSEDED_RUN_ID: "35396314168"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["SUPERSEDED_RUN_ID"]
          token = os.environ["GITHUB_TOKEN"]
          run_url = f"https://api.github.com/repos/{repository}/actions/runs/{run_id}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "buster-pr-807-ci-slot-release",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          with urllib.request.urlopen(
              urllib.request.Request(run_url, headers=headers), timeout=60
          ) as response:
              run = json.load(response)
          if run["status"] == "completed":
              print(f"superseded run already completed: {run['conclusion']}")
          else:
              request = urllib.request.Request(
                  run_url + "/cancel", data=b"", headers=headers, method="POST"
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      assert response.status == 202, response.status
                  print("superseded run cancellation accepted")
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
                  print("superseded run completed while cancellation was requested")
          PY
