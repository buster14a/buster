name: PR 824 rebase executor

on:
  push:
    branches:
      - automation/824-rebase-4b2041c4

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Rebase PR 824 onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/fix/341-flat-aggregate-initializers:refs/remotes/origin/pr824
          git switch --force-create pr824-work refs/remotes/origin/pr824
          echo "original=$(git rev-parse HEAD)"
          echo "main=$(git rev-parse refs/remotes/origin/main)"

          set +e
          GIT_EDITOR=true git rebase refs/remotes/origin/main
          status=$?
          set -e
          while [ "$status" -ne 0 ]; do
            stopped="$(cat .git/rebase-merge/stopped-sha 2>/dev/null || true)"
            echo "::group::rebase stop $stopped"
            if git rev-parse --verify REBASE_HEAD >/dev/null 2>&1; then
              git show --no-patch --format=fuller REBASE_HEAD
            fi
            git status --short
            git diff --name-only --diff-filter=U
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              echo "--- conflict: $path"
              git diff --cc -- "$path" || true
            done < <(git diff --name-only --diff-filter=U)
            echo "::endgroup::"

            if [ "$stopped" = "73d38dca6a88cd45ddb3c8f988baa284ad179caf" ]; then
              expected="$(git diff --name-only --diff-filter=U | sort)"
              wanted="$(printf '%s\n' \
                tools/bench_service/profiles/native-retirement-performance-v1.blocked \
                tools/bench_service/queue.c \
                tools/native_retirement_contract.py \
                tools/native_retirement_materializer.py \
                tools/native_retirement_performance_binding.py | sort)"
              if [ "$expected" != "$wanted" ]; then
                echo "unexpected conflict set" >&2
                exit 1
              fi
              # The support declaration auto-merged, so neither historical hash
              # set is final. Keep current-main bindings temporarily and refresh
              # every derived hash after the complete rebase.
              while IFS= read -r path; do
                git checkout --ours -- "$path"
                git add "$path"
              done <<< "$wanted"
            else
              echo "unhandled rebase stop: $stopped" >&2
              exit 1
            fi

            set +e
            GIT_EDITOR=true git rebase --continue
            status=$?
            set -e
          done

          git log --oneline --decorate --max-count=30
          git diff --check refs/remotes/origin/main...HEAD
          git push --force origin HEAD:refs/heads/recovery/824-rebased-4b2041c4
