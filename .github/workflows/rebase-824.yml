name: PR 824 rebase executor

on:
  push:
    branches:
      - automation/824-rebase-4b2041c4

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Rebase PR 824 onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/fix/341-flat-aggregate-initializers:refs/remotes/origin/pr824
          git switch --force-create pr824-work refs/remotes/origin/pr824
          echo "original=$(git rev-parse HEAD)"
          echo "main=$(git rev-parse refs/remotes/origin/main)"
          set +e
          GIT_EDITOR=true git rebase refs/remotes/origin/main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::rebase state"
            if [ -f .git/rebase-merge/stopped-sha ]; then
              echo "stopped_sha=$(cat .git/rebase-merge/stopped-sha)"
            fi
            if git rev-parse --verify REBASE_HEAD >/dev/null 2>&1; then
              git show --no-patch --format=fuller REBASE_HEAD
            fi
            git status --short
            git diff --name-only --diff-filter=U
            echo "::endgroup::"
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              echo "::group::conflict $path"
              git diff --cc -- "$path" || true
              echo "::endgroup::"
            done < <(git diff --name-only --diff-filter=U)
            exit "$status"
          fi
          git log --oneline --decorate --max-count=30
          git push origin HEAD:refs/heads/recovery/824-rebased-4b2041c4
