name: CI lifecycle policy regression

on:
  pull_request:
    paths:
      - '.github/workflows/ci-recovery.yml'
      - '.github/workflows/ci-merge-group-watch.yml'
      - '.github/workflows/ci-recovery-tests.yml'
      - '.github/scripts/recover-ci.py'
      - '.github/scripts/test_merge_queue_fail_fast.py'
      - 'tests/ci_recovery_test.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-recovery.yml'
      - '.github/workflows/ci-merge-group-watch.yml'
      - '.github/workflows/ci-recovery-tests.yml'
      - '.github/scripts/recover-ci.py'
      - '.github/scripts/test_merge_queue_fail_fast.py'
      - 'tests/ci_recovery_test.py'

permissions: {}

concurrency:
  group: ci-recovery-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test CI lifecycle decisions without network access
        run: |
          python3 tests/ci_recovery_test.py
          python3 .github/scripts/test_merge_queue_fail_fast.py
