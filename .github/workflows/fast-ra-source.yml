name: Fast allocator source snapshot
on:
  push:
    branches: [audit/fast-ra-source-9834a42]
    paths: [.github/workflows/fast-ra-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9834a4253c61934a8a253641a84741a25d3717e3
          persist-credentials: false
      - name: Archive exact baseline
        run: git archive --format=tar.gz --output=baseline-9834a42.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: fast-ra-baseline-9834a42
          path: baseline-9834a42.tar.gz
          retention-days: 3
          if-no-files-found: error
