name: Fast allocator source snapshot
on:
  push:
    branches: [audit/fast-ra-source-9834a42]
    paths: [.github/workflows/fast-ra-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ebfdd11705bc470564e726857e498f1c82aa746c
          persist-credentials: false
      - name: Archive exact baseline
        run: git archive --format=tar.gz --output=baseline-ebfdd11.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: fast-ra-baseline-ebfdd11
          path: baseline-ebfdd11.tar.gz
          retention-days: 3
          if-no-files-found: error
