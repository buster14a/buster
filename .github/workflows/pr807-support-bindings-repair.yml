name: PR 807 support bindings repair

on:
  push:
    branches:
      - codex/807-ci-fix-staging3-20260918

permissions:
  contents: write

concurrency:
  group: pr807-support-bindings-${{ github.sha }}
  cancel-in-progress: false

jobs:
  repair:
    name: Refresh complete support binding chain
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install native service test compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tcc
      - name: Commit, validate, and publish the clean repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          old_support = "1f94d76fa80c80462fbc39d13c7f05288d6447d7439d366b10df2e793c270204"
          new_support = "42149a58107e46d05a3ef6d6b6f63df5923de2260b7b28be6325708e7a3d80ab"
          old_binding = "83a381febc4f87a7e1d93ccb096d03c72c7cf846f873975d8554ba8217697e0c"
          support_targets = (
              Path("tools/native_retirement_contract.py"),
              Path("tools/native_retirement_performance_binding.py"),
              Path("tools/bench_service/profiles/native-retirement-performance-v1.blocked"),
              Path("tools/bench_service/queue.c"),
          )
          for path in support_targets:
              text = path.read_text(encoding="utf-8")
              if text.count(old_support) != 1:
                  raise SystemExit(f"expected one stale support digest in {path}")
              path.write_text(text.replace(old_support, new_support), encoding="utf-8")

          support = Path("docs/native-retirement-support-v1.tsv")
          actual_support = hashlib.sha256(support.read_bytes()).hexdigest()
          if actual_support != new_support:
              raise SystemExit(f"support declaration digest mismatch: {actual_support}")

          binding = Path("tools/native_retirement_performance_binding.py")
          binding_sha = hashlib.sha256(binding.read_bytes()).hexdigest()
          profile = Path("tools/bench_service/profiles/native-retirement-performance-v1.blocked")
          queue = Path("tools/bench_service/queue.c")
          for path in (profile, queue):
              text = path.read_text(encoding="utf-8")
              if text.count(old_binding) != 1:
                  raise SystemExit(f"expected one stale binding-validator digest in {path}")
              path.write_text(text.replace(old_binding, binding_sha), encoding="utf-8")

          fields = {}
          for line in profile.read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  fields[key] = value
          pins = {
              "contract-sha256": Path(fields["contract"]),
              "support-declaration-sha256": Path(fields["support-declaration"]),
              "binding-validator-sha256": Path(fields["binding-validator"]),
              "statistics-sha256": Path(fields["statistics"]),
          }
          for key, path in pins.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if fields[key] != actual:
                  raise SystemExit(f"{key} does not bind {path}: {fields[key]} != {actual}")

          Path(".github/workflows/pr807-support-bindings-repair.yml").unlink()
          print(f"BINDING_VALIDATOR_SHA256={binding_sha}")
          PY

          if git grep -n '1f94d76fa80c80462fbc39d13c7f05288d6447d7439d366b10df2e793c270204' -- .; then
            echo 'stale support declaration digest remains' >&2
            exit 1
          fi
          python3 -m py_compile \
            tools/native_retirement_contract.py \
            tools/native_retirement_performance_binding.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/native_retirement_contract.py \
            tools/native_retirement_performance_binding.py \
            tools/bench_service/profiles/native-retirement-performance-v1.blocked \
            tools/bench_service/queue.c \
            .github/workflows/pr807-support-bindings-repair.yml
          git commit -m "ci: refresh retirement support bindings"

          python3 tools/native_retirement_contract_test.py -v
          python3 tools/native_retirement_materializer_test.py -v
          python3 tools/native_retirement_performance_identity_test.py -v
          python3 tools/native_retirement_performance_binding_test.py -v
          ./build.sh bench_service self-test
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --short
            echo 'validation changed tracked files' >&2
            exit 1
          fi

          git push origin HEAD:refs/heads/codex/807-ci-fix-staging4-20260918
          printf 'STAGED_COMMIT=%s\n' "$(git rev-parse HEAD)"
