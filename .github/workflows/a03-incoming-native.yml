name: A03 native incoming-read validation
on:
  push:
    branches: [astra/a03-20260909-transport]
    paths: [.github/workflows/a03-incoming-native.yml]
permissions:
  contents: read
env:
  BASE: ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
  BUSTER_TEST_JOBS: '1'
  BUSTER_MATRIX_THREADS: '1'
  CMAKE_BUILD_PARALLEL_LEVEL: '1'
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize the original hash-checked patches
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a03"
          cp .github/workflows/a03-incoming-validation.yml "$RUNNER_TEMP/a03/transport.txt"
          python3 - <<'PY'
          import os, base64, zlib, hashlib
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'a03'
          lines = (root / 'transport.txt').read_text().splitlines()
          for name, expected in [('TEST', '2b3c616e9e6450fff68eb9850e4646367389800d740ddc987476901e0e5dbd3c'), ('FIX', 'd0538ceefed8bbc95c399b36a06ef645bc3f60daa07a78c04f6e9befee6ef30a')]:
              encoded = next(line.split(': ', 1)[1] for line in lines if line.startswith('  ' + name + '_PATCH: '))
              encoded = encoded.replace('xCeYWOUrbTqZb', 'xCeYWOUrbqZb')
              data = zlib.decompress(base64.b64decode(encoded))
              assert hashlib.sha256(data).hexdigest() == expected
              if name == 'TEST':
                  data = data.replace(b'+        u32 incoming_opcode =', b'+        u16 incoming_opcode =')
                  assert hashlib.sha256(data).hexdigest() == '8b9bc3a054ed85c1e3162e659e864caa84888d780e64c92e0237abeac08ca5d5'
              (root / (name.lower() + '.patch')).write_bytes(data)
          PY
          git checkout --detach "$BASE"
          git apply "$RUNNER_TEMP/a03/test.patch"
          git diff --check
          clang --version | tee "$RUNNER_TEMP/a03/clang.txt"
          gcc --version | tee "$RUNNER_TEMP/a03/gcc.txt"
          uname -a | tee "$RUNNER_TEMP/a03/host.txt"
      - name: Independent defined-C execution controls
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/a03/oracles.log") 2>&1
          for cc in clang gcc; do
            for opt in 0 2; do
              "$cc" -std=c17 -O"$opt" -Wall -Wextra -Werror -fwrapv -funsigned-char -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all tests/basic_c_machine_alias.c -o "$RUNNER_TEMP/a03/control-$cc-$opt"
              "$RUNNER_TEMP/a03/control-$cc-$opt"
              printf 'PASS %s O%s native execution\n' "$cc" "$opt"
            done
          done
      - name: Build baseline with new invariants only
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/a03/baseline-build.log") 2>&1
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --cc clang --ci --config Release --linker DEFAULT -- -DBUSTER_UNITY_BUILD=OFF
          "$RUNNER_TEMP/buster-build" build --config Release -t ide -- -j1
      - name: Require the baseline intermediate-invariant failure
        run: |
          set -euo pipefail
          status=0
          build/Release/ide test --verbose=1 --ci=1 > "$RUNNER_TEMP/a03/baseline-tests.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/a03/baseline-status.txt"
          cat "$RUNNER_TEMP/a03/baseline-tests.log"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'a03'
          assert (root / 'baseline-status.txt').read_text().strip() == '1'
          text = re.sub(r'\x1b\[[0-9;]*m', '', (root / 'baseline-tests.log').read_text())
          failures = [line.split(' failed at ')[0].strip() for line in text.splitlines() if ' failed at ' in line]
          required = {'machine_opcode_memory_effect(machine_opcode_info(incoming_opcode)) == MACHINE_MEMORY_EFFECT_READ', '(machine_opcode_row_table()[incoming_opcode].schedule_flags & MACHINE_SCHEDULE_UNIT_MEMORY) != 0', 'opcode_rows[opcode].schedule_flags == schedule_memberships[opcode]'}
          assert required <= set(failures), failures
          assert set(failures) <= required | {'memory_order'}, failures
          (root / 'baseline-negative.txt').write_text('\n'.join(failures) + '\n')
          PY
      - name: Apply correction and run full Release regressions
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/a03/candidate-tests.log") 2>&1
          git apply "$RUNNER_TEMP/a03/fix.patch"
          git diff --check
          git diff --binary > "$RUNNER_TEMP/a03/submitted.patch"
          sha256sum src/buster/lib/compiler/codegen/machine.c src/buster/tests/compiler/codegen/machine_test.c tests/basic_c_machine_alias.c docs/agents/machine.md > "$RUNNER_TEMP/a03/source-sha256.txt"
          "$RUNNER_TEMP/buster-build" build --config Release -t test_all -- -j1
      - name: Existing native configuration differential harness
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/a03/differential.log") 2>&1
          "$RUNNER_TEMP/buster-build" test_differential --self-test
          "$RUNNER_TEMP/buster-build" test_differential --ide build/Release/ide --cc clang --source tests/basic_c_machine_alias.c --out "$RUNNER_TEMP/a03/differential" --sanitize-oracle
      - name: Strict native machine-path execution in every mode
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/a03/strict-modes.log") 2>&1
          for mode in none mir-stack fast quality; do
            for ssa in -ffrontend-ssa -fno-frontend-ssa; do
              extra=()
              if [[ "$mode" != none ]]; then extra=(-fno-machine-fallback); fi
              build/Release/ide cc -fverify-codegen -fregister-allocator="$mode" "$ssa" "${extra[@]}" tests/basic_c_machine_alias.c -o "$RUNNER_TEMP/a03/native-program"
              "$RUNNER_TEMP/a03/native-program"
              printf 'PASS %s %s native execution\n' "$mode" "$ssa"
            done
          done
      - name: Existing target and execution-mode matrix
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" test_mode_matrix --config Release 2>&1 | tee "$RUNNER_TEMP/a03/modes.log"
      - name: Supported x86-64 self-host gates
        if: ${{ matrix.runner == 'ubuntu-26.04' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/a03/self-host.log"
          "$RUNNER_TEMP/buster-build" test_self_host_audit --config Release 2>&1 | tee "$RUNNER_TEMP/a03/self-host-audit.log"
      - name: Retain evidence without executable outputs
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a03-evidence"
          if [[ -d "$RUNNER_TEMP/a03" ]]; then
            find "$RUNNER_TEMP/a03" -type f \( -name '*.log' -o -name '*.txt' -o -name '*.tsv' -o -name '*.argv' -o -name '*.stdout' -o -name '*.stderr' -o -name '*.c' -o -name '*.patch' \) -exec cp --parents '{}' "$RUNNER_TEMP/a03-evidence/" \;
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: a03-incoming-${{ matrix.runner }}-${{ github.run_id }}
          path: ${{ runner.temp }}/a03-evidence
          if-no-files-found: error
          retention-days: 7
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Publish a new candidate branch for draft PR validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/buster14a/buster/branches/main --jq .commit.sha)" = "$BASE"
          branch=astra/99-aarch64-incoming-read
          existing=$(git ls-remote --heads origin "$branch")
          test -z "$existing"
          mkdir -p "$RUNNER_TEMP/a03-publish"
          gh api --paginate --slurp 'repos/buster14a/buster/pulls?state=open&per_page=100' > "$RUNNER_TEMP/a03-publish/open-prs.json"
          gh api --paginate --slurp 'repos/buster14a/buster/issues/99/comments?per_page=100' > "$RUNNER_TEMP/a03-publish/coordination.json"
          python3 - <<'PY'
          import os, base64, zlib, hashlib
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'a03-publish'
          lines = Path('.github/workflows/a03-incoming-validation.yml').read_text().splitlines()
          for name, expected in [('TEST', '2b3c616e9e6450fff68eb9850e4646367389800d740ddc987476901e0e5dbd3c'), ('FIX', 'd0538ceefed8bbc95c399b36a06ef645bc3f60daa07a78c04f6e9befee6ef30a')]:
              encoded = next(line.split(': ', 1)[1] for line in lines if line.startswith('  ' + name + '_PATCH: '))
              encoded = encoded.replace('xCeYWOUrbTqZb', 'xCeYWOUrbqZb')
              data = zlib.decompress(base64.b64decode(encoded))
              assert hashlib.sha256(data).hexdigest() == expected
              if name == 'TEST':
                  data = data.replace(b'+        u32 incoming_opcode =', b'+        u16 incoming_opcode =')
                  assert hashlib.sha256(data).hexdigest() == '8b9bc3a054ed85c1e3162e659e864caa84888d780e64c92e0237abeac08ca5d5'
              (root / (name.lower() + '.patch')).write_bytes(data)
          PY
          git checkout --detach "$BASE"
          git apply "$RUNNER_TEMP/a03-publish/test.patch" "$RUNNER_TEMP/a03-publish/fix.patch"
          git diff --check
          git add src/buster/lib/compiler/codegen/machine.c src/buster/tests/compiler/codegen/machine_test.c tests/basic_c_machine_alias.c docs/agents/machine.md
          git -c user.name=ChatGPT -c user.email=chatgpt@users.noreply.github.com commit -m 'aarch64: classify incoming argument loads as memory reads (#99)'
          test "$(gh api repos/buster14a/buster/branches/main --jq .commit.sha)" = "$BASE"
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD | tee "$RUNNER_TEMP/a03-publish/submitted-sha.txt"
          printf 'Candidate only: native validation is independent and must pass before review readiness.\n' >> "$GITHUB_STEP_SUMMARY"
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: a03-published-${{ github.run_id }}
          path: ${{ runner.temp }}/a03-publish
          if-no-files-found: error
          retention-days: 7
