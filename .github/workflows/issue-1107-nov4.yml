# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Temporary workbench, excluded from the implementation branch.
name: Issue 1107 November 4 workbench
on:
  push:
    branches: [agent/1107-diagnostics-nov4-workbench]
    paths: [.github/workflows/issue-1107-nov4.yml, .issue-1107/**]
permissions:
  contents: read
concurrency:
  group: issue-1107-nov4
  cancel-in-progress: true
jobs:
  oracle:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 441db2428d2bd8d28503037b28c1b3740fe4b25a
      - name: Install qualified compiler
        run: bash tools/ci/setup-hosted.sh
      - name: Record exact clang diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostics"
          cat > "$RUNNER_TEMP/cases" <<'CASES'
          int f(void) { return; }
          void g(void) { return 1; }
          int main(void) { int x = "s"; }
          struct s { int a; }; int f(struct s v) { return v.b; }
          void f(void) { const int c = 1; c = 2; }
          void f(void) { int a[2]; a = 0; }
          int f(int); int f(long);
          int main(void) { break; }
          int f(int x) { switch(x) { case 1: case 1: return 0; } return 1; }
          static int s; int s;
          int main(void); int (*fp)(int) = main;
          void f(void) { _Static_assert(1 == 2, "nope"); }
          enum e { A, B, A };
          struct incomplete x;
          void f(void) { int x; x++++; }
          void f(void) { continue; }
          void f(int x) { switch(x) { default: break; default: break; } }
          void f(int x) { switch(x) { case -1: break; case -1: break; } }
          void f(unsigned x) { switch(x) { case -1: break; case 4294967295u: break; } }
          _Static_assert(0, "hello " "world");
          _Static_assert(1 == 2, "hello\nworld");
          _Static_assert(0, "");
          _Static_assert(1 == 2);
          void f(void) { int x; const int *p = &x; *p = 1; }
          CASES
          i=0
          while IFS= read -r source; do i=$((i+1)); printf '%s\n' "$source" > "$RUNNER_TEMP/diagnostics/$i.c"; clang --no-default-config --target=x86_64-linux-gnu -std=gnu17 -nostdinc -fsyntax-only -fno-color-diagnostics "$RUNNER_TEMP/diagnostics/$i.c" > "$RUNNER_TEMP/diagnostics/$i.clang" 2>&1 || test "$?" -eq 1; done < "$RUNNER_TEMP/cases"
          clang --version > "$RUNNER_TEMP/diagnostics/version.txt"
      - name: Build baseline checker
        env:
          BUSTER_HOST_ARCH: x86-64
          BUSTER_DEBUG_INFO: '0'
        run: ./build.sh --config Debug --jobs 4 > "$RUNNER_TEMP/diagnostics/build.txt" 2>&1
      - name: Record baseline checker diagnostics
        run: |
          for source in "$RUNNER_TEMP/diagnostics/"*.c; do ./build/compiler -fsyntax-only -std=gnu17 -nostdinc "$source" > "$source.buster" 2>&1 || test "$?" -eq 1; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-1107-diagnostics
          path: ${{ runner.temp }}/diagnostics
          retention-days: 1
