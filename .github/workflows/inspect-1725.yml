name: Reproduce issue 1725 diagnostic

on:
  push:
    branches: [codex/1725-source-diagnostics]
    paths: ['.github/workflows/inspect-1725.yml']

permissions: {}

jobs:
  reproduce:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build compiler and capture the comma-expression diagnostic
        shell: bash
        run: |
          set -euo pipefail
          report=.issue-1725-probe.txt
          exec > >(tee "$report") 2>&1
          clang --version
          cmake --version
          ninja --version
          driver="$RUNNER_TEMP/buster-build"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable \
            -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$driver"
          "$driver" generate --cc clang --config Debug --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
          "$driver" build --config Debug -t ide
          ide=$(find build -type f -name ide -perm -111 -print -quit)
          test -n "$ide"
          printf 'IDE=%s\n' "$ide"
          cat > /tmp/issue-1725.c <<'EOF'
          int main(void) { return (1, 2); }
          EOF
          set +e
          "$ide" cc -fsyntax-only -target x86_64-unknown-linux /tmp/issue-1725.c > /tmp/issue-1725.stdout 2> /tmp/issue-1725.stderr
          status=$?
          set -e
          printf 'STATUS=%s\n' "$status"
          printf '%s\n' '--- stdout ---'
          cat /tmp/issue-1725.stdout
          printf '%s\n' '--- stderr ---'
          cat /tmp/issue-1725.stderr
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$report"
          git commit -m 'chore: capture issue 1725 reproducer [skip ci]'
          git push
