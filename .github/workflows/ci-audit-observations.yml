name: CI audit observations

on:
  push:
    branches: [ci/actions-audit-observations-20260907]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-audit-observations-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  observe:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bf9125a2c54b13d1be81d934c455481c69fad773
          persist-credentials: false
      - name: Capture exact candidate source and file identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-observations"
          git rev-parse HEAD | tee "$RUNNER_TEMP/ci-observations/candidate.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/ci-observations/candidate-source.tar.gz" HEAD
          git ls-tree -r HEAD .github/workflows .github/zig.json PERFORMANCE_AUDITS.md docs/agents/testing.md docs/ci-github-actions.md docs/performance-audits/2026-09-07T220716Z.md tests/ci_tools_test.py tools/ci_summary.py tools/ci_zig.py tools/github_ci_time.py | tee "$RUNNER_TEMP/ci-observations/candidate-blobs.txt"
      - name: Run CI helper regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/ci_tools_test.py -v 2>&1 | tee "$RUNNER_TEMP/ci-observations/ci-tools.log"
      - name: Validate workflows with pinned actionlint
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106
          "$RUNNER_TEMP/bin/actionlint" -version
          "$RUNNER_TEMP/bin/actionlint" .github/workflows/ci.yml .github/workflows/ios-monitor-tests.yml .github/workflows/issue-33-snapshot.yml 2>&1 | tee "$RUNNER_TEMP/ci-observations/actionlint.log"
      - name: Collect baseline timing observations
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/github_ci_time.py collect --branch main --limit 30 --output "$RUNNER_TEMP/ci-observations/before.json"
          python3 tools/github_ci_time.py summarize "$RUNNER_TEMP/ci-observations/before.json" --output "$RUNNER_TEMP/ci-observations/before-summary.json"
          cat "$RUNNER_TEMP/ci-observations/before-summary.json"
      - name: Collect candidate timing observations without inventing completed samples
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/github_ci_time.py collect --head-sha bf9125a2c54b13d1be81d934c455481c69fad773 --limit 30 --output "$RUNNER_TEMP/ci-observations/after.json"
          python3 tools/github_ci_time.py summarize "$RUNNER_TEMP/ci-observations/after.json" --output "$RUNNER_TEMP/ci-observations/after-summary.json"
          cat "$RUNNER_TEMP/ci-observations/after-summary.json"
      - name: Retain audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-audit-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-observations/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
