name: Determinism perturbation research
on:
  push:
    branches: [codex/53-determinism-perturbation-20260930]
    paths:
      - tools/investigations/determinism-perturbation-20260930/**
      - .github/workflows/determinism-perturbation-research.yml
permissions:
  contents: read
jobs:
  research:
    if: ${{ github.repository == 'buster14a/buster' && github.ref == 'refs/heads/codex/53-determinism-perturbation-20260930' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned-source perturbation experiment
        shell: bash
        run: |
          set -o pipefail
          bash tools/investigations/determinism-perturbation-20260930/run.sh 2>&1 | tee determinism-research.log
      - name: Preserve raw evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: determinism-perturbation-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            determinism-research.log
            det-evidence/
