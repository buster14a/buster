name: Issue 1233 hosted correctness
on:
  push:
    branches: [codex/1233-unwind-validation]
concurrency:
  group: issue-1233-hosted-correctness
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      BUSTER_TEST_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 725dd41ba79b08e7bfc4e1a80a830cdfbce37494
          fetch-depth: 0
      - name: Independent linker
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
          ld.lld --version
      - name: Configure and build
        run: |
          git rev-parse HEAD
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o /tmp/buster1233-driver
          /tmp/buster1233-driver generate --cc clang --config Release --ci --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
          /tmp/buster1233-driver build --config Release -t ide
      - name: Object, link and driver regressions
        run: build/Release/ide test --module=object_tests,link_tests,compiler_driver_tests --verbose=1 --ci=1
      - name: Full registered suite
        if: always()
        run: /tmp/buster1233-driver build --config Release -t test_all
      - name: Execution mode matrix
        if: always()
        run: /tmp/buster1233-driver test_mode_matrix --config Release
      - name: Release self-host fixed point
        if: always() && matrix.runner == 'ubuntu-26.04'
        run: /tmp/buster1233-driver test_self_host --config Release
      - name: Source-size check
        if: always()
        run: /tmp/buster1233-driver source_size --base 1be6fd8a0a5c138c1d0db87bc216c9a21bf04617
