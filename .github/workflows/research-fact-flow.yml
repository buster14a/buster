name: Fact-flow elimination evidence

# Research-only evidence for audit 2026-09-26T150516Z on a GitHub-hosted
# runner: byte identity over the fixture corpus, exact validation work counts,
# exact page faults and callgrind instruction counts, baseline main versus
# this branch, plus the E1+E2 commit as an intermediate so the Wasm import
# change (E3) is measured on its own. The LLVM constant handoff (E4) is the
# only change on the -emit-llvm path, so baseline against branch isolates it. It runs only when this workflow or its evidence scripts change
# and is removed before the pull request leaves draft. Timings are context,
# never the decision.
on:
  pull_request:
    paths:
      - '.github/workflows/research-fact-flow.yml'
      - 'docs/performance-audits/evidence/2026-09-26T150516Z/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-fact-flow-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  evidence:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Fact-flow evidence (GitHub-hosted ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      BASELINE_SHA: ade6ac4b6ecb21f30b61b656439bac476c145e2f
      INTERMEDIATE_SHA: 0f5a681eab0870763e40e24e60b7be4081ce36cb
      EVIDENCE: docs/performance-audits/evidence/2026-09-26T150516Z
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: candidate

      - name: Checkout baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Checkout intermediate (E1+E2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ env.INTERMEDIATE_SHA }}
          path: intermediate

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build valgrind
          clang --version
          cmake --version
          ninja --version
          valgrind --version
          nproc
          grep -m1 "model name" /proc/cpuinfo

      - name: Build baseline and candidate compilers
        env:
          # As ci.yml does: some hosted CPUs make Clang 18's -march=native
          # report an AVX10 feature combination that -Werror would reject.
          CFLAGS: -Wno-invalid-feature-combination
        run: |
          for tree in baseline candidate; do
            (
              cd "$GITHUB_WORKSPACE/$tree"
              clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/driver-$tree"
              "$RUNNER_TEMP/driver-$tree" generate --cc clang --config Release --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
              "$RUNNER_TEMP/driver-$tree" build --config Release -t ide
              "$RUNNER_TEMP/driver-$tree" generate --build-directory build-census --cc clang --config Release --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF -DBUSTER_BENCH_ALLOCATIONS=ON
              "$RUNNER_TEMP/driver-$tree" build --build-directory build-census --config Release -t ide
              python3 "$GITHUB_WORKSPACE/candidate/$EVIDENCE/profiling_build.py" . "$RUNNER_TEMP/profiling-$tree"
            )
          done
          (
            cd "$GITHUB_WORKSPACE/intermediate"
            clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/driver-intermediate"
            "$RUNNER_TEMP/driver-intermediate" generate --cc clang --config Release --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
            "$RUNNER_TEMP/driver-intermediate" build --config Release -t ide
            python3 "$GITHUB_WORKSPACE/candidate/$EVIDENCE/profiling_build.py" . "$RUNNER_TEMP/profiling-intermediate"
          )
          sha256sum baseline/build/Release/ide intermediate/build/Release/ide candidate/build/Release/ide baseline/build-census/Release/ide candidate/build-census/Release/ide "$RUNNER_TEMP"/profiling-*/ide

      - name: Exact work counts, identity and faults
        run: |
          out="$RUNNER_TEMP/fact-flow"
          tool="$GITHUB_WORKSPACE/candidate/$EVIDENCE/fact_flow_ab.py"
          base="$GITHUB_WORKSPACE/baseline/build/Release/ide"
          cand="$GITHUB_WORKSPACE/candidate/build/Release/ide"
          mkdir -p "$out"
          python3 "$tool" generate --output "$out/family" --sizes 250 1000 4000 16000 --helpers 250 1000 4000
          python3 "$tool" census --base "$GITHUB_WORKSPACE/baseline/build-census/Release/ide" --candidate "$GITHUB_WORKSPACE/candidate/build-census/Release/ide" \
            --output "$out" --inputs "$out/family" --sizes 250 1000 4000 16000
          for size in 1000 4000 16000; do
            for target in wasm64-unknown-freestanding bpfel-unknown-linux x86_64-unknown-linux-gnu; do
              python3 "$tool" ab --base "$base" --candidate "$cand" --output "$out" --name "s$size-$target" --repetitions 3 \
                -- cc -target "$target" -c "$out/family/s$size.c" -o '{out}'
            done
          done
          for input in h250 h1000 h4000; do
            python3 "$tool" ab --base "$base" --candidate "$cand" --output "$out" --name "$input-wasm64" --repetitions 3 \
              -- cc -target wasm64-unknown-freestanding -c "$out/family/$input.c" -o '{out}'
          done
          for size in 1000 4000 16000; do
            python3 "$tool" ab --base "$base" --candidate "$cand" --output "$out" --name "s$size-emit-llvm" --repetitions 3 \
              -- cc -emit-llvm -c "$out/family/s$size.c" -o '{out}'
          done
          cd "$GITHUB_WORKSPACE/baseline"
          for debug in -g0 -g; do
            python3 "$tool" ab --base "$base" --candidate "$cand" --output "$out" --name "selfhost$debug" --repetitions 5 \
              -- cc -Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 "$debug" -c src/buster/apps/ide/ide.c -o '{out}'
          done
          python3 "$tool" corpus --base "$base" --candidate "$cand" --output "$out/corpus" --tests tests --jobs 4

      - name: Callgrind instruction counts
        run: |
          out="$RUNNER_TEMP/fact-flow"
          tool="$GITHUB_WORKSPACE/candidate/$EVIDENCE/fact_flow_ab.py"
          base="$RUNNER_TEMP/profiling-baseline/ide"
          middle="$RUNNER_TEMP/profiling-intermediate/ide"
          cand="$RUNNER_TEMP/profiling-candidate/ide"
          # E1 alone: baseline against the intermediate on Wasm64.
          python3 "$tool" callgrind --base "$base" --candidate "$middle" --output "$out" --name "e1-s4000-wasm64" \
            --functions wasm_emit_internal ir_validate_canonical_module \
            -- cc -target wasm64-unknown-freestanding -c "$out/family/s4000.c" -o '{out}'
          # E3 alone: the intermediate (E1+E2) against the candidate, over
          # the size family and the unused-helper family.
          for input in s250 s4000 s16000 h1000 h4000; do
            python3 "$tool" callgrind --base "$middle" --candidate "$cand" --output "$out" --name "e3-$input-wasm64" \
              --functions wasm_emit_internal ir_validate_canonical_module \
              -- cc -target wasm64-unknown-freestanding -c "$out/family/$input.c" -o '{out}'
          done
          # E4 alone: only -emit-llvm reaches the bitcode writer, and E1-E3
          # do not change that path.
          for input in s1000 s4000 s16000; do
            python3 "$tool" callgrind --base "$base" --candidate "$cand" --output "$out" --name "e4-$input-emit-llvm" \
              --functions llvm_bitcode_emit_with_options llvm_bc_add_constant llvm_bc_plan_functions \
              -- cc -emit-llvm -c "$out/family/$input.c" -o '{out}'
          done
          for target in wasm64-unknown-freestanding bpfel-unknown-linux; do
            python3 "$tool" callgrind --base "$base" --candidate "$cand" --output "$out" --name "s4000-$target" \
              --functions ir_validate_canonical_module ir_prepare_canonical_module \
              -- cc -target "$target" -c "$out/family/s4000.c" -o '{out}'
          done
          for debug in -g0 -g; do
            python3 "$tool" callgrind --base "$base" --candidate "$cand" --output "$out" --name "selfhost$debug" --cwd "$GITHUB_WORKSPACE/baseline" \
              --functions compiler_driver_emit_object_output object_write_elf64_with_capacity \
              -- cc -Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 "$debug" -c src/buster/apps/ide/ide.c -o '{out}'
          done
          find "$out" -name '*.out' -size +1M -delete

      - name: Retain evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fact-flow-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/fact-flow
          retention-days: 30
          if-no-files-found: error
