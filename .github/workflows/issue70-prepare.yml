name: Prepare issue 70 source branch

# Temporary publication helper, isolated from the implementation branch.
# Applies the already-reviewed patch on the pinned base; no compiler builds.
on:
  push:
    branches: [codex/issue70-publish-empty-asm]

permissions:
  contents: read

concurrency:
  group: issue70-source-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.repository == 'buster14a/buster' && github.ref == 'refs/heads/codex/issue70-publish-empty-asm' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      BASE: d00ba87da23737a945a899f7304ac00b40a1ee04
      DESTINATION: codex/issue70-empty-asm-clobbers
      PATCH_SHA256: 568a607223742a46e6487e384f3438746f04e1b0897cb2fcc72ebeab2265a425
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - name: Apply exact patch and publish source-only commit
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/issue70-empty-asm.patch"
          gzip -dc .github/issue70-empty-asm.patch.gz > "$patch_file"
          printf '%s  %s\n' "$PATCH_SHA256" "$patch_file" | sha256sum --check

          git fetch --no-tags origin "refs/heads/$DESTINATION"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          git checkout --detach "$BASE"
          git apply --check --whitespace=error-all "$patch_file"
          git apply --index --whitespace=error-all "$patch_file"
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git diff --cached --stat

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'codegen: select operand-free empty asm with memory/cc clobbers' \
              -m 'Part of #70 and #36. Extend both native selectors, share the shape check, preserve conservative memory/flags effects, and add positive and rejection regressions. Compiler validation remains a hosted CI gate.'
          test "$(git rev-parse HEAD^)" = "$BASE"
          git push origin "HEAD:refs/heads/$DESTINATION"
          printf 'Source commit: `%s`\n\nPatch checksum, full-checkout application, and git diff --check passed. No compiler build or test was run by this preparation job.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git show --stat --oneline HEAD
