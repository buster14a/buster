name: Issue 73 Darwin alignment repair

on:
  push:
    branches:
      - codex/issue-73-nonpow-vector-abi
    paths:
      - '.github/workflows/issue-73-darwin-alignment-repair.yml'

permissions:
  contents: write

concurrency:
  group: issue-73-darwin-alignment-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/issue-73-nonpow-vector-abi
          fetch-depth: 0
      - name: Apply x86-64 Darwin alignment fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('src/buster/lib/compiler/frontend/c/c_parse.c')
          text = source.read_text()

          replacements = (
              (
                  '        bool apple = target.os == OPERATING_SYSTEM_MACOS || target.os == OPERATING_SYSTEM_IOS;\n',
                  '',
              ),
              (
                  'sixteen on AArch64 and Darwin while ELF x86-64, Windows, wasm,\n'
                  '        // RISC-V, and BPF retain the rounded storage alignment.',
                  'sixteen on AArch64. x86-64 Darwin, ELF, Windows, wasm, RISC-V, and\n'
                  '        // BPF retain the rounded storage alignment.',
              ),
              (
                  'if (padded && (target.cpu_arch == CPU_ARCH_AARCH64 || apple))',
                  'if (padded && target.cpu_arch == CPU_ARCH_AARCH64)',
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected repair fragment exactly once, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          source.write_text(text)

          workflow = Path('.github/workflows/issue-73-darwin-alignment-repair.yml')
          workflow.unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'frontend: preserve x86-64 Darwin vector alignment'

          branch='codex/issue-73-nonpow-vector-abi'
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} raced another branch update; rebasing."
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
          done
          echo 'Unable to publish the repair after five fast-forward attempts.' >&2
          exit 1
