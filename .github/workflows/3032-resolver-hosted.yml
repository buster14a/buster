name: Preserve resolver comparison traces 3032
on:
  push:
    branches: ["codex/3032-resolver-hosted"]
permissions:
  actions: read
  contents: read
jobs:
  traces:
    runs-on: ubuntu-26.04
    timeout-minutes: 4
    steps:
      - name: Read the verified hosted job's observation archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/buster14a/buster/actions/artifacts/14570685050/zip > "$RUNNER_TEMP/observations.zip"
          printf '%s  %s\n' 1196d10b4c086a73a0885ac1424439978e643b00bae2800b5a82503c13825ecd "$RUNNER_TEMP/observations.zip" | sha256sum -c -
          unzip -Z1 "$RUNNER_TEMP/observations.zip"
          base64 -w 1024 "$RUNNER_TEMP/observations.zip" | sed 's/^/OBS3032 /'
