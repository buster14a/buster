name: Issue 73 workflow fix

on:
  push:
    branches: [codex/issue-73-contract-refresh]
    paths:
      - '.github/workflows/issue-73-workflow-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/issue-73-nonpow-vector-abi
          fetch-depth: 0
      - name: Create the census evidence parent before leaf outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/native-retirement-contract.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          python3 tools/native_retirement_sdks_test.py -v
          "$RUNNER_TEMP/retirement-build" native_retirement_census --manifest-only --out evidence/contract
'''
          new = '''          python3 tools/native_retirement_sdks_test.py -v
          mkdir -p evidence
          "$RUNNER_TEMP/retirement-build" native_retirement_census --manifest-only --out evidence/contract
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one manifest producer command, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          grep -A2 -B1 --fixed-strings 'mkdir -p evidence' .github/workflows/native-retirement-contract.yml
      - name: Commit the validated workflow repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/native-retirement-contract.yml
          git commit -m 'ci: create native retirement evidence parent'
          git push --force origin HEAD:refs/heads/codex/issue-73-contract-refresh
