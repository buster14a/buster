name: Temporary DWARF location capacity consumer

# Safe candidate only; remove this transport before final source admission.
on:
  push:
    branches:
      - codex/2240-dwarf-loclist-capacity
    paths:
      - .github/workflows/2240-dwarf-consumer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dwarf-capacity-consumer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  consumer:
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    env:
      BUSTER_CI_LLVM_VERSION: 23.1.2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      BUSTER_TEST_JOBS: 1
    steps:
      - name: Checkout immutable safe candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze patched source and install independent debugger
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dwarf-capacity-evidence"
          git merge-base --is-ancestor 6f732e23ff78d0de5ed58b9be30ebfb2d169ac8e HEAD
          test "$(git hash-object src/buster/lib/compiler/dwarf/dwarf.c)" = 4c0ce5ad2ad0721ad8c64fc79c40546f0052ac64
          test "$(git hash-object src/buster/tests/compiler/dwarf/dwarf_test.c)" = 9663c5927875f1acd4432b81cf2d2cf2691e8502
          test "$(git hash-object docs/projects/compiler.md)" = e3e32c8725f376e595e637590912a1f64bb9c343
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/dwarf-capacity-evidence/source.txt"
          git status --porcelain=v1 > "$RUNNER_TEMP/dwarf-capacity-evidence/worktree-before.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb
          dpkg-query -W gdb binutils > "$RUNNER_TEMP/dwarf-capacity-evidence/consumer-packages.txt"
          cp /usr/share/doc/gdb/copyright "$RUNNER_TEMP/dwarf-capacity-evidence/gdb-copyright.txt"
          cp /usr/share/doc/binutils/copyright "$RUNNER_TEMP/dwarf-capacity-evidence/binutils-copyright.txt"
      - name: Install pinned independent LLVM
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/ci_llvm.py --target x86_64-linux --work-directory "$RUNNER_TEMP/llvm" \
            --github-path "$GITHUB_PATH" --github-env "$GITHUB_ENV" \
            2>&1 | tee "$RUNNER_TEMP/dwarf-capacity-evidence/llvm-install.log"
          curl --fail --silent --show-error --location --max-time 60 \
            https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-23.1.2/LICENSE.TXT \
            -o "$RUNNER_TEMP/dwarf-capacity-evidence/llvm-LICENSE.TXT"
          test "$(git hash-object "$RUNNER_TEMP/dwarf-capacity-evidence/llvm-LICENSE.TXT")" = fa6ac540007032cbd0ec772a1c72e6cb5527a4fe
      - name: Retain consumer program and checker
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/dwarf-capacity-evidence/consumer.py" <<'PY'
          #!/usr/bin/env python3
          """Temporary patched-writer consumer gate for #2240; no old writer is run."""
          import argparse
          import hashlib
          import json
          import os
          from pathlib import Path
          import signal
          import struct
          import subprocess
          import traceback


          def demand(condition, message):
              if not condition:
                  raise RuntimeError(message)


          def physical_expression(expression_hex):
              # This generated scalar witness uses the writer's direct regx/fbreg
              # descriptors. A different implicit constant is a value change, and
              # does not establish that the variable changed its storage location.
              return bytes.fromhex(expression_hex)[0] in (0x90, 0x91)


          def constant_expression(expression_hex):
              expression = bytes.fromhex(expression_hex)
              return expression[0] == 0x10 and expression[-1] == 0x9f


          def fixture(pressure=False):
              lines = ["typedef unsigned long long U;", "static volatile int decision;",
                       "static volatile U observed;"]
              if pressure:
                  lines.append("static volatile U pressure_input[24];")
              lines += ["int main(void)", "{", "    U x = 0;"]
              stops = []
              for stage in range(24):
                  lines += [f"    if (decision == {stage})", "    {", f"        x = {1000 + stage}ull;", "    }",
                            "    else", "    {", f"        x = {2000 + stage}ull;", "    }"]
                  if pressure and stage % 2:
                      lines += [f"    U p{stage}_{index} = pressure_input[{index}];" for index in range(24)]
                  lines.append(f"    observed += x; /* STOP_{stage} */")
                  stops.append({"line": len(lines), "expected": 1000 if stage == 0 else 2000 + stage})
                  if pressure and stage % 2:
                      lines.append("    observed += " + " + ".join(f"p{stage}_{index}" for index in range(24)) + ";")
              # decision and pressure_input have zero static initialization. The executed
              # path contributes 1000 plus 2001..2023; pressure contributes only zeroes.
              lines += ["    return observed == 47276ull ? 0 : 1;", "}", ""]
              return "\n".join(lines), stops


          GDB_SCRIPT = r'''
          import gdb, json, pathlib, traceback
          config = json.loads(pathlib.Path(CONFIG_PATH).read_text())
          result = {"status": "fail", "observations": []}
          def demand(condition, message):
              if not condition:
                  raise RuntimeError(message)
          try:
              for command in ("set pagination off", "set confirm off", "set breakpoint pending off",
                              "set print entry-values no", "set debuginfod enabled off"):
                  gdb.execute(command)
              gdb.execute("file " + json.dumps(config["executable"]))
              for stop in config["stops"]:
                  try:
                      bp = gdb.Breakpoint(source=config["source"], line=stop["line"])
                  except gdb.error as error:
                      raise RuntimeError("BREAKPOINT " + str(error))
                  demand(not bp.pending and len(bp.locations) > 0, "BREAKPOINT unresolved")
                  for location in bp.locations:
                      demand(location.source is not None and location.source[1] == stop["line"], "BREAKPOINT moved")
              gdb.execute("run")
              for ordinal, stop in enumerate(config["stops"]):
                  frame = gdb.newest_frame()
                  demand(frame is not None and frame.name() == "main", "FRAME wrong")
                  sal = frame.find_sal()
                  demand(sal.symtab is not None and pathlib.Path(sal.symtab.fullname()).resolve() == pathlib.Path(config["source"]).resolve(), "SOURCE wrong")
                  demand(sal.line == stop["line"], "SOURCE line wrong")
                  value = frame.read_var("x")
                  demand(not value.is_optimized_out and not getattr(value, "is_unavailable", False), "VALUE unavailable")
                  actual = int(value)
                  result["observations"].append({"ordinal": ordinal, "line": sal.line, "pc": frame.pc(), "value": actual})
                  expected = stop["expected"] + (1 if config["wrong_value"] and ordinal == 0 else 0)
                  demand(actual == expected, "VALUE mismatch: {} != {}".format(actual, expected))
                  gdb.execute("continue")
              demand(gdb.selected_inferior().pid == 0, "EXIT still live")
              demand(int(gdb.parse_and_eval("$_exitcode")) == 0, "EXIT nonzero")
              result["status"] = "pass"
          except Exception as error:
              result["error"] = str(error)
              traceback.print_exc()
          print("LOC_CONSUMER_RESULT " + json.dumps(result, sort_keys=True))
          gdb.execute("quit " + ("0" if result["status"] == "pass" else "1"))
          '''


          class Reader:
              def __init__(self, data, offset=0, end=None):
                  self.data = data
                  self.offset = offset
                  self.end = len(data) if end is None else end

              def take(self, size):
                  demand(0 <= size <= self.end - self.offset, "bounded binary read failed")
                  value = self.data[self.offset:self.offset + size]
                  self.offset += size
                  return value

              def uint(self, size):
                  return int.from_bytes(self.take(size), "little")

              def leb(self, signed=False):
                  value = 0
                  for shift in range(0, 70, 7):
                      byte = self.uint(1)
                      value |= (byte & 127) << shift
                      if not byte & 128:
                          if signed and byte & 64:
                              value -= 1 << (shift + 7)
                          return value
                  raise RuntimeError("unbounded LEB")

              def string(self):
                  end = self.data.find(b"\0", self.offset, self.end)
                  demand(end >= self.offset, "unterminated string")
                  return self.take(end + 1 - self.offset)[:-1].decode("utf-8")


          def elf_sections(path):
              data = path.read_bytes()
              demand(data[:7] == b"\x7fELF\x02\x01\x01", "requires ELF64 little endian")
              offset = int.from_bytes(data[40:48], "little")
              size, count, names_index = struct.unpack_from("<HHH", data, 58)
              demand(size == 64 and 0 < count < 4096 and names_index < count, "unexpected ELF section table")
              rows = [struct.unpack("<IIQQQQIIQQ", Reader(data, offset + i * size).take(size)) for i in range(count)]
              name_row = rows[names_index]
              names = Reader(data, name_row[4]).take(name_row[5])
              sections = {}
              for row in rows:
                  name = Reader(names, row[0]).string()
                  if name:
                      demand(name not in sections, "duplicate ELF section")
                      if row[1] != 8:
                          sections[name] = Reader(data, row[4]).take(row[5])
              return sections


          def variable_locations(path):
              sections = elf_sections(path)
              for name in (".debug_abbrev", ".debug_info", ".debug_str", ".debug_loc"):
                  demand(name in sections, "missing " + name)
              info = Reader(sections[".debug_info"])
              matches = []
              while info.offset < info.end:
                  length = info.uint(4)
                  demand(length != 0xffffffff and length <= info.end - info.offset, "invalid CU length")
                  unit_end = info.offset + length
                  demand(info.uint(2) == 4, "requires DWARF v4")
                  abbrev_offset = info.uint(4)
                  address_size = info.uint(1)
                  demand(address_size == 8, "requires 64-bit addresses")
                  ab = Reader(sections[".debug_abbrev"], abbrev_offset)
                  abbreviations = {}
                  for _ in range(4096):
                      number = ab.leb()
                      if number == 0:
                          break
                      tag, children = ab.leb(), ab.uint(1)
                      attrs = []
                      for _ in range(128):
                          attr, form = ab.leb(), ab.leb()
                          if attr == 0 and form == 0:
                              break
                          attrs.append((attr, form))
                      else:
                          raise RuntimeError("too many attributes")
                      demand(number not in abbreviations, "duplicate abbreviation")
                      abbreviations[number] = (tag, children, attrs)
                  else:
                      raise RuntimeError("too many abbreviations")
                  parents = []
                  cu_base = 0
                  while info.offset < unit_end:
                      die_offset = info.offset
                      number = info.leb()
                      if not number:
                          demand(parents, "unbalanced DIE tree")
                          parents.pop()
                          continue
                      demand(number in abbreviations, "unknown abbreviation")
                      tag, children, attrs = abbreviations[number]
                      values = {}
                      for attr, form in attrs:
                          if form in (0x01, 0x05, 0x06, 0x07, 0x0b, 0x0c, 0x10, 0x11, 0x12, 0x13, 0x14, 0x17):
                              sizes = {0x01: address_size, 0x05: 2, 0x06: 4, 0x07: 8, 0x0b: 1, 0x0c: 1, 0x10: 4,
                                       0x11: 1, 0x12: 2, 0x13: 4, 0x14: 8, 0x17: 4}
                              value = info.uint(sizes[form])
                          elif form == 0x0e:
                              value = Reader(sections[".debug_str"], info.uint(4)).string()
                          elif form == 0x08:
                              value = info.string()
                          elif form in (0x0d, 0x0f, 0x15):
                              value = info.leb(form == 0x0d)
                          elif form == 0x19:
                              value = 1
                          elif form in (0x03, 0x04, 0x09, 0x0a, 0x18):
                              width = {0x03: 2, 0x04: 4, 0x0a: 1}.get(form)
                              value = info.take(info.uint(width) if width else info.leb())
                          else:
                              raise RuntimeError("unsupported form " + hex(form))
                          values[attr] = (form, value)
                      demand(info.offset <= unit_end, "DIE crosses CU")
                      name = values.get(0x03, (None, None))[1]
                      if tag == 0x11:
                          demand(0x11 in values and values[0x11][0] == 0x01, "missing CU address base")
                          cu_base = values[0x11][1]
                      function = next((p[1] for p in reversed(parents) if p[0] == 0x2e), None)
                      if tag == 0x34 and name == "x" and function == "main":
                          location_form, location = values.get(0x02, (None, None))
                          demand(location_form == 0x17, "x has no location list")
                          matches.append((die_offset, location, cu_base))
                      if children:
                          parents.append((tag, name))
                  demand(info.offset == unit_end and not parents, "unbalanced CU")
              demand(len(matches) == 1, "requires exactly one main::x DIE")
              die_offset, location_offset, base = matches[0]
              loc = Reader(sections[".debug_loc"], location_offset)
              ranges = []
              for _ in range(65536):
                  start, end = loc.uint(8), loc.uint(8)
                  if start == 0 and end == 0:
                      break
                  if start == (1 << 64) - 1:
                      base = end
                      continue
                  expression = loc.take(loc.uint(2)).hex()
                  demand(start < end and expression, "empty or inverted available range")
                  ranges.append({"start": base + start, "end": base + end, "expression_hex": expression})
              else:
                  raise RuntimeError("unbounded location list")
              for previous, current in zip(ranges, ranges[1:]):
                  demand(previous["end"] <= current["start"], "unordered or overlapping x ranges")
              transitions = sum(a["expression_hex"] != b["expression_hex"] for a, b in zip(ranges, ranges[1:]))
              physical_transitions = sum(a["expression_hex"] != b["expression_hex"] and
                                         physical_expression(a["expression_hex"]) and physical_expression(b["expression_hex"])
                                         for a, b in zip(ranges, ranges[1:]))
              constant_transitions = sum(a["expression_hex"] != b["expression_hex"] and
                                         constant_expression(a["expression_hex"]) and constant_expression(b["expression_hex"])
                                         for a, b in zip(ranges, ranges[1:]))
              return {"die_offset": die_offset, "location_offset": location_offset, "ranges": ranges,
                      "available_range_count": len(ranges), "expression_transitions": transitions,
                      "physical_location_transitions": physical_transitions,
                      "constant_expression_transitions": constant_transitions}


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--ide", required=True)
              parser.add_argument("--output", required=True)
              parser.add_argument("--compile-environment", required=True)
              args = parser.parse_args()
              output = Path(args.output).resolve()
              output.mkdir(parents=True, exist_ok=True)
              records = []
              environment = os.environ.copy()
              environment.update(json.loads(Path(args.compile_environment).read_text()))

              def run(stem, argv, timeout=120, required=True, env=None):
                  argv = [str(x) for x in argv]
                  child = subprocess.Popen(argv, stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=env, start_new_session=True)
                  timed_out = False
                  try:
                      stdout, stderr = child.communicate(timeout=timeout)
                  except subprocess.TimeoutExpired:
                      timed_out = True
                      os.killpg(child.pid, signal.SIGKILL)
                      stdout, stderr = child.communicate()
                  (output / (stem + ".stdout")).write_bytes(stdout)
                  (output / (stem + ".stderr")).write_bytes(stderr)
                  records.append({"stem": stem, "argv": argv, "returncode": child.returncode, "timed_out": timed_out, "timeout_seconds": timeout})
                  (output / "commands.json").write_text(json.dumps(records, indent=2) + "\n")
                  print(f"LOC_COMMAND {stem} exit={child.returncode} timeout={timed_out}", flush=True)
                  demand(not timed_out, "timeout: " + stem)
                  if required:
                      demand(child.returncode == 0, "command failed: " + stem)
                  return child.returncode, stdout.decode(errors="replace")

              def debugger(stem, binary, source, stops, wrong_value=False):
                  config = {"executable": str(binary), "source": str(source), "stops": stops, "wrong_value": wrong_value}
                  config_path = output / (stem + ".config.json")
                  config_path.write_text(json.dumps(config, indent=2) + "\n")
                  script = output / (stem + ".gdb.py")
                  script.write_text("CONFIG_PATH = " + repr(str(config_path)) + "\n" + GDB_SCRIPT)
                  code, text = run(stem, ["gdb", "--nx", "--quiet", "--batch", "-x", script], required=False)
                  result_lines = [line[len("LOC_CONSUMER_RESULT "):] for line in text.splitlines() if line.startswith("LOC_CONSUMER_RESULT ")]
                  demand(len(result_lines) == 1, "missing unique GDB result: " + stem)
                  result = json.loads(result_lines[0])
                  result["returncode"] = code
                  (output / (stem + ".result.json")).write_text(json.dumps(result, indent=2) + "\n")
                  return result

              def negative_controls(stem, positive, no_debug, source, stops):
                  wrong = debugger(stem + "-wrong-value", positive, source, stops, True)
                  demand(wrong["status"] == "fail" and wrong["returncode"] == 1 and
                         wrong.get("error", "").startswith("VALUE mismatch"), "wrong-value negative control failed")
                  absent = debugger(stem + "-no-debug", no_debug, source, stops)
                  demand(absent["status"] == "fail" and absent["returncode"] == 1 and
                         absent.get("error", "").startswith("BREAKPOINT"), "no-debug negative control failed")
                  return {"wrong_value": wrong, "no_debug": absent}

              def candidate_command(mode, source, binary, debug):
                  command = [args.ide, "cc", "-g" if debug else "-g0", "-O0", "-ffrontend-ssa", "-fregister-allocator=" + mode]
                  if mode != "none":
                      command.append("-fno-machine-fallback")
                  return command + [source, "-o", binary]

              summary = {"status": "fail", "cases": {}, "qualifying_witnesses": [], "failures": []}
              try:
                  for tool in ("clang", "gdb", "llvm-dwarfdump", "readelf"):
                      run(tool + "-version", [tool, "--version"])
                  for case, pressure in (("diamonds", False), ("pressure", True)):
                      case_result = {"status": "fail", "candidate_modes": {}}
                      summary["cases"][case] = case_result
                      try:
                          text, stops = fixture(pressure)
                          source = output / (case + ".c")
                          source.write_text(text)
                          (output / (case + "-expected-stops.json")).write_text(json.dumps(stops, indent=2) + "\n")
                          reference = output / (case + "-clang-reference")
                          reference_no_debug = output / (case + "-clang-g0")
                          clang_command = ["clang", "-std=c11", "-Wall", "-Wextra", "-Werror", "-O0", "-fno-pie", "-no-pie"]
                          run(case + "-clang-build", clang_command + ["-g", "-gdwarf-4", source, "-o", reference])
                          run(case + "-clang-g0-build", clang_command + ["-g0", source, "-o", reference_no_debug])
                          control = debugger(case + "-clang-consumer", reference, source, stops)
                          case_result["reference"] = control
                          demand(control["status"] == "pass" and control["returncode"] == 0, "Clang/GDB fixture control failed")
                          case_result["reference_negative_controls"] = negative_controls(case + "-clang", reference, reference_no_debug, source, stops)
                          for mode in ("none", "mir-stack", "fast", "quality"):
                              stem = case + "-" + mode
                              row = {"status": "fail"}
                              case_result["candidate_modes"][mode] = row
                              try:
                                  binary = output / (stem + "-candidate")
                                  no_debug = output / (stem + "-g0")
                                  run(stem + "-build", candidate_command(mode, source, binary, True), env=environment)
                                  run(stem + "-g0-build", candidate_command(mode, source, no_debug, False), env=environment)
                                  row["binary_sha256"] = hashlib.sha256(binary.read_bytes()).hexdigest()
                                  row["no_debug_sha256"] = hashlib.sha256(no_debug.read_bytes()).hexdigest()
                                  run(stem + "-verify", ["llvm-dwarfdump", "--verify", binary])
                                  run(stem + "-dump", ["llvm-dwarfdump", "--debug-info", "--debug-loc", binary])
                                  run(stem + "-readelf", ["readelf", "--debug-dump=info,loc,decodedline", binary])
                                  row["locations"] = variable_locations(binary)
                                  consumer = debugger(stem + "-consumer", binary, source, stops)
                                  row["consumer"] = consumer
                                  demand(consumer["status"] == "pass" and consumer["returncode"] == 0, mode + " GDB values failed")
                                  observed = []
                                  for observation in consumer["observations"]:
                                      matches = [r for r in row["locations"]["ranges"] if r["start"] <= observation["pc"] < r["end"]]
                                      demand(len(matches) == 1, "GDB stop not in one emitted x range")
                                      observation["expression_hex"] = matches[0]["expression_hex"]
                                      observed.append(matches[0]["expression_hex"])
                                  pairs = list(zip(observed, observed[1:]))
                                  row["observed_expression_transitions"] = sum(a != b for a, b in pairs)
                                  row["observed_physical_location_transitions"] = sum(a != b and physical_expression(a) and physical_expression(b) for a, b in pairs)
                                  row["observed_constant_expression_transitions"] = sum(a != b and constant_expression(a) and constant_expression(b) for a, b in pairs)
                                  row["negative_controls"] = negative_controls(stem, binary, no_debug, source, stops)
                                  row["status"] = "pass"
                                  if mode in ("fast", "quality") and row["locations"]["physical_location_transitions"] > 7 and row["observed_physical_location_transitions"] > 7:
                                      summary["qualifying_witnesses"].append({"case": case, "mode": mode,
                                          "binary_sha256": row["binary_sha256"], "die_offset": row["locations"]["die_offset"],
                                          "location_offset": row["locations"]["location_offset"],
                                          "emitted_physical_transitions": row["locations"]["physical_location_transitions"],
                                          "observed_physical_transitions": row["observed_physical_location_transitions"]})
                                  counts = {"ranges": row["locations"]["available_range_count"],
                                      "emitted_transitions": row["locations"]["expression_transitions"],
                                      "observed_transitions": row["observed_expression_transitions"],
                                      "physical_transitions": row["locations"]["physical_location_transitions"],
                                      "observed_physical_transitions": row["observed_physical_location_transitions"],
                                      "constant_transitions": row["locations"]["constant_expression_transitions"],
                                      "observed_constant_transitions": row["observed_constant_expression_transitions"]}
                                  print("LOC_MODE " + stem + " " + json.dumps(counts), flush=True)
                              except Exception as error:
                                  row["error"] = str(error)
                                  summary["failures"].append(stem + ": " + str(error))
                                  traceback.print_exc()
                              (output / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
                          case_result["status"] = "pass" if all(row["status"] == "pass" for row in case_result["candidate_modes"].values()) else "fail"
                      except Exception as error:
                          case_result["error"] = str(error)
                          summary["failures"].append(case + ": " + str(error))
                          traceback.print_exc()
                      (output / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
                  demand(not summary["failures"], "one or more candidate consumers or controls failed")
                  demand(summary["qualifying_witnesses"], "PENDING: no single FAST/QUALITY program-mode witness demonstrated more than seven genuine physical location changes")
                  summary["status"] = "pass"
              except Exception as error:
                  summary["error"] = str(error)
                  traceback.print_exc()
              (output / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
              print("LOC_FINAL " + json.dumps(summary, sort_keys=True), flush=True)
              return 0 if summary["status"] == "pass" else 1


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
      - name: Build patched writer and run registered tests with generated fatal policy
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shlex, signal, subprocess
          root = pathlib.Path.cwd()
          evidence = pathlib.Path(os.environ["RUNNER_TEMP"]) / "dwarf-capacity-evidence"
          build = pathlib.Path(os.environ["RUNNER_TEMP"]) / "dwarf-capacity-build"
          driver = evidence / "buster-build"
          records = []
          def run(label, argv, timeout=120):
              command = [str(arg) for arg in argv]
              child = subprocess.Popen(command, cwd=root, stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True)
              expired = False
              try:
                  out, err = child.communicate(timeout=timeout)
              except subprocess.TimeoutExpired:
                  expired = True
                  os.killpg(child.pid, signal.SIGKILL)
                  out, err = child.communicate()
              (evidence / (label + ".stdout")).write_bytes(out)
              (evidence / (label + ".stderr")).write_bytes(err)
              records.append(dict(label=label, argv=command, returncode=child.returncode, timed_out=expired, timeout_seconds=timeout))
              (evidence / "build-commands.json").write_text(json.dumps(records, indent=2) + "\n")
              print(label + ": exit=" + str(child.returncode) + " timeout=" + str(expired), flush=True)
              if expired or child.returncode:
                  print((out + err).decode(errors="replace"), flush=True)
                  raise RuntimeError("frontdoor failed: " + label)
              return out.decode(errors="strict")
          run("host-clang", ["clang", "--version"])
          run("host-cmake", ["cmake", "--version"])
          run("host-ninja", ["ninja", "--version"])
          run("bootstrap", ["clang", "-Isrc", "-Wall", "-Werror", "-Wno-unused-function", "-Wno-unused-variable",
                            "-fwrapv", "-fno-strict-aliasing", "-funsigned-char", "build.c", "-o", driver])
          run("generate", [driver, "generate", "--build-directory", build, "--cc", "clang", "--config", "Debug", "--ci",
                           "--sanitize", "--no-fuzz", "--no-lto", "--linker", "DEFAULT", "--", "-DBUSTER_DEBUG_INFO=OFF"])
          run("build", [driver, "build", "--build-directory", build, "--config", "Debug", "-t", "ide"], 1800)
          ide = build / "Debug/ide"
          commands = run("generated-test-commands", ["ninja", "-C", build, "-f", "build-Debug.ninja", "-t", "commands", "test_all"])
          candidates = []
          for line in commands.splitlines():
              tokens = shlex.split(line)
              if str(ide) in tokens and "test" in tokens and "-E" in tokens and "env" in tokens:
                  candidates.append(tokens)
          if len(candidates) != 1:
              raise RuntimeError("no unique generated registered-test launcher")
          tokens = candidates[0]
          ide_index = tokens.index(str(ide))
          env_index = tokens.index("-E")
          if tokens[env_index + 1] != "env" or tokens[ide_index + 1:] != ["test", "--verbose=1", "--ci=1"]:
              raise RuntimeError("unexpected generated test launcher")
          policy = dict(token.split("=", 1) for token in tokens[env_index + 2:ide_index])
          required = {"BUSTER_SANITIZER_POLICY_MODE": "fatal", "ASAN_OPTIONS": "halt_on_error=1", "UBSAN_OPTIONS": "halt_on_error=1", "LSAN_OPTIONS": "detect_leaks=1:exitcode=86"}
          for key, value in required.items():
              if value not in policy.get(key, ""):
                  raise RuntimeError("generated fatal policy missing: " + key)
          (evidence / "compile-environment.json").write_text(json.dumps(policy, indent=2) + "\n")
          run("dwarf-tests", tokens[env_index - 1:ide_index + 1] + ["test", "--module=dwarf_tests", "--verbose=1", "--ci=1"], 300)
          hashes = {"driver": hashlib.sha256(driver.read_bytes()).hexdigest(), "ide": hashlib.sha256(ide.read_bytes()).hexdigest()}
          (evidence / "build-sha256.json").write_text(json.dumps(hashes, indent=2) + "\n")
          (evidence / "ide-path.txt").write_text(str(ide) + "\n")
          PY
      - name: Verify emitted DWARF and execute multi-transition debugger gate
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/dwarf-capacity-evidence/consumer.py" \
            --ide "$(cat "$RUNNER_TEMP/dwarf-capacity-evidence/ide-path.txt")" \
            --compile-environment "$RUNNER_TEMP/dwarf-capacity-evidence/compile-environment.json" \
            --output "$RUNNER_TEMP/dwarf-capacity-evidence/consumer" \
            2>&1 | tee "$RUNNER_TEMP/dwarf-capacity-evidence/consumer.log"
      - name: Retain all actual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dwarf-capacity-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dwarf-capacity-evidence/
          retention-days: 7
          if-no-files-found: error
