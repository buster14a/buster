name: PR 687 semantic acceptance
on:
  push:
    branches: [codex/pr687-semantic-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c2905afb0a7b8c6c6c86e4e531fc931b83d653ad
          path: source
          persist-credentials: false
      - name: Preserve the bounded Android suite watchdog repair
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr687-semantic"
          python3 ../transport/.github/pr687-semantic/android-deadline.py
          git add android/run_tests.sh android/run_tests_test.sh docs/agents/testing.md
          git diff --cached --check
          git diff --cached > "$RUNNER_TEMP/pr687-semantic/android-deadline.patch"
          tree=$(git write-tree)
          test "$tree" = 61a94cad04d82df611b6004e6ca9f87e16b767fc
          git config user.name 'PR 687 Android CI repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: allow bounded completion of the Android Debug compiler suite'
          commit=$(git rev-parse HEAD)
          git -c credential.helper='!gh auth git-credential' push origin "$commit:refs/heads/codex/pr687-semantic-candidate"
          printf 'commit=%s\ntree=%s\n' "$commit" "$tree" | tee "$RUNNER_TEMP/pr687-semantic/revision.txt"
      - name: Test monitor deadlines and fail-closed mobile lifecycle
        working-directory: source
        timeout-minutes: 10
        env:
          BUSTER_MOBILE_TEST_EVIDENCE_DIR: ${{ runner.temp }}/pr687-semantic/mobile-controls
        run: |
          set -euo pipefail
          bash android/run_tests_test.sh 2>&1 | tee "$RUNNER_TEMP/pr687-semantic/android-fake-tests.log"
      - name: Bootstrap and configure the hosted compiler
        working-directory: source
        run: |
          set -euo pipefail
          clang --version | tee "$RUNNER_TEMP/pr687-semantic/clang-version.txt"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --cc clang --ci --linker DEFAULT 2>&1 | tee "$RUNNER_TEMP/pr687-semantic/configure.log"
      - name: Run the complete Release regression suite
        working-directory: source
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" build --config Release -t test_all 2>&1 | tee "$RUNNER_TEMP/pr687-semantic/release-tests.log"
      - name: Verify ordinary self-host fixed point
        if: ${{ !cancelled() }}
        working-directory: source
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/pr687-semantic/self-host.log"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ !cancelled() }}
        with:
          repository: llvm/llvm-project
          ref: c13b7485b87909fcf739f62cfa382b55407433c0
          path: llvm
          sparse-checkout: clang/lib/Headers
          persist-credentials: false
      - name: Verify pristine BF16 headers in both frontend forms
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 transport/.github/pr687-semantic/header-controls.py source/build/Release/ide llvm/clang/lib/Headers "$RUNNER_TEMP/pr687-semantic/header-controls" ssa,memory 2>&1 | tee "$RUNNER_TEMP/pr687-semantic/headers.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: pr687-semantic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr687-semantic
          retention-days: 7
          if-no-files-found: error
  llvm18-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: llvm/llvm-project
          ref: c13b7485b87909fcf739f62cfa382b55407433c0
          path: llvm
          sparse-checkout: clang/lib/Headers
          persist-credentials: false
      - name: Run the same controls with the matching Clang 18 compiler
        run: |
          set -euo pipefail
          command -v clang-18
          python3 transport/.github/pr687-semantic/header-controls.py unused llvm/clang/lib/Headers "$RUNNER_TEMP/pr687-llvm18" clang
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: pr687-llvm18-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr687-llvm18
          retention-days: 7
          if-no-files-found: error
