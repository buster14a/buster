name: Self-host audit evidence

on:
  push:
    branches: [work/self-host-audit-20260907]
    paths: [.github/workflows/self-host-audit-work.yml]

permissions:
  contents: read

jobs:
  source:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ebfdd11705bc470564e726857e498f1c82aa746c
      - name: Capture exact integration base
        run: git bundle create "$RUNNER_TEMP/buster-source.bundle" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: self-host-audit-current-main
          path: ${{ runner.temp }}/buster-source.bundle
          retention-days: 1
          if-no-files-found: error
