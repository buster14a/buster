name: Self-host audit evidence

on:
  push:
    branches: [work/self-host-audit-20260907]
    paths: [.github/workflows/self-host-audit-work.yml]

permissions:
  contents: write

jobs:
  source:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Publish exact locally resolved rebase without transfer files
        env:
          IMPLEMENTATION_BRANCH: fix/self-host-deterministic-fixed-point
        run: |
          cp .audit-transfer/integration-driver.patch "$RUNNER_TEMP/integration-driver.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --detach acde6e0c7cbc582dd65ab8c7b1cda368e386965f
          if ! git rebase ebfdd11705bc470564e726857e498f1c82aa746c; then
            test "$(git diff --name-only --diff-filter=U)" = src/buster/lib/compiler/driver/driver.c
            git checkout --ours -- src/buster/lib/compiler/driver/driver.c
            git apply --index "$RUNNER_TEMP/integration-driver.patch"
            GIT_EDITOR=true git rebase --continue
          fi
          git diff --check
          test "$(git write-tree)" = 2d6a2b11adc70d89c3584a69e96e564f26a43b90
          git push origin "HEAD:refs/heads/$IMPLEMENTATION_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/implementation-sha.txt"
          git bundle create "$RUNNER_TEMP/buster-source.bundle" HEAD
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: self-host-audit-rebased-source
          path: |
            ${{ runner.temp }}/buster-source.bundle
            ${{ runner.temp }}/implementation-sha.txt
          retention-days: 1
          if-no-files-found: error
