name: Self-host audit evidence

on:
  push:
    branches: [work/self-host-audit-20260907]
    paths: [.github/workflows/self-host-audit-work.yml]

concurrency:
  group: self-host-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  source:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Export integrated candidate without replacing the PR before verification
        env:
          IMPLEMENTATION_BRANCH: work/self-host-implementation-transfer-20260907
          CANDIDATE_BRANCH: work/self-host-final-tree-20260907
          EXPECTED_HEAD: 5fc20fed8685b2d399897d554168cb55ea32e3a4
          MAIN_HEAD: be0f9054550d05b6366c14307a0b72d3b1592db3
        run: |
          cp .audit-transfer/integration-driver.patch "$RUNNER_TEMP/integration-driver.patch"
          openssl base64 -d -A < .audit-transfer/self-host-harden.b64 | gzip -dc > "$RUNNER_TEMP/harden.patch"
          echo "0a5d0d97c08a24a7c91fcb0ac37e510b6f00c076ae6f60a8381b586fbeeaaad9  $RUNNER_TEMP/harden.patch" | sha256sum -c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --detach acde6e0c7cbc582dd65ab8c7b1cda368e386965f
          if ! git rebase ebfdd11705bc470564e726857e498f1c82aa746c; then
            test "$(git diff --name-only --diff-filter=U)" = src/buster/lib/compiler/driver/driver.c
            git checkout --ours -- src/buster/lib/compiler/driver/driver.c
            git add -- src/buster/lib/compiler/driver/driver.c
            git apply --index "$RUNNER_TEMP/integration-driver.patch"
            GIT_EDITOR=true git rebase --continue
          fi
          test "$(git write-tree)" = 2d6a2b11adc70d89c3584a69e96e564f26a43b90
          git apply --index "$RUNNER_TEMP/harden.patch"
          git diff --check --cached
          test "$(git write-tree)" = 4182045dd548770193faceb0004d46b709375625
          git commit -m 'bootstrap: stop at invalid MIR before diagnostic dereference or allocation'
          git cherry-pick "$EXPECTED_HEAD"
          git merge --no-edit "$MAIN_HEAD"
          git diff --check "$MAIN_HEAD"
          test "$(git ls-remote origin refs/heads/$IMPLEMENTATION_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -p "$EXPECTED_HEAD" -p "$MAIN_HEAD" -m 'bootstrap: integrate current canonical preparation and stop at invalid MIR')
          git switch --detach "$commit"
          # Stage the candidate only. Publishing the PR through the connector
          # after verification produces a real push event for its required CI;
          # a workflow-token push alone must not be mistaken for tested CI.
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/implementation-sha.txt"
      - name: Export exact source even when integration needs resolution
        if: ${{ always() }}
        run: |
          git bundle create "$RUNNER_TEMP/buster-source.bundle" --all HEAD
          git diff > "$RUNNER_TEMP/integration.diff"
          git status --short > "$RUNNER_TEMP/integration-status.txt"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: self-host-audit-rebased-source
          path: |
            ${{ runner.temp }}/buster-source.bundle
            ${{ runner.temp }}/implementation-sha.txt
            ${{ runner.temp }}/integration.diff
            ${{ runner.temp }}/integration-status.txt
          retention-days: 1
          if-no-files-found: error
