name: Research probe - C frontend validate-then-discard cost

# Branch-only research workflow. Measures what the separate
# c_parse_validate_lowering_constraints pass costs on valid input, with exact
# work-ledger counts, deterministic callgrind Ir and wall-time pairs, on a
# GitHub-hosted runner. It builds a probe compiler whose only change removes
# that pass; the probe is never a production candidate. Not for main.

on:
  # push trigger on the probe branch only: workflow_dispatch cannot be
  # dispatched until the file exists on the default branch.
  push:
    branches:
      - devin/rederive-validation-probe
  workflow_dispatch:
    inputs:
      pairs:
        description: Alternating wall-time pairs per workload
        required: false
        default: "8"
      sqlite:
        description: Also measure the pinned SQLite 3.53.4 amalgamation
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  probe:
    # The maintained Linux CI image (self-host-audit.yml uses the same label).
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install host tools (not project dependencies)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes valgrind time
          clang --version
          valgrind --version
          /usr/bin/time --version

      - name: Record the source identity against the pinned revision
        shell: bash
        env:
          PINNED: 94976eccad9c31776cf264a33dcda960dd8ed51a
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          git rev-parse HEAD
          git rev-parse "HEAD^{tree}"
          # The compiler source and the workload must equal the pinned revision; only probe files are added.
          git diff --quiet "$PINNED" HEAD -- src CMakeLists.txt build.c tools/work_ledger
          git diff --stat "$PINNED" HEAD | tee "$RUNNER_TEMP/out/branch-vs-pinned.txt"

      - name: Prepare the probe checkout
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/probe-src" HEAD
          python3 docs/performance-audits/evidence/rederive-validation-probe/apply_probe.py "$RUNNER_TEMP/probe-src"
          git -C "$RUNNER_TEMP/probe-src" diff --stat

      - name: Stage the pinned SQLite amalgamation
        if: ${{ (inputs.sqlite || 'true') == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external
          curl --fail --location --retry 3 https://www.sqlite.org/2026/sqlite-amalgamation-3530400.zip -o external/sqlite-amalgamation.zip
          printf '%s  %s\n' 1e71ddf93849c6a6ecf58b827c0692073d2dd7ee40196158068f7b29f422e87d external/sqlite-amalgamation.zip | sha256sum --check
          unzip -q external/sqlite-amalgamation.zip -d external
          printf '%s  %s\n' b1dd5d74ec7f29055a6684fa06fb3c2f6821c87dd38f9a458dfd2e8a1db28189 external/sqlite-amalgamation-3530400/sqlite3.c | sha256sum --check

      - name: Run the probe
        shell: bash
        run: |
          set -euo pipefail
          SQLITE_ROOT=""
          if [[ "${{ inputs.sqlite || 'true' }}" == "true" ]]; then SQLITE_ROOT="$PWD/external/sqlite-amalgamation-3530400"; fi
          bash docs/performance-audits/evidence/rederive-validation-probe/run_probe.sh \
            "$PWD" "$RUNNER_TEMP/probe-src" "$RUNNER_TEMP/out" "${{ inputs.pairs || '8' }}" "$SQLITE_ROOT" 2>&1 | tee "$RUNNER_TEMP/out/run.log"

      - name: Summarize
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/performance-audits/evidence/rederive-validation-probe/summarize.py "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/out/summary.txt" || true

      - name: Drop compiler binaries from the artifact
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/out/base" "$RUNNER_TEMP/out/probe" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: rederive-validation-probe
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30
