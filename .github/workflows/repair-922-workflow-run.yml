name: Repair PR 922 workflow handoff

on:
  push:
    branches:
      - codex/869-merge-conflict-preflight

permissions:
  contents: write

concurrency:
  group: repair-pr-922-workflow-handoff
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.repository == 'buster14a/buster' && github.ref == 'refs/heads/codex/869-merge-conflict-preflight' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out exact repair commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply, test, commit, and publish the repair
        run: python3 -B tools/repair_pr922_workflow_run.py
