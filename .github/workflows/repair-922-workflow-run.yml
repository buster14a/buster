name: Repair PR 922 workflow handoff

on:
  push:
    branches:
      - codex/869-merge-conflict-preflight

permissions:
  contents: read

concurrency:
  group: repair-pr-922-workflow-handoff
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.repository == 'buster14a/buster' && github.ref == 'refs/heads/codex/869-merge-conflict-preflight' }}
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out exact repair commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply, test, commit, and publish the repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          python3 -B tools/repair_pr922_workflow_run.py
