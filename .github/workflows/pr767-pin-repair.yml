name: PR 767 support pin repair

on:
  push:
    branches:
      - claude/clever-cori-qh0b15

permissions:
  contents: write

concurrency:
  group: pr-767-support-pin-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'buster14a/buster'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repair revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Apply and validate approved support identity
        env:
          EXPECTED_OLD: fe460473d2bb78bd4441e16e55e66d88aa519e4651d693ebac989f54fe9df8e7
          EXPECTED_NEW: 3bffe0b45d111aba7dba84f3667243358c45c54a4d11cb97a1149ce882f492b4
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          binding_path = Path('tools/native_retirement_performance_binding.py')
          workflow_path = Path('.github/workflows/pr767-pin-repair.yml')
          support_path = Path('docs/native-retirement-support-v1.tsv')
          old_digest = os.environ['EXPECTED_OLD']
          new_digest = os.environ['EXPECTED_NEW']
          old_line = f'SUPPORT_DECLARATION_SHA256 = "{old_digest}"'
          new_line = f'SUPPORT_DECLARATION_SHA256 = "{new_digest}"'
          binding = binding_path.read_text(encoding='utf-8')
          if binding.count(old_line) != 1:
              raise SystemExit('refusing repair: expected reviewed pin occurs other than once')
          actual_digest = hashlib.sha256(support_path.read_bytes()).hexdigest()
          if actual_digest != new_digest:
              raise SystemExit(f'refusing repair: support declaration is {actual_digest}, expected {new_digest}')
          binding_path.write_text(binding.replace(old_line, new_line), encoding='utf-8')
          workflow_path.unlink()
          PY
          python3 tools/native_retirement_performance_identity_test.py
          git diff --check
      - name: Commit the reviewed pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/native_retirement_performance_binding.py .github/workflows/pr767-pin-repair.yml
          git commit -m 'Repin native retirement support declaration'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
