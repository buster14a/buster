name: PR 734 static metadata fix

on:
  push:
    branches:
      - fix/722-post-tag-specifiers
    paths:
      - '.github/workflows/pr-734-static-metadata-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'buster14a/buster'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/722-post-tag-specifiers
          fetch-depth: 0

      - name: Preserve file-scope static storage metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/buster/lib/compiler/frontend/c/c_parse.c')
          text = path.read_text()

          old_scan = '''        bool is_thread_local = false;
          if (kind == C_DECLARATION_OBJECT &&
              c_parse_token_bitmap_any(declaration_range_words, declaration->token_start, declaration->token_start + declaration->token_count))
          {
              for (u32 token_index = declaration->token_start; token_index < declaration->token_start + declaration->token_count; token_index += 1)
              {
                  CToken token = preprocess.tokens[token_index];
                  is_thread_local |= token.kind == C_TOKEN_IDENTIFIER &&
                                     c_token_in_well_known_set(preprocess.spelling_base, token,
                                                               C_PARSE_THREAD_LOCAL_KEYWORDS | C_SYMBOL_WELL_KNOWN_BIT(THREAD_LOCAL_C23));
              }
          }
          '''
          new_scan = '''        bool is_static_storage = false;
          bool is_thread_local = false;
          if (kind == C_DECLARATION_OBJECT &&
              c_parse_token_bitmap_any(declaration_range_words, declaration->token_start, declaration->token_start + declaration->token_count))
          {
              for (u32 token_index = declaration->token_start; token_index < declaration->token_start + declaration->token_count; token_index += 1)
              {
                  CToken token = preprocess.tokens[token_index];
                  is_static_storage |= token.kind == C_TOKEN_IDENTIFIER &&
                                       c_token_in_well_known_set(preprocess.spelling_base, token, C_SYMBOL_WELL_KNOWN_BIT(STATIC));
                  is_thread_local |= token.kind == C_TOKEN_IDENTIFIER &&
                                     c_token_in_well_known_set(preprocess.spelling_base, token,
                                                               C_PARSE_THREAD_LOCAL_KEYWORDS | C_SYMBOL_WELL_KNOWN_BIT(THREAD_LOCAL_C23));
              }
          }
          '''
          if text.count(old_scan) != 1:
              raise SystemExit(f'expected one file-scope storage scan, found {text.count(old_scan)}')
          text = text.replace(old_scan, new_scan)

          old_entity = '''            .is_definition = declaration->is_definition,
              .is_thread_local = is_thread_local,
          '''
          new_entity = '''            .is_definition = declaration->is_definition,
              .is_static_storage = is_static_storage,
              .is_thread_local = is_thread_local,
          '''
          if text.count(old_entity) != 1:
              raise SystemExit(f'expected one file-scope entity initializer, found {text.count(old_entity)}')
          text = text.replace(old_entity, new_entity)
          path.write_text(text)
          PY
          git diff --check

      - name: Commit parser fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/buster/lib/compiler/frontend/c/c_parse.c
          git commit -m 'fix(c): preserve post-tag static storage metadata'
          git push origin HEAD:fix/722-post-tag-specifiers
