name: PR 734 static metadata fix

on:
  push:
    branches:
      - fix/722-post-tag-specifiers
    paths:
      - '.github/workflows/pr-734-static-metadata-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'buster14a/buster'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/722-post-tag-specifiers
          fetch-depth: 0

      - name: Preserve file-scope static storage metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/buster/lib/compiler/frontend/c/c_parse.c')
          text = path.read_text()

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one {label}, found {count}')
              return source.replace(old, new)

          text = replace_once(
              text,
              "        bool is_thread_local = false;\n        if (kind == C_DECLARATION_OBJECT &&",
              "        bool is_static_storage = false;\n        bool is_thread_local = false;\n        if (kind == C_DECLARATION_OBJECT &&",
              'file-scope storage declaration',
          )
          text = replace_once(
              text,
              "                CToken token = preprocess.tokens[token_index];\n                is_thread_local |= token.kind == C_TOKEN_IDENTIFIER &&",
              "                CToken token = preprocess.tokens[token_index];\n                is_static_storage |= token.kind == C_TOKEN_IDENTIFIER &&\n                                     c_token_in_well_known_set(preprocess.spelling_base, token, C_SYMBOL_WELL_KNOWN_BIT(STATIC));\n                is_thread_local |= token.kind == C_TOKEN_IDENTIFIER &&",
              'file-scope storage scan body',
          )
          text = replace_once(
              text,
              "            .is_definition = declaration->is_definition,\n            .is_thread_local = is_thread_local,",
              "            .is_definition = declaration->is_definition,\n            .is_static_storage = is_static_storage,\n            .is_thread_local = is_thread_local,",
              'file-scope entity initializer',
          )
          path.write_text(text)
          PY
          git diff --check

      - name: Commit parser fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/buster/lib/compiler/frontend/c/c_parse.c
          git commit -m 'fix(c): preserve post-tag static storage metadata'
          git push origin HEAD:fix/722-post-tag-specifiers
