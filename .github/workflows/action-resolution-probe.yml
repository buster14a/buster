name: Action resolution probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: Action resolution continue-on-error probe
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Invoke local action with unavailable nested dependency
        id: resolution
        continue-on-error: true
        uses: ./.github/actions/action-resolution-probe
      - name: Retry unavailable nested dependency once
        id: resolution_retry
        if: ${{ steps.resolution.outcome == 'failure' && steps.resolution.outputs.entered != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/action-resolution-probe
      - name: Prove both resolution failures returned control
        if: ${{ always() }}
        shell: bash
        env:
          FIRST_OUTCOME: ${{ steps.resolution.outcome }}
          FIRST_CONCLUSION: ${{ steps.resolution.conclusion }}
          FIRST_ENTERED: ${{ steps.resolution.outputs.entered }}
          RETRY_OUTCOME: ${{ steps.resolution_retry.outcome }}
          RETRY_CONCLUSION: ${{ steps.resolution_retry.conclusion }}
          RETRY_ENTERED: ${{ steps.resolution_retry.outputs.entered }}
        run: |
          set -euo pipefail
          printf 'ACTION_RESOLUTION_PROBE first_outcome=%s first_conclusion=%s first_entered=%s retry_outcome=%s retry_conclusion=%s retry_entered=%s\n' \
            "$FIRST_OUTCOME" "$FIRST_CONCLUSION" "$FIRST_ENTERED" \
            "$RETRY_OUTCOME" "$RETRY_CONCLUSION" "$RETRY_ENTERED"
          test "$FIRST_OUTCOME" = failure
          test "$FIRST_CONCLUSION" = success
          test -z "$FIRST_ENTERED"
          test "$RETRY_OUTCOME" = failure
          test "$RETRY_CONCLUSION" = success
          test -z "$RETRY_ENTERED"
