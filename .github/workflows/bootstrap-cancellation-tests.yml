name: Bootstrap cancellation investigation

on:
  pull_request:
    paths:
      - 'tools/bootstrap_wrapper_cases.py'
      - 'tools/bootstrap_wrapper_cases_test.py'
      - '.github/workflows/bootstrap-cancellation-tests.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: bootstrap-cancellation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  cancellation:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: ${{ matrix.os }}
          matrix-index: ${{ strategy.job-index }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Reproduce cancellation with survivor diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python -u tools/bootstrap_wrapper_cases_test.py \
            SchedulerTests.test_cancellation_cleans_tree_before_fixture_removal \
            SchedulerTests.test_cancellation_waits_for_delayed_readiness \
            SchedulerTests.test_cancellation_cleans_tree_before_fixture_removal \
            SchedulerTests.test_cancellation_waits_for_delayed_readiness \
            SchedulerTests.test_cancellation_cleans_tree_before_fixture_removal \
            SchedulerTests.test_cancellation_waits_for_delayed_readiness \
            SchedulerTests.test_windows_cleanup_waits_for_descendant_handles_before_fixture_removal \
            SchedulerTests.test_windows_descendant_wait_failure_is_not_success \
            SchedulerTests.test_windows_tree_capture_failure_still_reaps_direct_child \
            SchedulerTests.test_windows_descendant_wait_shares_deadline_and_keeps_all_identities -v
