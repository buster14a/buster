name: Issue 1234 candidate validation
on:
  push:
    branches: [codex/1234-vla-runtime-validation]
permissions:
  contents: read
jobs:
  validate:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: 6bf047585225078545a4b3bbebd9d0b99ca8b163
      BASELINE_SHA: 7157b1d581f397c0b7f9d0d4ae98536b9179b77a
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Require CI admission
        env:
          CI_ENABLED: ${{ vars.GH_ACTIONS_CI_ENABLED }}
        run: test "$CI_ENABLED" = true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6bf047585225078545a4b3bbebd9d0b99ca8b163
          path: candidate
          persist-credentials: false
      - name: Install Clang 22 from LLVM's signed package repository
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          gpg --dearmor --output "$RUNNER_TEMP/llvm-key.gpg" "$RUNNER_TEMP/llvm-key.asc"
          sudo install -m 0644 "$RUNNER_TEMP/llvm-key.gpg" /usr/share/keyrings/buster-validation-llvm.gpg
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/buster-validation-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/buster-validation-llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-22 libclang-rt-22-dev lld-22
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - name: Record exact revisions and build hosted drivers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vla-validation"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          clang --version | tee "$RUNNER_TEMP/vla-validation/clang.txt"
          printf 'candidate=%s\nbaseline=%s\n' "$CANDIDATE_SHA" "$BASELINE_SHA" | tee "$RUNNER_TEMP/vla-validation/revisions.txt"
          (cd candidate && clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-candidate-build")
      - name: Build candidate compiler
        working-directory: candidate
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-candidate-build" generate --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/buster-candidate-build" build --config Release -t ide 2>&1 | tee "$RUNNER_TEMP/vla-validation/candidate-build.log"
      - name: Run embedded VLA source with Clang and all sixteen Buster profiles
        working-directory: candidate
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/vla-validation/vla-profiles.log"
          import ast
          import os
          import pathlib
          import re
          import subprocess
          text = pathlib.Path("src/buster/tests/compiler/driver/driver_test.c").read_text()
          body = text.split("UnitTestResult compiler_driver_test_vla_runtime_types(", 1)[1]
          literal = body.split("String8 source = S8(", 1)[1].split("\n    String8 input", 1)[0].rsplit(");", 1)[0]
          source = "".join(ast.literal_eval(part) for part in re.findall(r'"(?:[^"\\]|\\.)*"', literal))
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "vla-validation"
          fixture = root / "vla-runtime-types.c"
          fixture.write_text(source)
          oracle = root / "clang-oracle"
          subprocess.run(["clang", "-std=gnu17", "-O0", str(fixture), "-o", str(oracle)], check=True)
          subprocess.run([str(oracle)], check=True, timeout=30)
          failures = 0
          for optimization in ("O0", "O2"):
              for mode in ("none", "mir-stack", "fast", "quality"):
                  for frontend in ("-fno-frontend-ssa", "-ffrontend-ssa"):
                      executable = root / (optimization + "-" + mode + "-" + frontend)
                      args = ["build/Release/ide", "cc", "-" + optimization,
                              "-fregister-allocator=" + mode, frontend, "-fverify-codegen"]
                      if mode != "none":
                          args.append("-fno-machine-fallback")
                      args.extend(["-o", str(executable), str(fixture)])
                      compiled = subprocess.run(args, timeout=120)
                      status = compiled.returncode
                      if status == 0:
                          status = subprocess.run([str(executable)], timeout=30).returncode
                      print("VLA_PROFILE optimization=" + optimization + " allocator=" + mode
                            + " frontend=" + frontend + " status=" + str(status), flush=True)
                      failures += status != 0
          negative = root / "unsupported-nested-pointer.c"
          negative.write_text("int f(int n, void *p) { return (int (**)[n])p != 0; }\n")
          for frontend in ("-fno-frontend-ssa", "-ffrontend-ssa"):
              checked = subprocess.run(["build/Release/ide", "cc", frontend, "-c", "-o",
                                        str(root / "unsupported.o"), str(negative)], capture_output=True, text=True)
              refused = checked.returncode != 0 and "nested pointer-to-VLA casts are not supported" in checked.stderr
              print("VLA_UNSUPPORTED frontend=" + frontend + " refused=" + str(refused), flush=True)
              failures += not refused
          raise SystemExit(bool(failures))
          PY
      - name: Retain focused results immediately
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1234-focused-6bf047585225078545a4b3bbebd9d0b99ca8b163
          path: ${{ runner.temp }}/vla-validation/
          if-no-files-found: error
          retention-days: 7
      - name: Candidate full Release suite
        if: ${{ !cancelled() }}
        working-directory: candidate
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-candidate-build" build --config Release -t test_all 2>&1 | tee "$RUNNER_TEMP/vla-validation/candidate-tests.log"
      - name: Candidate self-host fixed point
        if: ${{ !cancelled() }}
        working-directory: candidate
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-candidate-build" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/vla-validation/candidate-selfhost.log"
      - name: Candidate ASan UBSan full suite
        if: ${{ !cancelled() }}
        working-directory: candidate
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-candidate-build" generate --build-directory build/sanitized --cc clang --ci --sanitize --linker DEFAULT
          "$RUNNER_TEMP/buster-candidate-build" build --build-directory build/sanitized -t test_all 2>&1 | tee "$RUNNER_TEMP/vla-validation/candidate-sanitized-tests.log"
      - name: Retain exact candidate evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1234-validation-6bf047585225078545a4b3bbebd9d0b99ca8b163
          path: ${{ runner.temp }}/vla-validation/
          if-no-files-found: error
          retention-days: 7
