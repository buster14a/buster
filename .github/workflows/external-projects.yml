name: External projects after merge
# Every landed revision retains its own OS jobs; no main-burst cancellation.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: external-projects-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  linux:
    name: Linux x86-64 external projects
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      BUSTER_TEST_JOBS: '2'
      BUSTER_MATRIX_THREADS: '2'
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ubuntu-26.04
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Retain exact source for review and reproduction
        id: source_identity
        shell: bash
        env:
          SUBMITTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SUBMITTED_SHA"
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          git rev-parse 'HEAD^{tree}' > evidence/tree.txt
          git archive --format=tar HEAD > evidence/source.tar
          sha256sum evidence/source.tar > evidence/source.tar.sha256
      - name: Retain machine records in existing evidence
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: retain
          retention-directory: evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-linux-source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          retention-days: 14
          if-no-files-found: error
      - name: Publish complete assignment before preparation
        if: ${{ !cancelled() }}
        run: |
          mkdir -p evidence/projects evidence/git .ci-tools
          cp docs/external-project-ci.md evidence/assignment.md
          printf 'All scheduled projects initially not-run; project records replace this only after actual execution.\n' > evidence/project-state.txt
          printf 'result=not-run\n' > evidence/ffmpeg.status
      - name: Prepare pristine cJSON input outside timing
        if: ${{ !cancelled() }}
        id: cjson
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DaveGamble/cJSON
          ref: c859b25da02955fef659d658b8f324b5cde87be3
          path: external/cjson
          persist-credentials: false
      - name: Record actual checkout identity 2
        if: ${{ !cancelled() }}
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: external/cjson
          source-repository: DaveGamble/cJSON
      - name: Prepare pristine Lua Git input outside timing
        id: lua_git
        if: ${{ !cancelled() }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lua/lua
          ref: 6e22fedb74cf0c9b6656e9fce8b7331db847c605
          path: external/lua-git
          persist-credentials: false
      - name: Record actual checkout identity 3
        if: ${{ !cancelled() }}
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: external/lua-git
          source-repository: lua/lua
      - name: Prepare authenticated Lua release outside timing
        id: lua_release
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external
          curl --fail --location https://www.lua.org/ftp/lua-5.4.8.tar.gz -o external/lua.tar.gz
          printf '%s  %s\n' 4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae external/lua.tar.gz | sha256sum --check
          tar -xzf external/lua.tar.gz -C external
      - name: Prepare explicit native dependencies and descriptor inputs
        id: native_dependencies
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci_apt.py readline --out evidence/apt-readline

      - name: Prepare SQLite inputs outside timing
        id: sqlite
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external
          curl --fail --location https://www.sqlite.org/2026/sqlite-amalgamation-3530400.zip -o external/sqlite-amalgamation.zip
          curl --fail --location https://www.sqlite.org/2026/sqlite-src-3530400.zip -o external/sqlite-src.zip
          printf '%s  %s\n' 1e71ddf93849c6a6ecf58b827c0692073d2dd7ee40196158068f7b29f422e87d external/sqlite-amalgamation.zip | sha256sum --check
          printf '%s  %s\n' d18fa15aec74d8c17e1463f861095adc01b5ad190256acb4f91d22f0368d232b external/sqlite-src.zip | sha256sum --check
          sha256sum external/sqlite-amalgamation.zip external/sqlite-src.zip > evidence/sqlite-archives.sha256
          unzip -q external/sqlite-amalgamation.zip -d external
          unzip -q external/sqlite-src.zip -d external
          # Admission uses test_sqlite's existing per-file/manifest pins, not
          # these freshly recorded transport hashes as expected identities.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ !cancelled() }}
        with:
          repository: madler/zlib
          ref: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          path: external/zlib
          persist-credentials: false
      - name: Record actual checkout identity 3
        if: ${{ !cancelled() }}
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: external/zlib
          source-repository: madler/zlib
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ !cancelled() }}
        with:
          repository: nothings/stb
          ref: 2c980bb59875b0d32144a71867fbdebb2f77cd20
          path: external/stb
          persist-credentials: false
      - name: Record actual checkout identity 4
        if: ${{ !cancelled() }}
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: external/stb
          source-repository: nothings/stb
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ !cancelled() }}
        with:
          repository: bellard/quickjs
          ref: 3d5e064e9dd67c70f7962836505a7fa067bf0a4e
          path: external/quickjs
          persist-credentials: false
      - name: Record actual checkout identity 6
        if: ${{ !cancelled() }}
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: external/quickjs
          source-repository: bellard/quickjs
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ !cancelled() }}
        with:
          repository: EpicGames/raddebugger
          ref: f6b4a38134652886239b91f940cd7a67fedf689d
          path: external/raddebugger
          persist-credentials: false
      - name: Record actual checkout identity 2
        if: ${{ !cancelled() }}
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: external/raddebugger
          source-repository: EpicGames/raddebugger
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ !cancelled() }}
        with:
          repository: git/git
          ref: c44beea485f0f2feaf460e2ac87fdd5608d63cf0
          path: external/git
          persist-credentials: false
      - name: Record actual upstream identity
        if: ${{ !cancelled() }}
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: external/git
          source-repository: git/git
      - name: Build trusted compiler and native harness serially
        id: compiler
        if: ${{ !cancelled() && steps.source_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-tools
          clang -fwrapv -fno-strict-aliasing -funsigned-char -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o .ci-tools/build
          .ci-tools/build external_projects --self-test
          .ci-tools/build generate --ci --cc clang --linker DEFAULT
          .ci-tools/build build --config Release -t ide
          .ci-tools/build bench_throughput self-test
          clang --version > evidence/toolchain.txt
          sha256sum build/Release/ide > evidence/compiler.sha256
      - name: Baseline self-host fixed point
        id: selfhost
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          .ci-tools/build test_self_host --config Release 2>&1 | tee evidence/self-host.log
      - name: Registered compiler regressions and full Release suite
        id: units
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          .ci-tools/build build --config Release -t test_all 2>&1 | tee evidence/test-all.log
      - name: Retain compiler evidence immediately
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-linux-compiler-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence
            build/Release/ide
            build/CMakeCache.txt
            build/compile_commands.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Preserve portfolio inputs and component license records
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          for project in cjson zlib stb lua-git quickjs; do
            git -C "external/$project" rev-parse HEAD > "evidence/$project.commit"
            git -C "external/$project" rev-parse 'HEAD^{tree}' > "evidence/$project.tree"
            git -C "external/$project" status --porcelain --untracked-files=all > "evidence/$project.status"
            test ! -s "evidence/$project.status"
            git -C "external/$project" ls-tree -r HEAD > "evidence/$project.files"
          done
          cp external/cjson/LICENSE evidence/cjson-LICENSE
          cp external/cjson/tests/unity/docs/license.txt evidence/cjson-unity-LICENSE
          cp external/cjson/tests/json-patch-tests/README.md evidence/cjson-patch-fixtures-LICENSE
          cp external/zlib/LICENSE evidence/zlib-LICENSE
          cp external/stb/LICENSE evidence/stb-LICENSE
          cp external/lua-git/lua.h evidence/lua-license-header
          cp external/lua-git/testes/all.lua evidence/lua-suite-license
          cp external/quickjs/LICENSE evidence/quickjs-LICENSE
          cp external/sqlite-src-3530400/LICENSE.md evidence/sqlite-LICENSE.md
          cp external/sqlite-src-3530400/autosetup/LICENSE evidence/sqlite-autosetup-LICENSE
          clang --version > evidence/clang.txt
      - name: cjson independent project result
        id: oracle_cjson
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' && steps.cjson.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          .ci-tools/build external_projects cjson 2>&1 | tee evidence/cjson.log
      - name: Retain cjson evidence immediately
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-linux-cjson-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/cjson*
            evidence/projects/cjson.tsv
            build/cjson-*
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: zlib independent project result
        id: oracle_zlib
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          .ci-tools/build external_projects zlib 2>&1 | tee evidence/zlib.log
      - name: Retain zlib evidence immediately
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-linux-zlib-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/zlib*
            evidence/projects/zlib.tsv
            build/zlib-*
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: stb independent project result
        id: oracle_stb
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          .ci-tools/build external_projects stb 2>&1 | tee evidence/stb.log
      - name: Retain stb evidence immediately
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-linux-stb-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/stb*
            evidence/projects/stb.tsv
            build/stb-*
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: lua independent project result
        id: oracle_lua
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' && steps.lua_git.outcome == 'success' && steps.lua_release.outcome == 'success' && steps.native_dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          .ci-tools/build external_projects lua 2>&1 | tee evidence/lua.log
      - name: Retain lua evidence immediately
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-linux-lua-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/lua*
            evidence/projects/lua.tsv
            build/lua-*
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: quickjs independent project result
        id: oracle_quickjs
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          .ci-tools/build external_projects quickjs 2>&1 | tee evidence/quickjs.log
      - name: Retain quickjs evidence immediately
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-linux-quickjs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/quickjs*
            evidence/projects/quickjs.tsv
            build/quickjs-*
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: sqlite independent project result
        id: oracle_sqlite
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' && steps.sqlite.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          .ci-tools/build external_projects sqlite 2>&1 | tee evidence/sqlite.log
      - name: Retain sqlite evidence immediately
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-linux-sqlite-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/sqlite*
            evidence/projects/sqlite.tsv
            build/sqlite-*
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Stage cJSON descriptor input
        id: descriptor_inputs
        if: ${{ !cancelled() && steps.cjson.outcome == 'success' }}
        run: |
          mkdir -p external/cjson-throughput/generated
          cp external/cjson/cJSON.c external/cjson/cJSON.h external/cjson/cJSON_Utils.c external/cjson/cJSON_Utils.h external/cjson-throughput/
          cp tests/basic_cjson_roundtrip.c external/cjson-throughput/generated/roundtrip.c
          touch evidence/cjson.log evidence/lua.log evidence/sqlite.log
      - name: Record admission outcomes without promoting failures
        if: always()
        shell: bash
        env:
          APT_INPUTS: ${{ steps.native_dependencies.outcome }}
          COMPILER: ${{ steps.compiler.outcome }}
          CJSON: ${{ steps.oracle_cjson.outcome }}
          LUA: ${{ steps.oracle_lua.outcome }}
          SQLITE: ${{ steps.oracle_sqlite.outcome }}
        run: |
          printf 'apt-inputs=%s\ncompiler=%s\ncjson=%s\nlua=%s\nsqlite=%s\n' "$APT_INPUTS" "$COMPILER" "$CJSON" "$LUA" "$SQLITE" | tee evidence/outcomes.txt
          printf 'Hosted functional qualification only; no dedicated-host timing acceptance.\n' >> "$GITHUB_STEP_SUMMARY"
          cat evidence/outcomes.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Verify descriptor and staged-input preflights
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' && steps.descriptor_inputs.outcome == 'success' && steps.native_dependencies.outcome == 'success' }}
        shell: bash
        env:
          CJSON: ${{ steps.oracle_cjson.outcome }}
          LUA: ${{ steps.oracle_lua.outcome }}
          SQLITE: ${{ steps.oracle_sqlite.outcome }}
        run: |
          set -euo pipefail
          outcome() {
            case "$1" in
              success) printf 'pass\n' ;;
              failure) printf 'failed\n' ;;
              *) printf 'unavailable\n' ;;
            esac
          }
          .ci-tools/build bench_throughput check-workload tools/throughput/workloads/cjson-1.7.19.workload \
            --source-root external/cjson-throughput --compiler build/Release/ide --evidence evidence/cjson.log \
            --evidence-outcome "$(outcome "$CJSON")" > evidence/cjson-preflight.json
          .ci-tools/build bench_throughput check-workload tools/throughput/workloads/lua-5.4.8.workload \
            --source-root external/lua-5.4.8/src --compiler build/Release/ide --evidence evidence/lua.log \
            --evidence-outcome "$(outcome "$LUA")" > evidence/lua-preflight.json
          .ci-tools/build bench_throughput check-workload tools/throughput/workloads/sqlite-3.53.4.workload \
            --source-root external/sqlite-amalgamation-3530400 --compiler build/Release/ide --evidence evidence/sqlite.log \
            --evidence-outcome "$(outcome "$SQLITE")" > evidence/sqlite-preflight.json
          grep -F '"admitted":false' evidence/cjson-preflight.json evidence/lua-preflight.json evidence/sqlite-preflight.json
      - name: Generate parsed closure manifests
        id: closures
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' && steps.descriptor_inputs.outcome == 'success' && steps.native_dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          closure="$PWD/evidence/closures"
          mkdir -p "$closure"
          manifest_begin() {
            local path=$1 kind=$2 identity=$3 operations=$4
            printf 'schema=buster-throughput-identity-v1\nkind=%s\nidentity=%s\noperation=%s\n' \
              "$kind" "$identity" "$operations" > "$path"
          }
          manifest_argument() {
            printf 'argument=%s|%s\n' "$2" "$3" >> "$1"
          }
          manifest_fact() {
            printf 'fact=%s\n' "$2" >> "$1"
          }
          manifest_file() {
            local resolved hash bytes
            resolved=$(readlink -f "$2")
            test -f "$resolved" && test ! -L "$resolved"
            hash=$(sha256sum "$resolved" | cut -d' ' -f1)
            bytes=$(stat -c '%s' "$resolved")
            printf 'file=%s\t%s\t%s\n' "$resolved" "$hash" "$bytes" >> "$1"
          }
          manifest_files_under() {
            local path=$1 root=$2 list
            test -d "$root"
            list=$(mktemp)
            if ! find -L "$root" -type f -print0 | sort -z > "$list"; then
              rm -f "$list"
              return 1
            fi
            while IFS= read -r -d '' file; do
              manifest_file "$path" "$file"
            done < "$list"
            rm -f "$list"
          }
          compiler="$PWD/build/Release/ide"
          resource="$closure/resource.identity"
          manifest_begin "$resource" resource 'compiler-binary-bound;complete-header-closure-required-at-admission' \
            source-to-object,source-to-linked-executable
          manifest_argument "$resource" source-to-object -ffrontend-ssa
          manifest_argument "$resource" source-to-linked-executable -ffrontend-ssa
          manifest_file "$resource" "$compiler"
          resource_include="$(clang -print-resource-dir)/include"
          manifest_files_under "$resource" "$resource_include"

          sysroot="$closure/sysroot.identity"
          manifest_begin "$sysroot" sysroot runtime-required \
            source-to-object,source-to-linked-executable
          manifest_argument "$sysroot" source-to-object --target=x86_64-unknown-linux-gnu
          manifest_argument "$sysroot" source-to-linked-executable --target=x86_64-unknown-linux-gnu
          manifest_files_under "$sysroot" /usr/include
          if test -d /usr/local/include; then manifest_files_under "$sysroot" /usr/local/include; fi

          sdk="$closure/sdk.identity"
          manifest_begin "$sdk" sdk not-applicable-linux source-to-object,source-to-linked-executable
          manifest_fact "$sdk" not-applicable-linux

          environment="$closure/environment.identity"
          manifest_begin "$environment" environment 'runtime-required;sanitized-env-and-locale-required-at-admission' \
            source-to-object,source-to-linked-executable,runtime
          manifest_fact "$environment" 'env:LC_ALL=C'
          manifest_fact "$environment" 'env:TZ=UTC'
          manifest_fact "$environment" "env:PATH=$PATH"

          runtime_file() {
            local path
            path=$(ldconfig -p | awk -v name="$1" '$1 == name && !found { path = $NF; found = 1 } END { if (found) print path }')
            test -n "$path"
            case "$1" in
              libreadline.so.8|libtinfo.so.6)
                test "$(readlink -f "$path")" = "$(readlink -f "/usr/lib/x86_64-linux-gnu/$1")" ;;
            esac
            manifest_file "$2" "$path"
          }
          cjson_dependency="$closure/cjson-dependency.identity"
          manifest_begin "$cjson_dependency" dependency libm:native-toolchain source-to-linked-executable
          manifest_argument "$cjson_dependency" source-to-linked-executable -lm
          runtime_file libc.so.6 "$cjson_dependency"
          runtime_file libm.so.6 "$cjson_dependency"

          lua_dependency="$closure/lua-dependency.identity"
          manifest_begin "$lua_dependency" dependency libm+libdl+readline:native-toolchain source-to-linked-executable
          # Bind the existing dependency manifest to authenticated provisioning.
          manifest_file "$lua_dependency" "$PWD/evidence/apt-readline/lock.json"
          manifest_file "$lua_dependency" "$PWD/evidence/apt-readline/pinned.identity.json"
          manifest_file "$lua_dependency" "$PWD/evidence/apt-readline/selected.identity.json"
          for argument in -lm -ldl -lreadline; do
            manifest_argument "$lua_dependency" source-to-linked-executable "$argument"
          done
          for library in libc.so.6 libm.so.6 libdl.so.2 libreadline.so.8; do
            runtime_file "$library" "$lua_dependency"
          done

          sqlite_dependency="$closure/sqlite-dependency.identity"
          manifest_begin "$sqlite_dependency" dependency libm+libdl+pthread:native-toolchain source-to-linked-executable
          for argument in -lm -ldl -lpthread; do
            manifest_argument "$sqlite_dependency" source-to-linked-executable "$argument"
          done
          for library in libc.so.6 libm.so.6 libdl.so.2 libpthread.so.0; do
            runtime_file "$library" "$sqlite_dependency"
          done

          runtime_manifest() {
            local path=$1 identity=$2
            shift 2
            manifest_begin "$path" runtime "$identity" runtime
            # The manifest must retain this placeholder for admission-time binding.
            # shellcheck disable=SC2016
            manifest_argument "$path" runtime '$EXECUTABLE'
            manifest_file "$path" /lib64/ld-linux-x86-64.so.2
            for library in "$@"; do runtime_file "$library" "$path"; done
          }
          runtime_manifest "$closure/cjson-runtime.identity" cjson-glibc-runtime-closure libc.so.6 libm.so.6
          runtime_manifest "$closure/lua-runtime.identity" lua-glibc-readline-runtime-closure \
            libc.so.6 libm.so.6 libdl.so.2 libreadline.so.8 libtinfo.so.6
          runtime_manifest "$closure/sqlite-runtime.identity" sqlite-glibc-runtime-closure \
            libc.so.6 libm.so.6 libdl.so.2 libpthread.so.0
      - name: Admit exact passing functional combinations
        id: admission
        if: ${{ !cancelled() && steps.closures.outcome == 'success' }}
        shell: bash
        env:
          CJSON: ${{ steps.oracle_cjson.outcome }}
          LUA: ${{ steps.oracle_lua.outcome }}
          SQLITE: ${{ steps.oracle_sqlite.outcome }}
        run: |
          set -euo pipefail
          closure="$PWD/evidence/closures"
          source_revision=$(cat evidence/revision.txt)
          qualification="${source_revision}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          : > evidence/admission-outcomes.txt
          admission_failed=0
          admit() {
            local family=$1 descriptor=$2 source=$3 oracle=$4 dependency=$5 runtime=$6
            if test "${!family}" != success; then
              printf '%s oracle did not pass; no admission attempted\n' "$family" >> "evidence/${family,,}-admission-skipped.txt"
              if test "${!family}" = failure; then
                printf '%s=failed-oracle\n' "${family,,}" >> evidence/admission-outcomes.txt
              else
                printf '%s=unavailable\n' "${family,,}" >> evidence/admission-outcomes.txt
              fi
              return
            fi
            if env -i PATH="$PATH" LC_ALL=C TZ=UTC \
              .ci-tools/build bench_throughput admit-workload "$descriptor" \
                --source-root "$source" --compiler build/Release/ide --evidence "$oracle" --evidence-outcome pass \
                --output "evidence/${family,,}-admission-work" --qualification-id "$qualification" \
                --dependency-manifest "$dependency" --resource-manifest "$closure/resource.identity" \
                --sysroot-manifest "$closure/sysroot.identity" --sdk-manifest "$closure/sdk.identity" \
                --environment-manifest "$closure/environment.identity" --runtime-manifest "$runtime" \
                > "evidence/${family,,}-admission.json.tmp" \
                2> "evidence/${family,,}-admission.stderr.log"; then
              mv "evidence/${family,,}-admission.json.tmp" "evidence/${family,,}-admission.json"
              printf '%s=admitted\n' "${family,,}" >> evidence/admission-outcomes.txt
            else
              rm -f "evidence/${family,,}-admission.json.tmp"
              printf '%s=invalid-or-incomplete\n' "${family,,}" >> evidence/admission-outcomes.txt
              admission_failed=1
            fi
          }
          admit CJSON tools/throughput/workloads/cjson-1.7.19.workload external/cjson-throughput \
            evidence/cjson.log "$closure/cjson-dependency.identity" "$closure/cjson-runtime.identity"
          admit LUA tools/throughput/workloads/lua-5.4.8.workload external/lua-5.4.8/src \
            evidence/lua.log "$closure/lua-dependency.identity" "$closure/lua-runtime.identity"
          admit SQLITE tools/throughput/workloads/sqlite-3.53.4.workload external/sqlite-amalgamation-3530400 \
            evidence/sqlite.log "$closure/sqlite-dependency.identity" "$closure/sqlite-runtime.identity"
          cat evidence/admission-outcomes.txt
          exit "$admission_failed"
      - name: Validate hosted functional admission receipts
        if: ${{ !cancelled() && steps.admission.outcome == 'success' && steps.oracle_cjson.outcome == 'success' && steps.oracle_lua.outcome == 'success' && steps.oracle_sqlite.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          expected = {"cjson": (3, 3), "lua": (34, 33), "sqlite": (2, 2)}
          source_revision = Path("evidence/revision.txt").read_text().strip()
          expected_qualification = f"{source_revision}:{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}"
          receipts = []
          for family, counts in expected.items():
              receipt = json.loads(Path(f"evidence/{family}-admission.json").read_text())
              assert receipt["schema"] == "buster-throughput-workload-admission-v1"
              assert receipt["scope"] == "hosted-functional-admission" and receipt["admitted"] is True
              assert receipt["fresh_admission_required"] is False and receipt["family"] == family
              assert receipt["qualification_id"] == expected_qualification
              assert receipt["combination"]["frontend"] == "direct-ssa"
              assert receipt["combination"]["pic"] == "off" and receipt["combination"]["allocator"] == "fast"
              assert [cell["operation"] for cell in receipt["performed_cells"]] == [
                  "source-to-object", "source-to-linked-executable", "runtime"]
              assert receipt["requested_work"]["object"]["source_count"] == counts[0]
              assert receipt["requested_work"]["compile_link"]["source_count"] == counts[1]
              assert any(item["role"] == "runtime-transcript" for item in receipt["artifacts"])
              receipts.append(receipt)
          assert len({receipt["family"] for receipt in receipts}) == 3
          assert any(item["source"] == "sqlite3.c" and item["role"] == "object"
                     for item in receipts[2]["artifacts"])
          PY
      - name: Retain admission evidence immediately
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-linux-admission-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Platform prerequisites
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev
      - name: License intake
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "evidence/git/licenses"
          cp external/git/COPYING external/git/sha1dc/LICENSE.txt external/git/reftable/LICENSE "evidence/git/licenses/"
          cp /usr/share/doc/zlib1g/copyright "evidence/git/licenses/zlib-copyright"
          cp /usr/share/doc/libc6/copyright "evidence/git/licenses/glibc-copyright"
          cat external/git/t/unit-tests/clar/COPYING
          head -30 external/git/xdiff/xdiff.h
          sha256sum "evidence/git/licenses/"*
      - name: Git native controls
        id: git_controls
        if: ${{ !cancelled() }}
        run: |
          clang -std=c11 -Wall -Wextra -Werror -Wno-unused-function -fwrapv -fno-strict-aliasing -funsigned-char tools/git_qualification.c -o .ci-tools/git-qualification
          .ci-tools/git-qualification --self-test
          gcc -std=c11 -Wall -Wextra -Werror -Wno-unused-function -fwrapv -fno-strict-aliasing -funsigned-char tools/git_qualification.c -o .ci-tools/git-controls-gcc
          .ci-tools/git-controls-gcc --self-test
      - name: git independent project result
        id: oracle_git
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' && steps.git_controls.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          .ci-tools/build external_projects git 2>&1 | tee evidence/git.log
      - name: Retain machine records
        if: always()
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: retain
          retention-directory: evidence/git
      - name: Retain exact-source census including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-linux-git-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/projects/git.tsv
            evidence/git.log
            evidence/git/*.log
            evidence/git/*.tsv
            evidence/git/licenses
            evidence/git/machine-specifications
            evidence/git/*-actions
            evidence/git/*/**/.depend/**/*.d
            evidence/git/*/GIT-BUILD-OPTIONS
            evidence/git/*/GIT-CFLAGS
            evidence/git/*/t/test-results
            build/compile_commands.json
            build/CMakeCache.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Install upstream platform libraries
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfreetype6-dev libx11-dev libxext-dev libxfixes-dev libxrandr-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Verify generated intrinsic metadata
        if: ${{ !cancelled() }}
        run: python3 tools/generate_c_vendor_builtins.py --check
      - name: Build distinct RAD compiler configuration
        id: rad_compiler
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: |
          .ci-tools/build generate --build-directory build/rad-compiler --ci --cc clang --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF -DBUSTER_BENCH_ALLOCATIONS=ON
          .ci-tools/build build --build-directory build/rad-compiler --config Release -t ide
      - name: RAD configuration compiler tests
        if: ${{ !cancelled() && steps.rad_compiler.outcome == 'success' }}
        run: |
          set -o pipefail
          .ci-tools/build build --build-directory build/rad-compiler --config Release -t test_all 2>&1 | tee evidence/raddebugger-tests.log
      - name: RAD configuration self-host fixed point
        if: ${{ !cancelled() && steps.rad_compiler.outcome == 'success' }}
        run: |
          set -o pipefail
          .ci-tools/build test_self_host --build-directory build/rad-compiler --config Release 2>&1 | tee evidence/raddebugger-self-host.log
      - name: RAD pristine negative controls
        if: ${{ !cancelled() && steps.rad_compiler.outcome == 'success' }}
        run: .ci-tools/build test_raddebugger --self-test
      - name: rad independent project result
        id: oracle_rad
        if: ${{ !cancelled() && steps.rad_compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          .ci-tools/build external_projects rad 2>&1 | tee evidence/raddebugger.log
      - name: Retain rad evidence immediately
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-linux-rad-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/raddebugger*
            evidence/projects/rad.tsv
            build/raddebugger-*
            build/rad-compiler/CMakeCache.txt
            build/rad-compiler/compile_commands.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Checkout pinned FFmpeg 7.1.3 source after existing Linux stages
        id: ffmpeg_input
        if: ${{ !cancelled() }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FFmpeg/FFmpeg
          ref: f46e514491172d15bd74b4abb1814cd2f05a763e
          path: external/ffmpeg
          persist-credentials: false
      - name: Record pristine FFmpeg source identity
        id: ffmpeg_source_identity
        if: ${{ !cancelled() }}
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: external/ffmpeg
          source-repository: FFmpeg/FFmpeg
      - name: Verify pinned FFmpeg source and retain license text
        id: ffmpeg_source_verified
        if: ${{ !cancelled() && steps.ffmpeg_input.outcome == 'success' && steps.ffmpeg_source_identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/ffmpeg rev-parse HEAD)" = "f46e514491172d15bd74b4abb1814cd2f05a763e"
          git -C external/ffmpeg rev-parse HEAD > evidence/ffmpeg.commit
          git -C external/ffmpeg rev-parse 'HEAD^{tree}' > evidence/ffmpeg.tree
          git -C external/ffmpeg status --porcelain --untracked-files=all --ignored > evidence/ffmpeg.worktree-status
          test ! -s evidence/ffmpeg.worktree-status
          git -C external/ffmpeg ls-tree -r HEAD > evidence/ffmpeg.files
          cp external/ffmpeg/LICENSE.md evidence/ffmpeg-LICENSE.md
      - name: ffmpeg independent project result
        id: oracle_ffmpeg
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' && steps.ffmpeg_input.outcome == 'success' && steps.ffmpeg_source_identity.outcome == 'success' && steps.ffmpeg_source_verified.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          .ci-tools/build external_projects ffmpeg 2>&1 | tee evidence/ffmpeg.log
          status=$?
          set -e
          if test "$status" -eq 0; then
            printf 'result=pass\n' > evidence/ffmpeg.status
          else
            printf 'result=failed;exit=%s\n' "$status" > evidence/ffmpeg.status
          fi
          exit "$status"
      - name: Retain FFmpeg portable evidence immediately
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-linux-ffmpeg-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/ffmpeg.status
            evidence/ffmpeg.commit
            evidence/ffmpeg.tree
            evidence/ffmpeg.worktree-status
            evidence/ffmpeg.files
            evidence/ffmpeg-LICENSE.md
            evidence/projects/ffmpeg.tsv
            evidence/ffmpeg.log
            build/ffmpeg-portable/receipt.txt
            build/ffmpeg-portable/h264-target-actions.tsv
            build/ffmpeg-portable/*.argv
            build/ffmpeg-portable/*.stdout
            build/ffmpeg-portable/*.stderr
            build/ffmpeg-portable/*.status
            build/ffmpeg-portable/reference/config.h
            build/ffmpeg-portable/reference/config_components.h
            build/ffmpeg-portable/reference/ffbuild/config.mak
            build/ffmpeg-portable/reference/ffbuild/config.log
            build/ffmpeg-portable/reference/fate-counts.tsv
            build/ffmpeg-portable/reference/*.argv
            build/ffmpeg-portable/reference/*.stdout
            build/ffmpeg-portable/reference/*.stderr
            build/ffmpeg-portable/reference/*.status
            build/ffmpeg-portable/buster/config.h
            build/ffmpeg-portable/buster/config_components.h
            build/ffmpeg-portable/buster/ffbuild/config.mak
            build/ffmpeg-portable/buster/ffbuild/config.log
            build/ffmpeg-portable/buster/fate-counts.tsv
            build/ffmpeg-portable/buster/*.argv
            build/ffmpeg-portable/buster/*.stdout
            build/ffmpeg-portable/buster/*.stderr
            build/ffmpeg-portable/buster/*.status
            build/ffmpeg-portable/buster/compiler-actions/*.argv
            build/ffmpeg-portable/buster/compiler-actions/*.stdout
            build/ffmpeg-portable/buster/compiler-actions/*.stderr
            build/ffmpeg-portable/buster/compiler-actions/*.status
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Publish Linux OS outcomes
        if: ${{ always() }}
        env:
          CJSON: ${{ steps.oracle_cjson.outcome }}
          ZLIB: ${{ steps.oracle_zlib.outcome }}
          STB: ${{ steps.oracle_stb.outcome }}
          LUA: ${{ steps.oracle_lua.outcome }}
          QUICKJS: ${{ steps.oracle_quickjs.outcome }}
          SQLITE: ${{ steps.oracle_sqlite.outcome }}
          GIT: ${{ steps.oracle_git.outcome }}
          RAD: ${{ steps.oracle_rad.outcome }}
          FFMPEG: ${{ steps.oracle_ffmpeg.outcome }}
        run: |
          mkdir -p evidence
          printf 'sha=%s\nrun=%s\nattempt=%s\ncjson=%s\nzlib=%s\nstb=%s\nlua=%s\nquickjs=%s\nsqlite=%s\ngit=%s\nrad=%s\nffmpeg=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$CJSON" "$ZLIB" "$STB" "$LUA" "$QUICKJS" "$SQLITE" "$GIT" "$RAD" "$FFMPEG" | tee evidence/os-outcomes.txt
          printf 'Skipped means not-run; a started record without completion is incomplete. Inner timeout/failure and test counts are in each harness log. Hosted times are scheduling diagnostics.\n' >> evidence/os-outcomes.txt
          cat evidence/os-outcomes.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Retain machine records in existing evidence 2
        if: always()
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: retain
          retention-directory: evidence
      - name: Retain summary evidence immediately
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-linux-summary-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  macos:
    name: macOS AArch64 inventory (qualification pending)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
