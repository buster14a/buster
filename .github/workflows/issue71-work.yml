name: Issue 71 development snapshot

on:
  push:
    branches: [codex/issue71-native-tail-work]
    paths: [.github/workflows/issue71-work.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Archive the exact development revision
        shell: bash
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/buster-source.tar.gz" "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue71-source-${{ github.sha }}
          path: ${{ runner.temp }}/buster-source.tar.gz
          if-no-files-found: error
          retention-days: 1
