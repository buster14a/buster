name: Issue 1252 workbench
on:
  push:
    branches: [chatgpt/issue-1252-direct-initializer]
    paths: [.github/workflows/issue-1252-workbench.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      BUSTER_HOST_ARCH: x86-64
    steps:
      - uses: actions/checkout@v4
      - name: Apply edge corrections and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-1252"
          cp .issue-1252-edges.patch "$RUNNER_TEMP/issue-1252/change.patch"
          git apply --check .issue-1252-edges.patch
          git apply .issue-1252-edges.patch
          rm .issue-1252-edges.patch .github/workflows/issue-1252-workbench.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/buster/compiler .issue-1252-edges.patch .github/workflows/issue-1252-workbench.yml
          git commit -m 'fix(checker): preserve conditional commas and attributed C23 deduction' -m 'Keep commas in conditional middle operands in the initializer expression. Recognize an attributed C23 auto name. Test actual program asm-label emission separately from the standalone data consumer.' -m 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>'
          git push origin HEAD:refs/heads/chatgpt/issue-1252-direct-initializer
          git log -1 --format=fuller > "$RUNNER_TEMP/issue-1252/commit.txt"
      - name: Install project Clang and test dependencies
        run: bash tools/ci/setup-hosted.sh
      - name: Build
        shell: bash
        run: set -o pipefail; clang --version > "$RUNNER_TEMP/issue-1252/clang.txt"; ./build.sh --config Release --jobs 4 2>&1 | tee "$RUNNER_TEMP/issue-1252/build.log"
      - name: Focused direct initializer tests
        shell: bash
        run: set -o pipefail; ./build/compiler test-checker --direct-initializers 2>&1 | tee "$RUNNER_TEMP/issue-1252/direct.log"
      - name: Driver and Clang C23 probes
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          d="$RUNNER_TEMP/issue-1252"
          printf '%s\n' 'auto x __attribute__((unused)) (3);' > "$d/auto.c"
          printf '%s\n' 'constexpr int y __attribute__((unused)) (4);' > "$d/constexpr.c"
          for f in auto constexpr; do for cc in clang ./build/compiler; do "$cc" -std=gnu23 -fsyntax-only "$d/$f.c" >> "$d/c23.log" 2>&1; printf '%s %s exit=%s\n' "$cc" "$f" "$?" >> "$d/c23.log"; done; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1252-edges-focused
          path: ${{ runner.temp }}/issue-1252/
          retention-days: 1
          if-no-files-found: error
      - name: Existing program initializer tests
        if: success() || failure()
        shell: bash
        run: set -o pipefail; test -x build/compiler && ./build/compiler test-checker --program-initializers 2>&1 | tee "$RUNNER_TEMP/issue-1252/program-initializers.log"
      - name: Parser regressions
        if: success() || failure()
        shell: bash
        run: set -o pipefail; test -x build/compiler && ./build/compiler test-parser 2>&1 | tee "$RUNNER_TEMP/issue-1252/parser.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1252-edges-validation
          path: ${{ runner.temp }}/issue-1252/
          retention-days: 1
          if-no-files-found: error
