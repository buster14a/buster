name: Issue 1252 workbench
on:
  push:
    branches: [chatgpt/issue-1252-direct-initializer]
    paths: [.github/workflows/issue-1252-workbench.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      BUSTER_HOST_ARCH: x86-64
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-pinned implementation and remove transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-1252"
          sed 's/SFrNevbxF1zw/SFrNevbxFzw/' .issue-1252.patch.b64 | base64 -d | gzip -d > "$RUNNER_TEMP/issue-1252/change.patch"
          printf '%s  %s\n' 3e6efe1a0f7e7a07f991bcf83241b7685ea333b542c966792bcedb2ddd1d4b8c "$RUNNER_TEMP/issue-1252/change.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/issue-1252/change.patch"
          git apply "$RUNNER_TEMP/issue-1252/change.patch"
          rm .issue-1252.patch.b64 .github/workflows/issue-1252-workbench.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/buster/compiler docs/commands/checker.md .issue-1252.patch.b64 .github/workflows/issue-1252-workbench.yml
          git -c core.hooksPath=/dev/null commit -m 'fix(checker): support Clang parenthesized direct initializers' -m 'Initialize from the first argument while checking but not evaluating later arguments. Reuse declaration, inference and initialization paths; add scalar/coded, static-byte and native regressions for #1252.' -m 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>'
          git push origin HEAD:refs/heads/chatgpt/issue-1252-direct-initializer
          git log -1 --format=fuller > "$RUNNER_TEMP/issue-1252/commit.txt"
      - name: Install project Clang and test dependencies
        run: bash tools/ci/setup-hosted.sh
      - name: Build
        shell: bash
        run: set -o pipefail; clang --version > "$RUNNER_TEMP/issue-1252/clang.txt"; ./build.sh --config Release --jobs 4 2>&1 | tee "$RUNNER_TEMP/issue-1252/build.log"
      - name: Focused direct initializer tests
        shell: bash
        run: set -o pipefail; ./build/compiler test-checker --direct-initializers 2>&1 | tee "$RUNNER_TEMP/issue-1252/direct.log"
      - name: Existing program initializer tests
        if: success() || failure()
        shell: bash
        run: set -o pipefail; test -x build/compiler && ./build/compiler test-checker --program-initializers 2>&1 | tee "$RUNNER_TEMP/issue-1252/program-initializers.log"
      - name: Parser regressions
        if: success() || failure()
        shell: bash
        run: set -o pipefail; test -x build/compiler && ./build/compiler test-parser 2>&1 | tee "$RUNNER_TEMP/issue-1252/parser.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1252-validation
          path: ${{ runner.temp }}/issue-1252/
          retention-days: 1
          if-no-files-found: error
