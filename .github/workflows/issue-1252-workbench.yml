name: Issue 1252 workbench
on:
  push:
    branches: [chatgpt/issue-1252-direct-initializer]
    paths: [.github/workflows/issue-1252-workbench.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      BUSTER_HOST_ARCH: x86-64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary workflow from final tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-1252"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-1252-workbench.yml
          git commit -m 'chore: remove branch-only issue 1252 workbench' -m 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>'
          git push origin HEAD:refs/heads/chatgpt/issue-1252-direct-initializer
          git log -1 --format=fuller > "$RUNNER_TEMP/issue-1252/commit.txt"
          git diff --check 441db2428d2bd8d28503037b28c1b3740fe4b25a HEAD
      - name: Install project Clang and test dependencies
        run: bash tools/ci/setup-hosted.sh
      - name: Build
        shell: bash
        run: set -o pipefail; clang --version > "$RUNNER_TEMP/issue-1252/clang.txt"; ./build.sh --config Release --jobs 4 2>&1 | tee "$RUNNER_TEMP/issue-1252/build.log"
      - name: Focused direct initializer tests
        shell: bash
        run: set -o pipefail; ./build/compiler test-checker --direct-initializers 2>&1 | tee "$RUNNER_TEMP/issue-1252/direct.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1252-release-focused
          path: ${{ runner.temp }}/issue-1252/
          retention-days: 1
          if-no-files-found: error
      - name: Existing program initializer tests
        if: success() || failure()
        shell: bash
        run: set -o pipefail; test -x build/compiler && ./build/compiler test-checker --program-initializers 2>&1 | tee "$RUNNER_TEMP/issue-1252/program-initializers.log"
      - name: Parser regressions
        if: success() || failure()
        shell: bash
        run: set -o pipefail; test -x build/compiler && ./build/compiler test-parser 2>&1 | tee "$RUNNER_TEMP/issue-1252/parser.log"
      - name: Checker driver diagnostic regression shard
        if: success() || failure()
        shell: bash
        run: set -o pipefail; test -x build/compiler && ./build/compiler test-checker-driver --executable ./build/compiler --part 1/16 2>&1 | tee "$RUNNER_TEMP/issue-1252/driver.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1252-release-validation
          path: ${{ runner.temp }}/issue-1252/
          retention-days: 1
          if-no-files-found: error
