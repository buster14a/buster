name: Astra PR fixture diagnostics
on:
  push:
    branches: [codex/astra-pr-fixture-diagnostics]
    paths: [.github/workflows/astra-pr-fixture-diagnostics.yml]
permissions:
  contents: read
jobs:
  fixture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 370
            runner: macos-26
            source: cb8a5830b656f47bb250c00563ea47517af3d988
          - pr: 367
            runner: ubuntu-26.04
            source: 8403f0a75e44a78c3ef7c857f708158be4ea46e6
          - pr: 376
            runner: macos-26
            source: 515c12c8525ee16cd770a288883f30691f2d7d30
          - pr: 372
            runner: ubuntu-26.04
            source: f2eda36c7233b4b801d37b9abae5774a4809f1a3
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Build candidate
        run: |
          git rev-parse HEAD
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/buster-build" build --config Release -t ide -- -j1
      - name: Diagnose exact candidate fixtures
        env:
          AUDIT_PR: ${{ matrix.pr }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          pr=int(os.environ['AUDIT_PR'])
          tmp=Path(os.environ['RUNNER_TEMP'])
          ide=str(Path('build/Release/ide').resolve())
          failed=False
          def run(args, required=True):
              global failed
              print('COMMAND', [str(x) for x in args], flush=True)
              r=subprocess.run([str(x) for x in args], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=120)
              print(r.stdout, flush=True)
              print('EXIT', r.returncode, flush=True)
              if required: failed |= r.returncode != 0
              return r.returncode
          if pr == 372:
              for suffix,size in [('i8',1),('ui8',1),('i16',2),('ui16',2),('i32',4),('ui32',4),('i64',8),('ui64',8)]:
                  p=tmp/(suffix+'.c')
                  p.write_text('_Static_assert(sizeof(1'+suffix+') == '+str(size)+', "'+suffix+' width");\n')
                  run([ide,'cc','-c',p,'-o',tmp/(suffix+'.o')])
              p=tmp/'limits.c'
              p.write_text('_Static_assert(0xffui8 == 255 && 0xffffui16 == 65535 && 0xffffffffui32 == 4294967295u, "SDK limits");\n')
              run([ide,'cc','-c',p,'-o',tmp/'limits.o'])
          if pr == 370:
              flags=['-O0','-fwrapv','-fno-strict-aliasing','-funsigned-char']
              for mode in ['none','mir-stack','fast','quality']:
                  obj=tmp/('qualified-'+mode+'.o')
                  exe=tmp/('qualified-'+mode)
                  if run([ide,'cc','-c','-fverify-codegen','-fregister-allocator='+mode,*flags,'tests/differential/qualified_aggregate.c','-o',obj])==0:
                      run(['nm','-u',obj])
                      if run(['clang',*flags,'tests/differential/qualified_aggregate_host.c',obj,'-o',exe])==0:
                          run([exe])
          if pr == 367:
              for cc in ['gcc','clang']:
                  obj=tmp/(cc+'-pic.o')
                  if run([cc,'-fPIC','-O0','-c','tests/basic_c_pic.c','-o',obj])==0:
                      run(['readelf','-sWr',obj])
                      exe=tmp/(cc+'-pic')
                      if run([ide,'cc',obj,'-o',exe])==0: run([exe])
                      if run([cc,obj,'-o',tmp/(cc+'-control')])==0: run([tmp/(cc+'-control')])
          if pr == 376:
              host=tmp/'report.c'
              host.write_text('#include <stdio.h>\nvoid report(unsigned tag, unsigned long long observed, unsigned long long expected) { printf("MASK %u %llu %llu\\n", tag, observed, expected); }\n')
              source=Path('tests/basic_c_simd_translate.c').read_text()
              source=source.replace('static int check_block', 'void report(unsigned, unsigned long long, unsigned long long);\nstatic int check_block')
              needle='int failure = observed_stops != expected_stops || observed_newlines != expected_newlines;'
              diagnostic='''static unsigned reports = 0;
              if (reports < 12 && (observed_stops != expected_stops || observed_newlines != expected_newlines)) {
                  report(reports * 2, observed_stops, expected_stops);
                  report(reports * 2 + 1, observed_newlines, expected_newlines);
                  reports += 1;
              }
              '''+needle
              assert needle in source
              source=source.replace(needle,diagnostic)
              p=tmp/'simd-report.c';p.write_text(source)
              for mode in ['clang','none','mir-stack','fast','quality']:
                  obj=tmp/('simd-'+mode+'.o');exe=tmp/('simd-'+mode)
                  compiler=['clang','-O0'] if mode=='clang' else [ide,'cc','-fregister-allocator='+mode]
                  if run([*compiler,'-Isrc','-c',p,'-o',obj])==0:
                      if run(['clang',host,obj,'-o',exe])==0:run([exe])
          raise SystemExit(1 if failed else 0)
          PY
