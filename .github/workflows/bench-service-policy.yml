name: Benchmark service workflow policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/bench_service/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/bench_service/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-service-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Benchmark service workflow policy
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prove exclusive fixed-gateway dispatch
        run: python3 -B tools/bench_service/workflow_policy_test.py
