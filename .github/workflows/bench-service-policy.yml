name: Benchmark service workflow policy

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-service-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Benchmark service workflow policy
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require CI admission to be enabled
        shell: bash
        env:
          CI_ENABLED: ${{ vars.GH_ACTIONS_CI_ENABLED }}
        run: |
          if [[ "$CI_ENABLED" != true ]]; then
            echo '::error::Required validation is disabled; refusing a skipped admission check.'
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prove exclusive fixed-gateway dispatch
        run: |
          python3 -B tools/bench_service/workflow_policy_test.py
          python3 -B tools/bench_service/deploy/verify_github_actor_policy_test.py
          python3 -B tools/bench_service/deploy/verify_github_admission_test.py
          python3 -B tools/bench_service/deploy/verify_github_queue_test.py
          python3 -B tools/bench_service/resolve_pr_request_test.py
      - name: Replay Zen 5 qualification formats
        run: |
          python3 -B tools/zen5_host_qualification.py --self-test
          python3 -B tools/zen5_aa_noise.py --self-test
          python3 -B tools/zen5_build_control.py --self-test
      - name: Exercise atomic exclusive admission
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Isrc -Wall -Wextra -Werror \
            -Wno-unused-function -Wno-unused-variable -Wno-unused-parameter \
            -fwrapv -fno-strict-aliasing -funsigned-char \
            tools/bench_service/exclusive_admission_test.c \
            -o "$RUNNER_TEMP/exclusive-admission-test"
          "$RUNNER_TEMP/exclusive-admission-test"
