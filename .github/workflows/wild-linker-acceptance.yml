name: Wild linker matched-policy acceptance

# Explicitly scoped research execution. Never selects a self-hosted machine.
on:
  push:
    branches: [codex/2645-wild-acceptance-evidence]
    paths: [tools/wild_linker_acceptance.c, .github/workflows/wild-linker-acceptance.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wild-linker-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [release, source]
    env:
      LC_ALL: C
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      BUSTER_TEST_JOBS: '2'
    steps:
      - name: Require hosted execution admission
        env:
          CI_ENABLED: ${{ vars.GH_ACTIONS_CI_ENABLED }}
        run: test "$CI_ENABLED" = true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Retrieve pinned primary campaign inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wild-linker-evaluation-37219746626-1
          run-id: '37219746626'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/wild-primary-inputs
      - name: Install independent validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb strace llvm-21 libclang-rt-21-dev ripgrep lld-21 zlib1g-dev libzstd-dev libtbb-dev
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"
      - name: Install pinned external evaluation tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wild-evaluation/tools" "$RUNNER_TEMP/wild-evaluation/evidence" "$RUNNER_TEMP/wild-evaluation/bin"
          cd "$RUNNER_TEMP/wild-evaluation/tools"
          curl --fail --location --retry 2 -o wild.tar.gz https://github.com/wild-linker/wild/releases/download/0.10.0/wild-linker-0.10.0-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --location --retry 2 -o mold.tar.gz https://github.com/rui314/mold/releases/download/v2.42.1/mold-2.42.1-x86_64-linux.tar.gz
          curl --fail --location --retry 2 -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v4.4.3/cmake-4.4.3-linux-x86_64.tar.gz
          printf '%s\n' '641265506a7c06cfb03181b8916ab663ec8407855db6d4db7f8450667d105283  wild.tar.gz' '6ff270c9bf07d2bec5c98aa324eb7c4daf6a1a4d815c05ff1708049616047855  mold.tar.gz' 'd6c83076c575bc00b823522ac974bda66d0af05d6ddc30e739c12385cf32c6cc  cmake.tar.gz' > SHA256SUMS
          sha256sum --check SHA256SUMS
          cp SHA256SUMS ../evidence/upstream-archives.sha256
          mkdir wild mold cmake
          tar -xzf wild.tar.gz -C wild
          tar -xzf mold.tar.gz -C mold --strip-components=1
          tar -xzf cmake.tar.gz -C cmake --strip-components=1
          wild_binary=$(find "$PWD/wild" -type f -name wild -print -quit)
          test -n "$wild_binary"
          ln -s "$wild_binary" ../bin/wild
          ln -s "$wild_binary" ../bin/ld.wild
          ln -s "$PWD/mold/bin/mold" ../bin/mold
          ln -s "$PWD/mold/bin/mold" ../bin/ld.mold
          echo "$RUNNER_TEMP/wild-evaluation/bin" >> "$GITHUB_PATH"
          echo "$PWD/cmake/bin" >> "$GITHUB_PATH"
      - name: Build pinned isolated upstream production configurations
        if: ${{ matrix.mode == 'source' }}
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '3'
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_DEBUG: '0'
          CARGO_PROFILE_RELEASE_STRIP: symbols
          RUSTFLAGS: '-C target-cpu=x86-64 -C linker=clang -C link-arg=-fuse-ld=lld'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wild-isolated-upstream"
          evidence="$RUNNER_TEMP/wild-evaluation/evidence"
          mkdir -p "$root"
          git init "$root/wild"
          git -C "$root/wild" fetch --depth=1 https://github.com/wild-linker/wild.git e9a9b0cb6fd63a23cc7b93aafc931aadd5746be6
          git -C "$root/wild" checkout --detach FETCH_HEAD
          test "$(git -C "$root/wild" rev-parse HEAD)" = e9a9b0cb6fd63a23cc7b93aafc931aadd5746be6
          git init "$root/mold"
          git -C "$root/mold" fetch --depth=1 https://github.com/rui314/mold.git 9b376bc6a9899d4a16b41777de1f013989459fbc
          git -C "$root/mold" checkout --detach FETCH_HEAD
          test "$(git -C "$root/mold" rev-parse HEAD)" = 9b376bc6a9899d4a16b41777de1f013989459fbc
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 metadata --locked --format-version=1 --manifest-path "$root/wild/Cargo.toml" > "$evidence/wild-component-metadata.json"
          cargo +1.94.0 build --locked --release --package wild-linker --jobs 2 --manifest-path "$root/wild/Cargo.toml"
          cmake -S "$root/mold" -B "$root/mold-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ '-DCMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG -march=x86-64' '-DCMAKE_CXX_FLAGS_RELEASE=-O3 -DNDEBUG -march=x86-64' -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DMOLD_LTO=OFF -DMOLD_USE_MOLD=OFF -DMOLD_MOSTLY_STATIC=OFF -DMOLD_USE_MIMALLOC=OFF -DMOLD_USE_SYSTEM_TBB=ON
          cmake --build "$root/mold-build" --target mold --parallel 2
          strip "$root/mold-build/mold"
          ln -sf "$root/wild/target/release/wild" "$RUNNER_TEMP/wild-evaluation/bin/wild"
          ln -sf "$root/wild/target/release/wild" "$RUNNER_TEMP/wild-evaluation/bin/ld.wild"
          ln -sf "$root/mold-build/mold" "$RUNNER_TEMP/wild-evaluation/bin/mold"
          ln -sf "$root/mold-build/mold" "$RUNNER_TEMP/wild-evaluation/bin/ld.mold"
          cp "$root/mold-build/CMakeCache.txt" "$evidence/mold-source.CMakeCache.txt"
          cp "$root/wild/Cargo.lock" "$evidence/wild-source.Cargo.lock"
          cp "$root/wild/Cargo.toml" "$evidence/wild-source.Cargo.toml"
          cp "$root/mold/LICENSE" "$evidence/mold-source-LICENSE.txt"
          cp "$root/wild/LICENSE-MIT" "$evidence/wild-source-LICENSE-MIT.txt"
          cp "$root/wild/LICENSE-APACHE" "$evidence/wild-source-LICENSE-APACHE.txt"
          rustc +1.94.0 -Vv > "$evidence/upstream-build.txt"
          clang -v >> "$evidence/upstream-build.txt" 2>&1
          env | sort | grep -E '^(CARGO_PROFILE_RELEASE_|RUSTFLAGS=)' >> "$evidence/upstream-build.txt"
          printf '%s\n' 'Both: optimized level 3, no LTO/PGO, generic x86-64, stripped, libc allocator, LLVM linker. Different language/toolchain/runtime and mold system TBB/compression libraries are disclosed.' >> "$evidence/upstream-build.txt"
          sha256sum "$root/wild/Cargo.lock" "$root/mold/CMakeLists.txt" "$root/mold-build/mold" "$root/wild/target/release/wild" >> "$evidence/upstream-build.txt"
          ldd "$root/mold-build/mold" "$root/wild/target/release/wild" >> "$evidence/upstream-build.txt"
      - name: Record provenance and bootstrap existing C build driver
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/wild-evaluation/evidence"
          git rev-parse HEAD > "$evidence/source.txt"
          git status --porcelain=v1 > "$evidence/source-status.txt"
          git archive --format=tar HEAD build.c CMakeLists.txt cmake docs/agents .github/workflows tools/throughput tools/wild_linker_bench.c tools/wild_linker_acceptance.c LICENSES/README.md > "$evidence/inspected-source.tar"
          uname -a > "$evidence/host.txt"
          lscpu >> "$evidence/host.txt"
          free -h >> "$evidence/host.txt"
          nproc >> "$evidence/host.txt"
          cat /proc/self/status /proc/loadavg /proc/self/cgroup >> "$evidence/host.txt"
          for limit in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us; do
            if test -f "$limit"; then echo "$limit" >> "$evidence/host.txt"; cat "$limit" >> "$evidence/host.txt"; fi
          done
          cat /etc/os-release >> "$evidence/host.txt"
          ps -eo pid,pcpu,pmem,comm --sort=-pcpu | sed -n '1,20p' >> "$evidence/host.txt"
          df -T . >> "$evidence/host.txt"
          clang --version > "$evidence/toolchains.txt"
          gcc --version >> "$evidence/toolchains.txt"
          cmake --version >> "$evidence/toolchains.txt"
          wild --version >> "$evidence/toolchains.txt"
          mold --version >> "$evidence/toolchains.txt"
          gdb --version >> "$evidence/toolchains.txt"
          llvm-dwarfdump --version >> "$evidence/toolchains.txt"
          dpkg-query -W gdb llvm-21 libclang-rt-21-dev libc6 libc6-dev >> "$evidence/toolchains.txt"
          sha256sum "$(command -v wild)" "$(command -v mold)" "$(command -v clang)" >> "$evidence/toolchains.txt"
          cat "$evidence/toolchains.txt"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char -g build.c -o "$RUNNER_TEMP/wild-evaluation/build-driver"
          grep -n -C 8 -- 'BUILD_ARGUMENT_LINKER' build.c > "$evidence/linker-selection-source.txt"
      - name: Run native C evaluation harness
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror -Wpedantic tools/wild_linker_acceptance.c -o "$RUNNER_TEMP/wild-evaluation/bench"
          "$RUNNER_TEMP/wild-evaluation/bench" "$RUNNER_TEMP/wild-evaluation/build-driver" "$RUNNER_TEMP/wild-evaluation/evidence" "$RUNNER_TEMP/wild-primary-inputs"
      - name: Print compact observations and verifier diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          for root in "$RUNNER_TEMP/wild-evaluation/evidence"; do
            for file in summary.csv original-summary.csv build-link-share.csv negative-selection-status.txt cold-cache-status.txt completion.txt; do
              test ! -f "$root/$file" || { echo "$file"; cat "$root/$file"; }
            done
            if rg -l 'Verifying|DIEs have overlapping|error:|warning:|Breakpoint 1,|#0 ' "$root" --glob '*.log' | while IFS= read -r file; do
              echo "$file"
              head -n 12 "$file"
              tail -n 15 "$file"
            done; then :; else test "$?" -eq 1; fi
          done
      - name: Retain compact reviewable evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wild-linker-acceptance-compact-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wild-evaluation/evidence/*.csv
            ${{ runner.temp }}/wild-evaluation/evidence/*.tsv
            ${{ runner.temp }}/wild-evaluation/evidence/*.txt
            ${{ runner.temp }}/wild-evaluation/evidence/*.sha256
            ${{ runner.temp }}/wild-evaluation/evidence/*.log
            ${{ runner.temp }}/wild-evaluation/evidence/*.json
            ${{ runner.temp }}/wild-evaluation/evidence/*.lock
            ${{ runner.temp }}/wild-evaluation/evidence/*.toml
          retention-days: 30
      - name: Retain original evidence including setup failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wild-linker-acceptance-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wild-evaluation/evidence
          if-no-files-found: error
          retention-days: 30
