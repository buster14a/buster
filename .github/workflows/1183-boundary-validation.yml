name: Issue 1183 boundary validation
on:
  push:
    branches: [codex/1183-broker-boundary-validation]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify transferred patch before execution
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          text = pathlib.Path('1183.patch.b64').read_text().strip()
          for old, new in [('ceaE8yTIZ9j959','ceaE8yQIZ9j959'), ('547sbxR5++ZN','547sbxR++ZN'), ('ZRcOKhR5+6Ze','ZRcOKhR+6Ze'), ('Eqt4Ia2WyNTyIt','Eqt4Ia2NTyIt')]:
              text = text.replace(old, new)
          patch = gzip.decompress(base64.b64decode(text, validate=True))
          actual = hashlib.sha256(patch).hexdigest()
          print('PATCH_SHA256', actual)
          assert actual == '5666be76c9941b2f19fefb40eaf771e1b02d0b48055105e1fd59bc5d7b7bc3d5'
          pathlib.Path('1183.verified.patch').write_bytes(patch)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue-1183-transfer-integrity
          path: |
            1183.patch.b64
            1183.verified.patch
          if-no-files-found: error
          retention-days: 3
