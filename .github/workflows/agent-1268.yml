name: Issue 1268 isolated workspace
on:
  push:
    branches: [agent/1268-comdat-work]
    paths: [.github/workflows/agent-1268.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/issue-1268-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: issue-1268-source
          path: ${{ runner.temp }}/issue-1268-source.tar.gz
          retention-days: 1
