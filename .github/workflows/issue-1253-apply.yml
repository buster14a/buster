name: Apply and validate parser issue 1253

on:
  push:
    branches: [agent/issue-1253-apply]
    paths: [.github/workflows/issue-1253-apply.yml]

permissions:
  contents: read

jobs:
  apply:
    if: github.repository_id == '1421805693' && github.ref == 'refs/heads/agent/issue-1253-apply'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 441db2428d2bd8d28503037b28c1b3740fe4b25a
          persist-credentials: true
      - name: Apply the focused source and regression patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/issue-1253.patch" <<'PATCH'
          diff --git a/src/buster/compiler/c_parser.c b/src/buster/compiler/c_parser.c
          --- a/src/buster/compiler/c_parser.c
          +++ b/src/buster/compiler/c_parser.c
          @@ -4153,7 +4153,9 @@ static void parse_scalar_operand(ParseScalar* parser, uint32_t i, ParseFrame* frame, ParseStep* step)
               const uint32_t flags = frame->flags;
               const bool attribute = (flags & BUSTER_PARSE_FRAME_ATTRIBUTE) != 0;
               const bool asm_operands = (flags & BUSTER_PARSE_FRAME_ASM) != 0;
          -    const bool empty = (flags & BUSTER_PARSE_FRAME_EMPTY_OK) != 0;
          +    // An omitted array bound ends only at `]`, not at another closer or a statement terminator (#1253).
          +    const bool empty = (flags & BUSTER_PARSE_FRAME_EMPTY_OK) != 0 &&
          +                       ((flags & BUSTER_PARSE_FRAME_ARRAY_DECLARATOR) == 0 || kind == PARSE_KIND_R_SQUARE);
               const uint8_t previous = parser->kinds[(int64_t)i - 1];
               // A GNU attribute's type argument (parse_scalar_type_argument_attribute), where a type name starts it.
               const bool type_argument = frame->role == PARSE_ROLE_OPEN_CALL && i == frame->opener + 1 && parse_scalar_gnu_attribute_group(parser, frame) &&
          diff --git a/src/buster/compiler/c_parser_test.c b/src/buster/compiler/c_parser_test.c
          --- a/src/buster/compiler/c_parser_test.c
          +++ b/src/buster/compiler/c_parser_test.c
          @@ -432,6 +432,30 @@ static const ParseTestSnippet parse_test_snippets[] =
           {
               // Valid code.
               { "int x;\nint f(int a, int b) { return a + b * 2; }\n", "", 0 },
          +    // Empty array bounds close with `]`; qualifiers and unspecified-size parameters keep that allowance (#1253).
          +    { "extern int a[]; void f(int a[], int b[const], int c[*], int d[static 3]);\n", "", 0 },
          +    { "void f(int [], int [const], int [*]);\n", "", 0 },
          +    // Before any bound, a wrong closer or a semicolon is a missing expression, not a missing `]`.
          +    { "int a[);\n", "1:7: expected expression", 0 },
          +    { "int a[;\n", "1:7: expected expression", 0 },
          +    { "int a[};\n", "1:7: expected expression", 0 },
          +    { "void f(int a[);\n", "1:14: expected expression", 0 },
          +    { "void f(const x [);\n", "1:17: expected expression", 0 },
          +    { "void f(int a[const);\n", "1:19: expected expression", 0 },
          +    { "void f(int a[const;\n", "1:19: expected expression", 0 },
          +    { "void f(int a[const};\n", "1:19: expected expression", 0 },
          +    { "void f(int a[static );\n", "1:21: expected expression", 0 },
          +    { "void f(int a[static ;\n", "1:21: expected expression", 0 },
          +    // Starting an expression still requires its operand, even at the matching bracket.
          +    { "void f(int a[+]);\n", "1:15: expected expression", 0 },
          +    { "void f(int a[*);\n", "1:15: expected expression", 0 },
          +    // After a bound the missing bracket is still the error; a subscript never admits an empty expression.
          +    { "int a[3;\n", "1:8: expected ']'", 0 },
          +    { "int a[static 3);\n", "1:15: expected ']'", 0 },
          +    { "void f(int a[3);\n", "1:15: expected ']'", 0 },
          +    { "int g(int *p) { return p[); }\n", "1:26: expected expression", 0 },
          +    { "int g(int *p) { return p[]; }\n", "1:25: expected expression", 0 },
          +    // Other empty expression contexts are unchanged.
          +    { "void f(void); void g(void) { f(); for (;;) { return; } }\n", "", 0 },
               { "struct S { int a : 3; char *p; } s = { 1, \"x\" };\n", "", 0 },
               { "int x; void g(void) { if (x) x = 1; else { for (int i = 0; i < 3; i++) x += i; } do x--; while (x); switch (x) { case 1: break; default: ; } }\n", "", 0 },
               { "typedef int T; T (x); int f(T (x)); int g(int (x));\n", "", 0 },
          PATCH
          git apply --check "$RUNNER_TEMP/issue-1253.patch"
          git apply "$RUNNER_TEMP/issue-1253.patch"
          git diff --check
          git diff --stat
          git diff
      - name: Commit only the two changed parser files on the solution branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git switch --create fix/parser-array-empty-bound-1253
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          sh .githooks/enable-sign-off.sh --maintainer-session
          git add src/buster/compiler/c_parser.c src/buster/compiler/c_parser_test.c
          git commit -m "fix(parser): require an expression before unmatched array-bound closers" -m "Allow an empty array declarator bound only at its matching closing bracket. Preserve missing-bracket diagnostics after a bound and add exact diagnostic and valid-neighbor regression snippets for issue #1253."
          git log -1 --format=%B
          test "$(git log -1 --format=%B | grep -Fxc 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>')" -eq 1
          test "$(git diff --name-only 441db2428d2bd8d28503037b28c1b3740fe4b25a HEAD | wc -l)" -eq 2
          git push origin HEAD:refs/heads/fix/parser-array-empty-bound-1253
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'Solution commit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
  test:
    needs: apply
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: '0'
      BUSTER_ORACLE_CACHE: 'off'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - name: Install the repository's pinned hosted Clang and build tools
        run: bash tools/ci/setup-hosted.sh
      - name: Build the baseline Release compiler
        run: ./build.sh --config Release --jobs 4
      - name: Run the complete parser suite with the Clang oracle
        shell: bash
        run: |
          set -euo pipefail
          clang --version
          ./build/compiler test-parser --clang
          printf '%s\n' 'PASS: baseline Release build and complete test-parser --clang suite.' >> "$GITHUB_STEP_SUMMARY"
