name: Issue 913 source inspection

on:
  push:
    branches:
      - codex/913-win64-padded-vector-zero
  pull_request:
    paths:
      - '.github/workflows/issue-913-inspect.yml'
      - 'src/buster/tests/compiler/driver/driver_test.c'
      - 'src/buster/lib/compiler/**'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Inspect issue 913 fixture and Win64 lowering
        shell: bash
        run: |
          set -euo pipefail
          echo '=== generated padded-vector source ==='
          sed -n '2110,2215p' src/buster/tests/compiler/driver/driver_test.c
          echo '=== native padded-vector matrix ==='
          sed -n '2430,2815p' src/buster/tests/compiler/driver/driver_test.c
          echo '=== Wine padded-vector matrix ==='
          sed -n '13470,13635p' src/buster/tests/compiler/driver/driver_test.c
          echo '=== Win64 IR classification ==='
          sed -n '3540,3655p' src/buster/lib/compiler/ir/ir.c
          echo '=== canonical padded-vector result/call helpers ==='
          sed -n '4100,4255p' src/buster/lib/compiler/codegen/codegen.c
          sed -n '4680,4760p' src/buster/lib/compiler/codegen/codegen.c
          echo '=== canonical scalar-lane loads/stores ==='
          grep -n -E 'windows_scalar_(lane|vector)|load_lane_gpr|store_lane_gpr|non_power_vector' src/buster/lib/compiler/codegen/codegen.c | head -n 250
          echo '=== MIR padded-vector classification ==='
          sed -n '560,810p' src/buster/lib/compiler/codegen/machine_x86_64.c
          echo '=== IR/codegen tests mentioning padded scalar lanes ==='
          git grep -n -E 'padded_one|padded_vec3|windows_scalar_lane|non_power_vector' -- src/buster/tests tests | head -n 400 || true
