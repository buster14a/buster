name: Issue 913 source inspection

on:
  push:
    branches:
      - codex/913-win64-padded-vector-zero
  pull_request:
    paths:
      - '.github/workflows/issue-913-inspect.yml'
      - 'src/buster/tests/compiler/driver/driver_test.c'
      - 'src/buster/lib/compiler/**'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Inspect padded-vector transport details
        shell: bash
        run: |
          set -euo pipefail
          echo '=== complete generated source tail ==='
          sed -n '2210,2455p' src/buster/tests/compiler/driver/driver_test.c
          echo '=== canonical lane helpers ==='
          sed -n '8735,8880p' src/buster/lib/compiler/codegen/codegen.c
          echo '=== canonical callee argument placement ==='
          sed -n '13335,13640p' src/buster/lib/compiler/codegen/codegen.c
          echo '=== canonical caller scalar-lane placement ==='
          sed -n '16840,17205p' src/buster/lib/compiler/codegen/codegen.c
          echo '=== canonical padded result transport ==='
          sed -n '17420,17530p' src/buster/lib/compiler/codegen/codegen.c
          sed -n '20010,20120p' src/buster/lib/compiler/codegen/codegen.c
          echo '=== MIR scalar-lane use sites ==='
          grep -n -E 'windows_scalar_lane_size|windows_scalar_float' src/buster/lib/compiler/codegen/machine_x86_64.c
