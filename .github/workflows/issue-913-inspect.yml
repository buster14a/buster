name: Issue 913 source inspection

on:
  push:
    branches:
      - codex/913-win64-padded-vector-zero
  pull_request:
    paths:
      - '.github/workflows/issue-913-inspect.yml'
      - 'src/buster/tests/compiler/driver/driver_test.c'
      - 'src/buster/lib/compiler/**'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Inspect vector conformance fixture and lowering
        shell: bash
        run: |
          set -euo pipefail
          file=src/buster/tests/compiler/driver/driver_test.c
          echo '=== fixture symbols ==='
          grep -n -E 'c_vec_conformance_source|padded_one|windows_padded_vec3_lane0_zero' "$file" || true
          echo '=== fixture context ==='
          while IFS=: read -r line rest; do
            start=$((line > 100 ? line - 100 : 1))
            end=$((line + 180))
            echo "--- $file:$start-$end (match at $line: $rest) ---"
            sed -n "${start},${end}p" "$file"
          done < <(grep -n -E 'c_vec_conformance_source|windows_padded_vec3_lane0_zero' "$file" | head -n 4)
          echo '=== implementation symbols ==='
          grep -R -n -E 'map_logical_lanes_to_storage|is_padded_vector_type|element_count == 1|WINDOWS.*VECTOR|windows.*vector' src/buster/lib/compiler src/buster/compiler 2>/dev/null | head -n 500 || true
          echo '=== padded-vector commit descendants ==='
          git log --oneline --all -- src/buster/lib/compiler src/buster/tests/compiler/driver/driver_test.c | grep -i -E 'padded|vector|win64' | head -n 100 || true
