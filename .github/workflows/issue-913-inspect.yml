name: Issue 913 source inspection

on:
  push:
    branches:
      - codex/913-win64-padded-vector-zero
  pull_request:
    paths:
      - '.github/workflows/issue-913-inspect.yml'
      - 'src/buster/tests/compiler/driver/driver_test.c'
      - 'src/buster/lib/compiler/**'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Inspect Win64 padded vector contracts
        shell: bash
        run: |
          set -euo pipefail
          driver=src/buster/tests/compiler/driver/driver_test.c
          echo '=== all fixture references ==='
          git grep -n -E 'padded.*(one|vec3)|vec3.*padded|vector_size *\( *(1|2|3|5|6|7)|non.power.*vector|wide_vector_boundaries|c_abi' -- src tests 2>/dev/null | head -n 1000 || true
          echo '=== Windows mixed padded fixture region ==='
          sed -n '12720,13280p' "$driver"
          echo '=== ABI classifier ==='
          sed -n '3120,3235p' src/buster/lib/compiler/ir/ir.c
          sed -n '3500,3715p' src/buster/lib/compiler/ir/ir.c
          echo '=== canonical Win64 vector helpers ==='
          sed -n '3750,4275p' src/buster/lib/compiler/codegen/codegen.c
          echo '=== canonical call placement ==='
          sed -n '4620,4840p' src/buster/lib/compiler/codegen/codegen.c
          echo '=== canonical entry placement ==='
          sed -n '13280,13740p' src/buster/lib/compiler/codegen/codegen.c
          echo '=== MIR Win64 padded-vector helpers and placement ==='
          sed -n '520,820p' src/buster/lib/compiler/codegen/machine_x86_64.c
          sed -n '1880,2050p' src/buster/lib/compiler/codegen/machine_x86_64.c
          echo '=== relevant recent history ==='
          git log --oneline --all -- src/buster/lib/compiler/ir/ir.c src/buster/lib/compiler/codegen/codegen.c src/buster/lib/compiler/codegen/machine_x86_64.c "$driver" | grep -i -E 'padded|vector|win64' | head -n 100 || true
