name: QUALITY 125 pinned screening

on:
  push:
    branches: [astra/125-region-census-20260924]

permissions:
  contents: read

concurrency:
  group: quality-125-screen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2e942e80a87666409cf29d3e24a68d322b9e71fd
          persist-credentials: false
      - name: Export exact tracked source without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quality-125-source"
          git rev-parse HEAD 'HEAD^{tree}' | tee "$RUNNER_TEMP/quality-125-source/revision.txt"
          test "$(git rev-parse HEAD)" = 2e942e80a87666409cf29d3e24a68d322b9e71fd
          test "$(git rev-parse 'HEAD^{tree}')" = f976bfd7cdb8830a8a15d959ef36f0152f1b767d
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/quality-125-source/source.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/quality-125-source/tree.txt"
          python3 tools/new_audit.py --newest | tee "$RUNNER_TEMP/quality-125-source/newest-audit.txt"
          sha256sum "$RUNNER_TEMP/quality-125-source/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-125-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-125-source
          retention-days: 14
          if-no-files-found: error

  census:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      BUSTER_TEST_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2e942e80a87666409cf29d3e24a68d322b9e71fd
          persist-credentials: false
      - name: Build existing diagnostic compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quality-125-evidence"
          exec > >(tee "$RUNNER_TEMP/quality-125-evidence/build.log") 2>&1
          set -x
          git rev-parse HEAD 'HEAD^{tree}'
          clang --version
          uname -a
          lscpu
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o "$RUNNER_TEMP/quality-125-driver"
          "$RUNNER_TEMP/quality-125-driver" generate --config Release --cc clang --ci --linker DEFAULT -DBUSTER_UNITY_BUILD=OFF -DBUSTER_INCLUDE_TESTS=ON -DBUSTER_BENCH_ALLOCATIONS=ON
          "$RUNNER_TEMP/quality-125-driver" build --config Release -t ide -- -j2
          sha256sum build/Release/ide > "$RUNNER_TEMP/quality-125-evidence/compiler.sha256"
          cp build/compile_commands.json build/CMakeCache.txt "$RUNNER_TEMP/quality-125-evidence/"
          git diff --exit-code
      - name: Census frozen unity input in QUALITY
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/quality-125-evidence"
          for form in direct memory; do
            flags=()
            if test "$form" = memory; then flags+=(-fno-frontend-ssa); fi
            printf '%s\n' "build/Release/ide cc -Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -g0 -O0 -fregister-allocator=quality -c src/buster/apps/ide/ide.c ${flags[*]}" > "$evidence/$form.command.txt"
            build/Release/ide cc -Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -g0 -O0 -fregister-allocator=quality "${flags[@]}" -fsource-metrics="$evidence/$form.metrics" -c src/buster/apps/ide/ide.c -o "build/unity-$form.o" > "$evidence/$form.stdout.log" 2> "$evidence/$form.stderr.log"
            sha256sum "build/unity-$form.o" > "$evidence/$form.output.sha256"
            grep '^quality_census\.' "$evidence/$form.metrics"
          done
          find build/generated -type f -print0 | sort -z | xargs -0 sha256sum > "$evidence/generated.sha256"
      - name: Run registered diagnostic regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/quality-125-driver" build --config Release -t test_all -- -j2 2>&1 | tee "$RUNNER_TEMP/quality-125-evidence/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: quality-125-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-125-evidence
          retention-days: 14
          if-no-files-found: error
