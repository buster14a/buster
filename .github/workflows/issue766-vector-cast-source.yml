name: Issue 766 vector cast source inspection

on:
  push:
    branches:
      - codex/issue766-vector-cast-investigation
    paths:
      - '.github/workflows/issue766-vector-cast-source.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 1d71d10df9853360ca7961aeddd01675a7de1af7
          persist-credentials: false
      - name: Print explicit vector cast lowering
        shell: bash
        run: |
          set -euo pipefail
          file=src/buster/lib/compiler/frontend/c/c_gen.c

          echo '=== representation alias helper and surrounding code ==='
          grep -n 'c_ir_emit_representation_alias_conversion' "$file" || true
          sed -n '6360,6525p' "$file"

          echo '=== explicit cast lowering call sites ==='
          sed -n '13820,14030p' "$file"
          grep -nE 'FRAME.*CAST|CAST.*FRAME|as\.cast|cast_type' "$file" | sed -n '1,240p' || true

          echo '=== cast-validation helpers ==='
          grep -nE 'explicit.*cast|cast.*valid|vector.*size|size.*vector' "$file" | sed -n '1,260p' || true
          grep -RFn '__builtin_convertvector' tests src/buster/tests | sed -n '1,120p' || true
