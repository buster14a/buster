name: Issue 766 vector cast source inspection

on:
  push:
    branches:
      - codex/issue766-vector-cast-investigation
    paths:
      - '.github/workflows/issue766-vector-cast-source.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 1d71d10df9853360ca7961aeddd01675a7de1af7
          persist-credentials: false
      - name: Print vector conversion implementation and call sites
        shell: bash
        run: |
          set -euo pipefail
          file=src/buster/lib/compiler/frontend/c/c_gen.c

          echo '=== cast body 7320-7750 ==='
          sed -n '7320,7750p' "$file"
          echo '=== vector alias symbol ==='
          grep -n 'c_ir_emit_vector_alias_conversion' "$file" || true
          echo '=== vector conversion terms ==='
          grep -niE 'vector.*(alias|convert|cast)|(alias|convert|cast).*vector' "$file" | sed -n '1,240p' || true
          echo '=== matching tests and fixtures ==='
          grep -RFn 'vector alias' src/buster/tests tests docs/agents/frontend | sed -n '1,120p' || true
          grep -RFn 'same-width' src/buster/tests tests docs/agents/frontend | sed -n '1,120p' || true
          grep -RFn '__m128i' tests src/buster/tests | sed -n '1,160p' || true
