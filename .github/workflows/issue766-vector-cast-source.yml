name: Issue 766 vector cast source inspection

on:
  push:
    branches:
      - codex/issue766-vector-cast-investigation
    paths:
      - '.github/workflows/issue766-vector-cast-source.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 1d71d10df9853360ca7961aeddd01675a7de1af7
          persist-credentials: false
      - name: Print exact vector cast paths and tests
        shell: bash
        run: |
          set -euo pipefail
          file=src/buster/lib/compiler/frontend/c/c_gen.c

          echo '=== representation alias helper ==='
          sed -n '7240,7335p' "$file"

          echo '=== operation application ==='
          sed -n '21780,21950p' "$file"

          echo '=== expression cast parser/apply path ==='
          sed -n '27870,28090p' "$file"

          echo '=== vector fixtures and registrations ==='
          find tests -maxdepth 1 -type f -name '*vector*' -print | sort
          grep -n 'basic_c_vector' build.c | sed -n '1,160p' || true
          for fixture in tests/basic_c_vector*.c; do
            test -f "$fixture" || continue
            echo "--- $fixture ---"
            sed -n '1,260p' "$fixture"
          done
