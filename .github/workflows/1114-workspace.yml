# Temporary development workflow; not part of the implementation PR.
name: Issue 1114 hosted validation
on:
  push:
    branches: [agent/1114-workspace]
permissions:
  contents: read
concurrency:
  group: issue-1114-development
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Apply development patch
        run: |
          set -euo pipefail
          cat .agent-1114/patch.0 .agent-1114/patch.1 .agent-1114/patch.2 | base64 --decode | xz --decompress > "$RUNNER_TEMP/1114.patch"
          echo 'fd663d4b0ba60e38f017b8cd1d084b8e7bc782d85aaf4ffbda000b62ce2f3f93  '"$RUNNER_TEMP/1114.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/1114.patch"
          git apply "$RUNNER_TEMP/1114.patch"
          for patch in .agent-1114/fix-*.patch; do test ! -f "$patch" || git apply "$patch"; done
          git diff --check
          mkdir -p "$RUNNER_TEMP/1114-tests"
          echo "TMPDIR=$RUNNER_TEMP/1114-tests" >> "$GITHUB_ENV"
      - name: Install pinned correctness tools on the available disposable image
        run: |
          set -euo pipefail
          sed -e 's/test "$VERSION_ID" = 26.04/test "$VERSION_ID" = 24.04/' -e 's/zstd linux-perf qemu-user/zstd qemu-user/' -e '/^perf --version$/d' -e 's/kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 //' tools/ci/setup-hosted.sh > tools/ci/1114-setup-hosted.sh
          bash tools/ci/1114-setup-hosted.sh
          rm tools/ci/1114-setup-hosted.sh
      - name: Build
        run: ./build.sh --config Debug --jobs 4 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Focused debug regressions
        id: tests
        continue-on-error: true
        run: |
          set -uo pipefail
          status=0
          timeout --kill-after=10s 120s ./build/compiler test-debug 2>&1 | tee "$RUNNER_TEMP/test-debug.log" || status=1
          timeout --kill-after=10s 180s ./build/compiler test-check-debug --cross-check --programs 1 --keep 2>&1 | tee "$RUNNER_TEMP/test-check-debug.log" || status=1
          timeout --kill-after=10s 120s ./build/compiler test-object-writer 2>&1 | tee "$RUNNER_TEMP/test-object-writer.log" || status=1
          exit "$status"
      - name: Capture compiler failure backtraces
        if: steps.tests.outcome == 'failure'
        run: |
          set -uo pipefail
          for source in "$TMPDIR"/buster-check-debug-*/dbg_rows.c "$TMPDIR"/buster-check-debug-*/dbg_values.c; do
              test ! -f "$source" || timeout --kill-after=10s 60s gdb -nx -batch -ex 'set debuginfod enabled off' -ex run -ex 'thread apply all bt' -ex 'info registers' --args ./build/compiler -g -o "$source.out" "$source" > "$source.compiler-gdb.log" 2>&1
          done
          find "$TMPDIR" -name '*.compiler-gdb.log' -exec cat {} +
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1114-validation-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/1114-tests
            build/compiler
          retention-days: 3
          if-no-files-found: ignore
      - name: Propagate correctness failure
        if: steps.tests.outcome == 'failure'
        run: exit 1
