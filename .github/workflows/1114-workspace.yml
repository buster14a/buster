# Temporary development workflow; not part of the implementation PR.
name: Issue 1114 hosted validation
on:
  push:
    branches: [agent/1114-workspace]
permissions:
  contents: read
concurrency:
  group: issue-1114-development
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Apply development patch
        run: |
          set -euo pipefail
          cat .agent-1114/patch.0 .agent-1114/patch.1 .agent-1114/patch.2 | base64 --decode | xz --decompress > "$RUNNER_TEMP/1114.patch"
          echo 'fd663d4b0ba60e38f017b8cd1d084b8e7bc782d85aaf4ffbda000b62ce2f3f93  '"$RUNNER_TEMP/1114.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/1114.patch"
          git apply "$RUNNER_TEMP/1114.patch"
          for patch in .agent-1114/fix-*.patch; do test ! -f "$patch" || git apply "$patch"; done
          git diff --check
      - name: Install hosted correctness tools
        run: bash tools/ci/setup-hosted.sh
      - name: Build
        run: ./build.sh --jobs 4 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Focused debug regressions
        run: |
          set -euo pipefail
          ./build/compiler cores
          ./build/compiler test-debug --cross-check 2>&1 | tee "$RUNNER_TEMP/test-debug.log"
          ./build/compiler test-check-debug --cross-check 2>&1 | tee "$RUNNER_TEMP/test-check-debug.log"
          ./build/compiler test-object-writer 2>&1 | tee "$RUNNER_TEMP/test-object-writer.log"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1114-validation-${{ github.run_number }}
          path: ${{ runner.temp }}/*.log
          retention-days: 3
          if-no-files-found: ignore
