name: Policy-resolution source snapshot

on:
  push:
    branches:
      - research/policy-resolution-census-20260925-ade6
    paths:
      - .github/workflows/policy-resolution-source.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Archive the exact immutable checkout without running repository code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/policy-source"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/policy-source/identity.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/policy-source/source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/policy-source/source.tar.gz" > "$RUNNER_TEMP/policy-source/archive.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: policy-resolution-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/policy-source
          retention-days: 7
          if-no-files-found: error
