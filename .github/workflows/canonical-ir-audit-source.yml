name: Canonical IR audit source

on:
  push:
    branches:
      - audit/canonical-ir-source-9834a42

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pack main source and history
        shell: bash
        run: |
          set -euo pipefail
          git archive 9834a4253c61934a8a253641a84741a25d3717e3 | gzip > "$RUNNER_TEMP/buster-main.tar.gz"
          git bundle create "$RUNNER_TEMP/buster-main.bundle" refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-ir-audit-main
          path: |
            ${{ runner.temp }}/buster-main.tar.gz
            ${{ runner.temp }}/buster-main.bundle
          if-no-files-found: error
          retention-days: 1
