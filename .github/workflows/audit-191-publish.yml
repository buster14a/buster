name: Publish verified audit 191 tree
on:
  push:
    branches: [work/audit-encoding-191-publish-20260907]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply hash-checked local patch to its exact baseline
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode <<'PATCH' | gzip --decompress > "$RUNNER_TEMP/audit.patch"
          
          
          
          PATCH
          printf '%s  %s\n' 5e3f6fd7a75103807e0ebab98f00376e5288be542ebf07f31ec071c512874b1f "$RUNNER_TEMP/audit.patch" | sha256sum --check
          git checkout --detach ebfdd11705bc470564e726857e498f1c82aa746c
          git apply --check "$RUNNER_TEMP/audit.patch"
          git apply --index "$RUNNER_TEMP/audit.patch"
          test "$(git write-tree)" = 9ec96ae199e9bac14a9c9d6106dc44d7d8be6896
          git config user.name 'Buster audit'
          git config user.email 'buster-audit@users.noreply.github.com'
          git commit -m 'fix: scale EVEX broadcasts by memory element width'
          git push origin HEAD:refs/heads/work/audit-encoding-191-object-20260907
