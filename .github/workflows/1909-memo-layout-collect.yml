name: Expression memo evidence collection
on:
  push:
    branches: [codex/1909-memo-layout-research]
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Wait for the existing fixed-budget experiment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          request=urllib.request.Request('https://api.github.com/repos/buster14a/buster/actions/runs/36644404652',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          for attempt in range(60):
              with urllib.request.urlopen(request) as response: run=json.load(response)
              if run['status']=='completed':
                  print('Existing run completed:',run['conclusion'])
                  break
              time.sleep(10)
          else: raise RuntimeError('Existing experiment did not finish within collection budget')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 36644316090
          path: raw/attempt1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 36644404652
          path: raw/attempt2
      - name: Preserve compact evidence and run offline census
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil
          root=pathlib.Path('compact')
          excluded={'baseline-ide','observer-ide','candidate-ide','build-driver','replay','replay-sanitized'}
          for path in pathlib.Path('raw').rglob('*'):
              if path.is_file() and path.name not in excluded and path.suffix != '.o':
                  dest=root/path.relative_to('raw')
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(path,dest)
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          (root/'collection-manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
          python3 tools/investigations/1909-memo-layout/census.py compact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: memo-layout-slim-${{ github.run_id }}
          path: compact
          retention-days: 30
