name: Slot evidence collection

on:
  push:
    branches:
      - codex/1912-slot-coloring-evidence
    paths:
      - tools/collect_slot_evidence.py
      - .github/workflows/slot-evidence-collection.yml

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify original artifact and retain compact evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/collect_slot_evidence.py
      - name: Publish compact evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compact-slot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compact-slot-evidence
          if-no-files-found: error
          retention-days: 14
