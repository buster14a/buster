name: Final integration validation
on:
  push:
    branches: [work/2026-09-06-integration-gates]
    paths: [.github/workflows/object-size-final-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.server_url == 'https://github.com'
    name: ${{ matrix.prefix }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        prefix: [fortify, fortify-wasm, fortify-wasm-ebpf]
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 57bffcfe01a490f2467e74e3eafbb0d2c6014918
          fetch-depth: 0
          persist-credentials: false
      - name: Construct and identify the exact cumulative candidate
        shell: bash
        env:
          PREFIX: ${{ matrix.prefix }}
        run: |
          set -euo pipefail
          git config user.name 'Integration validation'
          git config user.email 'noreply@localhost'
          git config core.autocrlf false
          base=017b0381ed75d859043b60a92f2ec2e9f5872980
          expected=9f5573090a9f78966f2856fb47e0d527e5e6e687
          if [[ "$PREFIX" != fortify ]]; then
            git fetch origin 120da7753d6419a54618abbc4c827e1123a863cc
            while IFS= read -r commit; do git cherry-pick "$commit"; done < <(git rev-list --reverse "$base..120da7753d6419a54618abbc4c827e1123a863cc")
            expected=ffd278ca36b3f72dcff781d173a322ed8a0f5cfa
          fi
          if [[ "$PREFIX" == fortify-wasm-ebpf ]]; then
            git fetch origin bb9a5d74288e6ada1d23492004974de7f75f5110
            while IFS= read -r commit; do git cherry-pick "$commit"; done < <(git rev-list --reverse "$base..bb9a5d74288e6ada1d23492004974de7f75f5110")
            expected=0e52609352ac8ef8515c3fc6c941555e7bd55d1f
          fi
          test "$(git rev-parse HEAD^{tree})" = "$expected"
          printf 'tree=%s\n' "$expected" | tee "$RUNNER_TEMP/final-identity.log"
      - name: Install Vulkan SDK
        if: runner.os != 'Windows'
        shell: bash
        run: bash .github/scripts/install-vulkan-sdk.sh
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: . .github/scripts/install-vulkan-sdk.ps1
      - name: Full Release suite, fixed point and mode matrix (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CFLAGS: -Wno-invalid-feature-combination
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/buster-build"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver"
          "$driver" generate --cc clang --ci --linker DEFAULT
          "$driver" build --config Release -t test_all 2>&1 | tee "$RUNNER_TEMP/final-suite.log"
          "$driver" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/final-self-host.log"
          "$driver" test_mode_matrix --config Release 2>&1 | tee "$RUNNER_TEMP/final-modes.log"
      - name: Verify effects and explicit-bound failure against Clang
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/final-runtime.log"
          import os,pathlib,signal,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          reference=root/'fortify-clang'
          source='tests/basic_c_builtin_memory.c'
          subprocess.run(['clang','-O2',source,'-o',str(reference)],check=True)
          subprocess.run([str(reference)],check=True)
          expected={}
          # Darwin's checked-runtime reference traps with SIGTRAP (-5),
          # observed in run 34064082734. Linux aborts. Reject ordinary exits
          # and memory faults; every Buster case must match its host oracle.
          checked_signals={-signal.SIGABRT,-signal.SIGILL,-signal.SIGTRAP}
          for operation in ('copy','move','set'):
              result=subprocess.run([str(reference),operation],capture_output=True)
              assert result.returncode in checked_signals, (operation,result.returncode,result.stderr)
              expected[operation]=result.returncode
              print('clang',operation,'checked failure:',result.returncode)
          for allocator in ('fast','none','mir-stack','quality'):
              executable=root/('fortify-'+allocator)
              subprocess.run(['build/Release/ide','cc','-fregister-allocator='+allocator,source,'-o',str(executable)],check=True)
              subprocess.run([str(executable)],check=True)
              for operation in expected:
                  result=subprocess.run([str(executable),operation],capture_output=True)
                  assert result.returncode==expected[operation], (allocator,operation,result.returncode,expected[operation])
                  print(allocator,operation,'checked failure preserved:',result.returncode)
          PY
      - name: Mandatory Wasm engine and optimized sanitizer regressions
        if: runner.os == 'Linux' && matrix.prefix != 'fortify'
        shell: bash
        run: |
          set -euo pipefail
          build/Release/ide cc -target wasm64-unknown-freestanding -nostdinc tests/basic_c_wasm64_alignment.c -o "$RUNNER_TEMP/alignment.wasm"
          node --experimental-wasm-memory64 tests/wasm_memory_alignment_execution.js "$RUNNER_TEMP/alignment.wasm" | tee "$RUNNER_TEMP/final-wasm.log"
          CC=clang AUDIT_OPT=-O2 AUDIT_SANITIZE=1 ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 python3 tests/wasm_memory_alignment_regression.py 2>&1 | tee "$RUNNER_TEMP/final-wasm-sanitizers.log"
          if [[ '${{ matrix.prefix }}' == fortify-wasm-ebpf ]]; then
            CC=clang AUDIT_OPT=-O2 AUDIT_SANITIZE=1 ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 python3 tests/ebpf_scalar_regression.py 2>&1 | tee "$RUNNER_TEMP/final-ebpf-sanitizers.log"
          fi
      - name: Full Release suite and fixed point (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPath = (& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1).Trim()
          if (-not $VsPath) { throw 'Visual Studio with VC tools was not found' }
          & (Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $Driver = Join-Path $env:RUNNER_TEMP 'buster-build.exe'
          cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$Driver`" generate --cc clang --ci"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$Driver`" build --config Release -t test_all"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$Driver`" test_self_host --config Release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve exact-candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-${{ matrix.prefix }}-${{ matrix.os }}
          path: ${{ runner.temp }}/final-*.log
          retention-days: 7
          if-no-files-found: error
