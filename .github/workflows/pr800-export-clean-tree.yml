name: PR 800 clean tree export

on:
  push:
    branches:
      - fix/72-aarch64-binary128
    paths:
      - .github/workflows/pr800-export-clean-tree.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 984d8ed63afab620f8cb176715e3dac06c655143
          persist-credentials: false
      - name: Archive exact clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 984d8ed63afab620f8cb176715e3dac06c655143
          git archive --format=tar.gz --output="$RUNNER_TEMP/pr800-clean-tree.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/pr800-clean-tree.tar.gz" > "$RUNNER_TEMP/pr800-clean-tree.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr800-clean-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr800-clean-tree.tar.gz
            ${{ runner.temp }}/pr800-clean-tree.sha256
          retention-days: 1
