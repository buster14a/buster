name: Publish measured parser-frame audit

on:
  push:
    branches: [audit/publish-parser-frames-20260907]
    paths: [.github/workflows/publish-parser-frames-audit.yml]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ebfdd11705bc470564e726857e498f1c82aa746c
          fetch-depth: 1
      - name: Apply the validated source delta on pinned current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 9834a4253c61934a8a253641a84741a25d3717e3
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          encoded = ''
          # Normalize the one transport-only character in the pasted encoding.
          encoded = encoded.replace('UVPxB1lQT4x', 'UVPxB1QT4x')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '621dfe9e66e42f117e6b095e84d721214023ae1d9a8ea702a2168665e7288b32'
          pathlib.Path('/tmp/parser-frames.patch').write_bytes(patch)
          PY
          git apply --3way --index /tmp/parser-frames.patch
          git diff --cached --check
          python3 - <<'PY'
          import hashlib, subprocess
          diff = subprocess.check_output(['git', 'diff', '--cached', '--full-index']).decode()
          lines = [x for x in diff.splitlines() if x.startswith('diff --git ') or (x.startswith(('+', '-')) and not x.startswith(('+++', '---')))]
          assert hashlib.sha256('\n'.join(lines).encode()).hexdigest() == 'dc800633697fae37ba62ceb851905f66ad2fd9399815c41550ca86079f622d40'
          assert subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines() == ['src/buster/lib/compiler/frontend/c/c_parse.c', 'src/buster/tests/compiler/frontend/c/c_test.c']
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c perf/parser-body-frame-storage-20260907
          git commit -m 'c: reuse depth-sized parser body-frame storage' -m 'Validated source delta from local commit 93c14525105e48f11cbf8f14f28c05a8df2dbcae, applied without changing unrelated main work. Baseline A/B and integration scope are recorded on the PR.'
          git push origin HEAD:refs/heads/perf/parser-body-frame-storage-20260907
          git archive --format=tar.gz -o "$RUNNER_TEMP/parser-frames-source.tar.gz" HEAD
          git diff --full-index ebfdd11705bc470564e726857e498f1c82aa746c HEAD > "$RUNNER_TEMP/parser-frames-current-main.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/parser-frames-head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: parser-frames-integrated-source
          path: |
            ${{ runner.temp }}/parser-frames-source.tar.gz
            ${{ runner.temp }}/parser-frames-current-main.patch
            ${{ runner.temp }}/parser-frames-head.txt
          if-no-files-found: error
          retention-days: 3
