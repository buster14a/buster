name: Diagnose PR 94 String8 formatter failure

on:
  push:
    branches:
      - claude/unruffled-bhabha-f5d28a
    paths:
      - .github/workflows/diagnose-pr94-bad-s8.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: claude/unruffled-bhabha-f5d28a
          fetch-depth: 0
      - name: Add active-format diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          build = Path("build.c")
          text = build.read_text()
          old = "#define arena_allocate_bytes(arena, size, alignment) arena_allocate_bytes_with_location((arena), (size), (alignment), __FILE__, __LINE__)\n#include <buster/lib/string.c>\n"
          new = "#define arena_allocate_bytes(arena, size, alignment) arena_allocate_bytes_with_location((arena), (size), (alignment), __FILE__, __LINE__)\n#define BUSTER_STRING_FORMAT_DIAGNOSTICS 1\n#include <buster/lib/string.c>\n#undef BUSTER_STRING_FORMAT_DIAGNOSTICS\n"
          if old not in text:
              raise SystemExit("build.c include anchor not found")
          build.write_text(text.replace(old, new, 1))

          source = Path("src/buster/lib/string.c")
          text = source.read_text()
          old_lines = [
              "            case FORMAT_TYPE_STRING8:",
              "            {",
              "                String8 string = va_arg(variable_arguments, String8);",
              "                arena_append_string(arena, string);",
              "            }",
          ]
          new_lines = [
              "            case FORMAT_TYPE_STRING8:",
              "            {",
              "                String8 string = va_arg(variable_arguments, String8);",
              "#if defined(BUSTER_STRING_FORMAT_DIAGNOSTICS)",
              "                if (BUSTER_UNLIKELY(string.length > ARENA_MAX_RESERVATION))",
              "                {",
              "                    fprintf(stderr,",
              "                            \"STRING_FORMAT_BAD_S8 format=%.*s type=%.*s pointer=%p length=%llu format_index=%llu right_brace=%llu\\\\n\",",
              "                            (int)format.length, format.pointer, (int)type_name.length, type_name.pointer, (void*)string.pointer,",
              "                            (unsigned long long)string.length, (unsigned long long)format_index, (unsigned long long)right_brace_index);",
              "                    fflush(stderr);",
              "                }",
              "#endif",
              "                arena_append_string(arena, string);",
              "            }",
          ]
          old = "\n".join(old_lines) + "\n"
          new = "\n".join(new_lines) + "\n"
          if old not in text:
              raise SystemExit("string.c formatter anchor not found")
          source.write_text(text.replace(old, new, 1))
          PY
      - name: Commit diagnostics and remove this workflow
        shell: bash
        run: |
          git config user.name David
          git config user.email davidgmbb@gmail.com
          git rm .github/workflows/diagnose-pr94-bad-s8.yml
          git add build.c src/buster/lib/string.c
          git commit -m "ci: report malformed String8 format arguments"
          git push origin HEAD:claude/unruffled-bhabha-f5d28a
