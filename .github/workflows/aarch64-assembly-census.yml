name: Native AArch64 assembly census

on:
  pull_request:
    paths:
      - '.github/workflows/aarch64-assembly-census.yml'
      - 'build.c'
      - 'tools/aarch64_assembly_census.c'
      - 'src/buster/apps/ide/ide.c'
      - 'src/buster/lib/compiler/assembly/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aarch64-assembly-census-${{ github.event_name }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  census:
    name: Hosted native AArch64 corpus
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      BUSTER_TEST_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record source, authority and host identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a64-census-evidence"
          git rev-parse HEAD 'HEAD^{tree}' | tee "$RUNNER_TEMP/a64-census-evidence/source.txt"
          git rev-parse 'HEAD:src/buster/lib/compiler/assembly/generated/arm-a64-canonical-manifest.json' > "$RUNNER_TEMP/a64-census-evidence/authority.txt"
          clang --version | tee "$RUNNER_TEMP/a64-census-evidence/toolchain.txt"
          llvm-mc-21 --version | tee -a "$RUNNER_TEMP/a64-census-evidence/toolchain.txt"
          llvm-objdump-21 --version | tee -a "$RUNNER_TEMP/a64-census-evidence/toolchain.txt"
          uname -a > "$RUNNER_TEMP/a64-census-evidence/host.txt"
          lscpu >> "$RUNNER_TEMP/a64-census-evidence/host.txt"
          free -b >> "$RUNNER_TEMP/a64-census-evidence/host.txt"
      - name: Bootstrap native driver
        id: driver
        shell: bash
        run: |
          set -euo pipefail
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char -g build.c -o "$RUNNER_TEMP/a64-census-build" 2>&1 | tee "$RUNNER_TEMP/a64-census-evidence/bootstrap.log"
      - name: Verify native negative controls
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/a64-census-build" test_aarch64_assembly_census --self-test 2>&1 | tee "$RUNNER_TEMP/a64-census-evidence/self-test.log"
      - name: Build exact candidate compiler
        id: compiler
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/a64-census-build" generate --cc clang --ci --linker DEFAULT 2>&1 | tee "$RUNNER_TEMP/a64-census-evidence/configure.log"
          "$RUNNER_TEMP/a64-census-build" build --config Release -t ide -- -j2 2>&1 | tee "$RUNNER_TEMP/a64-census-evidence/build.log"
          sha256sum "$RUNNER_TEMP/a64-census-build" build/Release/ide > "$RUNNER_TEMP/a64-census-evidence/binaries.txt"
      - name: Compare fixture-derived constant instructions
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/a64-census-build" test_aarch64_assembly_census --ide build/Release/ide --clang clang --llvm-mc llvm-mc-21 --llvm-objdump llvm-objdump-21 --out "$RUNNER_TEMP/a64-census-evidence/corpus" 2>&1 | tee "$RUNNER_TEMP/a64-census-evidence/census.log"
      - name: Generate native source-size acknowledgment
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/a64-census-build" source_size --write-baseline 2>&1 | tee "$RUNNER_TEMP/a64-census-evidence/source-size.log"
          cp docs/source-size-baseline.txt "$RUNNER_TEMP/a64-census-evidence/source-size-baseline.txt"
          printf 'SOURCE_SIZE_BASELINE_GENERATED_BEGIN revision=%s\n' "$GITHUB_SHA"
          cat "$RUNNER_TEMP/a64-census-evidence/source-size-baseline.txt"
          printf 'SOURCE_SIZE_BASELINE_GENERATED_END\n'
      - name: Retain complete corpus evidence on success or failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aarch64-assembly-census-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a64-census-evidence/
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
