name: Audit correctness source

on:
  push:
    branches:
      - audit/2026-09-07-correctness-source

permissions:
  contents: read

jobs:
  source:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ebfdd11705bc470564e726857e498f1c82aa746c
          fetch-depth: 3
          path: buster
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TinyCC/tinycc
          ref: 0fb54300b56512754221d80adda85ddb9815bceb
          fetch-depth: 1
          path: tinycc
          persist-credentials: false
      - name: Pack pinned source and bootstrap toolchain source
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/audit-source"
          mkdir -p "$out"
          git -C buster rev-parse HEAD > "$out/REVISION"
          git -C buster rev-parse HEAD^{tree} > "$out/TREE"
          git -C tinycc rev-parse HEAD > "$out/TCC_REVISION"
          tar -C buster -czf "$out/buster-main.tar.gz" .
          tar -C tinycc --exclude=.git -czf "$out/tinycc-source.tar.gz" .
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user-static
          cp /usr/bin/qemu-aarch64-static "$out/"
          cd "$out"
          sha256sum buster-main.tar.gz tinycc-source.tar.gz qemu-aarch64-static > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: audit-correctness-source-ebfdd117
          path: ${{ runner.temp }}/audit-source/
          if-no-files-found: error
          retention-days: 3
