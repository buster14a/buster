name: Audit correctness source

on:
  push:
    branches:
      - audit/2026-09-07-correctness-source

permissions:
  contents: read

jobs:
  source:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 66bf321936ccb2b4f0df42cb6f65ed197f8652b5
          fetch-depth: 1
          persist-credentials: false
      - name: Pack pinned source and distro bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-source"
          git rev-parse HEAD > "$RUNNER_TEMP/audit-source/REVISION"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/audit-source/TREE"
          tar -czf "$RUNNER_TEMP/audit-source/buster-main.tar.gz" .
          cd "$RUNNER_TEMP/audit-source"
          sudo apt-get update -qq
          apt-get download tcc
          sha256sum buster-main.tar.gz *.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: audit-correctness-source-66bf321
          path: ${{ runner.temp }}/audit-source/
          if-no-files-found: error
          retention-days: 3
