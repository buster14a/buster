name: Apply issue 183 fix v2

on:
  push:
    branches:
      - fix/183-gnu17-enum-types
    paths:
      - .github/workflows/issue-183-apply-v2.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Repair guarded header edit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/issue-183-apply.py')
          text = path.read_text()
          start_marker = '''replace_once(
              "src/buster/lib/compiler/frontend/c/c_internal.h",'''
          start = text.index(start_marker)
          end = text.index('\n\nreplace_once(', start + len(start_marker))
          replacement = '''header_path = Path("src/buster/lib/compiler/frontend/c/c_internal.h")
          header = header_path.read_text()
          declaration_start = header.index("BUSTER_C_EXTERN bool c_integer_expression_evaluate(")
          declaration_end = header.index(";\\n", declaration_start) + 2
          typed_declaration = """\nBUSTER_C_EXTERN bool c_integer_expression_evaluate_typed(Arena* arena, char8 const* spelling_base, CToken* tokens, u32 token_count,
                                                            u32 expansion_limit, CPreprocessResult* result, u64* value_out,
                                                            bool* is_unsigned_out);"""
          header_path.write_text(header[:declaration_end] + typed_declaration + header[declaration_end:])'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Apply production patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/issue-183-apply.py
          rm -rf .github/issue-183-context.txt .github/issue-183-context .github/issue-183-deep
          rm -f .github/issue-183-apply.py .github/workflows/issue-183-apply.yml .github/workflows/issue-183-apply-v2.yml
          git diff --check
          git status --short
          git diff --stat
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUSTER_STDOUT_ASSERTS=TRUE \
            -DBUILD_TESTING=ON
      - name: Build
        shell: bash
        run: cmake --build build --parallel 2
      - name: Verify and run enum regression
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -N | tee /tmp/issue-183-tests.txt
          grep -Ei 'enum.*underlying|underlying.*enum' /tmp/issue-183-tests.txt
          ctest --test-dir build --output-on-failure -R 'enum.*underlying|underlying.*enum'
      - name: Run full test suite
        shell: bash
        run: ctest --test-dir build --output-on-failure
      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(c): select GNU17 enum compatible types'
          git push origin HEAD:${GITHUB_REF_NAME}
