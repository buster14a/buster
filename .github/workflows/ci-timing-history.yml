name: Hosted CI timing history
on:
  pull_request:
    paths:
      - 'tools/ci_metrics*'
      - 'docs/ci-timing-history.md'
      - '.github/workflows/ci-timing-history.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ci_metrics*'
      - 'docs/ci-timing-history.md'
      - '.github/workflows/ci-timing-history.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional existing terminal run ID for bounded backfill (never reruns workloads)
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: ci-timing-history-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    name: Native CI history controls
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: ubuntu-26.04
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Compile native collector with warnings and sanitizers
        run: |
          clang -std=c11 -Isrc -O1 -g -Wall -Wextra -Werror -Wno-unused-function -fwrapv -fno-strict-aliasing -funsigned-char -fsanitize=address,undefined tools/ci_metrics.c -lm -o "$RUNNER_TEMP/ci-metrics"
          "$RUNNER_TEMP/ci-metrics" --self-test
          gcc -std=c11 -Isrc -O2 -Wall -Wextra -Werror -Wno-unused-function -fwrapv -fno-strict-aliasing -funsigned-char tools/ci_metrics.c -lm -o "$RUNNER_TEMP/ci-metrics-gcc"
          "$RUNNER_TEMP/ci-metrics-gcc" --self-test
      - name: Native source-size report
        run: |
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/buster-metrics-build"
          "$RUNNER_TEMP/buster-metrics-build" source_size --write-baseline
          cat docs/source-size-baseline.txt
          "$RUNNER_TEMP/buster-metrics-build" source_size --base HEAD^1
          git diff --check HEAD^1 HEAD
  preview:
    name: Authentic Linux and Windows execution joins
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: ubuntu-26.04
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Collect two existing terminal executions without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          clang -std=c11 -Isrc -O2 -Wall -Wextra -Werror -Wno-unused-function -fwrapv -fno-strict-aliasing -funsigned-char tools/ci_metrics.c -lm -o "$RUNNER_TEMP/ci-metrics"
          "$RUNNER_TEMP/ci-metrics" collect --run 37459678394 --job 112256466829 --expect-machine 1 --out "$RUNNER_TEMP/metrics-linux"
          "$RUNNER_TEMP/ci-metrics" collect --run 37459678394 --job 112256467684 --expect-machine 1 --out "$RUNNER_TEMP/metrics-windows"
      - name: Preserve read-only preview
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-timing-preview
          path: |
            ${{ runner.temp }}/metrics-linux
            ${{ runner.temp }}/metrics-windows
          retention-days: 14
          if-no-files-found: warn
  collect:
    name: Collect terminal Actions executions
    if: github.repository == 'buster14a/buster' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    outputs:
      bundle_ready: ${{ steps.collect.outputs.bundle_ready }}
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: ubuntu-26.04
      - name: Trusted collector checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Compile trusted native collector
        run: clang -std=c11 -Isrc -O2 -Wall -Wextra -Werror -Wno-unused-function -fwrapv -fno-strict-aliasing -funsigned-char tools/ci_metrics.c -lm -o "$RUNNER_TEMP/ci-metrics"
      - name: Reconcile terminal executions and stage allowlisted reports
        id: collect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -n "$REQUESTED_RUN_ID" ]; then
            "$RUNNER_TEMP/ci-metrics" collect --run "$REQUESTED_RUN_ID" --out "$RUNNER_TEMP/ci-timing-bundle"
          else
            "$RUNNER_TEMP/ci-metrics" collect --days 2 --max-runs 100 --out "$RUNNER_TEMP/ci-timing-bundle"
          fi
      - name: Retain trusted publication bundle
        if: always() && steps.collect.outputs.bundle_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-timing-publication
          path: ${{ runner.temp }}/ci-timing-bundle
          retention-days: 7
          if-no-files-found: error
      - name: Expose incomplete collection
        if: always() && steps.collect.outcome != 'success'
        run: |
          printf 'Collection has visible gaps; retained authentic partial observations may still be published.\n' >> "$GITHUB_STEP_SUMMARY"
          exit 1
  publish:
    name: Publish advisory CI history
    needs: collect
    if: always() && github.repository == 'buster14a/buster' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.collect.outputs.bundle_ready == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: ubuntu-26.04
      - name: Trusted publisher checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Compile trusted native publisher
        run: clang -std=c11 -Isrc -O2 -Wall -Wextra -Werror -Wno-unused-function -fwrapv -fno-strict-aliasing -funsigned-char tools/ci_metrics.c -lm -o "$RUNNER_TEMP/ci-metrics"
      - name: Read only this trusted run's generated artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: buster14a/buster
        run: gh run download "$GITHUB_RUN_ID" --name ci-timing-publication --dir "$RUNNER_TEMP/ci-timing-bundle"
      - name: Validate publication lease and append raw history
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/ci-metrics" publish --out "$RUNNER_TEMP/ci-timing-bundle"'
