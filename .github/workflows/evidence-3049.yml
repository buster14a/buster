name: Conditional AND evidence for 3049
on:
  push:
    branches: [evidence/3049-hosted-and]
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      BUSTER_HOST_ARCH: vector
      BUSTER_SANITIZER: none
      BUSTER_DEBUG_INFO: 0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Verify hosted CPU
        run: |
          lscpu | grep 'Model name'
          cc -O2 -march=x86-64-v4 -maes -mgfni -mvaes -mavx512vbmi -mavx512vbmi2 -mavx512vpopcntdq -mavx512bitalg -mavx512vnni tools/ci/vector-probe.c -o /tmp/probe
          /tmp/probe
      - name: Compare base and head on this runner
        run: bash evidence/3049/compare.sh b847801169f2b73aed6496c8fa23e9a5499c94e7 a2157ceaf5ec05a176118beb843cc4eb6f6aa967
