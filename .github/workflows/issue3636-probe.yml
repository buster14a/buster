name: Issue 3636 hosted probe
on:
  push:
    branches: [codex/3636-typeof-label-address]
permissions:
  contents: read
jobs:
  typeof-label:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Hosted bootstrap and fixed point
        shell: bash
        run: |
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/issue3636-driver"
          "$RUNNER_TEMP/issue3636-driver" generate --cc clang --config Release --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
          "$RUNNER_TEMP/issue3636-driver" build --config Release -t ide
      - name: GNU label cast independent oracles and candidate
        shell: bash
        run: |
          set -euo pipefail
          for source in tests/issue3636_probe*.c; do
          for dialect in gnu17 gnu23; do
            gcc -std="$dialect" "$source" -o "$RUNNER_TEMP/gcc-probe"
            "$RUNNER_TEMP/gcc-probe"
            clang -std="$dialect" "$source" -o "$RUNNER_TEMP/clang-probe"
            "$RUNNER_TEMP/clang-probe"
            for pilot in default pilot; do
              for form in ssa memory; do
                options=()
                if [ "$pilot" = pilot ]; then options+=(-fc-ast-pilot); fi
                if [ "$form" = memory ]; then options+=(-fno-frontend-ssa); fi
                set +e
                build/Release/ide cc -std="$dialect" "${options[@]}" "$source" -o "$RUNNER_TEMP/buster-probe"
                result=$?
                set -e
                echo "source=$source candidate dialect=$dialect pilot=$pilot form=$form result=$result"
                test "$result" -eq 0
                "$RUNNER_TEMP/buster-probe"
              done
            done
          done
          done
      - name: Registered Release suite and fixed point
        shell: bash
        run: |
          "$RUNNER_TEMP/issue3636-driver" build --config Release -t test_all
          "$RUNNER_TEMP/issue3636-driver" test_self_host --config Release
          "$RUNNER_TEMP/issue3636-driver" source_size --base 674bc77660c8c588c815c21fcc9e148f83094de1
