name: Z01 census publication

on:
  push:
    branches: [astra/z01-248-transport]
    paths: [.github/workflows/z01-census-publication.yml]

permissions: {}

concurrency:
  group: z01-census-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: payload
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 2f5f9be468f154006dd923ce57afec84985e3459
          path: source
          persist-credentials: false
      - name: Record baseline format failure and publish reviewed documentation
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 ../payload/.github/z01/publish_docs.py
      - name: Strict audit-format gate (existing historical error is not suppressed)
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/new_audit.py --check 2>&1 | tee "$RUNNER_TEMP/z01-census/candidate-audit-check.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: z01-census-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/z01-census/
          if-no-files-found: error
          retention-days: 7
