name: Issue 1902 pragma generation oracle
on:
  push:
    branches: [codex/1902-pragma-generation-oracle]
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Report isolated Clang and GCC macro rescan witnesses
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, tempfile
          cases = json.loads(r'''[{"id":"newline_alias_line","source":"#define F(x) x\n#define A F\nA\n(__LINE__)\n","expected":"4"},{"id":"restore_during_prescan","source":"#define X 1\n#pragma push_macro(\"X\")\n#undef X\n#define X 2\n#define RESTORE _Pragma(\"pop_macro(\\\"X\\\")\")\n#define ID(x) x\nID(RESTORE X) X\n","expected":"1 1"},{"id":"duplicated_pop","source":"#define X 1\n#pragma push_macro(\"X\")\n#undef X\n#define X 2\n#pragma push_macro(\"X\")\n#undef X\n#define X 3\n#define DUP(x) x x\nDUP(_Pragma(\"pop_macro(\\\"X\\\")\") X) X\n","expected":"2 2 2"},{"id":"same_generation","source":"#define SAME _Pragma(\"push_macro(\\\"SAME\\\")\") _Pragma(\"pop_macro(\\\"SAME\\\")\") SAME\nSAME\n","expected":"SAME"}]''')
          for cc in ("clang", "gcc"):
              version = subprocess.run([cc, "--version"], capture_output=True, text=True, check=True).stdout.splitlines()[0]
              print(json.dumps({"compiler": cc, "version": version}), flush=True)
              for case in cases:
                  with tempfile.TemporaryDirectory() as directory:
                      source = pathlib.Path(directory) / "probe.c"
                      source.write_text(case["source"])
                      try:
                          result = subprocess.run([cc, "-E", "-P", "-std=c17", str(source)], capture_output=True, text=True, timeout=8)
                          record = {"case": case["id"], "compiler": cc, "expected": case["expected"], "returncode": result.returncode, "stdout": result.stdout, "stderr": result.stderr, "timed_out": False}
                      except subprocess.TimeoutExpired as error:
                          def decode(value):
                              return value.decode(errors="replace") if isinstance(value, bytes) else (value or "")
                          record = {"case": case["id"], "compiler": cc, "expected": case["expected"], "stdout": decode(error.stdout), "stderr": decode(error.stderr), "timed_out": True}
                      print(json.dumps(record), flush=True)
                    PY
