name: Issue 1902 pragma generation oracle
on:
  push:
    branches: [codex/1902-pragma-generation-oracle]
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Compare immutable valid preprocessing witnesses
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, tempfile
          from pathlib import Path
          cases = json.loads("{\"builtin_line\":\"#pragma push_macro(\\\"__LINE__\\\")\\n#undef __LINE__\\n#define __LINE__ 7\\n#pragma pop_macro(\\\"__LINE__\\\")\\n__LINE__\\n\",\"builtin_file\":\"#line 200 \\\"virtual.c\\\"\\n#pragma push_macro(\\\"__FILE__\\\")\\n#undef __FILE__\\n#define __FILE__ \\\"override\\\"\\n#pragma pop_macro(\\\"__FILE__\\\")\\n__FILE__\\n\",\"builtin_active\":\"#pragma push_macro(\\\"__LINE__\\\")\\n#undef __LINE__\\n#define __LINE__ _Pragma(\\\"pop_macro(\\\\\\\"__LINE__\\\\\\\")\\\") __LINE__\\n__LINE__ __LINE__\\n\"}")
          with tempfile.TemporaryDirectory() as directory:
              for compiler in ("clang", "gcc"):
                  print(subprocess.check_output([compiler, "--version"], text=True).splitlines()[0], flush=True)
                  for name, source in cases.items():
                      path = Path(directory) / (name + ".c")
                      path.write_text(source)
                      result = subprocess.run([compiler, "-E", "-P", "-std=c17", str(path)], text=True, capture_output=True)
                      print(json.dumps({"compiler": compiler, "case": name, "exit": result.returncode, "stdout": result.stdout, "stderr": result.stderr}), flush=True)
                      if result.returncode:
                          raise SystemExit(result.returncode)
          PY
