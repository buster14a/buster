name: Correctness audit source

on:
  push:
    branches:
      - audit/correctness-20260907-source

permissions:
  contents: read

jobs:
  source:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9834a4253c61934a8a253641a84741a25d3717e3
          fetch-depth: 0
          persist-credentials: false
      - name: Export pinned source history
        shell: bash
        run: git bundle create "$RUNNER_TEMP/buster-main.bundle" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: correctness-audit-main-9834a42
          path: ${{ runner.temp }}/buster-main.bundle
          if-no-files-found: error
          retention-days: 1
