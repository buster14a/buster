name: Correctness audit source
on:
  push:
    branches:
      - audit/correctness-20260907-source
permissions:
  contents: read
jobs:
  source:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TinyCC/tinycc
          ref: 0fb54300b56512754221d80adda85ddb9815bceb
          persist-credentials: false
      - name: Export pinned bootstrap source
        shell: bash
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/tinycc-0fb5430.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: correctness-audit-tinycc-0fb5430
          path: ${{ runner.temp }}/tinycc-0fb5430.tar.gz
          if-no-files-found: error
          retention-days: 1
