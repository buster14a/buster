name: Issue 659 isolated work
on:
  push:
    branches: [chatgpt/issue-659-work]
permissions:
  contents: write
concurrency:
  group: issue-659-isolated-work
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: 0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Integrate reviewed main and preserve atomic parameter ABIs
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/issue-659-integrate.patch" <<'PATCH'
          diff --git a/docs/c-checker.md b/docs/c-checker.md
          index 847a5fa..3864863 100644
          --- a/docs/c-checker.md
          +++ b/docs/c-checker.md
          @@ -516,0 +517,3 @@ definition is refused, as C17 6.7.6.3p3 has it; C23 rejects identifier lists.
          +Inline deferred type specifiers such as `_Atomic(T)` in the declaration list
          +remain outside this reader; the equivalent `_Atomic T` qualifier form and
          +previously declared typedefs are accepted.
          @@ -520,0 +524,3 @@ promotions for compatibility checking and ABI lowering, as clang types it
          +As in clang, `_Atomic` parameters retain their declared ABI types instead:
          +`_Atomic float` is not promoted to double, and an atomic aggregate keeps its
          +storage padding. Known calls retain these ABI types as well as their value conversions.
          diff --git a/src/buster/compiler/c_check_input.c b/src/buster/compiler/c_check_input.c
          index 9d1c3a8..413824c 100644
          --- a/src/buster/compiler/c_check_input.c
          +++ b/src/buster/compiler/c_check_input.c
          @@ -3074,0 +3075,8 @@ static TypeId check_input_declarator(CheckInputReader* reader, TypeId base, uint
          +// The ABI type of a K&R parameter. Unlike an argument expression's unary conversion, clang's parameter
          +// promotion preserves _Atomic: even _Atomic float arrives as float, and an atomic aggregate retains its padding.
          +static TypeId check_input_kr_parameter_type(const TypeTable* types, TypeId declared)
          +{
          +    const TypeId type = type_unqualified(declared);
          +    return type_kind(types, type_strip_aligned(types, type)) == BUSTER_TYPE_KIND_ATOMIC ? type : type_default_argument_promote(types, type);
          +}
          +
          @@ -3370 +3378 @@ static void check_input_declaration(CheckInputReader* reader, uint32_t first)
          -                    promoted[k++] = type_default_argument_promote(reader->types, type_unqualified(reader->declared_types[parameter]));
          +                    promoted[k++] = check_input_kr_parameter_type(reader->types, reader->declared_types[parameter]);
          diff --git a/src/buster/compiler/c_check_program_lower.c b/src/buster/compiler/c_check_program_lower.c
          index 3a81b90..9ede77b 100644
          --- a/src/buster/compiler/c_check_program_lower.c
          +++ b/src/buster/compiler/c_check_program_lower.c
          @@ -2632 +2631,0 @@ static void check_lower_call(CheckLowerWriter* writer, uint32_t node)
          -    const TypeId* parameter_types = type_parameters(types, type, &parameters);
          @@ -2633,0 +2633,3 @@ static void check_lower_call(CheckLowerWriter* writer, uint32_t node)
          +    // Keep a known K&R signature's atomic ABI types even though its designator has no prototype.
          +    const bool kr = (flags & BUSTER_TYPE_FLAG_PROTOTYPE) == 0 && type_kind(types, graph->types[node]) == BUSTER_TYPE_KIND_FUNCTION;
          +    const TypeId* parameter_types = type_parameters(types, kr ? graph->types[node] : type, &parameters);
          @@ -6513 +6515 @@ static inline __attribute__((always_inline)) void check_lower_part_body(CheckLow
          -            const TypeId parameter_type = kr ? type_default_argument_promote(types, type_unqualified(declared_type)) : declared_type;
          +            const TypeId parameter_type = kr ? check_input_kr_parameter_type(types, declared_type) : declared_type;
          @@ -6538,6 +6540,2 @@ static inline __attribute__((always_inline)) void check_lower_part_body(CheckLow
          -<<<<<<< HEAD
          -            if (!promoted && (type_qualifiers(declared_type) & BUSTER_TYPE_VOLATILE) != 0 && local < writer->local_count)
          -=======
          -            if (((type_qualifiers(parameter_type) & BUSTER_TYPE_VOLATILE) != 0 ||
          -                 type_kind(types, type_strip_aligned(types, parameter_type)) == BUSTER_TYPE_KIND_ATOMIC) && local < writer->local_count)
          ->>>>>>> 201e520d5be86720907b5019b62571d1e5507c68
          +            if (!promoted && ((type_qualifiers(declared_type) & BUSTER_TYPE_VOLATILE) != 0 ||
          +                              type_kind(types, type_strip_aligned(types, declared_type)) == BUSTER_TYPE_KIND_ATOMIC) && local < writer->local_count)
          @@ -6559 +6557 @@ static inline __attribute__((always_inline)) void check_lower_part_body(CheckLow
          -            const TypeId incoming_type = type_default_argument_promote(types, type_unqualified(declared_type));
          +            const TypeId incoming_type = check_input_kr_parameter_type(types, declared_type);
          diff --git a/src/buster/compiler/c_check_program_test.c b/src/buster/compiler/c_check_program_test.c
          index 4136268..c28f30f 100644
          --- a/src/buster/compiler/c_check_program_test.c
          +++ b/src/buster/compiler/c_check_program_test.c
          @@ -2945,0 +2946,8 @@ static __attribute__((noinline)) void check_test_programs(CheckTest* test, const
          +    // _Atomic parameters are not subject to the ordinary parameter promotions. Keep their ABI types and storage
          +    // padding alongside a promoted ordinary float, and their declared objects addressable for atomic accesses.
          +    check_test_program_source(test,
          +        "struct T{unsigned char a,b,c;};int take(x)_Atomic struct T x;{struct T v=x;return v.a+v.b*3+v.c*7;}"
          +        "int f(a,b,c,d)_Atomic int a;_Atomic unsigned char b;_Atomic float c;float d;"
          +        "{a+=2;b+=3;c+=0.5f;return a+b+(int)(c*10+d*10);}"
          +        "int tested(int n){struct T t={(unsigned char)n,5,7};return f(n&255,259,1.25,3.7)+take(t);}",
          +        "kr-atomic-and-promoted-parameters", clang);
          PATCH
          printf 'beed031df8702c7e4913a7896f658d2c138353a753ff07d6bb76522f23ec1787  %s\n' "$RUNNER_TEMP/issue-659-integrate.patch" | sha256sum -c
          git switch -c issue-659-integrated 66b3b87da2fed441441c7f9df2804f5b8dabc55e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit 201e520d5be86720907b5019b62571d1e5507c68 > "$RUNNER_TEMP/issue-659-merge.log" 2>&1 || test -f .git/MERGE_HEAD
          test "$(git diff --name-only --diff-filter=U)" = src/buster/compiler/c_check_program_lower.c
          git apply --unidiff-zero --check "$RUNNER_TEMP/issue-659-integrate.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/issue-659-integrate.patch"
          git add src/buster/compiler/c_check_input.c src/buster/compiler/c_check_program_lower.c src/buster/compiler/c_check_program_test.c docs/c-checker.md
          git diff --check --cached
          git commit -m 'Merge main atomic support while preserving K&R atomic parameter ABIs'
          git rev-parse HEAD > "$RUNNER_TEMP/issue-659-head.log"
          git archive --format=tar.gz -o "$RUNNER_TEMP/issue-659-source.tar.gz" HEAD
      - name: Install official Clang 23.1.4 and test tools
        run: bash tools/ci/setup-hosted.sh
      - name: Build compiler
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh 2>&1 | tee "$RUNNER_TEMP/issue-659-build.log"
      - name: Validate checker, driver and deferred reader
        shell: bash
        run: |
          set -uo pipefail
          status=0
          build/compiler test-checker --seed 133 2>&1 | tee "$RUNNER_TEMP/issue-659-checker.log" || status=1
          build/compiler test-checker-driver --executable build/compiler 2>&1 | tee "$RUNNER_TEMP/issue-659-driver.log" || status=1
          build/compiler test-checker-deferred 2>&1 | tee "$RUNNER_TEMP/issue-659-deferred.log" || status=1
          exit "$status"
      - name: Publish validated integration
        run: git push origin HEAD:refs/heads/chatgpt/issue-659-integrated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-659-validation
          path: |
            ${{ runner.temp }}/issue-659-*.log
            ${{ runner.temp }}/issue-659-integrate.patch
            ${{ runner.temp }}/issue-659-source.tar.gz
            build/compiler
          retention-days: 7
