name: Issue 659 isolated work
on:
  push:
    branches: [chatgpt/issue-659-work]
permissions:
  contents: write
concurrency:
  group: issue-659-isolated-work
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: 0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Apply validation fixes and integrate current main
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/issue-659-follow.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/issue-659-follow.patch"
          printf 'f0f22a797c4a8fb98c2c3161a5e5912e068b595ba184eb46911d546702cb6670  %s\n' "$RUNNER_TEMP/issue-659-follow.patch" | sha256sum -c
          git switch -c chatgpt/issue-659-kr-completion origin/chatgpt/issue-659-kr-completion
          test "$(git rev-parse HEAD)" = 7dc95a4326f03b6427bb2aa56ba8a38bb24ca92a
          git apply --unidiff-zero --check "$RUNNER_TEMP/issue-659-follow.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/issue-659-follow.patch"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/buster/compiler docs/c-checker.md
          git commit -m 'fix(checker): match Clang bool entries and source-only call diagnostics'
          git push origin HEAD:refs/heads/chatgpt/issue-659-kr-completion
          git archive --format=tar.gz -o "$RUNNER_TEMP/issue-659-main.tar.gz" origin/main
          git rev-parse origin/main > "$RUNNER_TEMP/issue-659-main-sha.log"
          status=0
          git merge --no-edit origin/main 2>&1 | tee "$RUNNER_TEMP/issue-659-merge.log" || status=1
          tar -czf "$RUNNER_TEMP/issue-659-worktree.tar.gz" src docs AGENTS.md build.sh
          git status --short >> "$RUNNER_TEMP/issue-659-merge.log"
          test "$status" = 0
          git push origin HEAD:refs/heads/chatgpt/issue-659-kr-completion
      - name: Install official Clang 23.1.4 and test tools
        run: bash tools/ci/setup-hosted.sh
      - name: Build compiler
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh 2>&1 | tee "$RUNNER_TEMP/issue-659-build.log"
      - name: Validate checker and driver
        shell: bash
        run: |
          set -uo pipefail
          status=0
          build/compiler test-checker --seed 133 2>&1 | tee "$RUNNER_TEMP/issue-659-checker.log" || status=1
          build/compiler test-checker-driver --executable build/compiler 2>&1 | tee "$RUNNER_TEMP/issue-659-driver.log" || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-659-validation
          path: |
            ${{ runner.temp }}/issue-659-*.log
            ${{ runner.temp }}/issue-659-*.tar.gz
            ${{ runner.temp }}/issue-659-follow.patch
            build/compiler
          retention-days: 7
