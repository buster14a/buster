name: Issue 659 isolated work
on:
  push:
    branches: [chatgpt/issue-659-work]
permissions:
  contents: write
concurrency:
  group: issue-659-isolated-work
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: 0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Apply reviewed source-query fix and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | sed 's/MWXM F/MWXMF/g; s/YMWXMFIVIVl/YMWXMFIVl/' | base64 -d | gzip -d > "$RUNNER_TEMP/issue-659-final.patch"
          printf '520cff46d3334c4a372cc43c9343f00c853c685990adcca34b37ee2c6f6c6545  %s\n' "$RUNNER_TEMP/issue-659-final.patch" | sha256sum -c
          git switch -c chatgpt/issue-659-kr-completion origin/chatgpt/issue-659-kr-completion
          test "$(git rev-parse HEAD)" = 7ed177d484a7d93d551aae501c70aed854f43cc3
          git apply --unidiff-zero --check "$RUNNER_TEMP/issue-659-final.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/issue-659-final.patch"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/buster/compiler
          git commit -m 'fix(checker): preserve direct K&R calls through type-query groups'
          git push origin HEAD:refs/heads/chatgpt/issue-659-kr-completion
          git rev-parse HEAD > "$RUNNER_TEMP/issue-659-head.log"
          git archive --format=tar.gz -o "$RUNNER_TEMP/issue-659-source.tar.gz" HEAD
      - name: Install official Clang 23.1.4 and test tools
        run: bash tools/ci/setup-hosted.sh
      - name: Build compiler
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh 2>&1 | tee "$RUNNER_TEMP/issue-659-build.log"
      - name: Validate checker, driver and deferred reader
        shell: bash
        run: |
          set -uo pipefail
          status=0
          build/compiler test-checker --seed 133 2>&1 | tee "$RUNNER_TEMP/issue-659-checker.log" || status=1
          build/compiler test-checker-driver --executable build/compiler 2>&1 | tee "$RUNNER_TEMP/issue-659-driver.log" || status=1
          build/compiler test-checker-deferred 2>&1 | tee "$RUNNER_TEMP/issue-659-deferred.log" || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-659-validation
          path: |
            ${{ runner.temp }}/issue-659-*.log
            ${{ runner.temp }}/issue-659-final.patch
            ${{ runner.temp }}/issue-659-source.tar.gz
            build/compiler
          retention-days: 7
