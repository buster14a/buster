name: Issue 659 isolated work
on:
  push:
    branches: [chatgpt/issue-659-work]
permissions:
  contents: write
concurrency:
  group: issue-659-isolated-work
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: 0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Integrate current main and preserve atomic parameter ABIs
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | sed 's/EFDsmlFlFluL/EFDsmlFluL/' | base64 -d | gzip -d > "$RUNNER_TEMP/issue-659-integrate.patch"
          printf '6d2a93d0fce8758159cda137f350ae698d718f6fa0f8f319366640cc38e32aa2  %s\n' "$RUNNER_TEMP/issue-659-integrate.patch" | sha256sum -c
          git switch -c issue-659-integrated 66b3b87da2fed441441c7f9df2804f5b8dabc55e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit 201e520d5be86720907b5019b62571d1e5507c68 > "$RUNNER_TEMP/issue-659-merge.log" 2>&1 || test -f .git/MERGE_HEAD
          test "$(git diff --name-only --diff-filter=U)" = src/buster/compiler/c_check_program_lower.c
          git apply --unidiff-zero --check "$RUNNER_TEMP/issue-659-integrate.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/issue-659-integrate.patch"
          git add src/buster/compiler/c_check_input.c src/buster/compiler/c_check_program_lower.c src/buster/compiler/c_check_program_test.c docs/c-checker.md
          git diff --check --cached
          git commit -m 'Merge main atomic support while preserving K&R atomic parameter ABIs'
          git rev-parse HEAD > "$RUNNER_TEMP/issue-659-head.log"
          git archive --format=tar.gz -o "$RUNNER_TEMP/issue-659-source.tar.gz" HEAD
      - name: Install official Clang 23.1.4 and test tools
        run: bash tools/ci/setup-hosted.sh
      - name: Build compiler
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh 2>&1 | tee "$RUNNER_TEMP/issue-659-build.log"
      - name: Validate checker, driver and deferred reader
        shell: bash
        run: |
          set -uo pipefail
          status=0
          build/compiler test-checker --seed 133 2>&1 | tee "$RUNNER_TEMP/issue-659-checker.log" || status=1
          build/compiler test-checker-driver --executable build/compiler 2>&1 | tee "$RUNNER_TEMP/issue-659-driver.log" || status=1
          build/compiler test-checker-deferred 2>&1 | tee "$RUNNER_TEMP/issue-659-deferred.log" || status=1
          exit "$status"
      - name: Publish validated integration
        run: git push origin HEAD:refs/heads/chatgpt/issue-659-integrated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-659-validation
          path: |
            ${{ runner.temp }}/issue-659-*.log
            ${{ runner.temp }}/issue-659-integrate.patch
            ${{ runner.temp }}/issue-659-source.tar.gz
            build/compiler
          retention-days: 7
