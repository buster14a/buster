name: Issue 659 isolated work
on:
  push:
    branches: [chatgpt/issue-659-work]
permissions:
  contents: read
concurrency:
  group: issue-659-isolated-work
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Inspect the exact integration
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach 66b3b87da2fed441441c7f9df2804f5b8dabc55e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit 201e520d5be86720907b5019b62571d1e5507c68 > "$RUNNER_TEMP/issue-659-merge.log" 2>&1 || test -f .git/MERGE_HEAD
          git diff --name-only --diff-filter=U >> "$RUNNER_TEMP/issue-659-merge.log"
          git diff --cc > "$RUNNER_TEMP/issue-659-conflicts.patch"
          git archive --format=tar.gz -o "$RUNNER_TEMP/issue-659-main.tar.gz" 201e520d5be86720907b5019b62571d1e5507c68
          tar --exclude=.git -czf "$RUNNER_TEMP/issue-659-worktree.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-659-integration
          path: |
            ${{ runner.temp }}/issue-659-merge.log
            ${{ runner.temp }}/issue-659-conflicts.patch
            ${{ runner.temp }}/issue-659-*.tar.gz
          retention-days: 7
