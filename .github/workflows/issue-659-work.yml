name: Issue 659 isolated work
on:
  push:
    branches: [chatgpt/issue-659-work]
permissions:
  contents: write
concurrency:
  group: issue-659-isolated-work
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: 0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Integrate the reviewed main revision
        shell: bash
        run: |
          set -euo pipefail
          git switch -c chatgpt/issue-659-kr-completion origin/chatgpt/issue-659-kr-completion
          test "$(git rev-parse HEAD)" = 3fb233e139d96ada81febe7a215eb58765e64b8a
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git update-ref refs/remotes/origin/main abc6bf2455c6d1d78f16bc2d494276380c546a79
          git merge --no-commit origin/main > "$RUNNER_TEMP/issue-659-merge.log" 2>&1 || test -f .git/MERGE_HEAD
          printf '%s\n' src/buster/compiler/c_check_input.c src/buster/compiler/c_checker_driver.c > "$RUNNER_TEMP/expected-conflicts"
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/actual-conflicts"
          diff -u "$RUNNER_TEMP/expected-conflicts" "$RUNNER_TEMP/actual-conflicts"
          sed -i '/^<<<<<<< HEAD$/d; /^=======$/d; /^>>>>>>> origin\/main$/d' src/buster/compiler/c_check_input.c src/buster/compiler/c_checker_driver.c
          printf '%s\n' 'a816c45201dcf58b6df81ec14b80e6e57e38ae7887883e5b2b8e981705329108  src/buster/compiler/c_check_input.c' 'ec1445e61e2361a8aecdf26cdd664dc990b84231cb96d233261622d71085ee23  src/buster/compiler/c_checker_driver.c' | sha256sum -c
          git add src/buster/compiler/c_check_input.c src/buster/compiler/c_checker_driver.c
          git diff --check --cached
          git commit -m 'Merge main pragma support into K&R completion, retaining both diagnostic families'
          git push origin HEAD:refs/heads/chatgpt/issue-659-kr-completion
          git rev-parse HEAD > "$RUNNER_TEMP/issue-659-head.log"
          git archive --format=tar.gz -o "$RUNNER_TEMP/issue-659-source.tar.gz" HEAD
      - name: Install official Clang 23.1.4 and test tools
        run: bash tools/ci/setup-hosted.sh
      - name: Build compiler
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh 2>&1 | tee "$RUNNER_TEMP/issue-659-build.log"
      - name: Validate checker and driver
        shell: bash
        run: |
          set -uo pipefail
          status=0
          build/compiler test-checker --seed 133 2>&1 | tee "$RUNNER_TEMP/issue-659-checker.log" || status=1
          build/compiler test-checker-driver --executable build/compiler 2>&1 | tee "$RUNNER_TEMP/issue-659-driver.log" || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-659-validation
          path: |
            ${{ runner.temp }}/issue-659-*.log
            ${{ runner.temp }}/issue-659-source.tar.gz
            build/compiler
          retention-days: 7
