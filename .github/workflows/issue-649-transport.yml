name: Issue 649 publication

on:
  push:
    branches: [codex/issue-649-transport]
    paths: [.github/workflows/issue-649-transport.yml]

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Read authored patch payload
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: transport
          persist-credentials: false
      - name: Checkout immutable implementation baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: b8dd9857c0b8b5dcfc4f1e45159cf4155d26b19f
          path: candidate
      - name: Verify and publish only the two implementation files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode transport/.github/issue-649.patch.b64 | gzip --decompress > "$RUNNER_TEMP/issue-649.patch"
          printf '285cd67399921f0b6bf2aea7162d2b465071a4c160c2dfa630ca21b5a4c1b9a3  %s\n' "$RUNNER_TEMP/issue-649.patch" | sha256sum --check --strict
          cd candidate
          test "$(git rev-parse HEAD)" = b8dd9857c0b8b5dcfc4f1e45159cf4155d26b19f
          git apply --check "$RUNNER_TEMP/issue-649.patch"
          git apply --index "$RUNNER_TEMP/issue-649.patch"
          git diff --cached --check
          printf '%s\n' src/buster/lib/string.c src/buster/tests/string_test.c > "$RUNNER_TEMP/expected-paths"
          git diff --cached --name-only > "$RUNNER_TEMP/actual-paths"
          cmp "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          test "$(git hash-object src/buster/lib/string.c)" = 7cc574f12d165f2276ade07e1a32276d6865d791
          test "$(git hash-object src/buster/tests/string_test.c)" = 60d22ca934e83a942886dce9340925c0690a8094
          test "$(git write-tree)" = e318c4c94a9d7f290bdbfb9c5d17ee738f634723
          git ls-remote --heads origin refs/heads/codex/649-hexadecimal-digits > "$RUNNER_TEMP/existing-branch"
          test ! -s "$RUNNER_TEMP/existing-branch"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'string: reject punctuation as hexadecimal digits (#649)'
          git push origin HEAD:refs/heads/codex/649-hexadecimal-digits
          git rev-parse HEAD
          git show --stat --oneline HEAD
          printf 'Issue 649 implementation commit: `%s`\n\nThe two-file patch and complete tree match the local candidate. No transport files are in this commit. Publication is not test evidence.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
