name: Hosted snapshot witness 3046
on:
  push:
    branches: [validation/3046-snapshot-hosted]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      BUSTER_HOST_ARCH: vector
      BUSTER_DEBUG_INFO: '0'
      BUSTER_SANITIZER: none
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Check the hosted CPU
        run: |
          lscpu | grep 'Model name'
          cc -std=c17 -O2 -march=x86-64-v4 -maes -mgfni -mvaes -mavx512vbmi -mavx512vbmi2 -mavx512vpopcntdq -mavx512bitalg -mavx512vnni tools/ci/vector-probe.c -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"
      - name: Build vector Release and run snapshot evidence
        run: |
          set -euo pipefail
          if test -f snapshot-3046-run.sh; then
            bash snapshot-3046-run.sh
          else
            ./build.sh --config Release
            ./build/compiler test-snapshot
            mkdir "$RUNNER_TEMP/baseline-cache"
            env XDG_CACHE_HOME="$RUNNER_TEMP/baseline-cache" ./build/compiler tools/ci/qualification.c -o "$RUNNER_TEMP/qualification"
            "$RUNNER_TEMP/qualification" --self-test
            for image in "$RUNNER_TEMP"/baseline-cache/buster/*.snapshot; do stat -c '%s %n' "$image"; sha256sum "$image"; done
          fi
