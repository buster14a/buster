name: Sync PR 726 with main

on:
  push:
    branches:
      - claude/confident-curie-ymv3ye
    paths:
      - .github/workflows/sync-pr726-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: claude/confident-curie-ymv3ye
          fetch-depth: 0

      - name: Merge current main and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            echo 'SYNC_CONFLICTS_BEGIN'
            git status --short
            git diff --name-only --diff-filter=U
            echo 'SYNC_CONFLICTS_END'
            exit 1
          fi
          git rm .github/workflows/sync-pr726-main.yml
          git commit -m "Merge main into PR 726"
          git push origin HEAD:claude/confident-curie-ymv3ye
