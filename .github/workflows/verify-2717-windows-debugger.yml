name: "#2717 Windows debugger verification"

# Temporary hosted verification session for #2717 (CodeView/PDB locals read by
# cdb and lldb). Runs only on its own session branch; never merged.
on:
  push:
    branches: [claude/zealous-hamilton-rgvf50]
permissions:
  contents: read
concurrency:
  group: verify-2717-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            vs_arch: amd64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - arch: aarch64
            runner: windows-11-arm
            vs_arch: arm64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned LLVM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_TARGET: ${{ matrix.arch }}-windows
        run: |
          set -euo pipefail
          python tools/ci_llvm.py --target "$LLVM_TARGET" --work-directory "$RUNNER_TEMP/llvm" \
            --github-path "$GITHUB_PATH" --github-env "$GITHUB_ENV"
      - name: Build ide, compile fixtures and read locals
        shell: pwsh
        env:
          VS_ARCH: ${{ matrix.vs_arch }}
          VS_COMPONENT: ${{ matrix.vs_component }}
          VERIFY_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Out = Join-Path $env:RUNNER_TEMP 'verify-2717'
          New-Item -ItemType Directory -Force -Path $Out | Out-Null
          & .\tools\ci_vs_dev_shell.ps1 -Arch $env:VS_ARCH -Component $env:VS_COMPONENT -LlvmBin $env:BUSTER_CI_LLVM_BIN -Require cl, clang
          git rev-parse HEAD | Tee-Object -FilePath (Join-Path $Out 'revision.txt')
          cmd /d /s /c "clang --version 2>&1" | Tee-Object -FilePath (Join-Path $Out 'tools.txt')
          cmd /d /s /c "cl 2>&1" | Tee-Object -Append -FilePath (Join-Path $Out 'tools.txt')
          Get-ChildItem -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers" | ForEach-Object { $_.FullName } | Tee-Object -Append -FilePath (Join-Path $Out 'tools.txt')
          $Driver = Join-Path $env:RUNNER_TEMP 'buster-build.exe'
          cmd /d /s /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`" 2>&1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /d /s /c "`"$Driver`" generate --ci --cc clang --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF 2>&1" | Tee-Object -FilePath (Join-Path $Out 'generate.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /d /s /c "`"$Driver`" build --config Release -t ide 2>&1" | Tee-Object -FilePath (Join-Path $Out 'build-ide.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Ide = (Get-ChildItem -Recurse -Filter ide.exe build | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1).FullName
          Write-Output "ide: $Ide"
          cmd /d /s /c "`"$Ide`" test --module=pdb_tests 2>&1" | Tee-Object -FilePath (Join-Path $Out 'pdb-tests.log')
          if ($LASTEXITCODE -ne 0) { Write-Output "pdb_tests exit $LASTEXITCODE" }
          python tools/verify_2717_windows/verify.py $Ide $Out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain session evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-2717-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-2717
          if-no-files-found: warn
          retention-days: 14
