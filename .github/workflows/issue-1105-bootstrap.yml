name: Issue 1105 documentation preparation

on:
  push:
    branches: [agent/1105-bootstrap]

permissions:
  contents: write

jobs:
  validate:
    if: github.repository == 'buster14a/buster' && github.ref == 'refs/heads/agent/1105-bootstrap'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
      - name: Validate the split and remove the redundant corpus paragraph
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -euo pipefail
          cc -std=c17 -Wall -Wextra -Werror -g -fsanitize=address,undefined .github/issue1105-check.c -o "$RUNNER_TEMP/check-guide"
          cp AGENTS.md "$RUNNER_TEMP/original-agents.md"
          expected=ef64246d04ddd8b120dae3334d7ddbaf4a073e88
          git fetch --no-tags --depth=1 origin agent/1105-guide-split
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          git checkout --detach "$expected"
          "$RUNNER_TEMP/check-guide" "$RUNNER_TEMP/original-agents.md" AGENTS.md CLAUDE.md docs/commands/*.md
          git diff --check
          git add docs/commands/preprocessor.md
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'docs: remove redundant preprocessor corpus paragraph' '' 'Preserve the fuller paragraph including --tables src; verify local links' 'and unchanged shared policies, smoke commands, cores and memory guidance.' '' 'Maintainer DCO certification pending.' 'Agent: OpenAI / GPT-6 Astra Pro (session URL/ID unavailable).' | git commit-tree "$tree" -p "$expected")
          git push origin "$commit:refs/heads/agent/1105-guide-split"
          printf 'OUTPUT_COMMIT=%s\n' "$commit"
