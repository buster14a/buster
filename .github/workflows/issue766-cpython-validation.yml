name: Issue 766 CPython validation

on:
  push:
    branches:
      - codex/issue766-cpython-validation

permissions:
  contents: read

concurrency:
  group: issue766-cpython-validation
  cancel-in-progress: true

jobs:
  cpython:
    name: Pinned CPython v3.13.9
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out exact PR commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ae8420737ea658de20b200f0a3efc6616af69c58
          persist-credentials: false
      - name: Bootstrap and build Release compiler
        shell: bash
        run: |
          set -euo pipefail
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --cc clang --config Release --linker DEFAULT
          "$RUNNER_TEMP/buster-build" build --config Release -t ide
      - name: Confirm -fno-pic remains the default
        shell: bash
        run: |
          set -euo pipefail
          build/Release/ide cc -fno-pic -g -O3 -c tests/basic_c_pic.c -o "$RUNNER_TEMP/with-fno-pic.o"
          build/Release/ide cc          -g -O3 -c tests/basic_c_pic.c -o "$RUNNER_TEMP/with-default.o"
          cmp "$RUNNER_TEMP/with-fno-pic.o" "$RUNNER_TEMP/with-default.o"
      - name: Fetch pinned pristine CPython
        shell: bash
        run: |
          set -euo pipefail
          tools/fetch_cpython.sh "$RUNNER_TEMP/cpython-v3.13.9"
      - name: Run pinned compatibility harness
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/cpython.log"
          set +e
          "$RUNNER_TEMP/buster-build" test_cpython --config Release "$RUNNER_TEMP/cpython-v3.13.9" 2>&1 | tee "$log"
          harness_status="${PIPESTATUS[0]}"
          set -e

          for allocator in fast none mir-stack quality; do
              grep -Fqx "CPYTHON_UNIT tree=${allocator} unit=Python/perf_jit_trampoline.o compiler=buster status=pass" "$log"
          done
          test "$(grep -Fc 'unit=Python/perf_jit_trampoline.o compiler=buster status=pass' "$log")" -eq 4
          exit "$harness_status"
