name: Representation ledger source snapshot
on:
  push:
    branches: [research/representation-ledger-d9e736e2-20260925]
    paths: [.github/workflows/representation-ledger-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d9e736e2cf08804a2c603d153e9fb608f18c5c49
          persist-credentials: false
      - name: Retain exact source for read-only representation analysis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/representation-source"
          test "$(git rev-parse HEAD)" = d9e736e2cf08804a2c603d153e9fb608f18c5c49
          test "$(git rev-parse 'HEAD^{tree}')" = ae9f274b6768b023fe6e0ef80a161e14b290e0a2
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/representation-source/identity.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/representation-source/tree.txt"
          git archive --format=tar.gz HEAD src docs/agents docs/performance-audits AGENTS.md CMakeLists.txt build.c build.sh cmake .github/workflows/ci.yml > "$RUNNER_TEMP/representation-source/source.tar.gz"
          sha256sum "$RUNNER_TEMP/representation-source/source.tar.gz" > "$RUNNER_TEMP/representation-source/archive.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: representation-source-d9e736e2
          path: ${{ runner.temp }}/representation-source
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
