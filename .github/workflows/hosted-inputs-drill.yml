name: Hosted release-input outage drill

# Rehearses the source outages of tools/ci/hosted-release.sh on real hosted runners (#1767, #1768), with no Actions
# cache: upstream down (the pinned GHCR mirror must supply every input), the mirror down (upstream must rebuild the same
# installed tree), and both down (preparation must fail within its bound). A host is taken down through /etc/hosts, so
# every request to it is refused. The weekly run also catches a pinned mirror publication that has gone missing.
# The offline jobs (#2275) take down Ubuntu's mirrors, GitHub's git, release and package hosts, and Lua while a shard sets up
# from the run's handoff, and while a preparation finds every input in its cache: both must succeed without them.
on:
  pull_request:
    paths:
      - tools/ci/hosted-release.sh
      - tools/ci/hosted-tools.lock
      - tools/ci/install-hosted-tools.sh
      - tools/ci/setup-build-tools.sh
      - tools/ci/hosted-offline.sh
      - tools/ci/hosts-down.sh
      - tools/ci/setup-hosted.sh
      - tools/ci/setup-baseline-runtime.sh
      - tools/ci/fetch-corpus.sh
      - tools/ci/fetch-c-testsuite.sh
      - tools/ci/fetch-sqlite.sh
      - tools/ci/cached-download.sh
      - .github/actions/hosted-tools/action.yml
      - .github/workflows/prepare-hosted-tools.yml
      - .github/workflows/hosted-inputs-drill.yml
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buster-hosted-inputs-drill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  outage:
    name: Hosted inputs with ${{ matrix.down }} down
    if: github.repository_id == '1421805693'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        down: [upstream, mirror, both]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install the extraction tools
        # Retried as tools/ci/setup-hosted.sh's apt-get is: a runner's resolver or the mirrors can fail for a few minutes.
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
              if sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends zstd; then
                  break
              fi
              test "$attempt" -lt 5
              sleep "$((attempt * 15))"
              sudo apt-get -o Acquire::Retries=3 update || true
          done

      - name: Take the ${{ matrix.down }} source down
        env:
          DOWN: ${{ matrix.down }}
        run: |
          set -euo pipefail
          upstream='github.com objects.githubusercontent.com release-assets.githubusercontent.com raw.githubusercontent.com'
          mirror='ghcr.io pkg-containers.githubusercontent.com'
          case "$DOWN" in upstream) hosts=$upstream ;; mirror) hosts=$mirror ;; both) hosts="$upstream $mirror" ;; esac
          for host in $hosts; do
              printf '127.0.0.1 %s\n::1 %s\n' "$host" "$host" | sudo tee -a /etc/hosts > /dev/null
          done
          for host in $hosts; do
              if curl --silent --max-time 10 --output /dev/null "https://$host/"; then
                  echo "::error::$host is still reachable"
                  exit 1
              fi
          done

      - name: Prepare the inputs with no cache
        id: prepare
        run: |
          set -euo pipefail
          start=$SECONDS
          status=0
          bash tools/ci/hosted-release.sh prepare "$RUNNER_TEMP/inputs" 2> >(tee "$RUNNER_TEMP/prepare.log" >&2) || status=$?
          sleep 1
          printf 'status=%s\nseconds=%s\n' "$status" "$((SECONDS - start))" >> "$GITHUB_OUTPUT"

      - name: Check the outcome and the sources used
        env:
          DOWN: ${{ matrix.down }}
          STATUS: ${{ steps.prepare.outputs.status }}
          SECONDS_TAKEN: ${{ steps.prepare.outputs.seconds }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/prepare.log"
          components='llvm llvm-license cmake ninja mold wild'
          case "$DOWN" in
              upstream)
                  [ "$STATUS" = 0 ] || { echo '::error::preparation failed with only upstream down'; exit 1; }
                  for name in $components; do grep -q "component=$name source=mirror verified=true" "$log" || { echo "::error::$name did not come from the mirror"; exit 1; }; done
                  ! grep -q 'source=upstream' "$log" || { echo '::error::preparation contacted upstream'; exit 1; }
                  ;;
              mirror)
                  [ "$STATUS" = 0 ] || { echo '::error::preparation failed with only the mirror down'; exit 1; }
                  grep -q 'source=mirror unavailable reason=transport stage=token' "$log" || { echo '::error::the mirror outage was not reported'; exit 1; }
                  for name in $components; do grep -q "component=$name version=[0-9.]* source=upstream" "$log" || { echo "::error::$name did not fall back to upstream"; exit 1; }; done
                  ;;
              both)
                  [ "$STATUS" != 0 ] || { echo '::error::preparation succeeded with no source'; exit 1; }
                  [ ! -e "$RUNNER_TEMP/inputs" ] || { echo '::error::a failed preparation was published'; exit 1; }
                  # One mirror attempt (token) plus one bounded upstream sequence for the first component.
                  [ "$SECONDS_TAKEN" -le 420 ] || { echo "::error::failure took ${SECONDS_TAKEN}s, beyond the 420 s bound"; exit 1; }
                  ;;
          esac
          printf '| %s down | exit %s | %s s |\n' "$DOWN" "$STATUS" "$SECONDS_TAKEN" >> "$GITHUB_STEP_SUMMARY"

      - name: Install, probe and inventory the tree
        if: matrix.down != 'both'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tree"
          BUSTER_HOSTED_RELEASES="$RUNNER_TEMP/inputs" bash tools/ci/install-hosted-tools.sh "$root"
          llvm=$(echo "$root"/llvm-*)
          printf 'int main(void) { return 0; }\n' > "$RUNNER_TEMP/probe.c"
          "$llvm/bin/clang" -fuse-ld=lld "$RUNNER_TEMP/probe.c" -o "$RUNNER_TEMP/probe-lld" && "$RUNNER_TEMP/probe-lld"
          "$llvm/bin/clang" --ld-path="$root/bin/ld.mold" "$RUNNER_TEMP/probe.c" -o "$RUNNER_TEMP/probe-mold" && "$RUNNER_TEMP/probe-mold"
          "$root/bin/wild" --version
          "$root"/build-tools/*/bin/cmake --version
          "$root"/build-tools/*/bin/ninja --version
          # Type, mode, path and link target of every entry, then every regular file's contents.
          (cd "$root" && find . -printf '%y %m %p %l\n' | LC_ALL=C sort && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/inventory-${{ matrix.down }}.txt"
          wc -l "$RUNNER_TEMP/inventory-${{ matrix.down }}.txt"

      - name: Keep the inventory and the log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-inputs-drill-${{ matrix.down }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/prepare.log
            ${{ runner.temp }}/inventory-*.txt
          if-no-files-found: warn
          retention-days: 30

  same-tree:
    name: Mirror and upstream install the same tree
    needs: outage
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: hosted-inputs-drill-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/drill
      - name: Compare the inventories
        shell: bash
        run: |
          set -euo pipefail
          diff "$RUNNER_TEMP"/drill/hosted-inputs-drill-upstream-*/inventory-upstream.txt "$RUNNER_TEMP"/drill/hosted-inputs-drill-mirror-*/inventory-mirror.txt
          printf 'Mirror and upstream trees are identical: %s entries.\n' "$(wc -l < "$RUNNER_TEMP"/drill/hosted-inputs-drill-upstream-*/inventory-upstream.txt)" | tee -a "$GITHUB_STEP_SUMMARY"

  # The run's preparation, as every workflow with hosted shards has it (its caches, its fixtures and its handoff).
  offline-prepare:
    if: github.repository_id == '1421805693'
    uses: ./.github/workflows/prepare-hosted-tools.yml

  # A shard's setup, as hosted-correctness.yml's shards run it, reaching only GitHub's checkout, cache and artifact
  # services. Ubuntu's mirrors, packages.microsoft.com, Lua and GitHub's release, raw and package hosts go down before the
  # handoff's restore; github.com and codeload.github.com, which fetch the action's own steps, go down right after it.
  offline-shard:
    name: A shard's setup with Ubuntu's mirrors, GitHub's sources and Lua down
    needs: offline-prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Take Ubuntu's mirrors, GitHub's release and package hosts and Lua down
        run: >-
          bash tools/ci/hosts-down.sh --apt packages.microsoft.com objects.githubusercontent.com
          release-assets.githubusercontent.com raw.githubusercontent.com ghcr.io pkg-containers.githubusercontent.com
          www.lua.org lua.org

      - name: Restore the run's verified inputs
        uses: ./.github/actions/hosted-tools
        with:
          artifact-name: ${{ needs.offline-prepare.outputs.artifact-name }}

      - name: Take github.com's git and release host down too
        run: bash tools/ci/hosts-down.sh github.com codeload.github.com

      - name: Install official Clang 23.1.4 and test tools
        run: bash tools/ci/setup-hosted.sh

      - name: Fetch the baseline runtime, the frozen corpus, c-testsuite, SQLite and Lua
        run: |
          set -euo pipefail
          bash tools/ci/setup-baseline-runtime.sh
          bash tools/ci/fetch-corpus.sh "$RUNNER_TEMP/preprocessor-391e729af658"
          bash tools/ci/fetch-c-testsuite.sh build/c-testsuite
          bash tools/ci/fetch-sqlite.sh build/sqlite
          bash tools/ci/hosted-offline.sh lua build/lua

      - name: Run the installed tools
        run: |
          set -euo pipefail
          clang --version | head -n 1
          for tool in gdb tcc qemu-x86_64 valgrind tclsh8.6 perf; do command -v "$tool"; done
          valgrind --version
          qemu-x86_64 --version | head -n 1
          printf 'Setup reached no external host: the apt closure, the baseline runtime, the corpus, both mirrors and Lua came from the handoff.\n' | tee -a "$GITHUB_STEP_SUMMARY"

  # A preparation whose caches hold every input contacts no external host: a cold preparation (a cache miss) fetches
  # each input once and saves them in a cache of this run's own, then, with every source down, a fresh restore of that
  # cache must check out entirely, every input's source being the cache.
  offline-warm:
    name: A warm preparation with every external source down
    if: github.repository_id == '1421805693'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Prepare cold, as on a cache miss
        run: |
          set -euo pipefail
          status=0
          bash tools/ci/hosted-offline.sh prepare "$RUNNER_TEMP/hosted-offline" 2> "$RUNNER_TEMP/cold.log" || status=$?
          cat "$RUNNER_TEMP/cold.log" >&2
          [ "$status" -eq 0 ] || exit "$status"
          for input in apt baseline corpus c-testsuite sqlite lua; do
              grep -q "input=$input source=network" "$RUNNER_TEMP/cold.log" || { echo "::error::$input was not acquired"; exit 1; }
          done

      - name: Keep the inputs in a cache of this run's
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/hosted-offline
          key: hosted-offline-drill-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Take every external source down
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/hosted-offline"
          bash tools/ci/hosts-down.sh --apt packages.microsoft.com github.com codeload.github.com objects.githubusercontent.com \
              release-assets.githubusercontent.com raw.githubusercontent.com ghcr.io pkg-containers.githubusercontent.com \
              www.lua.org lua.org

      - name: Restore the inputs
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/hosted-offline
          key: hosted-offline-drill-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Prepare warm, as on a cache hit
        run: |
          set -euo pipefail
          status=0
          bash tools/ci/hosted-offline.sh prepare "$RUNNER_TEMP/hosted-offline" 2> "$RUNNER_TEMP/warm.log" || status=$?
          cat "$RUNNER_TEMP/warm.log" >&2
          [ "$status" -eq 0 ] || exit "$status"
          for input in apt baseline corpus c-testsuite sqlite lua; do
              grep -q "input=$input source=cache" "$RUNNER_TEMP/warm.log" || { echo "::error::$input did not come from the cache"; exit 1; }
          done
          ! grep -q 'source=network' "$RUNNER_TEMP/warm.log" || { echo '::error::the warm preparation fetched an input'; exit 1; }
          bash tools/ci/hosted-offline.sh verify "$RUNNER_TEMP/hosted-offline"
          printf 'A warm preparation reached no external host: every input came from the cache.\n' | tee -a "$GITHUB_STEP_SUMMARY"
