name: Apply PR 734 static bitmap repair

on:
  push:
    branches:
      - fix/722-post-tag-specifiers
    paths:
      - .github/workflows/pr734-apply-static-bitmap-fix.yml

permissions:
  contents: write

concurrency:
  group: pr734-apply-static-bitmap-fix
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.repository == 'buster14a/buster' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply and publish the parser fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/buster/lib/compiler/frontend/c/c_parse.c")
          text = path.read_text(encoding="utf-8")
          marker = "#define C_PARSE_DECLARATION_RANGE_KEYWORDS"
          start = text.index(marker)
          end = text.index("\n\n", start)
          block = text[start:end]
          old = "C_SYMBOL_WELL_KNOWN_BIT(THREAD_LOCAL_C23))"
          new = "C_SYMBOL_WELL_KNOWN_BIT(THREAD_LOCAL_C23) | C_SYMBOL_WELL_KNOWN_BIT(STATIC))"
          if block.count(old) != 1 or "C_SYMBOL_WELL_KNOWN_BIT(STATIC)" in block:
              raise SystemExit("unexpected declaration-range keyword block")
          updated = text[:start] + block.replace(old, new) + text[end:]
          path.write_text(updated, encoding="utf-8")
          PY

          rm -f .github/workflows/pr734-apply-static-bitmap-fix.yml
          git diff --check
          grep -A2 '^#define C_PARSE_DECLARATION_RANGE_KEYWORDS' src/buster/lib/compiler/frontend/c/c_parse.c

          git config user.name 'David'
          git config user.email 'davidgmbb@gmail.com'
          git add -A
          git commit \
            -m 'fix(c): admit static declarations to metadata scan (#722)' \
            -m 'Include static in the declaration-range candidate bitmap used by file-scope entity metadata extraction. This preserves the bitmap fast path while allowing post-tag static declarations to set is_static_storage.'
          git push origin HEAD:refs/heads/fix/722-post-tag-specifiers
