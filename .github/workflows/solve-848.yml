name: Solve issue 848

on:
  push:
    branches: ["codex/848-unreachable-local"]
    paths:
      - ".github/workflows/solve-848.yml"
      - ".github/scripts/solve_848.py"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LC_ALL: C
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/848-unreachable-local
          fetch-depth: 0

      - name: Fetch pinned bootstrap compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: TinyCC/tinycc
          ref: 0fb54300b56512754221d80adda85ddb9815bceb
          path: .tools/tinycc
          persist-credentials: false

      - name: Install pinned TCC
        working-directory: .tools/tinycc
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0fb54300b56512754221d80adda85ddb9815bceb
          ./configure --prefix="$RUNNER_TEMP/tcc" --cc=gcc
          make -j2
          make install
          echo "$RUNNER_TEMP/tcc/bin" >> "$GITHUB_PATH"

      - name: Apply focused repair
        run: |
          python3 .github/scripts/solve_848.py
          git diff --check

      - name: Run Release tests
        shell: bash
        run: |
          set -o pipefail
          command -v tcc
          tcc -v
          ./build.sh generate 2>&1 | tee /tmp/solve-848-validation.log
          ./build.sh build --config Release -t test_all 2>&1 | tee -a /tmp/solve-848-validation.log

      - name: Verify self-host fixed point
        shell: bash
        run: |
          set -o pipefail
          ./build.sh test_self_host --config Release 2>&1 | tee -a /tmp/solve-848-validation.log

      - name: Publish validation diagnostics
        if: failure()
        run: |
          {
            echo "head=$(git rev-parse HEAD)"
            echo "status=failed"
            echo
            tail -n 500 /tmp/solve-848-validation.log 2>/dev/null || true
          } > .github/solve-848-validation.log
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/solve-848-validation.log
          git commit -m "ci: record issue 848 validation failure"
          git push origin HEAD:codex/848-unreachable-local

      - name: Publish tested implementation
        if: success()
        run: |
          {
            echo "head=$(git rev-parse HEAD)"
            echo "status=passed"
            echo "tinycc=0fb54300b56512754221d80adda85ddb9815bceb"
            echo
            tail -n 500 /tmp/solve-848-validation.log
          } > .github/solve-848-validation.log
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/solve-848-validation.log
          git add src/buster/lib/compiler/frontend/c/c_gen.c
          git add src/buster/tests/compiler/ir/ir_test.c
          git add src/buster/tests/compiler/ir/ir_unreachable_local_test.c
          git commit -m "frontend: materialize skipped automatic locals"
          git push origin HEAD:codex/848-unreachable-local
