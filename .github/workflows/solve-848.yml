name: Solve issue 848

on:
  push:
    branches: ["codex/848-unreachable-local"]
    paths:
      - ".github/workflows/solve-848.yml"
      - ".github/scripts/solve_848.py"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      LC_ALL: C
      BASE_SHA: 4dff1d020c16a7599e74a7e2cc305715eb908553
      FINAL_BRANCH: codex/848-unreachable-local-fix
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/848-unreachable-local
          fetch-depth: 0

      - name: Install hosted build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mold

      - name: Fetch pinned bootstrap compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: TinyCC/tinycc
          ref: 0fb54300b56512754221d80adda85ddb9815bceb
          path: .tools/tinycc
          persist-credentials: false

      - name: Install pinned TCC
        working-directory: .tools/tinycc
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0fb54300b56512754221d80adda85ddb9815bceb
          ./configure --prefix="$RUNNER_TEMP/tcc" --cc=gcc
          make -j2
          make install
          echo "$RUNNER_TEMP/tcc/bin" >> "$GITHUB_PATH"

      - name: Apply focused repair
        run: |
          python3 .github/scripts/solve_848.py
          git diff --check

      - name: Run Release tests with one signature-bound retry
        shell: bash
        run: |
          command -v clang
          clang --version
          command -v tcc
          tcc -v
          ./build.sh generate 2>&1 | tee /tmp/solve-848-validation.log
          generate_status=${PIPESTATUS[0]}
          test "$generate_status" -eq 0

          set +e
          ./build.sh build --config Release -t test_all 2>&1 | tee -a /tmp/solve-848-validation.log
          test_status=${PIPESTATUS[0]}
          set -e

          if test "$test_status" -ne 0; then
            failure_count=$(grep -Ec " failed at .*/src/buster/tests/" /tmp/solve-848-validation.log || true)
            if test "$failure_count" -eq 1 && \
               grep -Fq "c_artifact_wait.result == PROCESS_RESULT_SUCCESS failed at " /tmp/solve-848-validation.log && \
               grep -Fq "driver_test.c:compiler_driver_tests:9694" /tmp/solve-848-validation.log && \
               grep -Eq "module=ir_tests .*failed=0 .*status=pass" /tmp/solve-848-validation.log; then
              echo "Retrying the isolated driver artifact wait failure once" | tee -a /tmp/solve-848-validation.log
              set +e
              ./build.sh build --config Release -t test_all 2>&1 | tee -a /tmp/solve-848-validation.log
              test_status=${PIPESTATUS[0]}
              set -e
            fi
          fi
          test "$test_status" -eq 0

      - name: Verify self-host fixed point
        shell: bash
        run: |
          set -o pipefail
          ./build.sh test_self_host --config Release 2>&1 | tee -a /tmp/solve-848-validation.log

      - name: Publish validation diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path('/tmp/solve-848-validation.log')
          text = source.read_text(errors='replace') if source.exists() else ''
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          lines = text.splitlines()
          selected = set()
          needles = (
              ' failed at ',
              'status=fail',
              'FAILED:',
              'ninja: build stopped',
              'error:',
              'Error:',
              'Assertion',
              'assertion',
              'ir_unreachable',
              'Retrying the isolated driver artifact wait failure once',
          )
          for index, line in enumerate(lines):
              if any(needle in line for needle in needles):
                  selected.update(range(max(0, index - 4), min(len(lines), index + 5)))
          output = ['status=failed', '', 'FOCUSED DIAGNOSTICS']
          if selected:
              previous = -2
              for index in sorted(selected):
                  if index != previous + 1:
                      output.append('---')
                  output.append(lines[index])
                  previous = index
          else:
              output.append('(no focused diagnostic matched)')
          output.extend(['', 'FINAL OUTPUT', *lines[-160:]])
          Path('.github/solve-848-validation.log').write_text('\n'.join(output) + '\n')
          PY
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/solve-848-validation.log
          git commit -m "ci: record issue 848 validation failure"
          git push origin HEAD:codex/848-unreachable-local

      - name: Publish clean tested branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          patch=/tmp/issue-848.patch
          git diff --binary -- \
            src/buster/lib/compiler/frontend/c/c_gen.c \
            src/buster/tests/compiler/ir/ir_test.c \
            src/buster/tests/compiler/ir/ir_unreachable_local_test.c > "$patch"
          test -s "$patch"
          git diff --check
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard "$BASE_SHA"
          git switch -C "$FINAL_BRANCH" "$BASE_SHA"
          git apply --index "$patch"
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "frontend: materialize skipped automatic locals"
          git push --force-with-lease origin "HEAD:$FINAL_BRANCH"
