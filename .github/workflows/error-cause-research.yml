name: Error-cause recovery research (branch only)
on:
  push:
    branches: [research/390-error-cause-boundary-8f67df7]
permissions:
  contents: read
jobs:
  source:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8f67df736f13d4edc055110a7a6d619a00a22eaf
          persist-credentials: false
      - name: Preserve pinned source for structured probe design
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery-source"
          OUT="$RUNNER_TEMP/recovery-source"
          git rev-parse HEAD 'HEAD^{tree}' | tee "$OUT/identity.txt"
          git archive HEAD src/buster/lib src/buster/tests src/buster/apps/ide/ide.c > "$OUT/source.tar"
          find . -maxdepth 1 -type f -iname '*licen*' -exec cp '{}' "$OUT/" \;
          python3 - <<'PY'
          from pathlib import Path
          import os
          out=Path(os.environ['RUNNER_TEMP'])/'recovery-source'
          p=Path('src/buster/lib/compiler/frontend/c/c_parse.c')
          lines=p.read_text().splitlines()
          anchors=('recover_translation_unit', 'rollback_declaration_state', 'begin_declaration_state', 'set_diagnostic(', 'recover_statement', 'recover_declaration', 'c_parse_diagnostic(', 'c_analyze_semantics_core(')
          chosen=set()
          for i,line in enumerate(lines):
              if any(a in line for a in anchors): chosen.update(range(max(0,i-5),min(len(lines),i+110)))
          text='\n'.join(f'{i+1}: {lines[i]}' for i in sorted(chosen))
          (out/'recovery-excerpts.txt').write_text(text)
          print(text[:45000])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: error-cause-source-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-source
          if-no-files-found: error
          retention-days: 14
