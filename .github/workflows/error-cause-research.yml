name: Error-cause recovery research (branch only)
on:
  push:
    branches: [research/390-error-cause-boundary-8f67df7]
permissions:
  contents: read
jobs:
  refined:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 913feee112a340e9847c6c8401337dbfd63d15c6
          persist-credentials: false
      - name: Recover exact experiment scripts and unchanged production source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/error-cause-paired"
          mkdir -p "$OUT" .cache/recovery-probe
          git rev-parse HEAD 'HEAD^{tree}' | tee "$OUT/identity.txt"
          printf 'production_base=8f67df736f13d4edc055110a7a6d619a00a22eaf workflow=%s run=%s attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | tee -a "$OUT/identity.txt"
          test "$(git rev-parse HEAD:src/buster/lib/compiler/frontend/c/c_parse.c)" = 5dca683abd22e6f73e53554952c2686fcd4d8a1f
          clang --version | tee -a "$OUT/identity.txt"
          python3 - <<'PY'
          import os,textwrap,json
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'error-cause-paired'
          workflow=Path('.github/workflows/error-cause-research.yml').read_text()
          setup=textwrap.dedent(workflow.split("          python3 - <<'PY'\n",1)[1].split('          PY\n',1)[0])
          runner=textwrap.dedent(workflow.split('          cat > "$OUT/run.py" <<\'PY\'\n',1)[1].split('          PY\n',1)[0])
          (out/'setup.py').write_text(setup)
          (out/'run.py').write_text(runner)
          exec(compile(setup,'setup.py','exec'))
          cases=json.loads((out/'cases.json').read_text())
          extra={
            'bound_error_without_stray':'int calc(void) { int bad[bound_unknown], keep = sibling_unknown; return 0; }\nint later(void) { return 7; }\n',
            'dependent_use_remaining':'int calc(void) { int bad extra; return bad; }\nint later(void) { return later_unknown; }\n',
            'stray_with_nested_bound':'int calc(void) { int bad extra[bound_unknown]; return 0; }\nint later(void) { return later_unknown; }\n',
          }
          cases += [{'case':name,'family':name,'variant':'negative-control','source':text} for name,text in extra.items()]
          (out/'cases.json').write_text(json.dumps(cases,indent=2))
          PY
          git diff -- src > "$OUT/observation.patch"
      - name: Execute observed baseline
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/error-cause-paired"
          exec > >(tee "$OUT/baseline.log") 2>&1
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char -g build.c -o .cache/recovery-probe/build
          .cache/recovery-probe/build generate --ci --linker DEFAULT --build-directory build-probe -- -DBUSTER_INCLUDE_TESTS=OFF -DBUSTER_UNITY_BUILD=OFF
          .cache/recovery-probe/build build --config Release --build-directory build-probe -t ide
          sha256sum build-probe/Release/ide | tee "$OUT/baseline-binary.sha256"
          python3 "$OUT/run.py" baseline "$PWD/build-probe/Release/ide"
      - name: Execute bounded plain-name recovery prototype
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/error-cause-paired"
          exec > >(tee "$OUT/candidate.log") 2>&1
          python3 - <<'PY'
          import os,difflib
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'error-cause-paired'
          p=Path('src/buster/lib/compiler/frontend/c/c_parse.c');before=p.read_text()
          start=before.index('BUSTER_C_INTERNAL bool c_parse_local_declarations(CTypeParseMachine* machine, Arena* arena,')
          pos=before.index('        if (index != suffix_end)',start)
          stop=before.index('        if (!is_typedef)',pos)
          old=before[pos:stop]
          assert old.count('return false;')==1 and 'unexpected token after declarator' in old
          replacement='''            // Research prototype: no bound, parameter, attribute or initializer expression is discarded.
                      if (suffix_end == segment_end && name_index == segment_start && index == name_index + 1 &&
                          segment_end == index + 1 && preprocess.tokens[index].kind == C_TOKEN_IDENTIFIER)
                      {
                          fprintf(stderr, "@@R\\t%u\\t%u\\t%u\\n", (unsigned)segment_start, (unsigned)segment_end, (unsigned)end);
                          segment_start = segment_end + 1;
                          continue;
                      }
                      return false;'''
          replacement='\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          after=before[:pos]+old.replace('            return false;',replacement)+before[stop:]
          assert after!=before
          p.write_text(after)
          (out/'candidate-only.patch').write_text(''.join(difflib.unified_diff(before.splitlines(True),after.splitlines(True),fromfile='a/'+str(p),tofile='b/'+str(p))))
          PY
          git diff -- src > "$OUT/candidate-with-observation.patch"
          .cache/recovery-probe/build build --config Release --build-directory build-probe -t ide
          sha256sum build-probe/Release/ide | tee "$OUT/candidate-binary.sha256"
          python3 "$OUT/run.py" candidate "$PWD/build-probe/Release/ide"
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'error-cause-paired'
          a=json.loads((out/'baseline.json').read_text());b=json.loads((out/'candidate.json').read_text())
          assert len(a)==len(b)==120
          summary=[]
          for x,y in zip(a,b):
              assert (x['case'],x['mode'])==(y['case'],y['mode'])
              dx=[r for r in x.get('trace',[]) if r[0]=='@@D'];dy=[r for r in y.get('trace',[]) if r[0]=='@@D']
              summary.append({'case':x['case'],'mode':x['mode'],'baseline_status':x.get('status'),'candidate_status':y.get('status'),'before_diagnostics':dx,'after_diagnostics':dy,'recovery_hits':sum(r[0]=='@@R' for r in y.get('trace',[])),'object_equal':x.get('object_sha256')==y.get('object_sha256')})
          (out/'paired-summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          (out/'sha256.txt').write_text('\n'.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in sorted(out.glob('*')) if p.is_file() and p.name not in ('sha256.txt','candidate.log'))+'\n')
          PY
      - name: Preserve research evidence including rejected controls
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: error-cause-refined-${{ github.run_id }}
          path: ${{ runner.temp }}/error-cause-paired
          if-no-files-found: error
          retention-days: 14
