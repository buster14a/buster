name: Main integration admission

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  admission:
    name: Main integration admission
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - name: Require CI admission to be enabled
        shell: bash
        env:
          CI_ENABLED: ${{ vars.GH_ACTIONS_CI_ENABLED }}
        run: |
          if [[ "$CI_ENABLED" != true ]]; then
            echo '::error::Required validation is disabled; refusing a skipped admission check.'
            exit 1
          fi
      - name: Check out independently trusted main for groups and tested revision for readiness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'merge_group' && 'main' || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exercise exact-head and ruleset regression tests
        run: python3 -B tools/merge_queue_admission_test.py -v
      - name: Audit every required workflow and desired queue settings
        run: |
          python3 -B tools/merge_queue_admission.py audit-workflows .
          python3 -B tools/merge_queue_admission.py check-ruleset .github/main-merge-queue.ruleset.json
      - name: Fetch immutable combined candidate without checking it out
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        env:
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          [[ "$GROUP_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$GROUP_HEAD" = "$GITHUB_SHA"
          git fetch --no-tags origin "$GROUP_HEAD"
      - name: Require exact combined-head CI and trusted retirement admission
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B tools/merge_queue_admission.py check-group \
            --repo-root . --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/merge-queue-admission.json"
      - name: Explain non-authoritative PR readiness
        if: ${{ github.event_name != 'merge_group' }}
        run: |
          echo 'Policy regression checks passed. This is queue readiness, not combined-head admission.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only the merge_group run can authorize its exact SHA/tree; live activation remains separately gated.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain exact-group admission evidence
        if: ${{ github.event_name == 'merge_group' && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: merge-queue-admission-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/merge-queue-admission.json
          if-no-files-found: error
          retention-days: 14
