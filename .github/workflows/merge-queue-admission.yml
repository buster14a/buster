name: Main integration admission

# PR readiness and policy regression only. The exact merge-group check is
# published by the trusted-main reconciler (merge-queue-reconcile.yml, #1807)
# after the queued predecessor lands, so no hosted runner waits here. Without a
# merge_group trigger this workflow cannot create a second, skipped group check.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no_code_plan:
    name: No-code plan
    if: ${{ github.server_url == 'https://github.com' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    uses: ./.github/workflows/ci-no-code-plan.yml

  admission:
    needs: no_code_plan
    name: Main integration admission
    if: ${{ !cancelled() && (needs.no_code_plan.result != 'success' || needs.no_code_plan.outputs.no_code != 'true') && (github.server_url == 'https://github.com') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ubuntu-latest
      - name: Require CI admission to be enabled
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.no_code_plan.result }}
          EVENT_NAME: ${{ github.event_name }}
          CI_ENABLED: ${{ vars.GH_ACTIONS_CI_ENABLED }}
        run: |
          if [[ ("${EVENT_NAME:-}" == pull_request || "${EVENT_NAME:-}" == merge_group) &&
                "${PLAN_RESULT:-skipped}" != success ]]; then
            echo '::error::Trusted classification failed; refusing no-code admission.'
            exit 1
          fi
          if [[ "$CI_ENABLED" != true ]]; then
            echo '::error::Required validation is disabled; refusing a skipped admission check.'
            exit 1
          fi
      - name: Check out tested revision for readiness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Exercise exact-head and ruleset regression tests
        run: python3 -B tools/merge_queue_admission_test.py -v
      - name: Audit every required workflow and desired queue settings
        run: |
          python3 -B tools/merge_queue_admission.py audit-workflows .
          python3 -B tools/merge_queue_admission.py check-ruleset .github/main-merge-queue.ruleset.json
      - name: Explain non-authoritative PR readiness
        run: |
          echo 'Policy regression checks passed. This is queue readiness, not combined-head admission.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only the trusted reconciler can authorize an exact merge-group SHA/tree.' >> "$GITHUB_STEP_SUMMARY"
