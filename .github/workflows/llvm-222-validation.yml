name: LLVM 222 validation workspace

on:
  push:
    branches: [work/llvm-222-validation]

permissions:
  contents: write

concurrency:
  group: llvm-222-validation-workspace
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply tested patch to current main on an isolated branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/llvm-222-workspace/tools"
          python3 - <<'PY'
          import hashlib, pathlib
          data = pathlib.Path('.github/llvm-222.patch').read_bytes().replace(b'\n diff --git', b'\ndiff --git')
          assert hashlib.sha256(data).hexdigest() == 'b1f46e0c20447833f9930296100be7a127b8dc2d809226bfaf7f72b78b57787d'
          pathlib.Path('/tmp/llvm-222.patch').write_bytes(data)
          PY
          base=$(git rev-parse origin/main)
          git worktree add --detach "$RUNNER_TEMP/llvm-222-fix" "$base"
          cd "$RUNNER_TEMP/llvm-222-fix"
          git apply --check /tmp/llvm-222.patch
          git apply /tmp/llvm-222.patch
          git diff --check
          git add src/buster/lib/compiler/llvm/bitcode.c src/buster/lib/compiler/llvm/bitcode_internal.h src/buster/tests/compiler/llvm/bitcode_test.c src/buster/tests/test.c tests/basic_c_llvm_integer_constants.c tests/basic_c_llvm_integer_constants_check.c
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(llvm): preserve narrow signed-minimum integer constants'
          git push origin HEAD:refs/heads/work/llvm-222-candidate
          git rev-parse HEAD > "$RUNNER_TEMP/llvm-222-workspace/implementation-commit.txt"
          printf '%s\n' "$base" > "$RUNNER_TEMP/llvm-222-workspace/baseline-commit.txt"
          git bundle create "$RUNNER_TEMP/llvm-222-workspace/repo.bundle" HEAD origin/main
          git archive "$base" | gzip > "$RUNNER_TEMP/llvm-222-workspace/main.tar.gz"
      - name: Collect trusted bootstrap tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y tcc mold
          cp /usr/bin/tcc /usr/bin/mold "$RUNNER_TEMP/llvm-222-workspace/tools/"
          cp -a /usr/lib/x86_64-linux-gnu/tcc "$RUNNER_TEMP/llvm-222-workspace/tools/"
          dpkg-query -W tcc mold > "$RUNNER_TEMP/llvm-222-workspace/tool-versions.txt"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/llvm-222-workspace.tar.gz" llvm-222-workspace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: llvm-222-workspace
          path: ${{ runner.temp }}/llvm-222-workspace.tar.gz
          if-no-files-found: error
          retention-days: 2
