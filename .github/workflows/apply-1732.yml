name: Apply issue 1732 repair

on:
  push:
    branches:
      - fix/1732-sysv-named-f80-varargs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply production and regression changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/apply-1732-source.yml').read_text()
          start = source.index('          from pathlib import Path\n')
          end = source.index('\n          PY\n', start)
          lines = source[start:end].splitlines()
          Path('/tmp/apply_1732.py').write_text(
              '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          )
          PY
          python3 /tmp/apply_1732.py
          rm .github/workflows/apply-1732.yml .github/apply-1732-source.yml
          git diff --check
          git status --short
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "c: support named x87 parameters in variadic functions"
          git push origin HEAD:fix/1732-sysv-named-f80-varargs
