name: Validate PR 796 CodeView link repair

on:
  push:
    branches:
      - ci/796-codeview-link-validation
    paths:
      - .github/workflows/validate-796-codeview-link.yml

permissions:
  contents: read

concurrency:
  group: validate-796-codeview-link-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out exact repaired implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 99a5ba663c389f7f9985d09351fd79d3d994feae
          persist-credentials: false
      - name: Redirect range relocations through the text section
        shell: powershell
        run: |
          @'
          from pathlib import Path

          def one(text, old, new, name):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{name}: expected one match, found {count}")
              return text.replace(old, new, 1)

          codeview_path = Path("src/buster/lib/compiler/codeview/codeview.c")
          text = codeview_path.read_text()
          helper_start = text.index("BUSTER_GLOBAL_LOCAL void codeview_emit_function_address")
          helper_end = text.index("BUSTER_GLOBAL_LOCAL bool codeview_relocation_capacity_add", helper_start)
          helper = text[helper_start:helper_end]
          helper = one(
              helper,
              """{
              if (!symbols || !relocations || !relocation_count || *relocation_count > relocation_capacity ||""",
              """{
              (void)function_index;
              if (!symbols || !relocations || !relocation_count || *relocation_count > relocation_capacity ||""",
              "unused function index",
          )
          if helper.count(".function = function_index,") != 2:
              raise SystemExit("function-address helper did not contain two function targets")
          helper = helper.replace(".function = function_index,", ".function = UINT32_MAX,")
          text = text[:helper_start] + helper + text[helper_end:]
          text = one(
              text,
              """    u32 start = range->start >= function_offset ? range->start - function_offset : 0;
              u32 length = range->end - range->start;""",
              """    (void)function_offset;
              u32 start = range->start;
              u32 length = range->end - range->start;""",
              "whole range start",
          )
          text = one(text, "u32 piece_start = range->start >= function_offset ? range->start - function_offset : 0;",
                     "u32 piece_start = range->start;", "piece range start")
          text = one(text, "u32 start = scope->start >= function_offset ? scope->start - function_offset : 0;",
                     "u32 start = scope->start;", "lexical block start")
          codeview_path.write_text(text)

          object_path = Path("src/buster/lib/compiler/object/object.c")
          text = object_path.read_text()
          marker = "    bool name_index_initialized = false;\n"
          insertion = marker + """    u32 text_symbol = UINT32_MAX;
              for (u32 relocation_index = 0; relocation_index < built.relocation_count; relocation_index += 1)
              {
                  CodeviewRelocation relocation = built.relocations[relocation_index];
                  if (relocation.function == UINT32_MAX && !relocation.symbol_name.length)
                  {
                      text_symbol = object->symbol_count++;
                      object->symbols[text_symbol] = (ObjectSymbol){
                          .name = S8(".text"),
                          .section = OBJECT_SECTION_TEXT,
                          .kind = OBJECT_SYMBOL_FUNCTION,
                      };
                      break;
                  }
              }
          """
          text = one(text, marker, insertion, "text symbol creation")
          text = one(text, "u32 symbol_index = relocation.function;",
                     "u32 symbol_index = relocation.function == UINT32_MAX && !relocation.symbol_name.length ? text_symbol : relocation.function;",
                     "text symbol selection")
          text = one(
              text,
              "(windows_unwind.function_count ? 1 : 0) + (module->position_independent ? 1 : 0));",
              "(windows_unwind.function_count ? 1 : 0) + (module->position_independent ? 1 : 0) + (codeview.valid ? 1 : 0));",
              "symbol capacity",
          )
          object_path.write_text(text)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build compiler and link promoted ABI object
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPaths = @(& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw 'Visual Studio x86/x64 tools were not found' }
          & (Join-Path $VsPaths[0].Trim() 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"

          $ResourceDir = (& clang.exe -print-resource-dir).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $RuntimeDlls = @(Get-ChildItem -Path $ResourceDir -Filter 'clang_rt.asan_dynamic-x86_64.dll' -File -Recurse | Sort-Object FullName)
          if ($RuntimeDlls.Count -ne 1) { throw "Expected one ASan runtime under ${ResourceDir}; found $($RuntimeDlls.Count)" }
          $env:PATH = "$(Split-Path -Parent $RuntimeDlls[0].FullName);$env:PATH"

          $Driver = Join-Path $env:RUNNER_TEMP 'strict-build.exe'
          cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Driver generate --cc clang --ci --linker DEFAULT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Driver build --config Release -t ide
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Ide = (Resolve-Path 'build\Release\ide.exe').Path
          $Include = (Resolve-Path 'tests\differential').Path
          $Caller = Join-Path $env:RUNNER_TEMP 'abi-caller-sanitized.o'
          $Subject = Join-Path $env:RUNNER_TEMP 'abi-p2.o'
          $Program = Join-Path $env:RUNNER_TEMP 'abi-p2-sanitized.exe'
          $LibraryPaths = @($env:LIB -split ';' | Where-Object { $_.Length -ne 0 })
          if ($LibraryPaths.Count -eq 0) { throw 'Visual Studio developer shell supplied no LIB search paths' }

          $Sanitize = @('-fsanitize=address,undefined', '-fno-sanitize-recover=all')
          $CallerArgs = @('-O0', '-fwrapv', '-fno-strict-aliasing', '-funsigned-char') + $Sanitize + @("-I$Include")
          foreach ($LibraryPath in $LibraryPaths) { $CallerArgs += "-L$LibraryPath" }
          $CallerArgs += @('tests\differential\abi_host.c', '-c', '-o', $Caller)
          & clang.exe @CallerArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Common = @(
            'cc', '-fregister-allocator=fast', '-fno-machine-fallback',
            '-fno-canonical-local-promotion', '-fno-frontend-ssa', '-fverify-codegen',
            '-fwrapv', '-fno-strict-aliasing', '-funsigned-char', "-I$Include"
          )
          foreach ($LibraryPath in $LibraryPaths) { $Common += "-L$LibraryPath" }
          & $Ide @Common '-ftarget-local-promotion' 'tests\differential\abi.c' '-c' '-o' $Subject
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Output '=== promoted object CodeView range relocations ==='
          & llvm-readobj.exe --codeview --relocations $Subject | Select-String -Pattern 'S_DEFRANGE|S_BLOCK32|IMAGE_REL_AMD64_SECREL|IMAGE_REL_AMD64_SECTION|Symbol:'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $LinkArgs = @() + $Sanitize
          foreach ($LibraryPath in $LibraryPaths) { $LinkArgs += "-L$LibraryPath" }
          $LinkArgs += @($Caller, $Subject, '-o', $Program)
          & clang.exe -v @LinkArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Program
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'PR796_CODEVIEW_LINK_VALIDATION success'
