name: Temporary combined font regression diagnostics

on:
  push:
    branches:
      - codex/font-batch-integration-diagnostic
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: b87a43ae439537959112d002255661859f32197d
  BASE_SHA: 1e3a87320b3b213355909f46c172006f2f959265
  BUSTER_TEST_JOBS: '1'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'

jobs:
  truetype:
    if: ${{ github.repository == 'buster14a/buster' && vars.GH_ACTIONS_CI_ENABLED != 'false' }}
    name: Combined font ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang-release-split
            config: Release
            sanitize: --no-sanitize
          - name: clang-asan-ubsan
            config: Debug
            sanitize: --sanitize
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: b87a43ae439537959112d002255661859f32197d
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve hosted Clang and native build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kerning-diagnostic-evidence"
          for tool in clang cmake ninja llvm-symbolizer rg; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --no-install-recommends --yes clang llvm cmake ninja-build ripgrep
              break
            fi
          done
          if [[ '${{ matrix.sanitize }}' == '--sanitize' ]]; then
            asan_runtime="$(clang --print-file-name=libclang_rt.asan-x86_64.so)"
            if [[ ! -f "$asan_runtime" ]]; then
              clang_major="$(clang --version | sed -n '1s/.*clang version \([0-9][0-9]*\).*/\1/p')"
              test -n "$clang_major"
              sudo apt-get update
              sudo apt-get install --no-install-recommends --yes "libclang-rt-${clang_major}-dev"
            fi
            test -f "$(clang --print-file-name=libclang_rt.asan-x86_64.so)"
          fi
          clang --version | tee "$RUNNER_TEMP/kerning-diagnostic-evidence/clang.txt"
          cmake --version
          ninja --version
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git rev-parse HEAD | tee "$RUNNER_TEMP/kerning-diagnostic-evidence/candidate-sha.txt"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "${BASE_SHA}:src/buster/lib/truetype.c" > "$RUNNER_TEMP/kerning-base-truetype.c"
          sha256sum src/buster/tests/truetype_test.c > "$RUNNER_TEMP/kerning-diagnostic-evidence/candidate-test-sha256.txt"
          sha256sum src/buster/lib/truetype.c src/buster/tests/truetype_test.c "$RUNNER_TEMP/kerning-base-truetype.c" > "$RUNNER_TEMP/kerning-diagnostic-evidence/source-identities.txt"

      - name: Bootstrap existing native build driver
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted Clang bootstrap is the existing documented CI exception.
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable \
            -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/kerning-build-driver"

      - name: Build exact candidate and run registered TrueType module
        shell: bash
        env:
          ASAN_OPTIONS: halt_on_error=1:symbolize=1
          UBSAN_OPTIONS: halt_on_error=1:exitcode=87:print_stacktrace=1
          LSAN_OPTIONS: detect_leaks=1:exitcode=86:print_suppressions=1
          BUSTER_SANITIZER_POLICY_MODE: ${{ matrix.sanitize == '--sanitize' && 'fatal' || 'unsupported' }}
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/kerning-build-driver"
          "$driver" generate --build-directory build/kerning-focused --cc clang --config '${{ matrix.config }}' \
            '${{ matrix.sanitize }}' --ci --no-fuzz --no-lto --linker DEFAULT -- \
            -DBUSTER_INCLUDE_TESTS=ON -DBUSTER_UNITY_BUILD=OFF -DBUSTER_DEBUG_INFO=OFF \
            2>&1 | tee "$RUNNER_TEMP/kerning-diagnostic-evidence/candidate-generate.log"
          "$driver" build --build-directory build/kerning-focused --config '${{ matrix.config }}' -t ide -- -j2 \
            2>&1 | tee "$RUNNER_TEMP/kerning-diagnostic-evidence/candidate-build.log"
          build/kerning-focused/'${{ matrix.config }}'/ide test --module=truetype_tests --verbose=1 --ci=1 \
            2>&1 | tee "$RUNNER_TEMP/kerning-diagnostic-evidence/candidate-test.log"
          rg 'module=truetype_tests .*passed=142 failed=0 assertions=142 status=pass' \
            "$RUNNER_TEMP/kerning-diagnostic-evidence/candidate-test.log"
          printf 'Exact candidate `%s`: registered `truetype_tests` passed (%s).\n' \
            "$CANDIDATE_SHA" '${{ matrix.name }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Require new tests to reject restored base production
        if: ${{ matrix.sanitize == '--no-sanitize' }}
        shell: bash
        env:
          ASAN_OPTIONS: halt_on_error=1:symbolize=1
          UBSAN_OPTIONS: halt_on_error=1:exitcode=87:print_stacktrace=1
          LSAN_OPTIONS: detect_leaks=1:exitcode=86:print_suppressions=1
          BUSTER_SANITIZER_POLICY_MODE: ${{ matrix.sanitize == '--sanitize' && 'fatal' || 'unsupported' }}
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/kerning-build-driver"
          # This checkout belongs only to the temporary diagnostic job. Reuse
          # the split graph so restoring one production file rebuilds one module.
          cp "$RUNNER_TEMP/kerning-base-truetype.c" src/buster/lib/truetype.c
          sha256sum --check "$RUNNER_TEMP/kerning-diagnostic-evidence/candidate-test-sha256.txt"
          test "$(git diff --name-only)" = 'src/buster/lib/truetype.c'
          git diff -- src/buster/lib/truetype.c > "$RUNNER_TEMP/kerning-diagnostic-evidence/baseline-production-restore.patch"
          "$driver" build --build-directory build/kerning-focused --config '${{ matrix.config }}' -t ide -- -j2 \
            2>&1 | tee "$RUNNER_TEMP/kerning-diagnostic-evidence/baseline-build.log"
          set +e
          build/kerning-focused/'${{ matrix.config }}'/ide test --module=truetype_tests --verbose=1 --ci=1 \
            2>&1 | tee "$RUNNER_TEMP/kerning-diagnostic-evidence/baseline-test.log"
          baseline_status="${PIPESTATUS[0]}"
          set -e
          # Require an assertion failure, rather than a crash or sanitizer exit.
          test "$baseline_status" -eq 1
          rg --fixed-strings "truetype_get_codepoint_kern_advance(&font, 'A', 'B') == -50" \
            "$RUNNER_TEMP/kerning-diagnostic-evidence/baseline-test.log"
          rg --fixed-strings 'memcmp(reference, xy.pixels, (size_t)xy.width * (size_t)xy.height) == 0' \
            "$RUNNER_TEMP/kerning-diagnostic-evidence/baseline-test.log"
          printf 'Restored `%s` production with candidate tests: expected kerning assertion failure (%s).\n' \
            "$BASE_SHA" '${{ matrix.name }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Retain focused diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kerning-diagnostic-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kerning-diagnostic-evidence
          if-no-files-found: error
          retention-days: 7
