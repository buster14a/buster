name: Alignment matrix commit transport
on:
  push:
    branches: [work/audit-238-source-20260907]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Import test-only follow-up without updating another worker's branch
        shell: bash
        run: |
          set -euo pipefail
          parent=d9688bf50ca09f5b59802366b6b2585b7a6de745
          git cat-file -e "$parent^{commit}"
          cat tools/audit-238.part-0 tools/audit-238.part-1 > "$RUNNER_TEMP/matrix.bundle"
          printf '%s  %s\n' 793bf33174dd2117be6530f4605d97fa79977d0fee94c84dd859c7b6315be51d "$RUNNER_TEMP/matrix.bundle" | sha256sum --check -
          git bundle verify "$RUNNER_TEMP/matrix.bundle"
          git fetch "$RUNNER_TEMP/matrix.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = 14ebc9aab9fd8f6cb12043db28a63c120a399a5c
          test "$(git rev-parse FETCH_HEAD^{tree})" = f52db1975b2cfd62153df2e7494a57930bccc2cc
          git diff --check "$parent" FETCH_HEAD
          git diff --exit-code "$parent" FETCH_HEAD -- src/buster/lib/
          git push origin FETCH_HEAD:refs/heads/audit/parameter-matrix-238-14ebc9aa
          git log -1 --format='%H %T %P %s' FETCH_HEAD
