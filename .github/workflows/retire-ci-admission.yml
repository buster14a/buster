name: Retire removed CI admission gates
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write
  statuses: write
jobs:
  retire:
    if: github.repository_id == '1421805693' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REQUIRED: Build and execute on Ryzen 7 9700X
      REPO: buster14a/buster
    steps:
      - name: Hand required-check authority back to the original native workflow
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPO/pulls?state=open&base=main&per_page=100" > "$RUNNER_TEMP/prs.json"
          jq -r '.[][] | [.number, .head.sha] | @tsv' "$RUNNER_TEMP/prs.json" > "$RUNNER_TEMP/heads"
          missing=0
          while IFS=$'\t' read -r pr head; do
            [[ "$pr" =~ ^[0-9]+$ && "$head" =~ ^[0-9a-f]{40}$ ]]
            gh api --paginate --slurp "repos/$REPO/commits/$head/check-runs?filter=all&per_page=100" > "$RUNNER_TEMP/checks.json"
            jq -r --arg prefix "buster-9700x/qualification/v1/$pr/$head/" \
              '.[].check_runs[] | select(.app.id == 15368 and (.external_id // "" | startswith($prefix))) | .id' \
              "$RUNNER_TEMP/checks.json" > "$RUNNER_TEMP/retire"
            if [[ ! -s "$RUNNER_TEMP/retire" ]]; then continue; fi
            native=0
            jq -r --arg name "$REQUIRED" \
              '.[].check_runs[] | select(.app.id == 15368 and .name == $name and (.external_id // "" | startswith("buster-9700x/") | not)) | .id' \
              "$RUNNER_TEMP/checks.json" > "$RUNNER_TEMP/native"
            while read -r job; do
              [[ "$job" =~ ^[0-9]+$ ]]
              if ! gh api "repos/$REPO/actions/jobs/$job" > "$RUNNER_TEMP/job.json"; then continue; fi
              if ! jq -e --arg name "$REQUIRED" \
                '.name == $name and (["self-hosted", "Linux", "X64", "buster-zen5", "ryzen-9700x"] - (.labels // []) | length == 0)' \
                "$RUNNER_TEMP/job.json" > /dev/null; then continue; fi
              run=$(jq -r '.run_id' "$RUNNER_TEMP/job.json")
              [[ "$run" =~ ^[0-9]+$ ]]
              gh api "repos/$REPO/actions/runs/$run" > "$RUNNER_TEMP/run.json"
              if jq -e --arg head "$head" \
                '.workflow_id == 386441181 and .event == "pull_request" and .head_sha == $head and .head_repository.id == 1421805693' \
                "$RUNNER_TEMP/run.json" > /dev/null; then native=$job; break; fi
            done < "$RUNNER_TEMP/native"
            if [[ "$native" == 0 ]]; then
              echo "PR $pr needs its native workflow rerun before gate retirement." >> "$GITHUB_STEP_SUMMARY"
              missing=$((missing + 1))
              continue
            fi
            current=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')
            if [[ "$current" != "$head" ]]; then continue; fi
            # This retires the additional gate; it does not certify qualification. The independently verified
            # native required check remains present, and still blocks on pending, failure or cancellation.
            gh api -X POST "repos/$REPO/statuses/$head" -f state=success -f context="$REQUIRED" \
              -f description='Admission gate removed; native 9700X check remains authoritative' > /dev/null
            jq -n '{name:"Retired 9700X admission experiment",status:"completed",conclusion:"neutral",output:{title:"Admission experiment removed",summary:"The original native 9700X check remains required. This retired experiment is not qualification evidence."}}' > "$RUNNER_TEMP/retirement.json"
            while read -r check; do
              [[ "$check" =~ ^[0-9]+$ ]]
              gh api -X PATCH "repos/$REPO/check-runs/$check" --input "$RUNNER_TEMP/retirement.json" > /dev/null
            done < "$RUNNER_TEMP/retire"
            echo "PR $pr: retired admission checks; native required job $native remains authoritative." >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/heads"
          gh api "repos/$REPO/check-runs/122176726609" > "$RUNNER_TEMP/ledger.json"
          jq -e '.app.id == 15368 and .external_id == "buster-9700x/state/v1" and .head_sha == "335424b18635fa9ab3ac5eb91e7497aaddd37cab"' "$RUNNER_TEMP/ledger.json" > /dev/null
          lease=$(jq -r '.output.text | fromjson | .lease.run // 0' "$RUNNER_TEMP/ledger.json")
          [[ "$lease" =~ ^[0-9]+$ ]]
          if [[ "$lease" != 0 ]]; then
            gh api "repos/$REPO/actions/runs/$lease" --jq '.status' | tr -d '\r' | { read -r status; [[ "$status" == completed ]]; }
          fi
          jq -n '{name:"Retired CI admission ledger",status:"completed",conclusion:"neutral",output:{title:"Admission experiment removed",summary:"The admission controller is disabled and its source is reverted; no admission lease is active."}}' > "$RUNNER_TEMP/ledger-retirement.json"
          gh api -X PATCH "repos/$REPO/check-runs/122176726609" --input "$RUNNER_TEMP/ledger-retirement.json" > /dev/null
          [[ "$missing" == 0 ]]
