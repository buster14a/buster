name: Issue 674 source export

on:
  push:
    branches:
      - fix/674-generic-constant-expressions
    paths:
      - .github/workflows/issue-674-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Package exact checkout
        shell: bash
        run: tar --exclude=.git -czf "$RUNNER_TEMP/issue-674-source.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-674-source
          path: ${{ runner.temp }}/issue-674-source.tar.gz
          compression-level: 0
          retention-days: 1
