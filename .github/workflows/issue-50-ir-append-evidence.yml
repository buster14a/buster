name: Issue 50 IR append evidence

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/issue-50-ir-append-evidence.yml
      - src/buster/lib/compiler/ir/ir_append.h
      - src/buster/lib/compiler/ir/ir_construction.h
      - src/buster/lib/compiler/frontend/c/c_gen_internal.h
      - src/buster/lib/compiler/frontend/c/c.c

permissions:
  contents: read

concurrency:
  group: issue-50-ir-append-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend-evidence:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline
          persist-credentials: false
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.HEAD_SHA }}
          path: candidate
          persist-credentials: false
      - name: Record exact inputs and probe hardware counters
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$HEAD_SHA"
          mkdir -p evidence
          {
            printf 'base_sha=%s\nhead_sha=%s\n' "$BASE_SHA" "$HEAD_SHA"
            printf 'base_tree=%s\nhead_tree=%s\n' \
              "$(git -C baseline rev-parse 'HEAD^{tree}')" \
              "$(git -C candidate rev-parse 'HEAD^{tree}')"
            uname -a
            lscpu
            clang --version
            perf --version
            printf 'perf_event_paranoid_before='
            cat /proc/sys/kernel/perf_event_paranoid
          } > evidence/environment.txt
          sudo sysctl -w kernel.perf_event_paranoid=0 | tee -a evidence/environment.txt
          printf 'perf_event_paranoid_after=' >> evidence/environment.txt
          cat /proc/sys/kernel/perf_event_paranoid | tee -a evidence/environment.txt
          if perf stat --no-big-num -e instructions:u -- true 2> evidence/perf-probe.txt; then
            printf 'hardware_instructions=available\n' | tee -a evidence/environment.txt
          else
            printf 'hardware_instructions=unavailable\n' | tee -a evidence/environment.txt
            cat evidence/perf-probe.txt
          fi
      - name: Install deterministic instruction counter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind
          valgrind --version | tee -a evidence/environment.txt
      - name: Build baseline and candidate with the same host compiler
        shell: bash
        run: |
          set -euo pipefail
          for tree in baseline candidate; do
            (
              cd "$tree"
              mkdir -p .issue50
              clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o .issue50/build
              .issue50/build generate --cc clang --ci --linker DEFAULT
              .issue50/build build --config Release -t ide
              sha256sum build/Release/ide > ../evidence/"$tree"-ide.sha256
            )
          done
      - name: Measure interleaved complete frontend wall time
        shell: bash
        run: |
          set -euo pipefail
          CPU=$(python3 - <<'PY'
          import os
          print(min(os.sched_getaffinity(0)))
          PY
          )
          printf 'cpu=%s\n' "$CPU" | tee -a evidence/environment.txt
          printf 'pair\tside\torder\twall_ns\tbench_min_ns\tbench_median_ns\tsignature\n' > evidence/wall-results.tsv

          run_one() {
            side=$1
            pair=$2
            order=$3
            log_file="evidence/wall-${pair}-${side}.log"
            start=$(date +%s%N)
            (cd "$side" && taskset -c "$CPU" build/Release/ide bench > "../$log_file" 2>&1)
            end=$(date +%s%N)
            line=$(grep -m1 '^BENCH_C_FRONTEND ' "$log_file")
            bench_min=$(printf '%s\n' "$line" | sed -n 's/.* min_ns=\([0-9][0-9]*\).*/\1/p')
            bench_median=$(printf '%s\n' "$line" | sed -n 's/.* median_ns=\([0-9][0-9]*\).*/\1/p')
            signature=$(printf '%s\n' "$line" | sed -E 's/ min_ns=[0-9]+ median_ns=[0-9]+ throughput_mb_s=[0-9]+$//')
            test -n "$bench_min"
            test -n "$bench_median"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$pair" "$side" "$order" "$((end - start))" \
              "$bench_min" "$bench_median" "$signature" >> evidence/wall-results.tsv
          }

          for side in baseline candidate; do
            for warmup in 1 2 3; do
              (cd "$side" && taskset -c "$CPU" build/Release/ide bench >/dev/null)
            done
          done

          for pair in $(seq 1 20); do
            if ((pair % 2)); then
              run_one baseline "$pair" 1
              run_one candidate "$pair" 2
            else
              run_one candidate "$pair" 1
              run_one baseline "$pair" 2
            fi
          done
      - name: Measure deterministic dynamic instruction executions
        shell: bash
        run: |
          set -euo pipefail
          printf 'pair\tside\torder\tcallgrind_ir\tsignature\n' > evidence/callgrind-results.tsv

          run_callgrind() {
            side=$1
            pair=$2
            order=$3
            output="evidence/callgrind-${pair}-${side}.out"
            log="evidence/callgrind-${pair}-${side}.log"
            bench="evidence/callgrind-bench-${pair}-${side}.log"
            (
              cd "$side"
              valgrind --tool=callgrind --cache-sim=no --branch-sim=no --collect-jumps=no \
                --callgrind-out-file="../$output" --log-file="../$log" \
                build/Release/ide bench > "../$bench" 2>&1
            )
            instructions=$(awk '$1 == "summary:" {print $2; exit}' "$output")
            line=$(grep -m1 '^BENCH_C_FRONTEND ' "$bench")
            signature=$(printf '%s\n' "$line" | sed -E 's/ min_ns=[0-9]+ median_ns=[0-9]+ throughput_mb_s=[0-9]+$//')
            test -n "$instructions"
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$pair" "$side" "$order" "$instructions" "$signature" >> evidence/callgrind-results.tsv
          }

          for pair in 1 2 3; do
            if ((pair % 2)); then
              run_callgrind baseline "$pair" 1
              run_callgrind candidate "$pair" 2
            else
              run_callgrind candidate "$pair" 1
              run_callgrind baseline "$pair" 2
            fi
          done
      - name: Summarize paired evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import json
          import statistics
          from pathlib import Path

          wall_rows = list(csv.DictReader(Path('evidence/wall-results.tsv').open(), delimiter='\t'))
          instruction_rows = list(csv.DictReader(Path('evidence/callgrind-results.tsv').open(), delimiter='\t'))
          assert len(wall_rows) == 40, len(wall_rows)
          assert len(instruction_rows) == 6, len(instruction_rows)
          for row in wall_rows:
              for key in ('pair', 'order', 'wall_ns', 'bench_min_ns', 'bench_median_ns'):
                  row[key] = int(row[key])
          for row in instruction_rows:
              for key in ('pair', 'order', 'callgrind_ir'):
                  row[key] = int(row[key])
          signatures = {row['signature'] for row in wall_rows + instruction_rows}
          assert len(signatures) == 1, signatures

          def paired(rows):
              result = {}
              for row in rows:
                  result.setdefault(row['pair'], {})[row['side']] = row
              assert all(set(pair) == {'baseline', 'candidate'} for pair in result.values())
              return result

          wall_pairs = paired(wall_rows)
          instruction_pairs = paired(instruction_rows)
          environment = Path('evidence/environment.txt').read_text().splitlines()
          summary = {
              'base_sha': environment[0].split('=', 1)[1],
              'head_sha': environment[1].split('=', 1)[1],
              'wall_pairs': len(wall_pairs),
              'instruction_pairs': len(instruction_pairs),
              'hardware_instructions': next(line.split('=', 1)[1] for line in environment if line.startswith('hardware_instructions=')),
              'signature': next(iter(signatures)),
              'metrics': {},
          }

          metric_sets = {
              'wall_ns': wall_pairs,
              'bench_min_ns': wall_pairs,
              'bench_median_ns': wall_pairs,
              'callgrind_ir': instruction_pairs,
          }
          for field, pairs in metric_sets.items():
              baseline = [pair['baseline'][field] for pair in pairs.values()]
              candidate = [pair['candidate'][field] for pair in pairs.values()]
              changes = [100.0 * (pair['candidate'][field] / pair['baseline'][field] - 1.0) for pair in pairs.values()]
              summary['metrics'][field] = {
                  'baseline_median': statistics.median(baseline),
                  'candidate_median': statistics.median(candidate),
                  'median_paired_change_percent': statistics.median(changes),
                  'min_paired_change_percent': min(changes),
                  'max_paired_change_percent': max(changes),
              }

          Path('evidence/summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          labels = {
              'wall_ns': 'Process wall time',
              'bench_min_ns': 'Frontend inner minimum',
              'bench_median_ns': 'Frontend inner median',
              'callgrind_ir': 'Callgrind Ir',
          }
          lines = [
              '# Issue 50 IR append evidence',
              '',
              f"Baseline `{summary['base_sha']}`; candidate `{summary['head_sha']}`; "
              f"{summary['wall_pairs']} alternating same-CPU native wall pairs and "
              f"{summary['instruction_pairs']} alternating Callgrind pairs.",
              '',
              f"Semantic signature: `{summary['signature']}`.",
              '',
              f"Hardware PMU instructions event: **{summary['hardware_instructions']}** on this hosted VM.",
              '',
              '| Metric | Baseline median | Candidate median | Median paired change | Pair range |',
              '|---|---:|---:|---:|---:|',
          ]
          for field in ('wall_ns', 'bench_min_ns', 'bench_median_ns', 'callgrind_ir'):
              metric = summary['metrics'][field]
              lines.append(
                  f"| {labels[field]} | {metric['baseline_median']:.0f} | {metric['candidate_median']:.0f} | "
                  f"{metric['median_paired_change_percent']:+.3f}% | "
                  f"{metric['min_paired_change_percent']:+.3f}% to {metric['max_paired_change_percent']:+.3f}% |"
              )
          lines += [
              '',
              'Each process performs the optimized 30-iteration complete C-frontend benchmark after native warmups. '
              'Callgrind `Ir` is a deterministic dynamic user-mode instruction-execution proxy; it is not a hardware PMU retired-instruction counter. '
              'The raw PMU probe is retained to make that limitation explicit.',
          ]
          Path('evidence/summary.md').write_text('\n'.join(lines) + '\n')
          PY
          cat evidence/summary.md
          cat evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain raw evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-50-ir-append-${{ env.HEAD_SHA }}
          path: evidence
          retention-days: 14
          if-no-files-found: error
