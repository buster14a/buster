name: Issue 50 IR append evidence

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/issue-50-ir-append-evidence.yml
      - src/buster/lib/compiler/ir/ir_append.h
      - src/buster/lib/compiler/ir/ir_construction.h
      - src/buster/lib/compiler/frontend/c/c_gen_internal.h
      - src/buster/lib/compiler/frontend/c/c.c

permissions:
  contents: read

concurrency:
  group: issue-50-ir-append-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend-pmu:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline
          persist-credentials: false
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.HEAD_SHA }}
          path: candidate
          persist-credentials: false
      - name: Record exact inputs and enable hardware counters
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$HEAD_SHA"
          mkdir -p evidence
          {
            printf 'base_sha=%s\nhead_sha=%s\n' "$BASE_SHA" "$HEAD_SHA"
            printf 'base_tree=%s\nhead_tree=%s\n' \
              "$(git -C baseline rev-parse 'HEAD^{tree}')" \
              "$(git -C candidate rev-parse 'HEAD^{tree}')"
            uname -a
            lscpu
            clang --version
            perf --version
            printf 'perf_event_paranoid_before='
            cat /proc/sys/kernel/perf_event_paranoid
          } > evidence/environment.txt
          sudo sysctl -w kernel.perf_event_paranoid=0 | tee -a evidence/environment.txt
          printf 'perf_event_paranoid_after=' >> evidence/environment.txt
          cat /proc/sys/kernel/perf_event_paranoid | tee -a evidence/environment.txt
          perf stat --no-big-num -e instructions:u -- true 2> evidence/perf-probe.txt
          grep -Eq '^[[:space:]]*[0-9]+[[:space:]]+instructions:u' evidence/perf-probe.txt
      - name: Build baseline and candidate with the same host compiler
        shell: bash
        run: |
          set -euo pipefail
          for tree in baseline candidate; do
            (
              cd "$tree"
              mkdir -p .issue50
              clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o .issue50/build
              .issue50/build generate --cc clang --ci --linker DEFAULT
              .issue50/build build --config Release -t ide
              sha256sum build/Release/ide > ../evidence/"$tree"-ide.sha256
            )
          done
      - name: Measure interleaved complete frontend runs
        shell: bash
        run: |
          set -euo pipefail
          CPU=$(python3 - <<'PY'
          import os
          print(min(os.sched_getaffinity(0)))
          PY
          )
          printf 'cpu=%s\n' "$CPU" | tee -a evidence/environment.txt
          printf 'pair\tside\torder\twall_ns\tinstructions\tbench_min_ns\tbench_median_ns\tsignature\n' > evidence/results.tsv

          run_one() {
            side=$1
            pair=$2
            order=$3
            perf_file="evidence/perf-${pair}-${side}.csv"
            log_file="evidence/bench-${pair}-${side}.log"
            start=$(date +%s%N)
            (
              cd "$side"
              taskset -c "$CPU" perf stat --no-big-num -x, -e instructions:u \
                -o "../$perf_file" -- build/Release/ide bench > "../$log_file" 2>&1
            )
            end=$(date +%s%N)
            instructions=$(awk -F, '$3 ~ /^instructions/ {gsub(/[[:space:]]/, "", $1); print $1; exit}' "$perf_file")
            line=$(grep -m1 '^BENCH_C_FRONTEND ' "$log_file")
            bench_min=$(printf '%s\n' "$line" | sed -n 's/.* min_ns=\([0-9][0-9]*\).*/\1/p')
            bench_median=$(printf '%s\n' "$line" | sed -n 's/.* median_ns=\([0-9][0-9]*\).*/\1/p')
            signature=$(printf '%s\n' "$line" | sed -E 's/ min_ns=[0-9]+ median_ns=[0-9]+ throughput_mb_s=[0-9]+$//')
            test -n "$instructions"
            test -n "$bench_min"
            test -n "$bench_median"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$pair" "$side" "$order" "$((end - start))" "$instructions" \
              "$bench_min" "$bench_median" "$signature" >> evidence/results.tsv
          }

          for side in baseline candidate; do
            for warmup in 1 2 3; do
              (cd "$side" && taskset -c "$CPU" build/Release/ide bench >/dev/null)
            done
          done

          for pair in $(seq 1 20); do
            if ((pair % 2)); then
              run_one baseline "$pair" 1
              run_one candidate "$pair" 2
            else
              run_one candidate "$pair" 1
              run_one baseline "$pair" 2
            fi
          done
      - name: Summarize paired evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import json
          import statistics
          from pathlib import Path

          rows = list(csv.DictReader(Path('evidence/results.tsv').open(), delimiter='\t'))
          assert len(rows) == 40, len(rows)
          for row in rows:
              for key in ('pair', 'order', 'wall_ns', 'instructions', 'bench_min_ns', 'bench_median_ns'):
                  row[key] = int(row[key])
          signatures = {row['signature'] for row in rows}
          assert len(signatures) == 1, signatures
          by_pair = {}
          for row in rows:
              by_pair.setdefault(row['pair'], {})[row['side']] = row
          assert len(by_pair) == 20
          assert all(set(pair) == {'baseline', 'candidate'} for pair in by_pair.values())

          fields = ('wall_ns', 'instructions', 'bench_min_ns', 'bench_median_ns')
          summary = {
              'base_sha': Path('evidence/environment.txt').read_text().splitlines()[0].split('=', 1)[1],
              'head_sha': Path('evidence/environment.txt').read_text().splitlines()[1].split('=', 1)[1],
              'pairs': len(by_pair),
              'signature': next(iter(signatures)),
              'metrics': {},
          }
          for field in fields:
              baseline = [pair['baseline'][field] for pair in by_pair.values()]
              candidate = [pair['candidate'][field] for pair in by_pair.values()]
              paired_change = [100.0 * (pair['candidate'][field] / pair['baseline'][field] - 1.0) for pair in by_pair.values()]
              summary['metrics'][field] = {
                  'baseline_median': statistics.median(baseline),
                  'candidate_median': statistics.median(candidate),
                  'median_paired_change_percent': statistics.median(paired_change),
                  'min_paired_change_percent': min(paired_change),
                  'max_paired_change_percent': max(paired_change),
              }
          Path('evidence/summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          labels = {
              'wall_ns': 'Process wall time',
              'instructions': 'Retired user instructions',
              'bench_min_ns': 'Frontend inner minimum',
              'bench_median_ns': 'Frontend inner median',
          }
          lines = [
              '# Issue 50 IR append evidence',
              '',
              f"Baseline `{summary['base_sha']}`; candidate `{summary['head_sha']}`; "
              f"{summary['pairs']} alternating same-CPU pairs.",
              '',
              f"Semantic signature: `{summary['signature']}`.",
              '',
              '| Metric | Baseline median | Candidate median | Median paired change | Pair range |',
              '|---|---:|---:|---:|---:|',
          ]
          for field in fields:
              metric = summary['metrics'][field]
              lines.append(
                  f"| {labels[field]} | {metric['baseline_median']:.0f} | {metric['candidate_median']:.0f} | "
                  f"{metric['median_paired_change_percent']:+.3f}% | "
                  f"{metric['min_paired_change_percent']:+.3f}% to {metric['max_paired_change_percent']:+.3f}% |"
              )
          lines += [
              '',
              'The hardware counter is `instructions:u` for the complete `ide bench` process. '
              'Each process performs the optimized 30-iteration C-frontend benchmark after three untimed warmups; '
              'baseline and candidate order alternates by pair.',
          ]
          Path('evidence/summary.md').write_text('\n'.join(lines) + '\n')
          PY
          cat evidence/summary.md
          cat evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain raw evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-50-ir-append-${{ env.HEAD_SHA }}
          path: evidence
          retention-days: 14
          if-no-files-found: error
