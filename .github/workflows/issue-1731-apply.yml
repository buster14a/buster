name: Apply and validate issue 1731

on:
  push:
    branches:
      - fix/1731-x87-float16-runtime

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Apply implementation and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/issue_1731_apply.py
          git diff --check
          git diff --stat

      - name: Select a Zen 5-capable Clang
        shell: bash
        run: |
          set -euo pipefail
          selected=''
          for candidate in clang-22 clang-21 clang-20 clang-19 clang; do
            if command -v "$candidate" >/dev/null 2>&1 &&
               printf 'int value;\n' | "$candidate" -march=znver5 -x c -c -o "$RUNNER_TEMP/znver5.o" - 2>/dev/null; then
              selected=$(command -v "$candidate")
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            printf 'No installed Clang accepts -march=znver5.\n' >&2
            exit 1
          fi
          "$selected" --version
          printf 'HOST_CLANG=%s\n' "$selected" >> "$GITHUB_ENV"

      - name: Build and run compiler gates
        shell: bash
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/buster-build"
          "$HOST_CLANG" -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver"
          "$driver" generate --cc clang --config Release --linker DEFAULT -- -DCMAKE_C_COMPILER="$HOST_CLANG" -DBUSTER_DEBUG_INFO=OFF
          "$driver" build --config Release -t test_all
          "$driver" test_mode_matrix --config Release
          "$driver" test_self_host --config Release

      - name: Commit validated implementation
        shell: bash
        env:
          BASE_SHA: 5c51ac74673646e7fef3a09d078b136581b6fb5d
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/buster-build"
          git rm .github/workflows/issue-1731-apply.yml tools/issue_1731_apply.py
          git diff --check
          python3 - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/issue-1731-apply.yml",
              "docs/agents/frontend/wide-floats-assembly.md",
              "src/buster/lib/compiler/frontend/c/c_gen.c",
              "src/buster/lib/compiler/frontend/c/c_internal.h",
              "src/buster/lib/compiler/frontend/c/c_parse.c",
              "src/buster/tests/compiler/driver/driver_test.c",
              "tools/issue_1731_apply.py",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "HEAD"], text=True).splitlines())
          unexpected = changed - allowed
          missing = allowed - changed
          if unexpected or missing:
              raise SystemExit(f"unexpected={sorted(unexpected)} missing={sorted(missing)}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/frontend/wide-floats-assembly.md \
                  src/buster/lib/compiler/frontend/c/c_gen.c \
                  src/buster/lib/compiler/frontend/c/c_internal.h \
                  src/buster/lib/compiler/frontend/c/c_parse.c \
                  src/buster/tests/compiler/driver/driver_test.c
          git commit -m "c: support x87 long double to _Float16"
          "$driver" source_size --base "$BASE_SHA"
          git push origin HEAD:fix/1731-x87-float16-runtime
