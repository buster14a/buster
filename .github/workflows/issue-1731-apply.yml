name: Apply and validate issue 1731

on:
  push:
    branches:
      - fix/1731-x87-float16-runtime

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Apply implementation and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/issue_1731_apply.py
          git diff --check
          git diff --stat

      - name: Build compiler and run full tests
        shell: bash
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/buster-build"
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver"
          "$driver" generate --cc clang --config Release --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF

          set +e
          "$driver" build --config Release -t test_all 2>&1 | tee "$RUNNER_TEMP/test-all.log"
          test_status=${PIPESTATUS[0]}
          set -e
          grep -q 'fixture=compiler_driver_test_x86_64_f80_float16_runtime' "$RUNNER_TEMP/test-all.log"
          if (( test_status != 0 )); then
            znver5_errors=$(grep -c "error: unknown target CPU 'znver5'" "$RUNNER_TEMP/test-all.log" || true)
            known_failures=$(grep -c 'host_ok failed at .*compiler_driver_test_wide_vector_boundaries' "$RUNNER_TEMP/test-all.log" || true)
            other_fixture_failures=$(grep ' failed at ' "$RUNNER_TEMP/test-all.log" | \
              grep -v 'compiler_driver_test_wide_vector_boundaries' | wc -l)
            if (( znver5_errors != 2 || known_failures != 2 || other_fixture_failures != 0 )); then
              printf 'test_all failed outside the two known #1292 Clang-18 znver5 cells.\n' >&2
              exit "$test_status"
            fi
            printf 'Accepted exactly two pre-existing #1292 failures: host Clang 18 has no znver5 CPU.\n'
          fi

          "$driver" test_mode_matrix --config Release
          "$driver" test_self_host --config Release

      - name: Commit validated implementation
        shell: bash
        env:
          BASE_SHA: 5c51ac74673646e7fef3a09d078b136581b6fb5d
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/buster-build"
          git rm .github/workflows/issue-1731-apply.yml tools/issue_1731_apply.py
          git diff --check
          python3 - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/issue-1731-apply.yml",
              "docs/agents/frontend/wide-floats-assembly.md",
              "src/buster/lib/compiler/frontend/c/c_gen.c",
              "src/buster/lib/compiler/frontend/c/c_internal.h",
              "src/buster/lib/compiler/frontend/c/c_parse.c",
              "src/buster/tests/compiler/driver/driver_test.c",
              "tools/issue_1731_apply.py",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "HEAD"], text=True).splitlines())
          unexpected = changed - allowed
          missing = allowed - changed
          if unexpected or missing:
              raise SystemExit(f"unexpected={sorted(unexpected)} missing={sorted(missing)}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/frontend/wide-floats-assembly.md \
                  src/buster/lib/compiler/frontend/c/c_gen.c \
                  src/buster/lib/compiler/frontend/c/c_internal.h \
                  src/buster/lib/compiler/frontend/c/c_parse.c \
                  src/buster/tests/compiler/driver/driver_test.c
          git commit -m "c: support x87 long double to _Float16"
          "$driver" source_size --base "$BASE_SHA"
          git push origin HEAD:fix/1731-x87-float16-runtime
