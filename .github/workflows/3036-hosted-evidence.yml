name: Integer truth evidence for 3036
on:
  push:
    branches: [codex/3036-hosted-evidence]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      BUSTER_HOST_ARCH: vector
      BUSTER_DEBUG_INFO: '0'
      BUSTER_SANITIZER: none
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: ecec17211fcd3458e01ae808f86f9b6e019fa450
          fetch-depth: 2
      - name: Check hosted CPU
        run: |
          lscpu | grep 'Model name'
          cc -std=c17 -O2 -march=x86-64-v4 -maes -mgfni -mvaes -mavx512vbmi -mavx512vbmi2 -mavx512vpopcntdq -mavx512bitalg -mavx512vnni tools/ci/vector-probe.c -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"
      - name: Stage the pinned toolchain and SQLite corpus
        run: |
          dirs=$(bash tools/ci/session-toolchain.sh stage)
          export PATH="$dirs:$PATH"
          tr ':' '\n' <<< "$dirs" >> "$GITHUB_PATH"
          clang --version
          bash tools/ci/fetch-corpus.sh "$RUNNER_TEMP/corpus"
      - name: Compare base and head on this runner
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/3036"
          mkdir "$root"
          cd "$GITHUB_WORKSPACE"
          cat > "$root/probe.c" <<'SRC'
          int truth_eq(int x, int y) { return (x < y) == 1; }
          int truth_ne(unsigned x, unsigned y) { return 1L != (long)(x < y); }
          SRC
          cat > "$root/oracle.c" <<'SRC'
          #include <limits.h>
          #include <stdio.h>
          int truth_eq(int, int), ref_eq(int, int);
          int truth_ne(unsigned, unsigned), ref_ne(unsigned, unsigned);
          int main(void) {
              const int inputs[] = { INT_MIN, INT_MIN + 1, -2, -1, 0, 1, 2, INT_MAX - 1, INT_MAX };
              for (unsigned i = 0; i < 9; i++)
                  for (unsigned j = 0; j < 9; j++)
                      if (truth_eq(inputs[i], inputs[j]) != ref_eq(inputs[i], inputs[j]) ||
                          truth_ne((unsigned)inputs[i], (unsigned)inputs[j]) != ref_ne((unsigned)inputs[i], (unsigned)inputs[j]))
                          return 1;
              puts("Clang agrees on 162 signed/unsigned return values.");
              return 0;
          }
          SRC
          clang -std=c17 -O2 -Dtruth_eq=ref_eq -Dtruth_ne=ref_ne -c "$root/probe.c" -o "$root/ref.o"
          c="$RUNNER_TEMP/corpus"
          for rev in 6427879e1143026a12fb0388a20bdea1fe4b2bc5 ecec17211fcd3458e01ae808f86f9b6e019fa450; do
            git switch --detach "$rev"
            echo "SOURCE $(git rev-parse HEAD)"
            ./build.sh --config Release
            f=(--tier1 --tier1-strict --verify --lanes 1 -O2 -march=x86-64 -std=c17)
            ./build/compiler "${f[@]}" -c "$root/probe.c" -o "$root/$rev.o"
            objdump -d "$root/$rev.o" | sed '/[[:space:]]int3$/d'
            nm -S --defined-only "$root/$rev.o"
            clang -O2 "$root/oracle.c" "$root/ref.o" "$root/$rev.o" -o "$root/oracle"
            "$root/oracle"
            ./build/compiler test-ir-optimize
            clang -std=c17 -O2 -Wall -Wextra -Werror -fno-strict-aliasing tests/driver/tier1_truth.c -o build/test-driver-tier1-truth
            ./build/test-driver-tier1-truth build/compiler "$(command -v clang)"
            clang -std=c17 -O2 -Wall -Wextra -Werror -fno-strict-aliasing tests/driver/tier1_patterns.c -o build/test-driver-tier1-patterns
            ./build/test-driver-tier1-patterns build/compiler "$(command -v clang)"
            cp -L build/compiler "$root/compiler-$rev"
          done
      - name: Compare the frozen SQLite amalgamation
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/3036"
          c="$RUNNER_TEMP/corpus"
          for rev in 6427879e1143026a12fb0388a20bdea1fe4b2bc5 ecec17211fcd3458e01ae808f86f9b6e019fa450; do
            "$root/compiler-$rev" --tier1 --tier1-report --lanes 1 -O2 -march=x86-64 -std=gnu17 -DSQLITE_ENABLE_FTS4 -I"$c/sqlite" -c "$c/sqlite/sqlite3.c" -o "$root/sqlite-$rev.o"
            objcopy -j .text -O binary "$root/sqlite-$rev.o" "$root/sqlite-$rev.text"
            wc -c "$root/sqlite-$rev.text"
            sha256sum "$root/sqlite-$rev.text" "$c/sqlite/sqlite3.c"
          done
          cmp -s "$root/sqlite-6427879e1143026a12fb0388a20bdea1fe4b2bc5.text" "$root/sqlite-ecec17211fcd3458e01ae808f86f9b6e019fa450.text" && echo "SQLite .text identical" || echo "SQLite .text differs"
