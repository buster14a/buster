name: Merge conflict preflight

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-conflict-preflight-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Preflight regression tests
    if: ${{ github.event_name == 'pull_request' && github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out candidate for unprivileged tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exercise merge-tree fixtures and workflow policy
        run: python3 -B tools/merge_conflict_preflight_test.py -v

  preflight:
    name: Exact merge-tree preflight
    if: ${{ github.event_name != 'pull_request' && github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target is intentional: this checks out and executes only
      # trusted current main. PR objects are fetched into private refs and are
      # consumed only by read-only git plumbing; candidate code is never run.
      - name: Check out trusted current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Analyze exact main/head identities
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/merge_conflict_preflight.py github-event
          --repo .
          --event-path "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --report-dir evidence/merge-conflict-preflight
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Retain exact machine-readable reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merge-conflict-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/merge-conflict-preflight/*.json
          if-no-files-found: ignore
          retention-days: 14
