name: Merge conflict preflight

on:
  workflow_run:
    workflows: [Merge conflict preflight regression]
    types: [completed]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# Candidate and workflow-run inputs retain ordinary cancellation. Main pushes
# use exact-SHA groups so GitHub cannot cancel or replace an older pending run.
# The push-only helper orders publication through the Actions API.
# See docs/main-push-maintenance.md for the ordering and failure contract.
concurrency:
  group: merge-conflict-preflight-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.event.workflow_run.id || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  preflight:
    name: Exact merge-tree preflight
    # GitHub can finish a PR regression run after its PR merges and omit its
    # association. Such a run has no candidate to attest; the parser remains
    # strict for every associated workflow_run that reaches the job.
    if: >-
      ${{ github.server_url == 'https://github.com' &&
          vars.GH_ACTIONS_CI_ENABLED == 'true' &&
          (github.event_name != 'workflow_run' || github.event.workflow_run.pull_requests[0]) }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'merge_group' && 310 || 20 }}
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@6f2ab3357f1e0f359fbf9f40621906171c026283
        with:
          requested-runner: >-
            ubuntu-latest
      # Push maintenance executes its exact event revision. Every other route
      # retains the independently trusted current-main checkout. The exclusive
      # steps implement: github.event_name == 'push' && github.sha || github.event.repository.default_branch
      - name: Check out exact pushed maintenance authority
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record actual checkout identity
        if: ${{ github.event_name == 'push' }}
        uses: buster14a/buster/.github/actions/machine-specifications@6f2ab3357f1e0f359fbf9f40621906171c026283
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Check out trusted current main
        if: ${{ github.event_name != 'push' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record actual checkout identity 2
        if: ${{ github.event_name != 'push' }}
        uses: buster14a/buster/.github/actions/machine-specifications@6f2ab3357f1e0f359fbf9f40621906171c026283
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Refresh default-branch pull-request snapshot after main push
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/main_push_maintenance.py refresh-merge-conflicts
          --repo .
          --event-path "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --event-main "$GITHUB_SHA"
          --workflow "merge-conflict-preflight.yml"
          --run-number "$GITHUB_RUN_NUMBER"
          --predecessor-job "Exact merge-tree preflight"
          --wait-seconds 600
          --report-dir evidence/merge-conflict-preflight
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Refresh default-branch pull-request snapshot manually
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/merge_conflict_preflight_refresh.py
          --repo .
          --event-path "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --report-dir evidence/merge-conflict-preflight
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Wait for the exact queued predecessor
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/merge_queue_admission.py wait-base
          --repo-root . --trusted-root .
          --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY"
          --sha "$GITHUB_SHA" --wait-seconds 18000
      - name: Analyze exact main/head identities
        if: ${{ github.event_name != 'push' && github.event_name != 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/merge_conflict_preflight.py github-event
          --repo .
          --event-path "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --report-dir evidence/merge-conflict-preflight
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Retain exact machine-readable reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merge-conflict-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/merge-conflict-preflight/**/*.json
          if-no-files-found: ignore
          retention-days: 14
