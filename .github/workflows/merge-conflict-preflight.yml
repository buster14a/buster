name: Merge conflict preflight

on:
  workflow_run:
    workflows: [Merge conflict preflight regression]
    types: [completed]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-conflict-preflight-${{ github.event_name }}-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Exact merge-tree preflight
    # GitHub can finish a PR regression run after its PR merges and omit its
    # association. Such a run has no candidate to attest; the parser remains
    # strict for every associated workflow_run that reaches the job.
    if: >-
      ${{ github.server_url == 'https://github.com' &&
          vars.GH_ACTIONS_CI_ENABLED == 'true' &&
          (github.event_name != 'workflow_run' || github.event.workflow_run.pull_requests[0]) }}
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # All routes execute trusted current-main code. Candidate objects are
      # fetched only into private refs and consumed by read-only git plumbing.
      - name: Check out trusted current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh default-branch pull-request snapshot
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/merge_conflict_preflight_refresh.py
          --repo .
          --event-path "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --report-dir evidence/merge-conflict-preflight
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Analyze exact main/head identities
        if: ${{ github.event_name != 'push' && github.event_name != 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/merge_conflict_preflight.py github-event
          --repo .
          --event-path "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --report-dir evidence/merge-conflict-preflight
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Retain exact machine-readable reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merge-conflict-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/merge-conflict-preflight/*.json
          if-no-files-found: ignore
          retention-days: 14
