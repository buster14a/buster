name: Summarize issue 183 diagnostics

on:
  push:
    branches:
      - fix/183-gnu17-enum-types
    paths:
      - .github/workflows/issue-183-summarize.yml

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Extract failures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/issue-183-test.log')
          lines = path.read_text(errors='replace').splitlines()
          patterns = [
              re.compile(r'failed=[1-9][0-9]*', re.I),
              re.compile(r'status=(?:fail|failed|error)', re.I),
              re.compile(r'\b(?:assert(?:ion)?|fatal|failure|failed|error|panic)\b', re.I),
              re.compile(r'^full_suite='),
          ]
          selected = []
          for index, line in enumerate(lines):
              if any(pattern.search(line) for pattern in patterns):
                  start = max(0, index - 3)
                  end = min(len(lines), index + 4)
                  selected.append((start, end))
          merged = []
          for start, end in sorted(selected):
              if merged and start <= merged[-1][1]:
                  merged[-1] = (merged[-1][0], max(merged[-1][1], end))
              else:
                  merged.append((start, end))
          out = [f'line_count={len(lines)}\n']
          for start, end in merged:
              out.append(f'@@ {start + 1}-{end} @@\n')
              out.extend(f'{i + 1}: {lines[i]}\n' for i in range(start, end))
          out.append('\n@@ final-200 @@\n')
          start = max(0, len(lines) - 200)
          out.extend(f'{i + 1}: {lines[i]}\n' for i in range(start, len(lines)))
          Path('.github/issue-183-test-summary.txt').write_text(''.join(out))
          PY
      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/issue-183-test-summary.txt
          git commit -m 'chore: summarize issue 183 candidate failures'
          git push origin HEAD:${GITHUB_REF_NAME}
