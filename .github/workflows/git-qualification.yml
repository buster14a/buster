name: Git source-only diagnostic
# Separate explicitly requested source-only diagnostic; no PR/main/queue trigger.
on:
  workflow_dispatch:
  push:
    branches: [codex/3180-git-source-only-diagnostic]
    paths: ['.github/workflows/git-qualification.yml']
permissions:
  contents: read
concurrency:
  group: git-source-only-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native-controls:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ubuntu-26.04
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Clang and GCC native controls
        run: |
          clang -std=c11 -Wall -Wextra -Werror -Wno-unused-function -fwrapv -fno-strict-aliasing -funsigned-char tools/git_qualification.c -o "$RUNNER_TEMP/git-controls-clang"
          "$RUNNER_TEMP/git-controls-clang" --self-test
          gcc -std=c11 -Wall -Wextra -Werror -Wno-unused-function -fwrapv -fno-strict-aliasing -funsigned-char tools/git_qualification.c -o "$RUNNER_TEMP/git-controls-gcc"
          "$RUNNER_TEMP/git-controls-gcc" --self-test
  local-operations:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ubuntu-26.04
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record candidate identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: git/git
          ref: c44beea485f0f2feaf460e2ac87fdd5608d63cf0
          path: external/git
          persist-credentials: false
      - name: Record actual upstream identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: external/git
          source-repository: git/git
      - name: Platform prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev
      - name: License intake
        run: |
          mkdir -p "$RUNNER_TEMP/git-qualification/licenses"
          cp external/git/COPYING external/git/sha1dc/LICENSE.txt external/git/reftable/LICENSE "$RUNNER_TEMP/git-qualification/licenses/"
          cp /usr/share/doc/zlib1g/copyright "$RUNNER_TEMP/git-qualification/licenses/zlib-copyright"
          cp /usr/share/doc/libc6/copyright "$RUNNER_TEMP/git-qualification/licenses/glibc-copyright"
          cat external/git/t/unit-tests/clar/COPYING
          head -30 external/git/xdiff/xdiff.h
          sha256sum "$RUNNER_TEMP/git-qualification/licenses/"*
      - name: Native harness controls and hosted bootstrap
        run: |
          clang -std=c11 -Wall -Wextra -Werror -Wno-unused-function -fwrapv -fno-strict-aliasing -funsigned-char tools/git_qualification.c -o "$RUNNER_TEMP/git-qualification-cc"
          "$RUNNER_TEMP/git-qualification-cc" --self-test
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/git-qualification-driver"
      - name: Configure trusted compiler
        run: |
          "$RUNNER_TEMP/git-qualification-driver" generate --cc clang --ci --linker DEFAULT
      - name: Build trusted compiler
        run: |
          "$RUNNER_TEMP/git-qualification-driver" build --config Release -t ide -- -j2
      - name: Explicit source-only census with depfile qualification excluded
        run: |
          "$RUNNER_TEMP/git-qualification-cc" --run "$GITHUB_WORKSPACE/external/git" "$GITHUB_WORKSPACE/build/Release/ide" "$(command -v clang)" "$RUNNER_TEMP/git-qualification"
      - name: Retain machine records
        if: always()
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: retain
          retention-directory: ${{ runner.temp }}/git-qualification
      - name: Retain exact-source census including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: git-source-only-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/git-qualification/*.log
            ${{ runner.temp }}/git-qualification/*.tsv
            ${{ runner.temp }}/git-qualification/licenses
            ${{ runner.temp }}/git-qualification/machine-specifications
            ${{ runner.temp }}/git-qualification/*-actions
            ${{ runner.temp }}/git-qualification/*/.depend
            ${{ runner.temp }}/git-qualification/*/GIT-BUILD-OPTIONS
            ${{ runner.temp }}/git-qualification/*/GIT-CFLAGS
            ${{ runner.temp }}/git-qualification/*/t/test-results
            build/compile_commands.json
            build/CMakeCache.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
