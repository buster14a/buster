name: Weak-binding boundary probe (research only)

on:
  push:
    branches: [research/20260925-weak-binding-boundary-ade6ac4]

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ade6ac4b6ecb21f30b61b656439bac476c145e2f
          persist-credentials: false
      - name: Pin source and record tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/weak-boundary-evidence"
          exec > >(tee "$RUNNER_TEMP/weak-boundary-evidence/provenance.txt") 2>&1
          test "$(git rev-parse HEAD)" = ade6ac4b6ecb21f30b61b656439bac476c145e2f
          test "$(git rev-parse 'HEAD^{tree}')" = 4c5306221fdb22fccc929b55e333163742de17d0
          git rev-parse HEAD 'HEAD^{tree}'
          printf 'workflow_commit=%s run_id=%s attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          uname -a
          command -v clang
          clang --version
          ld.bfd --version
          as --version
          readelf --version
          if command -v ld.lld; then ld.lld --version; else echo 'LLD_UNAVAILABLE'; fi
      - name: Build pinned compiler through native build driver
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/weak-boundary-evidence/build.log") 2>&1
          mkdir -p .cache/weak-boundary-probe
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char -g build.c -o .cache/weak-boundary-probe/build
          .cache/weak-boundary-probe/build generate --ci --linker DEFAULT --build-directory build-weak-boundary -- -DBUSTER_INCLUDE_TESTS=OFF -DBUSTER_UNITY_BUILD=OFF
          .cache/weak-boundary-probe/build build --config Release --build-directory build-weak-boundary -t ide
          sha256sum .cache/weak-boundary-probe/build build-weak-boundary/Release/ide > "$RUNNER_TEMP/weak-boundary-evidence/compiler.sha256"
      - name: Cross independent assemblers and linkers; check failure publication
        shell: bash
        run: |
          set -euo pipefail
          IDE="$GITHUB_WORKSPACE/build-weak-boundary/Release/ide"
          OUT="$RUNNER_TEMP/weak-boundary-evidence"
          cd "$OUT"
          exec > >(tee transcript.log) 2>&1
          cat > weak.s <<'ASM'
          .intel_syntax noprefix
          .text
          .weak chosen
          .type chosen, @function
          chosen:
              mov eax, 11
              ret
          .globl via_call
          .type via_call, @function
          via_call:
              sub rsp, 8
              call chosen
              add rsp, 8
              ret
          .globl via_address
          .type via_address, @function
          via_address:
              lea rax, [rip + chosen]
              ret
          ASM
          cat > strong.c <<'C'
          int chosen(void)
          {
              return 29;
          }
          C
          cat > main.c <<'C'
          extern int printf(char const *, ...);
          typedef int (*ChosenFunction)(void);
          extern int chosen(void);
          extern int via_call(void);
          extern ChosenFunction via_address(void);
          #ifndef EXPECT_VIA
          #define EXPECT_VIA 29
          #endif
          #ifndef EXPECT_SAME
          #define EXPECT_SAME 1
          #endif
          int main(void)
          {
              int direct = chosen();
              int wrapped = via_call();
              ChosenFunction pointer = via_address();
              int pointed = pointer();
              int same = pointer == chosen;
              printf("direct=%d via_call=%d pointed=%d same_address=%d\n", direct, wrapped, pointed, same);
              return direct != 29 || wrapped != EXPECT_VIA || pointed != EXPECT_VIA || same != EXPECT_SAME;
          }
          C
          sed '/^\.globl via_call/i .section .text.wrapper,"ax",@progbits' weak.s > cross-section.s
          sed '/^\.weak chosen$/d' weak.s > local.s
          failures=0
          run_record() {
            local label="$1"
            shift
            printf '%q ' "$@" > "$label.command"
            printf '\n' >> "$label.command"
            set +e
            timeout 60 "$@" > "$label.stdout" 2> "$label.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" > "$label.status"
            printf 'COMMAND %s status=%s\n' "$label" "$status"
            cat "$label.stdout" "$label.stderr"
          }
          require_success() {
            run_record "$@"
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          }
          require_success host-strong clang -g0 -O0 -fno-pie -c strong.c -o strong.o
          require_success host-main clang -g0 -O0 -fno-pie -c main.c -o main.o
          require_success host-local-main clang -g0 -O0 -fno-pie -DEXPECT_VIA=11 -DEXPECT_SAME=0 -c main.c -o local-main.o
          require_success buster-assemble "$IDE" cc -target x86_64-unknown-linux -c weak.s -o buster.o
          require_success gnu-assemble as --64 weak.s -o gnu.o
          require_success llvm-assemble clang -target x86_64-unknown-linux -c weak.s -o llvm.o
          for producer in buster gnu llvm; do
            require_success "$producer-inspect" readelf -W -h -S -s -r "$producer.o"
            require_success "$producer-disassemble" objdump -drwC -Mintel "$producer.o"
            require_success "$producer-bfd-link" clang -fuse-ld=bfd -no-pie "$producer.o" strong.o main.o -o "$producer-bfd"
            if [ -f "$producer-bfd" ]; then require_success "$producer-bfd-run" "./$producer-bfd"; fi
            if command -v ld.lld >/dev/null; then
              require_success "$producer-lld-link" clang -fuse-ld=lld -no-pie "$producer.o" strong.o main.o -o "$producer-lld"
              if [ -f "$producer-lld" ]; then require_success "$producer-lld-run" "./$producer-lld"; fi
            fi
            require_success "$producer-buster-link" "$IDE" cc "$producer.o" strong.o main.o -o "$producer-buster"
            if [ -f "$producer-buster" ]; then require_success "$producer-buster-run" "./$producer-buster"; fi
          done
          require_success buster-reverse-link "$IDE" cc strong.o buster.o main.o -o buster-reverse
          if [ -f buster-reverse ]; then require_success buster-reverse-run ./buster-reverse; fi
          for mode in none mir-stack fast quality; do
            require_success "combined-$mode-link" "$IDE" cc "-fregister-allocator=$mode" weak.s strong.c main.c -o "combined-$mode"
            if [ -f "combined-$mode" ]; then require_success "combined-$mode-run" "./combined-$mode"; fi
          done
          for shape in cross-section local; do
            require_success "$shape-assemble" "$IDE" cc -target x86_64-unknown-linux -c "$shape.s" -o "$shape.o"
            require_success "$shape-inspect" readelf -W -s -r "$shape.o"
            consumer=main.o
            if [ "$shape" = local ]; then consumer=local-main.o; fi
            require_success "$shape-bfd-link" clang -fuse-ld=bfd -no-pie "$shape.o" strong.o "$consumer" -o "$shape-bfd"
            if [ -f "$shape-bfd" ]; then require_success "$shape-bfd-run" "./$shape-bfd"; fi
            require_success "$shape-buster-link" "$IDE" cc "$shape.o" strong.o "$consumer" -o "$shape-buster"
            if [ -f "$shape-buster" ]; then require_success "$shape-buster-run" "./$shape-buster"; fi
          done
          cp buster.o preserved.o
          sha256sum preserved.o > preserved.before.sha256
          printf '.this_directive_is_not_supported\n' > rejected.s
          run_record rejected-source "$IDE" cc -c rejected.s -o preserved.o
          test "$status" -ne 0 || failures=$((failures + 1))
          sha256sum -c preserved.before.sha256 || failures=$((failures + 1))
          mkdir output-is-directory
          run_record write-failure "$IDE" cc -c weak.s -o output-is-directory
          test "$status" -ne 0 || failures=$((failures + 1))
          test -d output-is-directory || failures=$((failures + 1))
          test -z "$(find output-is-directory -mindepth 1 -print -quit)" || failures=$((failures + 1))
          sha256sum ./*.s ./*.c ./*.o > inputs-and-objects.sha256
          printf 'CORRECTNESS_FAILURE_COUNT=%s\n' "$failures" | tee result.txt
          # This is a correctness probe: nonzero runtime results remain failures.
          test "$failures" -eq 0
      - name: Retain every attempted command and artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: weak-binding-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weak-boundary-evidence
          if-no-files-found: error
          retention-days: 14
