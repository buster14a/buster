name: Issue 1123 isolated workbench
on:
  push:
    branches: [agent/1123-linker-options-workbench]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Verify and publish the original source patch
        run: |
          base64 -d .issue-1123.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/issue1123.patch"
          printf '%s  %s\n' d6cdd1359d0f0beee51e79a47893b99fc74c387fc7894aede75c7891ebad796d "$RUNNER_TEMP/issue1123.patch" | sha256sum --check
          git fetch origin df007cd52c074223cfa6deddb14b058714c0ed53
          git switch --detach df007cd52c074223cfa6deddb14b058714c0ed53
          git switch -c agent/1123-linker-options
          git apply --check "$RUNNER_TEMP/issue1123.patch"
          git apply "$RUNNER_TEMP/issue1123.patch"
          git diff --check
          git add src/buster/compiler
          git config user.name 'OpenAI agent'
          git config user.email 'agent@openai.com'
          git commit -m 'fix(driver): honor forwarded linker options and emit runtime paths' -m 'Fixes #1123. Preserve ordered -Wl/-Xlinker arguments, support shared runtime paths and entry selection, retain no-as-needed DSOs, and refuse unsupported linker requests before output publication.' -m 'Agent session: current ChatGPT conversation; this environment exposes no session ID or private permalink.' -m 'Model: OpenAI / GPT-6 Astra Pro'
          git push origin HEAD:refs/heads/agent/1123-linker-options
          git rev-parse HEAD
