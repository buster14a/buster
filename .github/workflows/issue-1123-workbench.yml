name: Issue 1123 isolated workbench
on:
  push:
    branches: [agent/1123-linker-options-workbench]
permissions:
  contents: write
jobs:
  focused:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: 0
      BUSTER_ORACLE_CACHE: check
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Apply verified cleanup and publish source-only follow-up
        run: |
          printf '%s' '' | base64 -d | gzip -d > "$RUNNER_TEMP/cleanup.patch"
          printf '%s  %s\n' c6ab5131ceac59995a35cbbae8fcf7d1eabb39766ef25148dbeb3f716ee6c14f "$RUNNER_TEMP/cleanup.patch" | sha256sum --check
          git fetch origin fab0aed3f7c1f1c7c0521bc27f117e81b566aea5
          git switch --detach fab0aed3f7c1f1c7c0521bc27f117e81b566aea5
          git apply --check "$RUNNER_TEMP/cleanup.patch"
          git apply "$RUNNER_TEMP/cleanup.patch"
          git diff --check
          git add docs/foreign-driver.md src/buster/compiler/foreign_driver.c src/buster/compiler/linker_options.c
          git config user.name 'OpenAI agent'
          git config user.email 'agent@openai.com'
          git commit -m 'refactor(driver): keep shared linker option parsing in one place' -m 'Document runtime search paths and remove the foreign driver branches now handled by the shared parser.' -m 'Agent session: current ChatGPT conversation; no private permalink or session ID is exposed.' -m 'Model: OpenAI / GPT-6 Astra Pro'
          git push origin HEAD:refs/heads/agent/1123-linker-options
          git rev-parse HEAD
      - name: Install official toolchain and test dependencies
        run: bash tools/ci/setup-hosted.sh
      - name: Build compiler
        run: ./build.sh
      - name: Validate compiler driver regressions
        run: ./build/compiler test-checker-driver --executable ./build/compiler 2>&1 | tee "$RUNNER_TEMP/issue1123-driver.log"
      - name: Validate foreign linker regressions
        if: always() && steps.build.outcome != 'failure'
        run: ./build/compiler test-foreign --functions 1 2>&1 | tee "$RUNNER_TEMP/issue1123-foreign.log"
      - name: Preserve focused validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue1123-focused-validation
          path: ${{ runner.temp }}/issue1123-*.log
          retention-days: 3
