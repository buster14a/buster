name: Z05 literal engineering

on:
  push:
    branches: [astra/z05-literals-20260910-transport]
    paths: [.github/workflows/z05-literal-engineering.yml]

permissions:
  contents: read

concurrency:
  group: z05-literal-engineering-${{ github.run_id }}
  cancel-in-progress: false

env:
  BUSTER_TEST_JOBS: '1'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  Z05_BASE: ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
  Z05_HEAD: 5f21adb57917ca726b3d443dbd2dc8d7de8bd447

jobs:
  audits:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 5f21adb57917ca726b3d443dbd2dc8d7de8bd447
          fetch-depth: 0
          persist-credentials: false
      - name: Check both audit corpora and retain every failure
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/z05-audits"
          mkdir -p "$out"
          git worktree add --detach "$RUNNER_TEMP/z05-base" "$Z05_BASE"
          root="$PWD"
          status=0
          for variant in base head; do
            if [[ "$variant" == base ]]; then cd "$RUNNER_TEMP/z05-base"; else cd "$root"; fi
            { git rev-parse HEAD; git ls-tree HEAD tools/new_audit.py docs/performance-audits/2026-08-24T131821Z.md; sha256sum tools/new_audit.py docs/performance-audits/2026-08-24T131821Z.md; } > "$out/$variant.provenance"
            if python3 tools/new_audit.py --check > "$out/$variant.check.log" 2>&1; then
              printf 'passed\n' > "$out/$variant.status"
            else
              code=$?
              printf 'failed exit %s\n' "$code" > "$out/$variant.status"
              status=1
            fi
            cat "$out/$variant.provenance" "$out/$variant.check.log" "$out/$variant.status"
          done
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: z05-audit-status-${{ github.run_id }}
          path: ${{ runner.temp }}/z05-audits
          if-no-files-found: error
          retention-days: 7
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 5f21adb57917ca726b3d443dbd2dc8d7de8bd447
          persist-credentials: false
      - name: Exact submitted source and environment
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/z05-validation"
          mkdir -p "$out"
          exec > >(tee "$out/provenance.log") 2>&1
          test "$(git rev-parse HEAD)" = "$Z05_HEAD"
          git rev-parse HEAD HEAD^{tree}
          test "$(git hash-object src/buster/lib/compiler/frontend/c/c_gen.c)" = 0ce05c2469d4adbc5294667e783335633808fc16
          test "$(git hash-object src/buster/tests/compiler/frontend/c/c_test.c)" = 155ef1d927eba6912268c1ade6f4c74e3ab97d01
          git diff --exit-code
          clang --version
          gcc --version
          uname -a
          lscpu
          free -b
      - name: Build and run all registered Release tests
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/z05-validation"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o "$RUNNER_TEMP/z05-build"
          "$RUNNER_TEMP/z05-build" generate --cc clang --ci --linker DEFAULT -- -DBUSTER_UNITY_BUILD=OFF 2>&1 | tee "$out/configure.log"
          "$RUNNER_TEMP/z05-build" build --config Release -t test_all -- -j2 2>&1 | tee "$out/test-all.log"
          cp build/CMakeCache.txt "$out/CMakeCache.txt"
          objdump -d --disassemble=c_ir_decode_string_literal_range_for_target build/Release/ide > "$out/candidate-range.asm"
          size -A build/Release/ide > "$out/candidate-sections.txt"
      - name: Native none, mir-stack, fast and quality mode matrix
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/z05-build" test_mode_matrix --config Release 2>&1 | tee "$RUNNER_TEMP/z05-validation/mode-matrix.log"
      - name: Ordinary self-host and strengthened bootstrap audit
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/z05-build" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/z05-validation/self-host.log"
          "$RUNNER_TEMP/z05-build" test_self_host_audit --config Release 2>&1 | tee "$RUNNER_TEMP/z05-validation/self-host-audit.log"
      - name: Independent GNU C23 controls and all four Buster modes
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/z05-validation"
          exec > >(tee "$out/independent-controls.log") 2>&1
          set -x
          for source in tests/basic_c_string_concat.c tests/basic_c_nested_string_initializers.c tests/basic_c_plain_char_literal_sign.c tests/basic_c_float_literal.c tests/basic_c_static_float_literal.c; do
            for cc in clang gcc; do
              "$cc" -std=gnu2x -O0 -funsigned-char -fwrapv -fno-strict-aliasing "$source" -o "$out/control"
              "$out/control"
            done
            for mode in none mir-stack fast quality; do
              build/Release/ide cc -std=gnu2x -O0 -funsigned-char -fwrapv -fno-strict-aliasing -fregister-allocator="$mode" "$source" -o "$out/control"
              "$out/control"
            done
          done
          test "$(git rev-parse HEAD)" = "$Z05_HEAD"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: z05-compiler-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/z05-validation
            build/self-host-audit
          if-no-files-found: error
          retention-days: 7
