name: Native retirement evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/native-retirement-evidence.yml
      - docs/performance-audits/evidence/2026-09-12-retirement/**
  workflow_dispatch:


concurrency:
  group: retirement-evidence-with-strict-v3-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # PRs validate GitHub's exact integration commit. A manual run validates the
  # exact revision selected in the workflow-dispatch UI.
  BUSTER_RETIREMENT_CANDIDATE: ${{ github.sha }}

jobs:
  census:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Frozen compiler pair and complete census
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Check out evidence validation scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.BUSTER_RETIREMENT_CANDIDATE }}
          path: validation
          persist-credentials: false
      - name: Check out candidate implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.BUSTER_RETIREMENT_CANDIDATE }}
          path: candidate
          persist-credentials: false
      - name: Check out archived direct source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3e912a3c5ce9b3e905f3096ff0a0d3e68d80e46e
          path: reference
          persist-credentials: false
      - name: Bootstrap candidate build driver
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "$BUSTER_RETIREMENT_CANDIDATE"
          printf 'candidate_commit=%s\ncandidate_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" > evidence-candidate.txt
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/candidate-build"
      - name: Build candidate with hosted Clang exception
        working-directory: candidate
        run: |
          "$RUNNER_TEMP/candidate-build" generate --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/candidate-build" build --config Release -t ide
      - name: Bootstrap archived build driver
        working-directory: reference
        run: clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/reference-build"
      - name: Rebuild archived direct reference
        working-directory: reference
        run: |
          "$RUNNER_TEMP/reference-build" generate --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/reference-build" build --config Release -t ide
      - name: Validate census harness
        working-directory: candidate
        run: '"$RUNNER_TEMP/candidate-build" native_retirement_census --self-test'
      - name: Freeze manifest before execution
        id: frozen_manifest
        working-directory: candidate
        run: >-
          "$RUNNER_TEMP/candidate-build" native_retirement_census
          --ide build/Release/ide
          --compiler-revision "$BUSTER_RETIREMENT_CANDIDATE"
          --baseline-ide ../reference/build/Release/ide
          --baseline-revision 3e912a3c5ce9b3e905f3096ff0a0d3e68d80e46e
          --manifest-only --out evidence/manifest
      - name: Execute complete assigned shard 0
        continue-on-error: true
        if: ${{ !cancelled() && steps.frozen_manifest.outcome == 'success' }}
        working-directory: candidate
        run: >-
          "$RUNNER_TEMP/candidate-build" native_retirement_census
          --ide build/Release/ide
          --compiler-revision "$BUSTER_RETIREMENT_CANDIDATE"
          --baseline-ide ../reference/build/Release/ide
          --baseline-revision 3e912a3c5ce9b3e905f3096ff0a0d3e68d80e46e
          --shard-index 0 --shard-count 4
          --resource-include "$(clang -print-resource-dir)/include"
          --out evidence/census-integrated-0
      - name: Execute complete assigned shard 1
        continue-on-error: true
        if: ${{ !cancelled() && steps.frozen_manifest.outcome == 'success' }}
        working-directory: candidate
        run: >-
          "$RUNNER_TEMP/candidate-build" native_retirement_census
          --ide build/Release/ide
          --compiler-revision "$BUSTER_RETIREMENT_CANDIDATE"
          --baseline-ide ../reference/build/Release/ide
          --baseline-revision 3e912a3c5ce9b3e905f3096ff0a0d3e68d80e46e
          --shard-index 1 --shard-count 4
          --resource-include "$(clang -print-resource-dir)/include"
          --out evidence/census-integrated-1
      - name: Execute complete assigned shard 2
        continue-on-error: true
        if: ${{ !cancelled() && steps.frozen_manifest.outcome == 'success' }}
        working-directory: candidate
        run: >-
          "$RUNNER_TEMP/candidate-build" native_retirement_census
          --ide build/Release/ide
          --compiler-revision "$BUSTER_RETIREMENT_CANDIDATE"
          --baseline-ide ../reference/build/Release/ide
          --baseline-revision 3e912a3c5ce9b3e905f3096ff0a0d3e68d80e46e
          --shard-index 2 --shard-count 4
          --resource-include "$(clang -print-resource-dir)/include"
          --out evidence/census-integrated-2
      - name: Execute complete assigned shard 3
        continue-on-error: true
        if: ${{ !cancelled() && steps.frozen_manifest.outcome == 'success' }}
        working-directory: candidate
        run: >-
          "$RUNNER_TEMP/candidate-build" native_retirement_census
          --ide build/Release/ide
          --compiler-revision "$BUSTER_RETIREMENT_CANDIDATE"
          --baseline-ide ../reference/build/Release/ide
          --baseline-revision 3e912a3c5ce9b3e905f3096ff0a0d3e68d80e46e
          --shard-index 3 --shard-count 4
          --resource-include "$(clang -print-resource-dir)/include"
          --out evidence/census-integrated-3
      - name: Join and independently validate every census row
        if: ${{ !cancelled() && steps.frozen_manifest.outcome == 'success' }}
        working-directory: candidate
        run: |
          cp ../validation/docs/performance-audits/evidence/2026-09-12-retirement/join-census.py evidence/
          cp ../validation/docs/performance-audits/evidence/2026-09-12-retirement/validate-census-v2.py evidence/
          clang -O2 -fPIC -shared -Isrc src/buster/lib/hash.c -o evidence/libcensus_hash.so
          python3 "$PWD/evidence/join-census.py" census-integrated 4
          python3 "$PWD/evidence/validate-census-v2.py" census-integrated 4
      - name: Retain raw evidence and build recipes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-retirement-${{ env.BUSTER_RETIREMENT_CANDIDATE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/evidence/
            candidate/evidence-candidate.txt
            candidate/build/CMakeCache.txt
            candidate/build/compile_commands.json
            reference/build/CMakeCache.txt
            reference/build/compile_commands.json
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

  strict_differential:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Strict MIR differential (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64 native
            runner: ubuntu-26.04
            slug: linux-x86_64
            platform: unix
            python: python3
            sanitizer: required
            sanitizer_reason: available
          - name: Linux AArch64 native
            runner: ubuntu-26.04-arm
            slug: linux-aarch64
            platform: unix
            python: python3
            sanitizer: required
            sanitizer_reason: available
          - name: macOS x86-64 native
            runner: macos-26-intel
            slug: macos-x86_64
            platform: unix
            python: python3
            sanitizer: required
            sanitizer_reason: available
          - name: macOS AArch64 native
            runner: macos-26
            slug: macos-aarch64
            platform: unix
            python: python3
            sanitizer: required
            sanitizer_reason: available
          - name: Windows x86-64 native
            runner: windows-2025
            slug: windows-x86_64
            platform: windows
            python: python
            vs_arch: amd64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
            clang_arch: x86_64
            sanitizer: required
            sanitizer_reason: available-after-resource-runtime-path
          - name: Windows AArch64 native
            runner: windows-11-arm
            slug: windows-aarch64
            platform: windows
            python: python
            vs_arch: arm64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
            clang_arch: aarch64
            sanitizer: not-run
            sanitizer_reason: runner-llvm-package-omits-aarch64-asan-runtime
    steps:
      - name: Check out exact implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.BUSTER_RETIREMENT_CANDIDATE }}
          persist-credentials: false
      - name: Build and freeze hosted Clang compiler
        id: strict_build_unix
        if: ${{ matrix.platform == 'unix' }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$BUSTER_RETIREMENT_CANDIDATE"
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/strict-build"
          "$RUNNER_TEMP/strict-build" generate --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/strict-build" build --config Release -t ide
          mkdir -p evidence/strict-binary
          cp build/Release/ide evidence/strict-binary/ide
          chmod 555 evidence/strict-binary/ide
          printf 'candidate_commit=%s\ncandidate_tree=%s\nrunner=%s\noracle_sanitizer=%s\noracle_sanitizer_reason=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "${{ matrix.runner }}" \
            "${{ matrix.sanitizer }}" "${{ matrix.sanitizer_reason }}" \
            > evidence/strict-binary/source.txt
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum evidence/strict-binary/ide > evidence/strict-binary/sha256.txt
          else
            shasum -a 256 evidence/strict-binary/ide > evidence/strict-binary/sha256.txt
          fi
          cp build/CMakeCache.txt build/compile_commands.json evidence/strict-binary/
      - name: Validate differential harness
        id: strict_self_test_unix
        if: ${{ matrix.platform == 'unix' }}
        shell: bash
        run: '"$RUNNER_TEMP/strict-build" test_differential --self-test'
      - name: Execute every strict configuration with sanitizer enabled
        id: strict_execute_unix
        if: ${{ matrix.platform == 'unix' }}
        shell: bash
        run: >-
          "$RUNNER_TEMP/strict-build" test_differential
          --ide "$PWD/evidence/strict-binary/ide" --cc clang
          --strict-mir --sanitize-oracle --out evidence/strict-differential
      - name: Build and execute strict Windows acceptance
        id: strict_windows
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        env:
          VS_ARCH: ${{ matrix.vs_arch }}
          VS_COMPONENT: ${{ matrix.vs_component }}
          CLANG_ARCH: ${{ matrix.clang_arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPaths = @(& $VsWhere -latest -products * -requires $env:VS_COMPONENT -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw "Visual Studio with ${env:VS_COMPONENT} was not found" }
          & (Join-Path $VsPaths[0].Trim() 'Common7\Tools\Launch-VsDevShell.ps1') -Arch $env:VS_ARCH -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          $ClangVersion = (& clang --version) -join "`n"
          Write-Output $ClangVersion
          if ($ClangVersion -notmatch "Target:\s*${env:CLANG_ARCH}-") { throw "clang does not default to a ${env:CLANG_ARCH} target" }
          $Commit = (git rev-parse HEAD).Trim()
          if ($Commit -ne $env:BUSTER_RETIREMENT_CANDIDATE) { throw "candidate checkout identity mismatch" }
          $Tree = (git rev-parse 'HEAD^{tree}').Trim()
          $Driver = Join-Path $env:RUNNER_TEMP 'strict-build.exe'
          cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Driver generate --cc clang --ci --linker DEFAULT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Driver build --config Release -t ide
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path 'evidence\strict-binary' | Out-Null
          Copy-Item 'build\Release\ide.exe' 'evidence\strict-binary\ide.exe'
          @(
            "candidate_commit=$Commit"
            "candidate_tree=$Tree"
            "runner=${{ matrix.runner }}"
            "oracle_sanitizer=${{ matrix.sanitizer }}"
            "oracle_sanitizer_reason=${{ matrix.sanitizer_reason }}"
          ) |
            Set-Content -Encoding ascii 'evidence\strict-binary\source.txt'
          $Digest = (Get-FileHash -Algorithm SHA256 'evidence\strict-binary\ide.exe').Hash.ToLowerInvariant()
          "$Digest  evidence/strict-binary/ide.exe" | Set-Content -Encoding ascii 'evidence\strict-binary\sha256.txt'
          Copy-Item 'build\CMakeCache.txt', 'build\compile_commands.json' 'evidence\strict-binary\'
          & $Driver test_differential --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $DifferentialArgs = @(
            'test_differential'
            '--ide', "$PWD\evidence\strict-binary\ide.exe"
            '--cc', 'clang.exe'
            '--strict-mir'
            '--out', 'evidence\strict-differential'
          )
          if ('${{ matrix.sanitizer }}' -eq 'required') {
            $ResourceDir = (& clang.exe -print-resource-dir).Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $RuntimeDlls = @(
              Get-ChildItem -Path $ResourceDir -Filter 'clang_rt.asan_dynamic-${{ matrix.clang_arch }}.dll' -File -Recurse |
                Sort-Object FullName
            )
            if ($RuntimeDlls.Count -ne 1) {
              throw "Expected exactly one matching Clang sanitizer runtime under ${ResourceDir}; found $($RuntimeDlls.Count)"
            }
            $RuntimeDll = $RuntimeDlls[0].FullName
            $RuntimeDir = Split-Path -Parent $RuntimeDll
            "oracle_sanitizer_runtime=$RuntimeDll" | Add-Content -Encoding ascii 'evidence\strict-binary\source.txt'
            $env:PATH = "$RuntimeDir;$env:PATH"
            $DifferentialArgs += '--sanitize-oracle'
          }
          & $Driver @DifferentialArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record strict outcome before packaging
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BUSTER_CI_STEPS: ${{ toJSON(steps) }}
          BUSTER_CI_REQUIRED: ${{ matrix.platform == 'windows' && 'strict_windows' || 'strict_build_unix strict_self_test_unix strict_execute_unix' }}
          BUSTER_CI_RUNNER: ${{ matrix.runner }}
          BUSTER_CI_REPRO: Check out ${{ env.BUSTER_RETIREMENT_CANDIDATE }} and run build.c test_differential with --strict-mir on an immutable Clang-built compiler on ${{ matrix.runner }}; oracle sanitizer status is ${{ matrix.sanitizer }} (${{ matrix.sanitizer_reason }}).
        run: '"${{ matrix.python }}" tools/ci_summary.py'
      - name: Bundle and verify full strict evidence
        id: strict_bundle
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cp "$RUNNER_TEMP/buster-ci/result.json" "$RUNNER_TEMP/buster-ci/summary.md" evidence/
          "${{ matrix.python }}" tools/ci_pack_evidence.py --source evidence --output "$RUNNER_TEMP/strict-upload"
      - name: Retain strict evidence
        if: ${{ !cancelled() && steps.strict_bundle.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strict-retirement-${{ env.BUSTER_RETIREMENT_CANDIDATE }}-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strict-upload/
          retention-days: 7
          if-no-files-found: error
      - name: Retain raw strict evidence after packaging failure
        if: ${{ !cancelled() && steps.strict_bundle.outcome != 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strict-retirement-${{ env.BUSTER_RETIREMENT_CANDIDATE }}-${{ matrix.slug }}-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error

  complete:
    if: ${{ always() && github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    name: Native retirement acceptance complete
    runs-on: ubuntu-26.04
    needs: [census, strict_differential]
    env:
      CENSUS_RESULT: ${{ needs.census.result }}
      STRICT_RESULT: ${{ needs.strict_differential.result }}
    steps:
      - name: Require census and every native strict result
        shell: bash
        run: |
          # Backticks delimit literal Markdown code in the summary.
          # shellcheck disable=SC2016
          printf '## Native retirement candidate `%s`\n\n' "$BUSTER_RETIREMENT_CANDIDATE" >> "$GITHUB_STEP_SUMMARY"
          printf '| Gate | Result |\n|---|---|\n| Census | %s |\n| Six-host strict native differential | %s |\n' \
            "$CENSUS_RESULT" "$STRICT_RESULT" >> "$GITHUB_STEP_SUMMARY"
          [[ "$CENSUS_RESULT" == success && "$STRICT_RESULT" == success ]]
