name: Issue 881 main worktree export

on:
  push:
    branches:
      - codex/881-current-main-export

permissions:
  contents: read

concurrency:
  group: issue-881-main-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Pack tracked source
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | tar --null --files-from=- -czf issue-881-main.tar.gz
          sha256sum issue-881-main.tar.gz > issue-881-main.tar.gz.sha256
      - name: Upload tracked source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-881-main-${{ github.sha }}
          path: |
            issue-881-main.tar.gz
            issue-881-main.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
