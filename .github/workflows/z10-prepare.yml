name: Z10 prepare focused source commit
on:
  push:
    branches: [astra/z10-transport-20260909]
    paths: [.github/workflows/z10-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: ${{ vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          persist-credentials: false
      - name: Create immutable product objects without updating any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version
          mkdir -p evidence
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          root = pathlib.Path.cwd()
          base = 'ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae'
          def run(args, **kw):
              p = subprocess.run(args, text=True, capture_output=True, **kw)
              if p.returncode:
                  print(p.stdout)
                  print(p.stderr)
                  raise SystemExit(p.returncode)
              return p.stdout.strip()
          def get_blob(sha):
              result = json.loads(run(['gh','api','repos/buster14a/buster/git/blobs/'+sha]))
              data = base64.b64decode(result['content'])
              assert hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest() == sha
              return data.decode()
          assert run(['git','rev-parse','HEAD']) == base
          assert run(['gh','api','repos/buster14a/buster/commits/main','--jq','.sha']) == base, 'main advanced; re-coordinate'
          files = ['src/buster/lib/compiler/codegen/machine_aarch64.c','src/buster/tests/compiler/codegen/machine_select_test.c']
          expected = ['7d08d43df8fc057c98e0951eab29326d301bdfe9','05c415cf472cf41b475b1c4068519e87dfce708d']
          for path, sha in zip(files, expected):
              assert run(['git','hash-object',path]) == sha, path
          path = pathlib.Path(files[0])
          text = path.read_text()
          start = text.index('        for (u32 instruction_index = 0;',text.index('        selector.direct_call_uses = arena_allocate'))
          end = text.index('        machine_stream_initialize(&selector.immediates',start)
          assert text[start:end].count('direct_call_uses') == 2
          text = text[:start]+text[end:]
          first = '                    value_last_use_ordinals[used] = walk_ordinal;'
          last = '                    if (!promotable_locals[used])'
          needle = first+'\n'+last
          lines = [
              '// Fold the existing direct-call projection into this operand',
              '// walk. Other uses are absorbing, so linked/storage order',
              '// cannot change the result. Do not skip the remaining facts.',
              'if (selector.direct_call_uses[used] != 2)',
              '{',
              '    bool direct = instruction->opcode == IR_OPCODE_CALL && operand_index == 0;',
              '    if (direct)',
              '    {',
              '        IrInstructionId definition = function->values[used].definition;',
              '        IrInstruction* reference = definition.value < function->instruction_count ? function->instructions + definition.value : 0;',
              '        direct = reference && reference->opcode == IR_OPCODE_FUNCTION && reference->symbol.value == instruction->symbol.value;',
              '    }',
              '    selector.direct_call_uses[used] = direct ? 1 : 2;',
              '}',
          ]
          replacement = first+'\n'+'\n'.join(' '*20+line for line in lines)+'\n'+last
          assert text.count(needle) == 1
          path.write_text(text.replace(needle,replacement))
          path = pathlib.Path(files[1])
          text = path.read_text()
          needle = 'UnitTestResult machine_selection_tests(UnitTestArguments* arguments)\n'
          assert text.count(needle) == 1
          text = text.replace(needle,get_blob('80599400220932eb15451a0db55b85e6ac61461f')+needle)
          needle = 'UnitTestResult machine_selection_tests(UnitTestArguments* arguments)\n{\n    UnitTestResult result = {0};'
          replacement = needle+'\n    UnitTestResult direct_call_result = machine_selection_test_direct_call_facts(arguments);\n    result.test_count += direct_call_result.test_count;\n    result.succeeded_test_count += direct_call_result.succeeded_test_count;'
          assert text.count(needle) == 1
          path.write_text(text.replace(needle,replacement))
          assert run(['git','hash-object',files[1]]) == '857aa17a3c083d8dd7b7cd0939641fff1fd8b5f6'
          audit = pathlib.Path(run(['python3','tools/new_audit.py','--platform','source audit; hardware measurements pending','isel: reuse AArch64 direct-call facts in the operand walk (#132)']))
          audit.write_text(audit.read_text()+get_blob('2201e0360650a3ebd3eeccf7e4002486a7b7fbaa'))
          files += ['PERFORMANCE_AUDITS.md',str(audit.relative_to(root))]
          run(['git','diff','--check'])
          def post(kind, data):
              return json.loads(run(['gh','api','--method','POST','repos/buster14a/buster/git/'+kind,'--input','-'],input=json.dumps(data)))
          entries = []
          hashes = {}
          for path in files:
              data = pathlib.Path(path).read_text()
              blob = post('blobs', {'content':data,'encoding':'utf-8'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
              hashes[path] = {'blob':blob['sha'],'sha256':hashlib.sha256(data.encode()).hexdigest()}
          tree = post('trees', {'base_tree':run(['git','rev-parse','HEAD^{tree}']),'tree':entries})
          commit = post('commits', {'message':'isel: fold AArch64 direct-call uses into the existing operand walk','tree':tree['sha'],'parents':[base]})
          (root/'evidence/commit.json').write_text(json.dumps({'sha':commit['sha'],'tree':tree['sha'],'base':base,'files':hashes},indent=2)+'\n')
          (root/'evidence/audit.md').write_text(audit.read_text())
          (root/'evidence/product.diff').write_text(run(['git','diff'])+'\n')
          print(json.dumps({'sha':commit['sha'],'tree':tree['sha'],'audit':audit.name}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: z10-source-publication-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
