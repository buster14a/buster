name: Assembly binding source validation 1223
on:
  push:
    branches: [codex/1223-assembly-binding-validation]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8520a574bc18870a598b4f7b1309c909fa56011f
          fetch-depth: 0
          persist-credentials: false
      - name: Source size and whitespace on final head
        run: |
          mkdir -p .cache/assembly-binding
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char -g build.c -o .cache/assembly-binding/build
          .cache/assembly-binding/build source_size --base adf3e62f9fa732186a14ad95d2a7d23ff7d04b61
          git diff --check adf3e62f9fa732186a14ad95d2a7d23ff7d04b61 HEAD
          git diff --exit-code 0a3554cf1cadb4fd6349da453a185f810723911c HEAD -- src/buster/lib
