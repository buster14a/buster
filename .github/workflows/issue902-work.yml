name: Issue 902 isolated work
on:
  push:
    branches: [work/902-enum-bitfields-runner]
    paths: [.github/workflows/issue902-work.yml]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cda5d974189383610096d534725c334fac4e198a
          fetch-depth: 3
          persist-credentials: false
      - name: Prepare exact candidate and frontend-only diagnostic dispatch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/evidence/candidate.sha"
          git diff 46ed5e141baed17dfc1e977691ac73e08be5b9f5 HEAD --binary > "$RUNNER_TEMP/evidence/validated.patch"
          echo '19e1a19707ea4566d32384ae9a5735fea608dbc47432f4d376c26bfc9d9ed6b2  '"$RUNNER_TEMP/evidence/validated.patch" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/buster/tests/test.c')
          s = p.read_text()
          old = 'buster_test_run_parallel_descriptors(arguments, test_descriptors, BUSTER_ARRAY_LENGTH(test_descriptors), timing_enabled, &timing_record_count)'
          assert s.count(old) == 1
          s = s.replace(old, 'buster_test_run_parallel_descriptors(arguments, test_descriptors + TEST_ID_C_FRONTEND, 1, timing_enabled, &timing_record_count)')
          s = s.replace('expected_timing_records += !test_descriptors[index].table_audit || buster_test_table_audits_enabled();', 'expected_timing_records += index == TEST_ID_C_FRONTEND;')
          p.write_text(s)
          PY
      - name: Build candidate with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/evidence/candidate-build.log") 2>&1
          clang --version
          gcc --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/driver"
          "$RUNNER_TEMP/driver" generate --cc clang --config Debug --linker DEFAULT -- -DBUSTER_UNITY_BUILD=OFF -DBUSTER_DEBUG_INFO=OFF
          "$RUNNER_TEMP/driver" build --config Debug -t ide
      - name: Candidate complete frontend suite
        shell: bash
        run: |
          set -euo pipefail
          BUSTER_TEST_JOBS=2 timeout 600 build/Debug/ide test --ci=1 > "$RUNNER_TEMP/evidence/candidate-frontend.log" 2>&1
          tail -n 5 "$RUNNER_TEMP/evidence/candidate-frontend.log"
      - name: Candidate Debug-seeded fixed point
        if: ${{ matrix.runner == 'ubuntu-26.04' }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/evidence/candidate-selfhost.log") 2>&1
          timeout 300 build/Debug/ide cc -Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -g src/buster/apps/ide/ide.c -lm -o "$RUNNER_TEMP/candidate-stage1"
          timeout 300 "$RUNNER_TEMP/candidate-stage1" cc -Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -g src/buster/apps/ide/ide.c -lm -o "$RUNNER_TEMP/candidate-stage2"
          cmp "$RUNNER_TEMP/candidate-stage1" "$RUNNER_TEMP/candidate-stage2"
          sha256sum "$RUNNER_TEMP/candidate-stage1" "$RUNNER_TEMP/candidate-stage2"
          wc -c "$RUNNER_TEMP/candidate-stage1" "$RUNNER_TEMP/candidate-stage2"
      - name: Rebuild baseline production with identical regressions
        shell: bash
        run: |
          set -euo pipefail
          git show 46ed5e141baed17dfc1e977691ac73e08be5b9f5:src/buster/lib/compiler/frontend/c/c_gen.c > src/buster/lib/compiler/frontend/c/c_gen.c
          "$RUNNER_TEMP/driver" build --config Debug -t ide 2>&1 | tee "$RUNNER_TEMP/evidence/baseline-build.log"
      - name: Baseline negative control must fail only lost volatile flags
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re, subprocess
          path = Path(os.environ['RUNNER_TEMP'])/'evidence/baseline-frontend.log'
          env = dict(os.environ, BUSTER_TEST_JOBS='2')
          with path.open('w') as log:
              completed = subprocess.run(['build/Debug/ide', 'test', '--ci=1'], env=env, stdout=log, stderr=subprocess.STDOUT, timeout=600)
          text = path.read_text()
          print('baseline exit status:', completed.returncode)
          assert completed.returncode == 1, completed.returncode
          failures = [line for line in text.splitlines() if ' failed at ' in line]
          assert len(failures) == 192, failures
          assert all(line.startswith('instruction->volatile_access == expected.is_volatile failed at ') for line in failures), failures
          counts = re.search(r'\[(\d+)/(\d+)\] Unit tests', text)
          assert counts and int(counts[2]) - int(counts[1]) == 192, text[-2000:]
          print('PASS: baseline fails exactly 192 volatile load/store assertions; all other frontend assertions pass')
          print(text[-500:])
          PY
      - name: Baseline Debug-seeded fixed point
        if: ${{ matrix.runner == 'ubuntu-26.04' }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/evidence/baseline-selfhost.log") 2>&1
          timeout 300 build/Debug/ide cc -Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -g src/buster/apps/ide/ide.c -lm -o "$RUNNER_TEMP/baseline-stage1"
          timeout 300 "$RUNNER_TEMP/baseline-stage1" cc -Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -g src/buster/apps/ide/ide.c -lm -o "$RUNNER_TEMP/baseline-stage2"
          cmp "$RUNNER_TEMP/baseline-stage1" "$RUNNER_TEMP/baseline-stage2"
          sha256sum "$RUNNER_TEMP/baseline-stage1" "$RUNNER_TEMP/baseline-stage2"
      - name: Verify diagnostic dispatch is absent from candidate
        shell: bash
        run: |
          set -euo pipefail
          git restore src/buster/tests/test.c src/buster/lib/compiler/frontend/c/c_gen.c
          git diff --exit-code
      - name: Retain validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue902-validation-${{ matrix.runner }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
