name: Finalize issue 512 typed client

on:
  push:
    branches:
      - codex/512-performance-execution-20260917
    paths:
      - .github/workflows/apply-issue-512.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply validated patch and publish clean branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          source = Path('.github/workflows/source-export-512.yml').read_text()
          prefix = "printf '%s' '"
          suffix = "' | base64 -d | gzip -d"
          start = source.index(prefix) + len(prefix)
          end = source.index(suffix, start)
          patch = gzip.decompress(base64.b64decode(source[start:end], validate=True))
          Path(os.environ['RUNNER_TEMP'], 'issue-512.patch').write_bytes(patch)
          PY
          echo '1185761fef35505e255118ae99064b5104999573a8c2a380d4d8df725d08377d  '"$RUNNER_TEMP/issue-512.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/issue-512.patch"
          git apply "$RUNNER_TEMP/issue-512.patch"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/build-driver"
          "$RUNNER_TEMP/build-driver" bench_service_recipe_self_test
          "$RUNNER_TEMP/build-driver" bench_service self-test
          "$RUNNER_TEMP/build-driver" bench_service self-test --sanitize
          git checkout -- build/bench-service-tools/service-tests 2>/dev/null || true
          git clean -fd -- build/bench-service-tools
          git rm .github/workflows/source-export-512.yml .github/workflows/apply-issue-512.yml
          git add tools/bench_service/README.md tools/bench_service/main.c tools/bench_service/tests.c tools/bench_service/transport.c
          git diff --cached --check
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'bench service: add typed authenticated client'
          git push origin "HEAD:${GITHUB_REF_NAME}"
