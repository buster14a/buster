name: 9700X compiler benchmark request

# Every main merge-queue candidate completes this run, and only that
# completion starts the compiler comparison in 9700x-direct-bench.yml from main
# (#2752). This job is a marker: it runs on a hosted runner, checks out
# nothing, executes no repository content and holds no capability. The bench
# workflow re-reads the run, the live queue ref, the group commit and its pull
# request from GitHub's records, so an edited copy of this file in a candidate
# gains nothing. Nothing is checked out; the repository-wide static policy
# marker is kept: persist-credentials: false
on:
  merge_group:
    types: [checks_requested]

# Zero token capabilities are stricter than the repository-wide static
# read-only policy marker retained for common workflow tooling: contents: read
permissions: {}

concurrency:
  group: buster-9700x-compiler-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  request:
    name: Record the compiler benchmark request
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record the request
        shell: bash
        run: echo 'A 9700X compiler comparison was requested; see the 9700X direct workload benchmark workflow.'
