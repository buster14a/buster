name: PR 734 declaration census repair

on:
  push:
    branches:
      - 'fix/722-post-tag-specifiers'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: fix/722-post-tag-specifiers

      - name: Keep scalar and AVX-512 declaration candidate sets identical
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/buster/lib/compiler/frontend/c/c_parse.c')
          workflow_path = Path('.github/workflows/pr-734-ci-fix.yml')
          text = source_path.read_text()

          old_symbols = '''        Simd512 thread_local_c23_symbol = simd512_splat((u8)C_SYMBOL_WELL_KNOWN_THREAD_LOCAL_C23);'''
          new_symbols = old_symbols + '''
        Simd512 static_symbol = simd512_splat((u8)C_SYMBOL_WELL_KNOWN_STATIC);'''
          if text.count(old_symbols) != 1:
              raise SystemExit(f'expected exactly one declaration insertion point, found {text.count(old_symbols)}')
          text = text.replace(old_symbols, new_symbols, 1)

          old_mask = '''                              mask64_or(mask64_or(simd512_equal_byte(symbol_lanes, thread_local_symbol), simd512_equal_byte(symbol_lanes, thread_gnu_symbol)),
                                        simd512_equal_byte(symbol_lanes, thread_local_c23_symbol))));'''
          new_mask = '''                              mask64_or(mask64_or(simd512_equal_byte(symbol_lanes, thread_local_symbol), simd512_equal_byte(symbol_lanes, thread_gnu_symbol)),
                                        mask64_or(simd512_equal_byte(symbol_lanes, thread_local_c23_symbol),
                                                  simd512_equal_byte(symbol_lanes, static_symbol)))));'''
          if text.count(old_mask) != 1:
              raise SystemExit(f'expected exactly one declaration bitmap insertion point, found {text.count(old_mask)}')
          text = text.replace(old_mask, new_mask, 1)

          source_path.write_text(text)
          workflow_path.unlink()
          PY

          git diff --check
          git diff -- src/buster/lib/compiler/frontend/c/c_parse.c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/buster/lib/compiler/frontend/c/c_parse.c .github/workflows/pr-734-ci-fix.yml
          git commit -m 'fix(c): include static in SIMD declaration census'
          git push origin HEAD:fix/722-post-tag-specifiers
