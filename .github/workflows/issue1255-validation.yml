name: Issue 1255 isolated hosted validation
on:
  push:
    branches: [agent/1255-dynamic-image-bounds-prepare]
    paths: [.github/workflows/issue1255-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'buster14a/buster'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: '0'
      BUSTER_LINKER: lld
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Publish the bounded test correction
        run: |
          set -euo pipefail
          parent=968522eed4b318051fa609957da8227724b693e7
          sed '/^diff --git a\/src\/buster\/compiler\/runtime.c/,$d' issue1255-followup.patch > "$RUNNER_TEMP/issue1255-followup.patch"
          git checkout --detach "$parent"
          git apply --index "$RUNNER_TEMP/issue1255-followup.patch"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/buster/compiler/runtime.c')
          s = p.read_text()
          s = s.replace('// no object defines it, each with its supported output kinds (a bit per RuntimeKind). For executables, GNU ld and lld\n// define them there:', '// no object defines it, each with its supported output kinds (a bit per RuntimeKind). The executable bounds follow\n// GNU ld and lld, with GNU ld\'s additional __etext alias; shared-library admission is unchanged:')
          s = s.replace("//   - every executable (dynamic PIE, static executable and static PIE): the ELF header's address (__ehdr_start, through which libc.a's startup finds\n//     the program headers) and the image's start; the preinit array's bounds; and the ends of the text, the data and\n//     the image. These bounds also belong to a dynamic executable; shared-library admission is unchanged here;", "//   - every executable (dynamic PIE, static executable and static PIE): the ELF header's address (__ehdr_start,\n//     through which libc.a's startup finds the program headers) and the image's start; the preinit array's bounds;\n//     the ends of the text and the file-backed data; the start of .bss; and the end of the image;")
          p.write_text(s)
          PY
          test "$(git hash-object src/buster/compiler/dynamic_bounds_test.c)" = 952ecf48c1c43e947144afa61d31108997f517a0
          test "$(git hash-object src/buster/compiler/runtime.c)" = 9aece9467a87acd9d4b4cdbeb063a2a4b7ffd959
          test "$(git hash-object src/buster/compiler/executable.c)" = 0431eef8f5d265dc8ffb67d047443c466d9b6723
          test "$(git hash-object docs/commands/executable.md)" = 8f34c458f09e8e54e20693c97788475c7792bc73
          git add src/buster/compiler/runtime.c
          git diff --cached --check
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'test(link): validate each image-bound layout independently' '' 'Recompute bounds after RELR layout changes. Preserve all twelve direct-link and GNU checks, and distinguish the eleven names lld defines from GNU ld additional __etext alias.' '' 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>' | git commit-tree "$tree" -p "$parent")
          git push origin "$commit:refs/heads/fix/1255-dynamic-image-bounds"
          git reset --hard "$commit"
          mkdir -p "$RUNNER_TEMP/issue1255"
          git archive HEAD | gzip > "$RUNNER_TEMP/issue1255/source.tar.gz"
          git diff 441db2428d2bd8d28503037b28c1b3740fe4b25a HEAD > "$RUNNER_TEMP/issue1255/change.patch"
          git show -s --format=fuller HEAD > "$RUNNER_TEMP/issue1255/commit.txt"
          printf 'Implementation commit: `%s`\n' "$commit" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the repository's hosted toolchain
        run: bash tools/ci/setup-hosted.sh
      - name: Record the actual lld alias diagnostic
        run: |
          set -euo pipefail
          ld.lld --version | tee "$RUNNER_TEMP/issue1255/lld-version.log"
          printf '%s\n' '#include <stdio.h>' 'extern char __etext[];' 'int main(void) { printf("%p\n", (void*)__etext); return 0; }' > "$RUNNER_TEMP/issue1255/etext.c"
          if clang -fuse-ld=lld -fPIE -pie "$RUNNER_TEMP/issue1255/etext.c" -o "$RUNNER_TEMP/issue1255/etext" > "$RUNNER_TEMP/issue1255/lld-alias.log" 2>&1; then
            printf '%s\n' 'lld defines __etext on this toolchain' | tee -a "$RUNNER_TEMP/issue1255/lld-alias.log"
          else
            cat "$RUNNER_TEMP/issue1255/lld-alias.log"
            grep -q 'undefined symbol: __etext' "$RUNNER_TEMP/issue1255/lld-alias.log"
          fi
      - name: Build the baseline compiler
        run: ./build.sh --jobs 2 2>&1 | tee "$RUNNER_TEMP/issue1255/build.log"
      - name: Dynamic executable and shared-library regression suite
        run: ./build/compiler test-dynamic --cross-check 2>&1 | tee "$RUNNER_TEMP/issue1255/dynamic.log"
      - name: Static executable regression suite
        if: success() || failure()
        run: test -x build/compiler && ./build/compiler test-static --cross-check 2>&1 | tee "$RUNNER_TEMP/issue1255/static.log"
      - name: Direct compiler self-link
        if: success() || failure()
        run: |
          set -euo pipefail
          test -x build/compiler
          ./build.sh print-sources > "$RUNNER_TEMP/issue1255/sources.argv"
          ./build.sh print-compile-flags > "$RUNNER_TEMP/issue1255/flags.argv"
          mapfile -d '' -t sources < "$RUNNER_TEMP/issue1255/sources.argv"
          mapfile -d '' -t flags < "$RUNNER_TEMP/issue1255/flags.argv"
          /usr/bin/time -v ./build/compiler --lanes 1 "${flags[@]}" -o build/selfhost-1255 "${sources[@]}" -lm -lpthread 2>&1 | tee "$RUNNER_TEMP/issue1255/selfhost-link.log"
          ./build/selfhost-1255 --version 2>&1 | tee "$RUNNER_TEMP/issue1255/selfhost-version.log"
      - name: Verify the regression rejects the old kind mask
        if: success()
        run: |
          set -euo pipefail
          git show 441db2428d2bd8d28503037b28c1b3740fe4b25a:src/buster/compiler/runtime.c > src/buster/compiler/runtime.c
          ./build.sh --jobs 2 2>&1 | tee "$RUNNER_TEMP/issue1255/mutant-build.log"
          if ./build/compiler test-dynamic --cross-check > "$RUNNER_TEMP/issue1255/mutant.log" 2>&1; then
            cat "$RUNNER_TEMP/issue1255/mutant.log"
            printf '%s\n' 'Regression unexpectedly accepted the original runtime mask'
            exit 1
          fi
          grep 'dynamic image bounds:' "$RUNNER_TEMP/issue1255/mutant.log"
          grep -q 'all twelve references bind in a dynamic executable' "$RUNNER_TEMP/issue1255/mutant.log"
      - name: Preserve validation results and exact source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue1255-validation
          path: ${{ runner.temp }}/issue1255
          retention-days: 7
