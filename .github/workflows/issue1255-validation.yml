name: Issue 1255 isolated hosted validation
on:
  push:
    branches: [agent/1255-dynamic-image-bounds-prepare]
    paths: [.github/workflows/issue1255-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'buster14a/buster'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: '0'
      BUSTER_LINKER: lld
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare a clean implementation commit
        shell: bash
        run: |
          set -euo pipefail
          base=441db2428d2bd8d28503037b28c1b3740fe4b25a
          test "$(git rev-parse HEAD~2)" = "$base"
          runtime=src/buster/compiler/runtime.c
          sed -i '/^static const RuntimeLinkerName runtime_linker_names\[\] = {/,/^};/s/BUSTER_RUNTIME_STATIC_KINDS/BUSTER_RUNTIME_EXECUTABLE_KINDS/g' "$runtime"
          sed -i '/^#define BUSTER_RUNTIME_STATIC_KINDS /a #define BUSTER_RUNTIME_EXECUTABLE_KINDS (BUSTER_RUNTIME_STATIC_KINDS | BUSTER_RUNTIME_KIND_BIT(RUNTIME_KIND_DYNAMIC))' "$runtime"
          sed -i 's@// no object defines it, each with the kinds whose linker defines it (a bit per RuntimeKind), as GNU ld.s and lld.s@// no object defines it, each with its supported output kinds (a bit per RuntimeKind). For executables, GNU ld and lld@' "$runtime"
          sed -i 's@//     the image;@//     the image. These bounds also belong to a dynamic executable; shared-library admission is unchanged here;@' "$runtime"
          sed -i 's@//   - a static executable and a static PIE: the ELF header.s address@//   - every executable (dynamic PIE, static executable and static PIE): the ELF header\x27s address@' "$runtime"
          test "$(grep -c 'BUSTER_RUNTIME_EXECUTABLE_KINDS },' "$runtime")" = 12
          sed -i '/#include "buster\/compiler\/dynamic_libraries_test.c"/a #include "buster/compiler/dynamic_bounds_test.c"' src/buster/compiler/dynamic_test.c
          sed -i '/passed = dynamic_test_section_bounds(&directory, &runtime, cross_check) && passed;/a\        passed = dynamic_test_image_bounds(\&directory, \&runtime, cross_check) \&\& passed;' src/buster/compiler/dynamic_test.c
          cat >> docs/commands/executable.md <<'DOC'

          ## Dynamic image bounds (#1255)

          `test-dynamic` also binds all twelve image-bound names in a dynamic PIE:
          `__ehdr_start`, `__executable_start`, `__preinit_array_start`,
          `__preinit_array_end`, `_etext`, `etext`, `__etext`, `_edata`, `edata`,
          `__bss_start`, `_end` and `end`. The fixture has initialized data and an
          aligned, nonempty BSS, so the data end, BSS start and image end cannot be
          confused. It checks every resolved address against the output ELF headers
          and runs the executable to verify the relocated addresses. The ordinary
          lane-count, poisoned-scratch, exact-twin and RELR-disabled checks apply.
          With `--cross-check`, GNU ld and lld link the same object and their running
          executables must satisfy the same ELF-bound rules for their own layouts.
          Kind-mask checks retain static-runtime selection, shared-library admission
          and the static executable's exclusive IPLT bounds.

          The fixture leaves the preinit array empty, as the direct path has no
          preinit atoms: both bounds coincide at the init array's start. It does not
          claim support for nonempty preinit arrays or new shared-library bounds.
          DOC
          git rm .github/workflows/issue1255-validation.yml
          git add src/buster/compiler/runtime.c src/buster/compiler/dynamic_test.c src/buster/compiler/dynamic_bounds_test.c docs/commands/executable.md
          git diff --cached --check
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'fix(link): define image bounds for dynamic executables' '' 'Enable the twelve executable-bound names without changing static runtime selection or shared-library admission. Exercise actual ELF bounds, lane determinism, exact twins and GNU ld/lld oracles in test-dynamic.' '' 'Fixes #1255' '' 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>' | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/fix/1255-dynamic-image-bounds"
          printf 'Implementation commit: `%s`\n' "$commit" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/issue1255"
          git archive "$commit" | gzip > "$RUNNER_TEMP/issue1255/source.tar.gz"
          git diff "$base" "$commit" > "$RUNNER_TEMP/issue1255/change.patch"
          git show -s --format=fuller "$commit" > "$RUNNER_TEMP/issue1255/commit.txt"
      - name: Install the repository's hosted toolchain
        run: bash tools/ci/setup-hosted.sh
      - name: Build the baseline compiler
        run: ./build.sh --jobs 2 2>&1 | tee "$RUNNER_TEMP/issue1255/build.log"
      - name: Dynamic executable and shared-library regression suite
        run: ./build/compiler test-dynamic --cross-check 2>&1 | tee "$RUNNER_TEMP/issue1255/dynamic.log"
      - name: Static executable regression suite
        if: success() || failure()
        run: test -x build/compiler && ./build/compiler test-static --cross-check 2>&1 | tee "$RUNNER_TEMP/issue1255/static.log"
      - name: Direct compiler self-link
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          test -x build/compiler
          ./build.sh print-sources > "$RUNNER_TEMP/issue1255/sources.argv"
          mapfile -d '' -t sources < "$RUNNER_TEMP/issue1255/sources.argv"
          ./build/compiler --jobs 1 -march=native -Isrc -fwrapv -funsigned-char -fno-strict-aliasing -fno-stack-protector -Wno-unused-function -Wno-psabi -o build/selfhost-1255 "${sources[@]}" -lm -lpthread 2>&1 | tee "$RUNNER_TEMP/issue1255/selfhost-link.log"
          ./build/selfhost-1255 --version 2>&1 | tee "$RUNNER_TEMP/issue1255/selfhost-version.log"
      - name: Preserve validation results and exact source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue1255-validation
          path: ${{ runner.temp }}/issue1255
          retention-days: 7
