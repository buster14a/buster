name: Issue 1255 isolated hosted validation
on:
  push:
    branches: [agent/1255-dynamic-image-bounds-prepare]
    paths: [.github/workflows/issue1255-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'buster14a/buster'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: '0'
      BUSTER_LINKER: lld
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: a389f93bf9a8ba1efc07232ad959f99b1f52176f
          fetch-depth: 3
      - name: Publish the empty-array oracle distinction
        run: |
          set -euo pipefail
          parent=a389f93bf9a8ba1efc07232ad959f99b1f52176f
          test "$(git rev-parse HEAD)" = "$parent"
          test "$(git hash-object src/buster/compiler/dynamic_bounds_test.c)" = 952ecf48c1c43e947144afa61d31108997f517a0
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/buster/compiler/dynamic_bounds_test.c')
          s = p.read_text()
          s = s.replace('// Empty preinit bounds coincide at .init_array\'s start. The direct writer has no preinit atoms; the fixture deliberately\n// leaves that array empty. A nonempty .data and aligned .bss distinguish the file-backed end, zero-fill start and image end.', '// The direct writer follows GNU ld for empty preinit bounds: both coincide at .init_array\'s start. Lld uses offset\n// zero when .preinit_array is absent. A nonempty .data and aligned .bss distinguish the file and memory bounds.')
          s = s.replace('static bool dynamic_bounds_values(DynamicTestTally* tally, String8 file, uint64_t* values)', 'static bool dynamic_bounds_values(DynamicTestTally* tally, String8 file, uint64_t* values, bool gnu_empty_preinit)')
          s = s.replace('values[2] = (preinit != 0 ? preinit->sh_addr : init->sh_addr) - base;', 'values[2] = preinit != 0 ? preinit->sh_addr - base : gnu_empty_preinit ? init->sh_addr - base : 0;')
          s = s.replace('dynamic_bounds_values(tally, file, values)', 'dynamic_bounds_values(tally, file, values, true)')
          s = s.replace('dynamic_bounds_values(&tally, reference_file, values)', 'dynamic_bounds_values(&tally, reference_file, values, l == 0)')
          p.write_text(s)
          p = Path('docs/commands/executable.md')
          s = p.read_text().replace('rules for their own layouts.\nKind-mask', 'rules for their own layouts, except that lld places the absent preinit\narray\'s bounds at image offset zero. The direct writer retains GNU ld\'s\nchoice of the init array\'s start.\nKind-mask')
          p.write_text(s)
          p = Path('src/buster/compiler/runtime.c')
          s = p.read_text().replace('// no object defines it, each with its supported output kinds (a bit per RuntimeKind). The executable bounds follow\n// GNU ld and lld, with GNU ld\'s additional __etext alias; shared-library admission is unchanged:', '// no object defines it, each with its supported output kinds (a bit per RuntimeKind). The executable image bounds\n// follow GNU ld, including its __etext alias and empty preinit bounds; shared-library admission is unchanged:')
          p.write_text(s)
          p = Path('src/buster/compiler/executable.c')
          s = p.read_text().replace('// as GNU ld and lld define them: the init and fini arrays', '// as GNU ld defines them: the init and fini arrays')
          p.write_text(s)
          PY
          test "$(git hash-object src/buster/compiler/dynamic_bounds_test.c)" = 24d94e8ed352fcce3b7b4d469cee6154e29045d7
          test "$(git hash-object src/buster/compiler/runtime.c)" = 254c0ece15b36e6c64eabd089cd6bb1dcc723eeb
          test "$(git hash-object docs/commands/executable.md)" = 847a0511ec2e774b25276d3bda5f670203bbd9b9
          git add src/buster/compiler/dynamic_bounds_test.c src/buster/compiler/runtime.c src/buster/compiler/executable.c docs/commands/executable.md
          git diff --cached --check
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'test(link): distinguish GNU and lld empty preinit bounds' '' 'The direct path retains GNU ld semantics for empty preinit arrays; independently check lld image-offset-zero behavior when its preinit section is absent.' '' 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>' | git commit-tree "$tree" -p "$parent")
          git push origin "$commit:refs/heads/fix/1255-dynamic-image-bounds"
          git reset --hard "$commit"
          mkdir -p "$RUNNER_TEMP/issue1255"
          git archive HEAD | gzip > "$RUNNER_TEMP/issue1255/source.tar.gz"
          git diff 441db2428d2bd8d28503037b28c1b3740fe4b25a HEAD > "$RUNNER_TEMP/issue1255/change.patch"
          git show -s --format=fuller HEAD > "$RUNNER_TEMP/issue1255/commit.txt"
          printf 'Implementation commit: `%s`\n' "$commit" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the repository's hosted toolchain
        run: bash tools/ci/setup-hosted.sh
      - name: Record the actual lld alias diagnostic
        run: |
          set -euo pipefail
          ld.lld --version | tee "$RUNNER_TEMP/issue1255/lld-version.log"
          printf '%s\n' '#include <stdio.h>' 'extern char __etext[];' 'int main(void) { printf("%p\n", (void*)__etext); return 0; }' > "$RUNNER_TEMP/issue1255/etext.c"
          if clang -fuse-ld=lld -fPIE -pie "$RUNNER_TEMP/issue1255/etext.c" -o "$RUNNER_TEMP/issue1255/etext" > "$RUNNER_TEMP/issue1255/lld-alias.log" 2>&1; then
            printf '%s\n' 'lld defines __etext on this toolchain' | tee -a "$RUNNER_TEMP/issue1255/lld-alias.log"
          else
            cat "$RUNNER_TEMP/issue1255/lld-alias.log"
            grep -q 'undefined symbol: __etext' "$RUNNER_TEMP/issue1255/lld-alias.log"
          fi
      - name: Build the baseline compiler
        run: ./build.sh --jobs 2 2>&1 | tee "$RUNNER_TEMP/issue1255/build.log"
      - name: Dynamic executable and shared-library regression suite
        run: ./build/compiler test-dynamic --cross-check 2>&1 | tee "$RUNNER_TEMP/issue1255/dynamic.log"
      - name: Static executable regression suite
        if: success() || failure()
        run: test -x build/compiler && ./build/compiler test-static --cross-check 2>&1 | tee "$RUNNER_TEMP/issue1255/static.log"
      - name: Direct compiler self-link
        if: success() || failure()
        run: |
          set -euo pipefail
          test -x build/compiler
          ./build.sh print-sources > "$RUNNER_TEMP/issue1255/sources.argv"
          ./build.sh print-compile-flags > "$RUNNER_TEMP/issue1255/flags.argv"
          mapfile -d '' -t sources < "$RUNNER_TEMP/issue1255/sources.argv"
          mapfile -d '' -t flags < "$RUNNER_TEMP/issue1255/flags.argv"
          /usr/bin/time -v ./build/compiler --lanes 1 "${flags[@]}" -o build/selfhost-1255 "${sources[@]}" -lm -lpthread 2>&1 | tee "$RUNNER_TEMP/issue1255/selfhost-link.log"
          ./build/selfhost-1255 --version 2>&1 | tee "$RUNNER_TEMP/issue1255/selfhost-version.log"
      - name: Verify the regression rejects the old kind mask
        if: success()
        run: |
          set -euo pipefail
          git show 441db2428d2bd8d28503037b28c1b3740fe4b25a:src/buster/compiler/runtime.c > src/buster/compiler/runtime.c
          ./build.sh --jobs 2 2>&1 | tee "$RUNNER_TEMP/issue1255/mutant-build.log"
          if ./build/compiler test-dynamic --cross-check > "$RUNNER_TEMP/issue1255/mutant.log" 2>&1; then
            cat "$RUNNER_TEMP/issue1255/mutant.log"
            printf '%s\n' 'Regression unexpectedly accepted the original runtime mask'
            exit 1
          fi
          grep 'dynamic image bounds:' "$RUNNER_TEMP/issue1255/mutant.log"
          grep -q 'all twelve references bind in a dynamic executable' "$RUNNER_TEMP/issue1255/mutant.log"
      - name: Preserve validation results and exact source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue1255-validation
          path: ${{ runner.temp }}/issue1255
          retention-days: 7
