name: Issue 183 current source artifact
on:
  push:
    branches: [scratch/183-current-main-source]
    paths:
      - .github/workflows/issue-183-current-source.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | tar --null -T - -czf issue-183-current-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: issue-183-current-source
          path: issue-183-current-source.tgz
          retention-days: 1
