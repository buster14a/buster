name: Apply issue 929 patch

on:
  push:
    branches:
      - codex/929-retirement-performance-eligibility

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Apply focused issue 929 patch
        id: apply
        shell: bash
        run: |
          set +e
          python3 tools/apply_929_patch.py >apply-929-error.txt 2>&1
          status=$?
          cat apply-929-error.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish patch diagnostic
        if: steps.apply.outputs.status != '0'
        run: |
          git config user.name "openai-codex"
          git config user.email "openai-codex@users.noreply.github.com"
          git add -f apply-929-error.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: retain issue 929 patch diagnostic"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Stop after patch diagnostic
        if: steps.apply.outputs.status != '0'
        run: exit 1

      - name: Validate syntax and focused contracts
        if: steps.apply.outputs.status == '0'
        run: |
          python3 -m py_compile \
            tools/native_retirement_performance_schema.py \
            tools/native_retirement_contract.py \
            tools/native_retirement_performance_binding.py \
            tools/native_retirement_performance_binding_test.py \
            tools/native_retirement_performance_identity_test.py \
            tools/native_retirement_performance_eligibility_test.py
          python3 -W error::ResourceWarning tools/native_retirement_performance_eligibility_test.py -v
          python3 -W error::ResourceWarning tools/native_retirement_performance_binding_test.py -v
          python3 -W error::ResourceWarning tools/native_retirement_performance_identity_test.py -v

      - name: Commit applied patch
        if: steps.apply.outputs.status == '0'
        run: |
          git config user.name "openai-codex"
          git config user.email "openai-codex@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "bench: reconcile retirement performance eligibility"
          git push origin "HEAD:${GITHUB_REF_NAME}"
