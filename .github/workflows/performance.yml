name: Performance resources

on:
  pull_request:
    paths: ['tools/performance/**', 'docs/performance/**', 'web/**', '.github/workflows/performance.yml']
  push:
    branches: [main]
    paths: ['tools/performance/**', 'docs/performance/**', 'web/**', '.github/workflows/performance.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native benchmark resource validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LC_ALL: C
    steps:
      - name: Check out triggering source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Check out reviewed reference evidence
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: buster14a/buster-performance
          ref: 2c26fc75c9d54396af201348ba7572d0d2ab1774
          path: build/evidence
          persist-credentials: false
      - name: Install native development libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang pkg-config libssl-dev libpcre2-dev libcurl4-openssl-dev
      - name: Verify dependency sources and native representation checks
        run: |
          sha256sum -c tools/performance/vendor/SHA256SUMS
          clang --version
          pkg-config --modversion openssl libpcre2-8 libcurl
          bash tools/performance/build.sh
          bash tools/performance/build.sh --tests
          build/performance/bmf-test build/evidence
      - name: Verify bounded validation under sanitizers
        env:
          BUSTER_PERFORMANCE_CFLAGS: -O1 -fsanitize=address,undefined -fno-omit-frame-pointer
          ASAN_OPTIONS: detect_leaks=1
        run: |
          bash tools/performance/build.sh --tests
          build/performance/bmf-test build/evidence
