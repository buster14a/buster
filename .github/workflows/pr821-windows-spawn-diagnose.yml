name: PR 821 Windows environment repair

on:
  push:
    branches:
      - fix/84-transactional-hermetic-spawn
    paths:
      - '.github/workflows/pr821-windows-spawn-diagnose.yml'

permissions:
  contents: write

concurrency:
  group: pr821-windows-environment-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message == 'ci repair PR821 Windows environment' && github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/84-transactional-hermetic-spawn
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize ordinary environment entries
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          entry = Path("src/buster/lib/entry_point.c")
          text = entry.read_text(encoding="utf-8")
          old = '''    SliceString8 environment_keys = {.pointer = arena_allocate(os_state.arena, String8, environments_raw.length), .length = environments_raw.length};
              SliceString8 environment_values = {.pointer = arena_allocate(os_state.arena, String8, environments_raw.length), .length = environments_raw.length};
          
              for (u64 i = 0; i < environments_raw.length; i += 1)
              {
                  String8 environment_raw = environments_raw.pointer[i];
                  u64 equal_index = string_first_code_unit(environment_raw, '=');
                  if (equal_index != BUSTER_STRING_NO_MATCH)
                  {
                      String8 key = string_slice(environment_raw, 0, equal_index);
                      String8 value = string_slice(environment_raw, equal_index + 1, environment_raw.length);
                      environment_keys.pointer[i] = key;
                      environment_values.pointer[i] = value;
                  }
                  else
                  {
                      environment_keys.pointer[i] = (String8){0};
                      environment_values.pointer[i] = (String8){0};
                  }
              }
          '''
          new = '''    SliceString8 environment_keys = {.pointer = arena_allocate(os_state.arena, String8, environments_raw.length)};
              SliceString8 environment_values = {.pointer = arena_allocate(os_state.arena, String8, environments_raw.length)};
          
              for (u64 i = 0; i < environments_raw.length; i += 1)
              {
                  String8 environment_raw = environments_raw.pointer[i];
                  u64 equal_index = string_first_code_unit(environment_raw, '=');
                  if (equal_index != BUSTER_STRING_NO_MATCH && equal_index != 0)
                  {
                      u64 environment_index = environment_keys.length;
                      String8 key = string_slice(environment_raw, 0, equal_index);
                      String8 value = string_slice(environment_raw, equal_index + 1, environment_raw.length);
                      environment_keys.pointer[environment_index] = key;
                      environment_values.pointer[environment_index] = value;
                      environment_keys.length += 1;
                      environment_values.length += 1;
                  }
              }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"entry-point environment block match count: {text.count(old)}")
          entry.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          '@ | python -

      - name: Run the Windows release differential regression
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPaths = @(& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw 'Visual Studio was not found' }
          $VsPath = $VsPaths[0].Trim()
          & (Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $Driver = Join-Path (Get-Location) 'build\build.exe'
          cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$Driver`" test_differential --self-test 2>&1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish source repair
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add src/buster/lib/entry_point.c
          git diff --cached --exit-code
          if ($LASTEXITCODE -eq 0) { throw 'environment repair produced no source change' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'runtime: normalize captured environment entries'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
