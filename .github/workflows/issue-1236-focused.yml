name: Issue 1236 focused validation
on:
  push:
    branches: [codex/1236-bit-field-validation]
concurrency:
  group: issue-1236-focused
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Extract registered fixture and run independent controls
        run: |
          python3 - <<'PY'
          import ast, os, pathlib, re
          text = pathlib.Path("src/buster/tests/compiler/driver/driver_test.c").read_text()
          text = text.split("UnitTestResult compiler_driver_test_bit_field_assignment_results(", 1)[1]
          text = text.split("String8 source = S8(", 1)[1].split("String8 source_path", 1)[0]
          strings = re.findall(r'"(?:\\.|[^"\\])*"', text)
          pathlib.Path(os.environ["RUNNER_TEMP"], "results.c").write_text("".join(ast.literal_eval(s) for s in strings))
          PY
          for cc in clang gcc; do
            for opt in -O0 -O2; do
              "$cc" "$opt" "$RUNNER_TEMP/results.c" -o "$RUNNER_TEMP/reference"
              if ! "$RUNNER_TEMP/reference"; then
                python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path(os.environ["RUNNER_TEMP"], "results.c")
          text = path.read_text()
          text = '#include <stdio.h>\n' + text
          text = text.replace('result |= actual != (expected);', 'if (actual != (expected)) { printf("VALUE %s actual=%lld expected=%lld\\n", #expression, actual, (long long)(expected)); result = 1; }')
          text = text.replace('result |= actual != (long long)(field);', 'if (actual != (long long)(field)) { printf("STORE %s actual=%lld read=%lld\\n", #expression, actual, (long long)(field)); result = 1; }')
          path.with_name("diagnose.c").write_text(text)
          PY
                "$cc" "$opt" -fsanitize=undefined "$RUNNER_TEMP/diagnose.c" -o "$RUNNER_TEMP/diagnose"
                "$RUNNER_TEMP/diagnose"
                exit 1
              fi
              echo "ORACLE compiler=$cc optimization=$opt status=pass"
            done
          done
      - name: Bootstrap and configure
        run: |
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/buster-build" build --config Release -t ide
      - name: Require every candidate frontend and allocator
        run: |
          for form in -ffrontend-ssa -fno-frontend-ssa; do
            for mode in none mir-stack fast quality; do
              build/Release/ide cc "$form" "-fregister-allocator=$mode" -fverify-codegen "$RUNNER_TEMP/results.c" -o "$RUNNER_TEMP/results"
              timeout 10 "$RUNNER_TEMP/results"
              echo "CANDIDATE form=$form allocator=$mode status=pass"
            done
          done
      - name: Verify volatile operation counts
        run: build/Release/ide test --module=c_frontend_tests
      - name: Check source growth
        run: '"$RUNNER_TEMP/buster-build" source_size --rev 155a62a14bd6daa9744c0be6bbbc69da449ce3d0 --base 1be6fd8a0a5c138c1d0db87bc216c9a21bf04617'
