name: Aggregate initializer diagnostics
on:
  push:
    branches:
      - codex/3444-local-aggregate-initializers
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aggregate-initializers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  correctness:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      BUSTER_TEST_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bootstrap and build trusted compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aggregate-evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/aggregate-evidence/identity.txt"
          clang --version > "$RUNNER_TEMP/aggregate-evidence/clang.txt"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/aggregate-build"
          "$RUNNER_TEMP/aggregate-build" generate --ci --cc clang --no-sanitize --no-fuzz --no-lto --linker DEFAULT
          "$RUNNER_TEMP/aggregate-build" build --config Release -t ide
      - name: Independent reference reduction
        shell: bash
        run: |
          set -euo pipefail
          clang -E -P -std=c99 src/buster/tests/compiler/driver/fixtures/local_flexible_initializers.c -o "$RUNNER_TEMP/aggregate-reduction.c"
          clang -std=c99 -O0 -fno-strict-aliasing "$RUNNER_TEMP/aggregate-reduction.c" -o "$RUNNER_TEMP/aggregate-reference"
          "$RUNNER_TEMP/aggregate-reference"
      - name: Buster reduction FAST
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          build/Release/ide cc -std=c99 -g0 -fregister-allocator=fast -fverify-codegen -fno-canonical-fast "$RUNNER_TEMP/aggregate-reduction.c" -o "$RUNNER_TEMP/aggregate-fast" 2>&1 | tee "$RUNNER_TEMP/aggregate-evidence/fast.log"
          "$RUNNER_TEMP/aggregate-fast"
      - name: Buster reduction QUALITY
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          build/Release/ide cc -std=c99 -g0 -fregister-allocator=quality -fverify-codegen -fno-canonical-fast "$RUNNER_TEMP/aggregate-reduction.c" -o "$RUNNER_TEMP/aggregate-quality" 2>&1 | tee "$RUNNER_TEMP/aggregate-evidence/quality.log"
          "$RUNNER_TEMP/aggregate-quality"
      - name: Retain diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aggregate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aggregate-evidence/
            build/CMakeCache.txt
            ${{ runner.temp }}/aggregate-reduction.c
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
