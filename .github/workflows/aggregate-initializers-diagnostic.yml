name: Aggregate initializer diagnostics
on:
  push:
    branches:
      - codex/3444-local-aggregate-initializers
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aggregate-initializers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  correctness:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      BUSTER_TEST_JOBS: '2'
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ubuntu-26.04
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Bootstrap and build trusted compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aggregate-evidence"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/aggregate-evidence/identity.txt"
          clang --version > "$RUNNER_TEMP/aggregate-evidence/clang.txt"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/aggregate-build"
          "$RUNNER_TEMP/aggregate-build" generate --ci --cc clang --no-sanitize --no-fuzz --no-lto --linker DEFAULT
          "$RUNNER_TEMP/aggregate-build" build --config Release -t ide
      - name: Independent reference reductions and invalid neighbors
        shell: bash
        run: |
          set -euo pipefail
          for fixture in local_flexible_initializers tagged_array_type_names; do
            clang -E -P -std=c99 "src/buster/tests/compiler/driver/fixtures/$fixture.c" -o "$RUNNER_TEMP/$fixture.c"
            clang -std=c99 -O0 -fno-strict-aliasing "$RUNNER_TEMP/$fixture.c" -o "$RUNNER_TEMP/reference-$fixture"
            "$RUNNER_TEMP/reference-$fixture"
          done
          for fixture in tagged_array_bad_function_subscript tagged_array_bad_bound_subscript; do
            clang -E -P -std=c99 "src/buster/tests/compiler/driver/fixtures/$fixture.c" -o "$RUNNER_TEMP/$fixture.c"
            if clang -std=c99 -fsyntax-only "$RUNNER_TEMP/$fixture.c" > "$RUNNER_TEMP/aggregate-evidence/reference-$fixture.log" 2>&1; then
              echo "error: independent reference accepted invalid fixture $fixture"
              exit 1
            fi
          done
      - name: Buster reductions FAST and QUALITY
        shell: bash
        run: |
          set -euo pipefail
          for allocator in fast quality; do
            for fixture in local_flexible_initializers tagged_array_type_names; do
              build/Release/ide cc -std=c99 -g0 -fregister-allocator="$allocator" -fverify-codegen "$RUNNER_TEMP/$fixture.c" -o "$RUNNER_TEMP/$fixture-$allocator" 2>&1 | tee "$RUNNER_TEMP/aggregate-evidence/$fixture-$allocator.log"
              "$RUNNER_TEMP/$fixture-$allocator"
            done
          done
          for fixture in tagged_array_bad_function_subscript tagged_array_bad_bound_subscript; do
            if build/Release/ide cc -std=c99 -fsyntax-only "$RUNNER_TEMP/$fixture.c" > "$RUNNER_TEMP/aggregate-evidence/buster-$fixture.log" 2>&1; then
              echo "error: Buster accepted invalid fixture $fixture"
              exit 1
            fi
            grep -Fq 'could not form an indexed place' "$RUNNER_TEMP/aggregate-evidence/buster-$fixture.log"
          done
      - name: Self-host fixed point
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/aggregate-build" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/aggregate-evidence/self-host.log"
      - name: Registered suite
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/aggregate-build" build --config Release -t test_all 2>&1 | tee "$RUNNER_TEMP/aggregate-evidence/test-all.log"
      - name: Provision AArch64 execution control
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
      - name: Mode matrix
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/aggregate-build" test_mode_matrix --config Release 2>&1 | tee "$RUNNER_TEMP/aggregate-evidence/mode-matrix.log"
      - name: Source size
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/aggregate-build" source_size --base 27aac48349c2da9c6c24bae660a0f893fa3da6d4 2>&1 | tee "$RUNNER_TEMP/aggregate-evidence/source-size.log"
      - name: Full pristine musl manifest
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          git clone https://git.musl-libc.org/git/musl "$RUNNER_TEMP/aggregate-musl"
          git -C "$RUNNER_TEMP/aggregate-musl" checkout --detach 9fa28ece75d8a2191de7c5bb53bed224c5947417
          "$RUNNER_TEMP/aggregate-build" test_musl --config Release "$RUNNER_TEMP/aggregate-musl" 2>&1 | tee "$RUNNER_TEMP/aggregate-evidence/musl.log"
      - name: Retain machine records
        if: ${{ !cancelled() }}
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: retain
          retention-directory: ${{ runner.temp }}/aggregate-evidence
      - name: Retain diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aggregate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aggregate-evidence/
            build/CMakeCache.txt
            build/musl*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
