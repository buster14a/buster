name: Export PR 568 source snapshot

on:
  push:
    branches:
      - automation/pr568-review-comments

permissions:
  contents: read

jobs:
  export:
    name: Package exact PR source
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: docs/511-retirement-performance-contract
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and package source
        shell: bash
        run: |
          set -euo pipefail
          expected='685617be77e1b7c926a1fb80b9e9f9bbfcc5cf11'
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --quiet
          printf '%s\n' "$expected" > "$RUNNER_TEMP/pr568-head.txt"
          tar --exclude=.git --exclude=build -czf "$RUNNER_TEMP/pr568-source.tar.gz" .
          sha256sum "$RUNNER_TEMP/pr568-source.tar.gz" > "$RUNNER_TEMP/pr568-source.tar.gz.sha256"
      - name: Retain exact source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr568-source-685617be
          path: |
            ${{ runner.temp }}/pr568-source.tar.gz
            ${{ runner.temp }}/pr568-source.tar.gz.sha256
            ${{ runner.temp }}/pr568-head.txt
          retention-days: 1
          if-no-files-found: error
