name: Issue 775 complete correctness checks
on:
  push:
    branches: [codex/775-baseline-vectors]
    paths: [.github/workflows/issue-775-final-checks.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/775-baseline-vectors
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/buster/compiler/x86_semantics.c');s=p.read_text()
          needle="    /* Baseline vector rows (#775): legacy destinations are tied, while VEX destinations are independent. */ " + chr(92) + '\n'
          rows=[]
          for shape,b in [('X_X_XM128',16),('Y_Y_YM256',32)]:
              f='VXORPS_'+shape
              assert f+',' not in s
              rows.append(f'    X({f}, {f}, VECTOR_XOR, MOVE, 0, BUSTER_X86_VECTOR_WRITE(ZERO, {b}), 0, 0, 0, 0, 0, 0, NONE, NONE, BUSTER_X86_EFFECT_ZERO_IDIOM) ' + chr(92) + '\n')
          assert needle in s
          p.write_text(s.replace(needle,needle+''.join(rows)))
          PY
          git diff --check
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git add src/buster/compiler
          env -u BUSTER_DCO_SIGN_OFF git commit -m 'fix(x86): cover VEX floating bitwise zero idioms'
          git push origin HEAD:refs/heads/codex/775-baseline-vectors
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: apply
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: 0
      BUSTER_ORACLE_CACHE: check
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - run: bash tools/ci/setup-hosted.sh
      - name: Build and test independently
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/issue775"
          ./build.sh > "$RUNNER_TEMP/issue775/build.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/issue775/build.log"
          if [ "$result" -eq 0 ]; then
            for suite in test-tier0 'test-checker --program-vectors' test-x86-target test-x86-semantics; do
              name=${suite%% *}
              ./build/compiler $suite > "$RUNNER_TEMP/issue775/$name.log" 2>&1
              result=$((result | $?))
              cat "$RUNNER_TEMP/issue775/$name.log"
            done
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/issue775/commit.txt"
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue775-complete
          path: ${{ runner.temp }}/issue775
          retention-days: 7
