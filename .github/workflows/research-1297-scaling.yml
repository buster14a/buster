name: Research 1297 scaling (disposable)
# Branch-only observation; never an admission check or production change.
on:
  push:
    branches: [codex/1297-labeled-scaling-research]
    paths: [.github/workflows/research-1297-scaling.yml]
permissions:
  contents: read
  actions: read
jobs:
  postflight:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Reuse exact successful census binaries and inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scaling1297-36643345512
          run-id: 36643345512
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior
      - name: Time with native clock and collect real-source counts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/buster/lib/compiler/frontend/c/c_gen.c)" = 60dfd0e1c6174088326976954e618f6435e9f92a
          python3 -u tools/research/scaling_postflight_1297.py --prior "$RUNNER_TEMP/prior/scaling1297" --out "$RUNNER_TEMP/scaling1297-post" | tee "$RUNNER_TEMP/scaling1297-post-console.log"
          git status --short
      - name: Retain postflight observations including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scaling1297-post-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/scaling1297-post
            ${{ runner.temp }}/scaling1297-post-console.log
          if-no-files-found: error
          retention-days: 30
