name: Research 1297 scaling (disposable)
# Branch-only observation; never an admission check or production change.
on:
  push:
    branches: [codex/1297-labeled-scaling-research]
    paths: [.github/workflows/research-1297-scaling.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8f67df736f13d4edc055110a7a6d619a00a22eaf
          persist-credentials: false
      - name: Inspect exact source and existing construction counters
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object src/buster/lib/compiler/frontend/c/c_gen.c
          uname -a
          clang --version
          python3 - <<'PY'
          from pathlib import Path
          targets = {
              'src/buster/lib/compiler/frontend/c/c_gen.c': ['c_ir_predeclare_labeled_automatic_locals', 'c_ir_lower_function'],
              'src/buster/lib/compiler/ir/ir.h': ['IR_CONSTRUCTION_COUNTER', 'IrConstruction'],
              'src/buster/lib/compiler/ir/ir.c': ['IR_CONSTRUCTION_RECORD'],
              '.github/workflows/ci.yml': ['build.c -o', 'BUSTER_BENCH_ALLOCATIONS'],
          }
          for filename, needles in targets.items():
              p = Path(filename)
              if not p.exists():
                  print('MISSING', filename)
                  continue
              lines = p.read_text().splitlines()
              for needle in needles:
                  hits = [i for i, line in enumerate(lines) if needle in line]
                  print('HITS', filename, needle, [i+1 for i in hits])
                  for i in hits[:3]:
                      for j in range(max(0, i-3), min(len(lines), i+105)):
                          print(f'{filename}:{j+1}: {lines[j]}')
          for filename in ['LICENSE', 'LICENSE.md', 'LICENSE.txt']:
              p = Path(filename)
              if p.exists():
                  print('LICENSE', filename, p.read_text()[:3000])
          PY
