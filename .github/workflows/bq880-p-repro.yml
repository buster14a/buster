name: bq880 P repro (scratch)

on:
  push:
    branches:
      - codex/880-p-repro
    paths:
      - .github/workflows/bq880-p-repro.yml
      - .github/workflows/issue1162-exact-systemd-slice.yml
      - .github/scripts/issue1162_exact_systemd_slice.sh
      - .github/scripts/issue1162_live_probe.py
      - .github/scripts/issue1162_stage_observer.py
      - .github/scripts/issue1162_workspace_observer.py
      - .github/scripts/issue1162_manager_denial_probe.py
      - .github/scripts/issue1162_broker_observer.py
      - .github/scripts/issue1162_broker_evidence.py
      - .github/scripts/issue1162_broker_entry_evidence.py
      - .github/scripts/issue1162_frozen_tree_evidence.py
      - .github/scripts/issue1162_ancestor_preflight_test.py

concurrency:
  group: issue1162-exact-systemd-slice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  isolated-slice:
    if: github.repository == 'buster14a/buster' && github.ref == 'refs/heads/codex/880-p-repro'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run pinned source in disposable real systemd guest
        shell: bash
        env:
          BQ_P_REPRO: "1"
          BQ_P_REPRO_UPGRADE: bf9efa7de89ee13ede1ecec8fb97e21ee14f9626
        run: bash .github/scripts/issue1162_exact_systemd_slice.sh
      - name: Retain all isolated diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bq880-p-repro
          path: ${{ runner.temp }}/issue1162-exact-slice-evidence
          if-no-files-found: warn
          retention-days: 7
