name: Publish integer literal audit implementation

on:
  push:
    branches: [audit/lexer-parser-source-20260907]
    paths: [.github/workflows/publish-integer-literal-audit.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-integer-literals-148
      - name: Apply the byte-verified, locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ebfdd11705bc470564e726857e498f1c82aa746c
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/lexer-audit-base-ebfdd11.tar.gz"
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          chunks = [
              '',
              '',
              '',
              '',
              '',
              '',
              '',
          ]
          assert list(map(len, chunks)) == [1000, 1000, 1000, 1000, 1000, 1000, 400]
          patch = gzip.decompress(base64.b64decode(''.join(chunks), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '72f964997447cba12606e5c8553653bd7b04b55d01a05f1ac15694cd7eaddf09'
          Path(os.environ['RUNNER_TEMP'], 'integer.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/integer.patch"
          git apply --index "$RUNNER_TEMP/integer.patch"
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git commit -m 'c: validate integer literal grammar, overflow and diagnostic locations'
          git push origin HEAD:refs/heads/fix/frontend-integer-literals-148
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/lexer-audit-integer-head.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/integer-head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: integer-148-rebased-source
          path: |
            ${{ runner.temp }}/lexer-audit-*.tar.gz
            ${{ runner.temp }}/integer-head.txt
          if-no-files-found: error
          retention-days: 1
