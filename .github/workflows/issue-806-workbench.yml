name: Issue 806 isolated workbench

on:
  push:
    branches: [chatgpt/issue-806-workbench]
    paths: [.github/workflows/issue-806-workbench.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: 0
      BUSTER_ORACLE_CACHE: check
    steps:
      - name: Read isolated editing recipe
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: recipe
          persist-credentials: false
      - name: Check out exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: c2aa76aae918172f23e8ed932c25da3c21f4c593
          path: source
          persist-credentials: true
      - name: Apply final capability audit without workbench files
        working-directory: source
        run: |
          set -euo pipefail
          python3 ../recipe/.github/issue-806-final-audit.py
          git add src/buster/compiler/c_preprocessor.c src/buster/compiler/c_preprocessor_feature_test.c docs/c-preprocessor.md
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git switch -c chatgpt/issue-806-qualified-2
          git commit -m 'Keep unsupported native overloadable attribute unadvertised (#806)'
          git push origin HEAD:refs/heads/chatgpt/issue-806-qualified-2
          git rev-parse HEAD | tee "$RUNNER_TEMP/issue-806-head.txt"
      - name: Install pinned official Clang 23.1.4
        working-directory: source
        run: bash tools/ci/setup-hosted.sh
      - name: Build complete compiler
        working-directory: source
        run: set -o pipefail; ./build.sh 2>&1 | tee "$RUNNER_TEMP/issue-806-build.log"
      - name: Preprocessor and Clang oracle
        if: success()
        continue-on-error: true
        working-directory: source
        run: set -o pipefail; ./build/compiler test-preprocessor --clang 2>&1 | tee "$RUNNER_TEMP/issue-806-preprocessor.log"
      - name: Source checker and native programs
        if: success()
        continue-on-error: true
        working-directory: source
        run: set -o pipefail; ./build/compiler test-checker --seed 806 2>&1 | tee "$RUNNER_TEMP/issue-806-checker.log"
      - name: Call graph
        if: success()
        continue-on-error: true
        working-directory: source
        run: set -o pipefail; ./build.sh check-call-graph 2>&1 | tee "$RUNNER_TEMP/issue-806-call-graph.log"
      - name: Retain exact source for review
        if: always()
        working-directory: source
        run: git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/issue-806-candidate.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-806-validation
          path: ${{ runner.temp }}/issue-806-*
          retention-days: 3
