name: Apply PR 94 arena call-site diagnostics

on:
  push:
    branches:
      - claude/unruffled-bhabha-f5d28a

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.repository == 'buster14a/buster' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Add build-driver arena call-site diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.c")
          text = path.read_text(encoding="utf-8")
          old = '''#include <buster/lib/string.c>
          #include <buster/lib/os.c>
          #define BUSTER_ARENA_CAPACITY_DIAGNOSTICS 1
          #include <buster/lib/arena.c>
          #include <buster/lib/file.c>
          '''
          new = '''BUSTER_GLOBAL_LOCAL void* arena_allocate_bytes_with_location(Arena* arena, u64 size, u64 alignment, const char* file, u32 line);
          #define arena_allocate_bytes(arena, size, alignment) arena_allocate_bytes_with_location((arena), (size), (alignment), __FILE__, __LINE__)
          #include <buster/lib/string.c>
          #include <buster/lib/os.c>
          #undef arena_allocate_bytes
          #define BUSTER_ARENA_CAPACITY_DIAGNOSTICS 1
          #include <buster/lib/arena.c>

          BUSTER_GLOBAL_LOCAL void* arena_allocate_bytes_with_location(Arena* arena, u64 size, u64 alignment, const char* file, u32 line)
          {
              if (BUSTER_UNLIKELY(arena && (arena->position > arena->reserved_size || size > arena->reserved_size - arena->position)))
              {
                  fprintf(stderr, "ARENA_CALLSITE file=%s line=%u position=%llu size=%llu alignment=%llu reserved=%llu\\n", file, line,
                          (unsigned long long)arena->position, (unsigned long long)size, (unsigned long long)alignment,
                          (unsigned long long)arena->reserved_size);
                  fflush(stderr);
              }
              return arena_allocate_bytes(arena, size, alignment);
          }

          #define arena_allocate_bytes(arena, size, alignment) arena_allocate_bytes_with_location((arena), (size), (alignment), __FILE__, __LINE__)
          #include <buster/lib/file.c>
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"build.c: expected one replacement site, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit diagnostics and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-pr94-callsite-diagnostics.yml
          git config user.name "David"
          git config user.email "davidgmbb@gmail.com"
          git add build.c .github/workflows/apply-pr94-callsite-diagnostics.yml
          git diff --cached --check
          git commit -m "ci: identify arena capacity failure call sites"
          git push origin "HEAD:${GITHUB_REF_NAME}"
