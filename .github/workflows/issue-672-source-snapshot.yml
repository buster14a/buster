name: Issue 672 source snapshot

on:
  push:
    branches: [fix/672-binary16-codegen]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Archive tracked source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/issue-672-source.tar.gz" HEAD
      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-672-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-672-source.tar.gz
          retention-days: 1
          if-no-files-found: error
