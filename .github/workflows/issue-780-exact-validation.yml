name: Issue 780 exact Android validation

on:
  push:
    branches:
      - fix/780-android-sdk-retries

permissions:
  contents: read

env:
  BUSTER_ANDROID_SYSTEM_IMAGE: "system-images;android-35;google_apis;x86_64"

jobs:
  android:
    name: Exact Android x86-64
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact clean PR head
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: cd04da0a8063ffa0f0a308d48cceb884f0777cdb
          persist-credentials: false

      - name: Validate helper and workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ci_android_sdk.py tools/mobile_coverage.py tests/ci_android_sdk_test.py
          python3 tests/ci_android_sdk_test.py -v
          go run github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 -color .github/workflows/ci.yml

      - name: Grant the runner access to KVM
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator system image
        id: android_sdk
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          sdkmanager=$(command -v sdkmanager || true)
          if [[ -z $sdkmanager ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n 1)
          fi
          if [[ -z $sdkmanager ]]; then
            echo "error: sdkmanager was not found under $ANDROID_HOME" >&2
            exit 1
          fi
          printf '%s\n' "$(dirname "$sdkmanager")" >>"$GITHUB_PATH"
          python3 tools/ci_android_sdk.py \
            --sdkmanager "$sdkmanager" \
            --sdk-root "$ANDROID_HOME" \
            --log-directory "$RUNNER_TEMP/buster-ci" \
            --attempts 3 \
            --attempt-timeout-seconds 300 \
            --backoff-seconds 5 \
            --package emulator \
            --package "platforms;android-35" \
            --package "$BUSTER_ANDROID_SYSTEM_IMAGE"
          printf '%s\n' "$ANDROID_HOME/emulator" "$ANDROID_HOME/platform-tools" >>"$GITHUB_PATH"

      - name: Test Android Debug and Release
        id: android
        shell: bash
        env:
          BUSTER_ANDROID_AVD: buster-ci
          BUSTER_ANDROID_DEVICE: pixel_6
          BUSTER_ANDROID_EMULATOR_GPU: swiftshader_indirect
          BUSTER_ANDROID_EMULATOR_HEADLESS: "1"
          BUSTER_ANDROID_EMULATOR_LOG: ${{ runner.temp }}/buster-ci/android-emulator.log
          BUSTER_ANDROID_EMULATOR_STARTED_MARKER: ${{ runner.temp }}/buster-ci/android-emulator.started
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          exec > >(tee "$RUNNER_TEMP/buster-ci/android.log") 2>&1
          android_phase=start
          cleanup_android_emulator() {
            status=$?
            payload_status=$status
            cleanup_status=not-run
            trap - EXIT INT TERM
            if [[ $status -ne 0 && -f "${BUSTER_ANDROID_EMULATOR_LOG:-}" ]]; then
              printf 'Android emulator log follows an already-failed phase=%s status=%s\n' "$android_phase" "$payload_status" >&2
              tail -n 200 "$BUSTER_ANDROID_EMULATOR_LOG" || true
            fi
            if [[ -f "$BUSTER_ANDROID_EMULATOR_STARTED_MARKER" ]]; then
              cleanup_timeout_seconds=${BUSTER_ANDROID_CLEANUP_TIMEOUT_SECONDS:-${BUSTER_ANDROID_COMMAND_TIMEOUT_SECONDS:-30}}
              if BUSTER_ANDROID_CLEANUP_TIMEOUT_SECONDS="$cleanup_timeout_seconds" bash ./android/start_emulator_ci.sh stop; then
                cleanup_status=0
              else
                cleanup_status=$?
                echo "warning: Android emulator cleanup failed with exit status $cleanup_status" >&2
                if [[ $status -eq 0 ]]; then status=1; fi
              fi
            fi
            printf 'ANDROID_CI_RESULT phase=%s payload_status=%s cleanup_status=%s status=%s\n' "$android_phase" "$payload_status" "$cleanup_status" "$status"
            if [[ $payload_status -ne 0 ]]; then
              printf 'error: Android CI failed before final emulator cleanup (phase=%s status=%s)\n' "$android_phase" "$payload_status" >&2
            elif [[ $status -ne 0 ]]; then
              printf 'error: Android CI required emulator cleanup failed (status=%s)\n' "$cleanup_status" >&2
            fi
            exit "$status"
          }
          trap cleanup_android_emulator EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          bash ./android/start_emulator_ci.sh start
          android_phase=tests
          ./android/test_ci.sh --all

      - name: Mobile result and reproduction
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          BUSTER_CI_STEPS: ${{ toJSON(steps) }}
          BUSTER_CI_RUNNER: ubuntu-26.04
          BUSTER_CI_REQUIRED: ${{ steps.android_sdk.outcome == 'success' && 'android_sdk android' || 'android_sdk' }}
          BUSTER_CI_REPRO: See docs/ci-github-actions.md for the matching mobile SDK and lifecycle commands.
        run: python3 tools/ci_summary.py

      - name: Retain exact validation logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-780-exact-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/buster-ci/
          if-no-files-found: ignore
          retention-days: 7
