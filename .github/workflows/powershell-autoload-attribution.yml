name: PowerShell autoload attribution

# Temporary #3979 diagnostic. Branch-only; removed before the fix merges.
# Same-runner before/after for importing the two system modules by name, and
# the provisioned versus rebuilt module analysis caches for offline comparison.
on:
  push:
    branches: ['claude/festive-fermi-i37ej5']
    paths: ['.github/workflows/powershell-autoload-attribution.yml']

permissions:
  contents: read

concurrency:
  group: powershell-autoload-attribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attribute:
    if: ${{ github.server_url == 'https://github.com' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            sample: arm-1
          - os: windows-11-arm
            sample: arm-2
          - os: windows-2025
            sample: x64-control
    name: fix (${{ matrix.sample }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      BUSTER_CI_PYTHON: python
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ${{ matrix.os }}
          matrix-index: ${{ strategy.job-index }}
      - name: Require hosted execution admission
        shell: bash
        env:
          CI_ENABLED: ${{ vars.GH_ACTIONS_CI_ENABLED }}
        run: test "$CI_ENABLED" = true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}

      - name: Keep the provisioned analysis cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/caches"
          cache=$(cygpath -u "$PSModuleAnalysisCachePath")
          stat -c 'PROVISIONED_CACHE bytes=%s mtime=%y' "$cache"
          cp "$cache" "$RUNNER_TEMP/caches/provisioned.bin"
          printf 'TIME_ZONE %s utc=%s local=%s\n' "$(MSYS_NO_PATHCONV=1 tzutil /g)" "$(date -u +%FT%T)" "$(date +%FT%T%z)"
          for module in Microsoft.PowerShell.Management/Microsoft.PowerShell.Management.psd1 Microsoft.PowerShell.Utility/Microsoft.PowerShell.Utility.psd1; do
            stat -c 'MODULE_FILE %n mtime=%y' "/c/Windows/System32/WindowsPowerShell/v1.0/Modules/$module"
          done

      - name: Windows PowerShell step that imports first
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Microsoft.PowerShell.Management, Microsoft.PowerShell.Utility
          $Watch = [Diagnostics.Stopwatch]::StartNew()
          $Logs = Join-Path $env:RUNNER_TEMP 'buster-ci'
          New-Item -ItemType Directory -Force -Path $Logs | Out-Null
          Write-Output ('IMPORTED_STEP cmdlets_ms=' + $Watch.ElapsedMilliseconds + ' arch=' + [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture + ' time_zone=' + [TimeZoneInfo]::Local.Id)

      - name: Bootstrap wrapper cases with and without the import
        timeout-minutes: 20
        shell: bash
        run: |
          set +e -u
          mkdir -p "$RUNNER_TEMP/buster-ci"
          process_owner_driver="$RUNNER_TEMP/buster-ci/bootstrap-wrapper-build.exe"
          clang -Isrc -fwrapv -fno-strict-aliasing -funsigned-char build.c -Wall -Werror \
            -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -lws2_32 \
            -o "$process_owner_driver"
          "$process_owner_driver" bootstrap_process_owner_test > "$RUNNER_TEMP/buster-ci/owner.log" 2>&1
          printf 'OWNER_TEST status=%s\n' "$?"
          while IFS= read -r line; do
            line=${line%$'\r'}
            case "$line" in
              'BOOTSTRAP_PROCESS_OWNER '*) export BUSTER_WINDOWS_PROCESS_TREE="${line#BOOTSTRAP_PROCESS_OWNER }" ;;
            esac
          done < "$RUNNER_TEMP/buster-ci/owner.log"
          cases() {
            local label=$1 start end status
            start=$(date +%s%N)
            "$BUSTER_CI_PYTHON" tools/bootstrap_wrapper_cases.py --jobs 4 > "$RUNNER_TEMP/buster-ci/cases-$label.log" 2>&1
            status=$?
            end=$(date +%s%N)
            grep -o '"observed_elapsed_seconds": [0-9.]*' "$RUNNER_TEMP/buster-ci/cases-$label.log" | awk '{print $2}' | sort -n | tr '\n' ' '
            printf '\nWRAPPER_CASES variant=%s status=%s wall_ms=%s\n' "$label" "$status" "$(( (end - start) / 1000000 ))"
            if [[ $status != 0 ]]; then tail -60 "$RUNNER_TEMP/buster-ci/cases-$label.log"; fi
            stat -c "CACHE_AFTER_$label bytes=%s mtime=%y" "$(cygpath -u "$PSModuleAnalysisCachePath")"
          }
          # The import variant runs first: its launches never write the cache.
          cases import
          cp build.ps1 "$RUNNER_TEMP/build.ps1.import"
          sed -i '/^Import-Module Microsoft.PowerShell.Management, Microsoft.PowerShell.Utility\r\?$/d' build.ps1
          git diff --stat
          cases no-import
          cp "$RUNNER_TEMP/build.ps1.import" build.ps1
          git diff --exit-code --stat
          exit 0

      - name: VS shell helper suite with the import
        timeout-minutes: 10
        shell: bash
        run: |
          set +e
          start=$(date +%s%N)
          "$BUSTER_CI_PYTHON" tools/ci_vs_dev_shell_test.py -v > "$RUNNER_TEMP/buster-ci/vs.log" 2>&1
          status=$?
          end=$(date +%s%N)
          grep -E 'VS_PROBE_END|^Ran |^OK|^FAILED' "$RUNNER_TEMP/buster-ci/vs.log"
          printf 'VS_SUITE status=%s wall_ms=%s\n' "$status" "$(( (end - start) / 1000000 ))"
          if [[ $status != 0 ]]; then tail -80 "$RUNNER_TEMP/buster-ci/vs.log"; fi
          exit 0

      - name: Rebuild the analysis cache with a lingering process
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Microsoft.PowerShell.Management, Microsoft.PowerShell.Utility
          $Child = Join-Path $env:RUNNER_TEMP 'linger.ps1'
          Set-Content -LiteralPath $Child -Value '$null = Get-Command -Name Buster-NoSuchCommand -ErrorAction SilentlyContinue; [Threading.Thread]::Sleep(25000)'
          $Watch = [Diagnostics.Stopwatch]::StartNew()
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $Child
          Write-Output ('LINGER_MS=' + $Watch.ElapsedMilliseconds)
          Copy-Item -LiteralPath $env:PSModuleAnalysisCachePath -Destination (Join-Path $env:RUNNER_TEMP 'caches\rebuilt.bin')
          Get-Item -LiteralPath $env:PSModuleAnalysisCachePath | Format-List Length, LastWriteTimeUtc | Out-String

      - name: Retain caches
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analysis-caches-${{ matrix.sample }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/caches/
            ${{ runner.temp }}/buster-ci/
          if-no-files-found: ignore
