name: PowerShell autoload attribution

# Temporary #3979 diagnostic. Branch-only; removed before the fix merges.
# Attributes the ~23 s Windows PowerShell 5.1 command-discovery cost on hosted
# Windows ARM64 against a windows-2025 control. Policy is observed only.
on:
  push:
    branches: ['claude/festive-fermi-i37ej5']
    paths: ['.github/workflows/powershell-autoload-attribution.yml']

permissions:
  contents: read

concurrency:
  group: powershell-autoload-attribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attribute:
    if: ${{ github.server_url == 'https://github.com' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            sample: arm-1
          - os: windows-11-arm
            sample: arm-2
          - os: windows-2025
            sample: x64-control
    name: discovery (${{ matrix.sample }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ${{ matrix.os }}
          matrix-index: ${{ strategy.job-index }}
      - name: Require hosted execution admission
        shell: bash
        env:
          CI_ENABLED: ${{ vars.GH_ACTIONS_CI_ENABLED }}
        run: test "$CI_ENABLED" = true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}

      # First PowerShell step in the job: the image's cache state is untouched.
      - name: Trace first command discovery
        shell: powershell
        run: |
          $Cache = $env:PSModuleAnalysisCachePath
          if ([IO.File]::Exists($Cache)) { $Info = [IO.FileInfo]::new($Cache); [Console]::Out.WriteLine('IMAGE_CACHE bytes=' + $Info.Length + ' mtime=' + $Info.LastWriteTimeUtc.ToString('o')) } else { [Console]::Out.WriteLine('IMAGE_CACHE missing ' + $Cache) }
          [Console]::Out.WriteLine('ARCH=' + [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture + ' LANGUAGE_MODE=' + $ExecutionContext.SessionState.LanguageMode)
          try { [Console]::Out.WriteLine('SYSTEM_LOCKDOWN=' + [System.Management.Automation.Security.SystemPolicy]::GetSystemLockdownPolicy()) } catch { [Console]::Out.WriteLine('SYSTEM_LOCKDOWN_ERROR=' + $_.Exception.Message) }
          $Trace = [IO.Path]::Combine($env:RUNNER_TEMP, 'discovery-trace.log')
          $Watch = [Diagnostics.Stopwatch]::StartNew()
          Microsoft.PowerShell.Utility\Trace-Command -Name CommandDiscovery, '*Module*' -Expression { $null = Write-Output probe } -FilePath $Trace -ListenerOption Timestamp
          [Console]::Out.WriteLine('TRACED_WRITE_OUTPUT_MS=' + $Watch.ElapsedMilliseconds)
          $Lines = [IO.File]::ReadAllLines($Trace)
          [Console]::Out.WriteLine('TRACE_LINES=' + $Lines.Length)
          $Frequency = [double][Diagnostics.Stopwatch]::Frequency
          $Previous = $null
          $Message = ''
          $PreviousMessage = ''
          $Gaps = [Collections.Generic.List[string]]::new()
          foreach ($Line in $Lines) {
            if ($Line -match '^\s+Timestamp=(\d+)') {
              $Stamp = [long]$Matches[1]
              if ($null -ne $Previous) { $Gaps.Add(('{0,10:F1} ms after: {1}' -f (($Stamp - $Previous) * 1000.0 / $Frequency), $PreviousMessage)) }
              $Previous = $Stamp
              $PreviousMessage = $Message
            } elseif ($Line -notmatch '^\s') {
              $Message = $Line
            }
          }
          [Console]::Out.WriteLine('== largest gaps')
          foreach ($Gap in ($Gaps | Microsoft.PowerShell.Utility\Sort-Object -Descending | Microsoft.PowerShell.Utility\Select-Object -First 40)) { [Console]::Out.WriteLine('GAP ' + $Gap) }
          [Console]::Out.WriteLine('== distinct messages')
          $Lines | Microsoft.PowerShell.Core\Where-Object { $_ -notmatch '^\s' } | ForEach-Object { ($_ -replace '[0-9a-fA-F]{8}-[0-9a-fA-F-]{27}', 'GUID') -replace '\d+', 'N' } |
            Microsoft.PowerShell.Utility\Group-Object | Microsoft.PowerShell.Utility\Sort-Object Count -Descending |
            Microsoft.PowerShell.Utility\Select-Object -First 60 | ForEach-Object { [Console]::Out.WriteLine(('{0,6} {1}' -f $_.Count, $_.Name)) }
          [Console]::Out.WriteLine('== first trace lines')
          $Lines | Microsoft.PowerShell.Utility\Select-Object -First 120 | ForEach-Object { [Console]::Out.WriteLine($_) }
          if ([IO.File]::Exists($Cache)) { $Info = [IO.FileInfo]::new($Cache); [Console]::Out.WriteLine('CACHE_AFTER_TRACE bytes=' + $Info.Length + ' mtime=' + $Info.LastWriteTimeUtc.ToString('o')) }

      - name: Policy state (observed only)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          [Console]::Out.WriteLine('PSLockdownPolicy=' + $env:__PSLockdownPolicy)
          $Path = [IO.Path]::Combine($PSHOME, 'Modules\Microsoft.PowerShell.Utility\Microsoft.PowerShell.Utility.psm1')
          try {
            $Watch = [Diagnostics.Stopwatch]::StartNew()
            for ($Index = 0; $Index -lt 50; $Index += 1) { $Mode = [System.Management.Automation.Security.SystemPolicy]::GetLockdownPolicy($Path, $null) }
            [Console]::Out.WriteLine('FILE_LOCKDOWN=' + $Mode + ' x50_ms=' + $Watch.ElapsedMilliseconds)
          } catch { [Console]::Out.WriteLine('FILE_LOCKDOWN_ERROR=' + $_.Exception.Message) }
          Get-ExecutionPolicy -List | Format-Table -AutoSize | Out-String -Width 200
          Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\CI\Policy' -ErrorAction SilentlyContinue | Format-List | Out-String -Width 200
          Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Safer\CodeIdentifiers' -ErrorAction SilentlyContinue | Format-List | Out-String -Width 200
          Get-Service AppIDSvc -ErrorAction SilentlyContinue | Format-List Name, Status, StartType | Out-String
          try { (Get-AppLockerPolicy -Effective -Xml) } catch { 'APPLOCKER_ERROR ' + $_.Exception.Message }
          try { Get-CimInstance -Namespace root\Microsoft\Windows\DeviceGuard -ClassName Win32_DeviceGuard | Format-List CodeIntegrityPolicyEnforcementStatus, UsermodeCodeIntegrityPolicyEnforcementStatus, SecurityServicesRunning, VirtualizationBasedSecurityStatus | Out-String } catch { 'DEVICEGUARD_ERROR ' + $_.Exception.Message }
          $CiTool = [IO.Path]::Combine($env:SystemRoot, 'System32\CiTool.exe')
          if ([IO.File]::Exists($CiTool)) { & $CiTool --list-policies 2>&1 | Select-Object -First 80 } else { 'CITOOL missing' }
          foreach ($Root in $env:PSModulePath.Split(';')) {
            if ($Root -and [IO.Directory]::Exists($Root)) {
              $Files = [IO.Directory]::GetFiles($Root, '*', [IO.SearchOption]::AllDirectories)
              $Script = @($Files | Where-Object { $_ -match '\.(psd1|psm1|ps1|ps1xml|cdxml)$' }).Count
              [Console]::Out.WriteLine('MODULE_ROOT ' + $Root + ' modules=' + [IO.Directory]::GetDirectories($Root).Length + ' files=' + $Files.Length + ' script_files=' + $Script)
            }
          }

      - name: Analysis-cache persistence across ARM64-native children
        shell: powershell
        run: |
          $Child = [IO.Path]::Combine($env:RUNNER_TEMP, 'child.ps1')
          [IO.File]::WriteAllText($Child, @'
          $Watch = [Diagnostics.Stopwatch]::StartNew()
          $null = Write-Output probe
          $Elapsed = $Watch.ElapsedMilliseconds
          if ($env:CHILD_LINGER_MS) { [Threading.Thread]::Sleep([int]$env:CHILD_LINGER_MS) }
          [Console]::Out.WriteLine('stmt_ms=' + $Elapsed + ' arch=' + [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)
          '@)
          function Show-Cache([string]$Label) {
            $Path = $env:PSModuleAnalysisCachePath
            if ([IO.File]::Exists($Path)) { $Info = [IO.FileInfo]::new($Path); [Console]::Out.WriteLine('CACHE ' + $Label + ' bytes=' + $Info.Length + ' mtime=' + $Info.LastWriteTimeUtc.ToString('o')) } else { [Console]::Out.WriteLine('CACHE ' + $Label + ' missing') }
          }
          function Invoke-Child([string]$Label, [string]$Linger) {
            $env:CHILD_LINGER_MS = $Linger
            $Watch = [Diagnostics.Stopwatch]::StartNew()
            $Output = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $Child
            [Console]::Out.WriteLine('RUN ' + $Label + ' linger_ms=' + $Linger + ' wall_ms=' + $Watch.ElapsedMilliseconds + ' ' + ($Output -join ' '))
            Show-Cache $Label
          }
          Show-Cache 'machine-start'
          Invoke-Child 'machine-1' '0'
          Invoke-Child 'machine-2' '0'
          Invoke-Child 'machine-3-linger' '25000'
          Invoke-Child 'machine-4' '0'
          Invoke-Child 'machine-5' '0'
          $Fresh = [IO.Path]::Combine($env:RUNNER_TEMP, 'fresh-cache')
          $null = [IO.Directory]::CreateDirectory($Fresh)
          $env:PSModuleAnalysisCachePath = [IO.Path]::Combine($Fresh, 'ModuleAnalysisCache')
          Show-Cache 'fresh-start'
          Invoke-Child 'fresh-1' '0'
          Invoke-Child 'fresh-2-linger' '25000'
          Invoke-Child 'fresh-3' '0'
          Invoke-Child 'fresh-4' '0'
