name: PowerShell autoload attribution

# Temporary #3979 diagnostic. Branch-only; removed before the fix merges.
# Attributes the ~23 s Windows PowerShell 5.1 module-autoload cost on hosted
# Windows ARM64 against a windows-2025 control. Defender is observed only.
on:
  push:
    branches: ['claude/festive-fermi-i37ej5']
    paths: ['.github/workflows/powershell-autoload-attribution.yml']

permissions:
  contents: read

concurrency:
  group: powershell-autoload-attribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attribute:
    if: ${{ github.server_url == 'https://github.com' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            sample: arm-1
          - os: windows-11-arm
            sample: arm-2
          - os: windows-2025
            sample: x64-control
    name: autoload (${{ matrix.sample }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      BUSTER_CI_PYTHON: python
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ${{ matrix.os }}
          matrix-index: ${{ strategy.job-index }}
      - name: Require hosted execution admission
        shell: bash
        env:
          CI_ENABLED: ${{ vars.GH_ACTIONS_CI_ENABLED }}
        run: test "$CI_ENABLED" = true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}

      - name: Write probe scripts
        shell: bash
        run: |
          set -euo pipefail
          probes="$RUNNER_TEMP/ps-probes"
          mkdir -p "$probes"
          # Every probe uses only .NET calls around one statement so the
          # statement is the only command PowerShell may need to autoload.
          cat > "$probes/suffix.ps1.txt" <<'EOF'
          $__p = [Diagnostics.Process]::GetCurrentProcess()
          [Console]::Out.WriteLine('PROBE_INTERNAL stmt_ms=' + $__sw.ElapsedMilliseconds + ' cpu_ms=' + [int]$__p.TotalProcessorTime.TotalMilliseconds + ' threads=' + $__p.Threads.Count)
          try { $__c = [Diagnostics.PerformanceCounter]::new('.NET CLR Jit', '# of Methods Jitted', $__p.ProcessName, $true); [Console]::Out.WriteLine('JIT_METHODS=' + $__c.RawValue) } catch { [Console]::Out.WriteLine('JIT_COUNTER_ERROR=' + $_.Exception.Message) }
          EOF
          write_probe() {
            printf '%s\n%s\n' '$__sw = [Diagnostics.Stopwatch]::StartNew()' "$2" > "$probes/$1.ps1"
            cat "$probes/suffix.ps1.txt" >> "$probes/$1.ps1"
          }
          write_probe none '$null = 1'
          write_probe write_output '$null = Write-Output probe'
          write_probe write_output_qualified '$null = Microsoft.PowerShell.Utility\Write-Output probe'
          write_probe join_path '$null = Join-Path a b'
          write_probe join_path_qualified '$null = Microsoft.PowerShell.Management\Join-Path a b'
          write_probe import_utility 'Import-Module Microsoft.PowerShell.Utility'
          write_probe load_utility_assembly '$null = [Reflection.Assembly]::Load("Microsoft.PowerShell.Commands.Utility, Version=3.0.0.0, Culture=neutral, PublicKeyToken=31bf3856ad364e35")'
          write_probe exit_zero 'exit 0'
          write_probe throw 'throw "probe"'
          write_probe environment_exit '[Environment]::Exit(0)'
          write_probe module_path '[Console]::Out.WriteLine("PSMODULEPATH=" + $env:PSModulePath); $null = Write-Output probe'
          cat > "$probes/modules.ps1" <<'EOF'
          $null = Write-Output probe
          $null = Join-Path a b
          foreach ($m in [Diagnostics.Process]::GetCurrentProcess().Modules) { [Console]::Out.WriteLine('MODULE ' + $m.FileName) }
          foreach ($a in [AppDomain]::CurrentDomain.GetAssemblies()) { if (-not $a.IsDynamic) { [Console]::Out.WriteLine('ASSEMBLY ' + $a.FullName + ' | ' + $a.Location + ' | gac=' + $a.GlobalAssemblyCache) } }
          EOF
          cat > "$probes/report.ps1" <<'EOF'
          [Console]::Out.WriteLine('PS_VERSION=' + $PSVersionTable.PSVersion + ' CLR=' + $PSVersionTable.CLRVersion + ' BUILD=' + $PSVersionTable.BuildVersion)
          [Console]::Out.WriteLine('PROCESSOR_ARCHITECTURE=' + $env:PROCESSOR_ARCHITECTURE + ' Is64BitProcess=' + [Environment]::Is64BitProcess)
          try { [Console]::Out.WriteLine('PROCESS_ARCH=' + [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture + ' OS_ARCH=' + [Runtime.InteropServices.RuntimeInformation]::OSArchitecture + ' FRAMEWORK=' + [Runtime.InteropServices.RuntimeInformation]::FrameworkDescription) } catch { [Console]::Out.WriteLine('RUNTIME_INFO_ERROR=' + $_.Exception.Message) }
          [Console]::Out.WriteLine('PSHOME=' + $PSHOME)
          [Console]::Out.WriteLine('PSMODULEPATH=' + $env:PSModulePath)
          [Console]::Out.WriteLine('ANALYSIS_CACHE_ENV=' + $env:PSModuleAnalysisCachePath)
          foreach ($d in $env:PSModulePath.Split(';')) { if ($d -and [IO.Directory]::Exists($d)) { [Console]::Out.WriteLine('MODULE_ROOT ' + $d + ' modules=' + [IO.Directory]::GetDirectories($d).Length) } else { [Console]::Out.WriteLine('MODULE_ROOT_MISSING ' + $d) } }
          foreach ($m in [Diagnostics.Process]::GetCurrentProcess().Modules) { [Console]::Out.WriteLine('STARTUP_MODULE ' + $m.FileName) }
          EOF
          cat > "$probes/cache.ps1" <<'EOF'
          $__cache = [IO.Path]::Combine($env:LOCALAPPDATA, 'Microsoft\Windows\PowerShell')
          if ([IO.Directory]::Exists($__cache)) { foreach ($f in [IO.Directory]::GetFiles($__cache)) { $i = [IO.FileInfo]::new($f); [Console]::Out.WriteLine('CACHE_FILE ' + $f + ' bytes=' + $i.Length + ' mtime=' + $i.LastWriteTimeUtc.ToString('o')) } } else { [Console]::Out.WriteLine('CACHE_DIR_MISSING ' + $__cache) }
          EOF
          cat > "$probes/defender.ps1" <<'EOF'
          Get-MpComputerStatus | Format-List AMProductVersion,AMRunningMode,AMServiceEnabled,RealTimeProtectionEnabled,OnAccessProtectionEnabled,BehaviorMonitorEnabled,IsTamperProtected
          $p = Get-MpPreference
          'ExclusionPath=' + ($p.ExclusionPath -join ';')
          'ExclusionProcess=' + ($p.ExclusionProcess -join ';')
          'DisableRealtimeMonitoring=' + $p.DisableRealtimeMonitoring
          EOF
          ls -la "$probes"

      - name: Runtime, module-path and native-image state
        shell: bash
        run: |
          set -uo pipefail
          probes="$RUNNER_TEMP/ps-probes"
          command -v powershell.exe pwsh || true
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$(cygpath -w "$probes/report.ps1")" | tr -d '\r'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$(cygpath -w "$probes/cache.ps1")" | tr -d '\r'
          ls -d /c/Windows/Microsoft.NET/Framework*/v4.0.30319 || true
          for d in /c/Windows/assembly/NativeImages_*; do
            printf 'NATIVE_IMAGE_DIR %s ni_dlls=%s\n' "$d" "$(find "$d" -iname '*.ni.dll' 2>/dev/null | wc -l)"
          done
          find /c/Windows/assembly/NativeImages_* -iname '*.ni.dll' 2>/dev/null \
            | grep -i -E 'powershell|management\.automation|Microsoft\.Management|System\.Xml\.dll|System\.Core|System\.Management\.ni' | sort || true
          if [[ -d /c/Windows/Microsoft.NET/FrameworkArm64/v4.0.30319 ]]; then
            ngen=/c/Windows/Microsoft.NET/FrameworkArm64/v4.0.30319/ngen.exe
          else
            ngen=/c/Windows/Microsoft.NET/Framework64/v4.0.30319/ngen.exe
          fi
          printf 'NGEN %s\n' "$ngen"
          for name in System.Management.Automation Microsoft.PowerShell.Commands.Utility Microsoft.PowerShell.Commands.Management Microsoft.PowerShell.ConsoleHost; do
            printf 'NGEN_DISPLAY %s\n' "$name"
            MSYS_NO_PATHCONV=1 "$ngen" display "$name" /nologo 2>&1 | tr -d '\r' | head -40
          done
          MSYS_NO_PATHCONV=1 "$ngen" queue status /nologo 2>&1 | tr -d '\r' | head -20
          printf 'NGEN_ROOTS_TOTAL %s\n' "$(MSYS_NO_PATHCONV=1 "$ngen" display /nologo 2>&1 | wc -l)"
          MSYS_NO_PATHCONV=1 "$ngen" display /nologo 2>&1 | tr -d '\r' | grep -i -E 'pending|PowerShell|Management.Automation' | head -60

      - name: Autoload probes before intervention
        shell: bash
        run: |
          set -uo pipefail
          probes="$RUNNER_TEMP/ps-probes"
          ps=(powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File)
          probe() {
            local label=$1 script=$2
            shift 2
            local log="$probes/before-$label.log" start end status
            start=$(date +%s%N)
            "$@" "$(cygpath -w "$probes/$script.ps1")" > "$log" 2>&1
            status=$?
            end=$(date +%s%N)
            printf 'PS_PROBE phase=before label=%s status=%s wall_ms=%s %s\n' "$label" "$status" \
              "$(( (end - start) / 1000000 ))" "$(grep -h -E '^(PROBE_INTERNAL|JIT_|PSMODULEPATH)' "$log" | tr -d '\r' | tr '\n' ' ')"
          }
          cache() { "${ps[@]}" "$(cygpath -w "$probes/cache.ps1")" | tr -d '\r'; }
          cache
          for round in 1 2; do
            probe "none-$round" none "${ps[@]}"
            probe "write_output-$round" write_output "${ps[@]}"
            cache
            probe "join_path-$round" join_path "${ps[@]}"
            probe "write_output_qualified-$round" write_output_qualified "${ps[@]}"
            probe "join_path_qualified-$round" join_path_qualified "${ps[@]}"
            probe "restricted_module_path-$round" module_path env "PSModulePath=C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\Modules" "${ps[@]}"
          done
          probe import_utility import_utility "${ps[@]}"
          probe load_utility_assembly load_utility_assembly "${ps[@]}"
          probe exit_zero exit_zero "${ps[@]}"
          probe throw throw "${ps[@]}"
          probe environment_exit environment_exit "${ps[@]}"
          probe command_write_output write_output powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command '&'
          if command -v pwsh > /dev/null; then
            probe pwsh_none none pwsh -NoProfile -NonInteractive -File
            probe pwsh_write_output write_output pwsh -NoProfile -NonInteractive -File
          fi
          cache
          "${ps[@]}" "$(cygpath -w "$probes/modules.ps1")" | tr -d '\r' > "$probes/modules-before.log"
          grep -c '^MODULE ' "$probes/modules-before.log"
          cat "$probes/modules-before.log"

      - name: Bootstrap wrapper cases before intervention
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buster-ci"
          process_owner_driver="$RUNNER_TEMP/buster-ci/bootstrap-wrapper-build.exe"
          clang -Isrc -fwrapv -fno-strict-aliasing -funsigned-char build.c -Wall -Werror \
            -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -lws2_32 \
            -o "$process_owner_driver"
          "$process_owner_driver" bootstrap_process_owner_test | tee "$RUNNER_TEMP/buster-ci/owner-before.log"
          while IFS= read -r line; do
            line=${line%$'\r'}
            case "$line" in
              'BOOTSTRAP_PROCESS_OWNER '*) export BUSTER_WINDOWS_PROCESS_TREE="${line#BOOTSTRAP_PROCESS_OWNER }" ;;
            esac
          done < "$RUNNER_TEMP/buster-ci/owner-before.log"
          start=$(date +%s%N)
          status=0
          "$BUSTER_CI_PYTHON" tools/bootstrap_wrapper_cases.py --jobs 4 > "$RUNNER_TEMP/buster-ci/cases-before.log" 2>&1 || status=$?
          end=$(date +%s%N)
          grep -E 'BOOTSTRAP_PROCESS .*finish|BOOTSTRAP_CASE_SUMMARY' "$RUNNER_TEMP/buster-ci/cases-before.log" | cut -c1-400 || true
          printf 'WRAPPER_CASES phase=before status=%s wall_ms=%s\n' "$status" "$(( (end - start) / 1000000 ))"

      - name: Native-image intervention for autoloaded GAC assemblies
        timeout-minutes: 15
        shell: bash
        run: |
          set -uo pipefail
          probes="$RUNNER_TEMP/ps-probes"
          if [[ -d /c/Windows/Microsoft.NET/FrameworkArm64/v4.0.30319 ]]; then
            ngen=/c/Windows/Microsoft.NET/FrameworkArm64/v4.0.30319/ngen.exe
          else
            ngen=/c/Windows/Microsoft.NET/Framework64/v4.0.30319/ngen.exe
          fi
          candidates=()
          while IFS= read -r full; do
            name=${full%%,*}
            if grep -i -q -F "\\$name.ni.dll" "$probes/modules-before.log"; then
              printf 'NATIVE_IMAGE_LOADED %s\n' "$name"
            else
              printf 'IL_ONLY %s\n' "$full"
              candidates+=("$full")
            fi
          done < <(grep '^ASSEMBLY ' "$probes/modules-before.log" | grep 'gac=True' | sed -E 's/^ASSEMBLY ([^|]*) \| .*$/\1/' | sed -E 's/ +$//')
          total_start=$(date +%s%N)
          for full in "${candidates[@]}"; do
            start=$(date +%s%N)
            MSYS_NO_PATHCONV=1 "$ngen" install "$full" /nologo > "$probes/ngen.log" 2>&1
            status=$?
            end=$(date +%s%N)
            printf 'NGEN_INSTALL status=%s wall_ms=%s %s\n' "$status" "$(( (end - start) / 1000000 ))" "$full"
            tr -d '\r' < "$probes/ngen.log" | tail -5
          done
          total_end=$(date +%s%N)
          printf 'NGEN_INSTALL_TOTAL candidates=%s wall_ms=%s\n' "${#candidates[@]}" "$(( (total_end - total_start) / 1000000 ))"

      - name: Autoload probes after intervention
        shell: bash
        run: |
          set -uo pipefail
          probes="$RUNNER_TEMP/ps-probes"
          ps=(powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File)
          probe() {
            local label=$1 script=$2
            shift 2
            local log="$probes/after-$label.log" start end status
            start=$(date +%s%N)
            "$@" "$(cygpath -w "$probes/$script.ps1")" > "$log" 2>&1
            status=$?
            end=$(date +%s%N)
            printf 'PS_PROBE phase=after label=%s status=%s wall_ms=%s %s\n' "$label" "$status" \
              "$(( (end - start) / 1000000 ))" "$(grep -h -E '^(PROBE_INTERNAL|JIT_|PSMODULEPATH)' "$log" | tr -d '\r' | tr '\n' ' ')"
          }
          for round in 1 2; do
            probe "none-$round" none "${ps[@]}"
            probe "write_output-$round" write_output "${ps[@]}"
            probe "join_path-$round" join_path "${ps[@]}"
            probe "write_output_qualified-$round" write_output_qualified "${ps[@]}"
          done
          "${ps[@]}" "$(cygpath -w "$probes/modules.ps1")" | tr -d '\r' > "$probes/modules-after.log"
          grep -i '\.ni\.dll' "$probes/modules-after.log" | sed 's/^MODULE //' | sort

      - name: Bootstrap wrapper cases after intervention
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            line=${line%$'\r'}
            case "$line" in
              'BOOTSTRAP_PROCESS_OWNER '*) export BUSTER_WINDOWS_PROCESS_TREE="${line#BOOTSTRAP_PROCESS_OWNER }" ;;
            esac
          done < "$RUNNER_TEMP/buster-ci/owner-before.log"
          start=$(date +%s%N)
          status=0
          "$BUSTER_CI_PYTHON" tools/bootstrap_wrapper_cases.py --jobs 4 > "$RUNNER_TEMP/buster-ci/cases-after.log" 2>&1 || status=$?
          end=$(date +%s%N)
          grep -E 'BOOTSTRAP_PROCESS .*finish|BOOTSTRAP_CASE_SUMMARY' "$RUNNER_TEMP/buster-ci/cases-after.log" | cut -c1-400 || true
          printf 'WRAPPER_CASES phase=after status=%s wall_ms=%s\n' "$status" "$(( (end - start) / 1000000 ))"

      - name: Observe Defender state
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$(cygpath -w "$RUNNER_TEMP/ps-probes/defender.ps1")" 2>&1 | tr -d '\r'
