name: Validate enum MSan fix for 1858

on:
  push:
    branches: [diagnostics/1829-enum-msan]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      BUSTER_HOST_ARCH: znver4
      BUSTER_SANITIZER: memory
      BUSTER_SANITIZER_OPTIMIZATION: '3'
      BUSTER_LINKER: lld
      BUSTER_DEBUG_INFO: '0'
    steps:
      - name: Check out the production fix and diagnostic workflow
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Restore verified tool inputs
        uses: ./.github/actions/hosted-tools
        with:
          artifact-name: ''
      - name: Install pinned Clang and build tools
        run: bash tools/ci/setup-hosted.sh
      - name: Check the host can execute the failing jobs' Zen 4 vector ISA
        shell: bash
        run: |
          set -euo pipefail
          lscpu
          cpu_flags=$(grep -m1 '^flags' /proc/cpuinfo)
          for feature in avx512f avx512bw avx512vl avx512dq avx512cd avx512vbmi avx512_vbmi2 avx512_vpopcntdq avx512_bitalg avx512_vnni gfni vaes aes bmi1 bmi2 abm popcnt avx2 ssse3 sse4_1 xsave; do
            grep -qw "$feature" <<< "$cpu_flags"
          done
          clang --version
          clang -### -march=znver4 -c -x c /dev/null -o /dev/null
      - name: Configure fatal MemorySanitizer and verify its detector
        run: |
          bash tools/ci/sanitizers.sh configure "$RUNNER_TEMP/sanitizer-reports"
          bash tools/ci/sanitizers.sh probe "$RUNNER_TEMP/sanitizer-probes"
      - name: Build the fixed compiler with the failing jobs' Zen 4 O3 target
        run: ./build.sh --config Release
      - name: Compare the new regression warnings with Clang through both kernels and lane counts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/enum-msan-validation
          compiler=$(./build.sh print-output --config Release)
          for count in 9 17; do
            source="tools/ci/enum-msan-$count.c"
            clang -fsyntax-only "$source" > "build/enum-msan-validation/clang-$count.log" 2>&1
            grep ': warning:' "build/enum-msan-validation/clang-$count.log" > "build/enum-msan-validation/clang-$count.warnings"
            expected=2
            if [ "$count" = 17 ]; then expected=3; fi
            test "$(wc -l < "build/enum-msan-validation/clang-$count.warnings")" -eq "$expected"
            for kernel in default scalar; do
              options=()
              if [ "$kernel" = scalar ]; then options+=(--scalar); fi
              for lanes in 1 3; do
                name="$count-$kernel-lanes$lanes"
                "$compiler" "${options[@]}" --lanes "$lanes" --verify -c -o "build/enum-msan-validation/$name.o" "$source" > "build/enum-msan-validation/$name.log" 2>&1
                grep ': warning:' "build/enum-msan-validation/$name.log" > "build/enum-msan-validation/$name.warnings"
                cmp "build/enum-msan-validation/clang-$count.warnings" "build/enum-msan-validation/$name.warnings"
                printf 'PASS: %s (%s warning messages match Clang)\n' "$name" "$expected"
              done
            done
          done
      - name: Run the exact main self-compile checks under MemorySanitizer
        shell: bash
        run: |
          set -euo pipefail
          unset CPATH C_INCLUDE_PATH
          mapfile -d '' -t flags < <(env -u BUSTER_SANITIZER -u BUSTER_SANITIZER_OPTIMIZATION -u BUSTER_FUZZ_AVAILABLE -u BUSTER_FUZZ_ENTRY \
            BUSTER_HOST_ARCH=znver5 BUSTER_DEBUG_INFO=0 ./build.sh print-compile-flags)
          test "${#flags[@]}" -gt 0
          compiler=$(./build.sh print-output --config Release)
          "$compiler" --lanes 1 --verify -c "${flags[@]}" -o build/enum-msan-validation/selected.o src/buster/compiler/main.c > build/enum-msan-validation/selected.log 2>&1
          "$compiler" --lanes 1 --verify --lower-all -c "${flags[@]}" -o build/enum-msan-validation/all.o src/buster/compiler/main.c > build/enum-msan-validation/all.log 2>&1
          "$compiler" --scalar --lanes 1 --verify --lower-all -c "${flags[@]}" -o build/enum-msan-validation/all-scalar.o src/buster/compiler/main.c > build/enum-msan-validation/all-scalar.log 2>&1
          cmp build/enum-msan-validation/all.o build/enum-msan-validation/all-scalar.o
          printf '%s\n' 'PASS: selected, lower-all, and scalar lower-all main.c self-compiles; lower-all objects identical'
      - name: Audit every sanitizer report
        if: always()
        run: bash tools/ci/sanitizers.sh audit "$RUNNER_TEMP/sanitizer-reports"
      - name: Retain logs and the exact compiler flags
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enum-msan-fix-1858-${{ github.run_attempt }}
          path: |
            build/enum-msan-validation/*.log
            build/enum-msan-validation/*.warnings
            build/compile_commands.json
            ${{ runner.temp }}/sanitizer-reports
          retention-days: 7
          if-no-files-found: warn
