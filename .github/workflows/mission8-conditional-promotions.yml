name: Mission 8 conditional promotions

on:
  push:
    branches: [diagnostics/mission8-conditional-promotions-bb96b5d0]

permissions:
  contents: read

jobs:
  equivalence:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      BUSTER_TEST_JOBS: 1
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bb96b5d08e570aff3cbd473441d71ab0dc691d67
          path: baseline
          persist-credentials: false
      - name: Freeze identities and independent Clang GCC controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mission8"
          git -C baseline rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/mission8/compiler-source.txt"
          test "$(git -C baseline rev-parse HEAD)" = bb96b5d08e570aff3cbd473441d71ab0dc691d67
          git -C transport rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/mission8/transport-source.txt"
          cp transport/tools/mission8_diagnostic.py "$RUNNER_TEMP/mission8/mission8_diagnostic.py"
          python3 transport/tools/mission8_diagnostic.py reference "$RUNNER_TEMP/mission8" 2>&1 | tee "$RUNNER_TEMP/mission8/reference.log"
      - name: Build unchanged diagnostic compiler with the hosted Clang bootstrap
        working-directory: baseline
        shell: bash
        run: |
          set -euo pipefail
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/mission8-driver" 2>&1 | tee "$RUNNER_TEMP/mission8/bootstrap.log"
          "$RUNNER_TEMP/mission8-driver" generate --cc clang --ci --linker DEFAULT -- -DBUSTER_UNITY_BUILD=OFF -DBUSTER_INCLUDE_TESTS=OFF 2>&1 | tee "$RUNNER_TEMP/mission8/generate.log"
          "$RUNNER_TEMP/mission8-driver" build --config Debug -t ide -- -j2 2>&1 | tee "$RUNNER_TEMP/mission8/build.log"
          cp build/compile_commands.json "$RUNNER_TEMP/mission8/compile_commands.json"
          cp build/CMakeCache.txt "$RUNNER_TEMP/mission8/CMakeCache.txt"
      - name: Execute all bounded compiler-path comparisons without fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 transport/tools/mission8_diagnostic.py buster "$RUNNER_TEMP/mission8" --ide baseline/build/Debug/ide 2>&1 | tee "$RUNNER_TEMP/mission8/buster.log"
          git -C baseline diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: mission8-equivalence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mission8
          if-no-files-found: error
          retention-days: 14
