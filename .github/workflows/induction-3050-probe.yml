name: Hosted inclusive induction probe 3050
on:
  push:
    branches: [codex/3050-hosted-check]
permissions:
  contents: read
jobs:
  induction:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      BUSTER_BASE: b847801169f2b73aed6496c8fa23e9a5499c94e7
      BUSTER_HEAD: 1062fdee1e2c4e4b7759c4f7f96a6cacc5449c89
      BUSTER_HOST_ARCH: vector
      BUSTER_DEBUG_INFO: '0'
      BUSTER_SANITIZER: none
      BUSTER_TOOLCHAIN: path
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 1062fdee1e2c4e4b7759c4f7f96a6cacc5449c89
          fetch-depth: 2
          persist-credentials: false
      - name: Check the runner and print the revision
        shell: bash
        run: |
          set -eu
          git rev-parse HEAD
          lscpu | grep -E '(Model name|Hypervisor vendor)'
          cc -march=x86-64-v4 -maes -mgfni -mvaes -mavx512vbmi -mavx512vbmi2 -mavx512vpopcntdq -mavx512bitalg -mavx512vnni tools/ci/vector-probe.c -o "$RUNNER_TEMP/vector-probe"
          "$RUNNER_TEMP/vector-probe"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/hosted-release-inputs
          key: hosted-inputs-v1-linux-x64-${{ hashFiles('tools/ci/hosted-tools.lock') }}
      - name: Stage pinned tools
        shell: bash
        run: |
          set -eu
          export BUSTER_HOSTED_RELEASES="$RUNNER_TEMP/hosted-release-inputs"
          bash tools/ci/hosted-release.sh verify "$BUSTER_HOSTED_RELEASES" || bash tools/ci/hosted-release.sh prepare "$BUSTER_HOSTED_RELEASES"
          root="$RUNNER_TEMP/induction-tools"
          bash tools/ci/install-hosted-tools.sh "$root"
          version=$(bash tools/ci/hosted-release.sh version llvm)
          printf '%s\n' "$root/bin" "$root/llvm-$version/bin" >> "$GITHUB_PATH"
          bash tools/ci/setup-build-tools.sh "$root/build-tools" >> "$GITHUB_PATH"
      - name: Build base and candidate with the same pinned tools
        id: build
        run: |
          set -eu
          clang --version
          git checkout --detach "$BUSTER_BASE"
          ./build.sh --config Release
          cp -L build/compiler "$RUNNER_TEMP/compiler-base"
          git checkout --detach "$BUSTER_HEAD"
          ./build.sh --config Release
          cp -L build/compiler "$RUNNER_TEMP/compiler-head"
          sha256sum "$RUNNER_TEMP/compiler-base" "$RUNNER_TEMP/compiler-head"
      - name: Compile, certify, disassemble and run the array loops
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/induction"
          mkdir -p "$probe"
          cat > "$probe/kernel.c" <<'END_KERNEL'
          unsigned sum1(const unsigned *a, unsigned n)
          {
              unsigned sum = 0;
              for (int i = 0; i <= (int)(n & 65535u); i += 1)
                  sum += a[i];
              return sum;
          }
          
          unsigned sum3(const unsigned *a, unsigned n)
          {
              unsigned sum = 0;
              for (int i = 0; i <= (int)(n & 65535u); i += 3)
                  sum += a[i];
              return sum;
          }
          
          unsigned swap1(const unsigned *a, unsigned n)
          {
              unsigned sum = 0;
              for (int i = 0; (int)(n & 65535u) >= i; i += 1)
                  sum += a[i];
              return sum;
          }
          
          unsigned swap3(const unsigned *a, unsigned n)
          {
              unsigned sum = 0;
              for (int i = 0; (int)(n & 65535u) >= i; i += 3)
                  sum += a[i];
              return sum;
          }
          
          unsigned strict1(const unsigned *a, unsigned n)
          {
              unsigned sum = 0;
              for (int i = 0; i < (int)(n & 65535u); i += 1)
                  sum += a[i];
              return sum;
          }
          
          long find1(const unsigned *a, unsigned n, unsigned key)
          {
              int i = 0;
              for (; i <= (int)(n & 65535u); i += 1)
                  if (a[i] == key)
                      break;
              return i;
          }
          
          long find3(const unsigned *a, unsigned n, unsigned key)
          {
              for (int i = 0; i <= (int)(n & 65535u); i += 3)
                  if (a[i] == key)
                      return i;
              return -1;
          }
          END_KERNEL
          cat > "$probe/oracle.c" <<'END_ORACLE'
          #include <limits.h>
          #include <stdint.h>
          #include <stdio.h>
          
          typedef unsigned (*Kernel)(const unsigned *, unsigned);
          unsigned sum1(const unsigned *, unsigned);
          unsigned sum3(const unsigned *, unsigned);
          unsigned swap1(const unsigned *, unsigned);
          unsigned swap3(const unsigned *, unsigned);
          unsigned strict1(const unsigned *, unsigned);
          long find1(const unsigned *, unsigned, unsigned);
          long find3(const unsigned *, unsigned, unsigned);
          
          int main(int argc, char **argv)
          {
              static unsigned data[65536];
              static const unsigned inputs[] = {0, 1, 2, 3, 4, 7, 15, 16, 17, 1023,
                                               65533, 65534, 65535, 65536, 65537, 0x80000000u, UINT_MAX};
              static const Kernel kernel[] = {sum1, sum3, swap1, swap3, strict1};
              FILE *source = argc == 2 ? fopen(argv[1], "rb") : NULL;
              if (!source)
                  return 2;
              unsigned read = 0;
              int byte;
              while (read < 65536 && (byte = fgetc(source)) != EOF)
                  data[read++] = (unsigned)byte;
              if (ferror(source) || read == 0 || fclose(source) != 0)
                  return 2;
              for (unsigned i = read; i < 65536; ++i)
                  data[i] = data[i % read];
              uint64_t digest = 0;
              unsigned checks = 0;
              for (unsigned dataset = 0; dataset < 2; ++dataset)
              {
                  for (unsigned k = 0; k < sizeof(kernel) / sizeof(kernel[0]); ++k)
                  {
                      unsigned stride = k == 1 || k == 3 ? 3 : 1;
                      for (unsigned s = 0; s < sizeof(inputs) / sizeof(inputs[0]); ++s)
                      {
                          unsigned count = (inputs[s] & 65535u) + (k != 4);
                          unsigned expected = 0;
                          for (unsigned j = 0; j < count; j += stride)
                              expected += data[j];
                          unsigned result = kernel[k](data, inputs[s]);
                          if (result != expected)
                          {
                              fprintf(stderr, "dataset=%u kernel=%u n=%u expected=%u actual=%u\n",
                                      dataset, k, inputs[s], expected, result);
                              return 1;
                          }
                          digest = (digest ^ result) * UINT64_C(1099511628211);
                          ++checks;
                      }
                  }
                  for (unsigned stride = 1; stride <= 3; stride += 2)
                  {
                      for (unsigned s = 0; s < sizeof(inputs) / sizeof(inputs[0]); ++s)
                      {
                          unsigned limit = inputs[s] & 65535u;
                          unsigned keys[] = {data[0], data[limit - limit % stride], data[limit / 2], 0xff00abdeu};
                          for (unsigned k = 0; k < sizeof(keys) / sizeof(keys[0]); ++k)
                          {
                              unsigned j = 0;
                              while (j <= limit && data[j] != keys[k])
                                  j += stride;
                              long expected = j <= limit || stride == 1 ? (long)j : -1L;
                              long result = stride == 1 ? find1(data, inputs[s], keys[k]) : find3(data, inputs[s], keys[k]);
                              if (result != expected)
                              {
                                  fprintf(stderr, "search dataset=%u stride=%u n=%u key=%u expected=%ld actual=%ld\n",
                                          dataset, stride, inputs[s], keys[k], expected, result);
                                  return 1;
                              }
                              digest = (digest ^ (uint64_t)result) * UINT64_C(1099511628211);
                              ++checks;
                          }
                      }
                  }
                  if (dataset == 0)
                      for (unsigned i = 0; i < 65536; ++i)
                          data[i] = 0xa5a55a5au ^ i * 2654435761u;
              }
              printf("source-bytes=%u checks=%u digest=%016llx\n", read, checks, (unsigned long long)digest);
              return 0;
          }
          END_ORACLE
          git show "$BUSTER_BASE":src/buster/compiler/tier1_select_ranges.c > "$probe/input.c"
          clang -std=c17 -O2 "$probe/kernel.c" "$probe/oracle.c" -o "$probe/clang-oracle"
          "$probe/clang-oracle" "$probe/input.c" | tee "$probe/clang.run"
          for rev in base head; do
              echo "BEGIN $rev"
              compiler="$RUNNER_TEMP/compiler-$rev"
              "$compiler" --tier1 -c "$probe/kernel.c" -o "$probe/$rev.o"
              nm -S --size-sort "$probe/$rev.o"
              objdump -d "$probe/$rev.o"
              "$compiler" --tier1 --tier1-strict --verify --tier1-report -c "$probe/kernel.c" -o "$probe/$rev-verified.o" 2>&1 | tee "$probe/$rev.report"
              grep -qE 'code_certified=7([[:space:]]|$)' "$probe/$rev.report"
              grep -qE 'code_uncertified=0([[:space:]]|$)' "$probe/$rev.report"
              for product in "$rev" "$rev-verified"; do
                  objcopy -O binary --only-section=.text "$probe/$product.o" "$probe/$product.text"
                  clang -std=c17 -O2 -no-pie "$probe/oracle.c" "$probe/$product.o" -o "$probe/$product.exe"
                  "$probe/$product.exe" "$probe/input.c" | tee "$probe/$product.run"
                  cmp "$probe/clang.run" "$probe/$product.run"
              done
              cmp "$probe/$rev.text" "$probe/$rev-verified.text"
              echo "END $rev"
          done
      - name: Run the base and candidate induction fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -eu
          "$RUNNER_TEMP/compiler-base" test-tier1-emit
          "$RUNNER_TEMP/compiler-head" test-tier1-emit
