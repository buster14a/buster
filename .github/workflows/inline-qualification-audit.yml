name: Disposable inliner audit qualification

on:
  push:
    branches: [codex/48-inlining-qualification-audit]

permissions:
  contents: read

jobs:
  mint-audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out the immutable trusted-main snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: a555b470ca17de0a027be1c19ffd8bf9f55819a7
          path: trusted
          persist-credentials: false

      - name: Self-test and mint the audit with the repository tool
        shell: bash
        run: |
          set -euo pipefail
          cd trusted
          python3 tools/new_audit.py --self-test
          audit_path="$(python3 tools/new_audit.py --platform "Linux x86_64, AMD Ryzen 7 9700X" "Bounded canonical inlining: correctness and paired self-host qualification")"
          test -f "$audit_path"
          printf 'MINTED_AUDIT_PATH=%s\n' "$audit_path"
          sed -n '1,4p' "$audit_path"
          python3 tools/new_audit.py --check
          git diff --check
