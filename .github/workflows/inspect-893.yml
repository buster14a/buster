name: Apply and verify issue 893

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-893-writer
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.head_ref == 'fix/893-builtin-ffs' || github.ref_name == 'fix/893-builtin-ffs'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/893-builtin-ffs
          fetch-depth: 0
      - name: Apply implementation
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode | gzip --decompress > /tmp/issue-893.patch
          git apply --check /tmp/issue-893.patch
          git apply /tmp/issue-893.patch
      - name: Verify generated tree and tests
        shell: bash
        run: |
          set -euo pipefail
          ./ide generate
          git diff --exit-code -- . ':(exclude).github/workflows/inspect-893.yml'
          ./ide test
      - name: Publish implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/inspect-893.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/buster/lib/compiler/frontend/c/c_internal.h \
                  src/buster/lib/compiler/frontend/c/c_source.c \
                  src/buster/lib/compiler/frontend/c/c_parse.c \
                  src/buster/lib/compiler/frontend/c/c_gen.c \
                  src/buster/tests/compiler/frontend/c/c_test.c \
                  src/buster/tests/compiler/codegen/codegen_test.c \
                  .github/workflows/inspect-893.yml
          git commit -m 'frontend: implement __builtin_ffs'
          git push origin HEAD:fix/893-builtin-ffs
