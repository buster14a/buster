name: Apply and verify issue 893

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-893-writer
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.head_ref == 'fix/893-builtin-ffs' || github.ref_name == 'fix/893-builtin-ffs'
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/893-builtin-ffs
          fetch-depth: 0

      - name: Install native tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mold
          python3 tools/ci_zig.py \
            --target x86_64-linux \
            --cache-directory "$RUNNER_TEMP/zig-archive" \
            --install-directory "$RUNNER_TEMP/zig"

      - name: Apply implementation and regressions
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode | gzip --decompress > "$RUNNER_TEMP/issue893_apply.py"
          python3 "$RUNNER_TEMP/issue893_apply.py"
          git diff --check
          ./build.sh generate
          python3 tools/native_retirement_rebind.py refresh --repo-root "$PWD"
          python3 tools/native_retirement_rebind.py check --repo-root "$PWD"
          git diff --check

      - name: Build and run validation
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh build --config Release -t test_all
          ./build.sh test_mode_matrix --config Release

      - name: Publish clean implementation commit
        shell: bash
        run: |
          set -euo pipefail
          old_head="$(git rev-parse HEAD)"
          rm .github/workflows/inspect-893.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --soft b7346b3e2674a48e11b70f6bc85cce0b0bb66dc9
          git add -A
          git commit -m 'frontend: implement __builtin_ffs'
          git push --force-with-lease="refs/heads/fix/893-builtin-ffs:${old_head}" origin HEAD:fix/893-builtin-ffs
