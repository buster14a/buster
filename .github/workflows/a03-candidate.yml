name: A03 candidate validation
on:
  push:
    branches: [astra/a03-20260909-ci-inspection]
    paths: [.github/workflows/a03-candidate.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      actions: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      BUSTER_TEST_JOBS: '1'
      BUSTER_MATRIX_THREADS: '1'
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          path: baseline
          persist-credentials: false
      - name: Confirm minimized operation defect on immutable main
        working-directory: baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/baseline-evidence/source-sha.txt"
          clang --version | tee "$RUNNER_TEMP/baseline-evidence/clang.txt"
          gcc --version | tee "$RUNNER_TEMP/baseline-evidence/gcc.txt"
          cat > "$RUNNER_TEMP/baseline-evidence/compound.c" <<'EOF'
          int update(volatile int* value)
          {
              *value += 3;
              return *value;
          }
          int main(void)
          {
              volatile int value = 4;
              int result = update(&value);
              return result != 7 || value != 7;
          }
          EOF
          for cc in clang gcc; do
            "$cc" -std=c17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all "$RUNNER_TEMP/baseline-evidence/compound.c" -o "$RUNNER_TEMP/control"
            "$RUNNER_TEMP/control"
          done
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/baseline-build"
          "$RUNNER_TEMP/baseline-build" generate --cc clang --ci --linker DEFAULT -DBUSTER_UNITY_BUILD=OFF
          "$RUNNER_TEMP/baseline-build" build --config Release -t ide -- -j1 > "$RUNNER_TEMP/baseline-evidence/build.txt" 2>&1
          build/Release/ide cc "$RUNNER_TEMP/baseline-evidence/compound.c" -o "$RUNNER_TEMP/plain"
          "$RUNNER_TEMP/plain"
          for mode in none mir-stack fast quality; do
            for ssa in -ffrontend-ssa -fno-frontend-ssa; do
              log="$RUNNER_TEMP/baseline-evidence/${mode}${ssa}.txt"
              set +e
              build/Release/ide cc -fverify-codegen -fregister-allocator="$mode" "$ssa" -c "$RUNNER_TEMP/baseline-evidence/compound.c" -o "$RUNNER_TEMP/probe.o" > "$log" 2>&1
              status=$?
              set -e
              cat "$log"
              test "$status" -eq 1
              grep -q 'canonical C IR validation failed: error 11' "$log"
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: a03-compound-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/baseline-evidence/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: astra/a03-361-qualified-parameter-values
          path: source
          persist-credentials: false
      - name: Publish only the reproduced correction to the owned branch
        id: publish
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d72cd8dd28283f89cac78b0e49b0d8529c5405b3
          test "$(gh api repos/buster14a/buster/branches/main --jq .commit.sha)" = ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          gh api --paginate 'repos/buster14a/buster/pulls?state=open&per_page=100' --slurp > "$RUNNER_TEMP/open-prs.json"
          python3 - <<'PY'
          import hashlib, json, pathlib, os, subprocess
          inspected = json.loads(pathlib.Path('../transport/a03/inspected-prs.json').read_text())
          inspected['370'] = 'd72cd8dd28283f89cac78b0e49b0d8529c5405b3'
          affected = {'docs/agents/frontend/calls.md', 'docs/differential-testing.md', 'src/buster/lib/compiler/frontend/c/c_gen.c', 'src/buster/tests/compiler/driver/driver_test.c', 'src/buster/tests/compiler/frontend/c/c_test.c', 'tests/basic_c_qualified_aggregate_call.c', 'tests/basic_c_qualified_compound.c', 'tests/differential/qualified_aggregate.c', 'tests/differential/qualified_aggregate.h', 'tests/differential/qualified_aggregate_host.c', 'tools/differential.c'}
          for page in json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'open-prs.json').read_text()):
              for pr in page:
                  if inspected.get(str(pr['number'])) != pr['head']['sha']:
                      raw = subprocess.check_output(['gh', 'api', '--paginate', '--slurp', 'repos/buster14a/buster/pulls/%d/files?per_page=100' % pr['number']])
                      files = {item['filename'] for items in json.loads(raw) for item in items}
                      assert not (files & affected), (pr['number'], files & affected)
                      print('Additional disjoint PR:', pr['number'], pr['head']['sha'], sorted(files))
          patch = pathlib.Path('../transport/a03/qualified-compound.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == 'd01ee00290e457e6e396b2cd37187d91e92abd476de13467aa3d1f2a40bb5f1f'
          PY
          git apply --check ../transport/a03/qualified-compound.patch
          git apply ../transport/a03/qualified-compound.patch
          git diff --check
          git add docs/agents/frontend/calls.md src/buster/lib/compiler/frontend/c/c_gen.c src/buster/tests/compiler/driver/driver_test.c src/buster/tests/compiler/frontend/c/c_test.c tests/basic_c_qualified_compound.c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'c: compute volatile compound assignments in their value type (#361)'
          test "$(gh api repos/buster14a/buster/branches/main --jq .commit.sha)" = ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          gh auth setup-git
          git push origin HEAD:refs/heads/astra/a03-361-qualified-parameter-values
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD
          gh workflow run ci.yml --ref astra/a03-361-qualified-parameter-values
  native:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      BUSTER_TEST_JOBS: '1'
      BUSTER_MATRIX_THREADS: '1'
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - name: Build exact submitted source
        id: build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/evidence/source-sha.txt"
          clang --version | tee "$RUNNER_TEMP/evidence/clang.txt"
          gcc --version | tee "$RUNNER_TEMP/evidence/gcc.txt"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --cc clang --ci --linker DEFAULT -DBUSTER_UNITY_BUILD=OFF
          "$RUNNER_TEMP/buster-build" build --config Release -t ide -- -j1 2>&1 | tee "$RUNNER_TEMP/evidence/build.txt"
      - name: Full Release suite including canonical invariants
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" build --config Release -t test_all -- -j1 2>&1 | tee "$RUNNER_TEMP/evidence/test-all.txt"
      - name: Native mixed-compiler differential matrix
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" test_differential --self-test 2>&1 | tee "$RUNNER_TEMP/evidence/differential-self-test.txt"
          "$RUNNER_TEMP/buster-build" test_differential --ide build/Release/ide --source tests/differential/qualified_aggregate.c --host tests/differential/qualified_aggregate_host.c --out "$RUNNER_TEMP/differential" --sanitize-oracle 2>&1 | tee "$RUNNER_TEMP/evidence/differential.txt"
      - name: Both minimal strict executions and independent GCC control
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          gcc -std=c17 -Wall -Wextra -Werror -fwrapv -fno-strict-aliasing -funsigned-char tests/differential/qualified_aggregate.c tests/differential/qualified_aggregate_host.c -o "$RUNNER_TEMP/gcc-control"
          "$RUNNER_TEMP/gcc-control" | tee "$RUNNER_TEMP/evidence/gcc-control.txt"
          for source in tests/basic_c_qualified_aggregate_call.c tests/basic_c_qualified_compound.c; do
            for mode in none mir-stack fast quality; do
              for ssa in -ffrontend-ssa -fno-frontend-ssa; do
                build/Release/ide cc -fverify-codegen -fregister-allocator="$mode" "$ssa" "$source" -o "$RUNNER_TEMP/minimal" 2>&1 | tee -a "$RUNNER_TEMP/evidence/minimal-strict.txt"
                "$RUNNER_TEMP/minimal"
              done
            done
          done
      - name: Existing cross-target execution mode matrix
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" test_mode_matrix --config Release 2>&1 | tee "$RUNNER_TEMP/evidence/mode-matrix.txt"
      - name: Supported self-host gates
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.runner == 'ubuntu-26.04' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/evidence/self-host.txt"
          "$RUNNER_TEMP/buster-build" test_self_host_audit --config Release 2>&1 | tee "$RUNNER_TEMP/evidence/self-host-audit.txt"
      - name: Sanitized full suite and qualified-call matrix
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" generate --sanitize --cc clang --ci --linker DEFAULT -DBUSTER_UNITY_BUILD=OFF
          "$RUNNER_TEMP/buster-build" build --config Debug -t test_all -- -j1 2>&1 | tee "$RUNNER_TEMP/evidence/sanitized-all.txt"
          "$RUNNER_TEMP/buster-build" test_differential --ide build/Debug/ide --source tests/differential/qualified_aggregate.c --host tests/differential/qualified_aggregate_host.c --out "$RUNNER_TEMP/differential-sanitized" --sanitize-oracle 2>&1 | tee "$RUNNER_TEMP/evidence/differential-sanitized.txt"
      - name: Collect textual observations
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for name in ('differential', 'differential-sanitized'):
              source = root / name
              if source.is_dir():
                  for path in source.rglob('*'):
                      if path.is_file() and path.suffix in ('.txt', '.tsv', '.argv', '.stdout', '.stderr', '.c', '.h'):
                          target = root / 'evidence' / name / path.relative_to(source)
                          target.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copyfile(path, target)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: a03-candidate-${{ matrix.runner }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 7
          if-no-files-found: error
