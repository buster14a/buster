name: Publish issue 512 patch

on:
  push:
    branches:
      - codex/512-retirement-recipe-admission
    paths:
      - .github/workflows/publish-issue-512.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply validated patch and remove publication helper
        shell: bash
        env:
          TARGET_BRANCH: codex/512-retirement-recipe-admission
        run: |
          set -euo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          cat .github/issue512.patch.gz.b64.part-* > "$RUNNER_TEMP/issue512.patch.gz.b64"
          printf '%s  %s\n' \
            '9e5a71b43a977ffe90b9a7e79f70e985dc0edd8342a9e1573125520feb6337c5' \
            "$RUNNER_TEMP/issue512.patch.gz.b64" | sha256sum --check --strict
          base64 --decode "$RUNNER_TEMP/issue512.patch.gz.b64" | gzip --decompress > "$RUNNER_TEMP/issue512.patch"
          printf '%s  %s\n' \
            '9e12307e6669938b4c035ab187c0cfd261b0a6b269466b78b4369b6ad6996684' \
            "$RUNNER_TEMP/issue512.patch" | sha256sum --check --strict
          git am "$RUNNER_TEMP/issue512.patch"
          rm -f .github/issue512.patch.b64.part-* \
                .github/issue512.patch.gz.b64.part-* \
                .github/workflows/publish-issue-512.yml
          git add -A
          git commit -m "ci: remove issue 512 publication helper"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
