name: Publish issue 105 implementation

on:
  push:
    branches: [codex/issue105-publish]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Apply reviewed metrics implementation to its pinned branch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/issue105-implementation.patch "$RUNNER_TEMP/issue105.patch"
          git fetch --no-tags origin codex/issue105-metrics-path-identity
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = d00ba87da23737a945a899f7304ac00b40a1ee04
          git apply --check "$RUNNER_TEMP/issue105.patch"
          git apply "$RUNNER_TEMP/issue105.patch"
          git diff --check
          git add src/buster/lib/compiler/frontend/c/c_source.c src/buster/lib/compiler/frontend/c/c_source_metrics_internal.h src/buster/tests/compiler/frontend/c/c_test.c
          git -c user.name='Buster automation' -c user.email='noreply@github.com' commit -m 'metrics: compare source paths after matching hashes (#105)'
          git push origin HEAD:refs/heads/codex/issue105-metrics-path-identity
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
