name: API migration policy

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

env:
  MAIN_PUSH_MAINTENANCE_SHA256: 118669698721ecc0d5da220d598bdf87afa172111dac784b6142e1f82a251ce5

# Candidate heads retain ordinary cancellation. Main pushes use exact-SHA groups
# so GitHub cannot cancel or replace an older pending run. The push-only helper
# orders the maintenance job through the Actions API before it mutates state.
# See docs/main-push-maintenance.md for the ordering and failure contract. The
# pin above also covers the push maintenance run by native-retirement-admission.yml;
# this job verifies it on every event, including merge groups.
concurrency:
  group: api-migration-policy-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  policy:
    name: API migration policy
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@6f2ab3357f1e0f359fbf9f40621906171c026283
        with:
          requested-runner: >-
            ubuntu-latest
      - name: Require CI admission to be enabled
        shell: bash
        env:
          CI_ENABLED: ${{ vars.GH_ACTIONS_CI_ENABLED }}
        run: |
          if [[ "$CI_ENABLED" != true ]]; then
            echo '::error::Required validation is disabled; refusing a skipped admission check.'
            exit 1
          fi
      - name: Check out exact combined maintenance authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: authority
          fetch-depth: 1
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@6f2ab3357f1e0f359fbf9f40621906171c026283
        with:
          mode: source
          source-directory: authority
          source-repository: ${{ github.repository }}
      - name: Verify main-push maintenance authority
        shell: bash
        working-directory: authority
        run: >-
          printf '%s  %s\n' "$MAIN_PUSH_MAINTENANCE_SHA256"
          tools/main_push_maintenance.py |
          sha256sum --check --strict
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Record actual checkout identity 2
        uses: buster14a/buster/.github/actions/machine-specifications@6f2ab3357f1e0f359fbf9f40621906171c026283
        with:
          mode: source
          source-directory: candidate
          source-repository: ${{ github.repository }}
      - name: Audit bounded compatibility paths
        working-directory: candidate
        run: python3 -B tools/api_migration_audit.py
      - name: Test the migration audit
        working-directory: candidate
        run: python3 -B tools/api_migration_audit_test.py -v
