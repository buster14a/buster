name: API migration policy

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: read
  checks: write

concurrency:
  group: api-migration-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: API migration policy
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require CI admission to be enabled
        shell: bash
        env:
          CI_ENABLED: ${{ vars.GH_ACTIONS_CI_ENABLED }}
        run: |
          if [[ "$CI_ENABLED" != true ]]; then
            echo '::error::Required validation is disabled; refusing a skipped admission check.'
            exit 1
          fi
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Audit bounded compatibility paths
        working-directory: candidate
        run: python3 -B tools/api_migration_audit.py
      - name: Test the migration audit
        working-directory: candidate
        run: python3 -B tools/api_migration_audit_test.py -v

  native-retirement-admission:
    name: Native retirement merge admission
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require CI admission to be enabled
        shell: bash
        env:
          CI_ENABLED: ${{ vars.GH_ACTIONS_CI_ENABLED }}
        run: |
          if [[ "$CI_ENABLED" != true ]]; then
            echo '::error::Required validation is disabled; refusing a skipped admission check.'
            exit 1
          fi
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the previously trusted admission policy
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Test native-retirement merge admission
        working-directory: candidate
        run: python3 -B tools/native_retirement_merge_gate_test.py -v
      - name: Enforce trusted native-retirement integration
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          current_main=$(git -C candidate ls-remote --refs origin refs/heads/main | cut -f1)
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          tool="$GITHUB_WORKSPACE/candidate/tools/native_retirement_merge_gate.py"
          if [[ -f "$GITHUB_WORKSPACE/trusted/tools/native_retirement_merge_gate.py" ]]; then
            tool="$GITHUB_WORKSPACE/trusted/tools/native_retirement_merge_gate.py"
          fi
          status_args=()
          if [[ "$EVENT_NAME" == pull_request ]]; then
            rows="$RUNNER_TEMP/native-retirement-status-rows.json"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA?per_page=100" > "$rows"
            python3 - "$HEAD_SHA" "$rows" "$RUNNER_TEMP/native-retirement-status.json" <<'PY_STATUS'
          import json, pathlib, sys
          head, rows_path, output_path = sys.argv[1:]
          pages = json.loads(pathlib.Path(rows_path).read_text())
          if not isinstance(pages, list) or not all(isinstance(page, list) for page in pages):
              raise SystemExit("commit status pages are not arrays")
          rows = [row for page in pages for row in page]
          pathlib.Path(output_path).write_text(json.dumps({"sha": head, "statuses": rows}))
          PY_STATUS
            status_args=(--status-json "$RUNNER_TEMP/native-retirement-status.json")
          fi
          python3 "$tool" check \
            --repo-root "$GITHUB_WORKSPACE/candidate" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --current-main "$current_main" \
            --event "$EVENT_NAME" \
            "${status_args[@]}" \
            | tee "$RUNNER_TEMP/native-retirement-admission.json"
      - name: Invalidate stale trusted integrations after main advances
        if: ${{ github.event_name == 'push' }}
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/native_retirement_merge_gate.py invalidate-stale \
            --repository "$GITHUB_REPOSITORY" \
            --new-main "$GITHUB_SHA" \
            --details-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            | tee "$RUNNER_TEMP/native-retirement-invalidation.json"
