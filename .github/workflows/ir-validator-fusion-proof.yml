name: Canonical validator fusion proof

# Temporary branch-only evidence for #2626. Do not propose this workflow for
# main or treat its hosted timings as dedicated-host acceptance.
on:
  push:
    branches:
      - devin/2626-fuse-canonical-validator-walk

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    env:
      BUSTER_TEST_JOBS: '2'
      BUSTER_IR_BASELINE_SHA: 94976eccad9c31776cf264a33dcda960dd8ed51a
      # The immutable source-only candidate commit; this workflow commit sits
      # above it on the proof branch and is never measured.
      BUSTER_IR_CANDIDATE_SHA: 91a5199608e80a7ef23b176b4b248b47f7efbc00
      BUSTER_IR_GENERATE_FLAGS: --config Release --cc clang --ci --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_UNITY_BUILD=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    steps:
      - name: Prepare retained evidence and hosted perf
        id: setup
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/validator-fusion-evidence"
          mkdir -p "$evidence/binaries" "$evidence/baseline" "$evidence/candidate" "$evidence/notests" "$evidence/census"
          printf 'BUSTER_IR_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          exec > >(tee "$evidence/setup.log") 2>&1
          set -x
          uname -a
          lscpu
          free -b
          clang --version
          cmake --version
          ninja --version
          python3 --version
          jq --version
          test "${#BUSTER_IR_CANDIDATE_SHA}" -eq 40
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes linux-tools-common linux-tools-generic
          sudo sysctl kernel.perf_event_paranoid=-1 || true
          sysctl kernel.perf_event_paranoid
          perf_path="$(command -v perf)"
          if ! "$perf_path" --version; then
            perf_path="$(compgen -G '/usr/lib/linux-tools/*/perf' | sort -V | tail -n 1)"
            test -n "$perf_path"
            "$perf_path" --version
          fi
          printf 'BUSTER_IR_PERF=%s\n' "$perf_path" >> "$GITHUB_ENV"
          sha256sum "$perf_path" > "$evidence/perf.sha256"
          "$perf_path" stat -x, -o "$evidence/perf-preflight.csv" -e task-clock,cycles:u,instructions:u,branch-misses:u,page-faults,minor-faults,major-faults -- true

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        id: baseline_checkout
        with:
          ref: ${{ env.BUSTER_IR_BASELINE_SHA }}
          path: source
          persist-credentials: false

      - name: Build and freeze baseline trusted Clang compiler (tests on)
        id: baseline_build
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/baseline/build.log") 2>&1
          set -x
          test "$(git rev-parse HEAD)" = "$BUSTER_IR_BASELINE_SHA"
          git rev-parse HEAD 'HEAD^{tree}' > "$BUSTER_IR_EVIDENCE/baseline/revisions.txt"
          pwd > "$BUSTER_IR_EVIDENCE/baseline/build-root.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$BUSTER_IR_EVIDENCE/baseline/source.sha256"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o "$RUNNER_TEMP/buster-baseline-build"
          sha256sum "$RUNNER_TEMP/buster-baseline-build" > "$BUSTER_IR_EVIDENCE/baseline/driver.sha256"
          "$RUNNER_TEMP/buster-baseline-build" generate $BUSTER_IR_GENERATE_FLAGS -DBUSTER_INCLUDE_TESTS=ON -DBUSTER_BENCH_ALLOCATIONS=OFF
          "$RUNNER_TEMP/buster-baseline-build" build --config Release -t ide -- -j2
          grep -Fx 'BUSTER_INCLUDE_TESTS:BOOL=ON' build/CMakeCache.txt
          grep -Fx 'BUSTER_BENCH_ALLOCATIONS:BOOL=OFF' build/CMakeCache.txt
          cp build/CMakeCache.txt build/compile_commands.json "$BUSTER_IR_EVIDENCE/baseline/"
          find build/generated -type f -print0 | sort -z | xargs -0 sha256sum > "$BUSTER_IR_EVIDENCE/baseline/generated.sha256"
          cp build/Release/ide "$BUSTER_IR_EVIDENCE/binaries/baseline-ide"
          chmod a-w "$BUSTER_IR_EVIDENCE/binaries/baseline-ide"
          sha256sum "$BUSTER_IR_EVIDENCE/binaries/baseline-ide" > "$BUSTER_IR_EVIDENCE/baseline/compiler.sha256"
          git diff --exit-code

      - name: Baseline self-host fixed point
        id: baseline_self_host
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/baseline/self-host.log") 2>&1
          set -x
          "$RUNNER_TEMP/buster-baseline-build" test_self_host --config Release
          sha256sum build/self-host/Release/ide-stage1 build/self-host/Release/ide-stage2 > "$BUSTER_IR_EVIDENCE/baseline/self-host.sha256"
          cp build/self-host/Release/ide-stage1.metrics build/self-host/Release/ide-stage2.metrics "$BUSTER_IR_EVIDENCE/baseline/"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        id: candidate_checkout
        if: ${{ !cancelled() && steps.baseline_build.outcome == 'success' }}
        with:
          ref: ${{ env.BUSTER_IR_CANDIDATE_SHA }}
          path: source
          persist-credentials: false

      - name: Build and freeze candidate trusted Clang compiler (tests on)
        id: candidate_build
        if: ${{ !cancelled() && steps.candidate_checkout.outcome == 'success' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/candidate/build.log") 2>&1
          set -x
          test "$(git rev-parse HEAD)" = "$BUSTER_IR_CANDIDATE_SHA"
          git rev-parse HEAD 'HEAD^{tree}' > "$BUSTER_IR_EVIDENCE/candidate/revisions.txt"
          pwd > "$BUSTER_IR_EVIDENCE/candidate/build-root.txt"
          cmp "$BUSTER_IR_EVIDENCE/baseline/build-root.txt" "$BUSTER_IR_EVIDENCE/candidate/build-root.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$BUSTER_IR_EVIDENCE/candidate/source.sha256"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o "$RUNNER_TEMP/buster-candidate-build"
          sha256sum "$RUNNER_TEMP/buster-candidate-build" > "$BUSTER_IR_EVIDENCE/candidate/driver.sha256"
          "$RUNNER_TEMP/buster-candidate-build" generate $BUSTER_IR_GENERATE_FLAGS -DBUSTER_INCLUDE_TESTS=ON -DBUSTER_BENCH_ALLOCATIONS=OFF
          "$RUNNER_TEMP/buster-candidate-build" build --config Release -t ide -- -j2
          grep -Fx 'BUSTER_INCLUDE_TESTS:BOOL=ON' build/CMakeCache.txt
          grep -Fx 'BUSTER_BENCH_ALLOCATIONS:BOOL=OFF' build/CMakeCache.txt
          cp build/CMakeCache.txt build/compile_commands.json "$BUSTER_IR_EVIDENCE/candidate/"
          find build/generated -type f -print0 | sort -z | xargs -0 sha256sum > "$BUSTER_IR_EVIDENCE/candidate/generated.sha256"
          cp build/Release/ide "$BUSTER_IR_EVIDENCE/binaries/candidate-ide"
          chmod a-w "$BUSTER_IR_EVIDENCE/binaries/candidate-ide"
          sha256sum "$BUSTER_IR_EVIDENCE/binaries/candidate-ide" > "$BUSTER_IR_EVIDENCE/candidate/compiler.sha256"
          git diff --exit-code

      - name: Candidate self-host fixed point
        id: candidate_self_host
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/candidate/self-host.log") 2>&1
          set -x
          "$RUNNER_TEMP/buster-candidate-build" test_self_host --config Release
          sha256sum build/self-host/Release/ide-stage1 build/self-host/Release/ide-stage2 > "$BUSTER_IR_EVIDENCE/candidate/self-host.sha256"
          cp build/self-host/Release/ide-stage1.metrics build/self-host/Release/ide-stage2.metrics "$BUSTER_IR_EVIDENCE/candidate/"
          # Validation has no output effect: both compilers must produce the
          # identical stage-1 executable from the identical input.
          cmp "$BUSTER_IR_EVIDENCE/baseline/ide-stage1.metrics" "$BUSTER_IR_EVIDENCE/candidate/ide-stage1.metrics" || true

      - name: Candidate complete registered tests
        id: candidate_tests
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/candidate/test-all.log") 2>&1
          set -x
          "$RUNNER_TEMP/buster-candidate-build" build --config Release -t test_all -- -j2

      - name: A/A immutable baseline noise comparison on frozen candidate inputs
        id: aa
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' && env.BUSTER_IR_PERF != '' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/aa.log") 2>&1
          set -x
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/source.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/generated.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/baseline/compiler.sha256"
          python3 tools/uarch_lab.py compare --baseline "$BUSTER_IR_EVIDENCE/binaries/baseline-ide" --candidate "$BUSTER_IR_EVIDENCE/binaries/baseline-ide" --repo-root . --cpu -1 --pairs 12 --require-identical-output --perf "$BUSTER_IR_PERF" --output "$BUSTER_IR_EVIDENCE/aa"
          jq -e '.outputs_identical == true and .plan.complete_pairs == 12 and .baseline.failed == 0 and .candidate.failed == 0 and .baseline.deterministic == true and .candidate.deterministic == true' "$BUSTER_IR_EVIDENCE/aa/summary.json"
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/source.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/generated.sha256"

      - name: A/B frozen compilers, tests on (the configuration the Zen 5 baseline profiled)
        id: ab
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' && env.BUSTER_IR_PERF != '' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/ab.log") 2>&1
          set -x
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/source.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/generated.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/baseline/compiler.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/compiler.sha256"
          python3 tools/uarch_lab.py compare --baseline "$BUSTER_IR_EVIDENCE/binaries/baseline-ide" --candidate "$BUSTER_IR_EVIDENCE/binaries/candidate-ide" --repo-root . --cpu -1 --pairs 24 --require-identical-output --perf "$BUSTER_IR_PERF" --output "$BUSTER_IR_EVIDENCE/ab"
          jq -e '.outputs_identical == true and .plan.complete_pairs == 24 and .baseline.failed == 0 and .candidate.failed == 0 and .baseline.deterministic == true and .candidate.deterministic == true' "$BUSTER_IR_EVIDENCE/ab/summary.json"
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/source.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/generated.sha256"

      # Production compilers carry no tests, so BUSTER_IR_TRANSFORM_CHECKS is
      # off and the validator runs once per module (the FAST input guard)
      # instead of twice. Both tests-off compilers are built serially in the
      # same path after the tests-on measurements have finished.
      - name: Build and freeze candidate tests-off compiler
        id: candidate_notests_build
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/notests/candidate-build.log") 2>&1
          set -x
          test "$(git rev-parse HEAD)" = "$BUSTER_IR_CANDIDATE_SHA"
          "$RUNNER_TEMP/buster-candidate-build" generate $BUSTER_IR_GENERATE_FLAGS -DBUSTER_INCLUDE_TESTS=OFF -DBUSTER_BENCH_ALLOCATIONS=OFF
          "$RUNNER_TEMP/buster-candidate-build" build --config Release -t ide -- -j2
          grep -Fx 'BUSTER_INCLUDE_TESTS:BOOL=OFF' build/CMakeCache.txt
          cp build/CMakeCache.txt "$BUSTER_IR_EVIDENCE/notests/candidate-CMakeCache.txt"
          cp build/Release/ide "$BUSTER_IR_EVIDENCE/binaries/candidate-notests-ide"
          chmod a-w "$BUSTER_IR_EVIDENCE/binaries/candidate-notests-ide"
          sha256sum "$BUSTER_IR_EVIDENCE/binaries/candidate-notests-ide" > "$BUSTER_IR_EVIDENCE/notests/candidate-compiler.sha256"
          git diff --exit-code

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        id: baseline_checkout_again
        if: ${{ !cancelled() && steps.candidate_notests_build.outcome == 'success' }}
        with:
          ref: ${{ env.BUSTER_IR_BASELINE_SHA }}
          path: source
          persist-credentials: false

      - name: Build and freeze baseline tests-off compiler
        id: baseline_notests_build
        if: ${{ !cancelled() && steps.baseline_checkout_again.outcome == 'success' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/notests/baseline-build.log") 2>&1
          set -x
          test "$(git rev-parse HEAD)" = "$BUSTER_IR_BASELINE_SHA"
          sha256sum -c "$BUSTER_IR_EVIDENCE/baseline/source.sha256"
          "$RUNNER_TEMP/buster-baseline-build" generate $BUSTER_IR_GENERATE_FLAGS -DBUSTER_INCLUDE_TESTS=OFF -DBUSTER_BENCH_ALLOCATIONS=OFF
          "$RUNNER_TEMP/buster-baseline-build" build --config Release -t ide -- -j2
          grep -Fx 'BUSTER_INCLUDE_TESTS:BOOL=OFF' build/CMakeCache.txt
          cp build/CMakeCache.txt "$BUSTER_IR_EVIDENCE/notests/baseline-CMakeCache.txt"
          find build/generated -type f -print0 | sort -z | xargs -0 sha256sum > "$BUSTER_IR_EVIDENCE/notests/generated.sha256"
          cp build/Release/ide "$BUSTER_IR_EVIDENCE/binaries/baseline-notests-ide"
          chmod a-w "$BUSTER_IR_EVIDENCE/binaries/baseline-notests-ide"
          sha256sum "$BUSTER_IR_EVIDENCE/binaries/baseline-notests-ide" > "$BUSTER_IR_EVIDENCE/notests/baseline-compiler.sha256"
          git diff --exit-code

      - name: A/B frozen compilers, tests off (production configuration), on the frozen baseline tree
        id: ab_notests
        if: ${{ !cancelled() && steps.baseline_notests_build.outcome == 'success' && env.BUSTER_IR_PERF != '' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/ab-notests.log") 2>&1
          set -x
          sha256sum -c "$BUSTER_IR_EVIDENCE/baseline/source.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/notests/generated.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/notests/baseline-compiler.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/notests/candidate-compiler.sha256"
          python3 tools/uarch_lab.py compare --baseline "$BUSTER_IR_EVIDENCE/binaries/baseline-notests-ide" --candidate "$BUSTER_IR_EVIDENCE/binaries/candidate-notests-ide" --repo-root . --cpu -1 --pairs 24 --require-identical-output --perf "$BUSTER_IR_PERF" --output "$BUSTER_IR_EVIDENCE/ab-notests"
          jq -e '.outputs_identical == true and .plan.complete_pairs == 24 and .baseline.failed == 0 and .candidate.failed == 0 and .baseline.deterministic == true and .candidate.deterministic == true' "$BUSTER_IR_EVIDENCE/ab-notests/summary.json"
          sha256sum -c "$BUSTER_IR_EVIDENCE/baseline/source.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/notests/generated.sha256"

      # Exact work census: the allocation-instrumented compilers write every
      # IR_CONSTRUCTION counter into the stage-1 source-metrics file. Both are
      # built serially in the same path; the comparison is of counts, not time.
      - name: Baseline instrumented stage-1 census
        id: baseline_census
        if: ${{ !cancelled() && steps.baseline_notests_build.outcome == 'success' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/census/baseline-build.log") 2>&1
          set -x
          test "$(git rev-parse HEAD)" = "$BUSTER_IR_BASELINE_SHA"
          "$RUNNER_TEMP/buster-baseline-build" generate $BUSTER_IR_GENERATE_FLAGS -DBUSTER_INCLUDE_TESTS=OFF -DBUSTER_BENCH_ALLOCATIONS=ON
          "$RUNNER_TEMP/buster-baseline-build" build --config Release -t ide -- -j2
          grep -Fx 'BUSTER_BENCH_ALLOCATIONS:BOOL=ON' build/CMakeCache.txt
          cp build/Release/ide "$BUSTER_IR_EVIDENCE/binaries/baseline-census-ide"
          sha256sum "$BUSTER_IR_EVIDENCE/binaries/baseline-census-ide" > "$BUSTER_IR_EVIDENCE/census/baseline-compiler.sha256"
          ./build/Release/ide cc -Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -g -fsource-metrics="$BUSTER_IR_EVIDENCE/census/baseline-stage1.metrics" src/buster/apps/ide/ide.c -lm -o "$RUNNER_TEMP/baseline-census-stage1" > "$BUSTER_IR_EVIDENCE/census/baseline-stage1.log" 2>&1
          sha256sum "$RUNNER_TEMP/baseline-census-stage1" > "$BUSTER_IR_EVIDENCE/census/baseline-stage1.sha256"
          git diff --exit-code

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        id: candidate_checkout_again
        if: ${{ !cancelled() && steps.baseline_census.outcome == 'success' }}
        with:
          ref: ${{ env.BUSTER_IR_CANDIDATE_SHA }}
          path: source
          persist-credentials: false

      - name: Candidate instrumented stage-1 census and diagnostic IR tests
        id: candidate_census
        if: ${{ !cancelled() && steps.candidate_checkout_again.outcome == 'success' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/census/candidate-build.log") 2>&1
          set -x
          test "$(git rev-parse HEAD)" = "$BUSTER_IR_CANDIDATE_SHA"
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/source.sha256"
          "$RUNNER_TEMP/buster-candidate-build" generate $BUSTER_IR_GENERATE_FLAGS -DBUSTER_INCLUDE_TESTS=ON -DBUSTER_BENCH_ALLOCATIONS=ON
          "$RUNNER_TEMP/buster-candidate-build" build --config Release -t ide -- -j2
          grep -Fx 'BUSTER_BENCH_ALLOCATIONS:BOOL=ON' build/CMakeCache.txt
          cp build/Release/ide "$BUSTER_IR_EVIDENCE/binaries/candidate-census-ide"
          sha256sum "$BUSTER_IR_EVIDENCE/binaries/candidate-census-ide" > "$BUSTER_IR_EVIDENCE/census/candidate-compiler.sha256"
          ./build/Release/ide cc -Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -g -fsource-metrics="$BUSTER_IR_EVIDENCE/census/candidate-stage1.metrics" src/buster/apps/ide/ide.c -lm -o "$RUNNER_TEMP/candidate-census-stage1" > "$BUSTER_IR_EVIDENCE/census/candidate-stage1.log" 2>&1
          sha256sum "$RUNNER_TEMP/candidate-census-stage1" > "$BUSTER_IR_EVIDENCE/census/candidate-stage1.sha256"
          cmp "$RUNNER_TEMP/baseline-census-stage1" "$RUNNER_TEMP/candidate-census-stage1" || true
          ./build/Release/ide test --ci=1 --verbose=1 --module=ir_tests > "$BUSTER_IR_EVIDENCE/census/ir-tests.log" 2>&1
          tail -n 5 "$BUSTER_IR_EVIDENCE/census/ir-tests.log"
          # Side-by-side validation and preparation counters. The candidate
          # census compiler carries tests, so its preparation runs the extra
          # checked-build validations; counters are per the whole compile.
          python3 - "$BUSTER_IR_EVIDENCE/census/baseline-stage1.metrics" "$BUSTER_IR_EVIDENCE/census/candidate-stage1.metrics" > "$BUSTER_IR_EVIDENCE/census/validation-census.md" <<'PY'
          import sys
          def load(path):
              rows = {}
              for line in open(path):
                  line = line.strip()
                  if '=' in line:
                      key, value = line.split('=', 1)
                      rows[key] = value
              return rows
          base, cand = load(sys.argv[1]), load(sys.argv[2])
          keys = sorted(k for k in set(base) | set(cand) if k.startswith('ir_construction.validation') or k.startswith('ir_construction.preparation'))
          print('| counter | baseline | candidate |')
          print('| --- | ---: | ---: |')
          for k in keys:
              print(f'| `{k}` | {base.get(k, "-")} | {cand.get(k, "-")} |')
          PY
          cat "$BUSTER_IR_EVIDENCE/census/validation-census.md"
          git diff --exit-code

      - name: Publish diagnostic scope and results
        if: always()
        shell: bash
        env:
          BASELINE_BUILD: ${{ steps.baseline_build.outcome }}
          BASELINE_FIXED_POINT: ${{ steps.baseline_self_host.outcome }}
          CANDIDATE_BUILD: ${{ steps.candidate_build.outcome }}
          CANDIDATE_FIXED_POINT: ${{ steps.candidate_self_host.outcome }}
          CANDIDATE_TESTS: ${{ steps.candidate_tests.outcome }}
          AA: ${{ steps.aa.outcome }}
          AB: ${{ steps.ab.outcome }}
          AB_NOTESTS: ${{ steps.ab_notests.outcome }}
          BASELINE_CENSUS: ${{ steps.baseline_census.outcome }}
          CANDIDATE_CENSUS: ${{ steps.candidate_census.outcome }}
        run: |
          set -euo pipefail
          printf '## Canonical validator fusion proof (#2626)\n\nBaseline `%s`; source candidate `%s`.\n\nBaseline build: **%s**; baseline fixed point: **%s**; candidate build: **%s**; candidate fixed point: **%s**; candidate full tests: **%s**; A/A: **%s**; A/B tests-on: **%s**; A/B tests-off: **%s**; baseline census: **%s**; candidate census and IR tests: **%s**.\n\n' "$BUSTER_IR_BASELINE_SHA" "$BUSTER_IR_CANDIDATE_SHA" "$BASELINE_BUILD" "$BASELINE_FIXED_POINT" "$CANDIDATE_BUILD" "$CANDIDATE_FIXED_POINT" "$CANDIDATE_TESTS" "$AA" "$AB" "$AB_NOTESTS" "$BASELINE_CENSUS" "$CANDIDATE_CENSUS" >> "$GITHUB_STEP_SUMMARY"
          printf 'Paired comparisons use frozen trusted Clang binaries built serially in one path, one frozen input tree per comparison and fresh executable copies per measured child. A/A measures runtime noise only. Hosted unpinned timing is diagnostic, not dedicated Ryzen 9700X acceptance; ordinary PR checks remain responsible for the platform/allocator matrix.\n\n' >> "$GITHUB_STEP_SUMMARY"
          for comparison in aa ab ab-notests; do
            report="$GITHUB_WORKSPACE/validator-fusion-evidence/$comparison/report.md"
            if test -f "$report"; then
              printf '### %s\n\n' "$comparison" >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              printf '\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          census="$GITHUB_WORKSPACE/validator-fusion-evidence/census/validation-census.md"
          if test -f "$census"; then
            printf '### Validation work census (stage-1, instrumented)\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$census" >> "$GITHUB_STEP_SUMMARY"
          fi
          test "$BASELINE_BUILD" = success
          test "$BASELINE_FIXED_POINT" = success
          test "$CANDIDATE_BUILD" = success
          test "$CANDIDATE_FIXED_POINT" = success
          test "$CANDIDATE_TESTS" = success
          test "$AA" = success
          test "$AB" = success
          test "$AB_NOTESTS" = success
          test "$BASELINE_CENSUS" = success
          test "$CANDIDATE_CENSUS" = success

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validator-fusion-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validator-fusion-evidence
          retention-days: 14
          if-no-files-found: warn
