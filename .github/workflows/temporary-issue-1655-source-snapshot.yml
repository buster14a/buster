name: Temporary issue 1655 main snapshot

on:
  push:
    branches:
      - codex/issue-1655-source-snapshot

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: target
      - name: Record exact main commit
        shell: bash
        run: git -C target rev-parse HEAD | tee target/ISSUE_1655_MAIN_SHA
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: issue-1655-main-snapshot
          path: |
            target
            !target/.git/**
          retention-days: 1
