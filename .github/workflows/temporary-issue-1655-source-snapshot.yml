name: Temporary issue 1655 source snapshot

on:
  push:
    branches:
      - codex/issue-1655-source-snapshot

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch tree
        uses: actions/checkout@v4
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: issue-1655-source-snapshot
          path: |
            .
            !.git/**
          retention-days: 1
