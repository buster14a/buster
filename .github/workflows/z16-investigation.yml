name: Z16 frozen baseline output measurements

on:
  push:
    branches: [astra/z16-116-investigation]

permissions:
  contents: read

jobs:
  baseline-output:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      BUSTER_TEST_JOBS: 1
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          path: baseline
          persist-credentials: false
      - name: Apply harness-only operation selector
        working-directory: baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/z16-baseline"
          python3 ../transport/.github/z16/prepare_harness.py .
          git diff --check
          git diff --stat
          git diff -- src/buster > "$RUNNER_TEMP/z16-baseline/compiler-source.diff"
          test ! -s "$RUNNER_TEMP/z16-baseline/compiler-source.diff"
          git diff > "$RUNNER_TEMP/z16-baseline/harness.patch"
          {
            git rev-parse HEAD
            uname -a
            lscpu
            free -h
            clang --version
            cmake --version
            ninja --version
          } > "$RUNNER_TEMP/z16-baseline/environment.txt"
      - name: Build driver and test native harness
        working-directory: baseline
        shell: bash
        run: |
          set -euo pipefail
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" bench_throughput self-test 2>&1 | tee "$RUNNER_TEMP/z16-baseline/harness-tests.log"
      - name: Build frozen trusted compiler with bounded parallelism
        working-directory: baseline
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" generate --build-directory build/throughput-ci-compiler --ci --cc clang -- -DBUSTER_INCLUDE_TESTS=OFF -DBUSTER_UNITY_BUILD=OFF -DBUSTER_BENCH_ALLOCATIONS=OFF -DCMAKE_LINKER_TYPE=DEFAULT
          "$RUNNER_TEMP/buster-build" build --build-directory build/throughput-ci-compiler --config Release -t ide -- -j2
          sha256sum build/throughput-ci-compiler/Release/ide > "$RUNNER_TEMP/z16-baseline/compiler-sha256.txt"
          cp build/throughput-ci-compiler/CMakeCache.txt build/throughput-ci-compiler/compile_commands.json "$RUNNER_TEMP/z16-baseline/"
      - name: Measure frozen object and assembly output separately
        working-directory: baseline
        shell: bash
        run: |
          set -euo pipefail
          ide="$PWD/build/throughput-ci-compiler/Release/ide"
          for emit in object assembly; do
            "$RUNNER_TEMP/buster-build" bench_throughput run --baseline "$ide" --candidate "$ide" --baseline-id ef99ec72 --candidate-id ef99ec72 --output "$RUNNER_TEMP/z16-baseline/$emit" --profile ci --scale 2 --mode fast --emit "$emit" --pairs 2 --warmups 1 --no-guard --cpu auto --require-identical-output
          done
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: z16-baseline-output-${{ github.run_id }}
          path: ${{ runner.temp }}/z16-baseline
          if-no-files-found: error
          retention-days: 14
