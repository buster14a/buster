name: PR 734 main reconcile

on:
  push:
    branches:
      - fix/722-post-tag-specifiers
    paths:
      - '.github/workflows/pr-734-main-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'buster14a/buster'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/722-post-tag-specifiers
          fetch-depth: 0

      - name: Probe merge conflicts against pinned main
        shell: bash
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 66ebcc793bdf7cf3f8311e71861ac139c11570b8
          status=$?
          echo '--- unresolved paths ---'
          git status --short
          echo '--- combined conflict diff ---'
          git diff --cc -- \
            src/buster/lib/compiler/frontend/c/c_parse.c \
            src/buster/tests/compiler/frontend/c/c_test.c
          exit "$status"
