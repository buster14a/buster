name: Prepare pinned hosted tools
on:
  workflow_call:
    outputs:
      artifact-name:
        description: Use this successful attempt's artifact even when only a failed consumer is rerun.
        value: ${{ jobs.prepare.outputs.artifact-name }}
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
    steps:
      - name: Check out the exact caller revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Name the immutable handoff
        id: identity
        shell: bash
        run: printf 'artifact-name=hosted-inputs-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Check acquisition and installation failure fixtures
        shell: bash
        run: bash tests/ci/hosted-tools.sh
      - name: Restore pinned release inputs
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/hosted-release-inputs
          key: hosted-inputs-v1-linux-x64-${{ hashFiles('tools/ci/hosted-tools.lock') }}
      - name: Acquire missing inputs once and verify the complete set
        shell: bash
        run: bash tools/ci/hosted-release.sh prepare "$RUNNER_TEMP/hosted-release-inputs"
      - name: Publish this attempt's fallback handoff before starting consumers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: ${{ runner.temp }}/hosted-release-inputs/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Seed reusable caches from the trusted default branch only
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/hosted-release-inputs
          key: hosted-inputs-v1-linux-x64-${{ hashFiles('tools/ci/hosted-tools.lock') }}
