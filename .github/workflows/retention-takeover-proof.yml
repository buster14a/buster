name: Image retention takeover proof
on:
  push:
    branches: ['codex/3674-retention-hosted-proof']
permissions:
  contents: read
jobs:
  retention:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout previous head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'e78f456f074501f007c6bfe4b5c78c84bf0fdf4d'
          path: baseline
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '526cb7d5d932854ef07ca4f2ce5b48968390211d'
          path: candidate
          persist-credentials: false
      - name: Install build prerequisite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mold
      - name: Build and reproduce old loaded-image deletion
        working-directory: baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retention-proof/baseline"
          git rev-parse HEAD
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/retention-driver-baseline"
          "$RUNNER_TEMP/retention-driver-baseline" generate --cc clang
          "$RUNNER_TEMP/retention-driver-baseline" build --config Release -t ide
          BUSTER_TEST_TEMPORARY_BASE="$RUNNER_TEMP/retention-proof/baseline" BUSTER_TEST_RETAIN_IMAGES=1 build/Release/ide test --module=compiler_driver_tests --ci=1 2>&1 | tee "$RUNNER_TEMP/retention-proof/baseline.log"
          test -z "$(find "$RUNNER_TEMP/retention-proof/baseline" -type f -name 'buster-c-image-retention-spawn-*' ! -name '*.c' -print -quit)"
          echo 'RETENTION_LOADED_IMAGE_CONTROL_V1 revision=e78f456f074501f007c6bfe4b5c78c84bf0fdf4d status=reproduced-deletion'
      - name: Build candidate and run full default suite
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retention-proof/default" "$RUNNER_TEMP/retention-proof/retained"
          git rev-parse HEAD
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/retention-driver-candidate"
          "$RUNNER_TEMP/retention-driver-candidate" generate --cc clang
          "$RUNNER_TEMP/retention-driver-candidate" build --config Release -t ide
          sha256sum build/Release/ide
          BUSTER_TEST_TEMPORARY_BASE="$RUNNER_TEMP/retention-proof/default" build/Release/ide test --ci=1 2>&1 | tee "$RUNNER_TEMP/retention-proof/default.log"
          test -z "$(find "$RUNNER_TEMP/retention-proof/default" -mindepth 1 -print -quit)"
          echo 'RETENTION_DEFAULT_CLEANUP_V1 revision=526cb7d5d932854ef07ca4f2ce5b48968390211d status=cleaned'
      - name: Run full retained suite and verify loaded image remains
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          BUSTER_TEST_TEMPORARY_BASE="$RUNNER_TEMP/retention-proof/retained" BUSTER_TEST_RETAIN_IMAGES=1 build/Release/ide test --ci=1 2>&1 | tee "$RUNNER_TEMP/retention-proof/retained.log"
          test -n "$(find "$RUNNER_TEMP/retention-proof/retained" -type f -name 'buster-c-image-retention-spawn-*' ! -name '*.c' -print -quit)"
          test -z "$(find "$RUNNER_TEMP/retention-proof/retained" -type f -name 'buster-c-image-retention-inactive-*' -print -quit)"
          find "$RUNNER_TEMP/retention-proof/retained" -type f -name 'buster-c-image-retention-spawn-*' ! -name '*.c' -exec sha256sum {} +
          echo 'RETENTION_LOADED_IMAGE_CONTROL_V1 revision=526cb7d5d932854ef07ca4f2ce5b48968390211d status=retained inactive_control=deleted'
      - name: Retain proof logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retention-takeover-proof
          path: |
            ${{ runner.temp }}/retention-proof/*.log
            candidate/build/CMakeCache.txt
            candidate/build/compile_commands.json
          if-no-files-found: warn
