name: Temporary QUALITY baseline correctness
on:
  push:
    branches: [diagnostics/133-event-equivalence-2e942e8]
    paths: [.github/workflows/diagnostic-133-baseline.yml]
permissions:
  contents: read
jobs:
  baseline:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      BUSTER_TEST_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2e942e80a87666409cf29d3e24a68d322b9e71fd
          persist-credentials: false
      - name: Configure and build pinned trusted compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quality-133-baseline"
          exec > >(tee "$RUNNER_TEMP/quality-133-baseline/build.log") 2>&1
          set -x
          git rev-parse HEAD 'HEAD^{tree}'
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o "$RUNNER_TEMP/quality-build"
          "$RUNNER_TEMP/quality-build" generate --ci --cc clang -- -DCMAKE_LINKER_TYPE=DEFAULT -DBUSTER_UNITY_BUILD=OFF
          "$RUNNER_TEMP/quality-build" build --config Release -t ide -- -j2
          sha256sum build/Release/ide
      - name: Existing self-host fixed point
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/quality-build" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/quality-133-baseline/self-host.log"
      - name: Existing native mode matrix
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/quality-build" test_mode_matrix --config Release 2>&1 | tee "$RUNNER_TEMP/quality-133-baseline/modes.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quality-133-baseline-correctness
          path: |
            ${{ runner.temp }}/quality-133-baseline
            build/compile_commands.json
            build/CMakeCache.txt
          retention-days: 14
          if-no-files-found: error
