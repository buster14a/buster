name: Temporary compatibility spawn diagnostic
on:
  push:
    branches:
      - codex/1399-compat-harness-spawn
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-spawn-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  correctness:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      BUSTER_TEST_JOBS: '2'
      BUSTER_MATRIX_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: madler/zlib
          ref: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          path: external/zlib
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: python/cpython
          ref: 8183fa5e3f78ca6ab862de7fb8b14f3d929421e0
          path: external/cpython
          persist-credentials: false
      - name: Retain exact source and tool provenance
        id: provenance
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence .ci-tools
          git rev-parse HEAD > evidence/revision.txt
          test "$(cat evidence/revision.txt)" = "$EXPECTED_REVISION"
          git rev-parse 'HEAD^{tree}' > evidence/tree.txt
          git archive --format=tar HEAD > evidence/buster-source.tar
          sha256sum build.c evidence/buster-source.tar > evidence/source.sha256
          for project in zlib cpython; do
            git -C "external/$project" rev-parse HEAD > "evidence/$project.commit"
            git -C "external/$project" rev-parse 'HEAD^{tree}' > "evidence/$project.tree"
            git -C "external/$project" status --porcelain --untracked-files=all > "evidence/$project.status"
            test ! -s "evidence/$project.status"
            git -C "external/$project" ls-tree -r HEAD > "evidence/$project.files"
          done
          test "$(cat evidence/zlib.commit)" = 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          test "$(cat evidence/cpython.commit)" = 8183fa5e3f78ca6ab862de7fb8b14f3d929421e0
          cp external/zlib/LICENSE evidence/zlib-LICENSE
          cp external/zlib/contrib/dotzlib/LICENSE_1_0.txt evidence/zlib-unused-dotzlib-LICENSE
          cp external/cpython/LICENSE evidence/cpython-LICENSE
          cp external/cpython/Modules/expat/COPYING evidence/cpython-expat-COPYING
          cp external/cpython/Modules/_decimal/libmpdec/basearith.c evidence/cpython-libmpdec-license-header.c
          cp external/cpython/Modules/_hacl/Hacl_Hash_SHA2.c evidence/cpython-hacl-license-header.c
          sha256sum evidence/*LICENSE* evidence/*COPYING evidence/*license-header.c > evidence/license-receipts.sha256
          clang --version > evidence/clang.txt
          gcc --version > evidence/gcc.txt
          python3 --version > evidence/host-python.txt
          uname -a > evidence/host.txt
          printf 'GitHub-hosted correctness only. CPython reference-only, Buster CPython compatibility and suites unrun. Temporary transport removed before repair PR.\n' > evidence/scope.txt
      - name: Build hosted driver and GCC syntax check
        id: driver
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o .ci-tools/build 2>&1 | tee evidence/driver-build.log
          gcc -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char -fsyntax-only build.c 2>&1 | tee evidence/gcc-syntax.log
          sha256sum .ci-tools/build > evidence/driver.sha256
      - name: Exercise actual compatibility spawn helpers
        id: spawn
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s .ci-tools/build compatibility_spawn_self_test 2>&1 | tee evidence/spawn.log
          rg '^COMPATIBILITY_SPAWN_SELF_TEST inheritance=pass overrides=pass invalid_environment=pass script0=pass legacy_script0=pass$' evidence/spawn.log
          rg '^COMPATIBILITY_SPAWN_SELF_TEST status=pass$' evidence/spawn.log
      - name: Exercise spawn helpers under ASan and UBSan
        id: sanitized
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char -g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined build.c -o .ci-tools/build-sanitized 2>&1 | tee evidence/driver-sanitized-build.log
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 timeout 90s .ci-tools/build-sanitized compatibility_spawn_self_test 2>&1 | tee evidence/spawn-sanitized.log
          rg '^COMPATIBILITY_SPAWN_SELF_TEST inheritance=pass overrides=pass invalid_environment=pass script0=pass legacy_script0=pass$' evidence/spawn-sanitized.log
          rg '^COMPATIBILITY_SPAWN_SELF_TEST status=pass$' evidence/spawn-sanitized.log
      - name: Clang-only CPython reference without a Buster compiler
        id: reference
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          test ! -e build/Release/ide
          timeout 1400s .ci-tools/build test_cpython --reference-only "$PWD/external/cpython" 2>&1 | tee evidence/cpython-reference.log
          test ! -e build/Release/ide
          rg '^CPYTHON_CONFIGURE tree=clang .* status=pass$' evidence/cpython-reference.log
          rg '^CPYTHON_BUILD tree=clang .* status=pass$' evidence/cpython-reference.log
          rg '^CPYTHON_REFERENCE_ONLY status=pass buster_validation=unrun suite=unrun$' evidence/cpython-reference.log
      - name: Compare CPython output with an independent host-Python invocation
        id: oracle
        if: ${{ !cancelled() && steps.reference.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          directories=(build/cpython-reference-self-test-*)
          test "${#directories[@]}" -eq 1
          directory="${directories[0]}"
          env PYTHONHASHSEED=0 TZ=UTC timeout 120s python3 "$directory/workload.py" > evidence/host-python.stdout 2> evidence/host-python.stderr
          test ! -s evidence/host-python.stderr
          cmp "$directory/reference-workload.stdout" evidence/host-python.stdout
          sha256sum "$directory/workload.py" "$directory/reference-workload.stdout" evidence/host-python.stdout > evidence/reference-oracle.sha256
          printf 'CPYTHON_HOST_ORACLE status=pass buster_validation=unrun suite=unrun\n' | tee evidence/reference-oracle.txt
      - name: Preserve reference tree before generate replaces build
        id: preserve_reference
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          directories=(build/cpython-reference-self-test-*)
          if test -d "${directories[0]}"; then
            tar -czf evidence/cpython-reference-tree.tar.gz "${directories[@]}"
            sha256sum evidence/cpython-reference-tree.tar.gz > evidence/cpython-reference-tree.tar.gz.sha256
          fi
      - name: Build Buster compiler for the pristine zlib gate
        id: compiler
        if: ${{ !cancelled() && steps.driver.outcome == 'success' && steps.preserve_reference.outcome == 'success' }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          .ci-tools/build generate --ci --cc clang --no-sanitize --no-fuzz --no-lto --linker DEFAULT 2>&1 | tee evidence/generate.log
          .ci-tools/build build --config Release -t ide 2>&1 | tee evidence/compiler-build.log
          sha256sum build/Release/ide > evidence/compiler.sha256
      - name: Full unmodified zlib compatibility and configure gate
        id: zlib
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          timeout 800s .ci-tools/build test_zlib --config Release "$PWD/external/zlib" 2>&1 | tee evidence/zlib.log
          rg '^ZLIB_CONFIGURE target=libz.a status=pass source=' evidence/zlib.log
          rg '^ZLIB_RESULT commit=51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf library_sources=15 test_sources=3 allocators=4 status=pass$' evidence/zlib.log
          python3 - <<'PY'
          import pathlib
          directories = list(pathlib.Path("build").glob("zlib-v1.3.1-*/configure-source"))
          assert len(directories) == 1, directories
          makefile = (directories[0] / "Makefile").read_text()
          assert "-include zconf.h" not in makefile
          assert (directories[0] / "libz.a").stat().st_size > 0
          print("ZLIB_IN_TREE_CONFIGURE status=pass forced_include=absent archive=present")
          PY
      - name: Preserve independent outcomes and require every bounded gate
        if: always()
        shell: bash
        env:
          PROVENANCE: ${{ steps.provenance.outcome }}
          DRIVER: ${{ steps.driver.outcome }}
          SPAWN: ${{ steps.spawn.outcome }}
          SANITIZED: ${{ steps.sanitized.outcome }}
          REFERENCE: ${{ steps.reference.outcome }}
          ORACLE: ${{ steps.oracle.outcome }}
          PRESERVE_REFERENCE: ${{ steps.preserve_reference.outcome }}
          COMPILER: ${{ steps.compiler.outcome }}
          ZLIB: ${{ steps.zlib.outcome }}
        run: |
          mkdir -p evidence
          printf 'provenance=%s\ndriver=%s\nspawn=%s\nsanitized=%s\nreference_only=%s\nhost_oracle=%s\npreserve_reference=%s\ncompiler=%s\nzlib=%s\nbuster_cpython=unrun\ncpython_suites=unrun\n' "$PROVENANCE" "$DRIVER" "$SPAWN" "$SANITIZED" "$REFERENCE" "$ORACLE" "$PRESERVE_REFERENCE" "$COMPILER" "$ZLIB" | tee evidence/outcomes.txt
          cat evidence/outcomes.txt >> "$GITHUB_STEP_SUMMARY"
          for result in "$PROVENANCE" "$DRIVER" "$SPAWN" "$SANITIZED" "$REFERENCE" "$ORACLE" "$PRESERVE_REFERENCE" "$COMPILER" "$ZLIB"; do
            test "$result" = success || exit 1
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compatibility-spawn-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            evidence
            build/cpython-reference-self-test-*
            build/zlib-*
