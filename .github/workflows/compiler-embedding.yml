name: Compiler embedding
on:
  pull_request:
    paths:
      - CMakeLists.txt
      - cmake/CompilerSdk.cmake
      - src/buster/lib/compiler/**
      - tools/embed_example/**
      - .github/workflows/compiler-embedding.yml
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - cmake/CompilerSdk.cmake
      - src/buster/lib/compiler/**
      - tools/embed_example/**
      - .github/workflows/compiler-embedding.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-embedding-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  embedding:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ubuntu-24.04
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Assert event source binding
        env:
          EMBEDDING_EVENT_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "EMBEDDING_SOURCE event=$EMBEDDING_EVENT_SHA checkout=$actual_sha"
          if [ "$actual_sha" != "$EMBEDDING_EVENT_SHA" ]; then
            echo "::error::Compiler embedding must build the immutable event revision"
            exit 1
          fi
      - name: Hosted bootstrap
        run: |
          mkdir -p build
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/compiler-embedding-driver"
      - name: Regress pre-SDK head with SDK-bearing merge tree
        run: |
          set -euo pipefail
          # Main immediately before #3469: real source without the SDK.
          pre_sdk=b6b2aa65016648c0f440c3960de1a61bf7942fa5
          git merge-base --is-ancestor "$pre_sdk" "$GITHUB_SHA"
          if git cat-file -e "$pre_sdk:cmake/CompilerSdk.cmake" 2>/dev/null; then
            echo "::error::The pre-SDK regression fixture unexpectedly contains the SDK"
            exit 1
          fi
          git cat-file -e "$GITHUB_SHA:cmake/CompilerSdk.cmake"
          # An empty commit creates a clean stale branch without modifying any
          # production source. Its synthetic merge must reproduce the event tree.
          stale_head="$(git -c user.name=embedding-regression -c user.email=embedding-regression@example.invalid commit-tree "$pre_sdk^{tree}" -p "$pre_sdk" -m 'Pre-SDK stale-head control for #3559')"
          merge_tree="$(git merge-tree --write-tree "$GITHUB_SHA" "$stale_head")"
          event_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          test "$merge_tree" = "$event_tree"
          merge_sha="$(git -c user.name=embedding-regression -c user.email=embedding-regression@example.invalid commit-tree "$merge_tree" -p "$GITHUB_SHA" -p "$stale_head" -m 'SDK-bearing merge control for #3559')"
          git cat-file -e "$merge_sha:cmake/CompilerSdk.cmake"
          old_source="$RUNNER_TEMP/compiler-embedding-pre-sdk"
          git worktree add --detach "$old_source" "$stale_head"
          (
            cd "$old_source"
            clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/compiler-embedding-pre-sdk-driver"
            "$RUNNER_TEMP/compiler-embedding-pre-sdk-driver" generate --ci --cc clang --config Release --no-sanitize --no-fuzz --no-lto --no-include-tests --linker DEFAULT -- -DBUSTER_COMPILER_SDK=ON
            if "$RUNNER_TEMP/compiler-embedding-pre-sdk-driver" build --config Release -t buster_compiler > "$RUNNER_TEMP/compiler-embedding-pre-sdk.log" 2>&1; then
              echo "::error::A source tree lacking the SDK incorrectly built buster_compiler"
              exit 1
            fi
            cat "$RUNNER_TEMP/compiler-embedding-pre-sdk.log"
            grep -F "unknown target 'buster_compiler'" "$RUNNER_TEMP/compiler-embedding-pre-sdk.log"
          )
          echo "EMBEDDING_STALE_HEAD_CONTROL head=$stale_head merge=$merge_sha tree=$merge_tree event=$GITHUB_SHA"
          {
            echo "## Compiler embedding source regression"
            echo "- Run: $GITHUB_RUN_ID / attempt $GITHUB_RUN_ATTEMPT"
            echo "- Actual event checkout: $GITHUB_SHA"
            echo "- Pre-SDK ancestor: $pre_sdk"
            echo "- Stale head: $stale_head (SDK target fails as expected)"
            echo "- Synthetic merge: $merge_sha"
            echo "- Synthetic merge and event share the exact source tree: $merge_tree"
            echo "- The following SDK/install/client steps exercise that integrated tree."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Configure SDK
        run: |
          "$RUNNER_TEMP/compiler-embedding-driver" generate --ci --cc clang --config Release --no-sanitize --no-fuzz --no-lto --no-include-tests --linker DEFAULT -- -DBUSTER_COMPILER_SDK=ON
      - name: Build and install SDK
        run: |
          "$RUNNER_TEMP/compiler-embedding-driver" build --config Release -t buster_compiler
          cmake --install build --prefix "$RUNNER_TEMP/compiler-sdk" --config Release
      - name: Build external client
        run: |
          cmake -S tools/embed_example -B "$RUNNER_TEMP/embed-example" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/compiler-sdk" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/embed-example" --config Release
      - name: Run external client
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/embed-example/buster_embed_example" | tee "$RUNNER_TEMP/compiler-embedding-client.log"
          grep -Fx "EMBED_EXAMPLE_RESULT ok" "$RUNNER_TEMP/compiler-embedding-client.log"
