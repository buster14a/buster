name: Wasm integer shim regression

on:
  pull_request:
    paths:
      - 'tools/wasm_integer_execution_startup.js'
      - 'tools/wasm_integer_execution_startup_test.js'
      - 'tests/wasm_integer_execution.js'
      - '.github/workflows/wasm-integer-shim-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/wasm_integer_execution_startup.js'
      - 'tools/wasm_integer_execution_startup_test.js'
      - 'tests/wasm_integer_execution.js'
      - '.github/workflows/wasm-integer-shim-tests.yml'
  merge_group:

permissions: {}

concurrency:
  group: wasm-integer-shim-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  no_code_plan:
    name: No-code plan
    permissions:
      contents: read
    if: ${{ github.server_url == 'https://github.com' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    uses: ./.github/workflows/ci-no-code-plan.yml

  test:
    needs: no_code_plan
    if: ${{ !cancelled() && (needs.no_code_plan.result != 'success' || needs.no_code_plan.outputs.no_code != 'true') && (github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ${{ matrix.os }}
          matrix-index: ${{ strategy.job-index }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Check startup shim syntax
        run: node --check tools/wasm_integer_execution_startup.js
      - name: Exercise frozen oracle and shutdown controls
        run: node tools/wasm_integer_execution_startup_test.js
