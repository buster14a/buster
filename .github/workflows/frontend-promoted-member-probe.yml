name: Frontend promoted-member audit record

# Final branch-only documentation step. The completed count probe remains at
# a3088798553cb4382ba92d2f2c6ed10c6806d6ee / run 36000545470.
# Remove this disposable workflow before opening the research PR.
on:
  push:
    branches: [research/frontend-promoted-member-counts-20260924-a9f2]

permissions:
  contents: read

jobs:
  record:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Mint the audit with the repository-owned tool
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/new_audit.py --self-test
          audit=$(python3 tools/new_audit.py --platform "GitHub-hosted Linux x86_64; deterministic counts, no timings" "Promoted-member duplicate checks are quadratic; total-compile materiality unmeasured")
          printf 'MINTED_AUDIT %s\n' "$audit"
          cat "$audit"
          python3 tools/new_audit.py --check
          python3 -c 'import ast,pathlib; ast.parse(pathlib.Path("tools/frontend_promoted_member_probe.py").read_text()); print("probe syntax: passed")'
          git diff --check
