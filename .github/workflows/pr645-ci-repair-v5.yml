name: PR 645 CI repair v5

on:
  push:
    branches:
      - codex/569-canonical-landing-20260914
    paths:
      - .github/workflows/pr645-ci-repair-v5.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply, validate, and publish repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/pr645_repair_v5.py
          python3 tools/native_retirement_contract_test.py
          python3 tools/native_retirement_materializer_test.py
          git diff --check

          git config user.name "ChatGPT Codex Connector"
          git config user.email "1144995+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git rm .github/workflows/pr645-ci-repair.yml \
                 .github/workflows/pr645-ci-repair-v2.yml \
                 .github/workflows/pr645-ci-repair-v3.yml \
                 .github/workflows/pr645-ci-repair-v4.yml \
                 .github/workflows/pr645-ci-repair-v5.yml \
                 .github/scripts/pr645_repair.py \
                 .github/scripts/pr645_repair_v3.py \
                 .github/scripts/pr645_repair_v4.py \
                 .github/scripts/pr645_repair_v5.py
          git add src/buster/lib/compiler/codegen/machine.c \
                  src/buster/tests/compiler/driver/driver_test.c \
                  tools/native_retirement_contract.py \
                  tools/native_retirement_contract_test.py \
                  tools/native_retirement_materializer.py \
                  tools/native_retirement_materializer_test.py \
                  docs/native-retirement-applicability-v1.tsv \
                  docs/native-retirement-dependencies-v1.json
          git commit -m "ci: repair PR 645 rebased acceptance checks"
          git push origin HEAD:codex/569-canonical-landing-20260914
