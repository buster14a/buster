name: A08 inspection
on:
  push:
    branches: [astra/a08-capability-evidence-20260909]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  inspect:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
      - name: Collect source and paginated repository evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a08"
          git archive HEAD | gzip > "$RUNNER_TEMP/a08/source.tar.gz"
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'a08'
          root = 'https://api.github.com/repos/buster14a/buster/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'buster-a08-inspection'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(root + path, headers=headers), timeout=30) as response:
                  return json.load(response)
          def pages(path):
              items = []
              for page in range(1, 101):
                  batch = get(path + ('&' if '?' in path else '?') + 'per_page=100&page=' + str(page))
                  items.extend(batch)
                  if len(batch) < 100:
                      break
              else:
                  raise RuntimeError('pagination exceeded inspection bound')
              return items
          def save(name, data):
              (out / (name + '.json')).write_text(json.dumps(data, indent=2) + '\n')
          issues = pages('issues?state=all&sort=created&direction=desc')
          prs = pages('pulls?state=all&sort=created&direction=desc')
          save('issues-all', issues)
          save('prs-all', prs)
          save('issue-comments-all', pages('issues/comments?sort=created&direction=asc'))
          save('review-comments-all', pages('pulls/comments?sort=created&direction=asc'))
          save('commits-recent', get('commits?sha=ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae&per_page=100'))
          selected = {36, 299, 309, 310, 307, 308, 357, 362}
          pattern = re.compile(r'wasm|wasi|uefi|ovmf|gpu|spir.?v|bitcode|capabilit|maturit|retire.*native', re.I)
          for pr in prs:
              number = pr['number']
              if number in selected or pattern.search((pr.get('title') or '') + '\n' + (pr.get('body') or '')):
                  save('pr-' + str(number) + '-files', pages('pulls/' + str(number) + '/files'))
                  save('pr-' + str(number) + '-reviews', pages('pulls/' + str(number) + '/reviews'))
          summary = {'baseline': 'ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae', 'open_issues': sum(i['state'] == 'open' and 'pull_request' not in i for i in issues), 'open_prs': sum(p['state'] == 'open' for p in prs), 'issues_and_prs': len(issues), 'prs': len(prs)}
          save('inventory', summary)
          print(json.dumps(summary))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a08-inspection
          path: ${{ runner.temp }}/a08
          if-no-files-found: error
          retention-days: 7
