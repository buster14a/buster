name: A09 same-host paired allocation census
on:
  push:
    branches: [astra/a09-memory-transport-20260909]
    paths: [.github/workflows/astra-a09-paired-census.yml]
permissions:
  contents: read
concurrency:
  group: a09-paired-census-${{ github.ref }}
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      BUSTER_TEST_JOBS: '1'
      BUSTER_MATRIX_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cce9e0393696c34a483c01d61997556d5b249d75
          path: candidate
          persist-credentials: false
      - name: Build observer compilers sequentially with identical flags
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a09-paired-census"
          clang --version > "$RUNNER_TEMP/a09-paired-census/compiler.txt"
          lscpu > "$RUNNER_TEMP/a09-paired-census/cpu.txt"
          free -b > "$RUNNER_TEMP/a09-paired-census/memory.txt"
          for variant in baseline candidate; do
            (
              cd "$variant"
              git rev-parse HEAD > "$RUNNER_TEMP/a09-paired-census/$variant.sha"
              clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g0 build.c -o "$RUNNER_TEMP/build-$variant"
              "$RUNNER_TEMP/build-$variant" generate --cc clang --ci --linker DEFAULT -DBUSTER_UNITY_BUILD=OFF -DBUSTER_INCLUDE_TESTS=OFF -DBUSTER_BENCH_ALLOCATIONS=ON
              "$RUNNER_TEMP/build-$variant" build --config Release -t ide -- -j1
              cp build/CMakeCache.txt "$RUNNER_TEMP/a09-paired-census/$variant-CMakeCache.txt"
              if test -f build/compile_commands.json; then cp build/compile_commands.json "$RUNNER_TEMP/a09-paired-census/$variant-compile-commands.json"; fi
            ) 2>&1 | tee "$RUNNER_TEMP/a09-paired-census/$variant-build.log"
          done
      - name: Identical inputs, environment, working directory and diagnostic census protocol
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'a09-paired-census'
          compilers = {variant: root / variant / 'build/Release/ide' for variant in ['baseline','candidate']}
          hashes = {variant: hashlib.sha256(path.read_bytes()).hexdigest() for variant,path in compilers.items()}
          environment = dict(os.environ, BUSTER_ALLOCATION_CENSUS='1')
          records = []
          for count in [0, 16, 4096, 16384]:
              source = 'int main(void) {\n' + ''.join(f'extern int fresh_{i}(void);\n' for i in range(count)) + 'return 0;\n}\n'
              path = out / f'fresh-{count}.c'
              path.write_text(source)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              for variant,compiler in compilers.items():
                  command = [str(compiler), 'cc', '-std=c17', '-g0', '-fsyntax-only', str(path)]
                  result = subprocess.run(command, cwd=root/'candidate', env=environment, text=True, capture_output=True, timeout=120)
                  log = out / f'{variant}-{count}.log'
                  log.write_text(result.stdout + result.stderr)
                  records.append(dict(variant=variant,count=count,source_sha256=digest,command=command,cwd=str(root/'candidate'),returncode=result.returncode))
                  (out/'commands.json').write_text(json.dumps(records,indent=2)+'\n')
                  assert result.returncode == 0, (variant,count,result.stderr)
                  subprocess.run(['python3',str(root/'candidate/tools/allocation_census.py'),'--input',str(log),'--output',str(out/f'{variant}-{count}')],check=True)
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest
          totals = []
          for count in [0,16,4096,16384]:
              reports = {variant: json.loads((out/f'{variant}-{count}/report.json').read_text()) for variant in compilers}
              totals.append(dict(count=count,baseline=reports['baseline']['totals'],candidate=reports['candidate']['totals'],identical=reports['baseline']['totals']==reports['candidate']['totals']))
          (out/'paired-totals.json').write_text(json.dumps(totals,indent=2)+'\n')
          (out/'binary-hashes.json').write_text(json.dumps(hashes,indent=2)+'\n')
          for variant,compiler in compilers.items():
              assert hashlib.sha256(compiler.read_bytes()).hexdigest() == hashes[variant]
          print(json.dumps(totals,indent=2))
          PY
          printf 'Diagnostic API traffic only, not timed compilers, RSS or physical-page accounting. Both variants used the same host, input path, flags, environment and working directory.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: a09-paired-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a09-paired-census/
          if-no-files-found: error
          retention-days: 14
