name: DWARF lifetime slice

# Independent correctness coverage and isolated issue-1375 cost diagnostics.
# Never selects a physical performance host.
on:
  push:
    branches:
      - main
      - codex/1375-dwarf-reused-home-validity
    paths:
      - src/buster/lib/compiler/codegen/codegen.c
      - src/buster/lib/compiler/machine/**
      - src/buster/lib/compiler/debug/**
      - src/buster/lib/compiler/dwarf/**
      - src/buster/tests/compiler/codegen/codegen_test.c
      - tools/debug_info_lifetime_oracle.py
      - .github/workflows/debug-lifetime-slice.yml
  pull_request:
    paths:
      - src/buster/lib/compiler/codegen/codegen.c
      - src/buster/lib/compiler/machine/**
      - src/buster/lib/compiler/debug/**
      - src/buster/lib/compiler/dwarf/**
      - src/buster/tests/compiler/codegen/codegen_test.c
      - tools/debug_info_lifetime_oracle.py
      - .github/workflows/debug-lifetime-slice.yml

permissions:
  contents: read

concurrency:
  group: dwarf-lifetime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lifetime:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      BUSTER_TEST_JOBS: 2
      SLICE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ubuntu-26.04
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Install independent debugger
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb
      - name: Freeze exact source and consumer identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/debug-evidence" "$RUNNER_TEMP/debug-compilers"
          source_ref="$SLICE_HEAD"
          if test "$GITHUB_REF" = refs/heads/codex/1375-dwarf-reused-home-validity; then
            source_ref=6fc08ec475694aeb3b1062c1d390483a69668508
          fi
          git worktree add --detach "$RUNNER_TEMP/debug-build" "$source_ref"
          cp tools/debug_info_lifetime_oracle.py "$RUNNER_TEMP/debug-evidence/oracle.py"
          {
            git rev-parse HEAD
            git rev-parse 'HEAD^{tree}'
            uname -a
            clang --version
            gdb --version
            readelf --version
            dpkg-query -W gdb
          } > "$RUNNER_TEMP/debug-evidence/identity.txt"
          cp /usr/share/doc/gdb/copyright "$RUNNER_TEMP/debug-evidence/gdb-copyright.txt"
      - name: Trusted baseline build at the matched path
        if: ${{ github.ref == 'refs/heads/codex/1375-dwarf-reused-home-validity' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/debug-build"
          clang -Isrc -I. -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/slice-driver"
          "$RUNNER_TEMP/slice-driver" generate --ci --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
          "$RUNNER_TEMP/slice-driver" build --config Release -t ide
          cp build/Release/ide "$RUNNER_TEMP/debug-compilers/baseline-ide"
          sha256sum "$RUNNER_TEMP/debug-compilers/baseline-ide" >> "$RUNNER_TEMP/debug-evidence/identity.txt"
      - name: Trusted candidate build at the matched path
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/debug-build"
          git checkout --detach "$SLICE_HEAD"
          clang -Isrc -I. -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/slice-driver"
          "$RUNNER_TEMP/slice-driver" generate --ci --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
          "$RUNNER_TEMP/slice-driver" build --config Release -t ide
          cp build/Release/ide "$RUNNER_TEMP/debug-compilers/candidate-ide"
          sha256sum "$RUNNER_TEMP/debug-compilers/candidate-ide" >> "$RUNNER_TEMP/debug-evidence/identity.txt"
      - name: Executed debugger and separate cost diagnostics
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/debug-build"
          args=(--ide "$RUNNER_TEMP/debug-compilers/candidate-ide" --print-summary --output "$RUNNER_TEMP/debug-evidence/lifetime")
          if test "$GITHUB_REF" = refs/heads/codex/1375-dwarf-reused-home-validity; then
            args+=(--baseline-ide "$RUNNER_TEMP/debug-compilers/baseline-ide" --expect-baseline-defect --trials 3)
          else
            args+=(--skip-costs)
          fi
          python3 "$RUNNER_TEMP/debug-evidence/oracle.py" "${args[@]}"
      - name: Candidate self-host fixed point
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' && github.ref == 'refs/heads/codex/1375-dwarf-reused-home-validity' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/debug-build"
          "$RUNNER_TEMP/slice-driver" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/debug-evidence/candidate-self-host.txt"
      - name: Retain machine records in existing evidence
        if: ${{ always() }}
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: retain
          retention-directory: ${{ runner.temp }}/debug-evidence
      - name: Retain exact-source evidence including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dwarf-lifetime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/debug-evidence
          if-no-files-found: error
          retention-days: 14
