name: DWARF lifetime slice

# Isolated issue-1375 diagnostics. Never selects a physical performance host.
on:
  push:
    branches: [codex/1375-dwarf-reused-home-validity]

permissions:
  contents: read

concurrency:
  group: dwarf-lifetime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      BUSTER_TEST_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install independent debugger
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb
      - name: Freeze baseline source and consumer identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/debug-evidence"
          git worktree add --detach "$RUNNER_TEMP/debug-build" 6fc08ec475694aeb3b1062c1d390483a69668508
          cp tools/debug_info_lifetime_oracle.py "$RUNNER_TEMP/debug-evidence/oracle.py"
          {
            git rev-parse HEAD
            git rev-parse 'HEAD^{tree}'
            uname -a
            clang --version
            gdb --version
            dpkg-query -W gdb
          } > "$RUNNER_TEMP/debug-evidence/identity.txt"
          cp /usr/share/doc/gdb/copyright "$RUNNER_TEMP/debug-evidence/gdb-copyright.txt"
      - name: Baseline build and self-host fixed point
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/debug-build"
          mkdir -p build
          clang -Isrc -I. -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o build/slice-driver
          build/slice-driver generate --ci --no-sanitize --no-fuzz --no-lto --debug-info OFF --linker DEFAULT
          build/slice-driver build --config Release -t ide
          build/slice-driver test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/debug-evidence/baseline-self-host.txt"
      - name: Executed baseline debugger reproduction
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/debug-build"
          python3 "$RUNNER_TEMP/debug-evidence/oracle.py" --ide "$RUNNER_TEMP/debug-build/build/Release/ide" --skip-costs --output "$RUNNER_TEMP/debug-evidence/baseline"
      - name: Retain exact-source evidence including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dwarf-lifetime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/debug-evidence
          if-no-files-found: error
          retention-days: 14
