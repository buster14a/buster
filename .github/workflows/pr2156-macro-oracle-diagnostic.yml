name: PR 2156 all boundary reference diagnostic

on:
  push:
    branches: [ci-pr2156-macro-oracle-20261001]

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bounded GCC and Clang oracles for all 25 boundary cases
        run: python3 tools/pr2156_macro_oracle_diagnostic.py --references --log-dir diagnostic-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr2156-reference-oracles-${{ github.run_id }}
          path: diagnostic-output
          retention-days: 7
