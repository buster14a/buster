name: Issue 1120 test budget publication
on:
  push:
    branches: [agent/1120-driver-workbench]
permissions:
  contents: write
jobs:
  publish-test-budget:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/1120-mixed-inputs
      - name: Declare the regression's two-worker scheduling budget
        run: |
          test "$(git rev-parse 'HEAD^{tree}')" = 27c007557d6665870ddc79b6c04c887b34fc45a9
          grep -Fx '== Test mixed source, object, archive and shared-library input routing' tools/ci/correctness.tests
          sed -i 's/^== Test mixed source, object, archive and shared-library input routing$/== Test mixed source, object, archive and shared-library input routing [2 CPUs]/' tools/ci/correctness.tests
          grep -Fx '== Test mixed source, object, archive and shared-library input routing [2 CPUs]' tools/ci/correctness.tests
          test "$(git diff --name-only)" = tools/ci/correctness.tests
          git diff --check
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add tools/ci/correctness.tests
          test "$(git write-tree)" = 1a3cc428413e2e9c673443b16f634cd6ac784484
          git commit -m 'test: declare mixed source driver regression CPU budget' -m 'The test starts up to two C compilation lanes. Match the correctness scheduler declaration without changing the validated compiler or fixtures.' -m 'Agent session: ChatGPT session; private permalink unavailable in the tool environment.' -m 'Model: OpenAI / GPT-6 Astra Pro'
          git push origin HEAD:refs/heads/agent/1120-mixed-inputs
          git rev-parse HEAD
