# Temporary diagnostics branch workflow; remove before proposing the source PR.
name: Mission 11 phase replay
on:
  push:
    branches: [diagnostics/mission11-phase-contract-bb96]
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUSTER_PHASE_BRIDGE_SOURCE: bb96b5d08e570aff3cbd473441d71ab0dc691d67
      BUSTER_PHASE_BRIDGE_TREE: 8247940875e8265e4e5f2e764b992a3c8e25ae80
      BUSTER_PHASE_BRIDGE_RUN: '35816178543'
      BUSTER_PHASE_BRIDGE_ATTEMPT: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Retrieve exact fresh producer bytes and record revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export BUSTER_PHASE_BRIDGE_INPUT="$RUNNER_TEMP/mission11/producer"
          printf 'BUSTER_PHASE_BRIDGE_INPUT=%s\n' "$BUSTER_PHASE_BRIDGE_INPUT" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/mission11/baseline"
          git rev-parse HEAD 'HEAD^{tree}' | tee "$RUNNER_TEMP/mission11/consumer-revisions.txt"
          gh api repos/buster14a/buster/actions/artifacts/10732058046/zip > "$RUNNER_TEMP/mission11/producer.zip"
          printf '%s  %s\n' cc6bea03b35b2aed69ba31812f54656b205f55a1cadf0298403406514e640c89 "$RUNNER_TEMP/mission11/producer.zip" | sha256sum -c -
          python3 -m zipfile -e "$RUNNER_TEMP/mission11/producer.zip" "$BUSTER_PHASE_BRIDGE_INPUT"
          git show bb96b5d08e570aff3cbd473441d71ab0dc691d67:tools/ci_matrix_phases.py > "$RUNNER_TEMP/mission11/baseline/ci_matrix_phases.py"
          cp tools/ci_matrix_phases_test.py tools/ci_matrix_phases_bridge_test.py "$RUNNER_TEMP/mission11/baseline/"
          sha256sum tools/ci_matrix_phases.py "$RUNNER_TEMP/mission11/baseline/ci_matrix_phases.py" | tee "$RUNNER_TEMP/mission11/consumer-files.txt"
      - name: Retain baseline rejection-control result
        run: |
          set +e
          set -uo pipefail
          export BUSTER_PHASE_BRIDGE_RETAIN="$RUNNER_TEMP/mission11/baseline-negatives"
          python3 "$RUNNER_TEMP/mission11/baseline/ci_matrix_phases_bridge_test.py" -v 2>&1 | tee "$RUNNER_TEMP/mission11/baseline.log"
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > "$RUNNER_TEMP/mission11/baseline-exit.txt"
          test "$result" -ne 0
      - name: Existing independent phase and native child controls
        run: |
          set -euo pipefail
          python3 tools/ci_matrix_phases_test.py -v 2>&1 | tee "$RUNNER_TEMP/mission11/independent.log"
      - name: Candidate direct replay and negative controls
        run: |
          set -euo pipefail
          export BUSTER_PHASE_BRIDGE_RETAIN="$RUNNER_TEMP/mission11/candidate-negatives"
          python3 tools/ci_matrix_phases_bridge_test.py -v 2>&1 | tee "$RUNNER_TEMP/mission11/candidate.log"
      - name: Retain every result and original byte stream
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mission11-phase-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mission11/
          if-no-files-found: error
          retention-days: 14
