name: Issue 1254 focused validation
on:
  push:
    branches: [work/1254-numeric-diagnostics-validation]
    paths:
      - .github/workflows/issue-1254-validation.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: issue-1254-focused-validation
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out isolated validation branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Extract focused failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess
          url = 'https://api.github.com/repos/buster14a/buster/actions/jobs/126670148991/logs'
          download = subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location', '--max-time', '60', '-H', 'Authorization: Bearer ' + os.environ['GH_TOKEN'], url], capture_output=True, text=True)
          if download.returncode:
              raise RuntimeError(download.stderr)
          lines = download.stdout.splitlines()
          selected = set()
          for i, line in enumerate(lines):
              if re.search(r'differ|mismatch|expected numeric|fixture|invalid octal|significand', line, re.I):
                  selected.update(range(max(0, i - 10), min(len(lines), i + 18)))
          report = '\n'.join(lines[i] for i in sorted(selected))
          if len(report) > 28000:
              report = report[-28000:]
          with open('.github/issue-1254-report.txt', 'w') as output:
              output.write(report + '\n')
          print(report)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/issue-1254-report.txt
          git commit -m 'Record focused issue 1254 validation evidence' -m 'Agent session: ChatGPT issue #1254 session (private session URL unavailable)' -m 'Model: OpenAI / GPT-6 Astra Pro' -m 'Signed-off-by: David Gonzalez Martin <davidgmbb@gmail.com>'
          git push origin HEAD:refs/heads/work/1254-numeric-diagnostics-validation
