name: issue-63-validation

on:
  push:
    branches:
      - fix/issue-63-resource-failures

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    env:
      BUSTER_MATRIX_SHARD: all
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/issue-63-resource-failures
          fetch-depth: 1
          persist-credentials: false
      - name: Install hosted toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mold
          python3 tools/ci_zig.py \
            --target x86_64-linux \
            --cache-directory "$RUNNER_TEMP/zig-archive" \
            --install-directory "$RUNNER_TEMP/zig"
      - name: Bootstrap build driver with Clang
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o build/build
      - name: Full configuration matrix
        shell: bash
        run: ./build/build test_all_combinations_ci --verbose=1
      - name: Release self-host
        shell: bash
        run: ./build/build test_self_host --config Release
