name: Issue 786 Windows p2 link diagnostic

on:
  push:
    branches:
      - fix/786-native-retirement-closure

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dump and reproduce sanitized p2 link
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPaths = @(& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw 'Visual Studio x86/x64 tools were not found' }
          & (Join-Path $VsPaths[0].Trim() 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          $ResourceDir = (& clang.exe -print-resource-dir).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $RuntimeDlls = @(Get-ChildItem -Path $ResourceDir -Filter 'clang_rt.asan_dynamic-x86_64.dll' -File -Recurse | Sort-Object FullName)
          if ($RuntimeDlls.Count -ne 1) { throw "Expected one ASan runtime under ${ResourceDir}; found $($RuntimeDlls.Count)" }
          $RuntimeDir = Split-Path -Parent $RuntimeDlls[0].FullName
          $env:PATH = "$RuntimeDir;$env:PATH"
          Write-Output "asan_runtime=$($RuntimeDlls[0].FullName)"

          $Driver = Join-Path $env:RUNNER_TEMP 'strict-build.exe'
          cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Driver generate --cc clang --ci --linker DEFAULT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Driver build --config Release -t ide
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Ide = (Resolve-Path 'build\Release\ide.exe').Path
          $Include = (Resolve-Path 'tests\differential').Path
          $Caller = Join-Path $env:RUNNER_TEMP 'abi-caller-sanitized.o'
          $SubjectP0 = Join-Path $env:RUNNER_TEMP 'abi-p0.o'
          $SubjectP2 = Join-Path $env:RUNNER_TEMP 'abi-p2.o'
          $ProgramP0 = Join-Path $env:RUNNER_TEMP 'abi-p0-sanitized.exe'
          $ProgramP2 = Join-Path $env:RUNNER_TEMP 'abi-p2-sanitized.exe'
          $LibraryPaths = @($env:LIB -split ';' | Where-Object { $_.Length -ne 0 })
          if ($LibraryPaths.Count -eq 0) { throw 'Visual Studio developer shell supplied no LIB search paths' }

          $Sanitize = @('-fsanitize=address,undefined', '-fno-sanitize-recover=all')
          $CallerArgs = @('-O0', '-fwrapv', '-fno-strict-aliasing', '-funsigned-char') + $Sanitize + @("-I$Include")
          foreach ($LibraryPath in $LibraryPaths) { $CallerArgs += "-L$LibraryPath" }
          $CallerArgs += @('tests\differential\abi_host.c', '-c', '-o', $Caller)
          & clang.exe @CallerArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Common = @(
            'cc', '-fregister-allocator=fast', '-fno-machine-fallback',
            '-fno-canonical-local-promotion', '-fno-frontend-ssa', '-fverify-codegen',
            '-fwrapv', '-fno-strict-aliasing', '-funsigned-char', "-I$Include"
          )
          foreach ($LibraryPath in $LibraryPaths) { $Common += "-L$LibraryPath" }
          & $Ide @Common '-fno-target-local-promotion' 'tests\differential\abi.c' '-c' '-o' $SubjectP0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Ide @Common '-ftarget-local-promotion' 'tests\differential\abi.c' '-c' '-o' $SubjectP2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Output '=== p0 CodeView ==='
          & llvm-readobj.exe --codeview $SubjectP0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output '=== p2 CodeView ==='
          & llvm-readobj.exe --codeview $SubjectP2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output '=== p0 raw .debug$S ==='
          & llvm-objdump.exe -s -j '.debug$S' $SubjectP0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output '=== p2 raw .debug$S ==='
          & llvm-objdump.exe -s -j '.debug$S' $SubjectP2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Output '=== p0 sanitized link ==='
          $LinkP0 = @() + $Sanitize
          foreach ($LibraryPath in $LibraryPaths) { $LinkP0 += "-L$LibraryPath" }
          $LinkP0 += @($Caller, $SubjectP0, '-o', $ProgramP0)
          & clang.exe -v @LinkP0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $ProgramP0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Output '=== p2 sanitized link ==='
          $LinkP2 = @() + $Sanitize
          foreach ($LibraryPath in $LibraryPaths) { $LinkP2 += "-L$LibraryPath" }
          $LinkP2 += @($Caller, $SubjectP2, '-o', $ProgramP2)
          & clang.exe -v @LinkP2
          $P2LinkExit = $LASTEXITCODE
          Write-Output "p2_link_exit=$P2LinkExit"
          if ($P2LinkExit -ne 0) { exit $P2LinkExit }
          & $ProgramP2
          exit $LASTEXITCODE
