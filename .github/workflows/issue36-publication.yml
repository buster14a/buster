name: Issue 36 candidate publication and validation
on:
  push:
    branches: [astra/issue36-atomic-publication]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1c3fcc78e13d5695fee362baf4b5246573ef6094
          persist-credentials: true
      - name: Register contention and portable aggregate controls
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          payload = ''
          patch = zlib.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '6ff9ea66455fea1462ca0d21639f3368a135d20f312c60b28298e1fa779c8d2a'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          p = pathlib.Path('src/buster/tests/compiler/driver/driver_test.c')
          text = p.read_text()
          first = text.index('S8("buster-a64-atomic-update")')
          end = text.index('// Count primitives are shared', first)
          fragment = text[first:end]
          assert fragment.count('function_count == 9') == 1
          text = text[:first] + fragment.replace('function_count == 9', 'function_count == 10') + text[end:]
          p.write_text(text)
          PY
          git diff --check
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add src/buster/tests/compiler/codegen/machine_test.c src/buster/tests/compiler/driver/driver_test.c tests/basic_c_aarch64_atomic_update_pair.c
          git commit -m 'test: register native atomic contention and separate portable aggregate oracles'
          git push origin HEAD:refs/heads/astra/issue36-aarch64-wide-atomic-rmw-cas
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline HEAD
  validate:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      BUSTER_TEST_JOBS: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - name: Release build and full suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue36-logs"
          exec > >(tee "$RUNNER_TEMP/issue36-logs/release.log") 2>&1
          git rev-parse HEAD
          clang --version
          uname -a
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/issue36-build"
          "$RUNNER_TEMP/issue36-build" generate --cc clang --ci --linker DEFAULT -DBUSTER_UNITY_BUILD=OFF
          "$RUNNER_TEMP/issue36-build" build --config Release -t test_all
      - name: Self-host fixed point and target mode matrix
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/issue36-logs/self-host-modes.log") 2>&1
          "$RUNNER_TEMP/issue36-build" test_self_host --config Release
          "$RUNNER_TEMP/issue36-build" test_mode_matrix --config Release
      - name: Native independent atomic controls
        if: ${{ !cancelled() && runner.arch == 'ARM64' }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/issue36-logs/atomic-oracles.log") 2>&1
          for opt in 0 2; do
            clang -std=gnu11 -O"$opt" -funsigned-char -fwrapv -fno-strict-aliasing tests/basic_c_aarch64_atomic_update_pair.c -latomic -o "$RUNNER_TEMP/atomic-reference-$opt"
            "$RUNNER_TEMP/atomic-reference-$opt"
            for cc in clang gcc; do
              "$cc" -std=gnu11 -O"$opt" -funsigned-char -fwrapv -fno-strict-aliasing -pthread tests/host_atomic_pair_contention.c tests/basic_c_atomic_pair_contention.c -latomic -o "$RUNNER_TEMP/atomic-contention-$cc-$opt"
              "$RUNNER_TEMP/atomic-contention-$cc-$opt"
            done
          done
          clang -c tests/aarch64_atomic_update_pair_oracle.s -o "$RUNNER_TEMP/atomic-oracle.o"
          objdump -dr "$RUNNER_TEMP/atomic-oracle.o"
      - name: Strict sanitizer full suite
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/issue36-logs/sanitizer.log") 2>&1
          "$RUNNER_TEMP/issue36-build" generate --build-dir build-san --cc clang --ci --linker DEFAULT --sanitize -DBUSTER_UNITY_BUILD=OFF
          "$RUNNER_TEMP/issue36-build" build --build-dir build-san --config Debug -t test_all
      - name: Preserve all validation logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue36-validation-${{ matrix.runner }}-${{ github.run_id }}
          path: ${{ runner.temp }}/issue36-logs
          retention-days: 7
