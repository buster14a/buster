name: Semantic policy probe
on:
  push:
    branches: [codex/semantic-policy-probe-20260924]
    paths: [.github/workflows/semantic-policy-probe.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retain exact baseline source for inspection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/semantic-source" "$RUNNER_TEMP/semantic-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/semantic-evidence/revisions.txt"
          git archive HEAD AGENTS.md CMakeLists.txt build.c build.sh docs/agents src/buster/lib/compiler/frontend/c src/buster/lib/compiler/driver src/buster/tests .github/workflows .github/actions tools/check_action_pins.py | gzip > "$RUNNER_TEMP/semantic-source/source.tar.gz"
          git ls-files '*target*' '*data_layout*' > "$RUNNER_TEMP/semantic-source/target-paths.txt"
          git ls-files '*target*' '*data_layout*' | xargs git archive HEAD | gzip > "$RUNNER_TEMP/semantic-source/target.tar.gz"
          sha256sum "$RUNNER_TEMP/semantic-source/"*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-source-${{ github.run_id }}
          path: ${{ runner.temp }}/semantic-source
          if-no-files-found: error
          retention-days: 7
      - name: Install existing hosted build prerequisite
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: Baseline compiler and self-host fixed point
        shell: bash
        run: |
          set -euo pipefail
          clang --version > "$RUNNER_TEMP/semantic-evidence/clang.txt"
          gcc --version > "$RUNNER_TEMP/semantic-evidence/gcc.txt"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/semantic-build"
          "$RUNNER_TEMP/semantic-build" generate --cc clang --ci 2>&1 | tee "$RUNNER_TEMP/semantic-evidence/generate.log"
          "$RUNNER_TEMP/semantic-build" build --config Release -t ide 2>&1 | tee "$RUNNER_TEMP/semantic-evidence/build.log"
          "$RUNNER_TEMP/semantic-build" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/semantic-evidence/self-host.log"
          cp build/Release/ide "$RUNNER_TEMP/semantic-evidence/ide-baseline"
          sha256sum build/Release/ide > "$RUNNER_TEMP/semantic-evidence/binary-sha256.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: semantic-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/semantic-evidence
          if-no-files-found: error
          retention-days: 7
