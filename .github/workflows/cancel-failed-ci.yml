name: Cancel remaining jobs after CI failure

# Invoked only by a job whose direct dependency has completed with failure.
# Keep Actions write permission off every build/test/fuzz/benchmark job.
on:
  workflow_call:

jobs:
  cancel:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel only this workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel")"
          case "$status" in
              202) echo '::notice::Cancellation requested for the failed CI run.' ;;
              409) echo '::notice::CI run already completed or being cancelled.' ;;
              *) echo "::error::Unable to cancel failed CI run (HTTP $status)." >&2; exit 1 ;;
          esac
