name: Pipeline audit patch transport

on:
  push:
    branches: [audit/pipeline-correctness-ebfdd117]
    paths: [.github/workflows/audit-pipeline-publish.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0d352502151ff15842197ee10aaa90ec03bc58ac
          fetch-depth: 0
      - name: Apply and verify locally tested source tree
        shell: bash
        env:
          PATCH_SHA256: 130da8dc90ecc96e643bb38a61a88dd5534fc8647b556e1994b396f60a9eb189
          EXPECTED_TREE: 3179b527b2b15f6bd1e13ba12c63f14a0e6673ff
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, re
          source = pathlib.Path('.github/workflows/audit-pipeline-publish.yml').read_text()
          encoded = re.search("encoded = '''([^']+)'''", source).group(1)
          # Repair a single transcription byte; both the patch and complete
          # resulting source tree are independently checked before any push.
          encoded = encoded.replace('KtrXbe7ZbRVmdUX', 'KtrXbe7ZtRVmdUX')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != os.environ['PATCH_SHA256']:
              raise SystemExit('Patch transport digest mismatch')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'alignment.patch').write_bytes(patch)
          PY
          git checkout --detach ebfdd11705bc470564e726857e498f1c82aa746c
          git apply --check "$RUNNER_TEMP/alignment.patch"
          git apply --index "$RUNNER_TEMP/alignment.patch"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'Buster compiler audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'c: preserve natural alignment of by-value parameter locals' | git commit-tree "$EXPECTED_TREE" -p ebfdd11705bc470564e726857e498f1c82aa746c)
          git push origin "$commit:refs/heads/audit/prepared-parameter-local-alignment"
          printf 'Published commit: %s\nTree: %s\n' "$commit" "$EXPECTED_TREE"
