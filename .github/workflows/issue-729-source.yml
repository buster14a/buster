name: Issue 729 repair CI format strings

on:
  push:
    branches:
      - codex/issue-729-workbench

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/fix-729-memory64-provenance
          fetch-depth: 1
          persist-credentials: true
      - name: Escape literal JSON braces and publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9f5012f6867efc32a4a3eb8a93ad72759728b3dc
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/buster/tests/compiler/driver/driver_test.c")
          text = path.read_text()

          def escape_format_object(source: str, marker: str, prefix: str) -> str:
              if source.count(marker) != 1:
                  raise SystemExit(f"expected one marker, found {source.count(marker)}: {marker}")
              marker_index = source.index(marker)
              object_start = source.rfind(prefix, 0, marker_index)
              if object_start < 0 or marker_index - object_start > 512:
                  raise SystemExit(f"formatter prefix not found near marker: {marker}")
              brace = object_start + len(prefix)
              if source[brace:brace + 2] == "{{" or source[brace] != "{":
                  raise SystemExit(f"unexpected opening brace state near marker: {marker}")
              source = source[:brace] + "{" + source[brace:]
              marker_index += 1
              close_marker = r'}\n"));'
              close = source.find(close_marker, marker_index)
              if close < 0 or close - marker_index > 512:
                  raise SystemExit(f"formatter closing brace not found near marker: {marker}")
              source = source[:close] + "}" + source[close:]
              return source

          repairs = [
              (r'\"reason\":\"memory64-flag-rejected\"', r'S8("WASM64_STACK_CAPABILITY '),
              (r'\"reason\":\"runtime-capability-unavailable\"', r'S8("WASM64_STACK_EXECUTION '),
              (r'\"reason\":\"node-not-found\"', r'S8("WASM64_STACK_CAPABILITY '),
          ]
          for marker, prefix in repairs:
              text = escape_format_object(text, marker, prefix)

          required = [
              r'WASM64_STACK_CAPABILITY {{\"status\":\"unsupported\"',
              r'\"flag\":\"--experimental-wasm-memory64\"}}\n',
              r'WASM64_STACK_EXECUTION {{\"status\":\"not-executed\"',
              r'\"reason\":\"runtime-capability-unavailable\"}}\n',
              r'WASM64_STACK_CAPABILITY {{\"status\":\"unavailable\"',
              r'\"reason\":\"node-not-found\"}}\n',
          ]
          for needle in required:
              if text.count(needle) != 1:
                  raise SystemExit(f"repaired formatter string missing or duplicated: {needle}")
          comparison = (r'S8("WASM64_STACK_CAPABILITY {\"status\":\"unsupported\","'
                        r'\n                                                                "\"reason\":\"memory64-probe-rejected\"}"))')
          if comparison not in text:
              raise SystemExit("the direct-runtime comparison oracle was modified")
          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = src/buster/tests/compiler/driver/driver_test.c
          git add src/buster/tests/compiler/driver/driver_test.c
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'tests: escape Memory64 provenance JSON braces'
          git push origin HEAD:refs/heads/codex/fix-729-memory64-provenance
          printf 'Published commit %s\nSource blob %s\nEscaped literal JSON braces in three formatter messages.\n' \
            "$(git rev-parse HEAD)" "$(git hash-object src/buster/tests/compiler/driver/driver_test.c)" >> "$GITHUB_STEP_SUMMARY"
