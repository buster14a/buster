name: Issue 729 repair CI format strings

on:
  push:
    branches:
      - codex/issue-729-workbench

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/fix-729-memory64-provenance
          fetch-depth: 1
          persist-credentials: true
      - name: Escape literal JSON braces and publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9f5012f6867efc32a4a3eb8a93ad72759728b3dc
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/buster/tests/compiler/driver/driver_test.c")
          text = path.read_text()
          replacements = [
              (r'WASM64_STACK_CAPABILITY {\"status\":\"unsupported\"',
               r'WASM64_STACK_CAPABILITY {{\"status\":\"unsupported\"'),
              (r'\"flag\":\"--experimental-wasm-memory64\"}\n',
               r'\"flag\":\"--experimental-wasm-memory64\"}}\n'),
              (r'WASM64_STACK_EXECUTION {\"status\":\"not-executed\"',
               r'WASM64_STACK_EXECUTION {{\"status\":\"not-executed\"'),
              (r'\"reason\":\"runtime-capability-unavailable\"}\n',
               r'\"reason\":\"runtime-capability-unavailable\"}}\n'),
              (r'WASM64_STACK_CAPABILITY {\"status\":\"unavailable\"',
               r'WASM64_STACK_CAPABILITY {{\"status\":\"unavailable\"'),
              (r'\"reason\":\"node-not-found\"}\n',
               r'\"reason\":\"node-not-found\"}}\n'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence, found {count}: {old}")
              text = text.replace(old, new)
          required = [
              r'WASM64_STACK_CAPABILITY {{\"status\":\"unsupported\"',
              r'\"flag\":\"--experimental-wasm-memory64\"}}\n',
              r'WASM64_STACK_EXECUTION {{\"status\":\"not-executed\"',
              r'\"reason\":\"runtime-capability-unavailable\"}}\n',
              r'WASM64_STACK_CAPABILITY {{\"status\":\"unavailable\"',
              r'\"reason\":\"node-not-found\"}}\n',
          ]
          for needle in required:
              if text.count(needle) != 1:
                  raise SystemExit(f"repaired formatter string missing or duplicated: {needle}")
          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = src/buster/tests/compiler/driver/driver_test.c
          git add src/buster/tests/compiler/driver/driver_test.c
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'tests: escape Memory64 provenance JSON braces'
          git push origin HEAD:refs/heads/codex/fix-729-memory64-provenance
          printf 'Published commit %s\nSource blob %s\nEscaped literal JSON braces in three formatter messages.\n' \
            "$(git rev-parse HEAD)" "$(git hash-object src/buster/tests/compiler/driver/driver_test.c)" >> "$GITHUB_STEP_SUMMARY"
