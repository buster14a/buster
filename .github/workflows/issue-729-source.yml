name: Issue 729 publish verified fix

on:
  push:
    branches:
      - codex/issue-729-workbench

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fb008bb377d5bbf198b6b673c6797cdc5d8fead3
          persist-credentials: true
      - name: Verify and publish the tested patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = fb008bb377d5bbf198b6b673c6797cdc5d8fead3
          test "$(git rev-parse HEAD:src/buster/tests/compiler/driver/driver_test.c)" = 0807ae0dbdf1caaa39c0056346b9a44d1da40857
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/issue-729.patch.xz" > "$RUNNER_TEMP/issue-729.patch.xz"
          python3 - <<'PY'
          import hashlib, lzma, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          patch = lzma.decompress((root / 'issue-729.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == 'cf66c01f25864d6a6f5692d8d47f5337ae2aebca0b25256c0a14eac9e3ad8999'
          (root / 'issue-729.patch').write_bytes(patch)
          PY
          git apply --index "$RUNNER_TEMP/issue-729.patch"
          git diff --cached --check
          test "$(git diff --cached --name-only)" = src/buster/tests/compiler/driver/driver_test.c
          test "$(git hash-object src/buster/tests/compiler/driver/driver_test.c)" = a32e14f9b96e6194438aedefbca2072efef30e4e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: report actual Memory64 runtime provenance'
          git push origin HEAD:refs/heads/codex/fix-729-memory64-provenance
          printf 'Published commit %s\nSource blob %s\nPatch SHA-256 %s\n' \
            "$(git rev-parse HEAD)" "$(git hash-object src/buster/tests/compiler/driver/driver_test.c)" \
            cf66c01f25864d6a6f5692d8d47f5337ae2aebca0b25256c0a14eac9e3ad8999 >> "$GITHUB_STEP_SUMMARY"
