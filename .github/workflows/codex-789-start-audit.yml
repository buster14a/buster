name: Start issue 789 Zen 5 audit

on:
  push:
    branches:
      - audit/789-fast-live-range-worklist-20260918

permissions:
  actions: write
  contents: read

jobs:
  start:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the existing dedicated audit workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run zen5-audit.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME"
