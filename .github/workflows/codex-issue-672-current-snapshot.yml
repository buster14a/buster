name: Codex issue 672 complete payload extraction

on:
  push:
    branches:
      - codex/issue-672-float16-codegen-20260918

permissions:
  contents: read

jobs:
  payload:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ff2131d7a4dd025d45fea7815e5037115aa7f800
          fetch-depth: 1
          persist-credentials: false
      - name: Archive complete recovered implementation payload
        run: tar -czf issue-672-complete-payload.tar.gz .github/issue672-payload
      - name: Upload complete recovered implementation payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-672-complete-recovered-payload
          path: issue-672-complete-payload.tar.gz
          retention-days: 1
