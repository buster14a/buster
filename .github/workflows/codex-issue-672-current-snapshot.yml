name: Codex issue 672 current snapshot

on:
  push:
    branches:
      - codex/issue-672-float16-codegen-20260918

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact checked-out sources
        run: git archive --format=tar.gz --output=issue-672-source.tar.gz HEAD
      - name: Upload exact checked-out sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-672-current-main-source
          path: issue-672-source.tar.gz
          retention-days: 1
