name: Publish unevaluated operand fix
on:
  push:
    branches: [work/2026-09-06-integration-gates]
    paths: [.github/workflows/publish-unevaluated-fix.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5d4cd562ad97235a5841f95195b07fcd2ce4698a
          persist-credentials: false
      - name: Verify and publish the reconciled implementation and IR tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin 2c61f42ec1047c500bd093726c4cd6ec389d83de
          python3 - <<'PY'
          import base64, hashlib, os, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          patch = subprocess.check_output(['git', 'show', '2c61f42ec1047c500bd093726c4cd6ec389d83de:.github/integration/constant-p-reconciled.patch'])
          assert hashlib.sha256(patch).hexdigest() == '3f22a50dc5f1579553b9ed0d84bf6ad6c4fcd34f4d4a78132991b67d3e86d9a3'
          base = '5d4cd562ad97235a5841f95195b07fcd2ce4698a'
          branch = 'refs/heads/fix/2026-09-06-fortified-memory-builtins'
          assert git('rev-parse', 'HEAD') == base
          observed = git('ls-remote', 'origin', branch).split()[0]
          assert observed == base, 'Branch moved; preserving ' + observed
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          paths = ['src/buster/lib/compiler/frontend/c/c_gen.c', 'src/buster/tests/compiler/frontend/c/c_test.c']
          assert sorted(git('diff', '--name-only').splitlines()) == paths
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          assert git('write-tree') == '44a511b20b4d39efd861b98f9f0d02842144e3d5'
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'c: keep constant predicates unevaluated and reject effectful comma constants'], check=True)
          env = os.environ.copy()
          token = env.pop('GH_TOKEN')
          env['GIT_CONFIG_COUNT'] = '1'
          env['GIT_CONFIG_KEY_0'] = 'http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0'] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode()
          subprocess.run(['git', 'push', 'origin', 'HEAD:' + branch], env=env, check=True)
          print('Published:', git('rev-parse', 'HEAD'), git('rev-parse', 'HEAD^{tree}'))
          PY
