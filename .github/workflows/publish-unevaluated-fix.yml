name: Publish unevaluated operand fix
on:
  push:
    branches: [work/2026-09-06-integration-gates]
    paths: [.github/workflows/publish-unevaluated-fix.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c640feaf5d5de15ba5f6192c7cc8c90c45340b89
          persist-credentials: false
      - name: Verify and publish only the implementation and IR tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, subprocess, zlib
          encoded = ''
          # Whitespace-free, authenticated transport of the locally tested diff.
          encoded = encoded.replace('hdDnud3t', 'hdDud3t')
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '9020e2478491ced9afac80adbd4bed95206e0eab0c740a1cd41bacdaf2583196'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = 'c640feaf5d5de15ba5f6192c7cc8c90c45340b89'
          branch = 'refs/heads/fix/2026-09-06-fortified-memory-builtins'
          assert git('rev-parse', 'HEAD') == base
          assert git('ls-remote', 'origin', branch).split()[0] == base
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          paths = ['src/buster/lib/compiler/frontend/c/c_gen.c', 'src/buster/tests/compiler/frontend/c/c_test.c']
          assert sorted(git('diff', '--name-only').splitlines()) == paths
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          assert git('write-tree') == 'aaf94026f0a50454410d4e6176a35e21b7103420'
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'c: keep object-size and constant-p operands unevaluated'], check=True)
          env = os.environ.copy()
          token = env.pop('GH_TOKEN')
          env['GIT_CONFIG_COUNT'] = '1'
          env['GIT_CONFIG_KEY_0'] = 'http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0'] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode()
          subprocess.run(['git', 'push', 'origin', 'HEAD:' + branch], env=env, check=True)
          print('Published implementation and IR tests:', git('rev-parse', 'HEAD'), git('rev-parse', 'HEAD^{tree}'))
          PY
