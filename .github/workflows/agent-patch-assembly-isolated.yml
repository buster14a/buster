name: Temporary isolated assembly issue fixes

on:
  push:
    branches:
      - agent/inspect-190-195
    paths:
      - .github/agent_patch_assembly_one.py
      - .github/workflows/agent-patch-assembly-isolated.yml

permissions:
  contents: write

jobs:
  patch-test-publish:
    strategy:
      fail-fast: false
      matrix:
        issue: [190, 191, 192, 193]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Prepare clean main worktree and apply isolated fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          worktree="$RUNNER_TEMP/assembly-${{ matrix.issue }}"
          rm -rf "$worktree"
          git worktree add --detach "$worktree" origin/main
          python3 .github/agent_patch_assembly_one.py "$worktree" "${{ matrix.issue }}"
          git -C "$worktree" diff --check
          git -C "$worktree" diff --stat
      - name: Install Vulkan SDK
        shell: bash
        run: bash "$RUNNER_TEMP/assembly-${{ matrix.issue }}/.github/scripts/install-vulkan-sdk.sh"
      - name: Build compiler
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assembly-${{ matrix.issue }}"
          driver="$RUNNER_TEMP/buster-build-${{ matrix.issue }}"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver"
          "$driver" generate --cc clang --ci --linker DEFAULT
          "$driver" build --config Release -t ide --verbose
      - name: Verify reported reproducer
        shell: bash
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/assembly-${{ matrix.issue }}"
          cd "$worktree"
          ide=build/Release/ide
          issue="${{ matrix.issue }}"
          extract_text() {
            objcopy --dump-section ".text=$2" "$1"
          }
          compare_source() {
            local name="$1"
            local source="$2"
            printf '%s\n' "$source" > "$RUNNER_TEMP/$name.s"
            "$ide" cc -c -march=diamondrapids "$RUNNER_TEMP/$name.s" -o "$RUNNER_TEMP/$name-buster.o"
            clang -c -march=diamondrapids "$RUNNER_TEMP/$name.s" -o "$RUNNER_TEMP/$name-clang.o"
            extract_text "$RUNNER_TEMP/$name-buster.o" "$RUNNER_TEMP/$name-buster.bin"
            extract_text "$RUNNER_TEMP/$name-clang.o" "$RUNNER_TEMP/$name-clang.bin"
            echo "$name buster: $(od -An -tx1 -v "$RUNNER_TEMP/$name-buster.bin")"
            echo "$name clang : $(od -An -tx1 -v "$RUNNER_TEMP/$name-clang.bin")"
            cmp "$RUNNER_TEMP/$name-buster.bin" "$RUNNER_TEMP/$name-clang.bin"
          }
          case "$issue" in
            190)
              printf '%s\n' '.text
              .globl f
              f:
                adcx %rax, %rcx
                adox %rax, %rcx
                ret' > "$RUNNER_TEMP/apx_pp.s"
              "$ide" cc -c -march=diamondrapids "$RUNNER_TEMP/apx_pp.s" -o "$RUNNER_TEMP/apx_pp.o"
              extract_text "$RUNNER_TEMP/apx_pp.o" "$RUNNER_TEMP/apx_pp.bin"
              python3 - "$RUNNER_TEMP/apx_pp.bin" <<'PY'
          from pathlib import Path
          import sys
          data = Path(sys.argv[1]).read_bytes()
          expected = bytes.fromhex('62 f4 fd 08 66 c8 62 f4 fe 08 66 c8 c3')
          if data != expected:
              raise SystemExit(f'APX mandatory-prefix bytes differ: got {data.hex(" ")}, expected {expected.hex(" ")}')
          PY
              compare_source apx_vvvv '.text
              .globl f
              f:
                shlx %r17, %r18, %r19
                sarx %r20, %r21, %r22
                shrx %r24, %r25, %r26
                pdep %r17, %r18, %r19
                pext %r20, %r21, %r22
                andn %r24, %r25, %r26
                blsi %r17, %r18
                mulx %r20, %r21, %r22
                rorx $7, %r24, %r25
                ret'
              ;;
            191)
              compare_source evex_broadcast '.text
              .globl f
              f:
                vaddps 64(%rax){1to16}, %zmm1, %zmm2
                vaddpd 512(%rax){1to8}, %zmm1, %zmm2
                vpaddd -128(%rax){1to16}, %zmm1, %zmm2
                ret'
              ;;
            192)
              compare_source rex2_memory_width '.text
              .globl f
              f:
                addq $1, (%r16)
                adcq $2, 16(%r17)
                btsq $3, (%r18)
                lock addq $1, %fs:(%r19)
                ret'
              ;;
            193)
              printf '%s\n' '.text
              .globl f
              f:
                bts $3, (%r23)
                ret' > "$RUNNER_TEMP/bts_unsized.s"
              if "$ide" cc -c -march=diamondrapids "$RUNNER_TEMP/bts_unsized.s" -o "$RUNNER_TEMP/bts_unsized-buster.o"; then
                clang -c -march=diamondrapids "$RUNNER_TEMP/bts_unsized.s" -o "$RUNNER_TEMP/bts_unsized-clang.o"
                extract_text "$RUNNER_TEMP/bts_unsized-buster.o" "$RUNNER_TEMP/bts_unsized-buster.bin"
                extract_text "$RUNNER_TEMP/bts_unsized-clang.o" "$RUNNER_TEMP/bts_unsized-clang.bin"
                cmp "$RUNNER_TEMP/bts_unsized-buster.bin" "$RUNNER_TEMP/bts_unsized-clang.bin"
              else
                echo 'bts with unsized memory is diagnosed instead of being reinterpreted as bt'
              fi
              for mnemonic in adds cmps movs; do
                printf '.text\n.globl f\nf:\n  %s $3, (%%rax)\n  ret\n' "$mnemonic" > "$RUNNER_TEMP/$mnemonic.s"
                if "$ide" cc -c -march=diamondrapids "$RUNNER_TEMP/$mnemonic.s" -o "$RUNNER_TEMP/$mnemonic.o"; then
                  echo "$mnemonic unexpectedly assembled" >&2
                  exit 1
                fi
              done
              compare_source x87_typed_suffix '.text
              .globl f
              f:
                fiadds (%rax)
                ret'
              ;;
          esac
      - name: Run full Release suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assembly-${{ matrix.issue }}"
          "$RUNNER_TEMP/buster-build-${{ matrix.issue }}" build --config Release -t test_all --verbose
      - name: Publish clean fix branch
        shell: bash
        run: |
          set -euo pipefail
          issue="${{ matrix.issue }}"
          worktree="$RUNNER_TEMP/assembly-$issue"
          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$issue" == 193 ]]; then
            git -C "$worktree" add src/buster/lib/compiler/assembly/assembly.c
          else
            git -C "$worktree" add src/buster/lib/compiler/assembly/x86_64_metadata.c
          fi
          git -C "$worktree" commit -m "assembly: fix issue #$issue"
          git -C "$worktree" push --force origin "HEAD:agent/fix-assembly-$issue"
