name: Hosted correctness row

# One row of 9700x.yml's hosted correctness matrix (its `test` job calls this once per host architecture and sanitizer):
# the row's inventory as 4 shards, a runner each, and, for a row whose compiler can run on any runner, the job that
# builds that compiler once for them (#2032; docs/ci.md, "Shared row products"). A native row's shards build their own:
# a `-march=native` build is the CPU's it was built on, and hosted runners' CPUs differ (#2033 gives the vector row an
# explicit target first).
on:
  workflow_call:
    inputs:
      host_arch:
        description: BUSTER_HOST_ARCH, x86-64 or native
        type: string
        required: true
      sanitizer:
        description: BUSTER_SANITIZER, none, address, thread or memory
        type: string
        required: true
      optimization:
        description: BUSTER_SANITIZER_OPTIMIZATION
        type: number
        required: true
      hosted-tools:
        description: The prepare-hosted-tools job's verified handoff (its artifact-name output)
        type: string
        required: true
      performance:
        description: The changes job's performance output; empty where that job is skipped, which runs the readers' qualification
        type: string
        required: false
        default: ''

permissions:
  contents: read

# The build's settings, the same for the job that builds a shared product and for the shards that run it: the product's
# identity (tools/ci/hosted-product.sh) includes build.sh's record of them, which each shard compares with its own.
env:
  BUSTER_HOST_ARCH: ${{ inputs.host_arch }}
  BUSTER_SANITIZER: ${{ inputs.sanitizer }}
  BUSTER_SANITIZER_OPTIMIZATION: ${{ inputs.optimization }}
  BUSTER_LINKER: ${{ inputs.sanitizer == 'none' && 'auto' || 'lld' }}
  # Nothing here reads the executable's debug information, which takes a fifth of the build's time; the inventory's own
  # build.sh calls (check-call-graph) configure and build in the checkout's tree.
  BUSTER_DEBUG_INFO: '0'

jobs:
  # The row's compiler, built once where every runner can run it: the explicitly portable x86-64 baseline, whose rows
  # (plain, ASan, TSan and MSan) are the shared ones. It builds what each shard built (the pragma oracle, the clang
  # server where this toolchain has one, the compiler), runs the one inventory heading that reads the build's tree
  # rather than the executable (unity fixture ownership), packs the products with their identity and publishes them as
  # an artifact of this run alone: no cache, and nothing another run, branch or pull request can read or supply. Its
  # outputs, the attempt's artifact name and the archive's SHA-256, are what each shard checks the download against, so
  # a rerun shard reads the attempt that succeeded. Its name must not end like a shard's, `(Clang ..., shard K of N)`:
  # tools/ci/nightly.c counts the shards of the plain rows by their names.
  compiler:
    name: Build the compiler once for the row's shards
    if: inputs.host_arch == 'x86-64'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
      digest: ${{ steps.pack.outputs.digest }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Name this attempt's product
        id: name
        run: printf 'artifact=compiler-%s-%s-O%s-%s\n' "$BUSTER_HOST_ARCH" "$BUSTER_SANITIZER" "$BUSTER_SANITIZER_OPTIMIZATION" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Restore verified hosted release inputs
        uses: ./.github/actions/hosted-tools
        with:
          artifact-name: ${{ inputs.hosted-tools }}

      - name: Install official Clang 23.1.4 and test tools
        run: bash tools/ci/setup-hosted.sh

      - name: Report sanitizer host kernel, CPU, seccomp and ptrace state
        if: inputs.sanitizer != 'none'
        continue-on-error: true
        run: bash tools/ci/sanitizers.sh host

      # The build runs the instrumented executable (its post-link step bakes the backend's tables), and so does the
      # ownership heading: under the shards' fatal policy, with the detectors proven first and the reports audited after.
      - name: Set fatal sanitizer policy and verify every enabled detector
        if: inputs.sanitizer != 'none'
        run: |
          bash tools/ci/sanitizers.sh configure "$RUNNER_TEMP/sanitizer-reports"
          bash tools/ci/sanitizers.sh probe "$RUNNER_TEMP/sanitizer-probes"

      - name: Fetch generic baseline startup objects and runtime for emulation
        # build.sh links the plain row's compiler against it (BUSTER_HOST_RUNTIME), and the QEMU step runs that.
        if: inputs.sanitizer == 'none'
        run: bash tools/ci/setup-baseline-runtime.sh

      - name: Check product packing and verification failure fixtures
        run: bash tests/ci/hosted-product.sh

      - name: Build the external Clang pragma oracle, the clang server and the compiler
        run: bash tools/ci/hosted-product.sh build

      - name: Check unity fixture ownership on the build's tree
        run: bash tools/ci/hosted-product.sh ownership

      - name: Reject sanitizer reports from the build and the ownership check
        if: ${{ !cancelled() && inputs.sanitizer != 'none' }}
        run: bash tools/ci/sanitizers.sh audit "$RUNNER_TEMP/sanitizer-reports"

      - name: Pack the products with their identity
        id: pack
        run: bash tools/ci/hosted-product.sh pack "$RUNNER_TEMP/compiler-product"

      - name: Publish the product to this run's shards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ runner.temp }}/compiler-product/product.tar.zst
          # Already compressed: zstd at its third level takes the plain compiler from 50 MB to 15 MB.
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Preserve the build's sanitizer diagnostics and detector proofs
        if: ${{ always() && inputs.sanitizer != 'none' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanitizers-${{ inputs.host_arch }}-${{ inputs.sanitizer }}-O${{ inputs.optimization }}-build-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sanitizer-reports
            ${{ runner.temp }}/sanitizer-probes
            build/compile_commands.json
            LICENSE
            THIRD_PARTY_NOTICES.md
            LICENSES/
          if-no-files-found: error
          retention-days: 14

  shards:
    name: Tests on Ubuntu 26.04 (Clang 23, ${{ inputs.host_arch }}, ${{ inputs.sanitizer }}, O${{ inputs.optimization }}, shard ${{ matrix.shard }} of 4)
    # A shared row's shards start when its product is published, and fail at once without one (a failed, cancelled or
    # skipped build): no shard falls back to building or fetching it. A native row's shards don't wait: its `compiler`
    # job is skipped.
    needs: compiler
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    # The sanitizer rows run their shard of the inventory on runners whose detectors make it several times slower; the
    # driver's in-process commands take tens of minutes each there. Unsharded, the plain rows took up to 80 minutes and the
    # MSan rows 98, so the plain rows keep a 120-minute bound and the sanitizer rows 360.
    timeout-minutes: ${{ inputs.sanitizer == 'none' && 120 || 360 }}
    strategy:
      # On a pull request, the first failing shard cancels the others, and 9700x.yml's matrix the other rows. Elsewhere
      # every shard runs to its end: these rows are main's sanitizer coverage, and one detector's failure must not hide
      # what the others find.
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        # Each row's inventory runs as 4 shards, a runner each (`parallel --shard K/4`, dealt by
        # tools/ci/correctness.costs): a plain row's test step took about 14.5 minutes on one 4-CPU runner, and its
        # shards take about 2 to 4. The job's name and the run step's `/4` must match this
        # list, which tools/ci/changes.c's self-test checks (changes_shard_policy).
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    env:
      BUSTER_ORACLE_CACHE: check
      # The native plain row also runs each of the semantic driver's in-process and served runs as a child and fails on
      # a difference (test-checker-driver --differential, #2071); the other rows run them in-process and served alone.
      BUSTER_DRIVER_DIFFERENTIAL: ${{ inputs.host_arch == 'native' && inputs.sanitizer == 'none' && '1' || '' }}
    steps:
      - name: Require this row's compiler product
        if: inputs.host_arch == 'x86-64'
        env:
          BUILD: ${{ needs.compiler.result }}
        run: |
          if [ "$BUILD" != success ]; then
              printf '::error title=Shared compiler product::This row'"'"'s compiler wasn'"'"'t built (its job: %s); its shards test no other build. Rerun the failed jobs: the build reruns first.\n' "${BUILD:-missing}"
              exit 1
          fi

      - name: Check out triggering commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Restore verified hosted release inputs
        uses: ./.github/actions/hosted-tools
        with:
          artifact-name: ${{ inputs.hosted-tools }}

      - name: Install official Clang 23.1.4 and test tools
        run: bash tools/ci/setup-hosted.sh

      # Before the build or the product's install: the kernel, CPU, seccomp, ptrace and container state that a
      # runner-side sanitizer report (#2060's LeakSanitizer ptrace warning) needs to be traced to its host. It never
      # fails the job.
      - name: Report sanitizer host kernel, CPU, seccomp and ptrace state
        if: inputs.sanitizer != 'none'
        continue-on-error: true
        run: bash tools/ci/sanitizers.sh host

      # On every shard, a shared row's too: the detectors are proven on the runner that runs the instrumented compiler.
      - name: Set fatal sanitizer policy and verify every enabled detector
        if: inputs.sanitizer != 'none'
        run: |
          bash tools/ci/sanitizers.sh configure "$RUNNER_TEMP/sanitizer-reports"
          bash tools/ci/sanitizers.sh probe "$RUNNER_TEMP/sanitizer-probes"

      - name: Fetch generic baseline startup objects and runtime for emulation
        # Every shard of the row, not its shard 1 alone: the step exports BUSTER_HOST_RUNTIME, which the row's compiler
        # was linked against. The product's identity includes the tree, which each shard compares with its own, and the
        # QEMU step (shard 1) runs the compiler on it.
        if: inputs.host_arch == 'x86-64' && inputs.sanitizer == 'none'
        run: bash tools/ci/setup-baseline-runtime.sh

      - name: Fetch and verify frozen corpus inputs
        run: |
          corpus="$RUNNER_TEMP/preprocessor-391e729af658"
          bash tools/ci/fetch-corpus.sh "$corpus"
          printf 'BUSTER_CORPUS=%s\n' "$corpus" >> "$GITHUB_ENV"

      - name: Report host CPU and selected compiler path
        run: |
          grep -m1 '^model name[[:space:]]*:' /proc/cpuinfo
          printf 'Available CPUs: %s\n' "$(nproc)"
          for arch in native "$BUSTER_HOST_ARCH"; do
            printf '\nClang target for -march=%s:\n' "$arch"
            clang -### -march="$arch" -c -x c /dev/null -o /dev/null 2>&1 |
              sed -n 's/.*"-target-cpu" "\([^"]*\)".*/  CPU: \1/p'
            clang -march="$arch" -dM -E -x c /dev/null |
              grep -E '^#define (__AVX512(F|BW|VL|DQ|CD|VBMI|VBMI2|VPOPCNTDQ|BITALG|VNNI)__|__(GFNI|VAES|AES|BMI|BMI2|LZCNT|POPCNT|AVX2|SSSE3|SSE4_1|XSAVE)__) ' || true
          done
          defines=$(clang -march="$BUSTER_HOST_ARCH" -Isrc -dM -E \
            -include src/buster/compiler/host_isa.h -x c /dev/null)
          if grep -q '^#define BUSTER_HOST_VECTOR 1$' <<< "$defines"; then
            path=vector
          else
            path=scalar
          fi
          printf '\nSelected host path: %s (%s)\n' "$path" "$BUSTER_HOST_ARCH"
          if [ "$BUSTER_HOST_ARCH" = x86-64 ] && [ "$path" != scalar ]; then
            printf '%s\n' '::error::Baseline hosted correctness requires BUSTER_HOST_VECTOR=0; the compiler selected a vector path.'
            exit 1
          fi
          # Hosted CPU models vary. The native build exercises its actual host path;
          # the 9700X job qualifies the complete vector feature set on every merged
          # first-parent state of main in the nightly window, and on dispatched runs.
          if [ "$BUSTER_HOST_ARCH" = native ] && [ "$path" = scalar ]; then
            printf '%s\n' 'Hosted native build uses scalar kernels; vector correctness runs on the 9700X in the nightly window.'
          fi

      - name: Check baseline fallback memory and arithmetic boundaries
        # Once per row, as the steps below that its shard 1 alone runs.
        if: matrix.shard == 1
        run: |
          mapfile -d '' -t sanitizer_flags < <(./build.sh print-sanitizer-flags)
          clang -std=c17 -O2 -g -march=x86-64 -Wall -Wextra -Werror -Wno-psabi \
            -fsanitize=undefined -fno-sanitize-recover=all -Isrc/buster/compiler \
            "${sanitizer_flags[@]}" tests/host-fallback/edge_cases.c -o "$RUNNER_TEMP/host-fallback-edges"
          "$RUNNER_TEMP/host-fallback-edges"

      - name: Download this row's compiler product
        if: inputs.host_arch == 'x86-64'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.compiler.outputs.artifact }}
          path: ${{ runner.temp }}/compiler-product-download

      - name: Verify and install this row's compiler product
        # The archive's SHA-256 against the build job's output, every file's against the product's list, and the
        # product's identity against this checkout's, settings', toolchain's and runner's; then each executable runs
        # once, and they go where the build puts them, with the same environment (tools/ci/hosted-product.sh install).
        # Any difference fails the shard.
        if: inputs.host_arch == 'x86-64'
        env:
          DIGEST: ${{ needs.compiler.outputs.digest }}
        run: bash tools/ci/hosted-product.sh install "$RUNNER_TEMP/compiler-product-download" "$DIGEST"

      - name: Build the external Clang pragma oracle, the clang server and the compiler
        # A native row's shard builds its own, for the CPU it runs on.
        if: inputs.host_arch != 'x86-64'
        run: bash tools/ci/hosted-product.sh build

      - name: Compile and run baseline code on an emulated x86-64 CPU
        if: inputs.host_arch == 'x86-64' && inputs.sanitizer == 'none' && matrix.shard == 1
        run: |
          smoke="$RUNNER_TEMP/baseline-smoke"
          mkdir "$smoke"
          printf '\357\273\277#define A 7\nint buster_add(int x){return x+A;}\n' > "$smoke/input.c"
          printf '.text\n.globl buster_asm\nbuster_asm:\nmov $7, %%eax\nadd $3, %%eax\nret\n' > "$smoke/input.s"
          library="$BUSTER_HOST_RUNTIME/usr/lib/x86_64-linux-gnu"
          loader="$library/ld-linux-x86-64.so.2"
          qemu=(qemu-x86_64 -cpu qemu64 "$loader" --library-path "$library")
          timeout 60s "${qemu[@]}" "$BUSTER_COMPILER" -E -P -o "$smoke/input.i" "$smoke/input.c"
          timeout 60s "${qemu[@]}" "$BUSTER_COMPILER" -c -march=x86-64 -o "$smoke/input.o" "$smoke/input.c"
          timeout 60s "${qemu[@]}" "$BUSTER_COMPILER" assemble -march=x86-64 -o "$smoke/asm.o" "$smoke/input.s"
          printf 'int buster_add(int); int buster_asm(void); int main(void){return buster_add(5)!=12 || buster_asm()!=10;}\n' > "$smoke/main.c"
          clang -c -march=x86-64 "$smoke/main.c" -o "$smoke/main.o"
          clang -no-pie -nostdlib "$library/crt1.o" "$library/crti.o" "$smoke/main.o" \
            "$smoke/input.o" "$smoke/asm.o" "$library/libc.so.6" \
            "$BUSTER_HOST_RUNTIME/usr/lib/gcc/x86_64-linux-gnu/15/libgcc.a" "$library/crtn.o" -o "$smoke/program"
          timeout 60s "${qemu[@]}" "$smoke/program"

      - name: Check out reviewed first-party performance fixtures and acceptance harnesses
        # With the qualification below, on the daily and dispatched runs and on pull requests that change the readers
        # (tools/performance, docs/performance, web/perf) or this workflow, which holds this pin and these steps: about
        # 11 s of building and checking that every other pull request's job spent on code it doesn't change.
        if: inputs.performance != 'false' && matrix.shard == 1
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: buster14a/buster-performance
          ref: 1c0523ac42bb2f33e212226cf94626ac942ee4d2 # Reviewed source/evidence from buster-performance PR #8.
          path: build/performance-reader-evidence
          sparse-checkout: |
            docs/measurements/performance-format-2026-10-24
            docs/measurements/performance-first-party-2026-10-25
            docs/measurements/performance-pages-2026-10-25
            docs/measurements/foreign-strings-2026-10-23/raw
          persist-credentials: false

      - name: Test first-party performance readers and frozen imports on Ubuntu 26.04
        if: inputs.performance != 'false' && matrix.shard == 1
        run: |
          set -euo pipefail
          reader_root=build/performance-reader-evidence
          reader_fixture="$reader_root/docs/measurements/performance-format-2026-10-24"
          reader_harness="$reader_root/docs/measurements/performance-first-party-2026-10-25"
          bash tools/performance/build.sh
          build/performance/bmf --self-test
          clang -std=c17 -D_GNU_SOURCE -O2 -g -Wall -Wextra -Werror \
            -I tools/performance "$reader_harness/validate.c" -o build/performance/test-first-party
          build/performance/test-first-party "$reader_fixture" "$reader_root" \
            docs/performance/buster-manifest-v1.schema.json
          clang -std=c17 -D_GNU_SOURCE -O2 -g -Wall -Wextra -Werror \
            -I tools/performance "$reader_harness/import-tests.c" -o build/performance/test-import-first-party
          build/performance/test-import-first-party
          build/performance/bmf validate "$reader_harness/history/census/manifest.bmf.json"
          build/performance/bmf validate "$reader_harness/history/foreign-strings/manifest.bmf.json" \
            --evidence-root "$reader_root"
          pages_harness="$reader_root/docs/measurements/performance-pages-2026-10-25"
          clang -std=c17 -D_GNU_SOURCE -O2 -g -Wall -Wextra -Werror \
            -I tools/performance "$pages_harness/profile-validation.c" -o build/performance/test-profile
          build/performance/test-profile "$reader_fixture/profile-example/capture.pftrace" \
            "$pages_harness/profile/capture.pftrace"
          build/performance/bmf validate "$pages_harness/profile/manifest.bmf.json"
          for manifest in "$pages_harness/history-partitioned/"*.bmf.json; do
            build/performance/bmf validate "$manifest"
          done
          build/performance/capture --no-sampling build/performance/qualification-launch 2 1000000 \
            -- /usr/bin/true
          pages_source=$(git rev-parse HEAD)
          pages_evidence=1c0523ac42bb2f33e212226cf94626ac942ee4d2
          pages_index=docs/measurements/performance-pages-2026-10-25/site-index.json
          build/performance/publish . "$pages_source" "$reader_root" "$pages_evidence" \
            "$pages_index" build/performance/pages-check-1 2026-10-25T13:19:28Z
          build/performance/publish . "$pages_source" "$reader_root" "$pages_evidence" \
            "$pages_index" build/performance/pages-check-2 2026-10-25T13:19:28Z
          diff -rq build/performance/pages-check-1 build/performance/pages-check-2

      - name: Write clang's predefines for the compiler's flags
        # For the steps that preprocess the compiler's own translation units: --predefines supplies the macro effects of
        # flags such as -funsigned-char.
        run: clang -dM -E -march="$BUSTER_HOST_ARCH" -fwrapv -funsigned-char -x c /dev/null > build/predefines.h

      - name: Parse the compiler source
        # Preserve this parser smoke test explicitly now that the default C command performs semantic checking.
        # Default C checking and object emission have their own external-oracle tests below.
        if: matrix.shard == 1
        run: '"$BUSTER_COMPILER" parse -fsyntax-only -march="$BUSTER_HOST_ARCH" -Isrc -fwrapv -funsigned-char --predefines build/predefines.h -DBUSTER_COMPLETE_DRIVER=1 src/buster/compiler/main.c'

      - name: Fetch c-testsuite at its pinned commit
        # #145's programs, at the commit tests/c-testsuite/subset.txt was declared for: a shallow fetch of that one commit,
        # whose hash fixes the files, without git's sample hooks. The test list below compiles and runs them. The 9700X
        # fetches it from a mirror in its private cache, which Git's pack protocol checks again (fetch-c-testsuite.sh).
        run: bash tools/ci/fetch-c-testsuite.sh build/c-testsuite

      - name: Fetch SQLite's sources at their pinned commit
        # #146: SQLite 3.53.2's tree, whose amalgamation and shell are the frozen corpus's, for its tests (test-sqlite in
        # the test list): a shallow fetch of that one commit, whose hash fixes the files, as c-testsuite's above; the 9700X
        # fetches it from a mirror in its private cache (fetch-sqlite.sh).
        run: bash tools/ci/fetch-sqlite.sh build/sqlite

      - name: Check constrained arenas, command diagnostics, and Callgrind
        if: inputs.host_arch == 'x86-64' && inputs.sanitizer == 'none' && matrix.shard == 1
        run: |
          clang -std=c17 -march=x86-64 -O2 -Isrc -fwrapv -funsigned-char -fno-strict-aliasing -Wall -Wextra -Werror -Wno-unused-function tests/arena/resources.c -o "$RUNNER_TEMP/memory-resources" -pthread
          mkdir -p "$RUNNER_TEMP/memory-limited" "$RUNNER_TEMP/memory-valgrind" "$RUNNER_TEMP/memory-strict"
          "$RUNNER_TEMP/memory-resources" "$BUSTER_COMPILER" "$RUNNER_TEMP/memory-limited"
          "$RUNNER_TEMP/memory-resources" "$BUSTER_COMPILER" "$RUNNER_TEMP/memory-valgrind" --valgrind
          # Only this disposable hosted VM changes policy; restore all three knobs before the ordinary test suite.
          old_mode=$(cat /proc/sys/vm/overcommit_memory)
          old_kbytes=$(cat /proc/sys/vm/overcommit_kbytes)
          old_ratio=$(cat /proc/sys/vm/overcommit_ratio)
          trap 'sudo sysctl -q -w vm.overcommit_memory="$old_mode"; if [ "$old_kbytes" = 0 ]; then sudo sysctl -q -w vm.overcommit_ratio="$old_ratio"; else sudo sysctl -q -w vm.overcommit_kbytes="$old_kbytes"; fi' EXIT
          # A fixed CommitLimit admits overcommit_kbytes on its own; subtracting SwapTotal left the headroom at the
          # mercy of the runner's swapfile size, so the last commands' commits could find almost none.
          budget=$(awk '/^Committed_AS:/ {used=$2} END {printf "%.0f\n", used + 4*1024*1024}' /proc/meminfo)
          sudo sysctl -q -w vm.overcommit_kbytes="$budget" vm.overcommit_memory=2
          "$RUNNER_TEMP/memory-resources" "$BUSTER_COMPILER" "$RUNNER_TEMP/memory-strict" --strict

      - name: Preserve memory admission diagnostics
        if: ${{ always() && inputs.host_arch == 'x86-64' && inputs.sanitizer == 'none' && matrix.shard == 1 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-admission-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memory-*/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run correctness tests within the hosted CPU budget
        run: |
          timeout=600
          # The driver's in-process checks run the whole compiler per fixture; with a detector they take tens of
          # minutes each, so the command limit leaves room for one on a loaded runner (the job's limit is longer still).
          if [ "$BUSTER_SANITIZER" != none ]; then timeout=7200; fi
          # This row's shard of the inventory: the runner deals the commands to the 4 shards by their costs, the same
          # deal on every shard's runner, so that the row's shards run each command once.
          "$BUSTER_COMPILER" parallel --github --jobs "$(nproc)" --timeout "$timeout" \
            --shard "${{ matrix.shard }}/4" --costs tools/ci/correctness.costs < tools/ci/correctness.tests
          oracle="${XDG_CACHE_HOME:-$HOME/.cache}/buster/oracle"
          if [ "$BUSTER_ORACLE_CACHE" = check ] && [ -d "$oracle" ]; then
              find "$oracle" -type f -mtime +2 -delete
              find "$oracle" -mindepth 1 -type d -empty -delete
          fi

      - name: Preserve failed source SSA comparison inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ssa-source-${{ inputs.host_arch }}-${{ inputs.sanitizer }}-O${{ inputs.optimization }}-shard${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            /tmp/ssa-source-*/**/*.c
            /tmp/ssa-source-*/**/*.log
            /tmp/ssa-source-*/**/*.out
            /tmp/ssa-source-*/**/output
            ${{ runner.temp }}/ssa-source-*/**/*.c
            ${{ runner.temp }}/ssa-source-*/**/*.log
            ${{ runner.temp }}/ssa-source-*/**/*.out
            ${{ runner.temp }}/ssa-source-*/**/output
          if-no-files-found: ignore
          retention-days: 14

      - name: Compile main.c alone under TSan or MSan
        # The parallel list's main.c -c heading leaves its three compiles to this step under TSan and MSan: they peak
        # at 10.2 GiB and 6.6 GiB, too much beside the suite but within the runner alone. docs/ci.md records the
        # measurements and the coverage boundary.
        if: ${{ success() && (inputs.sanitizer == 'thread' || inputs.sanitizer == 'memory') && matrix.shard == 1 }}
        run: |
          set -euo pipefail
          unset CPATH C_INCLUDE_PATH
          mapfile -d '' -t flags < <(env -u BUSTER_SANITIZER -u BUSTER_SANITIZER_OPTIMIZATION -u BUSTER_FUZZ_AVAILABLE -u BUSTER_FUZZ_ENTRY \
            BUSTER_HOST_ARCH=znver5 BUSTER_DEBUG_INFO=0 ./build.sh print-compile-flags)
          test "${#flags[@]}" -gt 0
          objects=$(mktemp -d)
          "$BUSTER_COMPILER" --lanes 1 --verify -c "${flags[@]}" -o "$objects/selected.o" -DBUSTER_COMPLETE_DRIVER=1 src/buster/compiler/main.c
          "$BUSTER_COMPILER" --lanes 1 --verify --lower-all -c "${flags[@]}" -o "$objects/all.o" -DBUSTER_COMPLETE_DRIVER=1 src/buster/compiler/main.c
          "$BUSTER_COMPILER" --scalar --lanes 1 --verify --lower-all -c "${flags[@]}" -o "$objects/all-scalar.o" -DBUSTER_COMPLETE_DRIVER=1 src/buster/compiler/main.c
          cmp "$objects/all.o" "$objects/all-scalar.o"
          rm -r "$objects"

      - name: Reject sanitizer reports even from expected-failure subprocesses
        if: ${{ !cancelled() && inputs.sanitizer != 'none' }}
        run: bash tools/ci/sanitizers.sh audit "$RUNNER_TEMP/sanitizer-reports"

      - name: Preserve sanitizer diagnostics and detector proofs
        if: ${{ always() && inputs.sanitizer != 'none' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanitizers-${{ inputs.host_arch }}-${{ inputs.sanitizer }}-O${{ inputs.optimization }}-shard${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sanitizer-reports
            ${{ runner.temp }}/sanitizer-probes
            build/compile_commands.json
            build/*-*.tsv
            LICENSE
            THIRD_PARTY_NOTICES.md
            LICENSES/
          if-no-files-found: error
          retention-days: 14
