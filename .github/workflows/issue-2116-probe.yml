name: Issue 2116 summary-write probe
on:
  push:
    branches: [codex/2116-summary-write-probe]
permissions:
  contents: read
jobs:
  probe:
    if: ${{ github.repository == 'buster14a/buster' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b6639643533771ec123978bbd997eb9cea773bd4
          persist-credentials: false
      - name: Require positive execution and rejection of each isolated mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/issue-2116
          git rev-parse HEAD
          clang --version
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          source = Path('tools/throughput/tests.c')
          original = source.read_text()
          variants = {
              'positive': None,
              'no-limit-restoration': ('restore_status = setrlimit(resource, &saved);', 'restore_status = 0;'),
              'no-comparison': ('comparison = tp_compare(argv[3]);', 'comparison = 2;'),
              'missing-diagnostic': ('"\\nSUMMARY_WRITE_FAILURE stage=%s', '"\\nOMITTED_SUMMARY_DIAGNOSTIC stage=%s'),
          }
          root = Path('build/issue-2116')
          all_ok = True
          try:
              for name, mutation in variants.items():
                  text = original
                  if mutation:
                      old, new = mutation
                      if text.count(old) != 1:
                          raise SystemExit(f'mutation source mismatch: {name}')
                      text = text.replace(old, new)
                  source.write_text(text)
                  binary = root / name
                  subprocess.run(['clang', '-std=c11', '-O2', '-Wall', '-Wextra', '-Werror', '-fwrapv', '-fno-strict-aliasing', '-funsigned-char', '-Isrc', '-DBUSTER_SINGLE_THREADED=1', str(source), 'tools/throughput/shared.c', '-lm', '-o', str(binary)], check=True, timeout=120)
                  log = root / (name + '.log')
                  with log.open('w') as out:
                      result = subprocess.run([str(binary.resolve()), str((root / (name + '-root')).resolve())], stdout=out, stderr=subprocess.STDOUT, timeout=60)
                  output = log.read_text()
                  accepted = result.returncode == (0 if mutation is None else 1)
                  accepted = accepted and ('THROUGHPUT_INTEGRATION_TEST' in output)
                  accepted = accepted and (('TEST failure' in output) == (mutation is not None))
                  record = f'MUTATION_CONTROL name={name} exit={result.returncode} expected={0 if mutation is None else 1} accepted={accepted}'
                  print(record, flush=True)
                  with (root / 'outcomes.txt').open('a') as out:
                      out.write(record + '\n')
                  for line in output.splitlines():
                      if 'TEST failure' in line or 'THROUGHPUT_INTEGRATION_TEST' in line or 'SUMMARY_WRITE_FAILURE' in line:
                          print(line, flush=True)
                  all_ok = all_ok and accepted
          finally:
              source.write_text(original)
          if not all_ok:
              raise SystemExit('mutation controls did not preserve their required outcomes')
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-2116-mutation-${{ matrix.os }}-${{ github.run_id }}
          path: build/issue-2116
          retention-days: 7
          if-no-files-found: error
