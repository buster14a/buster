name: Issue 333 isolated validation
on:
  push:
    branches: [codex/333-validation]
    paths: [.github/workflows/issue-333-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    name: Verify issue 333 setup repair
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Read repair payload
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: payload
          persist-credentials: false
      - name: Read exact published candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9b679ed9bbd0ede670a77238c7fa5a9b5bbf9ebf
          path: source
          persist-credentials: false
      - name: Verify and apply setup repair
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-333" build
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess
          patch = pathlib.Path('../payload/.github/issue-333-payload/setup-fix.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == 'ac9e5847e07fd803c601e8e104935448dea1e9fa3bf5c9fdd2381e41787c2594'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == '9b679ed9bbd0ede670a77238c7fa5a9b5bbf9ebf'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert paths == ['.github/workflows/ci.yml', 'docs/ci-combination-shards.md', 'tools/matrix_shard_test.py'], paths
          pathlib.Path(os.environ['RUNNER_TEMP'], 'issue-333', 'setup-fix.patch').write_bytes(patch)
          PY
          git diff --cached --check
      - name: Native driver and policy tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          clang --version | tee "$RUNNER_TEMP/issue-333/clang-version.log"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o build/build 2>&1 | tee "$RUNNER_TEMP/issue-333/clang-driver.log"
          BUSTER_CI_COVERAGE_OUTPUT="$RUNNER_TEMP/issue-333/coverage-self-test.json" ./build/build coverage_manifest_self_test 2>&1 | tee "$RUNNER_TEMP/issue-333/native-self-test.log"
      - name: Complete wrapper and workflow regressions
        working-directory: source
        shell: bash
        env:
          BUSTER_MATRIX_SHARD: release
        run: |
          set -euo pipefail
          python3 tests/bootstrap_wrapper_test.py -v 2>&1 | tee "$RUNNER_TEMP/issue-333/bootstrap-wrapper.log"
          python3 tools/matrix_shard_test.py -v 2>&1 | tee "$RUNNER_TEMP/issue-333/matrix-shard.log"
          python3 tools/coverage_manifest_test.py -v 2>&1 | tee "$RUNNER_TEMP/issue-333/coverage-manifest.log"
          python3 tests/ci_tools_test.py -v 2>&1 | tee "$RUNNER_TEMP/issue-333/ci-tools.log"
          python3 tools/analyzer_selection_test.py -v 2>&1 | tee "$RUNNER_TEMP/issue-333/analyzer-selection.log"
          python3 tools/differential_ci_policy_test.py -v 2>&1 | tee "$RUNNER_TEMP/issue-333/differential-policy.log"
          python3 tools/check_action_pins.py 2>&1 | tee "$RUNNER_TEMP/issue-333/action-pins.log"
      - name: Lint all candidate workflows
        working-directory: source
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 .github/workflows/*.yml 2>&1 | tee "$RUNNER_TEMP/issue-333/actionlint.log"
      - name: Publish verified immutable blobs only
        working-directory: source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          repository = os.environ['GITHUB_REPOSITORY']
          assert repository == 'buster14a/buster'
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          entries = []
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              expected = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              body = json.dumps({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'}).encode('utf-8')
              request = urllib.request.Request(f'https://api.github.com/repos/{repository}/git/blobs', data=body, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  actual = json.load(response)['sha']
              assert actual == expected, (path, expected, actual)
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': actual, 'sha256': hashlib.sha256(data).hexdigest()})
          result = {'base': '9b679ed9bbd0ede670a77238c7fa5a9b5bbf9ebf', 'patch_sha256': 'ac9e5847e07fd803c601e8e104935448dea1e9fa3bf5c9fdd2381e41787c2594', 'entries': entries}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'issue-333', 'verified-blobs.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - name: Retain exact validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-333-setup-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-333/
          if-no-files-found: error
          retention-days: 7
