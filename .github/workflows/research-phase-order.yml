name: Isolated phase order census

# Branch-only research; not an admission check or default optimization policy.
on:
  push:
    branches: [codex/49-phase-order-census]
    paths:
      - tools/research/phase_order_instrument.py
      - tools/research/phase_order_run.py
      - .github/workflows/research-phase-order.yml

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      BUSTER_TEST_JOBS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: DaveGamble/cJSON
          ref: c859b25da02955fef659d658b8f324b5cde87be3
          path: external/cjson
          persist-credentials: false
      - name: Build isolated diagnostic compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase-order-evidence
          git rev-parse HEAD 'HEAD^{tree}' > phase-order-evidence/revision.txt
          clang --version > phase-order-evidence/compiler.txt
          uname -a > phase-order-evidence/environment.txt
          lscpu >> phase-order-evidence/environment.txt
          cp external/cjson/LICENSE phase-order-evidence/cjson-LICENSE.txt
          mkdir phase-input
          git archive HEAD src tests | tar -x -C phase-input
          git ls-tree -r HEAD src tests > phase-order-evidence/pristine-input-git-blobs.txt
          python3 tools/research/phase_order_instrument.py
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o "$RUNNER_TEMP/buster-phase-build"
          "$RUNNER_TEMP/buster-phase-build" generate --config Release --cc clang --ci --linker DEFAULT -DBUSTER_INCLUDE_TESTS=OFF
          "$RUNNER_TEMP/buster-phase-build" build --config Release -t ide -- -j2 2>&1 | tee phase-order-evidence/build.log
          cp build/CMakeCache.txt build/compile_commands.json phase-order-evidence/
          sha256sum build/Release/ide > phase-order-evidence/binary.sha256
      - name: Census schedules and final encoded objects
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/research/phase_order_run.py --ide build/Release/ide --output phase-order-evidence/results --source-root phase-input --generated build/generated --cjson external/cjson/cJSON.c --memory-reference
      - name: Retain raw evidence and failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-order-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase-order-evidence
          retention-days: 14
          if-no-files-found: error
