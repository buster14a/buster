name: Issue 292 source snapshot

# Temporary source transport only. No compiler builds or tests are run here.
# This workflow stays off the implementation branch and out of its PR.
on:
  push:
    branches: [astra/issue292-transport-20260912]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue292-source-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 15b19813ca51cf993d3526acb6f66c1f51f7c377
          persist-credentials: false
      - name: Preserve exact source and live ownership metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/issue292-source"
          mkdir -p "$output"
          test "$(git rev-parse HEAD)" = 15b19813ca51cf993d3526acb6f66c1f51f7c377
          git rev-parse HEAD HEAD^{tree} > "$output/revision.txt"
          git archive --format=tar HEAD | gzip -n > "$output/source.tar.gz"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue292-source'
          base = 'https://api.github.com/repos/buster14a/buster/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          for name, endpoint in [('open-pulls', 'pulls?state=open'),
                                 ('branches', 'branches?'),
                                 ('issue292-comments', 'issues/292/comments?')]:
              rows = []
              for page in range(1, 101):
                  separator = '&' if not endpoint.endswith('?') else ''
                  url = base + endpoint + separator + 'per_page=100&page=' + str(page)
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=30) as response:
                      current = json.load(response)
                  if not isinstance(current, list):
                      raise RuntimeError('Expected a paginated array for ' + name)
                  rows.extend(current)
                  if len(current) < 100:
                      break
              else:
                  raise RuntimeError('Pagination limit reached for ' + name)
              (root / (name + '.json')).write_text(json.dumps(rows, indent=2) + '\n')
              print(name, len(rows))
          PY
          (cd "$output" && sha256sum source.tar.gz revision.txt open-pulls.json branches.json issue292-comments.json > SHA256SUMS)
      - name: Retain source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue292-source-${{ github.run_id }}
          path: ${{ runner.temp }}/issue292-source/
          if-no-files-found: error
          retention-days: 7
