name: A08 candidate
on:
  push:
    branches: [astra/a08-capability-evidence-20260909]
    paths: [.github/workflows/a08-candidate.yml, .github/a08-source.patch.b64]
permissions:
  contents: read
jobs:
  candidate:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 1
      BUSTER_TEST_JOBS: 1
      BUSTER_MATRIX_THREADS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: transport
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          path: source
      - name: Apply source-only patch and upload unattached Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a08-candidate"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          base = 'ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae'
          root = 'https://api.github.com/repos/buster14a/buster/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'buster-a08-source-objects'}
          def api(path, data=None):
              payload = None if data is None else json.dumps(data).encode()
              with urllib.request.urlopen(urllib.request.Request(root + path, data=payload, headers=headers), timeout=30) as response:
                  return json.load(response)
          if api('git/ref/heads/main')['object']['sha'] != base:
              raise RuntimeError('main moved; reconcile before source publication')
          patch = zlib.decompress(base64.b64decode(pathlib.Path('../transport/.github/a08-source.patch.b64').read_bytes()))
          if hashlib.sha256(patch).hexdigest() != 'defc9be3a1d13191e668f97de81bf4a41532fdba8972c19322b265516a9c79c2':
              raise RuntimeError('unexpected source patch')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          paths = ['src/buster/lib/compiler/wasm/wasm.c', 'src/buster/lib/compiler/wasm/wasm.h', 'src/buster/tests/compiler/driver/driver_test.c', 'tests/basic_c_wasm64_indirect.c', 'tests/basic_c_wasm64_indirect_reject.c', 'tests/wasm_indirect_execution.js']
          subprocess.run(['git', 'add', '--intent-to-add', '--', *paths], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
          if set(changed) != set(paths):
              raise RuntimeError('unexpected changed paths')
          subprocess.run(['git', 'diff', '--check'], check=True)
          elements, hashes = [], {}
          for name in paths:
              content = pathlib.Path(name).read_bytes()
              sha = api('git/blobs', {'content': content.decode(), 'encoding': 'utf-8'})['sha']
              elements.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
              hashes[name] = hashlib.sha256(content).hexdigest()
          base_tree = api('git/commits/' + base)['tree']['sha']
          tree = api('git/trees', {'base_tree': base_tree, 'tree': elements})
          report = {'base': base, 'tree': tree['sha'], 'source_sha256': hashes, 'patch_sha256': hashlib.sha256(patch).hexdigest(), 'note': 'Unattached source objects only. No refs, PRs, permissions or other branches were changed.'}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'a08-candidate', 'source-tree.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a08-source-tree
          path: ${{ runner.temp }}/a08-candidate/source-tree.json
          if-no-files-found: error
          retention-days: 7
      - name: Compile candidate and independent C controls
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/a08-candidate/build.log") 2>&1
          clang --version
          node --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --cc clang --ci --linker DEFAULT -- -DBUSTER_UNITY_BUILD=OFF '-DCMAKE_C_FLAGS_RELEASE=-O1 -DNDEBUG'
          "$RUNNER_TEMP/buster-build" build --config Release -t ide -- -j1
          for level in 0 2; do
            clang -std=c17 -Wall -Wextra -Werror -O"$level" -fsanitize=address,undefined -fno-sanitize-recover=all tests/basic_c_wasm64_indirect.c -o "$RUNNER_TEMP/a08-candidate/control-$level"
            "$RUNNER_TEMP/a08-candidate/control-$level"
          done
          build/Release/ide cc -std=c17 -target wasm64-unknown-freestanding -nostdinc -o "$RUNNER_TEMP/a08-candidate/indirect.wasm" tests/basic_c_wasm64_indirect.c
          node tests/wasm_indirect_execution.js "$RUNNER_TEMP/a08-candidate/indirect.wasm"
      - name: Registered regression suite
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/a08-candidate/tests.log") 2>&1
          "$RUNNER_TEMP/buster-build" build --config Release -t test_all -- -j1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: a08-candidate-results
          path: ${{ runner.temp }}/a08-candidate
          if-no-files-found: error
          retention-days: 7
