name: Issue 280 inspect

on:
  push:
    branches:
      - fix/280-conversion-source-widths

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/280-conversion-source-widths
          persist-credentials: false
      - name: Inspect metadata topology
        shell: bash
        run: |
          set -euo pipefail
          file=src/buster/lib/compiler/assembly/x86_64_metadata.c
          printf '%s\n' '=== pattern semantics definition/use ==='
          grep -n -E 'BusterX86MetadataPatternSemantics|vector_length|vex.*length|has_vex|vexl|VL=' "$file" | head -n 160 || true
          printf '%s\n' '=== pattern control context ==='
          grep -n -A35 -B15 'has_tuple_control' "$file" | head -n 220 || true
          printf '%s\n' '=== conversion generated rows ==='
          grep -R -n -E 'VCVTPS2PD|VCVTPD2PS|CVTPS2PD|CVTPD2PS|VCVTSS2SD|VCVTSD2SS' src/buster/lib/compiler/assembly/generated 2>/dev/null | head -n 240 || true
          printf '%s\n' '=== generated directory ==='
          find src/buster/lib/compiler/assembly -maxdepth 2 -type f -name '*generated*' -print | head -n 40
