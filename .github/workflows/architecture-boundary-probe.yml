name: Architecture boundary probe
on:
  push:
    branches: [codex/architecture-boundary-scout-20260925-astra-ade6]
    paths:
      - .github/workflows/architecture-boundary-probe.yml
      - .github/research/architecture_boundary_probe.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ownership:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ade6ac4b6ecb21f30b61b656439bac476c145e2f
          path: source
          persist-credentials: false
      - name: Baseline, local repair and shared preparation owner
        shell: bash
        env:
          ARCH_EVIDENCE: ${{ github.workspace }}/architecture-evidence
          BUSTER_TEST_JOBS: '1'
        run: |
          set -euo pipefail
          mkdir -p "$ARCH_EVIDENCE"
          git -C transport rev-parse HEAD HEAD^{tree} > "$ARCH_EVIDENCE/transport-identity.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('transport/.github/research/architecture_boundary_probe.py').read_text()
          # Attempt 36183313870 retained: Clang derives a precise size through
          # side-effecting comma operands. Only evaluation is the common oracle.
          anchor = '    for label, expression, expected, expected_hits in rows:\n'
          assert source.count(anchor) == 1
          source = source.replace(anchor, anchor + '        if "__builtin_object_size" in expression:\n            expected = None\n')
          # This mixed sibling is a new counterexample, not a passing control.
          anchor = '\n\ndef fixture(path, rows):'
          assert source.count(anchor) == 1
          source = source.replace(anchor, '\n\nNEW.append(CONTROLS.pop())' + anchor)
          Path(os.environ['ARCH_EVIDENCE'], 'experiment.py').write_text(source)
          PY
          python3 -u "$ARCH_EVIDENCE/experiment.py" "$GITHUB_WORKSPACE/source"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: architecture-ownership-${{ github.run_id }}-${{ github.run_attempt }}
          path: architecture-evidence
          if-no-files-found: error
          retention-days: 30
