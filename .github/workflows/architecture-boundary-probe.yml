name: Architecture boundary probe
on:
  push:
    branches: [codex/architecture-boundary-scout-20260925-astra-ade6]
    paths:
      - .github/workflows/architecture-boundary-probe.yml
      - .github/research/architecture_boundary_probe.py
      - .github/research/architecture_boundary_replay.py
      - .github/research/architecture_boundary_compare.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ownership:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ade6ac4b6ecb21f30b61b656439bac476c145e2f
          path: source
          persist-credentials: false
      - name: Complete local and shared owner comparison
        shell: bash
        env:
          ARCH_EVIDENCE: ${{ github.workspace }}/architecture-evidence
          BUSTER_TEST_JOBS: '1'
        run: |
          set -euo pipefail
          mkdir -p "$ARCH_EVIDENCE"
          git -C transport rev-parse HEAD HEAD^{tree} > "$ARCH_EVIDENCE/transport-identity.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path('transport/.github/research/architecture_boundary_replay.py')
          text = path.read_text()
          for old, new in [("repr(canonical) + '''", "repr(canonical) + r'''"), ("trace = '''", "trace = r'''")]:
              assert text.count(old) == 1
              text = text.replace(old, new, 1)
          path.write_text(text)
          Path(os.environ['ARCH_EVIDENCE'], 'replay-driver.py').write_text(text)
          for name in ('architecture_boundary_probe.py', 'architecture_boundary_compare.py'):
              Path(os.environ['ARCH_EVIDENCE'], name).write_text(Path('transport/.github/research', name).read_text())
          PY
          python3 -u - "$GITHUB_WORKSPACE/source" <<'PY'
          from pathlib import Path
          path = Path('transport/.github/research/architecture_boundary_compare.py')
          # Run the generator once. Its embedded body is source material for
          # comparison-experiment.py, not a second top-level invocation.
          source = path.read_text().split('\n# EXECUTABLE COMPARISON BODY\n', 1)[0]
          exec(compile(source, str(path), 'exec'), {'__file__': str(path), '__name__': '__main__'})
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: architecture-ownership-${{ github.run_id }}-${{ github.run_attempt }}
          path: architecture-evidence
          if-no-files-found: error
          retention-days: 30
