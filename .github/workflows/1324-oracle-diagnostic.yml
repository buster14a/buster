name: Temporary mode-matrix oracle diagnostic

on:
  push:
    branches:
      - codex/1324-mode-matrix-oracle
    paths:
      - .github/workflows/1324-oracle-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      BUSTER_CI_LLVM_VERSION: 23.1.2
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oracle-diagnostic"
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/oracle-diagnostic/source.txt"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/oracle-diagnostic/worktree-before.txt"

      - name: Install observed LLVM release
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/ci_llvm.py --target x86_64-linux --work-directory "$RUNNER_TEMP/llvm" \
            --github-path "$GITHUB_PATH" --github-env "$GITHUB_ENV" \
            2>&1 | tee "$RUNNER_TEMP/oracle-diagnostic/llvm-install.log"

      - name: Build existing compiler
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/oracle-diagnostic/build.log") 2>&1
          clang --version
          llvm-objdump --version
          driver="$RUNNER_TEMP/oracle-diagnostic/buster-build"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable \
            -fwrapv -fno-strict-aliasing -funsigned-char -g build.c -o "$driver"
          "$driver" generate --cc clang --config Release --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
          "$driver" build --config Release -t ide

      - name: Capture suspect images and decoder output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/oracle-diagnostic/diagnostic.log"
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          root = Path(os.environ["RUNNER_TEMP"]) / "oracle-diagnostic"
          images = root / "images"
          images.mkdir()
          cases = [
              ("aarch64-linux-fast-cfg", "aarch64-unknown-linux-gnu", "fast", "tests/basic_c_fast_ra_cfg.c"),
              ("aarch64-windows-fast-cfg", "aarch64-pc-windows-msvc", "fast", "tests/basic_c_fast_ra_cfg.c"),
              ("aarch64-macos-fast-cfg", "aarch64-apple-macos", "fast", "tests/basic_c_fast_ra_cfg.c"),
              ("x86_64-windows-fast-call", "x86_64-pc-windows-msvc", "fast", "tests/basic_c_call_abi.c"),
              ("x86_64-macos-fast-call", "x86_64-apple-macos", "fast", "tests/basic_c_call_abi.c"),
              ("x86_64-windows-none-i128", "x86_64-pc-windows-msvc", "none", "tests/basic_c_x86_64_i128_stack_abi.c"),
          ]
          records = []
          failures = 0
          for name, target, allocator, fixture in cases:
              image = images / name
              commands = [
                  ("compile", ["build/Release/ide", "cc", "-target", target,
                               "-fregister-allocator=" + allocator, "-o", str(image), fixture]),
                  ("sections-symbols", ["llvm-objdump", "--section-headers", "--syms", str(image)]),
                  ("default", ["llvm-objdump", "-d", str(image)]),
                  ("all", ["llvm-objdump", "-d", "--mattr=+all", str(image)]),
                  ("all-sections", ["llvm-objdump", "-D", str(image)]),
              ]
              record = {"name": name, "target": target, "allocator": allocator, "fixture": fixture, "commands": []}
              for kind, arguments in commands:
                  completed = subprocess.run(arguments, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=120)
                  (root / (name + "-" + kind + ".stdout")).write_bytes(completed.stdout)
                  (root / (name + "-" + kind + ".stderr")).write_bytes(completed.stderr)
                  output = completed.stdout.decode("utf-8", errors="replace")
                  lines = output.splitlines()
                  unknown_rows = [index for index, line in enumerate(lines)
                                  if re.match(r"^\s*[0-9a-fA-F]+:", line) and "<unknown>" in line]
                  record["commands"].append({"kind": kind, "arguments": arguments, "returncode": completed.returncode,
                                              "unknown_rows": len(unknown_rows)})
                  print("ORACLE_DIAGNOSTIC case=" + name + " command=" + kind +
                        " exit=" + str(completed.returncode) + " unknown=" + str(len(unknown_rows)), flush=True)
                  if kind in ("default", "all"):
                      for index in unknown_rows:
                          print("\n".join(lines[max(0, index - 2):index + 3]), flush=True)
                  if completed.returncode:
                      failures += 1
                      print(completed.stderr.decode("utf-8", errors="replace"), flush=True)
                      if kind == "compile":
                          break
              if image.exists():
                  record["image_sha256"] = hashlib.sha256(image.read_bytes()).hexdigest()
                  record["image_bytes"] = image.stat().st_size
              records.append(record)
              (root / "commands.json").write_text(json.dumps(records, indent=2) + "\n", encoding="utf-8")
          print("ORACLE_DIAGNOSTIC_RESULT cases=" + str(len(records)) + " command_failures=" + str(failures), flush=True)
          raise SystemExit(1 if failures else 0)
          PY

      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mode-matrix-oracle-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oracle-diagnostic/
          if-no-files-found: error
          retention-days: 7
