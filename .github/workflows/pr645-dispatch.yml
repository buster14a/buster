name: PR 645 exact-head CI dispatch

on:
  push:
    branches:
      - codex/569-canonical-landing-20260914
    paths:
      - .github/workflows/pr645-dispatch.yml

concurrency:
  group: pr645-exact-head-dispatch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out dispatcher commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Remove dispatcher and launch exact-head workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Codex Connector"
          git config user.email "1144995+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git rm .github/workflows/pr645-dispatch.yml
          git commit -m "ci: remove PR 645 exact-head dispatcher"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          clean_sha=$(git rev-parse HEAD)
          printf 'CLEAN_HEAD=%s\n' "$clean_sha"

          dispatch() {
            local workflow_id=$1
            local payload=$2
            echo "Dispatching workflow ${workflow_id} at ${GITHUB_REF_NAME} (${clean_sha})"
            curl --fail-with-body --silent --show-error --location \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" \
              --data "$payload"
          }

          ref_json=$(python3 -c 'import json, os; print(json.dumps({"ref": os.environ["GITHUB_REF_NAME"]}))')
          ci_json=$(python3 -c 'import json, os; print(json.dumps({"ref": os.environ["GITHUB_REF_NAME"], "inputs": {"cmake_profile": "false"}}))')
          throughput_json=$(python3 -c 'import json, os; print(json.dumps({"ref": os.environ["GITHUB_REF_NAME"], "inputs": {"baseline_ref": "main"}}))')

          dispatch 197051687 "$ci_json"
          dispatch 356670892 "$ref_json"
          dispatch 352660201 "$ref_json"
          dispatch 356534397 "$ref_json"
          dispatch 352618603 "$throughput_json"
          dispatch 360018516 "$ref_json"
          dispatch 357082151 "$ref_json"
