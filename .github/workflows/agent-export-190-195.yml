name: Temporary export for issues 190-195

on:
  push:
    branches:
      - agent/tackle-190-195-control
    paths:
      - .github/workflows/agent-export-190-195.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-slim
    steps:
      - name: Check out reviewed main revision
        uses: actions/checkout@v4
        with:
          ref: ebfdd11705bc470564e726857e498f1c82aa746c
          fetch-depth: 1

      - name: Archive working tree
        shell: bash
        run: tar --exclude=.git -czf /tmp/buster-main-ebfdd11.tar.gz .

      - name: Upload checkout
        uses: actions/upload-artifact@v4
        with:
          name: buster-main-ebfdd11
          path: /tmp/buster-main-ebfdd11.tar.gz
          compression-level: 0
          retention-days: 1
