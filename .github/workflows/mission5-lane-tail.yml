name: Mission 5 lane-tail diagnosis
on:
  push:
    branches: [diagnostics/53-mission5-lane-tail]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      BUSTER_TEST_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Retrieve and verify immutable diagnostic producers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/mission5"
          mkdir -p "$E/first-attempt"
          gh run download 35818151488 --repo buster14a/buster --name mission5-lane-tail-35818151488-1 --dir "$E/first-attempt"
          git rev-parse HEAD HEAD^{tree} > "$E/revision.txt"
          test "$(git hash-object src/buster/lib/compiler/driver/driver.c)" = 3eb3efe928370bfffecb54ad043e7bc3b439f335
          test "$(git hash-object src/buster/lib/os.c)" = 107db9529c7a28a64ac15ff10f776835269d5a3c
          cp "$E/first-attempt/baseline" "$E/baseline"
          cp "$E/first-attempt/diagnostic" "$E/diagnostic"
          chmod +x "$E/baseline" "$E/diagnostic"
          lscpu > "$E/cpu.txt"
          clang --version > "$E/compiler.txt"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          e = Path(os.environ['RUNNER_TEMP'])/'mission5'
          expected = {'baseline':'e96958f33825d0b99a0e2eecf02159de2211aed70846dec4d63b71ca75e4950f', 'diagnostic':'ef463cec19224c4e4f3626f317505f6be6d6cc198f0900480a57494d2c0de65d'}
          for name,digest in expected.items():
              actual = hashlib.sha256((e/name).read_bytes()).hexdigest()
              assert actual == digest, (name,actual)
              print(name,actual,flush=True)
          def fields(path):
              return dict(line.split(':',1) for line in path.read_text().splitlines() if ':' in line)
          old,new = fields(e/'first-attempt/cpu.txt'),fields(e/'cpu.txt')
          assert old['Model name'].strip() == new['Model name'].strip(), (old['Model name'],new['Model name'])
          assert set(old['Flags'].split()) <= set(new['Flags'].split()), 'native producer ISA mismatch'
          assert hashlib.sha256(Path('/usr/bin/clang').read_bytes()).hexdigest() == '78e9dd2ccc9e88859b3a29109a44bfab00e3d6cb70f00f3daae063eed3d05251'
          print('Frozen producer hashes and hosted native ISA match; not Zen 5 acceptance.',flush=True)
          PY
      - name: Record unchanged-source single-threaded control
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/mission5"
          exec > >(tee "$E/single-threaded-control.log") 2>&1
          set -x
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/mission5-driver"
          "$RUNNER_TEMP/mission5-driver" generate --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/mission5-driver" generate --build-dir build-mission5-single --cc clang --ci --linker DEFAULT -- -DBUSTER_SINGLE_THREADED=ON
          python3 - <<'PY'
          import json, os, pathlib, shlex, subprocess
          e = pathlib.Path(os.environ['RUNNER_TEMP'])/'mission5'
          rows = json.loads(pathlib.Path('build-mission5-single/compile_commands.json').read_text())
          row = next(r for r in rows if r['file'].endswith('/ide.c') and 'Release' in r.get('command',''))
          argv = shlex.split(row['command'])
          cleaned = []
          skip = False
          for arg in argv:
              if skip:
                  skip = False
              elif arg in ('-o','-MT','-MF'):
                  skip = True
              elif arg not in ('-c','-MD','-MMD'):
                  cleaned.append(arg)
          cleaned.append('-fsyntax-only')
          with (e/'single-threaded-control.stdout').open('wb') as out, (e/'single-threaded-control.stderr').open('wb') as err:
              result = subprocess.run(cleaned,stdout=out,stderr=err,timeout=180)
          report = {'argv':cleaned,'status':result.returncode,'source':'bb96b5d08e570aff3cbd473441d71ab0dc691d67','instrumented':False,'runtime_validation':'NOT RUN'}
          (e/'single-threaded-control.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report),flush=True)
          print((e/'single-threaded-control.stderr').read_text(),flush=True)
          # Recording a failure is not passing the single-threaded gate. The
          # census final result below remains failed with this gate explicit.
          PY
      - name: Execute bounded existing-workload and skew diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, subprocess, textwrap
          e = pathlib.Path(os.environ['RUNNER_TEMP'])/'mission5'
          original = subprocess.check_output(['git','show','7b8a25cd7550e83a498e496c21b8bb4e7088ccbb:.github/workflows/mission5-lane-tail.yml'],text=True)
          section = original.split('      - name: Complete-compilation diagnostic census and exact-byte controls\n',1)[1].split('      - name: Preserve every attempt and source patch\n',1)[0]
          code = textwrap.dedent(section.split("python3 - <<'PY'\n",1)[1].rsplit('\n          PY',1)[0])
          def once(old,new):
              global code
              assert code.count(old)==1, (old[:80],code.count(old))
              code = code.replace(old,new)
          once('import hashlib, json, os, pathlib, shutil, subprocess, time', 'import hashlib, json, os, pathlib, shutil, signal, subprocess, time')
          once('failures = []', "failures = ['single-threaded-runtime-unvalidated']")
          start,end = code.index('def command('),code.index('populations = ')
          code = code[:start] + '''def command(name, args, timeout=180):
              args = [str(x) for x in args]
              started = time.monotonic_ns()
              status = None
              with (E/(name+'.stdout')).open('wb') as out, (E/(name+'.stderr')).open('wb') as err:
                  process = subprocess.Popen(['/usr/bin/time','-f','%e,%U,%S,%M,%x','-o',str(E/(name+'.time')),*args],stdout=out,stderr=err,start_new_session=True)
                  try:
                      status = process.wait(timeout=timeout)
                  except subprocess.TimeoutExpired:
                      try:
                          os.killpg(process.pid,signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      process.wait()
                      status = 'timeout'
              record = dict(name=name,argv=args,status=status,elapsed_ns=time.monotonic_ns()-started)
              attempts.append(record)
              (E/'attempts.json').write_text(json.dumps(attempts,indent=2))
              print(json.dumps(record),flush=True)
              if status != 0:
                  failures.append(name)
              return status
          ''' + code[end:]
          once("schedule += [('single-threaded',1,0),('single-threaded',4,0)]", "# Single-threaded runtime is BLOCKED, not silently treated as a pass.")
          once("code = ''.join(f'int m5_{i}_{k}(int x) {{ return x + {k}; }}\\n' for k in range(n))", "code = (f'#warning m5_warning_{i}\\n' if i % 4 == 0 else '') + ''.join(f'int m5_{i}_{k}(int x) {{ return x + {k}; }}\\n' for k in range(n))")
          extra = '''warn = W/'existing-empty.c'
          warn.write_text('#warning unit-batch-warning\\n')
          existing = [warn,pathlib.Path('tests/basic_c_constructor_order.c'),warn,pathlib.Path('tests/basic_c_constructor_order_second.c'),warn]
          cases.insert(0,('existing-unit-batch',existing))
          '''
          once('source_manifest = ',extra+'source_manifest = ')
          once('identity = None\n', "identity = None\n        if not valid:\n            failures.append(tag+'-missing-or-failed-artifact')\n")
          once("assert len(group)==batch['count']", "assert len(group)==batch['count']\n            assert batch['count'] <= batch['workers'], 'cohort/model premise not met'")
          once("[E/producer,'cc','-O0','-fregister-allocator=fast'", "[E/producer,'cc','-O0','-g','-nostdinc','-target','x86_64-unknown-linux','-fregister-allocator=fast'")
          once("(E/'observations.json').write_text(json.dumps(observations,indent=2))", "(E/'observations.json').write_text(json.dumps(observations,indent=2))\n        print('MISSION5_PROGRESS '+json.dumps({'tag':tag,'valid':valid,'artifact_sha256':identity,'task_count':len(units)}),flush=True)")
          (e/'census.py').write_text(code)
          compile(code,str(e/'census.py'),'exec')
          PY
          python3 "$RUNNER_TEMP/mission5/census.py"
      - name: Preserve every attempt including failed gates
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mission5-lane-tail-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mission5
          if-no-files-found: error
          retention-days: 30
