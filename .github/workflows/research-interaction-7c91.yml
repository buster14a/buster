name: Interaction research 7c91 (non-timing)

# Isolated research branch only. No dedicated runner, lease or timing campaign.
on:
  push:
    branches: [research/interaction-cost-20260925-astra-7c91]
    paths:
      - .github/workflows/research-interaction-7c91.yml
      - tools/investigations/interaction-7c91/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-counts:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen grid, C prototype and independent LLVM consumers
        shell: bash
        run: python3 -B tools/investigations/interaction-7c91/runner.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: interaction-7c91-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/interaction-7c91-result
          if-no-files-found: error
          retention-days: 30
