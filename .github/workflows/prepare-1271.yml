name: Prepare and validate issue 1271
# Temporary, branch-local preparation only. This file never enters the implementation tree.
on:
  push:
    branches: [chatgpt/prepare-1271-20261104]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository_id == '1421805693'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      BASE: bc15e2eda2e2178d89acd7c1b66ff0a36290f2ce
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Apply the checked patch to the pinned main revision
        run: |
          set -euo pipefail
          base64 --decode .github/issue-1271.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/1271.patch"
          printf '%s  %s\n' 7c2cc038184bc4df8f5dd8899b5b4b3671918243ddefee88ae67582e56bbc4e3 "$RUNNER_TEMP/1271.patch" | sha256sum -c -
          git checkout --detach "$BASE"
          git apply --check "$RUNNER_TEMP/1271.patch"
          git apply "$RUNNER_TEMP/1271.patch"
          git diff --check
          git diff --stat
          printf '%s\n' .github/workflows/9700x.yml AGENTS.md docs/ci.md docs/commands/ci.md tests/ci/nightly.sh tools/ci/changes.c > "$RUNNER_TEMP/expected-paths"
          git diff --name-only > "$RUNNER_TEMP/actual-paths"
          cmp "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
      - name: Validate selector and qualification against the complete checkout
        run: |
          set -euo pipefail
          cc --version | head -n 1
          cc -std=c17 -O2 -Wall -Wextra -Werror -fno-strict-aliasing tools/ci/changes.c -o "$RUNNER_TEMP/changes"
          "$RUNNER_TEMP/changes" --self-test
          cc -std=c17 -O1 -g -Wall -Wextra -Werror -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all tools/ci/changes.c -o "$RUNNER_TEMP/changes-sanitize"
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/changes-sanitize" --self-test
          cc -std=c17 -O2 -Wall -Wextra -Werror -fno-strict-aliasing tools/ci/qualification.c -o "$RUNNER_TEMP/qualification"
          "$RUNNER_TEMP/qualification" --self-test
      - name: Validate nightly integration and caches
        run: |
          set -euo pipefail
          bash -n tests/ci/nightly.sh tools/ci/nightly.sh
          bash tests/ci/nightly.sh
          bash tests/ci/caches.sh
      - name: Parse workflow YAML and verify guide size
        run: |
          set -euo pipefail
          ruby -r yaml -e 'YAML.load_file(ARGV[0]); puts "workflow YAML parses"' .github/workflows/9700x.yml
          test "$(wc -c < AGENTS.md)" -le 30000
          git diff --check
      - name: Upload validated Git objects without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/entries.jsonl"
          while IFS= read -r path; do
              blob=$(jq -Rs '{content: ., encoding: "utf-8"}' < "$path" | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
              mode=$(git ls-tree HEAD -- "$path" | cut -d ' ' -f 1)
              jq -nc --arg path "$path" --arg sha "$blob" --arg mode "$mode" '{path: $path, sha: $sha, mode: $mode, type: "blob"}' >> "$RUNNER_TEMP/entries.jsonl"
          done < "$RUNNER_TEMP/expected-paths"
          tree=$(jq -s --arg base_tree "$(git rev-parse 'HEAD^{tree}')" '{base_tree: $base_tree, tree: .}' "$RUNNER_TEMP/entries.jsonl" | gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)
          printf 'VALIDATED_BASE=%s\nVALIDATED_TREE=%s\n' "$BASE" "$tree"
          printf 'Validated base: `%s`\n\nValidated tree: `%s`\n' "$BASE" "$tree" >> "$GITHUB_STEP_SUMMARY"
