name: Issue 3497 profile extraction
on:
  push:
    branches:
      - codex/3497-nested-tag-evidence
permissions:
  actions: read
  contents: read
jobs:
  profile:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Download exact failed-proof profiles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-3497-proof
          run-id: 38179844969
          github-token: ${{ github.token }}
          path: profiles
      - name: Install diagnostic reader
        run: sudo apt-get install -y valgrind
      - name: Print candidate self costs
        run: callgrind_annotate --auto=no --threshold=95 --inclusive=no profiles/callgrind-c1-p0-d2000.out
      - name: Print candidate inclusive costs
        run: callgrind_annotate --auto=no --threshold=90 --inclusive=yes --tree=both profiles/callgrind-c1-p0-d2000.out
