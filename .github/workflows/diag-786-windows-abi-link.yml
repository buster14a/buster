name: Diagnose issue 786 Windows ABI link

on:
  push:
    branches:
      - diag/786-windows-abi-link
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out exact diagnostic revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: diag/786-windows-abi-link
          persist-credentials: false

      - name: Reproduce one failing ABI row and two controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPaths = @(& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw 'Visual Studio x86/x64 tools were not found' }
          & (Join-Path $VsPaths[0].Trim() 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          New-Item -ItemType Directory -Force -Path diag | Out-Null

          $Driver = Join-Path $env:RUNNER_TEMP 'diag-build.exe'
          cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Driver generate --cc clang --ci --linker DEFAULT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Driver build --config Release -t ide
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $ResourceDir = (& clang.exe -print-resource-dir).Trim()
          $RuntimeDlls = @(Get-ChildItem -Path $ResourceDir -Filter 'clang_rt.asan_dynamic-x86_64.dll' -File -Recurse | Sort-Object FullName)
          if ($RuntimeDlls.Count -ne 1) { throw "Expected one x86-64 ASan runtime; found $($RuntimeDlls.Count)" }
          $env:PATH = "$(Split-Path -Parent $RuntimeDlls[0].FullName);$env:PATH"

          function Invoke-Captured {
            param([string]$Label, [string]$Executable, [string[]]$Arguments)
            Write-Host "COMMAND[$Label]: $Executable $($Arguments -join ' ')"
            & $Executable @Arguments 2>&1 |
              Tee-Object -FilePath (Join-Path 'diag' "$Label.log") |
              ForEach-Object { Write-Host $_ }
            $Code = $LASTEXITCODE
            Write-Host "EXIT[$Label]=$Code"
            return [int]$Code
          }

          $Include = (Resolve-Path 'tests\differential').Path
          $Sanitizer = @('-fsanitize=address,undefined', '-fno-sanitize-recover=all')
          $LibraryArgs = @()
          foreach ($LibraryPath in @($env:LIB -split ';' | Where-Object { $_.Length -ne 0 })) {
            $LibraryArgs += "-L$LibraryPath"
          }

          $CallerArgs = @('-O0', '-fwrapv', '-fno-strict-aliasing', '-funsigned-char') +
            $Sanitizer + @("-I$Include", 'tests\differential\abi_host.c', '-c', '-o', 'diag\caller.o')
          if ((Invoke-Captured 'caller-compile' 'clang.exe' $CallerArgs) -ne 0) { throw 'fixed caller failed to compile' }

          $Common = @(
            'cc',
            '-fwrapv',
            '-fno-strict-aliasing',
            '-funsigned-char',
            "-I$Include",
            'tests\differential\abi.c',
            '-c'
          )
          $FastP2 = @(
            'cc',
            '-fregister-allocator=fast',
            '-fno-machine-fallback',
            '-fno-canonical-local-promotion',
            '-ftarget-local-promotion',
            '-fno-frontend-ssa',
            '-fverify-codegen'
          ) + $Common[1..($Common.Length - 1)] + @('-o', 'diag\subject-fast-p2.o')
          $FastP0 = @(
            'cc',
            '-fregister-allocator=fast',
            '-fno-machine-fallback',
            '-fno-canonical-local-promotion',
            '-fno-target-local-promotion',
            '-fno-frontend-ssa',
            '-fverify-codegen'
          ) + $Common[1..($Common.Length - 1)] + @('-o', 'diag\subject-fast-p0.o')
          $NoneP2 = @(
            'cc',
            '-fregister-allocator=none',
            '-fno-canonical-local-promotion',
            '-ftarget-local-promotion',
            '-fno-frontend-ssa',
            '-fverify-codegen'
          ) + $Common[1..($Common.Length - 1)] + @('-o', 'diag\subject-none-p2.o')

          $Ide = (Resolve-Path 'build\Release\ide.exe').Path
          if ((Invoke-Captured 'subject-fast-p2-compile' $Ide $FastP2) -ne 0) { throw 'FAST p2 subject compile failed' }
          if ((Invoke-Captured 'subject-fast-p0-compile' $Ide $FastP0) -ne 0) { throw 'FAST p0 subject compile failed' }
          if ((Invoke-Captured 'subject-none-p2-compile' $Ide $NoneP2) -ne 0) { throw 'NONE p2 subject compile failed' }

          foreach ($Object in @('diag\caller.o', 'diag\subject-fast-p2.o', 'diag\subject-fast-p0.o', 'diag\subject-none-p2.o')) {
            Write-Host "===== SYMBOLS $Object ====="
            & llvm-nm.exe -a $Object 2>&1 |
              Tee-Object -FilePath ($Object + '.nm.txt') |
              ForEach-Object { Write-Host $_ }
            & llvm-readobj.exe --file-headers --symbols $Object 2>&1 |
              Out-File -Encoding utf8 ($Object + '.readobj.txt')
          }

          function Link-Case {
            param([string]$Label, [string]$Object, [string]$Output)
            $Args = $Sanitizer + $LibraryArgs + @('diag\caller.o', $Object, '-o', $Output)
            return Invoke-Captured $Label 'clang.exe' $Args
          }

          $FastP2Link = Link-Case 'link-fast-p2' 'diag\subject-fast-p2.o' 'diag\fast-p2.exe'
          $FastP0Link = Link-Case 'link-fast-p0' 'diag\subject-fast-p0.o' 'diag\fast-p0.exe'
          $NoneP2Link = Link-Case 'link-none-p2' 'diag\subject-none-p2.o' 'diag\none-p2.exe'
          @(
            "fast_p2_link=$FastP2Link",
            "fast_p0_link=$FastP0Link",
            "none_p2_link=$NoneP2Link"
          ) | Set-Content -Encoding ascii 'diag\summary.txt'

          if ($FastP0Link -ne 0 -or $NoneP2Link -ne 0) {
            throw "Control link failed: fast-p0=$FastP0Link none-p2=$NoneP2Link"
          }
          if ($FastP2Link -eq 0) { throw 'Expected FAST p2 link failure did not reproduce' }

      - name: Retain compact diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-786-windows-abi-link-${{ github.run_id }}
          path: diag/
          retention-days: 3
          if-no-files-found: error
          compression-level: 6
