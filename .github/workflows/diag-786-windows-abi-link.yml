name: Inspect issue 786 CodeView artifact

on:
  push:
    branches:
      - diag/786-windows-abi-link
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Download retained failing and control objects
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download 35282867175 \
            --repo buster14a/buster \
            --name issue-786-windows-abi-link-35282867175 \
            --dir diag
          Get-ChildItem -Recurse diag | Select-Object FullName,Length

      - name: Parse CodeView objects and partial PDBs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          foreach ($Object in @('subject-fast-p2.o', 'subject-fast-p0.o', 'subject-none-p2.o')) {
            Write-Host "===== LLVM-READOBJ CODEVIEW $Object ====="
            & llvm-readobj.exe --codeview --sections --relocations (Join-Path 'diag' $Object) 2>&1 |
              Tee-Object -FilePath (Join-Path 'diag' "$Object.codeview.txt") |
              ForEach-Object { Write-Host $_ }
            Write-Host "LLVM_READOBJ_EXIT[$Object]=$LASTEXITCODE"
          }
          if (Get-Command llvm-pdbutil.exe -ErrorAction SilentlyContinue) {
            foreach ($Pdb in @('fast-p2.pdb', 'fast-p0.pdb', 'none-p2.pdb')) {
              Write-Host "===== LLVM-PDBUTIL $Pdb ====="
              & llvm-pdbutil.exe dump -modules -section-contribs -symbols -types (Join-Path 'diag' $Pdb) 2>&1 |
                Tee-Object -FilePath (Join-Path 'diag' "$Pdb.dump.txt") |
                ForEach-Object { Write-Host $_ }
              Write-Host "LLVM_PDBUTIL_EXIT[$Pdb]=$LASTEXITCODE"
            }
          } else {
            Write-Host 'llvm-pdbutil.exe is unavailable on this runner'
          }

      - name: Retain parser output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-786-codeview-parser-${{ github.run_id }}
          path: diag/*.txt
          retention-days: 3
          if-no-files-found: error
          compression-level: 6
