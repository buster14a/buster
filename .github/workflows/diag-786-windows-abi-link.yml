name: Bisect issue 786 many_ints records

on:
  push:
    branches:
      - diag/786-windows-abi-link
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  bisect:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Download retained failing object
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35282867175 --repo buster14a/buster --name issue-786-windows-abi-link-35282867175 --dir diag

      - name: Build many_ints record variants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import pathlib
          import struct

          original = pathlib.Path('diag/subject-fast-p2.o').read_bytes()

          def section(data, wanted):
              _, count, _, symbols, symbol_count, optional_size, _ = struct.unpack_from('<HHLLLHH', data, 0)
              strings = b''
              if symbols and symbol_count:
                  start = symbols + symbol_count * 18
                  size = struct.unpack_from('<L', data, start)[0]
                  strings = data[start:start + size]
              table = 20 + optional_size
              for index in range(count):
                  header = table + index * 40
                  raw = data[header:header + 8]
                  if raw.startswith(b'/'):
                      name_offset = int(raw[1:].split(b'\0', 1)[0])
                      name = strings[name_offset:].split(b'\0', 1)[0]
                  else:
                      name = raw.split(b'\0', 1)[0]
                  size, file_offset = struct.unpack_from('<LL', data, header + 16)
                  if name.decode('ascii') == wanted:
                      return file_offset, size
              raise RuntimeError(wanted)

          section_offset, section_size = section(original, '.debug$S')
          section_end = section_offset + section_size
          cursor = section_offset + 4
          records = []
          while cursor + 8 <= section_end:
              cursor = (cursor + 3) & ~3
              kind, length = struct.unpack_from('<LL', original, cursor)
              payload = cursor + 8
              if kind == 0xF1 and length:
                  record = payload
                  procedure = ''
                  local = ''
                  while record + 4 <= payload + length:
                      record_length, record_type = struct.unpack_from('<HH', original, record)
                      total = record_length + 2
                      if record_type == 0x1110:
                          procedure = original[record + 39:record + total].split(b'\0', 1)[0].decode('utf-8')
                      elif record_type == 0x113E:
                          local = original[record + 10:record + total].split(b'\0', 1)[0].decode('utf-8')
                      elif procedure == 'many_ints' and record_type in (0x1141, 0x1142):
                          records.append({'offset': record, 'type': record_type, 'local': local})
                      record += total
              cursor = (payload + length + 3) & ~3

          print([(item['local'], hex(item['type'])) for item in records])

          def dummy_local(data, offset):
              struct.pack_into('<H', data, offset + 2, 0x113E)
              struct.pack_into('<I', data, offset + 4, 0x74)
              struct.pack_into('<H', data, offset + 8, 0)
              data[offset + 10:offset + 16] = b'x\0\0\0\0\0'

          def write(name, predicate):
              data = bytearray(original)
              changed = 0
              for item in records:
                  if predicate(item):
                      dummy_local(data, item['offset'])
                      changed += 1
              pathlib.Path(f'diag/{name}.o').write_bytes(data)
              print(name, changed)

          pathlib.Path('diag/original.o').write_bytes(original)
          write('drop-all-defranges', lambda item: True)
          write('drop-register-defranges', lambda item: item['type'] == 0x1141)
          write('drop-frame-defranges', lambda item: item['type'] == 0x1142)
          write('drop-extra-defranges', lambda item: False)

          data = bytearray(original)
          seen = set()
          changed = 0
          for item in records:
              if item['local'] in seen:
                  dummy_local(data, item['offset'])
                  changed += 1
              else:
                  seen.add(item['local'])
          pathlib.Path('diag/keep-first-defrange.o').write_bytes(data)
          print('keep-first-defrange', changed)

          for local in ('a','b','c','d','e','f','g','h'):
              write(f'drop-{local}-defranges', lambda item, wanted=local: item['local'] == wanted)
          write('drop-ef-defranges', lambda item: item['local'] in ('e','f'))
          write('drop-gh-defranges', lambda item: item['local'] in ('g','h'))
          write('drop-abcd-defranges', lambda item: item['local'] in ('a','b','c','d'))
          '@ | Set-Content -Encoding utf8 diag\records.py
          python diag\records.py

      - name: Link every many_ints variant
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPaths = @(& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          & (Join-Path $VsPaths[0].Trim() 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          $Sanitizer = @('-fsanitize=address,undefined', '-fno-sanitize-recover=all')
          $LibraryArgs = @()
          foreach ($LibraryPath in @($env:LIB -split ';' | Where-Object { $_.Length -ne 0 })) { $LibraryArgs += "-L$LibraryPath" }
          $Names = @('original','drop-all-defranges','drop-register-defranges','drop-frame-defranges','keep-first-defrange')
          foreach ($Local in @('a','b','c','d','e','f','g','h')) { $Names += "drop-$Local-defranges" }
          $Names += @('drop-ef-defranges','drop-gh-defranges','drop-abcd-defranges')
          $Results = @()
          foreach ($Name in $Names) {
            & clang.exe @Sanitizer @LibraryArgs diag\caller.o "diag\$Name.o" -o "diag\$Name.exe" 2>&1 |
              Tee-Object -FilePath "diag\link-$Name.log" |
              ForEach-Object { Write-Host $_ }
            $Code = $LASTEXITCODE
            $Results += "$Name=$Code"
            Write-Host "LINK_RESULT $Name=$Code"
          }
          $Results | Set-Content -Encoding ascii diag\records-summary.txt
          Get-Content diag\records-summary.txt
          exit 0

      - name: Retain record bisection output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-786-codeview-records-${{ github.run_id }}
          path: |
            diag/records-summary.txt
            diag/link-*.log
            diag/records.py
          retention-days: 3
          if-no-files-found: error
          compression-level: 6
