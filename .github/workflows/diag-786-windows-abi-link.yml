name: Isolate issue 786 parameter e ranges

on:
  push:
    branches:
      - diag/786-windows-abi-link
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  isolate:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Download retained failing object
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35282867175 --repo buster14a/buster --name issue-786-windows-abi-link-35282867175 --dir diag

      - name: Build parameter-e variants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import pathlib
          import struct

          original = pathlib.Path('diag/subject-fast-p2.o').read_bytes()

          def section(data, wanted):
              _, count, _, symbols, symbol_count, optional_size, _ = struct.unpack_from('<HHLLLHH', data, 0)
              strings = b''
              if symbols and symbol_count:
                  start = symbols + symbol_count * 18
                  size = struct.unpack_from('<L', data, start)[0]
                  strings = data[start:start + size]
              table = 20 + optional_size
              for index in range(count):
                  header = table + index * 40
                  raw = data[header:header + 8]
                  if raw.startswith(b'/'):
                      name_offset = int(raw[1:].split(b'\0', 1)[0])
                      name = strings[name_offset:].split(b'\0', 1)[0]
                  else:
                      name = raw.split(b'\0', 1)[0]
                  size, file_offset = struct.unpack_from('<LL', data, header + 16)
                  if name.decode('ascii') == wanted:
                      return file_offset, size
              raise RuntimeError(wanted)

          section_offset, section_size = section(original, '.debug$S')
          section_end = section_offset + section_size
          cursor = section_offset + 4
          ranges = []
          while cursor + 8 <= section_end:
              cursor = (cursor + 3) & ~3
              kind, length = struct.unpack_from('<LL', original, cursor)
              payload = cursor + 8
              if kind == 0xF1 and length:
                  record = payload
                  procedure = ''
                  local = ''
                  while record + 4 <= payload + length:
                      record_length, record_type = struct.unpack_from('<HH', original, record)
                      total = record_length + 2
                      if record_type == 0x1110:
                          procedure = original[record + 39:record + total].split(b'\0', 1)[0].decode('utf-8')
                      elif record_type == 0x113E:
                          local = original[record + 10:record + total].split(b'\0', 1)[0].decode('utf-8')
                      elif procedure == 'many_ints' and local == 'e' and record_type in (0x1141, 0x1142):
                          start = struct.unpack_from('<I', original, record + 8)[0]
                          extent = struct.unpack_from('<H', original, record + 14)[0]
                          ranges.append({'offset': record, 'type': record_type, 'start': start, 'extent': extent})
                      record += total
              cursor = (payload + length + 3) & ~3

          if len(ranges) != 4:
              raise RuntimeError(ranges)
          print([(hex(item['type']), item['start'], item['extent']) for item in ranges])

          def dummy(data, index):
              offset = ranges[index]['offset']
              struct.pack_into('<H', data, offset + 2, 0x113E)
              struct.pack_into('<I', data, offset + 4, 0x74)
              struct.pack_into('<H', data, offset + 8, 0)
              data[offset + 10:offset + 16] = b'x\0\0\0\0\0'

          def write(name, remove=(), mutate=None):
              data = bytearray(original)
              for index in remove:
                  dummy(data, index)
              if mutate:
                  mutate(data)
              pathlib.Path(f'diag/{name}.o').write_bytes(data)

          pathlib.Path('diag/original.o').write_bytes(original)
          for index in range(4):
              write(f'drop-e-{index}', (index,))
          write('keep-e-0', (1,2,3))
          write('keep-e-01', (2,3))
          write('keep-e-012', (3,))
          write('drop-e-12', (1,2))
          write('drop-e-13', (1,3))
          write('drop-e-23', (2,3))

          def frames_to_register(data):
              for index in (1,3):
                  offset = ranges[index]['offset']
                  struct.pack_into('<H', data, offset + 2, 0x1141)
                  struct.pack_into('<HH', data, offset + 4, 328, 0)
          write('e-frames-to-register', mutate=frames_to_register)

          def bridge_first_gap(data):
              offset = ranges[1]['offset']
              struct.pack_into('<I', data, offset + 8, 90)
              struct.pack_into('<H', data, offset + 14, 71)
          write('e-bridge-first-gap', mutate=bridge_first_gap)

          def bridge_last_gap(data):
              offset = ranges[3]['offset']
              struct.pack_into('<I', data, offset + 8, 192)
              struct.pack_into('<H', data, offset + 14, 15)
          write('e-bridge-last-gap', mutate=bridge_last_gap)

          def extend_last(data):
              struct.pack_into('<H', data, ranges[3]['offset'] + 14, 16)
          write('e-extend-last', mutate=extend_last)
          '@ | Set-Content -Encoding utf8 diag\parameter-e.py
          python diag\parameter-e.py

      - name: Link parameter-e variants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPaths = @(& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          & (Join-Path $VsPaths[0].Trim() 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          $Sanitizer = @('-fsanitize=address,undefined', '-fno-sanitize-recover=all')
          $LibraryArgs = @()
          foreach ($LibraryPath in @($env:LIB -split ';' | Where-Object { $_.Length -ne 0 })) { $LibraryArgs += "-L$LibraryPath" }
          $Names = @('original','drop-e-0','drop-e-1','drop-e-2','drop-e-3','keep-e-0','keep-e-01','keep-e-012','drop-e-12','drop-e-13','drop-e-23','e-frames-to-register','e-bridge-first-gap','e-bridge-last-gap','e-extend-last')
          $Results = @()
          foreach ($Name in $Names) {
            & clang.exe @Sanitizer @LibraryArgs diag\caller.o "diag\$Name.o" -o "diag\$Name.exe" 2>&1 |
              Tee-Object -FilePath "diag\link-$Name.log" |
              ForEach-Object { Write-Host $_ }
            $Code = $LASTEXITCODE
            $Results += "$Name=$Code"
            Write-Host "LINK_RESULT $Name=$Code"
          }
          $Results | Set-Content -Encoding ascii diag\parameter-e-summary.txt
          Get-Content diag\parameter-e-summary.txt
          exit 0

      - name: Retain parameter-e isolation output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-786-parameter-e-${{ github.run_id }}
          path: |
            diag/parameter-e-summary.txt
            diag/link-*.log
            diag/parameter-e.py
          retention-days: 3
          if-no-files-found: error
          compression-level: 6
