name: Bisect issue 786 CodeView subsections

on:
  push:
    branches:
      - diag/786-windows-abi-link
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  bisect:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Download retained failing object
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35282867175 --repo buster14a/buster --name issue-786-windows-abi-link-35282867175 --dir diag

      - name: Build CodeView subsection variants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import pathlib
          import struct

          original = pathlib.Path('diag/subject-fast-p2.o').read_bytes()

          def section(data, wanted):
              machine, count, timestamp, symbols, symbol_count, optional_size, flags = struct.unpack_from('<HHLLLHH', data, 0)
              strings = b''
              if symbols and symbol_count:
                  start = symbols + symbol_count * 18
                  size = struct.unpack_from('<L', data, start)[0]
                  strings = data[start:start + size]
              table = 20 + optional_size
              for index in range(count):
                  offset = table + index * 40
                  raw = data[offset:offset + 8]
                  if raw.startswith(b'/'):
                      name_offset = int(raw[1:].split(b'\0', 1)[0])
                      name = strings[name_offset:].split(b'\0', 1)[0]
                  else:
                      name = raw.split(b'\0', 1)[0]
                  size, file_offset = struct.unpack_from('<LL', data, offset + 16)
                  if name.decode('ascii') == wanted:
                      return file_offset, size
              raise RuntimeError(wanted)

          section_offset, section_size = section(original, '.debug$S')
          section_end = section_offset + section_size
          subsections = []
          cursor = section_offset + 4
          last_procedure = ''
          while cursor + 8 <= section_end:
              cursor = (cursor + 3) & ~3
              kind, length = struct.unpack_from('<LL', original, cursor)
              payload = cursor + 8
              if payload + length > section_end:
                  raise RuntimeError('truncated subsection')
              procedure = ''
              if kind == 0xF1 and length:
                  record = payload
                  while record + 4 <= payload + length:
                      record_length, record_type = struct.unpack_from('<HH', original, record)
                      total = record_length + 2
                      if total < 4 or record + total > payload + length:
                          raise RuntimeError('truncated symbol record')
                      if record_type == 0x1110:
                          procedure = original[record + 39:record + total].split(b'\0', 1)[0].decode('utf-8')
                          last_procedure = procedure
                          break
                      record += total
              elif kind == 0xF2:
                  procedure = last_procedure
              subsections.append({'header': cursor, 'kind': kind, 'length': length, 'procedure': procedure})
              cursor = (payload + length + 3) & ~3

          for index, item in enumerate(subsections):
              print(index, hex(item['kind']), item['length'], item['procedure'])

          IGNORE = 0x80000000
          def write(name, predicate):
              data = bytearray(original)
              changed = 0
              for index, item in enumerate(subsections):
                  if predicate(index, item):
                      struct.pack_into('<L', data, item['header'], IGNORE)
                      changed += 1
              pathlib.Path(f'diag/{name}.o').write_bytes(data)
              print(name, changed)

          pathlib.Path('diag/original.o').write_bytes(original)
          write('ignore-all-symbols', lambda index, item: item['kind'] == 0xF1)
          write('ignore-all-lines', lambda index, item: item['kind'] == 0xF2)
          write('ignore-metadata-symbols', lambda index, item: item['kind'] == 0xF1 and not item['procedure'])
          write('ignore-checksums', lambda index, item: item['kind'] == 0xF4)
          write('ignore-stringtable', lambda index, item: item['kind'] == 0xF3)
          for procedure in ('many_ints', 'many_floats', 'pair', 'large', 'call_host'):
              write(f'ignore-{procedure}-symbols', lambda index, item, p=procedure: item['kind'] == 0xF1 and item['procedure'] == p)
              write(f'ignore-{procedure}-lines', lambda index, item, p=procedure: item['kind'] == 0xF2 and item['procedure'] == p)
          '@ | Set-Content -Encoding utf8 diag\subsections.py
          python diag\subsections.py

      - name: Link every subsection variant
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VsPaths = @(& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          & (Join-Path $VsPaths[0].Trim() 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"
          $Sanitizer = @('-fsanitize=address,undefined', '-fno-sanitize-recover=all')
          $LibraryArgs = @()
          foreach ($LibraryPath in @($env:LIB -split ';' | Where-Object { $_.Length -ne 0 })) { $LibraryArgs += "-L$LibraryPath" }
          $Names = @('original','ignore-all-symbols','ignore-all-lines','ignore-metadata-symbols','ignore-checksums','ignore-stringtable')
          foreach ($Procedure in @('many_ints','many_floats','pair','large','call_host')) {
            $Names += "ignore-$Procedure-symbols"
            $Names += "ignore-$Procedure-lines"
          }
          $Results = @()
          foreach ($Name in $Names) {
            Write-Host "===== LINK $Name ====="
            & clang.exe @Sanitizer @LibraryArgs diag\caller.o "diag\$Name.o" -o "diag\$Name.exe" 2>&1 |
              Tee-Object -FilePath "diag\link-$Name.log" |
              ForEach-Object { Write-Host $_ }
            $Code = $LASTEXITCODE
            $Results += "$Name=$Code"
            Write-Host "LINK_RESULT $Name=$Code"
          }
          $Results | Set-Content -Encoding ascii diag\subsection-summary.txt
          Get-Content diag\subsection-summary.txt

      - name: Retain subsection bisection output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-786-codeview-subsections-${{ github.run_id }}
          path: |
            diag/subsection-summary.txt
            diag/link-*.log
            diag/subsections.py
          retention-days: 3
          if-no-files-found: error
          compression-level: 6
