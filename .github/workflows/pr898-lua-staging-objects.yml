name: PR 898 Lua repair object staging
on:
  push:
    branches: [automation/898-lua-staging-objects-f3e9dca]
permissions:
  contents: write
jobs:
  objects:
    if: ${{ github.repository == 'buster14a/buster' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f3e9dca39929a672c5e189f01931f2fa789c9d5b
          persist-credentials: false
      - name: Verify patch identities and publish immutable objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zlib
          base = 'f3e9dca39929a672c5e189f01931f2fa789c9d5b'
          base_tree = '84b865dbaeb0e4f95b1ca41c3a372cac822688a7'
          target_tree = 'ed1510230dcb3eebea7747ed1e4f7fc0e60c89e6'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == base
          assert git('rev-parse', 'HEAD^{tree}') == base_tree
          identities = {
              'build.c': ('45dbe0dbb3b49798dd7ead6d26a4eefe88d97356be24adc445d50380bfe9fe55', 'f7b7edf3193dc8e5181f73e9d40f53b2a1b5619814f0a203af9d104e6407cc36', 'e0f837abe06eee7d45a0197406fe7e863e40945c'),
              'docs/agents/compatibility/lua.md': ('6dd1175dfc6e8617a32bcf4f3da07e4696b1a947efac6a5c1a0b52ebb46ab9aa', 'e40b23587c738e5850ab5bb75385e766f0d472f38d1107e3bf8be8100b8a6d7e', '777b89e3512b51f25ef6d4946d8ccb75034ac456'),
          }
          for path, (before, after, blob) in identities.items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == before
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '157dedfa8b1192108f77c459a0d67b592755729fabff8c042e5d8a00aa38ba07'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          assert set(git('diff', '--name-only').splitlines()) == set(identities)
          for path, (before, after, blob) in identities.items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == after
              assert git('hash-object', path) == blob
          subprocess.run(['git', 'add', '--', *identities], check=True)
          assert git('write-tree') == target_tree
          def post(endpoint, value):
              request = urllib.request.Request(
                  'https://api.github.com/repos/buster14a/buster/git/' + endpoint,
                  data=json.dumps(value).encode(), method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries = []
          for path, (before, after, blob) in identities.items():
              result = post('blobs', {'content': pathlib.Path(path).read_text(), 'encoding': 'utf-8'})
              assert result['sha'] == blob
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob})
          result = post('trees', {'base_tree': base_tree, 'tree': entries})
          assert result['sha'] == target_tree
          print(json.dumps({'base': base, 'tree': target_tree, 'files': identities, 'refs_modified': False}, sort_keys=True))
          PY
