name: Refine issue 1733 complex arithmetic overview

on:
  push:
    branches:
      - docs/1733-reference-mode

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out patch branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: docs/1733-reference-mode
          fetch-depth: 0
          persist-credentials: true

      - name: Refine the complex arithmetic overview
        shell: bash
        run: |
          python3 -c "import base64; exec(base64.b64decode(''))"
          rm -- .github/workflows/issue-1733-reference-apply.yml
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/issue-1733-reference-apply.yml\nsrc/buster/lib/compiler/frontend/c/c_gen.c'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/issue-1733-reference-apply.yml src/buster/lib/compiler/frontend/c/c_gen.c
          git commit -m "docs(c): name complex arithmetic reference mode"
          git push origin HEAD:docs/1733-reference-mode
