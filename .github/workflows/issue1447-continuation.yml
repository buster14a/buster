name: Issue 1447 pragma oracles
on:
  push:
    branches: [codex/issue-1447-pragma-oracles-01a1ad8e]
permissions:
  contents: read
jobs:
  ms-struct-boundaries:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install pinned Clang
        run: bash tools/ci/setup-hosted.sh
      - name: Probe record layout boundary cases
        shell: bash
        run: |
          set +e
          ulimit -c 0
          for case in {45..56}; do
            echo "LAYOUT CASE=$case"
            clang -std=gnu17 -O0 -Wunknown-pragmas -fno-caret-diagnostics -DCASE="$case" tools/issue1447-ms-struct.c -o "$RUNNER_TEMP/ms-probe" 2>&1
            status=$?
            echo "COMPILE_STATUS=$status"
            if [ "$status" = 0 ]; then "$RUNNER_TEMP/ms-probe"; echo "RUN_STATUS=$?"; fi
          done
          exit 0
