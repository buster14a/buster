name: Issue 1447 continuation qualification
on:
  push:
    branches: [codex/issue-1447-continuation-validation]
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install pinned Clang
        run: bash tools/ci/setup-hosted.sh
      - name: Record diagnostic oracle
        run: |
          mkdir -p build/issue1447-continuation
          for file in tools/issue1447-probes/*/*.c; do
            for standard in gnu17 gnu23; do
              printf '\nPROBE %s %s\n' "$file" "$standard"
              clang -std="$standard" -fsyntax-only -Wnoderef -ferror-limit=0 -fno-color-diagnostics -fno-caret-diagnostics -fdiagnostics-show-option "$file" || true
            done
          done
          for file in tools/issue1447-probes/noderef-probes/{placement,propagation}.c; do
            printf '\nAST %s\n' "$file"
            clang -std=gnu17 -fsyntax-only -Xclang -ast-dump -fno-color-diagnostics -fno-caret-diagnostics "$file" || true
          done
          clang -std=gnu23 -c tools/issue1447-probes/attribute-completion-probes/loader_sections.c -o build/issue1447-continuation/loader.o
          readelf -SW build/issue1447-continuation/loader.o
