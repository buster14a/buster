name: Issue 1447 continuation qualification
on:
  push:
    branches: [codex/issue-1447-continuation-validation]
permissions:
  contents: read
jobs:
  diagnostics-debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      BUSTER_HOST_ARCH: x86-64
      BUSTER_DEBUG_INFO: '1'
      BUSTER_HOST_SSP: off
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: fcab74faf28d9e65b6eff6d121615d1111364b85
      - name: Install pinned Clang and debug tools
        run: bash tools/ci/setup-hosted.sh
      - name: Build exact diagnostic snapshot with debug information
        run: ./build.sh --config Release
      - name: Capture checker failure
        run: gdb -batch -ex run -ex 'thread apply all bt full' --args ./build/compiler test-checker --seed 133 --part 1/4
