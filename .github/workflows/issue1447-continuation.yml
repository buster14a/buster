name: Issue 1447 continuation qualification
on:
  push:
    branches: [codex/issue-1447-continuation-validation]
permissions:
  contents: read
jobs:
  selectany-object-oracle:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install pinned Clang
        run: bash tools/ci/setup-hosted.sh
      - name: Inspect selectany group signatures and relocation membership
        shell: bash
        run: |
          mkdir -p build/issue1447-oracle
          clang -std=gnu17 -O0 -fcommon -c tools/issue1447-selectany-object.c -o build/issue1447-oracle/first.o
          readelf -g -W -S -s build/issue1447-oracle/first.o
