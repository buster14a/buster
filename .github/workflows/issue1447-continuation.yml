name: Issue 1447 continuation qualification
on:
  push:
    branches: [codex/issue-1447-continuation-validation]
permissions:
  contents: read
jobs:
  bool-vector-oracle:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install pinned Clang
        run: bash tools/ci/setup-hosted.sh
      - name: Probe boolean elementwise behavior
        shell: bash
        run: |
          set -u
          mkdir -p build/issue1447-oracle
          for op in {1..13}; do
            for lanes in 1 3 8 65 1024; do
              stem="build/issue1447-oracle/op${op}-lanes${lanes}"
              echo "CASE op=$op lanes=$lanes"
              if clang -O0 -march=x86-64 -std=gnu17 -Wno-psabi -DOP="$op" -DLANES="$lanes" tools/issue1447-bool-builtins.c -o "$stem" > "$stem.compile.log" 2>&1; then
                timeout 10 "$stem"
                echo "run status=$?"
              else
                echo "compile status=$?"
                sed -n '1,16p' "$stem.compile.log"
              fi
            done
            stem="build/issue1447-oracle/op${op}-ir"
            if clang -O0 -march=x86-64 -std=gnu17 -Wno-psabi -DOP="$op" -DLANES=8 -S -emit-llvm tools/issue1447-bool-builtins.c -o "$stem.ll" > "$stem.log" 2>&1; then
              sed -n '/define.*@operation/,/^}/p' "$stem.ll"
            else
              sed -n '1,12p' "$stem.log"
            fi
          done
