name: Issue 1447 continuation qualification
on:
  push:
    branches: [codex/issue-1447-continuation-validation]
permissions:
  contents: read
jobs:
  recovery-conversion-oracle:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install pinned Clang
        run: bash tools/ci/setup-hosted.sh
      - name: Probe declaration recovery and conversion diagnostics
        shell: bash
        run: |
          set +e
          ulimit -c 0
          for case in {1..20}; do
            echo "DECLARATION CASE=$case"
            clang -std=gnu17 -fsyntax-only -fno-caret-diagnostics -DCASE="$case" tools/issue1447-declaration-recovery.c 2>&1
          done
          for case in {1..24}; do
            echo "CONVERSION CASE=$case"
            clang -std=gnu17 -fsyntax-only -fno-caret-diagnostics -DCASE="$case" tools/issue1447-conversions.c 2>&1
          done
          exit 0
