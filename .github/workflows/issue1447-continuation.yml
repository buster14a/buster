name: Issue 1447 continuation qualification
on:
  push:
    branches: [codex/issue-1447-continuation-validation]
permissions:
  contents: read
jobs:
  diagnostic-oracle:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install pinned Clang
        run: bash tools/ci/setup-hosted.sh
      - name: Probe diagnostic spelling and argument notes
        shell: bash
        run: |
          set +e
          ulimit -c 0
          for case in {1..24}; do
            echo "DIAGNOSTIC CASE=$case"
            clang -std=gnu23 -fsyntax-only -fno-caret-diagnostics -DCASE="$case" tools/issue1447-diagnostic-followup.c 2>&1
            echo "STATUS=$?"
          done
          exit 0
