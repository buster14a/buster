name: Issue 1447 continuation qualification
on:
  push:
    branches: [codex/issue-1447-continuation-validation]
permissions:
  contents: read
jobs:
  declaration-debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      BUSTER_HOST_ARCH: x86-64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 280fa88a10e4f1c309cd596041e296d0a558ff8b
          persist-credentials: false
      - name: Install pinned Clang
        run: bash tools/ci/setup-hosted.sh
      - name: Build debug compiler
        run: ./build.sh --config Debug --jobs 4
      - name: Locate null declaration failure
        shell: bash
        run: |
          if ! command -v gdb; then sudo apt-get update && sudo apt-get install -y gdb; fi
          cat > "$RUNNER_TEMP/empty.c" <<'EOF'
          __attribute__((unused));
          EOF
          cat > "$RUNNER_TEMP/empty.gdb" <<'EOF'
          set pagination off
          break check_input_report if message == CHECK_INPUT_DECLARATION
          commands
          silent
          printf "GENERIC DECLARATION ERROR token=%u\n", token
          bt 6
          p reader->specifier_free_standing
          p reader->specifier_owner
          continue
          end
          run
          EOF
          gdb --batch -x "$RUNNER_TEMP/empty.gdb" --args build/compiler -std=gnu17 -fsyntax-only -fno-caret-diagnostics "$RUNNER_TEMP/empty.c"
