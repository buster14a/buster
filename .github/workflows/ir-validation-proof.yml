name: IR validation diagnostic proof

# Temporary branch-only evidence for #2444/#2445/#2446. Do not propose this
# workflow for main or treat its hosted timings as dedicated-host acceptance.
on:
  push:
    branches:
      - codex/2444-label-validation-proof

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      BUSTER_TEST_JOBS: '2'
      BUSTER_IR_BASELINE_SHA: 8feebe0f93351bc28e146313b4d77600fd56f1cb
      # Replace with the immutable source-only candidate commit, before the
      # separate temporary workflow commit is created on the proof branch.
      BUSTER_IR_CANDIDATE_SHA: 187463b50ed2b377ede81df72626239004abffad
    steps:
      - name: Prepare retained evidence and hosted perf
        id: setup
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/ir-validation-proof-evidence"
          mkdir -p "$evidence/binaries" "$evidence/baseline" "$evidence/candidate" "$evidence/instrumented"
          printf 'BUSTER_IR_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          exec > >(tee "$evidence/setup.log") 2>&1
          set -x
          uname -a
          lscpu
          free -b
          clang --version
          cmake --version
          ninja --version
          python3 --version
          jq --version
          test "$BUSTER_IR_CANDIDATE_SHA" != CANDIDATE_SHA
          test "${#BUSTER_IR_CANDIDATE_SHA}" -eq 40
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes linux-tools-common linux-tools-generic
          # Hosted perf is supplementary. Preserve an unsuccessful setup
          # attempt; the complete-pair assertions below prevent false success.
          sudo sysctl kernel.perf_event_paranoid=-1 || true
          sysctl kernel.perf_event_paranoid
          perf_path="$(command -v perf)"
          if ! "$perf_path" --version; then
            # Ubuntu's /usr/bin/perf wrapper can lack a matching tools package
            # for the hosted running kernel. Use the installed native executable.
            perf_path="$(compgen -G '/usr/lib/linux-tools/*/perf' | sort -V | tail -n 1)"
            test -n "$perf_path"
            "$perf_path" --version
          fi
          printf 'BUSTER_IR_PERF=%s\n' "$perf_path" >> "$GITHUB_ENV"
          sha256sum "$perf_path" > "$evidence/perf.sha256"
          "$perf_path" stat -x, -o "$evidence/perf-preflight.csv" -e task-clock,cycles:u,instructions:u,branch-misses:u,page-faults,minor-faults,major-faults -- true

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        id: baseline_checkout
        with:
          ref: ${{ env.BUSTER_IR_BASELINE_SHA }}
          path: source
          persist-credentials: false

      - name: Build and freeze baseline trusted Clang compiler
        id: baseline_build
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/baseline/build.log") 2>&1
          set -x
          test "$(git rev-parse HEAD)" = "$BUSTER_IR_BASELINE_SHA"
          git rev-parse HEAD 'HEAD^{tree}' > "$BUSTER_IR_EVIDENCE/baseline/revisions.txt"
          pwd > "$BUSTER_IR_EVIDENCE/baseline/build-root.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$BUSTER_IR_EVIDENCE/baseline/source.sha256"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o "$RUNNER_TEMP/buster-ir-baseline-build"
          sha256sum "$RUNNER_TEMP/buster-ir-baseline-build" > "$BUSTER_IR_EVIDENCE/baseline/driver.sha256"
          "$RUNNER_TEMP/buster-ir-baseline-build" generate --config Release --cc clang --ci --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_UNITY_BUILD=OFF -DBUSTER_INCLUDE_TESTS=ON -DBUSTER_BENCH_ALLOCATIONS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          "$RUNNER_TEMP/buster-ir-baseline-build" build --config Release -t ide -- -j2
          grep -Fx 'BUSTER_BENCH_ALLOCATIONS:BOOL=OFF' build/CMakeCache.txt
          grep -Fx 'BUSTER_UNITY_BUILD:BOOL=OFF' build/CMakeCache.txt
          cp build/CMakeCache.txt build/compile_commands.json "$BUSTER_IR_EVIDENCE/baseline/"
          find build/generated -type f -print0 | sort -z | xargs -0 sha256sum > "$BUSTER_IR_EVIDENCE/baseline/generated.sha256"
          cp build/Release/ide "$BUSTER_IR_EVIDENCE/binaries/baseline-ide"
          chmod a-w "$BUSTER_IR_EVIDENCE/binaries/baseline-ide"
          sha256sum "$BUSTER_IR_EVIDENCE/binaries/baseline-ide" > "$BUSTER_IR_EVIDENCE/baseline/compiler.sha256"
          git diff --exit-code

      - name: Baseline self-host fixed point
        id: baseline_self_host
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/baseline/self-host.log") 2>&1
          set -x
          "$RUNNER_TEMP/buster-ir-baseline-build" test_self_host --config Release
          sha256sum build/self-host/Release/ide-stage1 build/self-host/Release/ide-stage2 > "$BUSTER_IR_EVIDENCE/baseline/self-host.sha256"
          cp build/self-host/Release/ide-stage1.metrics build/self-host/Release/ide-stage2.metrics "$BUSTER_IR_EVIDENCE/baseline/"

      # Complete baseline work before replacing source. Both revisions use the
      # identical source/build paths and configure flags; no build is concurrent.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        id: candidate_checkout
        if: ${{ !cancelled() && steps.baseline_build.outcome == 'success' }}
        with:
          ref: ${{ env.BUSTER_IR_CANDIDATE_SHA }}
          path: source
          persist-credentials: false

      - name: Build and freeze candidate trusted Clang compiler
        id: candidate_build
        if: ${{ !cancelled() && steps.candidate_checkout.outcome == 'success' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/candidate/build.log") 2>&1
          set -x
          test "$(git rev-parse HEAD)" = "$BUSTER_IR_CANDIDATE_SHA"
          git rev-parse HEAD 'HEAD^{tree}' > "$BUSTER_IR_EVIDENCE/candidate/revisions.txt"
          pwd > "$BUSTER_IR_EVIDENCE/candidate/build-root.txt"
          cmp "$BUSTER_IR_EVIDENCE/baseline/build-root.txt" "$BUSTER_IR_EVIDENCE/candidate/build-root.txt"
          git ls-files -z | sort -z | xargs -0 sha256sum > "$BUSTER_IR_EVIDENCE/candidate/source.sha256"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o "$RUNNER_TEMP/buster-ir-candidate-build"
          sha256sum "$RUNNER_TEMP/buster-ir-candidate-build" > "$BUSTER_IR_EVIDENCE/candidate/driver.sha256"
          "$RUNNER_TEMP/buster-ir-candidate-build" generate --config Release --cc clang --ci --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_UNITY_BUILD=OFF -DBUSTER_INCLUDE_TESTS=ON -DBUSTER_BENCH_ALLOCATIONS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          "$RUNNER_TEMP/buster-ir-candidate-build" build --config Release -t ide -- -j2
          grep -Fx 'BUSTER_BENCH_ALLOCATIONS:BOOL=OFF' build/CMakeCache.txt
          grep -Fx 'BUSTER_UNITY_BUILD:BOOL=OFF' build/CMakeCache.txt
          cp build/CMakeCache.txt build/compile_commands.json "$BUSTER_IR_EVIDENCE/candidate/"
          find build/generated -type f -print0 | sort -z | xargs -0 sha256sum > "$BUSTER_IR_EVIDENCE/candidate/generated.sha256"
          tar -czf "$BUSTER_IR_EVIDENCE/candidate/generated.tar.gz" -C build generated
          cp build/Release/ide "$BUSTER_IR_EVIDENCE/binaries/candidate-ide"
          chmod a-w "$BUSTER_IR_EVIDENCE/binaries/candidate-ide"
          sha256sum "$BUSTER_IR_EVIDENCE/binaries/candidate-ide" > "$BUSTER_IR_EVIDENCE/candidate/compiler.sha256"
          git diff --exit-code

      - name: Candidate self-host fixed point
        id: candidate_self_host
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/candidate/self-host.log") 2>&1
          set -x
          "$RUNNER_TEMP/buster-ir-candidate-build" test_self_host --config Release
          sha256sum build/self-host/Release/ide-stage1 build/self-host/Release/ide-stage2 > "$BUSTER_IR_EVIDENCE/candidate/self-host.sha256"
          cp build/self-host/Release/ide-stage1.metrics build/self-host/Release/ide-stage2.metrics "$BUSTER_IR_EVIDENCE/candidate/"

      - name: Candidate complete registered tests
        id: candidate_tests
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/candidate/test-all.log") 2>&1
          set -x
          "$RUNNER_TEMP/buster-ir-candidate-build" build --config Release -t test_all -- -j2

      - name: A/A immutable baseline noise comparison on frozen candidate inputs
        id: aa
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' && env.BUSTER_IR_PERF != '' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/aa.log") 2>&1
          set -x
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/source.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/generated.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/baseline/compiler.sha256"
          python3 tools/uarch_lab.py compare --baseline "$BUSTER_IR_EVIDENCE/binaries/baseline-ide" --candidate "$BUSTER_IR_EVIDENCE/binaries/baseline-ide" --repo-root . --cpu -1 --pairs 16 --require-identical-output --perf "$BUSTER_IR_PERF" --output "$BUSTER_IR_EVIDENCE/aa"
          jq -e '.outputs_identical == true and .plan.complete_pairs == 16 and .baseline.failed == 0 and .candidate.failed == 0 and .baseline.deterministic == true and .candidate.deterministic == true' "$BUSTER_IR_EVIDENCE/aa/summary.json"
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/source.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/generated.sha256"

      - name: A/B frozen uninstrumented compiler comparison
        id: ab
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' && env.BUSTER_IR_PERF != '' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/ab.log") 2>&1
          set -x
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/source.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/generated.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/baseline/compiler.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/compiler.sha256"
          python3 tools/uarch_lab.py compare --baseline "$BUSTER_IR_EVIDENCE/binaries/baseline-ide" --candidate "$BUSTER_IR_EVIDENCE/binaries/candidate-ide" --repo-root . --cpu -1 --pairs 16 --require-identical-output --perf "$BUSTER_IR_PERF" --output "$BUSTER_IR_EVIDENCE/ab"
          jq -e '.outputs_identical == true and .plan.complete_pairs == 16 and .baseline.failed == 0 and .candidate.failed == 0 and .baseline.deterministic == true and .candidate.deterministic == true' "$BUSTER_IR_EVIDENCE/ab/summary.json"
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/source.sha256"
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/generated.sha256"

      - name: Regenerate idle tree and run diagnostic IR work budgets
        id: geometric_tests
        if: ${{ !cancelled() && steps.candidate_build.outcome == 'success' }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$BUSTER_IR_EVIDENCE/instrumented/ir-tests.log") 2>&1
          set -x
          # A/A and A/B have finished. This diagnostic regeneration cannot
          # replace files used by any active build, self-host or measurement.
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/source.sha256"
          "$RUNNER_TEMP/buster-ir-candidate-build" generate --config Release --cc clang --ci --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_UNITY_BUILD=OFF -DBUSTER_INCLUDE_TESTS=ON -DBUSTER_BENCH_ALLOCATIONS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          "$RUNNER_TEMP/buster-ir-candidate-build" build --config Release -t ide -- -j2
          grep -Fx 'BUSTER_BENCH_ALLOCATIONS:BOOL=ON' build/CMakeCache.txt
          cp build/CMakeCache.txt build/compile_commands.json "$BUSTER_IR_EVIDENCE/instrumented/"
          find build/generated -type f -print0 | sort -z | xargs -0 sha256sum > "$BUSTER_IR_EVIDENCE/instrumented/generated.sha256"
          cp build/Release/ide "$BUSTER_IR_EVIDENCE/binaries/instrumented-ide"
          sha256sum "$BUSTER_IR_EVIDENCE/binaries/instrumented-ide" > "$BUSTER_IR_EVIDENCE/instrumented/compiler.sha256"
          ./build/Release/ide test --ci=1 --verbose=1 --module=ir_tests
          sha256sum -c "$BUSTER_IR_EVIDENCE/candidate/source.sha256"
          git diff --exit-code

      - name: Publish diagnostic scope and results
        if: always()
        shell: bash
        env:
          BASELINE_BUILD: ${{ steps.baseline_build.outcome }}
          BASELINE_FIXED_POINT: ${{ steps.baseline_self_host.outcome }}
          CANDIDATE_BUILD: ${{ steps.candidate_build.outcome }}
          CANDIDATE_FIXED_POINT: ${{ steps.candidate_self_host.outcome }}
          CANDIDATE_TESTS: ${{ steps.candidate_tests.outcome }}
          AA: ${{ steps.aa.outcome }}
          AB: ${{ steps.ab.outcome }}
          GEOMETRIC_TESTS: ${{ steps.geometric_tests.outcome }}
        run: |
          set -euo pipefail
          printf '## IR validation diagnostic proof\n\nBaseline `%s`; source candidate `%s`.\n\nBaseline build: **%s**; baseline fixed point: **%s**; candidate build: **%s**; candidate fixed point: **%s**; candidate full tests: **%s**; A/A: **%s**; A/B: **%s**; instrumented IR budgets: **%s**.\n\n' "$BUSTER_IR_BASELINE_SHA" "$BUSTER_IR_CANDIDATE_SHA" "$BASELINE_BUILD" "$BASELINE_FIXED_POINT" "$CANDIDATE_BUILD" "$CANDIDATE_FIXED_POINT" "$CANDIDATE_TESTS" "$AA" "$AB" "$GEOMETRIC_TESTS" >> "$GITHUB_STEP_SUMMARY"
          printf 'The 16-pair comparisons use frozen trusted Clang binaries on one frozen candidate input tree, sequential builds in the same path and fresh executable copies per measured child. A/A measures runtime noise; it does not prove build-layout neutrality. Hosted unpinned timing and available PMU counters are diagnostic only. This is not dedicated Ryzen 9700X acceptance, retirement admission, a sanitizer gate or the platform/allocator matrix. Ordinary PR checks remain responsible for those gates. No new counters or tests are patched into the baseline. Raw setup, build, self-host, test and measurement failures are retained.\n\n' >> "$GITHUB_STEP_SUMMARY"
          for comparison in aa ab; do
            report="$GITHUB_WORKSPACE/ir-validation-proof-evidence/$comparison/report.md"
            if test -f "$report"; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              printf '\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          test "$BASELINE_BUILD" = success
          test "$BASELINE_FIXED_POINT" = success
          test "$CANDIDATE_BUILD" = success
          test "$CANDIDATE_FIXED_POINT" = success
          test "$CANDIDATE_TESTS" = success
          test "$GEOMETRIC_TESTS" = success
          test "$AA" = success
          test "$AB" = success

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ir-validation-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ir-validation-proof-evidence
            source/build/CMakeCache.txt
            source/build/compile_commands.json
          retention-days: 14
          if-no-files-found: warn
