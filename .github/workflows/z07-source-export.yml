name: Z07 pinned source and coordination export

on:
  push:
    branches: [astra/z07-semantic-queries-transport]
    paths: [.github/workflows/z07-source-export.yml]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: z07-source-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          persist-credentials: false
      - name: Export immutable tracked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/z07-export"
          test "$(git rev-parse HEAD)" = ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          git archive --format=tar.gz --output="$RUNNER_TEMP/z07-export/source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/z07-export/source.sha"
      - name: Read paginated repository coordination records
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request
          from datetime import datetime, timezone

          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'z07-export'
          api = 'https://api.github.com/repos/buster14a/buster'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          manifest = {'recorded_at': datetime.now(timezone.utc).isoformat(), 'collections': {}}

          def collection(path, name):
              result = []
              page = 1
              url = api + path + ('&' if '?' in path else '?') + 'per_page=100&page=1'
              while url:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=60) as response:
                      items = json.load(response)
                      if not isinstance(items, list):
                          raise RuntimeError('Expected collection: ' + path)
                      result.extend(items)
                      links = response.headers.get('Link', '')
                  next_url = None
                  for link in links.split(','):
                      if 'rel="next"' in link:
                          next_url = link.split('>')[0].strip()[1:]
                  if next_url and not next_url.startswith(api + '/'):
                      raise RuntimeError('Unexpected pagination destination')
                  url = next_url
                  if url:
                      page += 1
                      if page > 50:
                          raise RuntimeError('Pagination budget exceeded; incomplete export')
              (root / (name + '.json')).write_text(json.dumps(result, indent=2), encoding='utf-8')
              manifest['collections'][name] = {'path': path, 'pages': page, 'count': len(result), 'complete': True}
              print(name, 'pages=' + str(page), 'count=' + str(len(result)))
              return result

          collection('/issues?state=all&sort=created&direction=asc', 'issues-all')
          open_prs = collection('/pulls?state=open&sort=created&direction=asc', 'pulls-open')
          for number in [128, 241, 259, 291, 302, 230, 235]:
              collection('/issues/' + str(number) + '/comments', 'issue-' + str(number) + '-comments')
          for number in sorted({244} | {pr['number'] for pr in open_prs}):
              prefix = '/pulls/' + str(number)
              collection(prefix + '/files', 'pr-' + str(number) + '-files')
              collection(prefix + '/reviews', 'pr-' + str(number) + '-reviews')
              collection(prefix + '/comments', 'pr-' + str(number) + '-review-comments')
              collection('/issues/' + str(number) + '/comments', 'pr-' + str(number) + '-comments')
          collection('/commits?sha=ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae&path=src/buster/lib/compiler/frontend/c/c_parse.c', 'parser-commits')
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY
          printf 'Pinned source and paginated read-only coordination export. No compilation, test, or performance result.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: z07-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/z07-export/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
