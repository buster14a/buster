name: Issue 697 evidence

on:
  push:
    branches: [work/697-worker-deadline-evidence]
    paths: [tools/bench_service/issue697.patch]

permissions:
  contents: read

jobs:
  validate-and-publish:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply the reviewed patch to the immutable baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-697"
          cp tools/bench_service/issue697.patch "$RUNNER_TEMP/issue-697/repair.patch"
          printf '%s  %s\n' '1cb65d411d263ab8258b10bfef3325d62f85513213e518366cb633d1e90a4394' "$RUNNER_TEMP/issue-697/repair.patch" | sha256sum -c -
          git fetch --no-tags --depth=1 origin 23bb293c070afbece177d1407029a6937ce51fe2
          git checkout --detach 23bb293c070afbece177d1407029a6937ce51fe2
          clang -E -P -std=c11 -Isrc -DBUSTER_SINGLE_THREADED=1 tools/bench_service/main.c > "$RUNNER_TEMP/issue-697/production-before.i"
          git apply --check "$RUNNER_TEMP/issue-697/repair.patch"
          git apply "$RUNNER_TEMP/issue-697/repair.patch"
          git diff --check
          test ! -e .github/workflows/issue-697-evidence.yml
          test ! -e tools/bench_service/issue697.patch
          clang -E -P -std=c11 -Isrc -DBUSTER_SINGLE_THREADED=1 tools/bench_service/main.c > "$RUNNER_TEMP/issue-697/production-after.i"
          cmp "$RUNNER_TEMP/issue-697/production-before.i" "$RUNNER_TEMP/issue-697/production-after.i"
          echo 'PRODUCTION_PREPROCESSING_IDENTICAL'
          clang --version
          gcc --version
          uname -a
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-deadline-driver"
      - name: Native normal service tests
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-deadline-driver" bench_service self-test 2>&1 | tee "$RUNNER_TEMP/issue-697/normal.log"
      - name: Native ASan and UBSan service tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-deadline-driver" bench_service self-test --sanitize 2>&1 | tee "$RUNNER_TEMP/issue-697/sanitized.log"
      - name: GCC with project warning policy
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(-std=c11 -O2 -Wall -Wextra -Werror -fwrapv -fno-strict-aliasing -funsigned-char -Isrc -DBUSTER_SINGLE_THREADED=1)
          gcc "${flags[@]}" tools/bench_service/main.c tools/throughput/shared.c -lm -o "$RUNNER_TEMP/service-gcc"
          gcc "${flags[@]}" tools/bench_service/tests.c tools/throughput/shared.c -lm -o "$RUNNER_TEMP/service-tests-gcc"
          "$RUNNER_TEMP/service-tests-gcc" 2>&1 | tee "$RUNNER_TEMP/issue-697/gcc.log"
      - name: Publish only validated source changes on an owned branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Buster repair automation'
          git config user.email 'noreply@openai.com'
          git add tools/bench_service/README.md tools/bench_service/tests.c tools/bench_service/worker_deadline_tests.c tools/bench_service/worker_linux.c
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --check
          git commit -m 'test: make worker deadline cleanup independent of init reaping'
          git rev-parse HEAD | tee "$RUNNER_TEMP/issue-697/fix-commit.txt"
          git show --stat --oneline HEAD
          git push origin HEAD:refs/heads/work/697-worker-deadline-fix
      - name: Retain validation evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-697-repair-validation
          path: |
            ${{ runner.temp }}/issue-697/*.log
            ${{ runner.temp }}/issue-697/*.txt
            ${{ runner.temp }}/issue-697/*.patch
          retention-days: 7
