name: Issue 697 evidence

on:
  push:
    branches: [work/697-worker-deadline-evidence]
    paths: [.github/workflows/issue-697-evidence.yml]

permissions:
  contents: read

jobs:
  validate-and-publish:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reconcile with the newly landed service recovery
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-697"
          git config user.name 'Buster repair automation'
          git config user.email 'noreply@openai.com'
          git fetch --no-tags --depth=100 origin 510fd58c03ef49030e0ffd42903821f4a9de0073 2142bf4b520cd82ca2dd3aeba5941cfd16ac48fd
          git checkout --detach 2142bf4b520cd82ca2dd3aeba5941cfd16ac48fd
          clang -E -P -std=c11 -Isrc -DBUSTER_SINGLE_THREADED=1 tools/bench_service/main.c > "$RUNNER_TEMP/issue-697/production-before.i"
          git checkout --detach 510fd58c03ef49030e0ffd42903821f4a9de0073
          if ! git merge --no-ff --no-commit 2142bf4b520cd82ca2dd3aeba5941cfd16ac48fd; then
            git diff --name-only --diff-filter=U | tee "$RUNNER_TEMP/issue-697/conflicts.txt"
            printf 'tools/bench_service/README.md\ntools/bench_service/tests.c\n' > "$RUNNER_TEMP/issue-697/expected-conflicts.txt"
            cmp "$RUNNER_TEMP/issue-697/conflicts.txt" "$RUNNER_TEMP/issue-697/expected-conflicts.txt"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def source(revision, path):
              return subprocess.check_output(['git', 'show', revision + ':' + path], text=True)
          current = '2142bf4b520cd82ca2dd3aeba5941cfd16ac48fd'
          path = Path('tools/bench_service/tests.c')
          old = source('23bb293c070afbece177d1407029a6937ce51fe2', str(path))
          start = old.index('BUSTER_GLOBAL_LOCAL volatile sig_atomic_t bq_test_alarm_count;')
          end = old.index('typedef struct BqWorkerFake\n', start)
          block = old[start:end]
          text = source(current, str(path))
          assert text.count(block) == 1, 'The original deadline block must be unchanged on current main'
          path.write_text(text.replace(block, '#include "worker_deadline_tests.c"\n\n'))
          path = Path('tools/bench_service/README.md')
          text = source(current, str(path))
          anchor = 'measurement loop or general-purpose testing framework.\n\n'
          assert text.count(anchor) == 1
          paragraph = '''Linux supervisor deadline coverage lives in `worker_deadline_tests.c`. Timed
          commands use explicit `exec` so the test retains an owned direct child rather
          than depending on PID 1 to reap an orphaned shell descendant. The observed
          `fork` PID identifies the group even when timeout precedes all output; a
          stopped-before-exec control covers that case. Separate owned live/zombie group
          members must prevent cleanup success until explicitly reaped. Failure
          diagnostics retain individual results, elapsed time, PID/group identity and
          process state before bounded cleanup. The 20 ms command deadline, 1,000 ms
          test bound and production cleanup policy are unchanged, including treating
          unreaped zombies as present group members.

          '''
          path.write_text(text.replace(anchor, anchor + paragraph))
          PY
          git add tools/bench_service/README.md tools/bench_service/tests.c
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          test "$(git hash-object tools/bench_service/worker_deadline_tests.c)" = 6461ba62ca5cf496398d0b9db5cba1e923013990
          test ! -e .github/workflows/issue-697-evidence.yml
          test ! -e tools/bench_service/issue697.patch
          clang -E -P -std=c11 -Isrc -DBUSTER_SINGLE_THREADED=1 tools/bench_service/main.c > "$RUNNER_TEMP/issue-697/production-after.i"
          cmp "$RUNNER_TEMP/issue-697/production-before.i" "$RUNNER_TEMP/issue-697/production-after.i"
          echo 'PRODUCTION_PREPROCESSING_IDENTICAL_TO_CURRENT_MAIN'
          clang --version
          gcc --version
          uname -a
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-deadline-driver"
      - name: Native normal service and materialized recipe bridge tests
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-deadline-driver" bench_service self-test 2>&1 | tee "$RUNNER_TEMP/issue-697/normal.log"
      - name: Native ASan and UBSan service tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-deadline-driver" bench_service self-test --sanitize 2>&1 | tee "$RUNNER_TEMP/issue-697/sanitized.log"
      - name: GCC with project warning policy
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(-std=c11 -O2 -Wall -Wextra -Werror -fwrapv -fno-strict-aliasing -funsigned-char -Isrc -DBUSTER_SINGLE_THREADED=1)
          gcc "${flags[@]}" tools/bench_service/main.c tools/throughput/shared.c -lm -o "$RUNNER_TEMP/service-gcc"
          gcc "${flags[@]}" tools/bench_service/tests.c tools/throughput/shared.c -lm -o "$RUNNER_TEMP/service-tests-gcc"
          "$RUNNER_TEMP/service-tests-gcc" 2>&1 | tee "$RUNNER_TEMP/issue-697/gcc.log"
      - name: Preserve the validated merge for connected-GitHub publication
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'Merge current main into the worker deadline test repair'
          git rev-parse HEAD | tee "$RUNNER_TEMP/issue-697/fix-commit.txt"
          git diff 2142bf4b520cd82ca2dd3aeba5941cfd16ac48fd HEAD --stat
          git diff 2142bf4b520cd82ca2dd3aeba5941cfd16ac48fd HEAD > "$RUNNER_TEMP/issue-697/repair.patch"
          test "$(git diff --name-only 2142bf4b520cd82ca2dd3aeba5941cfd16ac48fd HEAD | wc -l)" -eq 4
          git push origin HEAD:refs/heads/work/697-worker-deadline-reconciled
      - name: Retain validation evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-697-main-reconciliation
          path: |
            ${{ runner.temp }}/issue-697/*.log
            ${{ runner.temp }}/issue-697/*.txt
            ${{ runner.temp }}/issue-697/*.patch
          retention-days: 7
