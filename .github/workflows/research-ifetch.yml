name: Instruction delivery research (branch only)
on:
  push:
    branches: [codex/1438-ifetch-census]
    paths: ['tools/ifetch_census.c', '.github/workflows/research-ifetch.yml']
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build research driver
        run: clang -std=c11 -Wall -Wextra -Wpedantic -Werror tools/ifetch_census.c -o /tmp/ifetch-census
      - name: Baseline and population census (not performance admission)
        run: /tmp/ifetch-census
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ifetch-census-${{ github.sha }}
          path: evidence
          retention-days: 30
          if-no-files-found: error
