name: Diagnose PR 916 workflow tools

on:
  push:
    branches: [audit/916-workflow-tools]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run workflow-tool regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/ci_tools_test.py -v
