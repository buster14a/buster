name: Validate PR 916 differential policy repair

on:
  push:
    branches: [audit/916-workflow-tools]

concurrency:
  group: validate-pr-916-differential-policy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout exact repaired candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: audit/916-differential-policy-fix
          persist-credentials: false
      - name: CI tools
        run: python3 tests/ci_tools_test.py -v
      - name: Zig installer
        run: python3 tools/ci_zig_test.py -v
      - name: Zig cache policy
        run: python3 tools/ci_zig_cache_test.py -v
      - name: Android SDK installer
        run: python3 tools/ci_android_sdk_test.py -v
      - name: Analyzer selection
        run: python3 tools/analyzer_selection_test.py -v
      - name: Coverage manifest
        run: python3 tools/coverage_manifest_test.py -v
      - name: Matrix shard
        run: python3 tools/matrix_shard_test.py -v
      - name: Differential CI policy
        run: python3 tools/differential_ci_policy_test.py -v
      - name: Native producer profile
        run: python3 tools/native_producer_profile_test.py -v
      - name: Configure evidence
        run: python3 tools/ci_configure_evidence_test.py -v
      - name: Native observation
        run: python3 tools/ci_native_observation_test.py -v
      - name: Action references
        run: |
          python3 tools/check_action_pins.py
          python3 tests/action_pins_test.py
      - name: Workflow lint
        env:
          GOTOOLCHAIN: local
          GOSUMDB: sum.golang.org
        run: go run github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 -color .github/workflows/*.yml
