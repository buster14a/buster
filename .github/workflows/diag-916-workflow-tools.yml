name: Diagnose PR 916 workflow tools on ARM

on:
  push:
    branches: [audit/916-workflow-tools]

concurrency:
  group: diagnose-pr-916-workflow-tools-arm
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR merge ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/pull/916/merge
          persist-credentials: false
      - name: Run canonical workflow-tool regression suite
        shell: bash
        run: python3 tests/ci_tools_test.py -v
