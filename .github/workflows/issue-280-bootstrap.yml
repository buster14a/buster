name: Issue 280 bootstrap

on:
  push:
    branches:
      - fix/280-conversion-source-widths

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.server_url == 'https://github.com' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/280-conversion-source-widths
      - name: Apply focused source-width repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          metadata_path = Path('src/buster/lib/compiler/assembly/x86_64_metadata.c')
          metadata = metadata_path.read_text()

          scalar_anchor = '''BUSTER_GLOBAL_LOCAL u16 buster_x86_metadata_single_scalar_width(u16 flags)
          {
              u16 scalar_flags = flags & (BUSTER_X86_METADATA_PHYSICAL_WIDTH_8 | BUSTER_X86_METADATA_PHYSICAL_WIDTH_16 |
                                           BUSTER_X86_METADATA_PHYSICAL_WIDTH_32 | BUSTER_X86_METADATA_PHYSICAL_WIDTH_64);
              if (scalar_flags && !(scalar_flags & (u16)(scalar_flags - 1)))
              {
                  if (scalar_flags == BUSTER_X86_METADATA_PHYSICAL_WIDTH_8) return 8;
                  if (scalar_flags == BUSTER_X86_METADATA_PHYSICAL_WIDTH_16) return 16;
                  if (scalar_flags == BUSTER_X86_METADATA_PHYSICAL_WIDTH_32) return 32;
                  if (scalar_flags == BUSTER_X86_METADATA_PHYSICAL_WIDTH_64) return 64;
              }

              return 0;
          }
          '''
          physical_helper = scalar_anchor + '''
          BUSTER_GLOBAL_LOCAL u16 buster_x86_metadata_single_physical_width(u16 flags)
          {
              u16 width = 0;
              u16 fixed_flags = flags & (BUSTER_X86_METADATA_PHYSICAL_WIDTH_8 | BUSTER_X86_METADATA_PHYSICAL_WIDTH_16 |
                                         BUSTER_X86_METADATA_PHYSICAL_WIDTH_32 | BUSTER_X86_METADATA_PHYSICAL_WIDTH_64 |
                                         BUSTER_X86_METADATA_PHYSICAL_WIDTH_80 | BUSTER_X86_METADATA_PHYSICAL_WIDTH_128 |
                                         BUSTER_X86_METADATA_PHYSICAL_WIDTH_256 | BUSTER_X86_METADATA_PHYSICAL_WIDTH_512 |
                                         BUSTER_X86_METADATA_PHYSICAL_WIDTH_1024);
              if (fixed_flags && !(fixed_flags & (u16)(fixed_flags - 1)))
              {
                  width = fixed_flags == BUSTER_X86_METADATA_PHYSICAL_WIDTH_8      ? 8
                        : fixed_flags == BUSTER_X86_METADATA_PHYSICAL_WIDTH_16     ? 16
                        : fixed_flags == BUSTER_X86_METADATA_PHYSICAL_WIDTH_32     ? 32
                        : fixed_flags == BUSTER_X86_METADATA_PHYSICAL_WIDTH_64     ? 64
                        : fixed_flags == BUSTER_X86_METADATA_PHYSICAL_WIDTH_80     ? 80
                        : fixed_flags == BUSTER_X86_METADATA_PHYSICAL_WIDTH_128    ? 128
                        : fixed_flags == BUSTER_X86_METADATA_PHYSICAL_WIDTH_256    ? 256
                        : fixed_flags == BUSTER_X86_METADATA_PHYSICAL_WIDTH_512    ? 512
                        : fixed_flags == BUSTER_X86_METADATA_PHYSICAL_WIDTH_1024   ? 1024
                                                                                  : 0;
              }
              return width;
          }
          '''
          if scalar_anchor not in metadata:
              raise SystemExit('single-scalar-width anchor not found')
          metadata = metadata.replace(scalar_anchor, physical_helper, 1)

          helper_pattern = re.compile(
              r'// Source tuple size and encoded element type are distinct for conversions\.\n'
              r'.*?\nBUSTER_GLOBAL_LOCAL bool buster_x86_metadata_prepare_source_tuple_query\(.*?\n}\n\n'
              r'(?=// AT&T memory operands intentionally omit)', re.S)
          helper_replacement = '''// Source tuple size and encoded memory width are candidate facts for
          // conversions. EVEX FULL/HALF forms expose a scalar element plus a tuple;
          // legacy/VEX/XOP conversion rows expose one fixed memory width directly.
          // Project only source-semantic queries, preserving explicit qualifiers as
          // constraints. Distinct successful widths are rejected by the caller as
          // ambiguous instead of being selected by encoding length or table order.
          BUSTER_GLOBAL_LOCAL bool buster_x86_metadata_prepare_source_tuple_query(
              BusterX86MetadataForm form, BusterX86MetadataPatternSemantics const* pattern,
              BusterX86MetadataPhysicalQuery query, BusterX86MetadataPhysicalOperand* candidate_operands,
              bool* source_width_valid, u16* source_tuple_width, u8* source_memory_operand)
          {
              bool projected = false;
              bool evex_tuple = form.encoder_family == BUSTER_X86_METADATA_ENCODER_EVEX && !form.apx_flags && !form.amx_flags &&
                                pattern->has_tuple_control &&
                                (pattern->tuple_control_kind == BUSTER_X86_METADATA_TUPLE_FULL ||
                                 pattern->tuple_control_kind == BUSTER_X86_METADATA_TUPLE_HALF);
              bool fixed_conversion = form.encoder_family != BUSTER_X86_METADATA_ENCODER_EVEX &&
                                      buster_x86_metadata_string_input_equal(form.category.offset, S8("CONVERT"));
              if ((evex_tuple || fixed_conversion) && query.operands && query.operand_count <= 16)
              {
                  u16 encoded_width = 0;
                  u16 tuple_width = evex_tuple ? buster_x86_metadata_emit_tuple_memory_width(*pattern) : 0;
                  u32 metadata_memory_count = 0;
                  u32 physical_memory_index = UINT32_MAX;
                  u32 visible_index = 0;
                  bool schema_valid = true;
                  for (u32 index = 0; index < form.operand_count && schema_valid; index += 1)
                  {
                      BusterX86MetadataOperand metadata = {0};
                      schema_valid = buster_x86_metadata_operand(form.id, index, &metadata);
                      if (!schema_valid || !metadata.visible) continue;
                      if (metadata.kind == BUSTER_X86_METADATA_OPERAND_MEMORY)
                      {
                          metadata_memory_count += 1;
                          physical_memory_index = visible_index;
                          encoded_width = evex_tuple
                                              ? buster_x86_metadata_single_scalar_width(metadata.physical_width_flags)
                                              : buster_x86_metadata_single_physical_width(metadata.physical_width_flags);
                      }
                      visible_index += 1;
                  }
                  if (!evex_tuple) tuple_width = encoded_width;
                  if (schema_valid && metadata_memory_count == 1 && encoded_width && tuple_width &&
                      physical_memory_index < query.operand_count &&
                      query.operands[physical_memory_index].kind == BUSTER_X86_METADATA_PHYSICAL_OPERAND_MEMORY)
                  {
                      bool broadcast = (query.attributes.decorator_flags & BUSTER_X86_METADATA_DECORATOR_BROADCAST) != 0;
                      u16 source_width = query.operands[physical_memory_index].memory.source_width;
                      u16 required_width = evex_tuple && broadcast ? encoded_width : tuple_width;
                      *source_width_valid = !source_width || source_width == required_width;
                      memcpy(candidate_operands, query.operands, query.operand_count * sizeof(*candidate_operands));
                      candidate_operands[physical_memory_index].width = encoded_width;
                      *source_tuple_width = tuple_width;
                      *source_memory_operand = (u8)physical_memory_index;
                      projected = true;
                  }
              }
              return projected;
          }

          '''
          metadata, count = helper_pattern.subn(helper_replacement, metadata, count=1)
          if count != 1:
              raise SystemExit(f'source tuple helper replacement count={count}')

          old_gate = '''            bool source_tuple_query_possible = query.source_semantics && query.operand_count == 2 &&
              query.address_size == 64 && query.operands[0].kind == BUSTER_X86_METADATA_PHYSICAL_OPERAND_REGISTER &&
              query.operands[1].kind == BUSTER_X86_METADATA_PHYSICAL_OPERAND_MEMORY &&
              (query.operands[0].reg.physical_class == BUSTER_X86_METADATA_PHYSICAL_CLASS_XMM ||
               query.operands[0].reg.physical_class == BUSTER_X86_METADATA_PHYSICAL_CLASS_YMM ||
               query.operands[0].reg.physical_class == BUSTER_X86_METADATA_PHYSICAL_CLASS_ZMM) &&
              (query.attributes.has_mask_register || query.attributes.zeroing ||
               (query.attributes.decorator_flags & BUSTER_X86_METADATA_DECORATOR_BROADCAST) ||
               query.operands[0].reg.width == 512 || query.operands[0].reg.index >= 16);
          '''
          new_gate = '''            bool source_tuple_query_possible = query.source_semantics && query.operands &&
                                                      query.operand_count && query.operand_count <= 16 &&
                                                      query.address_size == 64;
          '''
          if old_gate not in metadata:
              raise SystemExit('source tuple gate anchor not found')
          metadata = metadata.replace(old_gate, new_gate, 1)

          old_candidate = '''                bool source_width_valid = true;
              u16 candidate_source_tuple_width = 0;
          '''
          new_candidate = '''                bool source_width_valid = true;
              u16 candidate_source_tuple_width = 0;
              u8 candidate_source_memory_operand = UINT8_MAX;
          '''
          if old_candidate not in metadata:
              raise SystemExit('candidate tuple state anchor not found')
          metadata = metadata.replace(old_candidate, new_candidate, 1)

          old_call = '''                    inferred_memory_width = source_tuple_query_possible &&
                        buster_x86_metadata_prepare_source_tuple_query(form, filter_view, query, candidate_operands,
                                                                       &source_width_valid, &candidate_source_tuple_width);
          '''
          new_call = '''                    inferred_memory_width = source_tuple_query_possible &&
                        buster_x86_metadata_prepare_source_tuple_query(form, filter_view, query, candidate_operands,
                                                                       &source_width_valid, &candidate_source_tuple_width,
                                                                       &candidate_source_memory_operand);
          '''
          if old_call not in metadata:
              raise SystemExit('source tuple call anchor not found')
          metadata = metadata.replace(old_call, new_call, 1)

          old_invalid = '''                    diagnostic_operand = 1;
                  diagnostic_value = query.operands[1].memory.source_width;
          '''
          new_invalid = '''                    diagnostic_operand = candidate_source_memory_operand < query.operand_count
                                               ? candidate_source_memory_operand
                                               : 0;
                  diagnostic_value = candidate_source_memory_operand < query.operand_count
                                         ? query.operands[candidate_source_memory_operand].memory.source_width
                                         : 0;
          '''
          if old_invalid not in metadata:
              raise SystemExit('source width diagnostic anchor not found')
          metadata = metadata.replace(old_invalid, new_invalid, 1)

          old_ambiguity = '''                if (candidate_source_tuple_width && !query.operands[1].memory.source_width &&
                  !(query.attributes.decorator_flags & BUSTER_X86_METADATA_DECORATOR_BROADCAST))
              {
                  // An unsized narrowing load can bind the same XMM destination
                  // with different source tuples. Encoding length and form order
                  // cannot choose its semantics; require a source qualifier.
                  ambiguous_source_tuple |= inferred_source_tuple_width &&
                                            inferred_source_tuple_width != candidate_source_tuple_width;
                  inferred_source_tuple_width = candidate_source_tuple_width;
              }
          '''
          new_ambiguity = '''                if (candidate_source_tuple_width && candidate_source_memory_operand < query.operand_count &&
                  !query.operands[candidate_source_memory_operand].memory.source_width &&
                  !(query.attributes.decorator_flags & BUSTER_X86_METADATA_DECORATOR_BROADCAST))
              {
                  // An unsized conversion may bind the same visible registers
                  // with different source tuples. Encoding length and form order
                  // cannot choose its semantics; require a source qualifier.
                  ambiguous_source_tuple |= inferred_source_tuple_width &&
                                            inferred_source_tuple_width != candidate_source_tuple_width;
                  inferred_source_tuple_width = candidate_source_tuple_width;
              }
          '''
          if old_ambiguity not in metadata:
              raise SystemExit('source tuple ambiguity anchor not found')
          metadata = metadata.replace(old_ambiguity, new_ambiguity, 1)
          metadata_path.write_text(metadata)

          assembly_path = Path('src/buster/lib/compiler/assembly/assembly.c')
          assembly = assembly_path.read_text()
          vector_anchor = '''    u16 vector_memory_width = 0;
          '''
          conversion_probe = '''    bool conversion_memory_width = false;
          BusterX86MetadataCandidateRange conversion_candidates = buster_x86_metadata_lookup_mnemonic(mnemonic);
          for (u32 candidate_index = 0; candidate_index < conversion_candidates.count; candidate_index += 1)
          {
              u32 form_id = 0;
              BusterX86MetadataForm form = {0};
              if (buster_x86_metadata_candidate_at(conversion_candidates, candidate_index, &form_id) &&
                  buster_x86_metadata_form(form_id, &form) &&
                  assembly_word_equal(buster_x86_metadata_string_span(form.category), S8("CONVERT")))
              {
                  conversion_memory_width = true;
                  break;
              }
          }
          // This form has an existing nonstandard half-width source contract.
          // Keep its dedicated validation until its metadata publishes that fact.
          if (assembly_word_equal(mnemonic, S8("vcvtbf42hf8"))) conversion_memory_width = false;
          u16 vector_memory_width = 0;
          '''
          if vector_anchor not in assembly:
              raise SystemExit('vector width anchor not found')
          assembly = assembly.replace(vector_anchor, conversion_probe, 1)

          width_region_start = assembly.index('    if (vector_memory_width || scalar_memory_width)')
          width_region_end = assembly.index('    if (att_scalar_extend_source_width)', width_region_start)
          width_region = assembly[width_region_start:width_region_end]
          width_region = width_region.replace('!scalar_memory_width &&', '!scalar_memory_width && !conversion_memory_width &&')
          width_region = width_region.replace('        if (!scalar_memory_width)\n',
                                              '        if (!scalar_memory_width && !conversion_memory_width)\n', 1)
          explicit_anchor = '''            if (explicit_width && physical[index].memory.source_width > 64)
              {
          '''
          explicit_replacement = '''            if (explicit_width && physical[index].memory.source_width > 64)
              {
                  if (conversion_memory_width)
                  {
                      continue;
                  }
          '''
          if explicit_anchor not in width_region:
              raise SystemExit('explicit aggregate width anchor not found')
          width_region = width_region.replace(explicit_anchor, explicit_replacement, 1)
          assembly = assembly[:width_region_start] + width_region + assembly[width_region_end:]
          assembly_path.write_text(assembly)

          test_path = Path('src/buster/tests/compiler/assembly/x86_64_metadata_test.c')
          tests = test_path.read_text()
          test_anchor = '''
              return valid;
          }

          BUSTER_GLOBAL_LOCAL bool x86_64_metadata_test_mask_is_decorator'''
          test_block = r'''
              typedef struct X86ConversionSourceCase X86ConversionSourceCase;
              struct X86ConversionSourceCase
              {
                  String8 source;
                  AssemblySyntax syntax;
                  u8 bytes[6];
                  u8 byte_count;
              };
              X86ConversionSourceCase const conversion_sources[] = {
                  {S8("cvtps2pd 64(%rax), %xmm0\n"), ASSEMBLY_SYNTAX_ATT, {0x0f, 0x5a, 0x40, 0x40}, 4},
                  {S8("cvtps2pd xmm0, qword ptr [rax+64]\n"), ASSEMBLY_SYNTAX_INTEL, {0x0f, 0x5a, 0x40, 0x40}, 4},
                  {S8("vcvtps2pd 64(%rax), %xmm0\n"), ASSEMBLY_SYNTAX_ATT, {0xc5, 0xf8, 0x5a, 0x40, 0x40}, 5},
                  {S8("vcvtps2pd xmm0, qword ptr [rax+64]\n"), ASSEMBLY_SYNTAX_INTEL, {0xc5, 0xf8, 0x5a, 0x40, 0x40}, 5},
                  {S8("vcvtps2pd 64(%rax), %ymm0\n"), ASSEMBLY_SYNTAX_ATT, {0xc5, 0xfc, 0x5a, 0x40, 0x40}, 5},
                  {S8("vcvtps2pd ymm0, xmmword ptr [rax+64]\n"), ASSEMBLY_SYNTAX_INTEL, {0xc5, 0xfc, 0x5a, 0x40, 0x40}, 5},
                  {S8("cvtpd2ps 64(%rax), %xmm0\n"), ASSEMBLY_SYNTAX_ATT, {0x66, 0x0f, 0x5a, 0x40, 0x40}, 5},
                  {S8("cvtpd2ps xmm0, xmmword ptr [rax+64]\n"), ASSEMBLY_SYNTAX_INTEL, {0x66, 0x0f, 0x5a, 0x40, 0x40}, 5},
                  {S8("vcvtpd2ps xmm0, xmmword ptr [rax+64]\n"), ASSEMBLY_SYNTAX_INTEL, {0xc5, 0xf9, 0x5a, 0x40, 0x40}, 5},
                  {S8("vcvtpd2ps xmm0, ymmword ptr [rax+64]\n"), ASSEMBLY_SYNTAX_INTEL, {0xc5, 0xfd, 0x5a, 0x40, 0x40}, 5},
                  {S8("cvtss2sd 64(%rax), %xmm0\n"), ASSEMBLY_SYNTAX_ATT, {0xf3, 0x0f, 0x5a, 0x40, 0x40}, 5},
                  {S8("cvtss2sd xmm0, dword ptr [rax+64]\n"), ASSEMBLY_SYNTAX_INTEL, {0xf3, 0x0f, 0x5a, 0x40, 0x40}, 5},
                  {S8("cvtsd2ss 64(%rax), %xmm0\n"), ASSEMBLY_SYNTAX_ATT, {0xf2, 0x0f, 0x5a, 0x40, 0x40}, 5},
                  {S8("cvtsd2ss xmm0, qword ptr [rax+64]\n"), ASSEMBLY_SYNTAX_INTEL, {0xf2, 0x0f, 0x5a, 0x40, 0x40}, 5},
                  {S8("vcvtss2sd 64(%rax), %xmm1, %xmm0\n"), ASSEMBLY_SYNTAX_ATT, {0xc5, 0xf2, 0x5a, 0x40, 0x40}, 5},
                  {S8("vcvtss2sd xmm0, xmm1, dword ptr [rax+64]\n"), ASSEMBLY_SYNTAX_INTEL, {0xc5, 0xf2, 0x5a, 0x40, 0x40}, 5},
                  {S8("vcvtsd2ss 64(%rax), %xmm1, %xmm0\n"), ASSEMBLY_SYNTAX_ATT, {0xc5, 0xf3, 0x5a, 0x40, 0x40}, 5},
                  {S8("vcvtsd2ss xmm0, xmm1, qword ptr [rax+64]\n"), ASSEMBLY_SYNTAX_INTEL, {0xc5, 0xf3, 0x5a, 0x40, 0x40}, 5},
              };
              for (u32 index = 0; index < BUSTER_ARRAY_LENGTH(conversion_sources); index += 1)
              {
                  X86ConversionSourceCase test_case = conversion_sources[index];
                  for (u32 repeat = 0; repeat < 2; repeat += 1)
                  {
                      AssemblyEncodeResult encoded = assembly_encode(arguments->arena, test_case.source,
                          (AssemblyEncodeOptions){.target = target, .syntax = test_case.syntax});
                      bool case_valid = encoded.diagnostic_count == 0 && encoded.relocation_count == 0 &&
                          x86_64_metadata_test_bytes_equal(encoded.bytes.pointer, (u32)encoded.bytes.length,
                                                           test_case.bytes, test_case.byte_count);
                      if (!case_valid)
                      {
                          arguments->show(arguments, S8("CONVERSION_SOURCE_WIDTH source: {S8}"), test_case.source);
                      }
                      valid &= case_valid;
                  }
              }
              String8 const invalid_conversion_widths[] = {
                  S8("vcvtps2pd xmm0, xmmword ptr [rax+64]\n"),
                  S8("vcvtps2pd ymm0, qword ptr [rax+64]\n"),
                  S8("vcvtpd2ps xmm0, qword ptr [rax+64]\n"),
                  S8("cvtss2sd xmm0, qword ptr [rax+64]\n"),
                  S8("cvtsd2ss xmm0, dword ptr [rax+64]\n"),
                  S8("vcvtpd2ps xmm0, [rax+64]\n"),
              };
              for (u32 index = 0; index < BUSTER_ARRAY_LENGTH(invalid_conversion_widths); index += 1)
              {
                  AssemblyEncodeResult rejected = assembly_encode(arguments->arena, invalid_conversion_widths[index],
                      (AssemblyEncodeOptions){.target = target, .syntax = ASSEMBLY_SYNTAX_INTEL});
                  bool case_valid = rejected.diagnostic_count != 0 && rejected.bytes.length == 0 && rejected.relocation_count == 0;
                  if (!case_valid)
                  {
                      arguments->show(arguments, S8("CONVERSION_INVALID_WIDTH accepted: {S8}"), invalid_conversion_widths[index]);
                  }
                  valid &= case_valid;
              }
              AssemblyEncodeResult ambiguous_vex_att = assembly_encode(arguments->arena,
                  S8("vcvtpd2ps 64(%rax), %xmm0\n"),
                  (AssemblyEncodeOptions){.target = target, .syntax = ASSEMBLY_SYNTAX_ATT});
              valid &= ambiguous_vex_att.diagnostic_count != 0 && ambiguous_vex_att.bytes.length == 0 &&
                       ambiguous_vex_att.relocation_count == 0;
              Target no_avx_target = {.cpu_arch = CPU_ARCH_X86_64, .os = OPERATING_SYSTEM_LINUX, .cpu_features_explicit = true};
              no_avx_target.cpu_features = target_cpu_features_from_array(
                  (TargetCpuFeature const[]){TARGET_CPU_FEATURE_X86_SSE2}, 1);
              AssemblyEncodeResult feature_disabled = assembly_encode(arguments->arena,
                  S8("vcvtps2pd 64(%rax), %ymm0\n"),
                  (AssemblyEncodeOptions){.target = no_avx_target, .syntax = ASSEMBLY_SYNTAX_ATT});
              valid &= feature_disabled.diagnostic_count != 0 && feature_disabled.bytes.length == 0 &&
                       feature_disabled.relocation_count == 0;

              return valid;
          }

          BUSTER_GLOBAL_LOCAL bool x86_64_metadata_test_mask_is_decorator'''
          if test_anchor not in tests:
              raise SystemExit('conversion test insertion anchor not found')
          tests = tests.replace(test_anchor, '\n' + test_block, 1)
          test_path.write_text(tests)

          docs_path = Path('docs/agents/driver.md')
          docs = docs_path.read_text()
          docs_old = '''For two-operand EVEX vector loads/conversions, an ordinary memory qualifier
          names the source tuple, not the destination register width. A broadcast
          qualifier names its scalar element. The metadata selector projects the
          candidate's element width and validates the source qualifier independently;
          for example, masked `vcvtps2pd zmm0, m256` reads eight 32-bit elements while
          masked `vcvtpd2ps ymm0, m512` reads eight 64-bit elements. AT&T's unqualified
          memory spelling uses the same candidate contract. Unsized ordinary loads
          whose destination permits multiple source tuple widths are rejected as
          ambiguous; encoding length and candidate order cannot choose input lanes.
          This bounded projection
          requires a mask/broadcast, ZMM destination, or high vector register and covers
          FULL/HALF EVEX tuples; it does not replace all legacy/VEX source inference.
          '''
          docs_new = '''For source-assembled conversion forms, an ordinary memory qualifier names
          the source operand width, not the destination mnemonic suffix or register
          width. Legacy, VEX and XOP candidates publish that fixed width directly;
          EVEX FULL/HALF candidates publish a scalar element plus a source tuple. A
          broadcast qualifier names the scalar element. The selector projects each
          candidate independently and keeps explicit qualifiers as constraints. For
          example, masked `vcvtps2pd zmm0, m256` reads eight 32-bit elements, while
          VEX `vcvtps2pd ymm0, m128` reads four, and masked `vcvtpd2ps ymm0, m512`
          reads eight 64-bit elements. AT&T's unqualified memory spelling uses the
          same candidate contract. When the same visible operands admit different
          unsized source widths, selection rejects the source as ambiguous; encoding
          length and candidate order never choose the number of input lanes.
          '''
          if docs_old not in docs:
              raise SystemExit('driver documentation anchor not found')
          docs_path.write_text(docs.replace(docs_old, docs_new, 1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue-280-bootstrap.yml
          git add docs/agents/driver.md \
                  src/buster/lib/compiler/assembly/assembly.c \
                  src/buster/lib/compiler/assembly/x86_64_metadata.c \
                  src/buster/tests/compiler/assembly/x86_64_metadata_test.c
          git commit -m 'assembly: infer conversion source widths from metadata'
          git push origin HEAD:fix/280-conversion-source-widths
