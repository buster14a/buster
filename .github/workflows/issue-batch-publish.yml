name: Issue batch publish and fixed point

on:
  push:
    branches: [work/2026-09-06-issue-batch-validation]
    paths: [.github/workflows/issue-batch-publish.yml]

permissions:
  contents: write

jobs:
  publish:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish hash-checked iOS source and regression tests
        env:
          PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          branch = 'fix/2026-09-06-ios-monitor-cleanup'
          digest = 'ed4f877b3fcfeed576954b8ba62f424f25b570afe48968f870b4edc9d6e12e2b'
          workflow = '.github/workflows/ios-monitor-tests.yml'
          allowed = ['ios/launch_simulator.sh', 'tests/mobile_ci_scripts_test.sh', 'tests/ios_launch_monitor_test.sh', workflow]
          encoded = ''.join(pathlib.Path('work/issue-batch/ios.' + str(i)).read_text().strip() for i in range(3))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == digest, 'patch transport checksum mismatch'
          patch_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ios.patch'
          patch_path.write_bytes(patch)
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], text=True, **kwargs).strip()
          probe = subprocess.run(['git', 'ls-remote', '--exit-code', '--heads', 'origin', 'refs/heads/' + branch], capture_output=True)
          assert probe.returncode == 2, 'ref exists or remote could not be checked; refusing to overwrite'
          base = '3b7eefbc2048e8751e5d097dc3d52271b38385c0'
          git('fetch', '--depth=1', 'origin', base)
          git('checkout', '-b', branch, base)
          git('apply', '--index', str(patch_path))
          assert set(git('diff', '--cached', '--name-only').splitlines()) == set(allowed), 'unexpected patch paths'
          git('diff', '--cached', '--check')
          complete_tree = git('write-tree')
          # Publish source with contents permission only. The connected GitHub
          # action adds the already-reviewed CI file in a second commit; the
          # final tree must equal this exact, fully tested tree.
          workflow_blob = git('hash-object', workflow)
          git('reset', '--', workflow)
          pathlib.Path(workflow).unlink()
          assert set(git('diff', '--cached', '--name-only').splitlines()) == set(allowed) - {workflow}
          git('config', 'user.name', 'Buster issue fixes (assisted)')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'ios: own and reap launch producers and console readers')
          env = os.environ.copy()
          env['GIT_CONFIG_COUNT'] = '1'
          env['GIT_CONFIG_KEY_0'] = 'http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0'] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + env.pop('PUSH_TOKEN')).encode()).decode()
          git('push', 'origin', 'HEAD:refs/heads/' + branch, env=env)
          head = git('rev-parse', 'HEAD')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Published `' + branch + '` at `' + head + '`.\n')
              summary.write('Full four-file tree `' + complete_tree + '`; pending CI file blob `' + workflow_blob + '`.\n')
          print('Published', branch, head, 'expected final tree', complete_tree, 'workflow blob', workflow_blob)
          PY
      - name: Mobile script and attached monitor regression suite
        shell: bash
        run: /bin/bash tests/mobile_ci_scripts_test.sh
