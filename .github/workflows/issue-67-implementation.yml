name: Issue 67 implementation measurement

on:
  push:
    branches:
      - codex/issue-67-x86-metadata-memory

permissions:
  contents: write

jobs:
  measure-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v clang
          command -v cmake
          command -v ninja
          command -v /usr/bin/time
          clang --version
          cmake --version
          ninja --version

      - name: Measure baseline and candidate
        shell: bash
        run: bash .github/issue-67-measure.sh

      - name: Commit measured repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
              CMakeLists.txt \
              src/buster/tests/test.c \
              docs/performance-audits/2026-09-17-x86-metadata-test-memory.md \
              docs/performance-audits/evidence/2026-09-17-issue-67
          git commit -m 'build: bound x86 metadata test compiler memory'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload raw measurement logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-67-measurement-${{ github.run_id }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/issue-67-raw
            docs/performance-audits/evidence/2026-09-17-issue-67
            docs/performance-audits/2026-09-17-x86-metadata-test-memory.md
          if-no-files-found: warn
