name: Issue 67 implementation measurement

on:
  push:
    branches:
      - codex/issue-67-x86-metadata-memory

permissions:
  contents: write

jobs:
  measure-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v clang
          command -v cmake
          command -v ninja
          command -v /usr/bin/time
          clang --version
          cmake --version
          ninja --version

      - name: Amend candidate linkage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/issue-67-measure.sh")
          source = path.read_text()
          old = """test_path.write_text(test_source)
          PY
          """
          new = """test_path.write_text(test_source)

          metadata_header_path = Path(
              "src/buster/tests/compiler/assembly/x86_64_metadata_test.h"
          )
          metadata_header = metadata_header_path.read_text()
          metadata_header = replace_once(
              metadata_header,
              "BUSTER_F_DECL UnitTestResult x86_64_metadata_tests(UnitTestArguments* arguments);\\n",
              "// This implementation remains a standalone object in every build mode.\\n"
              "extern UnitTestResult x86_64_metadata_tests(UnitTestArguments* arguments);\\n",
              "standalone metadata test declaration",
          )
          metadata_header_path.write_text(metadata_header)
          PY
          """
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"harness insertion point: expected one match, found {count}")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Measure baseline and candidate
        shell: bash
        run: bash .github/issue-67-measure.sh

      - name: Commit measured repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
              CMakeLists.txt \
              src/buster/tests/test.c \
              src/buster/tests/compiler/assembly/x86_64_metadata_test.h \
              docs/performance-audits/2026-09-17-x86-metadata-test-memory.md \
              docs/performance-audits/evidence/2026-09-17-issue-67
          git commit -m 'build: bound x86 metadata test compiler memory'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload raw measurement logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-67-measurement-${{ github.run_id }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/issue-67-raw
            docs/performance-audits/evidence/2026-09-17-issue-67
            docs/performance-audits/2026-09-17-x86-metadata-test-memory.md
          if-no-files-found: warn
