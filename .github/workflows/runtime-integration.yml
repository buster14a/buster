name: Runtime integration
on:
  push:
    branches: [work/2026-09-06-integration-gates]
    paths: [.github/workflows/runtime-integration.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 997cabde8eb39e5365643e3ec49fa2aa15ec7ea6
      - name: Apply authenticated, locally tested regression patch
        id: publish
        shell: bash
        env:
          PATCH_DATA: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,base64,gzip,hashlib,pathlib
          data = os.environ['PATCH_DATA'].replace('FN1k0Y0G73','FN1k0YQG73')
          patch=gzip.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest() == 'd1fded2ebf7d76ed8befbf60f7fa15a4b41c427f4aa65d4c9286235cd3838a42'
          pathlib.Path('/tmp/integration.patch').write_bytes(patch)
          PY
          git apply --check /tmp/integration.patch
          git apply --index /tmp/integration.patch
          git diff --cached --check
          test "$(git write-tree)" = e07dc9fb1178444f8f6244480c3d6f3d96a5faf4
          git config user.name 'David'
          git config user.email 'davidgmbb@gmail.com'
          git commit -m 'tests: integrate runtime boundary regressions on all desktop hosts'
          git push --force-with-lease=refs/heads/work/2026-09-06-runtime-integration: origin HEAD:refs/heads/work/2026-09-06-runtime-integration
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Install platform prerequisites
        run: bash .github/scripts/install-vulkan-sdk.sh
      - name: Full Release suite and self-host fixed point
        shell: bash
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/buster-build"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver"
          "$driver" generate --cc clang --config Release --linker DEFAULT
          "$driver" build --config Release -t test_all 2>&1 | tee "$RUNNER_TEMP/runtime-suite.log"
          "$driver" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/runtime-self-host.log"
      - name: Optimized sanitizer regression
        shell: bash
        run: |
          set -euo pipefail
          CC=clang AUDIT_OPT=-O2 AUDIT_SANITIZE=1 ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 python3 tests/runtime_boundary_regression.py 2>&1 | tee "$RUNNER_TEMP/runtime-sanitizers.log"
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-integration-results
          path: ${{ runner.temp }}/runtime-*.log
          retention-days: 7
          if-no-files-found: error
