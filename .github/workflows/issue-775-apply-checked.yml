name: Apply checked issue 775 patch
on:
  push:
    branches: [codex/775-baseline-vectors]
    paths: [.github/workflows/issue-775-apply-checked.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'buster14a/buster'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/775-baseline-vectors
      - name: Verify and apply source diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          text = pathlib.Path('.github/workflows/issue-775-apply.yml').read_text()
          encoded = next(line.split('PATCH: ',1)[1] for line in text.splitlines() if 'PATCH: ' in line)
          encoded = encoded.replace('SOYrDTvcwng', 'SOYrDTfpZ9QPEZTvcwng').replace('DTD1GYIulpXE5GGII', 'DTD1GYIulpXE5GII').replace('y02wdGjuUKGihg', 'y02wdGjuUKihg')
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'fcf795b326b51a0aa38f328b0b1ef902d15dfcd18f94d610b0d24b4997e936c3'
          pathlib.Path('/tmp/issue775.patch').write_bytes(patch)
          PY
          git apply --check /tmp/issue775.patch
          git apply /tmp/issue775.patch
          git diff --check
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add src/buster/compiler
          env -u BUSTER_DCO_SIGN_OFF git commit -m 'feat(tier0): lower baseline SSE2 and AVX vector values and operations'
          git push origin HEAD:refs/heads/codex/775-baseline-vectors
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: issue-775-transfer
          path: .github/workflows/issue-775-apply.yml
          include-hidden-files: true
          retention-days: 1
