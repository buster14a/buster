name: Issue 292 verified source correction
on:
  push:
    branches: [astra/issue292-transport-20260912]
    paths: [.github/workflows/issue292-repair-seam.yml]
permissions:
  contents: read
jobs:
  publish:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 1abb484976852aeaffd20007a8c4f0d84be8d11d
          persist-credentials: false
      - name: Keep the shared checker independent of lowering helpers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          path = pathlib.Path('src/buster/lib/compiler/frontend/c/c_parse.c')
          before = path.read_bytes()
          if hashlib.sha256(before).hexdigest() != 'f5ebe06bdc8c14bf97be58dee1515391aebdf8778477a9e1a6025ba5b4894463':
              raise RuntimeError('Preimage changed')
          replacements = [
              ('        CType* type = entity.value < analysis->entity_count ? c_type_from_id(analysis, analysis->entities[entity.value].type) : 0;',
               '        CTypeId type_id = entity.value < analysis->entity_count ? analysis->entities[entity.value].type : C_TYPE_ID_INVALID;\n        CType* type = type_id.value < analysis->type_count ? &analysis->types[type_id.value] : 0;'),
              ('            type = c_type_from_id(analysis, type->element_type);',
               '            type = type->element_type.value < analysis->type_count ? &analysis->types[type->element_type.value] : 0;'),
              ('//   c_parse_direct_expression_base ..             expression typing without',
               '//   c_semantic_check_named_call_arities          bound call constraints without IR\n//   c_parse_direct_expression_base ..             expression typing without'),
          ]
          source = before.decode()
          for old, new in replacements:
              if source.count(old) != 1:
                  raise RuntimeError('Ambiguous correction')
              source = source.replace(old, new, 1)
          if hashlib.sha256(source.encode()).hexdigest() != '8355c62bc668b90e08a495115218308349562f991cb566bf12e63cc864187df5':
              raise RuntimeError('Postimage changed')
          path.write_text(source)
          subprocess.run(['git', 'diff', '--check'], check=True)
          def post(endpoint, body):
              request = urllib.request.Request('https://api.github.com/repos/buster14a/buster/' + endpoint,
                  data=json.dumps(body).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)
          blob = post('git/blobs', {'content': source, 'encoding': 'utf-8'})
          if blob['sha'] != 'bc3cf8fed7a3c517132aa2e9e1888d326bbcb134':
              raise RuntimeError('Remote blob mismatch')
          tree = post('git/trees', {'base_tree': '54233ceb68a35e801c03dddc2281e6f19fd54960',
              'tree': [{'path': str(path), 'mode': '100644', 'type': 'blob', 'sha': blob['sha']}]})
          commit = post('git/commits', {'message': 'c: keep named call checks independent of lowering accessors',
              'tree': tree['sha'], 'parents': ['1abb484976852aeaffd20007a8c4f0d84be8d11d']})
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue292-seam-correction'
          root.mkdir()
          result = {'commit': commit['sha'], 'tree': tree['sha'], 'parent': '1abb484976852aeaffd20007a8c4f0d84be8d11d'}
          (root / 'publication.json').write_text(json.dumps(result, indent=2) + '\n')
          (root / 'correction.patch').write_bytes(subprocess.check_output(['git', 'diff']))
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: issue292-seam-correction-${{ github.run_id }}
          path: ${{ runner.temp }}/issue292-seam-correction/
          if-no-files-found: error
          retention-days: 7
