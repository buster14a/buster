name: Publish verified correctness audit fix
on:
  push:
    branches:
      - audit/correctness-20260907-source
    paths:
      - .github/workflows/correctness-audit-publish.yml
permissions:
  contents: write
  actions: write
jobs:
  publish:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Retire the superseded transport job only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api --method POST repos/buster14a/buster/actions/runs/34164438846/cancel || true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9834a4253c61934a8a253641a84741a25d3717e3
          fetch-depth: 0
      - name: Apply the pinned tree-verified reconstruction and export the rebased source
        shell: bash
        run: |
          if git rev-parse --verify refs/remotes/origin/audit/transport-arena-rewind-20260907 >/dev/null 2>&1; then
            git checkout --detach refs/remotes/origin/audit/transport-arena-rewind-20260907
          else
            git show 18d8be1f8b9855d2df4b3bfd8ca41441d30b4f4f:.github/workflows/correctness-audit-source.yml > "$RUNNER_TEMP/reconstruction.yml"
            python3 - "$RUNNER_TEMP/reconstruction.yml" "$RUNNER_TEMP/reconstruct.sh" <<'PY'
          import pathlib,sys
          text=pathlib.Path(sys.argv[1]).read_text()
          text=text.split('      - name: Reconstruct exactly the locally tested arena patch\n',1)[1]
          text=text.split('        run: |\n',1)[1].split('      - name: Rebase onto pinned current main',1)[0]
          lines=text.splitlines()
          assert all(not line or line.startswith('          ') for line in lines)
          pathlib.Path(sys.argv[2]).write_text('\n'.join(line[10:] if line else '' for line in lines)+'\n')
          PY
            bash -e "$RUNNER_TEMP/reconstruct.sh"
            git rebase 66bf321936ccb2b4f0df42cb6f65ed197f8652b5
            git diff --check 66bf321936ccb2b4f0df42cb6f65ed197f8652b5
            git push origin HEAD:refs/heads/audit/transport-arena-rewind-20260907
          fi
          git rev-parse HEAD HEAD^{tree}
          git bundle create "$RUNNER_TEMP/arena-rewind-main-66bf321.bundle" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: arena-rewind-main-66bf321
          path: ${{ runner.temp }}/arena-rewind-main-66bf321.bundle
          if-no-files-found: error
          retention-days: 2
