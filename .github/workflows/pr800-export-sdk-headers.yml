name: PR 800 pinned SDK header export

on:
  push:
    branches:
      - fix/72-aarch64-binary128
    paths:
      - .github/workflows/pr800-export-sdk-headers.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 984d8ed63afab620f8cb176715e3dac06c655143
          persist-credentials: false
      - name: Materialize reviewed SDK headers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native_retirement_sdks.py --source-root "$(pwd)"
          test -d sdk-headers/windows
          test -d sdk-headers/android
          test -d sdk-headers/darwin
          tar -czf "$RUNNER_TEMP/pr800-sdk-headers.tar.gz" sdk-headers
          sha256sum "$RUNNER_TEMP/pr800-sdk-headers.tar.gz" > "$RUNNER_TEMP/pr800-sdk-headers.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr800-sdk-headers-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr800-sdk-headers.tar.gz
            ${{ runner.temp }}/pr800-sdk-headers.sha256
          retention-days: 1
