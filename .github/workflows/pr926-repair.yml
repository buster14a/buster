name: PR 926 repair validation
on:
  push:
    branches: [codex/926-ci-repair]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4e62d4104dab6c4c85025bd2eee4da520099790f
      - name: Apply checksum-bound source repair
        run: |
          mkdir -p "$RUNNER_TEMP/pr926-validation"
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, zlib
          payload = ''
          payload = payload.replace('PsXtHtOAxtV26', 'PsXtOAxtV26')
          patch = zlib.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '3296611ce9c222384e8c03e5ec7180b69142358d97ec254cafdc1ac52250b418'
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr926-validation' / 'repair.patch'
          output.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(output)], check=True)
          subprocess.run(['git', 'apply', str(output)], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert changed == ['docs/agents/frontend/foundations.md', 'src/buster/tests/compiler/frontend/c/c_test.c']
          PY
          git diff --check
          clang -fsyntax-only -std=c17 -Isrc -DBUSTER_INCLUDE_TESTS=1 -fwrapv -fno-strict-aliasing -funsigned-char -Wall -Wextra -Werror src/buster/tests/compiler/frontend/c/c_test.c
      - name: Validate current Clang and GCC profiles and negative controls
        run: |
          python3 - <<'PY'
          import ast, pathlib, re, subprocess, os
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr926-validation'
          s = pathlib.Path('src/buster/tests/compiler/frontend/c/c_test.c').read_text()
          fixture = s.split('String8 const c_test_enumerator_type_source = S8_INITIALIZER(', 1)[1].split('BUSTER_GLOBAL_LOCAL UnitTestResult c_test_enumerator_types', 1)[0]
          def decode(text):
              return ''.join(ast.literal_eval(x) for x in re.findall(r'"(?:\\.|[^"\\])*"', text))
          body = decode(fixture)
          prefix_text = s.split('String8 reference_prefixes[] = {', 1)[1].split('    };', 1)[0]
          prefixes = [decode(x) for x in re.findall(r'S8\((.*?)\),', prefix_text, re.S)]
          assert len(prefixes) == 2
          reports = []
          for index, (compiler, dialect) in enumerate([('clang', 'gnu17'), ('gcc', 'gnu2x')]):
              reports.append(subprocess.check_output([compiler, '--version'], text=True))
              for opt in ['0', '2']:
                  path = out / f'{compiler}-O{opt}.c'
                  exe = path.with_suffix('')
                  path.write_text(prefixes[index] + body)
                  cmd = [compiler, f'-std={dialect}', f'-O{opt}', str(path), '-o', str(exe)]
                  result = subprocess.run(cmd, capture_output=True, text=True, timeout=30)
                  path.with_suffix('.log').write_text(result.stdout + result.stderr)
                  assert result.returncode == 0, result.stderr
                  run = subprocess.run([str(exe)], capture_output=True, text=True, timeout=30)
                  assert run.returncode == 0, run.stderr
                  exe.unlink()
                  reports.append(f'PASS {compiler} {dialect} -O{opt} compile+execute')
                  bad = out / f'{compiler}-O{opt}-negative.c'
                  bad.write_text(prefixes[index] + '#if ENUM_C23\n#undef ENUM_C23\n#define ENUM_C23 0\n#else\n#undef ENUM_C23\n#define ENUM_C23 1\n#endif\n' + body)
                  negative = subprocess.run([compiler, f'-std={dialect}', f'-O{opt}', str(bad), '-o', str(exe) + '-negative'], capture_output=True, text=True, timeout=30)
                  bad.with_suffix('.log').write_text(negative.stdout + negative.stderr)
                  assert negative.returncode != 0 and 'static assertion' in negative.stderr
                  reports.append(f'PASS {compiler} {dialect} -O{opt} negative-control')
          report = '\n'.join(reports)
          (out / 'validation.txt').write_text(report)
          print(report)
          PY
      - name: Publish clean candidate commit without transport workflow
        run: |
          test "$(git rev-parse HEAD)" = 4e62d4104dab6c4c85025bd2eee4da520099790f
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add docs/agents/frontend/foundations.md src/buster/tests/compiler/frontend/c/c_test.c
          git commit -m 'test(c): account for Clang N3029 oracle behavior without changing Buster dialects'
          git push origin HEAD:refs/heads/codex/926-oracle-repair-1
          git rev-parse HEAD | tee "$RUNNER_TEMP/pr926-validation/candidate-sha.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr926-repair-validation
          path: ${{ runner.temp }}/pr926-validation
          retention-days: 2
