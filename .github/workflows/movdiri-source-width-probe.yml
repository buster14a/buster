name: MOVDIRI source-width validation

on:
  pull_request:
    paths:
      - '.github/workflows/movdiri-source-width-probe.yml'
      - 'build.c'
      - 'src/buster/tests/compiler/assembly/**'
      - 'src/buster/apps/ide/ide.c'
      - 'src/buster/lib/compiler/assembly/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movdiri-source-width-probe-${{ github.event_name }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  census:
    name: Hosted MOVDIRI source-width validation
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      BUSTER_TEST_JOBS: '2'
    steps:
      - name: Machine specifications
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: >-
            ubuntu-26.04
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record actual checkout identity
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Record source, authority and host identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/movdiri-probe-evidence"
          git rev-parse HEAD 'HEAD^{tree}' | tee "$RUNNER_TEMP/movdiri-probe-evidence/source.txt"
          git rev-parse 'HEAD:src/buster/lib/compiler/assembly/generated/arm-a64-canonical-manifest.json' > "$RUNNER_TEMP/movdiri-probe-evidence/authority.txt"
          clang --version | tee "$RUNNER_TEMP/movdiri-probe-evidence/toolchain.txt"
          llvm-mc-21 --version | tee -a "$RUNNER_TEMP/movdiri-probe-evidence/toolchain.txt"
          llvm-objdump-21 --version | tee -a "$RUNNER_TEMP/movdiri-probe-evidence/toolchain.txt"
          uname -a > "$RUNNER_TEMP/movdiri-probe-evidence/host.txt"
          lscpu >> "$RUNNER_TEMP/movdiri-probe-evidence/host.txt"
          free -b >> "$RUNNER_TEMP/movdiri-probe-evidence/host.txt"
      - name: Bootstrap native driver
        id: driver
        shell: bash
        run: |
          set -euo pipefail
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char -g build.c -o "$RUNNER_TEMP/movdiri-probe-build" 2>&1 | tee "$RUNNER_TEMP/movdiri-probe-evidence/bootstrap.log"
      - name: Build exact candidate compiler
        id: compiler
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/movdiri-probe-build" generate --cc clang --ci --linker DEFAULT 2>&1 | tee "$RUNNER_TEMP/movdiri-probe-evidence/configure.log"
          "$RUNNER_TEMP/movdiri-probe-build" build --config Release -t ide -- -j2 2>&1 | tee "$RUNNER_TEMP/movdiri-probe-evidence/build.log"
          sha256sum "$RUNNER_TEMP/movdiri-probe-build" build/Release/ide > "$RUNNER_TEMP/movdiri-probe-evidence/binaries.txt"
      - name: Verify public modifier and relocation regressions
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          build/Release/ide test --module=x86_64_completion_census_tests --ci=1 --verbose=1 2>&1 | tee "$RUNNER_TEMP/movdiri-probe-evidence/tests.log"
      - name: Compare MOVDIRI source words and contradictory widths with LLVM
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/movdiri-probe-evidence"
          exec > >(tee "$evidence/oracle.log") 2>&1
          fixture=src/buster/tests/compiler/assembly/fixtures/x86_movdiri_source_oracle.s
          for format in elf coff; do
            if test "$format" = elf; then
              reference_target=x86_64-linux-gnu
              candidate_target=x86_64-linux
            else
              reference_target=x86_64-windows-msvc
              candidate_target=x86_64-windows
            fi
            clang --target="$reference_target" -mmovdiri -c "$fixture" -o "$evidence/reference-$format.o"
            build/Release/ide cc -target "$candidate_target" -mattr=+movdiri -c "$fixture" -o "$evidence/candidate-$format.o"
            llvm-objcopy-21 --dump-section ".text=$evidence/reference-$format.text" "$evidence/reference-$format.o"
            llvm-objcopy-21 --dump-section ".text=$evidence/candidate-$format.text" "$evidence/candidate-$format.o"
            test -s "$evidence/reference-$format.text"
            cmp "$evidence/reference-$format.text" "$evidence/candidate-$format.text"
            for invalid in src/buster/tests/compiler/assembly/fixtures/x86_movdiri_source_invalid/*.s; do
              name="$(basename "$invalid" .s)"
              reference="$evidence/reference-invalid-$format-$name.o"
              if clang --target="$reference_target" -mmovdiri -c "$invalid" -o "$reference" > "$reference.log" 2>&1; then
                echo "LLVM unexpectedly accepted contradictory width $invalid"
                exit 1
              fi
              test -s "$reference.log"
              test ! -e "$reference"
              for features in +movdiri +movdiri,+apx,+apx-nci-ndd-nf; do
                candidate="$evidence/candidate-invalid-$format-$name-$features.o"
                if build/Release/ide cc -target "$candidate_target" "-mattr=$features" -c "$invalid" -o "$candidate" > "$candidate.log" 2>&1; then
                  echo "candidate unexpectedly accepted contradictory width $invalid ($features)"
                  exit 1
                fi
                test -s "$candidate.log"
                test ! -e "$candidate"
              done
            done
          done
      - name: Retain safe machine records
        if: ${{ !cancelled() }}
        uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: retain
          retention-directory: ${{ runner.temp }}/movdiri-probe-evidence
      - name: Retain exact source form evidence on success or failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: movdiri-source-width-probe-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/movdiri-probe-evidence/
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
