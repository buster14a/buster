name: PR 686 bounded diagnostics
on:
  push:
    branches: [repair/686-diagnostics]
permissions:
  contents: read
jobs:
  validate-repair:
    if: github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out diagnostic recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check out exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c0647ec99beb9e98dfb0e2b827bf8255fbc4a6a5
          path: candidate
          persist-credentials: false
      - name: Check out pinned main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e98111a4a557f7b4c7b24bfef01c9156ed5f4e12
          path: integration-base
          persist-credentials: false
      - name: Check out original merge base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e68e4f62eb67ec8e432fe46277bfe6f9e0e472cf
          path: original-base
          persist-credentials: false
      - name: Integrate and verify exact repair bytes
        run: python3 tools/pr686_repair.py prepare
      - name: Validate Android regression suite
        working-directory: integration-base
        shell: bash
        env:
          BUSTER_MOBILE_TEST_EVIDENCE_DIR: ${{ runner.temp }}/pr686-evidence
        run: |
          set -euo pipefail
          bash -n android/run_tests.sh android/run_tests_test.sh android/test_ci.sh android/start_emulator_ci.sh
          bash android/run_tests_test.sh 2>&1 | tee "$RUNNER_TEMP/pr686-android.log"
      - name: Publish verified Git blobs only, without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/pr686_repair.py publish
      - name: Retain validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr686-repair-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr686-android.log
            ${{ runner.temp }}/pr686-evidence/
            ${{ runner.temp }}/pr686-uploaded-blobs.json
          if-no-files-found: error
          retention-days: 7
