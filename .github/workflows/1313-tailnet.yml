name: PR 1313 tailnet access
on:
  push:
    branches: [qualify/1313-tailnet]
permissions:
  contents: read
jobs:
  connect:
    runs-on: ubuntu-26.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 25a3fdb1d76ed4f440e8b4e99e10722a0f1304a7
          persist-credentials: false
      - name: Connect disposable agent to benchpress
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          BUSTER_TAILNET_DISPOSABLE: '1'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TS_AUTHKEY" ]; then printf '%s\n' 'TS_AUTHKEY is not configured for this runner'; exit 1; fi
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo --preserve-env=TS_AUTHKEY,BUSTER_TAILNET_DISPOSABLE bash .claude/hooks/join-tailnet.sh
          timeout 45 tailscale ssh david@benchpress 'uname -n; cat /var/lib/buster-9700x/owner'
      - name: Remove disposable tailnet session
        if: always()
        run: if command -v tailscale >/dev/null; then sudo tailscale logout || true; fi
