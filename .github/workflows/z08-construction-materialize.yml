name: Z08 construction materialization
on:
  push:
    branches: [astra/z08-ir-inspection-20260909]
    paths: [.github/workflows/z08-construction-materialize.yml]
permissions:
  contents: read
jobs:
  objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          persist-credentials: false
      - name: Materialize source and detached Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, difflib, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path('.')
          changed = {}
          def one(s, old, new):
              if s.count(old) != 1:
                  raise RuntimeError('Non-unique source anchor: ' + old[:100])
              return s.replace(old, new, 1)
          def region(s, start, end, change):
              begin = s.index(start); finish = s.index(end, begin)
              return s[:begin] + change(s[begin:finish]) + s[finish:]
          def edit(name, change):
              p = root / name; old = p.read_text(); new = change(old)
              if new == old: raise RuntimeError('No change: ' + name)
              changed[name] = old; p.write_text(new)
          fields = '''block_appends value_appends instruction_appends operand_slots_appended
          block_grows value_grows instruction_grows block_rows_copied value_rows_copied instruction_rows_copied
          source_rows_copied source_rows_cleared function_starts body_tokens parameters
          initial_block_slots initial_instruction_slots initial_value_slots ssa_finish_calls ssa_finish_failures
          before_ssa_block_rows before_ssa_instruction_rows before_ssa_value_rows
          after_ssa_block_rows after_ssa_instruction_rows after_ssa_value_rows
          final_block_slots final_instruction_slots final_value_slots
          place_load_retractions place_atomic_load_retractions ssa_read_retractions place_repair_steps
          cfg_builds cfg_failures cfg_scratch_slots cfg_target_visits cfg_unique_edges
          cfg_parameter_visits cfg_incoming_visits cfg_copy_sources'''.split()
          header = '''#pragma once

          // Calling-thread construction work, owned by ir.c and present only in the
          // existing allocation diagnostic build. These are cumulative event/row counts,
          // not timings, live memory, all-lane totals, or a second IR representation.
          // Normal builds do not evaluate recording arguments or retain counter storage.
          #include <buster/lib/base.h>

          #if BUSTER_BENCH_ALLOCATIONS
          #define IR_CONSTRUCTION_COUNTERS(X) \\
          '''
          header += '\n'.join('    X(' + name.upper() + ', ' + name + ')' + (' \\' if index + 1 < len(fields) else '') for index, name in enumerate(fields))
          header += '''

          typedef enum IrConstructionCounter
          {
          #define IR_CONSTRUCTION_ENUM(id, name) IR_CONSTRUCTION_##id,
              IR_CONSTRUCTION_COUNTERS(IR_CONSTRUCTION_ENUM)
          #undef IR_CONSTRUCTION_ENUM
              IR_CONSTRUCTION_COUNT,
          } IrConstructionCounter;

          typedef struct IrConstructionCounters IrConstructionCounters;
          struct IrConstructionCounters
          {
              u64 values[IR_CONSTRUCTION_COUNT];
              bool overflowed;
          };

          BUSTER_F_DECL void ir_construction_record(IrConstructionCounter counter, u64 amount);
          BUSTER_F_DECL IrConstructionCounters ir_construction_counters(void);
          BUSTER_F_DECL String8 ir_construction_counter_name(IrConstructionCounter counter);
          #define IR_CONSTRUCTION_RECORD(counter, amount) ir_construction_record(IR_CONSTRUCTION_##counter, (u64)(amount))
          #else
          #define IR_CONSTRUCTION_RECORD(counter, amount) ((void)0)
          #endif
          '''
          name = 'src/buster/lib/compiler/ir/ir_construction.h'
          changed[name] = ''; (root / name).write_text(header)
          implementation = '''#if BUSTER_BENCH_ALLOCATIONS
          BUSTER_GLOBAL_LOCAL BUSTER_THREAD_LOCAL_DECL IrConstructionCounters ir_construction_totals;

          void ir_construction_record(IrConstructionCounter counter, u64 amount)
          {
              if ((u32)counter < IR_CONSTRUCTION_COUNT)
              {
                  u64* value = ir_construction_totals.values + counter;
                  if (amount > UINT64_MAX - *value)
                  {
                      *value = UINT64_MAX;
                      ir_construction_totals.overflowed = true;
                  }
                  else
                  {
                      *value += amount;
                  }
              }
              else
              {
                  ir_construction_totals.overflowed = true;
              }
              return;
          }

          IrConstructionCounters ir_construction_counters(void)
          {
              return ir_construction_totals;
          }

          String8 ir_construction_counter_name(IrConstructionCounter counter)
          {
              String8 result = {0};
              switch (counter)
              {
          #define IR_CONSTRUCTION_NAME(id, name) case IR_CONSTRUCTION_##id: result = S8(#name); break;
                  IR_CONSTRUCTION_COUNTERS(IR_CONSTRUCTION_NAME)
          #undef IR_CONSTRUCTION_NAME
                  default: break;
              }
              return result;
          }
          #endif

          '''
          def ir_change(s):
              s = one(s, '#include <buster/lib/compiler/ir/ir_internal.h>', '#include <buster/lib/compiler/ir/ir_internal.h>\n#include <buster/lib/compiler/ir/ir_construction.h>')
              s = one(s, 'IrType* ir_type_from_id', implementation + 'IrType* ir_type_from_id')
              s = one(s, '// (model.h owns the record shapes, ir.h the API). The construction', '// (model.h owns the record shapes, ir.h the API). ir_construction_record\n// owns optional calling-thread construction diagnostics. The construction')
              for kind, begin, end in [('block', 'IrBlock* ir_function_add_block', 'IrValueId ir_function_add_value'), ('value', 'IrValueId ir_function_add_value', 'IrInstructionId ir_instruction_self_id'), ('instruction', 'IrInstructionId ir_function_add_instruction', 'BUSTER_GLOBAL_LOCAL IrValidationResult ir_validation_error')]:
                  def change(q):
                      marker = '            u32 capacity = function->' + kind + '_capacity ?'
                      q = one(q, marker, '            IR_CONSTRUCTION_RECORD(' + kind.upper() + '_GROWS, 1);\n            IR_CONSTRUCTION_RECORD(' + kind.upper() + '_ROWS_COPIED, function->' + kind + '_count);\n' + marker)
                      if kind == 'instruction':
                          marker = '                memset(canonical_sources, 0, sizeof(*canonical_sources) * capacity);'
                          q = one(q, marker, marker + '\n                IR_CONSTRUCTION_RECORD(SOURCE_ROWS_CLEARED, capacity);')
                          marker = '                    memcpy(canonical_sources, function->instruction_canonical_sources, sizeof(*canonical_sources) * function->instruction_count);'
                          q = one(q, marker, marker + '\n                    IR_CONSTRUCTION_RECORD(SOURCE_ROWS_COPIED, function->instruction_count);')
                          q = one(q, '        result = id;', '        IR_CONSTRUCTION_RECORD(INSTRUCTION_APPENDS, 1);\n        IR_CONSTRUCTION_RECORD(OPERAND_SLOTS_APPENDED, instruction.operand_count);\n        result = id;')
                      elif kind == 'value':
                          q = one(q, '        result = id;', '        IR_CONSTRUCTION_RECORD(VALUE_APPENDS, 1);\n        result = id;')
                      else:
                          q = one(q, '        result = &function->blocks[function->block_count - 1];', '        IR_CONSTRUCTION_RECORD(BLOCK_APPENDS, 1);\n        result = &function->blocks[function->block_count - 1];')
                      return q
                  s = region(s, begin, end, change)
              return s
          edit('src/buster/lib/compiler/ir/ir.c', ir_change)
          recovery = '''BUSTER_C_INTERNAL IrValueId c_ir_recover_memory_place_from_value(CIntegerIrBuilder* builder, IrValueId value)
          {
              IrValueId result = IR_VALUE_ID_INVALID;
              if (value.value < builder->function->value_count)
              {
                  IrValue* value_definition = builder->function->values + value.value;
                  if (value_definition->category == IR_VALUE_PLACE)
                  {
                      result = value;
                  }
                  else if (value_definition->definition.value < builder->function->instruction_count)
                  {
                      IrInstructionId definition_id = value_definition->definition;
                      IrInstruction* definition = builder->function->instructions + definition_id.value;
                      CIrDirectSsa* ssa = builder->direct_ssa;
                      bool has_later_event = ssa && ssa->event_count && ssa->events[ssa->event_count - 1].after.value == definition_id.value;
                      bool recover = !has_later_event && (definition->opcode == IR_OPCODE_LOAD || definition->opcode == IR_OPCODE_ATOMIC_LOAD) &&
                                     definition->operand_count == 1 && definition_id.value + 1 == builder->function->instruction_count &&
                                     value.value + 1 == builder->function->value_count &&
                                     builder->function->blocks[builder->current_block.value].last_instruction.value == definition_id.value &&
                                     builder->last_instruction.value == definition_id.value;
                      IrInstructionId previous = IR_INSTRUCTION_ID_INVALID;
                      if (recover)
                      {
                          if (builder->previous_instruction_known)
                          {
                              previous = builder->previous_instruction;
                          }
                          else
                          {
                              IrInstructionId cursor = builder->function->blocks[builder->current_block.value].first_instruction;
                              while (cursor.value != IR_ID_UNDERLYING_INVALID && cursor.value != definition_id.value)
                              {
                                  IR_CONSTRUCTION_RECORD(PLACE_REPAIR_STEPS, 1);
                                  previous = cursor;
                                  cursor = builder->function->instructions[cursor.value].next;
                              }
                              recover = cursor.value == definition_id.value;
                          }
                      }
                      if (recover)
                      {
                          if (previous.value == IR_ID_UNDERLYING_INVALID)
                          {
                              builder->function->blocks[builder->current_block.value].first_instruction = IR_INSTRUCTION_ID_INVALID;
                          }
                          else
                          {
                              builder->function->instructions[previous.value].next = IR_INSTRUCTION_ID_INVALID;
                          }
                          builder->function->blocks[builder->current_block.value].last_instruction = previous;
                          builder->last_instruction = previous;
                          builder->previous_instruction_known = false;
                          result = definition->operands[0];
                          // The value ID is reusable. Its old label provenance must not
                          // describe the next value, including an address-of replacement.
                          // The retracted value is highest and its sparse entry is last.
                          if (builder->function->label_metadata_count &&
                              builder->function->label_metadata_values[builder->function->label_metadata_count - 1].value == value.value)
                          {
                              builder->function->label_metadata_count -= 1;
                          }
                          IR_CONSTRUCTION_RECORD(PLACE_LOAD_RETRACTIONS, definition->opcode == IR_OPCODE_LOAD);
                          IR_CONSTRUCTION_RECORD(PLACE_ATOMIC_LOAD_RETRACTIONS, definition->opcode == IR_OPCODE_ATOMIC_LOAD);
                          builder->function->instruction_count -= 1;
                          builder->function->value_count -= 1;
                      }
                  }
              }
              return result;
          }

          '''
          def c_change(s):
              s = one(s, '#include "c_internal.h"', '#include "c_internal.h"\n#include <buster/lib/compiler/ir/ir_construction.h>')
              def read_place(q):
                  return one(q, '                builder->function->value_count -= 1;', '                builder->function->value_count -= 1;\n                IR_CONSTRUCTION_RECORD(SSA_READ_RETRACTIONS, 1);')
              s = region(s, 'BUSTER_C_INTERNAL IrValueId c_ir_ssa_read_place', 'BUSTER_C_INTERNAL u32 c_ir_ssa_root', read_place)
              def finish(q):
                  prefix = '    IR_CONSTRUCTION_RECORD(SSA_FINISH_CALLS, 1);\n'
                  for kind in ['block', 'instruction', 'value']:
                      prefix += '    IR_CONSTRUCTION_RECORD(BEFORE_SSA_' + kind.upper() + '_ROWS, builder->function->' + kind + '_count);\n'
                  q = one(q, '    CIrDirectSsa* ssa = builder->direct_ssa;', prefix + '    CIrDirectSsa* ssa = builder->direct_ssa;')
                  suffix = '    IR_CONSTRUCTION_RECORD(SSA_FINISH_FAILURES, !valid);\n'
                  for kind in ['block', 'instruction', 'value']:
                      suffix += '    IR_CONSTRUCTION_RECORD(AFTER_SSA_' + kind.upper() + '_ROWS, builder->function->' + kind + '_count);\n'
                  for kind in ['block', 'instruction', 'value']:
                      suffix += '    IR_CONSTRUCTION_RECORD(FINAL_' + kind.upper() + '_SLOTS, builder->function->' + kind + '_capacity);\n'
                  return one(q, '    return valid;', suffix + '    return valid;')
              s = region(s, 'BUSTER_C_INTERNAL bool c_ir_ssa_finish', 'BUSTER_C_INTERNAL void c_ir_mark_local_read_only', finish)
              s = region(s, 'BUSTER_C_INTERNAL IrValueId c_ir_recover_memory_place_from_value', 'BUSTER_C_INTERNAL IrValueId c_ir_recover_place_from_value', lambda q: recovery)
              marker = '        function->values = arena_allocate(arena, IrValue, function->value_capacity);'
              extra = '\n        IR_CONSTRUCTION_RECORD(FUNCTION_STARTS, 1);\n        IR_CONSTRUCTION_RECORD(BODY_TOKENS, declaration.body_token_count);\n        IR_CONSTRUCTION_RECORD(PARAMETERS, signatures[declaration_index].parameter_count);\n'
              extra += '\n'.join('        IR_CONSTRUCTION_RECORD(INITIAL_' + kind.upper() + '_SLOTS, function->' + kind + '_capacity);' for kind in ['block', 'instruction', 'value'])
              return one(s, marker, marker + extra)
          edit('src/buster/lib/compiler/frontend/c/c_gen.c', c_change)
          def machine_change(s):
              s = one(s, '#include <buster/lib/compiler/codegen/machine.h>', '#include <buster/lib/compiler/codegen/machine.h>\n#include <buster/lib/compiler/ir/ir_construction.h>')
              def edges(q):
                  q = one(q, '    u32* last_source =', '    IR_CONSTRUCTION_RECORD(CFG_BUILDS, 1);\n    IR_CONSTRUCTION_RECORD(CFG_SCRATCH_SLOTS, function->block_count);\n    u32* last_source =')
                  for marker, record in [('                u32 target = terminator->targets[index].value;', '                IR_CONSTRUCTION_RECORD(CFG_TARGET_VISITS, 1);'), ('                    last_source[target] = source;', '                    IR_CONSTRUCTION_RECORD(CFG_UNIQUE_EDGES, 1);'), ('                        IrIncoming* incoming =', '                        IR_CONSTRUCTION_RECORD(CFG_PARAMETER_VISITS, 1);'), ('                            incoming = incoming->next;', '                            IR_CONSTRUCTION_RECORD(CFG_INCOMING_VISITS, 1);'), ('                        valid = incoming && incoming->value.value', '                        IR_CONSTRUCTION_RECORD(CFG_INCOMING_VISITS, incoming != 0);'), ('                            machine_builder_edge_copy_source(builder,', '                            IR_CONSTRUCTION_RECORD(CFG_COPY_SOURCES, 1);')]:
                      q = one(q, marker, record + '\n' + marker)
                  return one(q, '    return valid;', '    IR_CONSTRUCTION_RECORD(CFG_FAILURES, !valid);\n    return valid;')
              return region(s, 'BUSTER_GLOBAL_LOCAL bool machine_builder_canonical_edges', 'MachineFunction machine_function_builder_finish', edges)
          edit('src/buster/lib/compiler/codegen/machine.c', machine_change)
          def ide_change(s):
              s = one(s, '#include <buster/lib/compiler/ir/ir.h>', '#include <buster/lib/compiler/ir/ir.h>\n#include <buster/lib/compiler/ir/ir_construction.h>')
              s = one(s, '    ArenaBenchmarkCounters allocations = arena_benchmark_counters();', '    ArenaBenchmarkCounters allocations = arena_benchmark_counters();\n    IrConstructionCounters construction = ir_construction_counters();')
              marker = '    source_metrics_append_field(arena, &text, S8("allocation"), S8("arena_bytes"), allocations.requested_bytes);'
              return one(s, marker, marker + '''
              source_metrics_append_field(arena, &text, S8("ir_construction"), S8("version"), 1);
              source_metrics_append_field(arena, &text, S8("ir_construction"), S8("overflowed"), construction.overflowed);
              for (u32 index = 0; index < IR_CONSTRUCTION_COUNT; index += 1)
              {
                  source_metrics_append_field(arena, &text, S8("ir_construction"), ir_construction_counter_name((IrConstructionCounter)index),
                                              construction.values[index]);
              }''')
          edit('src/buster/apps/ide/ide.c', ide_change)
          test = '''BUSTER_GLOBAL_LOCAL UnitTestResult ir_test_construction_appends(UnitTestArguments* arguments)
          {
              UnitTestResult result = {0};
              IrFunction function = {0};
          #if BUSTER_BENCH_ALLOCATIONS
              IrConstructionCounters before = ir_construction_counters();
          #endif
              BUSTER_TEST(arguments, ir_function_add_block(0, &function, (IrBlock){0}) == 0);
              BUSTER_TEST(arguments, ir_function_add_value(arguments->arena, 0, (IrValue){0}).value == IR_ID_UNDERLYING_INVALID);
              BUSTER_TEST(arguments, ir_function_add_instruction(0, &function, (IrInstruction){0}, (IrSourceRange){0}).value == IR_ID_UNDERLYING_INVALID);
              // Initial zero capacity, exact powers of two, and repeated growth
              // retain row identity and the parallel canonical source array.
              for (u32 index = 0; index < 65; index += 1)
              {
                  IrBlock* block = ir_function_add_block(arguments->arena, &function, (IrBlock){.sealed = true});
                  IrValueId value = ir_function_add_value(arguments->arena, &function, (IrValue){.definition = {.value = index}});
                  IrInstructionId instruction = ir_function_add_instruction(arguments->arena, &function,
                      (IrInstruction){.opcode = IR_OPCODE_CONSTANT_INTEGER, .result = value, .next = IR_INSTRUCTION_ID_INVALID},
                      (IrSourceRange){.source = {.value = 7}, .offset = index * 3, .length = 2});
                  BUSTER_TEST(arguments, block && block->id.value == index);
                  BUSTER_TEST(arguments, value.value == index && instruction.value == index);
                  BUSTER_TEST(arguments, function.block_count == index + 1 && function.instruction_count == index + 1 && function.value_count == index + 1);
              }
              BUSTER_TEST(arguments, function.block_capacity == 128 && function.instruction_capacity == 128 && function.value_capacity == 128);
              for (u32 index = 0; index < 65; index += 1)
              {
                  BUSTER_TEST(arguments, function.blocks[index].id.value == index && function.blocks[index].sealed);
                  BUSTER_TEST(arguments, function.values[index].definition.value == index);
                  BUSTER_TEST(arguments, function.instructions[index].opcode == IR_OPCODE_CONSTANT_INTEGER && function.instructions[index].result.value == index);
                  BUSTER_TEST(arguments, function.instructions[index].next.value == IR_ID_UNDERLYING_INVALID);
                  IrSourceRange source = function.instruction_canonical_sources[index];
                  BUSTER_TEST(arguments, source.source.value == 7 && source.offset == index * 3 && source.length == 2);
              }
          #if BUSTER_BENCH_ALLOCATIONS
              IrConstructionCounters after = ir_construction_counters();
              BUSTER_TEST(arguments, !before.overflowed && !after.overflowed);
          #define IR_CONSTRUCTION_EXPECT(counter, expected) \\
              BUSTER_TEST(arguments, after.values[IR_CONSTRUCTION_##counter] - before.values[IR_CONSTRUCTION_##counter] == (expected))
              IR_CONSTRUCTION_EXPECT(BLOCK_APPENDS, 65);
              IR_CONSTRUCTION_EXPECT(VALUE_APPENDS, 65);
              IR_CONSTRUCTION_EXPECT(INSTRUCTION_APPENDS, 65);
              IR_CONSTRUCTION_EXPECT(OPERAND_SLOTS_APPENDED, 0);
              IR_CONSTRUCTION_EXPECT(BLOCK_GROWS, 5);
              IR_CONSTRUCTION_EXPECT(VALUE_GROWS, 4);
              IR_CONSTRUCTION_EXPECT(INSTRUCTION_GROWS, 4);
              IR_CONSTRUCTION_EXPECT(BLOCK_ROWS_COPIED, 120);
              IR_CONSTRUCTION_EXPECT(VALUE_ROWS_COPIED, 112);
              IR_CONSTRUCTION_EXPECT(INSTRUCTION_ROWS_COPIED, 112);
              IR_CONSTRUCTION_EXPECT(SOURCE_ROWS_COPIED, 112);
              IR_CONSTRUCTION_EXPECT(SOURCE_ROWS_CLEARED, 240);
          #undef IR_CONSTRUCTION_EXPECT
              for (u32 index = 0; index < IR_CONSTRUCTION_COUNT; index += 1)
              {
                  BUSTER_TEST(arguments, ir_construction_counter_name((IrConstructionCounter)index).length != 0);
              }
              BUSTER_TEST(arguments, ir_construction_counter_name(IR_CONSTRUCTION_COUNT).length == 0);
          #endif
              return result;
          }

          '''
          def tests_change(s):
              s = one(s, '#include <buster/lib/compiler/ir/ir_internal.h>', '#include <buster/lib/compiler/ir/ir_internal.h>\n#include <buster/lib/compiler/ir/ir_construction.h>')
              s = one(s, 'UnitTestResult ir_tests(UnitTestArguments* arguments)', test + 'UnitTestResult ir_tests(UnitTestArguments* arguments)')
              return one(s, '    UnitTestResult result = ir_promotion_tests(arguments);', '    UnitTestResult result = ir_promotion_tests(arguments);\n    UnitTestResult construction = ir_test_construction_appends(arguments);\n    result.test_count += construction.test_count;\n    result.succeeded_test_count += construction.succeeded_test_count;')
          edit('src/buster/tests/compiler/ir/ir_test.c', tests_change)
          documentation = '''### Canonical construction census in allocation probes

          The same `BUSTER_BENCH_ALLOCATIONS` build emits `ir_construction.*` fields
          in `-fsource-metrics`. Use the existing allocation-probe arguments above;
          normal timing compilers must remain uninstrumented. Raw metric files are
          retained in the native harness artifacts even though its allocation summary
          contains only arena calls/bytes. There is no second measurement runner.

          `version=1` identifies the construction vocabulary. `overflowed=1` invalidates
          the census: counters saturate rather than wrapping. Counts are cumulative
          **calling-thread** totals since process start, including failed attempts
          that reached each hook. They are not all-lane aggregates. The compiler is
          currently serial; future parallel compilation must explicitly aggregate
          lane-owned results. The snapshot precedes report formatting and resets
          nothing. No extra arena storage or whole-function row stream is retained.

          - `block_appends`, `value_appends`, `instruction_appends` count successful
            checked-builder appends, including later-retracted rows; direct writes
            to arrays do not count as appends.
          - `*_grows`, `*_rows_copied`, `source_rows_cleared` count builder growth
            and copied/cleared rows, not capacity bytes or peak resident memory.
          - `function_starts`, `body_tokens`, `parameters`, `initial_*_slots` count
            C body-lowering starts and initial estimates, once per started function.
          - `ssa_finish_calls`, `ssa_finish_failures`, `before_ssa_*_rows`,
            `after_ssa_*_rows`, `final_*_slots` describe frontend finish entry/exit,
            including failed finish calls. Earlier failures have no exit snapshot.
            This is not general canonical finalization or later promotion.
          - `place_load_retractions`, `place_atomic_load_retractions`,
            `ssa_read_retractions`, `place_repair_steps` count recovered memory
            loads, SSA read aliases, and previous-instruction traversal steps.
          - `cfg_*` count shared native edge-builder calls/failures, scratch `u32`
            slots, target visits, attempted unique source/target pairs, parameter
            visits, incoming nodes examined including matches, and emitted copy
            sources. Direct/non-native consumers do not call this builder: zero
            means no work at this hook, not absence of all CFG work.
          - `operand_slots_appended` sums appended rows' operand counts. It does
            not count unique operands or repeated downstream decoding passes.

          Initial estimates and finish populations cover different failure boundaries;
          do not subtract them blindly on invalid sources. Counts do not measure
          append latency, phase times, retained arena memory, or all-consumer cost.
          Reuse per-site allocation diagnostics and uninstrumented paired experiments.
          A smaller count is not a speedup. Normal builds preprocess recording calls
          away and retain neither counter storage nor reporting API. Row layout,
          IDs, source/label provenance, and arena lifetimes are unchanged.

          '''
          edit('tools/throughput/README.md', lambda s: one(s, '## Frozen-source self-host stages', documentation + '## Frozen-source self-host stages'))
          edit('docs/agents/benchmarking.md', lambda s: s + '''
          ## Canonical construction work populations

          For #38/#50/#52/#306, use the existing allocation diagnostic build and its
          additive `ir_construction.*` source-metrics fields. The
          [construction census contract](../../tools/throughput/README.md#canonical-construction-census-in-allocation-probes)
          defines append/growth, frontend finish, place retraction and shared native
          edge populations. Keep this instrumented compiler off the timing path,
          require its output hash to match the ordinary compiler, and retain raw
          metrics. These calling-thread counters do not aggregate persistent lanes,
          time appends, or cover every operand decoder. They do not establish a
          Zen 5 speedup, live memory reduction, or whole-pipeline cost.
          ''')
          subprocess.run(['git', 'diff', '--check'], check=True)
          out = pathlib.Path('z08-evidence'); out.mkdir()
          patch = ''.join(''.join(difflib.unified_diff(old.splitlines(True), (root / name).read_text().splitlines(True), fromfile='a/' + name if old else '/dev/null', tofile='b/' + name)) for name, old in changed.items())
          (out / 'construction.patch').write_text(patch)
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}
          entries = []; identities = {}
          for name in changed:
              content = (root / name).read_bytes()
              local_sha = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              data = json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/buster14a/buster/git/blobs', data=data, headers=headers, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  remote = json.load(response)
              if remote['sha'] != local_sha: raise RuntimeError('Blob identity mismatch: ' + name)
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': local_sha})
              identities[name] = hashlib.sha256(content).hexdigest()
              print('BLOB', name, local_sha, flush=True)
          (out / 'tree-entries.json').write_text(json.dumps(entries, indent=2) + '\n')
          (out / 'source-sha256.json').write_text(json.dumps(identities, indent=2) + '\n')
          subprocess.run(['tar', '-czf', str(out / 'changed-source.tar.gz'), *changed], check=True)
