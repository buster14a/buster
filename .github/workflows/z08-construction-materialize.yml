          paths = ['src/buster/lib/compiler/ir/ir_construction.h', 'src/buster/lib/compiler/ir/ir.c', 'src/buster/lib/compiler/frontend/c/c_gen.c', 'src/buster/lib/compiler/codegen/machine.c', 'src/buster/apps/ide/ide.c', 'src/buster/tests/compiler/ir/ir_test.c', 'tools/throughput/README.md', 'docs/agents/benchmarking.md']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}
          result = []
          for name in paths:
              content = pathlib.Path(name).read_bytes()
              local_sha = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              data = json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/buster14a/buster/git/blobs', data=data, headers=headers, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  remote = json.load(response)
              if remote['sha'] != local_sha:
                  raise SystemExit('Blob identity mismatch: ' + name)
              result.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': local_sha})
              print('BLOB', name, local_sha, flush=True)
          (out / 'tree-entries.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
