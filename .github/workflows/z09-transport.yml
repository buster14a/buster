name: Z09 source and evidence transport
on:
  push:
    branches: [astra/z09-pass-census-transport-20260909]
    paths: [.github/workflows/z09-transport.yml]
permissions:
  contents: write
  issues: read
  pull-requests: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          persist-credentials: false
      - name: Verify pinned patch and publish unreferenced Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/z09-publish"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = 'https://api.github.com/repos/buster14a/buster'
          baseline = 'ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae'
          expected_tree = 'c549e63cdfc6f77af3ff33274b6459d4216b0117'
          def request(endpoint, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(root + endpoint, data=body, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def pages(endpoint):
              result = []
              page = 1
              while True:
                  separator = '&' if '?' in endpoint else '?'
                  batch = request(endpoint + separator + 'per_page=100&page=' + str(page))
                  result.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return result
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          payload = '''''' 
          # Fail closed on a damaged transport; no source refs are changed here.
          patch = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == '6b9cd3b3a6d2133b00fe190bba4060e63ab8ca5d92dd4b77fb081ce449e49d7b'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'z09-publish'
          patch_path = out / 'code.patch'
          patch_path.write_bytes(patch)
          assert git('rev-parse', 'HEAD') == baseline
          subprocess.run(['git', 'apply', '--check', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch_path)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          assert git('write-tree') == expected_tree
          paths = git('diff', '--cached', '--name-only').splitlines()
          main = request('/branches/main')['commit']['sha']
          assert main == baseline, ('main moved', main)
          pulls = pages('/pulls?state=open&sort=created&direction=asc')
          evidence = {'main': main, 'paths': paths, 'open_prs': []}
          for pr in pulls:
              changed = pages('/pulls/' + str(pr['number']) + '/files')
              overlap = sorted(set(paths).intersection(row['filename'] for row in changed))
              evidence['open_prs'].append({'number': pr['number'], 'head': pr['head']['sha'], 'files': changed, 'overlap': overlap})
          (out / 'coordination.json').write_text(json.dumps(evidence, indent=2))
          assert not any(pr['overlap'] for pr in evidence['open_prs']), 'New shared-file overlap requires review'
          entries = []
          for path in paths:
              content = pathlib.Path(path).read_bytes()
              blob = request('/git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
              assert blob['sha'] == git('hash-object', path)
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = request('/git/trees', {'base_tree': '093b374996f3aecca200fe2968539554fc67bf55', 'tree': entries})
          assert tree['sha'] == expected_tree
          (out / 'manifest.json').write_text(json.dumps({'baseline': baseline, 'tree': tree['sha'], 'paths': paths}, indent=2))
          print('VERIFIED_TREE', tree['sha'])
          print('BASELINE', baseline)
          print('No branch or pull request was modified by this job.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: z09-verified-tree
          path: ${{ runner.temp }}/z09-publish
          if-no-files-found: error
          retention-days: 7
