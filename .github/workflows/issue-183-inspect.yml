name: Issue 183 enum inspection

on:
  push:
    branches:
      - fix/183-gnu17-enum-types
    paths:
      - .github/workflows/issue-183-inspect.yml

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Capture current enum implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          output = []

          def section(title: str) -> None:
              output.append(f"\n\n===== {title} =====\n")

          def contexts(path: str, needles: list[str], before: int = 1800, after: int = 3600) -> None:
              text = Path(path).read_text()
              section(path)
              lines = text.splitlines()
              output.append(f"bytes={len(text)} lines={len(lines)}\n")
              for needle in needles:
                  starts = []
                  pos = 0
                  while True:
                      pos = text.find(needle, pos)
                      if pos < 0:
                          break
                      starts.append(pos)
                      pos += len(needle)
                  output.append(f"\n-- needle {needle!r}: {len(starts)} occurrence(s) --\n")
                  for occurrence, start in enumerate(starts, 1):
                      line = text.count("\n", 0, start) + 1
                      lo = max(0, start - before)
                      hi = min(len(text), start + len(needle) + after)
                      output.append(f"\n[{occurrence}] line {line}\n")
                      output.append(text[lo:hi])
                      output.append("\n")

          contexts(
              "src/buster/lib/compiler/frontend/c/c_gen.c",
              [
                  "C_ENTITY_ENUMERATOR",
                  "C_TYPE_ENUM",
                  "c_ir_emit_integer_value",
                  "constant_is_negative",
                  "enum_member_start",
                  "c_ir_integer_literal_type",
                  "c_ir_constant_identifier",
              ],
          )
          contexts(
              "src/buster/lib/compiler/frontend/c/c_parse.c",
              [
                  "enum_underlying_type",
                  "result->enum_members[result->enum_member_count++]",
                  "c_integer_expression_evaluate",
                  "C_ENTITY_ENUMERATOR",
                  "constant_is_negative",
              ],
          )
          contexts(
              "src/buster/lib/compiler/frontend/c/c_source.c",
              [
                  "c_integer_expression_evaluate",
                  "CConditionalValue",
                  "c_conditional_number",
                  "C_CONDITIONAL_UNARY_MINUS",
              ],
          )
          contexts(
              "src/buster/lib/compiler/frontend/c/c.h",
              ["struct CEnumMember", "struct CEntity", "typedef enum CTypeKind", "typedef enum CPreprocessDialect"],
              before=800,
              after=2200,
          )
          for path in ["tests/c/c-gnu.c", "tests/c/c.c", "CMakeLists.txt"]:
              if Path(path).exists():
                  contexts(path, ["enum", "_Generic", "c-gnu", "C23", "gnu17"], before=600, after=1200)

          Path(".github/issue-183-context.txt").write_text("".join(output))
          PY
          {
            echo
            echo '===== repository grep ====='
            git grep -n -E 'C_ENTITY_ENUMERATOR|enum_member_start|enum_member_count|0x80000000|70000|_Generic' -- \
              src/buster/lib/compiler/frontend/c tests/c CMakeLists.txt || true
          } >> .github/issue-183-context.txt
          git rm .github/workflows/issue-183-inspect.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/issue-183-context.txt
          git commit -m "chore: capture issue 183 source context"
          git push origin HEAD:${GITHUB_REF_NAME}
