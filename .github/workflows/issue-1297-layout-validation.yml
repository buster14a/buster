name: Issue 1297 layout validation
on:
  push:
    branches: [codex/1297-cache-member-offset-queries]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Machine and source identity
        shell: bash
        run: |
          git rev-parse HEAD
          uname -a
          lscpu
          free -b
          clang --version
      - name: Build hosted driver
        shell: bash
        run: |
          mkdir -p build
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o build/build
      - name: Self-host fixed point
        shell: bash
        run: build/build test_self_host --config Release --linker DEFAULT
      - name: Focused layout and frontend correctness
        shell: bash
        run: build/Release/ide test --module=c_type_layout_tests,c_frontend_tests,record_layout_tests --verbose=1 --ci=1
      - name: Source size and whitespace
        shell: bash
        run: |
          git diff --check dccc6cbb7fff352cbc78a3f4fb5f6c07c48c4b55
          build/build source_size --base dccc6cbb7fff352cbc78a3f4fb5f6c07c48c4b55
