name: Issue 1297 negative controls
on:
  push:
    branches: [codex/1297-offset-negative-controls]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Machine and source identity
        shell: bash
        run: |
          git rev-parse HEAD
          uname -a
          lscpu
          free -b
          clang --version
      - name: Build hosted driver
        shell: bash
        run: |
          mkdir -p build
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-driver"
      - name: Build focused-test binary
        shell: bash
        run: |
          "$RUNNER_TEMP/buster-driver" generate --config Release --linker DEFAULT
          "$RUNNER_TEMP/buster-driver" build --config Release -t ide
      - name: Require counter regressions to reject legacy whole-table work
        shell: bash
        run: |
          status=0
          build/Release/ide test --module=c_type_layout_tests --verbose=1 --ci=1 > "$RUNNER_TEMP/negative-control.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/negative-control.log"
          test "$status" -ne 0
          grep -E 'TEST_MODULE_TIMING .*module=c_type_layout_tests .*failed=[1-9][0-9]* .*status=fail' "$RUNNER_TEMP/negative-control.log"
