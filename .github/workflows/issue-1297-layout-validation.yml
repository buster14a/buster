name: Issue 1297 layout validation
on:
  push:
    branches: [codex/1297-cache-member-offset-queries]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Machine and source identity
        shell: bash
        run: |
          git rev-parse HEAD
          uname -a
          lscpu
          free -b
          clang --version
      - name: Build hosted driver
        shell: bash
        run: |
          mkdir -p build
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-driver"
      - name: Self-host fixed point
        shell: bash
        run: |
          "$RUNNER_TEMP/buster-driver" generate --config Release --linker DEFAULT
          "$RUNNER_TEMP/buster-driver" test_self_host --config Release
      - name: Focused layout and frontend correctness
        shell: bash
        run: build/Release/ide test --module=c_type_layout_tests,c_frontend_tests,record_layout_tests --verbose=1 --ci=1
      - name: Source size and whitespace
        shell: bash
        run: |
          git diff --check dccc6cbb7fff352cbc78a3f4fb5f6c07c48c4b55
          "$RUNNER_TEMP/buster-driver" source_size --base dccc6cbb7fff352cbc78a3f4fb5f6c07c48c4b55
      - name: Match issue 1238 witnesses against the pinned baseline
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/issue-1297-baseline" dccc6cbb7fff352cbc78a3f4fb5f6c07c48c4b55
          cd "$RUNNER_TEMP/issue-1297-baseline"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/baseline-driver"
          "$RUNNER_TEMP/baseline-driver" generate --config Release --linker DEFAULT
          "$RUNNER_TEMP/baseline-driver" build --config Release -t ide
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          witnesses = root / "issue-1297-witnesses"
          witnesses.mkdir()
          cases = {
              "unsigned_wrap": '_Static_assert(0u - 1 == 4294967295u, "wrap");',
              "unsigned_complement": '_Static_assert(~0U == 4294967295u, "complement");',
              "mixed_signedness": '_Static_assert(-1L < 1U, "mixed");',
              "invalid_size_comparison": '_Static_assert(-1 < sizeof(int), "must fail");',
              "cast_control": '_Static_assert((unsigned char)256 == 0, "cast");',
              "cast_bound_legacy": 'struct N { char n[(unsigned char)0x104]; int after; }; enum { SZ = sizeof(struct N), OFF = __builtin_offsetof(struct N, after) }; _Static_assert(SZ == 264 && OFF == 260, "legacy");',
              "cast_bound_correct": 'struct N { char n[(unsigned char)0x104]; int after; }; enum { SZ = sizeof(struct N), OFF = __builtin_offsetof(struct N, after) }; _Static_assert(SZ == 8 && OFF == 4, "correct");',
              "static_offset_cast_bound": 'struct N { char n[(unsigned char)0x104]; int after; }; _Static_assert(__builtin_offsetof(struct N, after) == 4, "cast bound");',
              "nested_bound_operand": 'struct N { char n[sizeof(int[3])]; int after; }; _Static_assert(__builtin_offsetof(struct N, after) == 12, "nested");',
          }
          targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc", "aarch64-apple-darwin", "wasm32-wasi"]
          binaries = [root / "issue-1297-baseline/build/Release/ide", pathlib.Path("build/Release/ide").resolve()]
          matched = 0
          for name, source in cases.items():
              path = witnesses / (name + ".c")
              path.write_text(source + "\n")
              for target in targets:
                  observations = []
                  for binary in binaries:
                      run = subprocess.run([str(binary), "cc", "-std=c11", "-target", target, "-fsyntax-only", path.name], cwd=witnesses, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=15)
                      if run.returncode < 0:
                          raise RuntimeError((name, target, run.returncode, run.stdout))
                      observations.append((run.returncode, run.stdout))
                  if observations[0] != observations[1]:
                      raise RuntimeError((name, target, observations))
                  matched += 1
                  print("ISSUE_1238_PARITY", name, target, "exit=" + str(observations[0][0]), "diagnostic_sha256=" + hashlib.sha256(observations[0][1]).hexdigest())
          print("ISSUE_1238_PARITY matched=" + str(matched))
          PY
