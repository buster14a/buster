name: Issue 564 canonical validation census

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/issue564-canonical-validation-census') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      BUSTER_TEST_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install profiling dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes mold valgrind
      - name: Build frozen ordinary and diagnostic producers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p issue564-evidence
          exec > >(tee issue564-evidence/build.log) 2>&1
          set -x
          git rev-parse HEAD 'HEAD^{tree}'
          git status --short
          git archive --format=tar HEAD > issue564-evidence/source.tar
          sha256sum issue564-evidence/source.tar > issue564-evidence/source.sha256
          clang --version
          cmake --version
          ninja --version
          valgrind --version
          uname -a
          lscpu
          free -b
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable build.c -o "$RUNNER_TEMP/buster-issue564-build"
          "$RUNNER_TEMP/buster-issue564-build" generate --build-directory build-prod --config Release --cc clang --ci --linker DEFAULT -DBUSTER_UNITY_BUILD=OFF -DBUSTER_INCLUDE_TESTS=OFF -DBUSTER_BENCH_ALLOCATIONS=OFF -DBUSTER_DEBUG_INFO=ON -DBUSTER_FRAME_POINTERS=ON
          "$RUNNER_TEMP/buster-issue564-build" build --build-directory build-prod --config Release -t ide -- -j2
          "$RUNNER_TEMP/buster-issue564-build" generate --build-directory build-census --config Release --cc clang --ci --linker DEFAULT -DBUSTER_UNITY_BUILD=OFF -DBUSTER_INCLUDE_TESTS=OFF -DBUSTER_BENCH_ALLOCATIONS=ON -DBUSTER_DEBUG_INFO=ON -DBUSTER_FRAME_POINTERS=ON
          "$RUNNER_TEMP/buster-issue564-build" build --build-directory build-census --config Release -t ide -- -j2
          grep -Fx 'BUSTER_BENCH_ALLOCATIONS:BOOL=OFF' build-prod/CMakeCache.txt
          grep -Fx 'BUSTER_BENCH_ALLOCATIONS:BOOL=ON' build-census/CMakeCache.txt
          cp build-prod/CMakeCache.txt build-prod/compile_commands.json issue564-evidence/
          cp build-census/CMakeCache.txt issue564-evidence/census-CMakeCache.txt
          cp build-census/compile_commands.json issue564-evidence/census-compile_commands.json
          sha256sum build-prod/Release/ide build-census/Release/ide src/buster/apps/ide/ide.c > issue564-evidence/inputs.sha256
          find build-prod/generated -type f -print0 | sort -z | xargs -0 sha256sum > issue564-evidence/generated.sha256
          git status --short
      - name: Collect exact work populations and parity
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee issue564-evidence/census.log) 2>&1
          set -x
          printf 'int add(int a, int b) { return a + b; }\n' > issue564-evidence/small.c
          sha256sum issue564-evidence/small.c >> issue564-evidence/inputs.sha256
          COMMON=(-Isrc -Ibuild-prod/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -march=znver3 -g -v)
          ./build-prod/Release/ide cc "${COMMON[@]}" -fsource-metrics=issue564-evidence/unity-prod.metrics src/buster/apps/ide/ide.c -lm -o issue564-evidence/unity-prod
          ./build-census/Release/ide cc "${COMMON[@]}" -fsource-metrics=issue564-evidence/unity-census.metrics src/buster/apps/ide/ide.c -lm -o issue564-evidence/unity-census
          cmp issue564-evidence/unity-prod issue564-evidence/unity-census
          ./build-prod/Release/ide cc -march=znver3 -g0 -O0 -c -fsource-metrics=issue564-evidence/small-prod.metrics issue564-evidence/small.c -o issue564-evidence/small-prod.o
          ./build-census/Release/ide cc -march=znver3 -g0 -O0 -c -fsource-metrics=issue564-evidence/small-census.metrics issue564-evidence/small.c -o issue564-evidence/small-census.o
          cmp issue564-evidence/small-prod.o issue564-evidence/small-census.o
          ! grep -q '^ir_construction\.' issue564-evidence/unity-prod.metrics
          ! grep -q '^ir_construction\.' issue564-evidence/small-prod.metrics
          grep -q '^ir_construction\.validation_calls=' issue564-evidence/unity-census.metrics
          grep -q '^ir_construction\.validation_calls=' issue564-evidence/small-census.metrics
          sha256sum issue564-evidence/unity-prod issue564-evidence/unity-census issue564-evidence/small-prod.o issue564-evidence/small-census.o > issue564-evidence/outputs.sha256
      - name: Attribute ordinary-producer instruction references
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee issue564-evidence/callgrind.log) 2>&1
          set -x
          COMMON=(-Isrc -Ibuild-prod/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -march=znver3 -g -v)
          valgrind --tool=callgrind --cache-sim=no --branch-sim=no --callgrind-out-file=issue564-evidence/unity.callgrind \
            ./build-prod/Release/ide cc "${COMMON[@]}" -fsource-metrics=issue564-evidence/unity-callgrind.metrics src/buster/apps/ide/ide.c -lm -o issue564-evidence/unity-callgrind
          valgrind --tool=callgrind --cache-sim=no --branch-sim=no --callgrind-out-file=issue564-evidence/small.callgrind \
            ./build-prod/Release/ide cc -march=znver3 -g0 -O0 -c -fsource-metrics=issue564-evidence/small-callgrind.metrics issue564-evidence/small.c -o issue564-evidence/small-callgrind.o
          cmp issue564-evidence/unity-prod issue564-evidence/unity-callgrind
          cmp issue564-evidence/small-prod.o issue564-evidence/small-callgrind.o
          callgrind_annotate --inclusive=yes --tree=both --threshold=0.01 issue564-evidence/unity.callgrind > issue564-evidence/unity-functions.txt
          callgrind_annotate --inclusive=no --auto=yes --threshold=0.001 issue564-evidence/unity.callgrind src/buster/lib/compiler/ir/ir.c src/buster/lib/compiler/ir/ir_fast.c > issue564-evidence/unity-lines.txt
          callgrind_annotate --inclusive=yes --tree=both --threshold=0.01 issue564-evidence/small.callgrind > issue564-evidence/small-functions.txt
          callgrind_annotate --inclusive=no --auto=yes --threshold=0.001 issue564-evidence/small.callgrind src/buster/lib/compiler/ir/ir.c src/buster/lib/compiler/ir/ir_fast.c > issue564-evidence/small-lines.txt
          sha256sum issue564-evidence/*.callgrind issue564-evidence/*-callgrind issue564-evidence/small-callgrind.o >> issue564-evidence/outputs.sha256
          git status --short
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue564-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue564-evidence
          retention-days: 14
          if-no-files-found: error
