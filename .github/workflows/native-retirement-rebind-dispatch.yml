name: Native retirement rebind dispatcher

# Trusted main decides when an exact merge-group base has landed. A missed
# completion or main push is recovered by a bounded scheduled pass.
on:
  workflow_run:
    workflows: [API migration policy]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '11-59/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: native-retirement-rebind-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      ${{ github.server_url == 'https://github.com' &&
          vars.GH_ACTIONS_CI_ENABLED == 'true' &&
          (github.event_name != 'workflow_run' ||
           (github.event.workflow_run.event == 'merge_group' &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out independently trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Dispatch ready exact groups once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B tools/native_retirement_rebind_dispatch.py \
            --repo-root . --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/native-retirement-rebind-dispatch.json"
      - name: Retain bounded dispatch decisions
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-rebind-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-retirement-rebind-dispatch.json
          if-no-files-found: ignore
          retention-days: 14
