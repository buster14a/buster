name: Indexed callback evidence
on:
  push:
    branches: [codex/3472-callback-evidence]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexed-callback-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      BUSTER_TEST_JOBS: '2'
    steps:
      - uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: ubuntu-26.04
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8132c323e6dcd9abb29b994a454a9f449ddf76c4
          persist-credentials: false
          fetch-depth: 2
      - uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          mode: source
          source-directory: .
          source-repository: ${{ github.repository }}
      - name: Hosted native bootstrap
        run: |
          mkdir -p build evidence
          git rev-parse HEAD > evidence/revision.txt
          clang --version > evidence/clang.txt
          gcc --version > evidence/gcc.txt
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -fwrapv -fno-strict-aliasing -funsigned-char build.c -o "$RUNNER_TEMP/callback-driver"
          "$RUNNER_TEMP/callback-driver" generate --ci --cc clang --no-sanitize --no-fuzz --no-lto --linker DEFAULT -- -DBUSTER_DEBUG_INFO=OFF
          "$RUNNER_TEMP/callback-driver" build --config Release -t ide
      - name: Independent C17 references
        run: |
          clang -std=c17 -O0 -Wall -Wextra -Werror tests/basic_c_indexed_callback.c -o "$RUNNER_TEMP/callback-clang-o0"
          "$RUNNER_TEMP/callback-clang-o0"
          clang -std=c17 -O2 -Wall -Wextra -Werror tests/basic_c_indexed_callback.c -o "$RUNNER_TEMP/callback-clang-o2"
          "$RUNNER_TEMP/callback-clang-o2"
          gcc -std=c17 -O0 -Wall -Wextra -Werror tests/basic_c_indexed_callback.c -o "$RUNNER_TEMP/callback-gcc-o0"
          "$RUNNER_TEMP/callback-gcc-o0"
          gcc -std=c17 -O2 -Wall -Wextra -Werror tests/basic_c_indexed_callback.c -o "$RUNNER_TEMP/callback-gcc-o2"
          "$RUNNER_TEMP/callback-gcc-o2"
      - name: Require the baseline lowering refusal in both forms
        run: |
          if build/Release/ide cc -std=c17 -target x86_64-linux -g0 -ffrontend-ssa tests/basic_c_indexed_callback.c -o "$RUNNER_TEMP/callback-baseline" > evidence/baseline-ssa.stdout 2> evidence/baseline-ssa.stderr; then
            exit 1
          fi
          rg 'could not lower logical expression core' evidence/baseline-ssa.stderr
          if build/Release/ide cc -std=c17 -target x86_64-linux -g0 -fno-frontend-ssa tests/basic_c_indexed_callback.c -o "$RUNNER_TEMP/callback-baseline" > evidence/baseline-memory.stdout 2> evidence/baseline-memory.stderr; then
            exit 1
          fi
          rg 'could not lower logical expression core' evidence/baseline-memory.stderr
      - name: Baseline fixed point
        run: |
          "$RUNNER_TEMP/callback-driver" test_self_host --config Release > evidence/self-host.log 2>&1
          cat evidence/self-host.log
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: indexed-callback-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
