name: Indexed callback retained evidence
on:
  push:
    branches: [codex/3472-callback-evidence]
permissions:
  contents: read
  actions: read
concurrency:
  group: indexed-callback-${{ github.ref }}
  cancel-in-progress: false
jobs:
  retained-records:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: buster14a/buster/.github/actions/machine-specifications@a36422384d0334a53d4be73bc306b97ccdba4768
        with:
          requested-runner: ubuntu-26.04
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 38162763526
          name: indexed-callback-baseline-38162763526-1
          path: baseline
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 38162763526
          name: indexed-callback-candidate-38162763526-1
          path: candidate
      - name: Report exact-source regression and self-host evidence
        run: |
          cat baseline/revision.txt candidate/revision.txt candidate/clang.txt candidate/gcc.txt
          grep -qx '8132c323e6dcd9abb29b994a454a9f449ddf76c4' baseline/revision.txt
          grep -qx '291ab4a4596e0612f48e5d139fd50a60d12c7929' candidate/revision.txt
          cat baseline/baseline-*.stderr baseline/minimum*.stderr baseline/invalid-*.stderr
          grep -E 'Unit tests|Module tests|External tests|TEST_MODULE_TIMING.*module=c_frontend_tests' candidate/test-all.log
          grep -F 'SELF_HOST fixed_point' baseline/self-host.log candidate/self-host.log
          cat candidate/source-size.log
      - name: Require pristine HEVC compiler actions to succeed
        run: |
          cat candidate/ffmpeg-census/receipt.txt
          hevc_records=0
          for argv in candidate/ffmpeg-census/buster/compiler-actions/*.argv; do
            if grep -F 'hevc/hevcdec.c' "$argv" > /dev/null; then
              hevc_records=$((hevc_records + 1))
              cat "$argv" "${argv%.argv}.status" "${argv%.argv}.stderr"
              for field in platform_status launch_failed timed_out output_truncated capture_failed cleanup_failed; do
                grep -qx "$field=0" "${argv%.argv}.status"
              done
            fi
          done
          test "$hevc_records" -gt 0
          grep -r -h '^cc: error:' candidate/ffmpeg-census/buster/compiler-actions --include='*.stderr' | sort -u || true
