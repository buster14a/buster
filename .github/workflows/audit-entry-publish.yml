name: Canonical entry audit patch transport

on:
  push:
    branches: [audit/pipeline-correctness-ebfdd117]
    paths: [.github/workflows/audit-entry-publish.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ebfdd11705bc470564e726857e498f1c82aa746c
          fetch-depth: 1
      - name: Apply and verify tested source tree
        shell: bash
        env:
          PATCH_SHA256: d2026ab45b528ca43aab06b5db17bca6eb46a3ec41062a6b26d39d0c656a64cd
          EXPECTED_TREE: 49b56f3d912d6820c67a076ed3f1ab92b6a45849
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != os.environ['PATCH_SHA256']:
              raise SystemExit('Patch transport digest mismatch')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'entry.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/entry.patch"
          git apply --index "$RUNNER_TEMP/entry.patch"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'Buster compiler audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(printf '%s\n' 'codegen: honor declared canonical entry blocks in native and eBPF layout' | git commit-tree "$EXPECTED_TREE" -p ebfdd11705bc470564e726857e498f1c82aa746c)
          git push origin "$commit:refs/heads/audit/prepared-canonical-entry-layout"
          printf 'Published commit: %s\nTree: %s\n' "$commit" "$EXPECTED_TREE"
