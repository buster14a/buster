name: PR 767 exact source snapshot

on:
  push:
    branches:
      - claude/clever-cori-qh0b15

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'buster14a/buster'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pack source tree
        run: tar --exclude=.git -czf "$RUNNER_TEMP/pr767-source.tar.gz" .
      - name: Upload source tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr767-source-${{ github.sha }}
          path: ${{ runner.temp }}/pr767-source.tar.gz
          retention-days: 1
          if-no-files-found: error
