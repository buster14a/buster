name: A03 source and coordination snapshot
on:
  push:
    branches: [astra/a03-20260909-transport]
    paths: [.github/workflows/a03-source.yml]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export frozen tracked source and paginated issue history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a03"
          git archive --format=tar.gz --output="$RUNNER_TEMP/a03/source.tar.gz" ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          git log -100 --format=fuller ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae > "$RUNNER_TEMP/a03/commits.txt"
          gh api --paginate --slurp 'repos/buster14a/buster/issues?state=all&per_page=100' > "$RUNNER_TEMP/a03/issues.json"
          gh api --paginate --slurp 'repos/buster14a/buster/pulls?state=all&per_page=100' > "$RUNNER_TEMP/a03/pulls.json"
          gh api --paginate --slurp 'repos/buster14a/buster/issues/comments?per_page=100' > "$RUNNER_TEMP/a03/comments.json"
          gh api --paginate --slurp 'repos/buster14a/buster/pulls/comments?per_page=100' > "$RUNNER_TEMP/a03/review-comments.json"
          printf '%s\n' 'Frozen source: ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae. Source-only snapshot; no compiler validation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a03-source-${{ github.run_id }}
          path: ${{ runner.temp }}/a03
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
