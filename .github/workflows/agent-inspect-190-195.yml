name: Temporary issue 190-195 inspection

on:
  push:
    branches:
      - agent/inspect-190-195

permissions:
  contents: read

jobs:
  export-main-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Package source
        run: tar --exclude=.git -czf /tmp/buster-main-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: buster-main-source
          path: /tmp/buster-main-source.tar.gz
          if-no-files-found: error
          retention-days: 1
