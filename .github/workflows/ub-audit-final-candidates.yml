name: UB audit integrated candidates

on:
  push:
    branches: [audit/ub-source-20260907]
    paths: [.github/workflows/ub-audit-final-candidates.yml]

permissions:
  contents: write

jobs:
  candidates:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ebfdd11705bc470564e726857e498f1c82aa746c
          fetch-depth: 64
      - name: Apply checksummed local fixes to independent branches
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/ub-final-candidates"
          mkdir -p "$OUT"
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          patches = {
              'ir': ('5a6f36d7cfacd9b90787a0d85b793a96b2ab286fed7697690ee796e7e25a1694', ''),
          }
          # The actual payloads below replace the short declaration above.
          patches['ir'] = ('5a6f36d7cfacd9b90787a0d85b793a96b2ab286fed7697690ee796e7e25a1694', '')
          patches['executable'] = ('ecf4f27e68c44847ced1b9ff3d6609d47b1461f8b5e04c4990333ad8207913fb', '')
          for name, (digest, encoded) in patches.items():
              data = gzip.decompress(base64.b64decode(encoded))
              assert hashlib.sha256(data).hexdigest() == digest, name
              (Path(os.environ['OUT']) / (name + '.patch')).write_bytes(data)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base=ebfdd11705bc470564e726857e498f1c82aa746c
          git fetch --depth=16 origin 6f96c2ba5297bd46892f6c49333b4c811f2dc8f9
          git switch --detach "$base"
          git cherry-pick 6f96c2ba5297bd46892f6c49333b4c811f2dc8f9
          git diff "$base" HEAD --check
          git branch audit/ub-integrated-rewind-235
          git switch --detach "$base"
          git apply --3way "$OUT/ir.patch"
          git diff --cached --check
          git commit -m 'ir: reject malformed call and storage graphs before dereferencing'
          git branch audit/ub-ir-candidate-62
          git switch --detach "$base"
          git apply --3way "$OUT/executable.patch"
          git diff --cached --check
          git commit -m 'codegen: avoid null zero-length executable data copies'
          git branch audit/ub-executable-candidate
          git switch --detach audit/ub-integrated-rewind-235
          git cherry-pick audit/ub-ir-candidate-62 audit/ub-executable-candidate
          git branch audit/ub-combined-candidate
          git diff "$base" HEAD --check
          git push origin audit/ub-integrated-rewind-235 audit/ub-ir-candidate-62 audit/ub-executable-candidate audit/ub-combined-candidate
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          names = ['audit/ub-integrated-rewind-235', 'audit/ub-ir-candidate-62', 'audit/ub-executable-candidate', 'audit/ub-combined-candidate']
          records = {'base': 'ebfdd11705bc470564e726857e498f1c82aa746c', 'candidates': {}}
          for name in names:
              sha = subprocess.check_output(['git', 'rev-parse', name], text=True).strip()
              tree = subprocess.check_output(['git', 'rev-parse', name + '^{tree}'], text=True).strip()
              records['candidates'][name] = {'sha': sha, 'tree': tree}
          (Path(os.environ['OUT']) / 'heads.json').write_text(json.dumps(records, indent=2) + '\n')
          PY
          git bundle create "$OUT/source.bundle" audit/ub-integrated-rewind-235 audit/ub-ir-candidate-62 audit/ub-executable-candidate audit/ub-combined-candidate
          if test -f .git/shallow; then cp .git/shallow "$OUT/shallow.txt"; fi
          git archive --format=tar.gz -o "$OUT/source.tar.gz" HEAD
          cd "$OUT"
          sha256sum source.bundle source.tar.gz ir.patch executable.patch > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ub-final-candidates
          path: ${{ runner.temp }}/ub-final-candidates/
          if-no-files-found: error
          retention-days: 3
