name: Issue 360 checked publication
on:
  push:
    branches: [work/360-source-snapshot]
    paths: [.github/issue360.patch.gz.b64, .github/workflows/issue360-source-snapshot.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and publish the isolated product tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, os
          payload = pathlib.Path('.github/issue360.patch.gz.b64').read_text().strip()
          # Correct the three transport-only transcription errors found by
          # comparing the downloaded payload against the original local file.
          assert len(payload) == 15676
          for start, end, before, after in [(4225, 4225, '', 't'), (3944, 3948, 'f2GT', ''), (1574, 1575, 't', '')]:
              assert payload[start:end] == before
              payload = payload[:start] + after + payload[end:]
          assert hashlib.sha256(payload.encode()).hexdigest() == 'b8480f3f0d313cd8eb509785eb357fa606ba759226170b602e58512691f9cacc'
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '724bde42b630b1ef3350e9bb3138286d00d035a810269e06d0b87bd24ea4509d'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'issue360.patch').write_bytes(patch)
          PY
          base=d00ba87da23737a945a899f7304ac00b40a1ee04
          branch=fix/360-public-aapcs64-va-list
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$base"
          git checkout --detach "$base"
          test "$(git rev-parse HEAD^{tree})" = 151580fd128c806b632de7fa941bb875fcfc5fba
          git apply --check --whitespace=error-all "$RUNNER_TEMP/issue360.patch"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/issue360.patch"
          test "$(git write-tree)" = fa9f7039b6cb0b8c6ae719cbf0741d5ec26b1a15
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'codegen: use public ELF AAPCS64 variable-argument lists'
          git push origin "HEAD:refs/heads/$branch"
          printf 'Published %s\nTree %s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
