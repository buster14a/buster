name: Issue 360 source snapshot
on:
  push:
    branches: [work/360-source-snapshot]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: d00ba87da23737a945a899f7304ac00b40a1ee04
          fetch-depth: 1
          persist-credentials: false
      - name: Export immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d00ba87da23737a945a899f7304ac00b40a1ee04
          mkdir -p "$RUNNER_TEMP/issue360-source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/issue360-source/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/issue360-source/identity.txt"
          sha256sum "$RUNNER_TEMP/issue360-source/source.tar.gz" >> "$RUNNER_TEMP/issue360-source/identity.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue360-source-d00ba87d
          path: ${{ runner.temp }}/issue360-source/
          if-no-files-found: error
          retention-days: 7
