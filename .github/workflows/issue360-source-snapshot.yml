name: Issue 360 test tools
on:
  push:
    branches: [work/360-source-snapshot]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download distribution test tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue360-tools"
          cd "$RUNNER_TEMP/issue360-tools"
          apt-get download qemu-user-static tcc
          sha256sum ./*.deb > packages.sha256
          for package in ./*.deb; do dpkg-deb -f "$package" Package Version Architecture; done > packages.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue360-test-tools
          path: ${{ runner.temp }}/issue360-tools/
          if-no-files-found: error
          retention-days: 7
