name: Apply PR 94 arena capacity diagnostics

on:
  push:
    branches:
      - claude/unruffled-bhabha-f5d28a

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.repository == 'buster14a/buster' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Instrument build-driver arena capacity failures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement site, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "build.c",
              """#include <buster/lib/string.c>
          #include <buster/lib/os.c>
          #include <buster/lib/arena.c>
          """,
              """#include <buster/lib/string.c>
          #include <buster/lib/os.c>
          #define BUSTER_ARENA_CAPACITY_DIAGNOSTICS 1
          #include <buster/lib/arena.c>
          """,
          )

          replace_once(
              "src/buster/lib/arena.c",
              """    u64 aligned_size_after = aligned_offset + size;
              BUSTER_CHECK(aligned_size_after <= arena->reserved_size);
          """,
              """    u64 aligned_size_after = aligned_offset + size;
          #if defined(BUSTER_ARENA_CAPACITY_DIAGNOSTICS) && BUSTER_ARENA_CAPACITY_DIAGNOSTICS
              if (BUSTER_UNLIKELY(aligned_size_after > arena->reserved_size))
              {
                  fprintf(stderr,
                          \"ARENA_CAPACITY position=%llu aligned_offset=%llu size=%llu alignment=%llu aligned_after=%llu reserved=%llu os_position=%llu dirty_position=%llu\\n\",
                          (unsigned long long)arena->position, (unsigned long long)aligned_offset, (unsigned long long)size,
                          (unsigned long long)alignment, (unsigned long long)aligned_size_after, (unsigned long long)arena->reserved_size,
                          (unsigned long long)arena->os_position, (unsigned long long)arena->dirty_position);
                  fflush(stderr);
              }
          #endif
              BUSTER_CHECK(aligned_size_after <= arena->reserved_size);
          """,
          )
          PY

      - name: Commit diagnostics and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-pr94-capacity-diagnostics.yml
          git config user.name "David"
          git config user.email "davidgmbb@gmail.com"
          git add build.c src/buster/lib/arena.c .github/workflows/apply-pr94-capacity-diagnostics.yml
          git diff --cached --check
          git commit -m "ci: diagnose build-driver arena capacity failures"
          git push origin "HEAD:${GITHUB_REF_NAME}"
