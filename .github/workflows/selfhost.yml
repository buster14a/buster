name: Self-host qualification

# The qualification runs entirely on GitHub-hosted runners, so that it never
# takes the shared 9700X from other work. It runs when the gate, the build
# script or the correctness inventory changes, on the daily schedule (to catch
# compiler drift), and on manual dispatch. It is not a required per-PR check.
on:
  pull_request:
    paths:
      - '.github/workflows/selfhost.yml'
      - 'tools/ci/selfhost.c'
      - 'tests/ci/selfhost.c'
      - 'tools/ci/correctness.tests'
      - 'tools/ci/setup-hosted.sh'
      - 'src/buster/compiler/host_isa.h'
      - 'build.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/selfhost.yml'
      - 'tools/ci/selfhost.c'
      - 'tests/ci/selfhost.c'
      - 'tools/ci/correctness.tests'
      - 'tools/ci/setup-hosted.sh'
      - 'src/buster/compiler/host_isa.h'
      - 'build.sh'
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buster-selfhost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    name: Self-host harness regression tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check the real inventory and the harness, including fatal sanitizers
        env:
          TMPDIR: ${{ runner.temp }}
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          cc -std=c17 -O2 -Wall -Wextra -Werror -fno-strict-aliasing tools/ci/selfhost.c -o "$RUNNER_TEMP/selfhost"
          "$RUNNER_TEMP/selfhost" --check-inventory
          cc -std=c17 -O1 -g -Wall -Wextra -Werror -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all tests/ci/selfhost.c -o "$RUNNER_TEMP/test-selfhost"
          "$RUNNER_TEMP/test-selfhost"

      - name: Preserve harness failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selfhost-harness-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selfhost-tests.*
          if-no-files-found: warn
          retention-days: 7

  bootstrap:
    name: Self-host bootstrap and probe equivalence
    needs: harness
    runs-on: ubuntu-26.04
    # This is an initial budget on a hosted runner, not a throughput acceptance
    # threshold. The first artifact records the actual cost; 900 s bounds each
    # subprocess.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: native
      BUSTER_DEBUG_INFO: '0'
      BUSTER_SANITIZER: none
      BUSTER_FUZZ_AVAILABLE: '0'
      BUSTER_FUZZ_ENTRY: ''
      BUSTER_BUILD_DEFINES: ''
      BUSTER_HOST_RUNTIME: ''
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Record the host and select the compiler path
        id: host
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/selfhost-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$artifacts"
          host_compiler=clang
          command -v clang >/dev/null 2>&1 || host_compiler=cc
          {
              printf 'revision=%s\n' "$GITHUB_SHA"
              printf 'event=%s\n' "$GITHUB_EVENT_NAME"
              printf 'host_arch=%s\n' "$BUSTER_HOST_ARCH"
              printf 'host_check_compiler=%s\n' "$host_compiler"
              uname -a
              "$host_compiler" --version
              grep -m1 '^model name[[:space:]]*:' /proc/cpuinfo
              printf 'available_cpus=%s\n' "$(nproc)"
          } > "$artifacts/metadata.txt"
          defines=$("$host_compiler" -march="$BUSTER_HOST_ARCH" -Isrc -dM -E -include src/buster/compiler/host_isa.h -x c /dev/null)
          if grep -q '^#define BUSTER_HOST_VECTOR 1$' <<< "$defines"; then
              printf 'host_path=vector\n' >> "$artifacts/metadata.txt"
              printf 'vector=1\n' >> "$GITHUB_OUTPUT"
          else
              printf 'host_path=scalar\n' >> "$artifacts/metadata.txt"
              printf 'vector=0\n' >> "$GITHUB_OUTPUT"
              printf '%s\n' '::warning::This hosted runner has no complete host vector path; the self-host bootstrap is skipped because baseline self-hosting is blocked by #1108.'
          fi

      - name: Stage the official Clang 23 toolchain
        if: steps.host.outputs.vector == '1'
        run: |
          set -euo pipefail
          bash tools/ci/setup-hosted.sh
          artifacts="$RUNNER_TEMP/selfhost-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
              printf 'official_toolchain:\n'
              clang --version
          } >> "$artifacts/metadata.txt"

      - name: Build stage 1 and qualify the self-host
        if: steps.host.outputs.vector == '1'
        run: |
          set -euo pipefail
          unset CPATH C_INCLUDE_PATH
          artifacts="$RUNNER_TEMP/selfhost-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Redirect before consuming; process substitution would hide an exporter failure.
          ./build.sh print-sources > "$artifacts/sources.argv"
          ./build.sh print-compile-flags > "$artifacts/flags.argv"
          ./build.sh 2>&1 | tee "$artifacts/build.log"
          sha256sum build/compiler tools/ci/selfhost.c >> "$artifacts/metadata.txt"
          clang -std=c17 -O2 -Wall -Wextra -Werror -fno-strict-aliasing tools/ci/selfhost.c -o "$artifacts/qualify"
          "$artifacts/qualify" "$PWD/build/compiler" "$artifacts/sources.argv" "$artifacts/flags.argv" "$artifacts/result" 900 2>&1 | tee "$artifacts/qualification.log"
          test -s "$artifacts/result/PASS"

      - name: Publish the qualification summary
        if: always()
        run: |
          artifacts="$RUNNER_TEMP/selfhost-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -s "$artifacts/result/PASS" ]; then
              cat "$artifacts/result/summary.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ '${{ steps.host.outcome }}' = 'success' ] && [ '${{ steps.host.outputs.vector }}' != '1' ]; then
              printf '%s\n' \
                  '## Self-host qualification' \
                  '' \
                  'SKIPPED: this hosted runner does not expose the complete host vector feature set,' \
                  'and baseline self-hosting is still blocked by #1108. The harness regression job still ran.' \
                  >> "$GITHUB_STEP_SUMMARY"
          else
              printf '## Self-host qualification\n\nFAILED or interrupted before completion. See command logs and partial timings in the artifact.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve inputs, timings and both sides of every probe comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selfhost-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/selfhost-${{ github.run_id }}-${{ github.run_attempt }}/metadata.txt
            ${{ runner.temp }}/selfhost-${{ github.run_id }}-${{ github.run_attempt }}/*.argv
            ${{ runner.temp }}/selfhost-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/selfhost-${{ github.run_id }}-${{ github.run_attempt }}/result/*.log
            ${{ runner.temp }}/selfhost-${{ github.run_id }}-${{ github.run_attempt }}/result/timings.tsv
            ${{ runner.temp }}/selfhost-${{ github.run_id }}-${{ github.run_attempt }}/result/summary.md
            ${{ runner.temp }}/selfhost-${{ github.run_id }}-${{ github.run_attempt }}/result/PASS
            ${{ runner.temp }}/selfhost-${{ github.run_id }}-${{ github.run_attempt }}/result/probe-*
            LICENSE
            THIRD_PARTY_NOTICES.md
            LICENSES/
          if-no-files-found: warn
          retention-days: 14
