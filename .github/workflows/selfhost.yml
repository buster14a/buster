name: Self-host qualification

# The qualification runs entirely on GitHub-hosted runners, so that it never
# takes the shared 9700X from other work. It runs when the gate, the build's
# description or the correctness inventory changes, on the daily schedule (to catch
# compiler drift), and on manual dispatch. It is not a required per-PR check; a
# merge-queue candidate whose change touches these paths calls it, and the
# required aggregate then needs it (#1430). The daily schedule also seeds main's
# hosted input caches through prepare-hosted-tools.yml.
on:
  pull_request:
    paths:
      - '.github/workflows/selfhost.yml'
      - 'tools/ci/selfhost.c'
      - 'tests/ci/selfhost.c'
      - 'tools/ci/correctness.tests'
      - 'tools/ci/setup-hosted.sh'
      - 'tools/ci/hosted-offline.sh'
      - 'tools/ci/hosted-release.sh'
      - 'tools/ci/hosted-tools.lock'
      - 'tools/ci/install-hosted-tools.sh'
      - '.github/actions/hosted-tools/action.yml'
      - '.github/workflows/prepare-hosted-tools.yml'
      - 'src/buster/compiler/host_isa.h'
      - 'build.sh'
      - 'CMakeLists.txt'
      - 'cmake/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/selfhost.yml'
      - 'tools/ci/selfhost.c'
      - 'tests/ci/selfhost.c'
      - 'tools/ci/correctness.tests'
      - 'tools/ci/setup-hosted.sh'
      - 'tools/ci/hosted-offline.sh'
      - 'tools/ci/hosted-release.sh'
      - 'tools/ci/hosted-tools.lock'
      - 'tools/ci/install-hosted-tools.sh'
      - '.github/actions/hosted-tools/action.yml'
      - '.github/workflows/prepare-hosted-tools.yml'
      - 'src/buster/compiler/host_isa.h'
      - 'build.sh'
      - 'CMakeLists.txt'
      - 'cmake/**'
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
  # A merge-queue candidate calls this workflow whole where its change touches a path the pull_request trigger above
  # lists (9700x.yml's auxiliary-selfhost job, which tools/ci/changes.c decides from that list; #1430).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: buster-selfhost-${{ github.event.pull_request.number || (github.event_name == 'merge_group' && format('queue-{0}', github.run_id)) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    name: Self-host harness regression tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check the real inventory and the harness, including fatal sanitizers
        env:
          TMPDIR: ${{ runner.temp }}
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          cc -std=c17 -O2 -Wall -Wextra -Werror -fno-strict-aliasing tools/ci/selfhost.c -o "$RUNNER_TEMP/selfhost"
          "$RUNNER_TEMP/selfhost" --check-inventory
          cc -std=c17 -O1 -g -Wall -Wextra -Werror -fno-strict-aliasing -fsanitize=address,undefined -fno-sanitize-recover=all tests/ci/selfhost.c -o "$RUNNER_TEMP/test-selfhost"
          "$RUNNER_TEMP/test-selfhost"

      - name: Preserve harness failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selfhost-harness-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selfhost-tests.*
          if-no-files-found: warn
          retention-days: 7

  # One verified release-input acquisition for both bootstrap rows.
  prepare-hosted-tools:
    uses: ./.github/workflows/prepare-hosted-tools.yml

  bootstrap:
    name: Self-host bootstrap and probe equivalence (${{ matrix.host_arch }})
    needs: [harness, prepare-hosted-tools]
    runs-on: ubuntu-26.04
    # This is an initial budget on a hosted runner, not a throughput acceptance
    # threshold. The first artifact records the actual cost; 900 s bounds each
    # subprocess.
    timeout-minutes: 120
    # native needs the complete host vector path, which a hosted runner may lack
    # (the job then skips); x86-64 is the baseline scalar host (#1193), whose
    # units compile at -march=x86-64 on every runner.
    strategy:
      fail-fast: false
      matrix:
        host_arch: [native, x86-64]
    defaults:
      run:
        shell: bash
    env:
      BUSTER_HOST_ARCH: ${{ matrix.host_arch }}
      BUSTER_DEBUG_INFO: '0'
      BUSTER_SANITIZER: none
      BUSTER_FUZZ_AVAILABLE: '0'
      BUSTER_FUZZ_ENTRY: ''
      BUSTER_BUILD_DEFINES: ''
      BUSTER_HOST_RUNTIME: ''
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Record the host and select the compiler path
        id: host
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/selfhost-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$artifacts"
          host_compiler=clang
          command -v clang >/dev/null 2>&1 || host_compiler=cc
          {
              printf 'revision=%s\n' "$GITHUB_SHA"
              printf 'event=%s\n' "$GITHUB_EVENT_NAME"
              printf 'host_arch=%s\n' "$BUSTER_HOST_ARCH"
              printf 'host_check_compiler=%s\n' "$host_compiler"
              uname -a
              "$host_compiler" --version
              grep -m1 '^model name[[:space:]]*:' /proc/cpuinfo
              printf 'available_cpus=%s\n' "$(nproc)"
          } > "$artifacts/metadata.txt"
          defines=$("$host_compiler" -march="$BUSTER_HOST_ARCH" -Isrc -dM -E -include src/buster/compiler/host_isa.h -x c /dev/null)
          if grep -q '^#define BUSTER_HOST_VECTOR 1$' <<< "$defines"; then
              printf 'host_path=vector\n' >> "$artifacts/metadata.txt"
              printf 'run=1\n' >> "$GITHUB_OUTPUT"
          elif [ "$BUSTER_HOST_ARCH" = x86-64 ]; then
              printf 'host_path=scalar\n' >> "$artifacts/metadata.txt"
              printf 'run=1\n' >> "$GITHUB_OUTPUT"
          else
              printf 'host_path=scalar\n' >> "$artifacts/metadata.txt"
              printf 'run=0\n' >> "$GITHUB_OUTPUT"
              printf '%s\n' '::warning::This hosted runner has no complete host vector path; the native self-host bootstrap is skipped. The x86-64 bootstrap qualifies the scalar host path.'
          fi

      - name: Restore verified hosted release inputs
        if: steps.host.outputs.run == '1'
        uses: ./.github/actions/hosted-tools
        with:
          artifact-name: ${{ needs.prepare-hosted-tools.outputs.artifact-name }}

      - name: Stage the official Clang 23 toolchain
        if: steps.host.outputs.run == '1'
        run: bash tools/ci/setup-hosted.sh

      - name: Verify the staged official Clang and host path
        if: steps.host.outputs.run == '1'
        run: |
          set -euo pipefail
          test -n "${BUSTER_CLANG_RESOURCE_DIR:-}"
          llvm_root="${BUSTER_CLANG_RESOURCE_DIR%/lib/clang/*}"
          test -x "$llvm_root/bin/clang"
          artifacts="$RUNNER_TEMP/selfhost-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
              printf 'official_toolchain:\n'
              "$llvm_root/bin/clang" --version
          } >> "$artifacts/metadata.txt"
          defines=$("$llvm_root/bin/clang" -march="$BUSTER_HOST_ARCH" -Isrc -dM -E -include src/buster/compiler/host_isa.h -x c /dev/null)
          if [ "$BUSTER_HOST_ARCH" = x86-64 ]; then
              if grep -q '^#define BUSTER_HOST_VECTOR 1$' <<< "$defines"; then
                  printf '%s\n' '::error::The staged official Clang selects the host vector path at -march=x86-64; the baseline bootstrap must qualify the scalar host path.'
                  exit 1
              fi
          elif ! grep -q '^#define BUSTER_HOST_VECTOR 1$' <<< "$defines"; then
              printf '%s\n' '::error::The staged official Clang does not select the complete host vector path for the native bootstrap.'
              exit 1
          fi

      - name: Build stage 1 and qualify the self-host
        if: steps.host.outputs.run == '1'
        run: |
          set -euo pipefail
          unset CPATH C_INCLUDE_PATH
          llvm_root="${BUSTER_CLANG_RESOURCE_DIR%/lib/clang/*}"
          export PATH="$llvm_root/bin:$PATH"
          test "$(clang -dumpversion)" = "23.1.4"
          artifacts="$RUNNER_TEMP/selfhost-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Redirect before consuming; process substitution would hide an exporter failure.
          ./build.sh print-sources > "$artifacts/sources.argv"
          ./build.sh print-compile-flags > "$artifacts/flags.argv"
          ./build.sh --config Release 2>&1 | tee "$artifacts/build.log"
          # The Release configuration's own executable, which build/compiler is too.
          compiler=$(./build.sh print-output --config Release)
          test build/compiler -ef "$compiler"
          sha256sum "$compiler" tools/ci/selfhost.c >> "$artifacts/metadata.txt"
          clang -std=c17 -O2 -Wall -Wextra -Werror -fno-strict-aliasing tools/ci/selfhost.c -o "$artifacts/qualify"
          "$artifacts/qualify" "$compiler" "$artifacts/sources.argv" "$artifacts/flags.argv" "$artifacts/result" 900 2>&1 | tee "$artifacts/qualification.log"
          test -s "$artifacts/result/PASS"

      - name: Publish the qualification summary
        if: always()
        run: |
          artifacts="$RUNNER_TEMP/selfhost-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -s "$artifacts/result/PASS" ]; then
              cat "$artifacts/result/summary.md" >> "$GITHUB_STEP_SUMMARY"
              printf '\nHost path: `BUSTER_HOST_ARCH=%s`.\n' "$BUSTER_HOST_ARCH" >> "$GITHUB_STEP_SUMMARY"
          elif [ '${{ steps.host.outcome }}' = 'success' ] && [ '${{ steps.host.outputs.run }}' != '1' ]; then
              printf '%s\n' \
                  "## Self-host qualification ($BUSTER_HOST_ARCH)" \
                  '' \
                  'SKIPPED: this hosted runner does not expose the complete host vector feature set.' \
                  'The x86-64 bootstrap qualifies the scalar host path, and the harness regression job still ran.' \
                  >> "$GITHUB_STEP_SUMMARY"
          else
              printf '## Self-host qualification (%s)\n\nFAILED or interrupted before completion. See command logs and partial timings in the artifact.\n' "$BUSTER_HOST_ARCH" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve inputs, timings and both sides of every probe comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selfhost-${{ matrix.host_arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/selfhost-${{ github.run_id }}-${{ github.run_attempt }}/metadata.txt
            ${{ runner.temp }}/selfhost-${{ github.run_id }}-${{ github.run_attempt }}/*.argv
            ${{ runner.temp }}/selfhost-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/selfhost-${{ github.run_id }}-${{ github.run_attempt }}/result/*.log
            ${{ runner.temp }}/selfhost-${{ github.run_id }}-${{ github.run_attempt }}/result/timings.tsv
            ${{ runner.temp }}/selfhost-${{ github.run_id }}-${{ github.run_attempt }}/result/summary.md
            ${{ runner.temp }}/selfhost-${{ github.run_id }}-${{ github.run_attempt }}/result/PASS
            ${{ runner.temp }}/selfhost-${{ github.run_id }}-${{ github.run_attempt }}/result/probe-*
            LICENSE
            THIRD_PARTY_NOTICES.md
            LICENSES/
          if-no-files-found: warn
          retention-days: 14
