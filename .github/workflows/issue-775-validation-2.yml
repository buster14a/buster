name: Issue 775 target and transport validation
on:
  push:
    branches: [codex/775-baseline-vectors]
    paths: [.github/workflows/issue-775-validation-2.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/775-baseline-vectors
      - id: source
        shell: bash
        env:
          PATCH: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, base64, gzip, hashlib, pathlib
          patch=gzip.decompress(base64.b64decode(os.environ['PATCH']))
          assert hashlib.sha256(patch).hexdigest()=='5700c445752ac97cdd4282b8a2dabdfdf777f4f79fe18169560337321d205dfd'
          pathlib.Path('/tmp/issue775.patch').write_bytes(patch)
          PY
          git apply --check /tmp/issue775.patch
          git apply /tmp/issue775.patch
          git diff --check
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git add src/buster/compiler
          env -u BUSTER_DCO_SIGN_OFF git commit -m 'test(tier0): qualify SSE2 and AVX transport including full floating windows'
          git push origin HEAD:refs/heads/codex/775-baseline-vectors
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: apply
    runs-on:
      group: buster-9700x-service-dispatch
      labels: [self-hosted, Linux, X64, buster-zen5, ryzen-9700x]
    timeout-minutes: 20
    env:
      BUSTER_HOST_ARCH: znver5
      BUSTER_DEBUG_INFO: 0
      BUSTER_ORACLE_CACHE: check
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - run: bash tools/ci/setup-benchpress.sh
      - name: Build and validate under the runner hook's shared lock
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/issue775"
          taskset -c 0-7 ./build.sh > "$RUNNER_TEMP/issue775/build.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/issue775/build.log"
          if [ "$result" -eq 0 ]; then
            taskset -c 2 ./build/compiler test-tier0 > "$RUNNER_TEMP/issue775/tier0.log" 2>&1
            a=$?
            taskset -c 2 ./build/compiler test-checker --program-vectors > "$RUNNER_TEMP/issue775/vectors.log" 2>&1
            b=$?
            taskset -c 2 ./build/compiler test-x86-target > "$RUNNER_TEMP/issue775/target.log" 2>&1
            c=$?
            cat "$RUNNER_TEMP/issue775/tier0.log" "$RUNNER_TEMP/issue775/vectors.log" "$RUNNER_TEMP/issue775/target.log"
            printf 'tier0=%s vectors=%s target=%s\n' "$a" "$b" "$c"
            result=$((a | b | c))
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/issue775/commit.txt"
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue775-validation-2
          path: ${{ runner.temp }}/issue775
          retention-days: 7
