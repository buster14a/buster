name: Issue 1251 temporary workspace
on:
  push:
    branches: [agent-workspace/issue-1251-astra]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'buster14a/buster' && github.ref == 'refs/heads/agent-workspace/issue-1251-astra'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 441db2428d2bd8d28503037b28c1b3740fe4b25a
          persist-credentials: false
      - name: Export the pinned source for issue 1251
        shell: bash
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/issue-1251-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1251-source
          path: ${{ runner.temp }}/issue-1251-source.tar.gz
          retention-days: 1
          if-no-files-found: error
