name: Archive DWARF line proof for issue 3031
on:
  push:
    branches: [verify/3031-dwarf-lines]
permissions:
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Transfer the verified public reader output for the measurement record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/buster14a/buster/actions/artifacts/14568752549/zip" > "$RUNNER_TEMP/matrices.zip"
          cd "$RUNNER_TEMP"
          echo '6597c92e3a7bb3f180b7d1f4d17546c9f9a92823c423e07f43cc075add631979  matrices.zip' | sha256sum -c -
          echo matrix-archive-start
          base64 -w 120 matrices.zip
          echo matrix-archive-end
