name: DWARF line producer evidence for issue 3031
on:
  push:
    branches: [verify/3031-dwarf-lines]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      BUSTER_HOST_ARCH: vector
      BUSTER_SANITIZER: none
      BUSTER_SANITIZER_OPTIMIZATION: 3
      BUSTER_DEBUG_INFO: 0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 6427879e1143026a12fb0388a20bdea1fe4b2bc5
          persist-credentials: false
      - name: Check the runner against the repository's vector predicate
        run: |
          lscpu | sed -n '/Model name:/p'
          cc -std=c17 -O2 -march=x86-64-v4 -maes -mgfni -mvaes -mavx512vbmi -mavx512vbmi2 -mavx512vpopcntdq -mavx512bitalg -mavx512vnni tools/ci/vector-probe.c -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"
      - uses: ./.github/actions/hosted-tools
      - run: bash tools/ci/setup-hosted.sh
      - name: Compare ordinary objects, linked programs, and the producer stress fixture
        run: |
          set -euo pipefail
          clang --version
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA" c069387bc2f00da4dce7683c32db99196340bfd1
          harness="$RUNNER_TEMP/line-harness"
          mkdir -p "$harness"
          for f in compare.sh rows.c; do git show "$GITHUB_SHA:.verify-3031/$f" > "$harness/$f"; done
          bash "$harness/compare.sh" 6427879e1143026a12fb0388a20bdea1fe4b2bc5 c069387bc2f00da4dce7683c32db99196340bfd1 "$RUNNER_TEMP/line-evidence"
      - name: Preserve independent reader output
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: decoded-lines-and-fixups
          path: |
            ${{ runner.temp }}/line-evidence/**/*.dump
            ${{ runner.temp }}/line-evidence/**/*.program
            ${{ runner.temp }}/line-evidence/**/*.matrix
            ${{ runner.temp }}/line-evidence/**/*.verify
            ${{ runner.temp }}/line-evidence/**/*.reloc
          if-no-files-found: ignore
          retention-days: 14
