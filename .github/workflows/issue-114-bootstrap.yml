name: Issue 114 bootstrap

on:
  push:
    branches:
      - codex/issue-114

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/issue-114
          fetch-depth: 1
      - name: Install generator dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y tcc
      - name: Validate repository patch
        run: git diff --check HEAD^ HEAD
      - name: Configure
        run: ./build.sh generate
      - name: Release test suite
        run: ./build.sh build --config Release -t test_all
