name: Issue 114 bootstrap

on:
  push:
    branches:
      - codex/issue-114

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/issue-114
          fetch-depth: 0
          persist-credentials: false
      - name: Create repository bundle
        run: git bundle create "$RUNNER_TEMP/buster-issue-114.bundle" HEAD refs/remotes/origin/main
      - name: Upload repository bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: buster-issue-114-source
          path: ${{ runner.temp }}/buster-issue-114.bundle
          if-no-files-found: error
          retention-days: 1
