name: Issue 668 transport

on:
  push:
    branches: [codex/issue-668-transport]
    paths: [.github/workflows/issue-668-transport.yml]

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Read authored transport payload
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: transport
          persist-credentials: false
      - name: Checkout immutable implementation baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: b8dd9857c0b8b5dcfc4f1e45159cf4155d26b19f
          path: candidate
      - name: Verify, apply and publish only implementation files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode transport/.github/issue-668.patch.b64 | gzip --decompress > "$RUNNER_TEMP/issue-668.patch"
          printf '2f7ffd40279919b30e109b0ce4e29f19da803e2072ddaa43a1842e2737f59cf5  %s\n' "$RUNNER_TEMP/issue-668.patch" | sha256sum --check --strict
          cd candidate
          test "$(git rev-parse HEAD)" = b8dd9857c0b8b5dcfc4f1e45159cf4155d26b19f
          git apply --check "$RUNNER_TEMP/issue-668.patch"
          git apply --index "$RUNNER_TEMP/issue-668.patch"
          git diff --cached --check
          printf '%s\n' src/buster/lib/compiler/frontend/c/c_gen.c src/buster/tests/compiler/driver/driver_test.c src/buster/tests/compiler/frontend/c/c_test.c > "$RUNNER_TEMP/expected-paths"
          git diff --cached --name-only > "$RUNNER_TEMP/actual-paths"
          cmp "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          test "$(git hash-object src/buster/lib/compiler/frontend/c/c_gen.c)" = 938ae7efb52bfad52abe8812f538a4ce64c9956c
          test "$(git hash-object src/buster/tests/compiler/frontend/c/c_test.c)" = c8efe6e98bb1fd72175645746a1084ee849d8433
          test "$(git hash-object src/buster/tests/compiler/driver/driver_test.c)" = 2a3565c309ebfa0b6b72c8353925ec187374183f
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'c: reject wide hexadecimal accumulator overflow explicitly'
          git push origin HEAD:refs/heads/codex/668-wide-hex-overflow
          git rev-parse HEAD
          git show --stat --oneline HEAD
          printf 'Issue 668 implementation commit: `%s`\n\nOnly the three verified source/test files were published. No transport workflow or payload is included. This job is publication, not test evidence.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
