name: "Buster #604 producer qualification"

# Temporary, qualification-branch-only measurement of the native Release
# producer. This is evidence collection, not a production profile selection or
# replacement correctness gate. It must never run for a pull request or another
# branch.
on:
  push:
    branches:
      - luna/604-producer-qualification-20260914

permissions:
  contents: read

concurrency:
  group: ci-604-producer-qualification-${{ github.ref }}
  # Keep an in-flight evidence run for reproducibility; a later push must not
  # discard the only partial/diagnostic artifact from this expensive screen.
  cancel-in-progress: false

jobs:
  qualify:
    name: "#604 producer qualification (${{ matrix.name }})"
    if: ${{ github.event_name == 'push' && github.repository == 'buster14a/buster' && github.ref == 'refs/heads/luna/604-producer-qualification-20260914' && github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      BUSTER_604_RUNNER: ${{ matrix.runner }}
      BUSTER_604_ARCH: ${{ matrix.arch }}
      CFLAGS: -Wno-invalid-feature-combination
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-26.04
            os: linux
            arch: x86_64
          - name: Linux AArch64
            runner: ubuntu-26.04-arm
            os: linux
            arch: aarch64
          - name: macOS x86-64
            runner: macos-26-intel
            os: macos
            arch: x86_64
          - name: macOS AArch64
            runner: macos-26
            os: macos
            arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Assert workflow command budgets
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci-604-producer-qualification.yml')
          lines = p.read_text(encoding='utf-8').splitlines()
          blocks = []
          for i, line in enumerate(lines):
              if line != '        run: |':
                  continue
              body = []
              for item in lines[i + 1:]:
                  if item.startswith('          '):
                      body.append(item[10:])
                  elif not item.strip():
                      body.append('')
                  else:
                      break
              blocks.append('\n'.join(body) + '\n')
          assert blocks, 'no run blocks found'
          lengths = [len(block) for block in blocks]
          assert max(lengths) < 20500, f'run block exceeds GitHub limit: {lengths}'
          assert ' --cpu' + ' auto' not in ''.join(blocks), 'portable hosted throughput must use the default CPU policy'
          print(f'run_blocks={len(blocks)} max_chars={max(lengths)}')
          PY

      - name: Prepare #604 qualification
        id: prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          root="$RUNNER_TEMP/buster-604-qualification"
          profiles="$root/profiles"; recovery="$root/recovery"; evidence="$root/evidence"; throughput="$root/throughput"; diagnostics="$root/diagnostics"; bin="$root/bin"; curated="$root/curated"
          mkdir -p "$profiles" "$recovery" "$evidence" "$throughput" "$diagnostics" "$bin" "$curated"
          now_ns() { python3 -c 'import time; print(time.time_ns())'; }
          printf 'repetition\tposition\tprofile\tstage\tstatus\n' > "$root/results.tsv"
          printf 'repetition\tposition\tprofile\torder\tbuild_directory\tevidence_directory\n' > "$root/profile-order.tsv"
          printf 'attempt\tbaseline\tcandidate\toutput\n' > "$root/throughput-attempts.tsv"
          printf 'timestamp_utc\tstage\tcompleted\ttotal\telapsed_ns\n' > "$root/progress.tsv"
          started="$(now_ns)"; source_sha="$(git rev-parse HEAD)"; source_tree="$(git rev-parse HEAD^{tree})"; workflow_blob="$(git hash-object .github/workflows/ci-604-producer-qualification.yml)"
          printf '%s\n' "$source_sha" > "$root/source-sha"; printf '%s\n' "$source_tree" > "$root/source-tree"; printf '%s\n' "$workflow_blob" > "$root/workflow-blob"; printf '%s\n' "$started" > "$root/job-start-ns"
          {
            printf 'source_sha=%s\nsource_tree=%s\nworkflow_blob=%s\ngithub_sha=%s\n' "$source_sha" "$source_tree" "$workflow_blob" "${GITHUB_SHA:-unknown}"
            printf 'github_run_id=%s\ngithub_run_attempt=%s\n' "${GITHUB_RUN_ID:-unknown}" "${GITHUB_RUN_ATTEMPT:-unknown}"
            printf 'image_os=%s\nimage_version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            printf 'runner=%s\nrunner_os=%s\nrunner_arch=%s\nmatrix_arch=%s\nstarted_at_utc=%s\n' "$BUSTER_604_RUNNER" "$RUNNER_OS" "$RUNNER_ARCH" "$BUSTER_604_ARCH" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            printf '\n-- uname --\n'; uname -a; printf '\n-- compiler --\n'; command -v clang; clang --version; clang -dumpmachine
            printf '\n-- cmake --\n'; command -v cmake; cmake --version; printf '\n-- ninja --\n'; command -v ninja; ninja --version; printf '\n-- python --\n'; command -v python3; python3 --version
            printf '\n-- cpu and memory --\n'; getconf _NPROCESSORS_ONLN || true
            if [[ "$RUNNER_OS" == macOS ]]; then
              if ! sysctl -n hw.logicalcpu; then :; fi
              if ! sysctl -n hw.memsize; then :; fi
              printf 'cpu_model_hw_model='
              if ! sysctl -n hw.model; then printf unknown; fi
              printf '\n'
              printf 'cpu_model_brand='
              if ! sysctl -n machdep.cpu.brand_string; then printf unknown; fi
              printf '\n'
              if ! sw_vers; then :; fi
            else
              if ! lscpu; then :; fi
              printf 'cpu_model='
              model=''
              if command -v lscpu >/dev/null 2>&1; then model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)"; fi
              if [[ -z "$model" ]]; then model=unknown; fi
              printf '%s\n' "$model"
              if ! grep -E '^(MemTotal|MemAvailable|Cpus_allowed_list):' /proc/meminfo /proc/self/status 2>/dev/null; then :; fi
              if [[ -r /sys/fs/cgroup/cpu.max ]]; then cat /sys/fs/cgroup/cpu.max; fi
              if [[ -r /sys/fs/cgroup/memory.max ]]; then cat /sys/fs/cgroup/memory.max; fi
            fi
            printf '\n-- shell limits --\n'; ulimit -a || true
          } > "$root/host.txt" 2>&1
          {
            printf 'budget_minutes=180\n'; printf 'screening_scope=three fresh-directory warm-filesystem A-D repetitions plus one separate E characterization per platform\n'; printf 'planned_profile_builds=13\nplanned_recovery_runs=5\nplanned_throughput_comparisons=9\n'; printf 'rotation_orders=ABCD;BCDA;CDAB\nrotation_position_sums=A:8;B:7;C:6;D:9\n'; printf 'rotation_note=each profile has three distinct positions; equal sums are impossible for four profiles with only three positions from 1..4\n'; printf 'runner_admission=standard hosted labels only; no dedicated-host lease or #437 service path\n'; printf 'stage_budgets_minutes=prepare:10;profiles:130;recovery:20;throughput:15;finalize:5\n'; printf 'cache_cohort=fresh build directories on a warm filesystem; order and repetition are retained\n'; printf 'rss_metric=child-process ru_maxrss sample; nested process RSS is not deduplicated\n'
            printf 'queue_delay=not inferred from elapsed time; join from GitHub run metadata after collection\n'
          } > "$root/budget.txt"
          {
            printf 'contract_status=preliminary_contract_inventory_only\n'; printf 'canonical_E=Linux CI/O2/tests/unity/fuzz-on/mold/CMAKE_CROSS_CONFIGS=all; Apple AArch64 CI/O2/tests/unity/fuzz-off/default-linker/CMAKE_CROSS_CONFIGS=all; Intel Apple CI/O2/tests/unity/fuzz-off/default-linker/direct-matrix-cross-configs-omitted\n'; printf 'diagnostics=invalid-input nonzero-status and nonempty-diagnostic controls plus debug sections, symbolization and backtrace inventory; compiler text/stream parity is not required\n'; printf 'debug_info_off_loss=DWARF line/type information may be absent; symbolization contract is not yet accepted\n'; printf 'frame_pointers_off_loss=simple frame-pointer unwinding may be absent; CFI/backtrace behavior needs final qualification\n'; printf 'screening_limit=no profile winner and no full native-job timing claim\n'; printf 'next_step=winner requires a separate three-attempt full mode+differential qualification including self-host\n'
          } > "$root/diagnostic-contract.txt"
          cat > "$bin/time-command.py" <<'PY'
          #!/usr/bin/env python3
          import json, resource, subprocess, sys, time
          if len(sys.argv) < 3: raise SystemExit('usage: time-command.py OUTPUT COMMAND [ARGUMENT ...]')
          output, argv = sys.argv[1], sys.argv[2:]; start = time.time_ns(); rc = 127; error = None
          try: child = subprocess.Popen(argv); rc = child.wait()
          except OSError as exc: error = str(exc)
          end = time.time_ns(); rss = int(resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss)
          if sys.platform != 'darwin': rss *= 1024
          record = {'argv': argv, 'start_ns': start, 'end_ns': end, 'elapsed_ns': end-start, 'exit_status': rc, 'max_rss_bytes': rss, 'rss_metric': 'child-process ru_maxrss sample; nested process RSS is not deduplicated'}
          if error: record['error'] = error
          with open(output, 'w', encoding='utf-8') as stream:
              for key, value in record.items(): stream.write(f'{key}={json.dumps(value, sort_keys=True)}\n')
          raise SystemExit(rc)
          PY
          chmod 700 "$bin/time-command.py"
          cat > "$bin/summarize-profile.py" <<'PY'
          #!/usr/bin/env python3
          import hashlib, json, re, shlex, sys
          from pathlib import Path
          (profile, evidence_name, binary_name, build_name, source_sha, source_tree, workflow_blob, runner, runner_os, runner_arch, expected_linker, expected_fuzz, expected_opt, expected_debug, expected_frame) = sys.argv[1:]
          evidence, binary, build = Path(evidence_name), Path(binary_name), Path(build_name)
          def cache_values(path):
              result = {}
              for line in path.read_text(encoding='utf-8', errors='replace').splitlines():
                  if ':' in line and '=' in line and not line.startswith('#'):
                      key, value = line.split(':', 1); result[key] = value.split('=', 1)[1]
              return result
          def toks(line):
              try: return shlex.split(line)
              except ValueError: return []
          def output(tokens):
              for i, token in enumerate(tokens[:-1]):
                  if token == '-o': return tokens[i+1]
              return ''
          cache = cache_values(build / 'CMakeCache.txt'); rows = [(line, toks(line)) for line in (evidence / 'ninja-commands.txt').read_text(encoding='utf-8', errors='replace').splitlines() if line.strip()]
          comp = [(line, ts) for line, ts in rows if '-c' in ts and output(ts)]; unity = [(line, ts) for line, ts in comp if any(t == 'src/buster/apps/ide/ide.c' or t.endswith('/src/buster/apps/ide/ide.c') for t in ts)]; links = [(line, ts) for line, ts in rows if '-c' not in ts and Path(output(ts)).name in {'ide','ide.exe'}]
          if len(comp) != 1 or len(unity) != 1 or len(links) != 1: raise SystemExit(f'{profile}: expected one unity compile/link, got {len(comp)}/{len(unity)}/{len(links)}')
          compile_line, compile_ts = unity[0]; link_line, link_ts = links[0]; log_rows = []
          log_path = build / '.ninja_log'
          if log_path.is_file():
              for line in log_path.read_text(encoding='utf-8', errors='replace').splitlines():
                  if line and not line.startswith('#'):
                      fields = line.split('\t')
                      if len(fields) >= 5:
                          try: log_rows.append((int(fields[0]), int(fields[1]), fields[3], fields[4]))
                          except ValueError: pass
          def edge(command):
              wanted = output(toks(command)).replace('\\','/').lstrip('./'); found = [row for row in log_rows if row[2].replace('\\','/').lstrip('./').endswith(wanted) or wanted.endswith(row[2].replace('\\','/').lstrip('./'))]
              if len(found) != 1: raise SystemExit(f'{profile}: expected one ninja edge for {wanted}, got {len(found)}')
              start, end, name, digest = found[0]; return {'start_ms':start,'end_ms':end,'duration_ns':(end-start)*1000000,'output':name,'command_hash':digest}
          debug = [t for t in compile_ts if t == '-g' or t.startswith('-gline-') or t.startswith('-gmodules') or t in {'/Zi','-gcodeview'}]; frame = [t for t in compile_ts if t in {'-fno-omit-frame-pointer','-fomit-frame-pointer'}]; fuzz = [t for t in compile_ts if t.startswith('-DBUSTER_FUZZ_AVAILABLE=')]
          opts = [t for t in compile_ts if re.fullmatch(r'-O(?:[0-3s]|fast|g|z)', t)]
          checks = {'one_unity_compile_and_one_native_link':True,'unity_source_identity':any(t == 'src/buster/apps/ide/ide.c' or t.endswith('/src/buster/apps/ide/ide.c') for t in compile_ts),'unity_define':'-DBUSTER_UNITY_BUILD=1' in compile_ts,'final_optimization_token':(opts or [None])[-1] == expected_opt,'debug_info_token_presence':bool(debug) == (expected_debug == 'ON'),'frame_pointer_token_presence':('-fno-omit-frame-pointer' in frame) == (expected_frame == 'ON'),'fuzz_cache':cache.get('BUSTER_FUZZ_AVAILABLE') == expected_fuzz,'fuzz_compile_define':f"-DBUSTER_FUZZ_AVAILABLE={'1' if expected_fuzz == 'ON' else '0'}" in fuzz,'linker_cache':cache.get('CMAKE_LINKER_TYPE','').upper() == expected_linker.upper(),'linker_command':('mold' in link_line.lower()) if expected_linker.upper() == 'MOLD' else ('mold' not in link_line.lower()),'no_cmake_compiler_or_link_launcher':all(cache.get(k,'') in {'','NOTFOUND'} for k in ('CMAKE_C_COMPILER_LAUNCHER','CMAKE_RULE_LAUNCH_LINK'))}
          if not all(checks.values()): raise SystemExit("%s: failed checks: %s" % (profile, ','.join(k for k,v in checks.items() if not v)))
          def timed(path):
              result = {}
              if path.is_file():
                  for line in path.read_text(encoding='utf-8', errors='replace').splitlines():
                      if '=' in line:
                          key, value = line.split('=',1)
                          if key in {'start_ns','end_ns','elapsed_ns','exit_status','max_rss_bytes'}:
                              try: result[key] = int(value)
                              except ValueError: pass
              return result
          payload = {'schema':1,'profile':profile,'source_sha':source_sha,'source_tree':source_tree,'workflow_blob':workflow_blob,'runner':runner,'runner_os':runner_os,'runner_arch':runner_arch,'build_directory':str(build),'cache_identity':cache,'cmake_cache_sha256':hashlib.sha256((build/'CMakeCache.txt').read_bytes()).hexdigest(),'producer_commands':{'exact_unity_compile_argv':compile_line,'exact_native_link_argv':link_line,'compile_tokens':compile_ts,'link_tokens':link_ts,'debug_info_tokens':debug,'frame_pointer_tokens':frame,'fuzz_tokens':fuzz,'compile_ninja_edge':edge(compile_line),'link_ninja_edge':edge(link_line),'final_optimization_token':(opts or [None])[-1]},'checks':checks,'command_time_samples':{p.stem:timed(p) for p in evidence.glob('*.time')},'binary':{'path':str(binary),'present':binary.is_file(),'bytes':binary.stat().st_size if binary.is_file() else 0,'sha256':hashlib.sha256(binary.read_bytes()).hexdigest() if binary.is_file() else None},'rss_metric':'child-process ru_maxrss sample; nested process RSS is not deduplicated','screening_preliminary':True,'diagnostic_contract_status':'preliminary_contract_inventory_only'}
          (evidence/'metrics.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          chmod 700 "$bin/summarize-profile.py"
          { if [[ "$RUNNER_OS" == Linux ]]; then if command -v mold >/dev/null 2>&1; then echo status=already-installed; else sudo apt-get update && sudo apt-get install -y mold; echo status=installed; fi; command -v mold; mold --version; else echo status=not-applicable; fi; } > "$root/mold-install.log" 2>&1 || echo status=failed >> "$root/mold-install.log"
          mold_missing=false
          if [[ "$RUNNER_OS" == Linux ]]; then
            if ! command -v mold >/dev/null 2>&1; then mold_missing=true; fi
          fi
          if [[ "$mold_missing" == true ]]; then echo failed > "$root/mold-status"; else echo pass > "$root/mold-status"; fi
          driver="$bin/buster-build"; printf 'argv:' > "$root/bootstrap.log"; printf ' %q' clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver" >> "$root/bootstrap.log"; printf '\n' >> "$root/bootstrap.log"
          if python3 "$bin/time-command.py" "$root/bootstrap.time" clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$driver" >> "$root/bootstrap.log" 2>&1; then echo pass > "$root/bootstrap-status"; else echo failed > "$root/bootstrap-status"; fi
          printf '%s\tprepare\t1\t1\t%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$(( $(now_ns) - started ))" >> "$root/progress.tsv"

      - name: Run A-D and canonical E profiles
        id: profiles
        if: ${{ always() && steps.prepare.outcome != 'cancelled' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/buster-604-qualification"; profiles="$root/profiles"; recovery="$root/recovery"; evidence="$root/evidence"; diagnostics="$root/diagnostics"; bin="$root/bin"; driver="$bin/buster-build"; source_sha="$(cat "$root/source-sha")"; source_tree="$(cat "$root/source-tree")"; workflow_blob="$(cat "$root/workflow-blob")"
          fail() { printf '%s\t%s\t%s\t%s\tfail\n' "$1" "$2" "$3" "$4" >> "$root/results.tsv"; }; measure() { local label="$1" log="$2" timefile="$3"; shift 3; { printf 'label=%s\nargv:' "$label"; printf ' %q' "$@"; printf '\n'; } > "$log"; local rc=0; python3 "$bin/time-command.py" "$timefile" "$@" >> "$log" 2>&1 || rc=$?; printf 'exit_status=%s\n' "$rc" >> "$log"; return "$rc"; }; partial() { printf 'partial=true\npartial_at_utc=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > "$root/partial-summary.txt"; }; on_exit() { local rc=$?; trap - EXIT; [[ "$rc" != 0 ]] && partial; exit "$rc"; }; trap on_exit EXIT; trap 'partial; exit 143' TERM; trap 'partial; exit 130' INT
          profile_args() {
            local id="$1" dir="$2"; GEN=(generate --build-directory "$dir" --cc clang --config Release); CMAKE=(); EXPECTED_LINKER=DEFAULT; EXPECTED_FUZZ=OFF; EXPECTED_OPT=-O3; EXPECTED_DEBUG=ON; EXPECTED_FRAME=ON; EXPECTED_CROSS_CONFIGS=
            case "$id" in
              A) DESCRIPTION='A: current native CI lane (CI=OFF, Release/-O3, debug info/frame pointers ON)'; GEN+=(--linker DEFAULT) ;;
              B) DESCRIPTION='B: profiling-isolation candidate (CI=OFF, Release/-O3, debug info/frame pointers OFF)'; GEN+=(--linker DEFAULT); CMAKE+=(-DBUSTER_DEBUG_INFO=OFF -DBUSTER_FRAME_POINTERS=OFF); EXPECTED_DEBUG=OFF; EXPECTED_FRAME=OFF ;;
              C) DESCRIPTION='C: debug-info-only control (CI=OFF, Release/-O3, debug info OFF/frame pointers ON)'; GEN+=(--linker DEFAULT); CMAKE+=(-DBUSTER_DEBUG_INFO=OFF); EXPECTED_DEBUG=OFF ;;
              D) DESCRIPTION='D: frame-pointer-only control (CI=OFF, Release/-O3, debug info ON/frame pointers OFF)'; GEN+=(--linker DEFAULT); CMAKE+=(-DBUSTER_FRAME_POINTERS=OFF); EXPECTED_FRAME=OFF ;;
              E)
                EXPECTED_OPT=-O2; EXPECTED_DEBUG=OFF; EXPECTED_FRAME=OFF
                if [[ "$RUNNER_OS" == Linux ]]; then
                  DESCRIPTION='E: canonical CI Clang Release Linux (CI=ON, effective -O2, tests/unity ON, fuzz ON, linker=MOLD, CMAKE_CROSS_CONFIGS=all; one build)'
                  GEN+=(--ci --optimize --fuzz --no-check-optional-warnings --no-developer-targets --linker MOLD); EXPECTED_LINKER=MOLD; EXPECTED_FUZZ=ON; EXPECTED_CROSS_CONFIGS=all
                else
                  DESCRIPTION='E: canonical CI Clang Release Apple (CI=ON, effective -O2, tests/unity ON, fuzz OFF, linker=DEFAULT; CMAKE_CROSS_CONFIGS=all only on AArch64; one build)'
                  GEN+=(--ci --optimize --no-check-optional-warnings --no-developer-targets --linker DEFAULT)
                  if [[ "$BUSTER_604_ARCH" == aarch64 ]]; then EXPECTED_CROSS_CONFIGS=all; fi
                fi
                CMAKE+=(-DCMAKE_CONFIGURATION_TYPES=Release -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY)
                if [[ -n "$EXPECTED_CROSS_CONFIGS" ]]; then CMAKE+=(-DCMAKE_CROSS_CONFIGS="$EXPECTED_CROSS_CONFIGS"); fi
                ;;
              *) return 2 ;;
            esac
            # Bash 3.2 treats an empty array expansion as an unset variable
            # under `set -u`. Profile A intentionally has no CMake overrides.
            GEN+=(--)
            if [[ "$id" != A ]]; then GEN+=("${CMAKE[@]}"); fi
          }
          cache_value() { sed -n "s/^$2:[^=]*=//p" "$1" | head -n 1; }; cache_expect() { [[ "$(cache_value "$1" "$2")" == "$3" ]]; }
          cache_check() {
            local id="$1" cache="$2" ok=true; [[ -f "$cache" ]] || return 1; profile_args "$id" dummy; local ci=OFF warnings=ON developer=ON config='Debug;Release'; [[ "$id" == E ]] && { ci=ON; warnings=OFF; developer=OFF; config=Release; }
            keys=(BUSTER_CI BUSTER_DEBUG_INFO BUSTER_FRAME_POINTERS BUSTER_FUZZ_AVAILABLE BUSTER_UNITY_BUILD BUSTER_INCLUDE_TESTS BUSTER_SANITIZE BUSTER_LTO BUSTER_TIME_TRACE BUSTER_INSTRUMENT BUSTER_LINK_LIBC BUSTER_SINGLE_THREADED BUSTER_CHECK_OPTIONAL_WARNINGS BUSTER_DEVELOPER_TARGETS CMAKE_CONFIGURATION_TYPES CMAKE_DEFAULT_BUILD_TYPE CMAKE_C_FLAGS_RELEASE CMAKE_CROSS_CONFIGS)
            values=("$ci" "$EXPECTED_DEBUG" "$EXPECTED_FRAME" "$EXPECTED_FUZZ" ON ON OFF OFF OFF OFF ON OFF "$warnings" "$developer" "$config" Release '-O3 -DNDEBUG' "$EXPECTED_CROSS_CONFIGS")
            for i in "${!keys[@]}"; do cache_expect "$cache" "${keys[$i]}" "${values[$i]}" || ok=false; done
            cache_expect "$cache" CMAKE_LINKER_TYPE "$EXPECTED_LINKER" || ok=false; [[ "$id" != E || "$(cache_value "$cache" CMAKE_TRY_COMPILE_TARGET_TYPE)" == STATIC_LIBRARY ]] || ok=false; $ok
          }
          profile_position() { local rep="$1" id="$2"; case "$rep" in 1) order=(A B C D);; 2) order=(B C D A);; 3) order=(C D A B);; esac; for i in "${!order[@]}"; do [[ "${order[$i]}" == "$id" ]] && { echo $((i+1)); return; }; done; return 1; }; profile_dir() { echo "$profiles/r$1-p$(profile_position "$1" "$2")-$2"; }
          diagnostic() {
            local id="$1" rep="$2" pos="$3" binary="$4" ev="$5"; local invalid="$diagnostics/invalid-r${rep}-p${pos}-${id}.c"; printf 'int main( {\n' > "$invalid"; local c=0 r=0; "$binary" cc -fsyntax-only "$invalid" > "$ev/diagnostic-ide.stdout" 2> "$ev/diagnostic-ide.stderr" || c=$?; clang -fsyntax-only "$invalid" > "$ev/diagnostic-clang.stdout" 2> "$ev/diagnostic-clang.stderr" || r=$?; printf '%q\n' "$binary" cc -fsyntax-only "$invalid" > "$ev/diagnostic-ide.argv"; printf '%q\n' clang -fsyntax-only "$invalid" > "$ev/diagnostic-clang.argv"
            python3 - "$ev/diagnostic-contract.json" "$c" "$r" "$ev/diagnostic-ide.stdout" "$ev/diagnostic-clang.stdout" "$ev/diagnostic-ide.stderr" "$ev/diagnostic-clang.stderr" <<'PY'
          import hashlib, json, pathlib, sys
          out, cs, rs, co, ro, ce, re_ = sys.argv[1:]
          read=lambda p:pathlib.Path(p).read_bytes(); cb,rb,ce_,re_b=read(co),read(ro),read(ce),read(re_)
          data={'schema':1,'candidate_status':int(cs),'reference_status':int(rs),'candidate_failed':int(cs)!=0,'reference_failed':int(rs)!=0,'candidate_diagnostic_nonempty':bool(cb or ce_),'reference_diagnostic_nonempty':bool(rb or re_b),'candidate_stdout':cb.decode(errors='replace'),'reference_stdout':rb.decode(errors='replace'),'candidate_stderr':ce_.decode(errors='replace'),'reference_stderr':re_b.decode(errors='replace'),'diagnostic_sha256':{'candidate_stdout':hashlib.sha256(cb).hexdigest(),'candidate_stderr':hashlib.sha256(ce_).hexdigest(),'reference_stdout':hashlib.sha256(rb).hexdigest(),'reference_stderr':hashlib.sha256(re_b).hexdigest()},'text_or_stream_parity_required':False}
          data['contract_pass']=all(data[k] for k in ('candidate_failed','reference_failed','candidate_diagnostic_nonempty','reference_diagnostic_nonempty')); pathlib.Path(out).write_text(json.dumps(data,indent=2,sort_keys=True)+'\n'); raise SystemExit(0 if data['contract_pass'] else 1)
          PY
          }
          inventory() {
