name: Issue 707 Windows complete runs

# Temporary acceptance harness for #707. The native build driver owns the
# complete compiler/configuration matrix; this workflow only supplies the same
# verified toolchain environment and repeats the uninstrumented command.
on:
  pull_request:
    paths:
      - .github/workflows/issue-707-windows-measure.yml
      - CMakeLists.txt
      - cmake/**

permissions:
  contents: read

jobs:
  measure:
    if: ${{ github.server_url == 'https://github.com' && vars.GH_ACTIONS_CI_ENABLED == 'true' && github.event.pull_request.number == 749 }}
    name: Issue 707 Windows run ${{ matrix.run }}
    runs-on: windows-2025
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    env:
      BUSTER_MATRIX_SHARD: all
      BUSTER_CMAKE_PROFILE: '0'
      BUSTER_MATRIX_THREADS: '4'
      BUSTER_CI_PYTHON: python
      ISSUE707_ARM: ${{ contains(github.event.pull_request.head.sha, 'never-match') && 'invalid' || 'tree-labelled' }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'BUSTER_CI_COVERAGE_OUTPUT=%s/issue707/coverage.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'ZIG_GLOBAL_CACHE_DIR=%s/issue707-zig-global-%s\n' "$RUNNER_TEMP" '${{ matrix.run }}' >> "$GITHUB_ENV"

      - name: Restore verified Zig archive
        id: zig_archive
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/zig-archive/archive
          key: zig-archive-v1-${{ runner.os }}-${{ runner.arch }}-x86_64-windows-${{ hashFiles('.github/zig.json') }}

      - name: Install verified Zig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue707"
          python tools/ci_zig.py --target x86_64-windows --cache-directory "$RUNNER_TEMP/zig-archive" --install-directory "$RUNNER_TEMP/zig" 2>&1 | tee "$RUNNER_TEMP/issue707/zig-install.log"

      - name: Run uninstrumented complete native matrix
        shell: powershell
        env:
          ARCHIVE_CACHE_HIT: ${{ steps.zig_archive.outputs.cache-hit }}
          ISSUE707_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ISSUE707_RUN: ${{ matrix.run }}
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $VsWhere)) { throw "vswhere was not found at $VsWhere" }
          $VsPaths = @(& $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $VsPaths.Count -eq 0) { throw 'Visual Studio x86-64 tools were not found' }
          $VsPath = $VsPaths[0].Trim()
          if (-not $VsPath) { throw 'Visual Studio path is empty' }
          & (Join-Path $VsPath 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:PATH"

          $Evidence = Join-Path $env:RUNNER_TEMP 'issue707'
          New-Item -ItemType Directory -Force -Path $Evidence, 'build' | Out-Null
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $env:ZIG_GLOBAL_CACHE_DIR
          New-Item -ItemType Directory -Force -Path $env:ZIG_GLOBAL_CACHE_DIR | Out-Null

          @(
            "arm=$env:ISSUE707_ARM"
            "run=$env:ISSUE707_RUN"
            "archive_cache_hit=$env:ARCHIVE_CACHE_HIT"
            "github_sha=$env:GITHUB_SHA"
            "head_sha=$env:ISSUE707_HEAD_SHA"
            "matrix_shard=$env:BUSTER_MATRIX_SHARD"
            "cmake_profile=$env:BUSTER_CMAKE_PROFILE"
            "matrix_threads=$env:BUSTER_MATRIX_THREADS"
            "zig_global_cache_dir=$env:ZIG_GLOBAL_CACHE_DIR"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
            "INCLUDE=$env:INCLUDE"
            "LIB=$env:LIB"
          ) | Set-Content -Encoding utf8 (Join-Path $Evidence 'identity.txt')
          git rev-parse HEAD 'HEAD^{tree}' | Add-Content -Encoding utf8 (Join-Path $Evidence 'identity.txt')
          cmake --version | Add-Content -Encoding utf8 (Join-Path $Evidence 'identity.txt')
          ninja --version | Add-Content -Encoding utf8 (Join-Path $Evidence 'identity.txt')
          clang --version | Add-Content -Encoding utf8 (Join-Path $Evidence 'identity.txt')
          cmd /c "cl 2>&1" | Add-Content -Encoding utf8 (Join-Path $Evidence 'identity.txt')
          gcc --version | Add-Content -Encoding utf8 (Join-Path $Evidence 'identity.txt')
          zig version | Add-Content -Encoding utf8 (Join-Path $Evidence 'identity.txt')
          zig env | Add-Content -Encoding utf8 (Join-Path $Evidence 'identity.txt')

          $Driver = Join-Path (Get-Location) 'build\build.exe'
          cmd /c "clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -Wno-microsoft-enum-forward-reference -g build.c -lws2_32 -o `"$Driver`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Started = [DateTimeOffset]::UtcNow
          cmd /c "`"$Driver`" test_all_combinations_ci --verbose=1 2>&1" | Tee-Object -FilePath (Join-Path $Evidence 'combinations.log')
          $Status = $LASTEXITCODE
          $Completed = [DateTimeOffset]::UtcNow
          @{
            status = $Status
            elapsed_seconds = ($Completed - $Started).TotalSeconds
            started_at = $Started.ToString('o')
            completed_at = $Completed.ToString('o')
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $Evidence 'result.json')
          if ($Status -ne 0) { exit $Status }

      - name: Collect configure evidence
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci_configure_evidence.py --build-root build --output "$RUNNER_TEMP/issue707/configure" --profile-requested 0

      - name: Retain issue 707 Windows evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-707-windows-${{ matrix.run }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue707/
          if-no-files-found: error
          retention-days: 7
