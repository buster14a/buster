name: PR 767 CODE_4 repair

on:
  push:
    branches:
      - claude/clever-cori-qh0b15

permissions:
  contents: write

concurrency:
  group: pr-767-code4-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'buster14a/buster'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out exact repair revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply the deterministic repair
        run: |
          set -euo pipefail
          python3 tools/pr767_repair.py
          python3 tools/pr767_repair_followup.py
          git diff --check
          test ! -e tools/pr767_repair.py
          test ! -e tools/pr767_repair_followup.py
          test ! -e .github/workflows/pr767-code4-fix.yml

      - name: Build and run the registered regression suite
        env:
          BUSTER_TEST_JOBS: 2
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: |
          set -euo pipefail
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --cc clang --linker DEFAULT --no-fuzz
          "$RUNNER_TEMP/buster-build" build --config Release -t test_all

      - name: Commit the validated repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'x86-64: finish safe GOTPCREL and CODE_4 support'
          test -z "$(git status --porcelain)"

      - name: Push without overwriting concurrent work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "branch advanced during validation: expected $GITHUB_SHA, found $remote_head" >&2
            exit 1
          fi
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
