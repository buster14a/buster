name: PR 767 CODE_4 crash diagnosis

on:
  push:
    branches:
      - claude/clever-cori-qh0b15

permissions:
  contents: read

concurrency:
  group: pr-767-code4-diagnosis-v3
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'buster14a/buster'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out exact diagnostic revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply the deterministic repair
        run: |
          set -euo pipefail
          python3 tools/pr767_repair.py
          python3 tools/pr767_repair_followup.py
          git diff --check
          test ! -e tools/pr767_repair.py
          test ! -e tools/pr767_repair_followup.py
          test ! -e .github/workflows/pr767-code4-fix.yml

      - name: Build a debuggable compiler
        env:
          BUSTER_TEST_JOBS: 1
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: |
          set -euo pipefail
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --cc clang --linker DEFAULT --no-fuzz
          "$RUNNER_TEMP/buster-build" build --config Debug -t ide

      - name: Capture the crash backtrace
        env:
          BUSTER_TEST_JOBS: 1
        run: |
          set -o pipefail
          command -v gdb
          gdb -q -batch \
            -ex 'set pagination off' \
            -ex 'set print thread-events off' \
            -ex run \
            -ex 'thread apply all bt full' \
            --args ./build/Debug/ide test 2>&1 | tee "$RUNNER_TEMP/pr767-gdb.txt"
          test ${PIPESTATUS[0]} -eq 0

      - name: Retain diagnostic trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr767-code4-gdb-${{ github.run_id }}
          path: ${{ runner.temp }}/pr767-gdb.txt
          if-no-files-found: warn
          retention-days: 7
