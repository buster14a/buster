name: Z08 IR inspection

on:
  push:
    branches: [astra/z08-ir-inspection-20260909]
    paths: [.github/workflows/z08-ir-inspection.yml]

permissions:
  contents: read

jobs:
  inspect:
    name: Frozen source and paginated history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain source and relevant commit history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          base=ef99ec72cf0f17c8818a1d4b4c106fd5908b5eae
          git archive "$base" | gzip -n > evidence/source.tar.gz
          git show -s --format=fuller "$base" > evidence/baseline.txt
          git log -100 --format=fuller "$base" -- src/buster/lib/compiler/ir src/buster/lib/compiler/frontend/c/c_gen.c src/buster/lib/compiler/codegen/machine_select.c tools/throughput > evidence/history.txt
          git log -20 -p "$base" -- src/buster/lib/compiler/ir src/buster/lib/compiler/frontend/c/c_gen.c > evidence/recent-ir.patch
          sha256sum evidence/source.tar.gz > evidence/source.sha256
      - name: Enumerate repository issues, PRs, and related discussions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.request
          root = pathlib.Path('evidence')
          api = 'https://api.github.com/repos/buster14a/buster'
          numeric_api = 'https://api.github.com/repositories/1071732997'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          manifest = []
          def get(url, accept=None):
              h = dict(headers)
              if accept:
                  h['Accept'] = accept
              with urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=60) as response:
                  data = response.read()
                  link = response.headers.get('Link', '')
              manifest.append({'url': url, 'bytes': len(data), 'link': link})
              return data, link
          def pages(path):
              url = api + path
              rows = []
              while url:
                  raw, link = get(url)
                  page = json.loads(raw)
                  if not isinstance(page, list):
                      raise RuntimeError('Expected a paginated array: ' + url)
                  rows.extend(page)
                  match = re.search(r'<([^>]+)>; rel="next"', link)
                  url = match.group(1) if match else None
                  if url and not url.startswith((api + '/', numeric_api + '/')):
                      raise RuntimeError('Unexpected pagination repository')
              return rows
          def save(name, value):
              (root / name).write_text(json.dumps(value, indent=2) + '\n')
          try:
              issues = pages('/issues?state=all&per_page=100&sort=created&direction=asc')
              save('issues.json', issues)
              pulls = pages('/pulls?state=all&per_page=100&sort=created&direction=asc')
              save('pulls.json', pulls)
              pattern = re.compile(r'(?:#|/issues/|/pull/)(?:38|50|52|306|128|132|34|33|294)\b|ir_function_add_instruction|c_ir_append_instruction|c_ir_recover_memory_place_from_value|machine_builder_canonical_edges|dense canonical|frontend SSA|instruction.append|capacity.estimat|operand.prewalk|whole.IR.SoA', re.I)
              numbers = {38, 50, 52, 306, 128, 132, 34, 33, 294, 46, 48}
              numbers.update(x['number'] for x in issues if pattern.search(x['title'] + '\n' + (x.get('body') or '')))
              numbers.update(x['number'] for x in pulls if x['state'] == 'open')
              details = {}
              pull_by_number = {x['number']: x for x in pulls}
              for number in sorted(numbers):
                  entry = {'comments': pages(f'/issues/{number}/comments?per_page=100')}
                  if number in pull_by_number:
                      entry['files'] = pages(f'/pulls/{number}/files?per_page=100')
                      entry['reviews'] = pages(f'/pulls/{number}/reviews?per_page=100')
                      entry['review_comments'] = pages(f'/pulls/{number}/comments?per_page=100')
                  details[str(number)] = entry
                  print('RETRIEVED', number, 'comments', len(entry['comments']), 'files', len(entry.get('files', [])), flush=True)
                  save('details.json', details)
              open_issues = [x for x in issues if x['state'] == 'open' and 'pull_request' not in x]
              open_pulls = [x for x in pulls if x['state'] == 'open']
              summary = {'issues_including_prs': len(issues), 'pulls': len(pulls), 'open_issues': len(open_issues), 'open_pulls': len(open_pulls), 'detail_numbers': sorted(numbers), 'pagination_complete': True}
              save('summary.json', summary)
              print(json.dumps(summary, indent=2))
              for x in open_pulls:
                  print('OPEN_PR', x['number'], x['head']['sha'], x['title'])
          finally:
              save('requests.json', manifest)
          PY
      - name: Retain inspection bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: z08-inspection-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
