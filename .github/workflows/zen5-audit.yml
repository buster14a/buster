name: Issue 447 Zen 5 paired qualification

on:
  workflow_dispatch:
  push:
    branches:
      - audit/issue447-ssa-live-slot-index-20260918
    paths:
      - .github/workflows/zen5-audit.yml

permissions:
  contents: read

concurrency:
  group: zen5-audit
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: [buster-zen5, ryzen-9700x]
    timeout-minutes: 120
    env:
      LC_ALL: C
      BASE_SHA: 7d27dc15df558d0881d976615a53255c3e18d0a9
      CANDIDATE_SHA: 47b9359c112d2da5f37c0ae4a49384571c67dc02
      CPU: '2'
      MACHINE_ID: benchpress-9700x-20260918-issue447-v1

    steps:
      - name: Checkout immutable baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline
          persist-credentials: false

      - name: Checkout immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false

      - name: Checkout frozen candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: frozen
          persist-credentials: false

      - name: Capture and verify the dedicated host
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/issue447-zen5"
          LOCK_DIR="$RUNNER_TEMP/issue447-lock"
          LOCK="$LOCK_DIR/host.lock"
          rm -rf "$EVIDENCE" "$LOCK_DIR"
          mkdir -p "$EVIDENCE"
          install -d -m 700 "$LOCK_DIR"
          printf 'EVIDENCE=%s\nLOCK=%s\n' "$EVIDENCE" "$LOCK" >> "$GITHUB_ENV"
          exec > >(tee "$EVIDENCE/host.log") 2>&1
          set -x
          hostname
          uname -a
          id
          nproc
          lscpu
          lscpu -e=CPU,CORE,SOCKET,NODE,ONLINE,MAXMHZ,MINMHZ
          free -b
          cat /proc/sys/kernel/perf_event_paranoid
          cat /sys/devices/system/cpu/smt/active
          cat /sys/devices/system/cpu/cpufreq/boost
          cat /sys/devices/system/cpu/cpu2/cpufreq/scaling_governor
          cat /sys/devices/system/cpu/cpu2/cpufreq/scaling_driver
          cat /sys/devices/system/cpu/cpu2/cpufreq/energy_performance_preference || true
          grep -m1 microcode /proc/cpuinfo || true
          lscpu | grep -F 'AMD Ryzen 7 9700X'
          clang --version
          cmake --version
          ninja --version
          mold --version
          perf --version
          taskset --version | head -1
          perf stat -e instructions:u,cycles:u -- true

      - name: Build immutable uninstrumented compilers and the native harness
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$EVIDENCE/build.log") 2>&1
          set -x
          LINKER=DEFAULT
          if command -v mold >/dev/null 2>&1; then LINKER=MOLD; fi
          printf 'LINKER=%s\n' "$LINKER" >> "$GITHUB_ENV"

          for tree in baseline candidate frozen; do
            (
              cd "$tree"
              clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/$tree-build"
            )
          done

          (
            cd baseline
            "$RUNNER_TEMP/baseline-build" generate --config Release --cc clang --linker "$LINKER"
            "$RUNNER_TEMP/baseline-build" build --config Release -t ide
          )
          (
            cd candidate
            "$RUNNER_TEMP/candidate-build" generate --config Release --cc clang --linker "$LINKER"
            "$RUNNER_TEMP/candidate-build" build --config Release -t ide
            "$RUNNER_TEMP/candidate-build" bench_throughput self-test
            "$RUNNER_TEMP/candidate-build" bench_throughput help
          )
          (
            cd frozen
            "$RUNNER_TEMP/frozen-build" generate --config Release --cc clang --linker "$LINKER"
          )

          BASE_IDE="$GITHUB_WORKSPACE/baseline/build/Release/ide"
          CANDIDATE_IDE="$GITHUB_WORKSPACE/candidate/build/Release/ide"
          FROZEN_ROOT="$GITHUB_WORKSPACE/frozen"
          FROZEN_GENERATED="$GITHUB_WORKSPACE/frozen/build/generated"
          BENCH="$GITHUB_WORKSPACE/candidate/build/throughput-tools/throughput"
          test -x "$BASE_IDE"
          test -x "$CANDIDATE_IDE"
          test -x "$BENCH"
          test -d "$FROZEN_GENERATED"
          printf 'BASE_IDE=%s\nCANDIDATE_IDE=%s\nFROZEN_ROOT=%s\nFROZEN_GENERATED=%s\nBENCH=%s\n' \
            "$BASE_IDE" "$CANDIDATE_IDE" "$FROZEN_ROOT" "$FROZEN_GENERATED" "$BENCH" >> "$GITHUB_ENV"

          {
            git -C baseline rev-parse HEAD 'HEAD^{tree}'
            git -C candidate rev-parse HEAD 'HEAD^{tree}'
            git -C frozen rev-parse HEAD 'HEAD^{tree}'
            sha256sum "$BASE_IDE" "$CANDIDATE_IDE" "$BENCH"
            find "$FROZEN_GENERATED" -type f -print0 | sort -z | xargs -0 sha256sum
          } > "$EVIDENCE/input-identities.txt"
          cp baseline/build/CMakeCache.txt "$EVIDENCE/baseline-CMakeCache.txt"
          cp candidate/build/CMakeCache.txt "$EVIDENCE/candidate-CMakeCache.txt"
          cp frozen/build/CMakeCache.txt "$EVIDENCE/frozen-CMakeCache.txt"
          cp candidate/build/compile_commands.json "$EVIDENCE/candidate-compile_commands.json"

      - name: Qualify the harness admission path
        shell: bash
        run: |
          set -euo pipefail
          "$BENCH" qualify \
            --cpu "$CPU" \
            --machine-id "$MACHINE_ID" \
            --lock-file "$LOCK" | tee "$EVIDENCE/qualification.json"

      - name: Frozen-source A/A qualification
        shell: bash
        run: |
          set -euo pipefail
          "$BENCH" run \
            --baseline "$BASE_IDE" \
            --candidate "$BASE_IDE" \
            --baseline-id "$BASE_SHA" \
            --candidate-id "$BASE_SHA" \
            --output "$EVIDENCE/aa" \
            --profile ci \
            --mode fast \
            --pairs 30 \
            --warmups 2 \
            --cpu "$CPU" \
            --machine-id "$MACHINE_ID" \
            --lock-file "$LOCK" \
            --self-host-root "$FROZEN_ROOT" \
            --self-host-generated "$FROZEN_GENERATED" \
            --require-identical-output \
            --pmu \
            --require-pmu
          "$BENCH" compare --output "$EVIDENCE/aa"
          cat "$EVIDENCE/aa/summary.md" | tee "$EVIDENCE/aa-summary.md"

      - name: Frozen-source A/B qualification
        shell: bash
        run: |
          set -euo pipefail
          "$BENCH" run \
            --baseline "$BASE_IDE" \
            --candidate "$CANDIDATE_IDE" \
            --baseline-id "$BASE_SHA" \
            --candidate-id "$CANDIDATE_SHA" \
            --output "$EVIDENCE/ab" \
            --profile ci \
            --mode fast \
            --pairs 30 \
            --warmups 2 \
            --cpu "$CPU" \
            --machine-id "$MACHINE_ID" \
            --lock-file "$LOCK" \
            --self-host-root "$FROZEN_ROOT" \
            --self-host-generated "$FROZEN_GENERATED" \
            --require-identical-output \
            --pmu \
            --require-pmu
          "$BENCH" compare --output "$EVIDENCE/ab"
          cat "$EVIDENCE/ab/summary.md" | tee "$EVIDENCE/ab-summary.md"

      - name: Enforce and report issue 447 acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import csv
          import json
          import os
          import statistics
          from pathlib import Path

          evidence = Path(os.environ['EVIDENCE'])
          target = 'self_host_stage1/fast'

          def load_bundle(name):
              root = evidence / name
              summary = json.loads((root / 'summary.json').read_text())
              if not summary.get('valid'):
                  raise SystemExit(f'{name}: invalid comparison bundle')
              if int(summary.get('confirmed_regressions', 0)) != 0:
                  raise SystemExit(f'{name}: confirmed substantial regression')
              comparisons = {row['name']: row for row in summary['comparisons']}
              if target not in comparisons:
                  raise SystemExit(f'{name}: missing {target}')
              jobs = {}
              for line in (root / 'jobs.tsv').read_text().splitlines():
                  index, job = line.split('\t', 1)
                  jobs[int(index)] = job
              with (root / 'samples.csv').open(newline='') as handle:
                  samples = [row for row in csv.DictReader(handle) if jobs[int(row['job'])] == target]
              with (root / 'telemetry.csv').open(newline='') as handle:
                  telemetry = [row for row in csv.DictReader(handle) if jobs[int(row['job'])] == target]
              if not samples or not telemetry:
                  raise SystemExit(f'{name}: missing raw stage-1 samples or PMU replays')
              return root, summary, comparisons[target], samples, telemetry

          def values(rows, variant, field, integer=False):
              result = []
              for row in rows:
                  if int(row['variant']) != variant or not row[field]:
                      continue
                  result.append(int(row[field]) if integer else float(row[field]))
              if not result:
                  raise SystemExit(f'missing {field} for variant {variant}')
              return result

          def summarize(name):
              root, summary, comparison, samples, telemetry = load_bundle(name)
              data = {'root': root, 'summary': summary, 'comparison': comparison}
              for field in ('wall_seconds', 'peak_rss_bytes', 'output_bytes'):
                  integer = field != 'wall_seconds'
                  data[field] = [
                      values(samples, 0, field, integer),
                      values(samples, 1, field, integer),
                  ]
              for field in ('instructions', 'cycles'):
                  data[field] = [
                      values(telemetry, 0, field, True),
                      values(telemetry, 1, field, True),
                  ]
              hashes = []
              for variant in (0, 1):
                  variant_hashes = {row['output_sha256'] for row in samples if int(row['variant']) == variant and row['output_sha256']}
                  if len(variant_hashes) != 1:
                      raise SystemExit(f'{name}: nondeterministic stage-1 output for variant {variant}: {sorted(variant_hashes)}')
                  hashes.append(next(iter(variant_hashes)))
              if hashes[0] != hashes[1]:
                  raise SystemExit(f'{name}: A/B stage-1 output mismatch')
              data['hash'] = hashes[0]
              return data

          aa = summarize('aa')
          ab = summarize('ab')

          base_instructions = statistics.median(ab['instructions'][0])
          candidate_instructions = statistics.median(ab['instructions'][1])
          if candidate_instructions >= base_instructions:
              raise SystemExit(f'candidate stage-1 instructions did not improve: {base_instructions} -> {candidate_instructions}')

          base_output = statistics.median(ab['output_bytes'][0])
          candidate_output = statistics.median(ab['output_bytes'][1])
          if base_output != candidate_output:
              raise SystemExit(f'stage-1 output size changed: {base_output} -> {candidate_output}')

          def ratio(after, before):
              return after / before if before else 1.0

          wall_base = statistics.median(ab['wall_seconds'][0])
          wall_candidate = statistics.median(ab['wall_seconds'][1])
          rss_base = statistics.median(ab['peak_rss_bytes'][0])
          rss_candidate = statistics.median(ab['peak_rss_bytes'][1])
          cycles_base = statistics.median(ab['cycles'][0])
          cycles_candidate = statistics.median(ab['cycles'][1])
          aa_inst_base = statistics.median(aa['instructions'][0])
          aa_inst_candidate = statistics.median(aa['instructions'][1])

          tests = ab['comparison'].get('tests', [])
          wall_tests = [row for row in tests if row.get('metric') == 'wall_seconds']
          rss_tests = [row for row in tests if row.get('metric') == 'peak_rss_bytes']

          lines = [
              '# Issue #447 dedicated Ryzen 7 9700X qualification',
              '',
              f'- immutable baseline: `{os.environ["BASE_SHA"]}`',
              f'- immutable candidate: `{os.environ["CANDIDATE_SHA"]}`',
              f'- frozen source: candidate `{os.environ["CANDIDATE_SHA"]}`',
              f'- machine label: `{os.environ["MACHINE_ID"]}`, logical CPU `{os.environ["CPU"]}`',
              '- design: A/A then A/B, 30 randomized pairs per round, two warmups, uninstrumented Release compilers, separate required PMU replays',
              '',
              '## Acceptance result',
              '',
              '| Metric | Baseline median | Candidate median | Delta |',
              '| --- | ---: | ---: | ---: |',
              f'| stage-1 instructions | {base_instructions:.0f} | {candidate_instructions:.0f} | {(ratio(candidate_instructions, base_instructions)-1)*100:+.4f}% |',
              f'| stage-1 cycles | {cycles_base:.0f} | {cycles_candidate:.0f} | {(ratio(cycles_candidate, cycles_base)-1)*100:+.4f}% |',
              f'| stage-1 wall time | {wall_base:.6f} s | {wall_candidate:.6f} s | {(ratio(wall_candidate, wall_base)-1)*100:+.4f}% |',
              f'| stage-1 peak RSS | {rss_base/1048576:.3f} MiB | {rss_candidate/1048576:.3f} MiB | {(ratio(rss_candidate, rss_base)-1)*100:+.4f}% |',
              f'| stage-1 output bytes | {base_output:.0f} | {candidate_output:.0f} | {candidate_output-base_output:+.0f} |',
              '',
              f'- A/A instruction medians: {aa_inst_base:.0f} / {aa_inst_candidate:.0f} ({(ratio(aa_inst_candidate, aa_inst_base)-1)*100:+.4f}%).',
              f'- A/B output SHA-256: `{ab["hash"]}` for every baseline and candidate sample.',
              f'- A/A confirmed regressions: {aa["summary"]["confirmed_regressions"]}; A/B confirmed regressions: {ab["summary"]["confirmed_regressions"]}.',
              f'- A/B inconclusive cases retained: {ab["summary"]["inconclusive_cases"]}.',
              '',
              '## Harness uncertainty rows for `self_host_stage1/fast`',
              '',
              '| Metric | Round | Median ratio | Confidence interval | Regression |',
              '| --- | ---: | ---: | ---: | --- |',
          ]
          for row in wall_tests + rss_tests:
              lines.append(
                  f'| {row["metric"]} | {row["round"]} | {row["median_ratio"]:.6f} | '
                  f'[{row["ci_low"]:.6f}, {row["ci_high"]:.6f}] | {row["regression"]} |'
              )
          lines += [
              '',
              'Raw timing/RSS samples, PMU replays, commands, hashes, host qualification, fixed-point evidence and sealed metadata are retained in the workflow artifact.',
              '',
          ]
          report = '\n'.join(lines)
          (evidence / 'acceptance.md').write_text(report)
          print(report)
          PYTHON
          cat "$EVIDENCE/acceptance.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain all qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue447-zen5-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue447-zen5
          retention-days: 30
          if-no-files-found: error
