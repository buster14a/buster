name: Zen 5 throughput audit

# Measurement-only workflow for the dedicated Ryzen 9700X runner. It builds the
# trusted Clang Release compiler, reproduces the self-host fixed point with its
# STEP_INSTRUCTIONS and throughput rows, then profiles the stage-1 unity
# compile with perf and the two survey tools. Every result lands in one
# artifact; nothing here is a gate.
on:
  workflow_dispatch:
  push:
    branches: ['audit/**']
    paths: ['.github/workflows/zen5-audit.yml']

permissions:
  contents: read

concurrency:
  group: zen5-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [buster-zen5, ryzen-9700x]
    timeout-minutes: 120
    env:
      LC_ALL: C
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Host probe
        shell: bash
        run: |
          # Evidence lives outside the workspace: generate replaces build/.
          AUDIT="$RUNNER_TEMP/zen5-audit"
          printf 'AUDIT=%s\n' "$AUDIT" >> "$GITHUB_ENV"
          rm -rf "$AUDIT"
          mkdir -p "$AUDIT"
          exec > >(tee "$AUDIT/host.log") 2>&1
          set -x
          git rev-parse HEAD 'HEAD^{tree}'
          uname -a
          id
          nproc
          lscpu
          lscpu -e=CPU,CORE,SOCKET,NODE,ONLINE,MAXMHZ,MINMHZ || true
          free -b
          df -h . "$RUNNER_TEMP"
          cat /proc/sys/kernel/perf_event_paranoid || true
          cat /proc/sys/kernel/kptr_restrict || true
          cat /sys/devices/system/cpu/smt/active || true
          cat /sys/devices/system/cpu/cpufreq/boost || true
          cat /sys/devices/system/cpu/cpu2/cpufreq/scaling_governor || true
          cat /sys/devices/system/cpu/cpu2/cpufreq/scaling_driver || true
          cat /sys/devices/system/cpu/cpu2/cpufreq/energy_performance_preference || true
          cat /sys/kernel/mm/transparent_hugepage/enabled || true
          grep -m1 microcode /proc/cpuinfo || true
          for tool in clang gcc cc cmake ninja tcc perf valgrind python3 llvm-symbolizer readelf objdump mold ld taskset zstd; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf 'TOOL %s %s\n' "$tool" "$(command -v "$tool")"
              "$tool" --version 2>&1 | head -2 || true
            else
              printf 'TOOL %s missing\n' "$tool"
            fi
          done
          perf stat -e instructions:u,cycles:u -- true 2>&1 || true

      - name: Bootstrap build driver
        id: driver
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$AUDIT/driver.log") 2>&1
          if command -v tcc >/dev/null 2>&1; then
            # Canonical path: build.sh publishes and reuses the TCC-built driver.
            printf 'BOOTSTRAP tcc\n'
            tcc -v
            driver=./build.sh
          else
            # Documented hosted exception (build.md): no TCC on the image.
            printf 'BOOTSTRAP clang-exception\n'
            clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
            driver="$RUNNER_TEMP/buster-build"
          fi
          printf 'DRIVER %s\n' "$driver"
          printf 'driver=%s\n' "$driver" >> "$GITHUB_OUTPUT"
          if command -v mold >/dev/null 2>&1; then linker=MOLD; else linker=DEFAULT; fi
          printf 'LINKER %s\n' "$linker"
          printf 'linker=%s\n' "$linker" >> "$GITHUB_OUTPUT"

      - name: Configure and build the trusted Release compiler
        id: build
        shell: bash
        env:
          DRIVER: ${{ steps.driver.outputs.driver }}
          LINKER: ${{ steps.driver.outputs.linker }}
        run: |
          set -euo pipefail
          exec > >(tee "$AUDIT/build.log") 2>&1
          set -x
          # Not --ci: keep debug info and frame pointers so perf symbolizes
          # and unwinds the -O3 binary (benchmarking.md, "profilable as built").
          "$DRIVER" generate --config Release --cc clang --linker "$LINKER"
          "$DRIVER" build --config Release -t ide
          sha256sum build/Release/ide
          ls -l build/Release/ide
          grep -E 'CMAKE_C_FLAGS|CMAKE_C_COMPILER|BUSTER_' build/CMakeCache.txt | sort > "$AUDIT/cmake-cache-flags.txt"
          cp build/compile_commands.json "$AUDIT/" || true

      - name: Self-host fixed point with instruction counts
        id: self_host
        continue-on-error: true
        shell: bash
        env:
          DRIVER: ${{ steps.driver.outputs.driver }}
        run: |
          set -o pipefail
          "$DRIVER" test_self_host --config Release 2>&1 | tee "$AUDIT/test_self_host.log"
          mkdir -p "$AUDIT/self-host"
          cp build/*.metrics "$AUDIT/self-host/" 2>/dev/null || true
          find build -maxdepth 1 \( -name 'ide-self*' -o -name '*.metrics' \) -exec ls -l {} + >> "$AUDIT/test_self_host.log" || true

      - name: Stage-1 counters, wall time and RSS
        id: counters
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee "$AUDIT/counters.log") 2>&1
          mkdir -p "$AUDIT/stage1"
          IDE=build/Release/ide
          COMMON=(-Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0)
          SRC=src/buster/apps/ide/ide.c
          # Warm the page cache and record the verbose SOURCE table once.
          "$IDE" cc "${COMMON[@]}" -g -v -fsource-metrics="$AUDIT/stage1/warm.metrics" "$SRC" -lm -o "$AUDIT/stage1/warm" \
              > "$AUDIT/stage1/source-table.txt" 2>&1
          sha256sum "$AUDIT/stage1/warm"
          echo '== wall/CPU/RSS, 5 runs each, pinned to CPU 2: default (-g) then -g0 =='
          for variant in default g0; do
            for i in 1 2 3 4 5; do
              python3 - "$variant" "$i" <<'PY'
          import os, resource, subprocess, sys, time
          variant, i = sys.argv[1], sys.argv[2]
          audit = os.environ["AUDIT"]
          debug = "-g0" if variant == "g0" else "-g"
          cmd = ["taskset", "-c", "2", "build/Release/ide", "cc", "-Isrc", "-Ibuild/generated",
                 "-DBUSTER_UNITY_BUILD=1", "-DBUSTER_INCLUDE_TESTS=0", debug,
                 f"-fsource-metrics={audit}/stage1/{variant}-{i}.metrics",
                 "src/buster/apps/ide/ide.c", "-lm", "-o", f"{audit}/stage1/{variant}-{i}"]
          t0 = time.perf_counter()
          rc = subprocess.run(cmd).returncode
          wall = time.perf_counter() - t0
          ru = resource.getrusage(resource.RUSAGE_CHILDREN)
          print(f"STAGE1_TIMING variant={variant} run={i} rc={rc} wall_s={wall:.3f} user_s={ru.ru_utime:.3f} sys_s={ru.ru_stime:.3f} maxrss_kib={ru.ru_maxrss}")
          PY
            done
          done
          sha256sum "$AUDIT/stage1"/default-? "$AUDIT/stage1"/g0-?
          echo '== perf stat group A (core), 3 repeats, pinned =='
          perf stat -r 3 -e '{cycles,instructions,branches,branch-misses}:u' -e task-clock -e page-faults -e context-switches -- \
            taskset -c 2 "$IDE" cc "${COMMON[@]}" -g "$SRC" -lm -o "$AUDIT/stage1/statA" 2>&1
          echo '== perf stat group B (memory), 3 repeats, pinned =='
          perf stat -r 3 -e '{instructions,L1-dcache-loads,L1-dcache-load-misses,L1-icache-load-misses,cache-misses}:u' -- \
            taskset -c 2 "$IDE" cc "${COMMON[@]}" -g "$SRC" -lm -o "$AUDIT/stage1/statB" 2>&1
          echo '== perf stat group A with -g0, 3 repeats, pinned =='
          perf stat -r 3 -e '{cycles,instructions,branches,branch-misses}:u' -e task-clock -- \
            taskset -c 2 "$IDE" cc "${COMMON[@]}" -g0 "$SRC" -lm -o "$AUDIT/stage1/statA-g0" 2>&1
          echo '== perf stat group A, object only (-g -c), 3 repeats, pinned =='
          perf stat -r 3 -e '{cycles,instructions,branches,branch-misses}:u' -e task-clock -- \
            taskset -c 2 "$IDE" cc "${COMMON[@]}" -g -c "$SRC" -o "$AUDIT/stage1/statA.o" 2>&1
          echo '== perf stat group A, preprocess only (-E), 3 repeats, pinned =='
          perf stat -r 3 -e '{cycles,instructions,branches,branch-misses}:u' -e task-clock -- \
            taskset -c 2 "$IDE" cc "${COMMON[@]}" -E "$SRC" -o "$AUDIT/stage1/statA.i" 2>&1
          ls -l "$AUDIT/stage1/statA" "$AUDIT/stage1/statA.o" "$AUDIT/stage1/statA.i"
          echo '== ide bench =='
          "$IDE" bench 2>&1
          rm -f "$AUDIT/stage1"/default-? "$AUDIT/stage1"/g0-? "$AUDIT/stage1"/statA* "$AUDIT/stage1"/statB* "$AUDIT/stage1/warm"

      - name: Stage-1 cycle profile (perf record, frame pointers)
        id: profile
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee "$AUDIT/profile.log") 2>&1
          mkdir -p "$AUDIT/profile"
          IDE=build/Release/ide
          DATA="$AUDIT/profile/stage1.data"
          perf record -F 4999 -e cycles:u --call-graph fp -o "$DATA" -- \
            taskset -c 2 "$IDE" cc -Isrc -Ibuild/generated -DBUSTER_UNITY_BUILD=1 -DBUSTER_INCLUDE_TESTS=0 -g src/buster/apps/ide/ide.c -lm -o "$AUDIT/profile/ide-stage1"
          rm -f "$AUDIT/profile/ide-stage1"
          perf report -i "$DATA" --stdio --no-children --sort sym -g none --percent-limit 0.15 > "$AUDIT/profile/flat-by-symbol.txt" 2>&1
          perf report -i "$DATA" --stdio --no-children --sort dso -g none > "$AUDIT/profile/flat-by-dso.txt" 2>&1
          perf report -i "$DATA" --stdio --children --sort sym -g none --percent-limit 0.8 > "$AUDIT/profile/inclusive-by-symbol.txt" 2>&1
          perf report -i "$DATA" --stdio --no-children --sort sym -g caller,0.5,callee,function,percent --percent-limit 1.0 > "$AUDIT/profile/callers-top.txt" 2>&1
          perf report -i "$DATA" --stdio --no-children --sort sym -g folded,0.2 --percent-limit 0.5 > "$AUDIT/profile/folded-top.txt" 2>&1
          head -70 "$AUDIT/profile/flat-by-symbol.txt"
          # Top symbols annotated at instruction granularity, bounded output.
          grep -E '^\s+[0-9]+\.[0-9]+%' "$AUDIT/profile/flat-by-symbol.txt" | head -10 | awk '{print $NF}' > "$AUDIT/profile/top-symbols.txt"
          while read -r sym; do
            timeout 300 perf annotate -i "$DATA" --stdio -l --percent-type local-period -s "$sym" 2>/dev/null | head -500 > "$AUDIT/profile/annotate-$sym.txt" || true
          done < "$AUDIT/profile/top-symbols.txt"
          # Leaf-IP line attribution: the sample IP is the instruction itself, so
          # srcline is exact here (the return-address shift only affects callers).
          timeout 900 perf report -i "$DATA" --stdio --no-children --sort sym,srcline -g none --percent-limit 0.1 > "$AUDIT/profile/flat-by-line.txt" 2>&1 || true
          # Keep the binary beside the capture so the profile can be queried offline.
          if command -v zstd >/dev/null 2>&1; then zstd -q -T0 -19 build/Release/ide -o "$AUDIT/profile/ide.zst"; else gzip -c build/Release/ide > "$AUDIT/profile/ide.gz"; fi
          ls -l "$AUDIT/profile"

      - name: Cache-miss survey (Zen fill and TLB events)
        id: cache_survey
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: |
          set -uo pipefail
          python3 tools/cache_miss_survey.py --self-test 2>&1 | tail -3
          python3 tools/cache_miss_survey.py --dwarf --repeat 3 --cpu 2 --limit 40 --lines 12 --out "$AUDIT/cache-miss-survey" 2>&1 | tee "$AUDIT/cache-miss-survey.log"
          rm -f "$AUDIT"/cache-miss-survey/*.data || true

      - name: Branch-miss survey (LBR mispredict flags)
        id: branch_survey
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: |
          set -uo pipefail
          python3 tools/branch_miss_survey.py --self-test 2>&1 | tail -3
          python3 tools/branch_miss_survey.py --repeat 3 --cross-check --top 40 2>&1 | tee "$AUDIT/branch-miss-survey.log"

      - name: Summary
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          SELF_HOST_RESULT: ${{ steps.self_host.outcome }}
          COUNTERS_RESULT: ${{ steps.counters.outcome }}
          PROFILE_RESULT: ${{ steps.profile.outcome }}
          CACHE_RESULT: ${{ steps.cache_survey.outcome }}
          BRANCH_RESULT: ${{ steps.branch_survey.outcome }}
        run: |
          {
            printf '## Zen 5 throughput audit\n\n'
            printf 'build: **%s**, self-host: **%s**, counters: **%s**, profile: **%s**, cache survey: **%s**, branch survey: **%s**\n\n' \
              "$BUILD_RESULT" "$SELF_HOST_RESULT" "$COUNTERS_RESULT" "$PROFILE_RESULT" "$CACHE_RESULT" "$BRANCH_RESULT"
            printf '```\n'
            grep -E 'STEP_INSTRUCTIONS|SELF_HOST|took' "$AUDIT/test_self_host.log" 2>/dev/null | head -40
            grep -E 'STAGE1_TIMING|BENCH_C_FRONTEND' "$AUDIT/counters.log" 2>/dev/null
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          du -sh "$AUDIT" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zen5-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zen5-audit
          retention-days: 30
          if-no-files-found: warn
