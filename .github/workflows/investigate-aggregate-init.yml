name: Aggregate initializer investigation
on:
  push:
    branches: [research/aggregate-init-20260925-dce1-astra]
    paths:
      - '.github/workflows/investigate-aggregate-init.yml'
      - 'tools/investigations/aggregate-init-20260925/cases.c'
      - 'tools/investigations/aggregate-init-20260925/probe.c'
      - 'tools/investigations/aggregate-init-20260925/minima.c'
      - 'tools/investigations/aggregate-init-20260925/confirm.c'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: dce1b8caa3d368dede16ad4aa9da6760e26fe704
      BUSTER_TEST_JOBS: '2'
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin unchanged source and tool identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence source-evidence
          git diff --exit-code "$SOURCE_SHA" HEAD -- src build.c build.sh CMakeLists.txt
          git rev-parse HEAD 'HEAD^{tree}' > evidence/transport.txt
          git rev-parse "$SOURCE_SHA" "$SOURCE_SHA^{tree}" > evidence/source.txt
          git archive "$SOURCE_SHA" | gzip -1 > source-evidence/source.tar.gz
          cp tools/investigations/aggregate-init-20260925/*.c evidence/
          { clang --version; gcc --version; cmake --version; ninja --version; uname -a; cat /etc/os-release; lscpu; } > evidence/versions.txt
          sha256sum source-evidence/source.tar.gz > source-evidence/SHA256SUMS
      - name: Retain source before compilation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aggregate-source-${{ github.run_id }}
          path: source-evidence
          retention-days: 30
          if-no-files-found: error
      - name: Build unchanged compiler on this runner
        id: build
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee evidence/build.log) 2>&1
          set -x
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --cc clang --ci --linker DEFAULT
          "$RUNNER_TEMP/buster-build" build --config Release -t ide -- -j2
          sha256sum build/Release/ide > evidence/compiler.sha256
          find build -name CMakeCache.txt -exec cp --parents '{}' evidence/ \;
          clang -std=c17 -Wall -Wextra -Werror tools/investigations/aggregate-init-20260925/confirm.c -o "$RUNNER_TEMP/aggregate-observer"
      - name: Execute reduced reference and Buster matrix
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/aggregate-observer" "$PWD/build/Release/ide" "$PWD/tools/investigations/aggregate-init-20260925/minima.c" | tee evidence/observer.log
      - name: Observe frontend results through emitted bitcode
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee evidence/bitcode.log) 2>&1
          set -x
          printf 'case\tfrontend\temit\tdecode\n' > evidence/bitcode.tsv
          for case in 0 4 6; do
            for frontend in -ffrontend-ssa -fno-frontend-ssa; do
              stem="evidence/ir-c${case}${frontend}"
              build/Release/ide cc -target x86_64-linux -std=c17 -O0 -g0 "$frontend" -emit-llvm "-DCASE=$case" -DSTORAGE=0 tools/investigations/aggregate-init-20260925/minima.c -o "$stem.bc" > "$stem.emit.stdout" 2> "$stem.emit.stderr"
              emit=$?
              decode=-1
              if test "$emit" -eq 0; then
                clang -S -emit-llvm -O0 "$stem.bc" -o "$stem.ll" > "$stem.decode.stdout" 2> "$stem.decode.stderr"
                decode=$?
              fi
              printf '%s\t%s\t%s\t%s\n' "$case" "$frontend" "$emit" "$decode" >> evidence/bitcode.tsv
            done
          done
      - name: Hash retained evidence
        if: always()
        shell: bash
        run: |
          if test -d evidence; then
            find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS
          fi
      - name: Retain all outcomes including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aggregate-results-${{ github.run_id }}
          path: evidence
          retention-days: 30
          if-no-files-found: error
