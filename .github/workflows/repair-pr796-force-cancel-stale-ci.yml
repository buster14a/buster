name: Force-clear stale PR 796 Buster CI

on:
  push:
    branches:
      - fix/786-native-retirement-closure

concurrency:
  group: repair-pr796-force-cancel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Force-cancel active Buster CI runs for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GH_TOKEN"]
          workflow_id = 197051687
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(url: str, method: str = "GET") -> tuple[int, bytes]:
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.read()

          forced: set[int] = set()
          for _ in range(5):
              query = urllib.parse.urlencode({"branch": branch, "per_page": 100})
              list_url = (
                  f"https://api.github.com/repos/{repository}/actions/workflows/"
                  f"{workflow_id}/runs?{query}"
              )
              status, payload = request(list_url)
              if status != 200:
                  raise SystemExit(f"failed to list Buster CI runs: HTTP {status}: {payload!r}")
              active = [
                  int(run["id"])
                  for run in json.loads(payload).get("workflow_runs", [])
                  if run.get("status") in {
                      "queued", "pending", "in_progress", "waiting", "requested"
                  }
              ]
              for run_id in active:
                  if run_id in forced:
                      continue
                  url = (
                      f"https://api.github.com/repos/{repository}/actions/runs/"
                      f"{run_id}/force-cancel"
                  )
                  cancel_status, cancel_payload = request(url, "POST")
                  if cancel_status not in {202, 409}:
                      raise SystemExit(
                          f"failed to force-cancel run {run_id}: "
                          f"HTTP {cancel_status}: {cancel_payload!r}"
                      )
                  print(f"force-cancelled Buster CI run {run_id} (HTTP {cancel_status})")
                  forced.add(run_id)
              time.sleep(3)

          if not forced:
              raise SystemExit("no active Buster CI run was found to force-cancel")
          PYTHON
