name: Force-clear stale PR 796 Buster CI

on:
  push:
    branches:
      - fix/786-native-retirement-closure

concurrency:
  group: repair-pr796-force-cancel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Force-cancel the original stale Buster CI run
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_RUN_ID: "35302286642"
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          import time
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = int(os.environ["STALE_RUN_ID"])
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(path: str, method: str = "GET") -> tuple[int, bytes]:
              url = f"https://api.github.com/repos/{repository}{path}"
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.read()

          status, payload = request(f"/actions/runs/{run_id}/force-cancel", "POST")
          if status not in {202, 409}:
              raise SystemExit(
                  f"failed to force-cancel run {run_id}: HTTP {status}: {payload!r}"
              )
          print(f"force-cancel request for run {run_id}: HTTP {status}")

          terminal = {"completed"}
          for _ in range(20):
              time.sleep(3)
              probe_status, probe_payload = request(f"/actions/runs/{run_id}")
              if probe_status != 200:
                  raise SystemExit(
                      f"failed to probe run {run_id}: HTTP {probe_status}: {probe_payload!r}"
                  )
              import json
              run = json.loads(probe_payload)
              print(
                  f"run {run_id}: status={run.get('status')} "
                  f"conclusion={run.get('conclusion')}"
              )
              if run.get("status") in terminal:
                  break
          else:
              raise SystemExit(f"run {run_id} remained active after force-cancel")
          PYTHON
