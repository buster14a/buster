name: PR 688 repair workbench

on:
  push:
    branches: [codex/repair-688-hosted-20260916]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Construct isolated repair candidate
        id: candidate
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin cf0107cc74b6e04304cb8a3dc2a065b2c3a8030c e68e4f62eb67ec8e432fe46277bfe6f9e0e472cf 2142bf4b520cd82ca2dd3aeba5941cfd16ac48fd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tools/repair_pr688.py
      - name: Preserve candidate source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr688-candidate-source-${{ github.run_id }}
          path: ${{ runner.temp }}/pr688-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Compile candidate and run registered Release regressions
        working-directory: ${{ steps.candidate.outputs.source }}
        run: |
          set -euo pipefail
          clang --version
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/buster-build"
          "$RUNNER_TEMP/buster-build" generate --cc clang --ci --linker DEFAULT 2>&1 | tee "$RUNNER_TEMP/pr688-evidence/generate.log"
          "$RUNNER_TEMP/buster-build" build --config Release -t test_all 2>&1 | tee "$RUNNER_TEMP/pr688-evidence/test_all.log"
      - name: Preserve ordinary self-host fixed point
        working-directory: ${{ steps.candidate.outputs.source }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/buster-build" test_self_host --config Release 2>&1 | tee "$RUNNER_TEMP/pr688-evidence/self_host.log"
          "$RUNNER_TEMP/buster-build" test_self_host_audit --config Release 2>&1 | tee "$RUNNER_TEMP/pr688-evidence/self_host_audit.log"
      - name: Preserve validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr688-repair-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/pr688-evidence/
          if-no-files-found: error
          retention-days: 7
