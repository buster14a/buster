name: Issue 685 source and validation
on:
  push:
    branches: [codex/685-android-summary-validation]
concurrency:
  group: issue-685-validation-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply and verify the exact locally tested candidate tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-685"
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = Path('.github/issue-685.patch.gz.b64').read_text().strip()
          # Correct the known duplicated transport quartet. The decoded patch
          # must still match the complete locally tested SHA-256 exactly.
          encoded = encoded.replace('FaezFaezmR3', 'FaezmR3')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = '742b68142c90ba91c60bad5c8dff7dc7430ec95ae5dcaa1dd7af2ccf948c411d'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Transport patch hash mismatch')
          Path(os.environ['RUNNER_TEMP'], 'issue-685', 'change.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/issue-685/change.patch"
          git apply "$RUNNER_TEMP/issue-685/change.patch"
          # Neither temporary transport file belongs in the final PR. Test the
          # exact candidate source tree, including the unchanged policy suite.
          rm -- .github/issue-685.patch.gz.b64 .github/workflows/issue-685-validation.yml
          git add -A
          candidate_tree=$(git write-tree)
          test "$candidate_tree" = aa746d19a320967751fa55c1ee8720bd3ab57264
          printf '%s\n' "$candidate_tree" > "$RUNNER_TEMP/issue-685/candidate-tree.txt"
          git diff --cached --check
      - name: Validate summary and existing CI tools
        shell: bash
        run: |
          set -euo pipefail
          python3 android/ci_summary_test.py -v 2>&1 | tee "$RUNNER_TEMP/issue-685/android-summary.log"
          python3 tests/ci_tools_test.py -q 2>&1 | tee "$RUNNER_TEMP/issue-685/ci-tools.log"
          python3 -m py_compile tools/ci_summary.py android/ci_summary_test.py
          python3 tools/native_retirement_contract.py self-test 2>&1 | tee "$RUNNER_TEMP/issue-685/contract.log"
      - name: Publish only verified Git blobs without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          expected = {
              '.github/workflows/ios-monitor-tests.yml': ('b8f5313604811c736a298188dd8b5dd8e5ccdffce4009444b3bac47f5d3632d7', '5490631f070d3b46cbc335e4e4b339aee79cd088'),
              'android/ci_summary_test.py': ('d650a22347214d6acd2e30c5c8cdc6c8516a7e5955705cc3b0cc40e02fbe8a0f', 'e8a0e4e4e6f778ac5a43ad912a072fbc94e5eeba'),
              'docs/ci-github-actions.md': ('807b2cf853d53a600ac8641db56ad4c58b194ce44237e4600f587df3401f983f', '31d10585b273e50e8993e5db7a05277ffa0737c7'),
              'tools/ci_summary.py': ('050ded41dabb966bf9f0f4766d4a0797ad5572b896f8a1643885ead760f18248', '5a87f6fc2dc95b1f1e7eace74b5af49a643d0e30'),
          }
          records = []
          for name, (digest, blob) in expected.items():
              data = Path(name).read_bytes()
              if hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Source hash mismatch: ' + name)
              request = urllib.request.Request(
                  'https://api.github.com/repos/buster14a/buster/git/blobs',
                  data=json.dumps({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  observed = json.load(response)['sha']
              if observed != blob:
                  raise SystemExit('Git blob identity mismatch: ' + name)
              records.append({'path': name, 'sha256': digest, 'git_blob': observed})
              print(name, observed, digest)
          Path(os.environ['RUNNER_TEMP'], 'issue-685', 'verified-blobs.json').write_text(json.dumps(records, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-685-validation
          path: ${{ runner.temp }}/issue-685/
          if-no-files-found: error
          retention-days: 1
