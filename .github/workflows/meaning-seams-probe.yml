name: Meaning seams investigation
on:
  push:
    branches: [research/meaning-seams-20260925-d9e7-astra]
    paths: [.github/workflows/meaning-seams-probe.yml, tools/investigations/meaning-seams-20260925/export.py]
permissions:
  contents: read
jobs:
  canonical-ir:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      BUSTER_TEST_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build unchanged pinned production on this hosted CPU
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          pin=ade6ac4b6ecb21f30b61b656439bac476c145e2f
          test "$(git rev-parse "$pin^{tree}")" = 4c5306221fdb22fccc929b55e333163742de17d0
          git rev-parse HEAD HEAD^{tree} > evidence/transport.txt
          git rev-parse "$pin" "$pin^{tree}" > evidence/production.txt
          git diff --exit-code d9e736e2cf08804a2c603d153e9fb608f18c5c49 HEAD -- src build.c CMakeLists.txt cmake
          git worktree add --detach "$RUNNER_TEMP/meaning-source" "$pin"
          { uname -a; clang --version; gcc --version; cmake --version; ninja --version; lscpu; } > evidence/environment.txt
          cd "$RUNNER_TEMP/meaning-source"
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o "$RUNNER_TEMP/meaning-build" > "$GITHUB_WORKSPACE/evidence/bootstrap.stdout" 2> "$GITHUB_WORKSPACE/evidence/bootstrap.stderr"
          "$RUNNER_TEMP/meaning-build" generate --cc clang --ci --linker DEFAULT > "$GITHUB_WORKSPACE/evidence/generate.stdout" 2> "$GITHUB_WORKSPACE/evidence/generate.stderr"
          "$RUNNER_TEMP/meaning-build" build --config Release -t ide > "$GITHUB_WORKSPACE/evidence/build.stdout" 2> "$GITHUB_WORKSPACE/evidence/build.stderr"
          sha256sum build/Release/ide > "$GITHUB_WORKSPACE/evidence/compiler.sha256"
          cp build/Release/ide "$GITHUB_WORKSPACE/evidence/ide"
          cp build/CMakeCache.txt "$GITHUB_WORKSPACE/evidence/CMakeCache.txt"
      - name: Decode and independently execute canonical-IR exports
        shell: bash
        run: |
          set -euo pipefail
          cp tools/investigations/meaning-seams-20260925/export.py evidence/
          cp -r tools/investigations/meaning-seams-20260925/witnesses evidence/
          python3 -B tools/investigations/meaning-seams-20260925/export.py "$RUNNER_TEMP/meaning-source/build/Release/ide" tools/investigations/meaning-seams-20260925/witnesses evidence/ir 2>&1 | tee evidence/observer.log
      - name: Retain all raw attempts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: meaning-seams-ir-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          retention-days: 30
          if-no-files-found: error
