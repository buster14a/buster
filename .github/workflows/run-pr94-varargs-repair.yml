name: Run PR 94 Windows ARM64 varargs repair

on:
  push:
    branches:
      - claude/unruffled-bhabha-f5d28a
    paths:
      - .github/workflows/run-pr94-varargs-repair.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: claude/unruffled-bhabha-f5d28a
          fetch-depth: 0

      - name: Execute corrected production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-pr94-windows-arm64-varargs.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate the repaired build driver"
          start = workflow.find(start_marker)
          end = workflow.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit('could not extract production patch from staged workflow')

          script = textwrap.dedent(workflow[start + len(start_marker):end])
          old = '''text = replace_in_text(
              text,
              forward_call,
              "String8 result = string_format_va(arena, format, variable_arguments, gp_register_slots_remaining);",
              3,
              "string.c forwarding calls",
          )
          text = replace_in_text(
              text,
              "void string_write_to_file_va(OsFileDescriptor* file_handle, String8 format, va_list variable_arguments)",'''
          new = '''text = replace_in_text(
              text,
              forward_call,
              "String8 result = string_format_va(arena, format, variable_arguments, gp_register_slots_remaining);",
              2,
              "string.c forwarding calls",
          )
          text = replace_in_text(
              text,
              "String8 string = string_format_va(scratch.arena, format, variable_arguments);",
              "String8 string = string_format_va(scratch.arena, format, variable_arguments, gp_register_slots_remaining);",
              label="string.c write-va forwarding call",
          )
          text = replace_in_text(
              text,
              "void string_write_to_file_va(OsFileDescriptor* file_handle, String8 format, va_list variable_arguments)",'''
          if script.count(old) != 1:
              raise SystemExit('formatter forwarding patch anchor not found')
          script = script.replace(old, new, 1)
          exec(compile(script, '<pr94-varargs-repair>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate repaired build driver
        shell: bash
        run: |
          mkdir -p /tmp/buster-pr94
          clang -Isrc -Wall -Werror -Wno-unused-function -Wno-unused-variable -g build.c -o /tmp/buster-pr94/build
          /tmp/buster-pr94/build time_trace_summary_self_test
          /tmp/buster-pr94/build test_timing_summary_self_test

      - name: Commit repair and remove staging workflows
        shell: bash
        run: |
          git config user.name David
          git config user.email davidgmbb@gmail.com
          git rm .github/workflows/apply-pr94-windows-arm64-varargs.yml .github/workflows/run-pr94-varargs-repair.yml
          git add build.c src/buster/lib/arena.c src/buster/lib/string.h src/buster/lib/string.c src/buster/lib/os.c src/buster/lib/ui_core.c src/buster/tests/test.c src/buster/tests/string_test.c
          git commit -m "fix: decode Windows ARM64 formatter varargs by ABI slots"
          git push origin HEAD:claude/unruffled-bhabha-f5d28a
