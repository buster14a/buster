name: Apply issue 1732 repair

on:
  push:
    branches:
      - fix/1732-sysv-named-f80-varargs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply production and regression changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def matching_c(text, opening, open_character, close_character):
              depth = 0
              state = "normal"
              index = opening
              while index < len(text):
                  character = text[index]
                  next_character = text[index + 1] if index + 1 < len(text) else ""
                  if state == "line-comment":
                      if character == "\n":
                          state = "normal"
                  elif state == "block-comment":
                      if character == "*" and next_character == "/":
                          state = "normal"
                          index += 1
                  elif state == "string":
                      if character == "\\":
                          index += 1
                      elif character == '"':
                          state = "normal"
                  elif state == "character":
                      if character == "\\":
                          index += 1
                      elif character == "'":
                          state = "normal"
                  else:
                      if character == "/" and next_character == "/":
                          state = "line-comment"
                          index += 1
                      elif character == "/" and next_character == "*":
                          state = "block-comment"
                          index += 1
                      elif character == '"':
                          state = "string"
                      elif character == "'":
                          state = "character"
                      elif character == open_character:
                          depth += 1
                      elif character == close_character:
                          depth -= 1
                          if depth == 0:
                              return index
                  index += 1
              raise RuntimeError(f"unmatched {open_character} at {opening}")

          def function_bounds(text, name):
              name_index = text.index(name + "(")
              start = text.rfind("\n", 0, name_index) + 1
              opening = text.index("{", name_index)
              closing = matching_c(text, opening, "{", "}")
              return start, closing + 1

          # Share the exact x87-target predicate with the parser, as the
          # binary128 transport predicate already is.
          gen_path = "src/buster/lib/compiler/frontend/c/c_gen.c"
          internal_path = "src/buster/lib/compiler/frontend/c/c_internal.h"
          gen = read(gen_path)
          internal = read(internal_path)
          helper_start, helper_end = function_bounds(gen, "c_ir_target_supports_f80")
          helper = gen[helper_start:helper_end]
          old_qualifier = "BUSTER_C_INTERNAL bool c_ir_target_supports_f80"
          new_qualifier = "BUSTER_C_INLINE BUSTER_UNUSED_DECL BUSTER_INLINE bool c_ir_target_supports_f80"
          if helper.count(old_qualifier) != 1:
              raise RuntimeError("unexpected c_ir_target_supports_f80 declaration")
          helper = helper.replace(old_qualifier, new_qualifier, 1)
          gen = gen[:helper_start] + gen[helper_end:]
          if "c_ir_target_supports_f80(" in internal:
              raise RuntimeError("c_internal.h already contains c_ir_target_supports_f80")
          f128_index = internal.index("c_ir_target_supports_f128_transport(")
          insertion = internal.rfind("\n", 0, f128_index) + 1
          internal = internal[:insertion] + helper.strip() + "\n\n" + internal[insertion:]

          # Admit only a direct scalar x87 named parameter. Aggregates that
          # merely contain f80 continue through the existing rejection.
          body_start, body_end = function_bounds(gen, "c_ir_signature_body_supported")
          body = gen[body_start:body_end]
          binary_index = body.index("bool binary128 =")
          binary_end = body.index(";", binary_index) + 1
          x87_declaration = (
              "\n        bool x87 = parameter && parameter->kind == IR_TYPE_FLOAT && parameter->bit_width == 80 && !parameter->is_atomic &&\n"
              "                   c_ir_target_supports_f80(target);"
          )
          body = body[:binary_end] + x87_declaration + body[binary_end:]
          old_gate = "if (is_variadic && !binary128 && c_ir_type_contains_wide_float"
          new_gate = "if (is_variadic && !binary128 && !x87 && c_ir_type_contains_wide_float"
          if body.count(old_gate) != 1:
              raise RuntimeError("unexpected C IR variadic wide-float gate")
          body = body.replace(old_gate, new_gate, 1)
          gen = gen[:body_start] + body + gen[body_end:]
          write(gen_path, gen)
          write(internal_path, internal)

          parse_path = "src/buster/lib/compiler/frontend/c/c_parse.c"
          parse = read(parse_path)
          validate_start, validate_end = function_bounds(parse, "c_parse_validate_signature")
          validate = parse[validate_start:validate_end]
          binary_index = validate.index("bool binary128 =")
          binary_end = validate.index(";", binary_index) + 1
          x87_declaration = (
              "\n        bool x87 = value.kind == C_TYPE_LONG_DOUBLE && !value.is_atomic &&\n"
              "                   c_ir_target_supports_f80(preprocess.target);"
          )
          validate = validate[:binary_end] + x87_declaration + validate[binary_end:]
          old_gate = "function.is_variadic && !binary128 && c_parse_type_contains_wide_float"
          new_gate = "function.is_variadic && !binary128 && !x87 && c_parse_type_contains_wide_float"
          if validate.count(old_gate) != 1:
              raise RuntimeError("unexpected parser variadic wide-float gate")
          validate = validate.replace(old_gate, new_gate, 1)
          parse = parse[:validate_start] + validate + parse[validate_end:]
          write(parse_path, parse)

          # The canonical x86 emitter must start the overflow cursor after each
          # named x87 memory slot. A scalar f80 consumes two stack eightbytes
          # after rounding the current stack part to a 16-byte boundary.
          codegen_path = "src/buster/lib/compiler/codegen/codegen.c"
          codegen = read(codegen_path)
          va_index = codegen.index("instruction->opcode == IR_OPCODE_VA_START")
          f80_index = codegen.index("codegen_canonical_x64_type_contains_f80_cached", va_index)
          if f80_index - va_index > 12000:
              raise RuntimeError("canonical x86 va_start f80 check is unexpectedly distant")
          if_start = codegen.rfind("if (", va_index, f80_index)
          if if_start < 0:
              raise RuntimeError("canonical x86 va_start f80 if not found")
          condition_open = codegen.index("(", if_start)
          condition_close = matching_c(codegen, condition_open, "(", ")")
          block_open = codegen.index("{", condition_close)
          block_close = matching_c(codegen, block_open, "{", "}")
          old_block = codegen[if_start:block_close + 1]
          if "CODEGEN_ERROR_UNSUPPORTED_INSTRUCTION" not in old_block or "return result;" not in old_block:
              raise RuntimeError("canonical x86 va_start f80 block no longer has the expected refusal")
          line_start = codegen.rfind("\n", 0, if_start) + 1
          indent = codegen[line_start:if_start]
          header = codegen[if_start:block_open + 1]
          inner = indent + "    "
          replacement = (
              header + "\n"
              + inner + "bool named_x87 = parameter_type && parameter_type->kind == IR_TYPE_FLOAT && parameter_type->bit_width == 80 &&\n"
              + inner + "                 !parameter_type->is_atomic;\n"
              + inner + "if (!named_x87)\n"
              + inner + "{\n"
              + inner + "    result.error = CODEGEN_ERROR_UNSUPPORTED_INSTRUCTION;\n"
              + inner + "    return result;\n"
              + inner + "}\n"
              + inner + "stack_parts = (stack_parts + 1u) & ~1u;\n"
              + inner + "stack_parts += 2u;\n"
              + inner + "continue;\n"
              + indent + "}"
          )
          codegen = codegen[:if_start] + replacement + codegen[block_close + 1:]
          write(codegen_path, codegen)

          # Add one- and two-x87-parameter probes. The second probe starts with
          # seven named GP values so the first x87 slot must insert alignment
          # padding; mixed variadic GP/SSE/x87 reads pin all three cursors.
          fixture_path = "tests/basic_c_sysv_va_list.c"
          fixture = read(fixture_path)
          typedef_anchor = "typedef int SysvVaExternal(va_list*, int, ...);\n"
          typedefs = """#if __LDBL_MANT_DIG__ == 64
typedef int SysvVaNamedF80One(int, long double, ...);
typedef int SysvVaNamedF80Two(long long, long long, long long, long long, long long, long long, long long,
                              long double, long double, ...);
#endif
"""
          if fixture.count(typedef_anchor) != 1:
              raise RuntimeError("SysV va_list typedef anchor changed")
          fixture = fixture.replace(typedef_anchor, typedef_anchor + typedefs, 1)

          suite_anchor = "int sysv_va_suite(SysvVaReader* reader, SysvVaCopier* copier, SysvVaExternal* external)\n"
          functions = """#if __LDBL_MANT_DIG__ == 64
int sysv_va_named_f80_one(int marker, long double first, ...)
{
    va_list ap;
    va_start(ap, first);
    int bad = marker != 17 || first != 9223372036854775809.0L;
    bad |= va_arg(ap, long long) != 11ll;
    bad |= va_arg(ap, double) != 2.5;
    bad |= va_arg(ap, long double) != 0.5L;
    bad |= va_arg(ap, long long) != 22ll;
    va_end(ap);
    return bad;
}

int sysv_va_named_f80_two(long long a, long long b, long long c, long long d, long long e, long long f, long long g,
                          long double first, long double second, ...)
{
    va_list ap;
    va_start(ap, second);
    int bad = a != 1ll || b != 2ll || c != 3ll || d != 4ll || e != 5ll || f != 6ll || g != 7ll;
    bad |= first != 9223372036854775809.0L || second != -1.5L;
    bad |= va_arg(ap, long long) != 33ll;
    bad |= va_arg(ap, double) != 4.5;
    bad |= va_arg(ap, long double) != 0.5L;
    bad |= va_arg(ap, long long) != 44ll;
    va_end(ap);
    return bad;
}
#endif

#if __LDBL_MANT_DIG__ == 64
int sysv_va_suite(SysvVaReader* reader, SysvVaCopier* copier, SysvVaExternal* external,
                  SysvVaNamedF80One* named_f80_one, SysvVaNamedF80Two* named_f80_two)
#else
int sysv_va_suite(SysvVaReader* reader, SysvVaCopier* copier, SysvVaExternal* external)
#endif
"""
          if fixture.count(suite_anchor) != 1:
              raise RuntimeError("SysV va_list suite signature changed")
          fixture = fixture.replace(suite_anchor, functions, 1)
          suite_bad_anchor = "    int bad = sysv_va_layout();\n"
          suite_calls = """#if __LDBL_MANT_DIG__ == 64
    bad |= named_f80_one(17, 9223372036854775809.0L, 11ll, 2.5, 0.5L, 22ll);
    bad |= named_f80_two(1ll, 2ll, 3ll, 4ll, 5ll, 6ll, 7ll, 9223372036854775809.0L, -1.5L,
                         33ll, 4.5, 0.5L, 44ll);
#endif
"""
          if fixture.count(suite_bad_anchor) != 1:
              raise RuntimeError("SysV va_list suite body anchor changed")
          fixture = fixture.replace(suite_bad_anchor, suite_bad_anchor + suite_calls, 1)
          main_call = "    bad = sysv_va_suite(sysv_va_read, sysv_va_copy_to, sysv_va_external);\n"
          main_replacement = """#if __LDBL_MANT_DIG__ == 64
    bad = sysv_va_suite(sysv_va_read, sysv_va_copy_to, sysv_va_external,
                        sysv_va_named_f80_one, sysv_va_named_f80_two);
#else
    bad = sysv_va_suite(sysv_va_read, sysv_va_copy_to, sysv_va_external);
#endif
"""
          if fixture.count(main_call) != 1:
              raise RuntimeError("SysV va_list standalone call changed")
          fixture = fixture.replace(main_call, main_replacement, 1)
          write(fixture_path, fixture)

          host_path = "tests/differential/sysv_va_list_host.c"
          host = read(host_path)
          macro_anchor = "#define sysv_va_external host_va_external\n"
          macro_addition = "#define sysv_va_named_f80_one host_va_named_f80_one\n#define sysv_va_named_f80_two host_va_named_f80_two\n"
          if host.count(macro_anchor) != 1:
              raise RuntimeError("SysV host rename anchor changed")
          host = host.replace(macro_anchor, macro_anchor + macro_addition, 1)
          undef_anchor = "#undef sysv_va_external\n"
          undef_addition = "#undef sysv_va_named_f80_one\n#undef sysv_va_named_f80_two\n"
          if host.count(undef_anchor) != 1:
              raise RuntimeError("SysV host undef anchor changed")
          host = host.replace(undef_anchor, undef_anchor + undef_addition, 1)
          declaration = "int sysv_va_suite(SysvVaReader*, SysvVaCopier*, SysvVaExternal*);\n"
          declarations = """#if __LDBL_MANT_DIG__ == 64
int sysv_va_named_f80_one(int, long double, ...);
int sysv_va_named_f80_two(long long, long long, long long, long long, long long, long long, long long,
                          long double, long double, ...);
int sysv_va_suite(SysvVaReader*, SysvVaCopier*, SysvVaExternal*, SysvVaNamedF80One*, SysvVaNamedF80Two*);
#else
int sysv_va_suite(SysvVaReader*, SysvVaCopier*, SysvVaExternal*);
#endif
"""
          if host.count(declaration) != 1:
              raise RuntimeError("SysV host suite declaration changed")
          host = host.replace(declaration, declarations, 1)
          main_calls = """    int bad = host_va_suite(sysv_va_read, sysv_va_copy_to, sysv_va_external);
    bad |= sysv_va_suite(host_va_read, host_va_copy_to, host_va_external);
"""
          main_calls_replacement = """#if __LDBL_MANT_DIG__ == 64
    int bad = host_va_suite(sysv_va_read, sysv_va_copy_to, sysv_va_external,
                            sysv_va_named_f80_one, sysv_va_named_f80_two);
    bad |= sysv_va_suite(host_va_read, host_va_copy_to, host_va_external,
                         host_va_named_f80_one, host_va_named_f80_two);
#else
    int bad = host_va_suite(sysv_va_read, sysv_va_copy_to, sysv_va_external);
    bad |= sysv_va_suite(host_va_read, host_va_copy_to, host_va_external);
#endif
"""
          if host.count(main_calls) != 1:
              raise RuntimeError("SysV host main calls changed")
          host = host.replace(main_calls, main_calls_replacement, 1)
          write(host_path, host)

          driver_path = "src/buster/tests/compiler/driver/driver_test.c"
          driver = read(driver_path)
          test_start, test_end = function_bounds(driver, "compiler_driver_test_sysv_va_list")
          test = driver[test_start:test_end]
          test, replacements = re.subn(r"(\.function_count\s*!=\s*)9\b", r"\g<1>11", test)
          if replacements != 1:
              raise RuntimeError(f"expected one SysV va_list function-count check, found {replacements}")
          driver = driver[:test_start] + test + driver[test_end:]
          write(driver_path, driver)
          PY

          rm .github/workflows/apply-1732.yml
          git diff --check
          git status --short
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "c: support named x87 parameters in variadic functions"
          git push origin HEAD:fix/1732-sysv-named-f80-varargs
